    const TW=10.0, TD=10.0, WALL=0.5, A_H=15.1, A_OUT=1.0, N_MARKS=13;
    const B_H=15.2, B_HOLE=0.7, MEN=0.22;
    const BX0=3.0, BX1=48.0, BZ0=0.0, BZ1=28.0, BH=16.0, BW=0.6, BFL=0.6;
    const BASE_W=30.0, BASE_D=22.0, BASE_T=1.2;
    const ST_W=25.0, ST_D=12.0, ST_STEP_X=13.0, ST_TALL=27.0, ST_STEP=9.0;
    const PED=0.8;
    /* base in the bin, stand on the base, tank A high and tank B low */
    const bx0=7.0, bz0=1.5, plateY=BFL+PED+BASE_T;
    const sx0=12.0, sz0=8.0, standY=plateY;
    const ax0=sx0+1.0, az0=sz0+0.5, aY=standY+ST_TALL;
    const bx0b=sx0+13.5, bz0b=sz0+0.5, bY=standY+ST_STEP;
    const D=0.5, A_HOLE=Math.PI*(D/2)*(D/2), CD=0.8, H0=12.0;
    const H_STOP=72.0/(G*(D/2)), KK=CD*A_HOLE*Math.sqrt(2*G)/(2*TW*TD);
    const rt=Math.sqrt(H0)-KK*t;
    const head=Math.max(rt>0?rt*rt:0,H_STOP);
    const flowing=head>H_STOP+0.004;
    const drained=(H0-head)*TW*TD;                 /* cm^3 that have left tank A */
    const pool=BFL+drained/((BX1-BX0-2*BW)*(BZ1-BZ0-2*BW));
    /* fit the whole rig, the way the app frames its bench */
    const aTop=aY+WALL+A_H;
    const UMIN=KC*(BX0+BZ0), UMAX=KC*(BX1+BZ1);
    const VMIN=KS*(BZ0-BX1), VMAX=aTop+KS*(az0+TD+WALL-ax0);
    const S=Math.min((W-16)/(UMAX-UMIN),(H-12)/(VMAX-VMIN));
    const OX=(W-(UMAX-UMIN)*S)/2-UMIN*S, OY=(H-(VMAX-VMIN)*S)/2+VMAX*S;
    const P=(x,y,z)=>[OX+KC*(x+z)*S, OY-(y+KS*(z-x))*S];
    const poly=(pts,fill,stroke,lw)=>{
      c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
      c.closePath();
      if(fill){c.fillStyle=fill;c.fill();}
      if(stroke){PEN(c,stroke,lw||1);c.stroke();}};
    const line=(pts,col,lw)=>{ PEN(c,col,lw||1);
      c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]); c.stroke();};
    const box=(x0,x1,y0,y1,z0,z1,top,side,front,edge)=>{
      poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],side,edge,1);
      poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],top,edge,1);
      poly([P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)],front,edge,1);};
    const water=(x0,x1,z0,z1,yf,ys,dark)=>{ if(ys<=yf+1e-6) return;
      const top=dark?"#2b6f95":"#7fd0ee", sd=dark?"#1f5878":"#3f9fd0",
            fr=dark?"#24638a":"#4aa7d4", rim=dark?"#7fc0dd":"#bfe8fa";
      poly([P(x1,yf,z0),P(x1,yf,z1),P(x1,ys,z1),P(x1,ys,z0)],sd,null);
      poly([P(x0,yf,z0),P(x1,yf,z0),P(x1,ys,z0),P(x0,ys,z0)],fr,null);
      poly([P(x0,ys,z0),P(x1,ys,z0),P(x1,ys,z1),P(x0,ys,z1)],top,dark?"#4d90b2":"#8fd3ee",1);
      poly([P(x0,ys,z0),P(x1,ys,z0),P(x1,ys+MEN,z0),P(x0,ys+MEN,z0)],rim,null);
      poly([P(x1,ys,z0),P(x1,ys,z1),P(x1,ys+MEN,z1),P(x1,ys+MEN,z0)],rim,null);};
    const glassBack=(x0,x1,y0,y1,z0,z1)=>{
      const i0=x0+WALL, i1=x1-WALL, j0=z0+WALL, j1=z1-WALL, fl=y0+WALL;
      poly([P(i0,fl,j1),P(i1,fl,j1),P(i1,y1,j1),P(i0,y1,j1)],"#dbe9ef","#9dbecb",1);
      poly([P(i0,fl,j0),P(i0,fl,j1),P(i0,y1,j1),P(i0,y1,j0)],"#d3e3ea","#9dbecb",1);
      poly([P(i0,fl,j0),P(i1,fl,j0),P(i1,fl,j1),P(i0,fl,j1)],"#eff8fb","#b6d0d9",1);};
    const glassFront=(x0,x1,y0,y1,z0,z1)=>{
      poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],null,"#dff1f7",2);
      poly([P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)],null,"#f2fbff",2);
      line([P(x1-3.4,y0+1.0,z0),P(x1-1.4,y1-1.0,z0)],"#eaf6fa",1);
      poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],null,"#eaf6fa",2);
      poly([P(x0+WALL,y1,z0+WALL),P(x1-WALL,y1,z0+WALL),
            P(x1-WALL,y1,z1-WALL),P(x0+WALL,y1,z1-WALL)],null,"#d3e6ec",1);};
    /* the room behind, and the desk the bin stands on */
    c.fillStyle="#2a3038"; c.fillRect(0,0,W,H);
    const NP=(x,y,z)=>P(x,y,z);
    poly([NP(-40,0,-30),NP(120,0,-30),NP(120,0,60),NP(-40,0,60)],"#b8926a",null);
    for(let i=-40;i<120;i+=9) line([NP(i,0,-30),NP(i,0,60)],"#9d7a56",1);
    /* the bin, from behind */
    const i0=BX0+BW, i1=BX1-BW, j0=BZ0+BW, j1=BZ1-BW;
    poly([P(i0,BFL,j0),P(i1,BFL,j0),P(i1,BFL,j1),P(i0,BFL,j1)],"#d3d9d9","#b3baba",1);
    for(let x=Math.floor(i0)+2;x<i1;x+=4) line([P(x,BFL,j0),P(x,BFL,j1)],"#c8cfcf",1);
    for(let z=Math.floor(j0)+2;z<j1;z+=4) line([P(i0,BFL,z),P(i1,BFL,z)],"#c8cfcf",1);
    poly([P(i0,BFL,j1),P(i1,BFL,j1),P(i1,BH,j1),P(i0,BH,j1)],"#e6eaea","#b3baba",1);
    poly([P(i0,BFL,j0),P(i0,BFL,j1),P(i0,BH,j1),P(i0,BH,j0)],"#e6eaea","#b3baba",1);
    poly([P(i1,BFL,j0),P(i1,BFL,j1),P(i1,BH,j1),P(i1,BH,j0)],"#d3d9d9","#b3baba",1);
    /* the levelling plate on its four pedals, and what is printed on it */
    for(const pd of [[bx0+2.5,bz0+2.0],[bx0+BASE_W-2.5,bz0+2.0],
                     [bx0+2.5,bz0+BASE_D-2.0],[bx0+BASE_W-2.5,bz0+BASE_D-2.0]]){
      const a=P(pd[0],BFL,pd[1]), b=P(pd[0],BFL+PED,pd[1]);
      line([a,b],"#1a1c20",Math.max(3,1.5*S));
      c.beginPath(); c.ellipse(a[0],a[1],0.95*S,0.43*S,0,0,7);
      c.fillStyle="#25282d"; c.fill(); PEN(c,"#0a0b0d",1); c.stroke(); }
    box(bx0,bx0+BASE_W,plateY-BASE_T,plateY,bz0,bz0+BASE_D,"#17181b","#0d0e10","#26282c","#000000");
    line([P(bx0+2,plateY,bz0+2),P(bx0+BASE_W-2,plateY,bz0+3.2)],"#3b4048",1);
    c.font="bold "+Math.max(6,0.7*S|0)+"px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="center"; c.textBaseline="middle";
    ["MAG","ISO","PWM"].forEach((q,i)=>{ const p=P(bx0+7+i*8,plateY,bz0+5);
      c.fillStyle="#1b3d6b"; c.fillText(q,p[0],p[1]); });
    /* the two-level stand */
    const xm=sx0+ST_STEP_X;
    box(xm,sx0+ST_W,standY,standY+ST_STEP,sz0,sz0+ST_D,"#33363c","#141518","#202226","#050506");
    box(sx0,xm,standY,standY+ST_TALL,sz0,sz0+ST_D,"#3a3e45","#141518","#202226","#050506");
    for(let i=1;i<5;i++)
      line([P(sx0+0.15*i,standY,sz0),P(sx0+0.15*i,standY+ST_TALL,sz0)],"#2a2d33",1);
    /* tank B on the low step, its plug still in */
    const b0=bx0b, b1=bx0b+TW+2*WALL, bz1=bz0b+TD+2*WALL, bTop=bY+WALL+B_H;
    glassBack(b0,b1,bY,bTop,bz0b,bz1);
    water(b0+WALL,b1-WALL,bz0b+WALL,bz1-WALL,bY+WALL,bY+WALL+9.4);
    glassFront(b0,b1,bY,bTop,bz0b,bz1);
    { const oy=bY+WALL+B_HOLE, zc=(bz0b+bz1)/2;
      const a=P(b1,oy,zc), q=P(b1+0.9,oy,zc);
      line([a,q],"#b7bcc1",Math.max(3,1.0*S));
      c.beginPath(); c.arc(q[0],q[1],0.45*S,0,7);
      c.fillStyle="#fbfbf8"; c.fill(); PEN(c,"#b9bcb6",1); c.stroke(); }
    /* tank A on the tall step: glass behind, the water, then the glass in front */
    const a0=ax0, a1=ax0+TW+2*WALL, az1=az0+TD+2*WALL, aTopY=aY+WALL+A_H;
    const ix0=a0+WALL, ix1=a1-WALL, iz0=az0+WALL, iz1=az1-WALL;
    const FL=aY+WALL, YO=FL+A_OUT;
    glassBack(a0,a1,aY,aTopY,az0,az1);
    water(ix0,ix1,iz0,iz1,FL,YO+head);
    glassFront(a0,a1,aY,aTopY,az0,az1);
    /* the marks engraved down the left of the front face */
    const fs=Math.max(6,Math.min(0.52*S,12));
    c.font="bold "+fs.toFixed(1)+"px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="right"; c.textBaseline="middle";
    const every=S>7.5?1:2;
    for(let k=0;k<=N_MARKS;k++){ const y=YO+k; if(y>aTopY-0.2) break;
      line([P(ix0+1.35,y,iz0),P(ix0+4.35,y,iz0)],"#0d1f27",S>16?2:1);
      if(k%every===0){ const q=P(ix0+1.15,y,iz0);
        c.fillStyle="#0b1d24"; c.fillText(String(k),q[0],q[1]); } }
    /* the tap on the right wall: its body, its ribs, and the lever, shut */
    const zv=az0+WALL+8.0, dv=0.34;
    for(const seg of [[0.0,0.55,"#8e959c",0.42],[0.55,1.55,"#c3c9ce",0.52],
                      [1.55,2.05,"#a8aeb4",0.30],[2.05,2.95,"#c9ced3",0.36]])
      poly([P(a1+seg[0],YO-seg[3],zv-dv),P(a1+seg[1],YO-seg[3],zv-dv),
            P(a1+seg[1],YO+seg[3],zv-dv),P(a1+seg[0],YO+seg[3],zv-dv)],seg[2],"#5b6167",1);
    for(const rib of [2.25,2.55,2.85])
      line([P(a1+rib,YO-0.42,zv-dv),P(a1+rib,YO+0.42,zv-dv)],"#7d848a",1);
    { const p=P(a1+1.05,YO+0.5,zv-dv), L=2.9*S;
      const hx=p[0]+0.18*L, hy=p[1]+0.98*L;
      line([p,[hx,hy]],"#e8622a",Math.max(4,0.66*S));
      const r2=0.34*S;
      c.beginPath(); c.arc(hx,hy,r2,0,7);
      c.fillStyle="#ff8a4a"; c.fill(); PEN(c,"#8c3a12",1); c.stroke();
      c.beginPath(); c.arc(p[0],p[1],r2*0.8,0,7);
      c.fillStyle="#7d848a"; c.fill(); PEN(c,"#4d5359",1); c.stroke(); }
    /* the 4 mm plug still in, the 5 mm hole open and running */
    { const px=ix0+6.5, a=P(px,YO,az0), q=P(px,YO-1.1,az0-1.0);
      line([a,q],"#f4f4f0",Math.max(3,1.0*S));
      c.beginPath(); c.arc(q[0],q[1],0.62*S,0,7);
      c.fillStyle="#fbfbf8"; c.fill(); PEN(c,"#b9bcb6",1); c.stroke(); }
    { const hp=P(ix0+3.5,YO,az0);
      c.beginPath(); c.arc(hp[0],hp[1],0.32*S,0,7);
      c.fillStyle="#123039"; c.fill(); PEN(c,"#7f97a2",1); c.stroke(); }
    /* what the bin has caught so far */
    water(i0,i1,j0,j1,BFL,pool,true);
    /* the jet, traced the way the simulator traces it */
    if(flowing){
      /* the app clamps the landing point to the inside of the bin: the jet
         meets the front wall and runs down it into what is already caught */
      const v=CD*Math.sqrt(2*G*head), pts=[]; let hit=false;
      for(let i=0;i<200;i++){ const tau=i*0.006;
        const pz=az0-1.0-v*tau, py=YO-0.5*G*tau*tau;
        if(pz<=j0){ const th=(az0-1.0-j0)/v;
                    pts.push(P(ix0+3.5,YO-0.5*G*th*th,j0)); hit=true; break; }
        pts.push(P(ix0+3.5,py,pz));
        if(py<=pool) break; }
      const jw=Math.max(1.4,2.0*Math.sqrt(A_HOLE/Math.PI)*S);
      if(pts.length>1) line(pts,"#a6e0f4",jw);
      const tip=pts[pts.length-1];
      if(hit) line([tip,P(ix0+3.5,pool,j0)],"#a6e0f4",Math.max(1,0.45*jw));
      const ring=hit?P(ix0+3.5,pool,j0):tip;
      PEN(c,"#c8ecf8",1.2); c.beginPath();
      c.ellipse(ring[0],ring[1],0.62*S,0.32*S,0,0,7); c.stroke();
    }
    /* the bin's near walls last — translucent, ribbed */
    poly([P(BX0,0,BZ0),P(BX1,0,BZ0),P(BX1,BH,BZ0),P(BX0,BH,BZ0)],null,"#cfdada",2);
    for(let x=BX0+4;x<BX1;x+=6) line([P(x,0.4,BZ0),P(x,BH-0.6,BZ0)],"#c6d0d0",1);
    poly([P(BX1,0,BZ0),P(BX1,BH,BZ0),P(BX1,BH,BZ1),P(BX1,0,BZ1)],null,"#b8c2c2",1);
    poly([P(BX0-0.5,BH,BZ0-0.5),P(BX1+0.5,BH,BZ0-0.5),
          P(BX1+0.5,BH+0.5,BZ0-0.5),P(BX0-0.5,BH+0.5,BZ0-0.5)],"#e6eaea","#a8b2b2",1);
    poly([P(BX0,BH+0.5,BZ0),P(BX1,BH+0.5,BZ0),P(BX1,BH+0.5,BZ1),P(BX0,BH+0.5,BZ1)],null,"#cdd6d6",1);
    /* the two tanks are named on the bench, as the app names them */
    c.font="bold "+Math.max(8,Math.min(0.8*S,13)).toFixed(1)+"px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="right"; c.textBaseline="middle";
    c.fillStyle="#c3d6de";
    { const q=P(a0-0.6,aTopY-2.4,az0); c.fillText("A",q[0],q[1]); }
    { const q=P(b0-0.6,bTop-2.4,bz0b); c.fillText("B",q[0],q[1]); }
    c.textAlign="left"; c.textBaseline="alphabetic";
  }};

/* ── APhO 2026 E2 · the one number the kit gives, scrolled on the LEDs ── */
const MB_FONT={
  "0":["111","101","101","101","111"], "1":["010","110","010","010","111"],
  "2":["111","001","111","100","111"], "3":["111","001","111","001","111"],
  "4":["101","101","111","001","001"], "5":["111","100","111","001","111"],
  "6":["111","100","111","101","111"], "7":["111","001","001","010","010"],
  "8":["111","101","111","101","111"], "9":["111","101","111","001","111"]};
/* a 3.3 kΩ reference against three of the resistors in the kit */
const MB_REF=3300, MB_R=[6800,560,4700];
const MB_STREAM=(()=>{
  const cols=[], own=[];
  MB_R.forEach((R,vi)=>{
    const code=Math.round(1023*R/(R+MB_REF));
    for(let k=0;k<2;k++){ cols.push([0,0,0,0,0]); own.push(vi); }
    for(const ch of String(code)){
      const g=MB_FONT[ch];
      for(let x=0;x<3;x++){
        const col=[]; for(let y=0;y<5;y++) col.push(g[y][x]==="1"?1:0);
        cols.push(col); own.push(vi);
      }
      cols.push([0,0,0,0,0]); own.push(vi);
    }
  });
  return {cols, own, code:MB_R.map(R=>Math.round(1023*R/(R+MB_REF)))};
})();
const MB_COLT=0.17;                        /* micro:bit scrolls a column at a time */
const SIG_A26E2={
  sim:"sim/apho2026_E2_web.html", tag:"APhO 2026 E2", span:MB_STREAM.cols.length*MB_COLT, rate:1,
  capL:{ko:"micro:bit · 5×5 LED에 흘러가는 ADC 값",en:"micro:bit · the ADC integer, scrolled on the 5×5 LEDs"},
  capR:{ko:"ADC 값",en:"ADC value"},
  read(t){ const n=MB_STREAM.cols.length, i=Math.floor(t/MB_COLT)%n;
           return String(MB_STREAM.code[MB_STREAM.own[(i+2)%n]])+" / 1023"; },
  paint(c,w,h,t){
    const n=MB_STREAM.cols.length, idx=Math.floor(t/MB_COLT)%n;
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    /* the board, drawn in the proportions the simulator itself uses */
    const MW=188, MH=152, S=Math.min((w-44)/MW,(h-26)/MH);
    const bx=(w-MW*S)/2, by=(h-MH*S)/2;
    const X=u=>bx+u*S, Y=v=>by+v*S;
    const box=(x,y,ww,hh,fill,stroke,lw)=>{
      c.beginPath(); c.rect(X(x),Y(y),ww*S,hh*S);
      if(fill){c.fillStyle=fill;c.fill();}
      if(stroke){PEN(c,stroke,lw||1);c.stroke();}};
    box(0,0,MW,MH,"#23262b","#111417",1.4);
    /* the gold tabs and the reset ring along the top edge */
    c.fillStyle="#f2b826";
    for(let k=0;k<3;k++){ const x0=30+k*20;
      c.beginPath(); c.moveTo(X(x0),Y(0)); c.lineTo(X(x0+16),Y(0));
      c.lineTo(X(x0+8),Y(15)); c.closePath(); c.fill(); }
    PEN(c,"#d8a72a",1.6); c.beginPath();
    c.ellipse(X(MW/2),Y(29),17*S,9*S,0,0,7); c.stroke();
    c.fillStyle="#d8a72a";
    for(const dx of [-8,8]){ c.beginPath(); c.arc(X(MW/2+dx),Y(29),3*S,0,7); c.fill(); }
    /* the 5 x 5 matrix — the only display the kit has */
    for(let cx=0;cx<5;cx++) for(let ry=0;ry<5;ry++){
      const on=MB_STREAM.cols[(idx+cx)%n][ry];
      if(on){ c.fillStyle="#ff3320"; c.shadowColor="rgba(255,51,32,.75)"; c.shadowBlur=3*S; }
      else  { c.fillStyle="#4a2018"; c.shadowBlur=0; }
      c.fillRect(X(MW/2-44+cx*20),Y(46+ry*17),8*S,12*S);
    }
    c.shadowBlur=0;
    /* buttons A and B */
    c.textAlign="center"; c.textBaseline="middle";
    c.font=(8*S|0)+"px IBM Plex Mono,ui-monospace,monospace";
    for(const [dx,lab] of [[14,"A"],[MW-34,"B"]]){
      box(dx,62,20,20,"#c9ced4","#7d848a",1.6);
      box(dx+5,67,10,10,"#8d949b",null);
      c.fillStyle="#f2b826"; c.beginPath();
      c.moveTo(X(dx+2),Y(88)); c.lineTo(X(dx+18),Y(88)); c.lineTo(X(dx+10),Y(96));
      c.closePath(); c.fill();
      c.fillStyle="#23262b"; c.fillText(lab,X(dx+10),Y(91));
    }
    /* the gold edge connector */
    box(0,MH-22,MW,22,"#c9a227","#8a6f18",1);
    c.fillStyle="#e0bd45";
    for(let k=0;k<28;k++) c.fillRect(X(6+k*6.4),Y(MH-20),3*S,20*S);
    c.font=(7*S|0)+"px IBM Plex Mono,ui-monospace,monospace";
    ["0","1","2","3V","G"].forEach((lab,k)=>{
      const cxp=12+k*(MW-24)/4;
      PEN(c,"#8a6f18",1.6); c.beginPath();
      c.ellipse(X(cxp),Y(MH-10),9*S,9*S,0,0,7); c.stroke();
      c.fillStyle="#5c4a10"; c.fillText(lab,X(cxp),Y(MH-10));
    });
    c.textBaseline="alphabetic"; c.textAlign="left";
  }};

/* ── IPhO 2011 E1 · the meter, as the top plate is pushed down ──── */
const SIG_I11E1={
  sim:"sim/ipho2011_E1_web.html", tag:"IPhO 2011 E1", span:14, rate:1,
  capL:{ko:"극판 간격에 따른 계기 눈금 · 정전용량식 변위 센서",
        en:"What the meter reads against the plate gap · capacitive displacement sensor"},
  capR:{ko:"극판 간격",en:"gap"},
  read(t){ return this.d(t).toFixed(2)+" mm"; },
  d(t){ return 0.45+2.05*(0.5+0.5*Math.cos(2*Math.PI*Math.min(t,this.span)/this.span)); },
  paint(c,w,h,t){
    /* a parallel-plate sensor read through the box: C = eps0 A / d, and the
       box turns that into a voltage, so the meter follows 1/d */
    const A=38e-4, EPS=8.854e-12, GAIN=1.9e10;          /* mV per farad, near enough */
    const V=d=>GAIN*EPS*A/(d*1e-3);
    const LO=0.4, HI=2.6, pad=16, padL=42, padB=22;
    const X=u=>padL+(u-LO)/(HI-LO)*(w-padL-pad);
    const VMAX=V(LO)*1.08;
    const Y=v=>h-padB-v/VMAX*(h-padB-pad);
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    PEN(c,"#DCE7F0",.5); c.beginPath();
    for(let u=LO;u<=HI+1e-9;u+=0.2){ c.moveTo(X(u),pad); c.lineTo(X(u),h-padB); }
    for(let v=0;v<=VMAX;v+=VMAX/6){ c.moveTo(padL,Y(v)); c.lineTo(w-pad,Y(v)); }
    c.stroke();
    PEN(c,"#B4CADC",1); c.beginPath();
    c.moveTo(padL,Y(0)); c.lineTo(w-pad,Y(0));
    c.moveTo(padL,pad); c.lineTo(padL,h-padB); c.stroke();
    PEN(c,"#2c6f9b",2.2); c.beginPath();
    for(let i=0;i<=220;i++){ const u=LO+(HI-LO)*i/220;
      i?c.lineTo(X(u),Y(V(u))):c.moveTo(X(u),Y(V(u))); }
    c.stroke();
    const dd=this.d(t);
    PEN(c,"#c9d8e4",1); c.beginPath();
    c.moveTo(X(dd),Y(V(dd))); c.lineTo(X(dd),h-padB); c.stroke();
    c.fillStyle="#2c6f9b"; c.beginPath(); c.arc(X(dd),Y(V(dd)),3.4,0,7); c.fill();
    /* the plates themselves, drawn small in the corner and moving with the gap */
    const px=w-pad-52, py=pad+10, pw=44;
    PEN(c,"#7d848a",2.4); c.beginPath();
    c.moveTo(px,py); c.lineTo(px+pw,py);
    const gap=6+ (dd-LO)/(HI-LO)*22;
    c.moveTo(px,py+gap); c.lineTo(px+pw,py+gap); c.stroke();
    PEN(c,"#c3ccd2",1); c.beginPath();
    for(let k=1;k<5;k++){ c.moveTo(px+k*pw/5,py+2); c.lineTo(px+k*pw/5,py+gap-2); }
    c.stroke();
    c.fillStyle="#8A99A8"; c.font="9.5px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="center"; for(const u of [0.5,1.0,1.5,2.0,2.5]) c.fillText(u.toFixed(1),X(u),h-7);
    c.textAlign="right"; c.fillText("mV",padL-5,Y(VMAX*0.92));
    c.textAlign="left";
  }};

/* ── IPhO 2011 E2 · the cylinder swinging on its thread loop ────── */
const SIG_I11E2={
  sim:"sim/ipho2011_E2_web.html", tag:"IPhO 2011 E2", span:26, rate:1,
  capL:{ko:"실 고리에 걸어 흔드는 원통 · 구멍을 옮겨 가며 주기를 잰다",
        en:"The cylinder swinging on its thread loop, hole by hole"},
  capR:{ko:"주기",en:"period"},
  /* the apparatus of the official sheet, with the page's own official seed */
  L:0.3000, D_OUT:0.0220, HOLE0:0.0110, PITCH:0.0100, NH:16,
  M_BALL:0.02500, RATIO:2.66744, Z:0.252688, G:9.8100,
  LOOP_DROP:0.115, RULER_LEN:0.350, RULER_H:0.030,
  truth(){ if(this._tr) return this._tr;
    const m=this.M_BALL, M=this.RATIO*m, L=this.L, z=this.Z;
    const xcm=(m*z+M*L/2)/(M+m);
    const Icm=M*L*L/12+M*Math.pow(xcm-L/2,2)+m*Math.pow(z-xcm,2);
    const holes=[]; for(let i=0;i<this.NH;i++) holes.push(this.HOLE0+i*this.PITCH);
    this._tr={xcm:xcm, r:Icm/(M+m), holes:holes,
              benchY:Math.max(0.300,L-this.HOLE0+0.012)};
    return this._tr; },
  hole(t){ return Math.floor(t/(this.span/4))%4*3+3; },   /* four holes, in turn */
  T(k){ const tr=this.truth(), R=Math.abs(tr.xcm-tr.holes[k]);
        return 2*Math.PI*Math.sqrt((tr.r+R*R)/(this.G*R)); },
  read(t){ return this.T(this.hole(t)).toFixed(3)+" s"; },
  paint(c,w,h,t){
    const tr=this.truth(), k=this.hole(t), T=this.T(k);
    const hx=tr.holes[k];
    /* it really swings, at the period the readout claims, dying away a little */
    const slot=this.span/4, u=t%slot;
    const amp=0.30*Math.exp(-u*0.10), ang=amp*Math.sin(2*Math.PI*u/T);
    /* the bench: pin at the origin, table top a little below the longest swing */
    const need=tr.benchY+0.055, ppm=Math.min((h-14)/need, (w-24)/0.62);
    const px=w*0.40, py=Math.max(12, (h-need*ppm)/2)+0.035*ppm;
    const X=(a,b)=>[px+a*ppm, py+b*ppm];
    const by=py+tr.benchY*ppm;
    const line=(a,b,col,lw,cap,dash)=>{ PEN(c,col,lw||1);
      if(cap) c.lineCap=cap;
      if(dash) c.setLineDash(dash);
      c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
      c.setLineDash([]); c.lineCap="butt"; };
    const poly=(pts,fill,stroke,lw)=>{
      c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
      c.closePath();
      if(fill){c.fillStyle=fill;c.fill();}
      if(stroke){PEN(c,stroke,lw||1);c.stroke();} };
    /* the table, and the table edge the plate is clamped to */
    c.fillStyle="#93ab8b"; c.fillRect(0,0,w,h);
    c.fillStyle="#7e9678"; c.fillRect(0,by,w,h-by);
    line([0,py],[w,py],"#7d9577",1,"butt",[6,6]);
    /* the perspex base plate, seen from the front */
    { const bw=0.150*ppm, bh=0.062*ppm, dd=0.022*ppm;
      const top=py-bh/2, bot=py+bh/2;
      poly([[px-bw/2,top],[px+bw/2,top],[px+bw/2+dd,top-dd],[px-bw/2+dd,top-dd]],
           "#c3d3d8","#8fa2a8",1);
      poly([[px-bw/2,top],[px+bw/2,top],[px+bw/2,bot],[px-bw/2,bot]],
           "#d7e4e8","#8fa2a8",1); }
    /* the guide the app drops from the pin while a period is being timed */
    line([px,py],[px,py+this.L*1.05*ppm],"#7d9577",1,"butt",[3,5]);
    /* the tube hangs from the hole in use; its axis points down the swing */
    const ux=Math.sin(ang), uy=Math.cos(ang);
    const ox=px-hx*ppm*ux, oy=py-hx*ppm*uy;
    const rp=this.D_OUT*0.5*ppm, Lp=this.L*ppm;
    const pt=(s,q)=>[ox+ux*s-uy*q, oy+uy*s+ux*q];
    /* in pendulum mode the app hangs the tube straight on the pin: no thread */
    /* the aluminium tube, shaded in the six bands the app uses */
    const AL=["#63696d","#8f9599","#bcc2c6","#e3e7e9","#aeb4b8","#767c80"];
    for(let i=0;i<AL.length;i++){
      const t0=-rp+2*rp*i/AL.length, t1=-rp+2*rp*(i+1)/AL.length;
      poly([pt(0,t0),pt(Lp,t0),pt(Lp,t1),pt(0,t1)],AL[i],null); }
    poly([pt(0,-rp),pt(Lp,-rp),pt(Lp,rp),pt(0,rp)],null,"#4d5255",Math.max(1,ppm*0.0006));
    for(const s of [0,Lp]){ const bore=rp*0.72;
      line(pt(s,-bore),pt(s,bore),"#4a4f52",Math.max(2,ppm*0.0022)); }
    /* the sixteen drilled holes, and a ring round the one in use */
    const hr=0.0019*ppm;
    for(let i=0;i<tr.holes.length;i++){
      const s=tr.holes[i]*ppm, pl=[];
      for(let q=0;q<8;q++){ const a=2*Math.PI*q/8;
        pl.push(pt(s+hr*Math.cos(a), hr*0.85*Math.sin(a))); }
      poly(pl,"#22262a","#585d60",1); }
    { const p=pt(hx*ppm,0), q=Math.max(6,0.005*ppm);
      PEN(c,"#ffd54f",2); c.beginPath(); c.ellipse(p[0],p[1],q,q,0,0,7); c.stroke(); }
    /* the pin head, drawn over the thread as the app draws it */
    { const pr=Math.max(3,0.0042*ppm);
      c.beginPath(); c.ellipse(px,py,pr*1.5,pr*1.5,0,0,7);
      c.fillStyle="#9aa0a4"; c.fill(); PEN(c,"#6b7175",1); c.stroke();
      c.beginPath(); c.ellipse(px,py,pr,pr,0,0,7);
      c.fillStyle="#3a3f43"; c.fill(); PEN(c,"#22262a",1); c.stroke(); }
    /* the 35 cm ruler lying on the table */
    { const rx=w*0.03, ry=by+Math.max(9,0.020*ppm);
      const Lr=Math.min(this.RULER_LEN*ppm, w*0.52), hp=this.RULER_H*ppm*0.8;
      const bw=Math.max(1,hp*0.05), ins=Math.max(bw*2,hp*0.22);
      poly([[rx-ins,ry-hp/2],[rx+Lr+ins,ry-hp/2],[rx+Lr+ins,ry+hp/2],[rx-ins,ry+hp/2]],
           "#f5efe2","#c9302c",bw);
      const mm=Lr/350, t0=-hp/2+bw;
      const step=mm>=3?1:(mm>=1.2?5:10);
      for(let i=0;i<=350;i+=step){
        let ln,col,wd;
        if(i%10===0){ ln=hp*0.46; col="#33383a"; wd=Math.max(1,hp*0.030); }
        else if(i%5===0){ ln=hp*0.30; col="#3b4143"; wd=Math.max(1,hp*0.024); }
        else { ln=hp*0.16; col="#6a7073"; wd=1; }
        line([rx+i*mm,ry+t0],[rx+i*mm,ry+t0+ln],col,wd); }
      const fs=Math.max(5,Math.min(hp*0.34,9));
      c.font=fs.toFixed(1)+"px -apple-system,'Segoe UI',sans-serif";
      c.fillStyle="#33383a"; c.textAlign="center"; c.textBaseline="middle";
      const every=(10*mm>fs*1.6)?5:10;
      for(let i=0;i<=35;i+=every) c.fillText(String(i),rx+i*10*mm,ry+hp*0.30); }
    /* the stopwatch of the photograph, running */
    { const r=Math.min(h*0.15,w*0.10), sx=w-r*1.7, sy=by+r*0.15;
      c.fillStyle="#8d9498"; c.fillRect(sx-r*0.14,sy-r*1.34,r*0.28,r*0.42);
      PEN(c,"#5f666a",Math.max(2,r*0.07)); c.beginPath();
      c.ellipse(sx,sy-r*1.37,r*0.24,r*0.19,0,0,7); c.stroke();
      for(const q of [-1,1]){ c.fillStyle="#8d9498";
        c.fillRect(sx+q*r*0.92,sy-r*0.66,r*0.22,r*0.26);
        PEN(c,"#5f666a",1); c.strokeRect(sx+q*r*0.92,sy-r*0.66,r*0.22,r*0.26); }
      c.beginPath(); c.ellipse(sx,sy,r,r,0,0,7);
      c.fillStyle="#1d7a8b"; c.fill(); PEN(c,"#14606e",Math.max(1,r*0.05)); c.stroke();
      c.beginPath(); c.ellipse(sx,sy,r*0.90,r*0.90,0,0,7);
      c.fillStyle="#2fa5b8"; c.fill(); PEN(c,"#1d7a8b",1); c.stroke();
      const lw2=r*0.88, lh=r*0.32;
      c.fillStyle="#cdd8c6"; c.fillRect(sx-lw2,sy-lh-r*0.02,2*lw2,2*lh);
      PEN(c,"#5d675a",Math.max(1,r*0.035));
      c.strokeRect(sx-lw2,sy-lh-r*0.02,2*lw2,2*lh);
      const laps=Math.floor(u/T)%10+1, shown=laps*T;
      c.fillStyle="#1b2220"; c.textAlign="center"; c.textBaseline="middle";
      c.font="bold "+Math.max(7,r*0.40).toFixed(1)+"px 'Courier New',Consolas,monospace";
      c.fillText(shown.toFixed(2),sx,sy-r*0.02);
      c.fillStyle="#e8f3f5";
      c.font=Math.max(5,r*0.20).toFixed(1)+"px -apple-system,'Segoe UI',sans-serif";
      c.fillText("ALBA",sx,sy-r*0.52);
      c.fillStyle="#cfeaef"; c.fillText("1/100 sec",sx,sy+r*0.56); }
    /* what the bench is showing right now, in the app's own status line */
    c.fillStyle="#2f3a2c"; c.textAlign="left"; c.textBaseline="alphabetic";
    c.font=Math.max(9,Math.min(h*0.035,13)).toFixed(1)+"px -apple-system,'Segoe UI',sans-serif";
    c.fillText("hole "+(k+1)+" of "+this.NH+"   x = "+(hx*1000).toFixed(0)+" mm",
               10,h-10);
  }};

/* ── APhO 2022 E1 · the magnet carried around the phone ─────────── */
const SIG_A22E1={
  sim:"sim/apho2022_E1_web.html", tag:"APhO 2022 E1", span:20, rate:1,
  capL:{ko:"자석을 휴대폰 둘레로 옮기며 읽는 자기력계",
        en:"Carrying the magnet around the phone, reading its magnetometer"},
  capR:{ko:"센서 값",en:"sensor"},
  /* the magnet is carried round the phone; the sensor sits behind the camera */
  pos(t){ const a=2*Math.PI*(t%this.span)/this.span;
          return [Math.cos(a)*4.6, Math.sin(a)*7.0, a+Math.PI/2]; },
  field(t){                                        /* a dipole, read at the sensor */
    const p=this.pos(t), sx=0, sy=-4.2;
    const dx=sx-p[0], dy=sy-p[1], r=Math.max(1.4,Math.hypot(dx,dy));
    const ux=dx/r, uy=dy/r, mx=Math.cos(p[2]), my=Math.sin(p[2]);
    const md=mx*ux+my*uy, k=16000/(r*r*r);
    return [k*(3*md*ux-mx), k*(3*md*uy-my)];
  },
  read(t){ const b=this.field(t); return Math.hypot(b[0],b[1]).toFixed(1)+" \u03bcT"; },
  /* the phone, the way Mobile.js builds it: 150 tall, bezels in fifteenths */
  phone(c,X,Y,S){
    const PH=15.0, PW=PH*0.48, sb=(4/150)*PH, tb=(1/15)*PH, bb=(14/150)*PH;
    c.fillStyle="rgba(128,128,128,0.5)";
    c.fillRect(X(-PW/2),Y(-PH/2),PW*S,PH*S);
    PEN(c,"#000000",1.4); c.strokeRect(X(-PW/2),Y(-PH/2),PW*S,PH*S);
    PEN(c,"#000000",1);
    c.strokeRect(X(-PW/2+sb),Y(-PH/2+tb),(PW-2*sb)*S,(PH-tb-bb)*S);
    c.beginPath(); c.arc(X(0),Y((68/150)*PH),(5/150)*PH*S,0,7); c.stroke();
    c.fillStyle="#000000"; c.beginPath();
    c.arc(X(0),Y(-(70/150)*PH),(2/150)*PH*S,0,7); c.fill(); c.stroke();
    /* the two field axes the app labels on the phone */
    const arrow=(dx,dy,lab,sub)=>{
      const x0=X(0), y0=Y(0), x1=X(dx*3.1), y1=Y(dy*3.1);
      PEN(c,"#000000",1.4); c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke();
      const an=Math.atan2(y1-y0,x1-x0), hd=0.28*S;
      c.beginPath(); c.moveTo(x1,y1);
      c.lineTo(x1-hd*Math.cos(an-0.4),y1-hd*Math.sin(an-0.4));
      c.lineTo(x1-hd*Math.cos(an+0.4),y1-hd*Math.sin(an+0.4));
      c.closePath(); c.fillStyle="#000000"; c.fill();
      c.textAlign="left"; c.textBaseline="alphabetic";
      c.font=(0.9*S).toFixed(1)+"px Calibri,'Gill Sans',sans-serif";
      c.fillText(lab,x1+0.2*S,y1-0.1*S);
      c.font=(0.6*S).toFixed(1)+"px Calibri,'Gill Sans',sans-serif";
      c.fillText(sub,x1+0.2*S+c.measureText(lab).width*0.9,y1+0.32*S);
    };
    arrow(1,0,"B","w"); arrow(0,-1,"B","l");
  },
  magnet(c,X,Y,S,x,y,ang,alpha){
    const ML=2.9, MW=1.1;
    c.save(); c.translate(X(x),Y(y)); c.rotate(-ang+Math.PI/2);
    c.globalAlpha=alpha;
    c.fillStyle="#1f51ff"; c.fillRect(-MW/2*S,-ML/2*S,MW*S,ML/2*S);
    c.fillStyle="#ff1818"; c.fillRect(-MW/2*S,0,MW*S,ML/2*S);
    PEN(c,"#000000",1.2); c.strokeRect(-MW/2*S,-ML/2*S,MW*S,ML*S);
    c.beginPath(); c.moveTo(-MW/2*S,0); c.lineTo(MW/2*S,0); c.stroke();
    c.fillStyle="#000000"; c.beginPath(); c.arc(0,0,1.6,0,7); c.fill();
    c.globalAlpha=1; c.restore();
  },
  paint(c,w,h,t){
    const S=Math.min(w/24,h/17.5), ox=w*0.46, oy=h/2;
    const X=u=>ox+u*S, Y=v=>oy+v*S;
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    /* where it has just been, so a still frame still shows it moving */
    for(let k=5;k>=1;k--){ const p=this.pos(t-k*0.55);
      this.magnet(c,X,Y,S,p[0],p[1],p[2],0.10+0.02*(5-k)); }
    this.phone(c,X,Y,S);
    const p=this.pos(t);
    this.magnet(c,X,Y,S,p[0],p[1],p[2],1);
    /* the ruler the app keeps on the bench: outline and ticks, nothing more */
    const rx=w*0.06, ry=h-Math.max(20,h*0.10), rw=w*0.30, rh=Math.max(10,h*0.045);
    PEN(c,"#000000",1.2); c.strokeRect(rx,ry,rw,rh);
    c.beginPath();
    for(let k=0;k<=10;k++){ const x=rx+k/10*rw;
      c.moveTo(x,ry); c.lineTo(x,ry+(k%5===0?rh*0.62:rh*0.34)); }
    c.stroke();
    /* what the magnetometer is showing */
    const b=this.field(t);
    c.fillStyle="#222"; c.textAlign="left"; c.textBaseline="alphabetic";
    c.font=Math.max(11,0.62*S).toFixed(1)+"px Calibri,'Gill Sans',sans-serif";
    c.fillText("Bw = "+b[0].toFixed(1)+" \u03bcT",w*0.05,h*0.12);
    c.fillText("Bl = "+b[1].toFixed(1)+" \u03bcT",w*0.05,h*0.12+0.95*S);
  }};

/* ── APhO 2022 E2 · the echo train the detector hears ───────────── */
const SIG_A22E2={
  sim:"sim/apho2022_E2_web.html", tag:"APhO 2022 E2", span:25, rate:1.4,
  capL:{ko:"검출기가 받은 진동수 · 숨은 음원의 운동이 도플러로 드러난다",
        en:"The frequency the detector receives · the hidden source's motion, in Doppler"},
  capR:{ko:"진동수",en:"frequency"},
  /* the page's own black box: source at (300,500) drifting and circling */
  VC:330, F0:991, SX:300, SY:500, VX:81, VY:43, R:120, OM:1.5,
  srcPos(t){ return [this.SX+this.VX*t+this.R*Math.cos(this.OM*t),
                     this.SY+this.VY*t+this.R*Math.sin(this.OM*t)]; },
  srcVel(t){ return [this.VX-this.OM*this.R*Math.sin(this.OM*t),
                     this.VY+this.OM*this.R*Math.cos(this.OM*t)]; },
  tEm(t){                                       /* the page's own fixed point */
    let tb=t;
    for(let i=0;i<400;i++){
      const p=this.srcPos(tb), d=Math.hypot(p[0],p[1]);
      const err=tb+d/this.VC-t;
      if(Math.abs(err)<1e-7) break;
      tb-=0.35*err;
    }
    return tb;
  },
  f(t){ const te=this.tEm(t);
    if(te<0) return NaN;
    const p=this.srcPos(te), v=this.srcVel(te), d=Math.hypot(p[0],p[1]);
    const comp=(-p[0]/d)*v[0]+(-p[1]/d)*v[1];   /* towards the detector */
    return this.F0*this.VC/(this.VC-comp);
  },
  curve(){ if(this._c) return this._c;
    const pts=[];
    for(let i=0;i<=500;i++){ const t=25*i/500, y=this.f(t);
      pts.push([t,isFinite(y)?y:NaN]); }
    const ok=pts.filter(p=>isFinite(p[1])).map(p=>p[1]);
    this._c={pts:pts, lo:Math.min.apply(null,ok), hi:Math.max.apply(null,ok)};
    return this._c;
  },
  read(t){ const y=this.f(t%this.span);
           return isFinite(y)?y.toFixed(0)+" Hz":"\u2014"; },
  paint(c,w,h,t){
    const C=this.curve(), tt=t%this.span;
    c.fillStyle="#06040a"; c.fillRect(0,0,w,h);
    const fs=Math.max(9,Math.min(14,h*0.042));
    c.font=fs.toFixed(1)+"px 'Gill Sans',Calibri,sans-serif";
    c.textAlign="center"; c.textBaseline="middle";
    /* the input row the page keeps above the graph */
    c.fillStyle="#ffffff";
    c.fillText("d = 0 m   \u03b8 = 0\u00b0   v = 0 m/s   t\u2080 = 0 s   tf = 25 s   \u0394 = 0.02 s",
               w/2,fs*1.3);

    const S=side/(2*this.HALF), cx=sx+side/2, cy=sy+side/2;
    const u=this.at(t), p=this.probe(u);

    const bx=sx+side+Math.max(12,w*0.03), bw=w-bx-pad;
    const fs=Math.max(9,Math.min(13,h*0.042));
    c.font=fs.toFixed(1)+"px 'Gill Sans',Calibri,sans-serif";
    c.textAlign="left"; c.textBaseline="middle";
    let ty=sy+fs;

    row("laser","632.8 nm"); row("L","90.00 cm");
    row("x",(p[0]).toFixed(2)+" cm"); row("y",(p[1]).toFixed(2)+" cm");
    c.fillStyle="#9c9c9c"; c.fillText("photodetector",bx,ty); ty+=fs*1.5;
    c.font="bold "+(fs*1.5).toFixed(1)+"px Consolas,monospace";
    c.fillStyle="#e8e838"; c.fillText(this.meter(u).toFixed(2)+" V",bx,ty);
    ty+=fs*1.6;
    const gh=Math.max(46,h*0.26), gy=Math.min(ty,sy+side-gh);
    c.fillStyle="#282828"; c.fillRect(bx,gy,bw,gh);
    PEN(c,"#4a4a4a",1); c.strokeRect(bx,gy,bw,gh);
    /* the finished scan, each column keeping the brightest sample in it */
    const uX=uu=>bx+(uu+this.SPAN_CM)/(2*this.SPAN_CM)*bw;
    PEN(c,"rgba(232,232,56,.35)",1); c.beginPath();
    c.moveTo(uX(u),gy); c.lineTo(uX(u),gy+gh); c.stroke();
    PEN(c,"#e8e838",1.2); c.beginPath();
    const NP=Math.max(40,Math.round(bw));
    for(let i=0;i<=NP;i++){
      const uu=-this.SPAN_CM+2*this.SPAN_CM*i/NP;
      let v=0;
      for(let q=0;q<9;q++){

        if(g2>v) v=g2; }
      const Y=gy+gh-4-v/this.VMAX*(gh-8);
      i?c.lineTo(uX(uu),Y):c.moveTo(uX(uu),Y);
    }
    c.stroke();
    c.textBaseline="alphabetic";
  }};

  probe(t){ const u=(t%this.span)/this.span; return 0.06+0.88*(0.5-0.5*Math.cos(2*Math.PI*u)); },

/* ── EuPhO 2021 E2 · heat crawling along the rod ────────────────── */
const SIG_E21E2={
  sim:"sim/eupho2021_E2_web.html", tag:"EuPhO 2021 E2", span:70, rate:30,
  capL:{ko:"주최측 콘솔 프로그램 \"rod\" · 다섯 센서가 읽어 내리는 표",
        en:"The organisers' console program \"rod\" · the table its five sensors print"},
  capR:{ko:"가열부 온도",en:"heated end"},
  /* the page's own solver, with the constants the official solution extracts */
  C:115.0, K:400.0, ALPHA:2.90, BETA:0.30, LROD:0.30, RROD:0.01, LHEAT:0.03,
  MASS:0.460, T0C:26.9, T0K:300.0, SIG:5.67e-8, NX:41,
  simulate(power,heatDur,tStart,tEnd,dtOut,sensors){
    const nx=this.NX, dx=this.LROD/(nx-1);
    const area=Math.PI*this.RROD*this.RROD, perim=2*Math.PI*this.RROD;
    const rho=this.MASS/(area*this.LROD), rhoC=rho*this.C;
    const k=this.K, bs=this.BETA*this.SIG, t0k=this.T0K, t04=t0k*t0k*t0k*t0k;
    const poa=perim/area, invDx2=1/(dx*dx), invHalf=1/(0.5*dx);
    const dt=Math.min(0.4*dx*dx/(k/rhoC),0.05);
    let T=new Float64Array(nx), Tn=new Float64Array(nx);
    for(let i=0;i<nx;i++) T[i]=t0k;
    let nHeat=0;
    while(nHeat<nx&&nHeat*dx<=this.LHEAT+1e-12) nHeat++;
    const qVol=nHeat?power/(area*(nHeat-0.5)*dx)/rhoC:0;
    const idx=sensors.map(x=>Math.min(nx-1,Math.max(0,Math.round(x/dx))));
    const out=[]; let t=0, next=tStart;
    while(t<tEnd-1e-12){
      const step=dt<tEnd-t?dt:tEnd-t, heating=t<heatDur;
      for(let i=0;i<nx;i++){
        const Ti=T[i];
        const lap = i===0 ? 2*(T[1]-Ti)*invDx2
                  : i===nx-1 ? 2*(T[nx-2]-Ti)*invDx2
                  : (T[i+1]-2*Ti+T[i-1])*invDx2;
        const flux=this.ALPHA*(Ti-t0k)+bs*(Ti*Ti*Ti*Ti-t04);
        let d=(k*lap-poa*flux)/rhoC;
        if(heating&&i<nHeat) d+=qVol;
        if(i===0||i===nx-1) d-=flux*invHalf/rhoC;
        Tn[i]=Ti+d*step;
      }
      const sw=T; T=Tn; Tn=sw; t+=step;
      while(next<=t+1e-9&&next<=tEnd){
        const row=[next];
        for(const j of idx) row.push(T[j]-t0k+this.T0C);
        out.push(row); next+=dtOut;
      }
    }
    return out;
  },
  XS:[2,8,15,22,29],
  build(){
    if(this._f) return this._f;
    const rows=this.simulate(300,120,0,300,20,this.XS.map(x=>x*0.01));
    this._rows=rows;
    let head="  t(s)  ";
    for(let i=0;i<this.XS.length;i++) head+="   T"+(i+1)+"(C)  ";
    const f=[
      {s:"EuPhO 2021 - Experiment 2: Hot Cylinder"},
      {s:"L = 30 cm, r = 1 cm, m = 460 g, T0 = 26.9 C, heater over 0..3 cm.",dim:true},
      {s:""},
      {s:"Enter the heating power in W (max 300 W): ",ans:"300"},
      {s:"Enter the heating duration in s: ",ans:"120"},
      {s:"Enter the starting and finishing time (s): ",ans:"0 300"},
      {s:"Enter the time step between measurements (s): ",ans:"20"},
      {s:"Enter up to 5 sensor locations (cm): ",ans:this.XS.join(" ")},
      {s:""},
      {s:"Experiment: P = 300 W for 120 s; from 0 s to 300 s every 20 s."},
      {s:"Sensors at "+this.XS.join(" cm, ")+" cm.",dim:true},
      {s:""},
      {s:head,dim:true}];
    this._head=f.length;
    for(const r of rows){
      let line=termPad(r[0].toFixed(1),7)+" ";
      for(let j=1;j<r.length;j++) line+=termPad(r[j].toFixed(2),9)+" ";
      f.push({s:line});
    }
    this._f=f; this._n=termLen(f);
    return f;
  },
  read(t){ this.build();
    const shown=termCut(this._f,Math.round(t*this._n/this.span)).length;
    const k=Math.max(0,Math.min(this._rows.length-1,shown-this._head-1));
    return this._rows[k][1].toFixed(1)+" \u00b0C"; },
  paint(c,w,h,t){
    const f=this.build();
    termPaint(c,w,h,"EuPhO 2021 E2 \u2014 Hot Cylinder",f,
              Math.round(t*this._n/this.span));
  }};

/* ── EuPhO 2020 E1 · electrons thrown off course by a hidden charge ─ */
const SIG_E20E1={
  sim:"sim/eupho2020_E1_web.html", tag:"EuPhO 2020 E1", span:58, rate:24,
  capL:{ko:"주최측 콘솔 프로그램 · 전자빔을 쏘아 숨은 전하를 찾는다",
        en:"The organisers' console program · fire the beam, hunt the hidden charge"},
  capR:{ko:"스크린 도달점",en:"landing"},
  /* EuPhO published the C++ source; these are its own numbers */
  RP:[0.05435205,-0.0259338,-0.1150416], QP:-8.62193e-11,
  ME:9.10938356e-31, E0:1.60217662e-19, KE:8.9875517923e9,
  solve(x0,y0,v0){
    const RP=this.RP;
    const acc=(x,y,z)=>{ const r2=x*x+y*y+z*z;
      const k=-this.KE*this.QP*this.E0/(r2*Math.sqrt(r2))/this.ME;
      return [k*x,k*y,k*z]; };
    let dx=x0-RP[0], dy=y0-RP[1], dz=-10-RP[2];
    let vx=0, vy=0, vz=v0;
    for(let i=0;i<400000;i++){
      const rx=dx+RP[0], ry=dy+RP[1], rz=dz+RP[2];
      if(Math.sqrt(rx*rx+ry*ry+rz*rz)>1000) break;
      const a=acc(dx,dy,dz);
      const dt=100/Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]);
      const b=acc(dx+vx*dt,dy+vy*dt,dz+vz*dt);
      const ex=0.5*(a[0]+b[0]), ey=0.5*(a[1]+b[1]), ez=0.5*(a[2]+b[2]);
      const hf=0.5*dt*dt;
      dx+=vx*dt+ex*hf; dy+=vy*dt+ey*hf; dz+=vz*dt+ez*hf;
      vx+=ex*dt; vy+=ey*dt; vz+=ez*dt;
      if(dz+RP[2]>0){ const px=dx+RP[0], py=dy+RP[1];
        const on=px>=-0.2&&px<=0.2&&py>=-0.2&&py<=0.2;
        return [on,px,py]; }
    }
    return [false,0,0];
  },
  RUNS:[[1000,0,0],[1000,4,-2],[4000,6,-3]],
  build(){
    if(this._f) return this._f;
    const sep=new Array(49).join("-");
    const g=x=>String(Math.round(x*1e6)/1e6);
    const f=[];
    this._hit=[];
    for(const run of this.RUNS){
      const r=this.solve(run[1]/100,run[2]/100,Math.sqrt(2*run[0]*this.E0/this.ME));
      this._hit.push(r);
      f.push({s:"Beam accelerating voltage in V: ",ans:String(run[0])});
      f.push({s:"x-coordinate of the electron beam in cm: ",ans:String(run[1])});
      f.push({s:"y-coordinate of the electron beam in cm: ",ans:String(run[2])});
      f.push({s:"Electron beam fired with parameters (x, y, V) = ("+
                g(run[1])+"cm, "+g(run[2])+"cm, "+g(run[0])+"V)"});
      f.push(r[0] ? {s:"Electron detected at (x, y) = ("+(r[1]*100).toFixed(1)+
                       "cm, "+(r[2]*100).toFixed(1)+"cm)",acc:true}
                  : {s:"Electron not detected...",dim:true});
      f.push({s:sep,dim:true});
    }
    this._f=f; this._n=termLen(f);
    return f;
  },
  read(t){ this.build();
    const k=Math.min(this.RUNS.length-1,Math.floor(t/(this.span/this.RUNS.length)));
    const r=this._hit[k];
    return r[0] ? (r[1]*100).toFixed(1)+", "+(r[2]*100).toFixed(1)+" cm" : "\u2014"; },
  paint(c,w,h,t){
    const f=this.build();
    termPaint(c,w,h,"EuPhO 2020 Experiment 1 \u2014 Hidden Charge",f,
              Math.round(t*this._n/this.span));

const SIG_E20E2={

/* only the ones the site actually publishes a browser build for */
function liveSigs(){
  const have=new Set();
  for(const k in DATA) for(const y of DATA[k].years)
    for(const p of (y.problems||[])){
      if(p.hold) continue;
      if(p.files&&(p.files.sim||p.files.exe||p.files.src)) have.add(DATA[k].abbr+" "+y.y+" "+p.id);
    }
  const ok=ALL_SIGS.filter(s=>have.has(s.tag));
  return ok.length?ok:ALL_SIGS;
}
/* a cover without a browser build sends you to its year instead */
function heroHref(sig){
  if(sig.sim) return sig.sim+(sig.sim.includes("?")?"&":"?")+"lang="+lang;
  const p=sig.tag.split(" ");
  return "#/"+p[0].toLowerCase()+"/"+p[1];
}
function pickHero(){
  const ok=liveSigs();
  heroPick=ok[Math.floor(Math.random()*ok.length)];
  return heroPick;
}

function startHero(){
  const cv=document.getElementById("deflect"); if(!cv||!heroPick) return;
  const ctx=cv.getContext("2d"), sig=heroPick;
  const dpr=Math.min(devicePixelRatio||1,2);
  function fit(){
    const w=cv.clientWidth||660;
    cv.width=Math.round(w*dpr); cv.height=Math.round(w*.74*dpr);
    cv.style.height=(w*.74)+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit();
  const clock=document.getElementById("figClock");
  const show=t=>{ sig.paint(ctx,cv.clientWidth,cv.clientWidth*.74,t);
                  if(clock) clock.textContent=sig.read(t); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ show(sig.span); return; }
  const rate=sig.rate||1;
  let t0=null;
  (function loop(now){
    if(t0===null)t0=now;
    show(Math.max(0,(now-t0)/1000*rate)%(sig.span*1.18));   /* the first frame can be stamped before t0 */
    animId=requestAnimationFrame(loop);
  })(performance.now());
  addEventListener("resize",()=>{fit();});
}

  let o=""; try{ o=localStorage.getItem("hlCmApi")||""; }catch(e){}
  return (o||COMMUNITY_API).replace(/\/+$/,"");
}
function cmTok(v){
  try{
    if(v===undefined) return localStorage.getItem("hlCmTok")||"";
    if(v) localStorage.setItem("hlCmTok",v); else localStorage.removeItem("hlCmTok");
  }catch(e){ return ""; }
}
async function cmApi(method, path, body){
  const h={};
  const raw=body instanceof Blob;
  if(body) h["Content-Type"]=raw?body.type:"application/json";
  const t=cmTok(); if(t) h.Authorization="Bearer "+t;
  let r;
  try{ r=await fetch(cmBase()+"/api"+path,{method,headers:h,body:body?(raw?body:JSON.stringify(body)):undefined}); }
  catch(e){ throw {code:"network"}; }
  const j=await r.json().catch(()=>({error:"server_error"}));
  if(!r.ok){
    if(r.status===401 && j.error==="login_required" && t){ cmTok(null); cm.me=null; }
    throw {code:j.error||"server_error", status:r.status};
  }
  return j;
}
/* who is signed in and the server's settings: asked for once and shared by every view that needs them
   (the settings are also kept for ten minutes, so a reload skips that request) */
let cmMeP=null, cmHealthP=null;
function cmLoadMe(){
  if(cm.meChecked||!cmTok()) return Promise.resolve(cm.me);
  return cmMeP||(cmMeP=cmApi("GET","/me").then(r=>{cm.me=r.user;},()=>{}).then(()=>{cm.meChecked=true; cmMeP=null; return cm.me;}));
}
function cmHealth(){
  if(cmHealthP) return cmHealthP;
  try{ const c=JSON.parse(sessionStorage.getItem("hlCmHealth")||"null"); if(c && Date.now()-c.t<600000 && c.base===cmBase()) return cmHealthP=Promise.resolve(c.h); }catch(e){}
  return cmHealthP=cmApi("GET","/health").then(h=>{ try{ sessionStorage.setItem("hlCmHealth",JSON.stringify({t:Date.now(),base:cmBase(),h})); }catch(e){} return h; },()=>{ cmHealthP=null; return {v:0}; });
}
const cmErr = e => { const T=CMT[lang]; return T.err[e&&e.code]||T.err.server_error; };
/* a nickname field that asks the server, while it is typed, whether the name is free (the rule the server
   applies on submit: compatibility forms folded, case ignored).  Returns a function that resolves to
   true/false/null (null: the check could not be made, e.g. an older server — submitting decides then). */
function cmNickCheck(input, out, current){
  let seq=0, timer=null;
  const say=(cls,msg)=>{ out.className="cmnick"+(cls?" "+cls:""); out.textContent=msg||""; };
  const run=async()=>{
    const T=CMT[lang], v=input.value.trim(), my=++seq;
    if(!v){ say("",""); return null; }
    if(current && v===current){ say("",T.nickSame); return true; }
    say("",T.nickChecking);
    try{
      const r=await cmApi("GET","/nick-check?n="+encodeURIComponent(v));
      if(my===seq){ if(r.ok) say("ok",r.same?T.nickSame:T.nickFree); else say("no",cmErr({code:r.error})); }
      return !!r.ok;
    }catch(e){ if(my===seq) say("",""); return null; }
  };
  input.addEventListener("input",()=>{ clearTimeout(timer); timer=setTimeout(run,350); });
  input.addEventListener("blur",()=>{ clearTimeout(timer); run(); });
  return ()=>{ clearTimeout(timer); return run(); };
}
function cmToast(msg){ const d=document.createElement("div"); d.className="cmtoast"; d.textContent=msg; document.body.append(d); setTimeout(()=>d.remove(),2200); }

const p2 = n => String(n).padStart(2,"0");
function cmTime(s){                            /* "3분 전", "2시간 전", then the date */
  const T=CMT[lang], d=Math.floor(Date.now()/1000)-s;
  if(d<60) return T.justNow;
  if(d<3600) return Math.floor(d/60)+T.minAgo;
  if(d<86400) return Math.floor(d/3600)+T.hrAgo;
  if(d<86400*7) return Math.floor(d/86400)+T.dayAgo;
  const D=new Date(s*1000); return `${D.getFullYear()}.${p2(D.getMonth()+1)}.${p2(D.getDate())}`;
}
function cmShort(s){                           /* the list's date column: time today, month.day before */
  const D=new Date(s*1000), N=new Date();
  return D.toDateString()===N.toDateString() ? `${p2(D.getHours())}:${p2(D.getMinutes())}` : `${p2(D.getMonth()+1)}.${p2(D.getDate())}`;
}
function cmFull(s){ const D=new Date(s*1000); return `${D.getFullYear()}.${p2(D.getMonth()+1)}.${p2(D.getDate())} ${p2(D.getHours())}:${p2(D.getMinutes())}`; }
/* escape first, then turn bare URLs into links — the text itself is never HTML */
function cmFmt(s){
  return esc(s).replace(/https?:\/\/[^\s<>"]+[^\s<>".,;:!?)\]'’]/g,
    u=>`<a href="${u}" target="_blank" rel="noopener nofollow ugc">${u}</a>`);
}
const cmName = o => o.gone ? CMT[lang].gone : esc(o.nickname);
function cmAv(name, cls, av){                  /* the profile picture, or a letter avatar coloured by the name */
  if(av && /^[A-Za-z0-9_-]{8,32}$/.test(av)) return `<img class="cmav ${cls||""}" src="${cmBase()}/api/avatar/${av}" alt="" loading="lazy" decoding="async">`;
  const n=String(name||"?"); let h=0; for(const ch of n) h=(h*31+ch.codePointAt(0))>>>0;
  const hue=h%360; return `<span class="cmav ${cls||""}" style="background:hsl(${hue} 55% 46%)">${esc([...n][0]||"?").toUpperCase()}</span>`;
}
const cmTag = t => t ? `<span class="cmtag ${esc(t)}">${CMT[lang].tags[t]||esc(t)}</span>` : "";
const cmScore = p => (p.n_likes||0)-(p.n_dislikes||0);

function cmHash(){
  const raw=location.hash.replace(/^#\/?/,"");
  const i=raw.indexOf("?");
  const parts=(i<0?raw:raw.slice(0,i)).split("/").filter(Boolean).slice(1);
  const q=new URLSearchParams(i<0?"":raw.slice(i+1));
  return {parts,q};
}
function cmGoLogin(){
  try{ sessionStorage.setItem("hlCmBack",location.hash); }catch(e){}
  location.hash="#/community/login";
}
function cmBack(){
  let b=""; try{ b=sessionStorage.getItem("hlCmBack")||""; sessionStorage.removeItem("hlCmBack"); }catch(e){}
  location.hash = (b && !/\/(login|signup)\b/.test(b)) ? b : "#/community";
}
/* list URLs: #/community/<all|best|hot|board>/<page>?tag=&sort=&q=&field= */
function cmListHref(o){
  const qs=new URLSearchParams();
  for(const k of ["tag","sort","q","field"]) if(o[k]) qs.set(k,o[k]);
  const s=qs.toString(); return `#/community/${o.where||"all"}/${o.page||1}${s?"?"+s:""}`;
}

  const T=CMT[lang];
  return `
  <div class="shell cm">
    <div class="cmtop"><div><h1>${T.h}</h1><p>${T.sub}</p></div></div>
    <div class="cmgrid">

    </div>

function cmRailHtml(active){
  const T=CMT[lang], B=cm.boards||{};
  const logo=(document.querySelector(".mark img")||{}).src||"og.png";
  const ch=(k,label,icon,extra)=>`<a class="ch ${active===k?"on":""}" href="#/community/${k}"><span class="hash">${icon}</span>${label}${extra||""}</a>`;
  const cnt=k=>{ const b=B[k]; if(!b) return ""; return b.today>0 ? `<span class="new">${b.today}</span>` : `<span class="cnt">${b.n}</span>`; };
  const me = cm.me
    ? `<div class="me">${cmAv(cm.me.nickname,"",cm.me.avatar)}<div style="min-width:0"><div class="nm">${esc(cm.me.nickname)}</div><div class="sub">@${esc(cm.me.username)}</div></div>
         <div class="ops"><a href="#/community/account" title="${T.account}">⚙</a><button type="button" data-cm="logout" title="${T.logout}">⎋</button></div></div>`
    : `<div class="auth"><a class="pri" href="#/community/login">${T.login}</a><a class="sec2" href="#/community/signup">${T.signup}</a></div>`;
  return `<div class="srv"><img src="${logo}" alt=""><b>HaslaLab</b></div>
    <div class="servers">${[["ko","🇰🇷","한국어 서버"],["en","🇬🇧","English server"]].map(([l,f,n])=>`<button type="button" class="${lang===l?"on":""}" data-srv="${l}" title="${n}"><span>${f}</span>${n}</button>`).join("")}</div>
    <div class="sec">${T.secMore}</div>
    ${ch("all",T.all,"≡")}${ch("best",T.best,"★")}${ch("hot",T.hot,"🔥")}
    <div class="sec">${T.secBoards}</div>
    ${CM_BOARDS.map(b=>ch(b,T.boards[b],"#",cnt(b))).join("")}
    <div class="sec">${DCT[lang].sec}</div>
    <a class="ch dc ${active==="discord"?"on":""}" href="#/community/discord"><span class="hash">${DC_SVG}</span>${DISCORD.name}<span class="on" id="dcOn">${dcInfo?"● "+dcNum(dcInfo.online):""}</span></a>
    ${me}`;
}
async function cmRight(where){
  const el=document.getElementById("cmRight"); if(!el) return;
  const T=CMT[lang], B=cm.boards||{}, isB=CM_BOARDS.includes(where);
  const tot=isB ? (B[where]||{n:0,today:0}) : Object.values(B).reduce((a,b)=>({n:a.n+(b.n||0),today:a.today+(b.today||0)}),{n:0,today:0});
  el.innerHTML=`
    <div class="cmside"><h3>${T.aboutH}</h3><div class="in">${T.boardDesc[where]||T.boardDesc.all}
      <div class="stat"><div><b>${tot.n}</b><span>${T.stPosts}</span></div><div><b>${tot.today}</b><span>${T.stToday}</span></div></div></div></div>
    <div class="cmside dcside"><h3>💬 ${DCT[lang].side}</h3><div class="in" id="dcSide"></div></div>
    <div class="cmside"><h3>🔥 ${T.hotH}</h3><div class="in hot" id="cmHot">…</div></div>
    <div class="cmside"><h3>${T.rulesH}</h3><div class="in"><ol>${T.rules.map(r=>`<li>${r}</li>`).join("")}</ol></div></div>`;
  const dcSide=()=>{ const x=document.getElementById("dcSide"); if(x) x.innerHTML=`${dcIcon()?`<img src="${dcIcon()}" alt="">`:`<img alt="">`}<div style="min-width:0"><div class="nm">${DISCORD.name}</div>
      <div class="ct">● ${dcNum(dcInfo&&dcInfo.online)} ${DCT[lang].online}</div></div><a class="j" href="#/community/discord">${lang==="ko"?"열기":"Open"}</a>`;
    const on=document.getElementById("dcOn"); if(on&&dcInfo) on.textContent="● "+dcNum(dcInfo.online); };
  dcSide(); dcLoad().then(dcSide);
  try{
    const j=await cmApi("GET","/posts?sort=hot&page=1&lang="+lang+(isB?"&board="+where:""));
    const h=document.getElementById("cmHot"); if(!h) return;
    const top=j.posts.slice(0,6);
    h.innerHTML=top.length ? top.map(p=>`<a href="#/community/post/${p.id}"><em>${cmScore(p)}</em><span>${esc(p.title)}</span></a>`).join("") : `<span>${T.empty}</span>`;
  }catch(e){ const h=document.getElementById("cmHot"); if(h) h.textContent=""; }
}

async function cmMount(){
  const root=document.getElementById("cmRoot");
  if(!root) return;
  const T=CMT[lang], my=++cm.seq;
  const alive=()=>my===cm.seq && document.getElementById("cmRoot")===root;
  if(!cmBase()){ root.innerHTML=`<div class="cmnote">${T.off}</div>`; return; }
  const {parts,q}=cmHash();
  const [a,b]=parts;
  const where = a==="post"||a==="write"||a==="edit"||a==="login"||a==="signup"||a==="account"||a==="discord" ? "" : (CM_BOARDS.includes(a)||a==="best"||a==="hot" ? a : "all");
  /* who is signed in, the server's version and the board counts — once, then from memory */
  try{
    const jobs=[];
    jobs.push(cmLoadMe());
    if(!cm.v) jobs.push(cmHealth().then(r=>{cm.v=r.v||1;}));
    if(cm.boardsLang!==lang) cm.boards=null;
    if(!cm.boards){ cm.boardsLang=lang; jobs.push(cmApi("GET","/boards?lang="+lang).then(r=>{cm.boards={}; for(const x of r.boards) cm.boards[x.board]={n:x.n,today:x.today||0};}).catch(()=>{cm.boards={};})); }
    await Promise.all(jobs); cm.meChecked=true;
  }catch(e){}
  if(!alive()) return;
  const rail=document.getElementById("cmRail"); if(rail) rail.innerHTML=cmRailHtml(where||a);
  try{
    if(a==="post" && b)                 await cmPost(root,+b,alive);
    else if(a==="write")                cmWrite(root,null,CM_BOARDS.includes(b)?b:"free");
    else if(a==="edit" && b)            await cmEdit(root,+b,alive);
    else if(a==="login")                cmLogin(root);
    else if(a==="signup")               cmSignup(root);
    else if(a==="account")              await cmAccount(root,alive);
    else if(a==="discord")              cmDiscord(root);
    else                                await cmList(root,{where,page:Math.max(1,parseInt(b)||1),tag:q.get("tag")||"",sort:q.get("sort")||"",q:q.get("q")||"",field:q.get("field")||""},alive);
  }catch(e){
    if(alive()) root.innerHTML=`<div class="cmnote">${esc(cmErr(e))}</div>`;
  }
  if(!alive()) return;
  cmWire(document.querySelector(".cm"));
  const right=document.getElementById("cmRight");
  if(right){ if(["login","signup"].includes(a)) right.innerHTML=""; else cmRight(where||"all"); }
}
function cmWire(scope){
  if(!scope) return;
  scope.querySelectorAll("[data-srv]").forEach(el=>el.onclick=()=>{ if(el.dataset.srv!==lang) setLang(el.dataset.srv); });
  scope.querySelectorAll("[data-cm]").forEach(el=>el.onclick=async()=>{
    const k=el.dataset.cm;
    if(k==="login") cmGoLogin();
    if(k==="logout"){ try{ await cmApi("POST","/logout"); }catch(e){} cmTok(null); cm.me=null; cmMount(); }
  });
}
/* voting from anywhere: list cards and the post itself */
async function cmVote(id, v){
  if(!cm.me){ cmGoLogin(); return null; }
  if(cm.v<2 && v<0) return null;
  try{ return cm.v>=2 ? await cmApi("POST",`/posts/${id}/vote`,{v}) : await cmApi("POST",`/posts/${id}/like`); }
  catch(e){ cmToast(cmErr(e)); return null; }
}

async function cmList(root, o, alive){
  const T=CMT[lang], qs=new URLSearchParams({page:o.page, lang});
  if(CM_BOARDS.includes(o.where)) qs.set("board",o.where);
  if(o.where==="best") qs.set("best","1");
  const sort=o.sort||(o.where==="hot"?"hot":"new"); qs.set("sort",sort);
  if(o.tag) qs.set("tag",o.tag); if(o.q){ qs.set("q",o.q); qs.set("field",o.field||"all"); }
  const j=await cmApi("GET","/posts?"+qs);
  if(!alive()) return;
  const name = CM_BOARDS.includes(o.where) ? T.boards[o.where] : o.where==="best" ? T.best : o.where==="hot" ? T.hot : T.all;
  const icon = CM_BOARDS.includes(o.where) ? "#" : o.where==="best" ? "★" : o.where==="hot" ? "🔥" : "≡";
  const href = x => cmListHref({...o, page:1, ...x});
  const isNew = p => Date.now()/1000-p.created_at < 12*3600;
  const total=j.total, notices=j.notices||[];
  const no = i => total-((o.page-1)*j.per)-i;
  let body;
  if(!j.posts.length && !notices.length) body=`<p class="cmempty">${o.q?T.noResult:T.empty}</p>`;
  else if(cm.view==="card"){
    const card=p=>`<div class="cmcard" data-id="${p.id}">
        <div class="cmvote"><button class="up" type="button" data-v="1" aria-label="${T.up}">▲</button><b>${cmScore(p)}</b><button class="dn" type="button" data-v="-1" aria-label="${T.down}">▼</button></div>
        <div class="bd"><div class="mt">${cmTag(p.tag)}<b>${T.boards[p.board]||p.board}</b> · ${cmAv(p.gone?"?":p.nickname,"s",p.gone?null:p.av)} ${cmName(p)} · ${cmTime(p.created_at)}${isNew(p)?'<span class="nb">N</span>':""}</div>
          <h3><a href="#/community/post/${p.id}">${esc(p.title)}</a></h3>
          ${p.snip?`<div class="sn">${esc(p.snip)}</div>`:""}
          <div class="ft"><span>💬 ${p.n_comments} ${T.comments}</span><span>👁 ${p.views}</span></div></div></div>`;
    body=`<div class="cmcards">${[...notices,...j.posts].map(card).join("")}</div>`;
  } else {
    const row=(p,i,nt)=>`<tr class="${nt?"nt":""}">
        <td class="c-no">${nt?`<span class="cmtag notice">${T.tags.notice}</span>`:no(i)}</td>
        <td class="c-tag">${nt?"":cmTag(p.tag)}</td>
        <td class="t">${cmScore(p)>=3&&!nt?'<span class="bs">★</span>':""}<a href="#/community/post/${p.id}">${esc(p.title)}</a>${p.n_comments?`<span class="cc">[${p.n_comments}]</span>`:""}${isNew(p)?'<span class="nb">N</span>':""}
          <div class="mm">${cmTag(p.tag)} ${cmName(p)} · ${cmShort(p.created_at)} · ${T.views} ${p.views} · ${T.cols.r} ${cmScore(p)}</div></td>
        <td class="c-au">${cmName(p)}</td><td class="c-dt">${cmShort(p.created_at)}</td><td class="c-v">${p.views}</td><td class="c-r">${cmScore(p)}</td></tr>`;
    body=`<table class="cmtbl"><thead><tr><th class="c-no">${T.cols.no}</th><th class="c-tag">${T.cols.tag}</th><th>${T.cols.title}</th><th class="c-au">${T.cols.au}</th><th class="c-dt">${T.cols.dt}</th><th class="c-v">${T.cols.v}</th><th class="c-r">${T.cols.r}</th></tr></thead>
      <tbody>${notices.map((p,i)=>row(p,i,true)).join("")}${j.posts.map((p,i)=>row(p,i,false)).join("")}</tbody></table>`;
  }
  const pages=Math.max(1,Math.ceil(total/j.per)), ph=n=>cmListHref({...o,page:n});
  let pg=""; const lo=Math.max(1,o.page-4), hi=Math.min(pages,lo+9);
  if(o.page>1) pg+=`<a href="${ph(1)}">«</a><a href="${ph(o.page-1)}">‹</a>`;
  for(let n=lo;n<=hi;n++) pg+= n===o.page?`<span>${n}</span>`:`<a href="${ph(n)}">${n}</a>`;
  if(o.page<pages) pg+=`<a href="${ph(o.page+1)}">›</a><a href="${ph(pages)}">»</a>`;
  const writeTo = CM_BOARDS.includes(o.where) ? "/"+o.where : "";
  root.innerHTML=`<div class="cmpanel">
    <div class="cmbh"><div><h2><span>${icon}</span> ${name}</h2><p>${T.boardDesc[o.where]||""}</p></div><span class="sp"></span>
      ${cm.me?`<a class="cmbtn cmm" href="#/community/account">${cmAv(cm.me.nickname,"s",cm.me.avatar)}</a>`:`<a class="cmbtn cmm" href="#/community/login">${T.login}</a>`}
      <a class="cmbtn pri" href="#/community/write${writeTo}">✎ ${T.write}</a></div>
    <div class="cmbar2">
      <div class="cmseg"><a href="${cmListHref({...o,where:CM_BOARDS.includes(o.where)?o.where:"all",page:1})}" class="${o.where!=="best"?"on":""}">${T.all}</a><a href="${cmListHref({...o,where:"best",page:1})}" class="${o.where==="best"?"on":""}">★ ${T.best}</a></div>
      <div class="cmtags"><a href="${href({tag:""})}" class="${!o.tag?"on":""}">${T.tagAll}</a>${CM_TAGS.filter(t=>t!=="notice").map(t=>`<a href="${href({tag:t})}" class="${o.tag===t?"on":""}">${T.tags[t]}</a>`).join("")}</div>
      <span class="sp"></span>
      <select class="cmsel" id="cmSort" aria-label="sort">${Object.entries(T.sorts).map(([k,v])=>`<option value="${k}" ${sort===k?"selected":""}>${v}</option>`).join("")}</select>
      <div class="cmseg"><button type="button" data-view="list" class="${cm.view==="list"?"on":""}">☰ ${T.vList}</button><button type="button" data-view="card" class="${cm.view==="card"?"on":""}">▦ ${T.vCard}</button></div>
    </div>
    ${body}
    <div class="cmfoot">
      ${pages>1?`<nav class="cmpg">${pg}</nav>`:""}
      <form class="cmsrch" id="cmSearch" role="search">
        <select class="cmsel" name="field" style="width:auto">${[["all",T.fAll],["title",T.fTitle],["author",T.fAuthor]].map(([k,v])=>`<option value="${k}" ${(o.field||"all")===k?"selected":""}>${v}</option>`).join("")}</select>
        <input type="search" name="q" value="${esc(o.q)}" placeholder="${T.searchPh}" aria-label="${T.search}">
        <button class="cmbtn" type="submit">${T.search}</button>
      </form>
    </div></div>`;
  root.querySelector("#cmSort").onchange=e=>{ location.hash=cmListHref({...o,page:1,sort:e.target.value}); };
  root.querySelectorAll("[data-view]").forEach(bn=>bn.onclick=()=>{ cm.view=bn.dataset.view; try{localStorage.setItem("hlCmView",cm.view);}catch(e){} cmMount(); });
  root.querySelector("#cmSearch").onsubmit=e=>{ e.preventDefault(); const f=e.target; location.hash=cmListHref({...o,page:1,q:f.q.value.trim(),field:f.field.value}); };
  root.querySelectorAll(".cmcard").forEach(cd=>cd.querySelectorAll(".cmvote button").forEach(bn=>bn.onclick=async()=>{
    const r=await cmVote(+cd.dataset.id,+bn.dataset.v); if(!r) return;
    cd.querySelector(".cmvote b").textContent=(r.n_likes||0)-(r.n_dislikes||0);
    cd.querySelector(".up").classList.toggle("on",r.my===1||r.liked===true); cd.querySelector(".dn").classList.toggle("on",r.my===-1);
  }));
}

async function cmPost(root, id, alive){
  const T=CMT[lang];
  /* count a view once per tab, not on every redraw */
  let seen=false; try{ seen=sessionStorage.getItem("hlCmSeen"+id)==="1"; sessionStorage.setItem("hlCmSeen"+id,"1"); }catch(e){}
  const j=await cmApi("GET",`/posts/${id}${seen?"":"?view=1"}`);
  if(!alive()) return;
  const p=j.post, my=j.my!==undefined ? j.my : (j.liked?1:0);
  let order=cm.cmtOrder||"old";
  const tops=j.comments.filter(c=>!c.parent_id), kids=id=>j.comments.filter(c=>c.parent_id===id);

function cmWrite(root, post, board){
  const T=CMT[lang];
  if(!cm.me){ cmGoLogin(); return; }
  const key=post?"e"+post.id:"new";
  const d=cm.draft[key]||(post?{board:post.board,tag:post.tag||"gen",title:post.title,body:post.body}:{board,tag:"gen",title:"",body:""});
  const tags=CM_TAGS.filter(t=>t!=="notice"||(cm.me&&cm.me.role==="admin"));
  root.innerHTML=`<div class="cmpanel">
    <div class="cmbh"><h2>✎ ${post?T.editPost:T.newPost}</h2></div>
    <form class="cmform" id="cmW">
      <div class="two">
        <label>${T.board}<select name="board">${CM_BOARDS.map(b=>`<option value="${b}" ${b===d.board?"selected":""}>${T.boards[b]}</option>`).join("")}</select></label>
        <label>${T.tag}<select name="tag">${tags.map(t=>`<option value="${t}" ${t===d.tag?"selected":""}>${T.tags[t]}</option>`).join("")}</select></label>
      </div>
      <label>${T.title}<input type="text" name="title" maxlength="120" required value="${esc(d.title)}" placeholder="${T.titlePh}"></label>
      <div class="row"><div class="cmseg"><button type="button" data-tab="w" class="on">${T.editTab}</button><button type="button" data-tab="p">${T.preview}</button></div>
        <span class="sp"></span><span class="cnt" id="cmCnt"></span></div>
      <textarea class="big" name="body" maxlength="20000" required placeholder="${T.bodyPh}">${esc(d.body)}</textarea>
      <div class="cmprev" hidden></div>
      <div class="row"><span class="cmerr"></span><span class="sp"></span>
        <a class="cmbtn" href="${post?"#/community/post/"+post.id:"#/community/"+d.board}">${T.cancel}</a>
        <button class="cmbtn pri" type="submit">${post?T.save:T.post}</button></div>
    </form></div>`;
  const f=root.querySelector("#cmW"), cnt=root.querySelector("#cmCnt"), prev=root.querySelector(".cmprev");
  const count=()=>{ cnt.textContent=`${f.body.value.length.toLocaleString()} / 20,000`; };
  count();
  /* a language switch redraws the page — keep what was typed */
  f.oninput=()=>{ cm.draft[key]={board:f.board.value,tag:f.tag.value,title:f.title.value,body:f.body.value}; count(); };
  root.querySelectorAll("[data-tab]").forEach(bn=>bn.onclick=()=>{
    const p=bn.dataset.tab==="p"; root.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===bn));
    f.body.hidden=p; prev.hidden=!p; if(p) prev.innerHTML=cmFmt(f.body.value)||"&nbsp;";
  });
  f.onsubmit=async e=>{
    e.preventDefault();
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    const data={board:f.board.value,tag:f.tag.value,title:f.title.value,body:f.body.value,lang};   /* a post belongs to the server it is written on */
    try{
      if(post){ await cmApi("PATCH",`/posts/${post.id}`,data); delete cm.draft[key]; location.hash=`#/community/post/${post.id}`; }
      else{ const r=await cmApi("POST","/posts",data); delete cm.draft[key]; cm.boards=null; location.hash=`#/community/post/${r.id}`; }
    }catch(er){ f.querySelector(".cmerr").textContent=cmErr(er); btn.disabled=false; }
  };
}

/* the profile picture: the person picks the square to keep (drag, zoom, rotate), it is drawn at 256×256 and
   kept under 60 KB.  Resolves to the picture, or null when cancelled. */
async function cmCropAvatar(file){
  let img;
  try{ img=await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ try{ img=await createImageBitmap(file); }catch(e2){ throw {code:"bad_image"}; } }
  const T=CMT[lang], OUT=256, srcW=img.width, srcH=img.height;
  let src=img;                                                 // the (possibly rotated) picture being cropped
  let k, cx, cy, zoom=1;                                       // k: screen px per picture px at zoom 1 (cover); cx,cy: picture point in the middle
  const ov=document.createElement("div"); ov.className="cmcrop";
  ov.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h3>${T.cropH}</h3><p>${T.cropHint}</p><canvas></canvas>
    <div class="ctl"><span>${T.cropZoom}</span><input type="range" min="1" max="5" step="0.01" value="1" aria-label="${T.cropZoom}"></div>
    <div class="meta"></div>
    <div class="btns"><button type="button" class="cmbtn" data-rot>${T.cropRotate}</button><button type="button" class="cmbtn" data-reset>${T.cropReset}</button>
      <span style="flex:1"></span><button type="button" class="cmbtn" data-no>${T.cropCancel}</button><button type="button" class="cmbtn pri" data-ok>${T.cropApply}</button></div></div>`;
  document.body.append(ov);
  const cv=ov.querySelector("canvas"), g=cv.getContext("2d"), rng=ov.querySelector("input[type=range]"), meta=ov.querySelector(".meta");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const V=()=>cv.width;                                        // the square on screen, in canvas pixels
  const scale=()=>k*zoom;
  const fit=()=>{ k=V()/Math.min(src.width,src.height); };
  const clamp=()=>{ const h=V()/2/scale(); cx=Math.min(src.width-h,Math.max(h,cx)); cy=Math.min(src.height-h,Math.max(h,cy)); };
  const reset=()=>{ zoom=1; rng.value="1"; fit(); cx=src.width/2; cy=src.height/2; draw(); };
  function draw(){
    clamp();
    const s=scale(), n=V();
    g.setTransform(1,0,0,1,0,0); g.fillStyle="#111"; g.fillRect(0,0,n,n);
    g.imageSmoothingQuality="high";
    g.drawImage(src, n/2-cx*s, n/2-cy*s, src.width*s, src.height*s);
    /* what the round avatar hides, dimmed; the square that is saved, outlined */
    g.fillStyle="rgba(0,0,0,.5)"; g.beginPath(); g.rect(0,0,n,n); g.arc(n/2,n/2,n/2-1,0,Math.PI*2,true); g.fill("evenodd");
    g.strokeStyle="rgba(255,255,255,.85)"; g.lineWidth=2*dpr; g.beginPath(); g.arc(n/2,n/2,n/2-dpr,0,Math.PI*2); g.stroke();
    const side=Math.round(n/s);
    meta.textContent=`${T.cropSrc} ${srcW}×${srcH}px · ${side}×${side}px → ${T.cropOut} ${OUT}×${OUT}px`;
  }
  const size=()=>{ const w=Math.round(cv.getBoundingClientRect().width*dpr)||300; if(cv.width!==w){ cv.width=cv.height=w; fit(); draw(); } };
  cv.width=cv.height=Math.round((cv.getBoundingClientRect().width||300)*dpr); reset();
  /* drag to move, wheel or two fingers to zoom (about the point under them) */
  const pts=new Map(); let pinch=null;
  const zoomTo=(z,px,py)=>{ z=Math.max(1,Math.min(5,z)); const n=V(), s0=scale();
    const ix=cx+(px-n/2)/s0, iy=cy+(py-n/2)/s0; zoom=z; const s1=scale(); cx=ix-(px-n/2)/s1; cy=iy-(py-n/2)/s1; rng.value=String(z); draw(); };
  const local=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]; };
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,local(e)); if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:zoom}; } });
  cv.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; const p=local(e), q=pts.get(e.pointerId); pts.set(e.pointerId,p);
    if(pts.size===2&&pinch){ const [a,b]=[...pts.values()]; zoomTo(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2); }
    else if(pts.size===1){ cx-=(p[0]-q[0])/scale(); cy-=(p[1]-q[1])/scale(); draw(); } });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{ e.preventDefault(); const [x,y]=local(e); zoomTo(zoom*Math.exp(-e.deltaY*0.0015),x,y); },{passive:false});
  rng.oninput=()=>{ const n=V(); zoomTo(+rng.value,n/2,n/2); };
  ov.querySelector("[data-reset]").onclick=reset;
  ov.querySelector("[data-rot]").onclick=()=>{                // turn the picture itself a quarter, keeping the same middle
    const r=document.createElement("canvas"); r.width=src.height; r.height=src.width;
    const rg=r.getContext("2d"); rg.translate(r.width,0); rg.rotate(Math.PI/2); rg.drawImage(src,0,0);
    const ncx=src.height-cy, ncy=cx; src=r; fit(); cx=ncx; cy=ncy; draw(); };
  addEventListener("resize",size);
  const done=v=>{ removeEventListener("resize",size); removeEventListener("keydown",key); ov.remove(); return v; };
  const key=e=>{ if(e.key==="Escape") finish(null); };
  addEventListener("keydown",key);
  let finish;
  const picked=await new Promise(res=>{
    finish=res;
    ov.querySelector("[data-no]").onclick=()=>res(null);
    ov.addEventListener("click",e=>{ if(e.target===ov) res(null); });
    ov.querySelector("[data-ok]").onclick=()=>{ const h=V()/2/scale(); res({x:cx-h,y:cy-h,side:2*h}); };
  });
  if(!picked){ done(); return null; }
  const c=document.createElement("canvas"); c.width=c.height=OUT;
  const cg=c.getContext("2d"); cg.imageSmoothingQuality="high"; cg.fillStyle="#fff"; cg.fillRect(0,0,OUT,OUT);
  cg.drawImage(src,picked.x,picked.y,picked.side,picked.side,0,0,OUT,OUT);
  done();
  for(const [type,q] of [["image/webp",.9],["image/webp",.8],["image/jpeg",.88],["image/jpeg",.75],["image/jpeg",.6]]){
    const b=await new Promise(r=>c.toBlob(r,type,q));
    if(b && b.type===type && b.size<=60000) return b;
  }
  throw {code:"bad_image"};
}
function cmAvatarForm(box, done){
  if(!box) return;
  const inp=box.querySelector("input[type=file]"), del=box.querySelector("[data-del]"), err=box.querySelector(".cmerr");
  const set=k=>{ cm.me.avatar=k; del.hidden=!k; done(); if(typeof arChip==="function") arChip(); };
  inp.onchange=async()=>{
    const file=inp.files[0]; inp.value=""; if(!file) return; err.textContent="";
    try{ const b=await cmCropAvatar(file); if(!b) return; const r=await cmApi("PUT","/me/avatar",b); set(r.avatar); }
    catch(e){ err.textContent=cmErr(e); }
  };
  del.onclick=async()=>{ err.textContent=""; try{ await cmApi("DELETE","/me/avatar"); set(null); }catch(e){ err.textContent=cmErr(e); } };
}
async function cmAccount(root, alive){
  const T=CMT[lang];
  if(!cm.me){ cmGoLogin(); return; }
  root.innerHTML=`<div class="cmpanel">
    <div class="cmpost" style="display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--cm-line)">
      <span id="cmAvBox">${cmAv(cm.me.nickname,"l",cm.me.avatar)}</span><div><h2 style="margin:0">${esc(cm.me.nickname)}</h2>
      <div class="cmpm" style="border:0;padding:4px 0 0">@${esc(cm.me.username)} · ${T.joined} ${cmFull(cm.me.created_at).slice(0,10)}${cm.me.role==="admin"?' · <span class="cmtag notice">admin</span>':""}</div></div></div>
    <div class="cmform" id="cmAvatar"><h3 style="font-size:15px">${T.avatarH}</h3>
      <div class="row"><label class="cmbtn">${T.avatarPick}<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
      <button class="cmbtn" type="button" data-del ${cm.me.avatar?"":"hidden"}>${T.avatarDel}</button><span class="cmerr"></span><span class="sp"></span></div>
      <small style="color:var(--graphite)">${T.avatarHelp}</small></div>
    <form class="cmform" id="cmNick" style="border-top:8px solid var(--cm-soft)"><h3 style="font-size:15px">${T.nickH}</h3>
      <label>${T.nickname}<input type="text" name="nickname" value="${esc(cm.me.nickname)}" required minlength="2" maxlength="16" autocomplete="nickname"><small>${T.nicknameHelp}</small><span class="cmnick"></span></label>
      <div class="row"><span class="cmerr"></span><span class="sp"></span><button class="cmbtn pri" type="submit">${T.nickChange}</button></div></form>
    <div class="cmbh"><h2 style="font-size:1rem">${T.myPosts}</h2></div><div id="cmMine"><p class="cmempty">${T.loading}</p></div>
    <form class="cmform" id="cmPw" style="border-top:8px solid var(--cm-soft)">
      <h3 style="font-size:15px">${T.changePw}</h3>
      <div class="two"><label>${T.oldPw}<input type="password" name="old" autocomplete="current-password" required></label>
      <label>${T.newPw}<input type="password" name="password" autocomplete="new-password" required minlength="8"></label></div>
      <div class="row"><span class="cmerr"></span><span class="sp"></span><button class="cmbtn pri" type="submit">${T.save}</button></div>
    </form>
    <div class="cmform" style="border-top:8px solid var(--cm-soft)">
      <h3 style="font-size:15px">${T.delAcc}</h3>
      <p style="font-size:13px;color:var(--graphite);margin:0">${T.delAccHelp}</p>
      <div class="row"><span class="sp"></span><button class="cmbtn" type="button" id="cmDelAcc" style="color:#e03131;border-color:#ffc9c9">${T.delAcc}</button></div>
    </div></div>`;
  cmAvatarForm(root.querySelector("#cmAvatar"), ()=>{ const b=root.querySelector("#cmAvBox"); if(b) b.innerHTML=cmAv(cm.me.nickname,"l",cm.me.avatar); });
  const nf=root.querySelector("#cmNick"), nOut=nf.querySelector(".cmerr"), nickFree=cmNickCheck(nf.nickname, nf.querySelector(".cmnick"), cm.me.nickname);
  nf.onsubmit=async e=>{
    e.preventDefault(); nOut.style.color="";
    if(await nickFree()===false){ nOut.textContent=cmErr({code:"nickname_taken"}); return; }
    try{ const r=await cmApi("PATCH","/me",{nickname:nf.nickname.value.trim()}); cm.me.nickname=r.nickname; nf.nickname.value=r.nickname;
         nOut.style.color="var(--graphite)"; nOut.textContent=T.nickDone; if(typeof arChip==="function") arChip();
         const h=root.querySelector(".cmpost h2"); if(h) h.textContent=r.nickname; const b=root.querySelector("#cmAvBox"); if(b) b.innerHTML=cmAv(cm.me.nickname,"l",cm.me.avatar); }
    catch(er){ nOut.textContent=cmErr(er); }
  };
  const f=root.querySelector("#cmPw");
  f.onsubmit=async e=>{
    e.preventDefault();
    const out=f.querySelector(".cmerr");
    try{ await cmApi("POST","/me/password",{old:f.old.value,password:f.password.value});
         f.reset(); out.style.color="var(--graphite)"; out.textContent=T.pwDone; }
    catch(er){ out.style.color=""; out.textContent=cmErr(er); }
  };
  root.querySelector("#cmDelAcc").onclick=async()=>{
    if(!confirm(T.confirmDelAcc)) return;
    try{ await cmApi("DELETE","/me"); cmTok(null); cm.me=null; location.hash="#/community"; }catch(e){ cmToast(cmErr(e)); }
  };
  try{
    const l=await cmApi("GET","/posts?field=author&lang="+lang+"&q="+encodeURIComponent(cm.me.nickname)); if(!alive()) return;
    const box=document.getElementById("cmMine"); if(!box) return;
    const mine=l.posts.filter(x=>x.nickname===cm.me.nickname);
    box.innerHTML=mine.length?`<table class="cmtbl"><tbody>${mine.map(x=>`<tr><td class="c-tag">${cmTag(x.tag)}</td><td class="t"><a href="#/community/post/${x.id}">${esc(x.title)}</a>${x.n_comments?`<span class="cc">[${x.n_comments}]</span>`:""}</td><td class="c-dt">${cmShort(x.created_at)}</td><td class="c-r">${cmScore(x)}</td></tr>`).join("")}</tbody></table>`:`<p class="cmempty">${T.empty}</p>`;
  }catch(e){}
}

const SITE = "HaslaLab";
function setDocTitle(first, second){
  const d=UI[lang], parts=[];
  if(first==="about")            parts.push(d.hAbout);
  else if(first==="comps")       parts.push(d.hComps);
  else if(first==="community")   parts.push(d.navComm);
  else if(["weekly","rank","me","login","signup"].includes(first)) parts.push(d.navWeekly);
  else if(first==="lab")         parts.push(lang==="ko"?"실전 모드":"Exam mode");
  else if(first==="learn")       parts.push(second&&LEARN[second] ? `${d.navLearn} \u2014 ${LEARN[second].name[lang]}` : d.hLearn);
  else if(first && DATA[first]){
    const c=DATA[first];
    parts.push(second==="exam" ? `${c.abbr} \u2014 ${UI[lang].modeExam}` : second ? `${c.abbr} ${second}` : `${c.abbr} \u2014 ${c.full[lang]}`);
  }
  const tail = lang==="ko" ? "물리올림피아드 실험 시뮬레이터"
                           : "Physics Olympiad Experimental Simulations";
  document.title = parts.length ? `${parts[0]} \u00b7 ${SITE}` : `${SITE} \u2014 ${tail}`;
}

function mountHaslaAdFit(){
  const slots=document.querySelectorAll(".haslalab-adfit-slot");
  if(!slots.length) return;
  const desktop=matchMedia("(min-width: 768px)").matches;
  const ads=desktop
    ? {primary:{unit:"DAN-SftG79uMQrQr81Vk",width:728,height:90},secondary:{unit:"DAN-yC9q3CmZpKwsFdMz",width:728,height:90}}
    : {primary:{unit:"DAN-iGyhh2ByjtPoCpiA",width:320,height:50},secondary:{unit:"DAN-z8B8tUfB0Ev740NV",width:320,height:100}};
  slots.forEach(slot=>{
    const ad=ads[slot.dataset.adPlacement]||ads.primary;
    slot.closest(".adfit-banner").classList.toggle("adfit-banner--desktop",desktop);
    const ins=document.createElement("ins");
    ins.className="kakao_ad_area";
    ins.style.display="none";
    ins.dataset.adUnit=ad.unit;
    ins.dataset.adWidth=String(ad.width);
    ins.dataset.adHeight=String(ad.height);
    slot.append(ins);
  });
  const script=document.createElement("script");
  script.src="https://t1.kakaocdn.net/kas/static/ba.min.js";
  script.async=true;
  document.body.append(script);
}

function render(){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  const d=UI[lang];
  const parts=location.hash.replace(/^#\/?/,"").split("?")[0].split("/").filter(Boolean);
  const [first,second]=parts;

  let html, active;
  if(first==="about"){            html=viewAbout();  active="about"; }
  else if(first==="learn"){       html=second?viewLearnSubject(second):viewLearn(); active="learn"; }
  else if(first==="comps"){       html=viewComps(second);  active="comps"; }
  else if(first==="community"){   html=viewCommunity(); active="community"; }
  else if(["weekly","rank","me","login","signup","oauth","lab"].includes(first)){ html=viewArena(first); active=first==="lab"?"comps":"weekly"; }
  else if(first && DATA[first]){  html=second==="exam"?viewComp(first,"exam"):second?viewYear(first,second):viewComp(first); active="comps"; }
  else {                          html=viewHome();   active="home";  }
  document.getElementById("view").innerHTML=html;
  document.documentElement.lang = lang;
  setDocTitle(first, second);

  document.getElementById("nav").innerHTML=
    `<a href="#/" class="${active==="home"?"on":""}">${d.navHome}</a>
     <a href="#/comps" class="${active==="comps"?"on":""}">${d.navComps}</a>
     <a href="#/learn" class="${active==="learn"?"on":""}">${d.navLearn}</a>
     <a href="#/weekly" class="${active==="weekly"?"on":""}">${d.navWeekly}</a>
     <a href="#/about" class="${active==="about"?"on":""}">${d.navAbout}</a>
     <a href="#/community" class="${active==="community"?"on":""}">${d.navComm}</a>`;
  document.getElementById("footL").textContent=d.footL;
  document.getElementById("footTop").textContent=d.footTop;
  mountHaslaAdFit();

  buildRails();
  if(active==="home") startHero();
  if(active==="community") cmMount();
  if(active==="comps" && second==="exam") xmMount(first);
  if(active==="weekly"||first==="lab") arMount();
  arChip();
  if(first==="comps"){ const t=document.querySelector(".subjs a[aria-current]"); if(t){ const n=t.parentNode; n.scrollLeft+=t.getBoundingClientRect().left-n.getBoundingClientRect().left-(n.clientWidth-t.offsetWidth)/2; } }
}

addEventListener("hashchange",()=>{ render(); scrollTo({top:0,behavior:"instant"}); });
render();
</script>
