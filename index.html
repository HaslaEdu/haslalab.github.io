<style>
/* ═══════ tokens — the bench and the millimetre sheet ═══════ */
:root{
  --paper:#FBFCFD; --grid-fine:#DCE7F0; --grid-bold:#B4CADC;
  --ink:#16212E; --graphite:#5C6B7A; --rail:#2E3945;
  --laser:#E02424; --brass:#B8862B;
  --fine:8px; --bold:40px;
  --sans:"IBM Plex Sans","IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-fine) .5px,transparent .5px),
    linear-gradient(90deg,var(--grid-fine) .5px,transparent .5px),
    linear-gradient(var(--grid-bold) .6px,transparent .6px),
    linear-gradient(90deg,var(--grid-bold) .6px,transparent .6px);
  background-size:var(--fine) var(--fine),var(--fine) var(--fine),
                  var(--bold) var(--bold),var(--bold) var(--bold);
}
.shell{max-width:1180px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.shell{padding:0 18px}}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.022em}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.19em;
         text-transform:uppercase;color:var(--graphite)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--laser);outline-offset:3px;border-radius:3px}

/* ═══════ header ═══════ */
header{position:sticky;top:0;z-index:40;background:rgba(251,252,253,.87);
       backdrop-filter:blur(9px);border-bottom:1px solid var(--grid-bold)}
.hrow{display:flex;align-items:center;gap:24px;height:62px}
.mark{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:650;letter-spacing:-.03em}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--laser);flex:none;
        box-shadow:0 0 0 3px rgba(224,36,36,.16)}
.mark em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
         color:var(--graphite);text-transform:uppercase;padding-left:2px}
nav{display:flex;gap:20px;margin-left:6px}
nav a{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--graphite);
      padding:4px 0;border-bottom:1.5px solid transparent;transition:.15s}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--laser)}
/* mobile: the menu drops to its own row instead of disappearing */
@media(max-width:860px){
  .hrow{height:auto;min-height:56px;flex-wrap:wrap;align-items:center;
        padding-top:9px;gap:8px 14px;row-gap:0}
  nav{order:3;width:100%;margin:6px 0 0;gap:0;
      border-top:1px solid var(--grid-bold)}
  nav a{flex:1;text-align:center;padding:12px 4px 10px;font-size:12.5px;
        border-bottom:2px solid transparent}
  nav a:hover,nav a.on{border-color:var(--laser)}
}
@media(max-width:430px){
  .mark{font-size:15.5px;gap:7px}
  .mark em{display:none}
  .mark img{width:24px;height:24px}
  .lang button{padding:5px 8px;gap:6px;font-size:11px}
  .lflag{height:11.5px}
  .lflag.ko{width:17.25px}
  .lflag.en{width:23px}
  .flag.card{width:38px}
  nav a{font-size:12px;letter-spacing:.03em}
}
.lang{margin-left:auto;display:flex;gap:2px;padding:3px;border:1px solid var(--grid-bold);
      border-radius:8px;background:#fff}
.lang button{display:flex;align-items:center;gap:7px;padding:5px 10px;border:0;border-radius:6px;
  background:transparent;cursor:pointer;font-family:var(--mono);font-size:11.5px;font-weight:500;
  letter-spacing:.07em;color:var(--graphite);transition:.15s}
.lang button:hover{background:#F1F5F9;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--rail);color:#fff}
/* the two switcher flags have different proportions — 3:2 and 2:1 —
   so they share a height, not a width */
.lflag{height:13px;flex:none;border-radius:1.5px;display:block;
  box-shadow:0 0 0 .5px rgba(22,33,46,.25)}
.lflag.ko{width:19.5px}
.lflag.en{width:26px}

/* ═══════ hero ═══════ */
.hero{padding:76px 0 58px;display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:36px;padding:48px 0 40px}}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.8rem);line-height:1.03;font-weight:650;
         letter-spacing:-.035em;margin:16px 0 0}
.lede{font-size:16.5px;color:var(--graphite);max-width:38ch;margin:20px 0 0}
.lede b{color:var(--ink);font-weight:600}
.cta{display:flex;gap:11px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 19px;border-radius:8px;
  font-size:14px;font-weight:550;cursor:pointer;border:1px solid var(--rail);
  background:var(--rail);color:#fff;transition:.14s;font-family:inherit}
.btn:hover{background:#1F2833;transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(22,33,46,.55)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--grid-bold)}
.btn.ghost:hover{background:#fff;border-color:var(--rail);box-shadow:none}
.btn .mono{font-size:12px;opacity:.62}
.btn[disabled]{opacity:.42;pointer-events:none}
.screen{position:relative;background:#fff;border:1px solid var(--grid-bold);border-radius:10px;
  padding:11px;box-shadow:0 18px 40px -28px rgba(22,33,46,.5);margin:0}
.screen canvas{display:block;width:100%;height:auto;border-radius:4px}
.screen figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--graphite);
  margin-top:9px;padding:0 2px}
.screen figcaption b{color:var(--laser);font-weight:500}

/* ═══════ rail divider ═══════ */
.rail{height:34px;overflow:hidden}
.rail svg{display:block;width:100%;height:34px}

/* ═══════ generic section ═══════ */
section{padding:58px 0}
.shead{margin-bottom:26px}
.shead h2{font-size:1.5rem}
.shead p{margin:5px 0 0;color:var(--graphite);font-size:14px;max-width:60ch}

/* ═══════ about / people ═══════ */
.about{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:start}
@media(max-width:860px){.about{grid-template-columns:1fr;gap:32px}}
.about .body p{color:var(--graphite);margin:0 0 14px}
.about .body p:first-of-type{color:var(--ink);font-size:16px}
.people{display:flex;flex-direction:column;gap:12px}
.person{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:18px}
.ptop{display:flex;gap:15px;align-items:flex-start}
.person .av{width:60px;height:60px;border-radius:50%;flex:none;overflow:hidden;
  background:#fff;box-shadow:0 0 0 1px var(--grid-bold)}
.person .av img{width:100%;height:100%;object-fit:cover;display:block}
.person h3{font-size:16px}
.person .role{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
              color:var(--graphite);margin-top:2px}
.person .loc{font-size:12.5px;color:var(--graphite);margin-top:5px}
.person .mail{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.02em;color:var(--graphite);border-bottom:1px solid var(--grid-bold);transition:.15s}
.person .mail:hover{color:var(--laser);border-color:var(--laser)}

/* medal record — set like a results table, because that is what it is */
.cred{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1px dashed var(--grid-bold);
      display:flex;flex-direction:column;gap:11px}
.cred li{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:baseline}
.cred .cy{font-family:var(--mono);font-size:11.5px;color:var(--graphite)}
.cred .cn{font-size:14px;font-weight:550;letter-spacing:-.01em}
.cred .cn small{display:block;font-weight:400;font-size:11.5px;color:var(--graphite);
                letter-spacing:0;margin-top:1px}
.cred .cm{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
          letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.cred .cm i{width:8px;height:8px;border-radius:50%;flex:none}
.cm.silver{color:#78848F} .cm.silver i{background:linear-gradient(145deg,#E2E7EC,#96A2AE)}
.cm.bronze{color:#96683C} .cm.bronze i{background:linear-gradient(145deg,#DBA871,#A46B36)}


/* ── home tally ── */
.tally{display:flex;gap:44px;margin:0;flex-wrap:wrap}
.tally div{min-width:96px}
.tally dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
          text-transform:uppercase;color:var(--graphite)}
.tally dd{margin:5px 0 0;font-family:var(--mono);font-size:2rem;font-weight:600;
          letter-spacing:-.02em;line-height:1}
.tally dd.hot{color:var(--laser)}
.tallynote{margin:22px 0 0;font-size:13px;color:var(--graphite)}
.phead .meta dd.hot{color:var(--laser)}

/* competition cards need room for four figures now */
.comp dl{flex-wrap:wrap;gap:18px 22px}

/* logos */
.mark img{width:27px;height:27px;display:block;flex:none;position:relative;top:1px}
.wm{width:206px;height:auto;display:block;margin:0 0 20px}

/* ═══════ competition cards ═══════ */
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* three columns get too cramped for the figures before the single-column
   breakpoint arrives, so drop to two on the way down */
@media(max-width:1100px){.comps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){.comps{grid-template-columns:1fr}}
.comp{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:20px;
  display:flex;flex-direction:column;cursor:pointer;transition:.16s;position:relative}
.comp:hover{border-color:var(--rail);transform:translateY(-2px);
            box-shadow:0 14px 30px -22px rgba(22,33,46,.55)}
.comps{--lcap:clamp(13px,1.62vw,19px)}          /* lettering height in every logo */
@media(max-width:780px){.comps{--lcap:clamp(15px,3.6vw,21px)}}
.comp .chead{display:flex;align-items:center;gap:16px;min-height:52px}
.comp .chead .abbr{margin:0;flex:none}
.clogo{width:auto;flex:none;object-fit:contain;display:block;border-radius:3px;
       margin-left:auto}                         /* sits at the card's right edge */
.comp .abbr{font-size:1.5rem;font-weight:650;letter-spacing:-.03em}
.comp .full{font-size:12.5px;color:var(--graphite);margin-top:2px;min-height:2.6em}
/* A fixed column count, not flex wrapping.  Left to wrap, each card decided
   for itself where to break — APhO's scope is just "Asia", so it fitted on one
   line in English while the other five did not, and it sat out of step.  With
   a grid every card breaks in the same place, and the figures line up across
   the row as a bonus.  English needs the last label on a line of its own,
   since "Experimental problems" is wider than a quarter of the card. */
.comp dl{display:grid;gap:14px 16px;margin:15px 0 0;padding-top:13px;
  border-top:1px dashed var(--grid-bold);
  grid-template-columns:max-content minmax(0,1fr) max-content max-content}
/* the scope is the only figure with a long value, so it takes what is left
   over and the numbers stay on their own content width */
.comps[data-lang="en"] .comp dl{grid-template-columns:max-content minmax(0,1fr) max-content}
.comps[data-lang="en"] .comp dl>div:last-child{grid-column:1/-1}
@media(max-width:430px){
  .comp dl,.comps[data-lang="en"] .comp dl{grid-template-columns:max-content minmax(0,1fr)}
}
.comp .full{margin-bottom:auto}
.comp dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
.comp dd{margin:2px 0 0;font-family:var(--mono);font-size:14px;font-weight:500}
.comp .go{position:absolute;right:18px;bottom:16px;font-family:var(--mono);font-size:16px;
          color:var(--grid-bold);transition:.16s}
.comp:hover .go{color:var(--laser);transform:translateX(3px)}

/* ═══════ breadcrumb ═══════ */
.crumb{display:flex;align-items:center;gap:9px;padding:24px 0 0;font-family:var(--mono);
       font-size:11.5px;letter-spacing:.06em;color:var(--graphite);flex-wrap:wrap}
.crumb a:hover{color:var(--laser)}
.crumb span{color:var(--grid-bold)}
.crumb b{color:var(--ink);font-weight:500}

/* ═══════ page head ═══════ */
.phead{padding:22px 0 30px;border-bottom:1px solid var(--grid-bold);margin-bottom:30px}
.phead h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:650;letter-spacing:-.035em}
.phead .sub{color:var(--graphite);margin-top:7px;font-size:14.5px}
.phead .meta{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.phead .meta div{min-width:78px}
.phead .meta dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
                text-transform:uppercase;color:var(--graphite)}
.phead .meta dd{margin:2px 0 0;font-family:var(--mono);font-size:15px;font-weight:500}

/* ═══════ year grid ═══════ */
.cnote{margin:0 0 20px;padding:11px 14px;background:#fff;border:1px solid var(--grid-bold);
  border-left:3px solid var(--brass);border-radius:8px;font-size:13px;color:var(--graphite)}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.yr{background:#fff;border:1px solid var(--grid-bold);border-radius:9px;padding:15px 16px 13px;
    cursor:pointer;transition:.15s;position:relative;display:block}
.yr:hover{border-color:var(--rail);transform:translateY(-2px);
          box-shadow:0 12px 26px -20px rgba(22,33,46,.55)}
.yr .y{font-family:var(--mono);font-size:1.72rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.yr .host{font-size:12px;color:var(--graphite);margin-top:6px;min-height:1.6em}
/* every national flag has its own aspect ratio, so only the width is fixed
   and the height follows — nothing gets cropped */
.flag{width:20px;height:auto;border-radius:2px;flex:none;display:block;
  box-shadow:0 0 0 .5px rgba(22,33,46,.22)}
.flag.big{width:28px}
.flag.card{width:44px;border-radius:3px;
  box-shadow:0 0 0 .5px rgba(22,33,46,.2),0 2px 5px -3px rgba(22,33,46,.5)}
.orgbadge,.noflag{aspect-ratio:3/2}
.orgbadge{display:inline-flex;align-items:center;justify-content:center;
  background:var(--rail);color:#fff;font-family:var(--mono);font-weight:600;
  letter-spacing:.06em;font-size:10.5px;box-shadow:0 0 0 .5px rgba(22,33,46,.2),
  0 2px 5px -3px rgba(22,33,46,.5)}
.flag.big.orgbadge{font-size:8.5px;letter-spacing:.04em}
.noflag{display:inline-block;background:repeating-linear-gradient(45deg,
  #eef2f6 0 5px,#e3e9ef 5px 10px);border-radius:3px}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.yrow .flag,.yrow .orgbadge,.yrow .noflag{flex:none}
.yr .host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subflag{display:flex;align-items:center;gap:9px}
.yr .cnt{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--graphite);margin-top:10px;padding-top:9px;border-top:1px dashed var(--grid-bold)}
.yr.none{cursor:default;border-style:dashed;opacity:.55;background:transparent}
.yr.none:hover{transform:none;box-shadow:none;border-color:var(--grid-bold)}
.yr .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;
  vertical-align:1px;background:var(--laser);box-shadow:0 0 0 2.5px rgba(224,36,36,.16)}

/* ═══════ problem cards ═══════ */
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.prob{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:19px;
      display:flex;flex-direction:column;gap:11px}
.prob.soon{border-style:dashed;background:transparent;opacity:.78}
.prob .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prob .code{font-family:var(--mono);font-size:1.15rem;font-weight:600;letter-spacing:.02em}
.prob h3{font-size:15.5px;line-height:1.38}
.prob p{margin:0;font-size:13px;color:var(--graphite);flex:1}
.prob .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.prob .acts .btn{padding:8px 13px;font-size:12.5px}
.status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
        letter-spacing:.1em;text-transform:uppercase}
.status i{width:6px;height:6px;border-radius:50%;display:inline-block}
.status.live{color:var(--laser)}
.status.live i{background:var(--laser);box-shadow:0 0 0 3px rgba(224,36,36,.15)}
.status.dl{color:var(--brass)}
.status.dl i{background:var(--brass);box-shadow:0 0 0 3px rgba(184,134,43,.15)}
.status.wip{color:var(--graphite)} .status.wip i{background:var(--grid-bold)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
     padding:3px 7px;border-radius:4px;background:#F1F5F9;color:var(--graphite)}
.thytag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:4px;background:rgba(44,111,155,.12);color:var(--accent);margin-left:6px}
.prob .top{flex-wrap:wrap}
.tag.exp{background:rgba(184,134,43,.13);color:var(--brass)}

/* ═══════ AdFit banners — Korean pages only ═══════ */
.adfit-banner{position:relative;width:320px;max-width:calc(100% - 24px);height:50px;margin:42px auto 6px}
.adfit-banner-label{position:absolute;top:-17px;left:0;color:#667085;font:9px/1.1 var(--mono)}
.adfit-banner-slot{width:320px;max-width:100%;height:50px}
.adfit-banner--secondary,.adfit-banner--secondary .adfit-banner-slot{height:100px}
@media (min-width:700px){.adfit-banner{margin-top:52px}}
@media (min-width:768px){
  .adfit-banner.adfit-banner--desktop{width:728px;max-width:calc(100% - 48px);height:90px;margin-top:58px}
  .adfit-banner--desktop .adfit-banner-slot{width:728px;height:90px}
}
@media (min-width:1100px){.adfit-banner{margin-top:60px}}
@media print{.adfit-banner{display:none}}

/* ═══════ footer ═══════ */
footer{border-top:1px solid var(--grid-bold);padding:30px 0 44px;margin-top:26px}
.frow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
      font-family:var(--mono);font-size:11.5px;color:var(--graphite);letter-spacing:.04em}
.frow a:hover{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}}
</style>
</head>

<!-- ══════════ FLAG SPRITES ══════════
  태극기 — 대한민국 국기법 시행령 규격
    깃면 3:2 · 태극 지름 = 깃면 너비 ÷ 2 · 경계 곡선은 좌상~우하 대각선 위
    괘 간격 = 태극 원지름 ÷ 4 · 괘 가로 = 지름 ÷ 2 · 괘 세로 = 지름 ÷ 3
    효 두께 = 괘 세로 ÷ 4 · 효 간격 = 괘 세로 ÷ 8
    배치: 좌상 건 ☰ · 우상 감 ☵ · 좌하 이 ☲ · 우하 곤 ☷
  Union Jack — 2:1, St Patrick's saltire counterchanged against St Andrew's
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="flag-ko" viewBox="0 0 90 60">
    <rect width="90" height="60" fill="#fff"/>
    <g transform="translate(45 30) rotate(33.69)">
      <path d="M-15,0 A15,15 0 0 1 15,0 A7.5,7.5 0 0 0 0,0 A7.5,7.5 0 0 1 -15,0 Z" fill="#CD2E3A"/>
      <path d="M-15,0 A7.5,7.5 0 0 0 0,0 A7.5,7.5 0 0 1 15,0 A15,15 0 0 1 -15,0 Z" fill="#0047A0"/>
    </g>
    <g fill="#000">
      <!-- 건 ☰  (좌상) -->

let lang = new URLSearchParams(location.search).get("lang");
if(lang!=="ko" && lang!=="en") lang = "ko";

/* the toggle is painted from `lang`, never from the click, so a page opened
   straight at ?lang=en lights the right button too */
function paintLang(){
  document.getElementById("lang-ko").setAttribute("aria-pressed", lang==="ko");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang==="en");
}

function setLang(next){
  lang = next;
  document.documentElement.lang = lang;
  paintLang();
  /* Keep the choice in the address bar so a refresh or a shared link holds it.
     Some embedded frames refuse history writes, so this must never be able to
     stop the re-render below. */
  try{
    const u=new URL(location); u.searchParams.set("lang",lang);
    history.replaceState(null,"",u);
  }catch(e){}
  render();
}
document.getElementById("lang-ko").onclick=()=>setLang("ko");
document.getElementById("lang-en").onclick=()=>setLang("en");
paintLang();

/* a host country gets its flag; a year run by an institution gets its badge */
const flagImg = (cc,cls="flag",org=null) =>
  cc  ? `<img class="${cls}" loading="lazy" alt="" decoding="async"
           src="https://flagcdn.com/w80/${cc}.png"
           srcset="https://flagcdn.com/w160/${cc}.png 2x">`
  : org ? `<span class="${cls} orgbadge" title="${esc(org.name||org.abbr)}">${esc(org.abbr)}</span>`
  :       `<span class="${cls} noflag"></span>`;

/* Each competition carries its own logo in logo/, named after the key:
   logo/ipho.svg, logo/apho.svg, and so on.  .svg is tried first, then .png;
   if neither is there the image removes itself and the card falls back to
   the wordmark alone, exactly as it looked before. */
/* Bump LOGO_V after replacing anything in logo/.  Browsers hang on to an old
   image for a long time, on file:// as much as on Pages, and a stale copy is
   indistinguishable from a bad export. */
const LOGO_V = 3;
/* Every lockup gives a different share of its box to the lettering — IPhO
   spends 30% of its height on "PhO", RMPh 76% on "PMΦ" — so scaling them all
   to one height makes the words wildly different sizes.  Each is scaled to
   bring its own lettering to --lcap instead.  Measured from the artwork. */
const LOGO_TEXT = {ipho:0.297, apho:0.640, eupho:0.686, nbpho:0.435,
                   ispho:0.468, rmph:0.760};
function logoFallback(img){
  if((img.dataset.try||"png")==="png"){
    img.dataset.try="svg";
    img.src=img.src.replace(/\.png(\?|$)/,".svg$1"); return;
  }
  img.remove();
}
const compLogo = key =>
  `<img class="clogo" loading="lazy" decoding="async" alt=""
     style="height:calc(var(--lcap)/${LOGO_TEXT[key]||0.5})"
     src="logo/${key}.png?v=${LOGO_V}" onerror="logoFallback(this)">`;

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function adFitBanner(placement){
  if(lang!=="ko") return "";
  const size=placement==="secondary" ? " adfit-banner--secondary" : "";
  return `<aside class="adfit-banner${size}" aria-label="광고">
    <span class="adfit-banner-label">광고</span>
    <div class="adfit-banner-slot haslalab-adfit-slot" data-ad-placement="${placement}"></div>
  </aside>`;
}

function viewComp(key){
  const d=UI[lang], c=DATA[key];
  if(!c) return viewHome();
  const ready = c.years.reduce((n,y)=>n+y.problems.filter(p=>!p.hold&&p.files&&(p.files.sim||p.files.exe)).length,0);
  const total = c.years.reduce((n,y)=>n+y.problems.length,0);
  return `
  <div class="shell">
    <div class="crumb">
      <a href="#/">${d.crumbHome}</a><span>/</span>
      <a href="#/comps">${d.navComps}</a><span>/</span><b>${c.abbr}</b>
    </div>
    <div class="phead">
      <h1>${c.abbr}</h1>
      <div class="sub">${c.full[lang]}</div>
      <dl class="meta">
        <div><dt>${d.lSince}</dt><dd>${c.since}</dd></div>
        <div><dt>${d.lScope}</dt><dd>${c.scope[lang]}</dd></div>
        <div><dt>${d.lYears}</dt><dd>${c.years.length}</dd></div>
        <div><dt>${d.problems}</dt><dd>${total}</dd></div>
        <div><dt>${d.cntReady}</dt><dd class="${ready?"hot":""}">${ready}</dd></div>
      </dl>
    </div>
    ${c.note?`<p class="cnote">${c.note[lang]}</p>`:""}
    ${adFitBanner("secondary")}
    <div class="shead"><h2 style="font-size:1.15rem">${d.pickYear}</h2></div>
    <div class="years">
      ${c.years.map(y=>{
        const r=y.problems.filter(p=>!p.hold&&p.files&&(p.files.sim||p.files.exe)).length;
        const none=y.problems.length===0;
        const inner=`
          <div class="yrow">
            <div class="y">${y.y}</div>
            ${flagImg(y.cc,"flag card",y.org)}
          </div>
          <div class="host">${y.host?y.host[lang]:"—"}</div>
          <div class="cnt">${r?'<i class="dot"></i>':""}${none?d.noPapers:
            d.expN.replace("{n}",y.problems.length)+(r?` · ${r} ${d.cntReady}`:"")}</div>`;
        return none ? `<div class="yr none">${inner}</div>`
                    : `<a class="yr" href="#/${key}/${y.y}">${inner}</a>`;
      }).join("")}
    </div>
  </div>
  ${adFitBanner("primary")}`;
}

function viewYear(key,year){
  const d=UI[lang], c=DATA[key];
  const yr = c && c.years.find(y=>String(y.y)===String(year));
  if(!yr) return viewComp(key);
  return `
  <div class="shell">
    <div class="crumb">
      <a href="#/">${d.crumbHome}</a><span>/</span>
      <a href="#/comps">${d.navComps}</a><span>/</span>
      <a href="#/${key}">${c.abbr}</a><span>/</span><b>${yr.y}</b>
    </div>
    <div class="phead">
      <h1>${c.abbr} ${yr.y}</h1>
      <div class="sub subflag">${flagImg(yr.cc,"flag big",yr.org)}<span>${yr.host?yr.host[lang]:"—"}</span></div>
      <dl class="meta">
        <div><dt>${d.host}</dt><dd style="font-size:14px">${yr.host?yr.host[lang]:"—"}</dd></div>
        <div><dt>${d.problems}</dt><dd>${yr.problems.length}</dd></div>
      </dl>
    </div>
    ${adFitBanner("secondary")}
    <div class="shead">
      <h2 style="font-size:1.15rem">${d.pickProb}</h2>
      ${yr.general?`<a class="genlink" href="${yr.general[lang]||yr.general.ko||yr.general.en}"
         target="_blank" rel="noopener">${d.actGeneral}</a>`:""}
    </div>
    <div class="probs">
      ${yr.problems.map(p=>{
        const f=p.files||{};
        /* 요청한 언어가 없으면 있는 것을 주되, 어느 언어인지 밝힌다 */
        const pick=v=>typeof v==="string"?v:(v&&(v[lang]||v.ko||v.en));
        const tag=v=>{
          if(typeof v==="string"||!v) return "";
          if(v[lang]) return "";
          const other=v.ko?"ko":"en";
          return ` <span class="lgtag">${d.langTag[other]}</span>`;
        };
        /* `hold` stages a problem: every button it will have is already
           listed, but nothing is released until the flag comes off */
        const held = p.hold===true;
        const mode = held ? "wip" : (f.sim ? "live" : (f.exe ? "dl" : (f.src ? "src" : "wip")));
        const tags=(lang==="ko"?p.tags:p.tagsEn)||[];
        const heading = p.title ? p.title[lang] : ((lang==="ko"?p.ko:p.en)||p.en||d.soonTitle);
        const body    = p.desc ? p.desc[lang] : d.soonDesc;
        const chip    = mode==="live" ? d.live : mode==="dl" ? d.dlOnly : mode==="src" ? d.srcOnly : d.wip;
        const b=[];
        if(held){
          const soon=(lbl,g)=>b.push(`<button class="btn${g?" ghost":""}" disabled>${lbl}</button>`);
          if(f.sim) soon(d.actRun,false);
          if(f.exe) soon(d.actExe,!!f.sim);
          if(!f.sim && !f.exe) soon(d.actRun,true);
          if(f.pdf) soon(d.actPdf,true);
          if(f.sol) soon(d.actSol,true);
          if(f.src) soon(d.actSrc,true);
        } else {
        if(f.sim) b.push(`<a class="btn" href="${f.sim}?lang=${lang}">${d.actRun}</a>`);
        if(f.exe) b.push(`<a class="btn${f.sim?" ghost":""}" href="${pick(f.exe)}">${d.actExe}${tag(f.exe)}</a>`);
        if(!f.sim && !f.exe) b.push(`<button class="btn ghost" disabled>${d.actRun}</button>`);
        if(f.pdf) b.push(`<a class="btn ghost" href="${pick(f.pdf)}" target="_blank" rel="noopener">${d.actPdf}${tag(f.pdf)}</a>`);
        if(f.sol) b.push(`<a class="btn ghost" href="${pick(f.sol)}" target="_blank" rel="noopener">${d.actSol}${tag(f.sol)}</a>`);
        if(f.src) b.push(`<a class="btn ghost" href="${pick(f.src)}">${d.actSrc}${tag(f.src)}</a>`);
        }
        /* a quiet footnote about the unsigned Windows build */
        const off = (!held && f.exe) ? `<p class="exenote">${d.exeNote}</p>` : "";
        return `<article class="prob ${mode==="wip"?"soon":""}">
          <div class="top">
            <span class="code">${p.id}</span>
            <span class="status ${mode}"><i></i>${chip}</span>
            ${p.theory?`<span class="thytag">${d.theoryTag}</span>`:""}
          </div>
          <h3>${esc(heading)}</h3>
          <p>${body}</p>
          <div class="tags">${tags.map((t,i)=>`<span class="tag${i===0?" exp":""}">${esc(t)}</span>`).join("")}</div>
          <div class="acts">${b.join("\n")}</div>
          ${off}
        </article>`;}).join("")}
    </div>
  </div>
  ${adFitBanner("primary")}`;
}

function buildRails(){

/* ══════════════════════════════════════════════════════════════
   THE SIGNATURES — one per published experiment, each drawn from
   the same physics the simulator itself runs.  Nothing here is a
   result: they are raw instrument outputs, as the bench gives them.
   One is picked at random every time the home page is drawn.
   ══════════════════════════════════════════════════════════════ */
let animId=null, heroPick=null;

const PEN=(c,col,w)=>{c.strokeStyle=col;c.lineWidth=w;c.lineJoin="round";c.lineCap="round";};
function frame(c,w,h,pad){ c.fillStyle="#fff"; c.fillRect(0,0,w,h);
  return {X:(u,a,b)=>pad+(u-a)/(b-a)*(w-2*pad), Y:(v,a,b)=>h-pad-(v-a)/(b-a)*(h-2*pad)}; }
function mmss(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");}

/* ── IPhO 2017 E1 · laser deflectogram on millimetre paper ────── */
/* ══════════════════════════════════════════════════════════════
   THE CONSOLE — four of the published experiments are command-line
   programs, so their covers are the session itself: the same header,
   the same palette, the same prompts, and output computed here by
   the same physics the page runs.
   ══════════════════════════════════════════════════════════════ */
const TERM_FG="#cccccc", TERM_IN="#9cdcfe", TERM_DIM="#7d7d7d";
function termPad(v,n,right){ let t=String(v);
  while(t.length<n) t = right ? t+" " : " "+t;
  return t; }
/* reveal the transcript a character at a time, so it types itself */
function termCut(feed,n){
  const out=[];
  for(const e of feed){
    const body=e.s||"", ans=e.ans||"";
    if(n<=0) break;
    const a=body.slice(0,Math.min(body.length,n));
    n-=a.length;
    const b=n>0 ? ans.slice(0,Math.min(ans.length,n)) : "";
    n-=b.length+1;
    out.push({s:a, ans:b, dim:e.dim, acc:e.acc, wait:e.ans!==undefined});
    if(a.length<body.length||b.length<ans.length) break;
  }
  return out;
}
const termLen=feed=>feed.reduce((n,e)=>n+(e.s||"").length+(e.ans||"").length+1,0);
function termPaint(c,w,h,title,feed,n){
  const fs=Math.max(8.5,Math.min(13,h/33)), lh=fs*1.45, padX=Math.max(9,fs);
  c.fillStyle="#1e1e1e"; c.fillRect(0,0,w,h);
  const hh=Math.round(fs*2.5);
  c.fillStyle="#141414"; c.fillRect(0,0,w,hh);
  c.fillStyle="#2a2a2a"; c.fillRect(0,hh-1,w,1);
  c.textAlign="left"; c.textBaseline="middle";
  c.font="600 "+(fs*1.02).toFixed(1)+"px ui-sans-serif,system-ui,'Segoe UI',sans-serif";
  c.fillStyle="#e8e8e8"; c.fillText(title,padX,hh*0.52);
  const bh=Math.round(fs*2.3);
  c.fillStyle="#0c0c0c"; c.fillRect(0,hh,w,h-hh);
  c.save(); c.beginPath(); c.rect(0,hh,w,h-hh-bh); c.clip();
  c.font=fs.toFixed(1)+"px ui-monospace,Consolas,'Courier New',monospace";
  const rows=termCut(feed,n);
  const room=Math.max(1,Math.floor((h-hh-bh-fs*0.8)/lh));
  const vis=rows.slice(Math.max(0,rows.length-room));
  const top=hh+fs*1.1;
  vis.forEach((L,i)=>{
    const y=top+i*lh;
    c.fillStyle=L.acc?"#4ec9b0":(L.dim?TERM_DIM:TERM_FG);
    c.fillText(L.s,padX,y);
    if(L.ans){ c.fillStyle=TERM_IN;
      c.fillText(L.ans,padX+c.measureText(L.s).width,y); }
  });
  c.restore();
  /* the input bar the page keeps at the foot */
  c.fillStyle="#2a2a2a"; c.fillRect(0,h-bh,w,1);
  const last=rows[rows.length-1];
  const open=last&&last.wait&&!last.ans;
  c.font=fs.toFixed(1)+"px ui-monospace,Consolas,'Courier New',monospace";
  c.fillStyle=TERM_FG;
  const ps=open?last.s:"";
  c.fillText(ps,padX,h-bh/2);
  if(Math.floor(n/9)%2===0){
    c.fillStyle=TERM_IN;
    c.fillRect(padX+c.measureText(ps).width+1,h-bh/2-fs*0.55,fs*0.55,fs*1.1);
  }
  c.textBaseline="alphabetic";
}

const SIG_I17E1={
  sim:"sim/ipho2017_E1_web.html", tag:"IPhO 2017 E1", span:2100, rate:260,
  capL:{ko:"모눈종이 30 × 30 cm · 편향도",en:"Millimetre paper 30 × 30 cm · deflectogram"},
  capR:{ko:"경과",en:"elapsed"},
  read:t=>mmss(Math.min(t,1800)),
  paint(c,w,h,t){
    const SS=30.0, CELL_D=0.8, GRAMS=28.0;
    const Z0=10.4, Z=53.4, MAG=(Z0+CELL_D+Z)/Z0;
    const C0=GRAMS/150, D=2.29e-5-5.25e-5*C0, DNDC=0.2036-0.420*C0;
    const H_INT=1.5, XI_MID=10.5, THETA=45, pad=10;
    const sx=(w-2*pad)/SS, sy=(h-2*pad)/SS;
    const X=x=>pad+x*sx, Y=y=>h-pad-y*sy;
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    PEN(c,"#DCE7F0",.4); c.beginPath();
    for(let k=0;k<=SS+1e-6;k+=.5){c.moveTo(X(k),Y(0));c.lineTo(X(k),Y(SS));
                                  c.moveTo(X(0),Y(k));c.lineTo(X(SS),Y(k));}
    c.stroke();
    PEN(c,"#B4CADC",.85); c.beginPath();
    for(let k=0;k<=SS+1e-6;k+=5){c.moveTo(X(k),Y(0));c.lineTo(X(k),Y(SS));
                                 c.moveTo(X(0),Y(k));c.lineTo(X(SS),Y(k));}
    c.stroke();
    const half=SS/2, cot=1/Math.tan(THETA*Math.PI/180);
    const te=Math.max(Math.min(t,1800),1), s=2*Math.sqrt(D*te), pre=C0/(s*Math.sqrt(Math.PI));
    PEN(c,"#98A6B4",1); c.setLineDash([4,4]);
    c.beginPath(); c.moveTo(X(half-half*cot),Y(0)); c.lineTo(X(half+half*cot),Y(SS));
    c.stroke(); c.setLineDash([]);
    PEN(c,"#E02424",2.6); c.beginPath(); let first=true;
    for(let i=0;i<900;i++){
      const xi=XI_MID-half+SS*i/899, x=half+(xi-XI_MID)*cot;
      if(x<0||x>SS) continue;
      const Yv=xi/MAG;
      const y=half+(xi-XI_MID)-Z*CELL_D*DNDC*(pre*Math.exp(-Math.pow((H_INT-Yv)/s,2)));
      first?(c.moveTo(X(x),Y(y)),first=false):c.lineTo(X(x),Y(y));
    }
    c.stroke();
  }};

/* ── IPhO 2017 E2 · levitating graphite rod, damped vertical ring ─ */
const SIG_I17E2={
  sim:"sim/ipho2017_E2_web.html", tag:"IPhO 2017 E2", span:26, rate:1.6,
  capL:{ko:"반자성 흑연봉 · 수직 변위",en:"Diamagnetic rod · vertical displacement"},
  capR:{ko:"경과",en:"elapsed"},
  read:t=>t.toFixed(1)+" s",
  paint(c,w,h,t){
    const MU0=1.257e-6, RHO=1680.0, C1=198.6;
    const M=1.10e6, CHI=-1.45e-4;
    const OM=Math.sqrt(-C1*MU0*CHI*M*M/RHO);
    const r=0.56/2, L=8.0, TAU=3.15+29.40*r*r*Math.log(0.607*L/r);
    const A=0.42, TMAX=26, pad=16;
    const F=frame(c,w,h,pad);
    PEN(c,"#DCE7F0",.5); c.beginPath();
    for(let k=0;k<=TMAX;k+=2){c.moveTo(F.X(k,0,TMAX),pad);c.lineTo(F.X(k,0,TMAX),h-pad);}
    for(let v=-.5;v<=.5001;v+=.125){c.moveTo(pad,F.Y(v,-.5,.5));c.lineTo(w-pad,F.Y(v,-.5,.5));}
    c.stroke();
    PEN(c,"#B4CADC",1); c.beginPath();
    c.moveTo(pad,F.Y(0,-.5,.5)); c.lineTo(w-pad,F.Y(0,-.5,.5)); c.stroke();
    PEN(c,"#98A6B4",1); c.setLineDash([3,4]); c.beginPath();
    for(let i=0;i<=400;i++){const x=TMAX*i/400; const e=A*Math.exp(-x/TAU);
      i?c.lineTo(F.X(x,0,TMAX),F.Y(e,-.5,.5)):c.moveTo(F.X(x,0,TMAX),F.Y(e,-.5,.5));}
    c.stroke(); c.beginPath();
    for(let i=0;i<=400;i++){const x=TMAX*i/400; const e=-A*Math.exp(-x/TAU);
      i?c.lineTo(F.X(x,0,TMAX),F.Y(e,-.5,.5)):c.moveTo(F.X(x,0,TMAX),F.Y(e,-.5,.5));}
    c.stroke(); c.setLineDash([]);
    const tt=Math.min(t,TMAX), N=1400;
    PEN(c,"#2c6f9b",2.2); c.beginPath();
    for(let i=0;i<=N;i++){const x=tt*i/N;
      const z=A*Math.exp(-x/TAU)*Math.cos(OM*x);
      i?c.lineTo(F.X(x,0,TMAX),F.Y(z,-.5,.5)):c.moveTo(F.X(x,0,TMAX),F.Y(z,-.5,.5));}
    c.stroke();
    const zN=A*Math.exp(-tt/TAU)*Math.cos(OM*tt);
    c.fillStyle="#2c6f9b"; c.beginPath();
    c.arc(F.X(tt,0,TMAX),F.Y(zN,-.5,.5),3.2,0,7); c.fill();
  }};

/* ── APhO 2023 E1 · the photogate, pendulum swinging through ──── */
const SIG_A23E1={
  sim:"sim/apho2023_E1_web.html", tag:"APhO 2023 E1", span:96, rate:6,
  capL:{ko:"오실로스코프 · 광게이트 CH1 · 접촉 CH2",en:"Oscilloscope · photogate CH1 · contact CH2"},
  capR:{ko:"경과",en:"elapsed"},
  read:t=>mmss(t),
  paint(c,w,h,t){
    /* the bench's own pendulum, and its own balls */
    const G_UB=9.804, L_PEND=0.315405;
    const T=2*Math.PI*Math.sqrt(L_PEND/G_UB), OM=2*Math.PI/T;
    const TH0=0.30, TH_DECAY=110, TH_FLAG=0.0159;   /* flag half-angle */
    const m1=131.48e-3, m2=67.55e-3, R1=31.75e-3/2, R2=25.42e-3/2;
    const E_RED=1/(2*(1-0.30*0.30)/200e9), E_C=E_RED*1.1220;
    const mu=m1*m2/(m1+m2), Rs=R1*R2/(R1+R2);
    const th=x=>TH0*Math.exp(-x/TH_DECAY)*Math.cos(OM*x);
    const NX=14, NY=8, V_LOW=-0.1, TDIV=100e-3, WIN=NX*TDIV;
    const t1=t, t0=t1-WIN;                          /* roll mode: newest at the right */
    const pad=12, gw=w-2*pad, gh=h-2*pad;
    const VPD=2.0;                    /* the two traces sit on separate rails */
    const Yv =v=>h-pad-gh*((v/VPD)+0.9)/NY;   /* CH1 low on the screen */
    const Yv2=v=>h-pad-gh*((v/VPD)+4.4)/NY;   /* CH2 above it */
    c.fillStyle="#101418"; c.fillRect(0,0,w,h);
    PEN(c,"#17331a",1); c.beginPath();
    for(let i=1;i<NX;i++){const x=pad+gw*i/NX;c.moveTo(x,pad);c.lineTo(x,h-pad);}
    for(let j=1;j<NY;j++){const y=pad+gh*j/NY;c.moveTo(pad,y);c.lineTo(w-pad,y);}
    c.stroke();
    PEN(c,"#245c2a",1.2); c.beginPath();
    c.moveTo(pad,Yv(0)); c.lineTo(w-pad,Yv(0));
    c.moveTo(pad,Yv2(0)); c.lineTo(w-pad,Yv2(0)); c.stroke();
    /* CH2 — the contact itself.  Each swing brings the balls together a
       little slower, so the gate lasts a little longer; at 100 ms/div it
       is still only a hairline, which is the whole reason for zooming in. */
    PEN(c,"#e060b0",1.6);
    c.beginPath(); c.moveTo(pad,Yv2(-0.1)); c.lineTo(w-pad,Yv2(-0.1)); c.stroke();
    const kA=Math.ceil((t0-T/4)/T), kB=Math.floor((t1-T/4)/T);
    for(let k=kA;k<=kB;k++){
      const tc=T/4+k*T; if(tc<0) continue;
      const v=Math.abs(TH0*Math.exp(-tc/TH_DECAY)*OM)*L_PEND;
      const tau=2.755*Math.pow(mu*mu/(Rs*E_C*E_C*Math.max(v,1e-3)),0.2);
      const x=pad+gw*(tc-t0)/WIN, wpx=Math.max(gw*tau/WIN,1.3);
      c.beginPath(); c.moveTo(x,Yv2(0)); c.lineTo(x,Yv2(4.0));
      c.lineTo(x+wpx,Yv2(4.0)); c.lineTo(x+wpx,Yv2(0)); c.stroke();
    }
    /* CH1 — the flag cutting the beam, twice a period */
    const N=1600;
    PEN(c,"#e8c020",1.9); c.beginPath();
    for(let i=0;i<=N;i++){
      const tt=t0+WIN*i/N;
      let v=V_LOW;
      if(tt>0){
        const blocked=0.5*(1+Math.tanh((TH_FLAG-Math.abs(th(tt)))/(0.05*TH_FLAG)));
        v=V_LOW+(5.0-V_LOW)*blocked;
      }
      const x=pad+gw*i/N, y=Yv(v);
      i?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.stroke();
    c.fillStyle="#7d8a72"; c.font="10px ui-monospace,Consolas,monospace";
    c.fillText("CH1 2.00V   CH2 2.00V   100ms",pad+6,h-pad-7);
  }};

/* ── APhO 2023 E2 · interference from the heated surface ───────── */
const SIG_A23E2={
  sim:"sim/apho2023_E2_web.html", tag:"APhO 2023 E2", span:16, rate:1,
  capL:{ko:"스크린 위 간섭무늬",en:"Interference pattern on the screen"},
  capR:{ko:"레이저 전류",en:"laser current"},
  /* the knob is wound up from zero.  Nothing shows until about 80 mA,
     where the surface first bulges; by 98 mA it has yielded. */
  mAat(t){const u=Math.min(t/this.span,1); return 96*Math.pow(u,0.35);},
  read(t){return this.mAat(t).toFixed(1)+" mA";},
  paint(c,w,h,t){
    const P_TH=287.0, SLOPE=0.4632, HIDDEN=2.0, R_BASE=167.82, L_CM=42.0;
    const mA=this.mAat(t);
    const V=(mA<=1)?0:(0.35928+0.73823*Math.log(mA)), Pw=mA*V;
    const mmax=Math.max(SLOPE*(Pw-P_TH),0.0);
    const NW=190, NH=Math.max(1,Math.round(NW*h/w));
    if(!this._id||this._id.width!==NW||this._id.height!==NH){
      this._buf=document.createElement("canvas");
      this._buf.width=NW; this._buf.height=NH;
      this._bc=this._buf.getContext("2d");
      this._id=this._bc.createImageData(NW,NH);
    }
    const d=this._id.data, HALF=4.6;          /* half-width of view, cm */
    for(let j=0;j<NH;j++){
      const Yc=(j/(NH-1)-0.5)*2*HALF*h/w;
      for(let i=0;i<NW;i++){
        const Xc=(i/(NW-1)-0.5)*2*HALF;
        const Rr=Math.hypot(Xc,Yc);
        const nu=R_BASE*Math.sin(Math.atan2(Rr,L_CM));
        let img;
        if(mmax>0.4){
          const core=1.35*Math.exp(-Math.pow(nu/1.55,2));
          const env=0.80*Math.exp(-0.85*Math.pow(nu/Math.max(mmax,1.0),2));
          const cut=0.5*(1.0-Math.tanh((nu-mmax)/0.55));
          const sn=Math.sin(Math.PI*nu);
          let ring=env*cut*sn*sn;
          ring*=0.5*(1.0+Math.tanh((nu-HIDDEN)/0.55));
          img=core+ring;
        } else img=1.35*Math.exp(-Math.pow(nu/1.55,2));
        img*=Math.min(Math.max(Pw/300.0,0.0),1.6);
        const g=Math.min(Math.max(img,0),1.35)/1.35;
        const o=4*(j*NW+i);
        d[o]=Math.round(26+198*Math.pow(g,1.05));
        d[o+1]=Math.round(8+46*Math.pow(g,1.9));
        d[o+2]=Math.round(12+44*Math.pow(g,2.1));
        d[o+3]=255;
      }
    }
    this._bc.putImageData(this._id,0,0);
    c.fillStyle="#120406"; c.fillRect(0,0,w,h);
    c.imageSmoothingEnabled=true; c.drawImage(this._buf,0,0,w,h);
    PEN(c,"rgba(255,255,255,.30)",1);          /* the screen's own scale */
    const pxcm=(w/(2*HALF));
    c.beginPath();
    for(let k=-4;k<=4;k++){const x=w/2+k*pxcm;
      c.moveTo(x,h-10);c.lineTo(x,h-(k%2?16:22));}
    c.moveTo(8,h-10); c.lineTo(w-8,h-10); c.stroke();
  }};

const SIG_S25T1={
  sim:"sim/ispho2025_T1_web.html", tag:"ISPhO 2025 T1", span:180, rate:12,

  capR:{ko:"시간",en:"time"},
  read:t=>"t = "+t.toFixed(1),
  paint(c,w,h,t){
    /* beta = 100, K_easy = 1 -> the wall is Delta = sqrt(beta/K) cells
       wide, and the field b walks it along at v = Delta b / alpha */
    const N=200, BETA=100, ALPHA=0.5, B=0.04;
    const wd=Math.sqrt(BETA), v=wd*B/ALPHA;

/* ── ISPhO 2026 E1 · the grating's transmission spectrum ───────── */
const SIG_S26E1={
  sim:"sim/ispho2026_E1_web.html", tag:"ISPhO 2026 E1", span:24, rate:1.5,
  capL:{ko:"투과 스펙트럼 · 광섬유 브래그 격자",en:"Transmission spectrum · fibre Bragg grating"},
  capR:{ko:"격자 온도",en:"grating"},
  read(t){return (25+85*(0.5-0.5*Math.cos(2*Math.PI*t/this.span))).toFixed(0)+" \u00B0C";},
  paint(c,w,h,t){
    const N_C=1.444, A_TEMP=6.67e-6, KAPPA0=8.7e-8, Y_OPT=0.45, L_NM=50.0e6;
    const T=25+85*(0.5-0.5*Math.cos(2*Math.PI*t/this.span));
    const Lam=536.0*(1+(T-25)*A_TEMP);
    const kap0=KAPPA0*Math.exp(-Math.pow(0-Y_OPT,2)/8);
    const LO=1546.5, HI=1549.5, NP=620, pad=16, padL=34;
    const F={X:u=>padL+(u-LO)/(HI-LO)*(w-padL-pad),
             Y:v=>h-24-(v+34)/34.6*(h-24-pad)};
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    PEN(c,"#DCE7F0",.5); c.beginPath();
    for(let l=LO;l<=HI+1e-9;l+=0.5){c.moveTo(F.X(l),pad);c.lineTo(F.X(l),h-24);}
    for(let v=-30;v<=0.001;v+=10){c.moveTo(padL,F.Y(v));c.lineTo(w-pad,F.Y(v));}
    c.stroke();
    PEN(c,"#B4CADC",1); c.beginPath();
    c.moveTo(padL,F.Y(0)); c.lineTo(w-pad,F.Y(0));
    c.moveTo(padL,pad); c.lineTo(padL,h-24); c.stroke();
    /* |t|^2 for a uniform grating, then straight to dB */
    const raw=new Float64Array(NP);
    for(let i=0;i<NP;i++){
      const wl=LO+(HI-LO)*i/(NP-1);
      const kap=kap0*(1550/wl);
      const del=2*Math.PI*N_C/wl-Math.PI/Lam;
      const q=kap*kap-del*del;
      if(q>=0){                      /* gamma real  -> the stop band */
        const g=Math.sqrt(q), gL=Math.min(g*L_NM,60);
        const ch=Math.cosh(gL), sh=Math.sinh(gL);
        raw[i]=g*g/(g*g*ch*ch+del*del*sh*sh);
      } else {                       /* gamma imaginary -> the side lobes */
        const g=Math.sqrt(-q), gL=g*L_NM;
        const cs=Math.cos(gL), sn=Math.sin(gL);
        raw[i]=g*g/(g*g*cs*cs+del*del*sn*sn);
      }
      raw[i]=Math.min(raw[i],1.0)+1e-6;
    }
    const sm=new Float64Array(NP), R=6;
    for(let i=0;i<NP;i++){let a=0,ww=0;
      for(let j=-R;j<=R;j++){let m=i+j; if(m<0)m=0; if(m>=NP)m=NP-1;
        const k=Math.exp(-0.5*(j/2.4)**2); a+=raw[m]*k; ww+=k;}
      sm[i]=a/ww;}
    PEN(c,"#2c6f9b",2.2); c.beginPath();
    for(let i=0;i<NP;i++){
      const wl=LO+(HI-LO)*i/(NP-1);
      const db=Math.max(10*Math.log10(sm[i]),-34);
      i?c.lineTo(F.X(wl),F.Y(db)):c.moveTo(F.X(wl),F.Y(db));
    }
    c.stroke();
    c.fillStyle="#8A99A8"; c.font="9.5px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="center";
    for(let l=LO+0.5;l<HI;l+=1.0) c.fillText(l.toFixed(1),F.X(l),h-9);
    c.textAlign="right";
    for(let v=0;v>=-30;v-=10) c.fillText(v+" dB",padL-5,F.Y(v)+3);
    c.textAlign="left";
  }};

/* ── APhO 2026 E1 · the bench itself, in the simulator's own view ── */
const SIG_A26E1={
  sim:"sim/apho2026_E1_web.html", tag:"APhO 2026 E1", span:95, rate:7,
  capL:{ko:"물시계 · 받침대 위 탱크 A가 5 mm 구멍으로 빠져나간다",
        en:"Water clock · tank A on its stand, draining through the 5 mm hole"},
  capR:{ko:"경과",en:"elapsed"},
  read(t){ return mmss(Math.min(t,95)); },
  paint(c,W,H,t){
    /* the simulator's own oblique projection, geometry, layout and palette */
    const G=981, KC=0.91355, KS=0.40674;
    const TW=10.0, TD=10.0, WALL=0.5, A_H=15.1, A_OUT=1.0, N_MARKS=13;
    const B_H=15.2, B_HOLE=0.7, MEN=0.22;
    const BX0=3.0, BX1=48.0, BZ0=0.0, BZ1=28.0, BH=16.0, BW=0.6, BFL=0.6;
    const BASE_W=30.0, BASE_D=22.0, BASE_T=1.2;
    const ST_W=25.0, ST_D=12.0, ST_STEP_X=13.0, ST_TALL=27.0, ST_STEP=9.0;
    const PED=0.8;
    /* base in the bin, stand on the base, tank A high and tank B low */
    const bx0=7.0, bz0=1.5, plateY=BFL+PED+BASE_T;
    const sx0=12.0, sz0=8.0, standY=plateY;
    const ax0=sx0+1.0, az0=sz0+0.5, aY=standY+ST_TALL;
    const bx0b=sx0+13.5, bz0b=sz0+0.5, bY=standY+ST_STEP;
    const D=0.5, A_HOLE=Math.PI*(D/2)*(D/2), CD=0.8, H0=12.0;
    const H_STOP=72.0/(G*(D/2)), KK=CD*A_HOLE*Math.sqrt(2*G)/(2*TW*TD);
    const rt=Math.sqrt(H0)-KK*t;
    const head=Math.max(rt>0?rt*rt:0,H_STOP);
    const flowing=head>H_STOP+0.004;
    const drained=(H0-head)*TW*TD;                 /* cm^3 that have left tank A */
    const pool=BFL+drained/((BX1-BX0-2*BW)*(BZ1-BZ0-2*BW));
    /* fit the whole rig, the way the app frames its bench */
    const aTop=aY+WALL+A_H;
    const UMIN=KC*(BX0+BZ0), UMAX=KC*(BX1+BZ1);
    const VMIN=KS*(BZ0-BX1), VMAX=aTop+KS*(az0+TD+WALL-ax0);
    const S=Math.min((W-16)/(UMAX-UMIN),(H-12)/(VMAX-VMIN));
    const OX=(W-(UMAX-UMIN)*S)/2-UMIN*S, OY=(H-(VMAX-VMIN)*S)/2+VMAX*S;
    const P=(x,y,z)=>[OX+KC*(x+z)*S, OY-(y+KS*(z-x))*S];
    const poly=(pts,fill,stroke,lw)=>{
      c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
      c.closePath();
      if(fill){c.fillStyle=fill;c.fill();}
      if(stroke){PEN(c,stroke,lw||1);c.stroke();}};
    const line=(pts,col,lw)=>{ PEN(c,col,lw||1);
      c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]); c.stroke();};
    const box=(x0,x1,y0,y1,z0,z1,top,side,front,edge)=>{
      poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],side,edge,1);
      poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],top,edge,1);
      poly([P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)],front,edge,1);};
    const water=(x0,x1,z0,z1,yf,ys,dark)=>{ if(ys<=yf+1e-6) return;
      const top=dark?"#2b6f95":"#7fd0ee", sd=dark?"#1f5878":"#3f9fd0",
            fr=dark?"#24638a":"#4aa7d4", rim=dark?"#7fc0dd":"#bfe8fa";
      poly([P(x1,yf,z0),P(x1,yf,z1),P(x1,ys,z1),P(x1,ys,z0)],sd,null);
      poly([P(x0,yf,z0),P(x1,yf,z0),P(x1,ys,z0),P(x0,ys,z0)],fr,null);
      poly([P(x0,ys,z0),P(x1,ys,z0),P(x1,ys,z1),P(x0,ys,z1)],top,dark?"#4d90b2":"#8fd3ee",1);
      poly([P(x0,ys,z0),P(x1,ys,z0),P(x1,ys+MEN,z0),P(x0,ys+MEN,z0)],rim,null);
      poly([P(x1,ys,z0),P(x1,ys,z1),P(x1,ys+MEN,z1),P(x1,ys+MEN,z0)],rim,null);};
    const glassBack=(x0,x1,y0,y1,z0,z1)=>{
      const i0=x0+WALL, i1=x1-WALL, j0=z0+WALL, j1=z1-WALL, fl=y0+WALL;
      poly([P(i0,fl,j1),P(i1,fl,j1),P(i1,y1,j1),P(i0,y1,j1)],"#dbe9ef","#9dbecb",1);
      poly([P(i0,fl,j0),P(i0,fl,j1),P(i0,y1,j1),P(i0,y1,j0)],"#d3e3ea","#9dbecb",1);
      poly([P(i0,fl,j0),P(i1,fl,j0),P(i1,fl,j1),P(i0,fl,j1)],"#eff8fb","#b6d0d9",1);};
    const glassFront=(x0,x1,y0,y1,z0,z1)=>{
      poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],null,"#dff1f7",2);
      poly([P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)],null,"#f2fbff",2);
      line([P(x1-3.4,y0+1.0,z0),P(x1-1.4,y1-1.0,z0)],"#eaf6fa",1);
      poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],null,"#eaf6fa",2);
      poly([P(x0+WALL,y1,z0+WALL),P(x1-WALL,y1,z0+WALL),
            P(x1-WALL,y1,z1-WALL),P(x0+WALL,y1,z1-WALL)],null,"#d3e6ec",1);};
    /* the room behind, and the desk the bin stands on */
    c.fillStyle="#2a3038"; c.fillRect(0,0,W,H);
    const NP=(x,y,z)=>P(x,y,z);
    poly([NP(-40,0,-30),NP(120,0,-30),NP(120,0,60),NP(-40,0,60)],"#b8926a",null);
    for(let i=-40;i<120;i+=9) line([NP(i,0,-30),NP(i,0,60)],"#9d7a56",1);
    /* the bin, from behind */
    const i0=BX0+BW, i1=BX1-BW, j0=BZ0+BW, j1=BZ1-BW;
    poly([P(i0,BFL,j0),P(i1,BFL,j0),P(i1,BFL,j1),P(i0,BFL,j1)],"#d3d9d9","#b3baba",1);
    for(let x=Math.floor(i0)+2;x<i1;x+=4) line([P(x,BFL,j0),P(x,BFL,j1)],"#c8cfcf",1);
    for(let z=Math.floor(j0)+2;z<j1;z+=4) line([P(i0,BFL,z),P(i1,BFL,z)],"#c8cfcf",1);
    poly([P(i0,BFL,j1),P(i1,BFL,j1),P(i1,BH,j1),P(i0,BH,j1)],"#e6eaea","#b3baba",1);
    poly([P(i0,BFL,j0),P(i0,BFL,j1),P(i0,BH,j1),P(i0,BH,j0)],"#e6eaea","#b3baba",1);
    poly([P(i1,BFL,j0),P(i1,BFL,j1),P(i1,BH,j1),P(i1,BH,j0)],"#d3d9d9","#b3baba",1);
    /* the levelling plate on its four pedals, and what is printed on it */
    for(const pd of [[bx0+2.5,bz0+2.0],[bx0+BASE_W-2.5,bz0+2.0],
                     [bx0+2.5,bz0+BASE_D-2.0],[bx0+BASE_W-2.5,bz0+BASE_D-2.0]]){
      const a=P(pd[0],BFL,pd[1]), b=P(pd[0],BFL+PED,pd[1]);
      line([a,b],"#1a1c20",Math.max(3,1.5*S));
      c.beginPath(); c.ellipse(a[0],a[1],0.95*S,0.43*S,0,0,7);
      c.fillStyle="#25282d"; c.fill(); PEN(c,"#0a0b0d",1); c.stroke(); }
    box(bx0,bx0+BASE_W,plateY-BASE_T,plateY,bz0,bz0+BASE_D,"#17181b","#0d0e10","#26282c","#000000");
    line([P(bx0+2,plateY,bz0+2),P(bx0+BASE_W-2,plateY,bz0+3.2)],"#3b4048",1);
    c.font="bold "+Math.max(6,0.7*S|0)+"px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="center"; c.textBaseline="middle";
    ["MAG","ISO","PWM"].forEach((q,i)=>{ const p=P(bx0+7+i*8,plateY,bz0+5);
      c.fillStyle="#1b3d6b"; c.fillText(q,p[0],p[1]); });
    /* the two-level stand */
    const xm=sx0+ST_STEP_X;
    box(xm,sx0+ST_W,standY,standY+ST_STEP,sz0,sz0+ST_D,"#33363c","#141518","#202226","#050506");
    box(sx0,xm,standY,standY+ST_TALL,sz0,sz0+ST_D,"#3a3e45","#141518","#202226","#050506");
    for(let i=1;i<5;i++)
      line([P(sx0+0.15*i,standY,sz0),P(sx0+0.15*i,standY+ST_TALL,sz0)],"#2a2d33",1);
    /* tank B on the low step, its plug still in */
    const b0=bx0b, b1=bx0b+TW+2*WALL, bz1=bz0b+TD+2*WALL, bTop=bY+WALL+B_H;
    glassBack(b0,b1,bY,bTop,bz0b,bz1);
    water(b0+WALL,b1-WALL,bz0b+WALL,bz1-WALL,bY+WALL,bY+WALL+9.4);
    glassFront(b0,b1,bY,bTop,bz0b,bz1);
    { const oy=bY+WALL+B_HOLE, zc=(bz0b+bz1)/2;
      const a=P(b1,oy,zc), q=P(b1+0.9,oy,zc);
      line([a,q],"#b7bcc1",Math.max(3,1.0*S));
      c.beginPath(); c.arc(q[0],q[1],0.45*S,0,7);
      c.fillStyle="#fbfbf8"; c.fill(); PEN(c,"#b9bcb6",1); c.stroke(); }
    /* tank A on the tall step: glass behind, the water, then the glass in front */
    const a0=ax0, a1=ax0+TW+2*WALL, az1=az0+TD+2*WALL, aTopY=aY+WALL+A_H;
    const ix0=a0+WALL, ix1=a1-WALL, iz0=az0+WALL, iz1=az1-WALL;
    const FL=aY+WALL, YO=FL+A_OUT;
    glassBack(a0,a1,aY,aTopY,az0,az1);
    water(ix0,ix1,iz0,iz1,FL,YO+head);
    glassFront(a0,a1,aY,aTopY,az0,az1);
    /* the marks engraved down the left of the front face */
    const fs=Math.max(6,Math.min(0.52*S,12));
    c.font="bold "+fs.toFixed(1)+"px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="right"; c.textBaseline="middle";
    const every=S>7.5?1:2;
    for(let k=0;k<=N_MARKS;k++){ const y=YO+k; if(y>aTopY-0.2) break;
      line([P(ix0+1.35,y,iz0),P(ix0+4.35,y,iz0)],"#0d1f27",S>16?2:1);
      if(k%every===0){ const q=P(ix0+1.15,y,iz0);
        c.fillStyle="#0b1d24"; c.fillText(String(k),q[0],q[1]); } }
    /* the tap on the right wall: its body, its ribs, and the lever, shut */
    const zv=az0+WALL+8.0, dv=0.34;
    for(const seg of [[0.0,0.55,"#8e959c",0.42],[0.55,1.55,"#c3c9ce",0.52],
                      [1.55,2.05,"#a8aeb4",0.30],[2.05,2.95,"#c9ced3",0.36]])
      poly([P(a1+seg[0],YO-seg[3],zv-dv),P(a1+seg[1],YO-seg[3],zv-dv),
            P(a1+seg[1],YO+seg[3],zv-dv),P(a1+seg[0],YO+seg[3],zv-dv)],seg[2],"#5b6167",1);
    for(const rib of [2.25,2.55,2.85])
      line([P(a1+rib,YO-0.42,zv-dv),P(a1+rib,YO+0.42,zv-dv)],"#7d848a",1);
    { const p=P(a1+1.05,YO+0.5,zv-dv), L=2.9*S;
      const hx=p[0]+0.18*L, hy=p[1]+0.98*L;
      line([p,[hx,hy]],"#e8622a",Math.max(4,0.66*S));
      const r2=0.34*S;
      c.beginPath(); c.arc(hx,hy,r2,0,7);
      c.fillStyle="#ff8a4a"; c.fill(); PEN(c,"#8c3a12",1); c.stroke();
      c.beginPath(); c.arc(p[0],p[1],r2*0.8,0,7);
      c.fillStyle="#7d848a"; c.fill(); PEN(c,"#4d5359",1); c.stroke(); }
    /* the 4 mm plug still in, the 5 mm hole open and running */
    { const px=ix0+6.5, a=P(px,YO,az0), q=P(px,YO-1.1,az0-1.0);
      line([a,q],"#f4f4f0",Math.max(3,1.0*S));
      c.beginPath(); c.arc(q[0],q[1],0.62*S,0,7);
      c.fillStyle="#fbfbf8"; c.fill(); PEN(c,"#b9bcb6",1); c.stroke(); }
    { const hp=P(ix0+3.5,YO,az0);
      c.beginPath(); c.arc(hp[0],hp[1],0.32*S,0,7);
      c.fillStyle="#123039"; c.fill(); PEN(c,"#7f97a2",1); c.stroke(); }
    /* what the bin has caught so far */
    water(i0,i1,j0,j1,BFL,pool,true);
    /* the jet, traced the way the simulator traces it */
    if(flowing){
      /* the app clamps the landing point to the inside of the bin: the jet
         meets the front wall and runs down it into what is already caught */
      const v=CD*Math.sqrt(2*G*head), pts=[]; let hit=false;
      for(let i=0;i<200;i++){ const tau=i*0.006;
        const pz=az0-1.0-v*tau, py=YO-0.5*G*tau*tau;
        if(pz<=j0){ const th=(az0-1.0-j0)/v;
                    pts.push(P(ix0+3.5,YO-0.5*G*th*th,j0)); hit=true; break; }
        pts.push(P(ix0+3.5,py,pz));
        if(py<=pool) break; }
      const jw=Math.max(1.4,2.0*Math.sqrt(A_HOLE/Math.PI)*S);
      if(pts.length>1) line(pts,"#a6e0f4",jw);
      const tip=pts[pts.length-1];
      if(hit) line([tip,P(ix0+3.5,pool,j0)],"#a6e0f4",Math.max(1,0.45*jw));
      const ring=hit?P(ix0+3.5,pool,j0):tip;
      PEN(c,"#c8ecf8",1.2); c.beginPath();
      c.ellipse(ring[0],ring[1],0.62*S,0.32*S,0,0,7); c.stroke();
    }
    /* the bin's near walls last — translucent, ribbed */
    poly([P(BX0,0,BZ0),P(BX1,0,BZ0),P(BX1,BH,BZ0),P(BX0,BH,BZ0)],null,"#cfdada",2);
    for(let x=BX0+4;x<BX1;x+=6) line([P(x,0.4,BZ0),P(x,BH-0.6,BZ0)],"#c6d0d0",1);
    poly([P(BX1,0,BZ0),P(BX1,BH,BZ0),P(BX1,BH,BZ1),P(BX1,0,BZ1)],null,"#b8c2c2",1);
    poly([P(BX0-0.5,BH,BZ0-0.5),P(BX1+0.5,BH,BZ0-0.5),
          P(BX1+0.5,BH+0.5,BZ0-0.5),P(BX0-0.5,BH+0.5,BZ0-0.5)],"#e6eaea","#a8b2b2",1);
    poly([P(BX0,BH+0.5,BZ0),P(BX1,BH+0.5,BZ0),P(BX1,BH+0.5,BZ1),P(BX0,BH+0.5,BZ1)],null,"#cdd6d6",1);
    /* the two tanks are named on the bench, as the app names them */
    c.font="bold "+Math.max(8,Math.min(0.8*S,13)).toFixed(1)+"px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="right"; c.textBaseline="middle";
    c.fillStyle="#c3d6de";
    { const q=P(a0-0.6,aTopY-2.4,az0); c.fillText("A",q[0],q[1]); }
    { const q=P(b0-0.6,bTop-2.4,bz0b); c.fillText("B",q[0],q[1]); }
    c.textAlign="left"; c.textBaseline="alphabetic";
  }};

/* ── APhO 2026 E2 · the one number the kit gives, scrolled on the LEDs ── */
const MB_FONT={
  "0":["111","101","101","101","111"], "1":["010","110","010","010","111"],
  "2":["111","001","111","100","111"], "3":["111","001","111","001","111"],
  "4":["101","101","111","001","001"], "5":["111","100","111","001","111"],
  "6":["111","100","111","101","111"], "7":["111","001","001","010","010"],
  "8":["111","101","111","101","111"], "9":["111","101","111","001","111"]};
/* a 3.3 kΩ reference against three of the resistors in the kit */
const MB_REF=3300, MB_R=[6800,560,4700];
const MB_STREAM=(()=>{
  const cols=[], own=[];
  MB_R.forEach((R,vi)=>{
    const code=Math.round(1023*R/(R+MB_REF));
    for(let k=0;k<2;k++){ cols.push([0,0,0,0,0]); own.push(vi); }
    for(const ch of String(code)){
      const g=MB_FONT[ch];
      for(let x=0;x<3;x++){

  paint(c,w,h,t){

    c.fillStyle="#2c6f9b"; c.beginPath(); c.arc(X(dd),Y(V(dd)),3.4,0,7); c.fill();

                     this.SY+this.VY*t+this.R*Math.sin(this.OM*t)]; },
  srcVel(t){ return [this.VX-this.OM*this.R*Math.sin(this.OM*t),
                     this.VY+this.OM*this.R*Math.cos(this.OM*t)]; },
  tEm(t){                                       /* the page's own fixed point */
    let tb=t;

  curve(){ if(this._c) return this._c;

    const ok=pts.filter(p=>isFinite(p[1])).map(p=>p[1]);
    this._c={pts:pts, lo:Math.min.apply(null,ok), hi:Math.max.apply(null,ok)};

  read(t){ const y=this.f(t%this.span);

  paint(c,w,h,t){

    c.font=fs.toFixed(1)+"px 'Gill Sans',Calibri,sans-serif";

    const lo=Math.floor(C.lo/200)*200, hi=Math.ceil(C.hi/200)*200;
    const X=u=>L+u/25*(R-L), Y=v=>B-(v-lo)/(hi-lo)*(B-T);
    PEN(c,"rgba(255,255,255,0.3)",1); c.beginPath();
    for(let u=0;u<=25.001;u+=5){ c.moveTo(X(u),T); c.lineTo(X(u),B); }
    for(let v=lo;v<=hi+1e-6;v+=(hi-lo)/5){ c.moveTo(L,Y(v)); c.lineTo(R,Y(v)); }
    c.stroke();
    PEN(c,"#ffffff",1); c.beginPath();
    c.moveTo(L,T); c.lineTo(L,B); c.lineTo(R,B); c.stroke();
    c.fillStyle="#ffffff"; c.font=(fs*0.92).toFixed(1)+"px 'Gill Sans',Calibri,sans-serif";
    for(let u=0;u<=25.001;u+=5) c.fillText(String(u),X(u),B+fs*1.1);
    c.textAlign="right";
    for(let v=lo;v<=hi+1e-6;v+=(hi-lo)/5) c.fillText(String(Math.round(v)),L-6,Y(v));
    c.textAlign="center";
    c.fillText("Time (s)",(L+R)/2,h-fs*0.7);
    c.save(); c.translate(fs*1.0,(T+B)/2); c.rotate(-Math.PI/2);
    c.fillText("Frequency (Hz)",0,0); c.restore();
    /* the trace, laid down point by point the way the plot fills in */
    PEN(c,"#ffffff",1.8); c.beginPath();
    let down=true, lastX=null, lastY=null;
    for(const p of C.pts){
      if(p[0]>tt) break;

  rhoAir(z){ return z>=this.H_ATM ? 0
             : this.RHO_A0*Math.pow(1-z/this.H_ATM,1/(this.GAMMA-1)); },
  drop(hh,rcm,rhoG){
    const OM=2*Math.PI/this.T_DAY, r=rcm*1e-2, rho=rhoG*1e3;
    const kd=this.CD*(Math.PI*r*r)/(4/3*Math.PI*r*r*r*rho);
    const d=st=>{ const ra=this.rhoAir(st[1]), rx=st[2]-this.WIND, rz=st[3];
      const vr=Math.sqrt(rx*rx+rz*rz);
      return [st[2],st[3],-kd*ra*vr*rx-2*OM*st[3],

      let step=2e-3;
      if(st[3]<0&&st[1]/(-st[3])<step) step=Math.max(st[1]/(-st[3])*0.5,1e-6);
      const k1=d(st), s2=st.map((v,i)=>v+0.5*step*k1[i]);
      const k2=d(s2), s3=st.map((v,i)=>v+0.5*step*k2[i]);
      const k3=d(s3), s4=st.map((v,i)=>v+step*k3[i]);

  T(t){ return 0.6+3.0*(0.5+0.5*Math.cos(2*Math.PI*Math.min(t,this.span)/this.span)); },
  paint(c,w,h,t){
    /* nearest-neighbour correlation grows as the lattice cools past T_c=2.27 */
    const L=28, T=this.T(t), TC=2.269;
    const order=T>=TC?0:Math.pow(1-Math.pow(T/TC,4),0.125);
    const pad=Math.min(w,h)*0.06, cell=Math.min((w-2*pad)/L,(h-2*pad)/L);
    const ox=(w-cell*L)/2, oy=(h-cell*L)/2;

    const hash=(i,j)=>{ const x=Math.sin(i*127.1+j*311.7)*43758.5453; return x-Math.floor(x); };
    for(let i=0;i<L;i++) for(let j=0;j<L;j++){
      /* smooth blobs give the domains; the threshold moves with the order */
      const b=(hash(Math.floor(i/3),Math.floor(j/3))*0.6+hash(i,j)*0.4);
      const up = b > 0.5-order*0.42;
      c.fillStyle = up ? "#2c6f9b" : "#e9eef3";
      c.fillRect(ox+i*cell, oy+j*cell, cell-0.6, cell-0.6);

    PEN(c,"#B4CADC",1); c.strokeRect(ox,oy,cell*L,cell*L);
    c.fillStyle="#8A99A8"; c.font="9.5px IBM Plex Mono,ui-monospace,monospace";

  LAM:632.8e-9, LDIST:0.90, HALF:14, A_SPH:5.627e-6,
  L_RECT:58.59e-6, W_RECT:50.78e-6, DX:250e-6, DY:200e-6, PHI:27.0, N:24, VMAX:10.0,
  sinc2(z){ if(Math.abs(z)<1e-12) return 1; const q=Math.sin(z)/z; return q*q; },
  dir(z,N){ const d=Math.sin(z); if(Math.abs(d)<1e-9) return 1;
            const r=Math.sin(N*z)/(N*d); return r*r; },
  I(x,y){                                        /* x, y in metres on the screen */
    const L=this.LDIST, lam=this.LAM, u=x/L, v=y/L, p=this.PHI*Math.PI/180;
    const up=u*Math.cos(p)+v*Math.sin(p), vp=-u*Math.sin(p)+v*Math.cos(p);
    const env=this.sinc2(Math.PI*this.L_RECT*up/lam)*this.sinc2(Math.PI*this.W_RECT*vp/lam);
    const lat=this.dir(Math.PI*this.DX*up/lam,this.N)*this.dir(Math.PI*this.DY*vp/lam,this.N);
    const r=Math.sqrt(u*u+v*v), sd=Math.sqrt(3)/2*this.A_SPH;
    let ring=0;
    for(let m=1;m<=3;m++){ const r0=m*lam/sd; if(r0>0.5) break;
      ring+=1/m*Math.exp(-Math.pow((r-r0)/(0.045*r0),2)); }
    return this.VMAX*Math.exp(-Math.pow(r/0.34,2))*(env*lat+0.18*ring);
  },
  ANG:25, SPAN_CM:1.15,
  /* the orders the grid throws along the scan line: 250 um pitch at 90 cm */
  ORD(m){ return m*this.LAM*this.LDIST/this.DX*100; },   /* cm */
  probe(u){ const a=this.ANG*Math.PI/180;         /* u in cm along the scan line */
            return [u*Math.cos(a), u*Math.sin(a)]; },
  meter(u){ const p=this.probe(u);
            return Math.max(0,Math.min(this.VMAX,this.I(p[0]*1e-2,p[1]*1e-2))); },
  pattern(n){                                     /* painted once, then kept */
    if(this._pat&&this._pat.width===n) return this._pat;
    const cv=document.createElement("canvas"); cv.width=n; cv.height=n;
    const g=cv.getContext("2d"), img=g.createImageData(n,n), px=img.data;
    const col=[255,60,50], cm=2*this.HALF/n;
    /* the grid spots are far finer than a pixel, so the middle is sampled
       within the pixel and the brightest sample kept — the screen itself
       integrates the same way */
    for(let j=0;j<n;j++){ const yy=(n/2-j)/(n/2)*this.HALF;
      for(let i=0;i<n;i++){ const xx=(i-n/2)/(n/2)*this.HALF;
        let v=this.I(xx*1e-2,yy*1e-2);
        if(Math.hypot(xx,yy)<4.0){
          for(let q=0;q<9;q++){
            const dx=((q%3)-1)*cm/3, dy=((q/3|0)-1)*cm/3;
            const u=this.I((xx+dx)*1e-2,(yy+dy)*1e-2);
            if(u>v) v=u; } }
        const a=Math.min(1,v/2.2);
        if(a<0.008) continue;
        const k=4*(j*n+i);
        px[k]=col[0]*a; px[k+1]=col[1]*a; px[k+2]=col[2]*a; px[k+3]=255; } }
    g.putImageData(img,0,0);
    this._pat=cv; return cv;
  },
  /* the detector is parked on one order at a time, the way D.2 is measured */
  at(t){ const K=7, u=(t%this.span)/this.span*K, k=Math.min(K-1,Math.floor(u)), f=u-k;
         const a=this.ORD(k-3), b=this.ORD(Math.min(k+1,K-1)-3);
         const e=f<0.3 ? (1-Math.cos(Math.PI*f/0.3))/2 : 1;
         return k===0 ? a : this.ORD(k-4)+(a-this.ORD(k-4))*e; },
  read(t){ return this.meter(this.at(t)).toFixed(2)+" V"; },
  paint(c,w,h,t){
    c.fillStyle="#282828"; c.fillRect(0,0,w,h);
    const pad=Math.max(8,h*0.05);
    const side=Math.min(h-2*pad, w*0.54);
    const sx=pad, sy=(h-side)/2;
    c.fillStyle="#000"; c.fillRect(sx,sy,side,side);
    c.drawImage(this.pattern(Math.min(460,Math.round(side*1.6))),sx,sy,side,side);
    /* the photodetector, the small yellow dot the app draws on the screen */
    const S=side/(2*this.HALF), cx=sx+side/2, cy=sy+side/2;
    const u=this.at(t), p=this.probe(u);
    c.fillStyle="#e8e838";
    c.fillRect(cx+p[0]*S-2, cy-p[1]*S-2, 4, 4);
    PEN(c,"rgba(232,232,56,.35)",1); c.beginPath();
    c.moveTo(cx+this.probe(-this.SPAN_CM)[0]*S, cy-this.probe(-this.SPAN_CM)[1]*S);
    c.lineTo(cx+this.probe(this.SPAN_CM)[0]*S, cy-this.probe(this.SPAN_CM)[1]*S);
    c.stroke();
    /* the side panel: the readings, then the scan the app plots under them */
    const bx=sx+side+Math.max(12,w*0.03), bw=w-bx-pad;
    const fs=Math.max(9,Math.min(13,h*0.042));
    c.font=fs.toFixed(1)+"px 'Gill Sans',Calibri,sans-serif";
    c.textAlign="left"; c.textBaseline="middle";
    let ty=sy+fs;
    const row=(k,v)=>{ c.fillStyle="#9c9c9c"; c.fillText(k,bx,ty);
      c.fillStyle="#f0f0f0"; c.textAlign="right"; c.fillText(v,bx+bw,ty);
      c.textAlign="left"; ty+=fs*1.7; };
    row("laser","632.8 nm"); row("L","90.00 cm");
    row("x",(p[0]).toFixed(2)+" cm"); row("y",(p[1]).toFixed(2)+" cm");
    c.fillStyle="#9c9c9c"; c.fillText("photodetector",bx,ty); ty+=fs*1.5;
    c.font="bold "+(fs*1.5).toFixed(1)+"px Consolas,monospace";
    c.fillStyle="#e8e838"; c.fillText(this.meter(u).toFixed(2)+" V",bx,ty);
    ty+=fs*1.6;
    const gh=Math.max(46,h*0.26), gy=Math.min(ty,sy+side-gh);
    c.fillStyle="#282828"; c.fillRect(bx,gy,bw,gh);
    PEN(c,"#4a4a4a",1); c.strokeRect(bx,gy,bw,gh);
    /* the finished scan, each column keeping the brightest sample in it */
    const uX=uu=>bx+(uu+this.SPAN_CM)/(2*this.SPAN_CM)*bw;
    PEN(c,"rgba(232,232,56,.35)",1); c.beginPath();
    c.moveTo(uX(u),gy); c.lineTo(uX(u),gy+gh); c.stroke();
    PEN(c,"#e8e838",1.2); c.beginPath();
    const NP=Math.max(40,Math.round(bw));
    for(let i=0;i<=NP;i++){
      const uu=-this.SPAN_CM+2*this.SPAN_CM*i/NP;
      let v=0;
      for(let q=0;q<9;q++){
        const g2=this.meter(uu+(q-4)*(2*this.SPAN_CM/NP)/9);
        if(g2>v) v=g2; }
      const Y=gy+gh-4-v/this.VMAX*(gh-8);
      i?c.lineTo(uX(uu),Y):c.moveTo(uX(uu),Y);
    }
    c.stroke();
    c.textBaseline="alphabetic";
  }};

  paint(c,w,h,t){
    /* a gaussian D0 peak on a falling background; tightening the impact
       parameter cut kills the background and leaves the peak */
    const M0=1864.8, SIG=9.0, LO=1800, HI=1930;
    const k=this.cut(t);
    const bg=m=>60*k*Math.exp(-(m-LO)/140);
    const sig=m=>135*Math.exp(-0.5*Math.pow((m-M0)/SIG,2))*(1.15-0.15*k);
    const YM=200, pad=16, padL=40, padB=22;

    c.stroke(); c.setLineDash([]);
    PEN(c,"#2c6f9b",2.2); c.beginPath();
    for(let i=0;i<=200;i++){ const m=LO+(HI-LO)*i/200, v=bg(m)+sig(m);
      i?c.lineTo(X(m),Y(v)):c.moveTo(X(m),Y(v)); }

/* ── EuPhO 2021 E2 · heat crawling along the rod ────────────────── */
const SIG_E21E2={
  sim:"sim/eupho2021_E2_web.html", tag:"EuPhO 2021 E2", span:70, rate:30,
  capL:{ko:"주최측 콘솔 프로그램 \"rod\" · 다섯 센서가 읽어 내리는 표",
        en:"The organisers' console program \"rod\" · the table its five sensors print"},
  capR:{ko:"가열부 온도",en:"heated end"},
  /* the page's own solver, with the constants the official solution extracts */
  C:115.0, K:400.0, ALPHA:2.90, BETA:0.30, LROD:0.30, RROD:0.01, LHEAT:0.03,
  MASS:0.460, T0C:26.9, T0K:300.0, SIG:5.67e-8, NX:41,
  simulate(power,heatDur,tStart,tEnd,dtOut,sensors){
    const nx=this.NX, dx=this.LROD/(nx-1);
    const area=Math.PI*this.RROD*this.RROD, perim=2*Math.PI*this.RROD;
    const rho=this.MASS/(area*this.LROD), rhoC=rho*this.C;
    const k=this.K, bs=this.BETA*this.SIG, t0k=this.T0K, t04=t0k*t0k*t0k*t0k;
    const poa=perim/area, invDx2=1/(dx*dx), invHalf=1/(0.5*dx);
    const dt=Math.min(0.4*dx*dx/(k/rhoC),0.05);
    let T=new Float64Array(nx), Tn=new Float64Array(nx);
    for(let i=0;i<nx;i++) T[i]=t0k;
    let nHeat=0;
    while(nHeat<nx&&nHeat*dx<=this.LHEAT+1e-12) nHeat++;
    const qVol=nHeat?power/(area*(nHeat-0.5)*dx)/rhoC:0;
    const idx=sensors.map(x=>Math.min(nx-1,Math.max(0,Math.round(x/dx))));
    const out=[]; let t=0, next=tStart;
    while(t<tEnd-1e-12){
      const step=dt<tEnd-t?dt:tEnd-t, heating=t<heatDur;
      for(let i=0;i<nx;i++){
        const Ti=T[i];
        const lap = i===0 ? 2*(T[1]-Ti)*invDx2
                  : i===nx-1 ? 2*(T[nx-2]-Ti)*invDx2
                  : (T[i+1]-2*Ti+T[i-1])*invDx2;
        const flux=this.ALPHA*(Ti-t0k)+bs*(Ti*Ti*Ti*Ti-t04);
        let d=(k*lap-poa*flux)/rhoC;
        if(heating&&i<nHeat) d+=qVol;
        if(i===0||i===nx-1) d-=flux*invHalf/rhoC;
        Tn[i]=Ti+d*step;
      }
      const sw=T; T=Tn; Tn=sw; t+=step;
      while(next<=t+1e-9&&next<=tEnd){
        const row=[next];
        for(const j of idx) row.push(T[j]-t0k+this.T0C);
        out.push(row); next+=dtOut;
      }
    }
    return out;
  },
  XS:[2,8,15,22,29],
  build(){
    if(this._f) return this._f;
    const rows=this.simulate(300,120,0,300,20,this.XS.map(x=>x*0.01));
    this._rows=rows;
    let head="  t(s)  ";
    for(let i=0;i<this.XS.length;i++) head+="   T"+(i+1)+"(C)  ";
    const f=[
      {s:"EuPhO 2021 - Experiment 2: Hot Cylinder"},
      {s:"L = 30 cm, r = 1 cm, m = 460 g, T0 = 26.9 C, heater over 0..3 cm.",dim:true},
      {s:""},
      {s:"Enter the heating power in W (max 300 W): ",ans:"300"},
      {s:"Enter the heating duration in s: ",ans:"120"},
      {s:"Enter the starting and finishing time (s): ",ans:"0 300"},
      {s:"Enter the time step between measurements (s): ",ans:"20"},
      {s:"Enter up to 5 sensor locations (cm): ",ans:this.XS.join(" ")},
      {s:""},
      {s:"Experiment: P = 300 W for 120 s; from 0 s to 300 s every 20 s."},
      {s:"Sensors at "+this.XS.join(" cm, ")+" cm.",dim:true},
      {s:""},
      {s:head,dim:true}];
    this._head=f.length;
    for(const r of rows){
      let line=termPad(r[0].toFixed(1),7)+" ";
      for(let j=1;j<r.length;j++) line+=termPad(r[j].toFixed(2),9)+" ";
      f.push({s:line});
    }
    this._f=f; this._n=termLen(f);
    return f;
  },
  read(t){ this.build();
    const shown=termCut(this._f,Math.round(t*this._n/this.span)).length;
    const k=Math.max(0,Math.min(this._rows.length-1,shown-this._head-1));
    return this._rows[k][1].toFixed(1)+" \u00b0C"; },
  paint(c,w,h,t){
    const f=this.build();
    termPaint(c,w,h,"EuPhO 2021 E2 \u2014 Hot Cylinder",f,
              Math.round(t*this._n/this.span));
  }};

const SIG_E20E1={
  sim:"sim/eupho2020_E1_web.html", tag:"EuPhO 2020 E1", span:58, rate:24,
  capL:{ko:"주최측 콘솔 프로그램 · 전자빔을 쏘아 숨은 전하를 찾는다",
        en:"The organisers' console program · fire the beam, hunt the hidden charge"},
  capR:{ko:"스크린 도달점",en:"landing"},
  /* EuPhO published the C++ source; these are its own numbers */
  RP:[0.05435205,-0.0259338,-0.1150416], QP:-8.62193e-11,
  ME:9.10938356e-31, E0:1.60217662e-19, KE:8.9875517923e9,
  solve(x0,y0,v0){
    const RP=this.RP;
    const acc=(x,y,z)=>{ const r2=x*x+y*y+z*z;
      const k=-this.KE*this.QP*this.E0/(r2*Math.sqrt(r2))/this.ME;
      return [k*x,k*y,k*z]; };
    let dx=x0-RP[0], dy=y0-RP[1], dz=-10-RP[2];
    let vx=0, vy=0, vz=v0;
    for(let i=0;i<400000;i++){
      const rx=dx+RP[0], ry=dy+RP[1], rz=dz+RP[2];
      if(Math.sqrt(rx*rx+ry*ry+rz*rz)>1000) break;
      const a=acc(dx,dy,dz);
      const dt=100/Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]);
      const b=acc(dx+vx*dt,dy+vy*dt,dz+vz*dt);
      const ex=0.5*(a[0]+b[0]), ey=0.5*(a[1]+b[1]), ez=0.5*(a[2]+b[2]);
      const hf=0.5*dt*dt;
      dx+=vx*dt+ex*hf; dy+=vy*dt+ey*hf; dz+=vz*dt+ez*hf;
      vx+=ex*dt; vy+=ey*dt; vz+=ez*dt;
      if(dz+RP[2]>0){ const px=dx+RP[0], py=dy+RP[1];
        const on=px>=-0.2&&px<=0.2&&py>=-0.2&&py<=0.2;
        return [on,px,py]; }
    }
    return [false,0,0];
  },
  RUNS:[[1000,0,0],[1000,4,-2],[4000,6,-3]],
  build(){
    if(this._f) return this._f;
    const sep=new Array(49).join("-");
    const g=x=>String(Math.round(x*1e6)/1e6);
    const f=[];
    this._hit=[];
    for(const run of this.RUNS){
      const r=this.solve(run[1]/100,run[2]/100,Math.sqrt(2*run[0]*this.E0/this.ME));
      this._hit.push(r);
      f.push({s:"Beam accelerating voltage in V: ",ans:String(run[0])});
      f.push({s:"x-coordinate of the electron beam in cm: ",ans:String(run[1])});
      f.push({s:"y-coordinate of the electron beam in cm: ",ans:String(run[2])});
      f.push({s:"Electron beam fired with parameters (x, y, V) = ("+
                g(run[1])+"cm, "+g(run[2])+"cm, "+g(run[0])+"V)"});
      f.push(r[0] ? {s:"Electron detected at (x, y) = ("+(r[1]*100).toFixed(1)+
                       "cm, "+(r[2]*100).toFixed(1)+"cm)",acc:true}
                  : {s:"Electron not detected...",dim:true});
      f.push({s:sep,dim:true});
    }
    this._f=f; this._n=termLen(f);
    return f;
  },
  read(t){ this.build();
    const k=Math.min(this.RUNS.length-1,Math.floor(t/(this.span/this.RUNS.length)));
    const r=this._hit[k];
    return r[0] ? (r[1]*100).toFixed(1)+", "+(r[2]*100).toFixed(1)+" cm" : "\u2014"; },
  paint(c,w,h,t){
    const f=this.build();
    termPaint(c,w,h,"EuPhO 2020 Experiment 1 \u2014 Hidden Charge",f,
              Math.round(t*this._n/this.span));
  }};

/* ── EuPhO 2020 E2 · the sealed box, shaken on purpose ──────────── */
const SIG_E20E2={
  sim:"sim/eupho2020_E2_web.html", tag:"EuPhO 2020 E2", span:14, rate:1,
  capL:{ko:"가속도를 지정해 흔드는 상자 · 읽을 수 있는 것은 힘뿐",
        en:"Drive the box with an acceleration you choose · all you read is the force"},
  capR:{ko:"바닥이 받는 힘",en:"force"},
  state(t){
    /* two masses on two springs inside; the box is driven in steps */
    const T=t%this.span, A=(T<this.span*0.5)? 3.0 : -2.2;
    const w1=6.4, w2=3.1;
    const y2=(A/ (w1*w1))*(1-Math.cos(w1*T))*22;
    const y3=(A/ (w2*w2))*(1-Math.cos(w2*T))*30;
    const F=(0.6+0.25+0.18)*9.81 + (0.25*A*Math.cos(w1*T)+0.18*A*Math.cos(w2*T));
    return {A:A, y2:y2, y3:y3, F:F};
  },
  read(t){ return this.state(t).F.toFixed(2)+" N"; },
  paint(c,w,h,t){
    const st=this.state(t), S=Math.min(w,h);
    const bw=S*0.30, bh=S*0.56, bx=w*0.30-bw/2, by=h*0.5-bh/2 + (st.A>0?-4:4);
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    /* the box */
    c.fillStyle="#f2f4f6"; c.fillRect(bx,by,bw,bh);
    PEN(c,"#7d848a",2.4); c.strokeRect(bx,by,bw,bh);
    /* first spring and its mass */
    const cx=bx+bw/2, top=by+6;
    const y2=top+bh*0.30+st.y2;
    PEN(c,"#9aa3ab",1.6); c.beginPath();
    for(let i=0;i<=24;i++){ const u=i/24, yy=top+(y2-top)*u;
      c.lineTo(cx+((i%2)?7:-7),yy); }
    c.stroke();
    c.fillStyle="#5c6773"; c.fillRect(cx-13,y2,26,13);
    /* second spring and its mass */
    const y3=y2+13+bh*0.22+st.y3;
    PEN(c,"#9aa3ab",1.6); c.beginPath();
    for(let i=0;i<=20;i++){ const u=i/20, yy=y2+13+(y3-y2-13)*u;
      c.lineTo(cx+((i%2)?6:-6),yy); }
    c.stroke();
    c.fillStyle="#8d949b"; c.fillRect(cx-10,y3,20,11);
    /* the acceleration being applied, and the force that comes back */
    PEN(c,"#e8622a",2.4); c.beginPath();
    const ay=by-16, al=Math.sign(st.A)*22;
    c.moveTo(cx,ay); c.lineTo(cx,ay-al); c.stroke();
    c.beginPath(); c.moveTo(cx,ay-al); c.lineTo(cx-5,ay-al+Math.sign(st.A)*7);
    c.lineTo(cx+5,ay-al+Math.sign(st.A)*7); c.closePath(); c.fillStyle="#e8622a"; c.fill();
    /* the force trace, which is the only thing the program gives you */
    const gx=w*0.56, gw=w-gx-20, gy=20, gh=h-46;
    PEN(c,"#DCE7F0",1); c.strokeRect(gx,gy,gw,gh);
    PEN(c,"#2c6f9b",2); c.beginPath();
    for(let i=0;i<=160;i++){ const tt=(t-this.span*0.9)+this.span*0.9*i/160;
      const F=this.state(Math.max(0,tt)).F;
      const yy=gy+gh*(1-(F-6)/8);
      i?c.lineTo(gx+gw*i/160,yy):c.moveTo(gx+gw*i/160,yy); }
    c.stroke();
    c.fillStyle="#8A99A8"; c.font="10px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="left";
    c.fillText("a = "+st.A.toFixed(1)+" m/s\u00b2",12,h-12);
    c.fillText("F = "+st.F.toFixed(2)+" N",gx,h-12);
  }};

  capR:{ko:"박스 시간",en:"box time"},

      c.fillStyle="#8A99A8"; c.fillText(v.toFixed(2),px,Y(v)-9); c.fillText("T"+(i+1),px,ry+26);
    }
  }};

/* only the ones the site actually publishes a browser build for */
function liveSigs(){
  const have=new Set();
  for(const k in DATA) for(const y of DATA[k].years)
    for(const p of (y.problems||[])){
      if(p.hold) continue;
      if(p.files&&(p.files.sim||p.files.exe||p.files.src)) have.add(DATA[k].abbr+" "+y.y+" "+p.id);
    }
  const ok=ALL_SIGS.filter(s=>have.has(s.tag));
  return ok.length?ok:ALL_SIGS;
}
/* a cover without a browser build sends you to its year instead */
function heroHref(sig){
  if(sig.sim) return sig.sim+"?lang="+lang;
  const p=sig.tag.split(" ");
  return "#/"+p[0].toLowerCase()+"/"+p[1];
}
function pickHero(){
  const ok=liveSigs();
  heroPick=ok[Math.floor(Math.random()*ok.length)];
  return heroPick;
}

function startHero(){
  const cv=document.getElementById("deflect"); if(!cv||!heroPick) return;
  const ctx=cv.getContext("2d"), sig=heroPick;
  const dpr=Math.min(devicePixelRatio||1,2);
  function fit(){
    const w=cv.clientWidth||660;
    cv.width=Math.round(w*dpr); cv.height=Math.round(w*.74*dpr);
    cv.style.height=(w*.74)+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit();
  const clock=document.getElementById("figClock");
  const show=t=>{ sig.paint(ctx,cv.clientWidth,cv.clientWidth*.74,t);
                  if(clock) clock.textContent=sig.read(t); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ show(sig.span); return; }
  const rate=sig.rate||1;
  let t0=null;
  (function loop(now){
    if(t0===null)t0=now;
    show(((now-t0)/1000*rate)%(sig.span*1.18));
    animId=requestAnimationFrame(loop);
  })(performance.now());
  addEventListener("resize",()=>{fit();});
}

const SITE = "HaslaLab";
function setDocTitle(first, second){
  const d=UI[lang], parts=[];
  if(first==="about")            parts.push(d.hAbout);
  else if(first==="comps")       parts.push(d.hComps);
  else if(first && DATA[first]){
    const c=DATA[first];
    parts.push(second ? `${c.abbr} ${second}` : `${c.abbr} \u2014 ${c.full[lang]}`);
  }
  const tail = lang==="ko" ? "물리올림피아드 실험 시뮬레이터"
                           : "Physics Olympiad Experimental Simulations";
  document.title = parts.length ? `${parts[0]} \u00b7 ${SITE}` : `${SITE} \u2014 ${tail}`;
}

function mountHaslaAdFit(){
  const slots=document.querySelectorAll(".haslalab-adfit-slot");
  if(!slots.length) return;
  const desktop=matchMedia("(min-width: 768px)").matches;
  const ads=desktop
    ? {primary:{unit:"DAN-SftG79uMQrQr81Vk",width:728,height:90},secondary:{unit:"DAN-yC9q3CmZpKwsFdMz",width:728,height:90}}
    : {primary:{unit:"DAN-iGyhh2ByjtPoCpiA",width:320,height:50},secondary:{unit:"DAN-z8B8tUfB0Ev740NV",width:320,height:100}};
  slots.forEach(slot=>{
    const ad=ads[slot.dataset.adPlacement]||ads.primary;
    slot.closest(".adfit-banner").classList.toggle("adfit-banner--desktop",desktop);
    const ins=document.createElement("ins");
    ins.className="kakao_ad_area";
    ins.style.display="none";
    ins.dataset.adUnit=ad.unit;
    ins.dataset.adWidth=String(ad.width);
    ins.dataset.adHeight=String(ad.height);
    slot.append(ins);
  });
  const script=document.createElement("script");
  script.src="https://t1.kakaocdn.net/kas/static/ba.min.js";
  script.async=true;
  document.body.append(script);
}

function render(){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  const d=UI[lang];
  const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const [first,second]=parts;

  let html, active;
  if(first==="about"){            html=viewAbout();  active="about"; }
  else if(first==="comps"){       html=viewComps();  active="comps"; }
  else if(first && DATA[first]){  html=second?viewYear(first,second):viewComp(first); active="comps"; }
  else {                          html=viewHome();   active="home";  }
  document.getElementById("view").innerHTML=html;
  document.documentElement.lang = lang;
  setDocTitle(first, second);

  document.getElementById("nav").innerHTML=
    `<a href="#/" class="${active==="home"?"on":""}">${d.navHome}</a>
     <a href="#/comps" class="${active==="comps"?"on":""}">${d.navComps}</a>
     <a href="#/about" class="${active==="about"?"on":""}">${d.navAbout}</a>`;
  document.getElementById("footL").textContent=d.footL;
  document.getElementById("footTop").textContent=d.footTop;
  mountHaslaAdFit();

  buildRails();
  if(active==="home") startHero();
}

addEventListener("hashchange",()=>{ render(); scrollTo({top:0,behavior:"instant"}); });
render();
</script>
</body>
</html>
