<style>
/* ═══════ tokens — the bench and the millimetre sheet ═══════ */
:root{
  --paper:#FBFCFD; --grid-fine:#DCE7F0; --grid-bold:#B4CADC;
  --ink:#16212E; --graphite:#5C6B7A; --rail:#2E3945;
  --laser:#E02424; --brass:#B8862B;
  --fine:8px; --bold:40px;
  --sans:"IBM Plex Sans","IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-fine) .5px,transparent .5px),
    linear-gradient(90deg,var(--grid-fine) .5px,transparent .5px),
    linear-gradient(var(--grid-bold) .6px,transparent .6px),
    linear-gradient(90deg,var(--grid-bold) .6px,transparent .6px);
  background-size:var(--fine) var(--fine),var(--fine) var(--fine),
                  var(--bold) var(--bold),var(--bold) var(--bold);
}
.shell{max-width:1180px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.shell{padding:0 18px}}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.022em}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.19em;
         text-transform:uppercase;color:var(--graphite)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--laser);outline-offset:3px;border-radius:3px}

/* ═══════ header ═══════ */
header{position:sticky;top:0;z-index:40;background:rgba(251,252,253,.87);
       backdrop-filter:blur(9px);border-bottom:1px solid var(--grid-bold)}
.hrow{display:flex;align-items:center;gap:24px;height:62px}
.mark{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:650;letter-spacing:-.03em}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--laser);flex:none;
        box-shadow:0 0 0 3px rgba(224,36,36,.16)}
.mark em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
         color:var(--graphite);text-transform:uppercase;padding-left:2px}
nav{display:flex;gap:20px;margin-left:6px}
nav a{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--graphite);
      padding:4px 0;border-bottom:1.5px solid transparent;transition:.15s}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--laser)}
/* mobile: the menu drops to its own row instead of disappearing */
@media(max-width:860px){
  .hrow{height:auto;min-height:56px;flex-wrap:wrap;align-items:center;
        padding-top:9px;gap:8px 14px;row-gap:0}
  nav{order:3;width:100%;margin:6px 0 0;gap:0;
      border-top:1px solid var(--grid-bold)}
  nav a{flex:1;text-align:center;padding:12px 2px 10px;font-size:12.5px;white-space:nowrap;letter-spacing:0;
        border-bottom:2px solid transparent}
  nav a:hover,nav a.on{border-color:var(--laser)}
}
@media(max-width:430px){
  .mark{font-size:15.5px;gap:7px}
  .mark em{display:none}
  .mark img{width:24px;height:24px}
  .lang button{padding:5px 8px;gap:6px;font-size:11px}
  .lflag{height:11.5px}
  .lflag.ko{width:17.25px}
  .lflag.en{width:23px}
  .flag.card{width:38px}
  nav a{font-size:12px;letter-spacing:.03em}
}
.lang{margin-left:auto;display:flex;gap:2px;padding:3px;border:1px solid var(--grid-bold);
      border-radius:8px;background:#fff}
.lang button{display:flex;align-items:center;gap:7px;padding:5px 10px;border:0;border-radius:6px;
  background:transparent;cursor:pointer;font-family:var(--mono);font-size:11.5px;font-weight:500;
  letter-spacing:.07em;color:var(--graphite);transition:.15s}
.lang button:hover{background:#F1F5F9;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--rail);color:#fff}
/* experiment | theory, on a competition's pages: the same control as the language one */
.crumbrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.crumbrow .crumb{flex:1;min-width:0;margin-bottom:0}
.crumbrow+.phead{margin-top:18px}
.trk button{font-family:var(--sans);font-size:12.5px;letter-spacing:0;padding:5px 14px}
.trknote{margin:0 0 18px;font-size:13.5px;color:var(--graphite)}.trknote button{margin-left:6px;font:inherit;font-weight:600;color:#7a2e1f;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
/* the two switcher flags have different proportions — 3:2 and 2:1 —
   so they share a height, not a width */
.lflag{height:13px;flex:none;border-radius:1.5px;display:block;
  box-shadow:0 0 0 .5px rgba(22,33,46,.25)}
.lflag.ko{width:19.5px}
.lflag.en{width:26px}

/* ═══════ hero ═══════ */
.hero{padding:76px 0 58px;display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:36px;padding:48px 0 40px}}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.8rem);line-height:1.03;font-weight:650;
         letter-spacing:-.035em;margin:16px 0 0}
.lede{font-size:16.5px;color:var(--graphite);max-width:38ch;margin:20px 0 0}
.lede b{color:var(--ink);font-weight:600}
.cta{display:flex;gap:11px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 19px;border-radius:8px;
  font-size:14px;font-weight:550;cursor:pointer;border:1px solid var(--rail);
  background:var(--rail);color:#fff;transition:.14s;font-family:inherit}
.btn:hover{background:#1F2833;transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(22,33,46,.55)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--grid-bold)}
.btn.ghost:hover{background:#fff;border-color:var(--rail);box-shadow:none}
.btn .mono{font-size:12px;opacity:.62}
.btn[disabled]{opacity:.42;pointer-events:none}
.screen{position:relative;background:#fff;border:1px solid var(--grid-bold);border-radius:10px;
  padding:11px;box-shadow:0 18px 40px -28px rgba(22,33,46,.5);margin:0}
.screen canvas{display:block;width:100%;height:auto;border-radius:4px}
.screen figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--graphite);
  margin-top:9px;padding:0 2px}
.screen figcaption b{color:var(--laser);font-weight:500}

/* ═══════ rail divider ═══════ */
.rail{height:34px;overflow:hidden}
.rail svg{display:block;width:100%;height:34px}

/* ═══════ generic section ═══════ */
section{padding:58px 0}
.shead{margin-bottom:26px}
.shead h2{font-size:1.5rem}
.shead p{margin:5px 0 0;color:var(--graphite);font-size:14px;max-width:60ch}

/* ═══════ about / people ═══════ */
.about{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:start}
@media(max-width:860px){.about{grid-template-columns:1fr;gap:32px}}
.about .body p{color:var(--graphite);margin:0 0 14px}
.about .body p:first-of-type{color:var(--ink);font-size:16px}
.people{display:flex;flex-direction:column;gap:12px}
.person{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:18px}
.ptop{display:flex;gap:15px;align-items:flex-start}
.person .av{width:60px;height:60px;border-radius:50%;flex:none;overflow:hidden;
  background:#fff;box-shadow:0 0 0 1px var(--grid-bold)}
.person .av img{width:100%;height:100%;object-fit:cover;display:block}
.person h3{font-size:16px}
.person .role{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
              color:var(--graphite);margin-top:2px}
.person .loc{font-size:12.5px;color:var(--graphite);margin-top:5px}
.person .mail{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.02em;color:var(--graphite);border-bottom:1px solid var(--grid-bold);transition:.15s}
.person .mail:hover{color:var(--laser);border-color:var(--laser)}

/* medal record — set like a results table, because that is what it is */
.cred{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1px dashed var(--grid-bold);
      display:flex;flex-direction:column;gap:11px}
.cred li{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:baseline}
.cred .cy{font-family:var(--mono);font-size:11.5px;color:var(--graphite)}
.cred .cn{font-size:14px;font-weight:550;letter-spacing:-.01em}
.cred .cn small{display:block;font-weight:400;font-size:11.5px;color:var(--graphite);
                letter-spacing:0;margin-top:1px}
.cred .cm{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
          letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.cred .cm i{width:8px;height:8px;border-radius:50%;flex:none}
.cm.silver{color:#78848F} .cm.silver i{background:linear-gradient(145deg,#E2E7EC,#96A2AE)}
.cm.bronze{color:#96683C} .cm.bronze i{background:linear-gradient(145deg,#DBA871,#A46B36)}


/* ── home tally ── */
.tally{display:flex;gap:44px;margin:0;flex-wrap:wrap}
.tally div{min-width:96px}
.tally dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
          text-transform:uppercase;color:var(--graphite)}
.tally dd{margin:5px 0 0;font-family:var(--mono);font-size:2rem;font-weight:600;
          letter-spacing:-.02em;line-height:1}
.tally dd.hot{color:var(--laser)}
.tallynote{margin:22px 0 0;font-size:13px;color:var(--graphite)}
.phead .meta dd.hot{color:var(--laser)}

/* competition cards need room for four figures now */
.comp dl{flex-wrap:wrap;gap:18px 22px}

/* logos */
.mark img{width:27px;height:27px;display:block;flex:none;position:relative;top:1px}
.wm{width:206px;height:auto;display:block;margin:0 0 20px}

/* ═══════ learn ═══════ */
.lsubj .abbr{font-size:1.35rem}
.lsec{margin:0 0 38px}
.lsec>h2{font-size:1.25rem;margin:0 0 6px}
.lsec>p{margin:0 0 16px;color:var(--graphite);font-size:13.5px;max-width:72ch}
.rlist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:780px){.rlist{grid-template-columns:1fr}}
.ritem{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:16px 18px;
  display:flex;flex-direction:column;gap:6px;transition:.16s}
a.ritem:hover{border-color:var(--rail);transform:translateY(-2px);box-shadow:0 14px 30px -22px rgba(22,33,46,.55)}
.ritem.soon{border-style:dashed;background:transparent}
.ritem .rk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
.ritem .rk b{color:var(--laser);font-weight:500}
.ritem h3{font-size:15px;letter-spacing:-.01em}
.ritem .rd{font-size:13px;color:var(--graphite);line-height:1.55}
.ritem .rs{font-family:var(--mono);font-size:10.5px;color:var(--graphite);margin-top:auto;padding-top:4px;word-break:break-all}

/* ═══════ competition cards ═══════ */
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* the subjects, each under the logo of its leading olympiad */
.subjs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:0 0 24px}
.subjs a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border:1px solid var(--grid-bold);border-radius:10px;background:#fff;text-align:center;transition:border-color .12s,box-shadow .12s}
.subjs a:hover{border-color:var(--rail)}
.subjs a[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.subjs img{height:34px;width:auto;max-width:72px;object-fit:contain}
.subjs b{font-size:13.5px;color:var(--ink)}.subjs small{font-family:var(--mono);font-size:11px;color:var(--graphite)}
.subjs a.none{opacity:.55}
.subjempty{padding:28px 20px;border:1px dashed var(--grid-bold);border-radius:10px;color:var(--graphite);font-size:14px;text-align:center}
@media(max-width:900px){.subjs{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:480px){.subjs{display:flex;overflow-x:auto;scrollbar-width:none}.subjs a{flex:0 0 92px}}
/* three columns get too cramped for the figures before the single-column
   breakpoint arrives, so drop to two on the way down */
@media(max-width:1100px){.comps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){.comps{grid-template-columns:1fr}}
.comp{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:20px;
  display:flex;flex-direction:column;cursor:pointer;transition:.16s;position:relative}
.comp:hover{border-color:var(--rail);transform:translateY(-2px);
            box-shadow:0 14px 30px -22px rgba(22,33,46,.55)}
.comps{--lcap:clamp(13px,1.62vw,19px)}          /* lettering height in every logo */
@media(max-width:780px){.comps{--lcap:clamp(15px,3.6vw,21px)}}
.comp .chead{display:flex;align-items:center;gap:16px;min-height:52px}
.comp .chead .abbr{margin:0;flex:none}
.clogo{width:auto;flex:none;object-fit:contain;display:block;border-radius:3px;
       margin-left:auto}                         /* sits at the card's right edge */
.comp .abbr{font-size:1.5rem;font-weight:650;letter-spacing:-.03em}
.comp .full{font-size:12.5px;color:var(--graphite);margin-top:2px;min-height:2.6em}
/* A fixed column count, not flex wrapping.  Left to wrap, each card decided
   for itself where to break — APhO's scope is just "Asia", so it fitted on one
   line in English while the other five did not, and it sat out of step.  With
   a grid every card breaks in the same place, and the figures line up across
   the row as a bonus.  English needs the last label on a line of its own,
   since "Experimental problems" is wider than a quarter of the card. */
.comp dl{display:grid;gap:14px 16px;margin:15px 0 0;padding-top:13px;
  border-top:1px dashed var(--grid-bold);
  grid-template-columns:max-content minmax(0,1fr) max-content max-content}
/* the scope is the only figure with a long value, so it takes what is left
   over and the numbers stay on their own content width */
.comps[data-lang="en"] .comp dl{grid-template-columns:max-content minmax(0,1fr) max-content}
.comps[data-lang="en"] .comp dl>div:last-child{grid-column:1/-1}
@media(max-width:430px){
  .comp dl,.comps[data-lang="en"] .comp dl{grid-template-columns:max-content minmax(0,1fr)}
}
.comp .full{margin-bottom:auto}
.comp dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
.comp dd{margin:2px 0 0;font-family:var(--mono);font-size:14px;font-weight:500}
.comp .go{position:absolute;right:18px;bottom:16px;font-family:var(--mono);font-size:16px;
          color:var(--grid-bold);transition:.16s}
.comp:hover .go{color:var(--laser);transform:translateX(3px)}

/* ═══════ breadcrumb ═══════ */
.crumb{display:flex;align-items:center;gap:9px;padding:24px 0 0;font-family:var(--mono);
       font-size:11.5px;letter-spacing:.06em;color:var(--graphite);flex-wrap:wrap}
.crumb a:hover{color:var(--laser)}
.crumb span{color:var(--grid-bold)}
.crumb b{color:var(--ink);font-weight:500}

/* ═══════ page head ═══════ */
.phead{padding:22px 0 30px;border-bottom:1px solid var(--grid-bold);margin-bottom:30px}
.phead h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:650;letter-spacing:-.035em}
.phead .sub{color:var(--graphite);margin-top:7px;font-size:14.5px}
.phead .meta{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.phead .meta div{min-width:78px}
.phead .meta dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
                text-transform:uppercase;color:var(--graphite)}
.phead .meta dd{margin:2px 0 0;font-family:var(--mono);font-size:15px;font-weight:500}

/* ═══════ year grid ═══════ */
.cnote{margin:0 0 20px;padding:11px 14px;background:#fff;border:1px solid var(--grid-bold);
  border-left:3px solid var(--brass);border-radius:8px;font-size:13px;color:var(--graphite)}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.yr{background:#fff;border:1px solid var(--grid-bold);border-radius:9px;padding:15px 16px 13px;
    cursor:pointer;transition:.15s;position:relative;display:block}
.yr:hover{border-color:var(--rail);transform:translateY(-2px);
          box-shadow:0 12px 26px -20px rgba(22,33,46,.55)}
.yr .y{font-family:var(--mono);font-size:1.72rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.yr .host{font-size:12px;color:var(--graphite);margin-top:6px;min-height:1.6em}
/* every national flag has its own aspect ratio, so only the width is fixed
   and the height follows — nothing gets cropped */
.flag{width:20px;height:auto;border-radius:2px;flex:none;display:block;
  box-shadow:0 0 0 .5px rgba(22,33,46,.22)}
.flag.big{width:28px}
.flag.card{width:44px;border-radius:3px;
  box-shadow:0 0 0 .5px rgba(22,33,46,.2),0 2px 5px -3px rgba(22,33,46,.5)}
.orgbadge,.noflag{aspect-ratio:3/2}
.orgbadge{display:inline-flex;align-items:center;justify-content:center;
  background:var(--rail);color:#fff;font-family:var(--mono);font-weight:600;
  letter-spacing:.06em;font-size:10.5px;box-shadow:0 0 0 .5px rgba(22,33,46,.2),
  0 2px 5px -3px rgba(22,33,46,.5)}
.flag.big.orgbadge{font-size:8.5px;letter-spacing:.04em}
.noflag{display:inline-block;background:repeating-linear-gradient(45deg,
  #eef2f6 0 5px,#e3e9ef 5px 10px);border-radius:3px}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.yrow .flag,.yrow .orgbadge,.yrow .noflag{flex:none}
.yr .host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subflag{display:flex;align-items:center;gap:9px}
.yr .cnt{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--graphite);margin-top:10px;padding-top:9px;border-top:1px dashed var(--grid-bold)}
.yr.none{cursor:default;border-style:dashed;opacity:.55;background:transparent}
.yr.none:hover{transform:none;box-shadow:none;border-color:var(--grid-bold)}
.yr .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;
  vertical-align:1px;background:var(--laser);box-shadow:0 0 0 2.5px rgba(224,36,36,.16)}

/* ═══════ problem cards ═══════ */
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.prob{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:19px;
      display:flex;flex-direction:column;gap:11px}
.prob.soon{border-style:dashed;background:transparent;opacity:.78}
.prob .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prob .code{font-family:var(--mono);font-size:1.15rem;font-weight:600;letter-spacing:.02em}
.prob h3{font-size:15.5px;line-height:1.38}
.prob p{margin:0;font-size:13px;color:var(--graphite);flex:1}
.prob .acts{display:flex;flex-direction:column;gap:8px;margin-top:3px}
.prob .acts .main{display:flex;gap:8px}
.prob .acts .main .btn{flex:1;justify-content:center;text-align:center}
/* practice | exam, on the competition page */
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 22px}
.modesw a{display:block;border:1.5px solid var(--grid-bold);border-radius:12px;padding:13px 16px;background:#fff;transition:.12s}
.modesw a b{display:block;font-size:15.5px;color:var(--ink)}
.modesw a span{display:block;font-size:12.5px;color:var(--graphite);margin-top:3px}
.modesw a:hover{border-color:var(--rail)}
.modesw a.on{border-color:#16212e;background:#16212e}
.modesw a.on b{color:#fff}.modesw a.on span{color:#c4ccd6}
.modesw a.ex.on{border-color:#7a2e1f;background:#7a2e1f}
@media(max-width:560px){.modesw a{padding:10px 12px}.modesw a span{display:none}}
.yrexam{margin:-6px 0 16px;font-size:13.5px}.yrexam a{color:#7a2e1f;font-weight:600}
/* the year's theory papers, as the olympiad published them */
.thy{background:#fff;border:1px solid var(--grid-bold);border-radius:10px;padding:16px 19px;margin:0 0 22px}
.thy h3{font-size:15px;margin:0}.thy .tn{margin:3px 0 12px;font-size:12.5px;color:var(--graphite)}
.thy .pt{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--grid-fine)}
.thy .pt .code{font-family:var(--mono);font-weight:600;font-size:1rem}
.thy .pt ol{margin:0;padding:0 0 0 18px;font-size:13.5px;line-height:1.5}.thy .pt ol.one{list-style:none;padding:0}
.thy .pt .d{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.thy .pt .d .btn{padding:7px 12px;font-size:13px}
.thy .ex{margin:10px 0 0;font-size:13.5px}.thy .ex a{color:#7a2e1f;font-weight:600}
@media(max-width:640px){.thy .pt{grid-template-columns:1fr}.thy .pt .d{justify-content:flex-start}}
/* the exam portal: a notice, the exam table, the candidate card */
.xm .xmnote{border:1px solid #e3c9bf;background:#fbf3ef;border-radius:12px;padding:14px 18px;margin-bottom:18px}
.xm .xmnote b{color:#7a2e1f}
.xm .xmnote ol{display:flex;gap:8px 22px;flex-wrap:wrap;margin:8px 0 0;padding:0;list-style:none;counter-reset:s;font-size:13px;color:#4b5563}
.xm .xmnote li{counter-increment:s}.xm .xmnote li::before{content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#7a2e1f;color:#fff;font:700 11px var(--mono);margin-right:6px}
.xm .xmgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media(max-width:960px){.xm .xmgrid{grid-template-columns:1fr}.xm .xmme{order:-1}}
.xm .xmbox{background:#fff;border:1px solid var(--grid-bold);border-radius:12px;overflow:hidden}
.xm .xmbox h2{font-size:14.5px;margin:0;padding:12px 16px;background:#16212e;color:#fff}
.xm table{width:100%;border-collapse:collapse;font-size:13.5px}
.xm th{white-space:nowrap;font-size:11.5px;letter-spacing:.04em;color:var(--graphite);text-align:left;font-weight:700;background:#f6f8fb;padding:9px 12px;border-bottom:1px solid var(--grid-bold)}
.xm td{padding:11px 12px;border-bottom:1px solid #edf0f4;vertical-align:middle}
.xm td.y{font:700 15px var(--mono)}
.xm td .t{font-weight:600;color:var(--ink)}.xm td .s{font-size:12px;color:var(--graphite);margin-top:2px}
.xm .st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef2ff;color:#3b5bdb;white-space:nowrap}
.xm .st.graded{background:#ebfbee;color:#2b8a3e}.xm .st.running,.xm .st.scanning{background:#fff4e6;color:#d9480f}
.xm .go{display:inline-block;padding:7px 13px;border-radius:7px;background:#7a2e1f;color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap}
.xm .go.sec{background:#fff;color:#16212e;border:1px solid var(--grid-bold)}
.xm .acts3{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.xm td.hs{white-space:nowrap}
@media(max-width:720px){.xm th.hs,.xm td.hs{display:none}}
.xm .xmme .in{padding:14px 16px;font-size:13.5px}
.xm .xmme .tk{font:700 28px var(--mono);color:#7a2e1f}
.xm .xmme a.lnk{color:#3b5bdb;font-weight:600}
.prob .acts .docs{display:grid;gap:8px}
.prob .acts .docs.n1{grid-template-columns:1fr} .prob .acts .docs.n2{grid-template-columns:1fr 1fr} .prob .acts .docs.n3{grid-template-columns:1fr 1fr 1fr}
.prob .acts .btn{padding:8px 13px;font-size:12.5px}
.prob .acts .docs .btn{padding:8px 6px;font-size:12px;justify-content:center;text-align:center;line-height:1.25}
.prob .top .tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prob .top .tr .thytag{margin-left:0}
.prob .exenote{margin-top:auto}
.status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
        letter-spacing:.1em;text-transform:uppercase}
.status i{width:6px;height:6px;border-radius:50%;display:inline-block}
.status.live{color:var(--laser)}
.status.live i{background:var(--laser);box-shadow:0 0 0 3px rgba(224,36,36,.15)}
.status.dl{color:var(--brass)}
.status.dl i{background:var(--brass);box-shadow:0 0 0 3px rgba(184,134,43,.15)}
.status.wip{color:var(--graphite)} .status.wip i{background:var(--grid-bold)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
     padding:3px 7px;border-radius:4px;background:#F1F5F9;color:var(--graphite)}
.thytag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:4px;background:rgba(44,111,155,.12);color:var(--accent);margin-left:6px}
.prob .top{flex-wrap:wrap}
.tag.exp{background:rgba(184,134,43,.13);color:var(--brass)}
/* IAO · APAO 조 — 배지와 고르개 */
.grptag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2.5px 7px;border-radius:4px;
  background:#F1F5F9;color:var(--graphite);white-space:nowrap}
.grptag.ga{background:rgba(46,139,87,.13);color:#23704A}
.grptag.gb{background:rgba(44,111,155,.13);color:#245E86}
.grptag.gc{background:rgba(124,77,160,.13);color:#6A3F8C}
.grpsel{display:inline-flex;gap:2px;padding:3px;margin:-12px 0 22px;border:1px solid var(--grid-bold);
  border-radius:8px;background:#fff;flex-wrap:wrap}
.grpsel button{display:flex;align-items:center;gap:6px;padding:5px 11px;border:0;border-radius:6px;
  background:transparent;cursor:pointer;font-size:12.5px;color:var(--graphite);transition:.15s}
.grpsel button i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.7}
.grpsel button:hover{background:#F1F5F9;color:var(--ink)}
.grpsel button[aria-pressed="true"]{background:var(--rail);color:#fff}
.probs[data-show="a"] .prob[data-grp]:not([data-grp*="a"]),
.probs[data-show="b"] .prob[data-grp]:not([data-grp*="b"]),
.probs[data-show="c"] .prob[data-grp]:not([data-grp*="c"]){display:none}

/* ═══════ AdFit banners ═══════ */
.adfit-banner{position:relative;width:320px;max-width:calc(100% - 24px);height:50px;margin:42px auto 6px}
.adfit-banner-label{position:absolute;top:-17px;left:0;color:#667085;font:9px/1.1 var(--mono)}
.adfit-banner-slot{width:320px;max-width:100%;height:50px}
.adfit-banner--secondary,.adfit-banner--secondary .adfit-banner-slot{height:100px}
@media (min-width:700px){.adfit-banner{margin-top:52px}}
@media (min-width:768px){
  .adfit-banner.adfit-banner--desktop{width:728px;max-width:calc(100% - 48px);height:90px;margin-top:58px}
  .adfit-banner--desktop .adfit-banner-slot{width:728px;height:90px}
}
@media (min-width:1100px){.adfit-banner{margin-top:60px}}
@media print{.adfit-banner{display:none}}

/* ═══════ footer ═══════ */
footer{border-top:1px solid var(--grid-bold);padding:30px 0 44px;margin-top:26px}
.frow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
      font-family:var(--mono);font-size:11.5px;color:var(--graphite);letter-spacing:.04em}
.frow a:hover{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}}

/* ═══════ community ═══════
   a board people already know how to read: a channel rail on the left (Discord), a numbered list with
   tags, comment counts, notices and best posts (DC Inside, Arca), a card view with up/down votes and
   threaded replies (Reddit) */
.cm{--cm-acc:#3b5bdb;--cm-acc2:#2f4ac0;--cm-up:#ff4500;--cm-down:#6a7fdb;--cm-rail:#1f2630;--cm-rail2:#2a323e;
    --cm-line:#e3e8ee;--cm-soft:#f6f8fb}
.cm .cmtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:20px 0 16px}
.cm .cmtop h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;letter-spacing:-.03em}
.cm .cmtop p{margin:4px 0 0;color:var(--graphite);font-size:14px}
.shell.cm{max-width:1680px}
.cmgrid{display:grid;grid-template-columns:236px minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:1100px){.cmgrid{grid-template-columns:200px minmax(0,1fr)}.cmright{grid-column:1/-1}}
@media(max-width:760px){.cmgrid{grid-template-columns:minmax(0,1fr)}}

/* the channel rail */
.cmrail{background:var(--cm-rail);color:#c9d1db;border-radius:12px;padding:12px 8px;position:sticky;top:76px}
.cmrail .srv{display:flex;align-items:center;gap:9px;padding:4px 8px 12px;border-bottom:1px solid #313a47;margin-bottom:8px}
.cmrail .srv img{width:28px;height:28px;border-radius:8px;background:#fff}
.cmrail .srv b{color:#fff;font-size:14.5px}
.cmrail .servers{display:flex;flex-direction:column;gap:4px;padding:0 0 8px;margin-bottom:6px;border-bottom:1px solid #313a47}
.cmrail .servers button{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:0;background:none;color:#aab4c0;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.cmrail .servers button span{width:26px;height:26px;border-radius:50%;background:#2a323e;display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:.15s}
.cmrail .servers button:hover{background:var(--cm-rail2);color:#fff}
.cmrail .servers button.on{color:#fff;font-weight:600}
.cmrail .servers button.on span{border-radius:9px;background:var(--cm-acc)}
.cmrail .sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8793a3;padding:10px 8px 4px}
.cmrail a.ch{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:14px;color:#aab4c0;transition:.12s}
.cmrail a.ch:hover{background:var(--cm-rail2);color:#fff}
.cmrail a.ch.on{background:#3a4453;color:#fff}
.cmrail a.ch .hash{color:#7d8896;font-weight:600;width:14px;text-align:center}
.cmrail a.ch .cnt{margin-left:auto;font-size:11px;font-family:var(--mono);color:#8793a3}
.cmrail a.ch .new{margin-left:auto;background:#f23f43;color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;line-height:17px}
.cmrail .me{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 8px 2px;border-top:1px solid #313a47}
.cmrail .me .nm{font-size:13px;color:#fff;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmrail .me .sub{font-size:11px;color:#8793a3}
.cmrail .me .ops{margin-left:auto;display:flex;gap:4px}
.cmrail .me .ops a,.cmrail .me .ops button{background:none;border:0;color:#aab4c0;cursor:pointer;font-size:12px;padding:4px 6px;border-radius:5px;font-family:inherit}
.cmrail .me .ops a:hover,.cmrail .me .ops button:hover{background:var(--cm-rail2);color:#fff}
.cmrail .auth{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #313a47}
.cmrail .auth a{text-align:center;padding:8px;border-radius:7px;font-size:13px;font-weight:600}
.cmrail .auth .pri{background:var(--cm-acc);color:#fff}
.cmrail .auth .sec2{background:var(--cm-rail2);color:#dfe5ec}
@media(max-width:760px){
  .cmrail{position:static;display:flex;gap:4px;overflow-x:auto;padding:8px;scrollbar-width:none;border-radius:10px}
  .cmrail .srv,.cmrail .sec,.cmrail .me,.cmrail .auth{display:none}
  .cmrail .servers{flex-direction:row;border:0;padding:0;margin:0 4px 0 0}
  .cmrail .servers button{white-space:nowrap;padding:6px}
  .cmrail a.ch{white-space:nowrap;flex:none}
}
/* the Physics Olympiads Discord server */
.cmrail a.ch.dc .hash svg{width:14px;height:14px;fill:#8ea1ff;vertical-align:-2px}
.cmrail a.ch.dc .on{margin-left:auto;font-size:11px;font-family:var(--mono);color:#57d38c}
.dcban{display:flex;gap:16px;align-items:center;padding:22px 22px 18px;background:linear-gradient(135deg,#5865f2,#3b45b8);color:#fff}
.dcban img{width:72px;height:72px;border-radius:20px;background:#fff2;flex:none}
.dcban h2{margin:0;font-size:22px;letter-spacing:-.02em}
.dcban p{margin:4px 0 0;font-size:13.5px;opacity:.9}
.dcban .ct{display:flex;gap:14px;margin-top:8px;font-size:12.5px}
.dcban .ct i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#57d38c}
.dcban .ct i.m{background:#c8ccd3}
.dcbody{padding:18px 22px 22px;font-size:14px;color:#374151;line-height:1.7}
.dcbody .acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.dcbody .acts a,.dcbody .acts button{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--cm-line);background:#fff;color:#1f2937;cursor:pointer;font-family:inherit}
.dcbody .acts .join{background:#5865f2;border-color:#5865f2;color:#fff}
.dcbody .acts .join:hover{background:#4752c4}
.dcbody iframe{width:100%;height:620px;border:0;border-radius:10px;margin-top:6px;background:#313338}
.dcbody ul{margin:6px 0 0 18px;padding:0}
.dcside .in{display:flex;gap:10px;align-items:center}
.dcside img{width:40px;height:40px;border-radius:12px;flex:none;background:#5865f2}
.dcside .nm{font-weight:700;color:#111827;font-size:13.5px}
.dcside .ct{font-size:12px;color:#6b7280}
.dcside a.j{margin-left:auto;background:#5865f2;color:#fff;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.cmav{width:30px;height:30px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;line-height:1}
.cmav.s{width:22px;height:22px;font-size:10.5px}
.cmav.l{width:56px;height:56px;font-size:22px}
img.cmav{object-fit:cover;background:var(--cm-soft,#eee)}

/* the board */
.cmpanel{background:#fff;border:1px solid var(--cm-line);border-radius:12px;overflow:hidden}
.cmbh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid var(--cm-acc)}
.cmbh h2{font-size:1.2rem;letter-spacing:-.02em}
.cmbh h2 span{color:var(--graphite);font-weight:500}
.cmbh p{margin:2px 0 0;font-size:12.5px;color:var(--graphite)}
.cmbh .sp{flex:1}
.cmbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--cm-line);
  background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap}
.cmbtn:hover{border-color:#c5ced9;background:var(--cm-soft)}
.cmbtn.pri{background:var(--cm-acc);border-color:var(--cm-acc);color:#fff}
.cmbtn.pri:hover{background:var(--cm-acc2)}
.cmbtn.sm{padding:5px 10px;font-size:12px}
.cmbtn[disabled]{opacity:.5;pointer-events:none}
.cmbar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--cm-line);background:var(--cm-soft)}
.cmseg{display:inline-flex;border:1px solid var(--cm-line);border-radius:8px;overflow:hidden;background:#fff}
.cmseg a,.cmseg button{padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--graphite);border:0;background:none;cursor:pointer;font-family:inherit}
.cmseg a+a,.cmseg button+button{border-left:1px solid var(--cm-line)}
.cmseg .on{background:var(--cm-acc);color:#fff}
.cmtags{display:flex;gap:5px;flex-wrap:wrap}
.cmtags a{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--cm-line);background:#fff;color:var(--graphite)}
.cmtags a.on{border-color:var(--cm-acc);color:var(--cm-acc);font-weight:700}
.cmbar2 .sp{flex:1}
.cm .cmsel{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--cm-line);border-radius:7px;background:#fff;color:var(--ink);width:auto}

/* the numbered list */
.cmtbl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.cmtbl th{font-size:12px;font-weight:600;color:var(--graphite);padding:9px 6px;border-bottom:1px solid var(--cm-line);background:#fff}
.cmtbl td{padding:9px 6px;border-bottom:1px solid #eef1f5;text-align:center;color:var(--graphite);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmtbl td.t{text-align:left;color:var(--ink);font-size:14px}
.cmtbl tr:hover td{background:#f8fafc}
.cmtbl tr.nt td{background:#fffbea}
.cmtbl tr.nt td.t a{font-weight:700}
.cmtbl td.t a{display:inline;color:inherit}
.cmtbl td.t a:visited{color:#6b5b95}
.cmtbl .cc{color:#e03131;font-weight:700;font-size:12px;margin-left:4px}
.cm .nb{display:inline-block;background:#fa5252;color:#fff;font-size:9.5px;font-weight:800;border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}
.cmtbl .bs{color:#f59f00;margin-right:3px}
.cmtag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:#eef2ff;color:#3b5bdb;white-space:nowrap}
.cmtag.q{background:#e6fcf5;color:#0b8a6b}.cmtag.info{background:#fff4e6;color:#d9480f}.cmtag.review{background:#f3f0ff;color:#6741d9}
.cmtag.bug{background:#fff5f5;color:#c92a2a}.cmtag.notice{background:#3b5bdb;color:#fff}.cmtag.gen{background:#f1f3f5;color:#495057}
.cmtbl .c-no{width:58px}.cmtbl .c-tag{width:62px}.cmtbl .c-au{width:110px}.cmtbl .c-dt{width:64px}.cmtbl .c-v{width:48px}.cmtbl .c-r{width:48px}
.cmtbl .mm{display:none}
@media(max-width:760px){
  .cmtbl .c-no,.cmtbl .c-tag,.cmtbl .c-au,.cmtbl .c-dt,.cmtbl .c-v,.cmtbl .c-r,.cmtbl td:not(.t),.cmtbl thead{display:none}
  .cmtbl td.t{white-space:normal}
  .cmtbl .mm{display:block;margin-top:3px;font-size:11.5px;color:var(--graphite)}
}
.cm .cmm{display:none}
@media(max-width:760px){.cm .cmm{display:inline-flex}}
.cmempty{padding:52px 16px;text-align:center;color:var(--graphite);font-size:14px}

/* the card view */
.cmcards{display:flex;flex-direction:column}
.cmcard{display:flex;gap:0;border-bottom:1px solid var(--cm-line)}
.cmcard:hover{background:#fbfcfe}
.cmvote{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;width:52px;flex:none;background:var(--cm-soft)}
.cmvote button{width:30px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;color:#8a96a6;font-size:15px;line-height:1}
.cmvote button:hover{background:#e9edf3}
.cmvote button.up.on{color:var(--cm-up)}.cmvote button.dn.on{color:var(--cm-down)}
.cmvote b{font-size:13px;font-family:var(--mono)}
.cmcard .bd{padding:10px 14px;min-width:0;flex:1}
.cmcard .mt{font-size:12px;color:var(--graphite);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmcard .mt b{color:var(--ink)}
.cmcard h3{font-size:16px;margin:5px 0 4px;letter-spacing:-.01em;word-break:break-word}
.cmcard h3 a:hover{color:var(--cm-acc)}
.cmcard .sn{font-size:13.5px;color:#4b5563;line-height:1.55;max-height:3.1em;overflow:hidden;word-break:break-word}
.cmcard .ft{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--graphite)}

/* bottom: search + pages */
.cmfoot{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.cmpg{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cmpg a,.cmpg span{min-width:30px;padding:5px 8px;text-align:center;font-size:13px;border-radius:6px;color:var(--ink)}
.cmpg a:hover{background:var(--cm-soft)}
.cmpg span{background:var(--cm-acc);color:#fff;font-weight:700}
.cmsrch{display:flex;gap:6px;width:100%;max-width:520px}
.cmsrch input{flex:1;min-width:0}

/* side cards */
.cmright{display:flex;flex-direction:column;gap:14px}
.cmside{background:#fff;border:1px solid var(--cm-line);border-radius:12px;overflow:hidden}
.cmside h3{font-size:13px;padding:11px 14px;margin:0;background:var(--cm-soft);border-bottom:1px solid var(--cm-line)}
.cmside .in{padding:12px 14px;font-size:13px;color:#4b5563}

.ar .arpf label:has(textarea){grid-column:1/-1}.ar .arpf input,.ar .arpf textarea{font:13px var(--mono);padding:6px 8px;border:1px solid var(--cm-line);border-radius:6px}
.ar .arpf p,.ar .arpf button,.ar .arpf .arinfo{grid-column:1/-1}
.ar .arq{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ar .arq input{padding:5px 8px;border:1px solid var(--cm-line);border-radius:6px}
</style>
</head>

<!-- ══════════ FLAG SPRITES ══════════
  태극기 — 대한민국 국기법 시행령 규격
    깃면 3:2 · 태극 지름 = 깃면 너비 ÷ 2 · 경계 곡선은 좌상~우하 대각선 위
    괘 간격 = 태극 원지름 ÷ 4 · 괘 가로 = 지름 ÷ 2 · 괘 세로 = 지름 ÷ 3
    효 두께 = 괘 세로 ÷ 4 · 효 간격 = 괘 세로 ÷ 8
    배치: 좌상 건 ☰ · 우상 감 ☵ · 좌하 이 ☲ · 우하 곤 ☷

-->

(function toPdfHost(o){

/* the theory papers (theory.js, tools/theory_build.py): a year that has only theory still gets its page */
const THEORY = window.THEORY || {};
for(const k in THEORY){ const c=DATA[k]; if(!c) continue;
  for(const y in THEORY[k]) if(!c.years.some(x=>String(x.y)===y)) c.years.push({y:+y,host:null,problems:[]});
  c.years.sort((a,b)=>b.y-a.y); }
const thyOf=(key,y)=>(THEORY[key]||{})[String(y)]||null;
/* a theory file: in a release (served by the PDF Worker), or cut out of a booklet and kept on the site (pdfx/…) */
const thyUrl=f=>/^pdfx\//.test(f)?f:PDF_BASE+f;
/* NBPhO: one booklet holds every problem; each experiment card gets its own problem and solution, cut out of it
   (tools/nbpho_split.py), and its number in the booklet (no) for the combined exam */
for(const y of (DATA.nbpho||{years:[]}).years){ const t=thyOf("nbpho",y.y); if(!t||!t.x||!t.c) continue;
  const ex=y.problems.filter(p=>/^E\d+$/.test(p.id)).sort((a,b)=>a.id.localeCompare(b.id,"en",{numeric:true}));
  if(ex.length!==t.x.length) continue;
  ex.forEach((p,i)=>{ const c=t.c[String(t.x[i])]; p.no=t.x[i]; if(!c) return;
    p.files={...p.files,pdf:{en:c.paper},...(c.sol?{sol:c.sol}:{})}; }); }
/* the theory exams of a year: each age group (Ta, Tb) or round (Ti) and a multiple-choice paper on its own; the
   problems T1, T2, … sat together (four at most at a time), else the whole paper T — only parts with a solution */
function theoryGroups(key,yr){
  const t=thyOf(key,yr.y); if(!t) return [];
  if(key==="nbpho"&&yr.problems.some(p=>/^E\d+$/.test(p.id)&&p.files&&p.files.sim)) return [];   // sat with the experiments (examGroups)
  const parts=Object.keys(t.f).filter(x=>/^(T|MC)\d*[a-z]?$/.test(x)&&t.f[x].sol&&!t.f[x].kx), by={};
  for(const x of parts){ const m=/^(T|MC)(\d*)([a-z]?)$/.exec(x); (by[m[1]+m[3]]=by[m[1]+m[3]]||[]).push({x,n:m[2]}); }
  const out=[];
  for(const g of Object.values(by)){
    const num=g.filter(q=>q.n).sort((a,b)=>a.n-b.n), whole=g.find(q=>!q.n);
    const pick=num.length&&(!whole||num.length<=4)?num:whole?[whole]:num;
    for(let i=0;i<pick.length;i+=4) out.push(pick.slice(i,i+4).map(q=>q.x));
  }
  return out;
}

const thyParts=t=>Object.keys(t.f).filter(x=>!t.f[x].kx);

const LKIND={official:"kOfficial",free:"kFree",guide:"kGuide",tool:"kTool",archive:"kArchive"};
const lhost=u=>u.replace(/^https?:\/\//,"").split("/")[0];

function viewLearn(){
  const d=UI[lang];
  return `
  <div class="shell">
    <div class="phead">
      <p class="eyebrow">${d.ebLearn}</p>
      <h1>${d.hLearn}</h1>
      <div class="sub">${d.pLearn}</div>
    </div>
    <div class="comps" data-lang="${lang}">
      ${Object.entries(LEARN).map(([key,L])=>{
        const g=L.items.filter(r=>r.s==="g").length, b=L.items.filter(r=>r.s==="b").length;
        return `<a class="comp lsubj" href="#/learn/${key}">
          <div class="chead"><div class="abbr">${L.name[lang]}</div></div>
          <div class="full">${L.comps}</div>
          <dl>
            <div><dt>${d.lGuides}</dt><dd>${g}</dd></div>
            <div><dt>${d.lBasics}</dt><dd>${b}</dd></div>
          </dl>
          <span class="go">→</span>
        </a>`;}).join("")}
    </div>
  </div>
  ${adFitBanner("primary")}`;
}

function viewLearnSubject(key){
  const d=UI[lang], L=LEARN[key];
  if(!L) return viewLearn();
  const card=r=>`<a class="ritem" href="${esc(r.u)}" target="_blank" rel="noopener">
      <span class="rk">${d[LKIND[r.k]]} · ${esc(r.by[lang])}</span>
      <h3>${esc(r.t[lang])}</h3>
      <span class="rd">${esc(r.d[lang])}</span>
      <span class="rs">${esc(lhost(r.u))} ↗</span></a>`;
  const own=t=>`<div class="ritem soon"><span class="rk"><b>${d.lOwn}</b></span><h3>${t}</h3><span class="rd">${d.soonOwn}</span></div>`;
  const sec=(s,title,ownT)=>`
    <div class="lsec">
      <h2>${title}</h2>
      <p>${d.foundNote}</p>
      <div class="rlist">${own(ownT)}${L.items.filter(r=>r.s===s).map(card).join("")}</div>
    </div>`;
  return `
  <div class="shell">
    <div class="phead">
      <p class="eyebrow"><a href="#/learn">${d.navLearn}</a> / ${L.name[lang]}</p>
      <h1>${L.name[lang]}</h1>
      <div class="sub">${L.comps}</div>
    </div>
    ${sec("g",d.lGuides,d.ownGuide)}
    ${sec("b",d.lBasics,d.ownBasics)}
  </div>
  ${adFitBanner("primary")}`;
}

/* the practice | exam switch: practice is the year grid below, exam the exam portal (#/<comp>/exam) */
function modeSwitch(key,mode){
  const d=UI[lang];
  return `<div class="modesw" role="navigation" aria-label="${d.modePrac} / ${d.modeExam}">
    <a href="#/${key}" class="${mode!=="exam"?"on":""}" aria-current="${mode!=="exam"}"><b>📘 ${d.modePrac}</b><span>${d.modePracSub}</span></a>
    <a href="#/${key}/exam" class="ex ${mode==="exam"?"on":""}" aria-current="${mode==="exam"}"><b>⏱ ${d.modeExam}</b><span>${d.modeExamSub}</span></a></div>`;
}
const hasExam=(c,key)=>key&&trackOf(key)==="thy"?c.years.some(y=>theoryGroups(key,y).length):c.years.some(y=>y.problems.some(p=>!p.hold&&p.files&&p.files.sim));
function viewComp(key,mode){
  const d=UI[lang], c=DATA[key];
  if(!c) return viewHome();
  if(mode==="exam"&&!hasExam(c,key)) mode="";
  const ready = c.years.reduce((n,y)=>n+y.problems.filter(p=>!p.hold&&p.files&&(p.files.sim||p.files.exe)).length,0);
  const total = c.years.reduce((n,y)=>n+y.problems.length,0);
  return `
  <div class="shell">
    <div class="crumbrow"><div class="crumb">
      <a href="#/">${d.crumbHome}</a><span>/</span>
      <a href="#/comps/${subjOf(key)}">${d.navComps}</a><span>/</span><b>${c.abbr}</b>
    </div>${trackSwitch(key)}</div>
    <div class="phead">
      <h1>${c.abbr}</h1>
      <div class="sub">${c.full[lang]}</div>
      <dl class="meta">
        <div><dt>${d.lSince}</dt><dd>${c.since}</dd></div>
        <div><dt>${d.lScope}</dt><dd>${c.scope[lang]}</dd></div>
        <div><dt>${d.lYears}</dt><dd>${c.years.length}</dd></div>
        <div><dt>${LB(c,"problems")}</dt><dd>${total}</dd></div>
        <div><dt>${d.cntReady}</dt><dd class="${ready?"hot":""}">${ready}</dd></div>
        ${THEORY[key]?`<div><dt>${d.tThy}</dt><dd>${Object.values(THEORY[key]).reduce((n,t)=>n+thyParts(t).length,0)}</dd></div>`:""}
      </dl>
    </div>
    ${c.note?`<p class="cnote">${c.note[lang]}</p>`:""}
    ${hasExam(c,key)?modeSwitch(key,mode):""}
    ${mode==="exam"?`<div class="xm" id="xmRoot" data-key="${key}">${xmPortalHtml(key,null)}</div></div>${adFitBanner("primary")}`:`
    ${adFitBanner("secondary")}
    <div class="shead"><h2 style="font-size:1.15rem">${d.pickYear}</h2></div>
    <div class="years">
      ${c.years.map(y=>{
        const r=y.problems.filter(p=>!p.hold&&p.files&&(p.files.sim||p.files.exe)).length;
        const th=thyOf(key,y.y), thy=trackOf(key)==="thy", none=thy?!th:y.problems.length===0;
        const inner=`
          <div class="yrow">
            <div class="y">${y.y}</div>
            ${flagImg(y.cc,"flag card",y.org)}
          </div>
          <div class="host">${y.host?y.host[lang]:"—"}</div>
          <div class="cnt">${!thy&&r?'<i class="dot"></i>':""}${none?(thy?"—":LB(c,"noPapers")):

        return none ? `<div class="yr none">${inner}</div>`

      }).join("")}
    </div>

  ${adFitBanner("primary")}`}`;
}
/* the exam portal, as a university mock-exam site has it: the exams of every year in one table with how
   many sat and the average, the candidate's own status on each, and a card with their tokens.  `x` holds
   what came from the server (null while it loads): {stats, mine, tokens, active, me, off} */
function xmPortalHtml(key,x){
  const d=UI[lang], c=DATA[key], rows=[];
  const row=(y,tasks,label,sub,sec,href)=>{
    const k=key+y.y+":"+tasks.join("+");
    const st=x&&x.stats&&x.stats[k], my=x&&x.mine&&x.mine.find(s=>s.exam_key===key+y.y&&s.tasks.join("+")===tasks.join("+"));
    const open=my&&(my.status==="running"||my.status==="scanning");
    rows.push(`<tr><td class="y">${y.y}</td>
      <td><div class="t">${c.abbr} ${y.y} ${label} · ${tasks.join(" + ")}</div><div class="s">${sub}</div></td>
      <td class="hs">${HLexam.clock(sec)} + 0:30</td>
      <td class="hs">${x?(st&&st.sat?d.xmSatV(st.sat,st.avg):`<span style="color:var(--graphite)">${d.xmNone}</span>`):"…"}</td>
      <td>${my?`<span class="st ${my.status}">${d.xmSt[my.status]||my.status}${my.status==="graded"&&my.points?` · ${my.score}/${my.points}`:""}</span>`:""}</td>
      <td><div class="acts3">${open?`<a class="go" href="${href}">${d.xmResume}</a>`
        :my?`<a class="go sec" href="#/lab/${my.id}">${d.xmReport}</a><a class="go" href="${href}">${d.xmRetry}</a>`
        :`<a class="go" href="${href}">${d.xmGo}</a>`}</div></td></tr>`);
  };
  const thyT=trackOf(key)==="thy";
  for(const y of c.years){
    if(!thyT) for(const g of examGroups(key,y)){ const mix=g.some(p=>p.thy);
      row(y,g.map(examTask),mix?d.xmMixLabel:d.xmExamLabel,g.map(p=>`${examTask(p)} ${esc(p.title?p.title[lang]:"")}`).join(" · "),HLexam.sec(key,y.y,g.length,mix?"mixed":false),examHref(key,y,g)); }
    const t=thyOf(key,y.y);
    if(thyT) for(const g of theoryGroups(key,y))
      row(y,g,d.xmTheoryLabel,g.map(x=>`${x} ${esc(thyTitle(t,x)||(x==="T"?d.thyWhole:""))}`).join(" · "),HLexam.sec(key,y.y,g.length,true),theoryHref(key,y,g));
  }
  const me=x&&x.me, act=x&&x.active;
  const card=!x?`<div class="in">…</div>`
    :!me?`<div class="in"><p style="margin:0 0 10px">${d.xmLoginNote}</p><a class="go" href="#/login" onclick="try{sessionStorage.setItem('hlCmBack',location.hash)}catch(e){}">${CMT[lang].login}</a></div>`
    :`<div class="in"><div style="font-weight:700">${esc(me.nickname)}</div><div style="color:var(--graphite);font-size:12px">@${esc(me.username)}</div>
       <div style="margin-top:12px;font-size:12px;color:var(--graphite)">${d.xmTokens}</div><div class="tk">${x.tokens??"–"}</div>
       ${act?`<div style="margin-top:10px;font-size:12px;color:var(--graphite)">${d.xmActive}</div><div><b>${esc(act.comp.toUpperCase())} ${act.year}</b> · ${d.xmSt[act.status]||""}</div>
         ${act.entry?`<a class="go" style="margin-top:8px" href="sim/exam.html${esc(act.entry)}&lang=${lang}">${d.xmResume}</a>`:""}`:""}
       <p style="margin:12px 0 0"><a class="lnk" href="#/lab">${d.xmAll}</a></p></div>`;
  return `${x&&x.off?`<div class="cmnote" style="margin-bottom:14px">${d.xmOff}</div>`:""}
    <div class="xmnote"><b>${d.xmNotice}</b><ol>${d.xmSteps.map(t=>`<li>${t}</li>`).join("")}</ol></div>
    <div class="xmgrid"><div class="xmbox"><h2>${d.xmListH}</h2>${rows.length?`<table><thead><tr><th>${d.xmYear}</th><th>${d.xmName}</th><th class="hs">${d.xmTime}</th><th class="hs">${d.xmSat}</th><th>${d.xmMine}</th><th></th></tr></thead>
      <tbody>${rows.join("")}</tbody></table>`:`<p style="padding:16px">${d.xmNoExam}</p>`}</div>
    <aside class="xmbox xmme"><h2>${d.xmMeH}</h2>${card}</aside></div>`;
}
async function xmMount(key){
  const root=document.getElementById("xmRoot"); if(!root||root.dataset.key!==key) return;
  const x={stats:{},mine:[],tokens:null,active:null,me:null,off:false};
  const h=await cmHealth().catch(()=>({}));
  if(!h.lab){ x.off=true; }
  else{
    await cmLoadMe(); x.me=cm.me;
    const jobs=[cmApi("GET","/lab/stats?comp="+key).then(r=>{x.stats=r.exams;},()=>{})];
    if(cm.me) jobs.push(cmApi("GET","/lab/sessions").then(r=>{x.mine=r.sessions;},()=>{}), cmApi("GET","/lab/active").then(r=>{x.tokens=r.tokens;x.active=r.active;},()=>{}));
    await Promise.all(jobs);
  }
  const now=document.getElementById("xmRoot"); if(now===root) root.innerHTML=xmPortalHtml(key,x);
}

/* exam mode (sim/exam.html): the experiments that are sat together — every E1, E2, … of a year with a
   browser simulator on one bench; any other round (an observation, a data analysis) on its own */
/* the exam's name for a round: its id, or a short code for ids like «O9–O13» or «23» */
const examTask=p=>/^[A-Z][A-Za-z0-9]{0,3}$/.test(p.id)?p.id:/^[A-Z]/.test(p.id)?p.id[0]+((p.id.match(/^[A-Z](\d{1,2})/)||[])[1]||""):"P"+String(p.id).replace(/\D/g,"").slice(0,3);
function examGroups(key,yr){
  const live=yr.problems.filter(p=>!p.hold&&p.files&&p.files.sim&&/^sim\/[A-Za-z0-9_]+_web\.html(\?task=[\w-]+)?$/.test(p.files.sim));
  const exp=live.filter(p=>/^E\d*$/.test(p.id)), out=exp.length?[exp]:[];
  /* NBPhO: the year's experiments and the rest of its booklet (the theory) are one exam, as on the day */
  const t=key==="nbpho"&&exp.length?thyOf(key,yr.y):null;
  if(t&&t.f.T&&t.f.T.sol&&exp.length<4) out[0]=exp.concat([{id:"T",thy:true,skip:(t.x||[]).join(","),
    title:{ko:"이론 (실험 문제를 뺀 나머지)",en:"Theory (every problem but the experiments)"},files:{pdf:PDF_BASE+t.f.T.paper,sol:PDF_BASE+t.f.T.sol}}]);
  live.filter(p=>!exp.includes(p)).forEach(p=>out.push([p]));
  return out;
}
function examHref(key,yr,group){
  const pick=v=>typeof v==="string"?v:(v&&(v[lang]||v.ko||v.en))||"";
  const short=u=>u.startsWith(PDF_BASE)?u.slice(PDF_BASE.length):u;
  const q=new URLSearchParams({c:key,y:yr.y,n:DATA[key].abbr,e:group.map(examTask).join(","),
    f:group.map(p=>p.thy?"-":p.files.sim.slice(4)).join(","),t:group.map(p=>p.title?p.title[lang]:"").join("|"),
    p:group.map(p=>short(pick(p.files.pdf))).join("|"),s:group.map(p=>short(pick(p.files.sol))).join("|"),lang});
  /* a combined exam (NBPhO): the booklet number of each experiment, and the problems the theory part leaves out */
  if(group.some(p=>p.thy)){ q.set("o",group.map(p=>p.no||"").join("|")); q.set("x",(group.find(p=>p.thy)||{}).skip||""); }
  return "sim/exam.html?"+q.toString();
}
/* a theory exam (sim/exam.html?m=t): the paper of each part on screen only; its solution, separate marking scheme and
   answer sheets travel with it (the server draws the marking scheme from the solution and the scheme together) */
function theoryHref(key,yr,parts){
  const t=thyOf(key,yr.y), f=x=>t.f[x]||{}, all=parts.map(x=>(x==="T"&&!t.f.T1?(t.p||[]):(t.p||[]).filter(q=>q[0]===x)).map(q=>q[1]).join(" / ").slice(0,300));
  const q=new URLSearchParams({m:"t",c:key,y:yr.y,n:DATA[key].abbr,e:parts.join(","),t:all.join("|"),
    p:parts.map(x=>f(x).paper||"").join("|"),s:parts.map(x=>f(x).sol||"").join("|"),k:parts.map(x=>f(x).mark||"").join("|"),a:parts.map(x=>f(x).answer||"").join("|"),lang});
  return "sim/exam.html?"+q.toString();
}
/* the year's theory papers, laid out like the experiments: a card per problem (T1, T2, …; T for a paper published
   whole) with the same six buttons on every card, greyed where there is no file.  In Korean the translation comes
   first where there is one (theory_ko.json: a part's files under ko, Korean titles pk, general instructions g; w a
   Korean whole paper where the originals are per problem), with the original beside it */
function theoryHtml(key,yr){
  const d=UI[lang], t=thyOf(key,yr.y); if(!t) return "";
  const ko=lang==="ko", kt=Object.fromEntries(t.pk||[]);
  const a=(f,lbl,tag)=>f?`<a class="btn ghost" href="${thyUrl(f)}" target="_blank" rel="noopener">${lbl}${tag?` <span class="lgtag">${tag}</span>`:""}</a>`
                        :`<button class="btn ghost" disabled>${lbl}</button>`;
  /* Korean: [problems][solutions][answer sheets] / [original problems][original solutions][marking scheme];
     English: the originals first, then the Korean problems and solutions */
  const btns=(f,k)=>ko
    ? [a(k.paper||f.paper,d.thyPaper,!k.paper&&f.paper?d.thyOrig:""), a(k.sol||f.sol,d.thySol,!k.sol&&f.sol?d.thyOrig:""),
       a(k.answer||f.answer,d.thyAns,!k.answer&&f.answer?d.thyOrig:""),
       a(k.paper?f.paper:null,d.thyPaperO), a(k.sol?f.sol:null,d.thySolO),
       a(k.mark||f.mark,d.thyMark,!k.mark&&f.mark?d.thyOrig:"")]
    : [a(f.paper,d.thyPaper), a(f.sol,d.thySol), a(f.answer,d.thyAns), a(f.mark,d.thyMark), a(k.paper,d.thyPaperO), a(k.sol,d.thySolO)];
  const card=(code,probs,f,k,extra)=>{
    const has=!!(k.paper||k.sol), chip=has?d.thyKoChip:d.thyOrigChip;
    const titles=probs.map(q=>ko&&kt[q[0]]||q[1]);
    return `<article class="prob">

    </article>`; };
  /* a paper published whole is not a card of its own once its problems have cards (they open it as the original) */
  const order=Object.keys(t.f).filter(x=>!(x==="T"&&t.f.T1)).sort((a,b)=>a.localeCompare(b,"en",{numeric:true}));
  const cards=order.map(x=>{ const f=t.f[x], k=f.ko||{};
      return card(x,x==="T"&&!t.f.T1?(t.p||[]):(t.p||[]).filter(q=>q[0]===x),f,k,
        k.rev?`<div class="docs n1" style="margin-top:8px">${a(k.rev,ko?d.thyRev:d.thyRev+" ("+d.thyKo+")")}</div>`:""); }).join("")
    +(t.w?card("T",[],{},t.w):"");
  const guide=t.g?(ko?t.g.ko||t.g.en:t.g.en||t.g.ko):"";
  return `<div class="thycards">
    <div class="shead">
      <h2 style="font-size:1.15rem">${d.thyPick}</h2>
      ${guide?`<a class="genlink" href="${thyUrl(guide)}" target="_blank" rel="noopener">${d.thyGuide}${!ko&&!t.g.en?` <span class="lgtag">KO</span>`:""}</a>`:""}
    </div>
    <p class="tn" style="margin:-14px 0 18px;font-size:12.5px;color:var(--graphite)">${(t.w||t.g||order.some(x=>t.f[x].ko))?d.thyNoteKo:d.thyNote}</p>
    ${theoryGroups(key,yr).length||examGroups(key,yr).some(g=>g.some(p=>p.thy))?`<p class="yrexam"><a href="#/${key}/exam">⏱ ${d.thyExam}</a></p>`:""}
    <div class="probs">${cards}</div></div>`;
}

      s+=`<line x1="${x}" y1="9" x2="${x}" y2="${big?20:15}" stroke="#8A99A8" stroke-width="${big?1.1:.6}"/>`;

/* ══════════════════════════════════════════════════════════════
   THE SIGNATURES — one per published experiment, each drawn from
   the same physics the simulator itself runs.  Nothing here is a
   result: they are raw instrument outputs, as the bench gives them.
   One is picked at random every time the home page is drawn.
   ══════════════════════════════════════════════════════════════ */
let animId=null, heroPick=null;

const PEN=(c,col,w)=>{c.strokeStyle=col;c.lineWidth=w;c.lineJoin="round";c.lineCap="round";};
function frame(c,w,h,pad){ c.fillStyle="#fff"; c.fillRect(0,0,w,h);
  return {X:(u,a,b)=>pad+(u-a)/(b-a)*(w-2*pad), Y:(v,a,b)=>h-pad-(v-a)/(b-a)*(h-2*pad)}; }
function mmss(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");}

/* ── IPhO 2017 E1 · laser deflectogram on millimetre paper ────── */
/* ══════════════════════════════════════════════════════════════
   THE CONSOLE — four of the published experiments are command-line
   programs, so their covers are the session itself: the same header,
   the same palette, the same prompts, and output computed here by
   the same physics the page runs.
   ══════════════════════════════════════════════════════════════ */
const TERM_FG="#cccccc", TERM_IN="#9cdcfe", TERM_DIM="#7d7d7d";
function termPad(v,n,right){ let t=String(v);
  while(t.length<n) t = right ? t+" " : " "+t;
  return t; }
/* reveal the transcript a character at a time, so it types itself */
function termCut(feed,n){
  const out=[];
  for(const e of feed){
    const body=e.s||"", ans=e.ans||"";
    if(n<=0) break;
    const a=body.slice(0,Math.min(body.length,n));
    n-=a.length;
    const b=n>0 ? ans.slice(0,Math.min(ans.length,n)) : "";
    n-=b.length+1;
    out.push({s:a, ans:b, dim:e.dim, acc:e.acc, wait:e.ans!==undefined});
    if(a.length<body.length||b.length<ans.length) break;
  }
  return out;
}
const termLen=feed=>feed.reduce((n,e)=>n+(e.s||"").length+(e.ans||"").length+1,0);
function termPaint(c,w,h,title,feed,n){
  const fs=Math.max(8.5,Math.min(13,h/33)), lh=fs*1.45, padX=Math.max(9,fs);
  c.fillStyle="#1e1e1e"; c.fillRect(0,0,w,h);
  const hh=Math.round(fs*2.5);
  c.fillStyle="#141414"; c.fillRect(0,0,w,hh);
  c.fillStyle="#2a2a2a"; c.fillRect(0,hh-1,w,1);
  c.textAlign="left"; c.textBaseline="middle";
  c.font="600 "+(fs*1.02).toFixed(1)+"px ui-sans-serif,system-ui,'Segoe UI',sans-serif";
  c.fillStyle="#e8e8e8"; c.fillText(title,padX,hh*0.52);
  const bh=Math.round(fs*2.3);
  c.fillStyle="#0c0c0c"; c.fillRect(0,hh,w,h-hh);
  c.save(); c.beginPath(); c.rect(0,hh,w,h-hh-bh); c.clip();
  c.font=fs.toFixed(1)+"px ui-monospace,Consolas,'Courier New',monospace";
  const rows=termCut(feed,n);
  const room=Math.max(1,Math.floor((h-hh-bh-fs*0.8)/lh));
  const vis=rows.slice(Math.max(0,rows.length-room));
  const top=hh+fs*1.1;
  vis.forEach((L,i)=>{
    const y=top+i*lh;
    c.fillStyle=L.acc?"#4ec9b0":(L.dim?TERM_DIM:TERM_FG);
    c.fillText(L.s,padX,y);
    if(L.ans){ c.fillStyle=TERM_IN;
      c.fillText(L.ans,padX+c.measureText(L.s).width,y); }
  });
  c.restore();
  /* the input bar the page keeps at the foot */
  c.fillStyle="#2a2a2a"; c.fillRect(0,h-bh,w,1);
  const last=rows[rows.length-1];
  const open=last&&last.wait&&!last.ans;
  c.font=fs.toFixed(1)+"px ui-monospace,Consolas,'Courier New',monospace";
  c.fillStyle=TERM_FG;
  const ps=open?last.s:"";
  c.fillText(ps,padX,h-bh/2);
  if(Math.floor(n/9)%2===0){
    c.fillStyle=TERM_IN;
    c.fillRect(padX+c.measureText(ps).width+1,h-bh/2-fs*0.55,fs*0.55,fs*1.1);
  }
  c.textBaseline="alphabetic";
}

const SIG_I17E1={

  paint(c,w,h,t){
    const SS=30.0, CELL_D=0.8, GRAMS=28.0;
    const Z0=10.4, Z=53.4, MAG=(Z0+CELL_D+Z)/Z0;
    const C0=GRAMS/150, D=2.29e-5-5.25e-5*C0, DNDC=0.2036-0.420*C0;
    const H_INT=1.5, XI_MID=10.5, THETA=45, pad=10;
    const sx=(w-2*pad)/SS, sy=(h-2*pad)/SS;
    const X=x=>pad+x*sx, Y=y=>h-pad-y*sy;

    c.stroke();

    for(let k=0;k<=SS+1e-6;k+=5){c.moveTo(X(k),Y(0));c.lineTo(X(k),Y(SS));
                                 c.moveTo(X(0),Y(k));c.lineTo(X(SS),Y(k));}
    c.stroke();
    const half=SS/2, cot=1/Math.tan(THETA*Math.PI/180);
    const te=Math.max(Math.min(t,1800),1), s=2*Math.sqrt(D*te), pre=C0/(s*Math.sqrt(Math.PI));
    PEN(c,"#98A6B4",1); c.setLineDash([4,4]);
    c.beginPath(); c.moveTo(X(half-half*cot),Y(0)); c.lineTo(X(half+half*cot),Y(SS));

      if(x<0||x>SS) continue;
      const Yv=xi/MAG;
      const y=half+(xi-XI_MID)-Z*CELL_D*DNDC*(pre*Math.exp(-Math.pow((H_INT-Yv)/s,2)));

/* ── APhO 2023 E1 · the photogate, pendulum swinging through ──── */
const SIG_A23E1={
  sim:"sim/apho2023_E1_web.html", tag:"APhO 2023 E1", span:96, rate:6,
  capL:{ko:"오실로스코프 · 광게이트 CH1 · 접촉 CH2",en:"Oscilloscope · photogate CH1 · contact CH2"},
  capR:{ko:"경과",en:"elapsed"},
  read:t=>mmss(t),
  paint(c,w,h,t){
    /* the bench's own pendulum, and its own balls */
    const G_UB=9.804, L_PEND=0.315405;
    const T=2*Math.PI*Math.sqrt(L_PEND/G_UB), OM=2*Math.PI/T;
    const TH0=0.30, TH_DECAY=110, TH_FLAG=0.0159;   /* flag half-angle */
    const m1=131.48e-3, m2=67.55e-3, R1=31.75e-3/2, R2=25.42e-3/2;
    const E_RED=1/(2*(1-0.30*0.30)/200e9), E_C=E_RED*1.1220;
    const mu=m1*m2/(m1+m2), Rs=R1*R2/(R1+R2);
    const th=x=>TH0*Math.exp(-x/TH_DECAY)*Math.cos(OM*x);
    const NX=14, NY=8, V_LOW=-0.1, TDIV=100e-3, WIN=NX*TDIV;
    const t1=t, t0=t1-WIN;                          /* roll mode: newest at the right */
    const pad=12, gw=w-2*pad, gh=h-2*pad;
    const VPD=2.0;                    /* the two traces sit on separate rails */
    const Yv =v=>h-pad-gh*((v/VPD)+0.9)/NY;   /* CH1 low on the screen */
    const Yv2=v=>h-pad-gh*((v/VPD)+4.4)/NY;   /* CH2 above it */
    c.fillStyle="#101418"; c.fillRect(0,0,w,h);
    PEN(c,"#17331a",1); c.beginPath();
    for(let i=1;i<NX;i++){const x=pad+gw*i/NX;c.moveTo(x,pad);c.lineTo(x,h-pad);}
    for(let j=1;j<NY;j++){const y=pad+gh*j/NY;c.moveTo(pad,y);c.lineTo(w-pad,y);}
    c.stroke();
    PEN(c,"#245c2a",1.2); c.beginPath();
    c.moveTo(pad,Yv(0)); c.lineTo(w-pad,Yv(0));
    c.moveTo(pad,Yv2(0)); c.lineTo(w-pad,Yv2(0)); c.stroke();
    /* CH2 — the contact itself.  Each swing brings the balls together a
       little slower, so the gate lasts a little longer; at 100 ms/div it
       is still only a hairline, which is the whole reason for zooming in. */
    PEN(c,"#e060b0",1.6);
    c.beginPath(); c.moveTo(pad,Yv2(-0.1)); c.lineTo(w-pad,Yv2(-0.1)); c.stroke();
    const kA=Math.ceil((t0-T/4)/T), kB=Math.floor((t1-T/4)/T);
    for(let k=kA;k<=kB;k++){
      const tc=T/4+k*T; if(tc<0) continue;
      const v=Math.abs(TH0*Math.exp(-tc/TH_DECAY)*OM)*L_PEND;
      const tau=2.755*Math.pow(mu*mu/(Rs*E_C*E_C*Math.max(v,1e-3)),0.2);
      const x=pad+gw*(tc-t0)/WIN, wpx=Math.max(gw*tau/WIN,1.3);
      c.beginPath(); c.moveTo(x,Yv2(0)); c.lineTo(x,Yv2(4.0));
      c.lineTo(x+wpx,Yv2(4.0)); c.lineTo(x+wpx,Yv2(0)); c.stroke();
    }
    /* CH1 — the flag cutting the beam, twice a period */
    const N=1600;
    PEN(c,"#e8c020",1.9); c.beginPath();
    for(let i=0;i<=N;i++){
      const tt=t0+WIN*i/N;
      let v=V_LOW;
      if(tt>0){
        const blocked=0.5*(1+Math.tanh((TH_FLAG-Math.abs(th(tt)))/(0.05*TH_FLAG)));
        v=V_LOW+(5.0-V_LOW)*blocked;
      }
      const x=pad+gw*i/N, y=Yv(v);
      i?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.stroke();
    c.fillStyle="#7d8a72"; c.font="10px ui-monospace,Consolas,monospace";
    c.fillText("CH1 2.00V   CH2 2.00V   100ms",pad+6,h-pad-7);
  }};

/* ── APhO 2023 E2 · interference from the heated surface ───────── */
const SIG_A23E2={
  sim:"sim/apho2023_E2_web.html", tag:"APhO 2023 E2", span:16, rate:1,
  capL:{ko:"스크린 위 간섭무늬",en:"Interference pattern on the screen"},
  capR:{ko:"레이저 전류",en:"laser current"},
  /* the knob is wound up from zero.  Nothing shows until about 80 mA,
     where the surface first bulges; by 98 mA it has yielded. */
  mAat(t){const u=Math.min(t/this.span,1); return 96*Math.pow(u,0.35);},
  read(t){return this.mAat(t).toFixed(1)+" mA";},
  paint(c,w,h,t){
    const P_TH=287.0, SLOPE=0.4632, HIDDEN=2.0, R_BASE=167.82, L_CM=42.0;
    const mA=this.mAat(t);
    const V=(mA<=1)?0:(0.35928+0.73823*Math.log(mA)), Pw=mA*V;
    const mmax=Math.max(SLOPE*(Pw-P_TH),0.0);
    const NW=190, NH=Math.max(1,Math.round(NW*h/w));
    if(!this._id||this._id.width!==NW||this._id.height!==NH){
      this._buf=document.createElement("canvas");
      this._buf.width=NW; this._buf.height=NH;
      this._bc=this._buf.getContext("2d");
      this._id=this._bc.createImageData(NW,NH);
    }
    const d=this._id.data, HALF=4.6;          /* half-width of view, cm */
    for(let j=0;j<NH;j++){
      const Yc=(j/(NH-1)-0.5)*2*HALF*h/w;
      for(let i=0;i<NW;i++){
        const Xc=(i/(NW-1)-0.5)*2*HALF;
        const Rr=Math.hypot(Xc,Yc);
        const nu=R_BASE*Math.sin(Math.atan2(Rr,L_CM));
        let img;
        if(mmax>0.4){
          const core=1.35*Math.exp(-Math.pow(nu/1.55,2));
          const env=0.80*Math.exp(-0.85*Math.pow(nu/Math.max(mmax,1.0),2));
          const cut=0.5*(1.0-Math.tanh((nu-mmax)/0.55));
          const sn=Math.sin(Math.PI*nu);
          let ring=env*cut*sn*sn;
          ring*=0.5*(1.0+Math.tanh((nu-HIDDEN)/0.55));
          img=core+ring;
        } else img=1.35*Math.exp(-Math.pow(nu/1.55,2));
        img*=Math.min(Math.max(Pw/300.0,0.0),1.6);
        const g=Math.min(Math.max(img,0),1.35)/1.35;
        const o=4*(j*NW+i);
        d[o]=Math.round(26+198*Math.pow(g,1.05));
        d[o+1]=Math.round(8+46*Math.pow(g,1.9));
        d[o+2]=Math.round(12+44*Math.pow(g,2.1));
        d[o+3]=255;
      }
    }
    this._bc.putImageData(this._id,0,0);
    c.fillStyle="#120406"; c.fillRect(0,0,w,h);
    c.imageSmoothingEnabled=true; c.drawImage(this._buf,0,0,w,h);
    PEN(c,"rgba(255,255,255,.30)",1);          /* the screen's own scale */
    const pxcm=(w/(2*HALF));
    c.beginPath();
    for(let k=-4;k<=4;k++){const x=w/2+k*pxcm;
      c.moveTo(x,h-10);c.lineTo(x,h-(k%2?16:22));}
    c.moveTo(8,h-10); c.lineTo(w-8,h-10); c.stroke();
  }};

/* ── ISPhO 2026 E1 · the grating's transmission spectrum ───────── */
const SIG_S26E1={
  sim:"sim/ispho2026_E1_web.html", tag:"ISPhO 2026 E1", span:24, rate:1.5,
  capL:{ko:"투과 스펙트럼 · 광섬유 브래그 격자",en:"Transmission spectrum · fibre Bragg grating"},
  capR:{ko:"격자 온도",en:"grating"},
  read(t){return (25+85*(0.5-0.5*Math.cos(2*Math.PI*t/this.span))).toFixed(0)+" \u00B0C";},
  paint(c,w,h,t){
    const N_C=1.444, A_TEMP=6.67e-6, KAPPA0=8.7e-8, Y_OPT=0.45, L_NM=50.0e6;
    const T=25+85*(0.5-0.5*Math.cos(2*Math.PI*t/this.span));
    const Lam=536.0*(1+(T-25)*A_TEMP);
    const kap0=KAPPA0*Math.exp(-Math.pow(0-Y_OPT,2)/8);
    const LO=1546.5, HI=1549.5, NP=620, pad=16, padL=34;
    const F={X:u=>padL+(u-LO)/(HI-LO)*(w-padL-pad),
             Y:v=>h-24-(v+34)/34.6*(h-24-pad)};
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    PEN(c,"#DCE7F0",.5); c.beginPath();
    for(let l=LO;l<=HI+1e-9;l+=0.5){c.moveTo(F.X(l),pad);c.lineTo(F.X(l),h-24);}
    for(let v=-30;v<=0.001;v+=10){c.moveTo(padL,F.Y(v));c.lineTo(w-pad,F.Y(v));}
    c.stroke();
    PEN(c,"#B4CADC",1); c.beginPath();
    c.moveTo(padL,F.Y(0)); c.lineTo(w-pad,F.Y(0));
    c.moveTo(padL,pad); c.lineTo(padL,h-24); c.stroke();
    /* |t|^2 for a uniform grating, then straight to dB */
    const raw=new Float64Array(NP);
    for(let i=0;i<NP;i++){
      const wl=LO+(HI-LO)*i/(NP-1);
      const kap=kap0*(1550/wl);
      const del=2*Math.PI*N_C/wl-Math.PI/Lam;
      const q=kap*kap-del*del;
      if(q>=0){                      /* gamma real  -> the stop band */
        const g=Math.sqrt(q), gL=Math.min(g*L_NM,60);
        const ch=Math.cosh(gL), sh=Math.sinh(gL);
        raw[i]=g*g/(g*g*ch*ch+del*del*sh*sh);
      } else {                       /* gamma imaginary -> the side lobes */
        const g=Math.sqrt(-q), gL=g*L_NM;
        const cs=Math.cos(gL), sn=Math.sin(gL);
        raw[i]=g*g/(g*g*cs*cs+del*del*sn*sn);
      }
      raw[i]=Math.min(raw[i],1.0)+1e-6;
    }
    const sm=new Float64Array(NP), R=6;
    for(let i=0;i<NP;i++){let a=0,ww=0;
      for(let j=-R;j<=R;j++){let m=i+j; if(m<0)m=0; if(m>=NP)m=NP-1;
        const k=Math.exp(-0.5*(j/2.4)**2); a+=raw[m]*k; ww+=k;}
      sm[i]=a/ww;}
    PEN(c,"#2c6f9b",2.2); c.beginPath();
    for(let i=0;i<NP;i++){
      const wl=LO+(HI-LO)*i/(NP-1);
      const db=Math.max(10*Math.log10(sm[i]),-34);
      i?c.lineTo(F.X(wl),F.Y(db)):c.moveTo(F.X(wl),F.Y(db));
    }
    c.stroke();
    c.fillStyle="#8A99A8"; c.font="9.5px IBM Plex Mono,ui-monospace,monospace";
    c.textAlign="center";
    for(let l=LO+0.5;l<HI;l+=1.0) c.fillText(l.toFixed(1),F.X(l),h-9);
    c.textAlign="right";
    for(let v=0;v>=-30;v-=10) c.fillText(v+" dB",padL-5,F.Y(v)+3);
    c.textAlign="left";
  }};
