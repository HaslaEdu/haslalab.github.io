# Cloudflare Workers Builds deploys the community API from this repository.
# The Worker itself lives in community/ (see community/README.md); this file lets the
# build run from the repository root, where Workers Builds starts by default.
name = "haslalab-community"
main = "community/src/index.js"
compatibility_date = "2025-09-01"
keep_vars = true

[placement]
# Keep in sync with community/wrangler.toml; D1's primary reports HKG.
region = "aws:ap-east-1"

[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "LAB_JOBS"
queue = "haslalab-lab-jobs"

[[queues.consumers]]
queue = "haslalab-lab-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 4
dead_letter_queue = "haslalab-lab-jobs-dead"

[vars]
ALLOWED_ORIGINS = "https://haslalab.org,https://www.haslalab.org,https://haslaedu.github.io,http://localhost:8765"
# Gemini reads the answer pages, builds marking schemes and grades experiments with this exact model (an alias such as
# gemini-flash-latest has no pinned price). GEMINI_GRADE_MODEL / GEMINI_SCHEME_MODEL may override the last two.
GEMINI_MODEL = "gemini-3.5-flash-lite"

[[d1_databases]]
binding = "DB"
database_name = "haslalab-community"
database_id = "96761b6d-c194-4ee5-9836-7845b51a5f07"
migrations_dir = "community/migrations"
