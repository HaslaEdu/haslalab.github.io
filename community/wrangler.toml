name = "haslalab-community"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Variables set in the dashboard (PADDLE_PRICES, LAB_KEEP_HOURS …) survive `wrangler deploy`; secrets always do.
keep_vars = true

# Run the Worker next to its database rather than next to the visitor: a page makes several
# database queries, and each one is a round trip, so this cuts the waiting the most.
[placement]
mode = "smart"

# Removes answer photos on time (LAB_KEEP_HOURS after grading) — without it the removal only runs now and then
# on ordinary requests.
[triggers]
crons = ["*/15 * * * *"]

# Sites allowed to call the API from the browser (comma-separated).
[vars]
ALLOWED_ORIGINS = "https://haslalab.org,https://www.haslalab.org,https://haslaedu.github.io,http://localhost:8765"

[[d1_databases]]
binding = "DB"
database_name = "haslalab-community"
# paste the id printed by `npx wrangler d1 create haslalab-community`
database_id = "96761b6d-c194-4ee5-9836-7845b51a5f07"
migrations_dir = "migrations"
