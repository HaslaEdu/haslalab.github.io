<title>NBPhO 2026 실험 — 물의 포화 증기압 · Saturation Pressure of Water · HaslaLab</title>
<meta name="description" content="NBPhO 2026 실험 문제 5 물의 포화 증기압을 브라우저에서 실행합니다. 도데칸을 채운 1.5 m 관 끝에 공기 방울을 가두고 주사기로 압력을 낮춰, 방울이 더 자라지 않을 때의 길이로 실온에서 물의 포화 증기압을 구합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="NBPhO 2026 실험 — 물의 포화 증기압 · Saturation Pressure of Water">
<meta property="og:description" content="NBPhO 2026 실험: 공기 방울 압력계와 도데칸 피스톤으로 물의 포화 증기압 재기.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const gauss=(m,s)=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const TRUE=(()=>{ const t={};
  t.T=Math.round(U(20.0,25.0)*10)/10;                  /* °C, written on the board by the invigilator */

  t.psat=0.61094*Math.exp(17.625*t.T/(t.T+243.04))*U(0.99,1.01);   /* kPa, the water's saturated vapour pressure */

const SYR={A:113.1, travel:55, tip:25};                  /* the 5 ml syringe: bore area mm², plunger travel mm, tip + Luer dead volume mm³ */

/* ══════════════════════════════════════════════════════════════
   2.  THE CHANNEL: what sits in the syringe and the tube, in order
       from the plunger face to the tube's far end.  Liquids keep their
       volume; a gas segment holds an amount n = p·V (kPa·mm³), split into
       air na and water vapour nv.
   ══════════════════════════════════════════════════════════════ */
const ST={ on:new Set(), conn:false, pin:false, tubeEnd:"air", tipAt:"air", lift:0, xp:8,      /* plunger position mm from the bottom */
  syr:[{k:"air",na:0,nv:0}], tube:[{k:"air",na:0,nv:0}], p:null, pS:null, wet:0, spare:1, t:0, speed:1, sw:{run:false,t:0},
  marks:[], auto:0, joint:0, dumped:0 };

function say(key,...args){ msg={key,args,t:performance.now()}; }

const itemName=k=>d().items[k]||k;
const PA=()=>TRUE.pair;
const isGas=s=>s.k==="air"||s.k==="vap";
const nOf=s=>s.na+s.nv;
const syrVol=()=>SYR.A*ST.xp+SYR.tip+(ST.conn?ST.joint:0);
const tubeVol=()=>TRUE.A*TRUE.L;
/* initial contents: an empty syringe holds air at its dead volume, the tube is full of air */
function resetTube(){ ST.tube=[{k:"air",na:PA()*tubeVol(),nv:0}]; ST.wet=0; ST.pin=false; ST.tubeEnd="air"; }
function resetSyr(){ ST.xp=0; ST.syr=[{k:"air",na:PA()*syrVol(),nv:0}]; }
resetTube(); resetSyr();

/* the whole channel as one list (syringe then tube) when they are joined */
function chan(){ return ST.conn?ST.syr.concat(ST.tube):null; }
/* split a joined channel back into syringe and tube parts at the syringe's volume */
function splitBack(list){ const Vs=syrVol(); let acc=0; const a=[],b=[];
  for(const s of list){ const v=segVol(s); if(acc+v<=Vs+1e-9){ a.push(s); acc+=v; continue; } if(acc>=Vs-1e-9){ b.push(s); acc+=v; continue; }
    const f=(Vs-acc)/v, s1=Object.assign({},s), s2=Object.assign({},s); if(isGas(s)){ s1.na=s.na*f; s1.nv=s.nv*f; s2.na=s.na*(1-f); s2.nv=s.nv*(1-f); } else { s1.v=s.v*f; s2.v=s.v*(1-f); }
    a.push(s1); b.push(s2); acc+=v; }
  ST.syr=a.length?a:[{k:"air",na:0,nv:0}]; ST.tube=b; }
/* the volume a segment takes at the current pressures */
let PCUR=null;
function segVol(s){ if(!isGas(s)) return s.v; return s.p?nOf(s)/s.p:nOf(s)/(PCUR||PA()); }
function merge(list){ const out=[]; for(const s of list){ if(isGas(s)?nOf(s)<1e-6:s.v<1e-6) continue; const last=out[out.length-1];
    if(last&&last.k===s.k&&isGas(s)){ last.na+=s.na; last.nv+=s.nv; } else if(last&&last.k===s.k&&!isGas(s)){ last.v+=s.v; } else out.push(Object.assign({},s)); } return out; }

/* height of a point at channel volume coordinate q (mm³ from the plunger): the syringe lies on the table,
   the tube rises (or falls) linearly by ST.lift metres towards its far end */
function heightAt(q){ const Vs=syrVol(); if(q<=Vs) return 0; return ST.lift*Math.min(1,(q-Vs)/tubeVol()); }

/* ══════════════════════════════════════════════════════════════
   3.  PRESSURE IN A CLOSED CHANNEL
       The plunger fixes the total volume; liquids are incompressible;
       each gas segment obeys p_i V_i = n_i, with p_i = p_syr − ρ g Δz.
   ══════════════════════════════════════════════════════════════ */
function solveClosed(list){ const Vtot=syrVol()+tubeVol(); let Vliq=0; for(const s of list) if(!isGas(s)) Vliq+=s.v;
  const Vg=Vtot-Vliq; if(Vg<=0) return null;
  /* pressure at each gas segment relative to the syringe: hydrostatics of the liquids before it */
  const f=p=>{ let q=0, V=0; for(const s of list){ if(isGas(s)){ const z=heightAt(q), pi=Math.max(1e-3,p-RHO_D*G0*z/1000); const vi=nOf(s)/pi; s.p=pi; V+=vi; q+=vi; } else q+=s.v; } return V; };
  let lo=1e-3, hi=5000; for(let i=0;i<60;i++){ const m=Math.sqrt(lo*hi); if(f(m)>Vg) lo=m; else hi=m; }
  const p=Math.sqrt(lo*hi); f(p); return p; }
/* gas at an open end is at atmospheric pressure (plus nothing else: the ends lie on the table) */
function setOpenPressures(list){ for(const s of list) if(isGas(s)) s.p=PA(); }

/* ══════════════════════════════════════════════════════════════
   4.  MOVING THE PLUNGER
   ══════════════════════════════════════════════════════════════ */
/* what enters an open end from the medium it sits in */
const MEDIUM={air:"air",D:"dod",W:"water",waste:"air"};
function newSeg(k,vol){ return k==="air"?{k:"air",na:PA()*vol,nv:0}:{k,v:vol}; }
function movePlunger(dx){ const x1=Math.max(0,Math.min(SYR.travel,ST.xp+dx)); dx=x1-ST.xp; if(Math.abs(dx)<1e-9) return 0; const dV=SYR.A*dx;
  if(ST.conn){ const list=chan();
    if(ST.pin){ const old=ST.xp; ST.xp=x1; const p=solveClosed(list); if(p===null){ ST.xp=old; say("stuck"); return 0; } splitBack(list); return dx; }
    /* far end open: liquid or air enters / leaves at the far end */
    ST.xp=x1; flowAtEnd(list,dV,MEDIUM[ST.tubeEnd]); splitBack(merge(list)); trackWet(); return dx; }
  /* the syringe alone, tip open in its medium */
  ST.xp=x1; const list=ST.syr.slice(); flowAtEnd(list,dV,MEDIUM[ST.tipAt]); ST.syr=merge(list); return dx; }
/* dV>0: the plunger was pulled, so dV of medium enters at the open end; dV<0: content leaves at the open end */
function flowAtEnd(list,dV,medium){ setOpenPressures(list);
  if(dV>0){ list.push(newSeg(medium,dV)); return; }
  let rem=-dV; while(rem>1e-9&&list.length){ const s=list[list.length-1], v=isGas(s)?nOf(s)/PA():s.v;
    if(v<=rem){ list.pop(); rem-=v; if(!isGas(s)) ST.dumped+=s.v; } else { if(isGas(s)){ const f=(v-rem)/v; s.na*=f; s.nv*=f; } else { s.v-=rem; ST.dumped+=rem; } rem=0; } } }
/* water inside the tube spoils its wall */
function trackWet(){ for(const s of ST.tube) if(s.k==="water"&&s.v>0.5){ if(ST.wet<1) say("wetWall"); ST.wet=Math.min(1,ST.wet+s.v/(TRUE.A*200)); } }

/* ══════════════════════════════════════════════════════════════
   5.  TIME: evaporation at the water, condensation, the wall, dissolved air
   ══════════════════════════════════════════════════════════════ */
function gasNextToWater(list){ for(let i=0;i<list.length;i++) if(list[i].k==="water"){ if(i+1<list.length&&isGas(list[i+1])) return list[i+1]; if(i>0&&isGas(list[i-1])) return list[i-1];
    const v={k:"vap",na:0,nv:1e-6,p:null}; list.splice(i+1,0,v); return v; } return null; }
function step(dt){ if(dt<=0) return; ST.t+=dt; if(ST.sw.run) ST.sw.t+=dt;
  if(ST.auto&&has("syringe")) movePlunger(ST.auto*dt);
  if(!(ST.conn&&ST.pin)){ ST.p=null; return; }
  const list=chan(); let p=solveClosed(list); if(p===null){ return; }
  const n=Math.max(1,Math.ceil(dt/0.05)), h=dt/n;
  for(let k=0;k<n;k++){
    /* the water surface keeps its vapour at psat: it evaporates below, condenses above */
    const g=gasNextToWater(list);
    if(g){ const pg=g.p||p, dn=TRUE.kEv*(TRUE.psat-pg)*h; g.nv=Math.max(0,g.nv+dn); }
    /* a wet wall boils off below psat into the gas nearest the far end */
    if(ST.wet>0){ const far=[...list].reverse().find(isGas); if(far&&(far.p||p)<TRUE.psat) far.nv+=ST.wet*0.6*TRUE.kEv*(TRUE.psat-(far.p||p))*h; }
    /* air dissolved in dodecane comes out slowly when the pressure is low */
    for(let i=0;i<list.length;i++){ const s=list[i]; if(s.k!=="dod") continue; if(s.dis===undefined) s.dis=s.v*TRUE.sol*PA();
      const nb=(isGas(list[i+1]||{})?list[i+1]:isGas(list[i-1]||{})?list[i-1]:null); if(!nb) continue; const eq=s.v*TRUE.sol*(nb.p||p), r=Math.max(0,(s.dis-eq))*h/600; s.dis-=r; nb.na+=r; }
    p=solveClosed(list); }
  const m=merge(list); for(const s of m) if(s.p===undefined) s.p=p; splitBack(m); PCUR=p; ST.p=p; }

/* lengths along the tube (mm from its syringe end) of every segment in it, for the drawings */
function tubeLayout(){ const out=[]; let x=0; for(const s of ST.tube){ const v=isGas(s)?nOf(s)/(s.p||PCUR||PA()):s.v, l=v/TRUE.A; out.push({k:s.k,x0:x,x1:x+l,s}); x+=l; } return out; }
function syrLayout(){ const out=[]; let q=0; for(const s of ST.syr){ const v=isGas(s)?nOf(s)/(s.p||PCUR||PA()):s.v; out.push({k:s.k,q0:q,q1:q+v,s}); q+=v; } return out; }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];

  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]<=0.02) continue;

function vcyl(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=0.7; ctx.stroke(); }

  const a=P(p0[0],p0[1],z), b=P(p1[0],p1[1],z);
  ctx.lineCap="round"; ctx.strokeStyle=col; ctx.lineWidth=2*r*SC; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if(hi){ ctx.strokeStyle=hi; ctx.lineWidth=Math.max(0.8,r*SC*0.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]-r*SC*0.45); ctx.lineTo(b[0],b[1]-r*SC*0.45); ctx.stroke(); }

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }

const add2=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub2=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul2=(a,k)=>[a[0]*k,a[1]*k], dot2=(a,b)=>a[0]*b[0]+a[1]*b[1],

/* ══════════════════════════════════════════════════════════════
   5.  LAB3D — the HaslaLab 3-D bench renderer (as in IPhO 2017): the scene is listed
   every frame and drawn with WebGL and a depth buffer, so no part can show through
   another from any angle; text3 prints labels onto the surfaces of the instruments.
   Its world has y up; the bench code below works in x right, y towards you, z up.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function L3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  const sx=CAM.W/2+CAM.px+xr*CAM.k, sy=CAM.H/2+CAM.py-up*CAM.k;
  if(_REC) _REC.set(sx+","+sy,dep);
  return [sx, sy, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;
  const dz=(dx*c-xr)/s, dy=(up+(dx*s+dz*c)*sp)/cp;
  return [x0, CAM.ty+dy, CAM.tz+dz];
}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const _shadeCache=new Map();
function shade3(col,f){
  const key=col+"|"+f.toFixed(2); let v=_shadeCache.get(key); if(v) return v;
  let a=1, rgb;
  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));
  v=a<1?`rgba(${r[0]},${r[1]},${r[2]},${a})`:`rgb(${r[0]},${r[1]},${r[2]})`;

}
const LIGHT3=(()=>{ const v=[-0.45,0.85,0.35], n=Math.hypot(...v); return v.map(a=>a/n); })();

trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.keep&&hand.item!=="end"){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); if(hand&&(hand.keep||hand.item==="end")) return; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
let cdrag=null;
const mmAt=x=>{ const [x0,x1]=TUBE_AREA; return TV.x0+(x-x0)/(x1-x0)*(TV.x1-TV.x0); };
closeCv.addEventListener("wheel",e=>{ if(tab!=="tube"||!TUBE_AREA) return; e.preventDefault(); const p=clpos(e), c=mmAt(p[0]), f=(p[0]-TUBE_AREA[0])/(TUBE_AREA[1]-TUBE_AREA[0]);
  const span=Math.max(20,Math.min(1580,(TV.x1-TV.x0)*(e.deltaY<0?1/1.3:1.3))); TV.x0=c-f*span; TV.x1=TV.x0+span; },{passive:false});
closeCv.addEventListener("dblclick",()=>{ TV.x0=-20; TV.x1=1560; });
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(cdrag){ const span=TV.x1-TV.x0, dmm=-(cmouse[0]-cdrag.x)/(TUBE_AREA[1]-TUBE_AREA[0])*span; TV.x0=cdrag.v+dmm; TV.x1=TV.x0+span; if(Math.abs(cmouse[0]-cdrag.x)>3) cdrag.moved=true; } });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e); closeCv.setPointerCapture(e.pointerId); if(tab!=="tube"||!TUBE_AREA) return;
  if(e.button===2){ if(ST.marks.length){ const m=mmAt(p[0]); let bi=0; ST.marks.forEach((v,i)=>{ if(Math.abs(v-m)<Math.abs(ST.marks[bi]-m)) bi=i; }); ST.marks.splice(bi,1); say("markDel"); } return; }
  cdrag={x:p[0],v:TV.x0,moved:false,y:p[1]}; });
closeCv.addEventListener("pointerup",e=>{ if(cdrag&&!cdrag.moved&&tab==="tube"&&TUBE_AREA&&Math.abs(cdrag.y-TUBE_AREA[2])<60){ if(!has("mtape")) say("noMtape"); else { const m=mmAt(cdrag.x); if(m>=0&&m<=TRUE.L){ ST.marks.push(m); say("markAdd",ST.marks.length); } } } cdrag=null; });

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
const mlToMm=ml=>ml*1000/SYR.A;
for(const [id,ml] of [["pm1",-1],["pm01",-0.1],["pm001",-0.01],["pp001",0.01],["pp01",0.1],["pp1",1]]) $(id).onclick=()=>{ if(!need("syringe")||(hand&&hand.item==="syringe")) return; ST.auto=0; movePlunger(mlToMm(ml)); if(ST.conn&&ST.pin) step(0.001); };
$("slow").onclick=()=>{ if(!need("syringe")) return; ST.auto=ST.auto?0:mlToMm(0.01); };
$("knock").onclick=()=>{ if(!need("syringe")) return; const gas=[],liq=[]; for(const s of ST.syr) (isGas(s)?gas:liq).push(s); if(!gas.length) return;
  const g={k:"air",na:gas.reduce((a,s)=>a+s.na,0),nv:gas.reduce((a,s)=>a+s.nv,0),p:gas[0].p}; ST.syr=merge(liq.concat([g])); say("knock"); if(ST.conn&&ST.pin) step(0.001); };
for(const [id,v] of [["lay0",0],["layUp",0.3],["layDn",-0.3]]) $(id).onclick=()=>{ if(!need("tube")) return; if(ST.tubeEnd!=="air"&&v!==0) return; ST.lift=v; say("lay"); if(ST.conn&&ST.pin) step(0.001); };
for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20]]) $(id).onclick=()=>{ ST.speed=s; };
$("swGo").onclick=()=>{ ST.sw.run=!ST.sw.run; }; $("swRst").onclick=()=>{ ST.sw.run=false; ST.sw.t=0; };
function saveText(name,txt){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved"); }
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
$("noteSave").onclick=()=>{ saveText("NBPhO2026_P5_notebook.txt",$("note").value); };
function renderPanel(){ const t=d();
  $("invV").textContent=t.inv(TRUE.T,TRUE.pair); $("invV").style.fontSize="15px";
  $("slow").textContent=ST.auto?t.slowOn:t.slowOff; $("slow").className=ST.auto?"on":""; $("knock").textContent=t.knock; $("syrHint").textContent=t.syrHint(ST.xp);
  for(const [id,v] of [["lay0",0],["layUp",0.3],["layDn",-0.3]]){ $(id).className=ST.lift===v?"on":""; }
  for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20]]) $(id).className=ST.speed===s?"on":"";
  const st=ST.sw.t; $("swV").textContent=Math.floor(st/60)+":"+(st%60).toFixed(1).padStart(4,"0"); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.wet>0) L.push([t.st.wet,true]);
  if(ST.lift!==0&&ST.conn&&ST.pin) L.push([t.st.lift,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-inv","hInv"],["t-h-syr","hSyr"],["t-h-lay","hLay"],["lay0","lay0"],["layUp","layUp"],["layDn","layDn"],["t-h-sp","hSp"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let rem=dt*ST.speed; while(rem>1e-9){ const h=Math.min(0.1,rem); step(h); rem-=h; }
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
</body>
