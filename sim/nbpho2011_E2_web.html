<meta property="og:description" content="NBPhO 2011 실험: 반원기둥 유리와 레이저의 전반사로 굴절률 재기.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}

header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;

     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

</style>

<body>
<script>
/* NBPhO 2011 problem 9 "Coefficient of refraction" on the 3-D bench, seen on the graph paper.  The laser
   beam goes radially into the half-cylinder, so it reaches the flat face at the axis O unrefracted; the
   half-cylinder turns about O.  At the flat face the beam is partly reflected and partly refracted out
   (Fresnel's equations, so the refracted beam fades as it nears the critical angle and is gone beyond
   it).  With a drop of the unknown liquid and the prism pressed against the flat face, the critical
   angle is that of glass against liquid, n_l/n.  Pencil dots on the graph paper mark points of the beams
   and the face, as the solution draws AO and BO.  n and n_l differ a little from visit to visit. */
var PROGRAM = {
  title: { ko: 'NBPhO 2011 실험 9 — 굴절률', en: 'NBPhO 2011 Problem 9 — Coefficient of refraction' },
  subtitle: { ko: '(i) 반원기둥 유리판의 굴절률을 구하고 불확도를 어림하세요. (ii) 액체의 굴절률을 구하고 불확도를 어림하세요. 장비: 반원기둥 유리판, 유리 프리즘, 미지의 액체, 레이저 포인터, 모눈종이, 자.',
              en: '(i) Determine the coefficient of refraction of the half-cylindrical glass plate and estimate the uncertainty. (ii) Determine that of the liquid and estimate the uncertainty. Equipment: the half-cylindrical glass plate, a glass prism, a container of unknown liquid, a laser pointer, graph paper and a ruler.' },
  notes: { ko: [
    '레이저를 원통면에 수직으로(축 O 를 향해) 비추면 빛은 꺾이지 않고 평면 O 에 닿습니다. 반원기둥을 O 둘레로 돌려 굴절된 빛이 나타나거나 사라지는 각을 찾으면 그것이 전반사의 임계각입니다.',
    '평면에서의 반사와 굴절은 프레넬 식대로 세기가 나뉘어, 임계각에 가까울수록 굴절된 빛이 희미해집니다.',
    '모눈종이를 클릭하면 연필 점을 찍습니다(가까운 점을 다시 클릭하면 지움). 공식 해답처럼 빛줄기 위의 점 A 와 평면 위의 발 B 로 n = |AO|/|BO|.',
    '(ii) 액체를 떨어뜨리고 프리즘을 평면에 대면, 유리–액체 경계의 임계각에서 n_l = n|B′O|/|A′O|.'], en: [
    'Aim the laser perpendicular to the curved face (at the axis O) and the light reaches the flat face at O unrefracted. Turn the half-cylinder about O and find where the refracted beam appears or vanishes: that is the critical angle.',
    'At the flat face the light divides between reflection and refraction by Fresnel\'s equations, so the refracted beam fades as the critical angle nears.',
    'Click the graph paper to put a pencil dot (click a dot again to rub it out). As in the solution, a point A on the beam and its foot B on the face give n = |AO|/|BO|.',
    '(ii) With a drop of the liquid and the prism pressed to the flat face, the critical angle of the glass–liquid boundary gives n_l = n|B′O|/|A′O|.'] }
};

var LAB = { phi: 0.9, prism: false, dots: [] };
PROGRAM.lab = {
  intro: { ko: '책상 위 모눈종이(1 mm) 한가운데에 반원기둥 유리판(반지름 4 cm), 왼쪽에 종이와 나란히 비추는 레이저 포인터, 옆에 유리 프리즘과 액체 병.',
           en: 'On the desk: graph paper (1 mm) with the half-cylindrical glass plate (radius 4 cm) in its middle, the laser pointer on the left shining along the paper, and the glass prism and the bottle of liquid beside them.' },
  howto: { ko: ['유리판: 좌우로 끌거나 휠로 O 둘레로 돌리기 (Shift+휠: 미세)',
                '액체 병 클릭: 액체를 떨어뜨리고 프리즘을 평면에 대기 / 떼기',
                '모눈종이 클릭: 위에서 가까이 보기 — 그 안에서 클릭하면 연필 점 찍기, 점을 다시 클릭하면 지우기 (휠로 확대)'],
           en: ['Glass plate: drag left or right, or roll the wheel, to turn it about O (Shift+wheel: fine)',
                'Click the bottle of liquid: put a drop on and press the prism to the flat face / take it off',
                'Click the graph paper: look down at it — there, a click puts a pencil dot and a click on a dot rubs it out (wheel to zoom)'] },
  notePlaceholder: { ko: '예) 굴절빛이 사라질 때: A(−31.5, 23.0) mm, B(…), O(0,0) → n = |AO|/|BO|', en: 'e.g. refracted beam vanishes: A(−31.5, 23.0) mm, B(…), O(0,0) → n = |AO|/|BO|' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var n = 1.515 * (1 + S.sys('n', 0.006)), nl = 1.430 * (1 + S.sys('nl', 0.006)), RC = 4, H = 1.2, OX = 0, OZ = 0, BY = 0.6;
    var paper = (function () { var c = document.createElement('canvas'), k = 12, W = 260, D = 180; c.width = W * k; c.height = D * k; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#fbfaf3'; g.fillRect(0, 0, c.width, c.height);
      for (var i = 0; i <= W; i++) { g.fillStyle = i % 10 === 0 ? 'rgba(220,120,60,.55)' : i % 5 === 0 ? 'rgba(225,140,90,.38)' : 'rgba(230,160,120,.22)'; g.fillRect(i * k, 0, i % 10 === 0 ? 2 : 1, c.height); }
      for (i = 0; i <= D; i++) { g.fillStyle = i % 10 === 0 ? 'rgba(220,120,60,.55)' : i % 5 === 0 ? 'rgba(225,140,90,.38)' : 'rgba(230,160,120,.22)'; g.fillRect(0, i * k, c.width, i % 10 === 0 ? 2 : 1); }
      return c; })();
    var PW = 26, PD = 18;                                                          /* cm: the sheet, centred on O */
    function fresnel(n1, n2, ci) { var s = n1 / n2 * Math.sqrt(1 - ci * ci); if (s >= 1) return 1; var ct = Math.sqrt(1 - s * s);
      var rs = (n1 * ci - n2 * ct) / (n1 * ci + n2 * ct), rp = (n2 * ci - n1 * ct) / (n2 * ci + n1 * ct); return (rs * rs + rp * rp) / 2; }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['glass'],
      home: { yaw: -0.2, pitch: 0.9, k: 20, tx: 0, ty: 0, tz: 0 },
      views: { paper: { yaw: 0, pitch: 1.5, k: 48, tx: 0, ty: 0, tz: 0, title: { ko: '모눈종이 (위에서)', en: 'The graph paper (from above)' },
                        hint: { ko: '종이 클릭: 점 찍기 · 휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Click the paper: a dot · wheel: zoom · drag empty space: pan · Esc: back' } } },
      frame: function (b) {
        var sm = b.screenMoved('glass'), wh = b.wheel('glass'); if (sm[0] || wh) LAB.phi += sm[0] * 0.05 + wh * 0.01;
        if (b.clicked('c:liq')) { LAB.prism = !LAB.prism; b.say(LAB.prism ? '액체를 떨어뜨리고 프리즘을 평면에 댔습니다.' : '프리즘을 떼고 닦았습니다.', LAB.prism ? 'A drop of liquid, and the prism pressed to the flat face.' : 'Prism off, the face wiped clean.'); }
        B3.desk(-30, 30, -20, 20);
        B3.tex3(paper, 0, 0, paper.width, paper.height, [OX - PW / 2, 0.01, OZ - PD / 2], [PW, 0, 0], [0, 0, PD], { id: 'c:paper' });
        if (b.clicked('c:paper') && b.view !== 'paper') b.go('paper');
        else if (b.clicked('c:paper')) { var mp = b.mouseOn(0.01); if (mp) { var hit = -1; LAB.dots.forEach(function (d, i) { if (Math.hypot(d[0] - mp[0], d[1] - mp[2]) < 0.25) hit = i; });
          if (hit >= 0) LAB.dots.splice(hit, 1); else if (LAB.dots.length < 40) LAB.dots.push([mp[0], mp[2]]); } }
        LAB.dots.forEach(function (d) { B3.cyl3('y', 0.011, 0.02, d[0], d[1], 0.06, '#333', { seg: 8 }); });
        /* the half-cylinder: flat face through O along f, the round side towards the laser */
        var f = [Math.cos(LAB.phi), Math.sin(LAB.phi)], nrm = [-f[1], f[0]];                 /* face direction, its normal (x, z) */
        if (nrm[0] > 0) { nrm = [-nrm[0], -nrm[1]]; }                                       /* the normal pointing to the laser's side (−x) */
        var pts = []; for (var i = 0; i <= 32; i++) { var a = i / 32 * Math.PI, dx = Math.cos(a) * f[0] + Math.sin(a) * nrm[0], dz = Math.cos(a) * f[1] + Math.sin(a) * nrm[1]; pts.push([OX + RC * dx, OZ + RC * dz]); }
        B3.prism3('y', 0.02, H, pts.map(function (p) { return [p[0], p[1]]; }), 'rgba(200,230,240,.35)', { id: 'm:glass' });
        if (LAB.prism) { var pr = [[OX + f[0] * 3, OZ + f[1] * 3], [OX - f[0] * 3, OZ - f[1] * 3], [OX - nrm[0] * 3.5, OZ - nrm[1] * 3.5]];
          B3.prism3('y', 0.02, H, pr, 'rgba(210,235,225,.32)'); B3.box3(OX - 0.4, OX + 0.4, 0.02, H, OZ - 0.4, OZ + 0.4, 'rgba(240,225,150,.2)'); }
        /* the laser and the beams (at mid-height of the glass, drawn on the paper) */
        B3.cyl3('x', OX - 22, OX - 15, BY, OZ, 0.45, '#2b2b2b', { seg: 14, cap: '#444' });
        B3.line3([OX - 15, BY, OZ], [OX, BY, OZ], 'rgba(255,40,30,.9)', 1.8);
        var d = [1, 0], ci = Math.abs(d[0] * nrm[0] + d[1] * nrm[1]), n2 = LAB.prism ? nl : 1, R = fresnel(n, n2, ci);
        var r = [d[0] - 2 * (d[0] * nrm[0] + d[1] * nrm[1]) * nrm[0], d[1] - 2 * (d[0] * nrm[0] + d[1] * nrm[1]) * nrm[1]];
        B3.line3([OX, BY, OZ], [OX + r[0] * 15, BY, OZ + r[1] * 15], 'rgba(255,40,30,' + (0.25 + 0.65 * R).toFixed(2) + ')', 1.5);
        var s = n / n2 * Math.sqrt(1 - ci * ci);
        if (s < 1) { var ct = Math.sqrt(1 - s * s), tang = [d[0] - (d[0] * nrm[0] + d[1] * nrm[1]) * nrm[0], d[1] - (d[0] * nrm[0] + d[1] * nrm[1]) * nrm[1]], tl = Math.hypot(tang[0], tang[1]) || 1;
          var t = [-nrm[0] * ct + tang[0] / tl * s, -nrm[1] * ct + tang[1] / tl * s];
          B3.line3([OX, BY, OZ], [OX + t[0] * 15, BY, OZ + t[1] * 15], 'rgba(255,40,30,' + (0.85 * (1 - R)).toFixed(2) + ')', 1.5); }
        /* the bottle of liquid */
        B3.cyl3('y', 0, 5, 20, 12, 1.6, 'rgba(240,225,150,.55)', { id: 'c:liq', seg: 18, cap: '#7a5a2a' });
        B3.text3([18.6, 3, 13.62], [1, 0, 0], [0, -1, 0], '?', 1.4, '#5a3a10', { weight: '800' });
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
