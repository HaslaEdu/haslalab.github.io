function plugAt(w){
  if(B.carry&&B.carry.k==="plug"&&B.carry.w===w){ const m=B.mouseW; return [m[0],2.5,m[2]]; }

/* the pattern on the screen (the model of the Python edition, drawn in red on the screen's white face) */
const NV=180, NX=110, patCv=document.createElement("canvas"); patCv.width=NX; patCv.height=NV;
const patCtx=patCv.getContext("2d"), patImg=patCtx.createImageData(NX,NV);
let patKey="";
function screenState(){
  const sc=screenOnBeam(); if(!sc||!lasing()) return null;
  const amp=Math.min(1.2,Math.max(0,(ST.cur-5)/10)), dl=ST.lensH-ST.laserH;
  let ph=null, v0=0;
  if(ST.holder){ const th=phi(), thick=ST.holder==="s1"?K.h1:K.h2;
    ph=phase(th,thick,liquidN()); v0=-(ST.laserH-K.edge[ST.holder])*10; }
  return {D:sc.D, dz:sc.dz, amp, dl, phi:ph, v0, missLens:Math.abs(dl)>4};
}
function renderPattern(s){
  const key=[s.phi===null?"n":(s.phi%(2*Math.PI)).toFixed(3),s.v0.toFixed(2),s.amp.toFixed(2)].join("|");
  if(key===patKey) return; patKey=key;
  const VMAX=6.5, D=patImg.data, col=new Float32Array(NV);
  for(let r=0;r<NV;r++){ const v=VMAX-2*VMAX*r/(NV-1);
    const I=s.phi===null||Math.abs(v-s.v0)>11.5? 1 : stepI(s.phi,v-s.v0);
    col[r]=I*Math.exp(-((v/(VMAX*0.78))**2))*s.amp; }
  for(let c=0;c<NX;c++){ const ex=Math.exp(-((2*c/(NX-1)-1)**2)/0.42);
    for(let r=0;r<NV;r++){ const M=Math.min(1,col[r]*ex/1.35), i=4*(r*NX+c);
      D[i]=255; D[i+1]=255*Math.min(1,0.9*M**3.2); D[i+2]=255*Math.min(1,0.5+0.45*M**1.9); D[i+3]=255*Math.min(1,M*1.25); } }
  patCtx.putImageData(patImg,0,0);
}
let scrKey="";
function refreshScreenTex(){
  const s=screenState(), key=s?[s.phi===null?"n":(s.phi%(2*Math.PI)).toFixed(3),s.v0.toFixed(2),s.amp.toFixed(2),s.dl.toFixed(2),s.D.toFixed(1),s.dz.toFixed(1),yLaser().toFixed(2)].join("|"):"none";
  if(key===scrKey) return; scrKey=key;
  paint(SCRNC,(w,h)=>{
    const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,"#ececea"); g.addColorStop(1,"#d9d9d5"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    if(!s) return;
    const [sx,sz]=ST.pos.screen, f=s.D/100, px=v=>v*20;
    const cz=(ST.pos.plat[1]-(sz-7)), cy=(16.6-yLaser());                       /* where the beam meets the screen, in cm from its top-left */
    if(s.missLens){ const gr=ctx.createRadialGradient(px(cz),px(cy),0,px(cz),px(cy),px(0.45)); gr.addColorStop(0,"rgba(255,70,110,"+Math.min(1,s.amp)+")"); gr.addColorStop(1,"rgba(255,40,60,0)");
      ctx.fillStyle=gr; ctx.fillRect(0,0,w,h); return; }
    renderPattern(s);
    const ph=8*f, pw=12*f, yc=cy-s.dl*0.06*f*10;
    ctx.save(); ctx.globalAlpha=Math.exp(-((s.dl/3)**2)); ctx.imageSmoothingEnabled=true;
    ctx.drawImage(patCv,px(cz-pw/2),px(yc-ph/2),px(pw),px(ph)); ctx.restore();
  });
  SCRNC._ver++;
}

const STEEL="#cfd5da", BLK="#17181b";
const add3=(a,b,s)=>[a[0]+b[0]*(s===undefined?1:s),a[1]+b[1]*(s===undefined?1:s),a[2]+b[2]*(s===undefined?1:s)];
function bez(P0,P1,P2,P3,n){ const out=[]; for(let i=0;i<=n;i++){ const t=i/n,u=1-t;
  out.push([0,1,2].map(j=>u*u*u*P0[j]+3*u*u*t*P1[j]+3*u*t*t*P2[j]+t*t*t*P3[j])); } return out; }
function tube(pts,r,col,o){ o=o||{}; const lw=Math.max(1.2,2*r*CAM.k);
  poly3(pts,col,lw,{bias:o.bias||0,cap:"round"});
  poly3(pts,o.hi||lerp(col,"#ffffff",0.35),Math.max(0.6,lw*0.24),{bias:(o.bias||0)+6,cap:"butt"});
  if(o.id){ const step=Math.max(1,Math.floor(pts.length/10)); for(let i=0;i<pts.length;i+=step) sphere3(pts[i],r*1.8,"rgba(0,0,0,0.004)",{id:o.id}); } }
/* a cable from a to b that lies on the desk between them */
function cable(a,b,r,col,o){ const L=Math.hypot(b[0]-a[0],b[2]-a[2]), dn=Math.min(6,L*0.3);
  const ua=[(b[0]-a[0])/(L||1),0,(b[2]-a[2])/(L||1)];
  tube(bez(a,[a[0]+ua[0]*dn,r+0.05,a[2]+ua[2]*dn],[b[0]-ua[0]*dn,r+0.05,b[2]-ua[2]*dn],b,24),r,col,o); }
/* a flat ring in the horizontal plane */
function annY(y,cx,cz,r0,r1,col,o,n){ n=n||40; for(let i=0;i<n;i++){ const a0=i/n*2*Math.PI, a1=(i+1)/n*2*Math.PI;
  face(orient([[cx+r0*Math.cos(a0),y,cz+r0*Math.sin(a0)],[cx+r1*Math.cos(a0),y,cz+r1*Math.sin(a0)],[cx+r1*Math.cos(a1),y,cz+r1*Math.sin(a1)],[cx+r0*Math.cos(a1),y,cz+r0*Math.sin(a1)]],[0,1,0]),Object.assign({fill:col},o||{})); } }
function annX(x,yc,zc,r0,r1,col,o,n){ n=n||32; for(let i=0;i<n;i++){ const a0=i/n*2*Math.PI, a1=(i+1)/n*2*Math.PI;
  face([[x,yc+r0*Math.sin(a0),zc+r0*Math.cos(a0)],[x,yc+r1*Math.sin(a0),zc+r1*Math.cos(a0)],[x,yc+r1*Math.sin(a1),zc+r1*Math.cos(a1)],[x,yc+r0*Math.sin(a1),zc+r0*Math.cos(a1)]],Object.assign({fill:col,cull:false},o||{})); } }
/* a box turned with the protractor: corners in the local frame (x along the beam at 0°) */
function obox(c,f,x0,x1,y0,y1,z0,z1,col,o){
  const p=(x,y,z)=>W(c,x,y,z,f), m=W(c,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2,f);
  const Fs=[[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],
            [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],
            [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]]];
  for(const F of Fs){ const q=F.map(v=>p(...v)), cc=q.reduce((s,v)=>[s[0]+v[0]/4,s[1]+v[1]/4,s[2]+v[2]/4],[0,0,0]);
    face(orient(q,[cc[0]-m[0],cc[1]-m[1],cc[2]-m[2]]),Object.assign({fill:col,cull:true},o||{})); } }
/* ---- 1. the main platform (Fig. 4-1) ---- */
function knobCap(c,y0,y1,r,ang,id){
  cyl3("y",y0,y1,c[0],c[2],r,"#1b1c1f",{seg:32,id,cap:"#232428"});
  for(let i=0;i<24;i++){ const a=i/24*2*Math.PI; line3([c[0]+r*1.002*Math.cos(a),y0+0.15,c[2]+r*1.002*Math.sin(a)],[c[0]+r*1.002*Math.cos(a),y1-0.15,c[2]+r*1.002*Math.sin(a)],"#0b0b0c",Math.max(1,0.05*CAM.k)); }
  line3([c[0],y1+0.01,c[2]],[c[0]+r*0.85*Math.cos(ang),y1+0.01,c[2]+r*0.85*Math.sin(ang)],"#d8dbe0",Math.max(1,0.12*CAM.k));
}
function tower3(c,sg,hmm,isLaser){
  const tx=c[0]+sg*TWR, z=c[2], y0=c[1], yc=y0+PY+hmm/10, kid=isLaser?"kL":"kR";
  box3(tx-2.6,tx+2.6,y0+1.5,y0+2.6,z-3.7,z+3.7,"#141518",{id:"plat"});
  for(const dz of [-2.7,2.7]) cylSeg("y",y0+2.6,y0+17.2,tx,z+dz,0.32,STEEL,{seg:12,id:"plat"},2.5);
  /* the black side plate with its bearings, on the outer side */
  box3(Math.min(tx+sg*2.2,tx+sg*2.6),Math.max(tx+sg*2.2,tx+sg*2.6),y0+2.6,y0+16.2,z-3.3,z+3.3,"#121316",{id:"plat"});
  for(const [yy,dz] of [[6,-1.6],[10.5,1.6],[14,-1.6]]) cyl3("x",tx+sg*2.6,tx+sg*2.95,y0+yy,z+dz,0.55,"#b9c0c6",{seg:14,cap:"#8b9298"});
  /* the lead screw, the carriage riding on the rods */
  cylSeg("y",y0+2.6,y0+17.2,tx,z,0.22,"#9aa1a8",{seg:8},3);
  box3(tx-1.7,tx+1.7,yc-1.1,yc+1.1,z-2.35,z+2.35,"#1c1d20",{id:"plat",top:"#25262a"});
  for(const dz of [-2.7,2.7]) cyl3("y",yc-1.2,yc+1.2,tx,z+dz,0.5,"#2a2b2f",{seg:12});
  /* the top arm and the height adjustment knob (one turn = 1 mm) */
  box3(tx-3.1,tx+3.1,y0+17.2,y0+17.75,z-3.9,z+3.9,"#141518",{id:"plat"});

function placeCarry(p){

    b.disabled=v!=="all"&&!viewOf(v); b.onclick=()=>goTo(v); box.appendChild(b); } }
$("cntUp").onclick=()=>{ ST.cnt++; $("cntLbl").textContent=ST.cnt; };
$("cntDn").onclick=()=>{ ST.cnt=Math.max(0,ST.cnt-1); $("cntLbl").textContent=ST.cnt; };
$("cntReset").onclick=()=>{ ST.cnt=0; $("cntLbl").textContent=ST.cnt; };
try{ const v=localStorage.getItem("ipho2024e2_note"); if(v) $("note").value=v; }catch(e){}
$("note").addEventListener("input",()=>{ try{ localStorage.setItem("ipho2024e2_note",$("note").value); }catch(e){} });
function renderStatus(){
  const L_=[], t=d();
  if(!ORDER.some(k=>ST.on[k])) L_.push([t.st.none,false]);
  else if(ST.on.plat){
    if(!powered()) L_.push([t.st.noPower,false]);
    else if(!ST.plug.L) L_.push([t.st.noLaser,false]);
    else if(!ST.laserOn) L_.push([t.st.off,false]);
    else if(!ST.holder) L_.push([t.st.noHolder,false]);
    else { if(Math.abs(ST.lensH-ST.laserH)>4) L_.push([t.st.lens,false]);
      if(!screenOnBeam()) L_.push([t.st.noScr,false]); }
    if(ST.contOn&&ST.paper) L_.push([t.st.paper,false]);
    else if(ST.contOn&&!ST.filled) L_.push([t.st.dry,false]);
  }
  if(msg.k&&performance.now()-msg.t<9000){ const f=t.m[msg.k]; if(f!==undefined) L_.push(["• "+(typeof f==="function"?f(...msg.a):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L_){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("t-benchcap").textContent=t.benchcap; $("t-tray").textContent=t.tray;
  $("t-h-view").textContent=t.hView; $("t-h-cnt").textContent=t.hCnt; $("cntUp").textContent=t.up; $("cntDn").textContent=t.dn; $("cntReset").textContent=t.reset;
  $("t-cnthint").textContent=t.cntHint; $("t-h-note").textContent=t.hNote; $("note").placeholder=t.notePh;
  $("t-h-how").textContent=t.hHow; $("t-howto").textContent=t.howto;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2024 E2 — 위상 계단에 의한 회절 · HaslaLab":"IPhO 2024 E2 — Diffraction from Phase Steps · HaslaLab";
  drawTray(); renderViews(); renderStatus(); renderViewBtn();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let ui=0;
function tick(){
  if(CW>10) draw();
  if(++ui%10===0){ renderStatus(); renderViews(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
paintStatic(); layout(); applyLang(); requestAnimationFrame(tick);
</script>
