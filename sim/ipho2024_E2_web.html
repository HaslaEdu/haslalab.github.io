function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);

function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }

  if(!ST.on.plat){ text(t.lab.noPlat,P.x+P.w/2,P.y+P.h/2,"#69717a",11,"center"); ctx.restore(); return; }
  const pxDeg=Math.max(9,P.h/26), R=pxDeg*180/Math.PI, cx=P.x+P.w*0.30+R, cy=P.y+P.h/2;
  ctx.fillStyle="#f6f6f3"; ctx.beginPath(); ctx.arc(cx,cy,R+4,0,7); ctx.fill();
  ctx.fillStyle="#121316"; ctx.beginPath(); ctx.arc(cx,cy,R-pxDeg*4.6,0,7); ctx.fill();
  for(let a=Math.floor(ST.prot)-20;a<=Math.ceil(ST.prot)+20;a++){
    const t2=Math.PI+(a-ST.prot)*Math.PI/180, L=a%10===0?2.2:a%5===0?1.5:0.9, A=((a%360)+360)%360;
    ctx.strokeStyle="#1d1d1d"; ctx.lineWidth=a%5===0?1.6:1.1;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(t2)*R,cy+Math.sin(t2)*R); ctx.lineTo(cx+Math.cos(t2)*(R-L*pxDeg),cy+Math.sin(t2)*(R-L*pxDeg)); ctx.stroke();
    if(a%10===0){ const lab=String(90-Math.abs((A%180)-90)), rr=R-2.9*pxDeg;
      ctx.save(); ctx.translate(cx+Math.cos(t2)*rr,cy+Math.sin(t2)*rr); ctx.rotate(t2+Math.PI/2); text(lab,0,0,A===0?"#c0392b":"#1d1d1d",Math.min(16,pxDeg*1.3),"center","700"); ctx.restore(); }
  }
  /* the fixed reference mark on the metal plate */
  ctx.fillStyle="#b8bdc2"; ctx.fillRect(P.x+P.w*0.30-pxDeg*2.6,cy-pxDeg*1.2,pxDeg*2.4,pxDeg*2.4);
  ctx.strokeStyle="#c0392b"; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(P.x+P.w*0.30-pxDeg*2.4,cy); ctx.lineTo(P.x+P.w*0.30+pxDeg*0.6,cy); ctx.stroke();
  text(t.lab.mark,P.x+6,P.y+P.h-12,"#5d5446",10.5);
  text(t.lab.top,P.x+6,P.y+12,"#5d5446",11);
  ctx.restore();
}
/* middle: side view, heights in mm drawn 1:1 vertically against a compressed horizontal scale */
let SV={};
function drawP2(){
  const P=P2, t=d(); panelBg(P,"#eef0f2");
  ctx.save(); ctx.beginPath(); ctx.rect(P.x,P.y,P.w,P.h); ctx.clip();
  text(t.lab.side,P.x+6,P.y+12,"#5d5446",11);
  if(!ST.on.plat){ text(t.lab.noPlat,P.x+P.w/2,P.y+P.h/2,"#69717a",11,"center"); ctx.restore(); return; }
  const base=P.y+P.h-14, k=(P.h-62)/104, Y=mm=>base-mm*k;          /* 0 … 104 mm */
  const xL=P.x+P.w*0.10, xC=P.x+P.w*0.33, xR=P.x+P.w*0.56;
  ctx.fillStyle="#1a1b1e"; ctx.fillRect(P.x+6,base,P.w*0.62,8);
  /* towers with their knobs */
  for(const [x,h,lab] of [[xL,ST.laserH,t.lab.laserH],[xR,ST.lensH,t.lab.lensH]]){
    ctx.fillStyle="#9ba1a8"; ctx.fillRect(x-12,Y(92),3,Y(0)-Y(92)); ctx.fillRect(x+9,Y(92),3,Y(0)-Y(92));
    fillR(x-16,Y(97),32,6,2,"#25262a"); circ(x,Y(97)-6,7,"#1a1a1c","#555"); ctx.fillStyle="#bbb"; ctx.fillRect(x-1.5,Y(97)-16,3,6);
    fillR(x-13,Y(h)-9,26,18,3,"#2b2c30","#000");
    text(lab,x+(x===xL?-4:4),P.y+30,"#5d5446",9,x===xL?"left":"right"); }
  ctx.fillStyle="#c0392b"; ctx.fillRect(xL+10,Y(ST.laserH)-2,8,4);
  ctx.fillStyle="rgba(180,215,240,.8)"; ctx.fillRect(xR-14,Y(ST.lensH)-12,4,24);
  /* container, holder, slide */
  if(ST.contOn){ ctx.fillStyle=ST.filled?"rgba(236,120,170,.55)":"rgba(220,230,236,.35)"; ctx.strokeStyle="#7a828a"; ctx.lineWidth=1;
    ctx.fillRect(xC-22,Y(ST.filled?70:2),44,Y(2)-Y(ST.filled?70:2)); ctx.strokeRect(xC-22,Y(78),44,Y(2)-Y(78)); }
  let edge=null;
  if(ST.holder){ edge=K.edge[ST.holder];
    ctx.fillStyle="#b0b5bb"; ctx.fillRect(xC-30,Y(102),3,Y(4)-Y(102)); ctx.fillRect(xC+27,Y(102),3,Y(4)-Y(102));
    ctx.fillStyle="#141416"; ctx.fillRect(xC-12,Y(102),24,Y(88)-Y(102));
    const w=ST.holder==="s2"?7:3; ctx.fillStyle="rgba(170,215,230,.85)"; ctx.fillRect(xC-w/2,Y(90),w,Y(edge)-Y(90));
    ctx.strokeStyle="#5d8fa0"; ctx.lineWidth=1; ctx.strokeRect(xC-w/2,Y(90),w,Y(edge)-Y(90)); }
  /* the beam */
  if(lasing()){ const a=Math.min(1,Math.max(0.15,(ST.cur-5)/10)); ctx.strokeStyle="rgba(255,30,30,"+(0.35+0.55*a)+")"; ctx.lineWidth=Math.max(2,1.0*k);
    ctx.beginPath(); ctx.moveTo(xL+18,Y(ST.laserH)); ctx.lineTo(xR-14,Y(ST.laserH)); ctx.stroke(); }
  /* magnifier around the edge of the slide where the beam meets it */
  if(ST.holder){ const bw=P.w*0.32, bh=P.h-70, bx=P.x+P.w*0.65, by=P.y+34, z=bh/6;   /* ±3 mm */
    fillR(bx,by,bw,bh,4,"#fbfbf9","#7a828a",1);
    ctx.save(); ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.clip();
    const yc=by+bh/2, ym=mm=>yc-(mm-ST.laserH)*z;
    if(ST.contOn&&ST.filled){ ctx.fillStyle="rgba(236,120,170,.25)"; ctx.fillRect(bx,by,bw,bh); }
    ctx.fillStyle="rgba(150,205,225,.8)"; ctx.fillRect(bx+bw*0.42,by-2,bw*0.16,Math.max(0,ym(edge)-by+2));
    ctx.strokeStyle="#4d7f90"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(bx+bw*0.42,ym(edge)); ctx.lineTo(bx+bw*0.58,ym(edge)); ctx.stroke();
    if(lasing()){ const g=ctx.createRadialGradient(bx+bw/2,yc,0,bx+bw/2,yc,z*0.9); g.addColorStop(0,"rgba(255,40,40,.85)"); g.addColorStop(1,"rgba(255,40,40,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx+bw/2,yc,z*0.9,0,7); ctx.fill(); }
    ctx.restore(); text(t.lab.zoom+" ×"+(z/k).toFixed(0),bx+4,by+bh+10,"#5d5446",9.5); }
  SV={xL,xR,Y,k};
  ctx.restore();
}
/* right: the observation screen */
const NV=180, NX=110, patCv=document.createElement("canvas"); patCv.width=NX; patCv.height=NV;
const patCtx=patCv.getContext("2d"), patImg=patCtx.createImageData(NX,NV);
let patKey="";
function screenState(){
  const sc=screenOnBeam(); if(!sc||!lasing()) return null;
  const amp=Math.min(1.2,Math.max(0,(ST.cur-5)/10)), dl=ST.lensH-ST.laserH;
  let phi=null, v0=0;
  if(ST.holder){ const th=ST.prot*Math.PI/180, thick=ST.holder==="s1"?K.h1:K.h2;
    phi=phase(th,thick,liquidN()); v0=-(ST.laserH-K.edge[ST.holder])*10; }
  return {D:sc.D, amp, dl, phi, v0, missLens:Math.abs(dl)>4};
}
function renderPattern(s){
  const key=[s.phi===null?"n":(s.phi%(2*Math.PI)).toFixed(3),s.v0.toFixed(2),s.amp.toFixed(2)].join("|");
  if(key===patKey) return; patKey=key;
  const VMAX=6.5, D=patImg.data;
  const col=new Float32Array(NV);
  for(let r=0;r<NV;r++){ const v=VMAX-2*VMAX*r/(NV-1);
    const I=s.phi===null||Math.abs(v-s.v0)>11.5? 1 : stepI(s.phi,v-s.v0);
    col[r]=I*Math.exp(-((v/(VMAX*0.78))**2))*s.amp; }
  for(let c=0;c<NX;c++){ const ex=Math.exp(-((2*c/(NX-1)-1)**2)/0.42);
    for(let r=0;r<NV;r++){ const M=Math.min(1,col[r]*ex/1.35), i=4*(r*NX+c);
      D[i]=255*Math.min(1,M*1.35); D[i+1]=255*Math.min(1,0.85*M**3.2); D[i+2]=255*Math.min(1,0.8*M**1.9); D[i+3]=255; } }
  patCtx.putImageData(patImg,0,0);
}
function drawP3(){
  const P=P3, t=d(); panelBg(P,"#2a2c30");
  ctx.save(); ctx.beginPath(); ctx.rect(P.x,P.y,P.w,P.h); ctx.clip();
  text(t.lab.screen,P.x+6,P.y+12,"#c9ced8",11);
  const side=Math.min(P.w-20,P.h-36), sx=P.x+(P.w-side)/2, sy=P.y+26;
  ctx.fillStyle="#3a3b3f"; ctx.fillRect(sx-6,sy-6,side+12,side+12);
  const s=screenState();
  ctx.fillStyle=s?"#1c1416":"#d9d8d3"; ctx.fillRect(sx,sy,side,side);
  if(!ST.on.screen||!screenOnBeam()){ text(ST.on.screen?t.lab.noScreen:"—",sx+side/2,sy+side/2,"#555",11,"center"); }
  else if(!s){ text(t.lab.dark,sx+side/2,sy+side/2,"#666",11,"center"); }
  else {
    const cmpx=side/20, f=s.D/100;
    if(s.missLens){ const g=ctx.createRadialGradient(sx+side/2,sy+side/2,0,sx+side/2,sy+side/2,cmpx*0.35);
      g.addColorStop(0,"rgba(255,90,110,"+Math.min(1,s.amp)+")"); g.addColorStop(1,"rgba(255,40,60,0)"); ctx.fillStyle=g; ctx.fillRect(sx,sy,side,side); }
    else { renderPattern(s);
      const h=8*f*cmpx, w=12*f*cmpx, yc=sy+side/2-s.dl*0.6*f*cmpx;
      ctx.save(); ctx.globalAlpha=Math.exp(-((s.dl/3)**2)); ctx.globalCompositeOperation="lighter"; ctx.imageSmoothingEnabled=true;
      ctx.drawImage(patCv,sx+side/2-w/2,yc-h/2,w,h); ctx.restore(); }
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════
   6.  HANDS ON THE BENCH
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function inItem(k,c){ if(!ST.on[k]) return false; const q=ST.pos[k], [w,h]=SZ[k]; return Math.abs(c[0]-q.x)<=w/2+0.3&&Math.abs(c[1]-q.y)<=h/2+0.3; }
const onProt=c=>ST.on.plat&&near(c,[ST.pos.plat.x,ST.pos.plat.y],PROT_R);
function returnItem(k){
  if(k==="plat"){ if(ST.holder){ ST.on[ST.holder]=false; ST.holder=null; } if(ST.contOn){ ST.on.cont=false; ST.contOn=false; ST.filled=false; } ST.plug.laserPlug=null; }
  if(k==="board"){ ST.plug.laserPlug=null; ST.plug.usbPlug=null; ST.laserOn=false; }
  if(k==="bank") ST.plug.usbPlug=null;
  if(k===ST.holder) ST.holder=null;
  if(k==="cont"){ ST.contOn=false; ST.filled=false; }
  ST.on[k]=false; say("back",itemName(k));
}
function returnHand(){
  if(!hand) return;
  if(hand.move){ ST.pos[hand.k]=hand.orig; ST.on[hand.k]=true; say("stays"); }
  hand=null;
}
function benchClick(p,right){
  const c=cm(p);
  if(hand){
    if(right){ returnHand(); return; }
    const k=hand.k;
    if(k==="plug"){ const w=hand.which;
      const atL=ST.on.board&&near(c,LASER_SOCK(),1.4), atU=ST.on.board&&near(c,USB_SOCK(),1.4);
      if(w==="laserPlug"&&atL){ ST.plug.laserPlug="sock"; hand=null; say("plugged",d().term.laserSock); return; }
      if(w==="usbPlug"&&atU){ ST.plug.usbPlug="sock"; hand=null; say("plugged",d().term.usbSock); return; }
      if(atL||atU){ say("wrong"); return; }
      hand=null; say("unplugged"); return; }
    if(k==="bottle"){
      const onC=(ST.contOn&&onProt(c))||(ST.on.cont&&!ST.contOn&&inItem("cont",c));
      if(!onC){ say("noUse"); return; }
      if(ST.contOn&&ST.holder){ say("fillFirst"); return; }
      ST.filled=true; say("fill"); return; }
    if(PLACE.includes(k)){
      const pos={x:c[0],y:c[1]};
      if((k==="s1"||k==="s2")&&onProt(c)){ if(ST.holder){ say("busy"); return; }
        ST.holder=k; ST.on[k]=true; ST.pos[k]={...ST.pos.plat}; hand=null; say(ST.contOn&&ST.filled?"immersed":"holderOn",itemName(k)); return; }
      if(k==="cont"&&onProt(c)){ if(ST.holder){ say("contFirst"); return; } if(ST.contOn){ say("busy"); return; }
        ST.contOn=true; ST.on.cont=true; hand=null; say("contOn"); return; }
      if(overlap(k,pos)){ say("noFit"); return; }
      ST.pos[k]=pos; ST.on[k]=true; const mv=hand.move; hand=null;
      if(k==="screen") say(screenOnBeam()?"screenOn":"screenOff"); else say(mv?"placed":"placed",itemName(k));
      return; }
    return;
  }
  if(right){
    for(const k of ["laserPlug","usbPlug"]) if(ST.plug[k]&&near(c,plugPos(k),1.3)){ ST.plug[k]=null; say("unplugged"); return; }
    if(onProt(c)&&near(c,[ST.pos.plat.x,ST.pos.plat.y],6.5)){ if(ST.holder){ returnItem(ST.holder); return; } if(ST.contOn){ returnItem("cont"); return; } }
    for(const k of ["s1","s2","cont","screen","board","bank","plat"]) if(inItem(k,c)&&!(k===ST.holder)&&!(k==="cont"&&ST.contOn)){ returnItem(k); return; }
    return;
  }
  for(const k of ["laserPlug","usbPlug"]){ const src=k==="laserPlug"?ST.on.plat:ST.on.bank;
    if(src&&near(c,plugPos(k),1.3)){ ST.plug[k]=null; hand={k:"plug",which:k}; say("plug",d().term[k]); return; } }
  if(ST.on.board&&near(c,ONOFF(),1.1)){ ST.laserOn=!ST.laserOn; say("onoff",ST.laserOn); return; }
  if(ST.on.board&&near(c,KNOB(),1.3)){ ST.cur=Math.min(25,ST.cur+0.5); say("knob"); return; }
  if(onProt(c)&&near(c,[ST.pos.plat.x,ST.pos.plat.y],6.5)){
    if(ST.holder){ const k=ST.holder; ST.holder=null; ST.on[k]=false; hand={k}; say("picked",itemName(k)); return; }
    if(ST.contOn){ ST.contOn=false; ST.on.cont=false; hand={k:"cont"}; say("picked",itemName("cont")); return; } }
  for(const k of ["s1","s2","cont","screen","board","bank","plat"]) if(inItem(k,c)&&k!==ST.holder&&!(k==="cont"&&ST.contOn)){
    hand={k,move:true,orig:{...ST.pos[k]}}; ST.on[k]=false; say("moveIt",itemName(k)); return; }
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
cv.addEventListener("wheel",e=>{ const c=cm(lpos(e)), s=e.deltaY<0?1:-1;
  if(ST.on.board&&near(c,KNOB(),2)){ e.preventDefault(); ST.cur=Math.max(4,Math.min(25,Math.round((ST.cur+s*(e.shiftKey?0.1:0.5))*10)/10)); say("knob"); return; }
  if(onProt(c)){ e.preventDefault(); turn(s*(e.shiftKey?0.05:0.25)); } },{passive:false});
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k&&!hand.move; if(hand) returnHand();
    if(!same&&trayAvail(k)){ hand={k}; say(TOOLS.includes(k)?"tool":"picked",itemName(k)); } drawTray(); return; } });
function turn(dd){ ST.prot=((ST.prot+dd)%360+360)%360; say("rot"); }
/* the close up: turn the protractor, the two height knobs */
let drag=null;
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const inP=(P,p)=>p[0]>=P.x&&p[0]<=P.x+P.w&&p[1]>=P.y&&p[1]<=P.y+P.h;
function knobAt(p){ if(!ST.on.plat||!inP(P2,p)||!SV.xL) return null; if(Math.abs(p[0]-SV.xL)<34) return "laserH"; if(Math.abs(p[0]-SV.xR)<34) return "lensH"; return null; }
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ if(e.button!==0) return; const p=clpos(e);
  if(ST.on.plat&&inP(P1,p)){ drag={kind:"prot",y0:p[1],a0:ST.prot}; closeCv.setPointerCapture(e.pointerId); return; }
  const kn=knobAt(p); if(kn){ drag={kind:kn,y0:p[1],h0:ST[kn]}; closeCv.setPointerCapture(e.pointerId); } });
closeCv.addEventListener("pointermove",e=>{ const p=clpos(e);
  closeCv.style.cursor=(ST.on.plat&&inP(P1,p))||knobAt(p)?"ns-resize":"default";
  if(!drag) return;
  if(drag.kind==="prot"){ const pxDeg=Math.max(9,P1.h/26); ST.prot=((drag.a0-(p[1]-drag.y0)/pxDeg*0.5)%360+360)%360; }
  else { ST[drag.kind]=Math.max(30,Math.min(90,drag.h0-(p[1]-drag.y0)/(SV.k*4))); say("height"); } });
closeCv.addEventListener("pointerup",()=>{ drag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), s=e.deltaY<0?1:-1;
  if(ST.on.plat&&inP(P1,p)){ e.preventDefault(); turn(s*(e.shiftKey?0.05:0.25)); return; }
  const kn=knobAt(p); if(kn){ e.preventDefault(); const st=kn==="laserH"?(e.shiftKey?0.02:0.1):(e.shiftKey?0.05:0.25);
    ST[kn]=Math.max(30,Math.min(90,Math.round((ST[kn]+s*st)*100)/100)); say("height"); } },{passive:false});

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("cntUp").onclick=()=>{ ST.cnt++; $("cntLbl").textContent=ST.cnt; };
$("cntDn").onclick=()=>{ ST.cnt=Math.max(0,ST.cnt-1); $("cntLbl").textContent=ST.cnt; };
$("cntReset").onclick=()=>{ ST.cnt=0; $("cntLbl").textContent=ST.cnt; };
try{ const v=localStorage.getItem("ipho2024e2_note"); if(v) $("note").value=v; }catch(e){}
$("note").addEventListener("input",()=>{ try{ localStorage.setItem("ipho2024e2_note",$("note").value); }catch(e){} });
function renderStatus(){
  const L=[], t=d();
  if(!PLACE.some(k=>ST.on[k])) L.push([t.st.none,false]);
  else if(ST.on.plat){
    if(!powered()) L.push([t.st.noPower,false]);
    else if(ST.plug.laserPlug!=="sock") L.push([t.st.noLaser,false]);
    else if(!ST.laserOn) L.push([t.st.off,false]);
    else if(!ST.holder) L.push([t.st.noHolder,false]);
    else { if(Math.abs(ST.laserH-K.edge[ST.holder])>0.8) L.push([t.st.miss,false]);
      if(Math.abs(ST.lensH-ST.laserH)>4) L.push([t.st.lens,false]);
      if(!screenOnBeam()) L.push([t.st.noScr,false]); }
    if(ST.contOn&&!ST.filled) L.push([t.st.dry,false]);
  }
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-cnt").textContent=t.hCnt; $("cntUp").textContent=t.up; $("cntDn").textContent=t.dn; $("cntReset").textContent=t.reset; $("t-cnthint").textContent=t.cntHint;
  $("t-h-note").textContent=t.hNote; $("note").placeholder=t.notePh; $("t-h-help").textContent=t.hHelp; $("t-help").textContent=t.help;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2024 E2 — 위상 계단에 의한 회절 · HaslaLab":"IPhO 2024 E2 — Diffraction from Phase Steps · HaslaLab";
  layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0;
function tick(){
  ctx.clearRect(0,0,LW,LH); drawBench();
  drawClose();
  if(++frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
