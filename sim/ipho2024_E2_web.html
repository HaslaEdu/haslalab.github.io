const FOOT={plat:[19.4,10.4],s1:[5.3,5.3],s2:[5.3,5.3],screen:[2.4,8.6],cont:[2.0,3.9],bottle:[2.4,2.4],board:[5.8,4.6],bank:[3.8,7.3]};
const ST={ on:{}, pos:{}, holder:null, contOn:false, paper:true, filled:false,
           plug:{L:false,U:false}, rest:{L:null,U:null}, laserOn:false, cur:15.0,
           prot:0, laserH:55.0, lensH:72.0, cnt:0 };
for(const k of ORDER){ ST.on[k]=false; ST.pos[k]=[0,0]; }
const B={ carry:null, down:null, knob:null, rim:null, mouse:[-99,-99], mouseW:[0,0,0], trayDrag:false };
const P_=()=>ST.pos.plat;
const powered=()=>ST.on.board&&ST.on.bank&&ST.plug.U;
const lasing=()=>ST.on.plat&&powered()&&ST.plug.L&&ST.laserOn;
const liquidN=()=>(ST.contOn&&ST.filled&&ST.holder)?K.nLiq:N_AIR;
const yLaser=()=>PY+ST.laserH/10, yLens=()=>PY+ST.lensH/10;
const phi=()=>ST.prot*Math.PI/180;
/* the protractor and what stands on it turn together about its centre */
function W(c,lx,ly,lz,f){ f=f===undefined?phi():f; const cs=Math.cos(f), sn=Math.sin(f);
  return [c[0]+lx*cs+lz*sn, c[1]+ly, c[2]-lx*sn+lz*cs]; }
function screenOnBeam(){ if(!ST.on.plat||!ST.on.screen) return null; const [px,pz]=P_(), [sx,sz]=ST.pos.screen;
  if(Math.abs(sz-pz)<6.5&&sx>px+TWR+2.5) return {D:sx-px, dz:pz-sz, x:sx, z:sz}; return null; }
/* where things on the board and the cables are */
const boardPt=(fx,fz,y)=>{ const [bx,bz]=ST.pos.board; return [bx-5.3+fx*10.6, y, bz-4.1+fz*8.2]; };
const SOCK_L=()=>boardPt(0.86,0.1,3.35), SOCK_U=()=>boardPt(0.13,0.1,3.25);
const KEY_P=()=>boardPt(0.58,0.77,2.8), KNOB_P=()=>boardPt(0.85,0.83,2.8), LCD_UV=[0.17,0.43,0.76,0.6];
const laserTerm=()=>{ const [px,pz]=P_(); return [px-TWR-2.9,yLaser(),pz]; };
const bankPort=()=>{ const [x,z]=ST.pos.bank; return [x,0.8,z-7.4]; };
function plugAt(w){
  if(B.carry&&B.carry.k==="plug"&&B.carry.w===w){ const m=B.mouseW; return [m[0],2.5,m[2]]; }
  if(ST.plug[w]) return w==="L"?SOCK_L():SOCK_U();
  if(ST.rest[w]) return [ST.rest[w][0],0.5,ST.rest[w][1]];
  if(w==="L"){ const [px,pz]=P_(); return [px-TWR-3,0.5,pz+12]; }
  const [x,z]=ST.pos.bank; return [x+2,0.5,z-13];
}

/* ---- printed faces, painted once (the screen and the LCD whenever they change) ---- */
const PROTC=mkCanvas(1400,1400), BOARDC=mkCanvas(848,656), LCDC=mkCanvas(420,72), SCRNC=mkCanvas(280,280), DESKC=mkCanvas(1024,640),
      PAPERC=mkCanvas(240,260);
for(const c of [DESKC,PAPERC]) c._static=true;
PROTC._ver=0; BOARDC._ver=0;
LCDC._ver=0; SCRNC._ver=0;
function rr(x,y,w,h,r,fill,stroke,lw){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
const fold=a=>{ a=((a%180)+180)%180; return 90-Math.abs(a-90); };
function paintStatic(){
  /* the protractor (Fig. 4-1, Fig. 2): a white ring, 1° ticks from its outer edge, upright numbers 10–80 in each quadrant
     (0 at the reference mark and opposite it, a black line and a dot there; 90 front and back), the mark of the
     event at the back and fanamouz at the front; inside, the black ring with four notches and the steel plate
     with its four slots; 1400 px across 2·R_PO */
  paint(PROTC,(w,h)=>{

    c.fillStyle="rgba(16,19,23,0.75)"; c.beginPath(); c.roundRect(q[0]-w/2,q[1]-9,w,18,5); c.fill(); c.fillStyle=col||"#e8eef2"; c.fillText(s,q[0],q[1]); };
  if(ST.on.plat&&!CAMTW&&(VIEW==="plat"||VIEW==="prot")){ const [px,pz]=P_(), t=d().tag;
    if(VIEW==="plat"){ tag([px-TWR,21.6,pz],t.knobL,"#f2c14e"); tag([px+TWR,21.6,pz],t.knobR,"#f2c14e");
      const ka=-40*Math.PI/180; tag([px+(R_PO+1.15)*Math.cos(ka),7.2,pz-(R_PO+1.15)*Math.sin(ka)],t.knobA,"#f2c14e"); }
    else tag([px-R_PO-0.6,PY+0.4,pz-1.6],t.mark,"#f2c14e"); }
  const cr=B.carry; if(cr){ const m=B.mouse, lbl=cr.k==="plug"?d().term[cr.w==="L"?"laserPlug":"usbPlug"]:d().trayItems[cr.id];
    c.textAlign="left"; c.font="700 14px "+FONT; c.fillStyle="#f2c14e"; c.fillText("⇱ "+lbl,m[0]+18,m[1]-16); }
}

/* ══════════════════════════════════════════════════════════════
   6.  TRAY
   ══════════════════════════════════════════════════════════════ */
const TRAY_ROW=48; let trayCells=[];
const trayOut=k=>ST.on[k]||(B.carry&&B.carry.id===k&&B.carry.k!=="new");
function trayIcon(c,k,x,y,dim){
  const R2=(a,b,e,f,fill,out)=>{ if(fill){c.fillStyle=dim?"#474d54":fill;c.fillRect(a,b,e-a,f-b);} if(out){c.strokeStyle=out;c.lineWidth=1;c.strokeRect(a+.5,b+.5,e-a-1,f-b-1);} };
  if(k==="plat"){ R2(x-17,y+2,x+17,y+6,"#1a1b1e"); c.fillStyle=dim?"#474d54":"#f2f2ee"; c.beginPath(); c.ellipse(x,y+3,8,3.5,0,0,7); c.fill(); R2(x-16,y-12,x-13,y+2,"#cfd5da"); R2(x+13,y-12,x+16,y+2,"#cfd5da"); R2(x-17,y-14,x-12,y-12,"#1b1c1f"); R2(x+12,y-14,x+17,y-12,"#1b1c1f"); }
  else if(k==="s1"||k==="s2"){ R2(x-10,y+8,x+10,y+11,"#d5dade"); R2(x-9,y-12,x-7,y+8,"#cfd5da"); R2(x+7,y-12,x+9,y+8,"#cfd5da"); R2(x-11,y-13,x+11,y-11,k==="s1"?"#141517":"#b9c4cc"); R2(x-2,y-11,x+2,y-3,"#141517"); R2(x-1.5,y-3,x+1.5,y+2,"#bfe0ea"); }
  else if(k==="screen"){ R2(x-10,y-12,x+10,y+8,"#8d9298"); R2(x-8,y-10,x+8,y+6,"#f2f2f0"); R2(x-6,y+9,x+6,y+12,"#111"); }
  else if(k==="cont"){ c.fillStyle=dim?"#474d54":"#c79a62"; c.beginPath(); c.moveTo(x-9,y-10); c.lineTo(x+9,y-10); c.lineTo(x+9,y); c.arc(x,y,9,0,Math.PI); c.closePath(); c.fill(); c.strokeStyle="#141517"; c.lineWidth=2; c.stroke(); }
  else if(k==="bottle"){ R2(x-6,y-6,x+6,y+12,"#f296c4"); R2(x-3,y-11,x+3,y-6,"#f4f4f2"); }
  else if(k==="board"){ R2(x-14,y-10,x+14,y+10,"#ecece9","#111"); R2(x-9,y-2,x+5,y+3,"#2346e0"); R2(x+8,y-9,x+12,y-5,"#2f9a4a"); R2(x+8,y+4,x+12,y+8,"#9aa0a6"); }
  else if(k==="bank"){ R2(x-7,y-12,x+7,y+12,"#1c1d20","#3a3c42"); R2(x-1,y-14,x+1,y-12,"#d9d1bf"); }
}
function drawTray(){
  const c=trayCtx, t=d(); c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[]; let y=6; const wd=TRW-12;
  for(const k of ORDER){
    const out=trayOut(k), sel=B.carry&&B.carry.k==="new"&&B.carry.id===k;
    c.fillStyle=out?"#171a1e":"#1f242b"; c.fillRect(6,y,wd,TRAY_ROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TRAY_ROW-5);
    trayIcon(c,k,28,y+(TRAY_ROW-4)/2,out);
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=out?"#868e96":"#e8eef2"; c.fillText(t.trayItems[k],52,y+15);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a"; c.fillText(out?t.trayOut:t.trayTake,52,y+31);
    trayCells.push([k,y,y+TRAY_ROW-4]); y+=TRAY_ROW;
  }
  c.font='10.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(B.carry){ cancelCarry(); drawTray(); } });
trayCv.addEventListener("pointerdown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; B.trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=B.carry&&B.carry.k==="new"&&B.carry.id===k; cancelCarry();
    if(!same&&!trayOut(k)){ B.carry={k:"new",id:k}; say("picked",d().trayItems[k]); }
    drawTray(); return; } });

/* ══════════════════════════════════════════════════════════════
   7.  HANDS ON THE BENCH
   ══════════════════════════════════════════════════════════════ */
let msg={k:null,a:[],t:0};
function say(k,...a){ msg={k,a,t:performance.now()}; renderStatus(); }
let UNDO=[];
function act(){ UNDO.push(structuredClone(ST)); if(UNDO.length>80) UNDO.shift(); }
function undo(){ const s=UNDO.pop(); if(!s) return; for(const k in s) ST[k]=s[k]; B.carry=null; scrKey=""; lcdSig=""; patKey=""; drawTray(); renderStatus(); }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const LIVE=/^(plat|prot|h_s[12]|cont|paper|screen|board|bank|bottle|kL|kR|ak|cknob|lkey|pL|pU|sL|sU)$/;
const MOVABLE=/^(plat|h_s[12]|cont|screen|board|bank|bottle)$/;
const idPart=t=>t.startsWith("h_")?t.slice(2):t;
function fits(k,x,z,except){
  const [hx,hz]=FOOT[k];
  if(x-hx<DESK[0]+1||x+hx>DESK[1]-1||z-hz<DESK[2]+1||z+hz>DESK[3]-1) return false;
  for(const o of ORDER){ if(o===k||o===except||!ST.on[o]||o===ST.holder||(o==="cont"&&ST.contOn)) continue;
    const [ox,oz]=ST.pos[o], [gx,gz]=FOOT[o];
    if(Math.abs(x-ox)<hx+gx+0.4&&Math.abs(z-oz)<hz+gz+0.4) return false; }
  return true;
}
const overProt=(w,id)=>ST.on.plat&&(id==="prot"||(id&&/^(h_s[12]|cont|paper)$/.test(id)&&ST.contOn)||Math.hypot(w[0]-P_()[0],w[2]-P_()[1])<R_PO);
function startCarry(t,drag){
  act(); const k=idPart(t);
  if(k===ST.holder){ ST.holder=null; ST.on[k]=false; B.carry={k:"move",id:k,drag}; }
  else if(k==="cont"&&ST.contOn){ if(ST.holder){ act(); UNDO.pop(); say("contFirst"); return; } ST.contOn=false; ST.on.cont=false; B.carry={k:"move",id:k,drag}; }
  else if(k==="bottle"){ ST.on.bottle=false; B.carry={k:"bottle",id:"bottle",drag}; say("bottle"); drawTray(); return; }
  else { ST.on[k]=false; B.carry={k:"move",id:k,drag,from:ST.pos[k].slice()}; }
  say("picked",d().trayItems[k]); drawTray();
}
function placeCarry(p){
  const cr=B.carry, id=pick3(p[0],p[1])||"", w=deskPt(p), t=d().m;
  if(cr.k==="plug"){
    const ok=cr.w==="L"?"sL":"sU", bad=cr.w==="L"?"sU":"sL";
    if(id===ok){ act(); ST.plug[cr.w]=true; B.carry=null; say("plugged",d().term[cr.w==="L"?"laserSock":"usbSock"]); return; }
    if(id===bad){ say("wrong"); return; }
    act(); ST.rest[cr.w]=[w[0],w[2]]; B.carry=null; say("plugDown"); return;
  }
  if(cr.k==="bottle"){
    const onCont=id==="cont"||id==="paper"||(ST.contOn&&overProt(w,id))||(ST.on.cont&&!ST.contOn&&Math.hypot(w[0]-ST.pos.cont[0],w[2]-ST.pos.cont[1])<4.5);
    if(onCont){ if(ST.paper){ say("paperFirst"); return; } if(ST.contOn&&ST.holder){ say("fillFirst"); return; }
      act(); ST.filled=true; say("fill"); return; }
    if(!fits("bottle",w[0],w[2])){ say("noFit"); return; }
    ST.pos.bottle=[w[0],w[2]]; ST.on.bottle=true; B.carry=null; say("placed",d().trayItems.bottle); drawTray(); return;
  }
  const k=cr.id;
  if((k==="s1"||k==="s2"||k==="cont")&&overProt(w,id)){
    if(k==="cont"){ if(ST.holder){ say("contFirst"); return; } if(ST.contOn){ say("busy"); return; }
      act(); ST.contOn=true; ST.on.cont=true; B.carry=null; say("contOn"); drawTray(); return; }
    if(ST.holder){ say("busy"); return; }
    act(); ST.holder=k; ST.on[k]=true; B.carry=null; say(ST.contOn&&ST.filled?"immersed":"holderOn",d().trayItems[k]); drawTray(); return;
  }
  if(!fits(k,w[0],w[2])){ if(cr.drag&&cr.from){ ST.pos[k]=cr.from; ST.on[k]=true; B.carry=null; drawTray(); } say("noFit"); return; }
  if(cr.k==="new") act();
  ST.pos[k]=[w[0],w[2]]; ST.on[k]=true; B.carry=null; say("placed",d().trayItems[k]); drawTray();
}
function cancelCarry(){
  const cr=B.carry; if(!cr) return; B.carry=null;
  if(cr.k==="move"&&cr.from){ ST.pos[cr.id]=cr.from; ST.on[cr.id]=true; }
  else if(cr.k==="move"||cr.k==="bottle") returnPart(cr.id,true);
  drawTray();
}
function returnPart(k,silent){
  if(k==="plat"){ if(ST.holder){ ST.on[ST.holder]=false; ST.holder=null; } if(ST.contOn){ ST.on.cont=false; ST.contOn=false; } ST.plug.L=false; ST.rest.L=null; }
  if(k==="board"){ ST.plug.L=false; ST.plug.U=false; ST.laserOn=false; }
  if(k==="bank"){ ST.plug.U=false; ST.rest.U=null; }
  if(k===ST.holder) ST.holder=null;
  if(k==="cont"){ ST.contOn=false; ST.filled=false; ST.paper=true; }
  ST.on[k]=false; if(!silent) say("back",d().trayItems[k]); drawTray();
}
function clickControl(t){
  if(t==="lkey"){ act(); if(!powered()){ say("noPower"); return true; } ST.laserOn=!ST.laserOn; say("onoff",ST.laserOn); return true; }
  if(t==="paper"){ act(); ST.paper=false; say("peeled"); return true; }
  if(t==="pL"||t==="pU"){ act(); const w=t[1]; ST.plug[w]=false; B.carry={k:"plug",w}; say("plug",d().term[w==="L"?"laserPlug":"usbPlug"]); return true; }
  return false;
}
/* knobs: wheel steps, or a drag up and down */
const KNOBS={kL:{k:"laserH",step:0.1,fine:0.02,px:0.02,min:H_MIN,max:H_MAX},kR:{k:"lensH",step:0.25,fine:0.05,px:0.05,min:H_MIN,max:H_MAX},
             ak:{k:"prot",step:0.25,fine:0.05,px:0.1},cknob:{k:"cur",step:0.5,fine:0.1,px:0.05,min:4,max:25}};
function turnKnob(id,dv){ const K_=KNOBS[id]; let v=ST[K_.k]+dv;
  if(K_.k==="prot") v=((v%360)+360)%360; else v=Math.max(K_.min,Math.min(K_.max,v));
  ST[K_.k]=Math.round(v*1000)/1000; }
const rimAng=p=>{ const w=onPlane(p[0],p[1],PY), [px,pz]=P_(); return Math.atan2(-(w[2]-pz),w[0]-px)*180/Math.PI; };
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  const p=mousePos(e); B.mouse=p; B.mouseW=deskPt(p);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(e.button===1||e.button===2){ B.down={p0:p,last:p,pan:true,btn:e.button,moved:false}; return; }
  if(e.button!==0) return;
  if(B.carry&&!B.carry.drag){ placeCarry(p); return; }
  const t=pick3(p[0],p[1]);
  if(t&&KNOBS[t]){ act(); B.knob={id:t,y:p[1]}; return; }
  if(t==="prot"&&ST.on.plat){ act(); B.rim={a0:rimAng(p),v0:ST.prot}; return; }
  if(t&&clickControl(t)) return;
  if(t&&MOVABLE.test(t)){ B.down={t,p0:p,last:p,moved:false}; return; }
  B.down={p0:p,last:p,pan:e.shiftKey,moved:false};
});
cv.addEventListener("pointermove",e=>{
  const p=mousePos(e), dn=B.down; B.mouse=p; B.mouseW=deskPt(p);
  if(B.knob){ const K_=KNOBS[B.knob.id], dy=B.knob.y-p[1]; if(Math.abs(dy)>=1){ turnKnob(B.knob.id,dy*K_.px*(e.shiftKey?0.2:1)); B.knob.y=p[1]; } return; }
  if(B.rim){ let da=rimAng(p)-B.rim.a0; ST.prot=(((B.rim.v0+da)%360)+360)%360; return; }
  if(!dn){ const t=B.carry?null:pick3(p[0],p[1]); cv.classList.toggle("hand",!!(t&&LIVE.test(t))); return; }
  if(Math.hypot(p[0]-dn.p0[0],p[1]-dn.p0[1])>5) dn.moved=true;
  if(!dn.moved) return;
  if(dn.t){ startCarry(dn.t,true); B.down=null; return; }
  const dx=p[0]-dn.last[0], dy=p[1]-dn.last[1]; dn.last=p;
  CAM.touched=true; CAMTW=null; renderViewBtn();
  if(dn.pan){ CAM.px+=dx; CAM.py+=dy; } else { CAM.yaw+=dx*0.008; CAM.pitch=Math.min(1.5,Math.max(0.02,CAM.pitch+dy*0.006)); }
  cv.classList.add("dragging");
});
cv.addEventListener("pointerup",e=>{
  const p=mousePos(e), dn=B.down; B.down=null; cv.classList.remove("dragging");
  if(B.knob||B.rim){ B.knob=null; B.rim=null; return; }
  if(dn&&dn.btn===2&&!dn.moved){ rclick(p); return; }
  if(dn&&dn.t&&!dn.moved){ startCarry(dn.t,false); return; }
  if(B.carry&&B.carry.drag){ B.carry.drag=false; placeCarry(p); }
});
function rclick(p){
  if(B.carry){ if(B.carry.k==="plug"){ act(); ST.rest[B.carry.w]=[B.mouseW[0],B.mouseW[2]]; B.carry=null; say("plugDown"); return; } cancelCarry(); return; }
  const t=pick3(p[0],p[1]); if(!t) return;
  if(t==="pL"||t==="pU"){ const w=t[1]; if(ST.plug[w]){ act(); ST.plug[w]=false; if(w==="U"||w==="L") ST.laserOn=ST.laserOn&&false; say("unplugged"); } return; }
  if(t==="paper") return;
  if(MOVABLE.test(t)){ act(); returnPart(idPart(t)); }
}
window.addEventListener("pointerup",e=>{ if(B.trayDrag&&B.carry&&e.target===cv) placeCarry(mousePos(e)); B.trayDrag=false; });
window.addEventListener("pointermove",e=>{ if(B.trayDrag&&B.carry){ const r=cv.getBoundingClientRect(), p=[e.clientX-r.left,e.clientY-r.top]; B.mouse=p; B.mouseW=deskPt(p); } });
$("viewBack").onclick=()=>goTo("all");
cv.addEventListener("dblclick",e=>{ const p=mousePos(e), t=pick3(p[0],p[1]); if(B.carry||(t&&LIVE.test(t))) return; goTo("all"); });
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=mousePos(e), t=B.carry?null:pick3(p[0],p[1]), dir=e.deltaY<0?1:-1;
  if(t&&KNOBS[t]){ act(); const K_=KNOBS[t]; turnKnob(t,dir*(e.shiftKey?K_.fine:K_.step)); return; }
  if(t==="prot"){ act(); turnKnob("ak",dir*(e.shiftKey?0.05:0.25)); return; }
  CAM.touched=true; CAMTW=null; renderViewBtn();
  const f=dir>0?1.12:1/1.12, nk=Math.min(220,Math.max(3,CAM.k*f)), r=nk/CAM.k;
  CAM.px=(p[0]-CAM.W/2)-(p[0]-CAM.W/2-CAM.px)*r; CAM.py=(p[1]-CAM.H/2)-(p[1]-CAM.H/2-CAM.py)*r; CAM.k=nk;
},{passive:false});
addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(B.carry) cancelCarry(); else goTo("all"); } });
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.code==="KeyZ"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); undo(); } });

/* ══════════════════════════════════════════════════════════════
   8.  SIDE PANEL, LANGUAGE, MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
function renderViews(){ const box=$("views"); box.innerHTML="";
  for(const [v,lbl] of d().views){ const b=document.createElement("button"); b.textContent=lbl; if(v===VIEW) b.className="on";
    b.disabled=v!=="all"&&!viewOf(v); b.onclick=()=>goTo(v); box.appendChild(b); } }
$("cntUp").onclick=()=>{ ST.cnt++; $("cntLbl").textContent=ST.cnt; };
$("cntDn").onclick=()=>{ ST.cnt=Math.max(0,ST.cnt-1); $("cntLbl").textContent=ST.cnt; };
$("cntReset").onclick=()=>{ ST.cnt=0; $("cntLbl").textContent=ST.cnt; };
try{ const v=localStorage.getItem("ipho2024e2_note"); if(v) $("note").value=v; }catch(e){}
$("note").addEventListener("input",()=>{ try{ localStorage.setItem("ipho2024e2_note",$("note").value); }catch(e){} });
function renderStatus(){
  const L_=[], t=d();
  if(!ORDER.some(k=>ST.on[k])) L_.push([t.st.none,false]);
  else if(ST.on.plat){
    if(!powered()) L_.push([t.st.noPower,false]);
    else if(!ST.plug.L) L_.push([t.st.noLaser,false]);
    else if(!ST.laserOn) L_.push([t.st.off,false]);
    else if(!ST.holder) L_.push([t.st.noHolder,false]);
    else { if(Math.abs(ST.lensH-ST.laserH)>4) L_.push([t.st.lens,false]);
      if(!screenOnBeam()) L_.push([t.st.noScr,false]); }
    if(ST.contOn&&ST.paper) L_.push([t.st.paper,false]);
    else if(ST.contOn&&!ST.filled) L_.push([t.st.dry,false]);
  }
  if(msg.k&&performance.now()-msg.t<9000){ const f=t.m[msg.k]; if(f!==undefined) L_.push(["• "+(typeof f==="function"?f(...msg.a):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L_){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("t-benchcap").textContent=t.benchcap; $("t-tray").textContent=t.tray;
  $("t-h-view").textContent=t.hView; $("t-h-cnt").textContent=t.hCnt; $("cntUp").textContent=t.up; $("cntDn").textContent=t.dn; $("cntReset").textContent=t.reset;
  $("t-cnthint").textContent=t.cntHint; $("t-h-note").textContent=t.hNote; $("note").placeholder=t.notePh;
  $("t-h-how").textContent=t.hHow; $("t-howto").textContent=t.howto;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2024 E2 — 위상 계단에 의한 회절 · HaslaLab":"IPhO 2024 E2 — Diffraction from Phase Steps · HaslaLab";
  drawTray(); renderViews(); renderStatus(); renderViewBtn();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let ui=0;
function tick(){
  if(CW>10) draw();
  if(++ui%10===0){ renderStatus(); renderViews(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
paintStatic(); layout(); applyLang(); requestAnimationFrame(tick);
