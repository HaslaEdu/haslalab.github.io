<meta name="description" content="APhO 2010 실험 1을 브라우저에서 실행합니다. 사인파 발생기로 황동 리드를 흔들고 레이저 반사 빛점의 진폭으로 공명 진동수와 Q를 구한 뒤, 자석 사이 거리에 따른 공명 진동수 변화로 블랙박스 속 두 자석의 위치와 깊이를 찾습니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }

const PARTS=["track","gen","cld","reed","screen","slider","box","bnc","dc"];

  else if(ST.mnt.slider){ const z=zTip()-ST.zc+TRUE.r0; s+=S2(z,0.02); }
  return TRUE.K0*s/SN(); }

  if(tab==="tip") TPV.z=Math.max(30,Math.min(900,tipMap().z*f)); else if(tab==="box") BXV.z=Math.max(15,Math.min(300,(BXV.z||CLH/12.5)*f)); else SCV.z=Math.max(12,Math.min(300,screenMap().z*f)); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const r2=v=>Math.round(v*100)/100;
function setF(f){ if(!ST.pwr){ say("genOff"); return; } ST.f=Math.max(0,Math.min(99.99,r2(f))); }
for(const [id,df] of [["fm1",-1],["fm01",-0.1],["fm001",-0.05],["fp001",0.05],["fp01",0.1],["fp1",1]]) $(id).onclick=()=>setF(ST.f+df);
$("fDisp").addEventListener("wheel",e=>{ e.preventDefault(); const fast=Math.abs(e.deltaY)>60; setF(ST.f+(e.deltaY<0?1:-1)*(fast?0.5:0.05)); },{passive:false});
$("resetBtn").onclick=()=>{ if(ST.pwr){ ST.f=0; say("reset"); } };
$("pwrBtn").onclick=()=>{ if(!onBench("gen")){ say("needGen"); return; } ST.pwr=!ST.pwr; if(!ST.pwr) ST.f=0; say(ST.pwr?"pwrOn":"pwrOff"); };
$("am").onclick=()=>{ ST.amp=Math.max(0,ST.amp-1); }; $("ap").onclick=()=>{ ST.amp=Math.min(10,ST.amp+1); };
$("aimU").onclick=()=>{ ST.aim=r2(ST.aim+0.1); }; $("aimD").onclick=()=>{ ST.aim=r2(ST.aim-0.1); };
$("coverBtn").onclick=()=>{ if(!ST.mnt.reed){ say("needReed"); return; } if(!ST.cover){ say("coverGone"); return; } ST.cover=false; say("coverOff"); };
function setDz(v){ if(!ST.mnt.reed){ say("needReed"); return; } ST.dz=Math.max(-2.5,Math.min(1.5,Math.round(v*100)/100)); if(touching()) say("touch"); }
$("hm1").onclick=()=>setDz(ST.dz-0.1); $("hm01").onclick=()=>setDz(ST.dz-0.01); $("hp01").onclick=()=>setDz(ST.dz+0.01); $("hp1").onclick=()=>setDz(ST.dz+0.1);
function setZc(v){ if(!ST.mnt.slider){ say("needSlider"); return; } if(ST.mnt.box){ say("boxSlider"); return; } ST.zc=Math.max(0.3,Math.min(10.5,Math.round(v*100)/100)); if(touching()) say("touch"); }
$("zm1").onclick=()=>setZc(ST.zc-1); $("zm01").onclick=()=>setZc(ST.zc-0.1); $("zp01").onclick=()=>setZc(ST.zc+0.1); $("zp1").onclick=()=>setZc(ST.zc+1);
function setY(v){ if(!ST.mnt.box){ say("needBox"); return; } ST.y=Math.max(0,Math.min(7.5,Math.round(v*100)/100)); }
$("ym1").onclick=()=>setY(ST.y-1); $("ym01").onclick=()=>setY(ST.y-0.1); $("ym005").onclick=()=>setY(ST.y-0.05); $("yp005").onclick=()=>setY(ST.y+0.05); $("yp01").onclick=()=>setY(ST.y+0.1); $("yp1").onclick=()=>setY(ST.y+1);
$("noteBtn").onclick=()=>{ const n=$("note"), s="f = "+ST.f.toFixed(2)+" Hz   "+d().lab.aNote+" ";
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d(); $("fDisp").textContent=ST.pwr?ST.f.toFixed(2)+" Hz":"--.-- Hz"; $("aDisp").textContent=t.ampl+" "+ST.amp+" / 10";
  $("pwrBtn").textContent=ST.pwr?t.pwrOff:t.pwrOn; $("coverBtn").disabled=!ST.cover; $("coverBtn").textContent=ST.cover?t.cover:t.coverGone; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.mnt.reed&&ST.cover&&ST.pwr&&ST.wire.bnc) L.push([t.st.cover,true]);
  if(beamOn()&&ST.mnt.reed&&!beamHits()) L.push([t.st.miss,false]);
  if(touching()) L.push([t.st.touch,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-gen","hGen"],["resetBtn","reset"],["genHint","genHint"],["t-h-las","hLas"],["aimU","aimU"],["aimD","aimD"],["t-h-reed","hReed"],["reedHint","reedHint"],["t-h-sl","hSl"],["slHint","slHint"],["t-h-st","hSt"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
</body>
