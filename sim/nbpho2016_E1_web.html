<meta property="og:site_name" content="HaslaLab">

<meta property="og:title" content="NBPhO 2016 실험 — 사탕 포장지 · Candy Wrapper · HaslaLab">
<meta property="og:description" content="NBPhO 2016 실험: 연필 사이 틈의 레이저 회절로 사탕 포장지 두께 재기.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* NBPhO 2016 problem 5 "Candy wrapper" (Eero Uustalu) on the 3-D bench.  The wrapper is wound A times round
   both ends of one hexagonal pencil and the other pencil is pressed onto it with rubber bands, so the
   pencils leave a slit of width A·d between them (plus what the rough pencil surfaces add, a few tens of
   µm that differ every time the pencils are put together).  A 532 nm laser shines through the slit and
   the screen shows the single-slit pattern I ∝ sinc²(π w y / λL), drawn with the eye's response so the
   faint orders show.  The laser's height is set with sheets of paper under it (0.1 mm each); a beam
   that misses the slit shows nothing.  The official answer is d ≈ 25 µm (±4.5 µm from the roughness). */
var PROGRAM = {
  title: { ko: 'NBPhO 2016 실험 5 — 사탕 포장지', en: 'NBPhO 2016 Problem 5 — Candy wrapper' },
  subtitle: { ko: '사탕 포장지의 두께 d 를 재고 불확도를 어림하세요. 장비: 사탕, 육각 연필 두 자루, 고무줄, 녹색 레이저(λ = 532 nm), 줄자, 스크린, 스탠드.',
              en: 'Measure the thickness d of the candy wrapper and estimate the uncertainty. Equipment: a candy, two hexagonal pencils, rubber bands, a green laser (λ = 532 nm), a measuring tape, a screen and a stand.' },
  notes: { ko: [
    '연필 한 자루의 양 끝에 포장지를 A 겹 감고 다른 연필을 고무줄로 눌러 붙이면 두 연필 사이에 너비 A·d 의 틈이 생깁니다. 레이저를 틈에 비추면 스크린에 단일 슬릿 회절 무늬가 생깁니다.',
    '연필 표면이 거칠어 틈은 A·d 에 수십 µm 쯤 더해지거나 빠지고, 연필을 다시 조립할 때마다 달라집니다 — 겹 수를 늘릴수록 그 영향이 작아집니다.',
    '무늬는 sinc² 세기를 눈이 느끼는 밝기로 그려 희미한 차수까지 보입니다. 가운데 극대는 두 배 넓습니다.',
    '레이저 높이는 밑에 종이를 몇 장 까는지로 맞춥니다(한 장 0.1 mm). 빛이 틈을 벗어나면 무늬가 없습니다. <b>레이저를 눈에 비추지 마세요.</b>',
    '공식 해답: d ≈ 25 µm, 연필 거칠기에서 오는 불확도 ≈ 4.5 µm.'], en: [
    'Wind the wrapper A times round both ends of one pencil and press the other pencil onto it with rubber bands: the pencils leave a slit of width A·d. A laser through the slit throws a single-slit pattern on the screen.',
    'The pencils\' rough surfaces add or take away a few tens of µm, differently each time they are put together — more turns make that matter less.',
    'The pattern is the sinc² intensity drawn as the eye sees it, so the faint orders show. The central maximum is twice as wide.',
    'The laser\'s height is set by how many sheets of paper lie under it (0.1 mm each). A beam that misses the slit shows nothing. <b>Never point the laser at anyone\'s eyes.</b>',
    'Official answer: d ≈ 25 µm, with ≈ 4.5 µm uncertainty from the pencils\' roughness.'] }
};

var LAB = { A: 8, rough: null, sheets: 40, Lx: 70, on: true };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드에 물린 연필 한 쌍(사이에 포장지를 감은 틈), 그 뒤 종이 더미 위의 녹색 레이저, 앞쪽의 스크린(모눈 종이), 빛줄기를 따라 놓인 줄자, 사탕.',
           en: 'On the desk: the pair of pencils held in a stand (the slit wound with wrapper between them), the green laser behind them on a stack of paper, the screen in front (graph paper on it), a measuring tape along the beam, and the candy.' },
  howto: { ko: ['연필: 휠을 굴려 포장지 겹 수 A 바꾸기 (다시 감고 조립 — 거칠기 몫도 새로 정해짐) · 클릭: 가까이 보기',
                '레이저: 가까이 본 뒤 클릭으로 켜고 끄기 · 휠로 밑에 까는 종이 5장씩 (Shift+휠: 1장씩) — 빛이 틈을 지나도록',
                '스크린: 빛줄기를 따라 끌어서 옮기기 · 클릭해서 무늬와 모눈(1 mm) 가까이 보기 (휠로 더 확대)',
                '줄자: 0 은 연필 틈에 있습니다. 클릭하면 스크린 받침이 있는 곳을 내려다봅니다'],
           en: ['Pencils: roll the wheel to change the number of turns A (rewound and reassembled — the roughness changes too) · click: look closer',
                'Laser: look closer, then click to switch it on or off · the wheel adds or takes 5 sheets of paper (Shift+wheel: one) — so the beam goes through the slit',
                'Screen: drag it along the beam · click to look closely at the pattern and the 1 mm grid (wheel to zoom further)',
                'Tape: its 0 is at the slit. Click it to look down at where the screen\'s foot stands'] },
  notePlaceholder: { ko: '예) A = 12, L = 70.0 cm, 극소 N = 21개 사이 a = 2.4 cm → d = Nλ L/(A a)', en: 'e.g. A = 12, L = 70.0 cm, N = 21 minima over a = 2.4 cm → d = Nλ L/(A a)' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var d = 25e-6 * (1 + S.sys('d', 0.05)), lam = 532e-9, HB = 14.0, LX0 = -22;     /* beam height (cm) at the slit; the laser's x */
    var tape0 = S.sys('tape0', 0.15);                                                   /* cm: the tape's 0 against the slit */
    var gap0 = HB + S.sys('gapH', 0.12);                                                /* the slit's height with no paper: sheets needed */
    function rewind() { LAB.rough = HL.gauss(32e-6); }
    if (LAB.rough === null) rewind();
    var PX = 80, SW = 16, SH = 22;                                                      /* screen: px per cm, size cm */
    var scr = document.createElement('canvas'); scr.width = SW * PX; scr.height = SH * PX;
    var key = '', SCR_Y0 = HB - SH / 2 + 2;                                             /* the screen's bottom edge height */
    function paint() {
      var w = Math.max(5e-6, LAB.A * d + LAB.rough), beamY = LAB.laserY, L = (LAB.Lx - 0) / 100;
      var hit = Math.exp(-2 * Math.pow((beamY - gap0) / 0.075, 2));                       /* the beam (≈1.5 mm) against the slit */
      var k2 = [LAB.A, LAB.rough, LAB.Lx.toFixed(2), beamY.toFixed(3), LAB.on].join('|'); if (k2 === key) return; key = k2;
      var g = scr.getContext('2d'); g.fillStyle = '#f7f6f0'; g.fillRect(0, 0, scr.width, scr.height);
      for (var i = 0; i <= SW * 10; i++) { g.fillStyle = i % 10 === 0 ? 'rgba(60,110,170,.42)' : i % 5 === 0 ? 'rgba(80,130,190,.26)' : 'rgba(110,150,200,.14)';
        g.fillRect(i * PX / 10 - (i % 10 === 0 ? 1 : 0.5), 0, i % 10 === 0 ? 2 : 1, scr.height); }
      for (i = 0; i <= SH * 10; i++) { g.fillStyle = i % 10 === 0 ? 'rgba(60,110,170,.42)' : i % 5 === 0 ? 'rgba(80,130,190,.26)' : 'rgba(110,150,200,.14)';
        g.fillRect(0, i * PX / 10 - (i % 10 === 0 ? 1 : 0.5), scr.width, i % 10 === 0 ? 2 : 1); }
      g.fillStyle = 'rgba(40,70,120,.8)'; g.font = '600 ' + Math.round(PX * 0.3) + 'px sans-serif';
      for (i = 0; i <= SH; i += 2) g.fillText(String(i), 3, scr.height - i * PX - 3);
      if (!LAB.on || hit < 1e-3) return;
      /* the pattern: a column ≈ 2 mm wide at the beam's x, spread vertically; centre at the beam's height */
      var cy = (SCR_Y0 + SH - beamY) * PX, colW = 0.09 * PX, cx = (SW / 2 + 0.37) * PX;
      var img = g.getImageData(0, 0, scr.width, scr.height), D = img.data;
      for (var y = 0; y < scr.height; y++) {
        var yy = (cy - y) / PX / 100, u = Math.PI * w * yy / (lam * L), I = u === 0 ? 1 : Math.pow(Math.sin(u) / u, 2);
        var b = Math.min(1, Math.pow(I * hit, 0.25) * 1.3);
        for (var x = Math.floor(cx - colW * 1.6); x < cx + colW * 1.6; x++) {
          var f = Math.exp(-Math.pow((x - cx) / colW, 2) * 2) * b; if (f < 0.01) continue;
          var p = (y * scr.width + x) * 4; D[p] = D[p] * (1 - f) + 20 * f; D[p + 1] = D[p + 1] * (1 - f) + 235 * f; D[p + 2] = D[p + 2] * (1 - f) + 50 * f;
        }
      }
      g.putImageData(img, 0, 0);
    }
    var tape = B3.scaleTex(150, { horiz: true, width: 2.5, label: 'cm', bg: '#f2d33c' });
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['pencils', 'laser'],
      home: { yaw: -0.55, pitch: 0.55, k: 6.2, tx: 30, ty: 8, tz: 0 },
      views: {
        pencils: { yaw: -0.25, pitch: 0.12, k: 70, tx: 0, ty: HB, tz: 0, title: { ko: '연필과 틈', en: 'The pencils and the slit' },
                   hint: { ko: '휠: 포장지 겹 수 바꾸기 · Esc: 돌아가기', en: 'Wheel: change the number of turns · Esc: back' } },
        screen: { yaw: -Math.PI / 2, pitch: 0.0, k: 45, tx: 70, ty: HB, tz: 0, title: { ko: '스크린 (모눈 1 mm)', en: 'The screen (1 mm grid)' },
                  hint: { ko: '휠로 더 확대 · 빈 곳 끌기로 옮겨 보기 · Esc: 돌아가기', en: 'Wheel to zoom in · drag empty space to pan · Esc: back' } },
        tape: { yaw: 0, pitch: 1.4, k: 40, tx: 70, ty: 0, tz: 6, title: { ko: '줄자 (스크린 받침)', en: 'The tape (at the screen\'s foot)' } },
        laser: { yaw: 0.25, pitch: 0.12, k: 45, tx: LX0, ty: HB - 3, tz: 0, title: { ko: '레이저와 종이 더미', en: 'The laser on its paper stack' },
                 hint: { ko: '휠: 종이 장수 · 클릭: 켜고 끄기 · Esc: 돌아가기', en: 'Wheel: sheets of paper · click: on/off · Esc: back' } }
      },
      frame: function (b) {
        B3.desk(-40, 160, -22, 22);
        var near = b.view !== 'screen';                                  /* standing at the screen, what is behind you is not in view */
        if (near) {
        /* the stand with the pencils */
          B3.stand(0, -16, 30, { bw: 7, bd: 9 });
          var hold = B3.clampArm(0, -16, HB + 2.2, 15, { dir: 'z' });
          var wp = b.wheel('pencils'); if (wp) { var nA = Math.max(1, Math.min(30, LAB.A + Math.sign(wp))); if (nA !== LAB.A) { LAB.A = nA; rewind(); b.say('포장지 ' + nA + '겹으로 다시 감았습니다.', 'Rewound with ' + nA + ' turns.'); } }
          var gapCm = (LAB.A * d + LAB.rough) * 100, hexR = 0.42;
          function hexPencil(yc, col) { var pts = []; for (var i = 0; i < 6; i++) { var a = i * Math.PI / 3 + Math.PI / 6; pts.push([Math.cos(a) * hexR, yc + Math.sin(a) * hexR]); }
            B3.prism3('z', -9, 8, pts, col, { id: 'm:pencils' }); }
          var yTop = gap0 + gapCm / 2 + hexR * 0.866, yBot = gap0 - gapCm / 2 - hexR * 0.866;
          hexPencil(yTop, '#d9a521'); hexPencil(yBot, '#3f7d4f');
          /* the wrapper turns at both ends, drawn thicker than they are so they show; rubber bands */
          [-7.5, 6.5].forEach(function (z) { B3.cyl3('z', z, z + 0.9, 0, yBot, hexR + 0.05 + Math.min(0.3, LAB.A * 0.012), '#c0c6cc', { seg: 12, id: 'm:pencils' });
            B3.cyl3('z', z + 1.0, z + 1.3, 0, (yTop + yBot) / 2, hexR * 2.3, '#b13a2e', { seg: 12, caps: false }); });
          /* the laser on its paper stack */
          var wl = b.wheel('laser'); if (wl) LAB.sheets = Math.max(0, Math.min(120, LAB.sheets + Math.sign(wl) * (Math.abs(wl) < 1 ? 1 : 5)));
          var stackH = LAB.sheets * 0.01, body = 1.1;
          LAB.laserY = gap0 - 0.6 + stackH;                                                           /* 60 sheets put it on the slit */
          B3.box3(LX0 - 6, LX0 + 2, 0, LAB.laserY - body - 0.4 - stackH, -3, 3, '#6b5a43', { id: 'm:laser', top: '#7a6850' });
          if (stackH > 0) B3.box3(LX0 - 5.5, LX0 + 1.5, LAB.laserY - body - 0.4 - stackH, LAB.laserY - body - 0.4, -2.6, 2.6, '#f4f2ea', { id: 'm:laser' });
          B3.cyl3('x', LX0 - 5, LX0 + 1, LAB.laserY, 0, body, '#1e2a22', { id: 'm:laser', seg: 18, cap: '#2a3a2e' });
          B3.cyl3('x', LX0 + 1, LX0 + 1.3, LAB.laserY, 0, 0.35, LAB.on ? '#6dff7a' : '#444', { seg: 12 });
          if (b.clicked('m:laser') && b.view === 'laser') LAB.on = !LAB.on;
          if (LAB.on) {
            var through = Math.exp(-2 * Math.pow((LAB.laserY - gap0) / 0.075, 2));
            B3.line3([LX0 + 1.3, LAB.laserY, 0], [-hexR, LAB.laserY, 0], 'rgba(90,255,120,.75)', 1.6);
            if (through > 0.02) B3.line3([hexR, LAB.laserY, 0], [LAB.Lx - 0.3, LAB.laserY, 0], 'rgba(90,255,120,' + (0.6 * through).toFixed(2) + ')', 1.4);
            else B3.sphere3([-hexR - 0.02, LAB.laserY, 0], 0.12, '#8dff9c');
          }
        }
        /* the screen on its foot, moved along the beam */
        var ms = b.moved('screen'); if (ms[0]) LAB.Lx = Math.max(20, Math.min(150, LAB.Lx + ms[0]));
        var X = LAB.Lx;
        B3.box3(X, X + 4, 0, 1.2, -6, 6, '#3b3f45', { id: 'm:screen', top: '#474c55' });
        B3.box3(X + 0.3, X + 0.9, 1.2, SCR_Y0 + SH + 0.3, -SW / 2 - 0.3, SW / 2 + 0.3, '#5c6670', { id: 'm:screen' });
        paint();
        B3.tex3(scr, 0, 0, scr.width, scr.height, [X - 0.01, SCR_Y0 + SH, -SW / 2], [0, 0, SW], [0, -SH, 0], { id: 'm:screen' });
        /* the tape along the beam, its 0 at the slit */
        B3.tex3(tape, 0, 0, tape.width, tape.height, [-1 - tape0, 0.02, 4.5], [152, 0, 0], [0, 0, 2.5], { id: 'm:tape' });
        /* the candy, unwrapped */
        if (near) B3.sphere3([12, 1.1, 14], 1.1, '#c2442f');
        var V = b.views; V.screen.tx = X; V.tape.tx = X; V.pencils.ty = gap0; V.laser.ty = LAB.laserY - 2;
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
