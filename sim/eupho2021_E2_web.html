<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}

body{margin:0;background:#1e1e1e;color:var(--fg);

<script>
/* EuPhO 2021 E2 "Hot Cylinder" — browser build of the official console program
   "rod" (E2_hot_cylinder_win.exe / _linux / _osx).

   The 2021 sources were not published, so the 1-D heat solver is written from
   the problem statement and the hidden material constants are the values the
   official solution extracts: c = 115 J/(kg K), k = 400 W/(m K),
   alpha = 2.90 W/(m^2 K), beta = 0.30.  Checks: 300 W to steady state gives a
   Simpson average of about 660 C (official 662), and 1500 J in a short burst
   gives about 55 C (official 55.4). */

var C_SPEC = 115.0, K_COND = 400.0, ALPHA = 2.90, BETA = 0.30;
var L_ROD = 0.30, R_ROD = 0.01, L_HEAT = 0.03, MASS = 0.460;
var T0_C = 26.9, T0_K = 300.0, SIGMA = 5.67e-8;
var AREA = Math.PI * R_ROD * R_ROD, PERIM = 2 * Math.PI * R_ROD;
var RHO = MASS / (AREA * L_ROD);
var NX = 41, DX = L_ROD / (NX - 1);
var POS_SIGMA = 1.0e-3, TEMP_SIGMA = 0.2;
var T04 = T0_K * T0_K * T0_K * T0_K;

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function simulate(power, heatDur, tStart, tEnd, dtOut, sensors, snap) {
  var nx = NX, dx = DX, t0k = T0_K, t04 = T04;
  var rhoC = RHO * C_SPEC, k = K_COND, alpha = ALPHA, bs = BETA * SIGMA;
  var perimOverArea = PERIM / AREA, invDx2 = 1 / (dx * dx), invHalfDx = 1 / (0.5 * dx);
  var dt = Math.min(0.4 * dx * dx / (k / rhoC), 0.05);

  var T = new Float64Array(nx), Tn = new Float64Array(nx), i;
  for (i = 0; i < nx; i++) T[i] = t0k;
  var nHeat = 0;
  while (nHeat < nx && nHeat * dx <= L_HEAT + 1e-12) nHeat++;
  var qVol = nHeat ? power / (AREA * (nHeat - 0.5) * dx) / rhoC : 0;
  var idx = sensors.map(function (x) {
    return Math.min(nx - 1, Math.max(0, Math.round(x / dx)));
  });

  var out = [], t = 0, next = tStart, guard = 0;
  while (t < tEnd - 1e-12 && guard++ < 4000000) {
    var step = dt < tEnd - t ? dt : tEnd - t;
    var heating = t < heatDur;
    for (i = 0; i < nx; i++) {
      var Ti = T[i], lap;
      if (i === 0) lap = 2 * (T[1] - Ti) * invDx2;
      else if (i === nx - 1) lap = 2 * (T[nx - 2] - Ti) * invDx2;
      else lap = (T[i + 1] - 2 * Ti + T[i - 1]) * invDx2;
      var flux = alpha * (Ti - t0k) + bs * (Ti * Ti * Ti * Ti - t04);
      var d = (k * lap - perimOverArea * flux) / rhoC;
      if (heating && i < nHeat) d += qVol;
      if (i === 0 || i === nx - 1) d -= flux * invHalfDx / rhoC;
      Tn[i] = Ti + d * step;
    }
    var sw = T; T = Tn; Tn = sw;
    t += step;
    if (snap && t >= snap.next - 1e-9) { snap.frames.push([t, Array.prototype.slice.call(T)]); snap.next += snap.every; }
    while (next <= t + 1e-9 && next <= tEnd) {
      var row = [next];
      for (i = 0; i < idx.length; i++) {
        row.push(T[idx[i]] - t0k + T0_C + gauss(TEMP_SIGMA));
      }
      out.push(row);
      next += dtOut;
    }
  }
  return out;
}

function pad(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }


/* Simulation mode: the same simulate() and sensor errors.  The rod is drawn with its temperature as
   colour along it (a snapshot of the whole rod every few seconds, interpolated), the heater coil over
   the first 3 cm and the sensors where they were clipped on; below, the sensor readings against time. */
function parseSensors(txt) {
  var raw = txt.split(/\s+/).filter(Boolean);
  if (raw.length > 5) return 'At most five sensors are available.';
  var xs = raw.map(parseFloat);
  if (xs.some(isNaN)) return 'Invalid input, please enter numbers separated by spaces.';
  if (xs.some(function (x) { return x < 0 || x > 30; })) return 'Sensor locations must be between 0 and 30 cm.';
  return xs;
}
function heatCol(T) {
  var f = Math.max(0, Math.min(1, (T - T0_C) / 700));
  var stops = [[0, [60, 64, 70]], [0.12, [120, 70, 60]], [0.35, [190, 40, 20]], [0.6, [240, 110, 20]], [0.85, [255, 200, 70]], [1, [255, 250, 210]]];
  for (var i = 1; i < stops.length; i++) if (f <= stops[i][0]) {
    var a = stops[i - 1], b = stops[i], u = (f - a[0]) / (b[0] - a[0]);
    return 'rgb(' + [0, 1, 2].map(function (k) { return Math.round(a[1][k] + (b[1][k] - a[1][k]) * u); }).join(',') + ')';
  }
  return 'rgb(255,250,210)';
}
var SENS_COL = ['#4ec9b0', '#ffd479', '#9cdcfe', '#ff8fb1', '#c3a6ff'];
