<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EuPhO 2021 E2 — Hot Cylinder</title>
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* EuPhO 2021 E2 "Hot Cylinder" — browser build of the official console program
   "rod" (E2_hot_cylinder_win.exe / _linux / _osx).

   The 2021 sources were not published, so the 1-D heat solver is written from
   the problem statement and the hidden material constants are the values the
   official solution extracts: c = 115 J/(kg K), k = 400 W/(m K),
   alpha = 2.90 W/(m^2 K), beta = 0.30.  Checks: 300 W to steady state gives a
   Simpson average of about 660 C (official 662), and 1500 J in a short burst
   gives about 55 C (official 55.4). */

var C_SPEC = 115.0, K_COND = 400.0, ALPHA = 2.90, BETA = 0.30;
var L_ROD = 0.30, R_ROD = 0.01, L_HEAT = 0.03, MASS = 0.460;
var T0_C = 26.9, T0_K = 300.0, SIGMA = 5.67e-8;
var AREA = Math.PI * R_ROD * R_ROD, PERIM = 2 * Math.PI * R_ROD;
var RHO = MASS / (AREA * L_ROD);
var NX = 41, DX = L_ROD / (NX - 1);
var POS_SIGMA = 1.0e-3, TEMP_SIGMA = 0.2;
var T04 = T0_K * T0_K * T0_K * T0_K;

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function simulate(power, heatDur, tStart, tEnd, dtOut, sensors) {
  var nx = NX, dx = DX, t0k = T0_K, t04 = T04;
  var rhoC = RHO * C_SPEC, k = K_COND, alpha = ALPHA, bs = BETA * SIGMA;
  var perimOverArea = PERIM / AREA, invDx2 = 1 / (dx * dx), invHalfDx = 1 / (0.5 * dx);
  var dt = Math.min(0.4 * dx * dx / (k / rhoC), 0.05);

  var T = new Float64Array(nx), Tn = new Float64Array(nx), i;
  for (i = 0; i < nx; i++) T[i] = t0k;
  var nHeat = 0;
  while (nHeat < nx && nHeat * dx <= L_HEAT + 1e-12) nHeat++;
  var qVol = nHeat ? power / (AREA * (nHeat - 0.5) * dx) / rhoC : 0;
  var idx = sensors.map(function (x) {
    return Math.min(nx - 1, Math.max(0, Math.round(x / dx)));
  });

  var out = [], t = 0, next = tStart, guard = 0;
  while (t < tEnd - 1e-12 && guard++ < 4000000) {
    var step = dt < tEnd - t ? dt : tEnd - t;
    var heating = t < heatDur;
    for (i = 0; i < nx; i++) {
      var Ti = T[i], lap;
      if (i === 0) lap = 2 * (T[1] - Ti) * invDx2;
      else if (i === nx - 1) lap = 2 * (T[nx - 2] - Ti) * invDx2;
      else lap = (T[i + 1] - 2 * Ti + T[i - 1]) * invDx2;
      var flux = alpha * (Ti - t0k) + bs * (Ti * Ti * Ti * Ti - t04);
      var d = (k * lap - perimOverArea * flux) / rhoC;
      if (heating && i < nHeat) d += qVol;
      if (i === 0 || i === nx - 1) d -= flux * invHalfDx / rhoC;
      Tn[i] = Ti + d * step;
    }
    var sw = T; T = Tn; Tn = sw;
    t += step;
    while (next <= t + 1e-9 && next <= tEnd) {
      var row = [next];
      for (i = 0; i < idx.length; i++) {
        row.push(T[idx[i]] - t0k + T0_C + gauss(TEMP_SIGMA));
      }
      out.push(row);
      next += dtOut;
    }
  }
  return out;
}

var PROGRAM = {
  title: 'EuPhO 2021 E2 — Hot Cylinder',
  subtitle: '주최측이 배포한 것은 콘솔 실행 파일뿐입니다. 이 페이지는 그 프로그램("rod")을 브라우저에서 그대로 돌리는 판입니다.',
  notes: [
    '공식 바이너리는 <code>EuPhO-2021/official/official_binaries/{Windows,Linux,OSX}/</code>에 있습니다. 이 페이지는 그것과 같은 프롬프트 순서·범위·출력 형식을 씁니다.',
    '주어진 값: L = 30 cm, r = 1 cm, m = 460 g, T&#8320; = 26.9 &deg;C = 300 K, 가열부는 0 &le; x &le; 3 cm, &sigma; = 5.67&times;10<sup>-8</sup> W/(m&sup2;K&#8308;).',
    '숨은 값은 공식 해답이 뽑아낸 값에 맞췄습니다 — c = 115 J/(kg K), k = 400 W/(m K), &alpha; = 2.90 W/(m&sup2;K), &beta; = 0.30.',
    '대조: 300 W 정상상태의 Simpson 평균이 약 660 &deg;C (공식 662), 1500 J 짧은 가열 뒤 약 55 &deg;C (공식 55.4).',
    'P &le; 300 W, 시간 &le; 3600 s, dt는 5 s의 배수, 센서는 최대 5개. 센서 위치와 온도 읽기 모두 조금씩 흔들립니다.'
  ],
  run: async function (term) {
    term.writeln('EuPhO 2021 - Experiment 2: Hot Cylinder');
    term.writeln('L = 30 cm, r = 1 cm, m = 460 g, T0 = 26.9 C, heater over 0..3 cm.');
    term.writeln('');

    async function askNum(prompt, lo, hi, mult) {
      for (;;) {
        var raw = (await term.ask(prompt + ' ')).trim();
        if (raw.toLowerCase() === 'restart') return null;
        var v = parseFloat(raw);
        if (raw === '' || isNaN(v)) { term.writeln('Invalid input, please enter a number.'); continue; }
        if (!(v >= lo && v <= hi)) {
          term.writeln('Value out of range, must be between ' + lo + ' and ' + hi + '.');
          continue;
        }
        if (mult && Math.abs(v / mult - Math.round(v / mult)) > 1e-9) {
          term.writeln('Value must be a multiple of ' + mult + ' s.');
          continue;
        }
        return v;
      }
    }

    for (;;) {
      var power = await askNum('Enter P (W), between 0 and 300:', 0, 300);
      if (power === null) continue;
      var dur = await askNum('Enter heating duration (s), between 0 and 3600s:', 0, 3600);
      if (dur === null) continue;

      var t0, t1;
      for (;;) {
        var parts = (await term.ask('Enter the starting and finishing time for the measurements (s), separated by a space. Must be between 0 and 3600s: ')).split(/\s+/).filter(Boolean);
        if (parts.length !== 2) { term.writeln('Please enter exactly two numbers separated by a space.'); continue; }
        t0 = parseFloat(parts[0]); t1 = parseFloat(parts[1]);
        if (isNaN(t0) || isNaN(t1)) { term.writeln('Invalid input, please enter two numbers.'); continue; }
        if (!(t0 >= 0 && t1 <= 3600)) { term.writeln('Times must be between 0 and 3600 s.'); continue; }
        if (t1 < t0) { term.writeln('The finishing time must not be before the starting time.'); continue; }
        break;
      }

      var dtOut = await askNum('Enter dt (s), between 5 and 3600s and a multiple of 5s:', 5, 3600, 5);
      if (dtOut === null) continue;

      var xs;
      for (;;) {
        var raw = (await term.ask('Enter up to 5 locations for the sensors (in cm), between L=0 and L=30cm, separated by spaces: ')).split(/\s+/).filter(Boolean);
        if (raw.length > 5) { term.writeln('At most five sensors are available.'); continue; }
        xs = raw.map(parseFloat);
        if (xs.some(isNaN)) { term.writeln('Invalid input, please enter numbers separated by spaces.'); continue; }
        if (xs.some(function (x) { return x < 0 || x > 30; })) {
          term.writeln('Sensor locations must be between 0 and 30 cm.'); continue;
        }
        break;
      }

      var fname = (await term.ask('Enter the output file name: ')).trim() || 'rod';
      var go = (await term.ask('Press return to start the experiment, or type "restart": ')).trim();
      if (go.toLowerCase() === 'restart') continue;

      var real = xs.map(function (x) {
        return Math.min(L_ROD, Math.max(0, x * 0.01 + gauss(POS_SIGMA)));
      });

      var head = '  t(s)  ';
      for (var i = 0; i < xs.length; i++) head += '   T' + (i + 1) + '(C)  ';
      term.writeln('');
      term.writeln('Experiment: P = ' + power + ' W for ' + dur + ' s; measurements from ' +
                   t0 + ' s to ' + t1 + ' s every ' + dtOut + ' s.');
      term.writeln('Sensors at ' + xs.join(' cm, ') + ' cm.');
      term.writeln('');
      term.writeln(head);
      await term.yieldFrame();

      var rows = simulate(power, dur, t0, t1, dtOut, real);
      for (i = 0; i < rows.length; i++) {
        var line = pad(rows[i][0].toFixed(1), 7) + ' ';
        for (var j = 1; j < rows[i].length; j++) line += pad(rows[i][j].toFixed(2), 9) + ' ';
        term.writeln(line);
        if (i % 20 === 0) await term.yieldFrame();
      }
      term.writeln('');
      term.writeln('(the original also writes these readings to ' + fname + '.txt)');
      term.writeln('');
    }
  }
};

function pad(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }

</script>
<script>
/* Console emulator for the olympiad programs whose originals are command-line
   executables.  A program module defines a global PROGRAM:

     PROGRAM = { title, subtitle, notes: [...], run: async function (term) {...} }

   and drives the screen through term.write / term.writeln / term.ask, so the
   prompts and the streamed output land on screen exactly as the original
   executable prints them. */
(function () {
  var screen, ps, inp, pending = null, history = [], hpos = 0;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var term = {
    write: function (s) {
      screen.insertAdjacentHTML('beforeend', esc(s));
      screen.scrollTop = screen.scrollHeight;
    },
    writeln: function (s) { term.write((s === undefined ? '' : s) + '\n'); },
    echo: function (s) {
      screen.insertAdjacentHTML('beforeend', '<span class="in">' + esc(s) + '</span>\n');
      screen.scrollTop = screen.scrollHeight;
    },
    clear: function () { screen.innerHTML = ''; },
    /* write the prompt, then wait for a line; the typed text is echoed after it,
       which is what a terminal shows */
    ask: function (prompt) {
      term.write(prompt === undefined ? '' : prompt);
      ps.textContent = prompt === undefined ? '' : prompt;
      inp.focus();
      return new Promise(function (resolve) { pending = resolve; });
    },
    /* let the browser paint between long computations */
    yieldFrame: function () {
      return new Promise(function (r) { setTimeout(r, 0); });
    }
  };

  function submit() {
    if (!pending) return;
    var v = inp.value;
    inp.value = '';
    if (v !== '') { history.push(v); hpos = history.length; }
    term.echo(v);
    ps.textContent = '';
    var done = pending;
    pending = null;
    done(v);
  }

  window.addEventListener('DOMContentLoaded', function () {
    document.title = PROGRAM.title;

    var head = document.createElement('header');
    head.innerHTML =
      '<h1>' + esc(PROGRAM.title) + '</h1>' +
      (PROGRAM.subtitle ? '<p>' + esc(PROGRAM.subtitle) + '</p>' : '') +
      (PROGRAM.notes && PROGRAM.notes.length
        ? '<details><summary>이 프로그램에 대하여</summary><ul>' +
          PROGRAM.notes.map(function (n) { return '<li>' + n + '</li>'; }).join('') +
          '</ul></details>'
        : '');
    document.body.appendChild(head);

    screen = document.createElement('div');
    screen.id = 'screen';
    document.body.appendChild(screen);

    var bar = document.createElement('div');
    bar.id = 'bar';
    ps = document.createElement('span');
    ps.id = 'ps';
    inp = document.createElement('input');
    inp.id = 'inp';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    bar.appendChild(ps);
    bar.appendChild(inp);
    document.body.appendChild(bar);

    var tools = document.createElement('div');
    tools.id = 'tools';
    var bRestart = document.createElement('button');
    bRestart.textContent = '다시 시작 (Ctrl+C)';
    var bCopy = document.createElement('button');
    bCopy.textContent = '화면 복사';
    var bSave = document.createElement('button');
    bSave.textContent = '.txt로 저장';
    tools.appendChild(bRestart);
    tools.appendChild(bCopy);
    tools.appendChild(bSave);
    document.body.appendChild(tools);

    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { submit(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') {
        if (hpos > 0) { hpos--; inp.value = history[hpos]; }
        e.preventDefault();
      } else if (e.key === 'ArrowDown') {
        if (hpos < history.length - 1) { hpos++; inp.value = history[hpos]; }
        else { hpos = history.length; inp.value = ''; }
        e.preventDefault();
      } else if (e.key === 'c' && e.ctrlKey) {
        start();
      }
    });
    screen.addEventListener('click', function () {
      if (!window.getSelection().toString()) inp.focus();
    });

    bRestart.addEventListener('click', start);
    bCopy.addEventListener('click', function () {
      navigator.clipboard.writeText(screen.textContent).then(function () {
        bCopy.textContent = '복사됨';
        setTimeout(function () { bCopy.textContent = '화면 복사'; }, 1200);
      }, function () {});
    });
    bSave.addEventListener('click', function () {
      var blob = new Blob([screen.textContent], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = PROGRAM.title.replace(/[^\w.-]+/g, '_') + '.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    function start() {
      pending = null;
      ps.textContent = '';
      inp.value = '';
      term.clear();
      inp.focus();
      Promise.resolve(PROGRAM.run(term)).catch(function (err) {
        term.writeln('\n[' + err.message + ']');
      });
    }
    start();
  });
})();

</script>
  <script src="adfit.js"></script>
</body>
