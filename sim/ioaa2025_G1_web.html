  el.querySelector(".x").onclick = e => { e.stopPropagation(); el.remove(); delete OS.open[k]; if (k === "suite") LAP.quick = null; osTaskbar(); };
  const bar = el.querySelector(".wt"); bar.ondblclick = () => el.querySelector(".mx").onclick({stopPropagation(){}});
  bar.onmousedown = e => { if (e.target.closest("button") || st.max) return; const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    const mv = ev => { const nx = Math.max(-200, ox + ev.clientX - sx), ny = Math.max(0, oy + ev.clientY - sy); el.style.left = nx + "px"; el.style.top = ny + "px"; st.pos = [nx, ny, el.offsetWidth, el.offsetHeight]; };
    const up = () => { removeEventListener("mousemove", mv); removeEventListener("mouseup", up); }; addEventListener("mousemove", mv); addEventListener("mouseup", up); };
  osFocus(k); osRender(k); }
function osFocus(k){ for (const j in OS.open){ const w = OS.open[j]; if (w.el) w.el.classList.toggle("act", j === k); } const w = OS.open[k]; if (w && w.el) w.el.style.zIndex = ++OS.z; }
const osBody = k => OS.open[k] && OS.open[k].el ? OS.open[k].el.querySelector(".wb") : null;
function osTitle(k){ const w = OS.open[k]; if (w && w.el) w.el.querySelector(".tx").textContent = APPS[k].title(); }
function osResized(k){ if (k === "suite") for (const p in PL) PL[p].draw && PL[p].draw(); }
function osRender(k){ if (k === "suite") return lapBuild();
  if (k === "edge" || k === "chrome"){ const b = osBody(k), br = brGet(k); if (b && br){ b.innerHTML = ""; b.appendChild(br.el); } return; } if (k === "explorer") return feRender(); if (k === "notepad") return npRender(); if (k === "calc") return caRender(); }
/* File Explorer: the group folder the suite saves into */
function feRender(){ const b = osBody("explorer"); if (!b) return; const n = Object.keys(LAP.files);
  b.innerHTML = `<div class="fe"><div class="addr">← → ↑ <span>${ol("pc")} › ${ol("docs")} › ${LAP.group || "G07"}</span><button class="b" id="feOpen">${ol("openW")}</button><button class="b" id="feDl">${ol("down")}</button></div>
    <div class="bd"><div class="nav"><div>⭐ Quick access</div><div>💻 ${ol("pc")}</div><div class="on">📁 ${LAP.group || "G07"}</div></div>
    <div class="ls">${n.length ? `<table><tr><th>${ol("name")}</th><th>${ol("type")}</th><th>${ol("size")}</th></tr>` + n.map(f => `<tr class="f${OS.sel === f ? " sel" : ""}" data-f="${f}"><td>📄 ${f}</td><td>${ol("csv")}</td><td>${Math.round(toCSV(f, LAP.files[f]).length / 1024)} KB</td></tr>`).join("") + "</table>" : `<div style="padding:20px;color:#55606b">${ol("empty")}</div>`}</div></div>
    <div class="sb">${ol("items")(n.length)}</div></div>`;
  b.querySelectorAll("tr.f").forEach(r => { r.onclick = () => { OS.sel = r.dataset.f; feRender(); }; r.ondblclick = () => feOpen(r.dataset.f); });
  b.querySelector("#feOpen").onclick = () => OS.sel && feOpen(OS.sel);
  b.querySelector("#feDl").onclick = () => OS.sel && LAP.files[OS.sel] && download(OS.sel, toCSV(OS.sel, LAP.files[OS.sel])); }
function feOpen(f){ if (!LAP.files[f]) return; OS.note = {file:f, text:toCSV(f, LAP.files[f])}; osOpen("notepad"); npRender(); osTitle("notepad"); }
/* Notepad */
function npRender(){ const b = osBody("notepad"); if (!b) return;
  b.innerHTML = `<div class="np"><div class="mn"><span>${ol("file")}</span><span>${ol("edit")}</span><span>${ol("fmt")}</span><span>${ol("view")}</span><span>${ol("help")}</span></div><textarea spellcheck="false"></textarea></div>`;
  const ta = b.querySelector("textarea"); ta.value = OS.note.text; ta.oninput = () => { OS.note.text = ta.value; }; }
/* Calculator */
function caRender(){ const b = osBody("calc"); if (!b) return; const K = ["(", ")", "C", "⌫", "7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "0", ".", "=", "+"];
  b.innerHTML = `<div class="ca"><div class="e" id="caE">${OS.calcExpr}</div><div class="d" id="caD">${OS.calc}</div><div class="k">${K.map(k => `<button class="${k === "=" ? "eq" : /[÷×−+()C⌫]/.test(k) ? "op" : ""}">${k}</button>`).join("")}</div></div>`;
  b.querySelectorAll(".k button").forEach(x => x.onclick = () => caKey(x.textContent)); }
function caKey(k){ let s = OS.calc === "0" || OS.calc === "Error" ? "" : OS.calc;
  if (k === "C"){ OS.calc = "0"; OS.calcExpr = ""; }
  else if (k === "⌫") OS.calc = s.slice(0, -1) || "0";
  else if (k === "="){ try{ const js = s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-"); if (!/^[0-9+\-*/(). ]+$/.test(js)) throw 0; const v = Function("return (" + js + ")")(); OS.calcExpr = s + " ="; OS.calc = String(+v.toPrecision(12)); }catch(e){ OS.calc = "Error"; } }
  else OS.calc = s + k;
  caRender(); }
/* the clock in the corner: the suite's time, 24 July 2025 */
function osTick(){ const c = document.getElementById("osClk"); if (c) c.innerHTML = istString(CLOCK.t).slice(0, 5) + "<br>2025-07-24"; }


/* ==================================================================
   VIEWS, HANDS AND THE LOOP
   ================================================================== */
function layout3(){
  const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1.5), 2), w = cv3.parentElement.clientWidth || 900;
  const h = Math.max(470, Math.min(Math.round(w * 0.64), Math.round(window.innerHeight * 0.8)));
  cv3.style.width = w + "px"; cv3.style.height = h + "px"; cv3.width = Math.round(w * dpr); cv3.height = Math.round(h * dpr);
  const first = !CAM0.k; CAM.W = w; CAM.H = h; CAM.dpr = dpr;
  if (first){ Object.assign(CAM, {k:w / 260, tx:30, ty:20, tz:10, yaw:-0.55, pitch:0.42, px:0, py:0}); camSave(); }
  if (view3 === "laptop") lapBuild(); }
const VIEWS = ["3d", "dial", "incl", "mouth", "laptop"], FLAT = ["dial", "incl", "mouth"];
function showView(v){ view3 = v; for (const k of VIEWS) document.getElementById("vt" + k).className = k === v ? "on" : "";
  document.getElementById("t-cap3").textContent = tr("cap_" + v); lapEl.className = v === "laptop" ? "on" : ""; if (v === "laptop") lapBuild(); panel(); }
for (const k of VIEWS) document.getElementById("vt" + k).onclick = () => showView(k);

/* ---- pointing ------------------------------------------------------------------- */
const setAz = a => { TEL.az = ((a % 360) + 360) % 360; };
const setAlt = a => { TEL.alt = Math.max(-90, Math.min(90, a)); };
/* the tower: a polite reminder when the horn sits in the forbidden sector */
let FLASH = {msg:"", t:0};
function flash(m){ FLASH = {msg:m, t:performance.now()}; }

/* ---- the pointer -------------------------------------------------------------------- */
let down3 = null, m3 = [0, 0];
const p3e = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => e.preventDefault());
cv3.addEventListener("pointerdown", e => { if (view3 === "laptop") return; const p = p3e(e); m3 = p; cv3.setPointerCapture(e.pointerId);
  if (e.button === 1 || e.button === 2){ e.preventDefault(); down3 = {p, moved:false, btn:e.button, flat:FLAT.includes(view3)}; return; }
  if (e.button) return;
  if (view3 === "dial"){ down3 = {p, moved:false, flat:true, id:"dial", a0:TEL.az, ang0:dialAng(p)}; return; }
  if (view3 === "incl"){ down3 = {p, moved:false, flat:true, id:"incl", a0:TEL.alt}; return; }
  if (view3 === "mouth"){ const id = hit2(p), m = vmap("mouth"); down3 = {p, moved:false, flat:true, id, w:m.M(...p), t0:Object.assign({}, TAPE), c0:Object.assign({}, vz("mouth"))}; return; }
  const id = pick3(p[0], p[1]); down3 = {p, id, moved:false, shift:e.shiftKey, az0:TEL.az, alt0:TEL.alt}; });
const dialAng = p => { const m = vmap("dial"), [x, y] = m.M(...p); return Math.atan2(x, y) / D2R; };
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0] - down3.p[0], p[1] - down3.p[1]) > 3) down3.moved = true; if (!down3.moved) return;
  if (down3.btn){ if (down3.flat){ const Z = vz(view3); Z.px += dx; Z.py += dy; } else { CAM.px += dx; CAM.py += dy; } return; }
  if (down3.id === "dial" && view3 === "dial"){ let d = dialAng(p) - down3.ang0; setAz(down3.a0 + d); return; }
  if (down3.id === "incl"){ setAlt(down3.a0 - (p[1] - down3.p[1]) * 0.12 * (e.shiftKey ? 0.1 : 1)); return; }
  if (view3 === "mouth"){ const m = vmap("mouth"), w = m.M(...p), d = [w[0] - down3.w[0], w[1] - down3.w[1]], t0 = down3.t0;
    if (down3.id === "hook"){ TAPE.x0 = t0.x0 + d[0]; TAPE.y0 = t0.y0 + d[1]; }
    else if (down3.id === "case"){ const ca = Math.cos(TAPE.ang), sa = Math.sin(TAPE.ang); TAPE.len = Math.max(3, Math.min(150, t0.len + d[0] * ca + d[1] * sa)); }
    else { const Z = vz("mouth"); Z.px = down3.c0.px + p[0] - down3.p[0]; Z.py = down3.c0.py + p[1] - down3.p[1]; }
    return; }
  if (down3.id === "horn"){ const f = e.shiftKey ? 0.1 : 1; setAz(down3.az0 + (p[0] - down3.p[0]) * 0.35 * f); setAlt(down3.alt0 - (p[1] - down3.p[1]) * 0.3 * f); cv3.classList.add("grabbing"); return; }
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.02, CAM.pitch + dy * 0.006)); }
  cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", () => { cv3.classList.remove("grabbing");
  if (down3 && down3.btn){ const d = down3; down3 = null; if (!d.moved && d.btn === 2 && view3 !== "3d") showView("3d"); return; }
  if (down3 && !down3.moved && !down3.flat){ const id = down3.id;
    if (id === "dial") showView("dial"); else if (id === "incl") showView("incl"); else if (id === "laptop") showView("laptop"); }
  down3 = null; });
cv3.addEventListener("wheel", e => { if (view3 === "laptop") return; e.preventDefault(); const p = p3e(e), s = e.deltaY < 0 ? 1 : -1;
  if (view3 === "dial"){ setAz(TEL.az + s * (e.shiftKey ? 1 : 0.2)); return; }
  if (view3 === "incl"){ setAlt(TEL.alt + s * (e.shiftKey ? 0.01 : 0.05)); return; }
  if (view3 === "mouth"){ const Z = vz("mouth"), f = s > 0 ? 1.15 : 1 / 1.15, nz = Math.max(0.6, Math.min(30, Z.z * f)), r = nz / Z.z, m = vmap("mouth"), ox = m.ox - Z.px, oy = m.oy - Z.py;
    Z.px = (p[0] - ox) - (p[0] - ox - Z.px) * r; Z.py = (p[1] - oy) - (p[1] - oy - Z.py) * r; Z.z = nz; return; }
  if (pick3(p[0], p[1]) === "horn"){ if (e.shiftKey) setAz(TEL.az + s * 0.2); else setAlt(TEL.alt + s * 0.05); return; }
  const f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(60, Math.max(1, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive:false});
window.addEventListener("keydown", e => { if (view3 === "laptop" || /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || "")) return;
  const f = e.shiftKey ? 0.2 : 1; if (e.key === "ArrowLeft"){ setAz(TEL.az - f); e.preventDefault(); } else if (e.key === "ArrowRight"){ setAz(TEL.az + f); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ setAlt(TEL.alt + 0.1 * f); e.preventDefault(); } else if (e.key === "ArrowDown"){ setAlt(TEL.alt - 0.1 * f); e.preventDefault(); } });

/* ---- the panel ---------------------------------------------------------------------- */
document.getElementById("bTurn").onclick = () => { TAPE.ang = TAPE.ang ? 0 : Math.PI / 2; if (view3 !== "mouth") showView("mouth"); };
document.getElementById("bTape").onclick = () => { Object.assign(TAPE, {x0:-36, y0:-26, len:20, ang:0}); };
function panel(){ document.getElementById("clk").textContent = istString(CLOCK.t);
  const w = []; if (FLASH.msg && performance.now() - FLASH.t < 5000) w.push(FLASH.msg); if (LAP.on) w.push(tr("ledOn"));
  const html = w.map(s => '<div class="w">' + s + "</div>").join(""), el = document.getElementById("wwarn"); if (el._h !== html){ el.innerHTML = html; el._h = html; } }
let lastT = performance.now();
function sky2d(c, W, H){ const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#050a16"); g.addColorStop(0.7, "#121b2c"); g.addColorStop(1, "#2a3140"); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = "rgba(255,255,255,0.75)"; for (const [x, y, r] of STARS2D){ c.beginPath(); c.arc(x * W, y * H * 0.55, r, 0, 7); c.fill(); }
  c.fillStyle = "rgba(255,190,120,0.10)"; c.fillRect(0, H * 0.5, W, H * 0.06); }
const STARS2D = Array.from({length:140}, () => [RNG(), RNG(), 0.4 + RNG() * 1.1]);
function draw3(){ const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (view3 === "laptop"){ ctx3.fillStyle = "#0f1216"; ctx3.fillRect(0, 0, CAM.W, CAM.H); return; }
  if (FLAT.includes(view3)){ const W = CAM.W, H = CAM.H; ctx3.save(); ctx3.beginPath(); ctx3.rect(0, 0, W, H); ctx3.clip();
    ({dial:drawDial, incl:drawIncl, mouth:drawMouth})[view3](ctx3, W, H); ctx3.restore(); return; }
  sky2d(ctx3, CAM.W, CAM.H); begin3(); scene3(); render3(ctx3); }
(function loop(){ try { const now = performance.now(), dt = Math.min(0.25, (now - lastT) / 1000); lastT = now; CLOCK.t += dt;
    if (towerHit(TEL.alt, TEL.az) > 0 && (!FLASH.msg || performance.now() - FLASH.t > 6000)) flash(LANG === "ko" ? "기지국 방향(고도 40° 아래, 방위각 0°–40° 또는 240°–360°)을 겨누고 있습니다" : "the horn points towards the mobile tower (below 40°, azimuth 0°–40° or 240°–360°)");
    draw3(); panel(); lapTick(); } catch (err) { console.error(err); } requestAnimationFrame(loop); })();
window.addEventListener("resize", layout3);
function applyLang(){ document.documentElement.lang = LANG;
  document.title = LANG === "ko" ? "IOAA 2025 그룹 경기 — 전파망원경으로 찾는 암흑물질 · HaslaLab" : "IOAA 2025 Group Competition — Dark Matter with a Radio Telescope · HaslaLab";
  document.getElementById("h1").textContent = tr("title"); document.getElementById("sub").textContent = tr("sub"); document.getElementById("t-tray").textContent = tr("tray");
  for (const k of VIEWS) document.getElementById("vt" + k).textContent = tr("vt" + k); document.getElementById("t-cap3").textContent = tr("cap_" + view3);
  document.getElementById("lgCtl").textContent = tr("lgCtl"); document.getElementById("lgClock").textContent = tr("lgClock"); document.getElementById("lgNotes").textContent = tr("lgNotes"); document.getElementById("txNotes").textContent = tr("notes");
  document.getElementById("bTurn").textContent = tr("turnTape"); document.getElementById("bTape").textContent = tr("resetTape");
  document.getElementById("items").innerHTML = [["laptop", LANG === "ko" ? "노트북 (Radio Astronomy Suite)" : "Laptop (Radio Astronomy Suite)"], ["mouth", LANG === "ko" ? "줄자 (혼 입구 재기)" : "Tape measure (horn aperture)"], ["dial", LANG === "ko" ? "방위각 각도기" : "Azimuth protractor"], ["incl", LANG === "ko" ? "디지털 경사계" : "Digital inclinometer"]]
    .map(([v, s]) => `<button data-v="${v}" style="width:100%;text-align:left">${s}</button>`).join("");
  document.querySelectorAll("#items button").forEach(b => b.onclick = () => showView(b.dataset.v));
  document.getElementById("btn-en").className = LANG === "en" ? "on" : ""; document.getElementById("btn-ko").className = LANG === "ko" ? "on" : "";
  lapEl.innerHTML = ""; if (view3 === "laptop") lapBuild(); }
document.getElementById("btn-ko").addEventListener("click", () => { LANG = "ko"; applyLang(); });
document.getElementById("btn-en").addEventListener("click", () => { LANG = "en"; applyLang(); });
layout3(); applyLang(); showView("3d");
