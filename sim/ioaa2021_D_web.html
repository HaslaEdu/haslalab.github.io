      {id: "2.2", mk: "10", ko: "표의 실제 궤도 반지름으로 각 행성이 거주 가능 영역 안에 있는지 YES/NO로 답하고, 정량적인 근거를 보이세요.", en: "With the real orbital radii, say YES or NO for whether each planet is in the habitable zone, with quantitative reasoning."},
      {h: {ko: "3부 (30점) — 외계행성 38개(작업표)로 저질량 외계행성(LME)과 고질량 외계행성(HME)이 다른 성질의 별을 도는지 알아봅니다.", en: "Part 3 (30 points) — with the 38 exoplanets (worksheet), find out whether low-mass (LME) and high-mass exoplanets (HME) orbit stars with different characteristics."}},
      {id: "3.1", mk: "10", ko: "반복 시그마 클리핑: 질량의 평균 μ와 표준편차 σ를 구해 μ + σ보다 무거운 행성을 빼고, 남은 표본으로 두 번 더 되풀이합니다. 마지막 표본이 저질량, 도중에 빠진 것이 고질량입니다. 각 단계의 표본 크기, μ, σ, μ + σ, 뺄 행성 수를 구하세요.", en: "Iterative sigma-clipping: compute the mean μ and standard deviation σ of the masses, exclude planets above μ + σ, then repeat twice more on what remains. The final subsample is low-mass, those excluded are high-mass. Give sample size, μ, σ, μ + σ and the number excluded at each step."},
      {id: "3.2", mk: "5", ko: "가로축에 행성의 목록 번호, 세로축에 질량을 그리고, 세 번의 μ + σ 문턱을 수평선으로 표시하세요.", en: "Plot planet mass against the serial number in the list and mark the three μ + σ thresholds with horizontal lines."},
      {id: "3.3", mk: "10", ko: "두 무리 모항성의 유효 온도에 대해 최솟값, 1사분위수, 중앙값, 3사분위수, 최댓값을 구하세요.", en: "For the host-star temperatures of both groups, compute the minimum, first quartile, median, third quartile and maximum."},
      {id: "3.4", mk: "5", ko: "이 값들로 상자 그림을 그리세요. 저질량·고질량 행성이 도는 별의 온도에 뚜렷한 차이가 보이나요? YES 또는 NO.", en: "Draw boxplots of these numbers. Is there a clear difference in the temperatures of stars orbited by low-mass and high-mass planets? YES or NO."}],
    table: {title: {ko: "작업표 (외계행성 38개)", en: "Worksheet (38 exoplanets)"}, head: ["No.", "Planet", "M (M_J)", "T_eff (K)", "1st", "2nd", "3rd"],
            init: PLANETS.map((p, i) => [String(i + 1), p[0], p[1].toFixed(2), String(p[2]), "", "", ""])},

             ["mu0", {ko: "3.1 전체 μ", en: "3.1 full μ"}], ["s0", {ko: "3.1 전체 σ", en: "3.1 full σ"}], ["mu1", {ko: "3.1 1차 뒤 μ", en: "3.1 μ after 1st"}], ["s1", {ko: "3.1 1차 뒤 σ", en: "3.1 σ after 1st"}],
             ["mu2", {ko: "3.1 2차 뒤 μ", en: "3.1 μ after 2nd"}], ["s2", {ko: "3.1 2차 뒤 σ", en: "3.1 σ after 2nd"}], ["nf", {ko: "3.1 마지막 표본 크기", en: "3.1 final sample size"}],

    key: [["1.1", (L, A) => (L === "ko" ? "D = 1/p = 48.38 pc, M_V = m_V − 5 log D + 5 = 4.207, 보정 등급이 같으니 L⋆ = 10^(−0.4(M_V − M_V⊙)) = 1.759 L⊙; R⋆ = (T⊙/T)² √L = 1.24 R⊙; g = GM/R² → M⋆ = 1.94 M⊙; a = (GMP²/4π²)^(1/3) = 0.0565 au; 깊이 ≈ 2.6% = (R_p/R⋆)² → R_p = 1.296 R_J(공식). 5% 허용."
                                   : "D = 1/p = 48.38 pc, M_V = m_V − 5 log D + 5 = 4.207; with equal bolometric corrections L⋆ = 10^(−0.4(M_V − M_V⊙)) = 1.759 L⊙; R⋆ = (T⊙/T)² √L = 1.24 R⊙; g = GM/R² → M⋆ = 1.94 M⊙; a = (GMP²/4π²)^(1/3) = 0.0565 au; depth ≈ 2.6% = (R_p/R⋆)² → R_p = 1.296 R_J (official). 5% tolerance.")
            + chk(A, "D2.L", L, 1.67, 1.87) + chk(A, "D2.R", L, 1.18, 1.30) + chk(A, "D2.M", L, 1.84, 2.05) + chk(A, "D2.a", L, 0.0537, 0.0594)
            + yours(A, "D2.Rp", L) + (num(A["D2.Rp"]) == null ? "" : ((v) => (v >= 1.23 && v <= 1.36) || (v >= 1.85 && v <= 2.05) ? " ✓" : " ✗")(num(A["D2.Rp"])))],
          ["2.1", (L, A) => (L === "ko" ? "지구 점이 S_eff = 1, T = 5778 K. 가로축은 왼쪽으로 커집니다(2.0 … 0.0), 세로축은 5400–6100 K(100 K 간격). Gorgona: S_eff = L = 1.76, 5980 K; Amacayacu: M_V = 6.04 → L = 0.33, S_eff = 0.33, 5480 K. 허용 ±0.025, ±25 K."
                                   : "Earth's dot is S_eff = 1, T = 5778 K. The horizontal axis increases to the left (2.0 … 0.0) and the vertical one runs 5400–6100 K in 100 K steps. Gorgona: S_eff = L = 1.76 at 5980 K; Amacayacu: M_V = 6.04 → L = 0.33, S_eff = 0.33 at 5480 K. Tolerance ±0.025, ±25 K.")
            + chk(A, "D2.sg", L, 1.70, 1.82) + chk(A, "D2.sa", L, 0.30, 0.355)],
          ["2.2", (L, A) => (L === "ko" ? "모두 NO. 가장 어둡고 먼 Amacayacu조차 1 au에서 0.33인 S_eff가 0.08 au에서는 1/0.08² ≈ 156배인 ≈ 46–51이 되는데, 이 온도대의 S_max는 ≈ 1.1입니다. (모두 계산하면 S_eff ≈ 1786, 1499, 1096, 51, 1374, 5569, 679)"
                                   : "All NO. Even Amacayacu, the faintest star and the widest orbit, has S_eff = 0.33 at 1 au, which at 0.08 au grows by 1/0.08² ≈ 156 to ≈ 46–51, while S_max at these temperatures is ≈ 1.1. (In full: S_eff ≈ 1786, 1499, 1096, 51, 1374, 5569, 679.)")
            + pick(A, "D2.hz", L, "0")],
          ["3.1", (L, A) => (L === "ko" ? "전체 38개: μ = 1.99, σ = 2.55, μ + σ = 4.54, 4개 뺌 → 34개: 1.23, 1.11, 2.34, 5개 → 29개: 0.84, 0.61, 1.45, 5개 → 마지막 24개 (공식 해답은 모표준편차, 표본 표준편차 2.58, 1.13, 0.62도 ✓)"
                                   : "Full 38: μ = 1.99, σ = 2.55, μ + σ = 4.54, exclude 4 → 34: 1.23, 1.11, 2.34, exclude 5 → 29: 0.84, 0.61, 1.45, exclude 5 → final 24 (the official solution uses the population σ; the sample σ 2.58, 1.13, 0.62 is also ✓)")
            + chk(A, "D2.mu0", L, 1.97, 2.01) + chk(A, "D2.s0", L, 2.53, 2.60) + chk(A, "D2.mu1", L, 1.21, 1.25) + chk(A, "D2.s1", L, 1.09, 1.14)
            + chk(A, "D2.mu2", L, 0.82, 0.86) + chk(A, "D2.s2", L, 0.59, 0.63) + chk(A, "D2.nf", L, 24, 24)],
          ["3.2", {ko: "질량은 번호를 따라 커지며 4.54, 2.34, 1.45 M_J에 수평선이 놓입니다(공식 그림).", en: "Masses rise along the list; the horizontal lines sit at 4.54, 2.34 and 1.45 M_J (official plot)."}],
          ["3.3", (L, A) => (L === "ko" ? "LME(24개): 5209, 5574.5, 5932.5, 6181.75, 6460 K; HME(14개): 5548, 5992.5, 6177.0, 6255.0, 6490 K (5% 허용, ✓ 범위는 HaslaLab의 ±40 K)"
                                   : "LME (24): 5209, 5574.5, 5932.5, 6181.75, 6460 K; HME (14): 5548, 5992.5, 6177.0, 6255.0, 6490 K (5% tolerance; the ✓ ranges of ±40 K are HaslaLab's)")
            + yours(A, "D2.lq", L) + pair(A, "D2.lq", 5574.5, 6181.75, 40) + chk(A, "D2.lm", L, 5892, 5973) + yours(A, "D2.hq", L) + pair(A, "D2.hq", 5992.5, 6255, 40) + chk(A, "D2.hm", L, 6137, 6217)],
          ["3.4", (L, A) => (L === "ko" ? "YES — 고질량 행성은 더 뜨거운 별 둘레에 생기는 경향이 있습니다. HME의 5548 K는 바깥값." : "YES — high-mass planets tend to form around hotter stars. HME's 5548 K is an outlier.") + pick(A, "D2.yn", L, "YES")]],
    sol: [["sol_lc.png", {ko: "1.1 통과 깊이 ≈ 2.6%", en: "1.1 Transit depth ≈ 2.6%"}], ["sol_hz.png", {ko: "2.1 눈금을 붙인 그림과 두 행성의 위치", en: "2.1 The labelled chart with both planets"}],
