<script>
/* NBPhO 2007 problem 4 "Coefficient of friction" on the 3-D bench.  The board is hinged on the desk and rests on
   a stand's arm 50 cm away, so tan α = h/50.  1) The brick alone slides once tan α > μ₂ (≈ 0.24).  2) With the
   ball touching the brick from above, the ball's torque about its contact with the board gives
   N = mg sin β/(1 + μ), and the brick slides once tan β > μ₂ / (1 + (m/M)(1 − μ₂μ)/(1 + μ)) — the official
   solution's balance, which gives μ = (m/M + 1 − μ₂ cot β)/(μ₂(cot β + m/M) − 1) ≈ 0.2 (tan β ≈ 0.12).  Each
   try is a little different (static friction scatters). */

  title: { ko: 'NBPhO 2007 실험 4 — 마찰 계수', en: 'NBPhO 2007 Problem 4 — Coefficient of friction' },
  subtitle: { ko: '장비: 나무 벽돌, 공, 판, 자 (벽돌과 공의 질량비가 주어짐). 1) 판과 벽돌 사이의 정지 마찰 계수를 구하세요. 2) 공과 벽돌 사이의 정지 마찰 계수를 구하세요.',
              en: 'Equipment: a wooden brick, a spherical ball, a board and a ruler (the mass ratio of the brick and the ball is provided). 1) Determine the static coefficient of friction between the board and the brick. 2) Determine the static coefficient of friction between the ball and the brick.' },
  notes: { ko: [
    '판은 왼쪽 끝이 책상에 걸쳐 있고, 50 cm 떨어진 스탠드 팔 위에 얹혀 있어 tan α = h/50 (h 는 팔의 높이, 스탠드 막대의 눈금은 책상에서 0).',
    '공식 해답: 1) 벽돌만 올려 미끄러지는 각에서 μ₂ = tan α₁ ≈ 0.24. 2) 공을 벽돌 위쪽(비탈 위)에 닿게 두면 공이 벽돌을 밀어 더 작은 각 tan β ≈ 0.12 에서 미끄러집니다.',
    '공의 판 접점에 대한 돌림힘과 벽돌의 힘 평형에서 μ = (m/M + 1 − μ₂ cot β) / (μ₂(cot β + m/M) − 1) ≈ 0.2. 질량비 m/M 은 책상의 카드에 적혀 있습니다. 정지 마찰은 매번 조금씩 다릅니다.'], en: [
    'The board\'s left end rests on the desk and it lies on a stand\'s arm 50 cm away, so tan α = h/50 (h the arm\'s height; the rod\'s scale starts at the desk).',
    'Official solution: 1) the brick alone slides at μ₂ = tan α₁ ≈ 0.24. 2) With the ball touching the brick from above (uphill), the ball pushes it and it slides at a smaller tan β ≈ 0.12.',
    'The ball\'s torque about its contact with the board and the brick\'s force balance give μ = (m/M + 1 − μ₂ cot β) / (μ₂(cot β + m/M) − 1) ≈ 0.2. The mass ratio m/M is on the card on the desk. Static friction differs a little from try to try.'] }
};

var LAB = { h: 4, s: 42, v: 0, sliding: false, ball: false, thr: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 왼쪽 끝을 책상에 대고 50 cm 떨어진 스탠드 팔에 얹은 판(60 cm), 판 위 나무 벽돌, 옆에 공, 질량비 카드, 판 앞의 자.',
           en: 'On the desk: the board (60 cm) with its left end on the desk, lying on a stand\'s arm 50 cm away, the wooden brick on it, the ball beside it, the mass-ratio card and a ruler in front of the board.' },
  howto: { ko: ['스탠드 팔(집게) 위아래로 끌기: 판 기울이기 · 휠: 미세 조정',
                '벽돌 클릭: 판 위쪽에 다시 올려놓기 · 공 클릭: 벽돌 위쪽에 닿게 올리기 / 내려놓기',
                '스탠드 막대 클릭: 팔 높이 눈금 가까이 보기'],
           en: ['Drag the stand\'s arm (clamp) up or down: tilt the board · wheel: fine',
                'Click the brick: put it back near the top · click the ball: put it on touching the brick from above / take it off',
                'Click the stand\'s rod: read the arm\'s height closely'] },
  notePlaceholder: { ko: '예) 벽돌만: h = 12.0, 11.8, 12.3 cm → tan α₁ = h/50; 공과 함께: h = 6.1, 5.9 cm', en: 'e.g. brick alone: h = 12.0, 11.8, 12.3 cm → tan α₁ = h/50; with the ball: h = 6.1, 5.9 cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var mu2 = 0.24 * (1 + S.sys('mu2', 0.08)), mu = 0.20 * (1 + S.sys('mu', 0.12)), r = 1.25, HX = -30, D = 50, Lb = 62, TH = 1.2, W = 10, R = 2.6;
    var rodScale = B3.scaleTex(40, { width: 1.2, bg: '#f2f2ee', step: 0.1 }), ruler = B3.scaleTex(60, { horiz: true, width: 2.6, bg: '#e9eef2', label: 'cm' });
    var card = (function () { var c = document.createElement('canvas'); c.width = 240; c.height = 140; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#fbfaf3'; g.fillRect(0, 0, 240, 140); g.fillStyle = '#222'; g.font = '700 40px serif'; g.textAlign = 'center'; g.fillText('m/M = 1.25', 120, 70);
      g.font = '22px sans-serif'; g.fillText('m: ball · M: brick', 120, 112); return c; })();
    function newThr() {
      var m2 = mu2 * (1 + HL.gauss(0.04)), m1 = mu * (1 + HL.gauss(0.05));
      LAB.thr = LAB.ball ? m2 / (1 + r * (1 - m2 * m1) / (1 + m1)) : m2;
    }
    newThr();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['clamp'],
      home: { yaw: -0.25, pitch: 0.4, k: 7.2, tx: -2, ty: 14, tz: 0 },
      views: { rod: { yaw: 0, pitch: 0.05, k: 40, tx: HX + D, ty: 6, tz: -8, title: { ko: '스탠드 막대의 눈금', en: 'The rod\'s scale' } },
               ruler: { yaw: 0, pitch: 1.3, k: 26, tx: HX + 25, ty: 0, tz: 8, title: { ko: '판 앞의 자', en: 'The ruler in front of the board' } } },
      frame: function (b) {
        var dc = b.screenMoved('clamp'), wc = b.wheel('clamp');
        if (dc[1] || wc) { LAB.h = Math.max(1.6, Math.min(30, LAB.h - dc[1] / Math.max(0.3, Math.cos(B3.CAM.pitch)) + wc * 0.05)); }
        if (b.clicked('m:brick')) { LAB.s = 42; LAB.v = 0; LAB.sliding = false; newThr(); }
        if (b.clicked('m:ball')) { LAB.ball = !LAB.ball; if (!LAB.sliding) newThr(); }
        var al = Math.atan2(LAB.h, D), ta = LAB.h / D;
        if (!LAB.sliding && LAB.s > 6 && ta > LAB.thr) { LAB.sliding = true; b.say('미끄러집니다!', 'It slides!'); }
        if (LAB.sliding) { var acc = 981 * (Math.sin(al) - 0.8 * mu2 * Math.cos(al)) * (LAB.ball ? 1.4 : 1); LAB.v = Math.max(LAB.v + Math.max(acc, 30) * b.dt, 0); LAB.s -= LAB.v * b.dt;
          if (LAB.s <= 5) { LAB.s = 5; LAB.v = 0; } }
        var u = [Math.cos(al), Math.sin(al), 0], n = [-Math.sin(al), Math.cos(al), 0], H = [HX, 0, 0];
        var at = function (s, up) { return [H[0] + u[0] * s + n[0] * up, H[1] + u[1] * s + n[1] * up, 0]; };
        B3.desk(-40, 40, -18, 20);
        /* the ruler under the board, 0 at the hinge */
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [HX - 0.5, 0.02, 6], [61, 0, 0], [0, 0, 2.6], { id: 'c:ruler' });
        if (b.clicked('c:ruler')) b.go('ruler');
        /* the board, with a stop at its lower end */
        B3.obox(at(Lb / 2, TH / 2), u, n, Lb / 2, TH / 2, W / 2, '#b8915e', { top: '#c9a26c' });
        B3.obox(at(2, TH + 0.6), u, n, 0.8, 0.6, W / 2, '#8a6a42', { top: '#9a7a52' });
        /* the stand: rod behind the board at x = HX + D, arm along z under the board */
        B3.box3(HX + D - 5, HX + D + 5, 0, 1.4, -18, -6, '#3b4048', { top: '#474c55' });
        B3.cyl3('y', 1.4, 40, HX + D, -10, 0.6, '#c3c8cd', { id: 'm:rod', seg: 14, cap: '#dde1e4' });
        B3.tex3(rodScale, 0, 0, rodScale.width, rodScale.height, [HX + D - 0.6, 41, -10 + 0.62], [1.2, 0, 0], [0, -42, 0], { id: 'm:rod' });
        B3.box3(HX + D - 1.2, HX + D + 1.2, LAB.h - 2.0, LAB.h + 0.4, -11.2, -8.8, '#3a3f46', { id: 'm:clamp', top: '#474c55' });
        B3.cyl3('z', -8.8, 6, HX + D, LAB.h - 0.4, 0.4, '#c3c8cd', { id: 'm:clamp', seg: 12, cap: '#dde1e4' });
        /* the brick and the ball */
        var BL = 4, BH = 2.5, BW = 3.5;
        B3.obox(at(LAB.s, TH + BH), u, n, BL, BH, BW, '#a8743c', { id: 'm:brick', top: '#b8844a' });
        if (LAB.ball) B3.sphere3(at(LAB.s + BL + R, TH + R), R, '#9aa3ab', { id: 'm:ball' });
        else B3.sphere3([-12, R, 13], R, '#9aa3ab', { id: 'm:ball' });
        B3.tex3(card, 0, 0, 240, 140, [6, 0.02, 10], [9, 0, 0], [0, 0, 5.2]);
        b.views.rod.ty = LAB.h;
        LAB.state = { h: LAB.h, tan: ta, thr: LAB.thr, s: LAB.s, sliding: LAB.sliding, mu: mu, mu2: mu2 };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
