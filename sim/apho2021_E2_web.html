<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APhO 2021 Experiment 2 — Spatial structure of a sample</title>
<style>
/* The organisers' program is a Unity build; these are its own colours, read
   back out of the screenshots in the official question paper: scene #282828,
   the rail elements #c2c2c2, the side panels #8c8c8c with #282828 readout
   fields, the screen pure black and the photodetector marker yellow.         */
:root{
  --scene:#282828; --metal:#c2c2c2; --panel:#8c8c8c; --field:#282828;
  --btnoff:#696969; --btn:#c1c1c1; --btntext:#2b2b2b; --mark:#e8e838;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--scene);color:#fff;overflow:auto;
     font:bold 14px/1.3 "Liberation Sans",Arial,Helvetica,sans-serif;user-select:none}
#app{position:relative;height:100vh;min-height:720px;min-width:1020px;padding:8px}

.chip{position:absolute;left:10px;top:8px;padding:1px 22px;
      font:11px "Liberation Sans",Arial,sans-serif;background:var(--metal);color:#111;
      border:1px solid #9a9a9a;border-radius:3px;cursor:pointer}
#onoff{position:absolute;left:22px;top:30px;padding:6px 12px;
       font:12px "Liberation Sans",Arial,sans-serif;background:#7d7d7d;color:#e8e8e8;
       border:1px solid #9a9a9a;border-radius:6px;cursor:pointer}
#onoff.on{background:var(--btn);color:var(--btntext)}
#modes{position:absolute;right:14px;top:10px;display:flex;gap:5px}
#modes button{padding:2px 10px;font:11px "Liberation Sans",Arial,sans-serif;
      background:var(--btnoff);color:#c8c8c8;border:1px solid #8a8a8a;border-radius:3px;
      cursor:pointer}
#modes button.on{background:var(--btn);color:var(--btntext)}

/* ------------------------------------------------------------- optical rail */
#rail{position:absolute;left:80px;right:40px;top:78px;height:130px}
#rail .axis{position:absolute;left:0;right:0;top:52px;height:2px;background:#3d3d3d}
/* B — "when the laser is activated, a light trail is shown on the track" */
#trail{position:absolute;top:52px;height:2px;display:none;box-shadow:0 0 6px currentColor;
       background:currentColor}
#trail.on{display:block}
#rail .mount{position:absolute;top:0;bottom:0;width:2px;background:#3d3d3d}
#rail .head{position:absolute;left:0;top:44px;width:52px;height:14px;background:#3d3d3d}
.optic{position:absolute;top:22px;width:78px;height:60px;margin-left:-39px;
       background:var(--metal);color:#1f1f1f;border-radius:2px;
       font:15px "Liberation Sans",Arial,sans-serif;display:flex;align-items:center;
       justify-content:center;cursor:pointer}

/* C / J — the laser head; clicking it drops the wavelength list open */
#laser{position:absolute;left:0;top:64px;width:56px;height:15px;background:var(--metal);
       color:#1f1f1f;font:10px "Liberation Sans",Arial,sans-serif;text-align:center;
       line-height:15px;cursor:pointer}
#laser::after{content:"";position:absolute;right:-11px;top:2px;width:11px;height:11px;
       background:#7c7c7c}
#lams{position:absolute;left:-6px;top:86px;display:none;flex-direction:column;gap:4px}
#lams.open{display:flex}
#lams button{position:relative;width:56px;height:15px;background:var(--metal);color:#1f1f1f;
       border:0;font:10px "Liberation Sans",Arial,sans-serif;cursor:pointer;padding:0}
#lams button::after{content:"";position:absolute;right:-11px;top:2px;width:11px;height:11px;
       background:#7c7c7c}
#lams button.on{background:#f0f0f0}

/* K / L — the screen distance, shown under the screen mount as the app shows it */
#dist{position:absolute;top:96px;display:none;align-items:center;gap:8px;
      transform:translateX(-40px)}
#dist.open{display:flex}
#dist .val{font-size:22px}
#dist button{background:none;border:0;color:#dcdcdc;font-size:26px;line-height:1;
      cursor:pointer;padding:0 4px}
#dist.fixed{opacity:.5}
#dist.fixed button{visibility:hidden;pointer-events:none}
#drag{cursor:ew-resize;font-size:26px;padding:0 6px;color:#dcdcdc}

/* ------------------------------------------------------------------ screen */
/* the screen keeps its square shape and stays inside the window */
#screen{position:absolute;left:80px;top:230px;aspect-ratio:1/1;
        height:min(640px, calc(100vh - 252px));max-width:calc(100% - 300px);
        background:#000;display:block;cursor:crosshair}
#install{position:absolute;left:80px;top:212px;font-size:13px;color:#bdbdbd;display:none}

/* ------------------------------------------------------------- side panels */
#side{position:absolute;right:14px;top:230px;bottom:12px;width:196px;display:flex;
      flex-direction:column;gap:12px;overflow:auto}
.panel{background:var(--panel);color:#1f1f1f;padding:8px 10px;
       font:12px "Liberation Sans",Arial,sans-serif}
.panel .ttl{font-weight:bold;font-size:12px;margin-bottom:5px}
.panel .r{display:flex;align-items:center;gap:6px;margin:4px 0}
.panel .r .k{width:52px;font-size:12px}
.panel .v{flex:1;background:var(--field);color:#f0f0f0;border:0;border-radius:3px;
       height:22px;line-height:22px;text-align:center;
       font:bold 14px Consolas,"Courier New",monospace;letter-spacing:1px}
.panel .u{width:22px;font-size:12px}

/* F — the eight-way pad the app draws as one arrow sprite */
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:6px}
#pad button{height:26px;background:rgba(255,255,255,.22);color:#f2f2f2;border:0;
      font-size:15px;cursor:pointer}
#pad button:hover{background:rgba(255,255,255,.38)}
#pad button.mid{background:rgba(255,255,255,.10);cursor:default}

.panel input.txt{width:100%;background:var(--field);color:#f0f0f0;border:0;border-radius:3px;
      height:22px;text-align:center;font:bold 13px Consolas,monospace}
.panel .btns{display:flex;gap:4px;margin-top:6px}
.panel .btns button{flex:1;height:24px;background:var(--btnoff);color:#e4e4e4;border:0;
      border-radius:3px;font-size:12px;cursor:pointer}
#prof{width:100%;height:96px;background:var(--field);display:block;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <button class="chip" id="back">Back</button>
  <button id="onoff" class="on">On / Off</button>
  <div id="modes">
    <button id="tA">2A</button><button id="tS" class="on">2B&ndash;2E</button>
  </div>

  <div id="rail">
    <div class="axis"></div>
    <div id="trail"></div>
    <div class="head"></div>
    <div id="laser">632.8nm</div>
    <div id="lams"></div>
    <div class="mount" id="mSample"></div>
    <div class="mount" id="mScreen"></div>
    <div class="optic" id="oSample">sample</div>
    <div class="optic" id="oScreen">screen</div>
    <div id="dist">
      <button data-step="L-1">&#8592;</button>
      <span class="val" id="distVal">90.00</span>
      <button data-step="L+1">&#8594;</button>
      <span id="drag" title="drag along the track">&#10231;</span>
    </div>
  </div>

  <div id="install">Installing ...</div>
  <canvas id="screen"></canvas>

  <div id="side">
    <div class="panel" id="pSample">
      <div class="r"><span class="k">x sample</span>
        <span class="v" id="vsx">0</span><span class="u">um</span></div>
      <div class="r"><span class="k">y sample</span>
        <span class="v" id="vsy">0</span><span class="u">um</span></div>
      <div id="pad">
        <button data-nudge="-0.1,0.1">&#8598;</button>
        <button data-nudge="0,0.1">&#8593;</button>
        <button data-nudge="0.1,0.1">&#8599;</button>
        <button data-nudge="-0.1,0">&#8592;</button>
        <button class="mid" disabled>&#9679;</button>
        <button data-nudge="0.1,0">&#8594;</button>
        <button data-nudge="-0.1,-0.1">&#8601;</button>
        <button data-nudge="0,-0.1">&#8595;</button>
        <button data-nudge="0.1,-0.1">&#8600;</button>
      </div>
    </div>

    <div class="panel">
      <div class="ttl">Displacement from screen center</div>
      <div class="r"><span class="k">x</span>
        <span class="v" id="vx">--</span><span class="u">cm</span></div>
      <div class="r"><span class="k">y</span>
        <span class="v" id="vy">--</span><span class="u">cm</span></div>
      <div class="ttl" style="margin-top:8px">Photodetector reading</div>
      <div class="r"><span class="v" id="vv">--</span><span class="u">V</span></div>
    </div>

    <div class="panel">
      <div class="ttl">Scan</div>
      <div class="r"><span class="k">angle &deg;</span>
        <input class="txt" id="ang" value="25"></div>
      <div class="r"><span class="k">step cm</span>
        <input class="txt" id="step" value="0.02"></div>
      <div class="r"><span class="k">points</span>
        <input class="txt" id="npt" value="301"></div>
      <div class="btns"><button id="bScan">scan</button><button id="bCsv">CSV</button></div>
      <canvas id="prof"></canvas>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   APhO 2021 Experiment 2 — exploring the spatial structure of a sample.

   The organisers shipped a Unity program (APhO-2021/official/simulation/); this
   page exists because that program is Windows-only.  The screen follows the
   app's own layout -- the dark bench with the optical rail carrying the laser
   head, the sample mount and the screen mount, the black screen underneath it,
   and the grey side panels holding the sample coordinates with their eight-way
   pad and the photodetector readout -- and it keeps the original's controls and
   precisions: the eight laser lines the app offers, a screen distance you set,
   a photodetector positioned to 0.01 cm and a meter reading to 0.01 V, plus the
   part-A alignment stage in 100 um steps.

   The structure of the sample is hidden; the constants below are this page's
   values.  Answers should be checked against official/APhO_2021_S5.pdf.
--------------------------------------------------------------------------- */
/* The hidden sample is the one the official solution describes, so that
   working through the paper on this page returns the paper's own answers:

     B.3  microsphere diameter          a  = 5.627 um
          close-packed row spacing      d  = sqrt(3) a / 2 = 4.874 um,
          which is what puts the rings at sin(theta) = m lam / d
     C.2  the rectangle                 l  = 58.59 um,  w = 50.78 um
     C.3  its orientation               phi = 27 deg
     D.2  the grid the rectangles sit on
                                        dx = 250 um,  dy = 200 um
                                        (the solution measures 249.3 and 198.2)
     A.1  the double slit is best at    (3700, -2900) um
     A.2  and its fringes are 0.65 cm apart at L = 50 cm, which for the
          632.8 nm source of program 2A means a slit separation of 50 um    */
var A_SPHERE = 5.627e-6;                 /* B.3: the microsphere diameter     */
var L_RECT = 58.59e-6, W_RECT = 50.78e-6;   /* C.2: one rectangle            */
var DX_GRID = 250e-6, DY_GRID = 200e-6;  /* D.2: the grid the rectangles form */
var PHI = 27.0;                          /* C.3: the long side, deg           */
var N_CELLS = 24;      /* grid cells the beam covers; enough that the
                          subsidiary maxima between orders die away and the
                          "4 x 4 fine diffraction bright spots" of D.1 are
                          the only ones a detector finds */
var SLIT_SEP = 50e-6, SLIT_WIDTH = 12e-6;
var SLIT_LAM = 632.8e-9;                 /* program 2A carries one source     */
var BEST_X = 3.7e-3, BEST_Y = -2.9e-3, ALIGN_TOL = 1.4e-3;
var METER_MAX = 10.0;

/* the eight lines the app's laser offers, in nm */
var LINES = [351, 488, 514, 632.8, 694.3, 914, 1152, 1444];

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function sinc2(z) {
  if (Math.abs(z) < 1e-12) return 1;
  var s = Math.sin(z) / z;
  return s * s;
}
function dirichlet(z, N) {
  var den = Math.sin(z);
  if (Math.abs(den) < 1e-9) return 1;
  var r = Math.sin(N * z) / (N * den);
  return r * r;
}

/* Three things are on the screen at once, which is exactly how the paper walks
   through them: the wide crossed fringes of a single rectangle (part C), the
   fine spots of the grid the rectangles are laid out on (part D, which is why
   it asks for an infrared source -- the spots are wider apart), and the ring
   from the close-packed spheres inside every rectangle (part B).  The sphere
   layers point every which way from grain to grain, so the ring is continuous
   and the paper has you average five points around it.                       */
var SPHERE_D = Math.sqrt(3) / 2 * A_SPHERE;   /* the row spacing that diffracts */

function intensitySample(lam, L, x, y) {
  var u = x / L, v = y / L, p = PHI * Math.PI / 180;
  var up = u * Math.cos(p) + v * Math.sin(p);
  var vp = -u * Math.sin(p) + v * Math.cos(p);
  var env = sinc2(Math.PI * L_RECT * up / lam) * sinc2(Math.PI * W_RECT * vp / lam);
  var lat = dirichlet(Math.PI * DX_GRID * up / lam, N_CELLS) *
            dirichlet(Math.PI * DY_GRID * vp / lam, N_CELLS);
  var r = Math.sqrt(u * u + v * v), ring = 0;
  for (var m = 1; m <= 3; m++) {
    var r0 = m * lam / SPHERE_D;
    if (r0 > 0.5) break;
    ring += 1.0 / m * Math.exp(-Math.pow((r - r0) / (0.045 * r0), 2));
  }
  var beam = Math.exp(-Math.pow(r / 0.34, 2));       /* how far the beam reaches */
  return METER_MAX * beam * (env * lat + 0.18 * ring);
}

/* Part A: the double slit.  Off the best position the beam clips it and the
   fringes wash out, which is the cue A.1 asks the competitor to hunt for. */
function intensitySlit(lam, L, x, sx, sy) {
  var u = x / L;
  var off = Math.hypot(sx - BEST_X, sy - BEST_Y);
  var vis = Math.exp(-Math.pow(off / ALIGN_TOL, 2));
  return METER_MAX * vis * sinc2(Math.PI * SLIT_WIDTH * u / lam) *
         Math.pow(Math.cos(Math.PI * SLIT_SEP * u / lam), 2);
}

var S = { mode: 'S', lam: 632.8, L: 90, x: 0, y: 0, sx: 0, sy: 0, scan: [],
          power: true, installing: false };
var $ = function (i) { return document.getElementById(i); };

function lam() { return S.mode === 'A' ? SLIT_LAM : S.lam * 1e-9; }
function dist() { return (S.mode === 'A' ? 50 : S.L) * 1e-2; }
function intensityAt(x, y) {
  return S.mode === 'A'
    ? intensitySlit(lam(), dist(), x * 1e-2, S.sx * 1e-3, S.sy * 1e-3)
    : intensitySample(lam(), dist(), x * 1e-2, y * 1e-2);
}
function meter(x, y) {
  if (!S.power || S.installing) return 0;
  return Math.round(Math.max(0, Math.min(METER_MAX, intensityAt(x, y) + gauss(0.004))) * 100) / 100;
}

/* --------------------------------------------------------------- rendering */
function ctxOf(id, bg) {
  var cv = $(id), r = cv.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dp); cv.height = Math.round(r.height * dp);
  var g = cv.getContext('2d');
  g.setTransform(dp, 0, 0, dp, 0, 0);
  g.fillStyle = bg; g.fillRect(0, 0, r.width, r.height);
  return { g: g, w: r.width, h: r.height };
}

var HALF = 14;   /* cm shown on the screen, each way */

/* the app paints the pattern in the colour of the line in use; the four
   infrared lines leave a grey pattern, since they are invisible */
function rgbBytes(nm) {
  if (nm >= 800) return [190, 190, 190];        /* infrared: no colour to see */
  if (nm < 400) return [150, 90, 255];
  if (nm < 500) return [70, 130, 255];
  if (nm < 560) return [80, 255, 120];
  if (nm < 660) return [255, 60, 50];
  return [200, 40, 35];
}

/* The fine spots of part D are only a couple of millimetres apart on the
   screen, so the pattern is painted pixel by pixel into an offscreen canvas and
   kept until something about the setting changes; only the detector marker is
   redrawn as it moves. */
var patCache = { key: '', cv: null };

function patternKey() {
  return [S.mode, S.mode === 'A' ? 'slit' : S.lam, dist(),
          S.power && !S.installing, S.sx, S.sy].join('|');
}

function renderPattern(w, h) {
  var key = patternKey() + '|' + w + 'x' + h;
  if (patCache.key === key) return patCache.cv;
  var cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  var g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  if (S.power && !S.installing) {
    var img = g.createImageData(w, h), px = img.data;
    var lm = lam(), L = dist(), half = HALF, col = rgbBytes(S.mode === 'A' ? 632.8 : S.lam);
    for (var j = 0; j < h; j++) {
      var yy = (h / 2 - j) / (h / 2) * half;
      for (var i = 0; i < w; i++) {
        var xx = (i - w / 2) / (w / 2) * half;
        var I = S.mode === 'A'
          ? intensitySlit(lm, L, xx * 1e-2, S.sx * 1e-3, S.sy * 1e-3)
          : intensitySample(lm, L, xx * 1e-2, yy * 1e-2);
        var a = Math.min(1, I / 2.2);
        if (a < 0.008) continue;
        var k = 4 * (j * w + i);
        px[k] = col[0] * a; px[k + 1] = col[1] * a; px[k + 2] = col[2] * a;
        px[k + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
  }
  patCache.key = key; patCache.cv = cv;
  return cv;
}

function drawScreen() {
  var c = ctxOf('screen', '#000'), g = c.g;
  var s = Math.min(c.w, c.h) / (2 * HALF);
  var cx = c.w / 2, cy = c.h / 2;
  g.drawImage(renderPattern(Math.round(c.w), Math.round(c.h)), 0, 0, c.w, c.h);
  /* G — the photodetector, the small yellow dot the app draws on the screen */
  g.fillStyle = '#e8e838';
  g.fillRect(cx + S.x * s - 2, cy - S.y * s - 2, 4, 4);
}

function drawProfile() {
  var c = ctxOf('prof', '#282828'), g = c.g;
  var L = 4, R = 4, T = 4, B = 4;
  if (!S.scan.length) return;
  var s0 = S.scan[0][0], s1 = S.scan[S.scan.length - 1][0];
  function X(v) { return L + (v - s0) / (s1 - s0) * (c.w - L - R); }
  function Y(v) { return c.h - B - v / METER_MAX * (c.h - T - B); }
  g.strokeStyle = '#e8e838'; g.lineWidth = 1.2; g.beginPath();
  S.scan.forEach(function (p, i) { i ? g.lineTo(X(p[0]), Y(p[3])) : g.moveTo(X(p[0]), Y(p[3])); });
  g.stroke();
}

function refresh() {
  var off = (!S.power || S.installing);
  $('vv').textContent = off ? '--' : meter(S.x, S.y).toFixed(2);
  $('vx').textContent = off ? '--' : S.x.toFixed(2);
  $('vy').textContent = off ? '--' : S.y.toFixed(2);
  $('vsx').textContent = Math.round(S.sx * 1000);
  $('vsy').textContent = Math.round(S.sy * 1000);
  $('distVal').textContent = (dist() * 100).toFixed(2);
  $('dist').className = (S.mode === 'A' ? 'fixed ' : '') +
                        ($('dist').classList.contains('open') ? 'open' : '');
  $('laser').textContent = S.mode === 'A' ? '632.8nm' : S.lam + 'nm';
  /* the sample only moves in part A; B to E fix it, as their preamble says */
  document.querySelectorAll('#pad button[data-nudge]').forEach(function (b) {
    b.disabled = (S.mode !== 'A');
    b.style.opacity = b.disabled ? 0.4 : 1;
  });
  layoutRail();
  drawScreen();
  drawProfile();
}

/* ---------------------------------------------------------------- the rail */
function layoutRail() {
  var rail = $('rail'), w = rail.clientWidth;
  /* the screen slides along the track between 10 cm and 100 cm from the sample */
  var xs = 0.36 * w;
  var xc = xs + (0.10 + 0.30 * (dist() * 100 - 10) / 90) * w;
  $('mSample').style.left = xs + 'px';
  $('mScreen').style.left = xc + 'px';
  $('oSample').style.left = xs + 'px';
  $('oScreen').style.left = xc + 'px';
  $('dist').style.left = xc + 'px';

  var t = $('trail'), on = S.power && !S.installing;
  t.className = on ? 'on' : '';
  if (on) {
    var col = rgbBytes(S.mode === 'A' ? 632.8 : S.lam);
    t.style.color = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
    t.style.left = '52px';
    t.style.width = Math.max(0, xc - 52) + 'px';
  }
}

(function buildLines() {
  var box = $('lams');
  LINES.forEach(function (nm) {
    var b = document.createElement('button');
    b.textContent = nm + 'nm';
    if (nm === S.lam) b.className = 'on';
    b.addEventListener('click', function () {
      S.lam = nm;
      box.querySelectorAll('button').forEach(function (o) { o.className = ''; });
      b.className = 'on';
      install();
    });
    box.appendChild(b);
  });
})();

$('laser').addEventListener('click', function () {
  /* J: the sources are swapped by picking one off the rack.  Program 2A has a
     single source, so the rack only opens in parts B to E. */
  if (S.mode === 'A') return;
  $('lams').classList.toggle('open');
});
$('oScreen').addEventListener('click', function () {
  $('dist').classList.toggle('open');
});
/* E and F: the sample box opens the coordinate panel */
$('oSample').addEventListener('click', function () {
  var p = $('pSample');
  p.style.display = p.style.display === 'none' ? '' : 'none';
});

/* L: drag the arrow along the track to set the screen distance, 1.0 cm a step,
   10.0 cm to 100.0 cm.  In part A item D fixes the screen at 50 cm. */
(function () {
  var from = null, at = 0;
  $('drag').addEventListener('mousedown', function (e) {
    if (S.mode === 'A') return;
    from = e.clientX; at = S.L; e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) {
    if (from === null) return;
    var w = $('rail').clientWidth || 900;
    S.L = Math.min(100, Math.max(10, Math.round(at + (e.clientX - from) / (w * 0.30) * 90)));
    refresh();
  });
  window.addEventListener('mouseup', function () { from = null; });
})();

/* ------------------------------------------------------------------ inputs */
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button[data-step]') : null;
  if (!b) return;
  var m = b.getAttribute('data-step').match(/^([a-zA-Z]+)([+-][\d.]+)$/);
  var key = m[1], dv = parseFloat(m[2]);
  if (key === 'L' && S.mode === 'A') return;      /* item D: fixed at 50 cm */
  S[key] = Math.round((S[key] + dv) * 1000) / 1000;
  if (key === 'L') S.L = Math.min(100, Math.max(10, S.L));
  refresh();
});

function install(after) {
  S.installing = true;
  $('install').style.display = 'block';
  refresh();
  setTimeout(function () {
    S.installing = false;
    $('install').style.display = 'none';
    if (after) after();
    refresh();
  }, 700);
}

$('onoff').addEventListener('click', function () {
  S.power = !S.power;
  $('onoff').className = S.power ? 'on' : '';
  refresh();
});
$('back').addEventListener('click', function () {
  $('lams').classList.remove('open');
  $('dist').classList.remove('open');
});

/* F — the eight-way pad steps the sample by 100 um, and repeats while held */
document.querySelectorAll('button[data-nudge]').forEach(function (b) {
  var d = b.getAttribute('data-nudge').split(',').map(parseFloat);
  function step() {
    S.sx = Math.round((S.sx + d[0]) * 1000) / 1000;
    S.sy = Math.round((S.sy + d[1]) * 1000) / 1000;
    refresh();
  }
  var hold = null, rep = null;
  b.addEventListener('mousedown', function () {
    step();
    hold = setTimeout(function () { rep = setInterval(step, 90); }, 400);
  });
  ['mouseup', 'mouseleave'].forEach(function (e) {
    b.addEventListener(e, function () { clearTimeout(hold); clearInterval(rep); });
  });
});

/* G — arrow keys finetune the photodetector, as the manual describes */
window.addEventListener('keydown', function (e) {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || '').toUpperCase())) return;
  var d = { ArrowLeft: [-0.01, 0], ArrowRight: [0.01, 0],
            ArrowUp: [0, 0.01], ArrowDown: [0, -0.01] }[e.key];
  if (!d) return;
  S.x = Math.round((S.x + d[0]) * 100) / 100;
  S.y = Math.round((S.y + d[1]) * 100) / 100;
  refresh();
  e.preventDefault();
});

$('screen').addEventListener('click', function (e) {
  var r = this.getBoundingClientRect();
  var s = Math.min(r.width, r.height) / (2 * HALF);
  S.x = Math.round((e.clientX - r.left - r.width / 2) / s * 100) / 100;
  S.y = Math.round((r.height / 2 - (e.clientY - r.top)) / s * 100) / 100;
  refresh();
});

/* part A aligns the double slit; parts B to E look at the sample itself */
['A', 'S'].forEach(function (mode) {
  $('t' + mode).addEventListener('click', function () {
    S.mode = mode;
    $('tA').className = mode === 'A' ? 'on' : '';
    $('tS').className = mode === 'S' ? 'on' : '';
    $('pSample').style.display = mode === 'A' ? '' : 'none';
    $('lams').classList.remove('open');
    refresh();
  });
});
$('pSample').style.display = 'none';   /* click the sample box to open it */

$('bScan').addEventListener('click', function () {
  var n = Math.max(1, Math.min(4001, Math.round(parseFloat($('npt').value))));
  var st = parseFloat($('step').value), a = parseFloat($('ang').value) * Math.PI / 180;
  S.scan = [];
  for (var k = 0; k < n; k++) {
    var d = (k - (n - 1) / 2) * st;
    var x = Math.round((S.x + d * Math.cos(a)) * 100) / 100;
    var y = Math.round((S.y + d * Math.sin(a)) * 100) / 100;
    S.scan.push([Math.round(d * 1000) / 1000, x, y, meter(x, y)]);
  }
  drawProfile();
});

$('bCsv').addEventListener('click', function () {
  if (!S.scan.length) return;
  var txt = 's (cm),x (cm),y (cm),V (V)\n' +
            S.scan.map(function (p) { return p.join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv' }));
  a.download = 'apho2021_e2_scan.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

window.addEventListener('resize', function () { layoutRail(); refresh(); });
layoutRail();
refresh();
</script>

</body>
