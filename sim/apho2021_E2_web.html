<script>
"use strict";
const PAGE={"ko": {"h1": "APhO 2021 실험 2 — 광학적 방법으로 시료의 공간 구조 탐구", "h2": "주최측 프로그램 APHO.exe (Unity) 의 코드와 장면을 그대로 옮긴 것", "note": "APhO 2021 주최측이 배포한 실험 프로그램 <b>APHO.exe</b> (Unity 2019.4) 를 그대로 옮겼습니다. 실행 파일의 스크립트(Assembly-CSharp.dll)를 디컴파일해 빔 처짐 계산(nano_beam_core), 반사 광선 작도, 레이저 떨림(DOTween), 온도 변화, 기록 그래프, 끌기·회전·버튼 동작을 한 줄씩 옮겼고, 네 장면의 배치·색·글꼴·그림은 실행 파일의 장면 데이터에서 그대로 읽어 1024 × 768 창에 원본과 같은 픽셀로 그립니다. 처음 화면에서 <b>COUNTRY</b> 와 <b>NAME</b> 을 넣고 <b>NEXT</b> 를 누르면 1 A–1 D (실험 1), 2 A, 2 B–2 E (실험 2) 를 고를 수 있고, 왼쪽 위 <b>Back</b> 으로 돌아옵니다. 2 A–2 E 의 스크린 사진은 원본 배포본에 빠져 있어(Addressables 번들 dr-351 … dr-1444, dr-488-0 누락) 공식 풀이가 밝힌 시료 — 지름 5.627 µm 미세구의 조밀 배열, 58.6 × 51.0 µm 직사각형(긴 변 27°), 250 × 200 µm 격자, 이중 슬릿 최적 위치 (3700, −2900) µm — 로 원본과 같은 이름·크기(500 × 500 px = ±10 cm)의 그림을 계산해 넣었습니다. 광검출기 값은 원본처럼 그림의 회색값 × 5.5 V 입니다."}, "en": {"h1": "APhO 2021 Experiment 2 — Spatial structure of a sample by optical methods", "h2": "the organisers' APHO.exe (Unity), its code and scenes moved into the browser", "note": "This is the organisers' experiment program <b>APHO.exe</b> (Unity 2019.4) of APhO 2021, moved into the browser. The scripts of the executable (Assembly-CSharp.dll) were decompiled and carried over line for line: the beam deflection code (nano_beam_core), the reflected ray construction, the laser jitter (DOTween), the heater, the recorder and every drag, rotation and button. The layout, colours, fonts and pictures of the four scenes are read straight out of the executable's scene data and drawn into the 1024 × 768 window on the same pixels as the original. Enter <b>COUNTRY</b> and <b>NAME</b> and press <b>NEXT</b> to choose 1 A–1 D (experiment 1), 2 A or 2 B–2 E (experiment 2); <b>Back</b> at the top left returns to the menu. The screen pictures of 2 A–2 E were not in the released package (its Addressables bundles dr-351 … dr-1444 and dr-488-0 are missing), so they are computed from the sample the official solution describes — close-packed 5.627 µm microspheres, 58.6 × 51.0 µm rectangles with the long side at 27°, a 250 × 200 µm grid, a double slit best at (3700, −2900) µm — under the original names and at the original size (500 × 500 px for ±10 cm). The photodetector reads the picture's grey value × 5.5 V, as in the original."}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
function applyLang(){ const d=PAGE[lang]; document.documentElement.lang=lang;
  document.getElementById("t-h1").textContent=d.h1; document.getElementById("t-h2").textContent=d.h2;
  document.getElementById("t-note").innerHTML=d.note;
  document.getElementById("lang-ko").className=lang==="ko"?"on":""; document.getElementById("lang-en").className=lang==="en"?"on":""; }
document.getElementById("lang-ko").onclick=()=>{lang="ko";applyLang();};
document.getElementById("lang-en").onclick=()=>{lang="en";applyLang();};
applyLang();
</script>

/* A small runtime for the uGUI scenes of APHO.exe: rect transforms, canvas
   scaling, images, legacy and TextMeshPro text, the event system, DOTween and
   the Physics2D triggers the app uses.  World space is screen pixels with y up,
   exactly as in Unity. */
'use strict';

const SW = 1024, SH = 768, FIXED_DT = 0.02, MAX_DT = 1 / 3;

/* ------------------------------------------------------------------ maths */
// affine [a, b, c, d, e, f]:  x' = a x + c y + e,  y' = b x + d y + f
function mMul(m, n) {
  return [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
          m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
          m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
}
function mInv(m) {
  const det = m[0] * m[3] - m[1] * m[2];
  return [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det,
          (m[2] * m[5] - m[3] * m[4]) / det, (m[1] * m[4] - m[0] * m[5]) / det];
}
function mApply(m, x, y) { return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]; }
function mTRS(x, y, deg, sx, sy) {
  const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return [c * sx, s * sx, -s * sy, c * sy, x, y];
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const v2 = (x, y) => ({ x, y });
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const norm360 = z => { z %= 360; return z < 0 ? z + 360 : z; };

/* C# number formatting the scripts use */
function fmtFixed(v, n) {                // "0.00", "F2", "f1" ...
  let s = v.toFixed(n);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);   // .NET prints 0.00 for -0.001
  return s;
}
function fmtG(v) {                       // float.ToString() (shortest, 7 digits)
  if (Number.isInteger(v)) return String(v);
  return String(parseFloat(v.toPrecision(7)));
}

/* --------------------------------------------------------------- the world */
const U = {
  time: 0, fixedTime: 0, dt: 0, frame: 0,
  scene: null, persist: [], prefs: {},
  sprites: {}, spriteImg: {}, data: null,
  scripts: {},              // class registry, by C# name
  objects: {},              // id -> GameObject in the loaded scene
  tweens: [], timers: [], nextScene: null,
  input: { keys: new Set(), down: new Set(), up: new Set(), mouse: v2(0, 0), btnHeld: false,
           queue: [], chars: '' },
  es: null,
  log: () => {},
};

class GameObject {
  constructor(d) {
    this.id = d.id; this.name = d.n; this.activeSelf = !!d.a;
    this.tag = { 5: 'MainCamera', 20000: 'laser', 20001: 'color_picker' }[d.tag] || 'Untagged';
    this.parent = null; this.children = []; this.comps = []; this.dontDestroy = false;
    this.rt = new RectTransform(this, d);
  }
  get activeInHierarchy() {
    for (let g = this; g; g = g.parent) if (!g.activeSelf) return false;
    return true;
  }
  SetActive(v) {
    if (this.activeSelf === !!v) return;
    const was = this.activeInHierarchy;
    this.activeSelf = !!v;
    const now = this.activeInHierarchy;
    if (was !== now) this._activeChanged(now);
  }
  _activeChanged(now) {
    for (const c of this.comps) {
      if (now) { if (c.OnEnable) c.OnEnable(); if (!c._started && c.Start && c.enabled) U.pendingStart.push(c); }
      else if (c.OnDisable) c.OnDisable();
    }
    for (const ch of this.children) if (ch.activeSelf) ch._activeChanged(now);
  }
  get(kind) { return this.comps.find(c => c.kind === kind) || null; }
  get transform() { return this.rt; }
  get gameObject() { return this; }
  get position() { return this.rt.position; }
}

class RectTransform {
  constructor(go, d) {
    this.go = go; this.kind = 'RectTransform';
    if (d.rt) {
      this.isRect = true;
      [this.anchorMin, this.anchorMax, this.anchoredPosition, this.sizeDelta, this.pivot] =
        d.rt.map(a => v2(a[0], a[1]));
    } else {
      this.isRect = false;
      this.anchorMin = v2(0.5, 0.5); this.anchorMax = v2(0.5, 0.5);
      this.anchoredPosition = v2(d.tr ? d.tr[0] : 0, d.tr ? d.tr[1] : 0);
      this.sizeDelta = v2(0, 0); this.pivot = v2(0.5, 0.5);
    }
    this.rotZ = d.rz || 0;
    this.localScale = v2(d.sc ? d.sc[0] : 1, d.sc ? d.sc[1] : 1);
    this.canvas = null;     // set when this is the root of a canvas
  }
  get gameObject() { return this.go; }
  get transform() { return this; }
  get parentRT() { return this.go.parent ? this.go.parent.rt : null; }
  get size() {
    if (this.canvas) { const s = this.canvas.scaleFactor(); return v2(SW / s, SH / s); }
    const p = this.parentRT;
    if (!p || !this.isRect) return v2(this.sizeDelta.x, this.sizeDelta.y);
    const ps = p.size;
    return v2(ps.x * (this.anchorMax.x - this.anchorMin.x) + this.sizeDelta.x,
              ps.y * (this.anchorMax.y - this.anchorMin.y) + this.sizeDelta.y);
  }
  get rect() { const s = this.size; return { x: -this.pivot.x * s.x, y: -this.pivot.y * s.y, width: s.x, height: s.y }; }
  localPos() {
    const p = this.parentRT;
    if (!p || !this.isRect) return v2(this.anchoredPosition.x, this.anchoredPosition.y);
    const ps = p.size, pp = p.pivot;
    const ax = -pp.x * ps.x + ps.x * (this.anchorMin.x + (this.anchorMax.x - this.anchorMin.x) * this.pivot.x);
    const ay = -pp.y * ps.y + ps.y * (this.anchorMin.y + (this.anchorMax.y - this.anchorMin.y) * this.pivot.y);
    return v2(ax + this.anchoredPosition.x, ay + this.anchoredPosition.y);
  }
  localMatrix() {
    if (this.canvas) { const s = this.canvas.scaleFactor(); return [s, 0, 0, s, SW / 2, SH / 2]; }
    const lp = this.localPos();
    return mTRS(lp.x, lp.y, this.rotZ, this.localScale.x, this.localScale.y);
  }
  get worldMatrix() {
    const l = this.localMatrix(), p = this.parentRT;
    if (this.canvas) return l;
    return p ? mMul(p.worldMatrix, l) : l;
  }
  get position() { const m = this.worldMatrix; return v2(m[4], m[5]); }
  set position(w) {
    const p = this.parentRT;
    const lp = p ? mApply(mInv(p.worldMatrix), w.x, w.y) : [w.x, w.y];
    const cur = this.localPos();
    this.anchoredPosition = v2(this.anchoredPosition.x + lp[0] - cur.x, this.anchoredPosition.y + lp[1] - cur.y);
  }

function legacyLineW(fam, s, size) { let w = 0; for (const ch of s) w += legacyAdv(fam, ch, size); return w; }

    const words = para.split(/(\s+)/);
    let line = '';
    for (const wd of words) {
      const t = line + wd;
      if (line && wd.trim() && widthOf(t.replace(/\s+$/, '')) > w + 0.01) { out.push(line.replace(/\s+$/, '')); line = wd.replace(/^\s+/, ''); }

}
function legacyMetrics(fam) { return fam === 'Cursed' ? FONTS.Cursed : FONTS.LibSans; }
function legacyLayout(t, W, H, size) {

}
function measureLegacy(t, text) {

}
function drawLegacyText(t, col, L, T, W, H) {
  if (!t.text) return;
  const size = legacySize(t, W, H);
  let { fam, met, lines, lh } = legacyLayout(t, W, H, size);
  const asc = met.asc * size, desc = met.desc * size;
  if (t.vOverflow === 0) {
    const fit = Math.max(1, Math.floor((H - (asc + desc) + 1e-3) / lh) + 1);

  lines.forEach((ln, i) => {
    const lw = legacyLineW(fam, ln, size);

    const y = top + asc + i * lh;

/* TextMeshPro, with the rich text tags the scenes use: <i>, <b>, <size=n> */
function tmpRuns(text, base, style) {
  const runs = []; let i = 0, size = base, ital = !!(style & 2), bold = !!(style & 1);
  const stack = [];
  while (i < text.length) {
    if (text[i] === '<') {
      const j = text.indexOf('>', i);
      if (j > 0) {
        const tag = text.slice(i + 1, j);
        let ok = true;
        if (tag === 'i') ital = true; else if (tag === '/i') ital = !!(style & 2);
        else if (tag === 'b') bold = true; else if (tag === '/b') bold = !!(style & 1);
        else if (tag.startsWith('size=')) { stack.push(size); size = parseFloat(tag.slice(5)); }
        else if (tag === '/size') size = stack.length ? stack.pop() : base;
        else ok = false;
        if (ok) { i = j + 1; continue; }
      }
    }
    const last = runs[runs.length - 1];
    if (last && last.size === size && last.ital === ital && last.bold === bold) last.s += text[i];
    else runs.push({ s: text[i], size, ital, bold });
    i++;
  }
  return runs;
}
function tmpCharAdv(r, ch) { return advOf('tmp', ch) * r.size + (r.bold ? 0.07 * r.size : 0); }
function runWidth(r) { let w = 0; for (const ch of r.s) w += tmpCharAdv(r, ch); return w; }
function runsWidth(rs) { return rs.reduce((a, r) => a + runWidth(r), 0); }
function trimRuns(rs) {      // trailing white space takes no room in the line width
  rs = rs.map(r => ({ ...r }));
  while (rs.length && /\s$/.test(rs[rs.length - 1].s)) {
    const r = rs[rs.length - 1]; r.s = r.s.replace(/\s+$/, ''); if (!r.s) rs.pop();
  }

}
function measureTMP(t, text) {
  const lines = text.split('\n').map(l => trimRuns(tmpRuns(l, t.fontSize, t.fontStyle)));
  return { w: Math.max(0, ...lines.map(runsWidth)) };
}
function drawTMP(t, col, L, T, W, H) {
  if (!t.text) return;
  const mg = t.margin; L += mg[0]; T += mg[1]; W -= mg[0] + mg[2]; H -= mg[1] + mg[3];
  const size = t.fontSize;
  const lines = [];
  for (const raw of t.text.split('\n')) {
    const runs = tmpRuns(raw, size, t.fontStyle);
    if (!t.wrap || runsWidth(trimRuns(runs)) <= W + 0.01 || runs.length !== 1) { lines.push(runs); continue; }
    const r0 = runs[0];
    for (const s of wrapWords(r0.s, W, x => runWidth({ ...r0, s: x }))) lines.push([{ ...r0, s }]);
  }
  const lh = TMP_FACE.line * size, asc = TMP_FACE.asc * size, desc = TMP_FACE.desc * size;
  const blockH = (lines.length - 1) * lh + asc + desc;
  const top = t.vAlign === 256 ? T : t.vAlign === 1024 ? T + H - blockH : T + (H - blockH) / 2;
  G.textBaseline = 'alphabetic'; G.textAlign = 'left';
  G.fillStyle = cssColor(col, col.a); G.strokeStyle = cssColor(col, col.a); G.lineJoin = 'round';
  lines.forEach((runs, i) => {
    const w = runsWidth(trimRuns(runs));
    let x = t.hAlign === 2 ? L + (W - w) / 2 : t.hAlign === 4 ? L + W - w : L;
    const y = top + asc + i * lh;
    for (const r of runs) {
      G.font = fontCss(r.ital ? 'LibSansI' : 'LibSans', r.size);
      G.lineWidth = r.size * 0.022;
      for (const ch of r.s) {
        if (ch !== ' ') { G.fillText(ch, x, y); if (r.bold) G.strokeText(ch, x, y); }
        x += tmpCharAdv(r, ch);
      }
    }
  });
}

/* The screen pictures.  APHO.exe loads them from Addressables bundles ("dr-351",
   "dr-488", ... 182 pictures a wavelength, "dr-488-0" with 1032 for part A) that
   were not shipped with the program, so they are computed here from the sample the
   official solution describes:

     double slit (part A)   fringes 0.65 cm apart at L = 50 cm with 632.8 nm,
                            best position (3700, -2900) um
     microspheres (B)       a = 5.627 um, close packed, rows sqrt(3)/2 a apart
     rectangles (C)         l = 58.6 um, w = 51.0 um, long side at 27 deg
     grid (D)               dx = 250 um, dy = 200 um, along the screen axes

   Each picture is 500 x 500 pixels for the +-10 cm screen; the "-tiff" twin is the
   grey intensity the photodetector reads (grey * 5.5 V). */
'use strict';

const PAT = {
  N: 500, HALF_CM: 10,
  A_SPHERE: 5.627e-6, L_RECT: 58.6e-6, W_RECT: 51.0e-6, PHI: 27,
  DX: 250e-6, DY: 200e-6, BEAM_D: 0.4e-3,
  SLIT_SEP: 48.7e-6, SLIT_W: 10e-6, SLIT_LEN: 100e-6, SLIT_BEAM: 120e-6,
  BEST: [3700, -2900], PART_A_RANGE: 1100,
};

/* wavelength to the colour it is drawn in (Bruton); 351 nm and the infrared
   lines are invisible and leave the colour picture black */
function laserRGB(nm) {
  if (nm < 380 || nm > 780) return [0, 0, 0];
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
  else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
  else r = 1;
  const f = nm > 700 ? 0.3 + 0.7 * (780 - nm) / 80 : nm < 420 ? 0.3 + 0.7 * (nm - 380) / 40 : 1;
  return [r * f, g * f, b * f];
}

const sinc2 = z => { if (Math.abs(z) < 1e-9) return 1; const s = Math.sin(z) / z; return s * s; };

/* intensity of the sample's pattern, peak of the straight-through beam = 1 */
function sampleField(nm, Lcm) {
  const lam = nm * 1e-9, L = Lcm / 100, N = PAT.N, half = PAT.HALF_CM / 100;
  const px = 2 * half / N;
  const p = PAT.PHI * Math.PI / 180, cp = Math.cos(p), sp = Math.sin(p);
  // lattice of spots along the axes: product of two periodic Gaussians
  const sig = 0.42 * lam * L / PAT.BEAM_D;
  const comb = (pitch) => {
    const per = lam * L / pitch, a = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const x = -half + (i + 0.5) * px;
      const k = Math.round(x / per), dx = x - k * per;
      // two neighbours are enough: the spots are far narrower than their spacing
      a[i] = Math.exp(-dx * dx / (2 * sig * sig)) + Math.exp(-((Math.abs(dx) - per) ** 2) / (2 * sig * sig));
    }
    return a;
  };
  const fx = comb(PAT.DX), fy = comb(PAT.DY);
  const dRow = Math.sqrt(3) / 2 * PAT.A_SPHERE;
  const rings = [];
  for (let m = 1; m <= 3; m++) {
    const s = m * lam / dRow; if (s >= 0.95) break;
    rings.push({ r: L * Math.tan(Math.asin(s)), w: 0.02 * L * Math.tan(Math.asin(s)) + 0.0004, a: 1.2e-3 / (m * m) });
  }
  const out = new Float32Array(N * N);
  const beamW = 0.25 * lam * L / PAT.BEAM_D;
  for (let j = 0; j < N; j++) {
    const y = half - (j + 0.5) * px;           // row 0 is the top of the screen
    for (let i = 0; i < N; i++) {
      const x = -half + (i + 0.5) * px;
      const u = x / L, v = y / L;
      const up = u * cp + v * sp, vp = -u * sp + v * cp;
      const env = sinc2(Math.PI * PAT.L_RECT * up / lam) * sinc2(Math.PI * PAT.W_RECT * vp / lam);
      let I = env * fx[i] * fy[j] * 0.35;
      const r = Math.hypot(x, y);
      for (const rg of rings) I += rg.a * Math.exp(-(((r - rg.r) / rg.w) ** 2));
      I += Math.exp(-(r * r) / (2 * beamW * beamW));    // the straight-through beam
      out[j * N + i] = I;
    }
  }
  return out;
}

/* part A: the double slit, lit by a narrow beam that misses it when off target */
function slitField(rxUm, ryUm) {
  const lam = 632.8e-9, L = 0.5, N = PAT.N, half = PAT.HALF_CM / 100, px = 2 * half / N;
  const dx = (rxUm - 0) * 1e-6, dy = (ryUm - 0) * 1e-6;
  const hit = Math.exp(-2 * (dx * dx + dy * dy) / (PAT.SLIT_BEAM * PAT.SLIT_BEAM));
  const out = new Float32Array(N * N);
  if (hit < 1e-4) return out;
  for (let j = 0; j < N; j++) {
    const y = half - (j + 0.5) * px, v = y / L;
    const fyv = sinc2(Math.PI * PAT.SLIT_LEN * v / lam);
    for (let i = 0; i < N; i++) {
      const x = -half + (i + 0.5) * px, u = x / L;
      const c = Math.cos(Math.PI * PAT.SLIT_SEP * u / lam);
      out[j * N + i] = hit * fyv * sinc2(Math.PI * PAT.SLIT_W * u / lam) * c * c;
    }
  }
  return out;
}

/* intensity -> 8 bit grey the way the pictures were exposed (logarithmic) */
function toGrey(I, logSpan, top) {
  const g = new Uint8ClampedArray(I.length);
  for (let k = 0; k < I.length; k++) {
    const v = I[k] <= 0 ? 0 : clamp01(1 + Math.log10(I[k] / top) / logSpan);
    g[k] = Math.round(v * 255);
  }
  return g;
}

function makeSprite(key, grey, rgb) {
  const N = PAT.N;
  const cv = document.createElement('canvas'); cv.width = N; cv.height = N;
  const g = cv.getContext('2d'), im = g.createImageData(N, N);
  for (let k = 0; k < N * N; k++) {
    im.data[4 * k] = grey[k] * rgb[0]; im.data[4 * k + 1] = grey[k] * rgb[1]; im.data[4 * k + 2] = grey[k] * rgb[2]; im.data[4 * k + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return { key, img: cv, w: N, h: N, b: [0, 0, 0, 0], ppu: 100,
           GetPixel(x, y) {
             x = clamp(x, 0, N - 1); y = clamp(y, 0, N - 1);
             const v = grey[(N - 1 - y) * N + x] / 255;
             return { r: v * rgb[0], g: v * rgb[1], b: v * rgb[2], a: 1 };
           } };
}

const LABEL_NM = { 'dr-351': 351, 'dr-488': 488, 'dr-514': 514, 'dr-632': 632.8, 'dr-694': 694.3, 'dr-914': 914, 'dr-1152': 1152, 'dr-1444': 1444 };
const DiffractionImages = {
  label: null, cache: new Map(),
  setLabel(l) { if (l !== this.label) { this.label = l; this.cache.clear(); } },
  get(name) {
    if (this.cache.has(name)) return this.cache.get(name);
    let m, spr = null;
    if ((m = /^([\d.]+)nm-(\d+)cm(-tiff)?$/.exec(name)) && this.label in LABEL_NM) {
      const nm = parseFloat(m[1]), d = parseInt(m[2]);
      if (nm === LABEL_NM[this.label] && d >= 10 && d <= 100) {
        const grey = toGrey(sampleField(nm, d), 4.2, 0.3);
        spr = makeSprite(name, grey, m[3] ? [1, 1, 1] : laserRGB(nm));
      }
    } else if ((m = /^632\.8nm-50cm-(-?\d+)um-(-?\d+)um(-tiff)?$/.exec(name)) && this.label === 'dr-488-0') {
      const x = parseInt(m[1]), y = parseInt(m[2]);
      if (Math.abs(x) <= PAT.PART_A_RANGE && Math.abs(y) <= PAT.PART_A_RANGE && x % 100 === 0 && y % 100 === 0) {
        const grey = toGrey(slitField(x, y), 2.2, 0.6);
        spr = makeSprite(name, grey, m[3] ? [1, 1, 1] : laserRGB(632.8));
      }
    }
    this.cache.set(name, spr);
    return spr;
  },
};

/* ============================================================ Z.UI drag */
class ZUIDraggableBase extends Component {
  constructor(go, d) { super(go, d); this.m_LastMousePosition = v2(0, 0); this.m_ForceEndDrag = false; }
  OnBeginDrag(e) {
    if (this.m_ForceEndDrag) this.m_ForceEndDrag = false;
    if (this.CanDrag) { this.m_LastMousePosition = e.position; this.DoBeginDrag(e, e.position); }
  }
  OnDrag(e) {
    if (this.CanDrag && !this.m_ForceEndDrag) {
      let diff = v2(e.position.x - this.m_LastMousePosition.x, e.position.y - this.m_LastMousePosition.y);
      diff = this.GetNewDiff(diff);
      const ori = this.TargetRect.anchoredPosition;
      let vec = this.GetNewPosition(ori, diff);
      if (!this.IsRectTransformInsideScreen(this.TargetRect)) {
        this.ResetPosition(); vec = this.TargetRect.anchoredPosition; this.m_ForceEndDrag = true;
      } else this.TargetRect.anchoredPosition = vec;
      this.m_LastMousePosition = v2(this.m_LastMousePosition.x + diff.x, this.m_LastMousePosition.y + diff.y);
      this.DoDrag(e, vec);
    }
  }
  OnEndDrag(e) {
    if (this.m_ForceEndDrag) this.m_ForceEndDrag = false;
    if (this.CanDrag) this.DoEndDrag(e, e.position);
  }
  DoBeginDrag() {} DoDrag() {} DoEndDrag() {}
  GetNewDiff(d) { return v2(this.ModifyDiffBySetting(d.x, this.Horizontal), this.ModifyDiffBySetting(d.y, this.Vertical)); }
  ModifyDiffBySetting(v, d) {
    if (d.Enable && d.Scale !== 0) { const s = v > 0 ? 1 : -1; v = Math.abs(v) > d.Scale ? d.Scale * s : 0; }
    return v;
  }
  GetNewPosition(o, diff) { return v2(this.ModifyPosBySetting(o.x, diff.x, this.Horizontal), this.ModifyPosBySetting(o.y, diff.y, this.Vertical)); }
  ModifyPosBySetting(value, diff, d) {
    if (d.Enable) value += diff;
    if (d.EnableLimit) value = clamp(value, d.MinValue, d.MaxValue);
    return value;
  }
  IsRectTransformInsideScreen(rt) {
    let n = 0;
    for (const p of rt.worldCorners()) if (p[0] >= 0 && p[0] < SW && p[1] >= 0 && p[1] < SH) n++;
    return n === 4;
  }
  UpdateInitPosition() { this.m_InitPosition = v2(this.TargetRect.anchoredPosition.x, this.TargetRect.anchoredPosition.y); }
  ResetPosition() { this.TargetRect.anchoredPosition = v2(this.m_InitPosition.x, this.m_InitPosition.y); }
}

/* ======================================================= nano_beam_core */
class MaterialProperties { constructor(E, nu, a) { this.ElasticModulus = E; this.PoissonRatio = nu; this.ThermalExpansionCoefficient = a; } }
class CantileverBeam {
  constructor(t, L, I, mat) { this.Thickness = t; this.Length = L; this.Material = mat; this.SecondMomentArea = I || 0; }
  get BendingStiffness() { return this.Material.ElasticModulus * this.SecondMomentArea; }
}
class DeflectionCalculator {
  constructor() { this.Deflection = 0; this.Curvature = 0; this.theta_ = 0; }
  calculateCurvatureFromDeflection(R) {
    if (Math.abs(R - 0) < 1e-6) { this.Curvature = 0; return; }
    const num = this.Deflection / R, num2 = R / num;
    this.Curvature = 1 / num2; this.theta_ = num;
  }
  rotatingAngle() { return this.theta_; }
  rotatingAngleInDegree() { return this.rotatingAngle() * 57.2957795; }
}
class PointLoadCalculator extends DeflectionCalculator {
  constructor() { super(); this.beam_ = null; this.delta_T_ = 0; this.load_ = -0.05; }
  calculateWithPosition(x) {
    const length = this.beam_.Length, num = length * 0.0136, num2 = length - num;
    const EI = this.beam_.BendingStiffness;
    let num3 = !(x < num2) ? (-this.load_ * num2 * num2) * (3 * x - num2) / (6 * EI)
                           : (-this.load_ * x * x) * (3 * num2 - x) / (6 * EI);
    if (this.load_ === -1) {
      const num4 = x * 0.00373, num5 = Math.PI * 2000, num6 = 0.0277, num8 = this.delta_T_;
      num3 += num4 * Math.exp(-num6 * num8) * Math.cos(num5 * num8);

class ZLinearEquation {
  constructor(p0, p1) {

class DiffractionPrepareController {
  static Create(view, controller) { return new DiffractionPrepareController(view, controller); }
  constructor(view, controller) {
    this.m_View = view; this.m_IsPrepare = false; this.m_PreLabel = null;
    controller.OnLaserTypeChange.push(t => this.Prepare(t, null));
  }
  get IsPrepare() { return this.m_IsPrepare; }
  UpdateLengthList(l) { this.m_LengthList = l; }
  Prepare(type, completion) {
    const label = this.m_View.GetLabel(type);
    if (label) {
      IPHODebug.Log('prepare asset ' + label.m_LabelString);
      this.m_PreLabel = label; this.m_IsPrepare = true;
      this.m_View.Show();
      this.LoadSpriteGroup(label, completion);
    }
  }
  /* Addressables.LoadAssetsAsync(label): the pictures are made here instead of read
     from the asset bundles; the progress bar counts them in as they would load. */
  LoadSpriteGroup(label, completion) {
    const total = this.m_View.TotalNumber, job = { n: 0 };
    DiffractionImages.setLabel(label.m_LabelString);
    this.m_Job = job;
    const step = () => {
      if (this.m_Job !== job) return;
      const k = Math.min(total, job.n + Math.ceil(total / 40));
      for (; job.n < k; job.n++) this.m_View.UpdateProgress();
      if (job.n >= total) {
        IPHODebug.Log(`finish prepare asset, asset count is ${total}`);
        this.m_IsPrepare = false; this.m_View.OnProgressDone(); if (completion) completion();
      } else U.later(0.05, step);
    };
    U.later(0.05, step);
  }
  GetResult(model) { return DiffractionImages.get(`${fmtG(this.m_LengthList[model.LaserType])}nm-${fmtG(model.Distance)}cm`); }
  GetGrayResult(model) { return DiffractionImages.get(`${fmtG(this.m_LengthList[model.LaserType])}nm-${fmtG(model.Distance)}cm-tiff`); }
  GetResultByName(name) { return DiffractionImages.get(name); }
}

  HandleToggleExperimentIsOn() { this.m_DController.ToggleCurrentExperimentIsOn(); }
  HandleSetBtnClick() { this.m_Delegate.OnPosChange(v2(Math.trunc(parseInt(this.PosXText.text) / 100), Math.trunc(parseInt(this.PosYText.text) / 100))); }
});

reg(class DiffractionScreenItem extends ZUIDraggableBase {
  Init(c) { this.m_DController = c; }
  DoDrag() {
    this.SetArrowActive(this.RightArrow, this.TargetRect.anchoredPosition.x < this.Horizontal.MaxValue);
    this.SetArrowActive(this.LeftArrow, this.TargetRect.anchoredPosition.x > this.Horizontal.MinValue);
    this.DistanceText.text = this.GetCurrentDistance();
  }
  SetArrowActive(a, out) { if (a.activeInHierarchy !== out) a.SetActive(out); }
  GetCurrentDistance() {
    const x = this.TargetRect.anchoredPosition.x, h = this.Horizontal;
    const d = 10 + Math.floor((100 - 10) * ((x - h.MinValue) / (h.MaxValue - h.MinValue)));
    this.m_DController.UpdateCurrentDistance(d);
    return fmtFixed(d, 2) + ' cm';
  }
  DoEndDrag() { IPHODebug.Log('Start drag screen from ' + this.GetCurrentDistance()); }
  DoBeginDrag() { IPHODebug.Log('End drag screen to ' + this.GetCurrentDistance()); }
});

reg(class DiffractionLaserItem extends ZUIDraggableBase {
  constructor(go, d) { super(go, d); this.LaserRect = null; }
  DoEndDrag() {
    IPHODebug.Log(`End drag laser ${LASER_NAMES[this.Type]}`);
    if (this.LaserRect) {
      const lr = this.LaserRect;
      DOMove(this.TargetRect, lr.position, 0.5).OnComplete(() => lr.go.get('DiffractionLaserPosition').DoChangeType());
    } else this.ResetPosition();
  }
  Init(length, typeIndex) {
    this.Text.text = `${fmtG(length)}nm`;
    this.Type = typeIndex;
    this.TargetRect.anchoredPosition = v2(-400, -(40 + (typeIndex - 1) * 30));
    this.UpdateInitPosition();
  }
  DoBeginDrag() { IPHODebug.Log(`Start drag laser ${LASER_NAMES[this.Type]}`); }
});

reg(class DiffractionLaserPosition extends Component {
  constructor(go, d) { super(go, d); this.m_CurLaser = null; }
  Init(c) { this.m_DController = c; }
  OnTriggerEnter2D(other) {
    if (!this.m_CurLaser && other.go.tag === 'laser') {
      this.m_CurLaser = other.go.get('DiffractionLaserItem');
      if (this.m_CurLaser) this.m_CurLaser.LaserRect = this.Rect;
    }
  }
  OnTriggerExit2D(other) {
    if (other.go.tag === 'laser') {
      const comp = other.go.get('DiffractionLaserItem');
      if (this.m_CurLaser && comp && this.m_CurLaser.Type === comp.Type) {
        this.m_CurLaser.LaserRect = null;
        this.m_DController.UpdateCurrentLaser(0);
        this.m_DController.UpdateCurrentExperimentIsOn(false);
        IPHODebug.Log(`Uninstall the laser ${LASER_NAMES[this.m_CurLaser.Type]}, so now experiment state is OFF`);
        this.m_CurLaser = null;
      }
    }
  }
  DoChangeType() { this.m_DController.UpdateCurrentLaser(this.m_CurLaser.Type); }
});

reg(class DiffractionTextureColorPicker extends Component {
  Init(c) {
    c.OnExperimentIsOn.push(v => this.HandleExperimentIsOn(v));
    c.OnExperimentImgChange.push(() => this.HandleExperimentImgChange());
  }
  HandleExperimentImgChange() { if (this.HitUIObject) this.GetImageColorAndShow(this.NowPoint); }
  HandleExperimentIsOn(isOn) {
    this.IsOn = isOn;
    if (!isOn) { this.SpotRect.go.SetActive(false); this.PosXTxt.text = '--'; this.PosYTxt.text = '--'; this.VTxt.text = '--'; }
    else this.NowFrame = this.MAX_FRAME;
  }
  FixedUpdate() {
    if (!this.IsOn) return;
    if (Input.GetKey('ArrowUp')) this.UpdateNowPoint(v2(0, 1), 'up');
    if (Input.GetKey('ArrowDown')) this.UpdateNowPoint(v2(0, -1), 'down');
    if (Input.GetKey('ArrowRight')) this.UpdateNowPoint(v2(1, 0), 'right');
    if (Input.GetKey('ArrowLeft')) this.UpdateNowPoint(v2(-1, 0), 'left');
    if (Input.GetKeyUp('ArrowUp') || Input.GetKeyUp('ArrowDown') || Input.GetKeyUp('ArrowRight') || Input.GetKeyUp('ArrowLeft')) this.NowFrame = this.MAX_FRAME;
  }
  UpdateNowPoint(off, log) {
    this.NowFrame++;
    if (this.NowFrame > this.MAX_FRAME) {
      this.NowPoint = v2(this.NowPoint.x + off.x, this.NowPoint.y + off.y);
      IPHODebug.Log('Click ' + log + ' arrow');
      this.GetImageColorAndShow(this.NowPoint);
      this.NowFrame = 0;
    }
  }
  Update() { if (this.TargetImage.sprite && this.IsOn) this.GetPixelByMouseClick(); }
  GetPixelByMouseClick() {
    const sel = U.es.currentSelectedGameObject;
    if (!Input.GetMouseButton(0) || !sel) return;
    if (!this.HitUIObject) {
      this.HitUIObject = sel.rt;
      if (sel.tag !== 'color_picker') this.HitUIObject = null;
      else {
        const sd = this.HitUIObject.sizeDelta, p = this.HitUIObject.position;
        this.PointMax = v2(p.x + sd.x / 2, p.y + sd.y / 2); this.PointMin = v2(p.x - sd.x / 2, p.y - sd.y / 2);
        this.PointOffset = v2(this.PointMax.x - this.PointMin.x, this.PointMax.y - this.PointMin.y);
      }
    }
    if (this.HitUIObject && sel.rt === this.HitUIObject) this.GetImageColorAndShow(Input.mousePosition);
  }
  GetImageColorAndShow(pos) {
    IPHODebug.Log(`Now result spot pos is (${fmtFixed(pos.x, 1)}, ${fmtFixed(pos.y, 1)})`);
    if (this.TargetImage.sprite) this.ShowImageColor(this.GetImageColor(this.GetMousePos(pos)));
  }
  GetMousePos(pos) { const v = this.TransMousePosToImagePos(pos); return v2(Math.floor(v.x), Math.floor(v.y)); }
  TransMousePosToImagePos(m) {
    m = v2(clamp(m.x, this.PointMin.x, this.PointMax.x), clamp(m.y, this.PointMin.y, this.PointMax.y));
    this.NowPoint = m;
    const r = this.TargetRect.rect, hp = this.HitUIObject.position, tex = this.TargetImage.sprite;
    return v2((m.x - hp.x + r.width * 0.5) * tex.w / r.width, (m.y - hp.y + r.height * 0.5) * tex.h / r.height);
  }
  GetImageColor(p) { return this.TargetImage.sprite.GetPixel(Math.trunc(p.x), Math.trunc(p.y)); }
  ShowImageColor(c) {
    const num = (this.NowPoint.x - this.PointMin.x) / this.PointOffset.x * this.ScreenOffset.x + this.ScreenMin.x;
    const num2 = (this.NowPoint.y - this.PointMin.y) / this.PointOffset.y * this.ScreenOffset.y + this.ScreenMin.y;
    this.PosXTxt.text = fmtFixed(num, 2); this.PosYTxt.text = fmtFixed(num2, 2);
    const gray = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
    this.VTxt.text = fmtFixed(gray * this.GrayRatio, 2);
    this.SpotRect.anchoredPosition = v2(this.NowPoint.x, this.NowPoint.y);
    if (!this.SpotRect.go.activeInHierarchy) this.SpotRect.go.SetActive(true);
  }
});

/* boot: assets, the canvas, input, the frame loop */
'use strict';
(function () {
  const cv = document.getElementById('unity');
  const ctx = cv.getContext('2d');
  let k = 1;
  function fit() {
    const r = cv.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
    k = r.width / SW * dp;
    cv.width = Math.round(SW * k); cv.height = Math.round(SH * k);
  }
  window.addEventListener('resize', fit);

  function toUnity(e) {
    const r = cv.getBoundingClientRect();
    return v2((e.clientX - r.left) / r.width * SW, SH - (e.clientY - r.top) / r.height * SH);
  }
  cv.addEventListener('pointermove', e => { U.input.mouse = toUnity(e); });
  cv.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    cv.setPointerCapture(e.pointerId); U.input.mouse = toUnity(e); U.input.btnHeld = true; U.input.queue.push({ type: 'down' });
    e.preventDefault(); cv.focus();
  });
  cv.addEventListener('pointerup', e => {
    if (e.button !== 0) return;
    U.input.mouse = toUnity(e); U.input.btnHeld = false; U.input.queue.push({ type: 'up' });
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  const KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
  cv.addEventListener('keydown', e => {
    if (KEYS.has(e.key)) { if (!U.input.keys.has(e.key)) U.input.down.add(e.key); U.input.keys.add(e.key); e.preventDefault(); }
    const sel = U.es.currentSelectedGameObject, f = sel && sel.get('InputField');
    if (f) {
      if (e.key === 'Backspace') { f.typed('\b'); e.preventDefault(); }
      else if (e.key === 'Enter') { f.typed('\n'); e.preventDefault(); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { f.typed(e.key); e.preventDefault(); }
    }
  });
  cv.addEventListener('keyup', e => { if (KEYS.has(e.key)) { U.input.keys.delete(e.key); U.input.up.add(e.key); } });
  cv.addEventListener('blur', () => { for (const key of U.input.keys) U.input.up.add(key); U.input.keys.clear(); });

  function drawSplash(g, k, img, t) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#231f20'; g.fillRect(0, 0, SW * k, SH * k);
    const a = t < 0.3 ? 0 : t < 0.8 ? (t - 0.3) / 0.5 : t < 1.8 ? 1 : t < 2.3 ? (2.3 - t) / 0.5 : 0;
    if (a <= 0) return;
    const s = 0.1495 + 0.0075 * clamp01((t - 0.3) / 2.0);
    const w = 2048 * s, h = 1024 * s;
    g.globalAlpha = a;
    g.drawImage(img, k * (SW - w) / 2, k * (SH - h) / 2, k * w, k * h);
    g.globalAlpha = 1;
  }
  async function boot() {
    U.data = APHO_SCENE;
    for (const key in APHO_SCENE.sprites) {
      const s = APHO_SCENE.sprites[key];
      const img = new window.Image(); img.src = APHO_SPRITES[key];
      await img.decode();
      U.sprites[key] = { key, img, w: s.w, h: s.h, b: s.b, ppu: s.ppu };
    }
    for (const [name, b64] of Object.entries(APHO_FONTS)) {
      const f = new FontFace(name, `url(data:font/ttf;base64,${b64})`);
      await f.load(); document.fonts.add(f);
    }
    U.es = new EventSystem();
    const splash = new window.Image(); splash.src = APHO_SPLASH; await splash.decode();
    fit();
    let last = performance.now(), splashT = 0, started = false;
    function frame(now) {
      const dt = Math.min((now - last) / 1000, MAX_DT); last = now;
      if (!started) {
        /* the Unity splash screen (light logo on #231F20, "Dolly"): logo fades in,
           holds, fades out, the background stays a moment, then the first scene */
        splashT += dt;
        drawSplash(ctx, k, splash, splashT);
        if (splashT >= 2.8) { started = true; loadScene('start'); window.APHO_READY = true; }
      } else {
        tick(dt);
        renderAll(ctx, k);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  boot();
})();

})();
</script>
