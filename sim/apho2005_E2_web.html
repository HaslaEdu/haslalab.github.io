let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);
const d=()=>T[lang];
/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (SI unless marked)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const RAD=Math.PI/180, G=9.8;
const MAG={m:0.0215, Ro:0.0127, Ri:0.0040, t:0.0063};              /* the ring magnet: mass, outer and inner radius, thickness */
const MEFF=MAG.m*(1+(MAG.Ro*MAG.Ro+MAG.Ri*MAG.Ri)/(2*MAG.Ro*MAG.Ro));   /* rolling: its turning adds to its inertia */
const LSUP=425, PLATE=500, TRK0=20, TRK1=470, BAR0=40, BAR1=440;   /* mm along the plate from its low end: the stand's support, the plate, the stoppers, the bars */
const TRUE={
  n:U(0.93,1.06),                       /* F = k0 d^p v^n: what part B1 is after */
  p:U(-2.40,-1.95),                     /* and part B2 */

  tw:U(0.004,0.007),                    /* the drag (N) from the earth's field twisting the magnet when its poles point east–west */
  roll:U(0.0002,0.0005),                /* rolling friction, N */
  scat:U(0.004,0.010) };                /* run-to-run scatter of the braking (a speck of dust, the magnet's wobble) */
TRUE.K5=MAG.m*G*0.118/Math.pow(TRUE.vref,TRUE.n);
/* ══════════════════════════════════════════════════════════════
   2.  THE BENCH STATE
   ══════════════════════════════════════════════════════════════ */

  psi:0,                                /* which way the plane points on the table (deg): the direction it runs downhill */
  h:50,                                 /* the stand's height under the support (mm) */
  dL:5.0, dR:5.0,                       /* each bar's inner face from the track's centre line (mm) */
  s:TRK1, v:0, rolling:false, ang:0, kRun:1,      /* the magnet: position along the plate (mm), speed (mm/s), rolling or held, its turn (rad) */
  watch:{run:false,t:0,t0:0}, rulerAt:"none" };

function say(key,...args){ msg={key,args,t:performance.now()}; }

const itemName=k=>d().items[k]||k;
const sinTh=()=>ST.at.stand==="plane"?Math.min(0.6,ST.h/LSUP):0;
/* the braking from each bar: k0 d^p v^n with half the strength per side, d in mm against 5 mm */
function brake(v){ if(ST.at.bars!=="plane"||v<=0) return 0; const f=(Math.pow(ST.dL/5,TRUE.p)+Math.pow(ST.dR/5,TRUE.p))/2;
  return TRUE.K5*f*Math.pow(v,TRUE.n)*ST.kRun; }
const twist=()=>TRUE.tw*Math.abs(Math.cos((ST.psi-TRUE.north)*RAD));     /* least when the plane runs east–west: the poles then point north–south */
function stepPhys(dt){
  if(ST.watch.run) ST.watch.t+=dt;
  if(!ST.rolling||ST.at.magnet!=="plane") return;
  const st=sinTh(), N=Math.max(0,Math.ceil(dt/0.0005)), h=dt/N;
  for(let i=0;i<N;i++){ const v=ST.v/1000, drive=MAG.m*G*st, drag=brake(Math.max(0,v))+(v>1e-5||drive>TRUE.roll+twist()?TRUE.roll+twist():drive);
    let a=(drive-drag)/MEFF; let nv=v+a*h; if(nv<0) nv=0; ST.v=nv*1000; ST.s-=ST.v*h; ST.ang+=nv*h/MAG.Ro;
    if(ST.s<=TRK0+MAG.Ro*1000){ ST.s=TRK0+MAG.Ro*1000; if(ST.v>0) say("bottom"); ST.v=0; ST.rolling=false; break; } } }

/* ══════════════════════════════════════════════════════════════
   4.  DRAWING HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,'Courier New',monospace";
function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);

    trayCells.push([k,y,y+TROW-3]); y+=TROW; }
  c.font='10.5px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a"; t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14)); }
function setTab(k){ tab=k; renderTabs(); $("t-closecap").textContent=d().closeCap[tab]; }
function renderTabs(){ const box=$("tabs"); box.innerHTML=""; for(const k of ["side","end"]){ const b=document.createElement("button"); b.textContent=d().tabs[k]; b.className=k===tab?"on":""; b.onclick=()=>setTab(k); box.appendChild(b); } }
const hitAdd=(k,x,y,w,h)=>HIT.push({k,x,y,w,h});
/* ── 1. the plane from the side: the track's scale, the stand (and a ruler held up against it), the rolling magnet ── */
let SG={};
function drawSide(){ const t=d(); ctx.fillStyle="#f4f2ec"; ctx.fillRect(0,0,CLW,CLH);
  if(!has("plane")){ text(t.lab.noPlane,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  const z=(CLW-80)/(PLATE+20), x0=40, y0=CLH-60, st=sinTh(), ct=Math.sqrt(1-st*st), Pp=(s,up)=>[x0+(s*ct-up*st)*z,y0-(s*st+up*ct)*z];
  SG={z,x0,y0,Pp};
  ctx.fillStyle="#d6d3c8"; ctx.fillRect(0,y0,CLW,CLH-y0); ctx.strokeStyle="#9a968a"; ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(CLW,y0); ctx.stroke();
  /* the plate */
  poly([Pp(0,0),Pp(PLATE,0),Pp(PLATE,-6),Pp(0,-6)],"rgba(190,220,232,0.85)","#7f9fb0");
  for(let mm=0;mm<=480;mm+=5){ const l=mm%50===0?12:mm%10===0?7:4, a=Pp(mm,0), b=Pp(mm,l*0.6); ctx.strokeStyle="#223"; ctx.lineWidth=mm%50===0?1.1:0.5; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    if(mm%50===0){ const q=Pp(mm,-14); text(String(mm),q[0],q[1],"#223",10,"center","700"); } } ctx.lineWidth=1;
  for(const s of [TRK0,TRK1]){ const a=Pp(s,0), b=Pp(s,9); ctx.strokeStyle="#555"; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.lineWidth=1; }
  /* the stand */
  if(ST.at.stand==="plane"){ const a=Pp(LSUP,-6); fillR(a[0]-10,a[1],20,y0-a[1],2,"#f2f2ee","#999"); }
  /* a ruler stood upright beside the stand */
  if(ST.rulerAt==="side"&&has("ruler")){ const a=Pp(LSUP,0), X=a[0]+16; fillR(X,y0-200*z-6,22,200*z+6,2,"rgba(214,228,236,.85)","#8fa7b4");
    for(let mm=0;mm<=200;mm++){ const l=mm%10===0?10:mm%5===0?7:4, Y=y0-mm*z; ctx.strokeStyle="#223"; ctx.lineWidth=mm%10===0?1:0.5; ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+l,Y); ctx.stroke(); if(mm%50===0) text(String(mm/10),X+16,Y,"#223",9,"center"); } ctx.lineWidth=1;
    ctx.setLineDash([3,3]); ctx.strokeStyle="#c0392b"; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(X+22,a[1]); ctx.stroke(); ctx.setLineDash([]); }
  /* the magnet */
  if(ST.at.magnet==="plane"){ const R=MAG.Ro*1000, c=Pp(ST.s,R); circ(c[0],c[1],R*z,"#6a7078","#2a2d33",1.5); circ(c[0],c[1],MAG.Ri*1000*z,"#f4f2ec");
    const a=ST.ang; ctx.strokeStyle="#f2c14e"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(c[0]+MAG.Ri*1000*z*Math.cos(a),c[1]+MAG.Ri*1000*z*Math.sin(a)); ctx.lineTo(c[0]+R*z*0.95*Math.cos(a),c[1]+R*z*0.95*Math.sin(a)); ctx.stroke(); ctx.lineWidth=1;
    hitAdd("mag",c[0]-R*z-6,c[1]-R*z-6,2*R*z+12,2*R*z+12); }
  /* the near bar, see-through */
  if(ST.at.bars==="plane"){ poly([Pp(BAR0,0),Pp(BAR1,0),Pp(BAR1,16),Pp(BAR0,16)],"rgba(170,178,186,0.45)","#8a9098"); }
  /* a compass rose: which way the plane runs, seen from above */
  const cx=CLW-60, cy=50, q=TRUE.north*RAD, r=30; circ(cx,cy,r+6,"#ffffff","#bbb");
  ctx.strokeStyle="#c0392b"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(q),cy+r*Math.sin(q)); ctx.stroke(); text("N",cx+(r+14)*Math.cos(q),cy+(r+14)*Math.sin(q),"#c0392b",11,"center","700");
  const pq=ST.psi*RAD; ctx.strokeStyle="#2b6cb0"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx-r*0.8*Math.cos(pq),cy-r*0.8*Math.sin(pq)); ctx.lineTo(cx+r*0.8*Math.cos(pq),cy+r*0.8*Math.sin(pq)); ctx.stroke(); ctx.lineWidth=1;
  text(t.lab.compass,cx,cy+r+18,"#555",9.5,"center");
  text(t.lab.sideHint,10,CLH-10,"#555",11,"left"); }
/* ── 2. the track end-on: the magnet between the two bars, a ruler laid across ── */
function drawEnd(){ const t=d(); ctx.fillStyle="#f4f2ec"; ctx.fillRect(0,0,CLW,CLH);
  if(!has("plane")){ text(t.lab.noPlane,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  const z=Math.min(CLW/90,CLH/48), cx=CLW/2, y0=CLH*0.62, X=c=>cx+c*z, Y=u=>y0-u*z;
  fillR(X(-45),Y(0),90*z,6*z,2,"rgba(190,220,232,0.9)","#7f9fb0");
  if(ST.at.bars==="plane"){ for(const [c0,c1] of [[-ST.dL-12,-ST.dL],[ST.dR,ST.dR+12]]) fillR(X(c0),Y(16),(c1-c0)*z,16*z,1,"#b9bfc6","#6b7177",1.2);
    for(const [k,c] of [["L",-ST.dL-6],["R",ST.dR+6]]){ fillR(X(c)-22,Y(16)-30,20,20,3,"#3a3d42","#111"); text("◀",X(c)-12,Y(16)-20,"#e8eef2",11,"center","700"); hitAdd("b"+k+":-1",X(c)-22,Y(16)-30,20,20);
      fillR(X(c)+2,Y(16)-30,20,20,3,"#3a3d42","#111"); text("▶",X(c)+12,Y(16)-20,"#e8eef2",11,"center","700"); hitAdd("b"+k+":1",X(c)+2,Y(16)-30,20,20); } }
  if(ST.at.magnet==="plane"){ fillR(X(-MAG.t*500),Y(2*MAG.Ro*1000),MAG.t*1000*z,2*MAG.Ro*1000*z,3,"#6a7078","#2a2d33",1.2); text("N",X(0),Y(2*MAG.Ro*1000-4),"#e8eef2",9,"center","700");
    ctx.setLineDash([3,3]); ctx.strokeStyle="#c0392b"; ctx.beginPath(); ctx.moveTo(X(0),Y(-2)); ctx.lineTo(X(0),Y(28)); ctx.stroke(); ctx.setLineDash([]); }
  if(ST.rulerAt==="end"&&has("ruler")){ const yR=Y(-9); fillR(X(-40),yR,80*z,9*z,2,"rgba(214,228,236,.88)","#8fa7b4");
    for(let mm=0;mm<=80;mm++){ const l=mm%10===0?3.2:mm%5===0?2.2:1.4, Xm=X(-40+mm); ctx.strokeStyle="#223"; ctx.lineWidth=mm%10===0?1:0.5; ctx.beginPath(); ctx.moveTo(Xm,yR); ctx.lineTo(Xm,yR+l*z); ctx.stroke(); if(mm%10===0) text(String(mm/10),Xm,yR+5.5*z,"#223",10,"center"); } ctx.lineWidth=1; }
  else if(has("ruler")) text(t.lab.rulerHint,CLW/2,CLH-34,"#69717a",11,"center");
  text(t.lab.endHint,10,CLH-10,"#555",11,"left"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="end") drawEnd(); else drawSide(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   5.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const PICKORDER=["magnet","bars","stand","watch","ruler","plane"];
function hitItem(p){ let id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return PICKORDER.find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),0.5))||null; }
const carries=k=>k==="plane"&&["stand","bars","magnet"].some(o=>ST.at[o]==="plane");
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.parent){ ST.on.add(k); ST.at[k]=hand.parent; say("placed",itemName(k)); }
  else if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
function takeUp(k){ if(carries(k)){ say("clearFirst"); return false; }
  const b=baseOf(k), par=ST.at[k]; if(par) delete ST.at[k]; if(k==="magnet"){ ST.rolling=false; ST.v=0; } if(ST.rulerAt!=="none"&&k==="ruler") ST.rulerAt="none";
  hand={item:k,move:true,orig:{x:b.x,y:b.y},parent:par}; ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
function drop(k,x,y){ ST.pos[k]={x,y}; ST.on.add(k); delete ST.at[k]; say("placed",itemName(k)); return true; }
function put(k,t){
  if(k==="stand"){ ST.at.stand="plane"; ST.on.add(k); say("standIn"); return true; }
  if(k==="bars"){ ST.at.bars="plane"; ST.on.add(k); say("barsOn"); return true; }
  if(k==="magnet"){ ST.at.magnet="plane"; ST.on.add(k); ST.s=TRK1-MAG.Ro*1000; ST.v=0; ST.rolling=false; say("magTop"); return true; }
  return false; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const t=targetAt(k,p); if(t){ if(put(k,t)) hand=null; return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(carries(k)){ say("clearFirst"); return; } if(k==="magnet") ST.rolling=false; if(k==="ruler") ST.rulerAt="none"; delete ST.at[k]; ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); }
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
  if(e.code==="Space"){ e.preventDefault(); watchSS(); } if(e.key==="r"||e.key==="R") watchReset(); });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the close-ups: click the magnet to let it go (or to take it back to the top); the bars' ◀▶ in the end view */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0) return;
  if(!h){ if(has("ruler")&&tab==="end"&&ST.rulerAt!=="end"){ ST.rulerAt="end"; say("rulerLaid"); } else if(has("ruler")&&tab==="side"&&ST.rulerAt!=="side"){ ST.rulerAt="side"; say("rulerUp"); } return; }
  if(h.k==="mag"){ if(ST.rolling||ST.s<TRK1-MAG.Ro*1000-1) toTop(); else release(); return; }
  if(h.k[0]==="b"){ const [s,dv]=h.k.slice(1).split(":"); moveBar(s,+dv); } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function release(){ if(ST.at.magnet!=="plane"){ say("noMag"); return; } if(ST.rolling) return; ST.kRun=1+TRUE.scat*(Math.random()*2-1)*1.7; ST.rolling=true; ST.v=0; say("released"); }
function toTop(){ if(ST.at.magnet!=="plane"){ say("noMag"); return; } ST.rolling=false; ST.v=0; ST.s=TRK1-MAG.Ro*1000; say("magTop"); }
/* dir: −1 moves the bar left on the end view, +1 right */
function moveBar(s,dir){ if(ST.at.bars!=="plane"){ say("noBars"); return; } if(ST.rolling){ say("stillRolling"); return; } const k=s==="L"?"dL":"dR", dd=(s==="L"?-dir:dir)*0.5, min=MAG.t*500+0.4; ST[k]=Math.max(min,Math.min(14,Math.round((ST[k]+dd)*10)/10)); }
function setH(dh){ if(ST.at.stand!=="plane"){ say("noStand"); return; } ST.h=Math.max(10,Math.min(200,ST.h+dh)); }
function turnPlane(da){ if(!has("plane")){ say("needFor",itemName("plane")); return; } if(ST.rolling){ say("stillRolling"); return; } const keep=ST.psi; ST.psi=((ST.psi+da)%360+360)%360; const b=ST.pos.plane; if(!fits("plane",b.x,b.y)){ ST.psi=keep; say("noRoom"); } }
function watchSS(){ if(!has("watch")){ say("needFor",itemName("watch")); return; } ST.watch.run=!ST.watch.run; }
function watchReset(){ if(!has("watch")) return; if(!ST.watch.run) ST.watch.t=0; }
for(const [id,dh] of [["hm10",-10],["hm1",-1],["hp1",1],["hp10",10]]) $(id).onclick=()=>setH(dh);
for(const [id,da] of [["pm15",-15],["pm5",-5],["pp5",5],["pp15",15]]) $(id).onclick=()=>turnPlane(da);
for(const [id,s,dv] of [["lm","L",-1],["lp","L",1],["rm","R",-1],["rp","R",1]]) $(id).onclick=()=>moveBar(s,dv);
$("relBtn").onclick=release; $("topBtn").onclick=toTop; $("wSS").onclick=watchSS; $("wR").onclick=watchReset;
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  t "+ST.watch.t.toFixed(2)+" s"+($("cfg").value.trim()?"   "+$("cfg").value.trim():"");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(); $("dW").textContent=has("watch")?ST.watch.t.toFixed(2)+" s":"—"; $("wSS").textContent=ST.watch.run?t.stop:t.start; $("wSS").className=ST.watch.run?"on":"";
  $("dH").textContent=ST.at.stand==="plane"?t.hSet:t.flat; $("dB").textContent=ST.at.bars==="plane"?t.bSet:t.noBarsS; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.rolling) L.push([t.st.rolling,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-w","hW"],["wR","reset"],["wHint","wHint"],["t-h-m","hM"],["relBtn","release"],["topBtn","top"],["t-h-s","hS"],["sHint","sHint"],["t-h-b","hB"],["bHint","bHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose(); frameN++; if(has("watch")) $("dW").textContent=ST.watch.t.toFixed(2)+" s";
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
