/* ══════════════════════════════════════════════════════════════
   1.  RANDOM
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2018e1)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const jit=s=>1+s*gauss();

const RSQ_NOM=123.94, IDSS_NOM=11.89e-3, VP_NOM=-1.42;
const TFT_A=88.5e-6, TFT_T1=44.0, TFT_B=265.5e-6, TFT_T2=880.0, TFT_VT=-1.85, TFT_NV=0.170, TFT_ROFF=894e3;
const FUSE_A=0.315, VOLT_RIN=10e6;

/* the printed sheet, in the units of the figure of the problem (Fig. 10: 477 × 762) */
const SEG_V=43.75, WMAX=37;
const R1={u:80, v0:185, w:i=>WMAX*(10-i)/10, mm:i=>10-i};   /* wide end at Z */
const R2={u:297, v0:227, w:i=>WMAX*(3+i)/10, mm:i=>3+i};    /* narrow end at Z */
const SIL=[            /* silver ink: [net, u0, v0, u1, v1] */
  ["Z",132,0,157,160], ["Z",2,158,325,185], ["Z",255,55,279,160], ["Z",255,55,304,100],
  ["G",289,0,373,36],
  ["D",350,55,472,100], ["D",447,55,472,175], ["D",409,152,472,175], ["D",409,152,435,486],
  ["VIN",447,187,472,548], ["VIN",409,497,472,548],
  ["V",2,577,177,602], ["V",78,535,82,578],
  ["W",205,577,472,602], ["Z",295,184,299,228],
  ["T1a",32,615,137,639], ["T1b",32,729,137,752],
  ["T2a",197,652,272,671], ["T2b",197,736,272,752],
  ["T3a",342,682,394,696], ["T3b",342,739,394,752]];
const CARBON_T=[[39,638,132,730],[202,670,267,737],[345,695,390,740]];
const TFT_BODY=[302,35,362,88];
const RL_ZONE=[433,192,449,484];

class Sheet{
  constructor(){
    this.Rsq=RSQ_NOM*jit(0.02);
    this.RT=[0.987,1.012,1.012].map(f=>this.Rsq*jit(0.004)*f);
    const bias=1.004*jit(0.004);                 /* screen printing: a shade narrower than drawn */
    this.k1=this.Rsq*bias*jit(0.004); this.k2=this.Rsq*bias*jit(0.004);
    this.g1=[...Array(8)].map((_,i)=>10/(R1.mm(i)*jit(0.006)));   /* squares in each 10 mm step */
    this.g2=[...Array(8)].map((_,i)=>10/(R2.mm(i)*jit(0.006)));
  }
  /* squares of film between the Z end and the height v of the strip */
  sq(r,v){ const R=r===1?R1:R2, g=r===1?this.g1:this.g2;
    const s=Math.max(0,Math.min(8,(v-R.v0)/SEG_V)); let a=0;
    for(let i=0;i<8;i++){ if(s>=i+1) a+=g[i]; else { a+=g[i]*(s-i); break; } }
    return a; }
  total(r){ return this.sq(r,1e9)*(r===1?this.k1:this.k2); }
}

class JFET{
  constructor(){ this.IDSS=IDSS_NOM*jit(0.04); this.VP=VP_NOM*jit(0.03); }
  fwd(vds,vgs){ const ov=vgs-this.VP; if(ov<=0||vds<=0) return 0;
    const b=this.IDSS/(this.VP*this.VP); return vds<ov? b*(2*ov*vds-vds*vds) : b*ov*ov; }
  current(vds,vgs){ return vds>=0? this.fwd(vds,vgs) : -this.fwd(-vds,vgs-vds); }
}

/* electrolyte-gated paper TFT: two ionic branches that relax separately;
   switching off is fast, switching on is slow and in two stages */
class TFT{
  constructor(){
    this.VT=TFT_VT*jit(0.03); this.nv=TFT_NV*jit(0.10); this.Roff=TFT_ROFF*jit(0.08);
    this.t1=TFT_T1*jit(0.08); this.t2=TFT_T2*jit(0.10); this.a=TFT_A/(TFT_A+TFT_B)*jit(0.06);
    this.toff=12.0*jit(0.15); this.Ifull=(TFT_A+TFT_B)*jit(0.05);
    this.beta=2*this.Ifull/this.ov(0)**2;
    this.I1=this.a*this.Ifull; this.I2=(1-this.a)*this.Ifull;    /* it is on when the kit is handed out */
  }
  ov(vgs){ const x=(vgs-this.VT)/this.nv; return this.nv*Math.log1p(Math.exp(Math.min(x,40))); }
  advance(dt,vgs){
    const tgt=0.5*this.beta*this.ov(vgs)**2;
    const aim1=this.a*tgt, aim2=(1-this.a)*tgt;
    this.I1+=(aim1-this.I1)*(1-Math.exp(-dt/(aim1>this.I1?this.t1:this.toff)));
    this.I2+=(aim2-this.I2)*(1-Math.exp(-dt/(aim2>this.I2?this.t2:this.toff)));
  }
  fwd(vds,vgs){ const ov=this.ov(vgs), I=this.I1+this.I2;
    return vds>=ov? I : I*(2*ov*vds-vds*vds)/(ov*ov); }
  current(vds,vgs){ const leak=vds/this.Roff;
    return (vds>=0? this.fwd(vds,vgs) : -this.fwd(-vds,vgs-vds))+leak; }
}

/* a small modified-nodal solver; every island of the circuit is tied to the
   reference at one node, which carries no current */
class Ckt{
  constructor(){ this.res=[]; this.vs=[]; this.nl=[]; this.nodes=new Set(); }
  R(a,b,r){ if(a===b) return; this.nodes.add(a); this.nodes.add(b); this.res.push([a,b,Math.max(r,1e-6)]); }
  V(p,n,v,ri){ this.nodes.add(p); this.nodes.add(n); this.vs.push([p,n,v,ri]); }
  NL(d,s,g,dev){ this.nodes.add(d); this.nodes.add(s); this.nodes.add(g); this.nl.push([d,s,g,dev]); }
  solve(guess){
    const names=[...this.nodes], idx=new Map(names.map((n,i)=>[n,i])), nn=names.length, ns=this.vs.length, N=nn+ns;
    const par=names.map((_,i)=>i), f=a=>{ while(par[a]!==a){ par[a]=par[par[a]]; a=par[a]; } return a; };
    const u=(a,b)=>{ const ra=f(idx.get(a)), rb=f(idx.get(b)); if(ra!==rb) par[ra]=rb; };
    for(const [a,b] of this.res) u(a,b); for(const [p,q] of this.vs) u(p,q);
    for(const [d,s,g] of this.nl){ u(d,s); u(d,g); }
    const tie=new Set(); for(let i=0;i<nn;i++) tie.add(f(i));
    const v=new Float64Array(nn); names.forEach((n,i)=>{ if(guess&&guess.has(n)) v[i]=guess.get(n); });
    const A=new Float64Array(N*N), b=new Float64Array(N);
    for(let it=0;it<60;it++){
      A.fill(0); b.fill(0);
      const sg=(i,j,g)=>{ A[i*N+i]+=g; A[j*N+j]+=g; A[i*N+j]-=g; A[j*N+i]-=g; };
      for(const [a,c,r] of this.res) sg(idx.get(a),idx.get(c),1/r);
      for(const i of tie) A[i*N+i]+=1;
      for(let i=0;i<nn;i++) A[i*N+i]+=1e-12;
      this.vs.forEach(([p,q,val,ri],k)=>{ const row=nn+k, ip=idx.get(p), iq=idx.get(q);
        A[ip*N+row]+=1; A[row*N+ip]+=1; A[iq*N+row]-=1; A[row*N+iq]-=1; A[row*N+row]-=ri; b[row]=val; });
      for(const [d,s,g,dev] of this.nl){
        const id=idx.get(d), is=idx.get(s), ig=idx.get(g), vds=v[id]-v[is], vgs=v[ig]-v[is], h=1e-5;
        const i0=dev.current(vds,vgs);
        const gds=Math.max(1e-12,(dev.current(vds+h,vgs)-dev.current(vds-h,vgs))/(2*h));
        const gm=(dev.current(vds,vgs+h)-dev.current(vds,vgs-h))/(2*h);
        sg(id,is,gds);
        A[id*N+ig]+=gm; A[is*N+ig]-=gm; A[id*N+is]-=gm; A[is*N+is]+=gm;
        const ieq=i0-gds*vds-gm*vgs; b[id]-=ieq; b[is]+=ieq;
      }
      const x=gsolve(A,b,N); let step=0;
      for(let i=0;i<nn;i++){ let nv=x[i]; const dd=nv-v[i]; if(Math.abs(dd)>0.35) nv=v[i]+0.35*Math.sign(dd);
        step=Math.max(step,Math.abs(nv-v[i])); v[i]=nv; }
      if(!this.nl.length||step<1e-10) break;
    }
    const out=new Map(); names.forEach((n,i)=>out.set(n,v[i])); return out;
  }
}
function gsolve(A,b,N){
  for(let c=0;c<N;c++){
    let p=c, m=Math.abs(A[c*N+c]);
    for(let r=c+1;r<N;r++){ const q=Math.abs(A[r*N+c]); if(q>m){ m=q; p=r; } }
    if(m<1e-18){ A[c*N+c]+=1e-12; p=c; }
    if(p!==c){ for(let k=0;k<N;k++){ const t=A[c*N+k]; A[c*N+k]=A[p*N+k]; A[p*N+k]=t; } const t=b[c]; b[c]=b[p]; b[p]=t; }
    const pv=A[c*N+c];
    for(let r=c+1;r<N;r++){ const fct=A[r*N+c]/pv; if(!fct) continue;
      for(let k=c;k<N;k++) A[r*N+k]-=fct*A[c*N+k]; b[r]-=fct*b[c]; }
  }
  const x=new Float64Array(N);
  for(let r=N-1;r>=0;r--){ let s=b[r]; for(let k=r+1;k<N;k++) s-=A[r*N+k]*x[k]; x[r]=s/A[r*N+r]; }
  return x;
}

const LW=1200, LH=720;
const toBench=(u,v)=>[ST.pos.sheet.x+u*K, ST.pos.sheet.y+v*K];
const toSheet=(x,y)=>[(x-ST.pos.sheet.x)/K, (y-ST.pos.sheet.y)/K];
function stairW(r,v){ const R=r===1?R1:R2, i=Math.floor((v-R.v0)/SEG_V); return (i>=0&&i<8)?R.w(i):0; }
function tapRect(r,t){ const w=stairW(r,t.v)||8;
  return r===1? [14,t.v-2.6,R1.u+w/2+2,t.v+2.6] : [R2.u-w/2-2,t.v-2.6,388,t.v+2.6]; }
function tapsSorted(r){ return ST.taps[r].slice().sort((a,b)=>a.v-b.v); }
function tapLetter(r,id){ const s=tapsSorted(r), i=s.findIndex(t=>t.id===id); return "ABCDEFGHIJKLMN"[(r===1?0:7)+i]; }
/* breadboard holes */
const holeXY=(c,r)=>[ST.pos.board.x+60+c*13, ST.pos.board.y+52+r*13];
const jumperEnd=j=>[ST.pos.board.x+118+(j.col-4.5)*19, ST.pos.board.y+146];
const leadTip=k=>{ const o={"A+":18,"A-":42,"B+":82,"B-":106}[k]; return [ST.pos.holder.x+198, ST.pos.holder.y+o]; };
const METER_JACK={red:[75,252], black:[120,252]};
const probeRest=c=>[ST.pos.meter.x+(c==="red"?18:18), ST.pos.meter.y+(c==="red"?298:318)];

/* where an alligator clip or a probe touches */
function anchorXY(a){
  if(a.t==="s") return toBench(a.u,a.v);
  if(a.t==="b") return leadTip(a.k);
  if(a.t==="j") return jumperEnd(ST.jumpers.find(j=>j.id===a.id));
  return [0,0];
}
function anchorAlive(a){
  if(a.t==="s"){ if(!ST.on.sheet) return false; if(a.net.startsWith("tp")) return ST.taps[1].concat(ST.taps[2]).some(t=>"tp"+t.id===a.net); return true; }
  if(a.t==="b") return ST.on.holder;
  if(a.t==="j") return ST.on.board&&ST.jumpers.some(j=>j.id===a.id);
  return false;
}
function sameAnchor(a,b){ if(!a||!b||a.t!==b.t) return false; if(a.t==="s") return Math.hypot(a.u-b.u,a.v-b.v)<6; if(a.t==="b") return a.k===b.k; return a.id===b.id; }
function anchorAt(p){
  if(ST.on.board) for(const j of ST.jumpers){ const e=jumperEnd(j); if(Math.hypot(p[0]-e[0],p[1]-e[1])<9) return {t:"j",id:j.id,net:"bb"+j.c}; }
  if(ST.on.holder) for(const k of ["A+","A-","B+","B-"]){ const e=leadTip(k); if(Math.hypot(p[0]-e[0],p[1]-e[1])<10) return {t:"b",k,net:k}; }
  if(ST.on.sheet){
    const [u,v]=toSheet(p[0],p[1]);
    for(const r of [1,2]) for(const t of ST.taps[r]){ const q=tapRect(r,t), w=stairW(r,t.v);
      const outside=r===1? u<R1.u-w/2-1 : u>R2.u+w/2+1;
      if(outside&&u>=q[0]-1&&u<=q[2]+1&&v>=q[1]-3&&v<=q[3]+3) return {t:"s",u,v:t.v,net:"tp"+t.id}; }
    for(const [net,u0,v0,u1,v1] of SIL) if(u>=u0-1&&u<=u1+1&&v>=v0-1&&v<=v1+1&&(u1-u0>6)) return {t:"s",u,v,net};
  }
  return null;
}
function anchorName(a){
  const t=d().term;
  if(a.net.startsWith("tp")){ const id=+a.net.slice(2), r=ST.taps[1].some(x=>x.id===id)?1:2; return t.tap(tapLetter(r,id)); }
  if(a.t==="b") return t.lead[a.k];
  if(a.t==="j"){ const j=ST.jumpers.find(x=>x.id===a.id); return t.jp(j?j.c+1:"?"); }
  if(/^T\d/.test(a.net)) return t.rt(a.net[1],a.net[2]==="a");
  return t[a.net]||a.net;
}

/* ══════════════════════════════════════════════════════════════
   5.  THE CIRCUIT
   ══════════════════════════════════════════════════════════════ */
let guess=new Map(), meterRead=null;
function netRoot(){
  const par=new Map(), f=a=>{ if(!par.has(a)) par.set(a,a); while(par.get(a)!==a){ par.set(a,par.get(par.get(a))); a=par.get(a); } return a; };
  for(const c of ST.cables){ const ra=f(c.a.net), rb=f(c.b.net); if(ra!==rb) par.set(ra,rb); }
  return f;
}
function solveCircuit(){
  const n=netRoot(), ck=new Ckt();
  if(ST.on.sheet){
    for(const r of [1,2]){
      const s=tapsSorted(r), kk=r===1?sheet.k1:sheet.k2, end=r===1?"V":"W";
      let prev=n("Z"), q0=0;
      s.forEach((t,i)=>{ const q=sheet.sq(r,t.v), node="r"+r+"_"+i; ck.R(prev,node,Math.max(1e-3,(q-q0)*kk)); ck.R(n("tp"+t.id),node,t.rc); prev=node; q0=q; });
      ck.R(prev,n(end),(sheet.sq(r,1e9)-q0)*kk);
    }
    ["1","2","3"].forEach((i,k)=>ck.R(n("T"+i+"a"),n("T"+i+"b"),sheet.RT[k]*(1+4e-4*gauss())));
    ck.NL(n("D"),n("Z"),n("G"),tft); ck.R(n("G"),n("Z"),1e8);
    const RL=rlOhm(); if(RL) ck.R(n("D"),n("VIN"),RL);
  }
  if(ST.on.holder&&ST.batt){ ck.V(n("A+"),n("A-"),VBAT[0],0.4); ck.V(n("B+"),n("B-"),VBAT[1],0.4); }
  if(ST.on.board&&ST.jfet){ const c=ST.jfet.c, g=n("bb"+c), s=n("bb"+(c+1)), dn=n("bb"+(c+2));
    ck.NL(dn,s,g,jfet); ck.R(g,s,1e9); }
  const D=DIAL[ST.dial], pr=ST.probe; let info=null;
  if(ST.on.meter&&D.m!=="OFF"&&pr.red&&pr.black){
    const r=n(pr.red.net), b=n(pr.black.net);
    if(r===b) info={same:true};
    else if(D.m==="V"){ ck.R(r,b,VOLT_RIN); info={r,b}; }
    else if(D.m==="A"){ if(ST.fuse) ck.R(r,b,D.ri); info={r,b}; }
    else { const Rs=D.fs*D.sc; ck.V(r,b,1.0,Rs); info={r,b,Rs}; }
  }
  let v=new Map();
  try{ v=ck.solve(guess); }catch(e){ v=new Map(); }
  guess=v; volt=v;
  meterRead=null;
  if(info){
    if(info.same) meterRead=0;
    else { const vr=(v.get(info.r)||0)-(v.get(info.b)||0);
      if(D.m==="V") meterRead=vr;
      else if(D.m==="A"){ if(!ST.fuse) meterRead=0; else { meterRead=vr/D.ri; if(Math.abs(meterRead)>FUSE_A){ ST.fuse=false; meterRead=0; say("blown"); } } }
      else { const I=(1.0-vr)/info.Rs; meterRead=I>1e-15? vr/I : Infinity; } }
  }
  if(ST.on.sheet){ const vg=(v.get(n("G"))||0)-(v.get(n("Z"))||0); return vg; }
  return 0;
}
function rlOhm(){ return ST.rl>=1? RL_K/Math.pow(ST.rl,1.35) : 0; }
const RL_K=2.6e6*jit(0.05);
function meterText(){
  const D=DIAL[ST.dial];
  if(!ST.on.meter||D.m==="OFF") return {txt:"",u:""};
  if(meterRead===null){ return {txt:D.m==="O"?"1":(0).toFixed(D.dec),u:D.u,left:D.m==="O"}; }
  const step=Math.pow(10,-D.dec), top=D.fs===500?500:1999*step;
  let val=meterRead/D.sc;
  if(!isFinite(val)) return {txt:"1",u:D.u,left:true};
  val+=gauss()*step*0.35;
  if(Math.abs(val)>top+step/2) return {txt:val>0?"1":"-1",u:D.u,left:true};
  val=Math.round(val/step)*step;
  let s=Math.abs(val).toFixed(D.dec); if(val<0&&Math.abs(val)>=step/2) s="-"+s;
  return {txt:s,u:D.u};
}

const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,monospace";
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function vgrad(x,y,h,stops){ const g=ctx.createLinearGradient(x,y,x,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }

/* ── cables, clips and probes ── */
function clip(x,y,ang,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  fillR(4,-4.5,20,9,3,col,"rgba(0,0,0,.5)",0.8);
  ctx.fillStyle="#c7c9cc"; ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(6,-4.5); ctx.lineTo(6,4.5); ctx.lineTo(-3,3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#7d8085"; ctx.lineWidth=0.8; ctx.stroke(); ctx.restore();
}
function cablePath(a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy), sag=24+L*0.18;
  return [a, [a[0]+dx*0.25, a[1]+dy*0.25+sag], [a[0]+dx*0.75, a[1]+dy*0.75+sag], b]; }
function drawCable(a,b,col){
  const p=cablePath(a,b);
  ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=4.5; ctx.beginPath(); ctx.moveTo(p[0][0]+2,p[0][1]+3);
  ctx.bezierCurveTo(p[1][0]+2,p[1][1]+3,p[2][0]+2,p[2][1]+3,p[3][0]+2,p[3][1]+3); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(...p[0]); ctx.bezierCurveTo(...p[1],...p[2],...p[3]); ctx.stroke();
  clip(a[0],a[1],Math.atan2(p[1][1]-a[1],p[1][0]-a[0]),col); clip(b[0],b[1],Math.atan2(p[2][1]-b[1],p[2][0]-b[0]),col);
}
function bez(p,t){ const m=1-t; return [m*m*m*p[0][0]+3*m*m*t*p[1][0]+3*m*t*t*p[2][0]+t*t*t*p[3][0], m*m*m*p[0][1]+3*m*m*t*p[1][1]+3*m*t*t*p[2][1]+t*t*t*p[3][1]]; }
function probeTip(c){ const a=ST.probe[c]; return a&&anchorAlive(a)? anchorXY(a) : probeRest(c); }
function drawProbe(c,tip,lying){
  const col=c==="red"?"#c8241e":"#1b1b1b", ang=lying?0:(c==="red"?-2.2:-0.95);
  const ux=Math.cos(ang), uy=Math.sin(ang), hx=tip[0]+ux*62, hy=tip[1]+uy*62;
  const jk=METER_JACK[c], jx=ST.pos.meter.x+jk[0], jy=ST.pos.meter.y+jk[1];
  ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(hx,hy);
  ctx.bezierCurveTo(hx+ux*60,hy+uy*60+40,jx,jy+70,jx,jy); ctx.stroke();
  ctx.save(); ctx.translate(tip[0],tip[1]); ctx.rotate(ang);
  ctx.fillStyle="#d2d4d7"; ctx.fillRect(0,-1.2,14,2.4);
  fillR(14,-4.5,10,9,2,col); fillR(22,-6,6,12,2,col); fillR(27,-4.5,35,9,4,col,"rgba(0,0,0,.4)",0.7);
  ctx.restore();
}

/* ── the bench ── */
function spot(k,p){ const s=SZ[k]; return {x:Math.round(Math.max(0,Math.min(LW-s.w,p[0]-s.w/2))), y:Math.round(Math.max(0,Math.min(LH-s.h,p[1]-s.h/2)))}; }
function fits(k,pos){
  const s=SZ[k];
  for(const o of PLACE){ if(o===k||!ST.on[o]) continue; const q=ST.pos[o], t=SZ[o];
    if(pos.x<q.x+t.w+6&&pos.x+s.w+6>q.x&&pos.y<q.y+t.h+6&&pos.y+s.h+6>q.y) return false; }
  return true;
}
function drawItem(k){ const p=ST.pos[k];
  if(k==="sheet") drawSheet(p.x,p.y); else if(k==="meter") drawMeter(p.x,p.y,1,lcd);
  else if(k==="holder") drawHolder(p.x,p.y); else drawBoard(p.x,p.y); }
function drawBench(){
  wood();
  for(const k of ["sheet","board","holder","meter"]) if(ST.on[k]){
    const mv=hand&&hand.move&&hand.k===k; if(mv) ctx.globalAlpha=fits(k,ST.pos[k])?0.85:0.4; drawItem(k); ctx.globalAlpha=1; }
  if(hand&&PLACE.includes(hand.k)&&!hand.move){ const keep=ST.pos[hand.k]; ST.pos[hand.k]=spot(hand.k,mouse);
    ctx.globalAlpha=fits(hand.k,ST.pos[hand.k])?0.7:0.35; drawItem(hand.k); ctx.globalAlpha=1; ST.pos[hand.k]=keep; }
  ST.cables.forEach(c=>drawCable(anchorXY(c.a),anchorXY(c.b),c.col));
  if(ST.on.meter) for(const c of ["black","red"]){
    if(hand&&hand.k==="probe"&&hand.c===c) drawProbe(c,mouse,false);
    else { const a=ST.probe[c]; drawProbe(c,probeTip(c),!(a&&anchorAlive(a))); } }
  drawHand();
  if(overBench&&(!hand||hand.k==="cable"||hand.k==="probe")){ const a=anchorAt(mouse);
    if(a){ const s=anchorName(a); ctx.font="12px "+FONT; const w=ctx.measureText(s).width+12;
      fillR(mouse[0]+12,mouse[1]-26,w,19,4,"rgba(20,22,26,.85)"); text(s,mouse[0]+18,mouse[1]-16.5,"#ffe9a8",12); } }
}
function drawHand(){
  if(!hand) return; const [x,y]=mouse;
  if(hand.k==="cable"){ if(hand.a) drawCable(anchorXY(hand.a),[x,y],hand.col); else clip(x,y,0.6,hand.col); return; }
  if(["batt","jfet","jumper","pen","pencil","eraser"].includes(hand.k)){ ctx.save(); ctx.globalAlpha=0.9; icon(hand.k,x,y,hand.k==="batt"?0.8:1,true); ctx.restore(); }
}

    case "holder": fillR(-24,-18,48,36,4,"#1b1b1d","#000"); for(let i=0;i<4;i++) fillR(-21+i*11.5,-15,9,30,2,"#0d0d0e","#333");
      ctx.strokeStyle="#c8241e"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(24,-8); ctx.lineTo(34,-12); ctx.stroke(); ctx.strokeStyle="#111"; ctx.beginPath(); ctx.moveTo(24,8); ctx.lineTo(34,12); ctx.stroke(); break;
    case "batt": for(let i=0;i<4;i++){ fillR(-22+i*11,-20,9,40,3,hgrad(-22+i*11,0,9,[[0,"#3b2a10"],[0.45,"#d4a52a"],[1,"#5a4012"]])); ctx.fillStyle="#b7261e"; ctx.fillRect(-22+i*11,-12,9,8); } break;
    case "board": fillR(-26,-18,52,36,4,"#22379a","#0f1a55"); fillR(-16,-12,32,24,2,"#f1efe7"); ctx.fillStyle="#555"; for(let i=0;i<5;i++) for(let j=0;j<3;j++) ctx.fillRect(-12+i*6,-7+j*6,2,2); break;
    case "jfet": ctx.strokeStyle="#bbb"; ctx.lineWidth=1.5; for(const dx of [-5,0,5]){ ctx.beginPath(); ctx.moveTo(dx,0); ctx.lineTo(dx,16); ctx.stroke(); }

      fillR(-26,-4,46,8,3,"#1f7a52","#0f3d29"); ctx.fillStyle="#d8dadd"; ctx.fillRect(-32,-1.5,7,3); fillR(20,-4.5,10,9,2,"#e8e8e8"); break;

  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════
   7.  THE PARTS BOX AND THE CLOSE UP
   ══════════════════════════════════════════════════════════════ */
const trayCv=$("tray"), trayCtx=trayCv.getContext("2d"), closeCv=$("closeCv"), closeCtx=closeCv.getContext("2d"), benchCtx=ctx;
const TRAY_LIST=["sheet","meter","holder","batt","board","jfet","jumper","cable","pen","pencil","eraser"], TROW=46;
let TRW=190, TRH=600, CLW=900, CLH=300, trayCells=[];
function cablesLeft(){ return 10-ST.cables.length-(hand&&hand.k==="cable"?1:0); }
function jumpersLeft(){ return 3-ST.jumpers.length-(hand&&hand.k==="jumper"?1:0); }
function trayAvail(k){
  if(hand&&hand.k===k&&k!=="cable"&&k!=="jumper") return false;
  if(PLACE.includes(k)) return !ST.on[k]; if(k==="batt") return !ST.batt; if(k==="jfet") return !ST.jfet;
  if(k==="cable") return cablesLeft()>0; if(k==="jumper") return jumpersLeft()>0; return true;
}
function layout(){
  const w=cv.clientWidth||1000, dpr=Math.min(window.devicePixelRatio||1,2);
  S=w/LW; cv.width=Math.round(w*dpr); cv.height=Math.round(LH*S*dpr); cv.style.height=(LH*S)+"px";
  benchCtx.setTransform(dpr*S,0,0,dpr*S,0,0);
  const tdpr=window.devicePixelRatio||1, tr=trayCv.parentElement.getBoundingClientRect();
  TRW=Math.max(150,Math.floor(tr.width-16)); TRH=TRAY_LIST.length*TROW+50;
  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  CLW=Math.max(300,Math.floor(closeCv.parentElement.getBoundingClientRect().width-20)); CLH=Math.round(CLW*0.36);
  closeCv.style.height=CLH+"px"; closeCv.width=Math.round(CLW*tdpr); closeCv.height=Math.round(CLH*tdpr);
  drawTray();
}
function drawTray(){
  const dpr=window.devicePixelRatio||1, c=trayCtx, t=d();
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[]; let y=6; const wd=TRW-12;
  for(const k of TRAY_LIST){
    const av=trayAvail(k), sel=hand&&hand.k===k;
    c.fillStyle=av?"#1f242b":"#171a1e"; c.fillRect(6,y,wd,TROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TROW-5);
    const old=ctx; ctx=c; ctx.save(); ctx.globalAlpha=av?1:0.35; icon(k,28,y+(TROW-4)/2,0.62); ctx.restore(); ctx=old;
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=av?"#e8eef2":"#868e96"; c.fillText(itemName(k),52,y+14);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a";
    const sub=k==="cable"?t.left(cablesLeft()):k==="jumper"?t.left(jumpersLeft()):(av?t.trayTake:t.trayOut);
    c.fillText(sub,52,y+30); trayCells.push([k,y,y+TROW-4]); y+=TROW;
  }
  c.font='10.5px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
let trayDrag=false;
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){
    if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k&&!hand.move;
    if(hand) returnHand();
    if(same||!trayAvail(k)){ drawTray(); return; }
    hand={k}; if(k==="cable") hand={k,a:null,col:CAB_COL[ST.cables.length%CAB_COL.length]};
    say(k==="pen"?"penTake":k==="pencil"?"pencilTake":k==="eraser"?"eraserTake":k==="cable"?"cable1":"picked",itemName(k));
    drawTray(); return;
  }
});
function drawClose(){
  const dpr=window.devicePixelRatio||1, c=closeCtx;
  c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#15181d"; c.fillRect(0,0,CLW,CLH);
  const h=CLH-16, sc=h/284;
  if(ST.on.meter){ const old=ctx; ctx=c; c.setTransform(dpr,0,0,dpr,0,0); drawMeter(8,8,sc,lcd); ctx=old; }
  else { c.fillStyle="#69717a"; c.font='12px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.fillText(d().noMeter,8+75*sc,CLH/2); }
  /* a magnifier on the bench around the pointer */
  const x0=8+150*sc+24, w=Math.min(CLW-x0-8,h*1.6), z=2.6;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#0f1115"; c.fillRect(x0,8,w,h);
  if(overBench){ const sw=w/z, sh=h/z, sx=Math.max(0,Math.min(LW-sw,mouse[0]-sw/2)), sy=Math.max(0,Math.min(LH-sh,mouse[1]-sh/2)), k=cv.width/LW;
    c.imageSmoothingEnabled=true; c.drawImage(cv,sx*k,sy*k,sw*k,sh*k,x0,8,w,h); }
  c.strokeStyle="#353b43"; c.lineWidth=1; c.strokeRect(x0+0.5,8.5,w-1,h-1);
  c.fillStyle="rgba(21,24,29,.8)"; c.fillRect(x0+1,9,170,20);
  c.fillStyle="#9aa3ab"; c.font='11px "Malgun Gothic",sans-serif'; c.textAlign="left"; c.textBaseline="middle"; c.fillText(d().lens,x0+8,19);
}

/* ══════════════════════════════════════════════════════════════
   8.  HANDS ON THE BENCH
   ══════════════════════════════════════════════════════════════ */
const near=(p,q,r)=>Math.hypot(p[0]-q[0],p[1]-q[1])<r;
const inItem=(k,p)=>ST.on[k]&&p[0]>=ST.pos[k].x&&p[0]<=ST.pos[k].x+SZ[k].w&&p[1]>=ST.pos[k].y&&p[1]<=ST.pos[k].y+SZ[k].h;
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function holeAt(p){
  if(!ST.on.board) return null;
  for(let c=0;c<10;c++) for(let r=0;r<5;r++){ const h=holeXY(c,r); if(Math.abs(p[0]-h[0])<6.5&&Math.abs(p[1]-h[1])<6.5) return {c,r}; }
  return null;
}
function holeUsed(c,r){ if(ST.jfet&&ST.jfet.r===r&&c>=ST.jfet.c&&c<=ST.jfet.c+2) return true; return ST.jumpers.some(j=>j.c===c&&j.r===r); }
function dropAnchors(test){
  ST.cables=ST.cables.filter(c=>!(test(c.a)||test(c.b)));
  for(const c of ["red","black"]) if(ST.probe[c]&&test(ST.probe[c])) ST.probe[c]=null;
}
function returnItem(k){
  ST.on[k]=false;
  if(k==="sheet") dropAnchors(a=>a.t==="s");
  if(k==="holder"){ dropAnchors(a=>a.t==="b"); ST.batt=false; }
  if(k==="board"){ dropAnchors(a=>a.t==="j"); ST.jfet=null; ST.jumpers=[]; }
  if(k==="meter"){ ST.probe.red=null; ST.probe.black=null; }
  say("back",itemName(k));
}
function returnHand(){
  if(!hand) return;
  if(hand.move) ST.pos[hand.k]=hand.orig;
  hand=null; rubbing=false;
}
function rubAt(p){ const [u,v]=toSheet(p[0],p[1]); return ST.on.sheet&&u>=RL_ZONE[0]-7&&u<=RL_ZONE[2]+7&&v>=RL_ZONE[1]&&v<=RL_ZONE[3]; }
function rub(len){            /* len: path length along the strip, in figure units */
  const n=len/(RL_ZONE[3]-RL_ZONE[1]);
  if(hand.k==="pencil") ST.rl+=n; else ST.rl=Math.max(0,ST.rl-0.8*n);
}

function benchClick(p,right){
  if(hand) return handClick(p,right);
  if(right){
    for(let i=ST.cables.length-1;i>=0;i--){ const c=ST.cables[i], q=cablePath(anchorXY(c.a),anchorXY(c.b));
      for(let s=0;s<=24;s++) if(near(p,bez(q,s/24),8)){ ST.cables.splice(i,1); say("unplug"); return; } }
    for(const c of ["red","black"]) if(ST.on.meter&&ST.probe[c]&&anchorAlive(ST.probe[c])&&near(p,probeTip(c),12)){ ST.probe[c]=null; say("probeOff"); return; }
    for(const j of ST.jumpers) if(ST.on.board&&near(p,jumperEnd(j),9)){ dropAnchors(a=>a.t==="j"&&a.id===j.id); ST.jumpers=ST.jumpers.filter(x=>x!==j); say("back",itemName("jumper")); return; }
    if(ST.jfet&&near(p,holeXY(ST.jfet.c+1,ST.jfet.r-1),14)){ ST.jfet=null; say("back",itemName("jfet")); return; }
    if(ST.batt&&inItem("holder",p)&&p[0]<ST.pos.holder.x+140){ ST.batt=false; say("back",itemName("batt")); return; }
    for(const k of ["meter","holder","board","sheet"]) if(inItem(k,p)){ returnItem(k); return; }
    return;
  }
  for(const c of ["red","black"]) if(ST.on.meter&&near(p,probeTip(c),12)){ ST.probe[c]=null; hand={k:"probe",c}; say("probe",d().probeName[c]); return; }
  for(let i=ST.cables.length-1;i>=0;i--){ const c=ST.cables[i];
    for(const [e,o] of [[c.a,c.b],[c.b,c.a]]) if(near(p,anchorXY(e),8)){ ST.cables.splice(i,1); hand={k:"cable",a:o,col:c.col}; say("cable2"); return; } }
  if(ST.on.meter&&near(p,meterDial(),40)){ turnDial(p[0]<meterDial()[0]?-1:1); return; }
  if(ST.jfet&&near(p,holeXY(ST.jfet.c+1,ST.jfet.r-1),14)){ ST.jfet=null; hand={k:"jfet"}; say("picked",itemName("jfet")); return; }
  for(const j of ST.jumpers) if(ST.on.board&&near(p,jumperEnd(j),9)){ dropAnchors(a=>a.t==="j"&&a.id===j.id); ST.jumpers=ST.jumpers.filter(x=>x!==j); hand={k:"jumper"}; say("picked",itemName("jumper")); return; }
  for(const k of ["meter","holder","board","sheet"]) if(inItem(k,p)){ hand={k,move:true,orig:{...ST.pos[k]},off:[p[0]-ST.pos[k].x-SZ[k].w/2,p[1]-ST.pos[k].y-SZ[k].h/2]}; say("moveIt",itemName(k)); return; }
}
function handClick(p,right){
  const k=hand.k, t=d();
  if(PLACE.includes(k)){
    if(right){ const mv=hand.move; returnHand(); say(mv?"stays":"back",itemName(k)); return; }
    const pos=hand.move? ST.pos[k] : spot(k,p);
    if(!fits(k,pos)){ say("noFit"); return; }
    ST.pos[k]=pos; if(!hand.move) ST.on[k]=true; hand=null; say("placed",itemName(k)); return;
  }
  if(right){ if(k==="probe"){ hand=null; say("probeOff"); return; } returnHand(); say("back",itemName(k)); return; }
  if(k==="batt"){
    if(!ST.on.holder){ say("needHolder"); return; }
    if(!inItem("holder",p)||p[0]>ST.pos.holder.x+140){ say("battWhere"); return; }
    ST.batt=true; hand=null; say("battIn"); return;
  }
  if(k==="jfet"||k==="jumper"){
    if(!ST.on.board){ say("needBoard"); return; }
    const h=holeAt(p); if(!h){ say(k==="jfet"?"jfetWhere":"jumperWhere"); return; }
    if(k==="jfet"){ const c=Math.min(h.c,7); if([0,1,2].some(i=>holeUsed(c+i,h.r))){ say("holeBusy"); return; }
      ST.jfet={c,r:h.r}; hand=null; say("jfetIn"); return; }
    if(holeUsed(h.c,h.r)){ say("holeBusy"); return; }
    ST.jumpers.push({id:++ST.tapN,c:h.c,r:h.r,col:h.c}); hand=null; say("jumperIn",h.c+1); return;
  }
  if(k==="cable"){
    const a=anchorAt(p); if(!a){ say("noTerm"); return; }
    if(!hand.a){ hand.a=a; say("cable2"); return; }
    if(sameAnchor(a,hand.a)){ say("same"); return; }
    ST.cables.push({a:hand.a,b:a,col:hand.col}); say("plugged",anchorName(hand.a),anchorName(a)); hand=null; return;
  }
  if(k==="probe"){
    const a=anchorAt(p); if(!a){ say("noTerm"); return; }
    ST.probe[hand.c]=a; say("probeOn",d().probeName[hand.c]); hand=null; return;
  }
  if(k==="pen"){
    if(!ST.on.sheet){ say("penWhere"); return; }
    const [u,v]=toSheet(p[0],p[1]);
    let r=0;
    if(Math.abs(u-R1.u)<26&&v>R1.v0+4&&v<R1.v0+8*SEG_V-4) r=1;
    else if(Math.abs(u-R2.u)<26&&v>R2.v0+4&&v<R2.v0+8*SEG_V-6) r=2;
    if(!r){ say("penWhere"); return; }
    if(ST.taps[r].length>=7){ say("penFull"); return; }
    if(ST.taps[r].some(q=>Math.abs(q.v-v)<9)){ say("penClose"); return; }
    ST.taps[r].push({id:++ST.tapN,v:Math.round(v*2)/2,rc:Math.max(15,45+12*gauss())});
    say("penLine",r,ST.taps[r].length); return;
  }
  if(k==="pencil"||k==="eraser"){ if(rubAt(p)) rub(6); else say("rlWhere"); }
}
function turnDial(dir){ ST.dial=(ST.dial+dir+DIAL.length)%DIAL.length; const D=DIAL[ST.dial];
  say("knob",D.m==="OFF"?"OFF":(D.m==="O"?"Ω ":D.m==="A"?"A⎓ ":"V⎓ ")+D.lab); lcdT=0; }

cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; rubbing=false; });
cv.addEventListener("pointermove",e=>{
  const p=lpos(e);
  if(rubbing&&hand&&lastRub){ if(rubAt(p)&&rubAt(lastRub)) rub(Math.hypot(p[0]-lastRub[0],p[1]-lastRub[1])/K); lastRub=p; }
  mouse=p;
  if(hand&&hand.move){ ST.pos[hand.k]=spot(hand.k,[p[0]-hand.off[0],p[1]-hand.off[1]]); }
});
cv.addEventListener("pointerdown",e=>{
  const p=lpos(e); mouse=p;
  if(e.button===0&&hand&&(hand.k==="pencil"||hand.k==="eraser")&&rubAt(p)){ rubbing=true; lastRub=p; cv.setPointerCapture(e.pointerId); return; }
  benchClick(p,e.button===2); drawTray();
});
cv.addEventListener("pointerup",()=>{ if(rubbing){ rubbing=false; say(hand.k==="pencil"?"rubbed":"erased"); } });
window.addEventListener("mouseup",e=>{
  if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); }
  trayDrag=false; });
cv.addEventListener("wheel",e=>{ const p=lpos(e);
  if(ST.on.meter&&near(p,meterDial(),44)){ e.preventDefault(); turnDial(e.deltaY>0?1:-1); } },{passive:false});
closeCv.addEventListener("click",e=>{ if(!ST.on.meter) return; const r=closeCv.getBoundingClientRect(), sc=(CLH-16)/284;
  const x=(e.clientX-r.left-8)/sc, y=(e.clientY-r.top-8)/sc; if(Math.hypot(x-75,y-168)<56) turnDial(x<75?-1:1); });
closeCv.addEventListener("wheel",e=>{ if(!ST.on.meter) return; const r=closeCv.getBoundingClientRect(), sc=(CLH-16)/284;
  const x=(e.clientX-r.left-8)/sc, y=(e.clientY-r.top-8)/sc; if(Math.hypot(x-75,y-168)<56){ e.preventDefault(); turnDial(e.deltaY>0?1:-1); } },{passive:false});

/* ══════════════════════════════════════════════════════════════
   9.  PANEL
   ══════════════════════════════════════════════════════════════ */
function advance(dt,vgs){ let left=dt; while(left>0){ const h=Math.min(left,0.5); tft.advance(h,vgs); left-=h; }
  ST.t+=dt; if(ST.swRun) ST.sw+=dt; }
const fmt=t=>Math.floor(t/60)+":"+(t%60).toFixed(1).padStart(4,"0");
$("swBtn").onclick=()=>{ ST.swRun=!ST.swRun; renderPanel(); };
$("swLap").onclick=()=>{ ST.laps.unshift(fmt(ST.sw)); ST.laps=ST.laps.slice(0,8); renderPanel(); };
$("swReset").onclick=()=>{ ST.sw=0; ST.laps=[]; renderPanel(); };
$("fuseBtn").onclick=()=>{ if(ST.fuse){ say("fuseOk"); return; } ST.fuse=true; advance(120,vgsNow); say("fuseNew"); };
$("unwire").onclick=()=>{ ST.cables=[]; if(hand&&hand.k==="cable") hand=null; say("unwired"); drawTray(); };
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,5,20]){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===speed?"on":"";
    b.onclick=()=>{ speed=s; renderSpeeds(); }; box.appendChild(b); } }
function renderPanel(){ const t=d(); $("swBtn").textContent=ST.swRun?t.stop:t.start;
  $("laps").innerHTML=ST.laps.map((s,i)=>"<div>"+t.lap+" "+(ST.laps.length-i)+" · "+s+"</div>").join(""); }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.sheet) L.push([t.st.none,false]);
  if(!ST.fuse) L.push([t.st.fuse,true]);
  if(ST.on.holder&&!ST.batt) L.push([t.st.noBatt,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-meter").textContent=t.hMeter; $("fuseBtn").textContent=t.fuse; $("t-meterhint").textContent=t.meterHint;
  $("t-h-wire").textContent=t.hWire; $("t-wirehint").textContent=t.wireHint; $("unwire").textContent=t.unwire;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2018 E1 — 종이 트랜지스터 · HaslaLab":"IPhO 2018 E1 — Paper Transistor · HaslaLab";
  renderPanel(); renderSpeeds(); renderStatus(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   10.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let tPrev=performance.now()/1000, frame=0, vgsNow=0, lcd={txt:"",u:""}, lcdT=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  advance(dt*speed,vgsNow);
  vgsNow=solveCircuit();
  lcdT-=dt; if(lcdT<=0){ lcd=meterText(); lcdT=0.33; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  $("swLbl").textContent=fmt(ST.sw);
  if(++frame%3===0) drawClose();
  if(frame%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
