<script>
/* NBPhO 2009 problem 4 "Black box" on the 3-D bench.  Three outlets; inside, three resistors joined in a
   star or a triangle (the official solution shows the measurements cannot tell which).  Here they are in
   a star, 100 Ω, 140 Ω and 470 Ω at outlets 1, 2 and 3, as the solution's first reading; with the
   battery across two outlets the voltmeter between each of them and the third gives the ratios.  The
   voltmeter's own resistance (10 MΩ) and the cells' internal resistance are in the circuit. */
var PROGRAM = {
  title: { ko: 'NBPhO 2009 실험 4 — 블랙박스', en: 'NBPhO 2009 Problem 4 — Black box' },
  subtitle: { ko: '단자 셋의 블랙박스 속에 저항 셋이 알 수 없는 방식으로 연결되어 있고, 가장 작은 것이 R₁ = 100 Ω 입니다. 가장 큰 저항 R₃ 을 구하고, 중간 저항 R₂ 에 대해 무엇을 말할 수 있는지 밝히세요. 불확도도 어림하세요.',
              en: 'Inside the black box with three outlets there are three resistors joined in an unknown way; the smallest is R₁ = 100 Ω. Find the largest, R₃. What can be said about the middle one, R₂? Estimate the uncertainties.' },
  notes: { ko: [
    '장비: 단자 셋의 블랙박스, 전지, 전압계 (문제지 그대로) — 전류계도 저항계도 없습니다.',
    '공식 해답: 전지를 두 단자에 대고 전압계로 나머지 단자와의 전압 둘을 재면 저항의 비가 나옵니다. 별 연결과 삼각 연결은 이 측정으로 구별되지 않아 R₂ 는 둘 중 하나로 남습니다.',
    '상자 속은 별 연결(단자 1–100 Ω, 2–140 Ω, 3–470 Ω 쯤)이고 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Equipment: the black box with three outlets, a battery and a voltmeter (as on the sheet) — no ammeter, no ohmmeter.',
    'Official solution: with the battery across two outlets, the two voltages to the third outlet give the ratio of resistances. A star and a triangle cannot be told apart this way, so R₂ stays one of two values.',
    'The box holds a star (outlet 1 – about 100 Ω, 2 – 140 Ω, 3 – 470 Ω); the values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 1, 2, 3 의 블랙박스, 전지 세 개짜리 전지함, 전압계, 도선.', en: 'On the desk: the black box with outlets 1, 2 and 3, a holder of three cells, a voltmeter and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '전압계: 클릭해서 가까이 본 뒤 다이얼 (V⎓) — VΩ 와 COM 잭'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Voltmeter: click it to look closer, then the dial (V⎓) — the VΩ and COM jacks'] },
  notePlaceholder: { ko: '예) 전지 1–3: V₁₂ = 0.81 V, V₂₃ = 3.80 V', en: 'e.g. battery on 1–3: V₁₂ = 0.81 V, V₂₃ = 3.80 V' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R = [100 * (1 + S.sys('r1', 0.02)), 140 * (1 + S.sys('r2', 0.03)), 470 * (1 + S.sys('r3', 0.03))], E = 1.5 * (1 + S.sys('E', 0.02));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: 0, R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 6 }), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 0.2], ['V', 2], ['V', 20], ['V', 200]];
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.3, pitch: 0.85, k: 14, tx: 2, ty: 0, tz: 2 },
      views: { dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 10, ty: 3.4, tz: 2, title: { ko: '전압계', en: 'Voltmeter' } } },
      frame: function (b) {
        B3.desk(-32, 36, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-14, 2], [{ name: '1', col: '#d8d8d8', label: '1' }, { name: '2', col: '#d8d8d8', label: '2' }, { name: '3', col: '#d8d8d8', label: '3' }], { label: 'NBPhO 2009 · 4', w: 15 });
        var cell = B3.cells(b, leads, 'bat', [-2, 13], { n: 3, e: E, r: 0.35 });
        var m = B3.dmm(b, 'dmm', [10, 2], dm, leads, { ranges: RANGES, model: 'VOLTMETER' });
        c.reset(); c.R(T['1'], 'box.o', R[0]); c.R(T['2'], 'box.o', R[1]); c.R(T['3'], 'box.o', R[2]);
        cell.stamp(c); m.stamp(c); leads.wire(c); c.solve(0.05); m.read(c);
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
