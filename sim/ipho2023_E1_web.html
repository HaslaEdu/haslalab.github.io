<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row button{flex:1;text-align:center;min-width:0}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);
        border:1px solid var(--line);border-radius:6px;padding:6px 0;color:#e8eef2;letter-spacing:.04em}
  .laps{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa3ab;max-height:130px;overflow:auto;margin-top:4px}
</style>
</head>

    <p class="hint" id="t-pshint"></p>

  </aside>
</div>

/* ══════════════════════════════════════════════════════════════
   1.  RANDOM AND PHYSICS  (the same oscillator as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2023e1)>>>0);
const U=(a,b)=>a+(b-a)*rnd();
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const G0=9.80, DC_A_PER_V=1.00, AC_A_PER_V=0.106;
const K={ M:U(14.1,14.9)*1e-3, m:U(7.35,7.65)*1e-3, k:U(138,150), BL:U(0.680,0.712), df0:U(0.26,0.33),
          z0:U(12.3,13.2)*1e-3, gap0:U(1.4,6.6), swap:rnd()<0.5 };
K.kp=K.k*U(1.010,1.045); K.BpLp=K.BL*U(0.78,0.95); K.alpha=4*Math.PI*K.M*K.df0; K.ze=K.z0+K.M*G0/K.k;
const OSC={amp:0, phase:0};
const gap=()=>K.gap0+0.8*ST.shim-0.8*ST.shimMag;
/* the radial field is uniform within ±3 mm of the magnet pair's centre: outside, BL falls off */
const blFactor=()=>{ const g=gap(); return g<0.3?0.2:Math.exp(-Math.pow(Math.max(0,Math.abs(g-4)-1)/2.6,4)); };
const hung=()=>ST.fixed&&ST.oscIn;
const mTot=()=>K.M+ST.N*K.m;
const freq=()=>Math.max(0.5,ST.coarse+ST.fine);
function psOn(){ return ST.on.ps&&ST.psPower&&ST.holders.every(h=>h.on&&h.n===4&&h.plug); }
function out(pair){ for(const c of ST.crimps){ if(c.a===pair&&c.b) return c.b; if(c.b===pair&&c.a) return c.a; } return null; }
function mOut(){ const o=out("Mpost"); return ST.leads.M&&(o==="DC"||o==="AC")?o:null; }
function cOut(){ const o=out("Cpost"); return ST.leads.C&&(o==="DC"||o==="AC")?o:null; }
function iDC(){ if(!psOn()||ST.mode!=="DC"||mOut()!=="DC") return 0; return ((K.swap!==ST.mSwap)?-1:1)*DC_A_PER_V*ST.vdc; }
function iACamp(coil){ if(!psOn()||ST.mode!=="AC") return 0; const o=coil==="main"?mOut():cOut(); return o==="AC"?Math.SQRT2*AC_A_PER_V*ST.vac:0; }
const forceAmp=()=>(K.BL*iACamp("main")+K.BpLp*iACamp("ctrl"))*blFactor();
function zEq(){ return K.ze-mTot()*G0/K.k+K.BL*blFactor()*iDC()/K.k; }
function ampSteady(){ const F=forceAmp(); if(F<=0||!hung()) return 0; const w=2*Math.PI*freq(); return F/Math.hypot(K.kp-mTot()*w*w,K.alpha*w); }
function oscStep(dt){ const tg=ampSteady(), tau=Math.max(2*mTot()/K.alpha,1e-3);
  OSC.amp+=(tg-OSC.amp)*(1-Math.exp(-dt/tau)); OSC.phase=(OSC.phase+2*Math.PI*freq()*dt)%(2*Math.PI); }
const emfRms=()=>2*Math.PI*freq()*OSC.amp*K.BL*blFactor()/Math.SQRT2;
/* the multimeter, terminal pairs as in the Python edition */
function dmmRead(){
  const mode=ST.dial, a=ST.clip.red, b=ST.clip.black;
  if(mode==="OFF"||!ST.on.dmm) return null;
  const q=(v,st,nd)=>(Math.round(v/st)*st).toFixed(nd);
  if(!a||!b||a===b) return mode==="Hz"?"0.00":"0.000";
  const has=(x,y)=>(a===x&&b===y)||(a===y&&b===x);
  if(has("DCmon","DCGND")){ if(mode!=="DCV") return "0.000"; const v=(psOn()&&ST.mode==="DC")?Math.abs(ST.vdc):0; return q(Math.max(0,v+2.5e-4*gauss()),1e-3,3); }
  if(has("ACmon","ACGND")){ if(mode!=="ACV") return "0.000"; const v=(psOn()&&ST.mode==="AC")?ST.vac:0; return q(Math.max(0,v+2.5e-4*gauss()),1e-3,3); }
  if(has("Fmon","ACGND")){ if(mode!=="Hz") return "0.000"; if(!(psOn()&&ST.mode==="AC"&&ST.vac>0.004)) return "0.00"; return q(freq()+6e-3*gauss(),1e-2,2); }
  if(has("M+","M-")&&ST.leads.M){
    if(mode==="ACV"){ if(cOut()==="AC"&&!mOut()) return q(Math.max(0,emfRms()+3e-4*gauss()),1e-3,3);
      if(mOut()==="AC"&&psOn()&&ST.mode==="AC") return q(Math.max(0,1.06*ST.vac+1e-3*gauss()),1e-3,3); return "0.000"; }
    if(mode==="DCV") return q(Math.max(0,Math.abs(iDC())*1.9+5e-4*gauss()),1e-3,3);
    return "0.00"; }
  if(has("C+","C-")&&ST.leads.C){ if(mode==="ACV"&&cOut()==="AC"&&psOn()&&ST.mode==="AC") return q(Math.max(0,1.06*ST.vac+1e-3*gauss()),1e-3,3); return "0.000"; }
  return mode==="Hz"?"0.00":"0.000";
}

    const k=hand.k;
    if(right){
      if(k==="shim"&&ST.on.base){ if(ST.fixed&&near(c,[ST.pos.base.x+MAG[0]-4.6,ST.pos.base.y+MAG[1]-4.1],2.5)&&ST.shim>0){ ST.shim--; say("shimOut"); return; }
        if(near(c,[ST.pos.base.x+MAG[0],ST.pos.base.y+MAG[1]],2.8)&&ST.shimMag>0&&!ST.fixed){ ST.shimMag--; say("shimOut"); return; } }
      if(k==="weights"&&onOsc(c)&&ST.N>0){ ST.N--; say("weightOff",ST.N); return; }
      returnHand(); return; }
    if(k==="hplug"){ const t2=termAt(c,["CN1","CN2"],1.6);
      if(t2){ if(ST.holders.some((h,j)=>j!==hand.i&&h.plug===t2)){ say("wrong"); return; } ST.holders[hand.i].plug=t2; say("plugged",itemName("holder"),t2); hand=null; return; }
      hand=null; say("unplug"); return; }
    if(k==="clip"){ const t2=termAt(c,[...TERM_PS,...TERM_POST],1.1);
      if(t2){ ST.clip[hand.c]=t2; say("clipped",d().term[t2]); hand=null; return; } hand=null; say("unplug"); return; }
    if(k==="lead"){ const pr=pairAt(c);
      if(pr===(hand.which==="M"?"Mpost":"Cpost")){ ST.leads[hand.which]=true; say("leads",d().term[hand.which+"lead"]); hand=null; return; }
      say("wrong"); return; }
    if(k==="crimp"){ const pr=pairAt(c); if(!pr){ say("noUse"); return; }
      if(!hand.a){ hand.a=pr; say("crimp2"); return; }
      const post=x=>x==="Mpost"||x==="Cpost";
      if(post(pr)===post(hand.a)){ say("wrong"); return; }
      if(ST.crimps.some(w=>w.a===pr||w.b===pr)){ say("wrong"); return; }
      ST.crimps.push({a:hand.a,b:pr}); say("plugged",d().term[hand.a],d().term[pr]); hand=null; return; }
    if(TOOLS.includes(k)) return useTool(k,c);
    if(PLACE.includes(k)){
      if(k==="osc"&&onSupport(c)&&!ST.fixed){ if(ST.bands<4){ say("needBands"); return; } ST.oscIn=true; ST.on.osc=false; hand=null; say("oscIn"); return; }
      if(k==="mirror"&&ST.on.riser&&near(c,[ST.pos.riser.x,ST.pos.riser.y],4)){ ST.mirrorOn=true; ST.on.mirror=true; hand=null; say("mirrorOn"); return; }
      const pos={x:c[0],y:c[1]}; if(overlap(k,pos)){ say("noFit"); return; }
      ST.pos[k]=pos; ST.on[k]=true; if(k.startsWith("holder")) ST.holders[+k.slice(-1)-1].on=true;
      if(k==="mirror") ST.mirrorOn=false;
      say("placed",itemName(k)); hand=null; return; }
    return;
  }
  if(right){
    for(let i=ST.crimps.length-1;i>=0;i--){ const w=ST.crimps[i]; if(near(c,termXY(w.a),1.6)||near(c,termXY(w.b),1.6)){ ST.crimps.splice(i,1); say("unplug"); return; } }
    for(const cc of ["red","black"]) if(ST.clip[cc]&&near(c,clipXY(cc),1.0)){ ST.clip[cc]=null; say("unplug"); return; }
    for(let i=0;i<2;i++) if(ST.holders[i].plug&&near(c,holderPlug(i),1.0)){ ST.holders[i].plug=null; say("unplug"); return; }
    for(const L of ["M","C"]) if(ST.leads[L]&&pairAt(c)===(L+"post")){ ST.leads[L]=false; say("unplug"); return; }
    if(ST.fixed&&onSupport(c)){ unfix(); return; }
    if(ST.on.osc&&onOsc(c)){ returnItem("osc"); return; }
    for(const k of ["mirror","riser","dmm","holder1","holder2","ps","support","base"]) if(inItem(k,c)&&!(k==="mirror"&&ST.mirrorOn&&!near(c,[ST.pos.riser.x,ST.pos.riser.y],3))){ if(k==="mirror"&&ST.mirrorOn){ returnItem("mirror"); return; } returnItem(k); return; }
    return;
  }
  for(const cc of ["red","black"]) if(ST.on.dmm&&near(c,clipXY(cc),0.9)){ ST.clip[cc]=null; hand={k:"clip",c:cc}; say("clip"); return; }
  for(let i=0;i<2;i++) if(ST.holders[i].on&&near(c,holderPlug(i),0.9)){ ST.holders[i].plug=null; hand={k:"hplug",i}; say("plug",itemName("holder")); return; }
  if(hung()) for(const L of ["M","C"]){ if(!ST.leads[L]&&near(c,leadTag(L),1.0)){ hand={k:"lead",which:L}; say("plug",d().term[L+"lead"]); return; } }
  if(ST.leads.M&&pairAt(c)==="Mpost"){ ST.mSwap=!ST.mSwap; say("swapLeads"); return; }
  if(ST.on.ps){ if(near(c,termXY("power"),1.2)){ ST.psPower=!ST.psPower; say("sw","POWER "+(ST.psPower?"ON":"OFF")); return; }
    if(near(c,termXY("mode"),1.2)){ ST.mode=ST.mode==="DC"?"AC":"DC"; say("sw",ST.mode); return; } }
  if(ST.on.dmm&&near(c,at("dmm",0,0.6),2.2)){ cycleDial(1); return; }
  if(ST.oscIn&&!ST.fixed&&onOsc(c)){ ST.oscIn=false; hand={k:"osc"}; say("picked",itemName("osc")); return; }
  if(ST.on.osc&&onOsc(c)){ hand={k:"osc",move:true,orig:{...ST.pos.osc}}; ST.on.osc=false; say("moveIt",itemName("osc")); return; }
  if(ST.mirrorOn&&near(c,[ST.pos.riser.x,ST.pos.riser.y],2.5)){ ST.mirrorOn=false; ST.on.mirror=false; hand={k:"mirror"}; say("picked",itemName("mirror")); return; }
  for(const k of ["dmm","holder1","holder2","ps","riser","mirror","support","base"]) if(inItem(k,c)&&!(k==="support"&&ST.fixed)){
    if(k==="base"&&ST.fixed) return;
    hand={k,move:true,orig:{...ST.pos[k]}}; ST.on[k]=false; if(k.startsWith("holder")) ST.holders[+k.slice(-1)-1].on=false; say("moveIt",itemName(k)); return; }
}
function useTool(k,c){
  if(k==="screw"){ if(!ST.on.base||!inItem("base",c)){ say("noUse"); return; } if(!ST.on.support||ST.fixed){ say("needSupport"); return; }
    ST.fixed=true; say("fixed"); return; }
  if(k==="band"){ if(!onSupport(c)){ say("noUse"); return; } if(ST.fixed){ say("bandFixed"); return; } if(ST.bands>=4){ say("bandMax"); return; } ST.bands++; say("band",ST.bands); return; }
  if(k==="shim"){ if(!ST.on.base){ say("noUse"); return; } if(shimsLeft()<=0){ say("shimNone"); return; }
    if(near(c,[ST.pos.base.x+MAG[0],ST.pos.base.y+MAG[1]],2.8)&&!ST.fixed){ ST.shimMag++; say("shimDown",ST.shimMag); return; }
    if(near(c,[ST.pos.base.x+MAG[0],ST.pos.base.y+MAG[1]],2.8)&&ST.fixed&&!near(c,[ST.pos.base.x+MAG[0]-4.6,ST.pos.base.y+MAG[1]-4.1],2.5)){ say("shimMagFixed"); return; }
    if(ST.fixed&&(near(c,[ST.pos.base.x+MAG[0]-4.6,ST.pos.base.y+MAG[1]-4.1],2.5)||near(c,[ST.pos.base.x+MAG[0]+4.6,ST.pos.base.y+MAG[1]+4.1],2.5))){ ST.shim++; say("shimUp",ST.shim); return; }
    say("noUse"); return; }
  if(k==="marker"){ if(!onOsc(c)){ say("noUse"); return; } if(ST.marker){ say("markerAgain"); return; } ST.marker=true; say("marker"); return; }
  if(k==="batt"){ for(let i=0;i<2;i++) if(inItem("holder"+(i+1),c)){ const h=ST.holders[i]; if(h.n>=4){ say("battFull"); return; } h.n++; say("batt",h.n); return; } say("noUse"); return; }
  if(k==="weights"){ if(!(hung()&&onOsc(c))){ say("noUse"); return; } if(ST.N>=5){ say("weightMax"); return; } ST.N++; say("weightOn",ST.N); return; }
}
const DIALS=["OFF","DCV","ACV","Hz"];
function cycleDial(s){ ST.dial=DIALS[(DIALS.indexOf(ST.dial)+s+4)%4]; say("dial",ST.dial); }
function bumpKnob(key,s,fine){
  const st={coarse:0.25,fineK:0.01,acvol:0.004,dcvol:0.005}[key]*(fine?0.2:1);
  if(key==="coarse") ST.coarse=Math.max(5,Math.min(25,ST.coarse+s*st));
  if(key==="fineK") ST.fine=Math.max(-0.6,Math.min(0.6,ST.fine+s*st));
  if(key==="acvol") ST.vac=Math.max(0,Math.min(0.4,ST.vac+s*st));
  if(key==="dcvol") ST.vdc=Math.max(0,Math.min(1.2,ST.vdc+s*st));
  say("knob");
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
cv.addEventListener("wheel",e=>{ const c=cm(lpos(e)), s=e.deltaY<0?1:-1;
  if(ST.on.ps) for(const k of ["coarse","fineK","acvol","dcvol"]) if(near(c,termXY(k),1.5)){ e.preventDefault(); bumpKnob(k,s,e.shiftKey); return; }
  if(ST.on.dmm&&near(c,at("dmm",0,0.6),2.2)){ e.preventDefault(); cycleDial(s); } },{passive:false});
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k&&!hand.move; if(hand) returnHand();
    if(!same&&trayAvail(k)){ hand={k}; if(k==="crimp") say("crimp1"); else say(TOOLS.includes(k)?"tool":"picked",itemName(k)); } drawTray(); return; } });
/* the close up: the board's switches and knobs, the multimeter selector */
let drag=null;
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const inP=(P,p)=>p[0]>=P.x&&p[0]<=P.x+P.w&&p[1]>=P.y&&p[1]<=P.y+P.h;
function psLocal(p){ return [(p[0]-P2.cx)/P2.s,(p[1]-P2.cy)/P2.s]; }
function knobAt(u){ for(const k of ["coarse","fineK","acvol","dcvol"]) if(near(u,PSL[k],1.6)) return k; return null; }
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ if(e.button!==0) return; const p=clpos(e);
  if(P2.s&&inP(P2,p)){ const u=psLocal(p);
    if(near(u,PSL.power,1.3)){ ST.psPower=!ST.psPower; say("sw","POWER "+(ST.psPower?"ON":"OFF")); return; }
    if(near(u,PSL.mode,1.3)){ ST.mode=ST.mode==="DC"?"AC":"DC"; say("sw",ST.mode); return; }
    const k=knobAt(u); if(k){ drag={k,y0:p[1]}; closeCv.setPointerCapture(e.pointerId); } return; }
  if(P3.s&&inP(P3,p)){ const u=[(p[0]-P3.cx)/P3.s,(p[1]-P3.cy)/P3.s-0.6];
    if(Math.hypot(u[0],u[1])<3.6){ const a=Math.atan2(u[0],-u[1])*180/Math.PI; let best="OFF", bd=1e9;
      for(const [m,aa] of [["OFF",-90],["DCV",-45],["ACV",0],["Hz",45]]) if(Math.abs(a-aa)<bd){ bd=Math.abs(a-aa); best=m; }
      ST.dial=best; say("dial",best); } } });
closeCv.addEventListener("pointermove",e=>{ const p=clpos(e);
  if(drag){ const dy=drag.y0-p[1]; if(Math.abs(dy)>=3){ bumpKnob(drag.k,Math.sign(dy),e.shiftKey); drag.y0=p[1]; } return; }
  let hot=false; if(P2.s&&inP(P2,p)){ const u=psLocal(p); hot=!!knobAt(u)||near(u,PSL.power,1.3)||near(u,PSL.mode,1.3); }
  if(P3.s&&inP(P3,p)) hot=true; closeCv.style.cursor=hot?"pointer":"default"; });
closeCv.addEventListener("pointerup",()=>{ drag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), s=e.deltaY<0?1:-1;
  if(P2.s&&inP(P2,p)){ const k=knobAt(psLocal(p)); if(k){ e.preventDefault(); bumpKnob(k,s,e.shiftKey); } }
  if(P3.s&&inP(P3,p)){ e.preventDefault(); cycleDial(s); } },{passive:false});

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const [lab,v] of [["1×",false],[d().slow,true]]){ const b=document.createElement("button"); b.textContent=lab; b.className=ST.slow===v?"on":"";
    b.onclick=()=>{ ST.slow=v; renderSpeeds(); }; box.appendChild(b); } }
$("unwire").onclick=()=>{ ST.crimps=[]; ST.clip.red=ST.clip.black=null; if(hand&&(hand.k==="crimp"||hand.k==="clip")) hand=null; say("unwired"); drawTray(); };
let dcOn=0;
function renderStatus(){
  const L=[], t=d();
  if(!PLACE.some(k=>ST.on[k])) L.push([t.st.none,false]);
  if(ST.on.ps&&ST.psPower&&!psOn()) L.push([t.st.noBatt,false]);
  if(dcOn>180) L.push([t.st.hot,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-asm").textContent=t.hAsm; $("t-asmhint").textContent=t.asmHint; $("t-h-ps").textContent=t.hPs; $("t-pshint").textContent=t.psHint; $("unwire").textContent=t.unwire;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2023 E1 — 질량 측정 · HaslaLab":"IPhO 2023 E1 — Mass Measurement · HaslaLab";
  renderSpeeds(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  oscStep(dt*(ST.slow?0.05:1));
  dcOn=Math.abs(iDC())>0.05? dcOn+dt : 0;
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
