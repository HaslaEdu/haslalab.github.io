<script>
/* NBPhO 2008 problem 10 "Glass plate" on the 3-D bench — the solution's first setup.  The lens brings the
   laser beam to a focus and lets it spread, so the plate receives a fan of incidence angles; the beams
   reflected from its two surfaces differ in path by 2nd·cos β and draw straight fringes on the screen.
   One fringe is a change of incidence δα with δ(2nd·cos β) = λ, and the spacing on the screen is a = L·δα,
   L being the path from the focus over the plate to the screen.  Without the lens the spot is too small to
   show more than a fringe.  n = 1.52, d ≈ 0.20 mm (the official value). */
var PROGRAM = {
  title: { ko: 'NBPhO 2008 실험 10 — 유리판', en: 'NBPhO 2008 Problem 10 — Glass plate' },
  subtitle: { ko: '장비: 레이저(λ = 650 nm), 얇은 유리판(스탠드에 고정 — 날카롭고 깨지기 쉬우니 만지지 마세요), 렌즈, 자. 유리판의 두께를 구하고 불확도를 어림하세요. 실험 장치의 도식을 그리세요.',
              en: 'Equipment: a laser (λ = 650 nm), a thin glass plate (fixed to a stand — its edges are sharp and it breaks easily, do not touch the glass), a lens and a ruler. Find the thickness of the plate and estimate the uncertainty. Draw the scheme of your setup.' },
  notes: { ko: [
    '공식 해답의 첫째 방법: 렌즈로 빛을 퍼뜨려 유리판 두 면의 반사광이 화면에서 간섭하게 합니다. 무늬 하나는 경로차 2nd·cos β 가 λ 만큼 바뀌는 입사각 변화 δα 이고, 화면의 간격은 a = L·δα (L 은 초점에서 유리판을 거쳐 화면까지의 길이).',
    '그래서 d = Lλ·n cos β / (2a sin α cos α), sin β = sin α / n. (해답 본문의 식은 경로 |AB| 를 잘못 써서 계수가 다릅니다 — 여기서는 정확한 2nd·cos β 로 계산합니다.) n 은 약 1.5 로 두거나 브루스터 각으로 잴 수 있습니다.',
    '렌즈 받침에 초점 거리 f = 3.0 cm 가 적혀 있습니다. 해답의 두께는 d ≈ 0.20 mm 이고, 값은 방문할 때마다 조금 다릅니다.'], en: [
    'The official solution\'s first setup: spread the beam with the lens so that the reflections from the plate\'s two faces interfere on the screen. One fringe is the change of incidence δα that changes the path difference 2nd·cos β by λ, and the spacing on the screen is a = L·δα (L the path from the focus over the plate to the screen).',
    'So d = Lλ·n cos β / (2a sin α cos α), sin β = sin α / n. (The solution\'s text takes the path |AB| wrongly and gets another factor — here the exact 2nd·cos β is used.) Take n ≈ 1.5 or measure it by Brewster\'s angle.',
    'The lens holder is marked f = 3.0 cm. The solution found d ≈ 0.20 mm; the value differs a little from visit to visit.'] }
};

var LAB = { lens: true, lx: 5, al: 45, s: 60 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 레이저, 렌즈 받침(f = 3.0 cm), 각도판 위 스탠드에 고정한 유리판, 모눈 화면, 들어오는 빛 아래의 50 cm 자(유리판 축이 50 cm), 유리판에서 시작해 반사된 빛을 따라 놓인 1 m 줄자.',
           en: 'On the desk: the laser, the lens on its holder (f = 3.0 cm), the glass plate fixed to a stand on a protractor, a graph-paper screen, a 50 cm ruler under the incoming beam (the plate\'s axis at 50 cm) and a 1 m tape from the plate along the reflected beam.' },
  howto: { ko: ['렌즈 끌기: 빛을 따라 옮기기 · 클릭: 빛 속에 넣기 / 빼기',
                '유리판(스탠드) 좌우로 끌기 또는 휠: 돌려서 입사각 α 바꾸기 · 각도판은 클릭해서 가까이',
                '화면 끌기: 반사된 빛을 따라 옮기기 · 클릭: 화면 가까이 (모눈 1 mm, 휠로 확대)'],
           en: ['Drag the lens: move it along the beam · click: put it in the beam / take it out',
                'Drag the plate (stand) left/right or roll the wheel: turn it to change the incidence α · click the protractor to look closer',
                'Drag the screen: move it along the reflected beam · click: look at it closely (1 mm grid, wheel to zoom)'] },
  notePlaceholder: { ko: '예) α = 45°, 유리판 50.0 cm, 렌즈 28.0 cm(초점 31.0 cm → 19.0 cm), 화면 60.0 cm → L = 79.0 cm; 10 간격 = 34 mm', en: 'e.g. α = 45°, plate at 50.0 cm, lens at 28.0 cm (focus 31.0 cm → 19.0 cm), screen 60.0 cm → L = 79.0 cm; 10 spacings = 34 mm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var d = 0.020 * (1 + S.sys('d', 0.06)), n = 1.52, lam = 6.5e-5, f = 3.0 * (1 + S.sys('f', 0.02)), BH = 12, PX = 20, SW = 16, SH = 10;
    var rulerIn = B3.scaleTex(50, { horiz: true, width: 2.6, bg: '#e9eef2', label: 'cm' }), tape = B3.scaleTex(100, { horiz: true, width: 2.6, bg: '#f2d33c', label: 'cm' });
    var prot = (function () { var c = document.createElement('canvas'); c.width = c.height = 400; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#eef0f2'; g.beginPath(); g.arc(200, 200, 198, 0, 7); g.fill(); g.strokeStyle = '#222'; g.fillStyle = '#222'; g.font = '700 15px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      for (var i = 0; i < 360; i++) { var a = i * Math.PI / 180, r1 = i % 10 === 0 ? 160 : i % 5 === 0 ? 172 : 180; g.lineWidth = i % 10 === 0 ? 2 : 1;
        g.beginPath(); g.moveTo(200 - Math.cos(a) * r1, 200 - Math.sin(a) * r1); g.lineTo(200 - Math.cos(a) * 196, 200 - Math.sin(a) * 196); g.stroke();
        if (i % 10 === 0) { var lab = i <= 180 ? i : 360 - i; g.fillText(String(lab), 200 - Math.cos(a) * 143, 200 - Math.sin(a) * 143); } }
      return c; })();
    var glass = (function () { var c = document.createElement('canvas'); c.width = c.height = 8; c._static = true; var g = c.getContext('2d'); g.fillStyle = '#bfdde4'; g.fillRect(0, 0, 8, 8); return c; })();
    var scr = document.createElement('canvas'); scr.width = 480; scr.height = 300; var sg = scr.getContext('2d'), key = '';
    function drawScreen(L, w, lensIn, a0) {
      var k2 = [L.toFixed(2), w.toFixed(3), lensIn, a0.toFixed(5)].join(); if (k2 === key) return; key = k2;
      var img = sg.createImageData(480, 300), D = img.data, px = 480 / SW, col = new Float32Array(480), row = new Float32Array(300);
      for (var i = 0; i < 480; i++) { var u = (i + 0.5) / px - SW / 2, al = a0 + u / L, sb = Math.sin(al) / n, cb = Math.sqrt(1 - sb * sb);
        col[i] = Math.exp(-2 * u * u / (w * w)) * (1 + 0.96 * Math.cos(4 * Math.PI * n * d * cb / lam)); }
      for (var j = 0; j < 300; j++) { var v = (j + 0.5) / px - SH / 2; row[j] = Math.exp(-2 * v * v / (w * w)); }
      for (j = 0; j < 300; j++) for (i = 0; i < 480; i++) { var I = Math.min(1, col[i] * row[j] * 0.55), q = (j * 480 + i) * 4;
        var mm = (i % 3 === 0 || j % 3 === 0) ? 0.06 : 0, cm = (i % 30 === 0 || j % 30 === 0) ? 0.16 : 0, g0 = 0.96 - mm - cm;
        D[q] = Math.min(255, 255 * (g0 * (1 - I) + I)); D[q + 1] = Math.min(255, 255 * g0 * (1 - I) + 40 * I); D[q + 2] = Math.min(255, 255 * g0 * (1 - I) + 30 * I); D[q + 3] = 255; }
      sg.putImageData(img, 0, 0);
    }
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, wheelIds: ['plate'],
      home: { yaw: -0.5, pitch: 0.75, k: 5.2, tx: 5, ty: 5, tz: -25 },
      views: {
        screen: { yaw: 0, pitch: 0, k: 45, tx: 0, ty: BH, tz: 0, title: { ko: '화면', en: 'The screen' },
                  hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · Esc: back' } },
        prot: { yaw: 0, pitch: 1.5, k: 40, tx: PX, ty: 2, tz: 0, title: { ko: '각도판 (위에서)', en: 'The protractor (from above)' } },
        ruler: { yaw: 0, pitch: 1.3, k: 30, tx: 0, ty: 0, tz: 5, title: { ko: '들어오는 빛 쪽의 자', en: 'The ruler along the incoming beam' } }
      },
      frame: function (b) {
        if (b.clicked('m:lens')) LAB.lens = !LAB.lens;
        var ml = b.moved('lens'); if (ml[0]) LAB.lx = Math.max(-25, Math.min(PX - 6, LAB.lx + ml[0]));
        var mp = b.screenMoved('plate'), wp = b.wheel('plate'); if (mp[0] || wp) LAB.al = Math.max(15, Math.min(75, LAB.al + mp[0] * 0.6 + wp * 0.2));
        if (b.clicked('c:prot')) b.go('prot');
        var a = LAB.al * Math.PI / 180, r = [-Math.cos(2 * a), 0, -Math.sin(2 * a)], e1 = [-r[2], 0, r[0]];
        var ms = b.moved('screen'); if (ms[0] || ms[1]) LAB.s = Math.max(12, Math.min(110, LAB.s + ms[0] * r[0] + ms[1] * r[2]));
        var sx = PX + r[0] * LAB.s, sz = r[2] * LAB.s;
        if (sz < -78) { LAB.s = -78 / r[2]; sx = PX + r[0] * LAB.s; sz = -78; }
        if (sx < -42) { LAB.s = (-42 - PX) / r[0]; sx = -42; sz = r[2] * LAB.s; }
        var P = [PX, BH, 0];
        B3.desk(-45, 60, -85, 20);
        /* the laser */
        B3.cylAB([-40, BH, 0], [-30, BH, 0], 1.3, '#2b2f35', { seg: 18 }); B3.box3(-38, -32, 0, BH - 1.2, -2, 2, '#3a3f46', { top: '#474c55' });
        B3.cylAB([-30, BH, 0], [-29.6, BH, 0], 0.5, '#111', { seg: 12 });
        /* the ruler along the incoming beam: 0 under the laser's front, the plate's axis at 50 cm */
        B3.tex3(rulerIn, 0, 0, rulerIn.width, rulerIn.height, [PX - 50.5, 0.02, 1.4], [51, 0, 0], [0, 0, 2.6], { id: 'c:ruler' });
        if (b.clicked('c:ruler')) b.go('ruler');
        /* the lens */
        var lz = LAB.lens ? 0 : 9;
        B3.box3(LAB.lx - 1.5, LAB.lx + 1.5, 0, 0.8, lz - 2, lz + 2, '#3a3f46', { id: 'm:lens', top: '#474c55' });
        B3.cyl3('y', 0.8, BH - 2, LAB.lx, lz, 0.35, '#c3c8cd', { id: 'm:lens', seg: 10 });
        B3.cyl3('x', LAB.lx - 0.25, LAB.lx + 0.25, BH, lz, 2.0, 'rgba(190,225,240,.85)', { id: 'm:lens', seg: 24, cap: 'rgba(205,235,245,.8)' });
        B3.text3([LAB.lx - 1.3, 0.81, lz + 1.8], [1, 0, 0], [0, 0, -1], 'f=3.0', 0.55, '#e8e8e8', { weight: '700' });
        /* the plate on its stand and protractor */
        B3.tex3(prot, 0, 0, 400, 400, [PX - 5, 0.03, -5], [10, 0, 0], [0, 0, 10], { id: 'c:prot' });
        var nrm = [-Math.cos(a), 0, -Math.sin(a)], tg = [-nrm[2], 0, nrm[0]], hide = b.view === 'screen';
        B3.line3([PX, 0.05, 0], [PX + nrm[0] * 4.8, 0.05, nrm[2] * 4.8], '#c0392b', 2.5);
        if (!hide) B3.cyl3('y', 0.03, BH - 2.5, PX - nrm[0] * 0.8, -nrm[2] * 0.8, 0.4, '#9aa0a6', { id: 'm:plate', seg: 10 });
        var pw = 3.0, ph = 5, tk = d * 6;
        if (!hide) B3.tex3(glass, 0, 0, 8, 8, [PX - tg[0] * pw, BH - ph / 2, -tg[2] * pw], [tg[0] * 2 * pw, 0, tg[2] * 2 * pw], [0, ph, 0], { id: 'm:plate' });
        if (!hide) B3.box3(PX - nrm[0] * 0.8 - 0.6, PX - nrm[0] * 0.8 + 0.6, BH - 3, BH - 2, -nrm[2] * 0.8 - 0.6, -nrm[2] * 0.8 + 0.6, '#2b2f35', { id: 'm:plate' });
        if (!hide) B3.line3([PX - tg[0] * pw, BH - ph / 2, -tg[2] * pw], [PX + tg[0] * pw, BH - ph / 2, tg[2] * pw], 'rgba(150,200,210,.9)', 1.5);
        if (!hide) B3.line3([PX - tg[0] * pw, BH + ph / 2, -tg[2] * pw], [PX + tg[0] * pw, BH + ph / 2, tg[2] * pw], 'rgba(150,200,210,.9)', 1.5);
        /* the tape along the reflected beam: 0 at the plate */
        B3.tex3(tape, 0, 0, tape.width, tape.height, [PX + e1[0] * 3 - r[0] * 0.5, 0.02, e1[2] * 3 - r[2] * 0.5], [r[0] * 101, 0, r[2] * 101], [e1[0] * 2.6, 0, e1[2] * 2.6], { id: 'c:tape' });
        /* the screen square to the reflected beam */
        var L = LAB.lens ? (PX - LAB.lx - f) + LAB.s : 1e9, w = LAB.lens ? Math.max(0.2, 0.1 / f * Math.abs(L)) : 0.15 + 0.001 * LAB.s;
        if (LAB.lens && PX - LAB.lx - f < 0.5) w = 0.1 + 0.1 * (LAB.s / 60);
        drawScreen(LAB.lens ? L : 1e6, w, LAB.lens, a);
        B3.box3(sx - 3, sx + 3, 0, 1, sz - 3, sz + 3, '#3a3f46', { id: 'm:screen', top: '#474c55' });
        B3.cyl3('y', 1, BH - SH / 2, sx, sz, 0.4, '#c3c8cd', { id: 'm:screen', seg: 10 });
        var so = [sx - e1[0] * SW / 2 + r[0] * 0.05, BH + SH / 2, sz - e1[2] * SW / 2 + r[2] * 0.05];
        B3.tex3(scr, 0, 0, 480, 300, so, [e1[0] * SW, 0, e1[2] * SW], [0, -SH, 0], { id: 'm:screen' });
        /* the beams */
        var red = 'rgba(255,40,40,.75)';
        if (LAB.lens) { var fx = LAB.lx + f; B3.line3([-29.6, BH, 0], [LAB.lx, BH, 0], red, 1.6);
          [-1, 1].forEach(function (sgn) { var hw = 0.1 / f * (PX - fx);
            B3.line3([LAB.lx, BH + 0.1 * sgn, 0], [fx, BH, 0], 'rgba(255,40,40,.5)', 1);
            B3.line3([fx, BH, 0], [PX, BH + hw * sgn, 0], 'rgba(255,40,40,.35)', 1);
            B3.line3([PX, BH + hw * sgn, 0], [sx, BH + w * sgn, sz], 'rgba(255,40,40,.3)', 1); });
          B3.line3([PX, BH, 0], [sx, BH, sz], 'rgba(255,40,40,.45)', 1.2); }
        else { B3.line3([-29.6, BH, 0], [PX, BH, 0], red, 1.6); B3.line3([PX, BH, 0], [sx, BH, sz], red, 1.4); }
        var V = b.views; V.screen.tx = sx; V.screen.tz = sz; V.screen.yaw = Math.atan2(-r[0], -r[2]);
        V.ruler.tx = (LAB.lx + PX) / 2;
        LAB.state = { L: L, w: w, a: LAB.al, s: LAB.s, d: d, spacing: L * lam * n * Math.sqrt(1 - Math.pow(Math.sin(a) / n, 2)) / (2 * d * Math.sin(a) * Math.cos(a)) };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
