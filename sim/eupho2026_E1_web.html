<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EuPhO 2026 실험 — 음향 부양 · Acoustic Levitation · HaslaLab</title>
<meta name="description" content="EuPhO 2026 실험을 브라우저에서 실행합니다. 초음파 트랜스듀서 배열이 만드는 정상파의 마디에 비드와 액적을 띄우고, 빨간 LED가 스크린에 만드는 확대된 그림자를 투명 자로 재어 진동수, 밀도, 증발, 표면장력, 굴절률을 구합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="EuPhO 2026 실험 — 음향 부양 · Acoustic Levitation">
<meta property="og:description" content="EuPhO 2026 실험: 음향 부양 장치로 띄운 비드와 액적의 그림자 측정.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}

    for(const [dx,lab] of [[110,"VOLTAGE"],[300,"CURRENT"]]){ circ(x0+dx*u,y0+200*u,30*u,"#f2f2f0","#999",1.2); text(lab,x0+dx*u,y0+245*u,"#333",11*Math.max(1,u),"center","700"); }
    hitAdd("knobV",x0+80*u,y0+170*u,60*u,60*u);
    fillR(x0+30*u,y0+275*u,90*u,36*u,6,ST.out?"#3fbf5f":"#2a5a32","#111",1); text(t.lab.out,x0+75*u,y0+293*u,"#fff",11*Math.max(1,u),"center","700"); hitAdd("out",x0+30*u,y0+275*u,90*u,36*u);
    for(const [k,dx,col] of [["Gp",260,"#d0352b"],["Gm",340,"#1b1d20"]]){ circ(x0+dx*u,y0+293*u,16*u,col,"#000",1.5); circ(x0+dx*u,y0+293*u,6*u,"#111"); text(k==="Gp"?"+":"−",x0+dx*u,y0+265*u,"#333",14*Math.max(1,u),"center","800"); hitAdd(k,x0+(dx-20)*u,y0+273*u,40*u,40*u); if(CABSEL===k) circ(x0+dx*u,y0+293*u,22*u,null,"#ff7a2a",3); }
    PW.Gp=[x0+260*u,y0+293*u]; PW.Gm=[x0+340*u,y0+293*u]; }
  if(has("box")){ const x0=520*u, y0=120*u, W=330*u, H=250*u; fillR(x0,y0,W,H,8,"#c9cdd2","#6f757c",1.5); text("EuPhO",x0+20*u,y0+40*u,"#222",30*u,"left","800"); text(t.lab.box+" · 2026",x0+20*u,y0+70*u,"#444",11*Math.max(1,u),"left","600");
    for(const [k,dx,on,lab] of [["swLed",90,ST.redLed,t.lab.led],["swMx",230,ST.modeX,t.lab.mode]]){ const cx=x0+dx*u, cy=y0+130*u; circ(cx,cy,14*u,"#b8bcc2","#666",1); ctx.strokeStyle="#e8eaee"; ctx.lineWidth=7*u; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy+(on?-30:30)*u); ctx.stroke(); ctx.lineCap="butt";
      text(lab,cx,cy-48*u,"#222",12*Math.max(1,u),"center","700"); text(k==="swMx"?(on?"I":"O"):(on?"ON":"OFF"),cx+30*u,cy,"#333",11*Math.max(1,u),"left","700"); hitAdd(k,cx-30*u,cy-45*u,60*u,90*u); }
    for(const [k,dx,col] of [["Fm",110,"#1b1d20"],["Fp",210,"#d0352b"]]){ circ(x0+dx*u,y0+215*u,15*u,col,"#000",1.5); circ(x0+dx*u,y0+215*u,6*u,"#111"); hitAdd(k,x0+(dx-20)*u,y0+195*u,40*u,40*u); if(CABSEL===k) circ(x0+dx*u,y0+215*u,22*u,null,"#ff7a2a",3); }
    PW.Fp=[x0+210*u,y0+215*u]; PW.Fm=[x0+110*u,y0+215*u]; }
  if(has("cables")){ for(const [c,a,b,col] of [["p","Gp","Fp","#c0392b"],["m","Gm","Fm","#1b1d20"]]) if(ST.cab[c]&&PW[a]&&PW[b]){ ctx.strokeStyle=col; ctx.lineWidth=6*u; ctx.beginPath(); ctx.moveTo(...PW[a]); ctx.bezierCurveTo(PW[a][0],PW[a][1]+120*u,PW[b][0],PW[b][1]+120*u,PW[b][0],PW[b][1]); ctx.stroke(); } }
  text(t.lab.cabHint,10,CLH-12,"#c9ced3",10.5,"left"); }
let PW={};
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="scr") drawScr(); else if(tab==="pwr") drawPwr(); else drawLev(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   6.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ return pick3(p[0],p[1])||null; }
let drag=null;
function clearK(k){ ST.on.delete(k);
  if(k==="frame"){ ST.items=[]; ST.on.delete("net"); ST.on.delete("capture"); }
  if(k==="cables"){ ST.cab.p=ST.cab.m=false; }
  if(k==="psu"||k==="box"){ ST.cab.p=ST.cab.m=false; ST.out=false; }
  if(k==="cord") ST.out=false;
  if(k==="leds"||k==="transducer") ST.probe.cfg="none";
  if(k==="ruler") ST.rul.place="screen"; }
const NEEDS={net:["frame"],capture:["frame"],cables:["psu","box"]};
function place(k){ for(const n of NEEDS[k]||[]) if(!has(n)){ say("needFor",itemName(n)); return false; } ST.on.add(k); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item; if(right){ say("back",itemName(k)); hand=null; return; } if(place(k)) hand=null; return; }
  let k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(k==="out"){ if(right) k="psu"; else { toggleOut(); return; } }
  if(right){ clearK(k); say("back",itemName(k)); return; }
  if(k==="watch"){ ST.sw.run=!ST.sw.run; return; }
  if(k==="screen"||k==="ruler"){ setTab("scr"); return; }
  if(k==="psu"||k==="box"||k==="cables"){ setTab("pwr"); return; }
  setTab("lev"); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(120,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
function insertAt(z){ const s=ST.sel, isDrop=["I","II","III"].includes(s);
  const tool=isDrop?"syringes":"tweezers", stock=isDrop?"liquids":{styro:"beadsN",pp:"beadsO",glass:"beadsP"}[s];
  if(!has(tool)){ say("needTool",itemName(tool)); return; } if(!has(stock)){ say("needFor",itemName(stock)); return; }
  const n=Math.round((z-ST.nodeOff)/TRUE.dNode), r=addItem(isDrop?"drop":s,n,isDrop?s:null,ST.dropD*(1+gauss(0,0.04)));
  say(r||"put"); }
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); if(tab==="scr"&&has("ruler")&&ST.rul.place==="screen"){ ST.rul.ang=(ST.rul.ang+(e.deltaY<0?1:-1)*(e.shiftKey?0.2:2)+360)%360; return; }
  if(tab==="pwr"){ const h=hitAt(clpos(e)); if(h&&h.k==="knobV") knob(e.deltaY<0?0.1:-0.1); } },{passive:false});
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const p=cmouse;
  if(cdrag.k==="probe"){ ST.probe.z=Math.max(-17,Math.min(17,(LV.cy-p[1])/LV.k)); return; }
  if(cdrag.k==="rul"){ const m=toMm(p[0],p[1]); ST.rul.x=m[0]-cdrag.d[0]; ST.rul.y=m[1]-cdrag.d[1]; return; }
  if(cdrag.k==="pan"){ SCR.pan=cdrag.v+(p[1]-cdrag.y)/scrGeom().spx; return; }
  if(cdrag.k==="knob"){ const dy=p[1]-cdrag.y; if(Math.abs(dy)>=8){ knob(dy<0?0.1:-0.1); cdrag.y=p[1]; } return; } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2; closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="lev"){ if(!has("frame")) return;
    if(LV.probe&&!right&&p[0]>=LV.probe[0]&&p[0]<=LV.probe[0]+LV.probe[2]&&p[1]>=LV.probe[1]&&p[1]<=LV.probe[1]+LV.probe[3]){ cdrag={k:"probe"}; return; }
    const z=(LV.cy-p[1])/LV.k, x=(p[0]-LV.cx)/LV.k;
    if(right){ const it=alive().find(o=>Math.hypot(o.x-x,o.z-z)<3); if(it){ it.dead=true; say("removed"); } return; }
    if(Math.abs(x)<20&&Math.abs(z)<18) insertAt(z); return; }
  if(tab==="scr"){ if(right){ cdrag={k:"pan",y:p[1],v:SCR.pan}; return; } if(SCR.rul&&ST.rul.place==="screen"&&has("ruler")&&pointIn(SCR.rul,p[0],p[1])){ const m=toMm(p[0],p[1]); cdrag={k:"rul",d:[m[0]-ST.rul.x,m[1]-ST.rul.y]}; return; } cdrag={k:"pan",y:p[1],v:SCR.pan}; return; }
  if(tab==="pwr"&&h){ if(h.k==="out"){ toggleOut(); return; } if(h.k==="swLed"){ if(!has("box")) return; ST.redLed=!ST.redLed; return; } if(h.k==="swMx"){ if(!has("box")) return; ST.modeX=!ST.modeX; return; }
    if(h.k==="knobV"){ cdrag={k:"knob",y:p[1]}; return; }
    if(["Gp","Gm","Fp","Fm"].includes(h.k)){ cabClick(h.k); return; } } });
function cabClick(k){ if(!has("cables")){ say("needFor",itemName("cables")); return; }
  const c=k.endsWith("p")?"p":"m"; if(ST.cab[c]&&(k==="G"+c||k==="F"+c)){ ST.cab[c]=false; say("uncab"); CABSEL=null; return; }
  if(!CABSEL){ CABSEL=k; say("selT",k[0]==="G"?"G "+(c==="p"?"+":"−"):"F "+(c==="p"?"+":"−")); return; }
  const a=CABSEL, b=k; CABSEL=null; if(a[0]===b[0]){ if(a!==b&&ST.out){ ST.shorted=true; say("short"); } return; }
  if(a.slice(1)!==b.slice(1)){ say("wrong"); return; } ST.cab[c]=true; say("cab"); }

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function knob(dv){ if(!need("psu")) return; ST.Uset=Math.max(0,Math.min(20,Math.round((ST.Uset+dv)*10)/10)); }
function toggleOut(){ if(!need("psu")) return; if(!has("cord")){ say("needFor",itemName("cord")); return; } ST.out=!ST.out; if(!ST.out) ST.shorted=false; say(ST.out?"out":"outOff"); }
for(const [id,dv] of [["um1",-1],["um01",-0.1],["up01",0.1],["up1",1]]) $(id).onclick=()=>knob(dv);
$("outBtn").onclick=toggleOut; $("ledBtn").onclick=()=>{ if(!need("box")) return; ST.redLed=!ST.redLed; }; $("mxBtn").onclick=()=>{ if(!need("box")) return; ST.modeX=!ST.modeX; };
const sel=$("selItem"); sel.onchange=()=>{ ST.sel=sel.value; };
$("dm").onclick=()=>{ ST.dropD=Math.max(0.8,Math.round((ST.dropD-0.2)*10)/10); }; $("dp").onclick=()=>{ ST.dropD=Math.min(3.6,Math.round((ST.dropD+0.2)*10)/10); };
$("clrBtn").onclick=()=>{ ST.items=[]; say("cleared"); };
for(const [id,c] of [["pNone","none"],["pOne","one"],["pSame","same"],["pAnti","anti"]]) $(id).onclick=()=>{ if(c!=="none"&&(!need("transducer")||!need("leds"))) return; ST.probe.cfg=c; ST.probe.on=c!=="none"; if(c!=="none") say("probe"); };
for(const [id,dv] of [["bm5",-50],["bm1",-10],["bp1",10],["bp5",50]]) $(id).onclick=()=>{ if(!need("screen")) return; ST.bScr=Math.max(250,Math.min(800,ST.bScr+dv)); };
$("ym").onclick=()=>{ if(!need("hexkeys")) return; ST.ledDy=Math.round((ST.ledDy-0.1)*100)/100; }; $("yp").onclick=()=>{ if(!need("hexkeys")) return; ST.ledDy=Math.round((ST.ledDy+0.1)*100)/100; };
$("rulBtn").onclick=()=>{ if(!need("ruler")) return; ST.rul.place=ST.rul.place==="screen"?"lev":"screen"; };
$("swGo").onclick=()=>{ if(!need("watch")) return; ST.sw.run=!ST.sw.run; }; $("swLap").onclick=()=>{ if(!need("watch")) return; ST.sw.laps.push(ST.sw.t); say("lap"); }; $("swRst").onclick=()=>{ ST.sw.run=false; ST.sw.t=0; ST.sw.laps=[]; };
for(const [id,s] of [["sp1",1],["sp10",10],["sp30",30]]) $(id).onclick=()=>{ ST.speed=s; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  $("gV").textContent=!has("psu")?"—":(has("cord")&&ST.out?ST.Uset.toFixed(1)+" V":"OFF ("+ST.Uset.toFixed(1)+" V)");
  $("outBtn").textContent=ST.out?t.outOff:t.outOn; $("outBtn").className=ST.out?"on":"";
  $("ledBtn").textContent=ST.redLed?t.ledOn:t.ledOff; $("mxBtn").textContent=ST.modeX?t.mxOn:t.mxOff; $("mxBtn").className=ST.modeX?"on":"";
  $("dropV").textContent=t.dropV(ST.dropD.toFixed(1)); if(sel.value!==ST.sel) sel.value=ST.sel;
  for(const [id,c] of [["pNone","none"],["pOne","one"],["pSame","same"],["pAnti","anti"]]) $(id).className=ST.probe.cfg===c?"on":"";
  $("geoV").textContent=t.geoV((ST.bScr/10).toFixed(0)); $("rulBtn").textContent=ST.rul.place==="lev"?t.rulLev:t.rulScreen;
  $("swV").textContent=has("watch")?swStr():"—"; $("lapV").textContent=ST.sw.laps.map((l,i)=>(i+1)+". "+l.toFixed(2)+" s").join("\n");
  for(const [id,s] of [["sp1",1],["sp10",10],["sp30",30]]) $(id).className=ST.speed===s?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.shorted) L.push([t.st.short,true]);
  if(has("cables")&&!(ST.cab.p&&ST.cab.m)) L.push([t.st.cab,false]);
  if(ST.modeX) L.push([t.st.mx,true]);
  if(has("frame")&&!has("net")&&alive().some(o=>o.kind==="drop")) L.push([t.st.noNet,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-g","hG"],["t-h-i","hI"],["clrBtn","clr"],["t-h-p","hP"],["pNone","pNone"],["pOne","pOne"],["pSame","pSame"],["pAnti","pAnti"],["t-h-s","hS"],["t-h-w","hW"],["swGo","swGo"],["swLap","swLap"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  sel.innerHTML=""; for(const k of ["styro","pp","glass","I","II","III"]){ const o=document.createElement("option"); o.value=k; o.textContent=t.sel[k]; sel.appendChild(o); }
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; step(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
