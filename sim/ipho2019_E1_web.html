  :root{

/* ---- 5: the black screen board on its two feet -------------------------- */
function screenFrame(){ const [cx, cy, ang] = lab.pose("screen"); return Lf(cx, cy, ang); }
/* the face that is looked at: the side the spots are on, else the side the laser is on */
function screenFace(tr){
  if (tr && tr.shotSide.length){ let s = 0; for (let i = 0; i < tr.shotSide.length; i++) s += tr.shotSide[i] * (1 + tr.shots[i][1]); return s >= 0 ? 1 : -1; }
  if (lab.obj.ruler.on){ const [sx, sy, ang] = lab.pose("screen"), v = dirv(ang + 90), [rx, ry] = lab.pose("ruler"); return (rx - sx) * v[0] + (ry - sy) * v[1] >= 0 ? 1 : -1; }
  return -1; }
/* front-view coordinates of the face (x to the right as seen, y down from the middle) → world */
function faceW(fx, fy, side){ const L = screenFrame(); return L(side > 0 ? -fx : fx, side * 0.83, SCR_HC - fy); }
function screen3(tr){
  const L = screenFrame(), o = {id: "screen"};
  lbox(L, -60, 60, -0.8, 0.8, SCR_H0, SCR_H1, "#131313", Object.assign({edge: "#1d1d1d", top: "#262626"}, o));
  for (const f of [-50.4, 50.4]){ lbox(L, f - 3.5, f + 3.5, -3.2, 3.2, 0, 1.0, "#4a4a4a", Object.assign({edge: "#3a3a3a"}, o));
    lbox(L, f - 3.5, f + 3.5, -1.2, 1.2, 1.0, 3.2, "#4a4a4a", o); }
  strips3("screen", L, SCR_H1);
  if (lab.sel === "screen") dashLoop([L(-61, -3, SCR_H1 + 0.2), L(61, -3, SCR_H1 + 0.2), L(61, 3, SCR_H1 + 0.2), L(-61, 3, SCR_H1 + 0.2)], "#ffd45e");
  const h = beamH(), shots = tr.shots;
  for (let i = 0; i < shots.length; i++){ const [s, I] = shots[i], v = vis(I, lab.dark); if (v <= 0.02) continue;
    spotQuad(L(s, tr.shotSide[i] * 0.84, h), L(s + 1, tr.shotSide[i] * 0.84, h), v, tr.shotSide[i]); }
  /* the tape laid on the board (the front view of the original) */
  const side = UI.ftFace;
  if (Math.hypot(lab.ftape_b[0] - lab.ftape_a[0], lab.ftape_b[1] - lab.ftape_a[1]) > 1){
    const A = lab.ftape_a, Bp = lab.ftape_b, len = Math.min(300, Math.hypot(Bp[0] - A[0], Bp[1] - A[1])), ux = (Bp[0] - A[0]) / len, uy = (Bp[1] - A[1]) / len;
    const R = _sub(faceW(1, 0, side), faceW(0, 0, side)), Dn = [0, -1, 0];
    const vec = (x, y) => [R[0] * x + Dn[0] * y, R[1] * x + Dn[1] * y, R[2] * x + Dn[2] * y];
    for (let i = 0; i * 25 < len; i++){ const d0 = i * 25, d1 = Math.min(len, d0 + 25), t = TEX.tape[i];
      tex3(t, 0, 0, (d1 - d0) * RES, t.height, faceW(A[0] + ux * d0 + uy * 0.65, A[1] + uy * d0 - ux * 0.65, side), vec(ux * (d1 - d0), uy * (d1 - d0)), vec(-uy * 1.3, ux * 1.3), {bias: 0.6}); }
    for (const [k, P] of [["ft_a", A], ["ft_b", Bp]]){
      const ring = Array.from({length: 16}, (_, i) => { const t = i / 16 * 2 * Math.PI; return faceW(P[0] + 0.9 * Math.cos(t), P[1] + 0.9 * Math.sin(t), side); });
      face(ring, {fill: "#e0b83a", stroke: "#8a6f18", lw: 1, id: k, bias: 1.2, flat: true}); face(ring.slice().reverse(), {fill: "#e0b83a", id: k, bias: 1.2, flat: true}); } }
}
function beamH(){ return lab.level === "low" ? LOW_H : HIGH_H; }
/* a laser spot on a surface: p is its centre, q a point 1 cm along the surface (horizontally); side picks the face */
function spotQuad(p, q, v){
  const u = _sub(q, p), r = 0.6 + 1.5 * v, w = [0, 1, 0];
  let U = u.map(x => x * 2 * r), V = w.map(x => -x * 2 * r);
  const O = [p[0] - U[0] / 2 - V[0] / 2, p[1] - U[1] / 2 - V[1] / 2, p[2] - U[2] / 2 - V[2] / 2];
  tex3(TEX.glow, 0, 0, 128, 128, O, U, V, {glow: true, alpha: Math.min(1, 0.25 + v)});
  const O2 = [O[0] + U[0], O[1] + U[1], O[2] + U[2]];
  tex3(TEX.glow, 0, 0, 128, 128, O2, U.map(x => -x), V, {glow: true, alpha: Math.min(1, 0.25 + v)});

/* ---- the light that can be seen ---------------------------------------- */

    const n = lab.obj.ruler8.on ? 12 : 1;
    for (let i = 0; i < n; i++){

      const under = n > 1 && lab.in_ruler8((x0 + x1) / 2, (y0 + y1) / 2), v = under ? v0 * 0.58 : v0; if (v <= 0.02) continue;

}

}
const VIEWS = ["3d", "top", "disk", "slider", "screen"];
function viewOk(v){ return v === "3d" || v === "top" || (v === "disk" && lab.obj.disk.on) || (v === "slider" && lab.obj.ruler.on) || (v === "screen" && lab.obj.screen.on); }
function showView(v){
  if (!viewOk(v)){ note(tr(v === "disk" ? "st_nodisk" : v === "slider" ? "st_noruler" : "st_noscreen")); return; }
  if (v === "screen") UI.ftFace = screenFace(TRACE);
  if (v !== view3){
    if (window.HLzoom) HLzoom(cv3, {out: v === "3d"});
    if (view3 === "3d") freeCam = {yaw: CAM.yaw, pitch: CAM.pitch, k: CAM.k, tx: CAM.tx, ty: CAM.ty, tz: CAM.tz, px: CAM.px, py: CAM.py};
    Object.assign(CAM, viewCam(v));
  }
  view3 = v; syncTabs();
}
function syncTabs(){
  for (const k of VIEWS){ const b = $("vt" + k); b.className = k === view3 ? "on" : ""; b.textContent = tr("vt" + k); b.disabled = !viewOk(k); }
  $("t-cap3").textContent = tr("cap_" + view3);
  $("back").hidden = view3 === "3d"; $("back").textContent = tr("back");
}
for (const k of VIEWS) $("vt" + k).onclick = () => showView(k);
$("back").onclick = () => showView("3d");

/* ---- drawing ---- */
function draw3(){
  const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx3.createLinearGradient(0, 0, 0, CAM.H);
  if (lab.dark){ g.addColorStop(0, "#07080a"); g.addColorStop(1, "#0d0f12"); } else { g.addColorStop(0, "#2a3038"); g.addColorStop(1, "#1b1f25"); }
  ctx3.fillStyle = g; ctx3.fillRect(0, 0, CAM.W, CAM.H);
  LUX = lab.dark ? (UI.lamp ? 0.5 : 0.12) : 1;
  TRACE = lab.trace();
  begin3(); scene3(); render3(ctx3);
}

/* ---- the tray ---- */
const trayCv = $("tray"), tctx = trayCv.getContext("2d"), TROW = 50;
let TRW = 190, trayCells = [];
function trayLayout(){
  const dpr = window.devicePixelRatio || 1; TRW = Math.max(150, trayCv.parentElement.clientWidth - 18 || 190);
  const h = TRAY_KEYS.length * TROW + 40; trayCv.style.width = TRW + "px"; trayCv.style.height = h + "px";
  trayCv.width = Math.round(TRW * dpr); trayCv.height = Math.round(h * dpr); drawTray(); }
const isOn = k => k === "tape" ? lab.tape_on : lab.obj[k].on;
function trayIcon(c, k, x, y){
  c.save(); c.translate(x, y);
  if (k === "ruler"){ c.fillStyle = "#d3d7da"; c.fillRect(-17, -2, 34, 5); c.fillStyle = "#d8322a"; c.fillRect(-6, -4, 5, 9); c.fillRect(1, -4, 5, 9);
    c.fillStyle = "#b7bcc0"; c.fillRect(-3, -12, 6, 9); c.fillStyle = "#b8912e"; c.fillRect(-16, -8, 13, 2); }
  else if (k === "disk"){ c.fillStyle = "#c9a878"; c.fillRect(-15, -15, 30, 30); c.fillStyle = "#eeeeec"; c.fillRect(-12, -12, 24, 24);
    c.fillStyle = "rgba(170,215,228,.8)"; c.beginPath(); c.arc(0, 0, 9.5, 0, 7); c.fill(); c.strokeStyle = "#7fa7b4"; c.stroke(); }
  else if (k === "holder"){ c.fillStyle = "#eeeeec"; c.fillRect(-17, -10, 34, 20); c.fillStyle = "#1b1b1d"; c.beginPath(); c.arc(0, 0, 7, 0, 7); c.fill();
    c.fillStyle = "#a8c4b4"; c.fillRect(-5, -1.2, 10, 2.4); }
  else if (k === "screen"){ c.fillStyle = "#131313"; c.fillRect(-18, -10, 36, 16); c.fillStyle = "#4a4a4a"; c.fillRect(-15, 6, 6, 3); c.fillRect(9, 6, 6, 3); }
  else if (k === "tape6"){ c.fillStyle = "#e6dfcc"; c.beginPath(); c.arc(0, 0, 13, 0, 7); c.fill(); c.fillStyle = "#c9a878"; c.beginPath(); c.arc(0, 0, 9.5, 0, 7); c.fill();
    c.fillStyle = "#15181d"; c.beginPath(); c.arc(0, 0, 8.4, 0, 7); c.fill(); }
  else if (k === "tape"){ c.fillStyle = "#e8437f"; c.beginPath(); c.arc(-3, 0, 11, 0, 7); c.fill(); c.fillStyle = "#f6d23a"; c.font = "800 9px sans-serif"; c.textAlign = "center"; c.fillText("3m", -3, 3);
    c.fillStyle = "#f2e04a"; c.fillRect(6, 7, 13, 3); }
  else if (k === "ruler8"){ c.strokeStyle = "#8fa3aa"; c.fillStyle = "rgba(210,232,238,.25)"; c.fillRect(-18, -4, 36, 8); c.strokeRect(-18, -4, 36, 8);
    c.strokeStyle = "#cfd8dc"; for (let i = -16; i <= 16; i += 2){ c.beginPath(); c.moveTo(i, -4); c.lineTo(i, i % 4 ? -2 : 0); c.stroke(); } }
  c.restore(); }
function drawTray(){
  const dpr = window.devicePixelRatio || 1, c = tctx, h = TRAY_KEYS.length * TROW + 40;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = "#15181d"; c.fillRect(0, 0, TRW, h);
  trayCells = []; let y = 6; const wd = TRW - 12;
  for (const k of TRAY_KEYS){
    const on = isOn(k);
    c.fillStyle = on ? "#1a1d22" : "#1f242b"; c.fillRect(6, y, wd, TROW - 4);
    c.strokeStyle = on ? "#3f4650" : "#353b43"; c.lineWidth = 1; c.strokeRect(6.5, y + 0.5, wd - 1, TROW - 5);
    c.globalAlpha = on ? 0.45 : 1; trayIcon(c, k, 28, y + (TROW - 4) / 2); c.globalAlpha = 1;
    c.font = '11.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign = "left"; c.textBaseline = "middle";
    c.fillStyle = on ? "#8b939b" : "#e8eef2"; let nm = tr("it_" + k); while (c.measureText(nm).width > wd - 56 && nm.length > 4) nm = nm.slice(0, -2) + "…";
    c.fillText(nm, 52, y + 15);
    c.font = '9.5px "Malgun Gothic",sans-serif'; c.fillStyle = on ? "#f2c14e" : "#69717a"; c.fillText(tr(on ? "trayBack" : "trayTake"), 52, y + 32);
    trayCells.push([k, y, y + TROW - 4]); y += TROW; }
  c.font = '10.5px "Malgun Gothic",sans-serif'; c.textAlign = "center"; c.textBaseline = "top"; c.fillStyle = "#69717a";
  c.fillText(tr("trayHelp"), TRW / 2, y + 6); }
/* the point of the table at the middle of the view */
function viewCentre(){ const q = onPlane(CAM.W / 2, CAM.H / 2, 0); return [Math.max(30, Math.min(ROOM_W - 30, q[0])), Math.max(25, Math.min(ROOM_D - 25, q[2]))]; }
trayCv.addEventListener("mousedown", e => {
  if (e.button) return; const y = e.clientY - trayCv.getBoundingClientRect().top;
  for (const [k, y0, y1] of trayCells) if (y >= y0 && y <= y1){
    const was = isOn(k);
    if (was && k !== "tape"){ lab.obj[k].tapes = []; if (k === "tape6") UI.hold = lab.tape_held = false; }
    const c = viewCentre();                      /* the small things come out beside the middle, not on top of the apparatus */
    lab.toggle(k, k === "tape6" ? [Math.max(12, c[0] - 48), Math.min(ROOM_D - 12, c[1] + 22)] : k === "tape" ? [c[0], Math.min(ROOM_D - 20, c[1] + 18)] : c);
    if (!was && k !== "tape"){ lab.sel = ["tape6"].includes(k) ? null : k; lab.raise_(k); }
    if (was && lab.sel === k) lab.sel = null;
    if (!viewOk(view3)) showView("3d");
    note(was ? tr("st_removed") : ""); refresh(); return; } });
window.addEventListener("resize", () => { trayLayout(); layout3(); });

/* ---- the panel ---- */
function note(s){ $("status").textContent = s || (UI.hold ? tr("st_held") : ""); }
function selKey(){ return lab.sel === "holder12b" || lab.sel === "laser" ? lab.sel : lab.sel; }
function refresh(){
  $("sw").textContent = tr(lab.laser_on ? "swOn" : "swOff"); $("sw").className = lab.laser_on ? "on" : ""; $("sw").disabled = !lab.obj.ruler.on;
  $("lvl").textContent = tr(lab.level === "low" ? "lvlBtnLow" : "lvlBtnHigh"); $("lvl").disabled = !lab.obj.ruler.on;
  $("lvlRead").textContent = tr(lab.level === "low" ? "lvlLow" : "lvlHigh");
  $("optG").textContent = tr("optG"); $("optP").textContent = tr("optP");
  $("optG").className = lab.hold_item === "grating" ? "on" : ""; $("optP").className = lab.hold_item === "prism" ? "on" : "";
  $("parch").checked = lab.parchment; $("parch").disabled = !lab.obj.disk.on;
  $("lamp").textContent = tr(UI.lamp ? "lampOn" : "lampOff"); $("lamp").className = UI.lamp ? "on" : "";
  $("sp1").className = UI.speed === 1 ? "on" : ""; $("sp10").className = UI.speed === 10 ? "on" : "";
  const k = selKey(), on = k && (k === "laser" ? lab.obj.ruler.on : k === "holder12b" ? lab.obj.holder.on : lab.obj[k] && lab.obj[k].on);
  $("selName").textContent = on ? tr(k === "laser" || k === "holder12b" ? "sel_" + k : "it_" + k) : tr("none");
  for (const b of document.querySelectorAll("[data-rot]")) b.disabled = !on || (lab.obj[k] && lab.obj[k].tapes.length >= 2);
  const key = k === "holder12b" ? "holder" : k === "laser" ? "ruler" : k, strips = on && lab.obj[key] ? lab.obj[key].tapes : [];
  $("strips").innerHTML = strips.map((_, i) => `<button data-peel="${i}">${tr("peel")} ${i + 1} ✕</button>`).join("");
  for (const b of $("strips").querySelectorAll("[data-peel]")) b.onclick = () => { lab.obj[key].tapes.splice(+b.dataset.peel, 1); lab.clearPose(); refresh(); };
  $("newExp").textContent = tr("newExp");
  drawTray(); syncTabs(); tickText(); }
function tickText(){
  const n = Math.floor(lab.clock), [dark, left] = lab.light_phase(), l = Math.max(0, Math.floor(left));
  $("clock").textContent = Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  $("light").textContent = tr(dark ? "blk" : "lit").replace("%s", Math.floor(l / 60) + ":" + String(l % 60).padStart(2, "0"));
  $("light").className = "hint" + (dark ? " dark" : ""); }
$("sw").onclick = () => { lab.laser_on = !lab.laser_on; refresh(); };
$("lvl").onclick = () => { lab.level = lab.level === "low" ? "high" : "low"; note(tr("st_level").replace("%s", lab.level === "low" ? "3A" : "3B")); refresh(); };
$("optG").onclick = () => { lab.hold_item = "grating"; refresh(); };
$("optP").onclick = () => { lab.hold_item = "prism"; refresh(); };
$("parch").onchange = () => { lab.parchment = $("parch").checked; refresh(); };
$("lamp").onclick = () => { UI.lamp = !UI.lamp; refresh(); };
$("sp1").onclick = () => { UI.speed = 1; refresh(); }; $("sp10").onclick = () => { UI.speed = 10; refresh(); };
for (const b of document.querySelectorAll("[data-rot]")) b.onclick = () => {
  const k = selKey(), d = +b.dataset.rot; if (!k) return;
  if (!lab.turn(k, d > 0, Math.abs(d) < 1)) note(tr("st_fixed")); refresh(); };
$("newExp").onclick = () => { $("resetQ").textContent = tr("resetQ"); $("resetNo").textContent = tr("no"); $("resetYes").textContent = tr("yes"); $("resetDlg").showModal(); };
$("resetNo").onclick = () => $("resetDlg").close();
$("resetYes").onclick = () => { $("resetDlg").close(); lab = new Lab(); PROT = protTex(lab.prot_zero); UI.hold = false; UI.levelAnim = 0; showView("3d"); note(tr("st_ready")); refresh(); };

/* ---- the hands ---- */
const ITEM_H = {ruler: 1.0, slider: 1.85, head: 2.0, switch: 11.5, disk: DISK_H0, holder: H12A, h12b: H12B1, screen: SCR_HC, tape6: 4.8, tape_a: 0, tape_b: 0, room: 0, lamp: 0};
const itemH = id => id === "ruler8" ? ruler8H() + R8_T : (ITEM_H[id] !== undefined ? ITEM_H[id] : 0);
const toLab = (p, h) => { const q = onPlane(p[0], p[1], h); return [q[0], q[2]]; };
/* a screen point on the face of the board, in its front-view coordinates (x right, y down from the middle) */
function boardAt(p){
  const side = UI.ftFace, O = faceW(0, 0, side), X = faceW(1, 0, side), Y = faceW(0, 1, side);
  const a = P3(...O), b = P3(...X), c = P3(...Y), ux = b[0] - a[0], uy = b[1] - a[1], vx = c[0] - a[0], vy = c[1] - a[1], det = ux * vy - uy * vx;
  if (Math.abs(det) < 1e-9) return null;
  const dx = p[0] - a[0], dy = p[1] - a[1]; return [(dx * vy - dy * vx) / det, (ux * dy - uy * dx) / det]; }
let down = null, mPrev = [0, 0];
const pe = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => e.preventDefault());
cv3.addEventListener("pointerdown", e => {
  const p = pe(e); mPrev = p; cv3.setPointerCapture(e.pointerId);
  if (e.button === 1 || e.button === 2){ e.preventDefault(); down = {p, kind: "pan", btn: e.button, moved: false}; return; }
  if (e.button) return;
  const id = pick3(p[0], p[1]), h = itemH(id); lab.clearPose();
  if (UI.hold && lab.obj.tape6.on && id !== "tape6"){
    const [x, y] = toLab(p, h);
    if (id && id !== "room" && !id.startsWith("strip|") && !id.startsWith("tape") && id !== "lamp" && !id.startsWith("ft_")){
      if (id === "slider" || id === "head" || id === "switch"){ note(tr("st_slider")); return; }
      if (lab.stick_tape(x, y)){ note(""); refresh(); return; } }
    if (!id || id === "room"){ UI.hold = lab.tape_held = false; const [tx, ty] = toLab(p, 0); lab.obj.tape6.pos = [tx, ty]; note(""); refresh(); return; } }
  if (id && id.startsWith("strip|")){ const [, k, i] = id.split("|"); lab.obj[k].tapes.splice(+i, 1); lab.clearPose(); refresh(); return; }
  if (id === "switch"){ lab.laser_on = !lab.laser_on; refresh(); return; }
  if (id === "lamp"){ UI.lamp = !UI.lamp; refresh(); return; }
  if (id === "tape6"){ UI.hold = lab.tape_held = !UI.hold; if (UI.hold){ const [x, y] = toLab(p, 0); lab.obj.tape6.pos = [x, y]; } note(""); refresh(); return; }
  if (id === "slider" || id === "head"){ lab.sel = "laser"; lab.raise_("ruler"); down = {p, kind: "slider", moved: false}; refresh(); return; }
  if (id === "tape_a" || id === "tape_b"){ down = {p, kind: id, moved: false}; return; }
  if (id === "ft_a" || id === "ft_b"){ down = {p, kind: id, moved: false}; return; }
  if (id && ["ruler", "disk", "holder", "h12b", "screen", "ruler8"].includes(id)){
    const k = id === "h12b" ? "holder" : id; lab.sel = id === "h12b" ? "holder12b" : id; lab.raise_(k);
    if (lab.obj[k].tapes.length){ note(tr("st_taped")); down = {p, kind: "fixed", key: k, moved: false}; refresh(); return; }
    const [x, y] = toLab(p, h), [cx, cy] = lab.pose(k); lab.side = lab.screen_side(k);
    down = {p, kind: "item", key: k, h, off: [x - cx, y - cy], moved: false}; note(""); refresh(); return; }
  lab.sel = null; refresh();
  down = {p, kind: view3 === "3d" ? "orbit" : "pan", moved: false}; });
cv3.addEventListener("pointermove", e => {
  const p = pe(e), dx = p[0] - mPrev[0], dy = p[1] - mPrev[1]; mPrev = p;
  if (!down){ if (UI.hold){ const [x, y] = toLab(p, 0); lab.obj.tape6.pos = [x, y]; lab.clearPose(); }
    const id = pick3(p[0], p[1]); cv3.className = UI.hold ? "copy" : id && id !== "room" ? "pointer" : ""; return; }
  if (Math.hypot(p[0] - down.p[0], p[1] - down.p[1]) > 4) down.moved = true; if (!down.moved) return;
  const k = down.kind;
  if (k === "orbit"){ CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.08, CAM.pitch + dy * 0.006)); cv3.classList.add("grabbing"); }
  else if (k === "pan"){ CAM.px += dx; CAM.py += dy; cv3.classList.add("grabbing"); }
  else if (k === "slider"){ const [x, y] = toLab(p, 1.0); lab.dragSlider(x, y); }
  else if (k === "item"){ const [x, y] = toLab(p, down.h); lab.dragTo(down.key, x - down.off[0], y - down.off[1]); }
  else if (k === "tape_a" || k === "tape_b"){ let [x, y] = toLab(p, 0); const o = k === "tape_a" ? lab.tape_b : lab.tape_a, d = Math.hypot(x - o[0], y - o[1]);
    if (d > 300){ x = o[0] + (x - o[0]) * 300 / d; y = o[1] + (y - o[1]) * 300 / d; note(tr("st_tapelen")); } lab[k] = [x, y]; }
  else if (k === "ft_a" || k === "ft_b"){ const q = boardAt(p); if (q) lab[k === "ft_a" ? "ftape_a" : "ftape_b"] = [Math.max(-60, Math.min(60, q[0])), Math.max(-13, Math.min(13, q[1]))]; }
  lab.clearPose(); });
cv3.addEventListener("pointerup", e => {
  cv3.classList.remove("grabbing"); const d = down; down = null; if (!d) return;
  if (d.kind === "pan" && !d.moved && d.btn === 2){
    if (UI.hold){ UI.hold = lab.tape_held = false; note(""); } else if (view3 !== "3d") showView("3d"); else lab.sel = null;
    refresh(); return; }
  if ((d.kind === "item" || d.kind === "fixed") && d.key === "screen" && !d.moved){ showView("screen"); return; }
  if (d.kind === "item" && d.moved){ lab.side = 0; const [x, y] = lab.obj[d.key].pos;
    if (!(x > -6 && x < ROOM_W + 6 && y > -6 && y < ROOM_D + 6)){ lab.obj[d.key].on = false; lab.obj[d.key].tapes = []; if (lab.sel === d.key || (d.key === "holder" && lab.sel === "holder12b")) lab.sel = null; note(tr("st_removed")); if (!viewOk(view3)) showView("3d"); } }
  if ((d.kind === "tape_a" || d.kind === "tape_b") && d.moved){ const q = lab[d.kind];
    if (!(q[0] > -6 && q[0] < ROOM_W + 6 && q[1] > -6 && q[1] < ROOM_D + 6)){ lab.tape_on = false; note(tr("st_removed")); } }
  refresh(); });
cv3.addEventListener("dblclick", e => { const p = pe(e), id = pick3(p[0], p[1]);
  if (id === "disk") showView("disk"); else if (id === "slider" || id === "head") showView("slider"); });
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = pe(e), up = e.deltaY < 0, id = pick3(p[0], p[1]);
  const key = id === "slider" || id === "head" || id === "switch" ? "laser" : id === "h12b" ? "holder12b" : ["ruler", "disk", "holder", "screen", "ruler8"].includes(id) ? id : null;
  if (key && !(view3 === "screen" && key === "screen")){
    lab.sel = key; if (!lab.turn(key, up, e.shiftKey)) note(tr("st_fixed")); else note(""); refresh(); return; }
  const f = up ? 1.12 : 1 / 1.12, nk = Math.min(160, Math.max(1.5, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive: false});

/* ---- language ---- */
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.getAttribute("data-i18n")); });
  $("btn-en").className = LANG === "en" ? "on" : ""; $("btn-ko").className = LANG === "ko" ? "on" : "";
  document.documentElement.lang = LANG; $("info").innerHTML = tr("info");
  document.title = LANG === "ko" ? "IPhO 2019 E1 — 광학 측정 · HaslaLab" : "IPhO 2019 E1 — Optical Measurements · HaslaLab";
  trayLayout(); refresh(); if (!$("status").textContent) note(tr("st_ready")); }
function setLang(l){ LANG = l; const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u); note(""); applyLang(); }
$("btn-en").onclick = () => setLang("en"); $("btn-ko").onclick = () => setLang("ko");

/* ---- the clock ---- */
let tPrev = performance.now(), tText = 0;
function loop(now){
  const dt = Math.min(0.25, Math.max(0, (now - tPrev) / 1000)); tPrev = now;
  const was = lab.dark; lab.tick(dt, UI.speed); if (lab.dark !== was) refresh();
  const goal = lab.level === "high" ? 1 : 0; UI.levelAnim += Math.sign(goal - UI.levelAnim) * Math.min(Math.abs(goal - UI.levelAnim), dt * 2.5);
  draw3();
  if (now - tText > 400){ tText = now; tickText(); }
  requestAnimationFrame(loop); }
document.addEventListener("visibilitychange", () => { tPrev = performance.now(); });
layout3(); applyLang(); requestAnimationFrame(loop);

</script>
