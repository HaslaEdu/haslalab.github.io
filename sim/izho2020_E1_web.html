var PROGRAM = {
  title: { ko: 'IZhO 2020 실험 — 맥스웰 원판', en: 'IZhO 2020 — Maxwell\'s disc' },
  subtitle: { ko: '맥스웰 원판(나무 막대에 끼운 두 원판), 삼각대 둘, 실, 스톱워치, 자, 100 g 추 둘이 있습니다. 1) 두 삼각대 사이에 평행한 두 실을 기울기 α 로 매고 원판이 막대의 나무 부분으로 미끄러지지 않고 구르게 합니다. 2) 원판을 두 실로 매달아 실을 막대에 감았다 놓습니다. 3) 짐을 단 실 두 가닥을 반대로 감으면 원판이 돌며 올라갑니다. 각 운동의 법칙과 가속도를 재세요.',
              en: 'Maxwell\'s disc (two discs on a wooden stick), two tripods, threads, a stopwatch, a ruler and two 100 g loads. 1) Stretch two parallel threads between the tripods at an angle α; the disc rolls on them on the stick\'s wooden parts without slipping. 2) Hang the disc on two threads, wind them on the stick and release. 3) With two more threads wound the other way carrying a load, the disc climbs while spinning. Measure each law of motion and acceleration.' },
  notes: { ko: [
    '과제: 1.1 a = g sinα/(1 + ½(R/r)²). 1.2 실에 같은 간격 표시를 하고 x(t) — 첫 표시에서 이미 속도가 있으므로 x = v₀t + at²/2. 1.3–1.4 a(α) 와 이론. 2.1–2.3 내려오는 운동의 x(t), a, 오차, 이론 a = g/(1 + ½(R/r)²). 3.1 실을 감는 법, 3.2 짐의 질량에 따른 올라가는 가속도.',
    '공식 해답: D = 85 mm, d = 3.0 mm. 1: h = 3 cm (sin α = 0.043) 에서 x = 5, 10 … 30 cm 의 t = 5.24, 8.44 … 19.34 s, a = 0.081 cm/s² (이론 0.104); h = 3, 5, 7, 9, 11 cm → 0.081, 0.135, 0.195, 0.262, 0.340 cm/s². 2: a = 2.60 ± 0.13 cm/s² (이론 2.44). 3: H = 12 cm 까지 t = 2.14 s (100 g, 5.22 cm/s²), 1.60 s (200 g, 9.41 cm/s²).',
    '3 의 감는 곳 반지름은 문제에 없어 r₂ = 5r 로 두었습니다(100 g 은 공식 값과 맞고, 200 g 은 약 12 cm/s² 로 공식보다 큽니다). 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 a = g sinα/(1 + ½(R/r)²). 1.2 mark the threads at equal steps and take x(t) — it already moves at the first mark, so x = v₀t + at²/2. 1.3–1.4 a(α) with the theory. 2.1–2.3 x(t) going down, a with its error, the theory a = g/(1 + ½(R/r)²). 3.1 how to wind the threads, 3.2 the climbing acceleration for different loads.',
    'Official solution: D = 85 mm, d = 3.0 mm. 1: at h = 3 cm (sin α = 0.043), t = 5.24, 8.44 … 19.34 s at x = 5, 10 … 30 cm, a = 0.081 cm/s² (theory 0.104); h = 3, 5, 7, 9, 11 cm → 0.081, 0.135, 0.195, 0.262, 0.340 cm/s². 2: a = 2.60 ± 0.13 cm/s² (theory 2.44). 3: to H = 12 cm in t = 2.14 s (100 g, 5.22 cm/s²), 1.60 s (200 g, 9.41 cm/s²).',
    'The sheet does not give the hub radius of part 3; here r₂ = 5r (100 g matches the official value, 200 g gives ≈ 12 cm/s², more than the official). The values differ a little from visit to visit.'] }
};

var LAB = { mode: 1, h: 3, x: 0, v: 0, held: true, m: 100, sw: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 삼각대 둘(오른쪽 받침의 높이 조절, 눈금), 그 사이의 실과 맥스웰 원판, 세운 자, 100 g 추 둘, 랩 메모리 스톱워치. 앞쪽 카드 세 장으로 1·2·3 의 장치를 고릅니다.',
           en: 'On the desk: two tripods (the right holder\'s height adjustable, with a scale), the threads and Maxwell\'s disc between them, an upright ruler, two 100 g loads and a stopwatch with lap memory. The three cards in front choose setup 1, 2 or 3.' },
  howto: { ko: ['카드 1·2·3 클릭: 장치 바꾸기 · 원판 클릭: 놓기 / 다시 클릭하면 처음 자리로',
                '1: 오른쪽 삼각대 받침 위에서 휠 — 높이 h 0.5 cm 씩 (실에는 5 cm 마다 표시) · 3: 추 클릭 — 100 g / 200 g',
                '스톱워치: <b>Space</b> 시작/정지 · <b>L</b> 랩 (메모리) · 멈춘 뒤 L: 초기화 · 자 클릭: 가까이'],
           en: ['Click card 1, 2 or 3: change the setup · click the disc: release it / again: back to the start',
                '1: wheel over the right tripod\'s holder — height h by 0.5 cm (the threads are marked every 5 cm) · 3: click the loads — 100 g / 200 g',
                'Stopwatch: <b>Space</b> start/stop · <b>L</b> lap (memory) · L when stopped: reset · click the ruler: close up'] },
  notePlaceholder: { ko: '예) h = 3 cm: x = 5 cm 5.2 s, 10 cm 8.4 s … / 내려옴: 10 cm 2.8 s …', en: 'e.g. h = 3 cm: x = 5 cm 5.2 s, 10 cm 8.4 s … / down: 10 cm 2.8 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var G = 981, R = 4.25, r = 0.15 * (1 + S.sys('r', 0.02)), ETA = 0.82 * (1 + S.sys('eta', 0.05)), RD = 0.153 * (1 + S.sys('rd', 0.02)), M = 125 * (1 + S.sys('M', 0.04)), K = 4;
    var LT = 70, YA = 40, YC = 85, Y2 = 80, Y3 = 55;
    var sw = LAB.sw = new B3.Stopwatch(0.04, { memory: true }), rul = B3.scaleTex(60, { width: 3 });
    var mem = document.createElement('canvas'); mem.width = 300; mem.height = 460;
    function acc() { if (LAB.mode === 1) return ETA * G * (LAB.h / LT) / (1 + 0.5 * (R / r) * (R / r));
      if (LAB.mode === 2) return G / (1 + 0.5 * (R / RD) * (R / RD));
      return G * (LAB.m * K - M) / (M * (1 + 0.5 * (R / r) * (R / r)) + LAB.m * K * K); }
    function reset() { LAB.held = true; LAB.v = 0; LAB.x = LAB.mode === 1 ? -2 : 0; }
    reset();
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' ', 'l', 'L'], wheelIds: ['hold'],
      home: { yaw: -0.22, pitch: 0.3, k: 6.2, tx: 6, ty: 40, tz: 0 },
      views: { rul: { yaw: 0, pitch: 0.05, k: 14, tx: -4, ty: 50, tz: 0, title: { ko: '원판과 자', en: 'The disc and the ruler' } },
               sw: { yaw: 0, pitch: 1.25, k: 46, tx: 49, ty: 1.7, tz: 12, title: { ko: '스톱워치와 메모리', en: 'Stopwatch and memory' } } },
      frame: function (b) {
        for (var i = 0; i < b.keys.length; i++) { if (b.keys[i] === ' ') sw.startStop(b.t); else sw.lapReset(b.t); }
        for (var c = 1; c <= 3; c++) if (b.clicked('c:card' + c)) { LAB.mode = c; reset(); }
        if (b.clicked('c:load')) { LAB.m = LAB.m === 100 ? 200 : 100; if (LAB.mode === 3) reset(); }
        if (b.clicked('c:rul')) b.go('rul');
        var wh = b.wheel('hold'); if (wh && LAB.mode === 1) { LAB.h = Math.max(0, Math.min(15, Math.round((LAB.h + wh * 0.5) * 10) / 10)); reset(); }
        if (b.clicked('m:disc')) { if (LAB.held) { LAB.held = false; LAB.a = acc() * (1 + HL.gauss(0.01)); if (LAB.a < 0) { LAB.held = true; b.say('짐이 가벼워 원판이 올라가지 않습니다', 'The load is too light to lift the disc'); } } else reset(); }
        var XMAX = LAB.mode === 1 ? 62 : LAB.mode === 2 ? 60 : 20;
        if (!LAB.held && b.dt > 0) { LAB.v += LAB.a * b.dt; LAB.x += LAB.v * b.dt; if (LAB.x >= XMAX) { LAB.x = XMAX; LAB.v = 0; LAB.held = true; LAB.end = true; } }
        B3.desk(-50, 60, -20, 22);
        /* two tripods */
        var hB = LAB.mode === 1 ? YA + LAB.h : YC;
        [[-LT / 2, LAB.mode === 1 ? YA : YC], [LT / 2, hB]].forEach(function (q, i) { var x = q[0];
          B3.box3(x - 6, x + 6, 0, 1.5, -12, -2, '#3b4048', { top: '#474c55' }); B3.cylSeg('y', 1.5, 92, x, -8, 0.7, '#c3c8cd', { seg: 12, cap: '#dde1e4' }, 6);
          B3.box3(x - 1.4, x + 1.4, q[1] - 1.4, q[1] + 1.4, -9.4, -6.6, '#3a3f46', { top: '#474c55', id: i ? 'm:hold' : undefined });
          B3.cyl3('z', -6.6, 6, x, q[1], 0.45, '#9aa0a6', { seg: 10, cap: '#b5bbc1', id: i ? 'm:hold' : undefined }); });
        var hs = B3.scaleTex(20, { width: 2.2, from: 30, every: 2 });
        B3.tex3(hs, 0, 0, hs.width, hs.height, [LT / 2 + 0.8, YA - 10 + 22 * 1 - 1, -7.3], [2.2, 0, 0], [0, -22, 0]);
        var dx, dy, dz, axis, a = acc();
        if (LAB.mode === 1) {
          var sa = LAB.h / LT, ca = Math.sqrt(1 - sa * sa), A = [-LT / 2, YA], Bp = [LT / 2, YA + LAB.h];
          [-4, 4].forEach(function (z) { B3.line3([A[0], A[1], z], [Bp[0], Bp[1], z], '#f0f0f0', 1.2);
            for (var s = 0; s <= 60; s += 5) { var px = Bp[0] - (6 + s) * ca, py = Bp[1] - (6 + s) * sa; B3.line3([px, py - 0.4, z], [px, py + 0.4, z], '#c0392b', 2); } });
          var sx = Bp[0] - (6 + LAB.x) * ca, sy = Bp[1] - (6 + LAB.x) * sa + r; axis = [sx, sy]; dz = 5.5;
        } else {
          var yy = LAB.mode === 2 ? Y2 - LAB.x : Y3 + LAB.x; axis = [0, yy]; dz = 5.5;
          B3.cyl3('x', -LT / 2, LT / 2, YC, 0, 0.45, '#9aa0a6', { seg: 10, cap: '#b5bbc1' });
          [-4, 4].forEach(function (z) { B3.line3([0, YC, z], [0, yy, z], '#f0f0f0', 1.2); });
          if (LAB.mode === 3) { var yl = Y3 - 4 - K * LAB.x; [-2.5, 2.5].forEach(function (z) { B3.line3([0, yy, z], [0, yl + 2, z], '#e8d8a0', 1.2); });
            B3.box3(-1.6, 1.6, Math.max(0, yl - 1.5), Math.max(0, yl - 1.5) + (LAB.m === 200 ? 4 : 2.4), -3.2, 3.2, '#8d6e3a', { top: '#a1824a' }); } }
        /* the disc on its stick */
        var ang = -LAB.x / r * (LAB.mode === 3 ? -1 : 1);
        B3.cyl3('z', -dz, dz, axis[0], axis[1], r, '#c49a5a', { seg: 8, cap: '#b38a4a', id: 'm:disc' });
        [-1.6, 1.6].forEach(function (z) { B3.cyl3('z', z - 0.35, z + 0.35, axis[0], axis[1], R, '#9aa0a6', { seg: 30, cap: '#b5bbc1', id: 'm:disc' });
          B3.line3([axis[0], axis[1], z + 0.37 * Math.sign(z)], [axis[0] + Math.cos(ang) * R * 0.9, axis[1] + Math.sin(ang) * R * 0.9, z + 0.37 * Math.sign(z)], '#2b2f35', 2); });
        /* the upright ruler (setups 2 and 3) */
        if (LAB.mode !== 1) { B3.box3(-10, -7, 0, 0.6, -2, 2, '#5d4630'); B3.box3(-9.5, -7.5, 0.6, 62.6, -0.3, 0.3, '#d9c48f', { id: 'c:rul' });
          B3.tex3(rul, 0, 0, rul.width, rul.height, [-9.5, 62.6 + 1.6, 0.31], [2, 0, 0], [0, -64, 0], { id: 'c:rul' }); }
        /* cards and loads */
        [1, 2, 3].forEach(function (c) { var x = -30 + c * 9; B3.box3(x - 3.5, x + 3.5, 0, 0.1, 12, 18, c === LAB.mode ? '#ffd479' : '#e8e4d8', { id: 'c:card' + c });
          B3.text3([x - 1, 0.12, 16.6], [1, 0, 0], [0, 0, -1], String(c), 2.4, '#333', { weight: '800', id: 'c:card' + c }); });
        B3.cyl3('y', 0, 3, 14, 15, 1.4, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:load' }); B3.cyl3('y', 0, 3, 18, 15, 1.4, LAB.m === 200 ? '#8d6e3a' : '#5b4630', { seg: 14, cap: '#a1824a', id: 'c:load' });
        B3.text3([12.6, 3.02, 17.6], [1, 0, 0], [0, 0, -1], LAB.m + ' g', 0.9, '#fff', { weight: '800' });
        B3.stopwatch(b, 'sw', [45, 12], sw);
        var g = mem.getContext('2d'); g.fillStyle = '#20252b'; g.fillRect(0, 0, 300, 460); g.fillStyle = '#b9c4a4'; g.fillRect(10, 10, 280, 440); g.fillStyle = '#1d2318'; g.font = '800 20px sans-serif'; g.textAlign = 'left'; g.fillText('MEMORY', 22, 40); g.font = '700 15px monospace';
        sw.laps.slice(-40).forEach(function (t, i) { g.fillText(String(Math.max(0, sw.laps.length - 40) + i + 1).padStart(2, ' ') + ' ' + t.toFixed(2).padStart(6, ' '), 22 + (i < 20 ? 0 : 138), 70 + (i % 20) * 19); });
        B3.tex3(mem, 0, 0, 300, 460, [50, 0.05, 8], [5.5, 0, 0], [0, 0, 8.4], { id: 'm:sw' });
        LAB.state = { mode: LAB.mode, h: LAB.h, x: LAB.x, a: a, m: LAB.m };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
