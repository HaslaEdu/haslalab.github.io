<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;

  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

  @media (max-width:760px){ .panel{flex:1 1 100%} }

         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}

  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);
        border:1px solid var(--line);border-radius:6px;padding:6px 0;color:#e8eef2;letter-spacing:.04em}
  .laps{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa3ab;max-height:130px;overflow:auto;margin-top:4px}
  #closeCv{touch-action:none}
  .instr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .instr3 canvas{display:block;width:100%;background:var(--deep);border-radius:6px}
  .ilbl{font-size:12px;color:#f2c14e;font-weight:700;margin:0 0 4px}

  .chklist div{display:flex;justify-content:space-between;gap:8px;color:#9aa3ab}
  .chklist b{font-weight:600}.chklist .ok{color:#7fd39a}.chklist .no{color:#f0b35a}.chklist .na{color:#5c646d}
button.on{background:#3a3220;border-color:#f2c14e;color:#ffd77a}
  .row button.on{background:#f2c14e;color:#1b1d20;border-color:#f2c14e}
</style>

<body>

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="wrap">
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-cap"></h3>
      <canvas id="cv"></canvas>
    </div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <h3 id="t-closecap"></h3>
      <canvas id="closeCv"></canvas>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-v"></h2>
    <div class="disp" id="dV"></div>
    <div class="row"><button id="r_200">200Ω</button><button id="r_2k">2k</button><button id="r_20k">20k</button><button id="r_200k">200k</button></div>
    <div class="row"><button id="r_2M">2M</button><button id="r_20M">20M</button><button id="r_200M">200M</button></div>
    <div class="row"><button id="pwrBtn"></button><button id="holdBtn"></button></div>

    <h2 id="t-h-l"></h2>
    <div class="row"><button id="lampBtn"></button><button id="coverBtn"></button></div>
    <div class="row"><button id="lpm">◀</button><span id="lpv" style="flex:1;text-align:center;font-size:12px;color:#c9d1d9;align-self:center"></span><button id="lpp">▶</button></div>
    <div class="hint" id="lHint"></div>

    <h2 id="t-h-a"></h2>
    <div class="row"><button id="l18Btn"></button></div>
    <div class="row"><button id="am1">−1°</button><button id="am01">−0.1°</button><button id="ap01">+0.1°</button><button id="ap1">+1°</button></div>
    <div class="row"><button id="af5m">⟲ 5′</button><button id="af1m">⟲ 1′</button><button id="af1p">⟳ 1′</button><button id="af5p">⟳ 5′</button></div>
    <div class="hint" id="aHint"></div>

    <h2 id="t-h-z"></h2>
    <div class="row"><button id="l9Btn"></button></div>
    <div class="row"><button id="zm1">−1°</button><button id="zm01">−0.1°</button><button id="zp01">+0.1°</button><button id="zp1">+1°</button><button id="zf1m">⟲ 1′</button><button id="zf1p">⟳ 1′</button></div>

    <h2 id="t-h-g"></h2>
    <div class="row"><button id="l12Btn"></button></div>
    <div class="row"><button id="gm1">−1°</button><button id="gm01">−0.1°</button><button id="gm002">−0.02°</button><button id="gp002">+0.02°</button><button id="gp01">+0.1°</button><button id="gp1">+1°</button></div>
    <div class="row"><button id="tm">⤵ −0.2°</button><button id="tp">⤴ +0.2°</button></div>
    <div class="hint" id="gHint"></div>

    <h2 id="t-h-s"></h2>
    <div class="row"><button id="um05">−0.5 mm</button><button id="um01">−0.1 mm</button><button id="up01">+0.1 mm</button><button id="up05">+0.5 mm</button></div>

    <h2 id="t-h-t"></h2>
    <div class="row"><button id="sp1">×1</button><button id="sp10">×10</button><button id="sp30">×30</button><span id="clock" style="flex:1;text-align:right;font:12px ui-monospace,Consolas,monospace;color:#c9d1d9;align-self:center"></span></div>

    <h2 id="t-h-note"></h2>
    <div class="row"><input id="cfg" style="flex:1;min-width:0;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:12px ui-monospace,Consolas,monospace"></div>
    <div class="row"><button id="noteBtn"></button><button id="noteClr"></button></div>
    <textarea id="note" rows="10" style="width:100%;resize:vertical;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;font:12px/1.5 ui-monospace,Consolas,monospace;padding:6px"></textarea>

    <div class="status" id="status"></div>
  </aside>
</div>

function setArm(a){ ST.th=Math.max(-60,Math.min(60,a)); }
function armCoarse(da){ if(!needSpec()) return; if(ST.lock18){ say("locked18"); return; } setArm(Math.round((ST.th+da)*1000)/1000); }
function armFine(da){ if(!needSpec()) return; if(!ST.lock18){ say("fine18"); return; } setArm(Math.round((ST.th+da)*10000)/10000); }
function zCoarse(da){ if(!needSpec()) return; if(ST.lock9){ say("locked9"); return; } ST.z=Math.round((ST.z+da)*1000)/1000; }
function zFine(da){ if(!needSpec()) return; if(!ST.lock9){ say("fine10"); return; } ST.z=Math.round((ST.z+da)*10000)/10000; }
function gTurn(da){ if(!needSpec()) return; if(!mounted("grating")){ say("needFor",itemName("grating")); return; } if(ST.lock12){ say("locked12"); return; } ST.g=Math.round((ST.g+da)*1000)/1000; }
function gTilt(da){ if(!needSpec()) return; ST.tilt=Math.round((ST.tilt+da)*100)/100; }
function slide(du){ if(!mounted("sample")){ say("needFor",itemName("sample")); return; } ST.u=Math.max(-6,Math.min(6,Math.round((ST.u+du)*100)/100)); }
const touch=()=>{ ST.idle=0; };
$("lampBtn").onclick=()=>{ if(!needSpec()) return; ST.lampOn=!ST.lampOn; say(ST.lampOn?"lampOn":"lampOff"); };
$("coverBtn").onclick=()=>{ if(!needSpec()) return; ST.cover=!ST.cover; say(ST.cover?"coverDown":"coverUp"); };
$("lpm").onclick=()=>{ if(needSpec()) ST.lampPos=Math.max(0,Math.round((ST.lampPos-0.125)*1000)/1000); };
$("lpp").onclick=()=>{ if(needSpec()) ST.lampPos=Math.min(1,Math.round((ST.lampPos+0.125)*1000)/1000); };
$("l18Btn").onclick=()=>{ if(needSpec()){ ST.lock18=!ST.lock18; say(ST.lock18?"tight":"loose","18"); } };
$("l9Btn").onclick=()=>{ if(needSpec()){ ST.lock9=!ST.lock9; say(ST.lock9?"tight":"loose","9"); } };
$("l12Btn").onclick=()=>{ if(needSpec()){ ST.lock12=!ST.lock12; say(ST.lock12?"tight":"loose","12"); } };
for(const [id,f,v] of [["am1",armCoarse,-1],["am01",armCoarse,-0.1],["ap01",armCoarse,0.1],["ap1",armCoarse,1],["af5m",armFine,-5/60],["af1m",armFine,-1/60],["af1p",armFine,1/60],["af5p",armFine,5/60],
  ["zm1",zCoarse,-1],["zm01",zCoarse,-0.1],["zp01",zCoarse,0.1],["zp1",zCoarse,1],["zf1m",zFine,-1/60],["zf1p",zFine,1/60],
  ["gm1",gTurn,-1],["gm01",gTurn,-0.1],["gm002",gTurn,-0.02],["gp002",gTurn,0.02],["gp01",gTurn,0.1],["gp1",gTurn,1],["tm",gTilt,-0.2],["tp",gTilt,0.2],
  ["um05",slide,-0.5],["um01",slide,-0.1],["up01",slide,0.1],["up05",slide,0.5]]) $(id).onclick=()=>f(v);
for(const r of RKEYS) $("r_"+r).onclick=()=>{ if(!has("dmm")){ say("needFor",itemName("dmm")); return; } touch(); ST.range=r; dispT=0; };
$("pwrBtn").onclick=()=>{ if(!has("dmm")){ say("needFor",itemName("dmm")); return; } touch(); ST.power=ST.power==="on"?"off":ST.power==="auto"?"off":"on"; dispT=0; if(ST.power==="on") ST.disp=null; };
$("holdBtn").onclick=()=>{ if(!has("dmm")) return; touch(); ST.hold=!ST.hold; };
for(const s of [1,10,30]) $("sp"+s).onclick=()=>{ ST.speed=s; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(), s=meterShow(); $("dV").textContent=s===null?"—":s===""?" ":(s==="1"?"1 .  ":s)+" "+meterUnit();
  for(const r of RKEYS) $("r_"+r).className=ST.range===r?"on":"";
  $("pwrBtn").className=ST.power==="on"?"on":""; $("holdBtn").className=ST.hold?"on":"";
  $("lampBtn").textContent=ST.lampOn?t.lampOff:t.lampOnB; $("lampBtn").className=ST.lampOn?"on":""; $("coverBtn").textContent=ST.cover?t.coverOpen:t.coverClose;
  $("lpv").textContent=t.lampPosTxt(Math.round(ST.lampPos*8));
  $("l18Btn").textContent=t.lockTxt("18",ST.lock18); $("l18Btn").className=ST.lock18?"on":""; $("l9Btn").textContent=t.lockTxt("9",ST.lock9); $("l9Btn").className=ST.lock9?"on":""; $("l12Btn").textContent=t.lockTxt("12",ST.lock12); $("l12Btn").className=ST.lock12?"on":"";
  for(const s of [1,10,30]) $("sp"+s).className=ST.speed===s?"on":""; $("clock").textContent=t.clock(simT); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.lampOn&&ST.warm<60) L.push([t.st.warming,false]);
  if(mounted("detector")&&!ST.cover&&has("dmm")) L.push([t.st.room,true]);
  if(has("dmm")&&ST.power==="auto") L.push([t.st.autoOff,true]);
  if(ST.hold) L.push([t.st.hold,true]);
  if(mounted("sample")&&ST.frame!=="open"&&Math.abs(ST.u)>2.5) L.push([t.st.edge,true]);
  if(meterShow()==="1"&&mounted("detector")) L.push([t.st.over,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-v","hV"],["t-h-l","hL"],["lHint","lHint"],["t-h-a","hA"],["aHint","aHint"],["t-h-z","hZ"],["t-h-g","hG"],["gHint","gHint"],["t-h-s","hS"],["t-h-t","hT"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["holdBtn","holdB"],["pwrBtn","pwrB"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function advance(dt){ let T=dt*ST.speed; simT+=T; while(T>0){ const h=Math.min(0.5,T); stepPhys(h); T-=h; } updDisp(dt); }
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; advance(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
</body>
