<script>
/* NBPhO 2014 problem 10 "Young's modulus of rubber" on the 3-D bench.  A rubber thread hangs from the
   stand with a plastic bag at its end; hex nuts (5.00 g each, written on the bag) go in one at a time.
   The rubber is incompressible and neo-Hookean, σ_true = (E/3)(λ² − 1/λ) with λ = 1 + ε: linear
   (σ = Eε, σ = F/S with the present cross-section) at small strain and stiffening beyond — so the
   "maximum strain until which it applies" comes out of the data.  The thread thins as d = d0/√λ, and
   the laser through it throws the same pattern as a slit of that width (Babinet), which is how the
   sheet asks for the diameter to be measured.  The thread creeps a little after each load.  The bag
   itself weighs about a gram (not given). */
var PROGRAM = {
  title: { ko: 'NBPhO 2014 실험 10 — 고무의 영률', en: 'NBPhO 2014 Problem 10 — Young\'s modulus of rubber' },
  subtitle: { ko: '고무줄의 응력 σ 와 변형률 ε 의 관계를 재어 그래프로 그리고, 영률 E 와 불확도, 그리고 선형 관계가 성립하는 최대 변형률 ε_m 을 구하세요. 줄의 지름은 레이저 회절로 잽니다.',
              en: 'Measure the relationship between stress σ and strain ε in a rubber string and plot it; find Young\'s modulus E with its uncertainty and the maximum strain ε_m until which it applies. Measure the thread\'s diameter by laser diffraction.' },
  notes: { ko: [
    '장비: 고무줄, 스탠드, 줄자, 질량을 아는 육각 너트 15개, 너트를 담아 매다는 비닐봉지, 녹색 레이저(λ = 532 nm), 스크린 (문제지 그대로).',
    '응력 σ = F/S 는 늘어난 지금의 단면적으로 셉니다. 고무는 부피가 변하지 않는 neo-Hooke 재료로 계산합니다 — 작은 변형에서 σ = Eε, 크게 늘이면 단단해집니다.',
    '줄을 지나는 레이저는 같은 너비의 슬릿과 같은 회절 무늬를 만듭니다(바비네의 원리). 극소 n 개 사이 거리 a, 줄–스크린 거리 L 이면 d = nLλ/a.',
    '너트 하나 5.00 g (봉지에 적혀 있음). 봉지 자체도 1 g 쯤 됩니다. 줄은 하중을 바꾼 뒤 조금 더 늘어납니다(크리프).',
    '<b>레이저를 눈에 비추지 마세요.</b>'], en: [
    'Equipment: a rubber thread, a stand, a measuring tape, 15 hex nuts of known mass, a plastic bag to hang the nuts on the thread, a green laser (λ = 532 nm) and a screen (as on the sheet).',
    'The stress σ = F/S uses the present, stretched cross-section. The rubber is computed as an incompressible neo-Hookean material — σ = Eε at small strain, stiffening when stretched far.',
    'The laser past the thread gives the same pattern as a slit of the same width (Babinet). With a the distance across n minima and L from thread to screen, d = nLλ/a.',
    'Each nut is 5.00 g (written on the bag). The bag itself weighs about a gram. The thread stretches a little more after each change of load (creep).',
    '<b>Never point the laser at anyone\'s eyes.</b>'] }
};

var LAB = { N: 0, lam: 1, Lx: 80, on: true };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드 팔에 매단 고무줄(볼펜으로 그은 표시 두 개, 아래 끝에 비닐봉지), 그 옆에 세운 1 m 자, 너트 15개가 든 접시, 줄을 향한 녹색 레이저, 뒤쪽의 스크린(모눈 종이), 레이저 축을 따라 놓인 줄자.',
           en: 'On the desk: the rubber thread hanging from the stand\'s arm (two pen marks on it, the plastic bag at its lower end), a 1 m stick standing beside it, a dish of 15 nuts, the green laser aimed at the thread, the screen behind (graph paper on it), and a tape along the laser\'s axis.' },
  howto: { ko: ['너트 접시 클릭: 봉지에 너트 하나 넣기 · 봉지 클릭: 너트 하나 꺼내기',
                '세운 자 클릭: 줄의 두 표시를 옆에서 가까이 보기 (휠로 확대)',
                '스크린: 레이저 축을 따라 끌어 옮기기 · 클릭: 회절 무늬와 모눈(1 mm) 가까이 보기',
                '줄자의 0 은 고무줄에 있습니다. 클릭하면 스크린 받침이 있는 곳을 내려다봅니다'],
           en: ['Click the dish of nuts: put a nut in the bag · click the bag: take one out',
                'Click the standing stick: look across at the two marks on the thread (wheel to zoom)',
                'Screen: drag it along the laser\'s axis · click: look closely at the pattern and the 1 mm grid',
                'The tape\'s 0 is at the thread. Click it to look down at where the screen\'s foot stands'] },
  notePlaceholder: { ko: '예) N = 0: 표시 41.2 / 61.3 cm, 무늬 10주기 a = 5.3 mm, L = 80.0 cm', en: 'e.g. N = 0: marks at 41.2 / 61.3 cm, 10 periods a = 5.3 mm, L = 80.0 cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var E = 1.6e6 * (1 + S.sys('E', 0.08)), d0 = 1.00e-3 * (1 + S.sys('d0', 0.04)), m = 5.00e-3, bag = 1.1e-3 * (1 + S.sys('bag', 0.2)), g = 9.81;
    var Lu = 0.40 * (1 + S.sys('L0', 0.01));                                   /* m: unstretched thread from the clamp to the bag */
    var mk = [0.08, 0.28 + S.sys('mk', 0.004)];                               /* m: the pen marks below the clamp, unstretched */
    var lamWave = 532e-9, G = E / 3, S0 = Math.PI * d0 * d0 / 4;
    var TOP = 92, TX = 0, TZ = 0, BEAM = 0;                                    /* the clamp point; the beam height is set below */
    var tape0 = S.sys('tape0', 0.12);
    function lamFor(N) { var F = (N * m + bag) * g, lo = 1, hi = 6;          /* F = σ_true · S0/λ = G(λ² − 1/λ)S0/λ */
      for (var i = 0; i < 60; i++) { var l = (lo + hi) / 2; if (G * (l * l - 1 / l) * S0 / l < F) lo = l; else hi = l; } return (lo + hi) / 2; }
    LAB.lam = lamFor(LAB.N);
    var PX = 80, SW = 18, SH = 14, key = '', scr = document.createElement('canvas'); scr.width = SW * PX; scr.height = SH * PX;
    function paint(beamZ) {
      var dd = d0 / Math.sqrt(LAB.lam), L = LAB.Lx / 100, k2 = dd.toExponential(4) + '|' + L.toFixed(3); if (k2 === key) return; key = k2;
      var g2 = scr.getContext('2d'); g2.fillStyle = '#f7f6f0'; g2.fillRect(0, 0, scr.width, scr.height);
      for (var i = 0; i <= SW * 10; i++) { g2.fillStyle = i % 10 === 0 ? 'rgba(60,110,170,.42)' : i % 5 === 0 ? 'rgba(80,130,190,.26)' : 'rgba(110,150,200,.14)'; g2.fillRect(i * PX / 10, 0, 1, scr.height); }
      for (i = 0; i <= SH * 10; i++) { g2.fillStyle = i % 10 === 0 ? 'rgba(60,110,170,.42)' : i % 5 === 0 ? 'rgba(80,130,190,.26)' : 'rgba(110,150,200,.14)'; g2.fillRect(0, i * PX / 10, scr.width, 1); }
      g2.fillStyle = 'rgba(40,70,120,.8)'; g2.font = '600 ' + Math.round(PX * 0.28) + 'px sans-serif';
      for (i = 0; i <= SW; i += 2) g2.fillText(String(i), i * PX + 3, scr.height - 4);
      /* the thread is vertical, so the pattern spreads sideways: a row of spots at the beam's height */
      var cy = SH / 2 * PX + 0.31 * PX, cx = (SW / 2 + 0.43) * PX, rowH = 0.09 * PX;
      var img = g2.getImageData(0, 0, scr.width, scr.height), D = img.data;
      for (var x = 0; x < scr.width; x++) {
        var xx = (x - cx) / PX / 100, u = Math.PI * dd * xx / (lamWave * L), I = u === 0 ? 1 : Math.pow(Math.sin(u) / u, 2);
        var bb = Math.min(1, Math.pow(I, 0.25) * 1.3);
        for (var y = Math.floor(cy - rowH * 1.6); y < cy + rowH * 1.6; y++) {
          var f = Math.exp(-Math.pow((y - cy) / rowH, 2) * 2) * bb; if (f < 0.01) continue;
          var p = (y * scr.width + x) * 4; D[p] = D[p] * (1 - f) + 20 * f; D[p + 1] = D[p + 1] * (1 - f) + 235 * f; D[p + 2] = D[p + 2] * (1 - f) + 50 * f;
        }
      }
      g2.putImageData(img, 0, 0);
    }
    var tape = B3.scaleTex(150, { horiz: true, width: 2.5, label: 'cm', bg: '#f2d33c' });
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang,
      home: { yaw: -0.5, pitch: 0.38, k: 5.2, tx: 30, ty: 45, tz: 0 },
      views: {
        stick: { yaw: 0, pitch: 0.02, k: 26, tx: 3, ty: 60, tz: 0, title: { ko: '줄의 표시와 세운 자', en: 'The marks on the thread and the stick' },
                 hint: { ko: '두 표시의 높이를 자에서 읽기 · 휠로 확대 · Esc: 돌아가기', en: 'Read the heights of the two marks on the stick · wheel to zoom · Esc: back' } },
        screen: { yaw: -Math.PI / 2, pitch: 0.0, k: 45, tx: 80, ty: 0, tz: 0, title: { ko: '스크린 (모눈 1 mm)', en: 'The screen (1 mm grid)' },
                  hint: { ko: '휠로 더 확대 · Esc: 돌아가기', en: 'Wheel to zoom in · Esc: back' } },
        tape: { yaw: 0, pitch: 1.4, k: 40, tx: 80, ty: 0, tz: 6, title: { ko: '줄자 (스크린 받침)', en: 'The tape (at the screen\'s foot)' } }
      },
      frame: function (b) {
        var want = lamFor(LAB.N);
        LAB.lam += (want * (1 + 0.012 * (1 - Math.exp(-(b.t - (LAB.tLoad || 0)) / 40))) - LAB.lam) * Math.min(1, b.dt / 2.5);  /* settles in seconds, creeps for a minute */
        var near = b.view !== 'screen';
        B3.desk(-35, 160, -24, 24);
        var stretch = function (s) { return TOP - s * LAB.lam * 100; };         /* the height of a point s (m, unstretched) below the clamp */
        var bot = stretch(Lu), dcm = d0 / Math.sqrt(LAB.lam) * 100;
        BEAM = stretch(0.18);                                                      /* the laser looks at the thread between the marks */
        if (near) {
          B3.stand(-14, 0, 100, { bw: 9, bd: 8 });
          B3.box3(-14, TX + 0.8, TOP, TOP + 1.2, -0.6, 0.6, '#c3c8cd');             /* the arm out to the thread */
          B3.cylAB([TX, TOP, TZ], [TX, bot, TZ], Math.max(0.04, dcm / 2), '#3a2a24', { seg: 8 });
          mk.forEach(function (s) { B3.cylAB([TX, stretch(s) + 0.08, TZ], [TX, stretch(s) - 0.08, TZ], Math.max(0.05, dcm / 2) + 0.03, '#f2f2f2', { seg: 8 }); });
          /* the bag with its nuts */
          B3.box3(TX - 2.4, TX + 2.4, bot - 7, bot, TZ - 1.6, TZ + 1.6, 'rgba(235,240,245,.45)', { id: 'c:bag' });
          for (var i = 0; i < LAB.N; i++) { var q = i % 5, r = Math.floor(i / 5);
            B3.prism3('y', bot - 6.9 + r * 0.5, bot - 6.5 + r * 0.5, [[0.7, 0], [0.35, 0.6], [-0.35, 0.6], [-0.7, 0], [-0.35, -0.6], [0.35, -0.6]].map(function (p) { return [TX - 1.6 + q * 0.8 + p[0], TZ + p[1]]; }), '#9aa0a6'); }
          B3.text3([TX - 2.2, bot - 1.2, TZ + 1.65], [1, 0, 0], [0, -1, 0], '5.00 g', 0.7, '#2b2b2b', { weight: '700' });
          /* the dish of nuts */
          B3.cyl3('y', 0, 0.8, 16, 14, 4, '#e8e4dc', { id: 'c:dish', seg: 24, cap: '#f2efe8' });
          for (i = 0; i < 15 - LAB.N; i++) B3.prism3('y', 0.8, 1.2, [[0.7, 0], [0.35, 0.6], [-0.35, 0.6], [-0.7, 0], [-0.35, -0.6], [0.35, -0.6]].map(function (p) { return [16 - 2.4 + (i % 4) * 1.6 + p[0], 14 - 2 + Math.floor(i / 4) * 1.3 + p[1]]; }), '#9aa0a6');
          /* the standing stick, the laser */
          B3.meterStick(6, -1, 100, 'm:stick');
          B3.stand(-26, -6, 100, { bw: 5, bd: 5 }); B3.box3(-27.3, -24.7, BEAM - 1.3, BEAM + 1.3, -7.3, 1.3, '#3a3f46', { top: '#474c55' });
          B3.cyl3('x', -29, -22, BEAM, 0, 1.1, '#1e2a22', { seg: 18 }); B3.box3(-26.5, -25.5, BEAM - 0.4, BEAM + 0.4, -7, -1, '#c3c8cd'); B3.cyl3('x', -22, -21.7, BEAM, 0, 0.35, '#6dff7a', { seg: 12 });
          B3.line3([-21.7, BEAM, 0], [TX - 0.05, BEAM, 0], 'rgba(90,255,120,.75)', 1.6);
          B3.line3([TX + 0.05, BEAM, 0], [LAB.Lx - 0.3, BEAM, 0], 'rgba(90,255,120,.45)', 1.2);
        }
        if (b.clicked('c:dish')) { if (LAB.N < 15) { LAB.N++; LAB.tLoad = b.t; } }
        if (b.clicked('c:bag')) { if (LAB.N > 0) { LAB.N--; LAB.tLoad = b.t; } }
        /* the screen and the tape */
        var ms = b.moved('screen'); if (ms[0]) LAB.Lx = Math.max(30, Math.min(150, LAB.Lx + ms[0]));
        var X = LAB.Lx, y0 = BEAM - SH / 2 - 0.31;
        B3.box3(X, X + 4, 0, 1.2, -SW / 2, SW / 2, '#3b3f45', { id: 'm:screen', top: '#474c55' });
        B3.box3(X + 0.9, X + 1.7, 1.2, y0, -0.5, 0.5, '#9aa0a6', { id: 'm:screen' });
        B3.box3(X + 0.3, X + 0.9, y0 - 0.3, y0 + SH + 0.3, -SW / 2 - 0.3, SW / 2 + 0.3, '#5c6670', { id: 'm:screen' });
        paint(); B3.tex3(scr, 0, 0, scr.width, scr.height, [X - 0.01, y0 + SH, -SW / 2], [0, 0, SW], [0, -SH, 0], { id: 'm:screen' });
        B3.tex3(tape, 0, 0, tape.width, tape.height, [TX - 1 - tape0, 0.02, 5.5], [152, 0, 0], [0, 0, 2.5], { id: 'm:tape' });
        var V = b.views; V.screen.tx = X; V.screen.ty = BEAM; V.tape.tx = X; V.stick.ty = (stretch(mk[0]) + stretch(mk[1])) / 2;
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>

  <script src="simfull.js"></script>
