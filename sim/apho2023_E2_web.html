   arithmetic, checked against the Python original to 5e-14 relative

  vt3d: ["3D bench", "3D 실험대"], vtbench: ["optical bench (2D)", "광학대 (2D)"], vtscreen: ["screen", "스크린"], vtctrl: ["control box · meters", "컨트롤 박스 · 멀티미터"], vtwire: ["cabling", "배선"],
  cap_3d: ["the bench in 3D — drag to turn, Shift+drag to pan, wheel to zoom / drag the screen or the target along the rail / click the screen, the control box or the rail for its 2D view",
           "3D 실험대 — 끌면 회전, Shift+끌기 이동, 휠 확대 / 스크린이나 시료를 끌어 레일을 따라 이동 / 스크린·컨트롤 박스·레일을 클릭하면 2D 보기"],

  cap_screen: ["the screen face on — the reflected pattern; lay the ruler on it from the parts box", "스크린 정면 — 반사 무늬, 부품함의 자를 올려 재세요"],

  /* text printed on the drawings */
  benchcm: ["optical bench, cm", "광학대, cm"],

  wirehint:["Click a terminal, then click the one it goes to.  Click a lead "
            + "to pull it out, right-click to cancel.",
            "단자를 클릭한 뒤 연결할 단자를 클릭하세요.  리드를 클릭하면 "
            + "빠지고, 우클릭하면 취소됩니다."],

/* the index page hands the language over in the query string; that wins,
   then whatever was stored here, then the browser's own setting */
let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
function tr(k){ const e = I18N[k]; return e ? (LANG === "ko" ? e[1] : e[0]) : k; }

/* ------------------------- constants ------------------------------ */
const LAMBDA = 650.0e-9;
const R_BASE_LAMBDA = 167.82;
const P_THRESHOLD = 287.0;
const N_SLOPE = 0.4632;
const P_YIELD_NOM = 363.6;

/* ------------------------- randomness ----------------------------- */
function mulberry(seed){
  return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function gauss(rng){                                     /* Box-Muller */
  let u = 0, v = 0;
  while (!u) u = rng(); while (!v) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ==================================================================
   ThermoModel  -  laser diode -> PMMA surface -> reflected pattern

     height of the bump    h      = m_max * lambda / 2
     number of fringes     m_max  = 0.4632 (P - 287)      [official fit]
     dark fringe           R_base sin(alpha_m) = m lambda
                           R_base = 167.82 lambda
   The two innermost orders are hidden inside the bright central spot,
   so the order you can actually count is m' = m - 2.  Above the yield
   power the surface melts and the deformation is frozen in.
   ================================================================== */
class ThermoModel {
  constructor(rng){
    this.rng = rng;
    this.R_base_lam = R_BASE_LAMBDA * (1 + 0.015 * gauss(rng));
    this.P_th = P_THRESHOLD * (1 + 0.004 * gauss(rng));
    this.slope = N_SLOPE * (1 + 0.03 * gauss(rng));
    this.P_yield = P_YIELD_NOM * (1 + 0.02 * gauss(rng));
    this.hidden = 2.0 + 0.10 * gauss(rng);
    this.iv_a = 0.35928;
    this.iv_b = 0.73823 * (1 + 0.004 * gauss(rng));
    this.spot_key = "0,0";
    this.spots = new Map();
    this.melted = false;
    this.melt_extra = 0.0;
    this.m_frozen = 0.0;
    this.dirty = Math.abs(0.35 * gauss(rng));      /* contamination */
    this.ellipticity = 1.0 + Math.abs(0.012 * gauss(rng));
    this.tilt = rng() * Math.PI;
  }
  diode_voltage(mA){
    if (mA <= 1.0) return 0.0;
    return this.iv_a + this.iv_b * Math.log(mA);
  }
  read_meters(mA){                     /* two multimeters, with noise */
    const i = mA + 0.12 * gauss(this.rng);
    const v = this.diode_voltage(mA) + 0.004 * gauss(this.rng);
    return [Math.round(i * 10) / 10, Math.round(v * 100) / 100];
  }
  power_true(mA){ return mA * this.diode_voltage(mA); }

  m_max(mA){
    const P = this.power_true(mA);
    const n_th = Math.max(this.slope * (P - this.P_th), 0.0);
    if (P > this.P_yield){
      this.melted = true;
      /* the plastic part takes over from the thermal one, so nothing
         jumps as the surface starts to yield */
      this.m_frozen = Math.max(this.m_frozen, n_th);
    }
    if (this.melted) return Math.max(n_th, this.m_frozen);
    return n_th;
  }
  height_lambda(mA){ return this.m_max(mA) / 2.0; }

  intensity(nu, mmax){
    const core = 1.35 * Math.exp(-Math.pow(nu / 1.55, 2));
    const env = 0.80 * Math.exp(-0.85 * Math.pow(nu / Math.max(mmax, 1.0), 2));
    const cutoff = 0.5 * (1.0 - Math.tanh((nu - mmax) / 0.55));
    const s = Math.sin(Math.PI * nu);
    let ring = env * cutoff * s * s;
    ring *= 0.5 * (1.0 + Math.tanh((nu - this.hidden) / 0.55));
    return core + ring;
  }

  /* one point of the pattern, in cm on the screen, before the speckle */
  pixel(mA, L_cm, X, Y, mmax, Pw){
    const ca = Math.cos(this.tilt), sa = Math.sin(this.tilt);
    const Xr = X * ca + Y * sa, Yr = -X * sa + Y * ca;
    const Rr = Math.hypot(Xr / this.ellipticity, Yr * this.ellipticity);
    const nu = this.R_base_lam * Math.sin(Math.atan2(Rr, L_cm));
    let img = (mmax > 0.4) ? this.intensity(nu, mmax)
                           : 1.35 * Math.exp(-Math.pow(nu / 1.55, 2));
    /* brightness follows the drive: below the fringe threshold the knob
       still does something visible, as it does on the bench */
    img *= Math.min(Math.max(Pw / 300.0, 0.0), 1.6);
    if (this.dirty > 0.25)
      img *= 1.0 + 0.05 * this.dirty * Math.cos(4.0 * Math.atan2(Yr, Xr));
    return img;
  }

  /* The stand slides the plate across the beam.  Every spot keeps its
     own history, so a shot that has been melted is still melted when
     you wind the stand back to it. */
  goto_spot(key){
    this.spots.set(this.spot_key, [this.melted, this.melt_extra,
                                   this.R_base_lam, this.m_frozen]);
    this.spot_key = key;
    if (this.spots.has(key)){
      const s = this.spots.get(key);
      this.melted = s[0]; this.melt_extra = s[1];
      this.R_base_lam = s[2]; this.m_frozen = s[3];
    } else {
      this.melted = false;
      this.melt_extra = 0.0;
      this.m_frozen = 0.0;
      this.R_base_lam = R_BASE_LAMBDA * (1 + 0.015 * gauss(this.rng));
    }
  }
}

/* the deep red of a 650 nm diode.  numpy casts the ramp with
   astype(uint8), which truncates, so this truncates too */
const LASER_STOPS = [[0.00, 0, 0, 0], [0.18, 42, 0, 0], [0.40, 139, 0, 8],
                     [0.62, 224, 16, 32], [0.82, 255, 90, 85],
                     [1.00, 255, 233, 230]];
function laser_rgb(v, d, k){
  const x = Math.min(Math.max(v / 1.35, 0), 1);
  for (let i = 0; i < LASER_STOPS.length - 1; i++){
    const a = LASER_STOPS[i], b = LASER_STOPS[i + 1];
    if (x >= a[0] && x <= b[0]){
      const f = (x - a[0]) / (b[0] - a[0]);
      d[k]     = (a[1] + f * (b[1] - a[1])) | 0;
      d[k + 1] = (a[2] + f * (b[2] - a[2])) | 0;
      d[k + 2] = (a[3] + f * (b[3] - a[3])) | 0;
      return;
    }
  }
  d[k] = 255; d[k + 1] = 233; d[k + 2] = 230;
}

/* ==================================================================
   The 30 cm clear plastic ruler from the apparatus list.

   It is an object lying on the screen, not a read-out: drag it where
   you want it, roll the wheel over it to swing it round, and read the
   fringe positions off its own millimetre scale.  Nothing anywhere
   prints a radius for you.
   ================================================================== */
class Ruler {
  constructor(){
    this.LEN = 30.0;      /* cm, the printed scale runs 0 .. 30 */
    this.WID = 3.0;
    this.TRANS = 0.86;    /* two air/acrylic surfaces, ~8% lost at each */
    this.x = 0.0; this.y = 13.0; this.ang = 0.0; this.on = false;
  }
  local(X, Y){                       /* screen cm -> ruler cm (u, v) */
    const ca = Math.cos(-this.ang), sa = Math.sin(-this.ang);
    const dx = X - this.x, dy = Y - this.y;
    return [dx * ca - dy * sa, dx * sa + dy * ca];
  }
  contains(X, Y){
    const [u, v] = this.local(X, Y);
    return this.on && Math.abs(u) <= this.LEN / 2 && Math.abs(v) <= this.WID / 2;
  }
  /* What the ruler looks like lying on the screen, as colour.  Clear
     acrylic transmits most of the light and reflects the rest, so the
     fringes stay visible through it but dimmed - that part is still the
     laser's deep red.  What the ruler itself shows is not: the bevelled
     edges pipe light along their length and the engraved graduations
     scatter it, and both come back neutral. */
  shade(u, v, I, out){
    laser_rgb(Math.min(Math.max(I * this.TRANS, 0), 1.6), out, 0);
    let r = out[0] + 11, g = out[1] + 13, b = out[2] + 17;
    const e = Math.exp(-Math.pow((Math.abs(v) - this.WID / 2) / 0.085, 2));
    r += 54 * e; g += 62 * e; b += 72 * e;
    out[0] = Math.min(255, r) | 0;
    out[1] = Math.min(255, g) | 0;
    out[2] = Math.min(255, b) | 0;
  }
  /* The engraved millimetre scale, as segments in screen cm.  These are
     drawn rather than sampled into the image: a millimetre is only about
     1.2 screen pixels, so putting the marks into the pixel grid turned
     them into an aliased hash instead of a scale you could read. */
  ticks(){
    const ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    const half = this.WID / 2, out = [];
    for (let k = 0; k <= 300; k++){
      const u = k * 0.1 - this.LEN / 2;
      const tl = (k % 10 === 0) ? 0.66 : ((k % 5 === 0) ? 0.42 : 0.22);
      const v0 = half, v1 = half - tl;
      out.push([this.x + u * ca - v0 * sa, this.y + u * sa + v0 * ca,
                this.x + u * ca - v1 * sa, this.y + u * sa + v1 * ca,
                k % 10 === 0, k % 5 === 0]);
    }
    return out;
  }
}

/* ==================================================================
   application state  (class App of the desktop program)
   ================================================================== */
const seed = (Math.random() * 1e9) | 0;
const app = {
  seed: seed,
  rng: mulberry(seed),
  model: null,
  on: false,          /* the mechanical switch on the box */
  lit: false,         /* whether the circuit actually lights the diode */
  cur: 40.0,
  fine: false,
  knob_a: 0.0,
  reading: [0.0, 0.0],
  x_target: 0.0,
  x_screen: 49.2,
  ruler: null,
  L(){ return this.x_screen - this.x_target; },
};
app.model = new ThermoModel(app.rng);
app.ruler = new Ruler();

/* ==================================================================
   the cabling page  (class WiringPage)
   ================================================================== */
const WP = {
  W: 1010, H: 560, R: 9,
  FACE: "#4fa6dc", BODY: "#2e3134", NAVY: "#16324f",
  links: new Set(), held: null, mouse: [0, 0],
  T: {
    adaptor:  {x: 150, y: 470, col: "#2b6fa8", lab: ""},
    box_dc:   {x: 356, y: 470, col: "#2b6fa8", lab: ""},
    box_lp:   {x: 356, y: 150, col: "#c02020", lab: ""},
    box_ln:   {x: 356, y: 250, col: "#2b2e32", lab: ""},
    amp_in:   {x: 560, y:  96, col: "#c02020", lab: ""},
    amp_com:  {x: 560, y: 176, col: "#2b2e32", lab: ""},
    volt_in:  {x: 800, y:  96, col: "#c02020", lab: ""},
    volt_com: {x: 800, y: 176, col: "#2b2e32", lab: ""},
    laser_p:  {x: 620, y: 330, col: "#c02020", lab: "+"},
    laser_n:  {x: 620, y: 410, col: "#2b2e32", lab: "\u2212"},
  },
  /* only these pairs can be joined - including the classic mistakes,
     which are allowed precisely so that they can be made */
  ALLOWED: new Set(["adaptor|box_dc", "amp_in|box_lp", "amp_com|laser_p",
                    "box_ln|laser_n", "laser_p|volt_in", "laser_n|volt_com",
                    "box_lp|laser_p", "amp_in|laser_p", "amp_com|laser_n",
                    "box_lp|volt_in", "box_ln|volt_com"]),
  MULTI: new Set(["laser_p", "laser_n", "box_lp", "box_ln"]),
};
const key2 = (a, b) => [a, b].sort().join("|");
const linked = (a, b) => WP.links.has(key2(a, b));

function wireState(){
  const powered = linked("adaptor", "box_dc");
  const series = linked("box_lp", "amp_in") && linked("amp_com", "laser_p")
              && linked("laser_n", "box_ln");
  const direct = linked("box_lp", "laser_p") && linked("laser_n", "box_ln");
  const shorted = linked("amp_in", "laser_p") && linked("amp_com", "laser_n");
  /* the POWER switch is part of the circuit too: with it off the box
     passes nothing, so there is no beam anywhere */
  const lit = app.on && powered && (series || direct) && !shorted;
  return {powered: powered, lit: lit, shorted: shorted,
          amp: series && lit,
          volt: linked("volt_in", "laser_p") && linked("volt_com", "laser_n")
                && lit};
}

function readMeters(){
  const st = wireState();
  let i = 0.0, v = 0.0;
  if (st.lit){ const r = app.model.read_meters(app.cur); i = r[0]; v = r[1]; }
  /* an unconnected meter shows nothing at all, not a zero */
  app.reading = [st.amp ? i : null, st.volt ? v : null];
  app.lit = st.lit;
}

function wireAt(x, y){
  for (const k in WP.T){
    const d = WP.T[k];
    if (Math.hypot(x - d.x, y - d.y) <= WP.R + 7) return k;
  }
  return null;
}
function bezPoint(a, b, f){
  return [a.x + (b.x - a.x) * f,
          a.y + (b.y - a.y) * f + 24 * Math.sin(Math.PI * f)];
}
function cableAt(x, y){
  for (const lk of WP.links){
    const [a, b] = lk.split("|");
    for (let n = 0; n <= 43; n++){
      const p = bezPoint(WP.T[a], WP.T[b], n / 43);
      if (Math.hypot(x - p[0], y - p[1]) < 7) return lk;
    }
  }
  return null;
}
function plug(a, b){
  for (const end of [a, b]){
    if (WP.MULTI.has(end)) continue;
    for (const lk of [...WP.links]) if (lk.split("|").includes(end))
      WP.links.delete(lk);
  }
  WP.links.add(key2(a, b));
}

/* ==================================================================
   drawing helpers
   ================================================================== */
function ctxOf(id){
  const cv = document.getElementById(id);
  const g = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.width, h = cv.height;
  if (cv.dataset.fitted !== String(dpr)){
    cv.dataset.fitted = String(dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.dataset.w = w; cv.dataset.h = h;
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return g;
}
function txt(g, x, y, s, col, px, bold, anchor){
  g.fillStyle = col;
  g.font = (bold ? "bold " : "") + (px || 11) + "px "
         + '"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  g.textAlign = anchor || "center";
  g.textBaseline = "middle";
  const lines = String(s).split("\n");
  const lh = (px || 11) * 1.2;
  lines.forEach((ln, i) =>
    g.fillText(ln, x, y + (i - (lines.length - 1) / 2) * lh));
}
function mono(g, x, y, s, col, px, anchor){
  g.fillStyle = col;
  g.font = "bold " + px + "px ui-monospace,Consolas,monospace";
  g.textAlign = anchor || "center";
  g.textBaseline = "middle";
  g.fillText(s, x, y);
}
function rect(g, x0, y0, x1, y1, fill, out, w){
  if (fill){ g.fillStyle = fill; g.fillRect(x0, y0, x1 - x0, y1 - y0); }
  if (out){ g.strokeStyle = out; g.lineWidth = w || 1;
            g.strokeRect(x0, y0, x1 - x0, y1 - y0); }
}
function oval(g, x0, y0, x1, y1, fill, out, w, dash){
  g.save();
  if (dash) g.setLineDash(dash);
  g.beginPath();
  g.ellipse((x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) / 2, (y1 - y0) / 2,
            0, 0, 7);
  if (fill){ g.fillStyle = fill; g.fill(); }
  if (out){ g.strokeStyle = out; g.lineWidth = w || 1; g.stroke(); }
  g.restore();
}
function line(g, pts, col, w, dash){
  g.save();
  if (dash) g.setLineDash(dash);
  g.strokeStyle = col; g.lineWidth = w || 1;
  g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.stroke(); g.restore();
}

/* ==================================================================
   THE OPTICAL BENCH  (class BenchCanvas)
   ================================================================== */
const BW = 560, BH = 434;
const X_LASER = 72.0, X_FRONT = 66.0;
const bpx = cm => 40 + cm * (BW - 90) / 80.0;
const bcm = px => (px - 40) * 80.0 / (BW - 90);

function plateViews(g, x0, y0){
  /* The PMMA plate itself, not a graph: the face you shoot at, and the
     same plate seen edge on so that the swelling can be judged.  The
     bump is a few tens of wavelengths on a 3 mm plate, so at life size
     it is a third of a pixel: the edge view therefore shows a 0.25 mm
     square of the surface, at a stated scale. */
  const m = app.model;
  const h = app.lit ? m.height_lambda(app.cur) : 0.0;
  const hot = h > 0.05;
  const SLICE_M = 250e-6;
  const rise = Math.min(h * LAMBDA / SLICE_M * 60.0, 34.0);
  const base = m.R_base_lam * LAMBDA / SLICE_M * 60.0;

  rect(g, x0 - 30, y0 - 30, x0 + 30, y0 + 30, "#dff0f5", "#7fa3ad", 2);
  oval(g, x0 - 2, y0 - 2, x0 + 2, y0 + 2, hot ? "#ff9a3c" : "#d9c4b0");
  txt(g, x0, y0 + 42, tr("pfront"), "#5c6169", 10);

  const ex = x0 + 128, ey = y0;
  const half = Math.max(base, 6.0);
  g.beginPath();
  g.moveTo(ex - 22, ey - 30); g.lineTo(ex - 22, ey + 30);
  for (let k = 0; k <= 60; k++){
    const u = 1.0 - k / 30.0;
    g.lineTo(ex + 22 + rise * Math.exp(-Math.pow(u * 30.0 / half, 2)),
             ey + 30 * u);
  }
  g.closePath();
  g.fillStyle = "#dff0f5"; g.fill();
  g.strokeStyle = "#7fa3ad"; g.lineWidth = 2; g.stroke();
  line(g, [ex + 22, ey - 30, ex + 22, ey + 30], "#b7ced6", 1, [3, 3]);
  txt(g, ex, ey + 42, tr("psurf"), "#5c6169", 10);
  txt(g, x0 - 44, ey, tr("lifesize"), "#8b8f96", 10);
}

function drawBench(){
  const g = ctxOf("bench");
  g.clearRect(0, 0, BW, BH);
  g.fillStyle = "#e9e7e2"; g.fillRect(0, 0, BW, BH);
  g.strokeStyle = "#999"; g.lineWidth = 1; g.strokeRect(0.5, 0.5, BW - 1, BH - 1);

  const yb = 290;
  rect(g, 24, yb, BW - 24, yb + 16, "#b9bcc2", "#8b8f96", 1);
  for (let cm = 0; cm <= 80; cm += 5){
    const x = bpx(cm);
    line(g, [x, yb, x, yb - 6], "#6b7076", 1);
    txt(g, x, yb - 13, String(cm), "#6b7076", 10);
  }
  txt(g, BW - 28, yb + 26, tr("benchcm"), "#6b7076", 10, false, "right");

  const xs = bpx(app.x_screen), xt = bpx(app.x_target), xl = bpx(X_LASER);
  const beam_y = 190;

  rect(g, xl - 6, yb - 40, xl + 6, yb, "#7d848c", "#5c6169", 1);
  rect(g, xl - 26, beam_y - 13, xl + 30, beam_y + 13, "#4a5059", "#2f343a", 1);
  rect(g, xl - 34, beam_y - 6, xl - 26, beam_y + 6, "#2f343a");
  txt(g, xl + 2, beam_y - 22, tr("laser"), "#4a5059", 11);

  rect(g, xs - 3, beam_y - 96, xs + 3, yb, "#dcdcd4", "#9a9a92", 1);
  rect(g, xs - 4, beam_y - 5, xs + 4, beam_y + 5, "#e9e7e2");
  txt(g, xs, beam_y - 104, tr("scrhole"), "#5c6169", 11);

  rect(g, xt - 5, beam_y - 60, xt + 5, beam_y + 60, "#cfe0e6", "#7fa3ad", 2);
  rect(g, xt - 10, yb - 34, xt + 10, yb, "#7d848c", "#5c6169", 1);
  txt(g, xt, beam_y - 72, tr("target"), "#4d707a", 11);

  if (app.lit && app.cur > 2.0){
    const bw = 1 + Math.floor(3.0 * Math.min(
      app.model.power_true(app.cur) / 380.0, 1.0));
    line(g, [xl - 26, beam_y, xt + 5, beam_y], "#e02020", bw);
    for (const dy of [-1, 1])
      line(g, [xt + 5, beam_y, xs - 3, beam_y + dy * 78], "#e02020", 1);
  }
  /* the distance the student has to quote */
  line(g, [xt, beam_y + 78, xs, beam_y + 78], "#30507a", 1);
  for (const [x, s] of [[xt, 1], [xs, -1]]){
    g.fillStyle = "#30507a"; g.beginPath();
    g.moveTo(x, beam_y + 78);
    g.lineTo(x + s * 7, beam_y + 74); g.lineTo(x + s * 7, beam_y + 82);
    g.closePath(); g.fill();
  }
  txt(g, (xt + xs) / 2, beam_y + 89, "L", "#30507a", 12, true);
  txt(g, 12, 14, tr("draghint"), "#8b8f96", 11, false, "left");
  plateViews(g, 100, 360);
}

/* dragging the screen and the target along the rail */
(function(){
  const cv = document.getElementById("bench");
  let drag = null;
  const at = ev => {
    const b = cv.getBoundingClientRect();
    return [(ev.clientX - b.left) * BW / b.width,
            (ev.clientY - b.top) * BH / b.height];
  };
  cv.addEventListener("pointerdown", ev => {
    const [x, y] = at(ev);
    for (const [name, cm] of [["screen", app.x_screen], ["target", app.x_target]])
      if (Math.abs(x - bpx(cm)) < 14 && y > 60 && y < 235){
        drag = name; cv.setPointerCapture(ev.pointerId); return;
      }
  });
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    const [x] = at(ev);
    const cm = Math.max(0.0, Math.min(X_FRONT, bcm(x)));
    if (drag === "screen")
      app.x_screen = Math.min(Math.max(cm, app.x_target + 5.0), X_FRONT);
    else
      app.x_target = Math.min(cm, app.x_screen - 5.0);
    refresh();
  });
  const stop = () => { drag = null; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
})();

/* ==================================================================
   THE CONTROL BOX AND THE TWO MULTIMETERS  (class ControlCanvas)
   ================================================================== */
const CW = 560, CH = 210;
const KX = 150, KY = 108, KR = 34;
const SX = 40, SY = 78, SW = 62, SH = 30;

function drawCtrl(){
  const g = ctxOf("ctrl");
  g.clearRect(0, 0, CW, CH);
  g.fillStyle = "#e9e7e2"; g.fillRect(0, 0, CW, CH);

  rect(g, 20, 30, 300, 190, "#2f6fa8", "#1d4a72", 2);
  txt(g, 30, 44, tr("ctrlbox"), "#dbe8f4", 12, true, "left");

  rect(g, SX, SY, SX + SW, SY + SH, app.on ? "#3fbf5f" : "#8b3030",
       "#123", 2);
  txt(g, SX + SW / 2, SY + SH / 2, app.on ? "ON" : "OFF", "#ffffff", 12, true);
  txt(g, SX + SW / 2, SY - 10, tr("power"), "#dbe8f4", 10);

  /* the knurled current knob.  Its pointer accumulates as you turn it,
     exactly as the desktop one does: it is not an absolute dial, or you
     could read the current off the knob instead of off the meter */
  oval(g, KX - KR, KY - KR, KX + KR, KY + KR, "#d9dde2", "#8b8f96", 2);
  oval(g, KX - 10, KY - 10, KX + 10, KY + 10, "#b6bcc4", "#8b8f96", 1);
  const a = app.knob_a;
  line(g, [KX + (KR - 6) * Math.sin(a), KY - (KR - 6) * Math.cos(a),
           KX + 10 * Math.sin(a), KY - 10 * Math.cos(a)], "#c02020", 3);
  txt(g, KX, KY + KR + 12, "CURRENT  Adjust", "#dbe8f4", 11);
  txt(g, KX, KY + KR + 24, tr(app.fine ? "fine" : "coarse"), "#a9c4dc", 10);

  txt(g, 232, 76, "LASER", "#dbe8f4", 11);
  oval(g, 222, 86, 242, 106,
       (app.lit && app.cur > 2.0) ? "#ff4030" : "#603030", "#123", 1);
  txt(g, 232, 120, "DC 12 V", "#dbe8f4", 10);

  const [i, v] = app.reading;
  [["DC mA", i, "mA"], ["DC V", v, "V"]].forEach((row, k) => {
    const [lab, val, unit] = row;
    const X = 330 + k * 118;
    rect(g, X, 30, X + 104, 190, "#b5443f", "#7d2b28", 2);
    rect(g, X + 10, 46, X + 94, 86, "#101810", "#0a0d0a", 1);
    const s = (val === null) ? "  . "
            : (unit === "mA" ? val.toFixed(1) : val.toFixed(2));
    mono(g, X + 88, 66, s, "#7dff9d", 15, "right");
    txt(g, X + 52, 98, lab, "#f3dedd", 11, true);
    oval(g, X + 40, 120, X + 64, 144, "#8d3733", "#5c1f1c", 1);
    txt(g, X + 52, 176, tr("multim"), "#f3dedd", 10);
  });
}

function turnKnob(s){
  app.knob_a += s * 0.35;
  /* set_current of the desktop program: 0.1 mA resolution, and the
     diode's own limit at 115 mA */
  const v = app.cur + s * (app.fine ? 0.1 : 1.0);
  app.cur = Math.max(0.0, Math.min(115.0, Math.round(v * 10) / 10));
  readMeters();
  refresh();
}
(function(){
  const cv = document.getElementById("ctrl");
  const at = ev => {
    const b = cv.getBoundingClientRect();
    return [(ev.clientX - b.left) * CW / b.width,
            (ev.clientY - b.top) * CH / b.height];
  };
  cv.addEventListener("click", ev => {
    const [x, y] = at(ev);
    if (x >= SX && x <= SX + SW && y >= SY && y <= SY + SH){
      app.on = !app.on; readMeters(); refresh(); return;
    }
    const d = Math.hypot(x - KX, y - KY);
    if (d <= KR + 5){
      if (d < 11){ app.fine = !app.fine; refresh(); }
      else turnKnob(x > KX ? 1 : -1);
    }
  });
  cv.addEventListener("wheel", ev => {
    const [x, y] = at(ev);
    if (Math.hypot(x - KX, y - KY) > KR + 5) return;
    ev.preventDefault();
    turnKnob(ev.deltaY < 0 ? 1 : -1);
  }, {passive: false});
})();

/* ==================================================================
   THE SCREEN  (class ScreenCanvas)
   ================================================================== */
const SCW = 560, HALF = 20.0, NGRID = 420;
const spx = cm => SCW / 2 + cm * (SCW - 70) / (2 * HALF);
const scm = px => (px - SCW / 2) * 2 * HALF / (SCW - 70);
const offc = document.createElement("canvas");
offc.width = NGRID; offc.height = NGRID;
const offg = offc.getContext("2d");

function drawScreen(){
  const g = ctxOf("screen");
  g.clearRect(0, 0, SCW, SCW);
  g.fillStyle = "#20211f"; g.fillRect(0, 0, SCW, SCW);

  const im = offg.createImageData(NGRID, NGRID);
  const d = im.data;
  const live = app.lit && app.cur > 2.0;
  const Ical = new Float32Array(NGRID * NGRID);
  if (live){
    const m = app.model, L = app.L();
    const mmax = m.m_max(app.cur);          /* this is where it can melt */
    const Pw = m.power_true(app.cur);
    const rg = mulberry(7);                 /* the speckle is fixed */
    for (let j = 0; j < NGRID; j++){
      const Y = -HALF + 2 * HALF * j / (NGRID - 1);
      for (let i2 = 0; i2 < NGRID; i2++){
        const X = -HALF + 2 * HALF * i2 / (NGRID - 1);
        let I = m.pixel(app.cur, L, X, Y, mmax, Pw);
        /* the speckle scales with the light that is actually there: a
           flat dither would put false minima in the black background
           outside the pattern and make the ring count ambiguous */
        I += 0.030 * Math.sqrt(Math.max(I, 0)) * (rg() - 0.5) + 0.0015 * rg();
        I = Math.max(0, Math.min(1.6, I));
        Ical[j * NGRID + i2] = I;
        const k = (j * NGRID + i2) * 4;
        laser_rgb(I, d, k);
        d[k + 3] = 255;
      }
    }
  } else {
    for (let k = 3; k < d.length; k += 4) d[k] = 255;
  }
  /* the ruler, composited into the pixels it actually covers */
  const R = app.ruler, px4 = new Uint8ClampedArray(4);
  if (R.on) for (let j = 0; j < NGRID; j++){
    const Y = -HALF + 2 * HALF * j / (NGRID - 1);
    for (let i2 = 0; i2 < NGRID; i2++){
      const X = -HALF + 2 * HALF * i2 / (NGRID - 1);
      const [u, v] = R.local(X, Y);
      if (Math.abs(u) > R.LEN / 2 || Math.abs(v) > R.WID / 2) continue;
      const k = (j * NGRID + i2) * 4;
      R.shade(u, v, Ical[j * NGRID + i2], px4);
      d[k] = px4[0]; d[k + 1] = px4[1]; d[k + 2] = px4[2]; d[k + 3] = 255;
    }
  }
  offg.putImageData(im, 0, 0);
  /* the image spans exactly the pixels the geometry does, so a length
     read off the ruler is the length the model used */
  const x0 = spx(-HALF), span = spx(HALF) - spx(-HALF);
  g.imageSmoothingEnabled = true;
  g.drawImage(offc, x0, x0, span, span);

  /* the printed scale, drawn crisp on top of the plastic */
  if (R.on) for (const t of R.ticks()){
    if (Math.max(Math.abs(t[0]), Math.abs(t[1])) > HALF) continue;
    line(g, [spx(t[0]), spx(t[1]), spx(t[2]), spx(t[3])],
         t[4] ? "#eef3f8" : (t[5] ? "#d6dee6" : "#9fadb8"), 1);
  }

  /* the numbers printed on the ruler */
  const rca = Math.cos(R.ang), rsa = Math.sin(R.ang);
  g.save(); g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "10px \"Segoe UI\",Roboto,sans-serif";
  if (R.on) for (let cmv = 0; cmv <= 30; cmv += 5){
    const uu = cmv - R.LEN / 2, vv = R.WID / 2 - 1.02;
    const X = R.x + uu * rca - vv * rsa, Y = R.y + uu * rsa + vv * rca;
    if (Math.abs(X) > HALF || Math.abs(Y) > HALF) continue;
    g.save(); g.translate(spx(X), spx(Y)); g.rotate(R.ang);
    g.fillStyle = "#dfe6ec"; g.fillText(String(cmv), 0, 0); g.restore();
  }
  if (R.on) {
    const uu = R.LEN / 2 - 2.6, vv = -R.WID / 2 + 0.75;
    const X = R.x + uu * rca - vv * rsa, Y = R.y + uu * rsa + vv * rca;
    if (Math.abs(X) <= HALF && Math.abs(Y) <= HALF){
      g.save(); g.translate(spx(X), spx(Y)); g.rotate(R.ang);
      g.fillStyle = "#b9c4cd"; g.fillText("cm", 0, 0); g.restore();
    }
  }
  g.restore();

  /* the hole the incoming beam goes through */
  oval(g, SCW / 2 - 5, SCW / 2 - 5, SCW / 2 + 5, SCW / 2 + 5,
       null, "#8090a0", 1, [2, 2]);

}

(function(){
  const cv = document.getElementById("wire");
  const at = ev => {
    const b = cv.getBoundingClientRect();
    return [(ev.clientX - b.left) * WP.W / b.width,
            (ev.clientY - b.top) * WP.H / b.height];
  };
  cv.addEventListener("click", ev => {
    const [x, y] = at(ev);

      app.on = !app.on; readMeters(); refresh(); return;
    }
    const k = wireAt(x, y);
    if (k !== null){
      if (WP.held === null || WP.held === k)
        WP.held = (WP.held === k) ? null : k;
      else if (WP.ALLOWED.has(key2(WP.held, k))){
        plug(WP.held, k); WP.held = null; readMeters(); refresh(); return;
      } else WP.held = k;
      drawWire(); return;
    }
    const c = cableAt(x, y);
    if (c !== null){
      WP.links.delete(c); WP.held = null; readMeters(); refresh(); return;
    }
    WP.held = null; drawWire();
  });
  cv.addEventListener("mousemove", ev => {
    WP.mouse = at(ev);
    if (WP.held !== null) drawWire();
  });
  cv.addEventListener("contextmenu", ev => {
    ev.preventDefault(); WP.held = null; drawWire();
  });
})();

/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  return [CAM.W/2+CAM.px+xr*CAM.k, CAM.H/2+CAM.py-up*CAM.k, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;
  const dz=(dx*c-xr)/s, dy=(up+(dx*s+dz*c)*sp)/cp;
  return [x0, CAM.ty+dy, CAM.tz+dz];
}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const _shadeCache=new Map();
function shade(col,f){
  const key=col+"|"+f.toFixed(2); let v=_shadeCache.get(key); if(v) return v;
  let a=1, rgb;
  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));
  v=a<1?`rgba(${r[0]},${r[1]},${r[2]},${a})`:`rgb(${r[0]},${r[1]},${r[2]})`;
  _shadeCache.set(key,v); return v;
}
const LIGHT=(()=>{ const v=[-0.45,0.85,0.35], n=Math.hypot(...v); return v.map(a=>a/n); })();
let ITEMS=[], HITS=[];
function begin3(){ ITEMS=[]; }
function _cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
function _sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
/* a flat polygon; o = {fill, stroke, lw, id, layer, cull, flat, bias, alpha} */
function face(pts,o){
  o=o||{};
  const n=_cross(_sub(pts[1],pts[0]),_sub(pts[2],pts[0])), nl=Math.hypot(...n)||1;
  const nn=n.map(a=>a/nl);
  const lum=o.flat?1:0.62+0.48*Math.max(0,nn[0]*LIGHT[0]+nn[1]*LIGHT[1]+nn[2]*LIGHT[2]);
  ITEMS.push({t:"f",p:pts,o,lum,n:nn});
}
function quad(a,b,c,d,o){ face([a,b,c,d],o); }
/* axis-aligned box, outward faces culled when they point away */
function box3(x0,x1,y0,y1,z0,z1,col,o){
  o=Object.assign({cull:true},o||{}); const f=Object.assign({},o,{fill:col});
  const t=o.top?Object.assign({},f,{fill:o.top}):f;
  face([[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],t);          /* top    +y */
  face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],f);          /* bottom -y */
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f);          /* +z */
  face([[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],f);          /* -z */
  face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],f);          /* +x */
  face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],f);          /* -x */

/* make a polygon face the direction `want` (a world vector) */
function orient(pts,want){

/* cylinder (or cone, with o.r1) along an axis ("x","y","z") from a0 to a1, centre (u,v) across it */

/* a prism: polygon pts2 [[u,v]..] in the plane across `axis`, extruded from a0 to a1 */
function prism3(axis,a0,a1,pts2,col,o){

  const P=(a,[u,v])=>axis==="x"?[a,u,v]:axis==="y"?[u,a,v]:[u,v,a];

  let cu=0,cvv=0; for(const [x,y] of pts2){ cu+=x; cvv+=y; } cu/=n; cvv/=n;
  face(orient(A,ax.map(c=>-c*sg)),f); face(orient(B,ax.map(c=>c*sg)),f);
  for(let i=0;i<n;i++){ const j=(i+1)%n; const q=[A[i],A[j],B[j],B[i]];
    const mid=[(pts2[i][0]+pts2[j][0])/2-cu,(pts2[i][1]+pts2[j][1])/2-cvv];
    face(orient(q,_sub(P(0,mid),P(0,[0,0]))),f); }
}
function line3(a,b,col,lw,o){ ITEMS.push({t:"l",p:[a,b],o:Object.assign({col,lw:lw||1},o||{})}); }
function poly3(pts,col,lw,o){ ITEMS.push({t:"pl",p:pts,o:Object.assign({col,lw:lw||1},o||{})}); }
/* text lying in the plane spanned by U (right) and V (up), size in cm */
function text3(O,U,V,str,size,col,o){ ITEMS.push({t:"x",p:[O],O,U,V,str,size,o:Object.assign({col},o||{})}); }
/* anything else: draw(ctx) is called in its depth order; ref is a world point */
function custom3(ref,draw,o){ ITEMS.push({t:"c",p:[ref],draw,o:o||{}}); }

function render3(ctx){
  const vis=[];
  for(const it of ITEMS){
    const q=it.p.map(p=>P3(p[0],p[1],p[2]));
    let dep=0; for(const v of q) dep+=v[2]; dep/=q.length;
    if(it.t==="f"&&it.o.cull){
      let a=0; for(let i=0;i<q.length;i++){ const j=(i+1)%q.length; a+=q[i][0]*q[j][1]-q[j][0]*q[i][1]; }
      if(a>=0) continue;                                  /* facing away */
    }
    vis.push({it,q,dep:dep+(it.o.bias||0),layer:it.o.layer||0});
  }
  vis.sort((a,b)=>a.layer-b.layer||a.dep-b.dep);
  HITS=[];
  for(const v of vis){
    const it=v.it, o=it.o, q=v.q;
    if(it.t==="f"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]); ctx.closePath();
      if(o.fill){ if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.fillStyle=o.flat?o.fill:shade(o.fill,it.lum); ctx.fill(); ctx.globalAlpha=1; }
      if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=o.lw||0.8; ctx.lineJoin="round"; ctx.stroke(); }
      else if(o.fill&&o.alpha===undefined){ ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=0.6; ctx.stroke(); }
      if(o.id) HITS.push([o.id,q]);
    }else if(it.t==="l"||it.t==="pl"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]);
      ctx.strokeStyle=o.col; ctx.lineWidth=o.lw; ctx.lineCap=o.cap||"round"; ctx.lineJoin="round";
      if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.stroke(); ctx.globalAlpha=1;
    }else if(it.t==="x"){
      const O=q[0], pu=P3(it.O[0]+it.U[0],it.O[1]+it.U[1],it.O[2]+it.U[2]), pv=P3(it.O[0]+it.V[0],it.O[1]+it.V[1],it.O[2]+it.V[2]);
      const a=[pu[0]-O[0],pu[1]-O[1]], b=[pv[0]-O[0],pv[1]-O[1]];
      if(a[0]*b[1]-a[1]*b[0]>=0) continue;                 /* seen from behind */
      if(Math.hypot(...a)*it.size<2.2) continue;           /* too small to read */
      ctx.save(); ctx.transform(a[0],a[1],-b[0],-b[1],O[0],O[1]);
      ctx.font=(o.weight||"600")+" "+it.size+"px "+(o.font||"-apple-system,'Segoe UI','Malgun Gothic',sans-serif");
      ctx.textAlign=o.align||"left"; ctx.textBaseline=o.base||"middle"; ctx.fillStyle=o.col; ctx.fillText(it.str,0,0); ctx.restore();
    }else if(it.t==="c"){ ctx.save(); it.draw(ctx); ctx.restore(); }
  }
}
function pointIn(q,x,y){ let c=false; for(let i=0,j=q.length-1;i<q.length;j=i++){
  const xi=q[i][0], yi=q[i][1], xj=q[j][0], yj=q[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
/* the id of the nearest object under a screen point */
function pick3(x,y){ for(let i=HITS.length-1;i>=0;i--) if(pointIn(HITS[i][1],x,y)) return HITS[i][0]; return null; }
/* a sphere: a shaded disc in its depth order */
function sphere3(c,r,col,o){ o=o||{};
  custom3(c,ctx=>{ const p=P3(...c), R=r*CAM.k;
    const g=ctx.createRadialGradient(p[0]-R*0.35,p[1]-R*0.4,R*0.08,p[0],p[1],R);
    g.addColorStop(0,o.hi||"#ffffff"); g.addColorStop(0.35,col); g.addColorStop(1,o.lo||"#5d646b");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],R,0,7); ctx.fill();
    if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=0.8; ctx.stroke(); }
    if(o.id) HITS.push([o.id,Array.from({length:12},(_,i)=>[p[0]+R*Math.cos(i/12*6.283),p[1]+R*Math.sin(i/12*6.283)])]);
  },{bias:o.bias||0,layer:o.layer||0});
}
/* a cylinder between two arbitrary points */
function cylAB(a,b,r,col,o){
  o=Object.assign({cull:true,seg:14},o||{}); const f=Object.assign({},o,{fill:col});
  const ax=_sub(b,a), L=Math.hypot(...ax), n=ax.map(v=>v/L);
  const t=Math.abs(n[1])<0.9?[0,1,0]:[1,0,0];
  let u=_cross(n,t); const ul=Math.hypot(...u); u=u.map(v=>v/ul); const v=_cross(n,u);
  const P=(base,ang)=>[base[0]+r*(u[0]*Math.cos(ang)+v[0]*Math.sin(ang)),base[1]+r*(u[1]*Math.cos(ang)+v[1]*Math.sin(ang)),base[2]+r*(u[2]*Math.cos(ang)+v[2]*Math.sin(ang))];
  const N=o.seg;
  for(let i=0;i<N;i++){ const t0=i/N*2*Math.PI, t1=(i+1)/N*2*Math.PI, tm=(t0+t1)/2;
    face(orient([P(a,t0),P(a,t1),P(b,t1),P(b,t0)],[u[0]*Math.cos(tm)+v[0]*Math.sin(tm),u[1]*Math.cos(tm)+v[1]*Math.sin(tm),u[2]*Math.cos(tm)+v[2]*Math.sin(tm)]),f); }
  if(o.caps!==false){ const c0=[],c1=[]; for(let i=0;i<N;i++){ const t=i/N*2*Math.PI; c0.push(P(a,t)); c1.push(P(b,t)); }
    const cf=Object.assign({},f,o.cap?{fill:o.cap}:{}); face(orient(c0,n.map(x=>-x)),cf); face(orient(c1,n),cf); }
}
/* a 2-D canvas (or a part of it) painted onto a flat rectangle: O is the world
   point of its top-left corner, U and V the world vectors along its width and down its height */
function tex3(src,sx,sy,sw,sh,O,U,V,o){ o=o||{};
  const C=[O[0]+U[0]/2+V[0]/2,O[1]+U[1]/2+V[1]/2,O[2]+U[2]/2+V[2]/2];
  custom3(C,ctx=>{ const a=P3(...O), b=P3(O[0]+U[0],O[1]+U[1],O[2]+U[2]), c=P3(O[0]+V[0],O[1]+V[1],O[2]+V[2]);
    const ux=b[0]-a[0], uy=b[1]-a[1], vx=c[0]-a[0], vy=c[1]-a[1];
    if(ux*vy-uy*vx<=0) return;                                /* seen from behind */
    ctx.save(); ctx.transform(ux/sw,uy/sw,vx/sh,vy/sh,a[0],a[1]); ctx.imageSmoothingEnabled=true;
    try{ ctx.drawImage(src,sx,sy,sw,sh,0,0,sw,sh); }catch(e){}
    ctx.restore();
    if(o.id) HITS.push([o.id,[a,b,[b[0]+vx,b[1]+vy],c]]);
  },{bias:o.bias||0.3,layer:o.layer||0});
}

/* ==================================================================
   THE 3-D BENCH  (the optical bench of Fig. 1: the PMMA target on its
   adjustable stand at the left end, the screen with the hole on its
   carrier, the laser at the right; the control box and the two
   multimeters on the desk).  Units cm.  The bench, the screen, the
   control box and the cabling pages are unchanged and open on a click.
   ================================================================== */
const cv3 = document.getElementById("cv"), ctx3 = cv3.getContext("2d");
const SCRCV = document.getElementById("screen"), CTRLCV = document.getElementById("ctrl");
const RT3 = 5.0, BEAM = RT3 + 15.0, SCR_LO = RT3 + 1.5, SCR_HI = RT3 + 40, SCR_Z = 18;
let view3 = "3d";
function desk3(){
  face([[-30,0,-30],[-30,0,60],[110,0,60],[110,0,-30]],{fill:"#3a3d42",layer:-3,flat:true,id:"desk"});
  for (let x = -30; x <= 110; x += 10) poly3([[x,0,-30],[x,0,60]],"#34373b",1,{layer:-2});
}
function rail3(){
  for (const x of [2, 78]) for (const z of [-3, 3]) cyl3("y",0,1.2,x,z,0.7,"#2a2c30",{seg:10,layer:-1});
  box3(-2,82,1.2,RT3,-4,4,"#b9bcc2",{id:"rail",layer:-1,top:"#c8cbd0"});
  for (const z of [-1.5,1.5]) box3(-2,82,RT3-0.2,RT3,z-0.4,z+0.4,"#8b8f96",{layer:-1});
  face([[0,RT3-1.6,4.02],[80,RT3-1.6,4.02],[80,RT3-0.3,4.02],[0,RT3-0.3,4.02]],{fill:"#e9eaec",flat:true,layer:-1,bias:0.4});
  custom3([40,RT3-1,4.03],c=>{ c.strokeStyle="#444";
    for (let mm = 0; mm <= 800; mm += 5){ const L = mm % 50 === 0 ? 0.8 : mm % 10 === 0 ? 0.55 : 0.3, a = P3(mm/10,RT3-0.32,4.03), b = P3(mm/10,RT3-0.32-L,4.03);
      c.lineWidth = mm % 10 === 0 ? 0.9 : 0.5; c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke(); } },{layer:-1,bias:1});
  for (let cm = 0; cm <= 80; cm += 10) text3([cm,RT3-1.35,4.04],[1,0,0],[0,1,0],String(cm),0.45,"#333",{align:"center",layer:-1,bias:1});
}
function carrier3(x,id){ box3(x-3,x+3,RT3,RT3+1.4,-5,5,"#d6d8dc",{id,top:"#e3e5e8"}); cyl3("z",5,5.6,x,RT3+0.7,0.5,"#555",{seg:10}); }
function laser3(){ const x = X_LASER;
  carrier3(x,"laser"); cyl3("y",RT3+1.4,BEAM-1.3,x,0,0.6,"#b9bec4",{seg:10,id:"laser"});
  box3(x-1.6,x+1.6,BEAM-1.3,BEAM-0.5,-1.6,1.6,"#7d848c",{id:"laser"});
  box3(x-4.5,x+3.5,BEAM-0.9,BEAM+0.9,-1.4,1.4,"#4a5059",{id:"laser"});
  cyl3("x",x-5.3,x-4.5,BEAM,0,0.55,"#2f343a",{seg:12,id:"laser",cap:app.lit&&app.cur>2?"#ff5040":"#552222"});
}
function screen3(){ const x = app.x_screen;
  carrier3(x,"screen3"); cyl3("y",RT3+1.4,SCR_LO,x,0,0.6,"#b9bec4",{seg:10,id:"screen3"});
  box3(x,x+0.5,SCR_LO,SCR_HI,-SCR_Z,SCR_Z,"#dcdcd4",{id:"screen3",top:"#ececE6"});
  /* the pattern side faces the target: paint the screen canvas onto it */
  const dpr = SCRCV.width / SCW, s = (SCW - 70) / (2 * HALF);
  const zc = (cm) => (SCW / 2 + cm * s) * dpr;
  const sx0 = zc(-SCR_Z), sx1 = zc(SCR_Z), sy0 = zc(-(SCR_HI - BEAM)), sy1 = zc(BEAM - SCR_LO);
  tex3(SCRCV, sx0, sy0, sx1 - sx0, sy1 - sy0, [x - 0.02, SCR_HI, -SCR_Z], [0,0,2*SCR_Z], [0,-(SCR_HI-SCR_LO),0], {id:"screen3"});
}
function target3(){ const x = app.x_target;
  carrier3(x,"target"); cyl3("y",RT3+1.4,BEAM-4,x-1,0,0.5,"#b9bec4",{seg:10,id:"target"});
  box3(x-2.2,x-0.4,BEAM-5,BEAM+4.5,-2.6,2.6,"#c7ccd2",{id:"target"});
  box3(x-0.4,x+0.3,BEAM-1.6,BEAM+1.6,-1.6,1.6,"#cfe0e6",{id:"target",alpha:0.85});
  for (const [dy,dz] of [[3.6,-3.2],[-3.6,-3.2],[4.8,0]]) cyl3("z",dz-0.01,dz-1.2,x-1.3,BEAM+dy,0.45,"#333",{seg:10});
}
function beam3(){
  if (!(app.lit && app.cur > 2.0)) return;
  const xt = app.x_target + 0.3, xs = app.x_screen, P = BEAM;
  const seg = (x0, x1) => custom3([(x0 + x1) / 2, P, 0], c => { const a = P3(x0, P, 0), b = P3(x1, P, 0);
    c.strokeStyle = "rgba(255,40,30,.9)"; c.lineWidth = 2; c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke(); });
  seg(X_LASER - 5.3, xs + 0.5); seg(xs, xt);
  custom3([(xt + xs) / 2, P, 0], c => { c.fillStyle = "rgba(255,40,30,.08)"; const e = P3(xt, P, 0); c.beginPath(); c.moveTo(e[0],e[1]);
    for (let i = 0; i <= 24; i++){ const t = i / 24 * 2 * Math.PI, q = P3(xs - 0.03, P + 6 * Math.sin(t), 6 * Math.cos(t)); c.lineTo(q[0],q[1]); }
    c.fill(); });
}
const CB = [8, 0, 30];
function ctrl3(){
  const dpr = CTRLCV.width / CW, [x, , z] = CB;
  box3(x,x+28,0,5,z,z+16,"#2f6fa8",{id:"ctrl"});
  tex3(CTRLCV, 20*dpr, 30*dpr, 280*dpr, 160*dpr, [x, 5.01, z], [28,0,0], [0,0,16], {id:"ctrl"});
  for (let k = 0; k < 2; k++){ const mx = x + 31 + k * 12.5;
    box3(mx,mx+10.4,0,4,z,z+16,"#b5443f",{id:"ctrl"});
    tex3(CTRLCV, (330+k*118)*dpr, 30*dpr, 104*dpr, 160*dpr, [mx, 4.01, z], [10.4,0,0], [0,0,16], {id:"ctrl"}); }
  box3(x-12,x-5,0,3,z+4,z+9,"#161616",{id:"ctrl"});
}
function cables3(){
  const L = (a, b, col, w, sag) => { const pts = []; for (let i = 0; i <= 18; i++){ const t = i / 18;
    pts.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t - Math.sin(Math.PI*t)*(sag||3), a[2]+(b[2]-a[2])*t]); } poly3(pts, col, w); };
  if (linked("adaptor","box_dc")) L([CB[0]-8,2,CB[2]+6],[CB[0],2.5,CB[2]+8],"#141414",1.8,0.2);
  const st = wireState ? wireState() : null;
  if (WP.links.size) L([CB[0]+20,5,CB[2]],[X_LASER-1,BEAM-1,0],"#c02020",1.6,6);
  if (WP.links.size>1) L([CB[0]+22,5,CB[2]],[X_LASER-0.5,BEAM-1,0.5],"#222",1.6,7);
}
function scene3(){ desk3(); rail3(); laser3(); target3(); screen3(); beam3(); ctrl3(); cables3(); }
function layout3(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv3.parentElement.clientWidth || 900;
  const h = Math.max(440, Math.min(Math.round(w * 0.62), Math.round(window.innerHeight * 0.78)));
  cv3.style.width = w + "px"; cv3.style.height = h + "px"; cv3.width = Math.round(w * dpr); cv3.height = Math.round(h * dpr);
  const first = !CAM0.k; CAM.W = w; CAM.H = h; CAM.dpr = dpr;
  if (first){ CAM.k = w / 115; CAM.tx = 40; CAM.ty = 12; CAM.tz = 12; CAM.yaw = -0.55; CAM.pitch = 0.42; CAM.px = 0; CAM.py = 10; camSave(); }
}
let lastTex = 0;
function draw3(){
  if (view3 !== "3d") return;
  const now = performance.now(); if (now - lastTex > 300){ drawScreen(); drawCtrl(); lastTex = now; }
  const dpr = CAM.dpr; ctx3.setTransform(dpr,0,0,dpr,0,0);
  const g = ctx3.createLinearGradient(0,0,0,CAM.H); g.addColorStop(0,"#2a3038"); g.addColorStop(1,"#1b1f25"); ctx3.fillStyle = g; ctx3.fillRect(0,0,CAM.W,CAM.H);
  begin3(); scene3(); render3(ctx3);
}
function showView(v){
  view3 = v;
  for (const k of ["3d","bench","screen","ctrl","wire"]){ document.getElementById("v-" + k).hidden = k !== v; document.getElementById("vt" + k).className = k === v ? "on" : ""; }
  document.getElementById("t-cap3").textContent = tr("cap_" + v);
  refresh();
}
for (const k of ["3d","bench","screen","ctrl","wire"]) document.getElementById("vt" + k).onclick = () => showView(k);
let down3 = null, m3 = [0,0];
const p3e = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => e.preventDefault());
cv3.addEventListener("pointerdown", e => { if (e.button) return; const p = p3e(e); m3 = p; cv3.setPointerCapture(e.pointerId);
  const id = pick3(p[0], p[1]); down3 = {p, id, moved:false, shift:e.shiftKey}; });
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0]-down3.p[0], p[1]-down3.p[1]) > 4) down3.moved = true; if (!down3.moved) return;
  if (down3.id === "screen3" || down3.id === "target"){ const q = onPlane(p[0], p[1], RT3 + 1.4), cm = Math.max(0, Math.min(X_FRONT, q[0]));
    if (down3.id === "screen3") app.x_screen = Math.min(Math.max(cm, app.x_target + 5.0), X_FRONT);
    else app.x_target = Math.min(cm, app.x_screen - 5.0);
    return; }
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.45, Math.max(0.1, CAM.pitch + dy * 0.006)); }
  cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", () => { cv3.classList.remove("grabbing");
  if (down3 && !down3.moved){ const id = down3.id;
    if (id === "screen3") showView("screen"); else if (id === "ctrl") showView("ctrl");
    else if (id === "rail" || id === "laser" || id === "target") showView("bench"); }
  down3 = null; });
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = p3e(e), s = e.deltaY < 0 ? 1 : -1;
  const f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(40, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0]-CAM.W/2) - (p[0]-CAM.W/2-CAM.px) * r; CAM.py = (p[1]-CAM.H/2) - (p[1]-CAM.H/2-CAM.py) * r; CAM.k = nk; }, {passive:false});
for (const id of ["v-bench","v-ctrl"]) document.getElementById(id).addEventListener("contextmenu", e => { e.preventDefault(); showView("3d"); });
window.addEventListener("resize", layout3);
(function loop3(){ draw3(); requestAnimationFrame(loop3); })();

readMeters();
applyLang();
</script>
