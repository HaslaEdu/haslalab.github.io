function tr(k){ const e = I18N[k]; return e ? (LANG === "ko" ? e[1] : e[0]) : k; }

/* ------------------------- constants ------------------------------ */
const LAMBDA = 650.0e-9;
const R_BASE_LAMBDA = 167.82;
const P_THRESHOLD = 287.0;
const N_SLOPE = 0.4632;
const P_YIELD_NOM = 363.6;

/* ------------------------- randomness ----------------------------- */
function mulberry(seed){
  return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function gauss(rng){                                     /* Box-Muller */
  let u = 0, v = 0;
  while (!u) u = rng(); while (!v) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ==================================================================
   ThermoModel  -  laser diode -> PMMA surface -> reflected pattern

     height of the bump    h      = m_max * lambda / 2
     number of fringes     m_max  = 0.4632 (P - 287)      [official fit]
     dark fringe           R_base sin(alpha_m) = m lambda
                           R_base = 167.82 lambda
   The two innermost orders are hidden inside the bright central spot,
   so the order you can actually count is m' = m - 2.  Above the yield
   power the surface melts and the deformation is frozen in.
   ================================================================== */
class ThermoModel {
  constructor(rng){
    this.rng = rng;
    this.R_base_lam = R_BASE_LAMBDA * (1 + 0.015 * gauss(rng));
    this.P_th = P_THRESHOLD * (1 + 0.004 * gauss(rng));
    this.slope = N_SLOPE * (1 + 0.03 * gauss(rng));
    this.P_yield = P_YIELD_NOM * (1 + 0.02 * gauss(rng));
    this.hidden = 2.0 + 0.10 * gauss(rng);
    this.iv_a = 0.35928;
    this.iv_b = 0.73823 * (1 + 0.004 * gauss(rng));
    this.spot_key = "0,0";
    this.spots = new Map();
    this.melted = false;
    this.melt_extra = 0.0;
    this.m_frozen = 0.0;
    this.dirty = Math.abs(0.35 * gauss(rng));      /* contamination */
    this.ellipticity = 1.0 + Math.abs(0.012 * gauss(rng));
    this.tilt = rng() * Math.PI;
  }
  diode_voltage(mA){
    if (mA <= 1.0) return 0.0;
    return this.iv_a + this.iv_b * Math.log(mA);
  }
  read_meters(mA){                     /* two multimeters, with noise */
    const i = mA + 0.12 * gauss(this.rng);
    const v = this.diode_voltage(mA) + 0.004 * gauss(this.rng);
    return [Math.round(i * 10) / 10, Math.round(v * 100) / 100];
  }
  power_true(mA){ return mA * this.diode_voltage(mA); }

  m_max(mA){
    const P = this.power_true(mA);
    const n_th = Math.max(this.slope * (P - this.P_th), 0.0);
    if (P > this.P_yield){
      this.melted = true;
      /* the plastic part takes over from the thermal one, so nothing
         jumps as the surface starts to yield */
      this.m_frozen = Math.max(this.m_frozen, n_th);
    }
    if (this.melted) return Math.max(n_th, this.m_frozen);
    return n_th;
  }
  height_lambda(mA){ return this.m_max(mA) / 2.0; }

  intensity(nu, mmax){
    const core = 1.35 * Math.exp(-Math.pow(nu / 1.55, 2));
    const env = 0.80 * Math.exp(-0.85 * Math.pow(nu / Math.max(mmax, 1.0), 2));
    const cutoff = 0.5 * (1.0 - Math.tanh((nu - mmax) / 0.55));
    const s = Math.sin(Math.PI * nu);
    let ring = env * cutoff * s * s;
    ring *= 0.5 * (1.0 + Math.tanh((nu - this.hidden) / 0.55));
    return core + ring;
  }

  /* one point of the pattern, in cm on the screen, before the speckle */
  pixel(mA, L_cm, X, Y, mmax, Pw){
    const ca = Math.cos(this.tilt), sa = Math.sin(this.tilt);
    const Xr = X * ca + Y * sa, Yr = -X * sa + Y * ca;
    const Rr = Math.hypot(Xr / this.ellipticity, Yr * this.ellipticity);
    const nu = this.R_base_lam * Math.sin(Math.atan2(Rr, L_cm));
    let img = (mmax > 0.4) ? this.intensity(nu, mmax)
                           : 1.35 * Math.exp(-Math.pow(nu / 1.55, 2));
    /* brightness follows the drive: below the fringe threshold the knob
       still does something visible, as it does on the bench */
    img *= Math.min(Math.max(Pw / 300.0, 0.0), 1.6);
    if (this.dirty > 0.25)
      img *= 1.0 + 0.05 * this.dirty * Math.cos(4.0 * Math.atan2(Yr, Xr));
    return img;
  }

  /* The stand slides the plate across the beam.  Every spot keeps its
     own history, so a shot that has been melted is still melted when
     you wind the stand back to it. */
  goto_spot(key){
    this.spots.set(this.spot_key, [this.melted, this.melt_extra,
                                   this.R_base_lam, this.m_frozen]);
    this.spot_key = key;
    if (this.spots.has(key)){
      const s = this.spots.get(key);
      this.melted = s[0]; this.melt_extra = s[1];
      this.R_base_lam = s[2]; this.m_frozen = s[3];
    } else {
      this.melted = false;
      this.melt_extra = 0.0;
      this.m_frozen = 0.0;
      this.R_base_lam = R_BASE_LAMBDA * (1 + 0.015 * gauss(this.rng));
    }
  }
}

/* the deep red of a 650 nm diode.  numpy casts the ramp with
   astype(uint8), which truncates, so this truncates too */
const LASER_STOPS = [[0.00, 0, 0, 0], [0.18, 42, 0, 0], [0.40, 139, 0, 8],
                     [0.62, 224, 16, 32], [0.82, 255, 90, 85],
                     [1.00, 255, 233, 230]];
function laser_rgb(v, d, k){
  const x = Math.min(Math.max(v / 1.35, 0), 1);
  for (let i = 0; i < LASER_STOPS.length - 1; i++){
    const a = LASER_STOPS[i], b = LASER_STOPS[i + 1];
    if (x >= a[0] && x <= b[0]){
      const f = (x - a[0]) / (b[0] - a[0]);
      d[k]     = (a[1] + f * (b[1] - a[1])) | 0;
      d[k + 1] = (a[2] + f * (b[2] - a[2])) | 0;
      d[k + 2] = (a[3] + f * (b[3] - a[3])) | 0;
      return;
    }
  }
  d[k] = 255; d[k + 1] = 233; d[k + 2] = 230;
}

/* ==================================================================
   The 30 cm clear plastic ruler from the apparatus list.

   It is an object lying on the screen, not a read-out: drag it where
   you want it, roll the wheel over it to swing it round, and read the
   fringe positions off its own millimetre scale.  Nothing anywhere
   prints a radius for you.
   ================================================================== */
class Ruler {
  constructor(){
    this.LEN = 30.0;      /* cm, the printed scale runs 0 .. 30 */
    this.WID = 3.0;
    this.TRANS = 0.86;    /* two air/acrylic surfaces, ~8% lost at each */
    this.x = 0.0; this.y = 13.0; this.ang = 0.0; this.on = false;
  }
  local(X, Y){                       /* screen cm -> ruler cm (u, v) */
    const ca = Math.cos(-this.ang), sa = Math.sin(-this.ang);
    const dx = X - this.x, dy = Y - this.y;
    return [dx * ca - dy * sa, dx * sa + dy * ca];
  }
  contains(X, Y){
    const [u, v] = this.local(X, Y);
    return this.on && Math.abs(u) <= this.LEN / 2 && Math.abs(v) <= this.WID / 2;
  }
  /* What the ruler looks like lying on the screen, as colour.  Clear
     acrylic transmits most of the light and reflects the rest, so the
     fringes stay visible through it but dimmed - that part is still the
     laser's deep red.  What the ruler itself shows is not: the bevelled
     edges pipe light along their length and the engraved graduations
     scatter it, and both come back neutral. */
  shade(u, v, I, out){
    laser_rgb(Math.min(Math.max(I * this.TRANS, 0), 1.6), out, 0);
    let r = out[0] + 11, g = out[1] + 13, b = out[2] + 17;
    const e = Math.exp(-Math.pow((Math.abs(v) - this.WID / 2) / 0.085, 2));
    r += 54 * e; g += 62 * e; b += 72 * e;
    out[0] = Math.min(255, r) | 0;
    out[1] = Math.min(255, g) | 0;
    out[2] = Math.min(255, b) | 0;
  }
  /* The engraved millimetre scale, as segments in screen cm.  These are
     drawn rather than sampled into the image: a millimetre is only about
     1.2 screen pixels, so putting the marks into the pixel grid turned
     them into an aliased hash instead of a scale you could read. */
  ticks(){
    const ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    const half = this.WID / 2, out = [];
    for (let k = 0; k <= 300; k++){
      const u = k * 0.1 - this.LEN / 2;
      const tl = (k % 10 === 0) ? 0.66 : ((k % 5 === 0) ? 0.42 : 0.22);
      const v0 = half, v1 = half - tl;
      out.push([this.x + u * ca - v0 * sa, this.y + u * sa + v0 * ca,
                this.x + u * ca - v1 * sa, this.y + u * sa + v1 * ca,
                k % 10 === 0, k % 5 === 0]);
    }
    return out;
  }
}

/* ==================================================================
   the cabling page  (class WiringPage)
   ================================================================== */
const WP = {
  W: 1010, H: 560, R: 9,
  FACE: "#4fa6dc", BODY: "#2e3134", NAVY: "#16324f",
  links: new Set(), held: null, mouse: [0, 0],
  T: {
    adaptor:  {x: 150, y: 470, col: "#2b6fa8", lab: ""},
    box_dc:   {x: 356, y: 470, col: "#2b6fa8", lab: ""},
    box_lp:   {x: 356, y: 150, col: "#c02020", lab: ""},
    box_ln:   {x: 356, y: 250, col: "#2b2e32", lab: ""},
    amp_in:   {x: 560, y:  96, col: "#c02020", lab: ""},
    amp_com:  {x: 560, y: 176, col: "#2b2e32", lab: ""},
    volt_in:  {x: 800, y:  96, col: "#c02020", lab: ""},
    volt_com: {x: 800, y: 176, col: "#2b2e32", lab: ""},
    laser_p:  {x: 620, y: 330, col: "#c02020", lab: "+"},
    laser_n:  {x: 620, y: 410, col: "#2b2e32", lab: "\u2212"},
    amp_10a:  {x: 560, y: 136, col: "#c02020", lab: ""},
    volt_10a: {x: 800, y: 136, col: "#c02020", lab: ""},
  },
  /* only these pairs can be joined - including the classic mistakes,
     which are allowed precisely so that they can be made */
  ALLOWED: new Set(["adaptor|box_dc", "amp_in|box_lp", "amp_com|laser_p",
                    "box_ln|laser_n", "laser_p|volt_in", "laser_n|volt_com",
                    "box_lp|laser_p", "amp_in|laser_p", "amp_com|laser_n",
                    "box_lp|volt_in", "box_ln|volt_com"]),
  MULTI: new Set(["laser_p", "laser_n", "box_lp", "box_ln"]),
};
const key2 = (a, b) => [a, b].sort().join("|");
const linked = (a, b) => WP.links.has(key2(a, b));

function wireState(){
  const powered = linked("adaptor", "box_dc") && app.mains;
  const series = linked("box_lp", "amp_in") && linked("amp_com", "laser_p")
              && linked("laser_n", "box_ln");
  const direct = linked("box_lp", "laser_p") && linked("laser_n", "box_ln");
  const shorted = linked("amp_in", "laser_p") && linked("amp_com", "laser_n");
  /* the POWER switch is part of the circuit too: with it off the box
     passes nothing, so there is no beam anywhere */
  const lit = app.on && powered && (series || direct) && !shorted;
  return {powered: powered, lit: lit, shorted: shorted,
          amp: series && lit,
          volt: linked("volt_in", "laser_p") && linked("volt_com", "laser_n")
                && lit};
}

function readMeters(){
  const st = wireState();
  let i = 0.0, v = 0.0;
  if (st.lit){ const r = app.model.read_meters(app.cur); i = r[0]; v = r[1]; }
  /* an unconnected meter shows nothing at all, not a zero */
  app.reading = [st.amp ? i : null, st.volt ? v : null];
  app.lit = st.lit;
}

function wireAt(x, y){
  for (const k in WP.T){
    const d = WP.T[k];
    if (Math.hypot(x - d.x, y - d.y) <= WP.R + 7) return k;
  }
  return null;
}
function bezPoint(a, b, f){
  return [a.x + (b.x - a.x) * f,
          a.y + (b.y - a.y) * f + 24 * Math.sin(Math.PI * f)];
}
function cableAt(x, y){
  for (const lk of WP.links){
    const [a, b] = lk.split("|");
    for (let n = 0; n <= 43; n++){
      const p = bezPoint(WP.T[a], WP.T[b], n / 43);
      if (Math.hypot(x - p[0], y - p[1]) < 7) return lk;
    }
  }
  return null;
}
function plug(a, b){
  for (const end of [a, b]){
    if (WP.MULTI.has(end)) continue;
    for (const lk of [...WP.links]) if (lk.split("|").includes(end))
      WP.links.delete(lk);
  }
  WP.links.add(key2(a, b));
}

/* ==================================================================
   drawing helpers
   ================================================================== */
function ctxOf(id){
  const cv = document.getElementById(id);
  const g = cv.getContext("2d");
  const dpr = id === "screen" ? 3 : (window.devicePixelRatio || 1);
  const w = cv.width, h = cv.height;
  if (cv.dataset.fitted !== String(dpr)){
    cv.dataset.fitted = String(dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.dataset.w = w; cv.dataset.h = h;
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return g;
}
function txt(g, x, y, s, col, px, bold, anchor){
  g.fillStyle = col;
  g.font = (bold ? "bold " : "") + (px || 11) + "px "
         + '"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  g.textAlign = anchor || "center";
  g.textBaseline = "middle";
  const lines = String(s).split("\n");
  const lh = (px || 11) * 1.2;
  lines.forEach((ln, i) =>
    g.fillText(ln, x, y + (i - (lines.length - 1) / 2) * lh));
}
function mono(g, x, y, s, col, px, anchor){
  g.fillStyle = col;
  g.font = "bold " + px + "px ui-monospace,Consolas,monospace";
  g.textAlign = anchor || "center";
  g.textBaseline = "middle";
  g.fillText(s, x, y);
}
function rect(g, x0, y0, x1, y1, fill, out, w){
  if (fill){ g.fillStyle = fill; g.fillRect(x0, y0, x1 - x0, y1 - y0); }
  if (out){ g.strokeStyle = out; g.lineWidth = w || 1;
            g.strokeRect(x0, y0, x1 - x0, y1 - y0); }
}
function oval(g, x0, y0, x1, y1, fill, out, w, dash){
  g.save();
  if (dash) g.setLineDash(dash);
  g.beginPath();
  g.ellipse((x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) / 2, (y1 - y0) / 2,
            0, 0, 7);
  if (fill){ g.fillStyle = fill; g.fill(); }
  if (out){ g.strokeStyle = out; g.lineWidth = w || 1; g.stroke(); }
  g.restore();
}
function line(g, pts, col, w, dash){
  g.save();
  if (dash) g.setLineDash(dash);
  g.strokeStyle = col; g.lineWidth = w || 1;
  g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.stroke(); g.restore();
}

/* ==================================================================
   THE OPTICAL BENCH  (class BenchCanvas)
   ================================================================== */
const BW = 560, BH = 434;
const X_LASER = 72.0, X_FRONT = 66.0;
const bpx = cm => 40 + cm * (BW - 90) / 80.0;
const bcm = px => (px - 40) * 80.0 / (BW - 90);

function plateViews(g, x0, y0){
  /* The PMMA plate itself, not a graph: the face you shoot at, and the
     same plate seen edge on so that the swelling can be judged.  The
     bump is a few tens of wavelengths on a 3 mm plate, so at life size
     it is a third of a pixel: the edge view therefore shows a 0.25 mm
     square of the surface, at a stated scale. */
  const m = app.model;
  const h = app.lit ? m.height_lambda(app.cur) : 0.0;
  const hot = h > 0.05;
  const SLICE_M = 250e-6;
  const rise = Math.min(h * LAMBDA / SLICE_M * 60.0, 34.0);
  const base = m.R_base_lam * LAMBDA / SLICE_M * 60.0;

  rect(g, x0 - 30, y0 - 30, x0 + 30, y0 + 30, "#dff0f5", "#7fa3ad", 2);
  oval(g, x0 - 2, y0 - 2, x0 + 2, y0 + 2, hot ? "#ff9a3c" : "#d9c4b0");
  txt(g, x0, y0 + 42, tr("pfront"), "#5c6169", 10);

  const ex = x0 + 128, ey = y0;
  const half = Math.max(base, 6.0);
  g.beginPath();
  g.moveTo(ex - 22, ey - 30); g.lineTo(ex - 22, ey + 30);
  for (let k = 0; k <= 60; k++){
    const u = 1.0 - k / 30.0;
    g.lineTo(ex + 22 + rise * Math.exp(-Math.pow(u * 30.0 / half, 2)),
             ey + 30 * u);
  }
  g.closePath();
  g.fillStyle = "#dff0f5"; g.fill();
  g.strokeStyle = "#7fa3ad"; g.lineWidth = 2; g.stroke();
  line(g, [ex + 22, ey - 30, ex + 22, ey + 30], "#b7ced6", 1, [3, 3]);
  txt(g, ex, ey + 42, tr("psurf"), "#5c6169", 10);
  txt(g, x0 - 44, ey, tr("lifesize"), "#8b8f96", 10);
}

function drawBench(){
  const g = ctxOf("bench");
  g.clearRect(0, 0, BW, BH);
  g.fillStyle = "#e9e7e2"; g.fillRect(0, 0, BW, BH);
  g.strokeStyle = "#999"; g.lineWidth = 1; g.strokeRect(0.5, 0.5, BW - 1, BH - 1);

  const yb = 290;
  rect(g, 24, yb, BW - 24, yb + 16, "#b9bcc2", "#8b8f96", 1);
  for (let cm = 0; cm <= 80; cm += 5){
    const x = bpx(cm);
    line(g, [x, yb, x, yb - 6], "#6b7076", 1);
    txt(g, x, yb - 13, String(cm), "#6b7076", 10);
  }
  txt(g, BW - 28, yb + 26, tr("benchcm"), "#6b7076", 10, false, "right");

  const xs = bpx(app.x_screen), xt = bpx(app.x_target), xl = bpx(X_LASER);
  const beam_y = 190;

  rect(g, xl - 6, yb - 40, xl + 6, yb, "#7d848c", "#5c6169", 1);
  rect(g, xl - 26, beam_y - 13, xl + 30, beam_y + 13, "#4a5059", "#2f343a", 1);
  rect(g, xl - 34, beam_y - 6, xl - 26, beam_y + 6, "#2f343a");
  txt(g, xl + 2, beam_y - 22, tr("laser"), "#4a5059", 11);

  rect(g, xs - 3, beam_y - 96, xs + 3, yb, "#dcdcd4", "#9a9a92", 1);
  rect(g, xs - 4, beam_y - 5, xs + 4, beam_y + 5, "#e9e7e2");
  txt(g, xs, beam_y - 104, tr("scrhole"), "#5c6169", 11);

  rect(g, xt - 5, beam_y - 60, xt + 5, beam_y + 60, "#cfe0e6", "#7fa3ad", 2);
  rect(g, xt - 10, yb - 34, xt + 10, yb, "#7d848c", "#5c6169", 1);
  txt(g, xt, beam_y - 72, tr("target"), "#4d707a", 11);

  if (app.lit && app.cur > 2.0){
    const bw = 1 + Math.floor(3.0 * Math.min(
      app.model.power_true(app.cur) / 380.0, 1.0));
    line(g, [xl - 26, beam_y, xt + 5, beam_y], "#e02020", bw);
    for (const dy of [-1, 1])
      line(g, [xt + 5, beam_y, xs - 3, beam_y + dy * 78], "#e02020", 1);
  }
  /* the distance the student has to quote */
  line(g, [xt, beam_y + 78, xs, beam_y + 78], "#30507a", 1);
  for (const [x, s] of [[xt, 1], [xs, -1]]){
    g.fillStyle = "#30507a"; g.beginPath();
    g.moveTo(x, beam_y + 78);
    g.lineTo(x + s * 7, beam_y + 74); g.lineTo(x + s * 7, beam_y + 82);
    g.closePath(); g.fill();
  }
  txt(g, (xt + xs) / 2, beam_y + 89, "L", "#30507a", 12, true);
  txt(g, 12, 14, tr("draghint"), "#8b8f96", 11, false, "left");
  plateViews(g, 100, 360);
}

/* dragging the screen and the target along the rail */
(function(){
  const cv = document.getElementById("bench");
  let drag = null;
  const at = ev => {
    const b = cv.getBoundingClientRect();
    return [(ev.clientX - b.left) * BW / b.width,
            (ev.clientY - b.top) * BH / b.height];
  };
  cv.addEventListener("pointerdown", ev => {
    const [x, y] = at(ev);
    for (const [name, cm] of [["screen", app.x_screen], ["target", app.x_target]])
      if (Math.abs(x - bpx(cm)) < 14 && y > 60 && y < 235){
        drag = name; cv.setPointerCapture(ev.pointerId); return;
      }
  });
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    const [x] = at(ev);
    const cm = Math.max(0.0, Math.min(X_FRONT, bcm(x)));
    if (drag === "screen")
      app.x_screen = Math.min(Math.max(cm, app.x_target + 5.0), X_FRONT);
    else
      app.x_target = Math.min(cm, app.x_screen - 5.0);
    refresh();
  });
  const stop = () => { drag = null; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
})();

function turnKnob(s){
  app.knob_a += s * 0.35;
  /* set_current of the desktop program: 0.1 mA resolution, and the
     diode's own limit at 115 mA */
  const v = app.cur + s * (app.fine ? 0.1 : 1.0);
  app.cur = Math.max(0.0, Math.min(115.0, Math.round(v * 10) / 10));
  readMeters();
  refresh();
}
(function(){
  const cv = document.getElementById("ctrl");
  const at = ev => {
    const b = cv.getBoundingClientRect();
    return [(ev.clientX - b.left) * CW / b.width,
            (ev.clientY - b.top) * CH / b.height];
  };
  cv.addEventListener("click", ev => { const [x, y] = at(ev); ctrlClick(x, y); });
  cv.addEventListener("wheel", ev => { const [x, y] = at(ev); if (ctrlWheel(x, y, ev.deltaY < 0 ? 1 : -1)) ev.preventDefault(); }, {passive: false});
})();
/* the control panel at (x, y) in its own pixels: the POWER switch, the knob (its middle: coarse/fine) */
function ctrlClick(x, y){
  if (x >= SX && x <= SX + SW && y >= SY && y <= SY + SH){ app.on = !app.on; readMeters(); refresh(); return; }
  const d = Math.hypot(x - KX, y - KY);
  if (d <= KR + 5){ if (d < 11){ app.fine = !app.fine; refresh(); } else turnKnob(x > KX ? 1 : -1); } }
function ctrlWheel(x, y, s){ if (Math.hypot(x - KX, y - KY) > KR + 5) return false; turnKnob(s); return true; }

let rulerGrab = () => false, rulerMove = () => false, rulerDrop = () => false;
/* ==================================================================
   THE SCREEN  (class ScreenCanvas)
   ================================================================== */
const SCW = 560, HALF = 20.0, NGRID = 840;
const spx = cm => SCW / 2 + cm * (SCW - 70) / (2 * HALF);
const scm = px => (px - SCW / 2) * 2 * HALF / (SCW - 70);
const offc = document.createElement("canvas");
offc.width = NGRID; offc.height = NGRID;
const offg = offc.getContext("2d");

let SCR_SIG = "", PAT = null;
function drawScreen(){
  const R0 = app.ruler, live0 = app.lit && app.cur > 2.0, m0 = app.model;
  const pkey = live0 ? [app.cur, app.L(), m0.spot_key, m0.melted, m0.melt_extra, m0.m_frozen].join("|") : "dark";
  const sig = pkey + "|" + (R0.on ? [R0.x, R0.y, R0.ang].join(",") : "-");
  if (sig === SCR_SIG) return; SCR_SIG = sig; SCRCV._ver = (SCRCV._ver || 0) + 1;
  const g = ctxOf("screen");
  g.clearRect(0, 0, SCW, SCW);
  g.fillStyle = "#20211f"; g.fillRect(0, 0, SCW, SCW);

  const im = offg.createImageData(NGRID, NGRID);
  const d = im.data;
  const live = app.lit && app.cur > 2.0;
  const same = PAT && PAT.key === pkey, Ical = same ? PAT.I : new Float32Array(NGRID * NGRID);
  if (same) d.set(PAT.rgb);                 /* only the ruler has moved */
  else if (live){
    const m = app.model, L = app.L();
    const mmax = m.m_max(app.cur);          /* this is where it can melt */
    const Pw = m.power_true(app.cur);
    const rg = mulberry(7);                 /* the speckle is fixed */
    for (let j = 0; j < NGRID; j++){
      const Y = -HALF + 2 * HALF * j / (NGRID - 1);
      for (let i2 = 0; i2 < NGRID; i2++){
        const X = -HALF + 2 * HALF * i2 / (NGRID - 1);
        let I = m.pixel(app.cur, L, X, Y, mmax, Pw);
        /* the speckle scales with the light that is actually there: a
           flat dither would put false minima in the black background
           outside the pattern and make the ring count ambiguous */
        I += 0.030 * Math.sqrt(Math.max(I, 0)) * (rg() - 0.5) + 0.0015 * rg();
        I = Math.max(0, Math.min(1.6, I));
        Ical[j * NGRID + i2] = I;
        const k = (j * NGRID + i2) * 4;
        laser_rgb(I, d, k);
        d[k + 3] = 255;
      }
    }
  } else {
    for (let k = 3; k < d.length; k += 4) d[k] = 255;
  }

  const R = app.ruler, px4 = new Uint8ClampedArray(4);
  if (R.on) for (let j = 0; j < NGRID; j++){
    const Y = -HALF + 2 * HALF * j / (NGRID - 1);
    for (let i2 = 0; i2 < NGRID; i2++){
      const X = -HALF + 2 * HALF * i2 / (NGRID - 1);
      const [u, v] = R.local(X, Y);
      if (Math.abs(u) > R.LEN / 2 || Math.abs(v) > R.WID / 2) continue;
      const k = (j * NGRID + i2) * 4;
      R.shade(u, v, Ical[j * NGRID + i2], px4);
      d[k] = px4[0]; d[k + 1] = px4[1]; d[k + 2] = px4[2]; d[k + 3] = 255;
    }
  }
  offg.putImageData(im, 0, 0);

  const x0 = spx(-HALF), span = spx(HALF) - spx(-HALF);
  g.imageSmoothingEnabled = true;
  g.drawImage(offc, x0, x0, span, span);

  /* the printed scale, drawn crisp on top of the plastic */
  if (R.on) for (const t of R.ticks()){
    if (Math.max(Math.abs(t[0]), Math.abs(t[1])) > HALF) continue;
    line(g, [spx(t[0]), spx(t[1]), spx(t[2]), spx(t[3])],
         t[4] ? "#eef3f8" : (t[5] ? "#d6dee6" : "#9fadb8"), 1);
  }

  /* the numbers printed on the ruler */
  const rca = Math.cos(R.ang), rsa = Math.sin(R.ang);
  g.save(); g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "10px \"Segoe UI\",Roboto,sans-serif";
  if (R.on) for (let cmv = 0; cmv <= 30; cmv += 5){
    const uu = cmv - R.LEN / 2, vv = R.WID / 2 - 1.02;
    const X = R.x + uu * rca - vv * rsa, Y = R.y + uu * rsa + vv * rca;
    if (Math.abs(X) > HALF || Math.abs(Y) > HALF) continue;
    g.save(); g.translate(spx(X), spx(Y)); g.rotate(R.ang);
    g.fillStyle = "#dfe6ec"; g.fillText(String(cmv), 0, 0); g.restore();
  }
  if (R.on) {
    const uu = R.LEN / 2 - 2.6, vv = -R.WID / 2 + 0.75;
    const X = R.x + uu * rca - vv * rsa, Y = R.y + uu * rsa + vv * rca;
    if (Math.abs(X) <= HALF && Math.abs(Y) <= HALF){
      g.save(); g.translate(spx(X), spx(Y)); g.rotate(R.ang);
      g.fillStyle = "#b9c4cd"; g.fillText("cm", 0, 0); g.restore();
    }
  }
  g.restore();

  /* the hole the incoming beam goes through */
  oval(g, SCW / 2 - 5, SCW / 2 - 5, SCW / 2 + 5, SCW / 2 + 5,
       null, "#8090a0", 1, [2, 2]);

}

(function(){
  const cv = document.getElementById("screen");
  let drag = null;
  const at = ev => {
    const b = cv.getBoundingClientRect();
    return [scm((ev.clientX - b.left) * SCW / b.width),
            scm((ev.clientY - b.top) * SCW / b.height)];
  };
  cv.addEventListener("pointerdown", ev => {
    const [X, Y] = at(ev);
    if (app.ruler.contains(X, Y)){
      drag = [X - app.ruler.x, Y - app.ruler.y];
      cv.setPointerCapture(ev.pointerId);
    }
  });
  rulerGrab = (X, Y) => { if (!app.ruler.on || !app.ruler.contains(X, Y)) return false; drag = [X - app.ruler.x, Y - app.ruler.y]; return true; };
  rulerMove = (X, Y) => { if (!drag) return false; app.ruler.x = X - drag[0]; app.ruler.y = Y - drag[1]; drawScreen(); return true; };
  rulerDrop = () => { const was = !!drag; drag = null; return was; };
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    const [X, Y] = at(ev);
    app.ruler.x = X - drag[0];
    app.ruler.y = Y - drag[1];
    drawScreen();
  });
  const stop = () => { drag = null; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  /* swing it round, so it can be laid across a diameter */
  cv.addEventListener("wheel", ev => {
    const [X, Y] = at(ev);
    if (!app.ruler.contains(X, Y)) return;
    ev.preventDefault();
    app.ruler.ang += (ev.deltaY < 0 ? 1 : -1) * Math.PI / 90;
    drawScreen();
  }, {passive: false});
})();

/* where a plug is in 3-D: in its socket, sticking out along the socket's direction, or lying on the desk */
const REST_N = {dc:[-1,0,0], lp:[-1,0,0], ln:[-1,0,0]};
