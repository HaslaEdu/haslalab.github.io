function drawKey(g, W, H, L) {

  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip(); g.lineCap = g.lineJoin = "round";
  /* stick figures */
  g.strokeStyle = "rgba(31,79,209,.85)"; g.lineWidth = 1.3;
  for (const c in CONS) for (const line of SKY_DATA.clines[c] || []) { g.beginPath(); let first = true;
    for (let i = 0; i < line.length - 1; i++) { const a = line[i], b = line[i + 1], dr = (b[0] - a[0] + 540) % 360 - 180;
      for (let j = 0; j <= 6; j++) { const p = proj(a[0] + dr * j / 6, a[1] + (b[1] - a[1]) * j / 6); if (!p) continue; if (first) { g.moveTo(p[0], p[1]); first = false; } else g.lineTo(p[0], p[1]); } }
    g.stroke(); }
  /* names */
  g.font = "bold 15px 'Segoe UI',sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  for (const c in CONS) { const x = Math.min(W - 18, Math.max(18, CONS[c][0] * SK)), y = Math.min(H - 10, Math.max(10, CONS[c][1] * SK));
    g.lineWidth = 3.5; g.strokeStyle = "#fff"; g.strokeText(c, x, y); g.fillStyle = "#c62828"; g.fillText(c, x, y); }
  /* Messier objects */
  g.font = "bold 11px 'Segoe UI',sans-serif";
  for (const [m, ra, de] of MESS) { const p = proj(ra, de); if (!p || p[0] < 4 || p[0] > W - 4 || p[1] < 4 || p[1] > H - 4) continue;
    g.strokeStyle = "#1b8a3a"; g.lineWidth = 1.6; g.beginPath(); g.arc(p[0], p[1], 6, 0, 7); g.stroke();
    g.lineWidth = 3; g.strokeStyle = "#fff"; g.strokeText(m, p[0] + 14, p[1] - 8); g.fillStyle = "#1b8a3a"; g.fillText(m, p[0] + 14, p[1] - 8); }
  /* Albireo */
  const B = proj(292.680, 27.960); g.strokeStyle = "#c62828"; g.lineWidth = 1.8; g.beginPath(); g.arc(B[0], B[1], 8, 0, 7); g.stroke();
  g.font = "bold 16px 'Segoe UI',sans-serif"; g.lineWidth = 3.5; g.strokeStyle = "#fff"; g.strokeText("B", B[0] - 16, B[1] + 2); g.fillStyle = "#c62828"; g.fillText("B", B[0] - 16, B[1] + 2);
  /* directions, taken at the centre of the chart (they hardly turn across it) and drawn in a clear patch of Cygnus */
  const ra0 = FIT.a0 * 180 / Math.PI, de0 = FIT.d0 * 180 / Math.PI, P0 = proj(ra0, de0), C0 = [395, 548];
  const dirs = [["N", proj(ra0, de0 + 2)], ["S", proj(ra0, de0 - 2)], ["E", proj(ra0 + 2.4, de0)], ["W", proj(ra0 - 2.4, de0)]].map(([n, p]) => [n, [C0[0] + p[0] - P0[0], C0[1] + p[1] - P0[1]]]);
  g.strokeStyle = g.fillStyle = "#1b8a3a"; g.lineWidth = 2.2; g.font = "bold 17px 'Segoe UI',sans-serif";
  for (const [n, p] of dirs) { const dx = p[0] - C0[0], dy = p[1] - C0[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, ex = C0[0] + ux * 34, ey = C0[1] + uy * 34;
    g.beginPath(); g.moveTo(C0[0] + ux * 8, C0[1] + uy * 8); g.lineTo(ex, ey); g.stroke();
    g.beginPath(); g.moveTo(ex + ux * 2, ey + uy * 2); g.lineTo(ex - ux * 9 - uy * 5, ey - uy * 9 + ux * 5); g.lineTo(ex - ux * 9 + uy * 5, ey - uy * 9 - ux * 5); g.closePath(); g.fill();
    g.lineWidth = 3.5; g.strokeStyle = "#fff"; g.strokeText(n, ex + ux * 14, ey + uy * 14); g.fillText(n, ex + ux * 14, ey + uy * 14); g.lineWidth = 2.2; g.strokeStyle = "#1b8a3a"; }
  g.beginPath(); g.arc(C0[0], C0[1], 3, 0, 7); g.fill();
  /* the centre of the chart */
  g.strokeStyle = "#c62828"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(P0[0] - 7, P0[1]); g.lineTo(P0[0] + 7, P0[1]); g.moveTo(P0[0], P0[1] - 7); g.lineTo(P0[0], P0[1] + 7); g.stroke();
  /* declination box at the bottom left */
  g.font = "bold 15px 'Segoe UI',sans-serif"; g.textAlign = "left"; g.fillStyle = "#fffef6"; g.fillRect(150, H - 34, 104, 24); g.strokeStyle = "#c62828"; g.lineWidth = 1.5; g.strokeRect(150, H - 34, 104, 24);
  g.fillStyle = "#c62828"; g.fillText("δ ≈ +32°", 158, H - 21);
  g.restore(); }
