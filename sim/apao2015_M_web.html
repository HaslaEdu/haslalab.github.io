<script>
"use strict";
/* Plate solution of the examination chart, fitted by HaslaLab to the Hipparcos stars (338 stars, rms 0.4 px on the
   994 × 1855 scan): Lambert azimuthal equal-area, centre RA 305.868°, Dec +32.168°, 17.444 px per degree, turned
   by 181° (north is down, east is right). */
const FIT = {a0: 5.338404505939538, d0: 0.5614414326468079, s: 999.4884096742821, th: -3.1593670712016086, tx: 494.32105129189114, ty: 927.3416980769806};
const SW = 497, SH = 927.5, SK = SW / 994;
function proj(raDeg, deDeg) {
  const r = raDeg * Math.PI / 180 - FIT.a0, d = deDeg * Math.PI / 180, cd0 = Math.cos(FIT.d0), sd0 = Math.sin(FIT.d0);
  const cosc = sd0 * Math.sin(d) + cd0 * Math.cos(d) * Math.cos(r); if (cosc < -0.5) return null;
  const k = Math.sqrt(2 / (1 + cosc)), X = -Math.cos(d) * Math.sin(r) * k, Y = (cd0 * Math.sin(d) - sd0 * Math.cos(d) * Math.cos(r)) * k;
  return [(FIT.tx + FIT.s * (X * Math.cos(FIT.th) - Y * Math.sin(FIT.th))) * SK, (FIT.ty - FIT.s * (X * Math.sin(FIT.th) + Y * Math.cos(FIT.th))) * SK]; }
/* constellations inside the chart and where their names go (centre of the visible part, full-size pixels) */
const CONS = {Cyg: [534, 1117], Dra: [245, 1535], Aql: [305, 418], Cep: [643, 1591], Peg: [870, 745], Aqr: [787, 294], Cap: [695, 109], Lyr: [173, 1036],
  Cas: [890, 1652], Vul: [470, 801], Sgr: [226, 87], Her: [59, 945], Lac: [865, 1223], Del: [575, 583], UMi: [188, 1789], Sge: [298, 690], Sct: [60, 240],
  Equ: [716, 515], And: [950, 1319], Ser: [49, 452], Oph: [37, 570]};
const MESS = [["M57", 279.234, 33.029], ["M27", 299.902, 22.721], ["M15", 322.493, 12.167], ["M2", 323.363, -0.823], ["M39", 323.062, 48.433], ["M29", 305.983, 38.533],
  ["M56", 289.148, 30.183], ["M71", 298.444, 18.779], ["M11", 282.771, -6.267], ["M52", 351.2, 61.593]];
const MAP = new Image(); MAP.src = "apao2015_M/map.png";

function drawKey(g, W, H, L) {
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); if (MAP.complete && MAP.naturalWidth) g.drawImage(MAP, 0, 0, W, H);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip(); g.lineCap = g.lineJoin = "round";
  /* stick figures */
  g.strokeStyle = "rgba(31,79,209,.85)"; g.lineWidth = 1.3;
  for (const c in CONS) for (const line of SKY_DATA.clines[c] || []) { g.beginPath(); let first = true;
    for (let i = 0; i < line.length - 1; i++) { const a = line[i], b = line[i + 1], dr = (b[0] - a[0] + 540) % 360 - 180;
      for (let j = 0; j <= 6; j++) { const p = proj(a[0] + dr * j / 6, a[1] + (b[1] - a[1]) * j / 6); if (!p) continue; if (first) { g.moveTo(p[0], p[1]); first = false; } else g.lineTo(p[0], p[1]); } }
    g.stroke(); }
  /* names */
  g.font = "bold 15px 'Segoe UI',sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  for (const c in CONS) { const x = Math.min(W - 18, Math.max(18, CONS[c][0] * SK)), y = Math.min(H - 10, Math.max(10, CONS[c][1] * SK));
    g.lineWidth = 3.5; g.strokeStyle = "#fff"; g.strokeText(c, x, y); g.fillStyle = "#c62828"; g.fillText(c, x, y); }
  /* Messier objects */
  g.font = "bold 11px 'Segoe UI',sans-serif";
  for (const [m, ra, de] of MESS) { const p = proj(ra, de); if (!p || p[0] < 4 || p[0] > W - 4 || p[1] < 4 || p[1] > H - 4) continue;
    g.strokeStyle = "#1b8a3a"; g.lineWidth = 1.6; g.beginPath(); g.arc(p[0], p[1], 6, 0, 7); g.stroke();
    g.lineWidth = 3; g.strokeStyle = "#fff"; g.strokeText(m, p[0] + 14, p[1] - 8); g.fillStyle = "#1b8a3a"; g.fillText(m, p[0] + 14, p[1] - 8); }
  /* Albireo */
  const B = proj(292.680, 27.960); g.strokeStyle = "#c62828"; g.lineWidth = 1.8; g.beginPath(); g.arc(B[0], B[1], 8, 0, 7); g.stroke();
  g.font = "bold 16px 'Segoe UI',sans-serif"; g.lineWidth = 3.5; g.strokeStyle = "#fff"; g.strokeText("B", B[0] - 16, B[1] + 2); g.fillStyle = "#c62828"; g.fillText("B", B[0] - 16, B[1] + 2);
  /* directions, taken at the centre of the chart (they hardly turn across it) and drawn in a clear patch of Cygnus */
  const ra0 = FIT.a0 * 180 / Math.PI, de0 = FIT.d0 * 180 / Math.PI, P0 = proj(ra0, de0), C0 = [395, 548];
  const dirs = [["N", proj(ra0, de0 + 2)], ["S", proj(ra0, de0 - 2)], ["E", proj(ra0 + 2.4, de0)], ["W", proj(ra0 - 2.4, de0)]].map(([n, p]) => [n, [C0[0] + p[0] - P0[0], C0[1] + p[1] - P0[1]]]);
  g.strokeStyle = g.fillStyle = "#1b8a3a"; g.lineWidth = 2.2; g.font = "bold 17px 'Segoe UI',sans-serif";
  for (const [n, p] of dirs) { const dx = p[0] - C0[0], dy = p[1] - C0[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, ex = C0[0] + ux * 34, ey = C0[1] + uy * 34;
    g.beginPath(); g.moveTo(C0[0] + ux * 8, C0[1] + uy * 8); g.lineTo(ex, ey); g.stroke();
    g.beginPath(); g.moveTo(ex + ux * 2, ey + uy * 2); g.lineTo(ex - ux * 9 - uy * 5, ey - uy * 9 + ux * 5); g.lineTo(ex - ux * 9 + uy * 5, ey - uy * 9 - ux * 5); g.closePath(); g.fill();
    g.lineWidth = 3.5; g.strokeStyle = "#fff"; g.strokeText(n, ex + ux * 14, ey + uy * 14); g.fillText(n, ex + ux * 14, ey + uy * 14); g.lineWidth = 2.2; g.strokeStyle = "#1b8a3a"; }
  g.beginPath(); g.arc(C0[0], C0[1], 3, 0, 7); g.fill();
  /* the centre of the chart */
  g.strokeStyle = "#c62828"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(P0[0] - 7, P0[1]); g.lineTo(P0[0] + 7, P0[1]); g.moveTo(P0[0], P0[1] - 7); g.lineTo(P0[0], P0[1] + 7); g.stroke();
  /* declination box at the bottom left */
  g.font = "bold 15px 'Segoe UI',sans-serif"; g.textAlign = "left"; g.fillStyle = "#fffef6"; g.fillRect(150, H - 34, 104, 24); g.strokeStyle = "#c62828"; g.lineWidth = 1.5; g.strokeRect(150, H - 34, 104, 24);
  g.fillStyle = "#c62828"; g.fillText("δ ≈ +32°", 158, H - 21);
  g.restore(); }

const ABBR = Object.keys(SKY_DATA.bounds).sort().join(" ");
ChartRound.page({
  key: "hl-apao2015-m", assets: "",
  title: {ko: "APAO 2015 성도 라운드 — 10. 다카의 하늘", en: "APAO 2015 sky map round — 10. Sky from Dhaka"},
  sub: {ko: "제11회 아시아·태평양 천문 올림피아드 · 방글라데시 다카 · 2015년 11월 13–22일 · 제한 시간 30분 · 시험 성도 위에 연필로 그리듯 답합니다.",
        en: "XI Asian-Pacific Astronomy Olympiad · Dhaka, Bangladesh · 13–22 November 2015 · 30 minutes · you answer by drawing on the examination's own chart."},
  docTitle: {ko: "APAO 2015 성도 라운드 — 다카의 하늘 · HaslaLab", en: "APAO 2015 sky map round — Sky from Dhaka · HaslaLab"},
  solTitle: {ko: "HaslaLab 해답 (공식 해답은 공개되지 않음)", en: "HaslaLab's solution (no official solution was published)"},
  about: {ko: "성도는 APAO 2015 공식 부클릿(issp.ac.ru/iao/apao)의 시험 성도 그대로입니다. 공식 해답이 공개되지 않아, HaslaLab이 이 성도를 히파르코스 별 338개에 맞춰 도법을 풀고(람베르트 정적 방위도법, 중심 적경 20h23.5m · 적위 +32.2°, 오차 0.4 px) 그 결과로 해답을 그렸습니다. 그린 것과 답안은 이 브라우저에만 저장됩니다.",
          en: "The chart is the examination's own, from the official APAO 2015 booklet (issp.ac.ru/iao/apao). No official solution was published, so HaslaLab solved the chart's projection against 338 Hipparcos stars (Lambert azimuthal equal-area, centre RA 20h23.5m, Dec +32.2°, rms 0.4 px) and drew the solution from it. What you draw and write stays in this browser only."},
  maps: {m10: {w: SW, h: SH, img: "apao2015_M/map.png", name: {ko: "시험 성도", en: "Sky map"}, note: {ko: "왼쪽 아래 선분 = 하늘에서 11°", en: "bar at the bottom left = 11° on the sky"}}},
  tasks: [{
    id: "10", name: {ko: "다카의 하늘", en: "Sky from Dhaka"},
    lead: {ko: "오늘 다카에서 보이는 하늘의 한 영역을 그린 지도가 주어집니다. 그려진 선은 별자리의 경계입니다. 왼쪽 아래 구석의 선분은 하늘에서 11°에 해당합니다.",
           en: "You are given a map of a certain region of sky as visible from Dhaka today. The lines drawn indicate boundaries of the constellations. The line shown at the bottom left corner corresponds to 11° in the sky."},
    maps: ["m10"],
    parts: [
      {id: "10.1", ko: "방위(북, 남, 동, 서)를 화살표와 기호 N, S, E, W로 표시하세요.", en: "Mark directions (North, South, East, West) with arrows and symbols N, S, E, W."},
      {id: "10.2", ko: "가능한 한 많은 별자리를 찾아 표준 세 글자 약어로 표시하세요(아래 IAU 별자리 약어표를 참고하세요).", en: "Identify as many constellations as possible, mark them by standard three-letter designation (use the table of IAU names of the constellations below as a reference)."},
      {id: "10.3", ko: "별자리 선(막대 그림)을 그려 별자리의 대략적인 모양을 나타내세요.", en: "Indicate approximate shape of the constellations by drawing stick figures."},
      {id: "10.4", ko: "이 지도에는 한 별은 노란색, 다른 별은 파란색인 유명한 쌍성이 있습니다. 이 별을 글자 “B”로 표시하세요.", en: "There is a particular binary star in this map, where one component star has yellow colour and the other star has blue colour. Mark this star with the letter “B”."},
      {id: "10.5", ko: "메시에 목록 천체 아무것이나 두 개의 위치를 글자 “M”으로 지도에 표시하세요.", en: "Mark with the letter “M” positions of any two Messier list objects on the map."},
      {id: "10.6", ko: "지도 중심의 적위를 어림하여 왼쪽 아래 구석의 상자 δ = … 에 쓰세요(이 페이지에서는 오른쪽 답안지에 씁니다).", en: "Estimate declination of the center of the map and write it in the box δ = … at the bottom left corner (on this page, in the answer sheet on the right)."},
      {h: {ko: "IAU 별자리 약어", en: "IAU constellation abbreviations"}, ko: '<span style="font-family:ui-monospace,Consolas,monospace;font-size:12px">' + ABBR + "</span>", en: '<span style="font-family:ui-monospace,Consolas,monospace;font-size:12px">' + ABBR + "</span>"}],
    fields: [["dec", {ko: "10.6 지도 중심의 적위 δ (°)", en: "10.6 Dec of the map centre δ (°)"}], ["b", {ko: "10.4 쌍성 B의 이름", en: "10.4 Name of the binary B"}],
             ["m1", {ko: "10.5 첫째 M (번호)", en: "10.5 First M (number)"}], ["m2", {ko: "10.5 둘째 M (번호)", en: "10.5 Second M (number)"}]],
    solNote: {ko: "공식 해답이 공개되지 않은 문제입니다. 아래는 HaslaLab이 성도의 도법을 풀어 계산한 해답입니다.", en: "No official solution was published for this problem. Below is HaslaLab's solution, computed by solving the chart's projection."},
    key: [
      ["10.1", {ko: "N은 아래(케페우스·작은곰자리 쪽), S는 위(궁수·염소자리 쪽), E는 오른쪽(페가수스·안드로메다 쪽), W는 왼쪽(헤르쿨레스·뱀주인자리 쪽). 지도는 북쪽이 아래로 뒤집혀 있습니다(남쪽 하늘을 바라본 그대로).",
                en: "N is down (towards Cepheus and Ursa Minor), S is up (towards Sagittarius and Capricornus), E is right (towards Pegasus and Andromeda), W is left (towards Hercules and Ophiuchus). The chart is printed with north at the bottom."}],
      ["10.2", {ko: "21개: Cyg, Lyr, Vul, Sge, Del, Equ, Aql, Sct, Ser(꼬리), Oph, Her, Sgr, Cap, Aqr, Peg, Lac, And, Cas, Cep, Dra, UMi. 가운데 큰 영역이 백조자리(Cyg)입니다.",
                en: "21: Cyg, Lyr, Vul, Sge, Del, Equ, Aql, Sct, Ser (Cauda), Oph, Her, Sgr, Cap, Aqr, Peg, Lac, And, Cas, Cep, Dra, UMi. The large region in the middle is Cygnus."}],
      ["10.3", {ko: "아래 그림의 파란 선. 백조자리의 북십자, 거문고자리의 평행사변형, 독수리자리, 돌고래자리, 페가수스 사각형의 한쪽, 카시오페이아의 W 등.", en: "Blue lines in the figure: the Northern Cross of Cygnus, the parallelogram of Lyra, Aquila, Delphinus, the side of the Square of Pegasus, the W of Cassiopeia, and so on."}],
      ["10.4", {ko: "알비레오(β Cyg) — 백조자리의 머리, 3등급 노란 별과 5등급 파란 별.", en: "Albireo (β Cyg) — the head of the Swan, a yellow 3rd-magnitude and a blue 5th-magnitude star."}],
      ["10.5", {ko: "예: M57(고리 성운, 거문고자리 β와 γ 사이), M27(아령 성운, 여우자리), M15·M2(구상 성단), M39·M29(산개 성단), M56, M71, M11(야생오리 성단), M52 등 가운데 두 개.",
                en: "Any two, e.g. M57 (Ring Nebula, between β and γ Lyr), M27 (Dumbbell, Vulpecula), M15 and M2 (globular clusters), M39 and M29 (open clusters), M56, M71, M11 (Wild Duck), M52."}],
      ["10.6", {ko: "δ ≈ +32° (도법 풀이: +32.2°, 중심 적경 20h23.5m). 데네브(+45°)·베가(+39°)·알비레오(+28°) 사이 위치나 11° 눈금으로 어림해도 ±3° 안에 듭니다.",
                en: "δ ≈ +32° (from the projection: +32.2°, centre RA 20h23.5m). Interpolating between Deneb (+45°), Vega (+39°) and Albireo (+28°), or using the 11° bar, gives it within ±3°."}]],
    sol: [{draw: drawKey, w: SW, h: SH, needs: MAP, cap: {ko: "HaslaLab 해답 — 빨강: 별자리 약어와 B, 파랑: 별자리 선, 초록: 방위와 메시에 천체, 빨간 십자: 지도 중심", en: "HaslaLab's solution — red: constellations and B, blue: stick figures, green: directions and Messier objects; red cross: the centre of the chart"}}]
  }]
});
</script>
