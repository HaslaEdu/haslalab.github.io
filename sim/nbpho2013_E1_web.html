<script>
/* NBPhO 2013 problem 5 "Friction of a string" on the 3-D bench.  A string over a horizontal rod (the ball-
   point pen, or the pencil for checking) holds the weight on one side and the spring balance on the
   other.  Pulled slowly so that the string slides, the balance reads T = W·e^{μα} (weight rising) or
   W·e^{−μα} (weight going down) — the capstan law the solution derives; in between the string does not
   move (static friction a little higher).  While it slides the reading wanders with stick–slip.  The
   string can be wound α = π … 5π round the rod with both ends hanging straight down.  The pencil's
   μ₂ = 0.20 is given on the sheet; the pen's μ₁ differs from visit to visit. */
var PROGRAM = {
  title: { ko: 'NBPhO 2013 실험 5 — 줄의 마찰', en: 'NBPhO 2013 Problem 5 — Friction of a string' },
  subtitle: { ko: '볼펜과 줄 사이의 운동 마찰 계수 μ₁ 을 재고 불확도를 어림하세요. 연필과 같은 줄 사이의 운동 마찰 계수는 μ₂ = 0.20 ± 0.01 로 미리 재어 두었습니다.',
              en: 'Measure the dynamic coefficient of friction μ₁ between the ballpoint pen and the string, and estimate the uncertainty. The dynamic coefficient between the pencil and the same string was measured beforehand: μ₂ = 0.20 ± 0.01.' },
  notes: { ko: [
    '장비: 용수철저울(동력계), 줄, 볼펜, 연필, 추 (문제지 그대로).',
    '줄이 미끄러지는 동안 저울은 T = W·e^{μα}(추가 올라갈 때) 또는 W·e^{−μα}(내려갈 때)를 가리킵니다. 그 사이에서는 줄이 움직이지 않습니다(정지 마찰이 조금 더 큼). 미끄러지는 동안 눈금은 조금 흔들립니다.',
    '감는 각 α 는 π … 5π (양 끝이 똑바로 아래로 늘어지도록) 중에서 고릅니다. 저울의 범위는 10 N 입니다.',
    '연필의 μ₂ = 0.20 은 공식을 모르더라도 비례 상수를 맞추는 데 쓸 수 있습니다(공식 해답의 “덜 정확한 풀이”). 볼펜의 μ₁ 은 방문할 때마다 다릅니다.'], en: [
    'Equipment: a dynamometer (spring balance), a string, a ballpoint pen, a pencil and a weight (as on the sheet).',
    'While the string slides the balance reads T = W·e^{μα} (weight rising) or W·e^{−μα} (weight going down); in between the string does not move (static friction is a little higher). While it slides the reading wanders a little.',
    'The winding angle α is one of π … 5π (both ends hanging straight down). The balance reads up to 10 N.',
    'The pencil\'s μ₂ = 0.20 can calibrate the constant even without the formula (the solution\'s "extra, less exact" way). The pen\'s μ₁ differs from visit to visit.'] }
};

var LAB = { rod: 'pen', k: 1, s: 0, yH: 24.4, slide: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드에 가로로 물린 볼펜(클릭하면 연필로 바꿔 끼움), 그 위로 넘긴 줄 — 한쪽 끝에 추(100 g), 다른 쪽 끝에 손에 든 용수철저울.',
           en: 'On the desk: the ballpoint pen clamped across the stand (click it to put the pencil in instead), and the string over it — the weight (100 g) on one end, the spring balance in your hand on the other.' },
  howto: { ko: ['용수철저울: 위아래로 천천히 끌기 — 줄이 미끄러지는 동안의 눈금을 읽습니다 (끌어내리면 추가 올라가고, 놓아 올리면 추가 내려감)',
                '막대(볼펜/연필): 휠로 감는 각 α 바꾸기 (π, 2π, … 5π) · 클릭: 볼펜 ↔ 연필 바꿔 끼우기',
                '저울을 클릭하면 눈금을 가까이 봅니다 (0.1 N 눈금)'],
           en: ['Spring balance: drag it slowly down or up — read it while the string slides (pull down and the weight rises; let up and it goes down)',
                'Rod (pen/pencil): roll the wheel to change the winding α (π, 2π, … 5π) · click: swap pen ↔ pencil',
                'Click the balance to look closely at its scale (0.1 N marks)'] },
  notePlaceholder: { ko: '예) 볼펜, α = 3π: 올릴 때 3.05 N, 내릴 때 0.32 N, W = 0.98 N', en: 'e.g. pen, α = 3π: rising 3.05 N, lowering 0.32 N, W = 0.98 N' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var MU = { pen: 0.125 * (1 + S.sys('mu1', 0.12)), pencil: 0.20 * (1 + S.sys('mu2', 0.03)) }, W = 0.100 * 9.81 * (1 + S.sys('W', 0.004));
    var ks = 100, YR = 52, RX = 0, RZ = 0, Lw0 = 30, Lh0 = 14, MAXN = 10;            /* N/m; rod height; string lengths (cm) */
    var scale = (function () { var c = document.createElement('canvas'), k = 60; c.width = 150; c.height = 11 * k; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#f2f2ee'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#111'; g.strokeStyle = '#111';
      for (var i = 0; i <= 100; i++) { var y = c.height - (0.5 + i / 10) * k, L = i % 10 === 0 ? 60 : i % 5 === 0 ? 42 : 26; g.lineWidth = i % 10 === 0 ? 3 : 1.5;
        g.beginPath(); g.moveTo(0, y); g.lineTo(L, y); g.stroke(); if (i % 10 === 0) { g.font = '700 34px sans-serif'; g.textBaseline = 'middle'; g.fillText(String(i / 10), 72, y); } }
      g.font = '700 30px sans-serif'; g.fillText('N', 100, 26); return c; })();
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, wheelIds: ['rod'],
      home: { yaw: -0.3, pitch: 0.25, k: 8.5, tx: 4, ty: 32, tz: 0 },
      views: {
        bal: { yaw: 0, pitch: 0.02, k: 55, tx: 8, ty: 20, tz: 0, title: { ko: '용수철저울', en: 'Spring balance' },
               hint: { ko: '저울을 위아래로 끌며 눈금 읽기 · Esc: 돌아가기', en: 'Drag the balance up or down and read it · Esc: back' } },
        rod: { yaw: -0.5, pitch: 0.25, k: 40, tx: 0, ty: YR, tz: 0, title: { ko: '막대와 감은 줄', en: 'The rod and the winding' } }
      },
      frame: function (b) {
        var mu = MU[LAB.rod], alpha = LAB.k * Math.PI, R = LAB.rod === 'pen' ? 0.55 : 0.42;
        var wr = b.wheel('rod'); if (wr) { LAB.k = Math.max(1, Math.min(5, LAB.k + Math.sign(wr))); b.say('감은 각 α = ' + LAB.k + 'π', 'Winding α = ' + LAB.k + 'π'); }
        if (b.clicked('m:rod') && b.view === 'rod') { LAB.rod = LAB.rod === 'pen' ? 'pencil' : 'pen'; b.say(LAB.rod === 'pen' ? '볼펜으로 바꿨습니다.' : '연필로 바꿨습니다.', LAB.rod === 'pen' ? 'Pen in.' : 'Pencil in.'); }
        var hm = b.screenMoved('bal'); if (hm[1]) LAB.yH = Math.max(2, Math.min(YR - 16, LAB.yH - hm[1] / Math.max(0.3, Math.cos(B3.CAM.pitch))));
        /* the string over the rod: s is how far it has slid towards the balance (cm) */
        var Th = function (s) { return ks * Math.max(0, (YR - R - Lh0 - s) - (LAB.yH + 12)) / 100; };
        var sMin = Lw0 - YR + 4.6, sMax = Lw0 - 3;                         /* the weight between the desk and the rod */
        var noise = 1 + 0.035 * Math.sin(b.t * 9.1) * Math.sin(b.t * 2.3 + 1);
        var up = W * Math.exp(mu * alpha * noise), dn = W * Math.exp(-mu * alpha * noise), us = W * Math.exp(1.15 * mu * alpha), ds = W * Math.exp(-1.15 * mu * alpha);
        var T = Th(LAB.s), was = LAB.slide; LAB.slide = 0;
        if (T > (was > 0 ? up : us)) { LAB.s = Math.min(sMax, YR - R - Lh0 - LAB.yH - 12 - up / ks * 100); LAB.slide = 1; }
        else if (T < (was < 0 ? dn : ds)) { LAB.s = Math.max(sMin, YR - R - Lh0 - LAB.yH - 12 - dn / ks * 100); LAB.slide = -1; }
        LAB.s = Math.max(sMin, Math.min(sMax, LAB.s)); T = Th(LAB.s);
        var e = Math.min(MAXN / ks * 100, T / ks * 100);                            /* cm: the spring's stretch, stopped at full scale */
        if (T > MAXN) b.say('저울의 범위(10 N)를 넘었습니다!', 'Beyond the balance\'s range (10 N)!');
        /* the desk, the stand and the rod */
        B3.desk(-35, 40, -20, 20);
        B3.stand(0, -12, 70, { bw: 8, bd: 8 });
        B3.box3(-1.2, 1.2, YR - 1.2, YR + 1.2, -12, -9.5, '#3a3f46');
        if (LAB.rod === 'pen') { B3.cyl3('z', -10, 4, RX, YR, R, '#1d4fa0', { id: 'm:rod', seg: 16, cap: '#123a78' }); B3.cyl3('z', 4, 5.5, RX, YR, R * 0.6, '#d8d8d8', { id: 'm:rod', seg: 12 }); }
        else { var pts = []; for (var i = 0; i < 6; i++) { var a = i * Math.PI / 3; pts.push([RX + Math.cos(a) * R / 0.866, YR + Math.sin(a) * R / 0.866]); } B3.prism3('z', -10, 5, pts, '#d9a521', { id: 'm:rod' }); }
        /* the winding: k half-turns along the rod, then the two ends straight down */
        var wp = [], ends = LAB.k % 2 === 1;                                        /* odd: ends on opposite sides */
        var zA = 0.4 - LAB.k * 0.12, zB = 0.4 + LAB.k * 0.12;
        for (i = 0; i <= LAB.k * 16; i++) { var f = i / (LAB.k * 16), th = Math.PI - f * LAB.k * Math.PI;   /* from the weight side (x < 0) over the top */
          wp.push([RX + Math.cos(th) * (R + 0.03), YR + Math.sin(th) * (R + 0.03), zA + (zB - zA) * f]); }
        var wx = RX - R - 0.03, hx = ends ? RX + R + 0.03 : RX - R - 0.03;
        var yw = YR - Lw0 + LAB.s, yHook = LAB.yH + 12 + e;
        B3.poly3([[wx, yw + 1.2, zA]].concat([[wx, YR, zA]]).concat(wp).concat([[hx, YR, zB], [hx, yHook + 0.4, zB]]), '#f2f2f2', 1.6);
        /* the weight */
        B3.cyl3('y', yw - 4.6, yw, wx, zA, 1.4, '#7c7f84', { seg: 18, cap: '#8e9196' }); B3.cyl3('y', yw, yw + 1.2, wx, zA, 0.15, '#7c7f84', { seg: 8 });
        B3.text3([wx - 1.0, yw - 2.0, zA + 1.42], [1, 0, 0], [0, -1, 0], '100 g', 0.55, '#f2f2f2', { weight: '700' });
        /* the spring balance: the body in the hand, the hook and its pointer pulled up out of it */
        var bx = hx, bz = zB, y0 = LAB.yH;
        B3.cyl3('y', y0, y0 + 12, bx, bz, 0.9, 'rgba(225,235,240,.45)', { id: 'm:bal', seg: 16, caps: false });
        B3.tex3(scale, 0, 0, scale.width, scale.height, [bx - 0.55, y0 + 11.5, bz + 0.92], [1.1, 0, 0], [0, -11, 0], { id: 'm:bal' });
        B3.cyl3('y', y0 + 0.5 + e, y0 + 12 + e, bx, bz - 0.1, 0.2, '#b8bec4', { seg: 8 });
        B3.box3(bx - 0.75, bx + 0.75, y0 + 0.95 + e - 0.06, y0 + 0.95 + e + 0.06, bz + 0.6, bz + 0.95, '#d4261c');      /* the pointer, 0 N at 1 cm */
        B3.cyl3('y', y0 - 1.6, y0, bx, bz, 0.25, '#888', { seg: 8 }); B3.cyl3('x', bx - 1.2, bx + 1.2, y0 - 1.8, bz, 0.35, '#e0c290', { id: 'm:bal', seg: 10 });   /* ring + the hand's grip */
        var V = b.views; V.bal.tx = bx; V.bal.ty = y0 + 6; V.bal.tz = bz;
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
