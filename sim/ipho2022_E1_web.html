<script>
/* IPhO 2022 Q1 "Planet" — browser build of the official console program
   Exp1.exe / Exp1.Linux / Exp1.Linux64.  Same prompts, same ranges, same
   rounding, same authorization key, same output line. */

var AUTH_KEY = '12345678.888';

var G_ACC = 15.8, T_DAY = 28000.0, OMEGA = 2 * Math.PI / T_DAY;
var WIND = 1.31, RHO_A0 = 0.60, H_ATM = 7500.0, GAMMA = 1.4, T0_C = 20.0;
var H_TOWER = 2000.0, R_MIN = 5.0, R_MAX = 50.0, RHO_MIN = 0.1, RHO_MAX = 10.0;
var CD = 0.24, SIGMA_T = 0.01, SIGMA_S = 0.05;
var BAR = new Array(49).join('=');

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function airDensity(z) {
  if (z >= H_ATM) return 0;
  return RHO_A0 * Math.pow(1 - z / H_ATM, 1 / (GAMMA - 1));
}

function drop(h, rcm, rhoG, path) {
  var r = rcm * 1e-2, rho = rhoG * 1e3;
  var area = Math.PI * r * r, mass = 4 / 3 * Math.PI * r * r * r * rho;
  var kd = CD * area / mass;

  function d(s) {
    var ra = airDensity(s[1]);
    var rx = s[2] - WIND, rz = s[3];
    var vr = Math.sqrt(rx * rx + rz * rz);
    return [s[2], s[3],
            -kd * ra * vr * rx - 2 * OMEGA * s[3],
            -kd * ra * vr * rz - G_ACC + 2 * OMEGA * s[2]];
  }

  var st = [0, h, 0, 0], t = 0, dt = 2e-3, i;
  while (st[1] > 0 && t < 1e5) {
    var step = dt;
    if (st[3] < 0 && st[1] / (-st[3]) < step) step = Math.max(st[1] / (-st[3]) * 0.5, 1e-6);
    var k1 = d(st);
    var s2 = []; for (i = 0; i < 4; i++) s2.push(st[i] + 0.5 * step * k1[i]);

    HL.rr(g, te[0] - 9, te[1] - 9, 18, 18, 4, '#f2c531', '#5a4a10', 1.2);
    g.restore();
    HL.rr(g, gx, gy, gw, gh, 4, null, '#1d1f22', 1.5);
    HL.text(g, '지면 — 위에서 본 모습 (휠: 확대, 끌기: 이동)', gx + 8, gy + 12, '#2a2215', 10.5, 'left', '700');
    var sb = Math.pow(10, Math.floor(Math.log10(120 / V.s))); g.strokeStyle = '#2a2215'; g.lineWidth = 2; g.beginPath(); g.moveTo(gx + 12, gy + gh - 12); g.lineTo(gx + 12 + sb * V.s, gy + gh - 12); g.stroke();
    HL.text(g, sb >= 1 ? sb + ' m' : Math.round(sb * 100) + ' cm', gx + 18 + sb * V.s, gy + gh - 12, '#2a2215', 10, 'left', '600');
    /* ---------- the stopwatch ---------- */
    HL.drawStopwatch(ui, 'sw', L1.sw, 437, 440, 1.2);
  }
};
