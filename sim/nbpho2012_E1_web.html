<script>
/* NBPhO 2012 problem 5 "Diffraction grating" on the 3-D bench.  The reflecting grating's pitch (≈ 320 nm,
   the official result) is below the wavelength (532 nm), so at normal incidence there is no first
   maximum.  The laser, clamped on its stand and always aimed at the grating, is tilted by moving the
   stand and its clamp; the first-order beam leaves at sin φ = λ/d − sin α (φ on the laser's side), and
   when it comes straight back (2d sin α = λ) its spot lands on the white card round the laser's
   aperture.  The angle is then read as a right triangle: the horizontal distance a on the desk ruler
   and the slant c, or the height on the rod's scale. */
var PROGRAM = {
  title: { ko: 'NBPhO 2012 실험 5 — 회절격자', en: 'NBPhO 2012 Problem 5 — Diffraction grating' },
  subtitle: { ko: '반사 회절격자의 격자 간격(이웃한 줄 사이 거리)을 재고 불확도를 어림하세요. 장비: 반사 회절격자, 녹색 레이저(λ = 532 nm), 자, 레이저를 물리는 스탠드.',
              en: 'Determine the pitch (the distance between neighbouring lines) of the reflecting diffraction grating and estimate the uncertainty. Equipment: a reflecting diffraction grating, a green laser (λ = 532 nm), a ruler and a stand for the laser.' },
  notes: { ko: [
    '공식 해답이 짚었듯 격자 간격이 파장보다 작아, 수직으로 비추면 1차 극대가 보이지 않습니다. 레이저를 기울여 1차 극대가 레이저 쪽으로 똑바로 되돌아오는 각 α 를 찾으면 2d sin α = λ.',
    '레이저는 언제나 격자 가운데를 겨누도록 물려 있습니다. 스탠드를 책상 위로 끌거나 집게를 위아래로 끌어 기울기를 바꿉니다. 되돌아온 점은 레이저 구멍 둘레의 흰 카드에 보입니다.',
    'sin α = a/c 는 직각삼각형의 변으로 셉니다 — 책상의 자(0 은 격자 가운데)와 스탠드 막대의 눈금을 쓰세요.',
    '공식 해답: d ≈ (320 ± 4) nm. 방문할 때마다 조금 다릅니다.'], en: [
    'As the official solution points out, the pitch is below the wavelength, so at normal incidence there is no first maximum. Tilt the laser until the first maximum comes straight back towards it, at the angle α where 2d sin α = λ.',
    'The laser is clamped so that it always aims at the middle of the grating. Drag the stand over the desk or drag its clamp up and down to change the tilt. The returning spot shows on the white card round the laser\'s aperture.',
    'Take sin α = a/c from the sides of a right triangle — use the desk ruler (0 at the middle of the grating) and the scale on the stand\'s rod.',
    'Official answer: d ≈ (320 ± 4) nm. It differs a little from visit to visit.'] }
};

var LAB = { x: 30, h: 20 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 검은 받침 위의 반사 회절격자(줄은 앞뒤 방향), 그 0 에서 시작하는 1 m 자, 눈금이 붙은 막대의 스탠드에 물려 격자를 겨누는 녹색 레이저(구멍 둘레에 흰 카드).',
           en: 'On the desk: the reflecting grating on a black block (its lines running front to back), a 1 m ruler starting at its 0, and the green laser clamped on a stand with a scale on its rod, aimed at the grating (a white card round its aperture).' },
  howto: { ko: ['스탠드 받침 끌기: 레이저의 가로 거리 바꾸기 · 집게 위아래로 끌기: 높이 바꾸기 (휠: 미세)',
                '레이저나 카드 클릭: 격자 쪽에서 카드를 가까이 보기 — 되돌아온 점이 구멍에 오도록',
                '자 클릭: 받침의 위치 · 막대 클릭: 집게 높이 가까이 읽기'],
           en: ['Drag the stand\'s base: the laser\'s horizontal distance · drag the clamp up or down: its height (wheel: fine)',
                'Click the laser or the card: look at the card from the grating\'s side — bring the returning spot to the hole',
                'Click the ruler: where the base stands · click the rod: read the clamp\'s height'] },
  notePlaceholder: { ko: '예) 점이 구멍에 왔을 때 a = 24.3 cm, h = 16.2 cm → sin α = a/√(a²+h²)', en: 'e.g. spot on the hole at a = 24.3 cm, h = 16.2 cm → sin α = a/√(a²+h²)' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var d = 320e-9 * (1 + S.sys('d', 0.012)), lam = 532e-9, GY = 1.0, rz = -7;     /* the grating's top; the rod sits behind the beam */
    var r0 = S.sys('r0', 0.08), h0 = S.sys('h0', 0.08);                               /* cm: where the scales' zeros really are */
    var ruler = B3.scaleTex(100, { horiz: true, width: 2.6, bg: '#e9e1c6', label: 'cm' });
    var rodScale = B3.scaleTex(60, { width: 1.2, bg: '#f2f2ee', step: 0.1 });
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['clamp'],
      home: { yaw: -0.25, pitch: 0.4, k: 7.5, tx: 24, ty: 22, tz: 0 },
      views: {
        card: { yaw: -Math.PI / 2 + 0.0, pitch: 0.6, k: 70, tx: 30, ty: 20, tz: 0, title: { ko: '레이저 둘레의 카드', en: 'The card round the laser' },
                hint: { ko: '되돌아온 녹색 점을 구멍에 맞추기 · Esc: 돌아가기', en: 'Bring the returning green spot onto the hole · Esc: back' } },
        ruler: { yaw: 0, pitch: 1.35, k: 40, tx: 30, ty: 0, tz: 2, title: { ko: '책상의 자', en: 'The desk ruler' } },
        rod: { yaw: 0, pitch: 0.05, k: 45, tx: 30, ty: 20, tz: rz, title: { ko: '막대의 눈금', en: 'The rod\'s scale' } }
      },
      frame: function (b) {
        var mv = b.moved('stand'); if (mv[0]) LAB.x = Math.max(6, Math.min(70, LAB.x + mv[0]));
        var dc = b.screenMoved('clamp'), wc = b.wheel('clamp'); if (dc[1] || wc) LAB.h = Math.max(6, Math.min(55, LAB.h - dc[1] / Math.max(0.3, Math.cos(B3.CAM.pitch)) + wc * 0.1));
        var x = LAB.x, h = LAB.h, L = Math.hypot(x, h - GY), sa = x / L, al = Math.asin(sa);
        var under = b.view === 'card';                                  /* looking up at the card from the grating: the desk is out of the way */
        if (!under) B3.desk(-40, 80, -20, 20);
        /* the grating: lines along z, so the orders spread in the x–y plane */
        if (!under) B3.box3(-3, 3, 0, GY - 0.05, -3, 3, '#1b1b1b', { top: '#222' });
        var grat = (function () { var c = document.createElement('canvas'); c.width = c.height = 128; c._static = true; var g = c.getContext('2d');
          var gr = g.createLinearGradient(0, 0, 128, 0); ['#7a5cff', '#3fa8ff', '#3fffb0', '#e8ff5a', '#ff8f3a', '#ff4a8a', '#7a5cff'].forEach(function (cc, i) { gr.addColorStop(i / 6, cc); });
          g.fillStyle = gr; g.fillRect(0, 0, 128, 128); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 0, 128, 128); return c; })();
        if (!under) B3.tex3(grat, 0, 0, 128, 128, [-2.5, GY, -2.5], [5, 0, 0], [0, 0, 5]);
        /* the ruler along the beam's plane, its 0 at the grating's middle */
        if (!under) B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [-1 - r0, 0.02, 3.4], [102, 0, 0], [0, 0, 2.6], { id: 'm:ruler' });
        /* the stand: base at x, rod behind the beam, the clamp at h, the laser along the beam's line */
        if (!under) B3.box3(x - 5, x + 5, 0, 1.4, rz - 6, rz + 3, '#3b4048', { id: 'm:stand', top: '#474c55' });
        B3.cyl3('y', 1.4, 60, x, rz, 0.6, '#c3c8cd', { id: 'm:rod', seg: 14, cap: '#dde1e4' });
        B3.tex3(rodScale, 0, 0, rodScale.width, rodScale.height, [x - 0.6, 1.4 + 60 + 1 - 1.4 - h0, rz + 0.62], [1.2, 0, 0], [0, -62, 0], { id: 'm:rod' });
        B3.box3(x - 1.2, x + 1.2, h - 1.2, h + 1.2, rz - 1.2, rz + 1.2, '#3a3f46', { id: 'm:clamp', top: '#474c55' });
        B3.box3(x - 0.35, x + 0.35, h - 0.35, h + 0.35, rz + 1.2, -1.1, '#c3c8cd', { id: 'm:clamp' });
        var u = [sa, (h - GY) / L, 0];                                               /* from the grating towards the laser */
        var P = [x, h, 0], back = [x + u[0] * 9, h + u[1] * 9, 0];
        B3.cylAB(P, back, 1.0, '#1e2a22', { seg: 18, id: 'm:card' }); B3.cylAB([x - u[0] * 0.3, h - u[1] * 0.3, 0], P, 0.4, '#2a3a2e', { seg: 12 });
        /* the white card round the aperture, square to the beam */
        var e1 = [u[1], -u[0], 0], e2 = [0, 0, 1], cs = 3.5;
        var C0 = [x - u[0] * 0.35 - e1[0] * cs - e2[0] * cs, h - u[1] * 0.35 - e1[1] * cs, -cs];
        var card = b.panel('card', 200, 200, function (ui) { var g = ui.g; g.fillStyle = '#fbfbf7'; g.fillRect(0, 0, 200, 200); HL.circle(g, 100, 100, 7, '#111');
          g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; g.strokeRect(1, 1, 198, 198);
          if (LAB.spot !== null) { var sx = 100 + LAB.spot / (2 * cs) * 200; if (sx > -10 && sx < 210) { var gr2 = g.createRadialGradient(sx, 100, 0, sx, 100, 9); gr2.addColorStop(0, 'rgba(210,255,200,1)'); gr2.addColorStop(0.4, 'rgba(60,255,90,.9)'); gr2.addColorStop(1, 'rgba(60,255,90,0)'); g.fillStyle = gr2; g.beginPath(); g.arc(sx, 100, 9, 0, 7); g.fill(); } } });
        B3.tex3(card, 0, 0, card.width, card.height, [x - u[0] * 0.35 + e1[0] * cs, h - u[1] * 0.35 + e1[1] * cs, -cs], [-e1[0] * 2 * cs, -e1[1] * 2 * cs, 0], [0, 0, 2 * cs], { id: 'm:card' });
        /* the beams: in, the mirror order, the first order */
        B3.line3(P, [0, GY, 0], 'rgba(90,255,120,.8)', 1.6);
        var spec = [-sa, (h - GY) / L, 0]; B3.line3([0, GY, 0], [spec[0] * 120, GY + spec[1] * 120, 0], 'rgba(90,255,120,.55)', 1.3);
        var sp = lam / d - sa; LAB.spot = null;
        if (Math.abs(sp) <= 1) {
          var ph = Math.asin(sp), dir = [Math.sin(ph), Math.cos(ph), 0];
          /* where it meets the card's plane: card offset along e1 (positive = towards the desk side) */
          var den = dir[0] * u[0] + dir[1] * u[1], t = den > 0.2 ? (L - 0.35) / den : 120;
          var hit = [dir[0] * t, GY + dir[1] * t, 0], off = (hit[0] - (x - u[0] * 0.35)) * e1[0] + (hit[1] - (h - u[1] * 0.35)) * e1[1];
          if (den > 0.2 && Math.abs(off) < cs) { LAB.spot = off; t -= 0.05; }
          B3.line3([0, GY, 0], [dir[0] * Math.min(t, 120), GY + dir[1] * Math.min(t, 120), 0], 'rgba(90,255,120,.5)', 1.2);
        }
        var V = b.views; V.card.tx = x; V.card.ty = h; V.card.yaw = -Math.PI / 2; V.ruler.tx = x; V.rod.tx = x; V.rod.ty = h;
        V.card.pitch = -Math.atan2(u[1], u[0]);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
