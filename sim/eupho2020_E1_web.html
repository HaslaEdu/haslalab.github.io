<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EuPhO 2020 Experiment 1 — Hidden Charge</title>
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* EuPhO 2020 Experiment 1 "Hidden Charge" — browser build of the official
   console program (Exp1-WIN.exe / Exp1-Linux / Exp1-OSX).

   EuPhO published the C++ source, so this is a line-by-line port of it:
   sources.zip -> Experiment_1/ (charge.cpp, main.cpp), by Taavet Kalda and
   Paul Stanley.  The hidden charge, the adaptive integrator, the 0.5 mm beam
   placement error and the printed wording are the originals. */

var R_P = [0.05435205, -0.0259338, -0.1150416];   /* hidden charge position, m */
var Q_P = -8.62193e-11;                            /* hidden charge, C         */
var M_E = 9.10938356e-31, E_0 = 1.60217662e-19, K_E = 8.9875517923e9;
var XY_MIN = -0.2, XY_MAX = 0.2, V_MAX = 10000, STEPS = 2000000;
var RADIAL_ERROR = 0.0005, DT_CONST = 100.0;
var SEP = new Array(49).join('-');

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function acc(x, y, z) {
  var r2 = x * x + y * y + z * z;
  var c = -K_E * Q_P * E_0 / (r2 * Math.sqrt(r2)) / M_E;
  return [c * x, c * y, c * z];
}

function solve(x0, y0, v0) {
  var dx = x0 - R_P[0], dy = y0 - R_P[1], dz = -10 - R_P[2];
  var vx = 0, vy = 0, vz = v0;
  for (var i = 0; i < 2 * STEPS; i++) {
    var rx = dx + R_P[0], ry = dy + R_P[1], rz = dz + R_P[2];
    if (Math.sqrt(rx * rx + ry * ry + rz * rz) > 1000) break;
    var a = acc(dx, dy, dz);
    var dt = DT_CONST / Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]);
    var b = acc(dx + vx * dt, dy + vy * dt, dz + vz * dt);
    var ex = 0.5 * (a[0] + b[0]), ey = 0.5 * (a[1] + b[1]), ez = 0.5 * (a[2] + b[2]);
    var half = 0.5 * dt * dt;
    dx += vx * dt + ex * half; dy += vy * dt + ey * half; dz += vz * dt + ez * half;
    vx += ex * dt; vy += ey * dt; vz += ez * dt;
    if (dz + R_P[2] > 0) {
      rx = dx + R_P[0]; ry = dy + R_P[1];
      if (rx >= XY_MIN && rx <= XY_MAX && ry >= XY_MIN && ry <= XY_MAX) return [true, rx, ry];
      return [false, rx, ry];
    }
  }
  return [false, 0, 0];
}

/* the original prints numbers with C++ default formatting */
function g(x) {
  var s = String(Math.round(x * 1e6) / 1e6);
  return s;
}

var PROGRAM = {
  title: 'EuPhO 2020 Experiment 1 — Hidden Charge',
  subtitle: { ko: '주최측이 배포한 것은 콘솔 실행 파일입니다. CMD 모드는 공개된 C++ 원본 소스를 그대로 옮긴 프로그램이고, 실험 모드는 같은 계산을 3D 실험대의 실제 장비(10 m 빔라인, 형광판, 고전압 전원)로 해 봅니다.',
              en: 'The organisers handed out a console executable. CMD mode is a line-by-line port of the published C++ source; experiment mode runs the same calculation behind real apparatus on a 3-D bench (a 10 m beam line, a phosphor screen, a high-voltage supply).' },
  notes: { ko: [
    '공식 바이너리는 <code>EuPhO-2020/official/official_binaries/</code>에 Windows·Linux·macOS 빌드로 있습니다.',
    'EuPhO는 <b>C++ 전체 소스도 공개했습니다</b> (<code>official/official_sources/Experiment_1/</code>). 이 페이지는 그 소스를 한 줄씩 옮긴 것이라 숨은 전하값·적분기·난수 오차·출력 문구가 원본과 같습니다.',
    '전자 가속 전압 1–10000 V, 빔 좌표 &minus;20–20 cm. 스크린은 z = 0에 놓인 40 cm &times; 40 cm 정사각형이고, 전자는 z = &minus;10 m에서 출발합니다.',
    '빔을 놓는 위치에는 표준편차 0.5 mm의 가우스 오차가 있습니다.',
    '과제: 고정 점전하의 위치 (x<sub>Q</sub>, y<sub>Q</sub>, z<sub>Q</sub>)와 전하량 Q의 크기·부호를 구하고 크기 정도의 오차를 추정하세요.'], en: [
    'The official binaries are in <code>EuPhO-2020/official/official_binaries/</code> for Windows, Linux and macOS.',
    'EuPhO also <b>published the full C++ source</b> (<code>official/official_sources/Experiment_1/</code>). This page is a line-by-line port of it, so the hidden charge, the integrator, the random error and the printed wording are the original ones.',
    'Accelerating voltage 1–10000 V, beam coordinates &minus;20–20 cm. The screen is a 40 cm &times; 40 cm square at z = 0, and the electrons start at z = &minus;10 m.',
    'Where the beam is put has a Gaussian error of 0.5 mm.',
    'Task: find the position (x<sub>Q</sub>, y<sub>Q</sub>, z<sub>Q</sub>) of the fixed point charge and the size and sign of its charge Q, with an order-of-magnitude error estimate.'] },
  run: async function (term) {
    for (;;) {
      var v;
      v = parseFloat((await term.ask('Beam accelerating voltage in V: ')).trim());
      while (!(v >= 0 && v <= V_MAX)) {
        v = parseFloat((await term.ask('Invalid entry.  Voltage must be between 1 and 10000: ')).trim());
      }
      var x = parseFloat((await term.ask('x-coordinate of the electron beam in cm: ')).trim()) / 100;
      while (!(x >= XY_MIN && x <= XY_MAX)) {
        x = parseFloat((await term.ask('Invalid entry.  x-coordinate must be between -20 and 20: ')).trim()) / 100;
      }
      var y = parseFloat((await term.ask('y-coordinate of the electron beam in cm: ')).trim()) / 100;
      while (!(y >= XY_MIN && y <= XY_MAX)) {
        y = parseFloat((await term.ask('Invalid entry.  y-coordinate must be between -20 and 20: ')).trim()) / 100;
      }

      term.writeln('Electron beam fired with parameters (x, y, V) = (' +
                   g(x * 100) + 'cm, ' + g(y * 100) + 'cm, ' + g(v) + 'V)');
      await term.yieldFrame();

      var res = solve(x + gauss(RADIAL_ERROR), y + gauss(RADIAL_ERROR),
                      Math.sqrt(2 * v * E_0 / M_E));
      if (res[0]) {
        term.writeln('Electron detected at (x, y) = (' + (res[1] * 100).toFixed(1) +
                     'cm, ' + (res[2] * 100).toFixed(1) + 'cm)');
      } else {
        term.writeln('Electron not detected...');
      }
      term.writeln(SEP);
    }
  }
};


/* Experiment mode, on the 3-D bench.  The program's electrons start 10 m from the screen, so the bench
   is a real beam line: the phosphor screen at the end of a square vacuum duct on the desk, the duct
   running back 10 m to the gun, which sits on an x–y stage with mm scales and 0.1 mm verniers; the
   high-voltage supply (after the 3B Scientific 10 kV supply) has a ten-turn potentiometer with a
   turns-counting dial, a key switch and a FIRE button.  The same solve() (with the program's own 0.5 mm
   beam scatter) decides where each electron lands.  The session's errors: each scale's zero is a little
   off, the screen's grid is printed a little off its true axes, the supply's display reads a little off. */
var E1L = { x: 50, y: 0, pot: 1000, key: false, spots: [], hv: {} };
PROGRAM.lab = {
  intro: { ko: '책상 위에는 형광 검출판(40 cm × 40 cm, 1 cm 격자)이 붙은 진공 덕트 끝과 고전압 전원이 있고, 덕트는 10 m 뒤의 전자총까지 이어집니다. 점전하는 검출판 앞 덕트 속 어딘가에 숨어 있습니다. ' +
               '전자총 쪽으로 가서 x·y 스테이지를 옮기고(위치는 mm 눈금과 0.1 mm 버니어로 읽기), 전원의 10회전 손잡이로 전압을 맞춘 뒤 키를 켜고 FIRE를 누르면, 검출판에 빛나는 점이 몇 초 동안 남습니다.',
           en: 'On the desk: the end of the vacuum duct with the phosphor screen (40 cm × 40 cm, 1 cm grid) and the high-voltage supply; the duct runs back 10 m to the electron gun. The point charge hides somewhere in the duct in front of the screen. ' +
               'Go to the gun and move its x–y stage (read the position on the mm scales and the 0.1 mm verniers), set the voltage with the supply\'s ten-turn knob, turn the key and press FIRE: a glowing spot stays on the screen for a few seconds.' },
  howto: { ko: ['덕트 끝의 <b>“전자총으로”</b> 표지판 클릭: 10 m 뒤 전자총 스테이지로 이동 (Esc: 돌아오기)',
                '스테이지: 캐리지를 끌어 옮기기, 캐리지 위에서 휠 = 0.1 mm (Shift+휠 = 0.01 mm)',
                '전원: 10회전 손잡이(끌기/휠), 다이얼 창 = 회전수, 눈금 = 1/100 회전; <b>KEY</b>를 켜고 <b>FIRE</b>',
                '검출판 클릭: 정면에서 보고 휠로 확대해 빛점의 격자 좌표 읽기'],
           en: ['Click the <b>“to the gun”</b> sign at the end of the duct to go 10 m back to the gun stage (Esc: come back)',
                'Stage: drag a carriage to move it; the wheel on a carriage moves 0.1 mm (Shift+wheel 0.01 mm)',
                'Supply: the ten-turn knob (drag or wheel); the dial window counts turns, the scale 1/100 turn; turn the <b>KEY</b> on and press <b>FIRE</b>',
                'Click the screen to face it, zoom with the wheel and read the spot against the grid'] },
  notePlaceholder: { ko: '예) V = 1000 V, 빔 (x, y) = (5.00, 0.00) cm → 검출 (4.9, 0.3) cm', en: 'e.g. V = 1000 V, beam (x, y) = (5.00, 0.00) cm → spot at (4.9, 0.3) cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    E1L.zx = S.sys('slideX', 0.3); E1L.zy = S.sys('slideY', 0.3);       /* mm: the scales' zeros */
    E1L.gx = S.sys('gridX', 0.5); E1L.gy = S.sys('gridY', 0.5);         /* mm: the grid on the screen */
    E1L.vg = S.sys('hvGain', 0.004);
    var CX = 40, CY = 30, GZ = -1000;                                   /* the screen centre; the gun's z */
    /* the main scales (20 px per mm, 420 mm long), printed for a reader standing behind the gun */
    function scaleCanvas(vertical) {
      var c = document.createElement('canvas'), k = 16, Lp = 420 * k; c._static = true;
      if (vertical) { c.width = 300; c.height = Lp; } else { c.width = Lp; c.height = 300; }
      var g = c.getContext('2d'); g.fillStyle = '#e9ecef'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#111'; g.strokeStyle = '#111';
      for (var m = -210; m <= 210; m++) {
        var t = (vertical ? (210 - m) : (210 - m)) * k, L = m % 10 === 0 ? 150 : m % 5 === 0 ? 105 : 70;
        g.lineWidth = m % 10 === 0 ? 5 : 3;
        if (vertical) { g.beginPath(); g.moveTo(300, t); g.lineTo(300 - L, t); g.stroke(); }
        else { g.beginPath(); g.moveTo(t, 300); g.lineTo(t, 300 - L); g.stroke(); }
        if (m % 10 === 0 && Math.abs(m) <= 200) { g.font = '700 70px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
          if (vertical) g.fillText(String(m / 10), 85, t); else g.fillText(String(m / 10), t, 85); }
      }
      return c;
    }
    var scX = scaleCanvas(false), scY = scaleCanvas(true);
    /* a vernier plate: 10 divisions over 9 mm, zero at the index */
    function vernierCanvas(vertical) {
      var c = document.createElement('canvas'), k = 20; c._static = true;
      if (vertical) { c.width = 260; c.height = 360; } else { c.width = 360; c.height = 260; }
      var g = c.getContext('2d'); g.fillStyle = '#d6dbe0'; g.fillRect(0, 0, c.width, c.height); g.strokeStyle = '#111'; g.fillStyle = '#111';
      for (var v = 0; v <= 10; v++) { var t = 90 + v * 0.9 * k * (vertical ? -1 : 1), L = v % 5 === 0 ? 120 : 80;
        if (vertical) t = 270 - v * 0.9 * k; g.lineWidth = 4;
        if (vertical) { g.beginPath(); g.moveTo(0, t); g.lineTo(L, t); g.stroke(); if (v % 5 === 0) { g.font = '700 50px sans-serif'; g.fillText(String(v), 150, t + 18); } }
        else { g.beginPath(); g.moveTo(t, 0); g.lineTo(t, L); g.stroke(); if (v % 5 === 0) { g.font = '700 50px sans-serif'; g.textAlign = 'center'; g.fillText(String(v), t, 190); } } }
      return c;
    }
    var vnX = vernierCanvas(false), vnY = vernierCanvas(true);
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['sx', 'sy'],
      home: { yaw: -0.62, pitch: 0.42, k: 4.6, tx: 55, ty: 24, tz: -15 },
      views: {
        screen: { yaw: 0, pitch: 0.02, k: 15, tx: CX, ty: CY, tz: 0, title: { ko: '형광 검출판 (격자 1 cm, 가는 선 5 mm)', en: 'Phosphor screen (1 cm grid, fine lines 5 mm)' },
                  hint: { ko: '휠로 확대해 빛점의 좌표 읽기 · Esc: 돌아가기', en: 'Zoom with the wheel and read the spot · Esc: back' } },
        hv: { yaw: 0, pitch: 0.12, k: 42, tx: 92, ty: 8.5, tz: 18, title: { ko: '고전압 전원 0–10 kV', en: 'High-voltage supply 0–10 kV' } },
        gun: { yaw: Math.PI + 0.25, pitch: 0.18, k: 11, tx: CX, ty: 28, tz: GZ - 14, title: { ko: '전자총 x·y 스테이지 (검출판에서 10 m 뒤)', en: 'Electron gun x–y stage (10 m behind the screen)' },
               hint: { ko: '캐리지를 끌어 옮기기 · 캐리지 위에서 휠 = 0.1 mm · 휠로 확대해 버니어 읽기 · Esc: 책상으로', en: 'Drag a carriage · wheel on a carriage = 0.1 mm · zoom to read the verniers · Esc: back to the desk' } }
      },
      frame: function (b) {
        B3.desk(-20, 110, -45, 40);
        /* the duct on its stands, the screen in its window frame at z = 0 */
        [-30, -8].forEach(function (z) { B3.box3(CX - 20, CX + 20, 0, 2, z - 3, z + 3, '#5d6670'); });
        for (var z = -45; z > GZ + 30; z -= 60) {
          var z0 = Math.max(GZ + 30, z - 60);
          B3.box3(CX - 28, CX + 28, 2, 58, z0, z, '#a6adb4', { id: z > -50 ? 'm:screen' : undefined, cull: true });
        }
        B3.box3(CX - 30, CX + 30, 1, 59, -45, -1, '#b9c0c6', { id: 'm:screen', top: '#c5cbd0' });
        B3.box3(CX - 30, CX + 30, 1, 59, -1, 0, '#40464d', { id: 'm:screen' });
        /* the phosphor: the grid as printed, the spots fading */
        E1L.spots = E1L.spots.filter(function (sp) { return b.t - sp.t < 10; });
        var scv = b.panel('screen', 420, 420, function (ui) {
          var g = ui.g, k = 1, P = function (xmm, ymm) { return [210 + xmm, 210 - ymm]; };
          g.fillStyle = '#0b1a10'; g.fillRect(0, 0, 420, 420);
          g.save(); g.translate(E1L.gx, -E1L.gy);
          for (var mm = -200; mm <= 200; mm += 5) { var a1 = P(mm, -200), b1 = P(mm, 200), c1 = P(-200, mm), d1 = P(200, mm);
            g.strokeStyle = mm === 0 ? 'rgba(150,240,170,.75)' : mm % 10 === 0 ? 'rgba(150,240,170,.42)' : 'rgba(150,240,170,.2)';
            g.lineWidth = mm % 10 === 0 ? 0.55 : 0.3; g.beginPath(); g.moveTo(a1[0], a1[1]); g.lineTo(b1[0], b1[1]); g.moveTo(c1[0], c1[1]); g.lineTo(d1[0], d1[1]); g.stroke();
            if (mm % 50 === 0) { HL.text(g, String(mm / 10), a1[0], 413, 'rgba(170,250,190,.75)', 7, 'center'); HL.text(g, String(mm / 10), 4, c1[1], 'rgba(170,250,190,.75)', 7, 'left'); } }
          g.restore();
          E1L.spots.forEach(function (sp) { var q = P(sp.x, sp.y), f = Math.exp(-(b.t - sp.t) / 3), gl = g.createRadialGradient(q[0], q[1], 0, q[0], q[1], 3.4);
            gl.addColorStop(0, 'rgba(215,255,220,' + f + ')'); gl.addColorStop(0.45, 'rgba(120,255,150,' + 0.75 * f + ')'); gl.addColorStop(1, 'rgba(80,255,120,0)'); HL.circle(g, q[0], q[1], 3.4, gl); });
          HL.text(g, 'x (cm) →', 414, 8, '#9aa3ab', 7, 'right'); HL.text(g, '↑ y', 6, 8, '#9aa3ab', 7, 'left');
        });
        B3.tex3(scv, 0, 0, scv.width, scv.height, [CX - 21, CY + 21, 0.02], [42, 0, 0], [0, -42, 0], { id: 'p:screen' });
        /* the sign to the gun */
        B3.box3(CX - 31, CX - 30, 38, 54, -44, -16, '#2e7d5b', { id: 'c:goGun' });
        B3.text3([CX - 31.05, 48.5, -42], [0, 0, 1], [0, 1, 0], ctx.lang() === 'en' ? '← to the gun' : '← 전자총으로', 2.6, '#ffffff', { weight: '800' });
        B3.text3([CX - 31.05, 43, -42], [0, 0, 1], [0, 1, 0], ctx.lang() === 'en' ? '10 m, click' : '10 m · 클릭', 2.2, '#d6f5e6', { weight: '700' });
        if (b.clicked('c:goGun')) b.go('gun');
        /* the high-voltage supply */
        var hx = 92, hz = 10, hw = 24, hh = 15, hd = 22;
        B3.box3(hx - hw / 2, hx + hw / 2, 0, hh, hz - hd / 2, hz + hd / 2 - 0.4, '#d5d9dd', { id: 'm:hv', top: '#e1e5e8' });
        var hcv = b.panel('hv', 480, 300, function (ui) {
          var g = ui.g, st = E1L.hv;
          HL.rr(g, 0, 0, 480, 300, 6, '#2f5d8c'); HL.rr(g, 8, 8, 464, 284, 4, '#3a6ea5');
          HL.text(g, '3B SCIENTIFIC® PHYSICS', 20, 26, '#ffffff', 13, 'left', '800'); HL.text(g, 'High Voltage Power Supply  0 … 10 kV', 20, 46, '#dbe7f3', 11, 'left', '600');
          var V = E1L.key ? E1L.pot : 0;
          HL.lcd(g, 300, 18, 160, 48, (V * (1 + E1L.vg) / 1000).toFixed(3), { col: '#ff9d5c', glow: 'rgba(255,140,60,.35)', bg: '#1a120c', frame: '#123' });
          HL.text(g, 'kV', 466, 76, '#dbe7f3', 11, 'right', '700');
          /* the ten-turn potentiometer and its turns-counting dial */
          var e = ui.hit('pot', { cx: 120, cy: 170, r: 64 }, { wheel: true, cursor: 'ns-resize' });
          if (e.down) E1L.pot -= e.rawdy * 4; if (e.wheel) E1L.pot += e.wheel * (e.shift ? 1 : 10);
          E1L.pot = Math.max(0, Math.min(V_MAX, E1L.pot));
          var turns = E1L.pot / 1000, frac = turns - Math.floor(turns);
          HL.circle(g, 124, 174, 66, 'rgba(0,0,0,.35)'); HL.circle(g, 120, 170, 64, '#1d1f22', '#000', 1.5);
          for (var i = 0; i < 100; i++) { var a = -Math.PI / 2 + (i / 100 - frac) * 2 * Math.PI, L = i % 10 === 0 ? 12 : i % 5 === 0 ? 8 : 5;
            g.strokeStyle = '#e8e8e8'; g.lineWidth = i % 10 === 0 ? 1.6 : 0.8; g.beginPath(); g.moveTo(120 + Math.cos(a) * 60, 170 + Math.sin(a) * 60); g.lineTo(120 + Math.cos(a) * (60 - L), 170 + Math.sin(a) * (60 - L)); g.stroke();
            if (i % 10 === 0) HL.text(g, String(i), 120 + Math.cos(a) * 40, 170 + Math.sin(a) * 40, '#e8e8e8', 9, 'center', '700'); }
          g.fillStyle = '#ffd479'; g.beginPath(); g.moveTo(120, 100); g.lineTo(114, 92); g.lineTo(126, 92); g.fill();
          HL.rr(g, 104, 158, 32, 24, 3, '#0d0d0d', '#555', 1); HL.text(g, String(Math.min(9, Math.floor(turns))), 120, 171, '#ffffff', 17, 'center', '800', HL.MONO);
          if (e.down) HL.circle(g, 120, 170, 68, null, 'rgba(78,201,176,.6)', 1.5);
          HL.text(g, ctx.lang() === 'en' ? '10-TURN  (1 turn = 1 kV)' : '10회전  (1회전 = 1 kV)', 120, 254, '#dbe7f3', 10.5, 'center', '700');
          /* the key switch, the lamp, FIRE */
          var k = ui.hit('key', { cx: 270, cy: 170, r: 26 }); if (k.click) E1L.key = !E1L.key;
          HL.circle(g, 270, 170, 26, '#b9bec4', '#444', 1.5); g.save(); g.translate(270, 170); g.rotate(E1L.key ? 0.9 : 0); HL.rr(g, -5, -18, 10, 36, 3, '#5a5f66'); g.restore();
          HL.text(g, 'OFF', 238, 136, '#dbe7f3', 9, 'center', '700'); HL.text(g, 'HV ON', 304, 136, '#dbe7f3', 9, 'center', '700');
          HL.circle(g, 270, 222, 8, E1L.key ? '#ff4a2e' : '#4a2a24', '#111', 1);
          var f = HL.button(ui, 'fire', 340, 140, 116, 70, { col: '#b8433a', label: 'FIRE', size: 18 });
          if (f.click) {
            if (!E1L.key || E1L.pot < 1) b.say('KEY를 켜고 전압을 올리세요.', 'Turn the key on and raise the voltage.');
            else { var res = solve((E1L.x + E1L.zx) / 1000 + gauss(RADIAL_ERROR), (E1L.y + E1L.zy) / 1000 + gauss(RADIAL_ERROR), Math.sqrt(2 * E1L.pot * E_0 / M_E));
              if (res[0]) E1L.spots.push({ x: res[1] * 1000, y: res[2] * 1000, t: b.t }); else b.say('검출판에 아무것도 보이지 않습니다.', 'Nothing shows on the screen.'); }
          }
          HL.text(g, 'HV OUT', 400, 262, '#dbe7f3', 10, 'center', '700'); HL.circle(g, 400, 240, 10, '#c0392b', '#222', 1);
        });
        B3.tex3(hcv, 0, 0, hcv.width, hcv.height, [hx - hw / 2 + 0.3, hh - 0.3, hz + hd / 2 - 0.39], [hw - 0.6, 0, 0], [0, -(hh - 0.6), 0], { id: 'p:hv' });
        B3.cable([hx - 4, 3, hz + hd / 2 - 0.3], [CX + 26, 4, -20], '#b23a2e', 4, 2.6);

        var m = b.moved('sx'), sm = b.screenMoved('sx'); if (sm[0]) E1L.x = Math.max(-200, Math.min(200, E1L.x - sm[0] * 10));
        E1L.x = Math.max(-200, Math.min(200, E1L.x - b.wheel('sx') * 0.1));
        sm = b.screenMoved('sy'); if (sm[1]) E1L.y = Math.max(-200, Math.min(200, E1L.y - sm[1] * 10));
        E1L.y = Math.max(-200, Math.min(200, E1L.y + b.wheel('sy') * 0.1));
        var gx = CX + (E1L.x + E1L.zx) / 10, gy = CY + (E1L.y + E1L.zy) / 10, FZ = GZ - 6;

        /* the X carriage, its vernier and the vertical Y rail it carries */

        B3.box3(gx - 1.5, gx + 1.5, 9, 53, FZ, FZ + 3, '#6f7880', { id: 'm:sx' });
        B3.tex3(scY, 0, 0, scY.width, scY.height, [gx + 1.5, CY + 21, FZ - 0.02], [-1.08, 0, 0], [0, -42, 0]);

        B3.cyl3('z', FZ + 3, GZ + 2, gx, gy, 1.6, '#2b3036', { id: 'm:sy', seg: 16 });
        B3.cyl3('z', GZ + 2, GZ + 3, gx, gy, 0.6, '#c8b26a', { seg: 12 });
        B3.cable([gx - 1, gy - 1.5, FZ + 2], [CX + 35, 0.5, GZ + 15], '#b23a2e', 6, 2.2);
        B3.text3([CX + 26, 5.5, FZ - 1.05], [-1, 0, 0], [0, 1, 0], 'x (cm)', 1.6, '#e8eef3', { weight: '700' });
        B3.text3([gx - 2.0, 55, FZ - 0.05], [-1, 0, 0], [0, 1, 0], 'y (cm)', 1.6, '#e8eef3', { weight: '700' });
