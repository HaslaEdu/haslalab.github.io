<script>
/* EuPhO 2020 Experiment 1 "Hidden Charge" — browser build of the official
   console program (Exp1-WIN.exe / Exp1-Linux / Exp1-OSX).

   EuPhO published the C++ source, so this is a line-by-line port of it:
   sources.zip -> Experiment_1/ (charge.cpp, main.cpp), by Taavet Kalda and
   Paul Stanley.  The hidden charge, the adaptive integrator, the 0.5 mm beam
   placement error and the printed wording are the originals. */

var R_P = [0.05435205, -0.0259338, -0.1150416];   /* hidden charge position, m */
var Q_P = -8.62193e-11;                            /* hidden charge, C         */
var M_E = 9.10938356e-31, E_0 = 1.60217662e-19, K_E = 8.9875517923e9;
var XY_MIN = -0.2, XY_MAX = 0.2, V_MAX = 10000, STEPS = 2000000;
var RADIAL_ERROR = 0.0005, DT_CONST = 100.0;
var SEP = new Array(49).join('-');

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function acc(x, y, z) {
  var r2 = x * x + y * y + z * z;
  var c = -K_E * Q_P * E_0 / (r2 * Math.sqrt(r2)) / M_E;
  return [c * x, c * y, c * z];
}

function solve(x0, y0, v0) {
  var dx = x0 - R_P[0], dy = y0 - R_P[1], dz = -10 - R_P[2];
  var vx = 0, vy = 0, vz = v0;
  for (var i = 0; i < 2 * STEPS; i++) {
    var rx = dx + R_P[0], ry = dy + R_P[1], rz = dz + R_P[2];
    if (Math.sqrt(rx * rx + ry * ry + rz * rz) > 1000) break;
    var a = acc(dx, dy, dz);
    var dt = DT_CONST / Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]);
    var b = acc(dx + vx * dt, dy + vy * dt, dz + vz * dt);
    var ex = 0.5 * (a[0] + b[0]), ey = 0.5 * (a[1] + b[1]), ez = 0.5 * (a[2] + b[2]);
    var half = 0.5 * dt * dt;
    dx += vx * dt + ex * half; dy += vy * dt + ey * half; dz += vz * dt + ez * half;
    vx += ex * dt; vy += ey * dt; vz += ez * dt;
    if (dz + R_P[2] > 0) {
      rx = dx + R_P[0]; ry = dy + R_P[1];
      if (rx >= XY_MIN && rx <= XY_MAX && ry >= XY_MIN && ry <= XY_MAX) return [true, rx, ry];
      return [false, rx, ry];
    }
  }
  return [false, 0, 0];
}

/* the original prints numbers with C++ default formatting */
function g(x) {
  var s = String(Math.round(x * 1e6) / 1e6);
  return s;
}

var PROGRAM = {
  title: 'EuPhO 2020 Experiment 1 — Hidden Charge',
  subtitle: '주최측이 배포한 것은 콘솔 실행 파일입니다. 이 페이지는 공개된 C++ 원본 소스를 그대로 옮긴 브라우저 판입니다.',
  notes: [
    '공식 바이너리는 <code>EuPhO-2020/official/official_binaries/</code>에 Windows·Linux·macOS 빌드로 있습니다.',
    'EuPhO는 <b>C++ 전체 소스도 공개했습니다</b> (<code>official/official_sources/Experiment_1/</code>). 이 페이지는 그 소스를 한 줄씩 옮긴 것이라 숨은 전하값·적분기·난수 오차·출력 문구가 원본과 같습니다.',
    '전자 가속 전압 1–10000 V, 빔 좌표 &minus;20–20 cm. 스크린은 z = 0에 놓인 40 cm &times; 40 cm 정사각형입니다.',
    '빔을 놓는 위치에는 표준편차 0.5 mm의 가우스 오차가 있습니다.',
    '과제: 고정 점전하의 위치 (x<sub>Q</sub>, y<sub>Q</sub>, z<sub>Q</sub>)와 전하량 Q의 크기·부호를 구하고 크기 정도의 오차를 추정하세요.'
  ],
  run: async function (term) {
    for (;;) {
      var v;
      v = parseFloat((await term.ask('Beam accelerating voltage in V: ')).trim());
      while (!(v >= 0 && v <= V_MAX)) {
        v = parseFloat((await term.ask('Invalid entry.  Voltage must be between 1 and 10000: ')).trim());
      }
      var x = parseFloat((await term.ask('x-coordinate of the electron beam in cm: ')).trim()) / 100;
      while (!(x >= XY_MIN && x <= XY_MAX)) {
        x = parseFloat((await term.ask('Invalid entry.  x-coordinate must be between -20 and 20: ')).trim()) / 100;
      }
      var y = parseFloat((await term.ask('y-coordinate of the electron beam in cm: ')).trim()) / 100;
      while (!(y >= XY_MIN && y <= XY_MAX)) {
        y = parseFloat((await term.ask('Invalid entry.  y-coordinate must be between -20 and 20: ')).trim()) / 100;
      }

      term.writeln('Electron beam fired with parameters (x, y, V) = (' +
                   g(x * 100) + 'cm, ' + g(y * 100) + 'cm, ' + g(v) + 'V)');
      await term.yieldFrame();

      var res = solve(x + gauss(RADIAL_ERROR), y + gauss(RADIAL_ERROR),
                      Math.sqrt(2 * v * E_0 / M_E));
      if (res[0]) {
        term.writeln('Electron detected at (x, y) = (' + (res[1] * 100).toFixed(1) +
                     'cm, ' + (res[2] * 100).toFixed(1) + 'cm)');
      } else {
        term.writeln('Electron not detected...');
      }
      term.writeln(SEP);
    }
  }
};


/* Simulation mode: the same solve() with the same 0.5 mm beam error.  The gun fires along z through
   a closed box (the hidden charge is somewhere inside, so the path inside is not drawn) onto the
   40 cm x 40 cm fluorescent detector, seen from the side and face on. */
PROGRAM.sim = {
  intro: '전자총이 z 방향으로 전자를 쏩니다. 전자는 닫힌 상자(이 안 어딘가에 전하가 숨어 있음)를 지나 40 cm × 40 cm 형광 검출판에 닿습니다. ' +
         '왼쪽은 옆모습, 오른쪽은 검출판을 정면에서 본 모습으로, 쏜 자리(+)와 맞은 자리(●)가 번호와 함께 남습니다. 검출판 밖으로 나가면 검출되지 않습니다.',
  fields: [
    { id: 'v', label: '가속 전압 V', unit: 'V', lo: 0, hi: V_MAX, step: 1, value: 1000 },
    { id: 'x', label: '빔 x', unit: 'cm', lo: -20, hi: 20, step: 0.1, value: 5 },
    { id: 'y', label: '빔 y', unit: 'cm', lo: -20, hi: 20, step: 0.1, value: 0 }
  ],
  columns: ['#', 'V (V)', 'x (cm)', 'y (cm)', '검출 x (cm)', '검출 y (cm)'],
  aspect: 0.56,
  goLabel: '전자 쏘기',
  n: 0,
  measure: function (v) {
    var res = solve(v.x / 100 + gauss(RADIAL_ERROR), v.y / 100 + gauss(RADIAL_ERROR), Math.sqrt(2 * v.v * E_0 / M_E));
    this.n++;
    var hit = res[0], dx = (res[1] * 100).toFixed(1), dy = (res[2] * 100).toFixed(1);
    return { st: { hit: hit, dx: +dx, dy: +dy },
             rows: [[this.n, g(v.v), g(v.x), g(v.y), hit ? dx : '검출 안 됨', hit ? dy : '—']], ms: 1300 };
  },
  draw: function (gc, W, H, S) {
    var D = SIMDRAW, st = S.st, run = st && !S.done, v = run || !S.last ? S.vals : S.last, p = S.p;
    gc.fillStyle = '#0d0f13'; gc.fillRect(0, 0, W, H);
    /* side view: z to the right, y up */
    var sw = W * 0.56, mid = H / 2, ys = (H * 0.36) / 20;
    D.text(gc, '옆에서 본 모습 (y–z)', 14, 18, '#e8e8e8', 12.5, 'left', true);
    var gunX = 24, boxX0 = sw * 0.52, boxX1 = sw * 0.8, detX = sw * 0.86;
    gc.fillStyle = '#4a4f57'; gc.fillRect(gunX, mid - v.y * ys - 9, 46, 18); gc.fillStyle = '#2d3036'; gc.fillRect(gunX + 46, mid - v.y * ys - 5, 14, 10);
    D.text(gc, '전자총 ' + v.v + ' V', gunX, mid - v.y * ys - 18, '#cfd6dc', 11);
    gc.fillStyle = '#1a1c21'; gc.fillRect(boxX0, mid - 21 * ys, boxX1 - boxX0, 42 * ys);
    gc.strokeStyle = '#3a3f47'; gc.lineWidth = 1.5; gc.strokeRect(boxX0, mid - 21 * ys, boxX1 - boxX0, 42 * ys);
    D.text(gc, '가려진 상자', (boxX0 + boxX1) / 2, mid, '#5f6670', 12, 'center');
    gc.fillStyle = '#2e5b3a'; gc.fillRect(detX, mid - 20 * ys, 6, 40 * ys);
    D.text(gc, '검출판', detX + 3, mid + 20 * ys + 14, '#8fd19e', 11, 'center');
    var by = mid - v.y * ys;
    if (st) {
      var f = run ? Math.min(1, p / 0.7) : 1;
      gc.strokeStyle = 'rgba(120,200,255,.55)'; gc.lineWidth = 1.5; gc.beginPath(); gc.moveTo(gunX + 60, by); gc.lineTo(gunX + 60 + (boxX0 - gunX - 60) * f, by); gc.stroke();
      if (run && f < 1) { gc.fillStyle = '#bfe6ff'; gc.beginPath(); gc.arc(gunX + 60 + (boxX0 - gunX - 60) * f, by, 3, 0, 7); gc.fill(); }
      if (st.hit && (!run || p > 0.8)) { var hy = mid - st.dy * ys;
        gc.strokeStyle = 'rgba(120,200,255,.55)'; gc.beginPath(); gc.moveTo(boxX1, hy); gc.lineTo(detX, hy); gc.stroke();
        gc.fillStyle = '#9dffb0'; gc.beginPath(); gc.arc(detX + 3, hy, 4, 0, 7); gc.fill(); }
    } else { gc.setLineDash([4, 4]); gc.strokeStyle = 'rgba(255,255,255,.25)'; gc.beginPath(); gc.moveTo(gunX + 60, by); gc.lineTo(boxX0, by); gc.stroke(); gc.setLineDash([]); }
    D.text(gc, 'z →', sw - 20, H - 14, '#9aa3ab', 11, 'right');
    /* the detector face on */
    var dx0 = sw + 20, dside = Math.min(W - dx0 - 16, H - 50), dy0 = 30, sc = dside / 40;
    var P = function (x, y) { return [dx0 + (x + 20) * sc, dy0 + (20 - y) * sc]; };
    D.text(gc, '검출판 정면 (x–y, cm)', dx0, 16, '#e8e8e8', 12.5, 'left', true);
    gc.fillStyle = '#0f2416'; gc.fillRect(dx0, dy0, dside, dside);
    for (var q = -20; q <= 20; q += 5) { var a = P(q, -20), b = P(q, 20); gc.strokeStyle = q ? 'rgba(120,220,150,.12)' : 'rgba(120,220,150,.35)'; gc.lineWidth = 1;
      gc.beginPath(); gc.moveTo(a[0], a[1]); gc.lineTo(b[0], b[1]); gc.stroke(); a = P(-20, q); b = P(20, q); gc.beginPath(); gc.moveTo(a[0], a[1]); gc.lineTo(b[0], b[1]); gc.stroke(); }
    gc.strokeStyle = '#3d6b4a'; gc.lineWidth = 2; gc.strokeRect(dx0, dy0, dside, dside);
    S.hist.forEach(function (h, i) { var ai = P(h.vals.x, h.vals.y); gc.strokeStyle = 'rgba(255,255,255,.35)'; gc.lineWidth = 1;
      gc.beginPath(); gc.moveTo(ai[0] - 4, ai[1]); gc.lineTo(ai[0] + 4, ai[1]); gc.moveTo(ai[0], ai[1] - 4); gc.lineTo(ai[0], ai[1] + 4); gc.stroke();
      if (h.st.hit) { var hi = P(h.st.dx, h.st.dy); gc.strokeStyle = 'rgba(157,255,176,.25)'; gc.beginPath(); gc.moveTo(ai[0], ai[1]); gc.lineTo(hi[0], hi[1]); gc.stroke();
        gc.fillStyle = 'rgba(157,255,176,.7)'; gc.beginPath(); gc.arc(hi[0], hi[1], 3, 0, 7); gc.fill(); D.text(gc, String(i + 1), hi[0] + 6, hi[1] - 6, 'rgba(157,255,176,.8)', 10); } });
    var aim = P(v.x, v.y); gc.strokeStyle = '#ffd479'; gc.lineWidth = 1.5;
    gc.beginPath(); gc.moveTo(aim[0] - 6, aim[1]); gc.lineTo(aim[0] + 6, aim[1]); gc.moveTo(aim[0], aim[1] - 6); gc.lineTo(aim[0], aim[1] + 6); gc.stroke();
    if (st && (!run || p > 0.8)) {
      if (st.hit) { var h2 = P(st.dx, st.dy), gl = gc.createRadialGradient(h2[0], h2[1], 0, h2[0], h2[1], 14);
        gl.addColorStop(0, 'rgba(190,255,200,1)'); gl.addColorStop(1, 'rgba(120,255,150,0)'); gc.fillStyle = gl; gc.beginPath(); gc.arc(h2[0], h2[1], 14, 0, 7); gc.fill();
        D.text(gc, '(' + st.dx.toFixed(1) + ', ' + st.dy.toFixed(1) + ') cm', dx0 + dside, dy0 + dside + 14, '#9dffb0', 12, 'right'); }
      else D.text(gc, 'Electron not detected... (검출판 밖)', dx0 + dside, dy0 + dside + 14, '#ffb4a8', 12, 'right');
    }
  }
};
