<body>
<script>
/* NBPhO 2009 problem 6 "Spring" on the 3-D bench.  A soft helical spring of known mass m = 19 g hangs by its
   top coil; each coil stretches in proportion to the weight below it, so the spring's own weight
   stretches it by mg/(2k) and the coils open up towards the top — drawn coil by coil.  A load M adds
   Mg/k evenly; then M = (m/2)(x₂ − x₁)/x₁ (≈ 6 g in the official set).  Lying on the desk the coils
   touch, which gives the unstretched length. */
var PROGRAM = {
  title: { ko: 'NBPhO 2009 실험 6 — 용수철', en: 'NBPhO 2009 Problem 6 — Spring' },
  subtitle: { ko: '질량을 아는 용수철(m = 19 ± 0.5 g), 줄자, 질량을 모르는 추가 있습니다. 추의 질량을 구하고 불확도를 어림하세요.', en: 'You have a helical spring of known mass m = 19 ± 0.5 g, a measuring tape and a load of unknown mass. Determine the mass of the load and estimate the uncertainty.' },
  notes: { ko: [
    '용수철의 각 고리는 그 아래의 무게에 비례해 늘어나므로, 제 무게로 늘어난 길이는 mg/(2k) 이고 고리 간격은 위로 갈수록 넓어집니다(고리마다 그립니다).',
    '추 M 을 달면 모든 고리에 같은 Mg 가 더해져 Mg/k 만큼 더 늘어납니다. 그래서 M = (m/2)(x₂ − x₁)/x₁ (공식 해답, ≈ 6 g).',
    '책상에 누인 용수철은 고리가 붙어 있어 늘어나지 않은 길이를 줍니다. 추의 질량은 방문할 때마다 다릅니다.'], en: [
    'Each coil stretches in proportion to the weight below it, so the spring\'s own weight stretches it by mg/(2k), and the coils open up towards the top (drawn coil by coil).',
    'A load M adds the same Mg to every coil and stretches it a further Mg/k, so M = (m/2)(x₂ − x₁)/x₁ (official solution, ≈ 6 g).',
    'Lying on the desk the coils touch, which gives the unstretched length. The load\'s mass differs from visit to visit.'] }
};

var LAB = { hung: false, load: false, stick: 14 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드, 누여 놓은 용수철(19 g), 미지의 추, 세운 줄자.', en: 'On the desk: a stand, the spring lying down (19 g), the unknown load and a standing measuring tape.' },
  howto: { ko: ['용수철 클릭: 스탠드 고리에 걸기 / 내려서 책상에 누이기', '추 클릭: 매단 용수철 아래 끝에 걸기 / 떼기', '줄자 끌기: 옮기기 · 클릭: 옆에서 가까이 보기 (휠로 확대)'],
           en: ['Click the spring: hang it on the stand\'s hook / lay it on the desk', 'Click the load: hook it on the hanging spring\'s lower end / take it off', 'Drag the tape: move it · click: look across at it (wheel to zoom)'] },
  notePlaceholder: { ko: '예) 누인 길이 12.0 cm; 매단 길이 위 82.0 아래 61.4 cm; 추 달고 아래 55.1 cm', en: 'e.g. lying 12.0 cm; hanging top 82.0, bottom 61.4 cm; with the load bottom 55.1 cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var m = 0.019 * (1 + S.sys('m', 0.012)), M = 0.0062 * Math.exp(S.uni('M', -0.35, 0.35)), x1 = 0.20 * (1 + S.sys('x1', 0.05)), g = 9.81, k = m * g / (2 * x1);
    var N = 60, L0 = 12, R = 1.5, TOP = 82, X = -6;
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang,
      home: { yaw: -0.3, pitch: 0.3, k: 5, tx: 0, ty: 42, tz: 4 },
      views: { tape: { yaw: 0, pitch: 0.02, k: 22, tx: 6, ty: 60, tz: 0, title: { ko: '줄자 (옆에서)', en: 'The tape (from the side)' } } },
      frame: function (b) {
        if (b.clicked('m:spring')) { LAB.hung = !LAB.hung; if (!LAB.hung) LAB.load = false; }
        if (b.clicked('m:load')) { if (LAB.hung) LAB.load = !LAB.load; else b.say('먼저 용수철을 거세요.', 'Hang the spring first.'); }
        var ms = b.moved('tape'); if (ms[0]) LAB.stick = Math.max(-20, Math.min(40, LAB.stick + ms[0]));
        B3.desk(-35, 45, -20, 20);
        B3.stand(-6, -6, 92, { bw: 8, bd: 7 });
        B3.clampArm(-6, -6.6, TOP + 2, 6.6, { dir: "z" });
        if (LAB.hung) {
          /* coil i (from the bottom, 0..N−1) carries the weight of the coils below it and the load */
          var y = TOP, pts = [], pitch0 = L0 / N;
          for (var i = N - 1; i >= 0; i--) {
            var below = (i + 0.5) / N * m + (LAB.load ? M : 0), dy = pitch0 + below * g / (k * N) * 100;
            for (var j = 0; j < 12; j++) { var th = (j / 12) * 2 * Math.PI; pts.push([X + Math.cos(th) * R, y - dy * j / 12, Math.sin(th) * R]); }
            y -= dy;
          }
          B3.poly3([[X, TOP + 1.5, 0], [X + R, TOP, 0]].concat(pts), '#8f979e', 1.6, { id: 'm:spring' });
          B3.box3(X - R, X + R, y - 0.1, TOP + 0.1, -R, R, 'rgba(0,0,0,0)', { id: 'm:spring', noObst: true });
          if (LAB.load) { B3.line3([X, y, 0], [X, y - 1.5, 0], '#555', 1.5); B3.cyl3('y', y - 4.5, y - 1.5, X, 0, 1.2, '#b58b3c', { id: 'm:load', seg: 16, cap: '#c99a48' }); }
          else B3.cyl3("y", 0, 3, 8, 10, 1.2, '#b58b3c', { id: 'm:load', seg: 16, cap: '#c99a48' });
        } else {
          var cz = 12, cx0 = -24;
          var pl = []; for (i = 0; i <= N * 12; i++) { th = i / 12 * 2 * Math.PI; pl.push([cx0 + L0 * i / (N * 12), R + Math.sin(th) * R, cz + Math.cos(th) * R]); }
          B3.poly3(pl, '#8f979e', 1.6, { id: 'm:spring' });
          B3.box3(cx0, cx0 + L0, 0, 2 * R, cz - R, cz + R, 'rgba(0,0,0,0)', { id: 'm:spring', noObst: true });
          B3.cyl3("y", 0, 3, 8, 10, 1.2, "#b58b3c", { id: "m:load", seg: 16, cap: "#c99a48" });
          var flat = B3.scaleTex(30, { horiz: true, width: 2.4, bg: '#f2d33c' }); B3.tex3(flat, 0, 0, flat.width, flat.height, [cx0 - 1, 0.02, cz + R + 0.2], [32, 0, 0], [0, 0, 2.4]);
        }
        B3.meterStick(LAB.stick, 0, 100, 'm:tape');
        b.views.tape.tx = (LAB.stick + X) / 2;
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
