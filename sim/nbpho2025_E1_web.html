<title>NBPhO 2025 실험 — 블랙박스 · Black Box · HaslaLab</title>
<meta name="description" content="NBPhO 2025 실험 문제 4 블랙박스를 브라우저에서 실행합니다. 다이오드 3개와 저항 1개가 든 상자의 V–I 곡선을 전압계·전류계로 재어 내부 회로를 밝히고, 저항값과 각 다이오드의 열림 전압(1 mA)을 구합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="NBPhO 2025 실험 — 블랙박스 · Black Box">
<meta property="og:description" content="NBPhO 2025 실험: 다이오드 3개와 저항이 든 블랙박스의 V–I 곡선으로 회로, 저항, 열림 전압 구하기.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}

function nets(){ const par={}; const f=a=>{ while(par[a]!==a) a=par[a]=par[par[a]]; return a; }; for(const t of TERMS) par[t]=t;

/* a dense solver, with partial pivoting */

  if(ST.pick){ const p=TPOS[ST.pick]; ctx.setLineDash([4,4]); ctx.strokeStyle="#888"; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(cmouse[0],cmouse[1]); ctx.stroke(); ctx.setLineDash([]); }
  text(t.lab.wireHint,10,H-10,"#555",11,"left"); }
const termHere=tm=>tm==="Y"||tm==="B"?has("box"):tm==="PY"||tm==="PN"?has("psu"):meterOn(+tm[1]-1);
/* a meter's face: display, rotary switch with its ranges (click a range), the jacks */
function drawMeterFace(mx,my,ms,i){ const r=ST.rng[i];
  fillR(mx-4.75*ms,my-8.75*ms,9.5*ms,17.5*ms,ms*0.9,MCOL[i],"#5a3a12",1.5); fillR(mx-4.2*ms,my-8.2*ms,8.4*ms,16.4*ms,ms*0.6,"#2a2d33");
  text("DMM "+(i+1),mx,my-7.5*ms,"#e8eef2",Math.max(9,ms*0.55),"center","700");
  fillR(mx-3.6*ms,my-6.8*ms,7.2*ms,3.6*ms,ms*0.3,"#9fae8f","#5f6b52"); const s=dmmShow(i);
  if(s!==null){ lcd2(s,mx-3.3*ms,my-5.9*ms,6.5*ms,1.7*ms,"#1b1d20"); text(r[0]==="v"?"DC V":r[0]==="m"?"DC mA":r==="dio"?"→|":"kΩ",mx-3.3*ms,my-6.35*ms,"#1b1d20",Math.max(8,ms*0.45),"left","700"); }
  const cx0=mx, cy0=my+1.0*ms, R=1.9*ms; circ(cx0,cy0,R,"#1b1d20","#000",1); circ(cx0,cy0,R*0.75,"#33363a");
  const a=DIAL[r]; ctx.strokeStyle="#e8eef2"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx0,cy0); ctx.lineTo(cx0+R*0.95*Math.cos(a),cy0-R*0.95*Math.sin(a)); ctx.stroke(); ctx.lineWidth=1;
  for(const k in DIAL){ const q=DIAL[k], x=cx0+R*1.55*Math.cos(q), y=cy0-R*1.55*Math.sin(q); text(DLBL[k],x,y,r===k?"#ffcf3a":"#e8eef2",Math.max(8,ms*0.48),"center","700"); hitAdd("rng"+i+":"+k,x-ms*0.85,y-ms*0.5,ms*1.7,ms*1.0); }
  text("V⎓",cx0+R*1.8,cy0-R*1.3,"#8fd3ff",Math.max(8,ms*0.48),"center","700"); text("mA⎓",cx0-R*1.8,cy0-R*1.3,"#8fd3ff",Math.max(8,ms*0.48),"center","700"); text("Ω",cx0-R*1.2,cy0+R*1.55,"#8fd3ff",Math.max(8,ms*0.48),"center","700");
  circ(mx+JACK.A10*ms,my+JACKY*ms,7,"#c0392b","#111",1); circ(mx+JACK.A10*ms,my+JACKY*ms,2.5,"#555");
  text("10A",mx+JACK.A10*ms,my+(JACKY-1.15)*ms,"#e8eef2",Math.max(8,ms*0.42),"center"); text("VΩmA",mx+JACK.V*ms,my+(JACKY-1.15)*ms,"#e8eef2",Math.max(8,ms*0.42),"center"); text("COM",mx+JACK.C*ms,my+(JACKY-1.15)*ms,"#e8eef2",Math.max(8,ms*0.42),"center"); }
/* ── the graph paper: every reading written with one meter on V and the other on mA ── */
const PTS=[];
const nice=v=>{ const e=Math.pow(10,Math.floor(Math.log10(v))), m=v/e; return (m<=1?1:m<=2?2:m<=5?5:10)*e; };
function drawPaper(){ const t=d(), W=CLW, H=CLH; ctx.fillStyle="#fbfaf4"; ctx.fillRect(0,0,W,H);
  const L=W*0.08, Rr=W*0.97, T=H*0.05, Bt=H*0.88;
  let x0=0,x1=1,y0=0,y1=1; for(const p of PTS){ x0=Math.min(x0,p.V); x1=Math.max(x1,p.V); y0=Math.min(y0,p.I); y1=Math.max(y1,p.I); }
  const xs=nice((x1-x0)/10), ys=nice((y1-y0)/8); x0=Math.floor(x0/xs)*xs; x1=Math.ceil(x1/xs)*xs; y0=Math.floor(y0/ys)*ys; y1=Math.ceil(y1/ys)*ys;
  const X=v=>L+(v-x0)/(x1-x0)*(Rr-L), Y=v=>Bt-(v-y0)/(y1-y0)*(Bt-T);
  for(let k=0;k<=Math.round((x1-x0)/xs)*10;k++){ const v=x0+k*xs/10, X0=X(v); ctx.strokeStyle=k%10===0?"rgba(214,120,60,.75)":k%5===0?"rgba(214,120,60,.42)":"rgba(214,120,60,.18)"; ctx.lineWidth=k%10===0?1:0.6; ctx.beginPath(); ctx.moveTo(X0,T); ctx.lineTo(X0,Bt); ctx.stroke(); }
  for(let k=0;k<=Math.round((y1-y0)/ys)*10;k++){ const v=y0+k*ys/10, Y0=Y(v); ctx.strokeStyle=k%10===0?"rgba(214,120,60,.75)":k%5===0?"rgba(214,120,60,.42)":"rgba(214,120,60,.18)"; ctx.lineWidth=k%10===0?1:0.6; ctx.beginPath(); ctx.moveTo(L,Y0); ctx.lineTo(Rr,Y0); ctx.stroke(); }
  ctx.strokeStyle="#222"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(X(0),T); ctx.lineTo(X(0),Bt); ctx.moveTo(L,Y(0)); ctx.lineTo(Rr,Y(0)); ctx.stroke(); ctx.lineWidth=1;
  const fx=v=>+v.toFixed(6)+"";
  for(let v=x0;v<=x1+1e-9;v+=xs) text(fx(v),X(v),Bt+13,"#333",10.5,"center");
  for(let v=y0;v<=y1+1e-9;v+=ys) text(fx(v),L-5,Y(v)+3,"#333",10.5,"right");
  text(t.lab.ax,Rr,Bt+28,"#222",12,"right","700"); text(t.lab.ay,L+4,T+12,"#222",12,"left","700");
  const tags=[...new Set(PTS.map(p=>p.tag))], PCOL=["#1a4fb4","#c0392b","#2f8f4e","#8e44ad","#d35400","#16a085"];
  tags.forEach((g,k)=>{ if(tags.length<2&&!g) return; const yy=T+16+k*16; ctx.strokeStyle=PCOL[k%6]; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(Rr-150,yy-4); ctx.lineTo(Rr-142,yy+4); ctx.moveTo(Rr-150,yy+4); ctx.lineTo(Rr-142,yy-4); ctx.stroke(); ctx.lineWidth=1; text(g||"—",Rr-136,yy+4,"#222",11.5,"left"); });
  for(const p of PTS){ const x=X(p.V), y=Y(p.I); ctx.strokeStyle=PCOL[tags.indexOf(p.tag)%6]; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(x-4,y-4); ctx.lineTo(x+4,y+4); ctx.moveTo(x-4,y+4); ctx.lineTo(x+4,y-4); ctx.stroke(); ctx.lineWidth=1; }
  if(!PTS.length) text(t.lab.noPts,W/2,H/2,"#888",13,"center"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="wire") drawWire(); else drawPaper(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   5.  HANDS: the bench and the wiring close-up
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ const id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),1))||null; }
const termsOf=k=>k==="box"?["Y","B"]:k==="psu"?["PY","PN"]:k==="dmm1"?["V1","C1"]:k==="dmm2"?["V2","C2"]:[];
const wired=k=>ST.leads.some(([a,b])=>termsOf(k).includes(a)||termsOf(k).includes(b));
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
function takeUp(k){ if(wired(k)){ say("unplugFirst"); return false; } if(k==="leads"&&ST.leads.length){ say("unplugAll"); return false; }
  const b=baseOf(k); hand={item:k,move:true,orig:{x:b.x,y:b.y}}; ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
function drop(k,x,y){ ST.pos[k]={x,y}; ST.on.add(k); say("placed",itemName(k)); }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(wired(k)||(k==="leads"&&ST.leads.length)){ say("unplugFirst"); return; } if(k==="psu") ST.out=false; if(k==="dmm1") ST.rng[0]="off"; if(k==="dmm2") ST.rng[1]="off";
    ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the wiring close-up: click a terminal, then another, to join them with a lead; click a lead's handle to unplug it */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); });
closeCv.addEventListener("wheel",e=>{ const h=hitAt(clpos(e)); if(!h||!/^(knob|fine)/.test(h.k)) return; e.preventDefault(); nudge((e.deltaY<0?1:-1)*(h.k.startsWith("fine")?0.01:0.1)); },{passive:false});
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button===2){ ST.pick=null; return; } if(e.button!==0) return;
  if(!h){ ST.pick=null; return; }
  if(h.k==="out"){ toggleOut(); return; }
  if(h.k==="knob+"||h.k==="knob-"){ nudge(h.k==="knob+"?0.1:-0.1); return; }
  if(h.k==="fine+"||h.k==="fine-"){ nudge(h.k==="fine+"?0.01:-0.01); return; }
  if(h.k.startsWith("rng")){ setRange(+h.k[3],h.k.slice(5)); return; }
  if(h.k.startsWith("l:")){ const i=+h.k.slice(2); ST.leads.splice(i,1); say("unplugged"); return; }
  if(h.k.startsWith("t:")){ const t=h.k.slice(2);
    if(!has("leads")){ say("needFor",itemName("leads")); ST.pick=null; return; }
    if(!ST.pick){ ST.pick=t; return; } if(ST.pick===t){ ST.pick=null; return; }
    if(ST.leads.length>=8){ say("noLeads"); ST.pick=null; return; } if(ST.leads.some(([a,b])=>(a===ST.pick&&b===t)||(a===t&&b===ST.pick))){ ST.pick=null; return; }
    ST.leads.push([ST.pick,t]); say("joined",tname(ST.pick),tname(t)); ST.pick=null; } });
const tname=tm=>d().tn[tm]||tm;

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function toggleOut(){ if(!has("psu")){ say("needFor",itemName("psu")); return; } ST.out=!ST.out; say(ST.out?"outOn":"outOff"); }
function nudge(dv){ if(!has("psu")){ say("needFor",itemName("psu")); return; } ST.vset=Math.max(0,Math.min(TRUE.Vmax,Math.round((ST.vset+dv)*100)/100)); }
function setRange(i,k){ if(!meterOn(i)){ say("needFor",itemName("dmm"+(i+1))); return; } ST.rng[i]=k; ST.dispT[i]=0; say("range",i+1); }
$("outBtn").onclick=toggleOut;
for(const [id,dv] of [["vm1",-1],["vm01",-0.1],["vm001",-0.01],["vp001",0.01],["vp01",0.1],["vp1",1]]) $(id).onclick=()=>nudge(dv);
for(let i=0;i<2;i++) for(const k of RKEYS) $("rg"+i+"_"+k).onclick=()=>setRange(i,k);
/* each display settles a few times a second, with a count of jitter */
function updDisp(dt){ for(let i=0;i<2;i++){ ST.dispT[i]-=dt; if(ST.dispT[i]>0) continue; ST.dispT[i]=0.35+0.1*i; const r=meterRaw(i); if(r===null) continue;
  const rg=ST.rng[i], R=RANGES[rg], lsd=rg[0]==="o"?(R===2000?1:10):(R===2?0.001:R===20?0.01:0.1); ST.disp[i]=isFinite(r)?r+(Math.random()-0.5)*1.4*lsd:r; } }
const showTxt=i=>{ const s=dmmShow(i); if(s===null) return "—"; return (s.endsWith("   ")?(s[0]==="-"?"-OL":"OL"):s)+" "+unitOf(ST.rng[i]); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), c=$("cfg").value.trim(), line=rows+")  "+(c?c+"   ":"")+"DMM1 = "+showTxt(0)+"   DMM2 = "+showTxt(1)+(has("psu")?"   ("+d().lab.psuSet+" "+ST.vset.toFixed(2)+" V)":"");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight;
  /* a point for the graph paper when one meter reads volts and the other milliamps */
  const iv=[0,1].find(i=>ST.rng[i][0]==="v"), im=[0,1].find(i=>ST.rng[i][0]==="m");
  if(iv!==undefined&&im!==undefined){ const sv=dmmShow(iv), si=dmmShow(im); if(sv&&si&&!sv.endsWith("   ")&&!si.endsWith("   ")){ PTS.push({V:+sv,I:+si,tag:c}); say("plotted"); return; } }
  say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; PTS.length=0; };
function saveText(name,txt){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved"); }
$("noteSave").onclick=()=>{ saveText("NBPhO2025_P4_notebook.txt",$("note").value); };
function renderPanel(){ const t=d();
  $("psuD").textContent=has("psu")?ST.vset.toFixed(2)+" V   "+(ST.out?(ST.ia||0).toFixed(3):"0.000")+" A":"—";
  $("outBtn").textContent=ST.out?t.outOff:t.outOn; $("outBtn").className=ST.out?"on":"";
  for(let i=0;i<2;i++){ $("m"+i+"D").textContent=meterOn(i)?showTxt(i):"—"; for(const k of RKEYS) $("rg"+i+"_"+k).className=ST.rng[i]===k?"on":""; } }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(tname(ST.pick)),false]);
  for(let i=0;i<2;i++){ const s=meterOn(i)?dmmShow(i):null; if(s&&s.endsWith("   ")&&ST.rng[i][0]!=="o"&&ST.rng[i]!=="dio") L.push([t.st.over(i+1),true]); }
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-psu","hPsu"],["psuHint","psuHint"],["t-h-m0","hM1"],["t-h-m1","hM2"],["mHint","mHint"],
    ["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"]]) $(id).textContent=t[k];
  for(let i=0;i<2;i++) for(const k of RKEYS) $("rg"+i+"_"+k).textContent=t.rl[k];
  $("cfg").placeholder=t.cfgPh;
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt); updDisp(dt); ST.ia=supplyI();
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose(); ++frameN;
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
