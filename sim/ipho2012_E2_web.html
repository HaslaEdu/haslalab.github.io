<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IPhO 2012 E2 — 비선형 블랙박스 · Nonlinear Black Box · HaslaLab</title>
<meta name="description" content="IPhO 2012 실험 2를 브라우저에서 실행합니다. 6 mA 정전류원, 이중층 축전기와 비선형 소자가 든 블랙박스, 전압·전류와 그 시간 미분을 함께 기록하는 IPhO-measure 멀티미터를 테스트 리드 4개로 연결해 소자의 I(V) 특성과 미분 전기용량 C(V)를 구합니다. 계산은 대신 해주지 않습니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IPhO 2012 E2 — 비선형 블랙박스 · Nonlinear Black Box">
<meta property="og:description" content="IPhO 2012 실험 2를 브라우저에서 실행합니다. 정전류원으로 블랙박스의 축전기를 충전·방전하며 IPhO-measure로 U, dU/dt, I를 기록합니다.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   1.  BEHIND THE SEALS  (SI units)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{ const u=Math.max(1e-12,Math.random()), v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
/* tunnel-diode-like element: a tunnelling branch and a thermal branch, I(0) = 0,
   a peak near Vp, a valley near 0.3 V, negative differential resistance between them */
function Element(ip,vp,vt,vmax,i0,cp){
  const tun=ip*(vmax/vp)*Math.exp(1-vmax/vp), Is=Math.max(1e-12,(i0-tun)/(Math.exp(vmax/vt)-1));
  const E={Ip:ip,Vp:vp,Vt:vt,Cp:cp,Is,
    cur(v){ if(v<0) return -E.cur(-v); return ip*(v/vp)*Math.exp(1-v/vp)+Is*(Math.exp(Math.min(v/vt,60))-1); },
    dcur(v){ if(v<0) return E.dcur(-v); const k=v/vp; return ip/vp*(1-k)*Math.exp(1-k)+Is/vt*Math.exp(Math.min(v/vt,60)); },
    valley(){ let lo=vp, hi=vp+1; for(let i=0;i<80;i++){ const m=0.5*(lo+hi); if(E.dcur(m)<0) lo=m; else hi=m; } return lo; } };
  return E;
}
/* electric double layer capacitor:  C(V) = C0 (1 + a V),  Q(V) = C0 (V + a V²/2) */
function DLCap(c0,a){ return { cap:v=>c0*(1+a*v), charge:v=>c0*(v+0.5*a*v*v) }; }
/* the element in series with the 10 µH inductor: inside the NDR region the loop L–Cp–I(v) sits on a
   limit cycle at ~30 MHz; over the slow time scale only the cycle-averaged current matters */
function LCBranch(e,L){
  let tab=null, v1=0, v2=0;
  function limitCycle(V,nsub,nper){
    const Cp=e.Cp, dt=2*Math.PI*Math.sqrt(L*Cp)/nsub; let v=V*1.001+1e-4, I=e.cur(V);
    const f=(vv,ii)=>[(ii-e.cur(vv))/Cp,(V-vv)/L];
    const step=()=>{ const [a1,b1]=f(v,I), [a2,b2]=f(v+0.5*dt*a1,I+0.5*dt*b1), [a3,b3]=f(v+0.5*dt*a2,I+0.5*dt*b2), [a4,b4]=f(v+dt*a3,I+dt*b3);
      v+=dt/6*(a1+2*a2+2*a3+a4); I+=dt/6*(b1+2*b2+2*b3+b4); };
    for(let k=0;k<nsub*300;k++) step();
    let prev=v-V; for(let k=0;k<nsub*60;k++){ step(); if(prev<0&&v-V>=0) break; prev=v-V; }
    let acc=0, ta=0, laps=0; prev=v-V;
    for(let k=0;k<nsub*60;k++){ const io=I; step(); acc+=0.5*(io+I)*dt; ta+=dt; if(prev<0&&v-V>=0){ if(++laps>=nper) break; } prev=v-V; }
    return acc/Math.max(ta,1e-18);
  }
  function table(){ if(!tab){ v1=e.Vp; v2=e.valley(); tab=[]; for(let i=0;i<25;i++) tab.push(limitCycle(v1+(v2-v1)*i/24,150,6)); } return tab; }
  const B={ cur(V){ if(V<=0) return e.cur(V); const tb=table(); if(V<=v1||V>=v2) return e.cur(V); const f=(V-v1)/(v2-v1)*24, i=Math.min(23,Math.floor(f)), g=f-i; return tb[i]*(1-g)+tb[i+1]*g; },
    dcur(V){ const h=1e-4; return (B.cur(V+h)-B.cur(V-h))/(2*h); } };
  return B;
}

/* ══════════════════════════════════════════════════════════════
   2.  HIDDEN TRUTH OF THIS SESSION  (never shown)
   ══════════════════════════════════════════════════════════════ */
const TRUE=(()=>{ const I0=6.0e-3*U(0.985,1.015), Vmax=U(0.500,0.580);

  return { I0, Vcompl:0.6125, ripple:U(0.2e-5,0.6e-5), Vmax, elem, cap:DLCap(U(1.78,1.96),U(0.14,0.26)), branch:LCBranch(elem,10e-6),
    Ramp:1.0, Rvolt:1.0e6, RvoltHi:57.0e3, vNoise:U(0.04e-3,0.09e-3), iNoise:U(0.9e-6,2.2e-6), dNoise:U(0.006,0.013) }; })();

/* ══════════════════════════════════════════════════════════════
   3.  THE CIRCUIT  (nodes from the test leads; MNA + Newton, charge-conserving capacitor)
   ══════════════════════════════════════════════════════════════ */
const TERMS=["mm_in","mm_out","mm_gnd","cs+","cs-","bb+","bb-"];
const TERM_BOX={mm_in:"mm",mm_out:"mm",mm_gnd:"mm","cs+":"cs","cs-":"cs","bb+":"bb","bb-":"bb"};
const ITEMS=["mm","cs","bb","leads"];
const ST={ on:new Set(), pos:{}, leads:[], csOn:false, bbL:false, vbb:0, tSim:0, speed:1, sel:null, notes:"" };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
const termLive=t=>has(TERM_BOX[t]);
function nodes(){
  const par={}; for(const t of TERMS) par[t]=t; const find=a=>{ while(par[a]!==a){ par[a]=par[par[a]]; a=par[a]; } return a; };
  for(const [a,b] of ST.leads){ const ra=find(a), rb=find(b); if(ra!==rb) par[ra]=rb; }
  const idx={}, mp={}; for(const t of TERMS){ const r=find(t); if(!(r in idx)) idx[r]=Object.keys(idx).length; mp[t]=idx[r]; }
  return [mp,Object.keys(idx).length];
}
let NODES=nodes();
function solve(dt,vPrev){
  const [mp,n]=NODES, ref=mp["bb-"], t=TRUE, mmOn=MM.on&&has("mm"), csOn=ST.csOn&&has("cs"), bbOn=has("bb");
  let v=new Array(n).fill(0); v[mp["bb+"]]=vPrev; const qPrev=t.cap.charge(vPrev);
  for(let it=0;it<60;it++){
    const A=[...Array(n)].map(()=>new Array(n).fill(0)), b=new Array(n).fill(0);
    for(let i=0;i<n;i++) A[i][i]+=1e-9;
    const res=(i,j,g)=>{ A[i][i]+=g; A[j][j]+=g; A[i][j]-=g; A[j][i]-=g; }, inj=(i,j,c)=>{ b[i]+=c; b[j]-=c; };
    /* the multimeter: ammeter IN–OUT (1 Ω), voltmeter OUT–GND (1 MΩ, 57 kΩ above 2 V) */
    if(mmOn){ res(mp.mm_in,mp.mm_out,1/t.Ramp); res(mp.mm_out,mp.mm_gnd,1/(Math.abs(v[mp.mm_out]-v[mp.mm_gnd])<2?t.Rvolt:t.RvoltHi)); }
    else if(has("mm")){ res(mp.mm_in,mp.mm_out,1/t.Ramp); }                        /* the shunt is there with the meter off too */
    /* the current source, with its compliance */
    const vp=mp["cs+"], vm=mp["cs-"];
    if(csOn){ const vcs=v[vp]-v[vm]; inj(vp,vm,t.I0*(1-t.ripple*vcs/1e-3));
      const over=vcs>t.Vcompl?vcs-t.Vcompl:vcs<-t.Vcompl?vcs+t.Vcompl:0; if(over){ const g=50, sg=over>0?1:-1; res(vp,vm,g); inj(vp,vm,sg*g*t.Vcompl); } }
    /* the black box: capacitor (companion model) and the element or the L branch */
    if(bbOn){ const bp=mp["bb+"], bm=mp["bb-"], vbb=v[bp]-v[bm], cc=t.cap.cap(vbb)/dt, ic=(t.cap.charge(vbb)-qPrev)/dt;
      res(bp,bm,cc); inj(bp,bm,-(ic-cc*vbb));

function termClick(t,right){
  if(right){ if(ST.sel){ ST.sel=null; return; } for(let i=ST.leads.length-1;i>=0;i--){ const [a,b]=ST.leads[i]; if(a===t||b===t){ ST.leads.splice(i,1); relink(); say("leadOff",tName(t)); return; } } return; }
  if(!has("leads")){ say("needLeads"); return; }
  if(!ST.sel){ if(ST.leads.length>=4){ say("leadMax"); return; } ST.sel=t; return; }
  if(ST.sel===t){ ST.sel=null; say("same"); return; }
  if(ST.leads.some(([a,b])=>(a===ST.sel&&b===t)||(a===t&&b===ST.sel))){ ST.sel=null; say("dup"); return; }
  ST.leads.push([ST.sel,t]); say("lead",tName(ST.sel),tName(t)); ST.sel=null; relink();
}
function toggleSwitch(b){ if(b==="cs"){ ST.csOn=!ST.csOn; say("cs",ST.csOn); } else { ST.bbL=!ST.bbL; say("bb",ST.bbL); } renderPanel(); }

}
function itemAt(p){ for(const k of ["mm","cs","bb","leads"]) if(has(k)&&inB(p,bbox(k),2)) return k; return null; }
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move){ ST.on.add(hand.item); ST.pos[hand.item]=hand.orig; say("placed",itemName(hand.item)); } else say("back",itemName(hand.item)); hand=null; return; }
    const [x,y]=unP(p[0],p[1],0); if(!fits(hand.item,x,y)){ say("noFit"); return; } ST.pos[hand.item]={x,y}; ST.on.add(hand.item); say("placed",itemName(hand.item)); hand=null; return; }
  const t=termAt(p); if(t){ termClick(t,right); return; }
  if(ST.sel&&right){ ST.sel=null; return; }
  const sw=switchAt(p); if(sw&&!right){ toggleSwitch(sw); return; }
  const k=itemAt(p); if(!k) return;
  if(right){ returnItem(k); return; }
  hand={item:k,move:true,orig:{...ST.pos[k]}}; ST.on.delete(k); say("picked",itemName(k));
}

  if(h.k.startsWith("K:")){ const k=h.k.slice(2);
    if(k==="power"){ mmPower(); return; }
    if(!MM.on){ say("mmOff"); return; }

    mmHold={k,t:performance.now(),done:true}; if(k==="start") mmStart(); else if(k==="stop") mmStop(); else if(k==="sample") mmSample(); } });

const SPEEDS=[1,10,30,100];
function renderSpeeds(){ const box=$("speedRow"); box.innerHTML=""; for(const v of SPEEDS){ const b=document.createElement("button"); b.textContent="×"+v; b.className=ST.speed===v?"on":""; b.onclick=()=>{ ST.speed=v; say("speed",v); renderSpeeds(); }; box.appendChild(b); } }
$("csBtn").onclick=()=>{ if(!has("cs")) return; toggleSwitch("cs"); };
$("bbBtn").onclick=()=>{ if(!has("bb")) return; toggleSwitch("bb"); };
$("leadClr").onclick=()=>{ ST.leads=[]; ST.sel=null; relink(); renderPanel(); };
const noteAdd=s=>{ const n=$("note"); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s+"\n"; n.scrollTop=n.scrollHeight; };
$("noteBtn").onclick=()=>{ const L=mmLines(); if(!MM.on||!L){ say("mmOff"); return; } noteAdd(L.join("\n")); say("noted"); };
$("setBtn").onclick=()=>{ if(!MM.on){ say("mmOff"); return; } if(!MM.mem.length) return; const cur=MM.browse!==null?MM.mem[MM.browse].s:MM.mem[MM.mem.length-1].s;
  const rows=MM.mem.filter(s=>s.s===cur).map(s=>[String(s.n).padStart(3),s.t.toFixed(1).padStart(8),(s.V*1e3).toFixed(1).padStart(7),s.dV===null?"   nan":s.dV.toFixed(2).padStart(6),(s.I*1e3).toFixed(1).padStart(6),s.dI===null?"   nan":s.dI.toFixed(2).padStart(6)].join(" "));
  noteAdd("set "+cur+"\n  n    t[s]  U[mV] dU/dt  I[mA] dI/dt\n"+rows.join("\n")); say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d();
  $("csBtn").textContent=ST.csOn?t.csOn:t.csOff; $("bbBtn").textContent=ST.bbL?t.bbOn:t.bbOff; $("csBtn").disabled=!has("cs"); $("bbBtn").disabled=!has("bb");
  const box=$("leadList"); box.innerHTML=ST.leads.length?ST.leads.map(([a,b],i)=>"<div><span style='color:"+(i%2?"#cfd6dc":"#e06a6a")+"'>●</span> "+tName(a)+" ↔ "+tName(b)+"</div>").join(""):t.noLead; }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.sel) L.push([t.st.sel(tName(ST.sel)),false]);
  if(ST.csOn&&has("cs")&&Math.abs(ST.vcs||0)>=TRUE.Vcompl-0.002) L.push([t.st.compl,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-time").textContent=t.hTime; $("timeHint").textContent=t.timeHint; $("t-h-sw").textContent=t.hSw; $("t-h-leads").textContent=t.hLeads; $("leadClr").textContent=t.leadClr;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("setBtn").textContent=t.setNote; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2012 E2 — 비선형 블랙박스 · HaslaLab":"IPhO 2012 E2 — Nonlinear Black Box · HaslaLab";
  renderTabs(); renderSpeeds(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, tPrev=performance.now(), simAcc=0;
function tick(){
  const now=performance.now(), dt=Math.min(0.1,(now-tPrev)/1000); tPrev=now;
  simAcc+=dt; if(simAcc>=0.05){ advance(simAcc); simAcc=0; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
  <script src="simfull.js"></script>
