const Cx=(a,b)=>[a,b||0], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]], csub=(a,b)=>[a[0]-b[0],a[1]-b[1]],

  let D=Math.atan2(-q[1],-q[0])*180/Math.PI; return [Math.atan(Math.hypot(q[0],q[1]))*180/Math.PI, D]; }
/* dispersion: Si after Green (2008), SiO2 after Malitson (Sellmeier) */
const SI=[[400,5.570,0.387],[425,5.000,0.230],[450,4.674,0.135],[475,4.460,0.093],[500,4.298,0.073],[525,4.180,0.056],[550,4.077,0.041],[575,4.000,0.031],[600,3.939,0.025],[650,3.844,0.016],[700,3.776,0.0108],[750,3.728,0.0076],[800,3.688,0.0055]];
function epsSi(l){ let i=0; while(i<SI.length-2&&SI[i+1][0]<l) i++; const [l0,n0,k0]=SI[i],[l1,n1,k1]=SI[i+1], f=(l-l0)/(l1-l0), n=n0+f*(n1-n0), k=k0+f*(k1-k0); return [n*n-k*k,-2*n*k]; }
function epsOx(l){ const x=(l/1000)**2; return [1+0.6961663*x/(x-0.0684043**2)+0.4079426*x/(x-0.1162414**2)+0.8974794*x/(x-9.896161**2),0]; }
const LAM=[]; for(let l=400;l<=800;l+=4) LAM.push(l);
const EA=Cx(1), ESI0=Cx(17.2,-0.43), EOX0=Cx(2.13);
const spec=(th,d,disp)=>{ const P=[],D=[]; for(const l of LAM){ const [p,q]=disp?psiDelta(l,th,d,EA,epsOx(l),epsSi(l)):psiDelta(l,th,d,EA,EOX0,ESI0); P.push(p); D.push(q); } return [P,D]; };
const wrap=x=>((x+180)%360+360)%360-180;
const SIG_P=0.15, SIG_D=0.80;     /* the ellipsometer's noise, degrees */

/* ══════════════════════════════════════════════════════════════
   THE HIDDEN TRUTH OF THIS SESSION
   ══════════════════════════════════════════════════════════════ */
const kB=8.617e-5;
const TRUE={ b1:{phi:U(66,75),d:U(52,85)}, b2:{phi:U(52,62),d:U(205,245)},
  B0:U(150,172), Ea:U(1.30,1.45), BA0:U(0.95,1.12), Eb:U(1.90,2.10), K0:U(3,4), Lm:U(5,6), dn:U(1.0,1.8) };
const Bof=Tc=>TRUE.B0*Math.exp(-TRUE.Ea/kB*(1/(Tc+273.15)-1/1273.15)), BAof=Tc=>TRUE.BA0*Math.exp(-TRUE.Eb/kB*(1/(Tc+273.15)-1/1273.15));
/* growth: Deal–Grove plus a fast initial term that dies away within a few nm (why the model is used from 25 nm) */
function grow(Tc,dt,d){ const B=Bof(Tc), A=B/BAof(Tc), K=TRUE.K0*BAof(Tc)/TRUE.BA0; const f=x=>B/(2*x+A)+K*Math.exp(-x/TRUE.Lm);
  const k1=f(d), k2=f(d+dt/2*k1), k3=f(d+dt/2*k2), k4=f(d+dt*k3); return d+dt/6*(k1+2*k2+2*k3+k4); }
function noisy([P,D]){ return [P.map(v=>v+gauss(0,SIG_P)), D.map(v=>wrap(v+gauss(0,SIG_D)))]; }
const DATA={B1:noisy(spec(TRUE.b1.phi,TRUE.b1.d,true)), B2:noisy(spec(TRUE.b2.phi,TRUE.b2.d,true))};
function errOf(data,[P,D]){ let s=0; for(let i=0;i<LAM.length;i++){ s+=(data[0][i]-P[i])**2+wrap(data[1][i]-D[i])**2; } return Math.sqrt(s/(2*LAM.length)); }

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const S={task:"A", samp:"B1", A:null, B12:null, exps:{}, cur:null, gen:null, b7:null, b8:null, csv:null};
$("ainA").value="Name\tθ1\td\nex1\t50\t40\nex2\t30\t100";
$("ainB").value="Name\tPhi\tT\tt\ntest\t50\t1000\t40";
$("ainB8").value="T\tB\tdB\tB/A\td(B/A)";
const rowsOf=txt=>txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^name|^t\s/i.test(s)).map(s=>s.split(/\s+/));

/* ── A.py ── */
function runA(){ const d=T[lang], rows=rowsOf($("ainA").value), out=[];
  for(const r of rows){ const th=+r[1], dd=+r[2]; if(r.length<3||!(th>=20&&th<=80)||!(dd>=0&&dd<=250)){ say(d.bad+r.join(" ")); return; } out.push({name:r[0],th,d:dd,s:spec(th,dd,false)}); }
  S.A=out; say("A.py: "+out.length); draw(); }
/* ── B1.py / B2.py ── */
function runB12(){ const d=T[lang], phi=+$("phi").value, dd=+$("dd").value;
  if(!(phi>=20&&phi<=80)||!(dd>=0&&dd<=250)){ say(d.bad+phi+" "+dd); return; }
  const s=spec(phi,dd,true); S.B12={samp:S.samp,phi,d:dd,s,err:errOf(DATA[S.samp],s)}; $("v-err").textContent=S.B12.err.toFixed(3); say(S.samp+".py: Φ = "+phi+"°, d = "+dd+" nm"); draw(); }
/* ── gen_data ── */
function readB(){ const r=rowsOf($("ainB").value)[0]; if(!r||r.length<4) return null; const o={name:r[0],phi:+r[1],T:+r[2],tmax:+r[3]};
  if(!(o.phi>=20&&o.phi<=80)||!(o.T>=800&&o.T<=1200)||!(o.tmax>0&&o.tmax<=200)) return null; return o; }
function gen(){ const d=T[lang], o=readB(); if(!o){ say(d.bad+$("ainB").value.split("\n")[1]); return; } if(S.gen) return;
  const ex={...o,frames:[],res:null}; S.exps[o.name]=ex; S.cur=o.name; S.b7=null; $("toB8").disabled=true;
  let t=0, dd=TRUE.dn; const n=Math.floor(o.tmax/2);
  $("gen").disabled=true; $("stop").disabled=false;
  S.gen=setInterval(()=>{ for(let k=0;k<20;k++) dd=grow(o.T,0.1,dd); t+=2;
    ex.frames.push({t,s:noisy(spec(o.phi+gauss(0,0.12),dd,true))});   /* the beam wanders by a tenth of a degree between measurements */ $("prog").style.width=(100*ex.frames.length/n).toFixed(1)+"%"; say(d.genRun+ex.frames.length+" / "+n);
    if(ex.frames.length>=n) stopGen(); draw(); },110); }
function stopGen(){ if(!S.gen) return; clearInterval(S.gen); S.gen=null; $("gen").disabled=false; $("stop").disabled=true; const ex=S.exps[S.cur]; say(T[lang].genDone+(ex?ex.frames.length:0)); draw(); }
/* ── B.py: pick d for each spectrum, with its statistical error ── */
function fitD(phi,data){ const r=dd=>{ const [P,D]=spec(phi,dd,true); let s=0; for(let i=0;i<LAM.length;i++) s+=((data[0][i]-P[i])/SIG_P)**2+(wrap(data[1][i]-D[i])/SIG_D)**2; return s; };
  let best=0, bv=Infinity; for(let dd=0;dd<=300;dd+=1){ const v=r(dd); if(v<bv){ bv=v; best=dd; } }
  let a=Math.max(0,best-1), b=best+1; for(let k=0;k<40;k++){ const m1=a+(b-a)*0.382, m2=a+(b-a)*0.618; if(r(m1)<r(m2)) b=m2; else a=m1; }
  const dm=(a+b)/2, h=0.05, c=(r(dm+h)-2*r(dm)+r(Math.max(0,dm-h)))/(h*h), chi=r(dm)/(2*LAM.length-1);
  return [dm, Math.sqrt(2*Math.max(chi,1)/Math.max(c,1e-9))]; }
function proc(){ const d=T[lang], o=readB(); const ex=o&&S.exps[o.name]; if(!ex||!ex.frames.length){ say(d.noExp); return; }
  S.cur=o.name; ex.res=[]; let i=0; $("proc").disabled=true;
  const go=()=>{ const until=Math.min(ex.frames.length,i+4); for(;i<until;i++){ const f=ex.frames[i], [dm,de]=fitD(ex.phi,f.s); ex.res.push({t:f.t,d:dm,dd:de}); }
    $("prog").style.width=(100*i/ex.frames.length).toFixed(1)+"%"; say(d.proc0+i+" / "+ex.frames.length); draw();
    if(i<ex.frames.length) setTimeout(go,0); else { $("proc").disabled=false; say(d.procDone); } };
  go(); }
/* ── B7.py: t = d²/B + d/(B/A) − τ for d ≥ 25 nm ── */
function b7(){ const d=T[lang], o=readB(); const ex=o&&S.exps[o.name]; if(!ex){ say(d.noExp); return; } if(!ex.res){ say(d.needProc); return; }
  const pts=ex.res.filter(p=>p.d>=25); if(pts.length<4){ $("b7out").textContent=d.thin; S.b7=null; $("toB8").disabled=true; return; }
  /* weighted least squares in (d², d, 1) */
  const M=[[0,0,0],[0,0,0],[0,0,0]], v=[0,0,0];
  for(const p of pts){ const w=1, f=[p.d*p.d,p.d,1]; for(let a=0;a<3;a++){ v[a]+=w*f[a]*p.t; for(let b=0;b<3;b++) M[a][b]+=w*f[a]*f[b]; } }
  const inv=inv3(M), c=[0,1,2].map(a=>inv[a][0]*v[0]+inv[a][1]*v[1]+inv[a][2]*v[2]);
  let chi=0; for(const p of pts){ chi+=(p.t-(c[0]*p.d*p.d+c[1]*p.d+c[2]))**2; } const s2=chi/Math.max(1,pts.length-3);
  const B=1/c[0], BA=1/c[1], sB=Math.sqrt(s2*inv[0][0])/(c[0]*c[0]), sBA=Math.sqrt(s2*inv[1][1])/(c[1]*c[1]);
  S.b7={T:ex.T,B,sB,BA,sBA}; $("toB8").disabled=false;
  $("b7out").innerHTML=`T = ${ex.T} °C<br>B = ${B.toFixed(1)} ± ${sB.toFixed(1)} nm²/min<br>B/A = ${BA.toFixed(3)} ± ${sBA.toFixed(3)} nm/min`; draw(); }
function inv3(m){ const [a,b,c]=m[0],[d,e,f]=m[1],[g,h,i]=m[2], A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g, det=a*A+b*B+c*C;
  return [[A/det,-(b*i-c*h)/det,(b*f-c*e)/det],[B/det,(a*i-c*g)/det,-(a*f-c*d)/det],[C/det,-(a*h-b*g)/det,(a*e-b*d)/det]]; }
function toB8(){ if(!S.b7) return; const r=S.b7, ta=$("ainB8"); ta.value=ta.value.replace(/\s*$/,"")+`\n${r.T}\t${r.B.toFixed(1)}\t${r.sB.toFixed(1)}\t${r.BA.toFixed(3)}\t${r.sBA.toFixed(3)}`; say(T[lang].added); }
/* ── B8.py ── */
function runB8(){ const d=T[lang], rows=rowsOf($("ainB8").value).map(r=>r.map(Number)).filter(r=>r.length>=5&&r.every(isFinite)&&r[1]>0&&r[3]>0);
  if(rows.length<2){ say(d.b8need); return; }
  const x=rows.map(r=>1/(r[0]+273.15)), yB=rows.map(r=>Math.log(r[1])), eB=rows.map(r=>r[2]/r[1]), yA=rows.map(r=>Math.log(r[3])), eA=rows.map(r=>r[4]/r[3]);
  const fB=linfit(x,yB,eB.map(e=>1/Math.max(e,1e-6)**2)), fA=linfit(x,yA,eA.map(e=>1/Math.max(e,1e-6)**2));
  S.b8={x,yB,eB,yA,eA,fB,fA};
  $("b8out").innerHTML=`ln B: ${d.slope} = ${fB.b.toFixed(0)} ± ${fB.sb.toFixed(0)} K<br>ln(B/A): ${d.slope} = ${fA.b.toFixed(0)} ± ${fA.sb.toFixed(0)} K`; draw(); }

/* ══════════════════════════════════════════════════════════════
   DRAWING
   ══════════════════════════════════════════════════════════════ */
function say(s){ $("status").textContent=s; }
function draw(){ const d=T[lang]; let s1=[],s2=[],o1={xl:"λ, nm",yl:"Ψ, deg"},o2={xl:"λ, nm",yl:"Δ, deg"}; S.csv=null;
  if(S.task==="A"){ $("t-cap1").textContent=d.cap1A; $("t-cap2").textContent=d.cap2A;
    if(S.A){ S.A.forEach((r,i)=>{ const lab=`${r.name}: ${r.th}°, ${r.d} nm`; s1.push({x:LAM,y:r.s[0],col:PAL[i%10],label:lab}); s2.push({x:LAM,y:r.s[1],col:PAL[i%10],label:lab}); });
      S.csv=["lambda_nm",...S.A.flatMap(r=>[r.name+"_Psi",r.name+"_Delta"])].join(",")+"\n"+LAM.map((l,i)=>[l,...S.A.flatMap(r=>[r.s[0][i].toFixed(5),r.s[1][i].toFixed(5)])].join(",")).join("\n"); } }
  else if(S.task==="B12"){ $("t-cap1").textContent=d.cap1B; $("t-cap2").textContent=d.cap2B; const D=DATA[S.samp];
    s1.push({x:LAM,y:D[0],col:PAL[0],mode:"pts",label:"data"}); s2.push({x:LAM,y:D[1],col:PAL[0],mode:"pts",label:"data"});
    if(S.B12&&S.B12.samp===S.samp){ s1.push({x:LAM,y:S.B12.s[0],col:PAL[1],label:"fit"}); s2.push({x:LAM,y:S.B12.s[1],col:PAL[1],label:"fit"}); }
    o1.yr=null; S.csv="lambda_nm,Psi_deg,Delta_deg\n"+LAM.map((l,i)=>[l,D[0][i].toFixed(3),D[1][i].toFixed(3)].join(",")).join("\n"); }
  else if(S.task==="B3"){ $("t-cap1").textContent=d.cap1C; $("t-cap2").textContent=d.cap2C; const ex=S.exps[S.cur];
    o1={xl:"t, min",yl:"d, nm",padX:true}; o2={xl:"λ, nm",yl:"Ψ, Δ, deg"};
    if(ex&&ex.res&&ex.res.length){ s1.push({x:ex.res.map(p=>p.t),y:ex.res.map(p=>p.d),err:ex.res.map(p=>p.dd),col:PAL[0],mode:"pts",label:ex.name});
      if(S.b7&&S.b7.T===ex.T){ const ts=[],ds=[]; const B=S.b7.B, A=B/S.b7.BA; const p25=ex.res.filter(p=>p.d>=25); if(p25.length){ const tau=(p25[0].d**2+A*p25[0].d)/B-p25[0].t;
        for(let dd=25;dd<=Math.max(...ex.res.map(p=>p.d));dd+=0.5){ ts.push((dd*dd+A*dd)/B-tau); ds.push(dd); } s1.push({x:ts,y:ds,col:PAL[1],label:"d² + Ad = B(t + τ)"}); } }
      S.csv="t_min,d_nm,dd_nm\n"+ex.res.map(p=>[p.t,p.d.toFixed(2),p.dd.toFixed(2)].join(",")).join("\n"); }
    if(ex&&ex.frames.length){ const f=ex.frames[ex.frames.length-1]; s2.push({x:LAM,y:f.s[0],col:PAL[0],mode:"pts",label:"Ψ"},{x:LAM,y:f.s[1],col:PAL[3],mode:"pts",label:"Δ"});
      o2.title=`${ex.name} · Φ = ${ex.phi}° · T = ${ex.T} °C · t = ${f.t} min`; if(!S.csv) S.csv="lambda_nm,Psi_deg,Delta_deg\n"+LAM.map((l,i)=>[l,f.s[0][i].toFixed(3),f.s[1][i].toFixed(3)].join(",")).join("\n"); } }
  else { $("t-cap1").textContent=d.cap1D; $("t-cap2").textContent=d.cap2D; o1={xl:"1/T, 1/K",yl:"ln(B·min/nm²)",padX:true}; o2={xl:"1/T, 1/K",yl:"ln(B/A·min/nm)",padX:true};
    if(S.b8){ const b=S.b8, xs=[Math.min(...b.x),Math.max(...b.x)];
      s1.push({x:b.x,y:b.yB,err:b.eB,col:PAL[0],mode:"pts"},{x:xs,y:xs.map(v=>b.fB.a+b.fB.b*v),col:PAL[1],label:`${d.slope} ${b.fB.b.toFixed(0)} ± ${b.fB.sb.toFixed(0)} K`});
      s2.push({x:b.x,y:b.yA,err:b.eA,col:PAL[0],mode:"pts"},{x:xs,y:xs.map(v=>b.fA.a+b.fA.b*v),col:PAL[1],label:`${d.slope} ${b.fA.b.toFixed(0)} ± ${b.fA.sb.toFixed(0)} K`});
      S.csv="invT_K,lnB,dlnB,lnBA,dlnBA\n"+b.x.map((v,i)=>[v.toExponential(6),b.yB[i].toFixed(5),b.eB[i].toFixed(5),b.yA[i].toFixed(5),b.eA[i].toFixed(5)].join(",")).join("\n"); } }
  plot($("cv1"),{...o1,series:s1,empty:d.idle,ratio:0.42}); plot($("cv2"),{...o2,series:s2,empty:d.idle,ratio:0.42});
  $("csv").disabled=!S.csv; }

/* ══════════════════════════════════════════════════════════════
   CONTROLS AND LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function buildSeg(){ const d=T[lang], box=$("taskSeg"); box.innerHTML="";
  [["A",d.tA],["B12",d.tB12],["B3",d.tB3],["B8",d.tB8]].forEach(([k,l])=>{ const b=document.createElement("button"); b.textContent=l; if(k===S.task) b.className="on"; b.onclick=()=>{ S.task=k; buildSeg(); applyLang(); draw(); }; box.appendChild(b); });
  const sb=$("sampSeg"); sb.innerHTML=""; [["B1",d.sB1],["B2",d.sB2]].forEach(([k,l])=>{ const b=document.createElement("button"); b.textContent=l; if(k===S.samp) b.className="on"; b.onclick=()=>{ S.samp=k; $("v-err").textContent="—"; buildSeg(); draw(); }; sb.appendChild(b); });
  for(const [k,id] of [["A","boxA"],["B12","boxB12"],["B3","boxB3"],["B8","boxB8"]]) $(id).style.display=S.task===k?"block":"none"; }
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  $("t-title").textContent=d.title; $("t-sub").textContent=d.sub; $("t-h-task").textContent=d.hTask;
  $("t-taskdesc").textContent={A:d.dA,B12:d.dB12,B3:d.dB3,B8:d.dB8}[S.task];
  $("t-h-b12").textContent=d.hB12; $("t-err").textContent=d.err;
  for(const [id,k] of [["runA","runA"],["runB12","runB12"],["gen","gen"],["stop","stop"],["proc","proc"],["b7","b7"],["toB8","toB8"],["runB8","runB8"],["csv","csv"],["t-note","note"]]) $(id).textContent=d[k];
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":""; document.title=d.title+" · HaslaLab"; }
$("runA").onclick=runA; $("runB12").onclick=runB12; $("gen").onclick=gen; $("stop").onclick=stopGen; $("proc").onclick=proc; $("b7").onclick=b7; $("toB8").onclick=toB8; $("runB8").onclick=runB8;
$("phi").oninput=()=>{ $("v-phi").textContent=$("phi").value; }; $("dd").oninput=()=>{ $("v-d").textContent=$("dd").value; };
$("csv").onclick=()=>{ if(S.csv) saveText("ISPhO2024_T1_"+S.task+".csv",S.csv+"\n"); };
$("lang-ko").onclick=()=>{ lang="ko"; buildSeg(); applyLang(); draw(); };
$("lang-en").onclick=()=>{ lang="en"; buildSeg(); applyLang(); draw(); };
addEventListener("resize",draw);
buildSeg(); applyLang(); say(T[lang].idle); $("v-phi").textContent=$("phi").value; $("v-d").textContent=$("dd").value; draw();
</script>
