<style>

<body>
<script>
/* NBPhO 2011 problem 4 "Black box" on the 3-D bench.  As in the sheet's figure: A–C1–N, B–C2–N, N wired to
   terminal C, and a battery from N to the "+" wire, which is long enough to reach A or B.  C1 = (3400 ±
   400) µF is given; C2 is to be found.  The voltmeter has a finite resistance (100 kΩ here, so a
   capacitor runs down through it in minutes, as the solution uses), and the capacitors leak a little —
   the solution recommends checking that.  Both ways of the official solution work: equal-voltage
   discharge times on the voltmeter, or sharing the charge of one capacitor with the other. */
var PROGRAM = {
  title: { ko: 'NBPhO 2011 실험 4 — 블랙박스', en: 'NBPhO 2011 Problem 4 — Black box' },
  subtitle: { ko: '상자 속에 축전기 둘과 전지가 그림처럼 연결되어 있습니다. C₁ = (3400 ± 400) µF 입니다. C₂ 를 구하고 불확도를 어림하세요. “+” 단자는 도선이라 A 나 B 에 이을 수 있습니다.',
              en: 'Inside the black box there are two capacitors and a battery, connected as in the figure. C₁ = (3400 ± 400) µF; determine C₂ and estimate the uncertainty. The terminal "+" is a wire, long enough to reach terminal A or B.' },
  notes: { ko: [
    '장비: 단자 셋의 블랙박스, 전압계, 타이머 (문제지 그대로). 회로: A–C₁–N, B–C₂–N, N–단자 C, N–전지–“+”.',
    '전압계의 내부 저항은 유한합니다(약 100 kΩ) — 충전한 축전기가 전압계로 몇 분에 걸쳐 방전됩니다. 축전기는 아주 조금 샙니다.',
    '공식 해답의 두 방법: 같은 전압 사이를 방전하는 데 걸린 시간의 비 C₂/C₁ = t₂/t₁, 또는 한 축전기의 전하를 다른 축전기와 나눈 뒤의 전압 C₂ = (E/U − 1)C₁.',
    'C₂ 와 전지 전압은 방문할 때마다 다릅니다.'], en: [
    'Equipment: the black box with three terminals, a voltmeter and a timer (as on the sheet). The circuit: A–C₁–N, B–C₂–N, N–terminal C, N–battery–"+".',
    'The voltmeter has a finite resistance (about 100 kΩ) — a charged capacitor runs down through it over minutes. The capacitors leak very slightly.',
    'The official solution\'s two ways: the ratio of the times to discharge between the same voltages, C₂/C₁ = t₂/t₁, or the voltage after one capacitor\'s charge is shared with the other, C₂ = (E/U − 1)C₁.',
    'C₂ and the battery voltage differ from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, sw: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 A, B, C 와 “+” 도선이 나온 블랙박스(뚜껑에 회로도), 전압계(멀티미터), 타이머, 짧은 도선 몇 가닥.',
           en: 'On the desk: the black box with terminals A, B, C and the "+" wire (the circuit printed on its lid), a voltmeter (multimeter), a timer and a few short wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. “+” 소켓에서 시작하는 도선이 상자의 “+” 도선입니다',
                '전압계: 클릭해서 가까이 본 뒤 다이얼 (V⎓) — VΩ 와 COM 잭',
                '타이머: <b>Space</b> = START/STOP · ×10 으로 시간을 빨리'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. A wire from the "+" socket is the box\'s "+" wire',
                'Voltmeter: click it to look closer, then the dial (V⎓) — the VΩ and COM jacks',
                'Timer: <b>Space</b> = START/STOP · ×10 to make time run faster'] },
  notePlaceholder: { ko: '예) C₁ 을 충전 후 A–C 에 전압계: 4.00 V → 2.00 V 까지 t₁ = 236 s', en: 'e.g. C₁ charged, voltmeter on A–C: 4.00 V → 2.00 V in t₁ = 236 s' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var C1 = 3400e-6 * (1 + S.sys('C1', 0.06)), C2 = 1500e-6 * Math.exp(S.uni('C2', -0.5, 0.5)), E = 4.6 * (1 + S.sys('E', 0.03)), Rl = 3e6;
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.004), A: 0, R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 5 }), sw = LAB.sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit();
    var lid = (function () { var cv = document.createElement('canvas'); cv.width = 520; cv.height = 300; cv._static = true; var g = cv.getContext('2d');
      g.fillStyle = '#e9e6dc'; g.fillRect(0, 0, 520, 300); g.strokeStyle = '#111'; g.lineWidth = 3; g.fillStyle = '#111'; g.font = '700 30px serif';
      g.beginPath(); g.moveTo(40, 70); g.lineTo(185, 70); g.moveTo(205, 70); g.lineTo(480, 70); g.moveTo(40, 200); g.lineTo(185, 200); g.moveTo(205, 200); g.lineTo(300, 200); g.moveTo(300, 70); g.lineTo(300, 200);
      g.moveTo(300, 200); g.lineTo(370, 200); g.moveTo(390, 200); g.lineTo(480, 200); g.stroke();
      g.lineWidth = 6; [[185, 70], [205, 70], [185, 200], [205, 200]].forEach(function (p) { g.beginPath(); g.moveTo(p[0], p[1] - 26); g.lineTo(p[0], p[1] + 26); g.stroke(); });
      g.lineWidth = 3; g.beginPath(); g.moveTo(370, 175); g.lineTo(370, 225); g.stroke(); g.lineWidth = 8; g.beginPath(); g.moveTo(390, 188); g.lineTo(390, 212); g.stroke();
      g.fillText('A', 30, 50); g.fillText('B', 30, 180); g.fillText('C', 470, 50); g.fillText('+', 470, 180); g.font = 'italic 700 26px serif'; g.fillText('C₁', 215, 40); g.fillText('C₂', 215, 170);
      return cv; })();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10],
      home: { yaw: -0.3, pitch: 0.85, k: 14, tx: 4, ty: 0, tz: 2 },
      views: {
        box: { yaw: 0, pitch: 1.2, k: 36, tx: -14, ty: 4, tz: 2, title: { ko: '블랙박스', en: 'The black box' } },
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 10, ty: 3.4, tz: 2, title: { ko: '전압계', en: 'Voltmeter' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 26, ty: 1.7, tz: 8, title: { ko: '타이머', en: 'Timer' } }
      },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-32, 38, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-14, 2], [{ name: 'A', col: '#d8d8d8', label: 'A' }, { name: 'B', col: '#d8d8d8', label: 'B' }, { name: 'C', col: '#d8d8d8', label: 'C' }, { name: 'P', col: '#c0392b', label: '+' }], { w: 18, d: 11, h: 5 });
        B3.tex3(lid, 0, 0, 520, 300, [-14 - 6.5, 5.02, 2 + 0.3], [13, 0, 0], [0, 0, 7.5], { id: 'm:box' });
        var m = B3.dmm(b, 'dmm', [10, 2], dm, leads, { rV: 1.0e5, model: 'UT33C+ (100 kΩ)' });
        B3.stopwatch(b, 'sw', [26, 8], sw);
        c.reset();
        c.C(T.A, 'box.N', C1, 'c1'); c.R(T.A, 'box.N', Rl);
        c.C(T.B, 'box.N', C2, 'c2'); c.R(T.B, 'box.N', Rl * 1.3);
        c.R('box.N', T.C, 0.05); c.V(T.P, 'box.N', E, 0.8);
        m.stamp(c); leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.05)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-5);
        m.read(c);
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
