<title>EuPhO 2018 실험 — 다공성 막 · Porous Membrane · HaslaLab</title>
<meta name="description" content="EuPhO 2018 실험을 브라우저에서 실행합니다. 양극산화 알루미늄 막을 통한 CO₂ 확산 시간, 박막 간섭으로 두께 h, 복굴절로 Δn과 다공도 p, 마지막으로 채널 지름 d를 실제 장비처럼 측정합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="EuPhO 2018 실험 — 다공성 막 · Porous Membrane">
<meta property="og:description" content="EuPhO 2018 실험: CO₂ 확산, 박막 간섭, 복굴절로 다공성 막을 읽어냅니다.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}

  <div>
    <h1 id="t-title"></h1>

    if(has("stage")){ ctx.globalAlpha=0.6; ctx.beginPath(); ctx.moveTo(X(TBL[0]),Y(RAILY)); ctx.lineTo(X(has("screen")?XSC:120),Y(RAILY)); ctx.stroke(); const a=ST.table-TRUE.table0, ps=rad(180-2*a); ctx.globalAlpha=0.35; ctx.beginPath(); ctx.moveTo(X(TBL[0]),Y(RAILY)); ctx.lineTo(X(TBL[0]+30*Math.cos(ps)),Y(RAILY+30*Math.sin(ps))); ctx.stroke(); ctx.globalAlpha=1; } } }

/* ── 4. the multimeter ── */
function drawMeterV(){ const t=d(); ctx.fillStyle="#2a2d33"; ctx.fillRect(0,0,CLW,CLH); if(!has("dmm")){ text(t.lab.noDmm,CLW/2,CLH/2,"#c9ced3",12.5,"center"); return; }
  const H=CLH-30, W=H*0.56, x0=CLW/2-W/2, y0=15, u=H/420; fillR(x0,y0,W,H,18*u,"#e0b62a","#7a6316",2); fillR(x0+14*u,y0+14*u,W-28*u,H-28*u,12*u,"#2a2c30");
  fillR(x0+30*u,y0+30*u,W-60*u,90*u,6*u,"#b9c4a3","#555",1.5); lcd(dmmShown,x0+40*u,y0+42*u,W-80*u,66*u,"#1b1d20","rgba(27,29,32,0.08)");
  text(DMMR[ST.rng][2],x0+W-38*u,y0+112*u,"#333",13,"right","700");
  const ry=y0+170*u; fillR(x0+W/2-70*u,ry,140*u,40*u,8,"#3b3e43","#111"); text("RANGE "+DMMR[ST.rng][0],x0+W/2,ry+20*u,"#f2f2f2",13,"center","700"); hitAdd("rng",x0+W/2-70*u,ry,140*u,40*u);
  if(!has("wires")) text(t.lab.wires,x0+W/2,ry+80*u,"#ffd77a",11,"center"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="sensor") drawSensor(); else if(tab==="optics") drawOptics(); else if(tab==="meter") drawMeterV(); else drawVesselV(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   6.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ return pick3(p[0],p[1])||null; }
let drag=null;
const DEPS={vessel:["tubes","sensor","fan_in","fan_out"],rail:["laser","pol1","stage","pol2","pd","screen","wires"],laser:["pol1"],stage:["pol2"],pd:["wires"],dmm:["wires"]};
function clearK(k){ ST.on.delete(k); for(const q of DEPS[k]||[]) ST.on.delete(q); if(k==="sensor"||k==="powerbank") ST.usb=false; if(k==="laser") ST.laser=false; sync(); }
function place(k){ for(const n of NEEDS[k]||[]) if(!has(n)){ say("needFor",itemName(n)); return false; } ST.on.add(k); sync(); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item; if(right){ say("back",itemName(k)); hand=null; return; } if(place(k)) hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ clearK(k); say("back",itemName(k)); return; }
  if(k==="sensor") setTab("sensor"); else if(["vessel","tubes","fan_in","fan_out","powerbank","pads","rulers"].includes(k)) setTab("vessel"); else if(k==="dmm"||k==="wires") setTab("meter"); else setTab("optics"); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(120,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
const angOf=(h,p)=>Math.atan2(p[1]-h.cy,p[0]-h.cx)*180/Math.PI;
function turn(which,dv){ const r=v=>Math.round(v*100)/100;
  if(which==="table"){ if(!need("stage")) return; ST.table=r(ST.table+dv); } else if(which==="arm"){ if(!need("stage")) return; ST.arm=r(ST.arm+dv); }
  else if(which==="p1"){ if(!need("pol1")) return; ST.p1=r(((ST.p1+dv)%360+360)%360); } else if(which==="p2"){ if(!need("pol2")) return; ST.p2=r(((ST.p2+dv)%360+360)%360); } }
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const h=hitAt(clpos(e)); if(!h||tab!=="optics") return; const s=(e.deltaY<0?1:-1)*(e.shiftKey?0.05:1);
  if(h.k==="table") turn("table",s); else if(h.k==="arm") turn("arm",s); else if(h.k==="pol1") turn("p1",s); else if(h.k==="pol2") turn("p2",s); },{passive:false});
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const a=angOf(cdrag.h,cmouse); let da=a-cdrag.a; if(da>180) da-=360; if(da< -180) da+=360; cdrag.a=a;
  if(cdrag.k==="table") turn("table",-da); else if(cdrag.k==="arm") turn("arm",da); else turn(cdrag.k==="pol1"?"p1":"p2",da); });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e); closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p); if(!h) return;
  if(tab==="vessel"){ if(h.k==="lid") CELL.lid=!CELL.lid; else if(h.k==="clamp0"||h.k==="clamp1") CELL.clamp[+h.k.slice(-1)]=!CELL.clamp[+h.k.slice(-1)];
    else if(h.k==="usb"){ ST.usb=!ST.usb; if(ST.usb&&has("sensor")&&has("powerbank")){ senPower(true); say("usbOn"); } else { senPower(false); say("usbOff"); } }
    else if(h.k==="batt"){ CELL.batt=!CELL.batt; } else if(h.k==="fanIn"){ ST.fanInSw=!ST.fanInSw; } else if(h.k==="fanOut"){ ST.fanOutSw=!ST.fanOutSw; } sync(); return; }
  if(tab==="sensor"&&h.k.startsWith("s:")){ senBtn(h.k.slice(2)); senShown=senDisplay(); return; }
  if(tab==="optics"){ if(h.k==="pd"){ ST.mount=ST.mount==="rail"?"arm":"rail"; return; } if(["table","arm","pol1","pol2"].includes(h.k)) cdrag={k:h.k,h,a:angOf(h,p)}; return; }
  if(tab==="meter"&&h.k==="rng"){ ST.rng=(ST.rng+1)%DMMR.length; } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
$("exBtn").onclick=()=>{ if(!need("vessel")) return; if(!has("tubes")&&CELL.lid){ say("needFor",itemName("tubes")); return; } say(exhale(0.9)?"exOk":"exNo"); };
$("suckBtn").onclick=()=>{ if(!need("tubes")) return; say(suck()?"suckOk":"suckNo"); };
$("purgeBtn").onclick=()=>{ if(!need("vessel")) return; say(purgeFan()?"purgeOk":"purgeNo"); };
$("lasBtn").onclick=()=>{ if(!need("laser")) return; ST.laser=!ST.laser; };
$("flipBtn").onclick=()=>{ if(!need("stage")) return; ST.face=1-ST.face; say("flip"); };
$("mountBtn").onclick=()=>{ if(!need("pd")) return; ST.mount=ST.mount==="rail"?"arm":"rail"; };
$("blockBtn").onclick=()=>{ ST.block=!ST.block; };
document.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>turn(b.dataset.a,+b.dataset.d));
for(const [id,s] of [["sp1",1],["sp10",10],["sp60",60],["sp200",200],["sp600",600]]) $(id).onclick=()=>{ ST.speed=s; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
/* the dn(p) plot of the problem sheet */
const chart=$("chart"); chart.hidden=false; chart.style.display="none";
$("chartBtn").onclick=()=>{ chart.style.display="flex"; const c=$("chartCv").getContext("2d"), W=560, H=380, X=p=>60+p/0.5*(W-80), Y=v=>H-40-v/0.1*(H-70);
  c.fillStyle="#fff"; c.fillRect(0,0,W,H); c.strokeStyle="#ccc"; c.lineWidth=0.6;
  for(let p=0;p<=0.5001;p+=0.01){ c.beginPath(); c.moveTo(X(p),Y(0)); c.lineTo(X(p),Y(0.1)); c.stroke(); } for(let v=0;v<=0.1001;v+=0.002){ c.beginPath(); c.moveTo(X(0),Y(v)); c.lineTo(X(0.5),Y(v)); c.stroke(); }
  c.strokeStyle="#888"; c.lineWidth=1; for(let p=0;p<=0.5001;p+=0.05){ c.beginPath(); c.moveTo(X(p),Y(0)); c.lineTo(X(p),Y(0.1)); c.stroke(); } for(let v=0;v<=0.1001;v+=0.01){ c.beginPath(); c.moveTo(X(0),Y(v)); c.lineTo(X(0.5),Y(v)); c.stroke(); }
  c.fillStyle="#222"; c.font="11px sans-serif"; c.textAlign="center"; for(let p=0;p<=0.5001;p+=0.05) c.fillText(p.toFixed(2),X(p),H-24); c.textAlign="right"; for(let v=0;v<=0.1001;v+=0.01) c.fillText(v.toFixed(2),X(0)-6,Y(v)+4);
  c.textAlign="center"; c.fillText("p",X(0.25),H-8); c.save(); c.translate(16,Y(0.05)); c.rotate(-Math.PI/2); c.fillText("Δn",0,0); c.restore();
  c.strokeStyle="#1a4fa0"; c.lineWidth=2; c.beginPath(); for(let i=0;i<=200;i++){ const p=i/400; i?c.lineTo(X(p),Y(dnOf(p))):c.moveTo(X(p),Y(dnOf(p))); } c.stroke(); };
$("chartClose").onclick=()=>{ chart.style.display="none"; }; chart.addEventListener("mousedown",e=>{ if(e.target===chart) chart.style.display="none"; });
function renderPanel(){ const t=d();
  $("lasBtn").textContent=ST.laser?t.lasOn:t.lasOff; $("lasBtn").className=ST.laser?"on":""; $("mountBtn").textContent=ST.mount==="rail"?t.mountRail:t.mountArm; $("blockBtn").textContent=ST.block?t.unblock:t.block; $("blockBtn").className=ST.block?"on":"";
  $("t-tbl").textContent=t.tbl(ST.table.toFixed(2)); $("t-arm").textContent=t.arm(ST.arm.toFixed(2)); $("t-p1").textContent=t.p1(ST.p1.toFixed(0)); $("t-p2").textContent=t.p2(ST.p2.toFixed(0));
  for(const [id,s] of [["sp1",1],["sp10",10],["sp60",60],["sp200",200],["sp600",600]]) $(id).className=ST.speed===s?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(SEN.on&&!SEN.ready) L.push([t.st.cal,false]); if(SEN.on&&SEN.ready&&CELL.rd>0.5) L.push([t.st.ol,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-a","hA"],["exBtn","ex"],["suckBtn","suck"],["purgeBtn","purge"],["t-h-o","hO"],["flipBtn","flip"],["chartBtn","chart"],["t-chart","chartT"],["t-h-sp","hSp"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now(), dispT=0;
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; step(dt*ST.speed);
  dispT-=dt; if(dispT<=0){ dispT=0.4; dmmShown=dmmText(); senShown=senDisplay(); }
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
