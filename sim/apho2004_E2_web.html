<title>APhO 2004 — 블랙박스 · Black Box · HaslaLab</title>
<meta name="description" content="APhO 2004 실험 2를 브라우저에서 실행합니다. 두 겹 빔 오실로스코프와 함수 발생기, 표준 저항 Rn = 5 kΩ으로 블랙박스 속 별 모양 회로 두 개의 소자(R, C, L)를 알아내 값을 재고, 다섯 단자를 묶어 만든 새 상자의 진폭비와 위상차를 주파수에 따라 재서 특별한 주파수 f0를 찾습니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="APhO 2004 — 블랙박스 · Black Box">
<meta property="og:description" content="APhO 2004 실험 2를 브라우저에서 실행합니다. 오실로스코프와 함수 발생기로 블랙박스 속 R, C, L을 찾습니다.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);
const d=()=>T[lang];
/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (V, Ω, F, H, Hz)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
/* an element: R (ohms), C (farads), or L (henries, with its winding's resistance r) */
const mkR=()=>({t:"R",R:Math.round(U(1.0,4.7)*100)*10}), mkC=()=>({t:"C",C:U(10,100)*1e-9}), mkL=()=>({t:"L",L:U(20,80)*1e-3,r:U(25,90)});
const Yel=(z,w)=>z.t==="R"?cx(1/z.R):z.t==="C"?cx(0,w*z.C):cdiv(cx(1),cx(z.r,w*z.L));
/* complex arithmetic and a small linear solver */
const cx=(r,i)=>[r,i||0], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]], csub=(a,b)=>[a[0]-b[0],a[1]-b[1]], cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
      cdiv=(a,b)=>{ const m=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/m,(a[1]*b[0]-a[0]*b[1])/m]; }, cabs=a=>Math.hypot(a[0],a[1]), carg=a=>Math.atan2(a[1],a[0]);
function csolve(A,b){ const n=b.length; for(let i=0;i<n;i++){ let p=i; for(let r=i+1;r<n;r++) if(cabs(A[r][i])>cabs(A[p][i])) p=r; [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    for(let r=i+1;r<n;r++){ const k=cdiv(A[r][i],A[i][i]); for(let c=i;c<n;c++) A[r][c]=csub(A[r][c],cmul(k,A[i][c])); b[r]=csub(b[r],cmul(k,b[i])); } }
  const x=new Array(n); for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s=csub(s,cmul(A[i][c],x[c])); x[i]=cdiv(s,A[i][i]); } return x; }
/* group 1 holds one R, one C and one L in some order; group 2 a C and two R or an L, C and R: chosen so that
   the joined box DD'A' has one frequency, between 300 Hz and 30 kHz, where U_D'A' is in phase with U_DA' */
function draw(){ const g1=shuffle([mkR(),mkC(),mkL()]), g2=shuffle(Math.random()<0.5?[mkR(),mkC(),mkR()]:[mkL(),mkC(),mkR()]); return {g1,g2}; }
function ratioDA(T,f){ const w=2*Math.PI*f, inv=y=>cdiv(cx(1),y);
  const top=cadd(inv(Yel(T.g1[2],w)),inv(cadd(Yel(T.g1[0],w),Yel(T.g1[1],w)))), bot=inv(cadd(cadd(Yel(T.g2[0],w),Yel(T.g2[1],w)),Yel(T.g2[2],w)));
  return cdiv(bot,cadd(top,bot)); }
function zeroCross(T){ let prev=null, n=0, f0=null; for(let lg=1;lg<=6;lg+=0.01){ const ph=carg(ratioDA(T,Math.pow(10,lg))); if(prev!==null&&Math.sign(ph)!==Math.sign(prev)&&Math.abs(ph-prev)<2){ n++; f0=Math.pow(10,lg); } prev=ph; } return n===1?f0:null; }
let TRUE; for(let k=0;k<400;k++){ const T=draw(), f0=zeroCross(T); if(f0&&f0>300&&f0<30000){ TRUE=T; TRUE.f0=f0; break; } }
if(!TRUE){ TRUE={g1:[{t:"R",R:2200},{t:"C",C:47e-9},{t:"L",L:47e-3,r:55}],g2:[{t:"R",R:3300},{t:"C",C:68e-9},{t:"R",R:4700}]}; TRUE.f0=zeroCross(TRUE); }
TRUE.Rn=5000*U(0.995,1.005); TRUE.Rfg=50; TRUE.gain=[U(0.97,1.03),U(0.97,1.03)]; TRUE.fcal=U(0.997,1.003);
/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const PARTS=["box","scope","fg","leads"];

  leads:[], pick:null,
  fgOn:false, wave:"sine", freq:1000, amp:4.0,            /* the generator: waveform, frequency (Hz), amplitude (V peak to peak, open circuit) */

cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the close-ups: click terminals to wire; the scope's knobs */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button===2){ ST.pick=null; return; } if(e.button!==0) return;
  if(!h){ ST.pick=null; return; }
  if(h.k==="sc:pow"){ scPower(); return; } if(h.k==="sc:xy"){ ST.xy=!ST.xy; return; } if(h.k==="sc:trig"){ ST.trig=1-ST.trig; return; }
  if(h.k.startsWith("vd:")){ const [,ch,dv]=h.k.split(":"); stepV(+ch,+dv); return; }
  if(h.k.startsWith("ps:")){ const [,ch,dv]=h.k.split(":"); ST.pos[+ch]=Math.max(-4,Math.min(4,ST.pos[+ch]+0.2*(+dv))); return; }
  if(h.k.startsWith("td:")){ stepT(+h.k.slice(3)); return; }
  if(h.k.startsWith("l:")){ const i=+h.k.slice(2); ST.leads.splice(i,1); say("unplugged"); return; }
  if(h.k.startsWith("t:")){ const t=h.k.slice(2);
    if(!has("leads")){ say("needFor",itemName("leads")); ST.pick=null; return; }
    if(!ST.pick){ ST.pick=t; return; } if(ST.pick===t){ ST.pick=null; return; }
    if(ST.leads.length>=14){ say("noLeads"); ST.pick=null; return; } if(ST.leads.some(([a,b])=>(a===ST.pick&&b===t)||(a===t&&b===ST.pick))){ ST.pick=null; return; }
    ST.leads.push([ST.pick,t]); say("joined",ST.pick,t); ST.pick=null; } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function scPower(){ if(!has("scope")){ say("needFor",itemName("scope")); return; } ST.scOn=!ST.scOn; say(ST.scOn?"scOn":"scOff"); }
function fgPower(){ if(!has("fg")){ say("needFor",itemName("fg")); return; } ST.fgOn=!ST.fgOn; say(ST.fgOn?"fgOn":"fgOff"); }
function stepV(ch,dv){ ST.vd[ch]=Math.max(0,Math.min(VDIV.length-1,ST.vd[ch]+dv)); }
function stepT(dv){ ST.td=Math.max(0,Math.min(TDIV.length-1,ST.td+dv)); }
function setFreq(f){ if(!has("fg")){ say("needFor",itemName("fg")); return; } ST.freq=Math.max(0.02,Math.min(2e6,+f.toPrecision(4))); }
function setAmp(a){ if(!has("fg")){ say("needFor",itemName("fg")); return; } ST.amp=Math.max(0,Math.min(20,Math.round(a*10)/10)); }
$("fgPow").onclick=fgPower; $("scPow").onclick=scPower;
for(const w of ["sine","triangle","square"]) $("w_"+w).onclick=()=>{ ST.wave=w; };
for(const [id,k] of [["fd10",0.1],["fm10",1/1.1],["fm1",1/1.01],["fp1",1.01],["fp10",1.1],["fx10",10]]) $(id).onclick=()=>setFreq(ST.freq*k);
for(const [id,k] of [["am1",-1],["am01",-0.1],["ap01",0.1],["ap1",1]]) $(id).onclick=()=>setAmp(ST.amp+k);
$("fSet").onclick=()=>{ const v=parseFloat($("fIn").value); if(v>0) setFreq(v); };
for(const [id,ch,dv] of [["v1m",0,-1],["v1p",0,1],["v2m",1,-1],["v2p",1,1]]) $(id).onclick=()=>stepV(ch,dv);
$("tm").onclick=()=>stepT(-1); $("tp").onclick=()=>stepT(1); $("xyBtn").onclick=()=>{ ST.xy=!ST.xy; }; $("trBtn").onclick=()=>{ ST.trig=1-ST.trig; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  f "+(ST.fgOn?fgShow():"—")+"   CH1 "+fmtV(VDIV[ST.vd[0]])+"/div   CH2 "+fmtV(VDIV[ST.vd[1]])+"/div   "+(ST.xy?"X–Y":fmtT(TDIV[ST.td])+"/div")+($("cfg").value.trim()?"   "+$("cfg").value.trim():"");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(); $("dF").textContent=has("fg")&&ST.fgOn?fgShow()+"  ·  "+ST.amp.toFixed(1)+" Vpp":"—";
  $("fgPow").textContent=ST.fgOn?t.off:t.on; $("fgPow").className=ST.fgOn?"on":""; $("scPow").textContent=ST.scOn?t.off:t.on; $("scPow").className=ST.scOn?"on":"";
  for(const w of ["sine","triangle","square"]) $("w_"+w).className=ST.wave===w?"on":"";
  $("dV1").textContent="CH1 "+fmtV(VDIV[ST.vd[0]])+"/div"; $("dV2").textContent="CH2 "+fmtV(VDIV[ST.vd[1]])+"/div"; $("dT").textContent=ST.xy?"X–Y":fmtT(TDIV[ST.td])+"/div";
  $("xyBtn").className=ST.xy?"on":""; $("trBtn").textContent="TRIG CH"+(ST.trig+1); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(ST.pick),false]);
  if(has("scope")&&ST.scOn&&!ST.xy){ const p=tracePts(60); for(let ch=0;ch<2;ch++){ if(p[ch]&&p[ch].some(([u,v])=>v<=-0.1||v>=8.1)) L.push([t.st.clip(ch+1),true]); } }
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-fg","hFg"],["fgHint","fgHint"],["fSet","fSet"],["t-h-sc","hSc"],["scHint","scHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["w_sine","sine"],["w_triangle","triangle"],["w_square","square"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt;
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
  <script src="simfull.js"></script>
