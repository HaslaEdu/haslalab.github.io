<style>
  /* the look of opho.physoly.org (2026): near-black ground, lime accent, Helvetica + Roboto Mono */
  :root{--bg:#161512;--surface:#1c1717;--card:#1f1b1a;--line:rgba(255,255,255,.12);--fg:#fff;--dim:rgba(255,255,255,.62);
        --faint:rgba(255,255,255,.38);--acc:#a7e26e;--accd:#86c24f;--mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
        --sans:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
  body{font:400 14px/1.55 var(--sans);
       background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
       background-size:48px 48px}
  .wrap{max-width:1140px;margin:0 auto;padding:22px 18px 40px}
  .glow{position:fixed;inset:-30vh auto auto -20vw;width:70vw;height:70vh;background:radial-gradient(closest-side,rgba(110,190,80,.20),transparent);pointer-events:none;z-index:0}
  .top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font:400 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}
  .eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
  h1{font:300 clamp(30px,4.4vw,48px)/1.05 var(--sans);letter-spacing:-.025em;margin:10px 0 10px}
  .lead{max-width:640px;color:var(--dim);font-size:14px;margin:0}
  .lang{display:flex;gap:6px}
  .lang button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:29px;padding:7px 14px;font:500 12px var(--sans);cursor:pointer}
  .lang button.on{background:var(--acc);border-color:var(--acc);color:#000}
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:14px;margin-top:22px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px}
  .card.hi{background:linear-gradient(180deg,rgba(167,226,110,.10),rgba(167,226,110,.02));border-color:rgba(167,226,110,.35)}
  .card h2{font:400 18px/1.3 var(--sans);margin:4px 0 12px}
  .tag{font:400 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .fld{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
  .fld label{font-size:13px;color:var(--dim)}
  .fld input,.fld select,.fld textarea{width:150px;background:#120f0e;border:1px solid var(--line);border-radius:6px;color:var(--fg);
       font:400 13px var(--mono);padding:7px 9px;outline:none}
  .fld input:focus,.fld textarea:focus{border-color:var(--acc)}
  .wide input,.wide textarea{width:100%}
  .wide{display:block}.wide label{display:block;margin-bottom:5px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#000;border:0;border-radius:29px;
       padding:10px 18px;font:500 14px var(--sans);cursor:pointer;width:100%;margin-top:10px}
  .btn:hover{background:var(--accd)}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{width:auto;flex:1}
  .hint{color:var(--faint);font-size:12px;line-height:1.55;margin:10px 0 0}
  .out{width:100%;min-height:220px;max-height:460px;overflow:auto;background:#100d0c;border:1px solid var(--line);border-radius:6px;
       color:#e9f5dc;font:400 12.5px/1.55 var(--mono);padding:10px 12px;white-space:pre;margin:0}
  .stat{font:400 12px var(--mono);color:var(--acc);min-height:1.4em;margin-top:8px}
  canvas{display:block;width:100%;background:#100d0c;border:1px solid var(--line);border-radius:6px;margin-top:12px}
  .foot{position:relative;z-index:1;margin-top:18px;color:var(--faint);font-size:12px;line-height:1.65;max-width:900px}
  .foot b{color:var(--dim);font-weight:500}
  .chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:var(--dim)}
  .chk input{accent-color:var(--acc)}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.fld input,.fld select{width:130px}}

  .grids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .grids figure{margin:0}
  .grids canvas{margin:0;image-rendering:pixelated;aspect-ratio:1/1}
  .grids figcaption{font:400 11.5px var(--mono);color:var(--dim);text-align:center;margin-top:4px}
  .fld select{width:150px}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="top">
    <div><span class="eyebrow" data-t="eb"></span><h1 data-t="h1"></h1><p class="lead" data-t="lead"></p></div>
    <div class="lang"><button id="lang-ko" class="on">한국어</button><button id="lang-en">English</button></div>
  </div>

  <div class="grid">
    <div class="card hi">
      <span class="tag">Input · Ising.ipynb</span><h2 data-t="inT"></h2>
      <div class="fld wide"><label data-t="Tl"></label><input id="Tl" value="1.0, 2.5, 5.0"></div>
      <div class="fld wide"><label data-t="Bl"></label><input id="Bl" value="0"></div>
      <div class="fld"><label data-t="L"></label><input id="L" value="50"></div>
      <div class="fld"><label data-t="ns"></label><input id="ns" value="100000"></div>
      <div class="fld"><label data-t="nm"></label><input id="nm" value="100000"></div>
      <div class="fld"><label data-t="ax"></label><select id="ax"><option value="m">|M|/N</option><option value="mm">M/N</option><option value="e">E/N</option><option value="c">C/N</option><option value="x">χ/N</option></select></div>
      <button class="btn" id="run" data-t="run"></button>
      <p class="hint" data-t="help"></p>
    </div>
    <div class="card">
      <span class="tag">Output</span><h2 data-t="outT"></h2>
      <pre class="out" id="out"></pre>
      <div class="stat" id="stat"></div>
      <div class="row"><button class="btn ghost" id="copy" data-t="copy"></button><button class="btn ghost" id="csv" data-t="csv"></button></div>
      <canvas id="plot"></canvas>
      <div class="grids" id="grids"></div>
    </div>
  </div>
  <p class="foot" data-t="foot"></p>
</div>
<script>
"use strict";
/* a small dark plot, in the colours of the OPhO site */
function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(r))), m=r/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function fmtTick(v,st){ const d=Math.max(0,-Math.floor(Math.log10(st)+1e-9)); return (Math.abs(v)<st/1e6?0:v).toFixed(Math.min(6,d)); }
function plotXY(cv,series,o){
  o=o||{}; const dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||800, H=Math.round(W*(o.aspect||0.5));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#100d0c"; c.fillRect(0,0,W,H);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of series) for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)) continue;
    x0=Math.min(x0,s.x[i]); x1=Math.max(x1,s.x[i]); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  if(!isFinite(x0)){x0=0;x1=1;y0=0;y1=1;}
  if(o.xlim){x0=o.xlim[0];x1=o.xlim[1];} if(o.ylim){y0=o.ylim[0];y1=o.ylim[1];}
  if(x1<=x0){x1=x0+1;} if(y1<=y0){y0-=0.5;y1+=0.5;}
  if(!o.ylim){ const p=(y1-y0)*0.06; y0-=p; y1+=p; }
  const L=58,R=14,T=14,B=38, pw=W-L-R, ph=H-T-B;
  if(o.equal){ const sx=(x1-x0)/pw, sy=(y1-y0)/ph, s=Math.max(sx,sy); x1=x0+s*pw; y1=y0+s*ph; }
  const X=v=>L+pw*(v-x0)/(x1-x0), Y=v=>T+ph*(1-(v-y0)/(y1-y0));
  c.font="11px 'Roboto Mono',monospace"; c.lineWidth=1;
  const sx=niceStep((x1-x0)/8), sy=niceStep((y1-y0)/6);
  c.strokeStyle="rgba(255,255,255,.08)"; c.fillStyle="rgba(255,255,255,.6)";
  c.textAlign="center"; c.textBaseline="top";
  for(let v=Math.ceil(x0/sx)*sx;v<=x1+1e-12;v+=sx){ c.beginPath(); c.moveTo(X(v),T); c.lineTo(X(v),T+ph); c.stroke(); c.fillText(fmtTick(v,sx),X(v),T+ph+5); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=Math.ceil(y0/sy)*sy;v<=y1+1e-12;v+=sy){ c.beginPath(); c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); c.stroke(); c.fillText(o.logy?"1e"+fmtTick(v,sy):fmtTick(v,sy),L-6,Y(v)); }
  c.strokeStyle="rgba(255,255,255,.28)"; c.strokeRect(L,T,pw,ph);
  c.fillStyle="rgba(255,255,255,.75)"; c.textAlign="center"; c.textBaseline="alphabetic"; c.fillText(o.xl||"",L+pw/2,H-6);
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.fillText(o.yl||"",0,0); c.restore();
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  for(const s of series){ c.strokeStyle=c.fillStyle=s.color||"#a7e26e"; c.lineWidth=s.lw||1.4;
    if(s.mode==="dot"){ for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(s.y[i]):s.y[i]; c.beginPath(); c.arc(X(s.x[i]),Y(y),s.r||2.4,0,7); c.fill(); } }
    else{ c.beginPath(); let st=false; for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)){st=false;continue;} const px=X(s.x[i]),py=Y(y); st?c.lineTo(px,py):c.moveTo(px,py); st=true; } c.stroke(); } }
  c.restore();
  let ly=T+14; c.textAlign="left"; c.textBaseline="alphabetic";
  for(const s of series) if(s.label){ c.fillStyle=s.color||"#a7e26e"; c.fillRect(L+10,ly-8,10,3); c.fillStyle="rgba(255,255,255,.8)"; c.fillText(s.label,L+26,ly-3); ly+=15; }
  return {X,Y,L,T,pw,ph,x0,x1,y0,y1};
}
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download=name; a.click(); }

const T={
 ko:{eb:"OPhO 2024 Invitational · 실험 문제",h1:"강자성의 Ising 모형",
   lead:"L×L 주기 격자의 스핀 ±1을 무작위로 놓고 메트로폴리스 몬테카를로로 뒤집습니다. 온도 목록과 자기장 목록을 넣으면 각 (B, T)의 마지막 스핀 배열(주최측 노트북과 같은 coolwarm 그림)과 함께 자화 M, 에너지 E, 열용량 C, 감수율 χ가 숫자로 나옵니다.",
   inT:"시뮬레이션 설정",Tl:"T 목록 (쉼표로 구분, a:b:n도 가능)",Bl:"B 목록",L:"격자 크기 L",ns:"평형 스텝 n_steps",nm:"측정 스텝",ax:"그래프 세로축",run:"시뮬레이션 실행 ↗",
   help:"J = k_B = 1. 한 스텝은 스핀 하나를 골라 ΔE = 2J s Σs_이웃 + 2B s로 뒤집을지 정하는 것입니다(주최측 노트북과 같음). 평형 스텝 뒤 측정 스텝 동안 L² 스텝마다 E, M을 재어 평균합니다. 측정 스텝이 0이면 마지막 배열 하나로 셉니다. T 목록 예: 1.5:3.5:21 (1.5부터 3.5까지 21개).",
   outT:"결과",copy:"표 복사",csv:"CSV 내려받기",runs:"개 실행",busy:"계산 중…",
   foot:"<b>모형</b> — 주최측 Ising.ipynb의 세 셀(T 바꾸기, B 바꾸기, 둘 다 바꾸기)을 한 화면에 합쳤습니다. 매번 무작위 배열에서 시작하며, E = −J Σ⟨ij⟩ s_i s_j − B Σ s_i, M = Σ s_i (μ = 1), C = (⟨E²⟩ − ⟨E⟩²)/(k_B T²), χ = (⟨M²⟩ − ⟨|M|⟩²)/(k_B T)입니다. 주최측 노트북 원본은 카탈로그의 ‘소스’에서 받을 수 있습니다."},
 en:{eb:"OPhO 2024 Invitational · Experimental",h1:"Ising Model of Ferromagnetism",
   lead:"Spins ±1 on a periodic L×L lattice start at random and are flipped by Metropolis Monte Carlo. Enter a list of temperatures and fields; for each (B, T) you get the final spin configuration (the organisers' coolwarm picture) and the magnetisation M, energy E, heat capacity C and susceptibility χ as numbers.",
   inT:"Simulation",Tl:"T list (comma separated, or a:b:n)",Bl:"B list",L:"grid size L",ns:"equilibration n_steps",nm:"measurement steps",ax:"plot",run:"Run the simulation ↗",
   help:"J = k_B = 1. One step picks a spin and decides whether to flip it with ΔE = 2J s Σs_nb + 2B s, as in the organisers' notebook. After the equilibration steps, E and M are sampled every L² steps over the measurement steps; with 0 measurement steps the final configuration alone is used. Example T list: 1.5:3.5:21 (21 values from 1.5 to 3.5).",
   outT:"Results",copy:"Copy table",csv:"Download CSV",runs:" runs",busy:"running…",
   foot:"<b>Model</b> — the three cells of the organisers' Ising.ipynb (vary T, vary B, vary both) on one screen. Every run starts from a random configuration; E = −J Σ⟨ij⟩ s_i s_j − B Σ s_i, M = Σ s_i (μ = 1), C = (⟨E²⟩ − ⟨E⟩²)/(k_B T²), χ = (⟨M²⟩ − ⟨|M|⟩²)/(k_B T). The organisers' notebook itself is the catalogue's ‘source’ download."}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=i=>document.getElementById(i);
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{ const k=e.dataset.t; if(d[k]!==undefined) e.innerHTML=d[k]; });
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":"";
  if(typeof onLang==="function") onLang(); }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

let rows=[], busy=false;
function parseList(s){ s=s.trim(); const m=s.match(/^(-?[\d.eE+-]+)\s*:\s*(-?[\d.eE+-]+)\s*:\s*(\d+)$/);
  if(m){ const a=+m[1], b=+m[2], n=Math.max(1,Math.min(200,+m[3])); return Array.from({length:n},(_,i)=>n===1?a:+(a+(b-a)*i/(n-1)).toPrecision(6)); }
  return s.split(/[,\s]+/).filter(Boolean).map(Number).filter(isFinite); }
function ising(L,Tt,B,ns,nm){
  const N=L*L, g=new Int8Array(N); for(let i=0;i<N;i++) g[i]=Math.random()<0.5?-1:1;
  const nb=i=>{ const x=i%L, y=(i-x)/L; return g[y*L+(x+1)%L]+g[y*L+(x+L-1)%L]+g[((y+1)%L)*L+x]+g[((y+L-1)%L)*L+x]; };
  let E=0, M=0; for(let i=0;i<N;i++){ const x=i%L, y=(i-x)/L; E-=g[i]*(g[y*L+(x+1)%L]+g[((y+1)%L)*L+x]); E-=B*g[i]; M+=g[i]; }
  const step=()=>{ const i=(Math.random()*N)|0, s=g[i], dE=2*s*nb(i)+2*B*s;
    if(dE<0||Math.random()<Math.exp(-dE/Tt)){ g[i]=-s; E+=dE; M-=2*s; } };
  for(let k=0;k<ns;k++) step();
  let sE=0,sE2=0,sM=0,sAM=0,sM2=0,n=0;
  const take=()=>{ sE+=E; sE2+=E*E; sM+=M; sAM+=Math.abs(M); sM2+=M*M; n++; };
  if(nm<=0) take(); else for(let k=1;k<=nm;k++){ step(); if(k%N===0) take(); }
  if(!n) take();
  const mE=sE/n, mAM=sAM/n;
  return {g,L,T:Tt,B,m:mAM/N,mm:sM/n/N,e:mE/N,c:(sE2/n-mE*mE)/(Tt*Tt)/N,x:(sM2/n-mAM*mAM)/Tt/N,n};
}
function coolwarm(s){ return s>0?[180,4,38]:[59,76,192]; }
function paint(r){ const fig=document.createElement("figure"), cv=document.createElement("canvas"), c=cv.getContext("2d");
  cv.width=cv.height=r.L; const im=c.createImageData(r.L,r.L);
  for(let i=0;i<r.L*r.L;i++){ const col=coolwarm(r.g[i]); im.data.set([col[0],col[1],col[2],255],4*i); }
  c.putImageData(im,0,0); const cap=document.createElement("figcaption"); cap.textContent="B = "+r.B+", T = "+r.T;
  fig.appendChild(cv); fig.appendChild(cap); return fig; }
const KEYS=["B","T","m","mm","e","c","x"];
function text(){ return "B, T, |M|/N, M/N, E/N, C/N, chi/N, samples\n"+rows.map(r=>[r.B,r.T,r.m.toFixed(4),r.mm.toFixed(4),r.e.toFixed(4),r.c.toFixed(4),r.x.toFixed(4),r.n].join(", ")).join("\n"); }
const COLS=["#a7e26e","#e0b45a","#6ec3e2","#e27a6e","#c49be8","#f0f0f0"];
function draw(){ if(!rows.length) return; const k=$("ax").value, Ts=[...new Set(rows.map(r=>r.T))], Bs=[...new Set(rows.map(r=>r.B))];
  const byT=Ts.length>=Bs.length, ser=[];
  (byT?Bs:Ts).forEach((v,i)=>{ const rs=rows.filter(r=>(byT?r.B:r.T)===v).sort((a,b)=>byT?a.T-b.T:a.B-b.B);
    ser.push({x:rs.map(r=>byT?r.T:r.B),y:rs.map(r=>r[k]),color:COLS[i%6],label:(byT?"B = ":"T = ")+v,lw:1.4});
    ser.push({x:rs.map(r=>byT?r.T:r.B),y:rs.map(r=>r[k]),color:COLS[i%6],mode:"dot",r:2.6}); });
  plotXY($("plot"),ser,{xl:byT?"T":"B",yl:$("ax").selectedOptions[0].text,aspect:0.42}); }
$("run").onclick=async()=>{ if(busy) return;
  const Ts=parseList($("Tl").value).filter(t=>t>0), Bs=parseList($("Bl").value);
  const L=Math.max(4,Math.min(200,parseInt($("L").value)||50)), ns=Math.max(0,Math.min(5e7,parseInt($("ns").value)||0)), nm=Math.max(0,Math.min(5e7,parseInt($("nm").value)||0));
  if(!Ts.length||!Bs.length) return;
  busy=true; $("run").disabled=true; rows=[]; $("grids").innerHTML=""; const total=Ts.length*Bs.length;
  for(const B of Bs) for(const Tt of Ts){
    $("stat").textContent=T[lang].busy+" "+(rows.length+1)+"/"+total; await new Promise(r=>setTimeout(r,0));
    const r=ising(L,Tt,B,ns,nm); rows.push(r); if(rows.length<=36) $("grids").appendChild(paint(r));
    $("out").textContent=text(); }
  $("stat").textContent=rows.length+T[lang].runs+"  ·  L = "+L+", n_steps = "+ns; draw(); busy=false; $("run").disabled=false; };
$("ax").onchange=draw;
$("copy").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(text());
$("csv").onclick=()=>rows.length&&download("ising.csv",text(),"text/csv");
function onLang(){ if(rows.length&&!busy) $("stat").textContent=rows.length+T[lang].runs; }
addEventListener("resize",draw);
applyLang(); $("run").click();
</script>
  <script src="adfit.js"></script>
</body>
</html>
