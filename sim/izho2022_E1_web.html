var PROGRAM = {
  title: { ko: 'IZhO 2022 실험 1 — 미끄럼 마찰', en: 'IZhO 2022 Experiment 1 — Sliding friction' },
  subtitle: { ko: '기울기를 마음대로 바꿀 수 있는 넓은 강철판(각도 설정 오차 0.2°) 위로 속이 찬 쇠 원기둥이 축을 수평으로 한 채 굴러 내려갑니다. 판에 붙은 광센서 0, 1, 2 가 전자 스톱워치를 움직입니다 — 0 을 지날 때 시작, 1 과 2 를 지나는 시각 t₁, t₂ 를 기록합니다. S₁ = 50.0 ± 0.2 cm, S₂ = 100.0 ± 0.2 cm, g = 9.81 m/s².',
              en: 'A solid steel cylinder rolls down a wide steel plate (its tilt set to within 0.2°) with its axis horizontal. Optical sensors 0, 1, 2 on the plate drive an electronic stopwatch: it starts at sensor 0 and records the times t₁, t₂ at sensors 1 and 2. S₁ = 50.0 ± 0.2 cm, S₂ = 100.0 ± 0.2 cm, g = 9.81 m/s².' },
  notes: { ko: [
    '과제: 1.1 미끄러지지 않을 때 a₁ = (2/3)g sinα, 미끄러질 때 a₂ = g(sinα − μ cosα). 1.2 임계각 tan α_cr = 3μ. 1.3 a = 2(S₂t₁ − S₁t₂)/(t₁t₂(t₂ − t₁)), a(α) 그래프와 대략의 α_cr. 1.4 직선화 Y(X), 예: Y = a/(g cosα), X = tanα. 1.5 μ 와 오차. 1.6 α_cr 와 오차.',
    '공식 해답(문제지의 표 1): 20° 에서 t₁ = 0.4546 s, t₂ = 0.7187 s … 75° 에서 0.2218, 0.3542 s. 미끄러지지 않을 때 기울기 0.659 ≈ 2/3, 미끄러질 때 절편 −μ: μ = 0.38 ± 0.02, α_cr = arctan 3μ = 49 ± 2°.',
    '실행마다 마찰이 몇 % 흩어집니다(공식 자료처럼). 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 without slipping a₁ = (2/3)g sinα, with slipping a₂ = g(sinα − μ cosα). 1.2 the critical angle tan α_cr = 3μ. 1.3 a = 2(S₂t₁ − S₁t₂)/(t₁t₂(t₂ − t₁)), a graph of a(α) and a rough α_cr. 1.4 a linearization Y(X), e.g. Y = a/(g cosα), X = tanα. 1.5 μ with its error. 1.6 α_cr with its error.',
    'Official solution (the sheet\'s table 1): t₁ = 0.4546 s, t₂ = 0.7187 s at 20° … 0.2218, 0.3542 s at 75°. Without slipping the slope is 0.659 ≈ 2/3, with slipping the intercept is −μ: μ = 0.38 ± 0.02, α_cr = arctan 3μ = 49 ± 2°.',
    'The friction scatters by a few % from run to run (as in the official data). The values differ a little from visit to visit.'] }
};

var LAB = { th: 20, s: 12, v: 0, a: 0, run: false, held: true, sStart: 12, t0: null, t1: null, t2: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 경첩으로 기울이는 강철판(옆에 각도기), 판 위의 광센서 0, 1, 2(광원과 광검출기 기둥 한 쌍씩), 쇠 원기둥, 전자 스톱워치.',
           en: 'On the desk: the steel plate tilting on its hinge (a protractor beside it), optical sensors 0, 1, 2 on the plate (a light source and a photodetector post each), the steel cylinder and the electronic stopwatch.' },
  howto: { ko: ['판 위에서 휠: 기울기 0.5° 씩 (Shift: 0.05°) · 각도기 클릭: 가까이',
                '원기둥 클릭: 놓기 / 굴러간 뒤 클릭하면 출발점으로 · 잡고 있을 때 원기둥 위에서 휠: 출발점을 판 위아래로',
                '스톱워치 클릭: 가까이 — RESET 으로 지우기 (0 을 지나면 저절로 시작)'],
           en: ['Wheel over the plate: tilt by 0.5° (Shift: 0.05°) · click the protractor: close up',
                'Click the cylinder: release it / after a run, click it to put it back at the start · wheel over the held cylinder: move the start up or down the plate',
                'Click the stopwatch: close up — RESET clears it (it starts itself at sensor 0)'] },
  notePlaceholder: { ko: '예) 20.0°: t₁ = 0.4551 s, t₂ = 0.7193 s …', en: 'e.g. 20.0°: t₁ = 0.4551 s, t₂ = 0.7193 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var MU = 0.38 * (1 + S.sys('mu', 0.04)), G = 981, RC = 2.0, LP = 130, S0 = 20, S1 = 70, S2 = 120, HX = 40;
    var prot = (function () { var c = document.createElement('canvas'); c.width = c.height = 400; c._static = true; var g = c.getContext('2d');
      g.fillStyle = 'rgba(240,242,236,.92)'; g.beginPath(); g.moveTo(400, 400); g.arc(400, 400, 396, Math.PI, 1.5 * Math.PI); g.closePath(); g.fill(); g.strokeStyle = '#222'; g.fillStyle = '#222'; g.textAlign = 'center'; g.font = '700 16px sans-serif';
      for (var i = 0; i <= 90; i++) { var a = Math.PI + i * Math.PI / 180, r1 = i % 10 === 0 ? 340 : i % 5 === 0 ? 360 : 375; g.lineWidth = i % 10 === 0 ? 2 : 1;
        g.beginPath(); g.moveTo(400 + Math.cos(a) * r1, 400 + Math.sin(a) * r1); g.lineTo(400 + Math.cos(a) * 394, 400 + Math.sin(a) * 394); g.stroke();
        if (i % 10 === 0) g.fillText(String(i), 400 + Math.cos(a) * 318, 405 + Math.sin(a) * 318); } return c; })();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, speeds: [1, 0.25], wheelIds: ['plate', 'cyl'],
      home: { yaw: -0.15, pitch: 0.3, k: 5.2, tx: -5, ty: 40, tz: 0 },
      views: { prot: { yaw: 0, pitch: 0.02, k: 14, tx: HX - 20, ty: 22, tz: 0, title: { ko: '각도기', en: 'Protractor' } },
               clk: { yaw: 0, pitch: 1.2, k: 40, tx: 60, ty: 3, tz: 14, title: { ko: '전자 스톱워치', en: 'Electronic stopwatch' } } },
      frame: function (b) {
        var wp = b.wheel('plate'); if (wp && !LAB.run) { LAB.th = Math.max(0, Math.min(80, Math.round((LAB.th + wp * 0.5) * 100) / 100)); }
        var wc = b.wheel('cyl'); if (wc && LAB.held) { LAB.sStart = Math.max(RC, Math.min(S0 - RC - 0.5, LAB.sStart - wc * 0.5)); LAB.s = LAB.sStart; }
        if (b.clicked('m:cyl')) {
          if (LAB.held) { var th = LAB.th * Math.PI / 180, mu = MU * (1 + HL.gauss(0.035));
            LAB.a = Math.tan(th) <= 3 * mu ? 2 / 3 * G * Math.sin(th) : G * (Math.sin(th) - mu * Math.cos(th)); LAB.held = false; LAB.run = true; LAB.v = 0; LAB.T = 0; }
          else { LAB.held = true; LAB.run = false; LAB.s = LAB.sStart; } }
        if (b.clicked('c:prot')) b.go('prot');
        if (LAB.run && b.dt > 0) { var n = Math.ceil(b.dt / 0.0005), h = b.dt / n;
          for (var i = 0; i < n; i++) { var sp = LAB.s; LAB.v += LAB.a * h; LAB.s += LAB.v * h; LAB.T += h;
            [[S0, 't0'], [S1, 't1'], [S2, 't2']].forEach(function (q) { var x = q[0] - RC; if (sp < x && LAB.s >= x) { var tc = LAB.T - h * (LAB.s - x) / (LAB.s - sp);
              if (q[1] === 't0') { if (LAB.t0 === null) LAB.t0 = tc; } else if (LAB.t0 !== null && LAB[q[1]] === null) LAB[q[1]] = Math.round((tc - LAB.t0) * 1e4 + HL.gauss(1)) / 1e4; } });
            if (LAB.s >= LP - RC - 1) { LAB.s = LP - RC - 1; LAB.run = false; LAB.v = 0; break; } } }
        var th2 = LAB.th * Math.PI / 180, u = [Math.cos(th2), -Math.sin(th2), 0], nrm = [Math.sin(th2), Math.cos(th2), 0];
        var P = function (s, hgt, z) { return [HX - (LP - s) * u[0] + hgt * nrm[0], 1 - (LP - s) * u[1] + hgt * nrm[1], z]; };
        B3.desk(-90, 80, -20, 24);
        /* the hinge block and the plate */
        B3.box3(HX - 2, HX + 6, 0, 1.6, -12, 12, '#3a3f46', { top: '#474c55' });
        B3.obox(P(LP / 2, -0.3, 0), u, nrm, LP / 2, 0.3, 11, '#9aa0a6', { id: 'm:plate', top: '#b5bbc1' });
        B3.obox(P(LP - 0.5, 1.2, 0), u, nrm, 0.5, 1.2, 11, '#3a3f46');
        /* the prop under the raised end */
        var top = P(0, -0.6, 0); if (top[1] > 1) { B3.cylAB([top[0], 0, -9], [top[0], top[1], -9], 0.6, '#5b6168', { seg: 10 }); B3.cylAB([top[0], 0, 9], [top[0], top[1], 9], 0.6, '#5b6168', { seg: 10 }); }
        B3.tex3(prot, 0, 0, 400, 400, [HX - 40, 41, -12.5], [40, 0, 0], [0, -40, 0], { id: 'c:prot' });
        B3.line3([HX, 1, -12.6], [HX - 42 * u[0], 1 - 42 * u[1], -12.6], '#c0392b', 2);
        /* sensors: two posts each, the beam across the plate at the cylinder's axis height */
        [[S0, '0'], [S1, '1'], [S2, '2']].forEach(function (q) { var a = P(q[0], 0, -8), c = P(q[0], 0, 8), lit = Math.abs(LAB.s - q[0]) < RC;
          B3.cylAB(a, P(q[0], 4.5, -8), 0.7, '#2b2f35', { seg: 10, cap: '#3a3f46' }); B3.cylAB(c, P(q[0], 4.5, 8), 0.7, '#2b2f35', { seg: 10, cap: '#3a3f46' });
          B3.line3(P(q[0], RC, -7.3), P(q[0], RC, 7.3), lit ? 'rgba(255,60,60,.25)' : 'rgba(255,60,60,.8)', 1.2);
          var lp = P(q[0], 5.2, -8); B3.text3([lp[0], lp[1] + 0.6, lp[2]], [1, 0, 0], [0, 1, 0], q[1], 1.4, '#ffd479', { weight: '800' }); });
        /* the cylinder */
        var cc = P(LAB.s, RC, 0), ang = -LAB.s / RC;
        B3.cyl3('z', -3, 3, cc[0], cc[1], RC, '#8d949c', { seg: 22, cap: '#a7aeb6', id: 'm:cyl' });
        B3.line3([cc[0], cc[1], 3.02], [cc[0] + Math.cos(ang) * RC * 0.9, cc[1] + Math.sin(ang) * RC * 0.9, 3.02], '#2b2f35', 2);
        /* the electronic stopwatch */
        B3.box3(52, 68, 0, 4, 9, 19, '#2b2f35', { top: '#33373e', id: 'p:clk' });
        var cv = b.panel('clk', 320, 200, function (ui) { var g = ui.g; HL.rr(g, 0, 0, 320, 200, 10, '#33373e');
          HL.rr(g, 16, 16, 288, 110, 6, '#0d1210'); var f = function (v) { return v === null ? '-.----' : v.toFixed(4); };
          HL.text(g, 't₁ = ' + f(LAB.t1) + ' s', 30, 46, '#ff6a4a', 28, 'left', '700', HL.MONO); HL.text(g, 't₂ = ' + f(LAB.t2) + ' s', 30, 96, '#ff6a4a', 28, 'left', '700', HL.MONO);
          if (LAB.t0 !== null && LAB.t2 === null) HL.text(g, 'RUN', 296, 26, '#4ec9b0', 12, 'right', '800');
          var r = HL.button(ui, 'rst', 110, 142, 100, 40, { label: 'RESET', col: '#b83a32', size: 14 }); if (r.press) { LAB.t0 = LAB.t1 = LAB.t2 = null; } });
        B3.tex3(cv, 0, 0, cv.width, cv.height, [52.5, 4.01, 9.5], [15, 0, 0], [0, 0, 9], { id: 'p:clk' });
        B3.cable([52, 2, 12], P(S0, 0, 8), '#1b1b1b', 2, 1.6);
        LAB.state = { th: LAB.th, s: LAB.s, a: LAB.a, t1: LAB.t1, t2: LAB.t2, mu: MU };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
