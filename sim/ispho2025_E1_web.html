<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);

  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row button{flex:1;text-align:center;min-width:0}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);
        border:1px solid var(--line);border-radius:6px;padding:6px 0;color:#e8eef2;letter-spacing:.04em}
  .laps{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa3ab;max-height:130px;overflow:auto;margin-top:4px}
  #closeCv{touch-action:none}
  .instr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .instr3 canvas{display:block;width:100%;background:var(--deep);border-radius:6px}
  .ilbl{font-size:12px;color:#f2c14e;font-weight:700;margin:0 0 4px}
  @media(max-width:900px){.instr3{grid-template-columns:1fr}}
  .chklist{font-size:12px;line-height:1.7}
  .chklist div{display:flex;justify-content:space-between;gap:8px;color:#9aa3ab}
  .chklist b{font-weight:600}.chklist .ok{color:#7fd39a}.chklist .no{color:#f0b35a}.chklist .na{color:#5c646d}
button.on{background:#3a3220;border-color:#f2c14e;color:#ffd77a}
  .row button.on{background:#f2c14e;color:#1b1d20;border-color:#f2c14e}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="wrap">
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-cap"></h3>
      <canvas id="cv"></canvas>
    </div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <h3 id="t-closecap"></h3>
      <canvas id="closeCv"></canvas>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-psu"></h2>
    <div class="disp" id="psuV"></div>
    <div class="row"><button id="psuBtn"></button><button id="adBtn"></button></div>
    <div class="row"><button id="vm1">−1</button><button id="vm01">−0.1</button><button id="vm001">−0.01</button><button id="vp001">+0.01</button><button id="vp01">+0.1</button><button id="vp1">+1</button></div>
    <div class="row"><button id="vzero"></button></div>

    <h2 id="t-h-rgb"></h2>
    <div class="row"><button id="rgbR">R</button><button id="rgbG">G</button><button id="rgbB">B</button><button id="rgbO">OFF</button></div>

    <h2 id="t-h-opt"></h2>
    <div class="hint" id="optSel"></div>
    <div class="row"><button id="om1">−1 cm</button><button id="om01">−1 mm</button><button id="op01">+1 mm</button><button id="op1">+1 cm</button></div>

    <h2 id="t-h-m"></h2>
    <div id="mRows"></div>
    <div class="row"><button id="fuseBtn"></button></div>

    <h2 id="t-h-sp"></h2>
    <div class="row"><button id="sp1">×1</button><button id="sp5">×5</button><button id="sp20">×20</button><button id="sp60">×60</button></div>
    <div class="disp" id="swV">0:00.0</div>
    <div class="row"><button id="swGo"></button><button id="swRst"></button></div>

    <h2 id="t-h-note"></h2>
    <div class="row"><input id="cfg" style="flex:1;min-width:0;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:12px ui-monospace,Consolas,monospace"></div>
    <div class="row"><button id="noteBtn"></button><button id="noteClr"></button><button id="noteSave"></button></div>
    <textarea id="note" rows="8" style="width:100%;resize:vertical;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;font:12px/1.5 ui-monospace,Consolas,monospace;padding:6px"></textarea>

    <div class="status" id="status"></div>
  </aside>
</div>

const U=(a,b)=>a+Math.random()*(b-a);

/* the constants as printed on the problem sheet */
const HBAR=1.05e-34, C_LIGHT=3.0e8, K_B=1.38e-23, Q_E=1.602e-19, T_ROOM=298, T_N2=77, THETA_D=500;

/* ══════════════════════════════════════════════════════════════

function linSolve(A,b){ const n=b.length; if(!n) return []; const M=A.map((r,i)=>r.concat([b[i]]));

    const inv=1/M[c][c]; for(let r=c+1;r<n;r++){ const f=M[r][c]*inv; if(!f) continue; const R=M[r], C=M[c]; for(let k=c;k<=n;k++) R[k]-=f*C[k]; } }

const GMIN=1e-13;
function pnLimit(vn,vo,nVT){ const vc=nVT*Math.log(nVT/(Math.SQRT2*1e-30));
  if(vn>vc&&Math.abs(vn-vo)>2*nVT){ if(vo>0){ const a=1+(vn-vo)/nVT; vn=a>0?vo+nVT*Math.log(a):vc; } else vn=nVT*Math.log(Math.max(vn/nVT,1e-12)); }
  if(vn< -20) vn=Math.max(vn,-40); if(vn-vo>0.3) vn=vo+0.3; else if(vo-vn>0.3) vn=vo-0.3; return vn; }
class Net{ constructor(gnd){ this.nodes={}; this.nodes[gnd]=0; this.cnt=1; this.res=[]; this.isrc=[]; this.vsrc=[]; this.di=[]; }
  node(n){ if(!(n in this.nodes)) this.nodes[n]=this.cnt++; return this.nodes[n]; }
  R(a,b,r){ this.res.push([this.node(a),this.node(b),r>0?r:1e-9]); }
  I(a,b,c){ this.isrc.push([this.node(a),this.node(b),c]); }
  V(a,b,e){ this.vsrc.push([this.node(a),this.node(b),e]); return this.vsrc.length-1; }
  D(a,c,Is,nVT,Rsh,Iph){ const d={a:this.node(a),c:this.node(c),Is,nVT,Rsh,Iph,v:0}; this.di.push(d); return d; }
  solve(){ const nn=this.cnt-1, nv=this.vsrc.length, N=nn+nv; if(!N) return []; let x=null, vs=null;
    for(const d of this.di) d.v=d.v0||0;
    for(let it=0;it<400;it++){ const A=Array.from({length:N},()=>new Array(N).fill(0)), b=new Array(N).fill(0);
      const sg=(p,q,g)=>{ const i=p-1, j=q-1; if(i>=0) A[i][i]+=g; if(j>=0) A[j][j]+=g; if(i>=0&&j>=0){ A[i][j]-=g; A[j][i]-=g; } };

      for(let i=0;i<nn;i++) A[i][i]+=GMIN;

      this.vsrc.forEach(([p,q,e],k)=>{ const row=nn+k; if(p>0){ A[row][p-1]+=1; A[p-1][row]+=1; } if(q>0){ A[row][q-1]-=1; A[q-1][row]-=1; } b[row]+=e; });
      for(const d of this.di){ const ex=Math.exp(Math.min(d.v/d.nVT,200)), Id=d.Is*(ex-1)+d.v/d.Rsh-d.Iph; let gd=d.Is*ex/d.nVT+1/d.Rsh; if(gd<1e-15) gd=1e-15; sg(d.a,d.c,gd); si(d.a,d.c,Id-gd*d.v); }

const RANGES={VDC:[["200mV",199.9,1e3,"mV",1],["2V",1.999,1,"V",3],["20V",19.99,1,"V",2],["200V",199.9,1,"V",1],["600V",600,1,"V",0]],

  OHM:[["200",199.9,1,"Ω",1],["2k",1.999,1e-3,"kΩ",3],["20k",19.99,1e-3,"kΩ",2],["200k",199.9,1e-3,"kΩ",1],["2M",1.999,1e-6,"MΩ",3]]};

    if(Math.abs(s)>fs+0.5*lsb) return "1"; let q=Math.round(s/lsb)*lsb; if(Math.abs(q)<0.5*lsb) q=0; return q.toFixed(dec); }

const PARTS=["table","shield","stand","L1","L2","screen","sensor","rgb","rib4","main1","main2","rib2","adapter","r0","psu","m1","m2","wires","water","pipette","clamp","tube","beaker"];
const PSU_MAX=15, PSU_RINT=0.3, PSU_ILIM=1.0;
const ST={ on:new Set(), x:{stand:null,L1:null,L2:null,screen:null},   /* positions along the optical table, cm from its left end */
  inStand:null,                       /* "rgb" | "main1" | "main2" | null */
  cuv:{main1:{med:"air",lvl:0,frost:0,wet:0,dead:false,Tj:T_ROOM,Tp:T_ROOM},main2:{med:"air",lvl:0,frost:0,wet:0,dead:false,Tj:T_ROOM,Tp:T_ROOM}},

const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
const mainIn=()=>ST.inStand&&ST.inStand.startsWith("main")?ST.inStand:null;

/* every terminal on the bench */
function terminals(){ const ts=[]; if(has("psu")) ts.push("PSU.+","PSU.-"); for(const k of [1,2]) if(has("m"+k)) ts.push("M"+k+".HI","M"+k+".LO");
  if(has("r0")) ts.push("R0.A","R0.B"); if(has("adapter")) ts.push("AD.R","AD.K"); return ts; }
function groups(){ const par={}, f=x=>{ if(!(x in par)) par[x]=x; while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  for(const t of terminals()) f(t); for(const [a,b] of ST.wires) if(a in par&&b in par){ const ra=f(a), rb=f(b); if(ra!==rb) par[ra]=rb; } return f; }

function envOf(c){ if(c.med==="water") return {T:T_ROOM,...TRUE.env.water};

    else if(c.frost>0){ c.frost=Math.max(0,c.frost-dt/240); }
    if(id===mainIn()&&led){ if(Math.abs(I)>0.16&&!c.dead){ c.dead=true; say("dead"); }

/* is the optical path complete, and how far is it out of focus (cm)? */

  for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20],["sp60",60]]) $(id).className=ST.speed===s?"on":"";
  const st=ST.sw.t; $("swV").textContent=Math.floor(st/60)+":"+(st%60).toFixed(1).padStart(4,"0"); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.psuOn&&ST.psuCC) L.push([t.st.cc,true]);
  if(Math.abs(ST.I)>0.1) L.push([t.st.hot,true]);
  const c=mainIn()?ST.cuv[mainIn()]:null; if(c&&c.med==="n2"&&c.lvl<0.4) L.push([t.st.n2low,true]); if(c&&c.frost>0.5) L.push([t.st.frost,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-psu","hPsu"],["t-h-rgb","hRgb"],["t-h-opt","hOpt"],["t-h-m","hM"],["t-h-sp","hSp"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"],["vzero","vzero"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now(), dispT=0;
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let rem=dt*ST.speed; while(rem>1e-9){ const h=Math.min(0.25,rem); step(h); rem-=h; }
  dispT-=dt; if(dispT<=0){ dispT=0.4; for(const m of ST.meters) m.shown=m.display(); }
  if(frameN%4===0) drawLaptopScreen();
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
