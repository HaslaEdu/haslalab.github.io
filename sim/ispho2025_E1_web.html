<style>
  /* the ISPhO 2026 look: a light page, the lab in a Windows 10 window with Tk-style group boxes */
  :root{
    --bg:#e8ebee; --panel:#f0f0f0; --ink:#000; --muted:#5b6b7c;
    --line:#dcdcdc; --accent:#2c6f9b; --accent-soft:#e1e1e1; --deep:#fff;

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{color:#000;font:13px/1.45 "Segoe UI",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:14px 16px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:650;color:#000}
  header p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:1200px}
  .lang{display:flex;border:1px solid #c3ccd4;border-radius:6px;overflow:hidden;background:#fff}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:6px 13px;font:600 12px inherit;
               color:var(--muted);background:#fff;cursor:pointer;text-align:center}

  .lang button.on{background:#2c6f9b;color:#fff}

  /* in line with the window's right edge and the title, as on the ISPhO 2026 page */
  body > header > .lang{top:10px;right:16px}

  /* ── the window ── */
  .winwrap{max-width:1680px;margin:12px auto 26px;padding:0 16px}

  .cap .wb{width:46px;height:30px;display:flex;align-items:center;justify-content:center}
  .cap .wb:hover{background:#e5e5e5}
  .cap .wb.x:hover{background:#e81123}
  .cap .wb.x:hover svg path{stroke:#fff}
  .wrap{padding:10px;display:flex;gap:10px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }

  /* group boxes: a thin border with the caption cut into its top edge */
  .tray,.card,.panel{background:#f0f0f0;border:1px solid #dcdcdc;border-radius:0;position:relative}

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (SI units unless marked)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const gauss=(m,s)=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
/* the constants as printed on the problem sheet */
const HBAR=1.05e-34, C_LIGHT=3.0e8, K_B=1.38e-23, Q_E=1.602e-19, T_ROOM=298, T_N2=77, THETA_D=500;
const NPIX=3650;
const TRUE=(()=>{ const t={};
  /* band gap, eq. (1): Eg(T) = E0 (1 - alpha T^2/(theta+T)) */
  t.lamRoom=U(586,595)*1e-9; t.alpha=U(3.45e-4,4.10e-4);
  t.E0=(2*Math.PI*HBAR*C_LIGHT/t.lamRoom)/(1-t.alpha*T_ROOM*T_ROOM/(THETA_D+T_ROOM));
  /* the junction: I = I0(T) (exp(eU/(eta kT)) - 1), eta(T) = eta_r (T0/T)^p, a series resistance */
  t.etaR=U(1.95,2.15); t.etaP=U(0.78,0.86);
  t.Iref=U(0.7e-5,1.4e-5);                                 /* the current at 1.60 V, cold junction at T0 */
  t.lnI0r=Math.log(t.Iref)-1.60*Q_E/(t.etaR*K_B*T_ROOM);
  t.beta=U(0.18,0.20);                                     /* d ln I0 / dT near room temperature, 1/K: I0 grows ~6.7x per 10 K (official solution, F3) */
  { const eta77=t.etaR*Math.pow(T_ROOM/T_N2,t.etaP), ln77=Math.log(U(3.5e-7,9e-7))-2.10*Q_E/(eta77*K_B*T_N2), d=T_N2-T_ROOM;
    t.gamma=(ln77-t.lnI0r-t.beta*d)/(d*d); }
  t.RsR=U(4.0,5.0); t.Rsh=U(4e8,9e8); t.Iamb=U(2e-11,5e-11); t.Istray=U(1.5e-10,3.5e-10);
  t.pol=Math.random()<0.5?1:-1;                            /* which adapter socket goes to the anode */
  /* heat: junction -> package (fast), package -> surroundings (slow) */
  t.Rjp=U(170,230); t.Cj=U(0.004,0.006);
  t.env={air:{g:1/U(235,280),C:U(0.16,0.20)},water:{g:1/U(110,135),C:U(0.032,0.040)},n2:{g:1/U(80,100),C:U(0.026,0.034)}};
  t.eff=U(0.08,0.12); t.effT=U(220,300);                   /* light per ampere, falling as the junction warms */
  t.fwhm=U(24,30)*1e-9; t.fwhmT=U(0.04,0.06)*1e-9;
  /* the image of the chip and its reflector, which the grating smears across the spectrum */
  t.lobes=[[0,1],[U(-9,-5),U(0.22,0.38)],[U(4,8),U(0.15,0.30)]];
  t.R0=U(45.5,46.8); t.RV=U(0.988,1.000)*1e6; t.RV200m=-U(0.0005,0.0015)*1e6;
  /* the RGB LED: its true peaks (the sheet only quotes 620, 520 and 460 nm) */
  t.rgb={R:[U(618,624),U(15,19)],G:[U(514,522),U(30,36)],B:[U(461,469),U(22,27)]};
  /* the spectrometer */
  t.F1=U(11.6,12.4); t.F2=U(11.6,12.4);                    /* cm */
  t.slope0=-0.102*U(0.97,1.03); t.shift0=U(702,718);       /* nm per pixel at focus, nm at pixel 0 */
  t.dark=U(3,6); t.ron=U(0.8,1.4);
  t.n2rate=U(1/110,1/80);                                  /* fraction of the cuvette's nitrogen boiling off per second */
  return t; })();
/* the photon wavelength at junction temperature T (m) */
const Eg=T=>TRUE.E0*(1-TRUE.alpha*T*T/(THETA_D+T));
const lamOf=T=>2*Math.PI*HBAR*C_LIGHT/Eg(T);
const etaOf=T=>TRUE.etaR*Math.pow(T_ROOM/T,TRUE.etaP);
const lnI0=T=>{ const d=T-T_ROOM; return TRUE.lnI0r+TRUE.beta*d+TRUE.gamma*d*d; };
const RsOf=T=>TRUE.RsR*(1+0.25*Math.exp(-(T-T_N2)/60));

/* ══════════════════════════════════════════════════════════════
   2.  A SMALL NODAL SOLVER WITH REAL PN JUNCTIONS
   ══════════════════════════════════════════════════════════════ */
function linSolve(A,b){ const n=b.length; if(!n) return []; const M=A.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<n;c++){ let p=c, pv=Math.abs(M[c][c]); for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>pv){ p=r; pv=Math.abs(M[r][c]); }
    if(pv<1e-18) return null; if(p!==c){ const q=M[c]; M[c]=M[p]; M[p]=q; }
    const inv=1/M[c][c]; for(let r=c+1;r<n;r++){ const f=M[r][c]*inv; if(!f) continue; const R=M[r], C=M[c]; for(let k=c;k<=n;k++) R[k]-=f*C[k]; } }
  const x=new Array(n).fill(0); for(let r=n-1;r>=0;r--){ let s=M[r][n]; for(let k=r+1;k<n;k++) s-=M[r][k]*x[k]; x[r]=s/M[r][r]; } return x; }
const GMIN=1e-13;
function pnLimit(vn,vo,nVT){ const vc=nVT*Math.log(nVT/(Math.SQRT2*1e-30));
  if(vn>vc&&Math.abs(vn-vo)>2*nVT){ if(vo>0){ const a=1+(vn-vo)/nVT; vn=a>0?vo+nVT*Math.log(a):vc; } else vn=nVT*Math.log(Math.max(vn/nVT,1e-12)); }
  if(vn< -20) vn=Math.max(vn,-40); if(vn-vo>0.3) vn=vo+0.3; else if(vo-vn>0.3) vn=vo-0.3; return vn; }
class Net{ constructor(gnd){ this.nodes={}; this.nodes[gnd]=0; this.cnt=1; this.res=[]; this.isrc=[]; this.vsrc=[]; this.di=[]; }
  node(n){ if(!(n in this.nodes)) this.nodes[n]=this.cnt++; return this.nodes[n]; }
  R(a,b,r){ this.res.push([this.node(a),this.node(b),r>0?r:1e-9]); }
  I(a,b,c){ this.isrc.push([this.node(a),this.node(b),c]); }
  V(a,b,e){ this.vsrc.push([this.node(a),this.node(b),e]); return this.vsrc.length-1; }
  D(a,c,Is,nVT,Rsh,Iph){ const d={a:this.node(a),c:this.node(c),Is,nVT,Rsh,Iph,v:0}; this.di.push(d); return d; }
  solve(){ const nn=this.cnt-1, nv=this.vsrc.length, N=nn+nv; if(!N) return []; let x=null, vs=null;
    for(const d of this.di) d.v=d.v0||0;
    for(let it=0;it<400;it++){ const A=Array.from({length:N},()=>new Array(N).fill(0)), b=new Array(N).fill(0);
      const sg=(p,q,g)=>{ const i=p-1, j=q-1; if(i>=0) A[i][i]+=g; if(j>=0) A[j][j]+=g; if(i>=0&&j>=0){ A[i][j]-=g; A[j][i]-=g; } };
      const si=(p,q,c)=>{ const i=p-1, j=q-1; if(i>=0) b[i]-=c; if(j>=0) b[j]+=c; };
      for(let i=0;i<nn;i++) A[i][i]+=GMIN;
      for(const [p,q,r] of this.res) sg(p,q,1/r);
      for(const [p,q,c] of this.isrc) si(p,q,c);
      this.vsrc.forEach(([p,q,e],k)=>{ const row=nn+k; if(p>0){ A[row][p-1]+=1; A[p-1][row]+=1; } if(q>0){ A[row][q-1]-=1; A[q-1][row]-=1; } b[row]+=e; });
      for(const d of this.di){ const ex=Math.exp(Math.min(d.v/d.nVT,200)), Id=d.Is*(ex-1)+d.v/d.Rsh-d.Iph; let gd=d.Is*ex/d.nVT+1/d.Rsh; if(gd<1e-15) gd=1e-15; sg(d.a,d.c,gd); si(d.a,d.c,Id-gd*d.v); }
      x=linSolve(A,b); if(!x) return null; vs=[0]; for(let i=1;i<=nn;i++) vs.push(x[i-1]);
      if(!this.di.length) break; let worst=0;
      for(const d of this.di){ const vn=pnLimit(vs[d.a]-vs[d.c],d.v,d.nVT); worst=Math.max(worst,Math.abs(vn-d.v)); d.v=vn; }
      if(worst<1e-11) break; }
    this.vs=vs; this.x=x; this.nn=nn; return vs; }
  v(n){ return this.vs[this.nodes[n]]; }
  isrcOf(k){ return this.x[this.nn+k]; } }

/* ══════════════════════════════════════════════════════════════
   3.  MULTIMETERS  (3½ digits, 1999 counts, ~1 MΩ input on DC volts)
   ══════════════════════════════════════════════════════════════ */
const RANGES={VDC:[["200mV",199.9,1e3,"mV",1],["2V",1.999,1,"V",3],["20V",19.99,1,"V",2],["200V",199.9,1,"V",1],["600V",600,1,"V",0]],
  ADC:[["2000µA",1999,1e6,"µA",0],["20mA",19.99,1e3,"mA",2],["200mA",199.9,1e3,"mA",1],["10A",9.99,1,"A",2]],
  OHM:[["200",199.9,1,"Ω",1],["2k",1.999,1e-3,"kΩ",3],["20k",19.99,1e-3,"kΩ",2],["200k",199.9,1e-3,"kΩ",1],["2M",1.999,1e-6,"MΩ",3]]};
const SHUNT={"2000µA":100,"20mA":10,"200mA":1,"10A":0.01}, FUSED={"2000µA":1,"20mA":1,"200mA":1,"10A":0};
const ITEST={"200":1e-3,"2k":1e-4,"20k":1e-5,"200k":1e-6,"2M":1e-7};
const FUSE_A=0.25;
TRUE.gain=[0,1].map(()=>1+U(-0.0012,0.0012)); TRUE.off=[0,1].map(()=>U(-0.6,0.6)); TRUE.rv=[0,1].map(()=>1+U(-0.004,0.004));
class DMM{ constructor(i){ this.i=i; this.mode="OFF"; this.range="20V"; this.fuse=true; this.value=null; this.shown=""; }
  modes(){ return ["OFF","VDC","ADC","OHM"]; }
  rl(){ return RANGES[this.mode]||[]; }
  rangeNames(){ return this.rl().map(r=>r[0]); }
  active(){ const rl=this.rl(); if(!rl.length) return null; return rl.find(r=>r[0]===this.range)||rl[1]||rl[0]; }
  rIn(){ const r=this.active(); return (TRUE.RV+(r&&r[0]==="200mV"?TRUE.RV200m:0))*TRUE.rv[this.i]; }
  shunt(){ const r=this.active(); return SHUNT[r?r[0]:"200mA"]||1; }
  display(){ if(this.mode==="OFF") return ""; if(this.mode==="ADC"&&!this.fuse) return "0"; const v=this.value; const r=this.active(); if(!r) return "";
    const [,fs,fac,,dec]=r, lsb=Math.pow(10,-dec); if(v===null) return "1";
    let s=v*fac*TRUE.gain[this.i]+TRUE.off[this.i]*lsb+gauss(0,0.3*lsb);
    if(Math.abs(s)>fs+0.5*lsb) return "1"; let q=Math.round(s/lsb)*lsb; if(Math.abs(q)<0.5*lsb) q=0; return q.toFixed(dec); }
  unit(){ const r=this.active(); return r?r[3]:""; } }

const ledLinked=()=>!!mainIn()&&has("rib2")&&has("adapter")&&ST.adSw&&!ST.cuv[mainIn()].dead;

/* every terminal on the bench */
function terminals(){ const ts=[]; if(has("psu")) ts.push("PSU.+","PSU.-"); for(const k of [1,2]) if(has("m"+k)) ts.push("M"+k+".HI","M"+k+".LO");
  if(has("r0")) ts.push("R0.A","R0.B"); if(has("adapter")) ts.push("AD.R","AD.K"); return ts; }
function groups(){ const par={}, f=x=>{ if(!(x in par)) par[x]=x; while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  for(const t of terminals()) f(t); for(const [a,b] of ST.wires) if(a in par&&b in par){ const ra=f(a), rb=f(b); if(ra!==rb) par[ra]=rb; } return f; }
let LASTV=0;
function solveCircuit(){ const f=groups(), g=t=>"N"+f(t), ts=terminals(); const c=mainIn()?ST.cuv[mainIn()]:null;
  const gnd=has("psu")?g("PSU.-"):"GND", nl=new Net(gnd); for(const t of ts) nl.node(g(t));
  let led=null;
  if(c&&ledLinked()){ const T=c.Tj, nVT=etaOf(T)*K_B*T/Q_E, Is=Math.exp(lnI0(T)), [an,ca]=TRUE.pol>0?["AD.R","AD.K"]:["AD.K","AD.R"];
    const iph=TRUE.Iamb+(has("shield")?0:TRUE.Istray);
    nl.R(g(an),"LEDJ",RsOf(T)); const dd=nl.D("LEDJ",g(ca),Is,nVT,TRUE.Rsh,iph); dd.v0=LASTV; led={an:g(an),j:"LEDJ",ca:g(ca),dd,T}; }
  if(has("r0")) nl.R(g("R0.A"),g("R0.B"),TRUE.R0);
  let vk=null; if(has("psu")&&ST.psuOn){ vk=nl.V("PSUINT",gnd,ST.psuV); nl.R("PSUINT",g("PSU.+"),PSU_RINT); }
  for(const k of [1,2]){ if(!has("m"+k)) continue; const m=ST.meters[k-1], hi=g("M"+k+".HI"), lo=g("M"+k+".LO");
    if(m.mode==="VDC") nl.R(hi,lo,m.rIn()); else if(m.mode==="ADC") nl.R(hi,lo,m.fuse?m.shunt():1e9);
    else if(m.mode==="OHM"){ nl.I(lo,hi,ITEST[m.range]||1e-5); nl.R(hi,lo,1e11); } }
  let E=ST.psuV;
  for(let r=0;r<6;r++){ if(vk!==null) nl.vsrc[vk][2]=E; if(!nl.solve()) return null; if(vk===null) break;
    const cur=-nl.isrcOf(vk); ST.psuI=cur; if(cur<=PSU_ILIM+1e-6||E<=1e-4){ ST.psuCC=false; break; } ST.psuCC=true; E=Math.max(0,E-0.6*(cur-PSU_ILIM)*(PSU_RINT+2)); }

  poly([D(0,0),D(1,0),D(1,1),D(0,1)],vgrad(hy,dh,[[0,"#b9bdc3"],[1,"#d4d7dc"]]),"#8e939a",1);
  poly([D(0,1),D(1,1),[D(1,1)[0]-4,D(1,1)[1]+8],[D(0,1)[0]+4,D(0,1)[1]+8]],"#9a9ea5");
  fillR(cx-26,D(0,1)[1]+1,52,4,2,"#868a91");
  /* keyboard well and keys */
  const kb0=0.07, kb1=0.62, kx0=0.08, kx1=0.92; poly([D(kx0,kb0),D(kx1,kb0),D(kx1,kb1),D(kx0,kb1)],"#2a2c30");
  const rows=[14,14,14,13,12,9];
  rows.forEach((n,r)=>{ const f0=kb0+0.012+(r/6)*(kb1-kb0-0.02), f1=f0+(kb1-kb0-0.02)/6-0.012;
    let keys; if(r===5) keys=[1,1,1,1,5,1,1,1,1.2]; else if(r===0) keys=Array(14).fill(1); else keys=Array(n).fill(1).map((x,i)=>i===n-1?1+(14-n)*1.0:x);
    const tot=keys.reduce((a,b)=>a+b,0); let acc=0;
    keys.forEach((u,i)=>{ const a=kx0+0.012+(acc/tot)*(kx1-kx0-0.024), b=kx0+0.012+((acc+u)/tot)*(kx1-kx0-0.024)-0.006; acc+=u;
      const P=[D(a,f0),D(b,f0),D(b,f1),D(a,f1)], pw=r===0&&i===13; poly(P,pw&&hvK()?"#4a4e55":"#1a1b1e","#3d4046",0.8);
      if(pw){ const c2=[(P[0][0]+P[2][0])/2,(P[0][1]+P[2][1])/2]; ctx.strokeStyle="#c9ccd1"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(c2[0],c2[1]+0.5,2.6,-Math.PI*0.3,Math.PI*1.3); ctx.moveTo(c2[0],c2[1]-3); ctx.lineTo(c2[0],c2[1]); ctx.stroke();
        LAP_PWR=[Math.min(P[0][0],P[3][0]),P[0][1],Math.max(P[1][0],P[2][0])-Math.min(P[0][0],P[3][0]),P[3][1]-P[0][1]]; } }); });

  poly([D(0.36,0.69),D(0.64,0.69),D(0.645,0.95),D(0.355,0.95)],"#c6c9ce","#9fa4ab",1); }
let LAP_PWR=null;

    const vis=tab==="prog"&&w&&!w.min&&osTop()===w&&w._cr&&LAP_R&&!OS.start&&!OS.fly&&!OS.menu&&!OS.drag&&!OS.off&&!OS.sleep&&up&&closeCv.offsetParent!==null;
    if(!vis){ BR[a].place(0,0,0,0,false); continue; }
    const r=closeCv.getBoundingClientRect(), s=OSXF.s, [cx,cy,cw,ch]=w._cr, x0=Math.max(0,cx), y0=Math.max(0,cy), x1=Math.min(VW,cx+cw), y1=Math.min(VH-TBH,cy+ch);
    BR[a].place(r.left+scrollX+OSXF.ox+x0*s, r.top+scrollY+OSXF.oy+y0*s, (x1-x0)*s, (y1-y0)*s, x1>x0&&y1>y0, s); } }

function lapDown(p,right){ if(LAP_PWR&&!right&&p[0]>=LAP_PWR[0]&&p[0]<=LAP_PWR[0]+LAP_PWR[2]&&p[1]>=LAP_PWR[1]&&p[1]<=LAP_PWR[1]+LAP_PWR[3]){
    if(OS.off){ OS.off=false; OS.boot=performance.now()+1600; } else if(OS.sleep) OS.sleep=false; else { OS.sleep=true; OS.start=null; OS.fly=null; OS.menu=null; } return; }
  if(LAP_R&&p[0]>=LAP_R.x&&p[0]<=LAP_R.x+LAP_R.w&&p[1]>=LAP_R.y&&p[1]<=LAP_R.y+LAP_R.h) osDown(p,right); }

closeCv.addEventListener("contextmenu",e=>e.preventDefault());

let cdrag=null;
function saveText(name,txt){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved"); }
function progBtn(k){
  if(!has("sensor")){ say("sensorNo"); return; }

  else if(k==="ts"){ if(SPEC.ts){ SPEC.tsDone=SPEC.ts; SPEC.ts=null; return; } if(!SPEC.live){ say("noLaunch"); return; } SPEC.ts=[]; SPEC.t0=ST.t; SPEC.next=ST.t; }
  else if(k==="saveTS"){ const ts=SPEC.ts||SPEC.tsDone; if(!ts||!ts.length){ say("noTS"); return; } const rows=["t_s,"+Array.from({length:NPIX},(_,n)=>"N"+n).join(",")];
    for(const [t,f] of ts) rows.push(t.toFixed(2)+","+Array.prototype.join.call(f,",")); saveText("time_series.csv",rows.join("\n")+"\n"); }
  else if(k==="sm") ST.sens=Math.max(1,ST.sens-1); else if(k==="sp") ST.sens=Math.min(8,ST.sens+1); }
function setDial(k,i){ const m=ST.meters[k-1], s=DIAL[i]; if(s==="OFF"){ m.mode="OFF"; } else { const [md,r]=s.split(":"); m.mode=md; m.range=r; } m.shown=""; step(0); m.shown=m.display(); }
closeCv.addEventListener("wheel",e=>{ if(tab==="prog"&&!inProg(clpos(e))){ if(osWheel(clpos(e),e.deltaY)) e.preventDefault(); return; } if(tab!=="prog"||!PROG_AREA||!inProg(clpos(e))) return; e.preventDefault(); const p=clpos(e), [x0,,w]=PROG_AREA, f=(p[0]-x0)/w, c=PV.n0+f*(PV.n1-PV.n0), span=Math.max(20,Math.min(NPIX,(PV.n1-PV.n0)*(e.deltaY<0?1/1.25:1.25)));
  PV.n0=c-f*span; PV.n1=PV.n0+span; if(PV.n0<0){ PV.n1-=PV.n0; PV.n0=0; } if(PV.n1>NPIX){ PV.n0-=PV.n1-NPIX; PV.n1=NPIX; } PV.n0=Math.max(0,PV.n0); },{passive:false});

closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(tab==="prog"){ closeCv.style.cursor=osCursor(cmouse); if(osMove(cmouse)) return; } else closeCv.style.cursor=""; if(!cdrag) return;
  if(cdrag.k==="opt"){ const {sc}=OXY(); const t=Math.max(1,Math.min(TBL_L-1,Math.round((cdrag.t0+(cmouse[0]-cdrag.x)/sc)*10)/10)); ST.x[cdrag.item]=t; cdrag.moved=true; }
  else if(cdrag.k==="pan"&&PROG_AREA){ const span=PV.n1-PV.n0, dn=-(cmouse[0]-cdrag.x)/PROG_AREA[2]*span; PV.n0=Math.max(0,Math.min(NPIX-span,cdrag.n0+dn)); PV.n1=PV.n0+span; } });
closeCv.addEventListener("pointerup",e=>{ if(tab==="prog") osUp(clpos(e)); if(cdrag&&cdrag.k==="opt"&&cdrag.moved&&cdrag.item==="stand") nudgeStand(0.6); cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2; closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="prog"){ OS.kb=true; OS.kbMod=e.ctrlKey||e.metaKey; lapDown(p,right); return; }
  if(tab==="opt"){ if(h&&h.k.startsWith("o:")){ OSEL=h.k.slice(2); cdrag={k:"opt",item:OSEL,x:p[0],t0:ST.x[OSEL],moved:false}; } return; }
  if(tab==="wire"){
    if(right){ let bi=-1, bd=16; ST.wires.forEach((w,i)=>{ const m=wMid(i); if(!m) return; const dd=Math.hypot(m[0]-p[0],m[1]-p[1]); if(dd<bd){ bd=dd; bi=i; } });
      if(bi<0&&h&&h.k.startsWith("t:")){ const n=h.k.slice(2); for(let i=ST.wires.length-1;i>=0;i--) if(ST.wires[i].includes(n)){ bi=i; break; } }
      if(bi>=0){ ST.wires.splice(bi,1); say("unwired"); } WSEL=null; return; }
    if(!h||!h.k.startsWith("t:")){ WSEL=null; return; } const n=h.k.slice(2);
    if(!has("wires")){ say("needFor",itemName("wires")); return; }

let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
$("psuBtn").onclick=()=>{ if(!need("psu")) return; ST.psuOn=!ST.psuOn; };

ST.fuses=3;
for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20],["sp60",60]]) $(id).onclick=()=>{ ST.speed=s; };
$("swGo").onclick=()=>{ ST.sw.run=!ST.sw.run; }; $("swRst").onclick=()=>{ ST.sw.run=false; ST.sw.t=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };

function renderPanel(){ const t=d();
  $("psuV").textContent=!has("psu")?"—":t.knob(ST.psuV,ST.psuOn);
  $("psuBtn").textContent=ST.psuOn?t.psuOn:t.psuOff; $("psuBtn").className=ST.psuOn?"on":"";

  $("fuseBtn").textContent=t.fuseBtn(ST.fuses);
  for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20],["sp60",60]]) $(id).className=ST.speed===s?"on":"";
  const st=ST.sw.t; $("swV").textContent=Math.floor(st/60)+":"+(st%60).toFixed(1).padStart(4,"0"); }
function renderStatus(){ const L=[], t=d();

  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.psuOn&&ST.psuCC) L.push([t.st.cc,true]);
  if(Math.abs(ST.I)>0.1) L.push([t.st.hot,true]);
  const c=mainIn()?ST.cuv[mainIn()]:null; if(c&&c.med==="n2"&&c.lvl<0.4) L.push([t.st.n2low,true]); if(c&&c.frost>0.5) L.push([t.st.frost,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-psu","hPsu"],["t-h-rgb","hRgb"],["t-h-opt","hOpt"],["t-h-m","hM"],["t-h-sp","hSp"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"],["vzero","vzero"]]) $(id).textContent=t[k];

let frameN=0, lastT=performance.now(), dispT=0;
