<body>
<script>
/* NBPhO 2014 problem 5 "Planck's constant" on the 3-D bench.  Six LED boards, numbered 1–6 in an order
   that differs from visit to visit, each LED with a 680 Ω resistor in series; peak wavelengths 940, 620,
   590, 525, 470 and 450 nm.  The LEDs are diodes (B3.Circuit) whose voltage at a few mA is that of real
   LEDs of these colours — about 1.2 V for the infrared one up to about 3 V for the violet — so the
   "simplistic model" Vt = hf/e holds only roughly, as the official solution warns.  The battery pack's
   voltage is unknown (three cells); the ammeter's resistance can be ignored, as the sheet says. */
var PROGRAM = {
  title: { ko: 'NBPhO 2014 실험 5 — 플랑크 상수', en: 'NBPhO 2014 Problem 5 — Planck\'s constant' },
  subtitle: { ko: '단순한 모형에서 발광 다이오드는 켜질 때만 전류가 흐르고 그때 전압 강하가 Vt = E/e = hf/e 로 일정합니다. 680 Ω 직렬 저항이 달린 다이오드 1–6 의 파장을 짝짓고 h 와 그 불확도를 구하세요.',
              en: 'In a simplistic model an LED passes current only when lit, with a constant voltage drop Vt = E/e = hf/e. Match the diodes 1–6 (each with a 680 Ω series resistor) to their wavelengths and find h with its uncertainty.' },
  notes: { ko: [
    '장비: 전압을 모르는 전원(전지), 전류계, 직렬 저항이 달린 발광 다이오드들 (문제지 그대로). 전지와 전류계의 내부 저항은 무시해도 됩니다.',
    '데이터시트의 피크 파장: 940 nm, 620 nm, 590 nm, 525 nm, 470 nm, 450 nm. e = 1.60×10⁻¹⁹ C, c = 3.00×10⁸ m/s.',
    '다이오드는 실제 그 색의 LED 처럼 행동합니다(적외선 약 1.2 V … 보라 약 3 V) — 단순 모형에서 벗어나는 만큼이 불확도의 주된 원인입니다(공식 해답).',
    '다이오드 번호와 파장의 짝, 전지 전압은 방문할 때마다 다릅니다.',
    '<b>전류계로 전지를 바로 단락시키지 마세요.</b>'], en: [
    'Equipment: a voltage source (batteries) of unknown voltage, an ammeter, the LEDs with series resistors (as on the sheet). Ignore the internal resistances of the batteries and the ammeter.',
    'Peak wavelengths from the datasheets: 940, 620, 590, 525, 470 and 450 nm. e = 1.60×10⁻¹⁹ C, c = 3.00×10⁸ m/s.',
    'The diodes behave like real LEDs of their colours (about 1.2 V for the infrared one … about 3 V for the violet) — their departure from the simplistic model is the main source of uncertainty (official solution).',
    'Which number has which wavelength, and the battery voltage, differ from visit to visit.',
    '<b>Do not short the battery with the ammeter.</b>'] }
};

var LAB = { dmm: {}, leads: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 1–6 번 발광 다이오드 판(다이오드와 680 Ω 저항이 직렬, 소켓 둘), 전지 세 개짜리 전지함, 전류계.',
           en: 'On the desk: LED boards 1–6 (the diode and its 680 Ω resistor in series between two sockets), a holder of three cells, and an ammeter.' },
  howto: { ko: ['도선: 소켓을 클릭하면 도선이 들리고, 다른 소켓을 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '전지 + → 다이오드 판 → 전류계 mA → COM → 전지 − 로 이으면 다이오드가 켜집니다 (적외선은 보이지 않음)',
                '전류계: 클릭해서 가까이 본 뒤 다이얼 눈금 클릭 또는 휠',
                '판을 클릭하면 위에서 가까이 봅니다 — 빛의 색 확인'],
           en: ['Wires: click a socket to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Cell + → LED board → ammeter mA → COM → cell − lights the diode (the infrared one shows nothing)',
                'Ammeter: click it to look closer, then click a dial mark or roll the wheel',
                'Click a board to look down at it closely — check the colour'] },
  notePlaceholder: { ko: '예) 1번: 빨강, I = 3.84 mA → IR = 2.61 V', en: 'e.g. no. 1: red, I = 3.84 mA → IR = 2.61 V' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var LED = [[940, 1.18, '#000000'], [620, 1.90, '#ff2a1a'], [590, 1.98, '#ff9a10'], [525, 2.78, '#22ff55'], [470, 2.86, '#2a7bff'], [450, 2.97, '#7a3cff']];
    /* the order on the desk: a shuffle drawn once per visit */
    var order = [0, 1, 2, 3, 4, 5], k;
    for (k = 5; k > 0; k--) { var j = Math.floor(S.uni('perm' + k, 0, 1) * (k + 1)); var t = order[k]; order[k] = order[j]; order[j] = t; }
    var E = 1.52 * (1 + S.sys('E', 0.03)), R = 680;
    var dm = LAB.dmm; dm.err = { V: 0, A: S.sys('mA', 0.006), R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 8 }), c = LAB.c = new B3.Circuit();
    var diodes = LED.map(function (l, i) { var nv = 2.0 * 0.02585, V3 = l[1] * (1 + S.sys('v' + i, 0.01));
      return { Is: 3e-3 / Math.exp(V3 / nv), n: 2.0, Gl: 1e-10, Rs: 8 }; });
    var RANGES = [['OFF'], ['A', 2e-4], ['A', 2e-3], ['A', 0.02], ['A', 0.2]];
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.25, pitch: 0.9, k: 13, tx: 4, ty: 0, tz: 3 },
      views: {
        leds: { yaw: 0, pitch: 1.1, k: 30, tx: -14, ty: 1, tz: -4, title: { ko: '다이오드 판 1–6', en: 'LED boards 1–6' } },
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 14, ty: 3.4, tz: 4, title: { ko: '전류계', en: 'Ammeter' } }
      },
      frame: function (b) {
        B3.desk(-36, 38, -20, 22);
        c.reset();
        var lit = [];
        for (var i = 0; i < 6; i++) {
          var x = -26 + (i % 3) * 12, z = i < 3 ? -9 : 1, id = 'led' + (i + 1), L = LED[order[i]];
          B3.box3(x - 4.5, x + 4.5, 0, 0.6, z - 3, z + 3, '#1f5a3a', { id: 'm:leds', top: '#246b44' });
          B3.text3([x - 4, 0.62, z - 1.6], [1, 0, 0], [0, 0, -1], String(i + 1), 1.4, '#f2f2f2', { weight: '800' });
          B3.box3(x - 1.2, x + 0.6, 0.6, 1.0, z + 1.2, z + 1.8, '#c8a878');                       /* the 680 Ω resistor */
          leads.term(b, id + '.a', [x - 3, 0.6, z + 1.6], { col: '#c0392b' });
          leads.term(b, id + '.k', [x + 3, 0.6, z + 1.6], { col: '#1b1b1b' });
          c.R(id + '.a', id + '.m', R); var d = c.D(id + '.m', id + '.k', diodes[order[i]]);
          lit.push([x, z, d, L]);
        }
        var cell = B3.cells(b, leads, 'bat', [-4, 14], { n: 3, e: E, r: 0.001 });
        var m = B3.dmm(b, 'dmm', [14, 4], dm, leads, { ranges: RANGES, rA: { 2e-4: 0.01, 2e-3: 0.01, 0.02: 0.01, 0.2: 0.01 }, fuseI: 0.25, model: 'AMMETER' });
        cell.stamp(c); m.stamp(c); leads.wire(c);
        c.solve(0.02); m.read(c);
        lit.forEach(function (q) { var I = c.cur(q[2]), col = q[3][2], on = I > 2e-5 && q[3][0] < 800;
          B3.cyl3('y', 0.6, 1.4, q[0], q[1], 0.5, on ? col : 'rgba(225,225,230,.7)', { seg: 14, cap: on ? '#ffffff' : 'rgba(235,235,240,.8)' });
          B3.sphere3([q[0], 1.4, q[1]], 0.5, on ? col : 'rgba(225,225,230,.7)');
          if (on) { var a = Math.min(0.5, I * 120); B3.sphere3([q[0], 1.6, q[1]], 1.2 + I * 200, 'rgba(' + parseInt(col.slice(1, 3), 16) + ',' + parseInt(col.slice(3, 5), 16) + ',' + parseInt(col.slice(5, 7), 16) + ',' + a.toFixed(2) + ')'); } });
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
