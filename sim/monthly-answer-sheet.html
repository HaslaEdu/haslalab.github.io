<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>월별 문제 답안지 · HaslaLab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#202735;font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}.tools{max-width:210mm;margin:20px auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tools a,.tools button{font:inherit;color:inherit;background:white;border:1px solid #b9c2d0;border-radius:5px;padding:8px 12px;text-decoration:none;cursor:pointer}.tools p{flex-basis:100%;margin:0;color:#4c5869}.paper{width:210mm;height:297mm;margin:18px auto;padding:13mm 15mm;background:#fff;box-shadow:0 2px 14px #14223520;display:flex;flex-direction:column;overflow:hidden}.paper header{border-bottom:1.5px solid #202735;padding-bottom:8mm;margin-bottom:5mm}.brand{font-weight:750;font-size:12px;letter-spacing:.03em}.paper h1{font-size:20px;line-height:1.35;margin:7px 0}.meta{display:flex;gap:16px;justify-content:space-between;font-size:11px}.instructions{font-size:11px;margin:7px 0 0}.parts{display:grid;grid-template-rows:repeat(var(--part-count),minmax(0,1fr));gap:5mm;flex:1;min-height:0}.part{display:flex;flex-direction:column;min-height:0;break-inside:avoid}.part h2{font-size:12px;line-height:1.4;margin:0 0 2mm}.part .label{font-size:10px;font-weight:650;margin:1mm 0}.answer{border:1px solid #677488;min-height:16mm;margin-bottom:2mm}.working{border:1px solid #9da8b7;flex:1;min-height:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 6mm,#dce1e8 6mm,#dce1e8 calc(6mm + .15mm))}.paper footer{display:flex;justify-content:space-between;gap:12px;margin-top:5mm;padding-top:2mm;border-top:1px solid #b5bfcd;font-size:9px;color:#465267}#message{text-align:center;padding:40px}
    @media screen and (max-width:820px){.tools{margin:14px 12px}.paper{width:calc(100vw - 24px);height:calc((100vw - 24px)*1.4143);padding:4vw 5vw;margin:12px}.paper h1{font-size:clamp(13px,2.6vw,20px)}.paper header{padding-bottom:2vw;margin-bottom:2vw}.brand,.part h2{font-size:clamp(9px,1.55vw,12px)}.meta,.instructions,.part .label{font-size:clamp(8px,1.35vw,11px)}.answer{min-height:6vw}.parts{gap:2vw}.paper footer{font-size:8px;margin-top:2vw}.instructions{margin-top:3px}}
    @page{size:A4;margin:0}@media print{body{background:#fff}.tools,#message{display:none!important}.paper{width:210mm;height:297mm;margin:0;box-shadow:none;break-after:page;page-break-after:always;print-color-adjust:exact}.paper:last-child{break-after:auto;page-break-after:auto}}
  </style>
</head>
<body>
  <nav class="tools" aria-label="답안지 도구"><a id="back" href="../#/monthly">← 월별 문제</a><button id="print" type="button" disabled>답안지 인쇄</button><p id="help">소문항별로 최종 답과 풀이를 함께 작성하세요. 여러 장이면 모든 장에 문제·소문항 번호를 적으세요.</p></nav>
  <div id="message" role="status">답안지를 불러오는 중…</div>
  <main id="sheets"></main>
  <script type="module" src="monthly-answer-sheet.mjs?v=20e61c4c14c3"></script>
</body>
</html>
