<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --ink:#1b2430; --muted:#5b6b7c;
    --line:#d8e0e8; --accent:#2c6f9b; --accent-soft:#eaf4fb;
    --disp-bg:#101418; --disp-fg:#8fd6ff;
    --mx:#e02424; --my:#b8862b; --mz:#2c6f9b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:16px;display:flex;gap:16px;align-items:flex-start}
  @media(max-width:1080px){.wrap{flex-direction:column}}
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:14px;position:sticky;top:16px}
  @media(max-width:1080px){.panel{position:static;width:100%;flex:1 1 auto}}
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  label.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    margin:11px 0 3px;color:var(--muted);font-size:12.5px}
  label.row b{font:600 13px ui-monospace,Consolas,monospace;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);
    border-radius:6px;font:13px ui-monospace,monospace}
  button{width:100%;padding:9px 10px;margin:5px 0;cursor:pointer;background:#fff;
    border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
    color:var(--ink);text-align:left;transition:.12s}
  button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);

function fit(cv,ratio){

}

const fmtTick=(v,st)=>{ const dg=Math.max(0,-Math.floor(Math.log10(st)+1e-9)); return v.toFixed(Math.min(6,dg)); };
/* series: {x:[], y:[], err?:[], col, label, mode:"line"|"pts"|"both"} */
function plot(cv,o){

    const e=s.err?s.err[i]:0; x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y-e); y1=Math.max(y1,y+e); }

    c.strokeStyle="#000"; c.beginPath(); c.moveTo(x,Tp+ph); c.lineTo(x,Tp+ph+4); c.stroke(); c.fillText(fmtTick(v,sx),x,Tp+ph+6); }

    c.strokeStyle="#000"; c.beginPath(); c.moveTo(L-4,y); c.lineTo(L,y); c.stroke(); c.fillText(fmtTick(v,sy),L-6,y); }
  c.font="12px 'DejaVu Sans',sans-serif"; c.textAlign="center"; c.textBaseline="bottom"; c.fillText(o.xl||"",L+pw/2,h-3);
  c.save(); c.translate(13,Tp+ph/2); c.rotate(-Math.PI/2); c.textBaseline="middle"; c.fillText(o.yl||"",0,0); c.restore();
  if(o.title){ c.textBaseline="top"; c.fillText(o.title,L+pw/2,5); }
  if(!(o.series&&o.series.length)){ if(o.empty){ c.fillStyle="#98a6b4"; c.textBaseline="middle"; c.fillText(o.empty,L+pw/2,Tp+ph/2); } return; }
  c.save(); c.beginPath(); c.rect(L,Tp,pw,ph); c.clip();
  for(const s of o.series){ const col=s.col||"#1f77b4";
    if(s.mode!=="pts"){ c.strokeStyle=col; c.lineWidth=s.lw||1.5; c.setLineDash(s.dash||[]); c.beginPath(); let up=false;
      for(let i=0;i<s.x.length;i++){ if(!isFinite(s.y[i])){ up=false; continue; } const x=X(s.x[i]), y=Y(s.y[i]); if(up) c.lineTo(x,y); else c.moveTo(x,y); up=true; } c.stroke(); c.setLineDash([]); }
    if(s.mode==="pts"||s.mode==="both"){ c.fillStyle=col; c.strokeStyle=col; c.lineWidth=1;
      for(let i=0;i<s.x.length;i++){ if(!isFinite(s.y[i])) continue; const x=X(s.x[i]), y=Y(s.y[i]);
        if(s.err){ c.beginPath(); c.moveTo(x,Y(s.y[i]-s.err[i])); c.lineTo(x,Y(s.y[i]+s.err[i])); c.moveTo(x-3,Y(s.y[i]-s.err[i])); c.lineTo(x+3,Y(s.y[i]-s.err[i])); c.moveTo(x-3,Y(s.y[i]+s.err[i])); c.lineTo(x+3,Y(s.y[i]+s.err[i])); c.stroke(); }

  c.restore();
  const named=o.series.filter(s=>s.label); if(named.length){ c.font="11px 'DejaVu Sans',sans-serif"; c.textAlign="left"; c.textBaseline="middle";
    const wd=Math.max(...named.map(s=>c.measureText(s.label).width))+40, bh=named.length*15+8, bx=o.legendLeft?L+8:L+pw-wd-8, by=Tp+8;
    c.fillStyle="rgba(255,255,255,.88)"; c.fillRect(bx,by,wd,bh); c.strokeStyle="#c8c8c8"; c.lineWidth=0.8; c.strokeRect(bx,by,wd,bh);

      if(s.mode==="pts"){ c.beginPath(); c.arc(bx+15,y,2.5,0,7); c.fill(); } else { c.beginPath(); c.moveTo(bx+6,y); c.lineTo(bx+26,y); c.stroke(); }
      c.fillStyle="#000"; c.fillText(s.label,bx+32,y); }); }
}
/* least squares y = a + b x (weights optional); returns {a,b,sa,sb} */
function linfit(x,y,wt){ const n=x.length; let S=0,Sx=0,Sy=0,Sxx=0,Sxy=0;

  let chi=0; for(let i=0;i<n;i++){ const w=wt?wt[i]:1; chi+=w*(y[i]-a-b*x[i])**2; }
  const s2=wt?Math.max(1,chi/Math.max(1,n-2)):chi/Math.max(1,n-2);
  return {a,b,sa:Math.sqrt(s2*Sxx/D),sb:Math.sqrt(s2*S/D)}; }

/* ── A.exe: hops between neighbouring inter-nodes; each axis jumps at 2D/a² ── */
function poisson(m){ if(m>60) return Math.max(0,Math.round(gauss(m,Math.sqrt(m)))); let L=Math.exp(-m),k=0,p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1; }

  const go=()=>{ const until=Math.min(N,i+400);

      if(n<3000){ for(let k=0;k<n;k++){ const r=Math.random()*6|0, s=r&1?1:-1; if(r<2) x+=s; else if(r<4) y+=s; else z+=s; } }

  return {x,y,zs:zs.slice(0,1500)}; }
/* ── C.exe: type B — the boundaries carry the impurity far ahead of the lattice front ── */
function runC(t,g,dl){ const k=TRUE.C*Math.pow(dl,TRUE.xi)*Math.pow(g,TRUE.eta)*Math.pow(t,TRUE.zeta), lb=Math.sqrt(t), A0=1/Math.sqrt(Math.PI*t), Agb=A0*dl*Math.sqrt(g)*0.6, ell=0.7*lb;
  const zmax=Math.pow(Math.log(Agb/1e-6*A0)/k,5/6)*0.9, nz=160, ny=81, cbar=[], map=[];
  const cAt=(z,yy)=>A0*Math.exp(-z*z/(4*t))+Agb*Math.exp(-k*Math.pow(z,1.2))*Math.exp(-Math.abs(yy)/ell)/(2*ell*(1-Math.exp(-0.5/ell)));
  const cnt=6e6;   /* particles that the program follows */ const cntMap=40*cnt;
  for(let i=0;i<nz;i++){ const z=(i+0.5)/nz*zmax; let s=0; const row=[]; for(let j=0;j<ny;j++){ const yy=-0.5+j/(ny-1); const c=cAt(z,yy); row.push(c); s+=c; }
    const m=s/ny, n=m*cnt*zmax/nz/A0; if(n>=4) cbar.push([Math.pow(z,1.2),Math.log(Math.max(1e-30,m*(1+gauss(0,1/Math.sqrt(n)))))]);
    map.push(row.map(c=>{ const nn=c*cntMap*zmax/nz/ny/A0; return nn>=1?Math.log(c*(1+gauss(0,1/Math.sqrt(nn)))):NaN; })); }
  return {x:cbar.map(p=>p[0]),y:cbar.map(p=>p[1]),map,zmax,ny}; }

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const S={task:"A", par:{A:DEF.A.slice(),B:DEF.B.slice(),C:DEF.C.slice()}, A:null, B:null, C:null, fit:{B:[0,0.6],C:[0.15,0.85]}, kfit:null, buf:[], bfit:null, busy:false, csv:null, grains:null};
function say(s){ $("status").textContent=s; }
function readPar(){ const v=[+$("p1").value,+$("p2").value,+$("p3").value], R=RANGE[S.task]; for(let i=0;i<3;i++) if(!(v[i]>=R[i][0]&&v[i]<=R[i][1])) return null; S.par[S.task]=v; return v; }
function run(){ const d=T[lang], v=readPar(); if(!v){ say(d.range); return; } if(S.busy) return;
  if(S.task==="A"){ S.busy=true; $("run").disabled=true; $("run").textContent=d.running; const t0=performance.now();
    runA(v[0],v[1],Math.round(v[2]),p=>{ $("prog").style.width=(100*p).toFixed(1)+"%"; },r=>{ S.A={...r,t:v[0],T:v[1],N:Math.round(v[2])}; S.busy=false; $("run").disabled=false; $("run").textContent=d.run;
      $("v-res").textContent=`Δr_sq = ${r.R.toFixed(3)} ± ${r.sR.toFixed(3)}`; say(`A.exe: t = ${v[0]}, T = ${v[1]}, N = ${Math.round(v[2])} · ${Math.round(performance.now()-t0)} ms`); draw(); }); }
  else if(S.task==="B"){ S.B={...runB(...v),par:v}; S.grains=null; $("prog").style.width="100%"; say(`B.exe: t = ${v[0]}, Dgb/D = ${v[1]}, δ = ${v[2]}`); refit(); }
  else { S.C={...runC(...v),par:v}; $("prog").style.width="100%"; say(`C.exe: t = ${v[0]}, Dgb/D = ${v[1]}, δ = ${v[2]}`); refit(); } }
/* B.nb / C.nb: fit the chosen range of the profile */
function refit(){ const d=T[lang], R=S[S.task]; S.kfit=null; if(!R||!(S.task==="B"||S.task==="C")){ draw(); return; }
  const [a,b]=S.fit[S.task], xm=Math.max(...R.x), x0=a*xm, x1=b*xm; $("wf1").textContent=x0.toFixed(3); $("wf2").textContent=x1.toFixed(3);
  const X=[],Y=[]; R.x.forEach((x,i)=>{ if(x>=x0&&x<=x1){ X.push(x); Y.push(R.y[i]); } });
  if(X.length>=3){ S.kfit={...linfit(X,Y),x0,x1,n:X.length}; $("fitout").innerHTML=`${d.slope} k = ${S.kfit.b.toFixed(5)} ± ${S.kfit.sb.toFixed(5)}<br>${d.icpt} = ${S.kfit.a.toFixed(4)} · ${X.length} ${d.pts}`; }
  else $("fitout").textContent="—";
  draw(); }
function bufFit(){ const d=T[lang]; if(S.buf.length<2){ S.bfit=null; $("bout").textContent="—"; draw(); return; } const f=linfit(S.buf.map(p=>p[0]),S.buf.map(p=>p[1]));
  S.bfit=f; $("bout").innerHTML=`y = a + b x<br>b = ${f.b.toPrecision(6)} ± ${f.sb.toPrecision(3)}<br>a = ${f.a.toPrecision(6)} ± ${f.sa.toPrecision(3)}`; draw(); }

/* ══════════════════════════════════════════════════════════════
   DRAWING
   ══════════════════════════════════════════════════════════════ */
function voronoi(){ if(S.grains) return S.grains; const pts=[]; for(let i=0;i<36;i++) pts.push([Math.random()*6-0.5,Math.random()*3-0.5]); return S.grains=pts; }
function drawSlice(cv){ const [c,w,h]=fit(cv,0.42), B=S.B, dl=B.par[2], g=voronoi(), W=6, H=3;
  const off=document.createElement("canvas"); off.width=Math.round(w); off.height=Math.round(h); const oc=off.getContext("2d");
  const img=oc.createImageData(off.width,off.height), sx=W/w, sy=H/h, thick=dl/6;
  for(let py=0;py<img.height;py++) for(let px=0;px<img.width;px++){ const x=px*sx-0.5, y=py*sy-0.5; let d1=1e9,d2=1e9,k1=0;
    for(let k=0;k<g.length;k++){ const dd=(x-g[k][0])**2+(y-g[k][1])**2; if(dd<d1){ d2=d1; d1=dd; k1=k; } else if(dd<d2) d2=dd; }
    const gap=(Math.sqrt(d2)-Math.sqrt(d1))/2, o=4*(py*img.width+px), gb=gap<Math.max(thick,0.7*sx), shade=200+((k1*37)%40);
    img.data[o]=gb?60:shade; img.data[o+1]=gb?90:shade+5; img.data[o+2]=gb?150:shade+12; img.data[o+3]=255; }
  oc.putImageData(img,0,0); c.drawImage(off,0,0,w,h);
  c.fillStyle="rgba(224,36,36,.75)"; for(const z of B.zs){ const x=Math.random()*w, y=(z/H)*h; if(y<h) c.fillRect(x,y,1.6,1.6); }
  c.fillStyle="#1b2430"; c.font="11px sans-serif"; c.fillText("z ↓   surface",6,12); }
function drawMap(cv){ const [c,w,h]=fit(cv,0.42), M=S.C.map, nz=M.length, ny=S.C.ny; let lo=Infinity,hi=-Infinity;
  for(const r of M) for(const v of r) if(isFinite(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
  const L=62,R=60,Tp=12,Bt=40,pw=w-L-R,ph=h-Tp-Bt;
  for(let i=0;i<nz;i++) for(let j=0;j<ny;j++){ const v=M[i][j]; const f=isFinite(v)?(v-lo)/(hi-lo):-1; c.fillStyle=f<0?"#fff":viridis(f);
    c.fillRect(L+i/nz*pw,Tp+j/ny*ph,pw/nz+1,ph/ny+1); }
  c.strokeStyle="#000"; c.strokeRect(L,Tp,pw,ph); c.fillStyle="#222"; c.font="10.5px sans-serif"; c.textAlign="center";
  const zm=Math.pow(S.C.zmax,1.2); for(let k=0;k<=5;k++){ const x=L+k/5*pw; c.fillText((k/5*zm).toFixed(2),x,Tp+ph+14); }
  c.fillText("z^(6/5)",L+pw/2,h-6); c.textAlign="right"; for(const yy of [-0.5,0,0.5]) c.fillText(yy.toFixed(1),L-6,Tp+(yy+0.5)*ph+4);
  c.save(); c.translate(14,Tp+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText("y",0,0); c.restore();
  for(let k=0;k<=20;k++){ c.fillStyle=viridis(1-k/20); c.fillRect(w-R+16,Tp+k/21*ph,14,ph/21+1); }
  c.fillStyle="#222"; c.textAlign="left"; c.fillText(hi.toFixed(1),w-R+34,Tp+8); c.fillText(lo.toFixed(1),w-R+34,Tp+ph); c.fillText("ln c",w-R+12,Tp+ph+14); }
function viridis(f){ const s=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]], x=Math.max(0,Math.min(1,f))*4, i=Math.min(3,Math.floor(x)), u=x-i, a=s[i], b=s[i+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*u)},${Math.round(a[1]+(b[1]-a[1])*u)},${Math.round(a[2]+(b[2]-a[2])*u)})`; }
function draw(){ const d=T[lang]; S.csv=null; const cv1=$("cv1"), cv2=$("cv2"); $("t-cap2").parentElement.parentElement.style.display="";
  if(S.task==="A"){ $("t-cap1").textContent=d.cap1A; $("t-cap2").textContent=d.cap2A;
    if(!S.A){ plot(cv1,{series:[],xl:"x",yl:"y",empty:d.idle}); plot(cv2,{series:[],xl:"r",yl:"N",empty:d.idle}); return; }
    const P=S.A.pos.slice(0,3000); plot(cv1,{series:[{x:P.map(p=>p[0]),y:P.map(p=>p[1]),mode:"pts",r:1.3,col:"#2c6f9b"}],xl:"x, a",yl:"y, a",padX:true,ratio:0.42});
    const r=S.A.pos.map(p=>Math.hypot(...p)), mx=Math.max(...r,1), nb=40, hb=new Array(nb).fill(0); for(const v of r) hb[Math.min(nb-1,Math.floor(v/mx*nb))]++;
    plot(cv2,{series:[{x:hb.map((_,i)=>(i+0.5)/nb*mx),y:hb,col:"#2c6f9b",mode:"both"}],xl:"r, a",yl:"N",ratio:0.42});
    S.csv="x,y,z\n"+S.A.pos.map(p=>p.join(",")).join("\n"); return; }
  if(S.task==="B"||S.task==="C"){ const R=S[S.task]; $("t-cap1").textContent=S.task==="B"?d.cap1B:d.cap1C; $("t-cap2").textContent=S.task==="B"?d.cap2B:d.cap2C;
    const xl=S.task==="B"?"z²":"z^(6/5)";
    if(!R){ plot(cv1,{series:[],xl,yl:"ln c̄",empty:d.idle}); plot(cv2,{series:[],xl:"",yl:"",empty:d.idle}); return; }
    const ser=[{x:R.x,y:R.y,mode:"pts",col:"#1f77b4",label:S.task==="B"?"Bavg":"Cavg"}];
    if(S.kfit) ser.push({x:[S.kfit.x0,S.kfit.x1],y:[S.kfit.a+S.kfit.b*S.kfit.x0,S.kfit.a+S.kfit.b*S.kfit.x1],col:"#ff7f0e",label:`k = ${S.kfit.b.toFixed(4)}`});
    plot(cv1,{series:ser,xl,yl:"ln c̄",ratio:0.42,padX:true});
    if(S.task==="B") drawSlice(cv2); else drawMap(cv2);
    S.csv=(S.task==="B"?"z2,ln_c\n":"z6_5,ln_c\n")+R.x.map((x,i)=>x.toFixed(6)+","+R.y[i].toFixed(6)).join("\n"); return; }
  $("t-cap1").textContent=d.cap1D; $("t-cap2").parentElement.parentElement.style.display="none";
  const ser=[{x:S.buf.map(p=>p[0]),y:S.buf.map(p=>p[1]),mode:"pts",col:"#1f77b4",r:3}];
  if(S.bfit&&S.buf.length>=2){ const xs=[Math.min(...S.buf.map(p=>p[0])),Math.max(...S.buf.map(p=>p[0]))]; ser.push({x:xs,y:xs.map(v=>S.bfit.a+S.bfit.b*v),col:"#ff7f0e",label:`y = ${S.bfit.a.toPrecision(4)} + ${S.bfit.b.toPrecision(4)} x`}); }
  plot(cv1,{series:S.buf.length?ser:[],xl:"x",yl:"y",empty:"—",ratio:0.5,padX:true}); S.csv=S.buf.length?"x,y\n"+S.buf.map(p=>p.join(",")).join("\n"):null; }

/* ══════════════════════════════════════════════════════════════
   CONTROLS AND LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function buildSeg(){ const d=T[lang], box=$("taskSeg"); box.innerHTML="";
  [["A",d.tA],["B",d.tB],["C",d.tC],["Buf",d.tBuf]].forEach(([k,l])=>{ const b=document.createElement("button"); b.textContent=l; if(k===S.task) b.className="on";
    b.onclick=()=>{ if(S.busy) return; if(S.task in S.par){ const v=[+$("p1").value,+$("p2").value,+$("p3").value]; if(v.every(isFinite)) S.par[S.task]=v; } S.task=k; buildSeg(); applyLang(); draw(); }; box.appendChild(b); });
  box.style.flexWrap="wrap"; for(const b of box.children) b.style.flex="1 1 45%";
  $("boxRun").style.display=S.task==="Buf"?"none":"block"; $("boxFit").style.display=S.task==="B"||S.task==="C"?"block":"none"; $("boxBuf").style.display=S.task==="Buf"?"block":"none";
  $("dispA").style.display=S.task==="A"?"block":"none";
  if(S.task in S.par){ const v=S.par[S.task], R=RANGE[S.task]; ["p1","p2","p3"].forEach((id,i)=>{ $(id).value=v[i]; $(id).min=R[i][0]; $(id).max=R[i][1]; }); }
  if(S.task==="B"||S.task==="C"){ $("f1").value=S.fit[S.task][0]; $("f2").value=S.fit[S.task][1]; } }
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  $("t-title").textContent=d.title; $("t-sub").textContent=d.sub; $("t-h-task").textContent=d.hTask;
  $("t-taskdesc").textContent={A:d.dA,B:d.dB,C:d.dC,Buf:d.dBuf}[S.task]; $("t-h-in").textContent=d.hIn; $("t-h-fit").textContent=d.hFit; $("t-res").textContent=d.res;
  const ls=S.task==="A"?d.lA:S.task==="B"?d.lB:d.lC; ["l1","l2","l3"].forEach((id,i)=>$(id).textContent=ls[i]);
  ["w1","w2","w3"].forEach((id,i)=>{ const R=(RANGE[S.task]||RANGE.A)[i]; $(id).textContent="["+R[0]+"; "+R[1]+"]"; });
  $("lf1").textContent=d.from; $("lf2").textContent=d.to; $("run").textContent=S.busy?d.running:d.run;
  for(const [id,k] of [["toBuf","toBuf"],["badd","add"],["bdel","del"],["bclr","clr"],["bfit","fit"],["csv","csv"],["t-note","note"]]) $(id).textContent=d[k];
  updEta(); $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":""; document.title=d.title+" · HaslaLab"; }
function updEta(){ const d=T[lang], v=[+$("p1").value,+$("p2").value,+$("p3").value];
  $("eta").textContent=S.task==="A"&&v.every(isFinite)?d.eta+etaA(v[0],v[1],v[2]).toFixed(1)+d.sec:d.eta+"< 1"+d.sec; }
["p1","p2","p3"].forEach(id=>$(id).oninput=updEta);
$("run").onclick=run;
$("f1").oninput=()=>{ S.fit[S.task][0]=Math.min(+$("f1").value,S.fit[S.task][1]-0.02); refit(); };
$("f2").oninput=()=>{ S.fit[S.task][1]=Math.max(+$("f2").value,S.fit[S.task][0]+0.02); refit(); };
$("toBuf").onclick=()=>{ if(!S.kfit) return; const p=S[S.task].par; $("bx").value=""; $("by").value=Math.log(Math.abs(S.kfit.b)).toFixed(5); say((lang==="ko"?"ln|k| = ":"ln|k| = ")+Math.log(Math.abs(S.kfit.b)).toFixed(5)+" · t = "+p[0]+", Dgb/D = "+p[1]+", δ = "+p[2]); };
$("badd").onclick=()=>{ const x=+$("bx").value, y=+$("by").value; if($("bx").value===""||$("by").value===""||!isFinite(x)||!isFinite(y)) return; S.buf.push([x,y]); bufFit(); };
$("bdel").onclick=()=>{ S.buf.pop(); bufFit(); }; $("bclr").onclick=()=>{ S.buf=[]; bufFit(); }; $("bfit").onclick=bufFit;
$("csv").onclick=()=>{ if(!S.csv) return; const n={A:"A_positions",B:"Bavg",C:"Cavg",Buf:"buffer"}[S.task]; saveText("ISPhO2023_T1_"+n+".csv",S.csv+"\n"); };
$("lang-ko").onclick=()=>{ lang="ko"; buildSeg(); applyLang(); draw(); }; $("lang-en").onclick=()=>{ lang="en"; buildSeg(); applyLang(); draw(); };
addEventListener("resize",draw);
const _draw=draw; draw=function(){ _draw(); $("csv").disabled=!S.csv; };
buildSeg(); applyLang(); say(T[lang].idle); draw();
</script>
