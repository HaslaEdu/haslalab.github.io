       background:#f0f0f0;cursor:default;white-space:nowrap;height:19px;line-height:14px}
  .nbtabs div:hover{background:#d8eaf9;border-color:#3c7fb1}
  .nbtabs div.on{background:#fff;margin-top:0;height:22px;padding:3px 8px 3px;margin-left:-2px;margin-right:-3px;
       border-color:#d9d9d9;position:relative;z-index:2}
  .pane{flex:1;border:1px solid #d9d9d9;margin-top:-1px;display:flex;min-height:0;background:#f0f0f0}
  .lf{border:1px solid #dcdcdc;position:relative;padding:15px;margin:10px}
  .lf>.lfl{position:absolute;left:6px;top:-9px;background:#f0f0f0;padding:0 2px;line-height:16px;white-space:pre}
  .ctrl{display:grid;grid-template-columns:auto auto;align-content:start;column-gap:0;row-gap:0}
  .ctrl .lab{padding:5px 0;align-self:center;white-space:nowrap}
  .ent{width:88px;height:21px;border:1px solid #7a7a7a;background:#fff;font:12px "Segoe UI",Tahoma,sans-serif;
       padding:0 2px;outline:0;margin:5px;border-radius:0;color:#000}
  .ent:hover{border-color:#171717}
  .ent:focus{border-color:#0078d7}
  .tb{height:23px;border:1px solid #adadad;background:#e1e1e1;font:12px "Segoe UI",Tahoma,sans-serif;color:#000;
      padding:0 8px;cursor:default;position:relative;outline:0;border-radius:0}
  .tb:hover{background:#e5f1fb;border-color:#0078d7}
  .tb:active{background:#cce4f7;border-color:#005499}
  .tb.focus::after{content:"";position:absolute;inset:2px;border:1px dotted #000}
  .calc{grid-column:1/3;margin:20px 0}
  .plotf{flex:1;display:flex;flex-direction:column;margin:10px;min-width:0;min-height:0}
  .cvwrap{flex:1;position:relative;min-height:0;background:#fff}
  .cvwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .navbar{flex:0 0 auto;display:flex;align-items:center;border:2px solid #f0f0f0;height:40px;padding:0}
  .navbar .nbt{width:30px;height:30px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;
      background:#f0f0f0;cursor:default}
  .navbar .nbt img{width:24px;height:24px;display:block}
  .navbar .nbt:hover{border:1px solid #a0a0a0;box-shadow:inset 1px 1px #fff,inset -1px -1px #fff}
  .navbar .nbt.on{background:#dadada;border:1px solid #6f6f6f;box-shadow:inset 1px 1px #a0a0a0}
  .navbar .nbt.dis img{opacity:.35}
  .navbar .nbt.dis:hover{border-color:transparent;box-shadow:none}
  .navbar .sep{width:2px;height:24px;background:#a9a9a9;margin:0 4px;border-left:1px solid #8a8a8a}
  .navbar .msg{margin-left:auto;font-size:13.3px;white-space:pre;text-align:right;padding-right:4px;line-height:17px}
  .bottom{margin:10px;padding:10px 10px 10px 10px;display:flex;align-items:center}
  .bottom .lab{white-space:nowrap}
  .bottom .ent{width:74px}
  .dsub{display:flex;align-items:center;grid-column:1/3;margin:5px 0}
  .dsub .tb{width:32px;padding:0;margin:0 2px}
  .dsub .ent{width:64px;margin:0 2px;text-align:center}
  .dinfo{grid-column:1/3;font:bold 12px Arial,sans-serif;margin:10px 0;white-space:nowrap}

  /* message box and the subplot tool: Windows 10 dialogs */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
  .dlg{background:#fff;border:1px solid #8f8f8f;box-shadow:0 10px 32px -8px rgba(0,0,0,.5);min-width:300px;max-width:520px;
       font:12px "Segoe UI",Tahoma,"Malgun Gothic",sans-serif;user-select:none}
  .dlg .dcap{height:30px;display:flex;align-items:center;padding-left:10px}
  .dlg .dcap span{flex:1}
  .dlg .dbody{display:flex;gap:12px;align-items:flex-start;padding:16px 26px 24px 18px}
  .dlg .dbody p{margin:6px 0 0;white-space:pre-wrap;line-height:1.45}
  .dlg .dfoot{background:#f0f0f0;padding:11px 11px;display:flex;justify-content:flex-end}
  .dlg .dfoot .tb{width:88px;height:26px}
  .stool{position:fixed;z-index:40;background:#f0f0f0;border:1px solid #8f8f8f;box-shadow:0 10px 32px -8px rgba(0,0,0,.5);
         font:12px "Segoe UI",Tahoma,sans-serif;user-select:none}
  .stool .dcap{height:30px;display:flex;align-items:center;padding-left:8px;background:#fff;cursor:move}
  .stool .dcap span{flex:1;margin-left:6px}
  .stool canvas{display:block;background:#fff}
  /* the left column of LabelFrames, tk.Text, ttk.Progressbar, ttk.Radiobutton, ttk.Scale */
  .lcol{flex:0 0 auto;display:flex;flex-direction:column;width:300px;min-height:0;overflow:auto}
  .lcol .lf{margin-bottom:0}
  .lf.col{display:flex;flex-direction:column;align-items:stretch}
  .lf.col>.lab{padding:0 0 3px}
  .lf.col .calc{margin:12px 0 2px}
  .lf.col .tb{margin-top:6px}
  .lf.ctrl .ent{width:110px}
  .lf .dinfo{grid-column:1/3;white-space:pre;margin:10px 0 0;line-height:16px;min-height:16px}
  .lf .info{white-space:pre;line-height:17px}
  .txt{font:13px/16px Consolas,"Courier New",monospace;border:1px solid #828790;background:#fff;color:#000;padding:1px 2px;
       resize:none;outline:0;tab-size:8;-moz-tab-size:8;white-space:pre;overflow:auto;border-radius:0;user-select:text;-webkit-user-select:text}
  .txt:focus{border-color:#0078d7}
  .brow{display:flex;gap:6px;margin-top:8px}
  .brow .tb{flex:1;margin-top:0}
  .tb:disabled{color:#a0a0a0;background:#ccc;border-color:#bfbfbf}
  .tb:disabled:hover{background:#ccc;border-color:#bfbfbf}
  .pbar{height:18px;border:1px solid #bcbcbc;background:#e6e6e6;margin-top:8px;position:relative;overflow:hidden}
  .pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#06b025}
  .rgrp{display:flex;gap:18px;padding:2px 0}
  .rb{display:flex;align-items:center;gap:5px}
  .rb input{margin:0;width:13px;height:13px;accent-color:#0078d7}
  .scrow{display:grid;grid-template-columns:44px 1fr 62px;align-items:center;gap:4px;margin:4px 0}
  .scrow .v{text-align:right;font-variant-numeric:tabular-nums}
  .scl{-webkit-appearance:none;appearance:none;height:21px;background:transparent;margin:0;width:100%}
  .scl::-webkit-slider-runnable-track{height:4px;background:#e7eaea;border:1px solid #d6d6d6}
  .scl::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:21px;background:#007ad9;border:0;margin-top:-9px}
  .scl::-moz-range-track{height:4px;background:#e7eaea;border:1px solid #d6d6d6}
  .scl::-moz-range-thumb{width:11px;height:21px;background:#007ad9;border:0;border-radius:0}
  .scl:hover::-webkit-slider-thumb{background:#171717}
  .bottom .out{flex:1;white-space:pre;overflow:hidden;text-overflow:ellipsis;margin:0 10px}
  .plotf{margin:10px 10px 10px 0}

</style>

/* ── a small matplotlib 3.7 for one Axes: MaxNLocator('auto'), AutoMinorLocator,
      ScalarFormatter (offset, order of magnitude, sig. figures), format_data_short ── */
const MPL=(()=>{
  const STEPS=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20];         /* MaxNLocator._extended_steps */
  const log10=Math.log10, floor=Math.floor;
  /* Python's float divmod, which floor() of a quotient does not always reproduce */
  function pyDivmod(v,w){
    let mod=v%w, div=(v-mod)/w;
    if(mod){ if((w<0)!==(mod<0)){ mod+=w; div-=1; } } else mod=0*Math.sign(w);
    let fd;
    if(div){ fd=Math.floor(div); if(div-fd>0.5) fd+=1; } else fd=0*Math.sign(v/w);
    return [fd,mod];
  }
  const pyFloorDiv=(a,b)=>pyDivmod(a,b)[0];
  const pyMod=(a,b)=>pyDivmod(a,b)[1];
  function scaleRange(vmin,vmax,n){
    const dv=Math.abs(vmax-vmin), meanv=(vmax+vmin)/2;
    let offset=0;
    if(!(Math.abs(meanv)/dv<100)) offset=Math.sign(meanv)*Math.pow(10,floor(log10(Math.abs(meanv))));
    const scale=Math.pow(10,floor(log10(dv/n)));
    return [scale,offset];
  }
  function edge(step,offset){
    const closeto=(ms,e)=>{
      let tol;
      if(offset>0){const digits=log10(offset/step); tol=Math.max(1e-10,Math.pow(10,digits-12)); tol=Math.min(0.4999,tol);}
      else tol=1e-10;
      return Math.abs(ms-e)<tol;};
    return {
      le:x=>{const d=pyFloorDiv(x,step),m=pyMod(x,step); return closeto(m/step,1)?d+1:d;},
      ge:x=>{const d=pyFloorDiv(x,step),m=pyMod(x,step); return closeto(m/step,0)?d:d+1;}};
  }
  function nonsingular(a,b){
    if(!isFinite(a)||!isFinite(b)) return [-0.001,0.001];
    let flip=false; if(b<a){[a,b]=[b,a];flip=true;}
    const maxabs=Math.max(Math.abs(a),Math.abs(b));
    if(maxabs<(1e6/Number.MIN_VALUE)*Number.EPSILON*0 + 1e-300){ a=-0.001; b=0.001; }
    else if(b-a<=maxabs*1e-13){ if(b===0&&a===0){a=-0.001;b=0.001;} else {a-=1e-13*Math.abs(a); b+=1e-13*Math.abs(b);} }
    return flip?[b,a]:[a,b];
  }
  function majorTicks(vmin,vmax,nbins){
    [vmin,vmax]=nonsingular(vmin,vmax);
    const [scale,offset]=scaleRange(vmin,vmax,nbins);
    const _vmin=vmin-offset,_vmax=vmax-offset;
    const steps=STEPS.map(s=>s*scale);
    const raw=(_vmax-_vmin)/nbins;
    let istep=steps.findIndex(s=>s>=raw); if(istep<0) istep=steps.length-1;
    let ticks=[];
    for(let k=istep;k<steps.length;k++){
      const step=steps[k];
      const best=pyFloorDiv(_vmin,step)*step;
      const e=edge(step,offset);
      const low=e.le(_vmin-best), high=e.ge(_vmax-best);
      ticks=[]; for(let i=low;i<=high;i++) ticks.push(i*step+best);
      const n=ticks.filter(t=>t<=_vmax&&t>=_vmin).length;
      if(n>=2) break;
    }

/* ══════════════════════════════════════════════════════════════════════
   The organisers' programs of ISPhO 2023 T1 — A.exe, B.exe, C.exe with
   B.nb, C.nb and InteractiveBuffer.nb — as the tabs of one Tk window.
   ══════════════════════════════════════════════════════════════════════ */
const gauss=(m,s)=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const U=(a,b)=>a+Math.random()*(b-a);
function linfit(x,y,wt){ const n=x.length; let S=0,Sx=0,Sy=0,Sxx=0,Sxy=0;
  for(let i=0;i<n;i++){ const w=wt?wt[i]:1; S+=w; Sx+=w*x[i]; Sy+=w*y[i]; Sxx+=w*x[i]*x[i]; Sxy+=w*x[i]*y[i]; }
  const D=S*Sxx-Sx*Sx, b=(S*Sxy-Sx*Sy)/D, a=(Sy-b*Sx)/S;
  let chi=0; for(let i=0;i<n;i++){ const w=wt?wt[i]:1; chi+=w*(y[i]-a-b*x[i])**2; }
  const s2=wt?Math.max(1,chi/Math.max(1,n-2)):chi/Math.max(1,n-2);
  return {a,b,sa:Math.sqrt(s2*Sxx/D),sb:Math.sqrt(s2*S/D)}; }
function pyFloat(s){ const t=String(s).trim();
  if(!/^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(t)) throw new ValueError(); return parseFloat(t); }
function ValueError(){}

/* ── the hidden truth of this session ── */
const TRUE={ Eg:U(3.40,3.80), D0:113*U(0.95,1.05), alpha:U(0.68,0.82), C:1.42*U(0.96,1.04), xi:-0.39, eta:-0.68, zeta:-0.44 };
const RANGE={A:[[1,10],[1,10],[100,10000]], B:[[2,5],[2,5],[0.005,0.05]], C:[[0.005,0.2],[5,50],[0.02,0.2]]};

/* ── A.exe: hops between neighbouring inter-nodes; each axis jumps at 2D/a² ── */
function poisson(m){ if(m>60) return Math.max(0,Math.round(gauss(m,Math.sqrt(m)))); let L=Math.exp(-m),k=0,p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1; }
function runA(t,Tm,N,onP,done){ const D=TRUE.D0*Math.sqrt(Tm)*Math.exp(-TRUE.Eg/Tm), rate=6*D; const pos=[]; let i=0;
  const go=()=>{ const until=Math.min(N,i+400);
    for(;i<until;i++){ const n=poisson(rate*t); let x=0,y=0,z=0;
      if(n<3000){ for(let k=0;k<n;k++){ const r=Math.random()*6|0, s=r&1?1:-1; if(r<2) x+=s; else if(r<4) y+=s; else z+=s; } }
      else { const nx=n/3; x=Math.round(gauss(0,Math.sqrt(nx))); y=Math.round(gauss(0,Math.sqrt(nx))); z=Math.round(gauss(0,Math.sqrt(nx))); }
      pos.push([x,y,z]); }
    onP(i/N); if(i<N) setTimeout(go,0); else { const r2=pos.map(p=>p[0]*p[0]+p[1]*p[1]+p[2]*p[2]), m=r2.reduce((a,b)=>a+b,0)/N, v=r2.reduce((a,b)=>a+(b-m)**2,0)/(N-1), R=Math.sqrt(m);
      done({pos,R,sR:Math.sqrt(v/N)/(2*R)}); } };
  go(); }
const etaA=(t,Tm,N)=>N*6*TRUE.D0*Math.sqrt(Tm)*Math.exp(-TRUE.Eg/Tm)*t*4e-9+0.05;
/* ── B.exe: type A, the impurity front moves with the effective coefficient of the polycrystal ── */
function runB(t,g,dl){ const Deff=1+TRUE.alpha*dl*(g-1), N=40000, dz=0.1, zs=[]; for(let i=0;i<N;i++) zs.push(Math.abs(gauss(0,Math.sqrt(2*Deff*t))));
  const nb=Math.ceil(Math.max(...zs)/dz), h=new Array(nb).fill(0); for(const z of zs) h[Math.min(nb-1,Math.floor(z/dz))]++;
  const x=[],y=[]; for(let b=0;b<nb;b++) if(h[b]>=3){ const zc=(b+0.5)*dz; x.push(zc*zc); y.push(Math.log(h[b]/(N*dz))); }
  return {x,y,zs:zs.slice(0,1500)}; }
/* ── C.exe: type B — the boundaries carry the impurity far ahead of the lattice front ── */
function runC(t,g,dl){ const k=TRUE.C*Math.pow(dl,TRUE.xi)*Math.pow(g,TRUE.eta)*Math.pow(t,TRUE.zeta), lb=Math.sqrt(t), A0=1/Math.sqrt(Math.PI*t), Agb=A0*dl*Math.sqrt(g)*0.6, ell=0.7*lb;
  const zmax=Math.pow(Math.log(Agb/1e-6*A0)/k,5/6)*0.9, nz=160, ny=81, cbar=[], map=[];
  const cAt=(z,yy)=>A0*Math.exp(-z*z/(4*t))+Agb*Math.exp(-k*Math.pow(z,1.2))*Math.exp(-Math.abs(yy)/ell)/(2*ell*(1-Math.exp(-0.5/ell)));
  const cnt=6e6;   /* particles that the program follows */ const cntMap=40*cnt;
  for(let i=0;i<nz;i++){ const z=(i+0.5)/nz*zmax; let s=0; const row=[]; for(let j=0;j<ny;j++){ const yy=-0.5+j/(ny-1); const c=cAt(z,yy); row.push(c); s+=c; }
    const m=s/ny, n=m*cnt*zmax/nz/A0; if(n>=4) cbar.push([Math.pow(z,1.2),Math.log(Math.max(1e-30,m*(1+gauss(0,1/Math.sqrt(n)))))]);
    map.push(row.map(c=>{ const nn=c*cntMap*zmax/nz/ny/A0; return nn>=1?Math.log(c*(1+gauss(0,1/Math.sqrt(nn)))):NaN; })); }
  return {x:cbar.map(p=>p[0]),y:cbar.map(p=>p[1]),map,zmax,ny}; }

function run_bc(k){
  const v=readPar(k); if(!v) return;
  const R=k==="B"?runB(...v):runC(...v); R.par=v; app.res[k]=R; app.grains=null;

function refit(k){
  const R=app.res[k]; if(!R){ draw_bc(k); return; }
  const [x0,x1]=app.fr[k], X=[],Y=[]; R.x.forEach((x,i)=>{ if(x>=x0&&x<=x1){ X.push(x); Y.push(R.y[i]); } });
  app.kfit[k]=X.length>=3?{...linfit(X,Y),x0,x1,n:X.length}:null;
  const q=app.kfit[k]; app.lbl_fit[k].textContent=q?`slope = ${q.b.toPrecision(6)} ± ${q.sb.toPrecision(2)}\nintercept = ${q.a.toPrecision(6)} ± ${q.sa.toPrecision(2)}\n${q.n} points`:"fewer than 3 points in the range";
  draw_bc(k);
}
function voronoi(){ if(app.grains) return app.grains; const pts=[]; for(let i=0;i<36;i++) pts.push([Math.random()*6-0.5,Math.random()*3-0.5]); return app.grains=pts; }
function draw_bc(k){
  const f=app["fig_"+k.toLowerCase()]; f.clear(); const [a1,a2]=f.axes, R=app.res[k], xl=k==="B"?"z²":"z^(6/5)";
  a1.xlabel=xl; a1.ylabel="ln c̄";
  if(k==="B"){ a2.xlabel="x"; a2.ylabel="z"; a2.flipY=true; } else { a2.xlabel=xl; a2.ylabel="y"; }
  if(R){
    a1.plot(R.x,R.y,{ls:"none",marker:"o",ms:4,label:k==="B"?"Bavg.csv":"Cavg.csv"});
    const q=app.kfit[k]; if(q) a1.plot([q.x0,q.x1],[q.a+q.b*q.x0,q.a+q.b*q.x1],{label:`fit: slope = ${q.b.toPrecision(4)}`});
    a1.legend(); a1.title=k==="B"?`t = ${R.par[0]},  Dgb/D = ${R.par[1]},  δ = ${R.par[2]}`:`t = ${R.par[0]},  Dgb/D = ${R.par[1]},  δ = ${R.par[2]}`;
    if(k==="B"){ /* a cut through the polycrystal: grains, their boundaries (width ∝ δ), the impurity */
      const g=voronoi(), nx=300, ny=150, W=6, H=3, thick=R.par[2]/6;
      a2.imshow(nx,ny,(i,j)=>{ const x=(i+0.5)/nx*W-0.5, y=H-(j+0.5)/ny*H-0.5; let d1=1e9,d2=1e9,k1=0;
        for(let m=0;m<g.length;m++){ const dd=(x-g[m][0])**2+(y-g[m][1])**2; if(dd<d1){ d2=d1; d1=dd; k1=m; } else if(dd<d2) d2=dd; }
        const gap=(Math.sqrt(d2)-Math.sqrt(d1))/2, gb=gap<Math.max(thick,0.7*W/nx), sh=200+((k1*37)%40);
        return gb?[60,90,150]:[sh,sh+5,sh+12]; },[0,W,H,0]);
      const px=[],py=[]; for(const z of R.zs){ if(z<H){ px.push(Math.random()*W); py.push(z); } }
      a2.plot(px,py,{ls:"none",marker:".",ms:3,color:"#d62728",label:"impurity"}); a2.lockX=[0,W]; a2.lockY=[0,H]; }

        {val:(i,j)=>M[i][j],cbar:true,vmin:lo,vmax:hi,cbarLabel:"ln c"}); }
  }
  f.draw();
}
