<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);

/* the coils and the aluminium core: two coupled coils and two eddy-current loops in the rod */
const REF={f:1000, R1:52.57, L1:71.40e-3, R2:42.96, L2:55.18e-3, k12:0.844,
  Ra:1.000e-4, La:5.25217e-8, Rb:1.000e-4, Lb:4.13866e-8, M1a:3.31708e-5, M2a:1.67065e-5, M1b:2.01123e-5, M2b:1.94528e-5, Mab:0, E:10.45, rint:33.0};
function cholOK(M){ const n=M.length, L=M.map(()=>Array(n).fill(0));

/* nodal analysis with inductive branches (their currents are unknowns, coupled through M) */
function solveNet(nodes,res,src,lbr,Mm,gnd){
  const vmap={}; let k=0; for(const n of nodes) if(n!==gnd&&!(n in vmap)) vmap[n]=k++;
  const ns=src.length, nl=lbr.length, N=k+ns+nl, A=Array.from({length:N},()=>Array.from({length:N},()=>[0,0])), b=Array.from({length:N},()=>[0,0]);
  const vi=n=>n in vmap?vmap[n]:-1, add=(r,c,v)=>{ if(r>=0&&c>=0){ A[r][c][0]+=v[0]; A[r][c][1]+=v[1]; } };
  for(const [a,bn,R] of res){ const g=1/R, ia=vi(a), ib=vi(bn); add(ia,ia,[g,0]); add(ib,ib,[g,0]); add(ia,ib,[-g,0]); add(ib,ia,[-g,0]); }
  for(const n in vmap) add(vmap[n],vmap[n],[1e-9,0]);
  src.forEach(([a,bn,E],j)=>{ const row=k+j, ia=vi(a), ib=vi(bn); add(ia,row,[1,0]); add(ib,row,[-1,0]); add(row,ia,[1,0]); add(row,ib,[-1,0]); b[row]=E; });
  lbr.forEach(([a,bn,Rs,Ls],j)=>{ const row=k+ns+j, ia=vi(a), ib=vi(bn); add(ia,row,[1,0]); add(ib,row,[-1,0]); add(row,ia,[1,0]); add(row,ib,[-1,0]);
    for(let l=0;l<nl;l++){ const col=k+ns+l; if(l===j){ A[row][col][0]-=Rs; A[row][col][1]-=OMEGA*Ls; } else A[row][col][1]-=OMEGA*Mm[j][l]; } });
  for(let i=0;i<N;i++){
    let p=i, best=cabs(A[i][i]); for(let r=i+1;r<N;r++){ const v=cabs(A[r][i]); if(v>best){ best=v; p=r; } }
    if(best<1e-40) return null;
    if(p!==i){ [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]]; }
    for(let r=i+1;r<N;r++){ const f=cdiv(A[r][i],A[i][i]); if(!f[0]&&!f[1]) continue; for(let c=i;c<N;c++) A[r][c]=csub(A[r][c],cmul(f,A[i][c])); b[r]=csub(b[r],cmul(f,b[i])); }
  }

  for(let i=N-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<N;c++) s=csub(s,cmul(A[i][c],x[c])); x[i]=cdiv(s,A[i][i]); }
  const V={}; V[gnd]=[0,0]; for(const n in vmap) V[n]=x[vmap[n]]; return V;

function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}

    if(u>=x&&u<=x+w&&v>=y&&v<=y+h) return "power"; if(Math.hypot(u-kx,v-ky)<kr+4) return "knob"; }
  if(CL.dmm){ const u=(p[0]-CL.dmm.x)/CL.dmm.s, v=(p[1]-CL.dmm.y)/CL.dmm.s, [x,y,r]=DMM_HIT.dial; if(Math.hypot(u-x,v-y)<r+8) return "dial"; }
  return null;
}
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=closeHit(p);
  if(h==="power"){ ST.power=!ST.power; say("power",ST.power); }
  else if(h==="dial"){ ST.dial=(ST.dial+(e.button===2?-1:1)+DIALS.length)%DIALS.length; ST.dt=0; say("dial",DIALS[ST.dial]); }
  else if(h==="knob"){ knobDrag={y:p[1],a:ST.amp}; } });
closeCv.addEventListener("pointermove",e=>{ if(!knobDrag) return; const p=clpos(e); ST.amp=Math.max(0,Math.min(1,knobDrag.a+(knobDrag.y-p[1])/180)); });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), h=closeHit(p); if(!h) return; e.preventDefault();
  if(h==="knob") ST.amp=Math.max(0,Math.min(1,ST.amp+(e.deltaY<0?1:-1)*(e.shiftKey?0.002:0.01)));
  if(h==="dial"){ ST.dial=Math.max(0,Math.min(DIALS.length-1,ST.dial+(e.deltaY<0?-1:1))); ST.dt=0; } },{passive:false});
$("wRed").onclick=()=>{ ST.col="red"; renderPanel(); }; $("wBlack").onclick=()=>{ ST.col="black"; renderPanel(); };
$("wClear").onclick=()=>{ for(const w of ST.wires) ST.left[w.col]++; ST.wires=[]; cancelPend(); say("cleared"); };
$("pSwap").onclick=()=>{ const v=ST.probe.V; ST.probe.V=ST.probe.C; ST.probe.C=v; ST.dt=0; say("swapped"); };
$("pOff").onclick=()=>{ ST.probe={V:null,C:null}; say("probeOff"); };
$("noteBtn").onclick=()=>{ const t=d(); ST.notes.push(t.noteRow(ST.dial>0?(ST.disp.startsWith("1   ")?"1":ST.disp)+" ("+DIALS[ST.dial]+")":"OFF",ST.probe.V?sockLabel(ST.probe.V):"—",ST.probe.C?sockLabel(ST.probe.C):"—",ST.rodIn)); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderPanel(){ $("wRed").className=ST.col==="red"?"on":""; $("wBlack").className=ST.col==="black"?"on":""; }
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]);
  if(hand&&hand.item) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pend) L.push([t.st.pend(sockLabel(ST.pend.a)),false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-wire").textContent=t.hWire; $("wRed").textContent=t.red; $("wBlack").textContent=t.black; $("t-wirehint").textContent=t.wireHint; $("wClear").textContent=t.clear;
  $("t-h-probe").textContent=t.hProbe; $("pSwap").textContent=t.swap; $("pOff").textContent=t.off; $("t-probehint").textContent=t.probeHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2012 E2 — 전자기 유도 · HaslaLab":"APhO 2012 E2 — Electromagnetic Induction · HaslaLab";
  renderPanel(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  ST.dt-=dt; if(ST.dt<=0){ ST.disp=dmmRead(); ST.dt=0.5; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
