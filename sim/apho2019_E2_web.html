<meta name="description" content="APhO 2019 실험 2를 브라우저에서 실행합니다. 나무 받침대 위 유리접시의 페로플루이드에 손으로 밀어 평면 펄스를 만들고, 나일론 볼트로 기울여 깊이가 변하는 유체에서 휘는 파면, 채널 속 작은 자석 위 융기에서의 굴절, 큰 자석을 치워 만드는 펄스를 25 fps 카메라 프레임과 투명 그리드로 직접 잽니다. 계산은 대신 해주지 않습니다.">

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};

    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;

      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;

let cdrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  const z=tab==="cam"?camMap().z:Math.min((CLW-60)/(TRUE.baseLen+80),(CLH-40)/120);
  if(h.k==="grid") cdrag={o:ST.grat,p,x:ST.grat.x,y:ST.grat.y,z,sy:1}; else if(h.k==="rulC") cdrag={o:ST.rul,p,x:ST.rul.x,y:ST.rul.y,z,sy:1}; else if(h.k==="rulS") cdrag={o:ST.rulS,p,x:ST.rulS.x,y:ST.rulS.y,z,sy:-1};
  if(cdrag) closeCv.setPointerCapture(e.pointerId); });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e); cdrag.o.x=cdrag.x+(p[0]-cdrag.p[0])/cdrag.z; cdrag.o.y=cdrag.y+cdrag.sy*(p[1]-cdrag.p[1])/cdrag.z; });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ if(tab!=="cam"||!ST.rec) return; e.preventDefault(); goFrame(ST.frame+(e.deltaY<0?-1:1)); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("pushBtn").onclick=()=>shoot("plane"); $("baseBtn").onclick=()=>shoot("plane2"); $("pullBtn").onclick=()=>shoot("point");
$("setMagBtn").onclick=()=>{ if(!isM("bmag")){ say("needBmag"); return; } ST.bmagReady=true; say("bmagReady"); };
$("f0").onclick=()=>goFrame(0); $("fm").onclick=()=>goFrame(ST.frame-1); $("fp").onclick=()=>goFrame(ST.frame+1); $("fplay").onclick=()=>{ ST.playing=!ST.playing&&ST.rec; };
for(const [id,dt] of [["b1",1],["bq",0.25],["bmq",-0.25],["bm1",-1]]) $(id).onclick=()=>turnBolts(dt);
$("bZero").onclick=()=>{ ST.turns=0; }; $("bLevel").onclick=()=>{ ST.tiltTurns=0; invalidate(); say("level"); };
const smagMove=f=>{ if(!nSmag()){ say("needSmag"); return; } f(); invalidate(); say("moved"); };
$("mL").onclick=()=>smagMove(()=>{ ST.smagX=Math.max(26,ST.smagX-4); }); $("mR").onclick=()=>smagMove(()=>{ ST.smagX=Math.min(TRUE.Lx-26,ST.smagX+4); });
$("gN").onclick=()=>smagMove(()=>{ ST.smagGap=Math.max(26,ST.smagGap-3); }); $("gW").onclick=()=>smagMove(()=>{ ST.smagGap=Math.min(80,ST.smagGap+3); });
$("lampBtn").onclick=()=>{ if(ST.lampOn){ ST.lampOn=false; say("lampOff"); return; } if(!isM("lamp")){ say("needLamp"); return; } ST.lampOn=true; say("lampOn"); };
$("gridBtn").onclick=()=>{ if(ST.gridOn){ ST.gridOn=false; return; } if(!has("grid")){ say("needGrid"); return; } ST.gridOn=true; };
$("rulBtn").onclick=()=>{ if(!onBench("ruler")){ say("needRuler"); return; } ST.rul.vert=!ST.rul.vert; ST.rulS.vert=!ST.rulS.vert; };
$("noteBtn").onclick=()=>{ const n=$("note"), s=$("dFrame").textContent; n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s+"   "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
const fmtT=v=>{ const a=Math.abs(v), w=Math.floor(a+1e-9), f=Math.round((a-w)*4); return (v<-1e-9?"−":"")+((w?String(w):"")+(f?["","¼","½","¾"][f]:"")||"0"); };
function renderPanel(){ const t=d(); $("dFrame").textContent=ST.rec?t.frame(ST.frame):t.live; $("dTurn").textContent=fmtT(ST.turns)+" "+t.turns;
  $("fplay").textContent=ST.playing?t.stop:t.play; $("lampBtn").textContent=ST.lampOn?t.lampOn:t.lampOff; $("gridBtn").textContent=ST.gridOn?t.gridOn:t.gridOff; $("rulBtn").textContent=ST.rul.vert?t.rulV:t.rulH; }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.bmagReady) L.push([t.st.ready,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-drive").textContent=t.hDrive; $("pushBtn").textContent=t.push; $("baseBtn").textContent=t.pushBase; $("setMagBtn").textContent=t.setMag; $("pullBtn").textContent=t.pull;
  $("t-h-video").textContent=t.hVideo; $("videoHint").textContent=t.videoHint; $("t-h-bolts").textContent=t.hBolts; $("bZero").textContent=t.zero; $("bLevel").textContent=t.level;
  $("t-h-mag").textContent=t.hMag; $("gN").textContent=t.narrower; $("gW").textContent=t.wider; $("t-h-tools").textContent=t.hTools;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2019 E2 — 자기 활성 유체의 파동 펄스 · HaslaLab":"APhO 2019 E2 — Wave Pulses in a Magnetically Active Fluid · HaslaLab";
  renderTabs(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastPlay=0;
function tick(){
  const now=performance.now(); if(ST.playing&&now-lastPlay>220){ lastPlay=now; if(ST.frame>=NFR) ST.playing=false; else ST.frame++; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
