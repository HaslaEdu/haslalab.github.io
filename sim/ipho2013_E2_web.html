<meta name="description" content="IPhO 2013 실험 2를 브라우저에서 실행합니다. 슬롯이 파인 상자에 LED 광원, 태양 전지, 원형 구멍판, 광학 용기를 꽂고 가변 저항기와 두 멀티미터를 악어클립 도선으로 연결해 거리에 따른 전류, 전지의 특성 곡선, 최대 전력, 직렬·병렬 연결, 물을 채운 용기의 효과를 잽니다. 계산은 대신 해주지 않습니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}

   2.  THE APPARATUS
   ══════════════════════════════════════════════════════════════ */
const ITEMS=["box","lamp","psu","res","hold1","hold2","cellA","cellB","aper","shield","dmmK","dmmL","leads","vessel","water","tapem"];
const ST={ on:new Set(), pos:{}, lampSlot:null, holdSlot:null, holder:null, cellA:false, cellB:false, aper:false, vessel:false, shield:"none", resIn:false, psuIn:false,
  lampOn:false, dial:50, water:0, wires:[], sel:null, dmm:{K:{on:false,mode:"OFF"},L:{on:false,mode:"OFF"}}, read:{K:"",L:""} };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};

const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
const Rload=()=>R_MIN+(R_MAX-R_MIN)*(ST.dial/100)**1.6;
function photocurrent(cell){
  if(!ST.lampOn||ST.lampSlot===null||ST.holdSlot===null) return 0;
  const r=slotR(ST.lampSlot,ST.holdSlot); let b=TRUE.Sopen*Gf(r)*vignette(r);

}
/* the two digital multimeters (3½ digits) */
const DMM_MODES=[["OFF",null,0],["200µA","I",0.2],["2mA","I",2],["20mA","I",20],["200mA","I",200],["200mV","V",0.2],["2V","V",2],["20V","V",20]];
const modeOf=k=>DMM_MODES.find(m=>m[0]===ST.dmm[k].mode);
const dmmR=m=>m[1]==="I"?0.2/(m[2]/1000):m[1]==="V"?1e7:null;
/* the display in the units of the range: 200µA→µA, 200mV→mV, otherwise mA or V; 1999 counts */
function dmmText(val,m){ const sc=(m[0]==="200µA"||m[0]==="200mV")?1000:1, fsD=m[2]*sc, dec=fsD>=200?1:fsD>=20?2:3, res=10**-dec;
  const v=val*sc+gauss()*res*0.35; if(Math.abs(v)>1999*res) return "1   "; return (Math.round(v/res)*res).toFixed(dec); }
/* the terminals and the nodal solution (Newton–Raphson) */
const TERMS=["A+","A-","B+","B-","R1","R2","KA","KC","LV","LC"];
function solveCircuit(){
  const par={}; const find=x=>{ if(!(x in par)) par[x]=x; while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  for(const t of TERMS) find(t); for(const [a,b] of ST.wires){ const ra=find(a), rb=find(b); if(ra!==rb) par[ra]=rb; }
  const roots=[...new Set(TERMS.map(find))], idx={}; roots.forEach((r,i)=>idx[r]=i); const N=roots.length, nd=t=>idx[find(t)];
  const el=[];
  if(ST.cellA&&ST.holder) el.push({t:"C",a:"A+",b:"A-",iph:photocurrent("A"),i0:TRUE.I0A,beta:TRUE.betaA,tag:"A"});
  if(ST.cellB&&ST.holder==="dual") el.push({t:"C",a:"B+",b:"B-",iph:photocurrent("B"),i0:TRUE.I0B,beta:TRUE.betaB,tag:"B"});
  if(ST.resIn) el.push({t:"R",a:"R1",b:"R2",G:1000/Rload(),tag:"R"});
  for(const [k,a,b] of [["K","KA","KC"],["L","LV","LC"]]){ const m=modeOf(k); if(has("dmm"+k)&&ST.dmm[k].on&&m[1]) el.push({t:"R",a,b,G:1000/dmmR(m),tag:k}); }
  let v=new Array(N).fill(0);
  for(let it=0;it<300;it++){
    const F=new Array(N).fill(0), J=[...Array(N)].map(()=>new Array(N).fill(0));
    for(const e of el){ const p=nd(e.a), q=nd(e.b); let i, g;
      if(e.t==="R"){ g=e.G; i=g*(v[p]-v[q]); F[p]+=i; F[q]-=i; }
      else { const ex=Math.exp(Math.min(e.beta*(v[p]-v[q]),80)); i=e.iph-e.i0*(ex-1); g=e.i0*e.beta*ex; F[p]-=i; F[q]+=i; }
      J[p][p]+=g; J[p][q]-=g; J[q][q]+=g; J[q][p]-=g; }
    for(let i=0;i<N;i++){ F[i]+=1e-9*v[i]; J[i][i]+=1e-9; }
    const n=N-1; if(n<=0) break; const A=[]; for(let i=0;i<n;i++){ A.push([...J[i+1].slice(1),-F[i+1]]); }
    for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]]; const dd=A[c][c]; if(Math.abs(dd)<1e-18) continue;
      for(let j=c;j<=n;j++) A[c][j]/=dd; for(let r=0;r<n;r++) if(r!==c&&A[r][c]){ const f=A[r][c]; for(let j=c;j<=n;j++) A[r][j]-=f*A[c][j]; } }
    let mx=0; for(let i=0;i<n;i++){ const dd=Math.max(-0.08,Math.min(0.08,A[i][n]||0)); v[i+1]+=dd; mx=Math.max(mx,Math.abs(dd)); } if(mx<1e-11) break; }
  const V=t=>v[nd(t)], out={};
  for(const e of el) if(e.t==="R") out[e.tag]=e.G*(V(e.a)-V(e.b));
  out.vK=V("KA")-V("KC"); out.vL=V("LV")-V("LC"); return out;
}
function readMeters(){
  const s=solveCircuit();
  for(const [k,v] of [["K",s.vK],["L",s.vL]]){ const m=modeOf(k);
    if(!has("dmm"+k)||!ST.dmm[k].on){ ST.read[k]=""; continue; } if(!m[1]){ ST.read[k]=""; continue; }
    ST.read[k]=dmmText(m[1]==="I"?(s[k]||0):v,m); }
}

function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];

function vcyl(x,y,z0,z1,r,body,top,edge){

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;

    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";

      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);

      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

function lcd(str,x,y,w,h,col,ghost){

  const t=d(); if(!has("dmmK")&&!has("dmmL")){ text(t.lab.noDmm,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  [["K",0.27],["L",0.73]].forEach(([k,fx])=>{ const h=CLH-24, w=h*0.55, x0=CLW*fx-w/2, y0=12, X=f=>x0+f*w, Y=f=>y0+f*h;
    if(!has("dmm"+k)){ ctx.save(); ctx.setLineDash([6,5]); fillR(x0,y0,w,h,12,null,"#4a4f55",1.5); ctx.restore(); return; }
    fillR(x0,y0,w,h,w*0.1,"#f0a81e","#6d4a08",2); fillR(X(0.06),Y(0.03),w*0.88,h*0.94,w*0.07,"#262728","#111",1);
    fillR(X(0.14),Y(0.07),w*0.72,h*0.17,4,ST.dmm[k].on?"#a9b896":"#59624f","#111",1.5);
    const s=ST.read[k]; if(s){ if(s.startsWith("1   ")) seg7("1",X(0.22),Y(0.10),h*0.10,"#111"); else lcd(s,X(0.18),Y(0.10),w*0.62,h*0.10,"#111"); }
    const bt=(key,lab,fx2)=>{ fillR(X(fx2)-w*0.11,Y(0.27),w*0.22,h*0.045,4,"#3a3c40","#000",1); text(lab,X(fx2),Y(0.2925),"#e8eef2",Math.max(9,w*0.05),"center","700"); hitAdd(key,X(fx2)-w*0.11,Y(0.27),w*0.22,h*0.045); };
    bt("P:"+k,t.lab.power,0.25); bt("H:"+k,t.lab.hold,0.75);
    const cx=X(0.5), cy=Y(0.56), R=w*0.2; circ(cx,cy,R,"#1a1a1a","#666",2);
    const n=DMM_MODES.length; DMM_MODES.forEach((md,i)=>{ const a=-Math.PI*0.85+i*(Math.PI*1.7)/(n-1), lx=cx+Math.sin(a)*R*1.75, ly=cy-Math.cos(a)*R*1.55, on=ST.dmm[k].mode===md[0];
      text(md[0],lx,ly,on?"#f2c14e":"#d6dde2",Math.max(9,w*0.048),"center",on?"800":"600"); hitAdd("D:"+k+":"+md[0],lx-w*0.11,ly-9,w*0.22,18);
      if(on){ ctx.strokeStyle="#e8eef2"; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.sin(a)*R*0.9,cy-Math.cos(a)*R*0.9); ctx.stroke(); } });
    const jacks=k==="K"?[["mA","#c62828"],["COM","#111"]]:[["V","#c62828"],["COM","#111"]];
    jacks.forEach(([lab,col],i)=>{ const jx=X(0.32+i*0.36), jy=Y(0.88); circ(jx,jy,w*0.06,col,"#888",2); circ(jx,jy,w*0.025,"#333"); text(lab,jx,jy+w*0.1,"#e8eef2",Math.max(9,w*0.05),"center","700"); });
    text(k==="K"?"K":"L",X(0.9),Y(0.07),"#f2c14e",14,"right","800"); });
}
/* ── 4. the optical vessel from the side, with the tape stuck on it ── */
const VV={z:0,cy:42};
function vvMap(){ if(!VV.z) VV.z=(CLH-30)/100; const z=VV.z; return {z,X:x=>CLW/2+x*z,Y:y=>CLH/2-(y-VV.cy)*z,V:p=>VV.cy-(p-CLH/2)/z}; }
function drawVesselView(){
  const t=d(); if(!ST.vessel){ text(t.lab.noVessel,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  const m=vvMap(), z=m.z, w=40, wb=3;
  ctx.fillStyle="#d9d2c2"; ctx.fillRect(0,0,CLW,CLH); ctx.fillStyle="#18191b"; ctx.fillRect(0,m.Y(-wb),CLW,CLH);
  fillR(m.X(-w),m.Y(VTOP),2*w*z,(VTOP+wb)*z,2,"rgba(225,240,248,.55)","#8fb4c6",2);
  if(ST.water>0){ ctx.fillStyle="rgba(110,170,215,.55)"; ctx.fillRect(m.X(-w+2.5),m.Y(ST.water),(2*w-5)*z,ST.water*z); ctx.strokeStyle="#2f6f9e"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(m.X(-w+2.5),m.Y(ST.water)); ctx.lineTo(m.X(w-2.5),m.Y(ST.water)); ctx.stroke(); }
  ctx.strokeStyle="rgba(255,240,150,.7)"; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(0,m.Y(ZAX)); ctx.lineTo(CLW,m.Y(ZAX)); ctx.stroke(); ctx.setLineDash([]);
  if(has("tapem")){ const tx=m.X(w+1); ctx.fillStyle="#f6f2df"; ctx.fillRect(tx,m.Y(VTOP+4),16*Math.max(1,z/3),(VTOP+4)*z);
    for(let k=0;k<=VTOP+2;k++){ const py=m.Y(k), L=(k%10===0?9:k%5===0?6:3.5)*Math.max(1,z/3); if(z<2.5&&k%5) continue; ctx.strokeStyle="#222"; ctx.lineWidth=k%10===0?1.1:0.6; ctx.beginPath(); ctx.moveTo(tx,py); ctx.lineTo(tx+L,py); ctx.stroke(); if(k%10===0) text(String(k/10),tx+L+3,py,"#222",Math.max(9,Math.min(14,z*1.4)),"left","600"); } }
}
function drawClose(){
  const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CLW,CLH);
  if(tab==="box") drawBoxView(); else if(tab==="wire") drawWireView(); else if(tab==="dmm") drawDmmView(); else drawVesselView();
  ctx=old;
}
/* ══════════════════════════════════════════════════════════════
   7.  HANDS: the bench, the slots, the leads
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const inB=(p,b,m)=>b&&p[0]>=b[0]-(m||0)&&p[0]<=b[2]+(m||0)&&p[1]>=b[1]-(m||0)&&p[1]<=b[3]+(m||0);
const tName=k=>d().term[k];
function termLive(k){ if(k[0]==="A") return ST.cellA&&!!ST.holder; if(k[0]==="B") return ST.cellB&&ST.holder==="dual"; if(k[0]==="R") return ST.resIn; return has(k[0]==="K"?"dmmK":"dmmL"); }
const IN_BOX=["lamp","hold1","hold2","cellA","cellB","aper","shield","vessel","res"];
/* put something into the box (from the slot view, or a click on the box on the bench) */
function intoBox(k,slot){
  if(!has("box")){ say("needBox"); return false; }
  if(k==="res"){ ST.resIn=true; ST.on.add("res"); say("res"); return true; }
  if(k==="lamp"||k==="hold1"||k==="hold2"){ if(slot===undefined){ say("inBox"); return false; }
    if(k!=="lamp"&&ST.holder){ say("oneHolder"); return false; }
    if((k==="lamp"&&ST.holdSlot===slot)||(k!=="lamp"&&ST.lampSlot===slot)){ say("busy"); return false; }
    if(k==="lamp") ST.lampSlot=slot; else { ST.holdSlot=slot; ST.holder=k==="hold2"?"dual":"single"; }
    ST.on.add(k); say("slot",itemName(k),slot); return true; }
  if(!ST.holder){ say("needHolder"); return false; }
  if(k==="cellA"){ ST.cellA=true; ST.on.add(k); say("cellIn",itemName(k)); return true; }
  if(k==="cellB"){ if(ST.holder!=="dual"){ say("needDual"); return false; } ST.cellB=true; ST.on.add(k); say("cellIn",itemName(k)); return true; }
  if(k==="aper"){ if(!ST.cellA&&!ST.cellB){ say("needCell"); return false; } ST.aper=true; ST.on.add(k); say("aper"); return true; }
  if(k==="vessel"){ if(!ST.aper){ say("needAper"); return false; } if(ST.lampSlot!==null&&slotR(ST.lampSlot,ST.holdSlot)-VGAP-VT-VB<3+2*VT){ say("tooClose"); return false; } ST.vessel=true; ST.on.add(k); say("vessel"); return true; }
  if(k==="shield"){ if(ST.holder!=="dual"||!(ST.cellA&&ST.cellB)){ say("needDualShield"); return false; } ST.shield=ST.shield==="A"?"B":"A"; ST.on.add(k); say("shield",ST.shield); return true; }
  return false;
}
function fromBox(k){
  if(k==="lamp"){ ST.lampSlot=null; ST.lampOn=false; }
  if(k==="hold1"||k==="hold2"){ for(const j of ["cellA","cellB","aper","shield","vessel"]) if(has(j)) fromBox(j); ST.holdSlot=null; ST.holder=null; }
  if(k==="cellA"){ ST.cellA=false; if(!ST.cellB&&ST.aper) fromBox("aper"); if(ST.shield!=="none"){ ST.shield="none"; ST.on.delete("shield"); } }
  if(k==="cellB"){ ST.cellB=false; if(!ST.cellA&&ST.aper) fromBox("aper"); if(ST.shield!=="none"){ ST.shield="none"; ST.on.delete("shield"); } }
  if(k==="aper"){ ST.aper=false; if(ST.vessel) fromBox("vessel"); }
  if(k==="vessel"){ ST.vessel=false; ST.water=0; }
  if(k==="shield") ST.shield="none";
  if(k==="res") ST.resIn=false;
  ST.wires=ST.wires.filter(([a,b])=>termLive(a)&&termLive(b));
  ST.on.delete(k);
}
function returnItem(k){
  if(k==="box"){ for(const j of IN_BOX) if(has(j)) fromBox(j); }
  if(k==="leads"){ ST.wires=[]; ST.sel=null; }
  if(k==="psu") ST.lampOn=false;
  if(k==="dmmK"||k==="dmmL"){ ST.dmm[k[3]].on=false; ST.wires=ST.wires.filter(([a,b])=>a[0]!==k[3]&&b[0]!==k[3]); }
  if(k==="vessel"&&!ST.pos.vessel){ fromBox("vessel"); }
  ST.on.delete(k); say("back",itemName(k));
}
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move){ ST.on.add(hand.item); ST.pos[hand.item]=hand.orig; say("placed",itemName(hand.item)); } else say("back",itemName(hand.item)); hand=null; return; }
    const k=hand.item;
    if(IN_BOX.includes(k)&&has("box")&&inB(p,bbox("box"),10)){ if(["lamp","hold1","hold2"].includes(k)){ say("inBox"); tab="box"; renderTabs(); return; } if(intoBox(k)){ delete ST.pos[k]; hand=null; } return; }
    const [x,y]=unP(p[0],p[1],0); if(!fits(k,x,y)){ say("noFit"); return; } ST.pos[k]={x,y}; ST.on.add(k); say("placed",itemName(k)); hand=null; return; }
  const k=["dmmK","dmmL","psu","leads","water","tapem",...LOOSE,"box"].find(o=>onBench(o)&&inB(p,bbox(o),2)); if(!k) return;
  if(right){ returnItem(k); delete ST.pos[k]; return; }
  hand={item:k,move:true,orig:{...ST.pos[k]}}; ST.on.delete(k); say("picked",itemName(k));
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(hand&&hand.move){ ST.on.add(hand.item); ST.pos[hand.item]=hand.orig; } hand=null; ST.sel=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=hand&&hand.item===k; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); if(["lamp","hold1","hold2","cellA","cellB","aper","shield","vessel"].includes(k)&&has("box")){ tab="box"; renderTabs(); $("t-closecap").textContent=d().closeCap[tab]; } } drawTray(); return; } });

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
function termClick(k,right){
  if(right){ if(ST.sel){ ST.sel=null; return; } const n=ST.wires.length; ST.wires=ST.wires.filter(([a,b])=>a!==k&&b!==k); if(n!==ST.wires.length) say("wireOff",tName(k)); return; }
  if(!has("leads")){ say("needLeads"); return; } if(!termLive(k)){ say("noTerm"); return; }
  if(!ST.sel){ ST.sel=k; return; } if(ST.sel===k){ ST.sel=null; say("same"); return; }
  if(ST.wires.some(([a,b])=>(a===ST.sel&&b===k)||(a===k&&b===ST.sel))){ ST.sel=null; say("dup"); return; }
  ST.wires.push([ST.sel,k]); say("wire",tName(ST.sel),tName(k)); ST.sel=null;
}
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2, h=hitAt(p);
  if(tab==="vessel"){ if(!right){ cdrag={y:p[1],cy:VV.cy}; closeCv.setPointerCapture(e.pointerId); } return; }
  if(!h) return;
  if(h.k.startsWith("T:")){ termClick(h.k.slice(2),right); return; }
  if(h.k.startsWith("P:")){ const k=h.k[2]; ST.dmm[k].on=!ST.dmm[k].on; return; }
  if(h.k.startsWith("H:")) return;
  if(h.k.startsWith("D:")){ const [,k,md]=h.k.split(":"); ST.dmm[k].mode=md; return; }
  if(tab!=="box") return;
  if(right){ /* R-click: the topmost thing there goes back to the parts box */
    if(h.k==="holder"){ for(const j of ["vessel","shield","aper","cellB","cellA","hold1","hold2"]) if(has(j)&&(j!=="hold1"&&j!=="hold2"||ST.holder===(j==="hold2"?"dual":"single"))){ fromBox(j); say("back",itemName(j)); return; } }
    if(h.k==="lamp"){ fromBox("lamp"); say("back",itemName("lamp")); } return; }
  if(hand&&!hand.move){ const k=hand.item;
    if(["lamp","hold1","hold2"].includes(k)){ if(!h.k.startsWith("slot:")&&h.k!=="holder"&&h.k!=="lamp") return; const s=h.k.startsWith("slot:")?+h.k.slice(5):null; if(s===null){ say("busy"); return; } if(intoBox(k,s)) hand=null; return; }
    if(IN_BOX.includes(k)){ if(intoBox(k)) hand=null; return; } return; }
  if(h.k==="lamp") cdrag={what:"lamp"}; else if(h.k==="holder") cdrag={what:"hold"}; if(cdrag) closeCv.setPointerCapture(e.pointerId); });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e);
  if(cdrag.cy!==undefined){ VV.cy=cdrag.cy+(p[1]-cdrag.y)/vvMap().z; return; }
  const m=bxMap(), s=Math.max(0,Math.min(NSLOT-1,Math.round((m.U(p[0])-18)/PITCH)));
  if(cdrag.what==="lamp"&&s!==ST.holdSlot) ST.lampSlot=s; if(cdrag.what==="hold"&&s!==ST.lampSlot){ if(ST.vessel&&ST.lampSlot!==null&&slotR(ST.lampSlot,s)-VGAP-VT-VB<3+2*VT) return; ST.holdSlot=s; } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ if(tab!=="vessel") return; e.preventDefault(); const p=clpos(e), m=vvMap(), my=m.V(p[1]); VV.z=Math.min(40,Math.max((CLH-30)/100,VV.z*(e.deltaY<0?1.2:1/1.2))); VV.cy+=my-vvMap().V(p[1]); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("lampBtn").onclick=()=>{ if(ST.lampOn){ ST.lampOn=false; say("lampOff"); return; } if(ST.lampSlot===null){ say("needLamp"); return; } if(!onBench("psu")){ say("needPsu"); return; } ST.lampOn=true; say("lampOn"); };
const setDial=v=>{ ST.dial=Math.max(0,Math.min(100,+v.toFixed(1))); $("resDial").value=ST.dial; };
$("resDial").oninput=e=>setDial(+e.target.value);
for(const [id,dv] of [["r-1",-1],["r-01",-0.1],["r01",0.1],["r1",1]]) $(id).onclick=()=>setDial(ST.dial+dv);
function addWater(dz){ if(!ST.vessel||!has("water")){ say("needWater"); return; } ST.water=Math.max(0,Math.min(VTOP-2,ST.water+dz+gauss()*0.2)); if(ST.water<0.3) ST.water=0; say("water",(dz>0?"+":"")+dz+" mm"); }
for(const [id,dz] of [["w5",5],["w1",1],["wm1",-1],["wm5",-5]]) $(id).onclick=()=>addWater(dz);
$("leadClr").onclick=()=>{ ST.wires=[]; ST.sel=null; };
const unit=k=>{ const m=modeOf(k); return !m[1]?"":m[0]==="200µA"?" µA":m[0]==="200mV"?" mV":m[1]==="I"?" mA":" V"; };
$("noteBtn").onclick=()=>{ const n=$("note"), s=["K","L"].map(k=>k+": "+(ST.read[k]?ST.read[k].trim()+unit(k):"—")).join("   ");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s+"   "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d();
  for(const k of ["K","L"]) $("d"+k).textContent=k+"  "+(has("dmm"+k)&&ST.dmm[k].on?(ST.read[k]?(ST.read[k].startsWith("1   ")?"1":ST.read[k])+unit(k):"----"):"----");
  $("lampBtn").textContent=ST.lampOn?t.lampOn:t.lampOff; $("resLbl").textContent=t.resLbl(ST.dial);
  const box=$("leadList"); box.innerHTML=ST.wires.length?ST.wires.map(([a,b],i)=>"<div><span style='color:"+WCOL[i%WCOL.length]+"'>●</span> "+tName(a)+" ↔ "+tName(b)+"</div>").join(""):t.noLead; }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.sel) L.push([t.st.sel(tName(ST.sel)),false]);
  if(ST.lampOn) L.push([t.st.lamp,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-meters").textContent=t.hMeters; $("meterHint").textContent=t.meterHint; $("t-h-lamp").textContent=t.hLamp; $("t-h-res").textContent=t.hRes;
  $("t-h-water").textContent=t.hWater; $("t-h-leads").textContent=t.hLeads; $("leadClr").textContent=t.leadClr; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2013 E2 — 태양 전지 · HaslaLab":"IPhO 2013 E2 — Solar Cells · HaslaLab";
  renderTabs(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastRead=0;
function tick(){
  const now=performance.now(); if(now-lastRead>350){ lastRead=now; readMeters(); }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
