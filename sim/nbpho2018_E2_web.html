  :root{

<script>
"use strict";
/* ====================================================================

   BLACK BOX

  lgCtl: ["Controls", "조작"], lgNotes: ["Notes", "안내"],

  notes: ["• The diode is ideal: it conducts one way and not at all the other.\n• The battery and the capacitor have no internal resistance; the inductor has a considerable one.\n• As a voltmeter the meter is 10 MΩ and shows a new reading every 0.4 s.\n• Take a clip off a wire while a current is flowing and watch the contact.",

  noLead: ["no lead of that kind left", "그 종류의 도선이 남아 있지 않습니다"],
  noBanana: ["only a banana plug goes into the meter's sockets", "멀티미터 단자에는 바나나 플러그만 들어갑니다"],
  noCroc: ["a wire end takes a crocodile clip, not a banana plug", "전선 끝에는 바나나 플러그가 아니라 악어 집게를 물립니다"],
  fuse: ["the meter's fuse has blown — the current ranges are dead", "멀티미터의 퓨즈가 끊어졌습니다 — 전류 범위가 죽었습니다"],
  burnt: ["the meter has burnt out", "멀티미터가 타 버렸습니다"],
  spark: ["a small spark jumped at the contact", "접점에서 작은 불꽃이 튀었습니다"],
  holdLead: ["a lead in your hand: click where its other end goes (R-click / Esc: put it away)", "도선을 들고 있음: 다른 끝을 꽂을 곳 클릭 (우클릭 / Esc: 내려놓기)"],
  wW: ["white", "흰색"], wU: ["blue", "파란색"], wK: ["black", "검은색"]

let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
const tr = k => { const e = I18N[k]; return e ? (LANG === "ko" ? e[1] : e[0]) : k; };
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

/* ---- what is inside the box (hidden) -------------------------------------- */
const BOX = { E:9.5 * (1 + 0.02 * gauss()), RL:100 * (1 + 0.05 * gauss()), C:1.0e-6 * (1 + 0.06 * gauss()), L:0.100 * (1 + 0.06 * gauss()) };

/* ---- the meter: 3999 counts, a systematic error per range -------------------- */
const DIAL = ["OFF", "400mV", "4V", "40V", "400V", "40mA", "400mA", "10A", "400Ω", "4kΩ", "40kΩ", "400kΩ"];
const RANGE = { "400mV":{k:"V", full:0.4, dec:1, mul:1000, acc:0.006}, "4V":{k:"V", full:4, dec:3, mul:1, acc:0.006}, "40V":{k:"V", full:40, dec:2, mul:1, acc:0.006}, "400V":{k:"V", full:400, dec:1, mul:1, acc:0.006},
  "40mA":{k:"A", full:0.04, dec:2, mul:1000, acc:0.01}, "400mA":{k:"A", full:0.4, dec:1, mul:1000, acc:0.01}, "10A":{k:"A10", full:10, dec:2, mul:1, acc:0.015},
  "400Ω":{k:"R", full:400, dec:1, mul:1, acc:0.01, it:1e-3}, "4kΩ":{k:"R", full:4000, dec:3, mul:1e-3, acc:0.01, it:1e-4}, "40kΩ":{k:"R", full:40000, dec:2, mul:1e-3, acc:0.01, it:1e-5}, "400kΩ":{k:"R", full:400000, dec:1, mul:1e-3, acc:0.01, it:1e-6} };
const CAL = {}; for (const r in RANGE){ const a = RANGE[r].acc; CAL[r] = {g:Math.max(-0.8, Math.min(0.8, 0.35 * gauss())) * a, o:Math.max(-2, Math.min(2, Math.round(1.0 * gauss())))}; }
const R_V = 10e6, R_MA = 1.0, R_10A = 0.01, R_LEAD = 0.02;

/* ---- the state ------------------------------------------------------------------ */
const ST = { leads:[], held:null, dial:0, fuse:false, burnt:false, t:0, vc:0, il:0, don:false,
  sw:{run:false, t0:0, acc:0}, spark:null, fastUntil:0 };
const TERMS = ["W", "U", "K", "X10A", "XmA", "XCOM", "XV"];
function elements(){ const E = [];
  for (const l of ST.leads) if (l.b) E.push([l.a, l.b, "R", R_LEAD]);
  /* the star: battery to black, capacitor to white, inductor and diode to blue */
  E.push(["cen", "K", "V", BOX.E, 1e-3]);
  E.push(["W", "cen", "C", BOX.C]);
  E.push(["cen", "lm", "R", BOX.RL]); E.push(["lm", "ld", "L", BOX.L]); E.push(["ld", "U", "D"]);
  const R = RANGE[DIAL[ST.dial]] || {};
  if (!ST.burnt){ E.push(["X10A", "XCOM", "R", R_10A]); if (!ST.fuse) E.push(["XmA", "XCOM", "R", R_MA]);
    if (R.k === "V") E.push(["XV", "XCOM", "R", R_V]);
    if (R.k === "R") E.push(["XCOM", "XV", "I", R.it], ["XV", "XCOM", "R", 100 / R.it]); }
  return E; }
function gaussSolve(A, b){ const n = b.length, Mx = A.map((r, i) => { const x = Array.from(r); x.push(b[i]); return x; });
  for (let c = 0; c < n; c++){ let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(Mx[r][c]) > Math.abs(Mx[p][c])) p = r; [Mx[c], Mx[p]] = [Mx[p], Mx[c]];
    const piv = Mx[c][c] || 1e-30; for (let r = c + 1; r < n; r++){ const k = Mx[r][c] / piv; if (!k) continue; for (let j = c; j <= n; j++) Mx[r][j] -= k * Mx[c][j]; } }
  const x = new Float64Array(n); for (let r = n - 1; r >= 0; r--){ let s = Mx[r][n]; for (let j = r + 1; j < n; j++) s -= Mx[r][j] * x[j]; x[r] = s / (Mx[r][r] || 1e-30); } return x; }
/* one backward-Euler step of length h: the capacitor and the inductor as companion
   sources, the diode either a closed contact or an open one, chosen until consistent */
function solveStep(h, don){ const E = elements();
  const nodes = [...new Set(TERMS.concat(["cen", "lm", "ld"], ST.leads.flatMap(l => [l.a, l.b]).filter(Boolean)))].filter(n => n !== "K"), idx = new Map(nodes.map((n, i) => [n, i])), Nn = nodes.length;
  const Gm = Array.from({length:Nn}, () => new Float64Array(Nn)), I = new Float64Array(Nn);
  const st = (a, b, g) => { const ia = idx.get(a), ib = idx.get(b); if (ia !== undefined) Gm[ia][ia] += g; if (ib !== undefined) Gm[ib][ib] += g; if (ia !== undefined && ib !== undefined){ Gm[ia][ib] -= g; Gm[ib][ia] -= g; } };
  const inj = (a, i) => { const ia = idx.get(a); if (ia !== undefined) I[ia] += i; };
  for (const [a, b, k, v, r] of E){
    if (k === "R") st(a, b, 1 / v);
    else if (k === "V"){ st(a, b, 1 / r); inj(a, v / r); inj(b, -v / r); }
    else if (k === "I"){ inj(a, -v); inj(b, v); }
    else if (k === "C"){ const g = v / h; st(a, b, g); inj(a, g * ST.vc); inj(b, -g * ST.vc); }
    else if (k === "L"){ const g = h / v; st(a, b, g); inj(a, -ST.il); inj(b, ST.il); }
    else if (k === "D") st(a, b, don ? 1 / 0.02 : 1e-10); }

  const V = gaussSolve(Gm, I); return t => t === "K" ? 0 : (V[idx.get(t)] || 0); }
let SOL = t => 0;
function advance(h){ let don = ST.don, s;
  for (let it = 0; it < 4; it++){ s = solveStep(h, don); const vd = s("ld") - s("U"), il = ST.il + h / BOX.L * (s("lm") - s("ld"));
    const want = don ? il > 0 : vd > 1e-6; if (want === don) break; don = want; }

    let vmax = 0; for (const t of TERMS.concat(["cen", "lm", "ld"])) vmax = Math.max(vmax, Math.abs(s(t)));

  while (left > 1e-12){ const fast = ST.t < ST.fastUntil, h = fast ? Math.min(fine, left) : Math.min(left, 0.004); advance(h); ST.t += h; left -= h;

  if (imA > 0.45){ ST.fuse = true; flash(tr("fuse")); topologyChanged(null); }
  if (i10 > 12){ ST.burnt = true; flash(tr("burnt")); } }

function meterReading(){ const d = DIAL[ST.dial]; if (d === "OFF" || ST.burnt) return ""; const R = RANGE[d], c = CAL[d], lsd = Math.pow(10, -R.dec), s = SOL;
  let x;
  if (R.k === "V") x = (s("XV") - s("XCOM")) * R.mul;
  else if (R.k === "A") x = ST.fuse ? 0 : (s("XmA") - s("XCOM")) / R_MA * R.mul;
  else if (R.k === "A10") x = (s("X10A") - s("XCOM")) / R_10A;
  else { const v = s("XV") - s("XCOM"); if (v > 2.9) return "OL"; x = v / R.it * R.mul; }
  x = x * (1 + c.g) + (c.o + 0.5 * gauss()) * lsd;

  return x.toFixed(R.dec); }
const swTime = () => ST.sw.acc + (ST.sw.run ? (performance.now() - ST.sw.t0) / 1000 : 0);

const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }

  if (id && id.startsWith("le:") && (ST.held !== null || (hand && hand.lead !== undefined))){ const [, i, e] = id.split(":"), l = ST.leads[+i]; if (+i !== ST.held) termClick(e === "a" ? l.a : l.b); return; }
  if (ST.held !== null) return;
  if (id && id.startsWith("le:")){ const [, i, e] = id.split(":"), l = ST.leads[+i], off = e === "a" ? l.a : l.b; if (e === "a"){ l.a = l.b; l.ka = [l.ka[1], l.ka[0]]; } l.b = null; ST.held = +i; topologyChanged(off); return; }
  if (id === "swStart"){ swToggle(); return; }
  if (id === "swReset"){ swReset(); return; }
  if (id === "mdial"){ const c = P3(...mW(MDIAL[0], MDIAL[1])); ST.dial = (ST.dial + (p[0] > c[0] ? 1 : -1) + DIAL.length) % DIAL.length; readNow(); return; }
  if (view3 === "3d"){ if (id === "meter") showView("meter"); else if (id === "watch") showView("watch"); else if (id === "bbox" || (id && id.startsWith("w:"))) showView("box"); } }
function swToggle(){ const s = ST.sw; if (s.run){ s.acc += (performance.now() - s.t0) / 1000; s.run = false; } else { s.t0 = performance.now(); s.run = true; } }
function swReset(){ if (!ST.sw.run) ST.sw.acc = 0; }
cv3.addEventListener("pointerdown", e => { const p = p3e(e); m3 = p;
  if (e.button === 1 || e.button === 2){ e.preventDefault(); cv3.setPointerCapture(e.pointerId); down3 = {p, id:null, moved:false, shift:true, btn:e.button}; return; }
  if (e.button) return; cv3.setPointerCapture(e.pointerId); const id = pick3(p[0], p[1]);
  down3 = {p, id, moved:false, shift:e.shiftKey || view3 !== "3d"}; });
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0] - down3.p[0], p[1] - down3.p[1]) > 3) down3.moved = true; if (!down3.moved) return;
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.02, CAM.pitch + dy * 0.006)); }
  cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", e => { cv3.classList.remove("grabbing");
  if (down3 && down3.btn){ const d = down3; down3 = null; if (!d.moved && d.btn === 2) rclick3(e); return; }
  if (down3 && !down3.moved) leftClick(down3.p, down3.id); down3 = null; });
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = p3e(e), s = e.deltaY < 0 ? 1 : -1, id = pick3(p[0], p[1]);
  if (id === "mdial"){ ST.dial = (ST.dial + s + DIAL.length) % DIAL.length; readNow(); return; }
  const f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(300, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive:false});
window.addEventListener("keydown", e => { if (e.key === "Escape"){ dropHeld(); hand = null; drawTray(); } });

/* ---- panel and loop ---------------------------------------------------------- */
document.getElementById("bSw").onclick = swToggle;
document.getElementById("bSwR").onclick = swReset;
document.getElementById("bClear").onclick = () => { const had = ST.leads.filter(l => l.b); ST.leads = []; ST.held = null; if (had.length) topologyChanged(wireEnd(had[0])); drawTray(); };
function panel(){ document.getElementById("bSw").className = ST.sw.run ? "on" : "";
  const w = []; if (FLASH.msg && performance.now() - FLASH.t < 5000) w.push(FLASH.msg); if (ST.fuse) w.push(tr("fuse")); if (ST.burnt) w.push(tr("burnt"));
  const held = ST.held !== null || (hand && hand.lead !== undefined) ? tr("holdLead") : "";
  const html = w.map(s => '<div class="w">' + s + "</div>").join("") + (held ? "<div>" + held + "</div>" : "");
  const el = document.getElementById("wwarn"); if (el._h !== html){ el.innerHTML = html; el._h = html; } }
let lastT = performance.now(), lastRead = 0;
function readNow(){ lastRead = 0; }
function draw3(){ const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx3.createLinearGradient(0, 0, 0, CAM.H); g.addColorStop(0, "#2a3038"); g.addColorStop(1, "#1b1f25"); ctx3.fillStyle = g; ctx3.fillRect(0, 0, CAM.W, CAM.H);
  begin3(); scene3(); render3(ctx3); cv3.style.cursor = hand || ST.held !== null ? "copy" : ""; }
(function loop(){ try { const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; step(dt);
    if (now - lastRead > 400){ lastRead = now; const r = meterReading(); if (r !== MSHOW){ MSHOW = r; drawMeter(); } }
    draw3(); panel(); } catch (err) { console.error(err); } requestAnimationFrame(loop); })();
function applyLang(){ document.documentElement.lang = LANG;
  document.title = LANG === "ko" ? "NBPhO 2018 P9 — 블랙박스 · HaslaLab" : "NBPhO 2018 P9 — Black Box · HaslaLab";
  document.getElementById("h1").textContent = tr("title"); document.getElementById("sub").textContent = tr("sub"); document.getElementById("t-tray").textContent = tr("tray");
  for (const k of VIEWS) document.getElementById("vt" + k).textContent = tr("vt" + k); document.getElementById("t-cap3").textContent = tr("cap_" + view3);
  document.getElementById("lgCtl").textContent = tr("lgCtl"); document.getElementById("lgNotes").textContent = tr("lgNotes"); document.getElementById("txNotes").textContent = tr("notes");
  document.getElementById("bClear").textContent = tr("clear"); document.getElementById("bSw").textContent = tr("swBtn"); document.getElementById("bSwR").textContent = tr("swReset");
  document.getElementById("btn-en").className = LANG === "en" ? "on" : ""; document.getElementById("btn-ko").className = LANG === "ko" ? "on" : ""; trayLayout(); }
document.getElementById("btn-ko").addEventListener("click", () => { LANG = "ko"; applyLang(); });
document.getElementById("btn-en").addEventListener("click", () => { LANG = "en"; applyLang(); });
drawMeter(); layout3(); applyLang(); showView("3d");

</script>
