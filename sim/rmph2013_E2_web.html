<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}

header li{margin:2px 0}

     padding:6px 16px 10px}

     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

<body>
<script>
/* RMPh 2013 problem 2 on the 3-D bench, after the official solution: between red (+) and black there is an LED;
   between yellow and blue the 4 mF capacitor (blue +), charged through the three-position switch (position 1
   closes it) by an inner cell (≈ 3 V) and a photoresistor (≈ 15 kΩ in the dark).  The red push button shorts the
   capacitor.  When current flows forward through the LED its light halves the photoresistor's resistance —
   the "optical coupling".  The source is 9 V in series with 1.5 kΩ; the multimeter is used only as a 20 V
   voltmeter (10 MΩ). */
var PROGRAM = {
  title: { ko: 'RMPh 2013 실험 2 — 블랙박스', en: 'RMPh 2013 Problem 2 — Black box' },
  subtitle: { ko: '블랙박스 속에는 저항, 축전기, 다이오드, 전지, 스위치 같은 회로 소자가 들어 있습니다 (축전기는 C = 4 mF). 상자를 열지 말고 소자의 종류와 네 바깥 단자(빨강·검정·노랑·파랑)에 어떻게 이어졌는지 밝히세요. 장비: 플러그 도선, 전원(9 V 전지 + 보호 저항 1.5 kΩ), 스톱워치, 멀티미터(20 V 전압계로만), 블랙박스(누름 단추, 3단 스위치).',
              en: 'The black box holds circuit elements such as resistors, a capacitor, diodes, a battery and switches (the capacitor is C = 4 mF). Without opening it, find the elements and how they are joined to the four outer sockets (red, black, yellow, blue). Equipment: a wire with plugs, a source (9 V battery + 1.5 kΩ protective resistor), a stopwatch, a multimeter (only as a 20 V voltmeter) and the black box (push button, three-position switch).' },
  notes: { ko: [
    '문제지의 표: A 열 1 = 전원 + 를 첫 단자에, 2 = 전원 − 를 첫 단자에, 3 = 두 단자를 도선으로, 4 = 아무것도 잇지 않음. 그때마다 여섯 단자 쌍의 전압을 COM 을 첫 단자에 두고 재며, 시간에 따라 변하면 (전압, 시간) 쌍을 적습니다. 매 측정 전에 빨간 단추를 누르세요. 표 1.1 은 스위치 1, 표 1.2 는 스위치 0.',
    '“갈바닉 결합”은 전기적 연결, “광학적 결합”은 한 소자의 빛이 다른 소자의 특성을 바꾸는 것(전기적으로는 이어지지 않음)입니다. LED 는 순방향일 때 빛나고, 광저항은 빛을 받으면 저항이 줄어듭니다.',
    '공식 해답: 빨강–검정에 LED, 노랑–파랑에 축전기와 (내부 전지 2.7–3.2 V + 저항 10–30 kΩ, 스위치 1 에서 연결), LED 가 켜지면 저항이 절반 — 광저항과의 광학적 결합. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'The sheet\'s tables: column A 1 = source + to the first socket, 2 = source − to the first socket, 3 = the two sockets joined by the wire, 4 = nothing joined. Each time read the six socket pairs with COM on the first one; if it drifts, note (voltage, time) pairs. Press the red button before each measurement. Table 1.1 with the switch at 1, table 1.2 at 0.',
    '"Galvanic coupling" is an electric connection; "optical coupling" is one device\'s light changing another\'s properties (not joined electrically). An LED glows when forward biased; a photoresistor\'s resistance drops in light.',
    'Official solution: an LED between red and black; between yellow and blue the capacitor and (an inner cell of 2.7–3.2 V + a 10–30 kΩ resistor, joined at switch position 1); with the LED lit the resistance halves — optical coupling with a photoresistor. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, sw: null, c: null, pos: 1, btn: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 빨강·검정·노랑·파랑 단자의 블랙박스(윗면에 빨간 누름 단추와 3단 스위치), 9 V 전원(빨강 +, 검정 −), 멀티미터, 스톱워치, 도선.',
           en: 'On the desk: the black box with red, black, yellow and blue sockets (a red push button and a three-position switch on top), the 9 V source (red +, black −), the multimeter, a stopwatch and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '빨간 단추 클릭: 누르기 (축전기 방전) · 스위치 클릭: 1 → 0 (세로) → 0 (옆) → 1',
                '멀티미터: 클릭해서 가까이 본 뒤 다이얼을 20 V 로 — VΩ 와 COM 잭 · 스톱워치: <b>Space</b>'],
           en: ['Wires: click a socket to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Click the red button: press it (discharges the capacitor) · click the switch: 1 → 0 (vertical) → 0 (lateral) → 1',
                'Multimeter: click it to look closer, then turn the dial to 20 V — the VΩ and COM sockets · stopwatch: <b>Space</b>'] },
  notePlaceholder: { ko: '예) 스위치 1, 4(아무것도): 노랑–파랑 (0 V, 0 s); (1.00 V, 22 s) …', en: 'e.g. switch 1, case 4 (nothing): yellow–blue (0 V, 0 s); (1.00 V, 22 s) …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var Ei = 3.0 * (1 + S.sys('Ei', 0.05)), Rd = 15e3 * (1 + S.sys('Rd', 0.1)), Cap = 4.4e-3 * (1 + S.sys('C', 0.04)), Es = 9.3 * (1 + S.sys('Es', 0.01));
    var nv = 1.9 * 0.02585, led = { Is: 5e-3 / Math.exp(1.78 / nv), n: 1.9, Gl: 1e-11, Rs: 8 };
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.004), A: 0, R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 6 }), sw = LAB.sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit(), Iled = 0;
    var RANGES = [['OFF'], ['V', 2], ['V', 20], ['V', 200]];
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10],
      home: { yaw: -0.3, pitch: 0.85, k: 13, tx: 4, ty: 0, tz: 2 },
      views: {
        box: { yaw: 0, pitch: 0.95, k: 40, tx: -16, ty: 4, tz: 2, title: { ko: '블랙박스', en: 'The black box' } },
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 10, ty: 3.4, tz: 2, title: { ko: '멀티미터', en: 'Multimeter' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 28, ty: 1.7, tz: 8, title: { ko: '스톱워치', en: 'Stopwatch' } }
      },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        if (b.clicked('c:btn')) LAB.btn = 0.4;
        if (b.clicked('c:sw3')) LAB.pos = { 1: 0, 0: 2, 2: 1 }[LAB.pos];
        LAB.btn = Math.max(0, LAB.btn - b.real);
        B3.desk(-34, 40, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-16, 2], [{ name: 'R', col: '#c0392b', label: '' }, { name: 'K', col: '#1b1b1b', label: '' }, { name: 'Y', col: '#e0c020', label: '' }, { name: 'B', col: '#2f6ea6', label: '' }], { label: 'RMPh 2013 · 2', w: 18, d: 10 });
        /* the push button and the three-position switch on the lid */
        B3.cyl3('y', 4.5, 4.5 + (LAB.btn > 0 ? 0.15 : 0.6), -21, -0.5, 0.9, '#c0392b', { seg: 18, cap: '#d0493b', id: 'c:btn' });
        B3.cyl3('y', 4.5, 4.9, -13, -0.5, 1.3, '#2b2f35', { seg: 18, cap: '#33373e', id: 'c:sw3' });
        var la = LAB.pos === 1 ? [1.4, 0.6, 0] : LAB.pos === 0 ? [0, 1.6, 0] : [0, 0.6, 1.4];
        B3.cylAB([-13, 4.9, -0.5], [-13 + la[0], 4.9 + la[1], -0.5 + la[2]], 0.25, '#ddd', { seg: 8, id: 'c:sw3' });
        B3.box3(-11.6, -10.6, 4.5, 4.52, -1.2, 0.2, '#3fa34d', { noObst: true }); B3.text3([-11.5, 4.53, 0.1], [1, 0, 0], [0, 0, -1], '1', 0.9, '#fff', { weight: '800' });
        B3.box3(-14.6, -13.6, 4.5, 4.52, 1.0, 2.2, '#c0392b', { noObst: true }); B3.text3([-14.5, 4.53, 2.1], [1, 0, 0], [0, 0, -1], '0', 0.9, '#fff', { weight: '800' });
        var src = B3.cells(b, leads, 'src', [-6, 13], { n: 1, e: Es, r: 1500 });
        B3.text3([-8, 1.02, 15.5], [1, 0, 0], [0, 0, -1], '9 V · 1.5 kΩ', 0.6, '#e8e8e8', { weight: '700' });
        var m = B3.dmm(b, 'dmm', [10, 2], dm, leads, { ranges: RANGES });
        B3.stopwatch(b, 'sw', [28, 8], sw);
        c.reset();
        var dl = c.D(T.R, T.K, led);
        c.C(T.B, T.Y, Cap, 'cap'); c.R(T.B, T.Y, 5e6);
        if (LAB.btn > 0) c.R(T.B, T.Y, 2);
        var Rp = Rd / (1 + Math.max(0, Iled) / 4.8e-3);
        if (LAB.pos === 1) { c.V('box.e', T.Y, Ei, 0.5); c.R('box.e', T.B, Rp); }
        src.stamp(c); m.stamp(c); leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.05)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-5);
        Iled = c.cur(dl); m.read(c);
        leads.draw(b);
        LAB.state = { Uc: c.V_(T.B) - c.V_(T.Y), Iled: Iled, Rp: Rp, pos: LAB.pos, read: dm.now };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
