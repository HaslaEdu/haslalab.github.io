var PROGRAM = {
  title: { ko: 'RMPh 2013 실험 1 — 다공성', en: 'RMPh 2013 Problem 1 — Porosity' },
  subtitle: { ko: '금속 스펀지: 반지름 R = 200 µm 의 구형 입자가 구멍(가장 큰 것의 지름 10 µm)으로 뚫린 다공성 금속 가루. A. 10 cm³ 주사기에 가루 6 cm³(1.2 g)를 넣고 막아 공기를 압축하며 부피–압력을 재어 고체의 밀도를 구하세요. B. 가루 6 cm³ 와 적시지 않는 액체 4 cm³ 를 넣고 천천히 눌러, 구멍의 종류 수, 입자의 부피, 구멍 종류별 부피, 구멍의 겉넓이, 입자 수, 구멍의 길이와 수를 어림하세요. 온도는 일정합니다.',
              en: 'Metallic sponges: a porous metal powder of spherical particles (R = 200 µm) crossed by pores (the largest 10 µm across). A. With 6 cm³ (1.2 g) of powder in a 10 cm³ syringe, closed, compress the air and record volume against pressure to find the density of the solid. B. With 6 cm³ of powder and 4 cm³ of a non-wetting liquid, press slowly and estimate the number of pore types, the particles\' volume, each pore type\'s volume, the pore surface area, the number of particles, and the pores\' length and number. The temperature stays constant.' },
  notes: { ko: [
    '문제지는 A, B 의 측정을 표로 줍니다(표 1: 10 cm³ 1.000·10⁵ Pa … 6 cm³ 1.714·10⁵ Pa; 표 2: 1.0/1.6/1.6/8.0/8.0·10⁵ Pa 에서 10.00/9.16/8.74/7.07/5.11 cm³). 여기서는 그 측정을 직접 합니다.',
    '공식 해답: A 는 V 대 1/p 직선의 절편이 고체 부피 v_m = 0.41 cm³, 고체의 밀도 ≈ 2926 kg/m³ (가루 전체의 밀도는 200 kg/m³). B 는 압력이 1.6, 8.0 bar 에서 멈추는 두 구간 — 구멍이 두 종류입니다.',
    '모래 문제(I)는 생각 문제라 여기에는 없습니다. 압력계 눈금은 절대 압력(kPa)입니다.'], en: [
    'The sheet gives A and B as tables (table 1: 10 cm³ 1.000·10⁵ Pa … 6 cm³ 1.714·10⁵ Pa; table 2: 10.00/9.16/8.74/7.07/5.11 cm³ at 1.0/1.6/1.6/8.0/8.0·10⁵ Pa). Here you take those measurements yourself.',
    'Official solution: in A the intercept of V against 1/p is the solid volume v_m = 0.41 cm³, the solid\'s density ≈ 2926 kg/m³ (the powder as a whole 200 kg/m³). In B the pressure halts at 1.6 and 8.0 bar — two pore types.',
    'The beach-sand question (I) is a thinking question and is not here. The gauge reads absolute pressure (kPa).'] }
};

var LAB = { mode: 'A', V: 10, fI: 0, fII: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 나사 압착기에 물린 10 cm³ 주사기(바늘 끝은 디지털 압력계로 막힘), 금속 가루 병, 적시지 않는 액체 병.',
           en: 'On the desk: a 10 cm³ syringe in a screw press (its needle end closed by a digital pressure gauge), a jar of the metal powder and a bottle of the non-wetting liquid.' },
  howto: { ko: ['나사 손잡이 좌우로 끌기 또는 휠: 피스톤 밀기/빼기 (천천히)', '가루 병 클릭: 가루만 6 cm³ 넣고 다시 시작 (A) · 액체 병 클릭: 가루 6 cm³ + 액체 4 cm³ 로 다시 시작 (B)', '주사기 클릭: 눈금 가까이 · 압력계 클릭: 표시 가까이'],
           en: ['Drag the screw handle left/right or roll the wheel: push/pull the plunger (slowly)', 'Click the powder jar: start again with 6 cm³ of powder only (A) · click the liquid bottle: start again with 6 cm³ of powder + 4 cm³ of liquid (B)', 'Click the syringe: read its scale · click the gauge: read the display'] },
  notePlaceholder: { ko: '예) A: 10.0 cm³ 101.3 kPa, 9.0 cm³ 113.0 kPa … B: …', en: 'e.g. A: 10.0 cm³ 101.3 kPa, 9.0 cm³ 113.0 kPa … B: …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var P0 = 101.3, vm = 0.41 * (1 + S.sys('vm', 0.03)), vI = 1.12 * (1 + S.sys('vI', 0.04)), vII = 2.24 * (1 + S.sys('vII', 0.04)), vl = 4, va = 10 - vm - vl - vI - vII, PI = 160 * (1 + S.sys('PI', 0.02)), PII = 800 * (1 + S.sys('PII', 0.02));
    var Ab = 1.0, L0 = 1.5, X0 = -6;            /* barrel: 1 cm³ per cm; the gauge end at X0 − L0 */
    var scl = B3.scaleTex(10, { horiz: true, width: 1.0, bg: 'rgba(255,255,255,0)', step: 0.2, px: 50 });
    var lcd = document.createElement('canvas'); lcd.width = 220; lcd.height = 70; var lg = lcd.getContext('2d'), tUpd = 0;
    function pressure() {
      if (LAB.mode === 'A') return P0 * (10 - vm) / (LAB.V - vm);
      var V = LAB.V, n = function () { return P0 * (va + vI * LAB.fI + vII * LAB.fII); }, vf = function () { return V - vm - vl - vI * (1 - LAB.fI) - vII * (1 - LAB.fII); };
      var p = n() / vf();
      if (p > PI && LAB.fI < 1) { var Vb = V - vm - vl - vI - vII * (1 - LAB.fII), f = (PI * Vb - P0 * (va + vII * LAB.fII)) / (vI * (P0 - PI)); LAB.fI = Math.max(LAB.fI, Math.min(1, f)); p = n() / vf(); }
      if (p > PII && LAB.fII < 1) { Vb = V - vm - vl - vI * (1 - LAB.fI) - vII; f = (PII * Vb - P0 * (va + vI * LAB.fI)) / (vII * (P0 - PII)); LAB.fII = Math.max(LAB.fII, Math.min(1, f)); p = n() / vf(); }
      return p;
    }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['screw'],
      home: { yaw: -0.25, pitch: 0.7, k: 22, tx: 0, ty: 2, tz: 1 },
      views: { syr: { yaw: 0, pitch: 0.35, k: 70, tx: X0 + 5, ty: 3, tz: 0, title: { ko: '주사기 눈금 (cm³)', en: 'The syringe scale (cm³)' } },
               gauge: { yaw: 0, pitch: 0.5, k: 70, tx: X0 - 5, ty: 3, tz: 0, title: { ko: '압력계', en: 'The pressure gauge' } } },
      frame: function (b) {
        if (b.clicked('m:powder')) { LAB.mode = 'A'; LAB.V = LAB.Vp = 10; LAB.fI = LAB.fII = 0; b.say('가루 6 cm³ 만 넣었습니다 (A).', 'Powder only, 6 cm³ (A).'); }
        if (b.clicked('m:liquid')) { LAB.mode = 'B'; LAB.V = LAB.Vp = 10; LAB.fI = LAB.fII = 0; b.say('가루 6 cm³ + 액체 4 cm³ (B).', 'Powder 6 cm³ + liquid 4 cm³ (B).'); }
        var ms = b.screenMoved('screw'), ws = b.wheel('screw'), Vmin = LAB.mode === 'A' ? 1.6 : 4.9;
        if (ms[0] || ws) LAB.V = Math.max(Vmin, Math.min(10, LAB.V + ms[0] * 0.02 + ws * 0.02));
        if (b.clicked('m:syr')) b.go('syr');
        if (b.clicked('c:gauge')) b.go('gauge');
        /* walk the plunger in small steps so the pores fill in order however fast it is pushed */
        var Vt = LAB.V, Vp = LAB.Vp === undefined ? Vt : LAB.Vp, nst = Math.ceil(Math.abs(Vt - Vp) / 0.005), p;
        for (var q = 1; q <= Math.max(1, nst); q++) { LAB.V = Vp + (Vt - Vp) * q / Math.max(1, nst); p = pressure(); }
        LAB.Vp = Vt;
        tUpd -= b.dt; if (tUpd <= 0) { tUpd = 0.3; lg.fillStyle = '#a9c0a2'; lg.fillRect(0, 0, 220, 70); lg.fillStyle = '#16200f'; lg.font = '700 40px monospace'; lg.textAlign = 'right';
          lg.fillText((p + HL.gauss(0.1)).toFixed(1), 170, 50); lg.font = '700 18px sans-serif'; lg.fillText('kPa', 214, 50); }
        B3.desk(-24, 24, -12, 14);
        /* the press: a rail, a fixed block at the gauge end, the screw and its handle */
        B3.box3(X0 - 9, X0 + 18, 0, 0.8, -2, 2, '#3b4048', { top: '#474c55' });
        B3.box3(X0 - 1.6, X0 - 0.8, 0.8, 4.5, -1.8, 1.8, '#4a4f55');
        B3.box3(X0 + 15.5, X0 + 16.5, 0.8, 4.5, -1.8, 1.8, '#4a4f55');
        var px = X0 + LAB.V, CY = 2.6, R = 0.56;                     /* the plunger face at x = X0 + V */
        /* the barrel, its contents, the scale */
        B3.cylAB([X0 - 0.2, CY, 0], [X0 + 10.6, CY, 0], R + 0.08, 'rgba(225,235,240,.35)', { seg: 22, id: 'm:syr' });
        var powderEnd = X0 + Math.min(LAB.V, 6), fill = LAB.mode === 'B' ? (LAB.fI * vI + LAB.fII * vII) / (vI + vII) : 0;
        B3.cylAB([X0, CY, 0], [powderEnd, CY, 0], R - 0.02, LAB.mode === 'B' ? 'rgb(' + Math.round(120 + 60 * fill) + ',' + Math.round(118 + 60 * fill) + ',' + Math.round(112 + 66 * fill) + ')' : '#7a7670', { seg: 18 });
        if (LAB.mode === 'B' && LAB.V > 6) B3.cylAB([X0 + 6, CY, 0], [px, CY, 0], R - 0.02, '#c8ccd2', { seg: 18 });
        B3.tex3(scl, 0, 0, scl.width, scl.height, [X0 - 0.2, CY + R + 0.1, 0.4], [10.4, 0, 0], [0, -0.35, 0.45], { id: 'm:syr' });
        B3.cylAB([px, CY, 0], [px + 0.4, CY, 0], R, '#222', { seg: 18 });
        B3.cylAB([px + 0.4, CY, 0], [X0 + 15.5, CY, 0], 0.18, '#c3c8cd', { seg: 10 });
        B3.cylAB([X0 + 16.5, CY, 0], [X0 + 18.5, CY, 0], 0.3, '#9aa0a6', { seg: 10, id: 'm:screw' });
        B3.cylAB([X0 + 18.5, CY - 2, 0], [X0 + 18.5, CY + 2, 0], 0.3, '#2b2f35', { seg: 10, id: 'm:screw' });
        /* the gauge on the needle end */
        B3.cylAB([X0 - 0.2, CY, 0], [X0 - 1.6, CY, 0], 0.2, '#9aa0a6', { seg: 8 });
        B3.box3(X0 - 8, X0 - 1.6, 0.8, 5.4, -1.6, 1.6, '#2b2f35', { id: 'c:gauge', top: '#33373e' });
        B3.tex3(lcd, 0, 0, 220, 70, [X0 - 7.5, 4.9, 1.61], [5.5, 0, 0], [0, -1.75, 0], { id: 'c:gauge' });
        /* the powder jar and the liquid bottle */
        B3.cyl3('y', 0, 3, -14, 9, 1.6, '#6f6b66', { seg: 20, cap: '#8a8580', id: 'm:powder' });
        B3.cyl3('y', 0, 4, -8, 9, 1.3, 'rgba(200,205,212,.9)', { seg: 20, cap: '#2b2f35', id: 'm:liquid' });
        LAB.state = { mode: LAB.mode, V: LAB.V, p: p, fI: LAB.fI, fII: LAB.fII };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
