<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111017">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>월별 문제 답안 스캔 · HaslaLab</title>
<style>
:root{color-scheme:dark;--bg:#111017;--panel:#1c1825;--ink:#ede7f6;--muted:#b0a3c1;--line:#3b334a;--accent:#c5a3f5;--deep:#17131e}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:600px;margin:auto;padding:20px 18px max(32px,env(safe-area-inset-bottom))}
.brand{font:700 22px Georgia,serif;letter-spacing:-.04em;color:var(--accent)}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}
header select{padding:6px 8px;width:auto;font-size:12px}
h1{font-size:21px;line-height:1.45;margin:0 0 8px;overflow-wrap:anywhere}.eyebrow{color:var(--accent);font-size:12px;margin:0 0 6px}
.sub,.help{font-size:13px;color:var(--muted);margin:8px 0 0}.clock{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin:15px 0}.clock b{font:600 14px ui-monospace,monospace;color:var(--ink)}.clock.warn b{color:#ffb4bd}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:14px}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600}.part-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
select,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#292232;color:var(--ink)}select{width:100%;padding:11px 12px}
button{padding:11px 13px;cursor:pointer;min-height:44px}button:hover{border-color:#a68bc5}button:disabled{opacity:.5;cursor:default}
button.pri,button.on{background:var(--accent);border-color:var(--accent);color:#20142d;font-weight:650}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shoot,.row,.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.shoot button,.row button{flex:1}.shoot .pri{flex:1 0 100%;font-size:16px}.shoot input{display:none}.chips button{flex:1;padding:8px 10px;font-size:12px}
.note{padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--deep);font-size:13px;margin:12px 0}.note.w{border-color:#77515e;color:#f2c4d1}.note.good{border-color:#527b68;color:#b5dec6}
.prev img{display:block;width:100%;border-radius:7px;background:#fff}.prev h2{overflow-wrap:anywhere}.bar{height:6px;border-radius:5px;background:#0c0911;margin-top:12px;overflow:hidden}.bar i{display:block;background:var(--accent);height:100%;transition:width .15s}
.sent{list-style:none;margin:0;padding:0}.sent li{border-bottom:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}.sent li:last-child{border:0}.sent .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.sent .meta b{color:var(--accent);font-weight:650}.sent .meta span:last-child{margin-left:auto;color:#b5dec6}.sent summary{cursor:pointer;font-size:12px;margin-top:8px;color:var(--muted)}.sent pre{font:12px/1.6 inherit;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#201a2a;border:1px solid var(--accent);padding:12px 16px;border-radius:9px;z-index:60;font-size:13px;width:max-content;max-width:92vw;box-shadow:0 10px 35px #0007}
.image-check{position:fixed;inset:0;z-index:45;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#111;overflow:auto;touch-action:pan-x pan-y}.image-check button{position:sticky;top:12px;left:12px;z-index:1;margin:12px}.image-check img{display:block;max-width:none;min-width:100%;margin:10px}
.ce,.lv{position:fixed;inset:0;background:#08070b;z-index:40;display:flex;flex-direction:column}.ce .top{padding:10px 14px;color:var(--muted);font-size:13px}.ce canvas{flex:1;width:100%;min-height:0;touch-action:none}.ce .row{padding:10px 14px max(16px,env(safe-area-inset-bottom));margin:0}
.lv .vw{position:relative;flex:1;min-height:0}.lv video,.lv canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.lv .msg{padding:10px 14px;text-align:center;font-size:13px;min-height:44px}.lv .msg.ok{color:#b5dec6}.lv .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px max(18px,env(safe-area-inset-bottom))}.lv .sh{width:68px;height:68px;border-radius:50%;border:4px solid var(--accent);background:#b896e640;padding:0}.lv .ctl button:not(.sh){min-width:78px;padding:9px 10px;font-size:12px}
@media(max-width:360px){.wrap{padding-left:12px;padding-right:12px}.card{padding:14px}.row{gap:6px}.row button{font-size:12px;padding:9px 7px}h1{font-size:19px}}
</style>
</head>
<body>
<main class="wrap">
  <header><span class="brand">HaslaLab</span><select id="language" aria-label="언어 · Language"><option value="ko">한국어</option><option value="en">English</option></select></header>
  <div id="app" aria-live="polite"><p class="note">연결하는 중… · Connecting…</p></div>
</main>
<script type="module" src="monthly-scan.js?v=541c6d13a168"></script>
</body>
</html>
