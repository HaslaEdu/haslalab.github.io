<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c2027">
<meta name="robots" content="noindex">
<title>실전 모드 · Exam mode · HaslaLab</title>
<!-- Exam mode.  A year's experiments run side by side on one long bench for five hours (the real exam gives E1
     and E2 one table and one box of parts); the parts boxes of the simulators are folded into one shared kit on
     the left, while set-ups that already sit on the bench stay as they are and get the room.  When the time is
     up the bench goes dark and thirty minutes start for scanning the paper answer sheets and working sheets
     with a phone: a QR code opens scan.html with this exam's upload token, the pages arrive here read by OCR,
     the student checks the text and submits it for grading (the community Worker, /api/lab/...).
     Only signed-in users sit it; a start costs one exam token, kept on the server.  The server also keeps the
     clock and the state (running → scanning → graded), so a reload, a closed tab or another computer comes
     back to the same exam with the time still running and spends nothing.
     URL: exam.html?c=ipho&y=2024&e=E1,E2&f=ipho2024_E1_web.html,ipho2024_E2_web.html&t=title|title&p=pdf|pdf&lang=ko -->
<style>
  :root{--bg:#1c2027;--panel:#22262d;--ink:#e8eef2;--muted:#9aa3ab;--line:#33373e;--accent:#f2c14e;--deep:#12161b;
        --red:#e5534b;--ok:#57ab5a;--desk:#3a3128;--bar:52px}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  a{color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:#2b2f36;color:var(--ink);padding:7px 13px}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.pri{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:700}
  button.red{background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}

  /* ── top bar ── */
  .bar{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:12px;padding:0 14px;
       background:var(--deep);border-bottom:1px solid var(--line);z-index:20}
  .bar .who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .bar .who b{color:var(--accent);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .who span{font-size:11.5px;color:var(--muted)}
  .bar .sp{flex:1}
  .clock{font:700 24px/1 ui-monospace,Consolas,monospace;letter-spacing:.04em;padding:6px 12px;border-radius:8px;
         background:#0b0e12;border:1px solid var(--line);min-width:128px;text-align:center}
  .clock.warn{color:#ffb4a9;border-color:#b3372f}
  .clock small{display:block;font:500 10px/1.2 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--muted);letter-spacing:0;margin-top:3px}
  .views{display:flex;gap:4px}
  .views button{padding:6px 10px;font-size:12.5px}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .lang button{border:0;border-radius:0;padding:6px 11px;font-size:12.5px;background:transparent;color:var(--muted)}
  .lang button.on{background:var(--accent);color:#1c2027}
  @media (max-width:900px){ .views,.bar .hide-s{display:none} }

  main{position:fixed;inset:var(--bar) 0 0 0}

  /* ── the bench: one shared kit, the experiments side by side ── */
  .hall{display:flex;height:100%}
  .kit{flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 10px 18px}
  .kit h2{margin:2px 0 2px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);text-align:center}
  .kit .sub{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 10px;line-height:1.45}
  .kit .grp{margin-top:12px}
  .kit .grp h3{display:flex;align-items:center;gap:6px;margin:0 0 5px;font-size:12px;color:#d6dde2}
  .kit .grp h3 i{font-style:normal;font:700 11px/1 ui-monospace,monospace;background:#0b0e12;border:1px solid var(--line);border-radius:5px;padding:3px 5px;color:var(--accent)}
  .kit canvas{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  .kit .placed{font-size:12px;color:var(--muted);background:#15181d;border:1px dashed var(--line);border-radius:6px;padding:9px 10px;line-height:1.55}
  .kit .hand{margin-top:12px;font-size:12px;color:var(--accent);background:#0b0e12;border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-height:36px}
  .desk{flex:1;min-width:0;display:flex;gap:0;overflow-x:auto;overflow-y:hidden;background:var(--desk);
        background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 160px)}
  .st{flex:1 1 0;min-width:560px;display:flex;flex-direction:column;border-right:6px solid #2a231c;transition:flex-grow .25s}
  .st.wide{flex-grow:1.35}
  .st.big{flex-grow:3}
  .st.small{flex-grow:.6;min-width:420px}
  .st:last-child{border-right:0}
  .st .lbl{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#2a231c;color:#e9dcc6;font-size:12.5px}
  .st .lbl b{font:700 12px/1 ui-monospace,monospace;background:#1c2027;color:var(--accent);border-radius:5px;padding:4px 6px}
  .st .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .lbl .pdf{margin-left:auto;font-size:12px;white-space:nowrap}
  .st iframe{flex:1;width:100%;border:0;background:var(--bg)}
  @media (max-width:760px){ .kit{flex-basis:170px} .st{min-width:92vw} }

  /* ── cards: before, after, scanning ── */
  .page{height:100%;overflow:auto;padding:28px 16px 40px}
  .card{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
  .card h1{margin:0 0 4px;font-size:22px;color:var(--accent)}
  .card .lead{margin:0 0 14px;color:var(--muted)}
  .card ol,.card ul{margin:8px 0 8px 20px;padding:0;line-height:1.75}
  .card .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .note{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:#d6dde2;margin-top:12px}
  .note.w{border-color:#6b3b37;color:#ffcfc9}
  .tasks{display:grid;gap:8px;margin:12px 0}
  .tasks div{display:flex;gap:10px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .tasks b{font:700 13px/1 ui-monospace,monospace;color:var(--accent)}
  .tasks a{margin-left:auto;font-size:12.5px}

  .scan{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;max-width:1380px;margin:0 auto}
  @media (max-width:900px){ .scan{grid-template-columns:minmax(0,1fr)} }
  .qrbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:0;align-self:start;text-align:center}
  .qrbox h2{margin:0 0 4px;font-size:18px}
  .qrbox .big{font:700 46px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.03em;margin:6px 0 2px}
  .qrbox .big.warn{color:#ffb4a9}
  .qr{background:#fff;border-radius:10px;padding:12px;display:inline-block;margin:12px 0 8px;line-height:0}
  .qr svg,.qr img{width:240px;height:240px;display:block}
  .qrbox .url{font:11px/1.4 ui-monospace,monospace;color:var(--muted);word-break:break-all;margin:4px 0 10px}
  .qrbox ol{text-align:left;font-size:13px;line-height:1.7;margin:8px 0 0 18px;padding:0}
  .pages{display:flex;flex-direction:column;gap:12px}
  .pages .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pages .head h2{margin:0;font-size:17px}
  .pages .head .sp{flex:1}
  .pg{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .pg .th{width:150px;aspect-ratio:210/297;background:#0b0e12;border-radius:6px;overflow:hidden;cursor:zoom-in}
  .pg .th img{width:100%;height:100%;object-fit:contain;display:block}
  .pg .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:12.5px}
  .pg .meta select{font:inherit;font-size:12.5px;background:#2b2f36;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  .pg .meta .st2{margin-left:auto;color:var(--muted)}
  .pg .meta .st2.bad{color:#ffb4a9}
  .pg textarea{width:100%;min-height:150px;resize:vertical;background:#0b0e12;color:var(--ink);border:1px solid var(--line);border-radius:6px;
               padding:8px 9px;font:12.5px/1.55 ui-monospace,Consolas,monospace}
  .pg .ok{font-size:12px;color:var(--muted);margin-top:4px}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted)}
  .result{margin-top:12px}
  .result .tot{font:700 30px/1.2 ui-monospace,monospace;color:var(--accent)}
  .result table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  .result td,.result th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
  .zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:grid;place-items:center;cursor:zoom-out}
  .zoom img{max-width:96vw;max-height:96vh;background:#fff}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:grid;place-items:center;padding:16px}
  .modal .card{max-width:460px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b0e12;border:1px solid var(--accent);color:var(--ink);
         padding:10px 16px;border-radius:9px;z-index:60;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .dark{position:fixed;inset:var(--bar) 0 0 0;background:#000;z-index:30;display:grid;place-items:center;color:#777;font-size:15px;text-align:center}
</style>
</head>
<body>

<div class="bar">
  <div class="who"><b id="bTitle">HaslaLab</b><span id="bSub"></span></div>
  <div class="sp"></div>
  <div class="views" id="views"></div>
  <div class="clock" id="clock" hidden>5:00:00<small></small></div>
  <button id="bEnd" class="red" hidden></button>
  <button id="bFull" class="hide-s" title="F11" hidden>⛶</button>
  <div class="lang"><button data-l="ko">한국어</button><button data-l="en">English</button></div>
</div>

<main id="main"></main>
<div id="layer"></div>

<script src="../vendor/qrcode/qrcode.js"></script>

/* ── what this exam is ── */
const Q = new URLSearchParams(location.search);
let lang = (Q.get("lang") || (navigator.language || "").slice(0, 2)) === "en" ? "en" : "ko";
const t = () => T[lang];
const split = (k, sep) => (Q.get(k) || "").split(sep).map(s => s.trim());
const EX = {
  c: (Q.get("c") || "").toLowerCase(), y: parseInt(Q.get("y")) || 0, name: Q.get("n") || "",
  tasks: split("e", ",").filter(Boolean), files: split("f", ","), titles: split("t", "|"), pdfs: split("p", "|"), sols: split("s", "|"),
};
const OK_EXAM = /^[a-z]{3,8}$/.test(EX.c) && EX.y > 1990 && EX.tasks.length > 0 && EX.tasks.length <= 4 &&
  EX.tasks.every(x => /^[A-Z][A-Za-z0-9]{0,3}$/.test(x)) && EX.files.length === EX.tasks.length && EX.files.every(f => /^[A-Za-z0-9_]+_web\.html(\?task=[\w-]+)?$/.test(f));
const simUrl = (f, extra) => f + (f.includes("?") ? "&" : "?") + "lang=" + lang + (extra || "");
const KEY = EX.c + EX.y;
const pdfUrl = s => !s ? "" : /^https:\/\//.test(s) ? s : PDF_BASE + s.replace(/^pdf\//, "");
const label = () => (EX.name || EX.c.toUpperCase()) + " " + EX.y;
/* the address to come back to (kept on the server with the session), without the language */
const ENTRY = (() => { const q = new URLSearchParams(location.search); q.delete("lang"); return "?" + q.toString(); })();

/* ── small helpers ── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hms = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function toast(msg, ms) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.append(d); setTimeout(() => d.remove(), ms || 3500); }

/* the community server: the same account and token as the site (same origin, same localStorage) */
function apiBase() { let o = ""; try { o = localStorage.getItem("hlCmApi") || ""; } catch (e) {} return (o || COMMUNITY_API).replace(/\/+$/, ""); }
function tok() { try { return localStorage.getItem("hlCmTok") || ""; } catch (e) { return ""; } }
async function api(method, path, body) {
  const h = {}; if (body) h["Content-Type"] = "application/json";
  if (tok()) h.Authorization = "Bearer " + tok();
  let r;
  try { r = await fetch(apiBase() + "/api" + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw { code: "network" }; }
  const j = await r.json().catch(() => ({ error: "server_error" }));
  if (!r.ok) throw { ...j, code: j.error || "server_error", status: r.status };
  return j;
}
const errMsg = e => (t().err[e && e.code]) || (e && e.code) || "error";

/* ── the session, as the server has it.  The server keeps the clock; this page only shows it.
      SES: the session; SKEW: server time minus this computer's time, so a wrong local clock does not matter. ── */
let SES = null, SKEW = 0, ME = null, BUSY = false, LABOK = null;
const srvNow = () => Math.floor(Date.now() / 1000) + SKEW;
function setSession(s) { SES = s; if (s && s.now) SKEW = s.now - Math.floor(Date.now() / 1000); }
/* the phone's upload token is shown once by the server; this computer keeps it per session.  Another computer
   (or a cleared browser) asks for a new one, which retires the old QR code. */
const upKey = id => "hlExamUp:" + id;
function upTok(id, v) { try { if (v) localStorage.setItem(upKey(id), v); return localStorage.getItem(upKey(id)) || ""; } catch (e) { return v || ""; } }

/* ── top bar ── */
function paintBar() {
  document.documentElement.lang = lang;
  document.title = `${t().exam} · ${label()} · HaslaLab`;
  $("bTitle").textContent = `${label()} · ${t().exam}`;
  $("bSub").textContent = EX.tasks.map((id, i) => id + (EX.titles[i] ? " " + EX.titles[i] : "")).join("  ·  ");
  $("bEnd").textContent = t().end;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  const running = SES && SES.status === "running";
  $("clock").hidden = !running; $("bEnd").hidden = $("bFull").hidden = !running;
  $("views").innerHTML = running && EX.tasks.length > 1 ? [`<button data-v="" class="${!VIEW ? "on" : ""}">${t().viewAll}</button>`]
    .concat(EX.tasks.map(x => `<button data-v="${x}" class="${VIEW === x ? "on" : ""}">${x}</button>`)).join("") : "";
}
let VIEW = "";
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("hlLang", lang); } catch (e) {}
  paintBar();
  if (SES && SES.status === "running" && stations.length) { stations.forEach(st => { try { st.win.document.getElementById("btn-" + lang)?.click(); } catch (e) {} }); paintKit(); }
  else render();
});
$("views").onclick = e => { const b = e.target.closest("button"); if (!b) return; VIEW = b.dataset.v || ""; layoutView(); paintBar(); };
$("bEnd").onclick = () => confirmBox(t().endQ, t().endBody, t().endYes, () => finishExam());
$("bFull").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
addEventListener("beforeunload", e => { if (SES && SES.status === "running") { e.preventDefault(); e.returnValue = t().leave; } });

function confirmBox(h, body, yes, go) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="card"><h1 style="font-size:18px">${esc(h)}</h1><p class="lead">${esc(body)}</p>
    <div class="row" style="justify-content:flex-end"><button data-x="0">${esc(t().cancel)}</button><button class="red" data-x="1">${esc(yes)}</button></div></div>`;
  m.onclick = e => { const b = e.target.closest("button"); if (e.target === m || (b && b.dataset.x === "0")) m.remove(); else if (b) { m.remove(); go(); } };
  $("layer").append(m);
}

/* ══ which screen: decided by the server's session — running → bench, scanning → QR, anything else → result ══ */
let tick = null, poller = null, shown = "";
function stopTimers() { clearInterval(tick); clearInterval(poller); clearInterval(mirror); tick = poller = mirror = null; }
function render() {
  paintBar();
  if (!OK_EXAM) { stopTimers(); shown = "bad"; $("main").innerHTML = `<div class="page"><div class="card"><h1>${t().exam}</h1><p class="lead">${t().bad}</p><a href="../#/comps">${t().back}</a></div></div>`; return; }
  const want = !SES ? "intro" : SES.status === "running" ? "run" : SES.status === "scanning" ? "scan" : "done";
  if (want === shown && want !== "intro" && want !== "done") return;            // the bench and the scan screen are not rebuilt by a refresh
  stopTimers(); shown = want;
  if (want === "run") return runView();
  if (want === "scan") return scanView();
  if (want === "done") return doneView();
  return introView();
}
/* ask the server where things stand (on load, every half minute while running, and when the tab comes back) */
async function sync() {
  /* does the server have exam mode yet (its database migrated)? */
  if (LABOK !== true) { try { LABOK = !!(await api("GET", "/health")).lab; } catch (e) { LABOK = null; } }
  if (LABOK === false) { SES = null; return render(); }
  if (!tok()) { ME = null; SES = null; return render(); }
  let a;
  try { a = await api("GET", "/lab/active"); }
  catch (e) { if (e.status === 401) { ME = null; SES = null; } return render(); }
  ME = ME || {}; ME.tokens = a.tokens; ME.other = null;
  if (a.active && a.active.exam_key === KEY) setSession(a.active);
  else {
    if (a.active) ME.other = a.active;
    /* this exam closed meanwhile (time ran out elsewhere, or it was submitted on another computer): show its result */
    if (SES && (SES.status === "running" || SES.status === "scanning")) { try { setSession((await api("GET", `/lab/sessions/${SES.id}`)).session); } catch (e) {} }
    else if (SES && !["graded", "pending", "error", "grading"].includes(SES.status)) SES = null;
  }
  render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && OK_EXAM) sync(); });
addEventListener("storage", e => { if (e.key === "hlCmTok") sync(); });

async function introView() {
  const rows = EX.tasks.map((id, i) => `<div><b>${esc(id)}</b><span>${esc(EX.titles[i] || "")}</span>
      ${EX.pdfs[i] ? `<a href="${esc(pdfUrl(EX.pdfs[i]))}" target="_blank" rel="noopener">${t().sheet} ↗</a>` : ""}
      <a href="${esc(simUrl(EX.files[i]))}" style="${EX.pdfs[i] ? "margin-left:10px" : ""}">${t().practice}</a></div>`).join("");
  let gate;
  if (LABOK === false) gate = `<div class="note w">${t().noServer}</div>`;
  else if (LABOK === null && tok()) gate = `<div class="note w">${t().err.network}</div>`;
  else if (!tok() || !ME) gate = `<div class="note w">${t().loginReq}</div>
      <div class="row"><a href="../#/login" target="_blank" rel="noopener"><button class="pri">${t().login} ↗</button></a><span style="font-size:12.5px;color:var(--muted)">${t().loginWait}</span></div>`;
  else if (ME.other) gate = `<div class="note w">${t().otherActive((ME.other.comp || "").toUpperCase() + " " + ME.other.year)}</div>
      <div class="row">${ME.other.entry ? `<a href="exam.html${esc(ME.other.entry)}&lang=${lang}"><button class="pri">${t().goOther}</button></a>` : ""}</div>`;
  else gate = `<div class="note">${t().tokens(ME.tokens)}</div>
      ${ME.tokens > 0 ? `<div class="row"><button class="pri" id="go">${t().start}</button></div>` : `<div class="note w">${t().noTokens}</div>`}`;
  $("main").innerHTML = `<div class="page"><div class="card">
    <h1>${esc(label())} · ${t().exam}</h1><p class="lead">${t().introLead}</p>
    <ol>${t().rules.map(r => `<li>${r}</li>`).join("")}</ol>
    <h3 style="margin:18px 0 0;font-size:14px;color:var(--muted)">${t().tasksH}</h3>
    <div class="tasks">${rows}</div>
    ${gate}
    <div class="row"><a href="../#/${esc(EX.c)}/${EX.y}">${t().back}</a></div>
  </div></div>`;
  const go = $("go");
  if (go) go.onclick = () => confirmBox(t().startQ, t().startBody(ME.tokens), t().startQ, startExam);
}
async function startExam() {
  if (BUSY) return; BUSY = true;
  const go = $("go"); if (go) go.disabled = true;
  try {
    const r = await api("POST", "/lab/start", { comp: EX.c, year: EX.y, tasks: EX.tasks, lang, entry: ENTRY });
    if (r.token) upTok(r.session.id, r.token);
    ME.tokens = r.tokens; setSession(r.session);
    if (r.resumed) toast(t().resume, 6000);
  } catch (e) {
    if (e.code === "other_active") { ME.other = e.other; ME.tokens = e.tokens; }
    else toast(errMsg(e));
  } finally { BUSY = false; }
  shown = ""; render();
}

/* ── the bench ── */
let stations = [], mirror = null;
function runView() {
  $("main").innerHTML = `<div class="hall"><aside class="kit" id="kit"></aside><div class="desk" id="desk"></div></div>`;
  stations = EX.tasks.map((id, i) => {
    const el = document.createElement("section"); el.className = "st"; el.dataset.task = id;
    el.innerHTML = `<div class="lbl"><b>${esc(id)}</b><span>${esc(EX.titles[i] || "")}</span>
      ${EX.pdfs[i] ? `<a class="pdf" href="${esc(pdfUrl(EX.pdfs[i]))}" target="_blank" rel="noopener">${t().sheet} ↗</a>` : ""}</div>`;
    const f = document.createElement("iframe");
    f.src = simUrl(EX.files[i], "&exam=1"); f.title = id;
    el.append(f); $("desk").append(el);
    const st = { id, i, el, frame: f, win: null, tray: null };
    f.addEventListener("load", () => hookStation(st));
    return st;
  });
  paintKit(); layoutView(); paintBar();
  tick = setInterval(clockTick, 250); clockTick();
  mirror = setInterval(copyTrays, 100);
  poller = setInterval(sync, 30000);
}
let warned = {};
function clockTick() {
  if (!SES || SES.status !== "running") return;
  const left = SES.ended_at - srvNow(), c = $("clock");
  c.firstChild.nodeValue = hms(left); c.lastChild.textContent = t().left; c.classList.toggle("warn", left <= 600);
  const w = k => { const id = SES.id + k; if (warned[id]) return false; warned[id] = 1; return true; };
  if (left <= 1800 && left > 1500 && w("30")) toast(t().warn30, 6000);
  if (left <= 300 && left > 0 && w("5")) toast(t().warn5, 8000);
  if (left <= 0) finishExam();
}
function layoutView() {
  stations.forEach(st => { st.el.classList.toggle("big", !!VIEW && VIEW === st.id); st.el.classList.toggle("small", !!VIEW && VIEW !== st.id); });
  const f = stations.find(st => st.id === VIEW); if (f) f.el.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
}

/* inside each simulator (same origin): fold its parts box into the shared kit and let its bench take the room */
function hookStation(st) {
  let d;
  try { st.win = st.frame.contentWindow; d = st.frame.contentDocument; } catch (e) { return; }
  if (!d || !d.body || d.location.href === "about:blank") return;
  const tray = d.getElementById("tray");
  st.tray = tray && tray.tagName === "CANVAS" ? tray : null;
  const css = d.createElement("style");
  css.textContent = st.tray ? `
    /* the parts box lives in the shared kit now; it stays laid out off screen so its clicks still land */
    #hlExamTray{position:fixed!important;left:-10000px!important;top:0!important;width:206px!important;flex:none!important;visibility:visible!important}
    .wrap{max-width:none!important}#haslalab-adfit-banner{display:none!important}` : `.wrap{max-width:none!important}#haslalab-adfit-banner{display:none!important}`;
  d.head.append(css);
  if (st.tray) st.tray.parentElement.id = "hlExamTray";
  /* the page header only repeats the title and the language buttons the exam bar already has */
  const hd = d.querySelector("body > header");
  if (hd && hd.querySelector(".lang") && hd.children.length <= 2) hd.style.display = "none";
  /* widen the bench: whatever caps the width of the page's outer blocks is lifted */
  [d.body, ...d.body.children].forEach(el => {
    try { const mw = st.win.getComputedStyle(el).maxWidth; if (mw && mw !== "none" && el.tagName !== "SCRIPT") el.style.maxWidth = "none"; } catch (e) {}
  });
  st.el.classList.toggle("wide", !st.tray);
  try { st.win.dispatchEvent(new st.win.Event("resize")); } catch (e) {}
  paintKit();
}
function paintKit() {
  const k = $("kit"); if (!k) return;
  const trays = stations.filter(st => st.tray);
  k.innerHTML = `<h2>${t().kitH}</h2><p class="sub" style="white-space:pre-line">${trays.length > 1 ? t().kitSub : trays.length ? t().kitSub1 : ""}</p>` +
    stations.map(st => `<div class="grp"><h3><i>${esc(st.id)}</i>${esc(EX.titles[st.i] || "")}</h3>${st.tray ? `<canvas data-k="${st.i}"></canvas>` : `<div class="placed">${t().placed}</div>`}</div>`).join("") +
    `<div class="hand" id="hand">${t().handNone}</div>`;
  k.querySelectorAll("canvas").forEach(c => wireMirror(c, stations[+c.dataset.k]));
  copyTrays();
}
function copyTrays() {
  stations.forEach(st => {
    if (!st.tray) return;
    const c = document.querySelector(`#kit canvas[data-k="${st.i}"]`); if (!c) return;
    if (c.width !== st.tray.width || c.height !== st.tray.height) { c.width = st.tray.width; c.height = st.tray.height; }
    if (!c.width || !c.height) return;
    const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
    try { g.drawImage(st.tray, 0, 0); } catch (e) {}
  });
}
/* a click on the shared kit is the same click on that simulator's own parts box */
function forward(st, type, e, c) {
  const r = c.getBoundingClientRect(), tr = st.tray.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const init = { bubbles: true, cancelable: true, view: st.win, button: e.button, buttons: e.buttons, detail: 1,
    clientX: tr.left + fx * tr.width, clientY: tr.top + fy * tr.height, screenX: e.screenX, screenY: e.screenY };
  const Ev = /^pointer/.test(type) ? st.win.PointerEvent : st.win.MouseEvent;
  st.tray.dispatchEvent(new Ev(type, /^pointer/.test(type) ? { ...init, pointerId: 1, pointerType: "mouse", isPrimary: true } : init));
}
function wireMirror(c, st) {
  c.addEventListener("mousedown", e => { if (!st.tray) return; e.preventDefault(); forward(st, "pointerdown", e, c); forward(st, "mousedown", e, c); });
  c.addEventListener("mouseup", e => { if (!st.tray) return; forward(st, "pointerup", e, c); forward(st, "mouseup", e, c); afterPick(st); });
  c.addEventListener("click", e => { if (st.tray) forward(st, "click", e, c); });
  c.addEventListener("contextmenu", e => { e.preventDefault(); if (st.tray) forward(st, "contextmenu", e, c); setTimeout(() => afterPick(st), 30); });
}
function afterPick(st) {
  setTimeout(() => {
    let held = null;
    try { held = st.win.eval("typeof hand!=='undefined' && hand ? (hand.k||hand.id||hand.key||hand.name||true) : null"); } catch (e) {}
    const h = $("hand"); if (!h) return;
    h.innerHTML = held ? `${t().handIn} <b>${esc(st.id)}</b> ${t().placeOn}` : t().handNone;
    if (held) { st.el.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" }); st.frame.focus(); }
  }, 40);
}

/* ── the end of the five hours (or «Finish exam»): the server moves the session to scanning ── */
let finishing = false;
async function finishExam() {
  if (finishing || !SES || SES.status !== "running") return;
  finishing = true; clearInterval(tick);
  /* switch the experiments off: the frames go blank and are removed, nothing keeps running */
  stations.forEach(st => { try { st.frame.src = "about:blank"; } catch (e) {} st.frame.remove(); });
  stations = []; clearInterval(mirror);
  const dark = document.createElement("div"); dark.className = "dark";
  dark.innerHTML = `<div><div style="font-size:22px;color:#bbb;margin-bottom:6px">${t().darkH}</div>${t().darkB}</div>`;
  document.body.append(dark);
  let tries = 0;
  for (;;) {
    try { setSession((await api("POST", `/lab/sessions/${SES.id}/finish`)).session); break; }
    catch (e) { if (++tries > 20 || e.status === 404) break; await new Promise(r => setTimeout(r, 3000)); }   // offline: keep trying, the server ends it on time anyway
  }
  finishing = false;
  setTimeout(() => { dark.remove(); shown = ""; render(); }, 1800);
}

/* ── thirty minutes to scan ── */
let pagesSeen = "", imgCache = new Map();
async function scanView() {
  $("main").innerHTML = `<div class="page"><div class="scan">
    <div class="qrbox"><h2>${t().scanH}</h2><div style="color:var(--muted);font-size:12.5px">${t().scanLeft}</div>
      <div class="big" id="sClock">${hms(SES.scan_until - srvNow())}</div>
      <div id="qrArea"><div class="note">…</div></div></div>
    <div class="pages" id="pages"></div></div></div>`;
  pagesSeen = "";
  let closedShown = false;
  tick = setInterval(() => {
    const left = SES.scan_until - srvNow(), c = $("sClock"); if (!c) return;
    c.textContent = hms(left); c.classList.toggle("warn", left <= 300);
    if (left <= 0 && !closedShown) { closedShown = true; toast(t().closed, 6000); }
  }, 500);
  let k = upTok(SES.id);
  if (!k) { try { k = upTok(SES.id, (await api("POST", `/lab/sessions/${SES.id}/qr`)).token); } catch (e) {} }
  paintQr(k);
  poll(); poller = setInterval(poll, 4000);
}
function scanUrl(k) {
  const u = new URL("scan.html", location.href), h = new URLSearchParams({ s: SES.id, k, l: lang });
  if (apiBase() !== COMMUNITY_API) h.set("a", apiBase());
  return u.origin + u.pathname + "#" + h.toString();
}
function paintQr(k) {
  const area = $("qrArea"); if (!area) return;
  if (!k) { area.innerHTML = `<div class="note w">${t().err.network}</div>`; return; }
  const url = scanUrl(k);
  let svg = "";
  try { const q = qrcode(0, "M"); q.addData(url); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) {}
  area.innerHTML = `<div class="qr" id="qr">${svg}</div><div class="url">${esc(url.replace(/#.*/, "#…"))}</div>
    <a href="${esc(url)}" target="_blank" rel="noopener" style="font-size:12.5px">${t().openHere} ↗</a> ·
    <a href="#" id="newQr" style="font-size:12.5px">${t().newQr}</a>
    <ol>${t().steps.map(x => `<li>${x}</li>`).join("")}</ol>`;
  $("newQr").onclick = async e => { e.preventDefault(); try { paintQr(upTok(SES.id, (await api("POST", `/lab/sessions/${SES.id}/qr`)).token)); } catch (er) { toast(errMsg(er)); } };
}
async function poll() {
  if (!SES) return;
  let r; try { r = await api("GET", `/lab/sessions/${SES.id}`); } catch (e) { return; }
  setSession(r.session);
  if (SES.status !== "scanning") return render();
  paintPages(SES);
}
function paintPages(s) {
  const box = $("pages"); if (!box) return;
  const sig = JSON.stringify(s.pages.map(p => [p.id, p.task, p.kind, p.ocr_status]));
  if (sig === pagesSeen) return;                                         // nothing new: leave what the student is typing alone
  pagesSeen = sig;
  const opt = (v, cur, txt) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(txt)}</option>`;
  const old = new Map([...box.querySelectorAll("textarea")].map(x => [x.dataset.id, x.value]));
  box.innerHTML = `<div class="head"><h2>${t().pagesH} · ${s.pages.length}</h2><div class="sp"></div><button class="pri" id="sub">${t().submit}</button></div>` +
    (s.pages.length ? s.pages.map(p => `<div class="pg" data-id="${p.id}">
      <div class="th" data-img="${p.id}"></div>
      <div><div class="meta">#${p.no}
        <select data-f="task">${s.tasks.map(x => opt(x, p.task, x)).join("")}</select>
        <select data-f="kind">${opt("answer", p.kind, t().answer)}${opt("working", p.kind, t().working)}</select>
        <span class="st2 ${p.ocr_status === "done" ? "" : "bad"}">${p.ocr_status === "done" ? t().ocrDone + (p.ocr_conf != null ? ` · ${Math.round(p.ocr_conf * 100)}%` : "") : p.ocr_status === "off" ? t().ocrOff : t().ocrFailed}</span></div>
        <textarea data-id="${p.id}" placeholder="${esc(t().textPh)}">${esc(old.has(String(p.id)) ? old.get(String(p.id)) : p.text)}</textarea>
        <div class="ok" data-ok="${p.id}">${p.edited ? t().edited : ""}</div></div></div>`).join("") : `<div class="empty">${t().none}</div>`);
  box.querySelectorAll("[data-img]").forEach(el => thumb(el, +el.dataset.img));
  box.querySelectorAll("select").forEach(sel => sel.onchange = () => {
    const id = sel.closest(".pg").dataset.id;
    api("PATCH", `/lab/sessions/${SES.id}/pages/${id}`, { [sel.dataset.f]: sel.value }).then(() => { pagesSeen = ""; }).catch(e => toast(errMsg(e)));
  });
  box.querySelectorAll("textarea").forEach(ta => ta.onchange = () => saveText(ta));
  $("sub").onclick = () => confirmBox(t().submit, t().submitQ, t().submit, submitNow);
}
async function saveText(ta) {
  const id = ta.dataset.id;
  try { await api("PATCH", `/lab/sessions/${SES.id}/pages/${id}`, { text: ta.value }); const ok = document.querySelector(`[data-ok="${id}"]`); if (ok) ok.textContent = t().saved; }
  catch (e) { toast(errMsg(e)); }
}
async function thumb(el, id) {
  let url = imgCache.get(id);
  if (!url) {
    try {
      const r = await fetch(apiBase() + `/api/lab/pages/${id}/img`, { headers: { Authorization: "Bearer " + tok() } });
      if (!r.ok) return;
      url = URL.createObjectURL(await r.blob()); imgCache.set(id, url);
    } catch (e) { return; }
  }
  el.innerHTML = `<img alt="" src="${url}">`;
  el.onclick = () => { const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img alt="" src="${url}">`; z.onclick = () => z.remove(); document.body.append(z); };
}
async function submitNow() {
  if (BUSY) return; BUSY = true;
  const sub = $("sub"); if (sub) { sub.disabled = true; sub.textContent = t().submitting; }
  clearInterval(poller);
  const pages = [...document.querySelectorAll("#pages textarea")].map(x => ({ id: +x.dataset.id, text: x.value }));
  try { setSession((await api("POST", `/lab/sessions/${SES.id}/submit?lang=${lang}`, { pages, lang })).session); render(); }
  catch (e) { toast(errMsg(e)); if (sub) { sub.disabled = false; sub.textContent = t().submit; } poller = setInterval(poll, 4000); }
  finally { BUSY = false; }
}

/* ── the result ── */
function doneView() {
  const s = SES, per = (s.detail && s.detail.tasks) || {};
  const rows = EX.tasks.map((id, i) => { const x = per[id] || {};
    const sc = x.status === "graded" || x.status === "empty" ? `<b>${x.score ?? 0}</b>${x.points ? " / " + x.points : ""}` : "—";
    const why = x.status === "pending" ? (t().pendingWhy[x.why] || "") : x.status === "error" ? t().errorNote : "";
    return `<tr><td><b>${esc(id)}</b> ${esc(EX.titles[i] || "")}</td><td>${t().statusOf[x.status] || "—"}${why ? `<div style="font-size:12px;color:var(--muted)">${why}</div>` : ""}</td><td>${sc}</td>
      <td>${EX.sols[i] ? `<a href="${esc(pdfUrl(EX.sols[i]))}" target="_blank" rel="noopener">${t().solution} ↗</a>` : ""}</td></tr>`; }).join("");
  $("main").innerHTML = `<div class="page"><div class="card"><h1>${t().resultH}</h1><p class="lead">${esc(label())} · ${t().statusOf[s.status] || esc(s.status)}</p>
    ${s.status === "graded" ? `<div class="result"><div class="tot">${s.score} / ${s.points ?? "?"}</div></div>` : ""}
    <div class="result"><table><tbody>${rows}</tbody></table></div>
    <div class="row"><a href="../#/lab/${s.id}"><button class="pri">${t().detail}</button></a>
      <button id="again">${t().again}</button><a href="../#/${esc(EX.c)}/${EX.y}">${t().back}</a></div></div></div>`;
  $("again").onclick = () => { SES = null; shown = ""; sync(); };
  if (s.status === "grading") { poller = setInterval(async () => { try { setSession((await api("GET", `/lab/sessions/${s.id}`)).session); if (SES.status !== "grading") { shown = ""; render(); } } catch (e) {} }, 5000); }
}

try { const l = localStorage.getItem("hlLang"); if (!Q.get("lang") && (l === "ko" || l === "en")) lang = l; } catch (e) {}
if (!OK_EXAM) render(); else { paintBar(); $("main").innerHTML = `<div class="page"><div class="card"><p class="lead">…</p></div></div>`; }
if (OK_EXAM) (async () => {
  /* resuming: the server says this exam is open, so the screen goes straight to it */
  await sync();
  if (SES && (SES.status === "running" || SES.status === "scanning")) toast(t().resume, 6000);
})();
</script>
</body>
