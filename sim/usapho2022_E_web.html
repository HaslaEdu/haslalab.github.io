/* the console page of the HaslaLab command-line ports (as IPhO 2022): everything happens in the terminal */
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;

header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px;max-width:980px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px;max-width:980px}
header li{margin:2px 0}
header code{color:#d7ba7d}
#lang{position:absolute;right:16px;top:12px;display:flex;gap:6px}
#lang a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
#lang a.on{color:var(--accent);border-color:var(--accent)}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;

#screen .g{color:#6a9955}#screen .c{color:#4ec9b0}#screen .y{color:#dcdcaa}#screen .r{color:#f48771}#screen .b{font-weight:700}#screen .dim{color:var(--dim)}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 16px 10px}

<script>
"use strict";
/* ── collision-black-box, part::wall and part::disk, as in the original source ── */
const WALL={R:0.3502,R_ERR:0.0092,C:0.696,C_ERR:0.035,MU:0.43,MU_ERR:0.02,BETA:0.799,BETA_ERR:0.002,DIST:0.5,PROC:3.0,
  V:[0.5,10],V_ABS:0.1,V_REL:0.05,TH:[0,75],TH_ERR:1,W:[-50,50],W_ABS:0.2,W_REL:0.05};
const DISK={R_M:0.145,R_M_ERR:0.002,M_M:1.4142,R_P:0.250,R_P_ERR:0.001,M:[1,5],M_ABS:0.02,M_REL:0.01,C:0.852,C_ERR:0.022,
  TH:[-90,90],TH_ERR:0.1,DIST:2,X:0.696,Y:-1.230,POS_ERR:0.003,PROC:4.0,V:[0.5,10],V_ABS:0.05,V_REL:0.01,S:[-2,2],S_ERR:0.002};
function normal(m,s){ let u=0,v=0; while(u===0) u=Math.random(); while(v===0) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const perturb=(f,abs,rel)=>f*(1+normal(0,rel))+normal(0,abs);
const sgn=(x,w,d)=>((x<0?"-":"+")+Math.abs(x).toFixed(d)).padStart(w," ");   /* Rust {:+w.d} */
function wallTrial(vIn,wIn,thIn){
  const v=Math.max(perturb(vIn,WALL.V_ABS,WALL.V_REL),WALL.V[0]/2), w=perturb(wIn,WALL.W_ABS,WALL.W_REL);
  const th=Math.min(90,Math.max(0,perturb(thIn,WALL.TH_ERR,0)))*Math.PI/180;
  const r=normal(WALL.R,WALL.R_ERR), c=normal(WALL.C,WALL.C_ERR), mu=normal(WALL.MU,WALL.MU_ERR), b=normal(WALL.BETA,WALL.BETA_ERR);
  const vy=v*Math.cos(th), vx=v*Math.sin(th), dmax=mu*vy*(1+c), dns=(w*r-vx)/(1+1/b), dvx=Math.max(-dmax,Math.min(dmax,dns));
  const vyN=c*vy, vxN=vx+dvx, wN=w-dvx/b/r;
  return {wait:WALL.DIST*(1/vy+1/vyN)+WALL.PROC, speed:Math.hypot(vxN,vyN), angle:Math.atan(vxN/vyN)*180/Math.PI, omega:wN};
}
function diskTrial(mIn,sIn,vIn,thIn){
  const m=perturb(mIn,DISK.M_ABS,DISK.M_REL), s=perturb(sIn,DISK.S_ERR,0), v=Math.max(perturb(vIn,DISK.V_ABS,DISK.V_REL),DISK.V[0]/2);
  const th=perturb(thIn,DISK.TH_ERR,0)*Math.PI/180;
  const rp=normal(DISK.R_P,DISK.R_P_ERR), rm=normal(DISK.R_M,DISK.R_M_ERR), c=normal(DISK.C,DISK.C_ERR);
  const xp=[0,s], xm=[normal(DISK.X,DISK.POS_ERR),normal(DISK.Y,DISK.POS_ERR)], mt=m+DISK.M_M, rt=rp+rm;
  const vh=[Math.cos(th),Math.sin(th)], vv=[vh[0]*v,vh[1]*v], ax=[-vv[1],vv[0]];
  const d=[xp[0]-xm[0],xp[1]-xm[1]], k=(d[0]*ax[0]+d[1]*ax[1])/(ax[0]*ax[0]+ax[1]*ax[1]), bb=[ax[0]*k,ax[1]*k], bn2=bb[0]*bb[0]+bb[1]*bb[1];
  if(Math.sqrt(bn2)>=rt) return {wait:DISK.DIST/v+DISK.PROC, hit:false};
  const q=Math.sqrt(rt*rt-bn2), dx=[bb[0]-vh[0]*q,bb[1]-vh[1]*q];
  const kk=(vv[0]*dx[0]+vv[1]*dx[1])/(dx[0]*dx[0]+dx[1]*dx[1]), vi=[dx[0]*kk,dx[1]*kk], f=(m-c*DISK.M_M)/mt;
  const vp=[vv[0]-vi[0]+vi[0]*f, vv[1]-vi[1]+vi[1]*f];
  return {wait:Math.hypot(xm[0]+dx[0],xm[1]+dx[1])/v+DISK.PROC, hit:true, speed:Math.hypot(vp[0],vp[1]), angle:Math.atan2(vp[1],vp[0])*180/Math.PI};
}

/* ── the terminal: a shell, then the program's own prompts, one typed line at a time ── */
const PROMPTS={
  wall:[["launch speed (m/s):         ",WALL.V],["angular speed (rad/s):      ",WALL.W],["launch angle (° to normal): ",WALL.TH]],
  disk:[["probe mass (kg):                ",DISK.M],["launch position (m):            ",DISK.S],["launch speed (m/s):             ",DISK.V],["launch angle (° to horizontal): ",DISK.TH]]};
let prog=null, field=0, vals=[], trial={wall:0,disk:0}, busy=false, hist=[], hpos=0, cwd="~/Downloads", timer=null;
const screen=$("screen"), inp=$("inp");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(html){ screen.insertAdjacentHTML("beforeend",html+"\n"); screen.scrollTop=screen.scrollHeight; }
function shellPS(){ return '<span class="g">user@lab</span>:<span class="c">'+esc(cwd)+'</span>$ '; }
function setPS(){ $("ps").innerHTML=busy?"":prog?esc(PROMPTS[prog][field][0]):shellPS(); inp.disabled=busy; if(!busy) inp.focus({preventScroll:true}); }
function trialHead(){ say('<span class="c">&gt;&gt;&gt;</span> <span class="b">trial #'+(trial[prog]+1)+'…</span> <span class="c">(press <span class="b">ctrl+C</span> or <span class="b">ctrl+D</span> to exit)</span>'); }
function start(m){ prog=m; field=0; vals=[]; trialHead(); }
function quitProg(sig){ say($("ps").innerHTML+esc(inp.value)+'<span class="dim">'+sig+'</span>'); inp.value=""; if(timer){clearTimeout(timer);timer=null;busy=false;} prog=null; setPS(); }
function shell(line){
  const w=line.trim().split(/\s+/).filter(Boolean);
  if(!w.length) return;
  const bin=w[0].replace(/^\.[\\/]/,"");
  if(/^collision-black-box(-(windows|macos|linux)(\.exe)?)?$/.test(bin)){
    if(cwd!=="~/Downloads"){ say(esc(w[0])+": No such file or directory"); return; }
    if(w[1]==="wall"||w[1]==="disk") return start(w[1]);
    say("collision-black-box 0.1.0\nU.S. Physics Team Training Camp collision black box simulator\n\nUSAGE:\n    collision-black-box &lt;SUBCOMMAND&gt;\n\nFLAGS:\n    -h, --help       Prints help information\n    -V, --version    Prints version information\n\nSUBCOMMANDS:\n    disk    collision with unknown disk\n    help    Prints this message or the help of the given subcommand(s)\n    wall    collision with wall");
    return; }
  if(w[0]==="clear"||w[0]==="cls"){ screen.innerHTML=""; return; }
  if(w[0]==="ls"||w[0]==="dir"){ if(cwd==="~/Downloads") say("collision-black-box-linux  collision-black-box-macos  collision-black-box-windows.exe"); else say("Downloads"); return; }
  if(w[0]==="cd"){ const t=w[1]||"~"; if(t==="~"||t===".."&&cwd==="~/Downloads") cwd="~";
    else if(/^(~\/)?Downloads\/?$/.test(t)||(t==="Downloads"&&cwd==="~")) cwd="~/Downloads";
    else if(t!=="."&&t!=="./") say("cd: "+esc(t)+": No such file or directory"); return; }
  if(w[0]==="chmod"||w[0]==="open") return;
  if(w[0]==="pwd"){ say(cwd.replace("~","/home/user")); return; }
  if(w[0]==="help"){ say(T[lang].help); return; }
  say(esc(w[0])+": command not found");
}
function rangeErr(v,lo,hi){ if(v<lo) return "value outside range: got <span class=\"b\">"+v+"</span>, must be ≥ <span class=\"b\">"+lo+"</span>"; if(v>hi) return "value outside range: got <span class=\"b\">"+v+"</span>, must be ≤ <span class=\"b\">"+hi+"</span>"; return null; }
function answer(raw){
  const rg=PROMPTS[prog][field][1], t=raw.trim(), v=Number(t);
  if(t===""){ say('  <span class="r">cannot parse float from empty string</span>'); return; }   /* Rust's ParseFloatError */
  if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)&&!/^[+-]?(inf|infinity|nan)$/i.test(t)){ say('  <span class="r">invalid float literal</span>'); return; }
  const e=rangeErr(v,rg[0],rg[1]); if(e){ say('  <span class="r">'+e+'</span>'); return; }
  vals.push(v); field++;
  if(field<PROMPTS[prog].length) return;
  const m=prog, res=m==="wall"?wallTrial(...vals):diskTrial(...vals);
  trial[m]++; say('<span class="g">  running…</span>'); busy=true; setPS();
  timer=setTimeout(()=>{ timer=null;
    if(m==="wall") say("  rebound speed: <span class=\"b\">"+sgn(res.speed,7,3)+" m/s</span>\n  rebound angle: <span class=\"b\">"+sgn(res.angle,7,3)+" ° to normal</span>\n  angular speed: <span class=\"b\">"+sgn(res.omega,7,3)+" rad/s</span>\n");
    else if(res.hit) say('  <span class="g b">you got a hit!</span>\n  probe speed: <span class="b">'+sgn(res.speed,8,3)+' m/s</span>\n  probe angle: <span class="b">'+sgn(res.angle,8,3)+' ° to horizontal</span>\n');
    else say('<span class="y">  swing and a miss!</span>\n');
    busy=false; field=0; vals=[]; if(prog) trialHead(); setPS(); }, res.wait*1000);
}
function enter(line){
  say($("ps").innerHTML+'<span class="in">'+esc(line)+'</span>');
  if(line.trim()) hist.push(line); hpos=hist.length;
  if(prog) answer(line); else shell(line);
  if(!busy) setPS();
}
inp.addEventListener("keydown",e=>{
  if(e.ctrlKey&&(e.key==="c"||e.key==="C")){ if(prog||busy) quitProg("^C"); else { say($("ps").innerHTML+esc(inp.value)+'<span class="dim">^C</span>'); inp.value=""; } e.preventDefault(); return; }
  if(e.ctrlKey&&(e.key==="d"||e.key==="D")){ if(prog||busy) quitProg("^D"); e.preventDefault(); return; }
  if(e.ctrlKey&&(e.key==="l"||e.key==="L")){ screen.innerHTML=""; e.preventDefault(); return; }
  if(busy){ e.preventDefault(); return; }
  if(e.key==="Enter"){ const v=inp.value; inp.value=""; enter(v); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ if(hpos>0){ hpos--; inp.value=hist[hpos]; } e.preventDefault(); }
  else if(e.key==="ArrowDown"){ if(hpos<hist.length){ hpos++; inp.value=hist[hpos]||""; } e.preventDefault(); }
});
/* while a trial runs the input is disabled, so Ctrl+C has to be caught on the page */
document.addEventListener("keydown",e=>{ if(busy&&e.ctrlKey&&(e.key==="c"||e.key==="C"||e.key==="d"||e.key==="D")){ quitProg(e.key.toLowerCase()==="c"?"^C":"^D"); e.preventDefault(); } });
screen.addEventListener("mouseup",()=>{ if(!getSelection().toString()) inp.focus({preventScroll:true}); });
function restart(){ if(timer){clearTimeout(timer);timer=null;} busy=false; prog=null; field=0; vals=[]; cwd="~/Downloads"; screen.innerHTML=""; say('<span class="dim">'+esc(T[lang].motd)+'</span>'); setPS(); }
$("b-restart").onclick=restart;
$("b-copy").onclick=()=>navigator.clipboard.writeText(screen.textContent).then(()=>{ $("b-copy").textContent=T[lang].copied; setTimeout(()=>$("b-copy").textContent=T[lang].copy,1200); },()=>{});
$("b-save").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([screen.textContent],{type:"text/plain;charset=utf-8"})); a.download="collision-black-box.txt"; a.click(); URL.revokeObjectURL(a.href); };

/* ── the lab bench: the same program behind a form, a diagram and a table of results ── */
const FIELDS={wall:[["v",WALL.V,2,0.1],["w",WALL.W,0,0.5],["th",WALL.TH,30,1]],
              disk:[["m",DISK.M,2,0.05],["s",DISK.S,0,0.01],["dv",DISK.V,2,0.1],["dth",DISK.TH,0,0.5]]};
const LS="hl-usapho2022-lab";
let part="wall", rows={wall:[],disk:[]}, labBusy=false, anim=null, lastNew=-1;
try{ const o=JSON.parse(localStorage.getItem(LS)||"null"); if(o&&o.wall) rows=o; }catch(e){}
const saveRows=()=>{ try{ localStorage.setItem(LS,JSON.stringify(rows)); }catch(e){} };
const vin={wall:{v:2,w:0,th:30},disk:{m:2,s:0,dv:2,dth:0}};
const f3=x=>(x<0?"−":"")+Math.abs(x).toFixed(3);
function setMode(m){ $("lab").hidden=m!=="lab"; $("term").hidden=m!=="term"; $("m-lab").className=m==="lab"?"on":""; $("m-term").className=m==="term"?"on":""; if(m==="term") setPS(); }
$("m-lab").onclick=()=>setMode("lab"); $("m-term").onclick=()=>setMode("term");
for(const b of document.querySelectorAll("#parts button")) b.onclick=()=>{ if(labBusy) return; part=b.dataset.p; labLang(); };
function buildForm(){ const d=T[lang], f=$("lf");
  f.innerHTML=FIELDS[part].map(([k,rg,,st])=>`<label>${d.f[k][0]} <small>${d.range(rg[0],rg[1])} ${d.f[k][1]}</small>
    <span class="row"><input type="number" name="${k}" min="${rg[0]}" max="${rg[1]}" step="any" value="${vin[part][k]}"><input type="range" data-k="${k}" min="${rg[0]}" max="${rg[1]}" step="${st}" value="${vin[part][k]}"></span></label>`).join("")
    +`<div class="go"><button type="submit">${d.fire}</button><span class="err"></span></div>`;
  for(const r of f.querySelectorAll("input[type=range]")) r.oninput=()=>{ f[r.dataset.k].value=r.value; vin[part][r.dataset.k]=+r.value; drawDiagram(); };
  for(const [k] of FIELDS[part]) f[k].oninput=()=>{ const v=+f[k].value; if(isFinite(v)){ vin[part][k]=v; f.querySelector(`[data-k=${k}]`).value=v; drawDiagram(); } };
  f.onsubmit=e=>{ e.preventDefault(); fire(); }; }
function buildTable(){ const d=T[lang], cols=part==="wall"?d.colsWall:d.colsDisk, R=rows[part];
  $("tbl").tHead.innerHTML="<tr>"+cols.map(c=>"<th>"+c+"</th>").join("")+"</tr>";
  $("tbl").tBodies[0].innerHTML=R.length?R.map((r,i)=>`<tr class="${i===lastNew?"new":""}"><td>${i+1}</td>${r.i.map(x=>`<td class="in">${f3(x)}</td>`).join("")}`+
    (part==="wall"?r.o.map(x=>`<td class="out">${f3(x)}</td>`).join(""):r.hit?`<td class="out">${d.hit}</td><td class="out">${f3(r.o[0])}</td><td class="out">${f3(r.o[1])}</td>`:`<td class="miss">${d.miss}</td><td></td><td></td>`)+"</tr>").reverse().join("")
    :`<tr><td colspan="${cols.length}" style="text-align:center;color:var(--dim);padding:18px">${d.empty}</td></tr>`; }
function labLang(){ const d=T[lang]; $("m-lab").textContent=d.mLab; $("m-term").textContent=d.mTerm;
  for(const b of document.querySelectorAll("#parts button")){ b.textContent=b.dataset.p==="wall"?d.pWall:d.pDisk; b.className=b.dataset.p===part?"on":""; }
  $("partNote").textContent=part==="wall"?d.wallNote:d.diskNote; $("dgNote").textContent=part==="wall"?d.dgWall:d.dgDisk;
  $("resH").textContent=d.resH+" — "+(part==="wall"?d.pWall:d.pDisk); $("r-csv").textContent=d.csv; $("r-copy").textContent=d.copyT; $("r-clear").textContent=d.clear; $("resNote").textContent=d.resNote;
  $("busy").querySelector("span").textContent=d.flying; buildForm(); buildTable(); drawDiagram(); }
function fire(){ const d=T[lang], f=$("lf"), err=f.querySelector(".err"), vals=[];
  for(const [k,rg] of FIELDS[part]){ const t=String(f[k].value).trim(), v=Number(t);
    if(t===""||!isFinite(v)){ err.textContent=d.f[k][0]+": "+(t===""?"cannot parse float from empty string":"invalid float literal"); return; }
    if(v<rg[0]||v>rg[1]){ err.textContent=d.f[k][0]+": value outside range ("+rg[0]+" ~ "+rg[1]+")"; return; }
    vals.push(v); }
  err.textContent=""; const p=part, res=p==="wall"?wallTrial(...vals):diskTrial(...vals);
  labBusy=true; f.querySelector("button").disabled=true; $("busy").hidden=false;
  const t0=performance.now(), dur=res.wait*1000;
  anim={p,vals,res,t0,dur};
  (function tick(){ const k=Math.min(1,(performance.now()-t0)/dur); $("busy").querySelector("i").style.width=(k*100)+"%"; drawDiagram();
    if(k<1) return requestAnimationFrame(tick);
    rows[p].push(p==="wall"?{i:vals,o:[res.speed,res.angle,res.omega]}:{i:vals,hit:res.hit,o:res.hit?[res.speed,res.angle]:[]}); saveRows();
    lastNew=rows[p].length-1; labBusy=false; $("busy").hidden=true; anim={...anim,done:true}; if(part===p){ buildTable(); f.querySelector("button").disabled=false; } drawDiagram(); })(); }
/* the diagram: the table seen from above */
function drawDiagram(){ const c=$("dg"), g=c.getContext("2d"), W=c.width, H=c.height, d=T[lang];
  g.clearRect(0,0,W,H); g.fillStyle="#101418"; g.fillRect(0,0,W,H);
  g.strokeStyle="#1d2630"; g.lineWidth=1; for(let x=0;x<W;x+=40){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); } for(let y=0;y<H;y+=40){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  const arrow=(x0,y0,x1,y1,col,w)=>{ g.strokeStyle=g.fillStyle=col; g.lineWidth=w||2; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); const a=Math.atan2(y1-y0,x1-x0); g.beginPath(); g.moveTo(x1,y1); g.lineTo(x1-11*Math.cos(a-0.4),y1-11*Math.sin(a-0.4)); g.lineTo(x1-11*Math.cos(a+0.4),y1-11*Math.sin(a+0.4)); g.fill(); };
  const disk=(x,y,r,spin)=>{ g.fillStyle="#d7ba7d"; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.strokeStyle="#5a4a2a"; g.lineWidth=2; g.beginPath(); g.moveTo(x,y); g.lineTo(x+r*Math.cos(spin),y-r*Math.sin(spin)); g.stroke(); };
  g.font="12px ui-sans-serif,system-ui,sans-serif";
  const A=anim&&anim.p===part?anim:null, now=performance.now();
  if(part==="wall"){ const wx=W-60, cy=H/2, S=300;                       /* 0.5 m from launcher to wall, about 300 px per metre on screen */
    g.fillStyle="#3a4652"; g.fillRect(wx,20,14,H-40); g.fillStyle="#9aa3ab"; g.fillText(d.wallLbl,wx-4,16);
    g.setLineDash([4,4]); g.strokeStyle="#4ec9b0"; g.beginPath(); g.moveTo(40,cy); g.lineTo(wx,cy); g.stroke(); g.setLineDash([]); g.fillStyle="#4ec9b0"; g.fillText("normal",48,cy-6);
    const th=(A?A.vals[2]:vin.wall.th)*Math.PI/180, L=S*0.5/Math.cos(th);
    const hx=wx-18, hy=cy, sx=hx-L*Math.cos(th), sy=hy+L*Math.sin(th);                      /* launcher below-left, coming up to the wall */
    if(!A||A.done){ arrow(sx,sy,sx+(hx-sx)*0.55,sy+(hy-sy)*0.55,"#9cdcfe",2.5); disk(sx,sy,14,0);
      g.fillStyle="#9cdcfe"; g.fillText("θ = "+(A?A.vals[2]:vin.wall.th).toFixed(1)+"°", hx-110, hy+26);
      const om=A?A.vals[1]:vin.wall.w; if(om){ g.strokeStyle="#9cdcfe"; g.lineWidth=2; g.beginPath(); g.arc(sx,sy,22,om>0?-2.6:-0.5,om>0?-0.5:-2.6,om<0); g.stroke(); } }
    if(A){ const r=A.res, tIn=WALL.DIST/(A.vals[0]*Math.cos(th))*1000, tOut=WALL.DIST/(r.speed*Math.cos(r.angle*Math.PI/180)||1)*1000, t=now-A.t0;
      const ra=r.angle*Math.PI/180, Lo=S*0.5/Math.max(0.2,Math.cos(ra)), ex=hx-Lo*Math.cos(ra), ey=hy-Lo*Math.sin(ra);
      if(!A.done&&t<tIn){ const k=t/tIn; disk(sx+(hx-sx)*k,sy+(hy-sy)*k,14,A.vals[1]*t/1000); }
      else if(!A.done&&t<tIn+tOut){ const k=(t-tIn)/tOut; disk(hx+(ex-hx)*k,hy+(ey-hy)*k,14,A.vals[1]*tIn/1000+r.omega*(t-tIn)/1000); }
      else { g.setLineDash([5,4]); g.strokeStyle="#6a7a88"; g.lineWidth=1.5; g.beginPath(); g.moveTo(sx,sy); g.lineTo(hx,hy); g.stroke(); g.setLineDash([]);
        arrow(hx,hy,hx+(ex-hx)*0.8,hy+(ey-hy)*0.8,"#e8e8e8",2.5); if(A.done){ g.fillStyle="#e8e8e8"; g.fillText(f3(r.speed)+" m/s, "+f3(r.angle)+"°, "+f3(r.omega)+" rad/s",Math.max(10,ex-40),Math.max(16,ey-12)); } } } }
  else { const lx=40, S=150, cy=H/2, cover=150;                               /* 150 px per metre; s from −2 to 2 m runs down the left edge (y up) */
    g.fillStyle="#2a3038"; g.fillRect(cover,10,W-cover-10,H-20); g.fillStyle="#7d8791"; g.fillText(d.hidden,cover+12,28);
    for(let k=-2;k<=2;k++){ const y=cy-k*S*0.4; g.fillStyle="#7d8791"; g.fillText((k>0?"+":"")+k+" m",6,y+4); g.strokeStyle="#3a4652"; g.beginPath(); g.moveTo(lx-6,y); g.lineTo(lx,y); g.stroke(); }
    g.strokeStyle="#4ec9b0"; g.lineWidth=2; g.beginPath(); g.moveTo(lx,20); g.lineTo(lx,H-20); g.stroke();
    const sv=A?A.vals[1]:vin.disk.s, th=(A?A.vals[3]:vin.disk.dth)*Math.PI/180, py=cy-sv*S*0.4;
    const t=A?now-A.t0:0, sp=A?A.vals[2]:0;
    let px=lx+18, pyy=py;
    if(A&&!A.done){ const dist=Math.min(t/1000*sp*S*0.4, cover); px=lx+18+dist*Math.cos(th); pyy=py-dist*Math.sin(th); }
    if(!A||A.done||px<cover) { disk(Math.min(px,cover-6),pyy,12,0); }
    arrow(lx+18,py,lx+18+90*Math.cos(th),py-90*Math.sin(th),"#9cdcfe",2.5);
    g.fillStyle="#9cdcfe"; g.fillText("s = "+sv.toFixed(2)+" m, θ = "+(A?A.vals[3]:vin.disk.dth).toFixed(1)+"°",lx+24,py+(th>0?24:-14));
    /* the result as a direction only */
    const ox=W-80, oy=H-80; g.strokeStyle="#3a4652"; g.lineWidth=1; g.beginPath(); g.arc(ox,oy,52,0,7); g.stroke(); g.fillStyle="#7d8791"; g.fillText(d.out,ox-26,oy-60);
    if(A&&A.done){ const r=A.res; if(r.hit){ const a=r.angle*Math.PI/180; arrow(ox,oy,ox+48*Math.cos(a),oy-48*Math.sin(a),"#e8e8e8",2.5); g.fillStyle="#e8e8e8"; g.fillText(f3(r.speed)+" m/s",ox-34,oy+70); }
      else { g.fillStyle="#dcdcaa"; g.fillText("swing and a miss!",ox-52,oy+4); } } } }
function tableText(sep){ const d=T[lang], cols=part==="wall"?d.colsWall:d.colsDisk;
  return [cols.join(sep)].concat(rows[part].map((r,i)=>[i+1].concat(r.i.map(f3).map(x=>x.replace("−","-")),part==="wall"?r.o.map(x=>x.toFixed(3)):r.hit?[d.hit,r.o[0].toFixed(3),r.o[1].toFixed(3)]:[d.miss,"",""]).join(sep))).join("\n"); }
$("r-csv").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+tableText(",")],{type:"text/csv;charset=utf-8"})); a.download="collision-black-box-"+part+".csv"; a.click(); URL.revokeObjectURL(a.href); };
$("r-copy").onclick=()=>navigator.clipboard.writeText(tableText("\t")).then(()=>{ $("r-copy").textContent=T[lang].copied; setTimeout(()=>$("r-copy").textContent=T[lang].copyT,1200); },()=>{});
$("r-clear").onclick=()=>{ if(!rows[part].length||!confirm(T[lang].sure)) return; rows[part]=[]; lastNew=-1; saveRows(); buildTable(); };

applyLang(); restart();
