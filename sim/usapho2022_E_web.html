  /* the U.S. Physics Team's colours over the shared layout: paper white, navy, flag red */

<body>
<div class="glow"></div>
<div class="wrap">
  <div class="top">
    <div><span class="eyebrow" data-t="eb"></span><h1 data-t="h1"></h1><p class="lead" data-t="lead"></p></div>
    <div class="lang"><button id="lang-ko" class="on">한국어</button><button id="lang-en">English</button></div>
  </div>

  <div class="grid">
    <div class="card hi">
      <span class="tag">Input · collision-black-box</span><h2 data-t="inT"></h2>
      <div class="seg"><button id="m-wall">wall</button><button id="m-disk">disk</button></div>
      <div id="f-wall">
        <div class="fld"><label data-t="wv"></label><input id="wv" value="10"></div>
        <div class="fld"><label data-t="ww"></label><input id="ww" value="0"></div>
        <div class="fld"><label data-t="wt"></label><input id="wt" value="0"></div>
      </div>
      <div id="f-disk" style="display:none">
        <div class="fld"><label data-t="dm"></label><input id="dm" value="5"></div>
        <div class="fld"><label data-t="ds"></label><input id="ds" value="0"></div>
        <div class="fld"><label data-t="dv"></label><input id="dv" value="10"></div>
        <div class="fld"><label data-t="dt"></label><input id="dt" value="0"></div>
      </div>
      <button class="btn" id="run" data-t="run"></button>
      <p class="hint" id="help"></p>
    </div>
    <div class="card">
      <span class="tag">Output · terminal</span><h2 data-t="outT"></h2>
      <div class="term" id="termbox"><pre id="term"></pre><div class="line"><span id="ps"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
      <div class="stat" id="stat"></div>
      <div class="row"><button class="btn ghost" id="csv" data-t="csv"></button><button class="btn ghost" id="clr" data-t="clr"></button></div>
      <pre class="out" id="log"></pre>
    </div>
  </div>
  <p class="foot" data-t="foot"></p>
</div>
<script>
"use strict";
/* a small dark plot, in the colours of the OPhO site */
function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(r))), m=r/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function fmtTick(v,st){ const d=Math.max(0,-Math.floor(Math.log10(st)+1e-9)); return (Math.abs(v)<st/1e6?0:v).toFixed(Math.min(6,d)); }
function plotXY(cv,series,o){
  o=o||{}; const dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||800, H=Math.round(W*(o.aspect||0.5));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#100d0c"; c.fillRect(0,0,W,H);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of series) for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)) continue;
    x0=Math.min(x0,s.x[i]); x1=Math.max(x1,s.x[i]); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  if(!isFinite(x0)){x0=0;x1=1;y0=0;y1=1;}
  if(o.xlim){x0=o.xlim[0];x1=o.xlim[1];} if(o.ylim){y0=o.ylim[0];y1=o.ylim[1];}
  if(x1<=x0){x1=x0+1;} if(y1<=y0){y0-=0.5;y1+=0.5;}
  if(!o.ylim){ const p=(y1-y0)*0.06; y0-=p; y1+=p; }
  const L=58,R=14,T=14,B=38, pw=W-L-R, ph=H-T-B;
  if(o.equal){ const sx=(x1-x0)/pw, sy=(y1-y0)/ph, s=Math.max(sx,sy); x1=x0+s*pw; y1=y0+s*ph; }
  const X=v=>L+pw*(v-x0)/(x1-x0), Y=v=>T+ph*(1-(v-y0)/(y1-y0));
  c.font="11px 'Roboto Mono',monospace"; c.lineWidth=1;
  const sx=niceStep((x1-x0)/8), sy=niceStep((y1-y0)/6);
  c.strokeStyle="rgba(255,255,255,.08)"; c.fillStyle="rgba(255,255,255,.6)";
  c.textAlign="center"; c.textBaseline="top";
  for(let v=Math.ceil(x0/sx)*sx;v<=x1+1e-12;v+=sx){ c.beginPath(); c.moveTo(X(v),T); c.lineTo(X(v),T+ph); c.stroke(); c.fillText(fmtTick(v,sx),X(v),T+ph+5); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=Math.ceil(y0/sy)*sy;v<=y1+1e-12;v+=sy){ c.beginPath(); c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); c.stroke(); c.fillText(o.logy?"1e"+fmtTick(v,sy):fmtTick(v,sy),L-6,Y(v)); }
  c.strokeStyle="rgba(255,255,255,.28)"; c.strokeRect(L,T,pw,ph);
  c.fillStyle="rgba(255,255,255,.75)"; c.textAlign="center"; c.textBaseline="alphabetic"; c.fillText(o.xl||"",L+pw/2,H-6);
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.fillText(o.yl||"",0,0); c.restore();
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  for(const s of series){ c.strokeStyle=c.fillStyle=s.color||"#a7e26e"; c.lineWidth=s.lw||1.4;
    if(s.mode==="dot"){ for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(s.y[i]):s.y[i]; c.beginPath(); c.arc(X(s.x[i]),Y(y),s.r||2.4,0,7); c.fill(); } }
    else{ c.beginPath(); let st=false; for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)){st=false;continue;} const px=X(s.x[i]),py=Y(y); st?c.lineTo(px,py):c.moveTo(px,py); st=true; } c.stroke(); } }
  c.restore();
  let ly=T+14; c.textAlign="left"; c.textBaseline="alphabetic";
  for(const s of series) if(s.label){ c.fillStyle=s.color||"#a7e26e"; c.fillRect(L+10,ly-8,10,3); c.fillStyle="rgba(255,255,255,.8)"; c.fillText(s.label,L+26,ly-3); ly+=15; }
  return {X,Y,L,T,pw,ph,x0,x1,y0,y1};
}
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download=name; a.click(); }

const T={
 ko:{eb:"USAPhO 2022 · 미국 대표 선발 시험 · 실험",h1:"미래 원형 충돌기 (The Future Circular Collider)",
   lead:"마찰 없는 수평 탁자 위에서 원판을 미끄러뜨려 부딪치게 하는 시뮬레이션 실험입니다. 주최측 프로그램 collision-black-box처럼 두 부분으로 나뉩니다. <b>wall</b>에서는 원판을 벽에 던지고, <b>disk</b>에서는 숨겨진 원판에 탐사 원판을 쏩니다. 값을 넣으면 충돌 뒤의 속력·각도·각속도가 나옵니다.",
   inT:"빠른 입력",wv:"발사 속력 (m/s)",ww:"각속도 (rad/s, 반시계 +)",wt:"발사각 (법선과의 각, °)",
   dm:"탐사 원판 질량 (kg)",ds:"발사 위치 s (m)",dv:"발사 속력 (m/s)",dt:"발사각 (수평과의 각, °)",run:"터미널에 입력 ↗",
   hWall:"범위: 0.5 ≤ v ≤ 10 m/s, −50 ≤ ω ≤ 50 rad/s, 0 ≤ θ ≤ 75°. 발사 장치가 완벽하지 않아 넣은 값에 오차가 붙고, 원판의 성질도 시행마다 조금씩 흔들립니다. 원판이 벽까지 갔다 돌아오는 시간만큼 기다려야 결과가 나옵니다.",
   hDisk:"범위: 1 ≤ m ≤ 5 kg, −2 ≤ s ≤ 2 m, 0.5 ≤ v ≤ 10 m/s, −90 ≤ θ ≤ 90°. 탐사 원판은 (0, s)에서 출발하며 반지름 r = 0.250 ± 0.001 m입니다. 숨겨진 원판은 (x₀, y₀)에 정지해 있고(x₀ &gt; 0), 두 원판 모두 마찰이 없습니다. 빗나가면 “swing and a miss!”가 나옵니다.",
   outT:"터미널",csv:"시행 기록 CSV",motd:"<span class=\"dim\"># 원본처럼 직접 입력하세요: ./collision-black-box wall  또는  ./collision-black-box disk\n# 값을 묻는 줄마다 숫자를 치고 Enter. 끝내려면 ctrl+C. help, clear, ↑↓(이전 입력)도 됩니다.</span>",shHelp:"명령: ./collision-black-box wall | disk, clear, ls, help  ·  프로그램 안에서는 값을 입력하고 Enter, 끝낼 때 ctrl+C",clr:"기록 지우기",busy:"실행 중… 결과를 기다리는 중",n:"번 시행",
   foot:"<b>프로그램</b> — U.S. Physics Team 코치 Kevin Zhou와 Kye Shi가 만든 collision-black-box(Rust, github.com/USPhysicsTeam/2022-future-circular-collider)의 계산을 그대로 옮겼습니다. 숨겨진 값, 시행마다 붙는 오차, 결과를 기다리는 시간도 원본 소스와 같습니다. 원본 명령줄 프로그램(Windows·macOS·Linux)과 Rust 소스는 그 저장소에서 받을 수 있습니다."},
 en:{eb:"USAPhO 2022 · US Team Selection Test · Experimental",h1:"The Future Circular Collider",
   lead:"A simulation lab in which disks slide and collide on a frictionless horizontal table. Like the organisers' collision-black-box program it has two parts: in <b>wall</b> you throw a disk at a wall, and in <b>disk</b> you fire a probe disk at a hidden one. Enter the launch values and get the speed, angle and angular speed after the collision.",
   inT:"Quick entry",wv:"launch speed (m/s)",ww:"angular speed (rad/s, ccw +)",wt:"launch angle (° to normal)",
   dm:"probe mass (kg)",ds:"launch position s (m)",dv:"launch speed (m/s)",dt:"launch angle (° to horizontal)",run:"Type into terminal ↗",
   hWall:"Ranges: 0.5 ≤ v ≤ 10 m/s, −50 ≤ ω ≤ 50 rad/s, 0 ≤ θ ≤ 75°. The launcher is imperfect, so your values pick up errors, and the disk's properties also wobble a little from trial to trial. The result appears only after the disk has travelled to the wall and back.",
   hDisk:"Ranges: 1 ≤ m ≤ 5 kg, −2 ≤ s ≤ 2 m, 0.5 ≤ v ≤ 10 m/s, −90 ≤ θ ≤ 90°. The probe starts at (0, s) and has radius r = 0.250 ± 0.001 m. The hidden disk rests at (x₀, y₀) with x₀ &gt; 0; both disks are frictionless. A miss prints “swing and a miss!”.",
   outT:"Terminal",csv:"Trial log CSV",motd:"<span class=\"dim\"># Type as with the original: ./collision-black-box wall  or  ./collision-black-box disk\n# Enter a number at each prompt and press Enter; ctrl+C quits. help, clear and ↑↓ (history) work too.</span>",shHelp:"commands: ./collision-black-box wall | disk, clear, ls, help  ·  inside the program type a value and Enter, ctrl+C to quit",clr:"Clear log",busy:"running… waiting for the result",n:" trials",
   foot:"<b>Program</b> — the computation of collision-black-box (Rust, github.com/USPhysicsTeam/2022-future-circular-collider) by U.S. Physics Team coaches Kevin Zhou and Kye Shi, carried over unchanged: the hidden values, the errors added to every trial and the time each result takes all follow the original source. The original command-line program (Windows, macOS, Linux) and its Rust source are in that repository."}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=i=>document.getElementById(i);
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{ const k=e.dataset.t; if(d[k]!==undefined) e.innerHTML=d[k]; });
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":"";
  if(typeof onLang==="function") onLang(); }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

/* ── collision-black-box, part::wall and part::disk, as in the original source ── */
const WALL={R:0.3502,R_ERR:0.0092,C:0.696,C_ERR:0.035,MU:0.43,MU_ERR:0.02,BETA:0.799,BETA_ERR:0.002,DIST:0.5,PROC:3.0,
  V:[0.5,10],V_ABS:0.1,V_REL:0.05,TH:[0,75],TH_ERR:1,W:[-50,50],W_ABS:0.2,W_REL:0.05};
const DISK={R_M:0.145,R_M_ERR:0.002,M_M:1.4142,R_P:0.250,R_P_ERR:0.001,M:[1,5],M_ABS:0.02,M_REL:0.01,C:0.852,C_ERR:0.022,
  TH:[-90,90],TH_ERR:0.1,DIST:2,X:0.696,Y:-1.230,POS_ERR:0.003,PROC:4.0,V:[0.5,10],V_ABS:0.05,V_REL:0.01,S:[-2,2],S_ERR:0.002};
function normal(m,s){ let u=0,v=0; while(u===0) u=Math.random(); while(v===0) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const perturb=(f,abs,rel)=>f*(1+normal(0,rel))+normal(0,abs);
const sgn=(x,w,d)=>((x<0?"-":"+")+Math.abs(x).toFixed(d)).padStart(w," ");   /* Rust {:+w.d} */
function wallTrial(vIn,wIn,thIn){
  const v=Math.max(perturb(vIn,WALL.V_ABS,WALL.V_REL),WALL.V[0]/2), w=perturb(wIn,WALL.W_ABS,WALL.W_REL);
  const th=Math.min(90,Math.max(0,perturb(thIn,WALL.TH_ERR,0)))*Math.PI/180;
  const r=normal(WALL.R,WALL.R_ERR), c=normal(WALL.C,WALL.C_ERR), mu=normal(WALL.MU,WALL.MU_ERR), b=normal(WALL.BETA,WALL.BETA_ERR);
  const vy=v*Math.cos(th), vx=v*Math.sin(th), dmax=mu*vy*(1+c), dns=(w*r-vx)/(1+1/b), dvx=Math.max(-dmax,Math.min(dmax,dns));
  const vyN=c*vy, vxN=vx+dvx, wN=w-dvx/b/r;
  return {wait:WALL.DIST*(1/vy+1/vyN)+WALL.PROC, speed:Math.hypot(vxN,vyN), angle:Math.atan(vxN/vyN)*180/Math.PI, omega:wN};
}
function diskTrial(mIn,sIn,vIn,thIn){
  const m=perturb(mIn,DISK.M_ABS,DISK.M_REL), s=perturb(sIn,DISK.S_ERR,0), v=Math.max(perturb(vIn,DISK.V_ABS,DISK.V_REL),DISK.V[0]/2);
  const th=perturb(thIn,DISK.TH_ERR,0)*Math.PI/180;
  const rp=normal(DISK.R_P,DISK.R_P_ERR), rm=normal(DISK.R_M,DISK.R_M_ERR), c=normal(DISK.C,DISK.C_ERR);
  const xp=[0,s], xm=[normal(DISK.X,DISK.POS_ERR),normal(DISK.Y,DISK.POS_ERR)], mt=m+DISK.M_M, rt=rp+rm;
  const vh=[Math.cos(th),Math.sin(th)], vv=[vh[0]*v,vh[1]*v], ax=[-vv[1],vv[0]];
  const d=[xp[0]-xm[0],xp[1]-xm[1]], k=(d[0]*ax[0]+d[1]*ax[1])/(ax[0]*ax[0]+ax[1]*ax[1]), bb=[ax[0]*k,ax[1]*k], bn2=bb[0]*bb[0]+bb[1]*bb[1];
  if(Math.sqrt(bn2)>=rt) return {wait:DISK.DIST/v+DISK.PROC, hit:false};
  const q=Math.sqrt(rt*rt-bn2), dx=[bb[0]-vh[0]*q,bb[1]-vh[1]*q];
  const kk=(vv[0]*dx[0]+vv[1]*dx[1])/(dx[0]*dx[0]+dx[1]*dx[1]), vi=[dx[0]*kk,dx[1]*kk], f=(m-c*DISK.M_M)/mt;
  const vp=[vv[0]-vi[0]+vi[0]*f, vv[1]-vi[1]+vi[1]*f];
  return {wait:Math.hypot(xm[0]+dx[0],xm[1]+dx[1])/v+DISK.PROC, hit:true, speed:Math.hypot(vp[0],vp[1]), angle:Math.atan2(vp[1],vp[0])*180/Math.PI};
}
/* ── the terminal: a shell prompt, then the program's own prompts, typed line by line ── */
const PROMPTS={
  wall:[["launch speed (m/s):         ",WALL.V],["angular speed (rad/s):      ",WALL.W],["launch angle (° to normal): ",WALL.TH]],
  disk:[["probe mass (kg):                ",DISK.M],["launch position (m):            ",DISK.S],["launch speed (m/s):             ",DISK.V],["launch angle (° to horizontal): ",DISK.TH]]};
const FORM={wall:["wv","ww","wt"],disk:["dm","ds","dv","dt"]};
let mode="wall", prog=null, field=0, vals=[], trial={wall:0,disk:0}, busy=false, logs=[], hist=[], hpos=0, queue=[];
const term=$("term"), cmd=$("cmd");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(html){ term.innerHTML+=html+"\n"; $("termbox").scrollTop=$("termbox").scrollHeight; }
function setPS(){ $("ps").innerHTML=busy?"":prog?esc(PROMPTS[prog][field][0]):'<span class="g">user@lab</span>:<span class="c">~/Downloads</span>$ '; cmd.disabled=busy; if(!busy) cmd.focus({preventScroll:true}); $("termbox").scrollTop=$("termbox").scrollHeight; }
function trialHead(){ say('<span class="c dim">&gt;&gt;&gt;</span> <span class="cb">trial #'+(trial[prog]+1)+'…</span> <span class="c">(press <b>ctrl+C</b> or <b>ctrl+D</b> to exit)</span>'); }
function start(m){ prog=m; mode=m; field=0; vals=[]; markMode(); trialHead(); setPS(); }
function exitProg(sig){ say(esc($("ps").textContent+cmd.value)+'<span class="dim">'+sig+'</span>'); cmd.value=""; prog=null; queue=[]; setPS(); }
function shell(line){
  const w=line.trim().split(/\s+/).filter(Boolean);
  if(!w.length) return;
  const bin=w[0].replace(/^\.\//,"");
  if(/^collision-black-box(-(windows|macos|linux)(\.exe)?)?$/.test(bin)){
    if(w[1]==="wall"||w[1]==="disk") return start(w[1]);
    say("collision-black-box 0.1.0\nU.S. Physics Team Training Camp collision black box simulator\n\nUSAGE:\n    collision-black-box &lt;SUBCOMMAND&gt;\n\nSUBCOMMANDS:\n    disk    collision with unknown disk\n    help    Prints this message or the help of the given subcommand(s)\n    wall    collision with wall"); return; }
  if(w[0]==="clear"||w[0]==="cls"){ term.innerHTML=""; return; }
  if(w[0]==="ls"||w[0]==="dir"){ say("collision-black-box-linux  collision-black-box-macos  collision-black-box-windows.exe"); return; }
  if(w[0]==="help"){ say(T[lang].shHelp); return; }
  say(esc(w[0])+": command not found");
}
function rangeErr(v,lo,hi){ if(v<lo) return "value outside range: got <b>"+v+"</b>, must be ≥ <b>"+lo+"</b>"; if(v>hi) return "value outside range: got <b>"+v+"</b>, must be ≤ <b>"+hi+"</b>"; return null; }
function answer(raw){
  const [lab,rg]=PROMPTS[prog][field], t=raw.trim(), v=Number(t);
  if(t===""){ say('  <span class="r">cannot parse float from empty string</span>'); return; }   /* Rust's ParseFloatError */
  if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)&&!/^[+-]?(inf|infinity|nan)$/i.test(t)){ say('  <span class="r">invalid float literal</span>'); return; }
  const e=rangeErr(v,rg[0],rg[1]); if(e){ say('  <span class="r">'+e+'</span>'); return; }
  vals.push(v); field++;
  if(field<PROMPTS[prog].length) return;
  const m=prog, res=m==="wall"?wallTrial(...vals):diskTrial(...vals), used=vals.slice();
  trial[m]++; say('<span class="g">  running…</span>'); busy=true; setPS(); $("run").disabled=true; $("stat").textContent=T[lang].busy;
  setTimeout(()=>{
    let row;
    if(m==="wall"){ say("  rebound speed: <b>"+sgn(res.speed,7,3)+" m/s</b>\n  rebound angle: <b>"+sgn(res.angle,7,3)+" ° to normal</b>\n  angular speed: <b>"+sgn(res.omega,7,3)+" rad/s</b>\n");
      row=["wall",trial[m],...used,"",res.speed.toFixed(3),res.angle.toFixed(3),res.omega.toFixed(3)]; }
    else if(res.hit){ say('  <span class="gb">you got a hit!</span>\n  probe speed: <b>'+sgn(res.speed,8,3)+' m/s</b>\n  probe angle: <b>'+sgn(res.angle,8,3)+' ° to horizontal</b>\n');
      row=["disk",trial[m],...used,res.speed.toFixed(3),res.angle.toFixed(3),""]; }
    else { say('<span class="y">  swing and a miss!</span>\n'); row=["disk",trial[m],...used,"miss","",""]; }
    logs.push(row); showLog(); busy=false; $("run").disabled=false; $("stat").textContent=logs.length+T[lang].n;
    field=0; vals=[]; if(prog){ trialHead(); setPS(); feed(); } }, res.wait*1000);
}
function enter(line){
  say(esc($("ps").textContent)+'<span class="in">'+esc(line)+'</span>');
  if(line.trim()){ hist.push(line); } hpos=hist.length;
  if(prog) answer(line); else shell(line);
  if(!busy) setPS();
}
cmd.addEventListener("keydown",e=>{
  if(busy){ e.preventDefault(); return; }
  if(e.key==="Enter"){ const v=cmd.value; cmd.value=""; enter(v); e.preventDefault(); }
  else if(e.ctrlKey&&(e.key==="c"||e.key==="C")){ if(prog){ exitProg("^C"); e.preventDefault(); } else { say(esc($("ps").textContent+cmd.value)+'<span class="dim">^C</span>'); cmd.value=""; e.preventDefault(); } }
  else if(e.ctrlKey&&(e.key==="d"||e.key==="D")){ if(prog){ exitProg("^D"); } e.preventDefault(); }
  else if(e.ctrlKey&&(e.key==="l"||e.key==="L")){ term.innerHTML=""; e.preventDefault(); }
  else if(e.key==="ArrowUp"){ if(hpos>0){ hpos--; cmd.value=hist[hpos]; } e.preventDefault(); }
  else if(e.key==="ArrowDown"){ if(hpos<hist.length){ hpos++; cmd.value=hist[hpos]||""; } e.preventDefault(); }
});
$("termbox").addEventListener("mouseup",()=>{ if(!getSelection().toString()) cmd.focus({preventScroll:true}); });
/* the form on the left types the same lines into the terminal for you */
function feed(){ if(!queue.length||busy||!prog) return; const v=queue.shift(); cmd.value=v; setTimeout(()=>{ cmd.value=""; enter(v); feed(); },120); }
function markMode(){ $("m-wall").className=mode==="wall"?"on":""; $("m-disk").className=mode==="disk"?"on":"";
  $("f-wall").style.display=mode==="wall"?"":"none"; $("f-disk").style.display=mode==="disk"?"":"none"; $("help").innerHTML=T[lang][mode==="wall"?"hWall":"hDisk"]; }
function setMode(m){ if(busy) return; mode=m; markMode(); if(prog&&prog!==m) exitProg("^C"); }
$("m-wall").onclick=()=>setMode("wall"); $("m-disk").onclick=()=>setMode("disk");
$("run").onclick=()=>{ if(busy) return;
  if(prog!==mode){ if(prog) exitProg("^C"); enter("./collision-black-box "+mode); }
  if(field>0){ vals=[]; field=0; }
  queue=FORM[mode].map(id=>$(id).value.trim()); feed(); };
function logText(){ return "part,trial,in1,in2,in3,in4,out_speed,out_angle,out_omega\n"+logs.map(r=>r.join(",")).join("\n"); }
function showLog(){ $("log").textContent=logs.map(r=>r[0]==="wall"
  ? "wall #"+r[1]+"  v="+r[2]+"  ω="+r[3]+"  θ="+r[4]+"   →  v'="+r[6]+"  θ'="+r[7]+"  ω'="+r[8]
  : "disk #"+r[1]+"  m="+r[2]+"  s="+r[3]+"  v="+r[4]+"  θ="+r[5]+"   →  "+(r[6]==="miss"?"miss":"v'="+r[6]+"  θ'="+r[7])).join("\n"); $("log").scrollTop=1e9; }
$("csv").onclick=()=>logs.length&&download("collision_trials.csv",logText(),"text/csv");
$("clr").onclick=()=>{ logs=[]; $("log").textContent=""; $("stat").textContent=""; };
function onLang(){ markMode(); }
applyLang(); markMode(); say(T[lang].motd); setPS();
</script>
  <script src="adfit.js"></script>
</body>
</html>
