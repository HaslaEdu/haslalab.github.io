/* the console page of the HaslaLab command-line ports (as IPhO 2022): everything happens in the terminal */
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px;max-width:980px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px;max-width:980px}
header li{margin:2px 0}
header code{color:#d7ba7d}
#lang{position:absolute;right:16px;top:12px;display:flex;gap:6px}
#lang a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
#lang a.on{color:var(--accent);border-color:var(--accent)}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-word}

#screen .g{color:#6a9955}#screen .c{color:#4ec9b0}#screen .y{color:#dcdcaa}#screen .r{color:#f48771}#screen .b{font-weight:700}#screen .dim{color:var(--dim)}

#ps .g{color:#6a9955}#ps .c{color:#569cd6}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header>
  <div id="lang"><a id="lang-ko">한국어</a><a id="lang-en">English</a></div>
  <h1 id="h1"></h1><p id="sub"></p>
  <details><summary id="about"></summary><ul id="notes"></ul></details>
</header>
<div id="screen"></div>
<div id="bar"><span id="ps"></span><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div id="tools"><button id="b-restart"></button><button id="b-copy"></button><button id="b-save"></button></div>
<script>
"use strict";
/* ── collision-black-box, part::wall and part::disk, as in the original source ── */
const WALL={R:0.3502,R_ERR:0.0092,C:0.696,C_ERR:0.035,MU:0.43,MU_ERR:0.02,BETA:0.799,BETA_ERR:0.002,DIST:0.5,PROC:3.0,
  V:[0.5,10],V_ABS:0.1,V_REL:0.05,TH:[0,75],TH_ERR:1,W:[-50,50],W_ABS:0.2,W_REL:0.05};
const DISK={R_M:0.145,R_M_ERR:0.002,M_M:1.4142,R_P:0.250,R_P_ERR:0.001,M:[1,5],M_ABS:0.02,M_REL:0.01,C:0.852,C_ERR:0.022,
  TH:[-90,90],TH_ERR:0.1,DIST:2,X:0.696,Y:-1.230,POS_ERR:0.003,PROC:4.0,V:[0.5,10],V_ABS:0.05,V_REL:0.01,S:[-2,2],S_ERR:0.002};
function normal(m,s){ let u=0,v=0; while(u===0) u=Math.random(); while(v===0) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const perturb=(f,abs,rel)=>f*(1+normal(0,rel))+normal(0,abs);
const sgn=(x,w,d)=>((x<0?"-":"+")+Math.abs(x).toFixed(d)).padStart(w," ");   /* Rust {:+w.d} */
function wallTrial(vIn,wIn,thIn){
  const v=Math.max(perturb(vIn,WALL.V_ABS,WALL.V_REL),WALL.V[0]/2), w=perturb(wIn,WALL.W_ABS,WALL.W_REL);
  const th=Math.min(90,Math.max(0,perturb(thIn,WALL.TH_ERR,0)))*Math.PI/180;
  const r=normal(WALL.R,WALL.R_ERR), c=normal(WALL.C,WALL.C_ERR), mu=normal(WALL.MU,WALL.MU_ERR), b=normal(WALL.BETA,WALL.BETA_ERR);
  const vy=v*Math.cos(th), vx=v*Math.sin(th), dmax=mu*vy*(1+c), dns=(w*r-vx)/(1+1/b), dvx=Math.max(-dmax,Math.min(dmax,dns));
  const vyN=c*vy, vxN=vx+dvx, wN=w-dvx/b/r;
  return {wait:WALL.DIST*(1/vy+1/vyN)+WALL.PROC, speed:Math.hypot(vxN,vyN), angle:Math.atan(vxN/vyN)*180/Math.PI, omega:wN};
}
function diskTrial(mIn,sIn,vIn,thIn){
  const m=perturb(mIn,DISK.M_ABS,DISK.M_REL), s=perturb(sIn,DISK.S_ERR,0), v=Math.max(perturb(vIn,DISK.V_ABS,DISK.V_REL),DISK.V[0]/2);
  const th=perturb(thIn,DISK.TH_ERR,0)*Math.PI/180;
  const rp=normal(DISK.R_P,DISK.R_P_ERR), rm=normal(DISK.R_M,DISK.R_M_ERR), c=normal(DISK.C,DISK.C_ERR);
  const xp=[0,s], xm=[normal(DISK.X,DISK.POS_ERR),normal(DISK.Y,DISK.POS_ERR)], mt=m+DISK.M_M, rt=rp+rm;
  const vh=[Math.cos(th),Math.sin(th)], vv=[vh[0]*v,vh[1]*v], ax=[-vv[1],vv[0]];
  const d=[xp[0]-xm[0],xp[1]-xm[1]], k=(d[0]*ax[0]+d[1]*ax[1])/(ax[0]*ax[0]+ax[1]*ax[1]), bb=[ax[0]*k,ax[1]*k], bn2=bb[0]*bb[0]+bb[1]*bb[1];
  if(Math.sqrt(bn2)>=rt) return {wait:DISK.DIST/v+DISK.PROC, hit:false};
  const q=Math.sqrt(rt*rt-bn2), dx=[bb[0]-vh[0]*q,bb[1]-vh[1]*q];
  const kk=(vv[0]*dx[0]+vv[1]*dx[1])/(dx[0]*dx[0]+dx[1]*dx[1]), vi=[dx[0]*kk,dx[1]*kk], f=(m-c*DISK.M_M)/mt;
  const vp=[vv[0]-vi[0]+vi[0]*f, vv[1]-vi[1]+vi[1]*f];
  return {wait:Math.hypot(xm[0]+dx[0],xm[1]+dx[1])/v+DISK.PROC, hit:true, speed:Math.hypot(vp[0],vp[1]), angle:Math.atan2(vp[1],vp[0])*180/Math.PI};
}

const T={
 ko:{h1:"USAPhO 2022 TST 실험 — 미래 원형 충돌기 (collision-black-box)",
   sub:"주최측이 배포한 것은 명령줄 프로그램 collision-black-box뿐입니다. 이 페이지는 그 프로그램을 브라우저 터미널에서 그대로 돌리는 판입니다. 명령도, 값도, 결과도 모두 아래 터미널에서 입력하고 읽습니다.",
   about:"이 프로그램에 대하여",
   notes:["문제지처럼 터미널에 <code>./collision-black-box-macos wall</code> 또는 <code>collision-black-box-windows.exe disk</code>(이름은 <code>collision-black-box</code>만 쳐도 됨)를 입력하면 실험이 시작되고, 프로그램이 묻는 값을 한 줄씩 입력합니다. 끝내려면 <b>Ctrl+C</b>(또는 Ctrl+D).",
     "<b>wall</b> — 발사 속력 0.5–10 m/s, 각속도 −50–50 rad/s(반시계 +), 입사각 0–75°(법선과의 각). 결과: 반사 속력, 반사각, 각속도.",
     "<b>disk</b> — 탐사 원판 질량 1–5 kg, 발사 위치 s −2–2 m, 발사 속력 0.5–10 m/s, 발사각 −90–90°(수평과의 각). 탐사 원판 반지름 r = 0.250 ± 0.001 m. 맞으면 탐사 원판의 속력과 각도, 빗나가면 “swing and a miss!”.",
     "발사 장치가 완벽하지 않아 넣은 값에 문제지에 적힌 오차가 붙고, 원판의 성질도 시행마다 조금씩 흔들립니다. 원판이 충돌하고 돌아오는 시간만큼 기다려야 결과가 나옵니다.",
     "계산은 U.S. Physics Team 코치 Kevin Zhou와 Kye Shi의 Rust 소스(github.com/USPhysicsTeam/2022-future-circular-collider)를 그대로 옮겼습니다. 숨겨진 값, 오차, 대기 시간도 같습니다.",
     "셸 명령: <code>ls</code>, <code>cd</code>, <code>clear</code>, <code>help</code>. ↑↓로 이전 입력을 다시 불러옵니다. 화면 내용은 아래 버튼으로 복사하거나 .txt로 저장할 수 있습니다."],
   restart:"다시 시작 (Ctrl+L로 화면만 지우기)",copy:"화면 복사",copied:"복사됨",save:".txt로 저장",
   motd:"HaslaLab 터미널 — collision-black-box가 있는 폴더(~/Downloads)입니다. help를 입력하면 쓸 수 있는 명령이 나옵니다.\n",
   help:"  ./collision-black-box wall    벽 충돌 실험 (4.1)\n  ./collision-black-box disk    원판 충돌 실험 (4.2)\n  ls, cd, clear, help\n  프로그램 안에서는 묻는 값을 입력하고 Enter, 끝낼 때 Ctrl+C"},
 en:{h1:"USAPhO 2022 TST experiment — The Future Circular Collider (collision-black-box)",
   sub:"The organisers handed out only the command-line program collision-black-box. This page runs that program in a browser terminal: commands, values and results are all typed and read in the terminal below.",
   about:"About this program",
   notes:["As in the paper, type <code>./collision-black-box-macos wall</code> or <code>collision-black-box-windows.exe disk</code> (plain <code>collision-black-box</code> works too) to start a part, then answer the program's prompts one line at a time. <b>Ctrl+C</b> (or Ctrl+D) quits.",
     "<b>wall</b> — launch speed 0.5–10 m/s, angular speed −50–50 rad/s (ccw +), angle 0–75° to the normal. Returns the rebound speed, rebound angle and angular speed.",
     "<b>disk</b> — probe mass 1–5 kg, launch position s −2–2 m, launch speed 0.5–10 m/s, launch angle −90–90° to the horizontal. Probe radius r = 0.250 ± 0.001 m. A hit returns the probe's speed and angle; a miss prints “swing and a miss!”.",
     "The launcher is imperfect, so your values pick up the errors stated in the paper, and the disks' properties wobble a little from trial to trial. Each result appears only after the disks have had time to collide.",
     "The computation is the Rust source by U.S. Physics Team coaches Kevin Zhou and Kye Shi (github.com/USPhysicsTeam/2022-future-circular-collider), carried over unchanged, hidden values, errors and waiting times included.",
     "Shell commands: <code>ls</code>, <code>cd</code>, <code>clear</code>, <code>help</code>. ↑↓ recall earlier lines. The buttons below copy the screen or save it as .txt."],
   restart:"Restart (Ctrl+L clears the screen)",copy:"Copy screen",copied:"Copied",save:"Save as .txt",
   motd:"HaslaLab terminal — the folder holding collision-black-box (~/Downloads). Type help for the commands.\n",
   help:"  ./collision-black-box wall    collision with a wall (4.1)\n  ./collision-black-box disk    collision with a disk (4.2)\n  ls, cd, clear, help\n  inside the program answer each prompt and press Enter; Ctrl+C quits"}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=i=>document.getElementById(i);
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  $("h1").textContent=d.h1; $("sub").textContent=d.sub; $("about").textContent=d.about;
  $("notes").innerHTML=d.notes.map(n=>"<li>"+n+"</li>").join("");
  $("b-restart").textContent=d.restart; $("b-copy").textContent=d.copy; $("b-save").textContent=d.save;
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":""; }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

/* ── the terminal: a shell, then the program's own prompts, one typed line at a time ── */
const PROMPTS={
  wall:[["launch speed (m/s):         ",WALL.V],["angular speed (rad/s):      ",WALL.W],["launch angle (° to normal): ",WALL.TH]],
  disk:[["probe mass (kg):                ",DISK.M],["launch position (m):            ",DISK.S],["launch speed (m/s):             ",DISK.V],["launch angle (° to horizontal): ",DISK.TH]]};
let prog=null, field=0, vals=[], trial={wall:0,disk:0}, busy=false, hist=[], hpos=0, cwd="~/Downloads", timer=null;
const screen=$("screen"), inp=$("inp");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(html){ screen.insertAdjacentHTML("beforeend",html+"\n"); screen.scrollTop=screen.scrollHeight; }
function shellPS(){ return '<span class="g">user@lab</span>:<span class="c">'+esc(cwd)+'</span>$ '; }
function setPS(){ $("ps").innerHTML=busy?"":prog?esc(PROMPTS[prog][field][0]):shellPS(); inp.disabled=busy; if(!busy) inp.focus({preventScroll:true}); }
function trialHead(){ say('<span class="c">&gt;&gt;&gt;</span> <span class="b">trial #'+(trial[prog]+1)+'…</span> <span class="c">(press <span class="b">ctrl+C</span> or <span class="b">ctrl+D</span> to exit)</span>'); }
function start(m){ prog=m; field=0; vals=[]; trialHead(); }
function quitProg(sig){ say($("ps").innerHTML+esc(inp.value)+'<span class="dim">'+sig+'</span>'); inp.value=""; if(timer){clearTimeout(timer);timer=null;busy=false;} prog=null; setPS(); }
function shell(line){
  const w=line.trim().split(/\s+/).filter(Boolean);
  if(!w.length) return;
  const bin=w[0].replace(/^\.[\\/]/,"");
  if(/^collision-black-box(-(windows|macos|linux)(\.exe)?)?$/.test(bin)){
    if(cwd!=="~/Downloads"){ say(esc(w[0])+": No such file or directory"); return; }
    if(w[1]==="wall"||w[1]==="disk") return start(w[1]);
    say("collision-black-box 0.1.0\nU.S. Physics Team Training Camp collision black box simulator\n\nUSAGE:\n    collision-black-box &lt;SUBCOMMAND&gt;\n\nFLAGS:\n    -h, --help       Prints help information\n    -V, --version    Prints version information\n\nSUBCOMMANDS:\n    disk    collision with unknown disk\n    help    Prints this message or the help of the given subcommand(s)\n    wall    collision with wall");
    return; }
  if(w[0]==="clear"||w[0]==="cls"){ screen.innerHTML=""; return; }
  if(w[0]==="ls"||w[0]==="dir"){ if(cwd==="~/Downloads") say("collision-black-box-linux  collision-black-box-macos  collision-black-box-windows.exe"); else say("Downloads"); return; }
  if(w[0]==="cd"){ const t=w[1]||"~"; if(t==="~"||t===".."&&cwd==="~/Downloads") cwd="~";
    else if(/^(~\/)?Downloads\/?$/.test(t)||(t==="Downloads"&&cwd==="~")) cwd="~/Downloads";
    else if(t!=="."&&t!=="./") say("cd: "+esc(t)+": No such file or directory"); return; }
  if(w[0]==="chmod"||w[0]==="open") return;
  if(w[0]==="pwd"){ say(cwd.replace("~","/home/user")); return; }
  if(w[0]==="help"){ say(T[lang].help); return; }
  say(esc(w[0])+": command not found");
}
function rangeErr(v,lo,hi){ if(v<lo) return "value outside range: got <span class=\"b\">"+v+"</span>, must be ≥ <span class=\"b\">"+lo+"</span>"; if(v>hi) return "value outside range: got <span class=\"b\">"+v+"</span>, must be ≤ <span class=\"b\">"+hi+"</span>"; return null; }
function answer(raw){
  const rg=PROMPTS[prog][field][1], t=raw.trim(), v=Number(t);
  if(t===""){ say('  <span class="r">cannot parse float from empty string</span>'); return; }   /* Rust's ParseFloatError */
  if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)&&!/^[+-]?(inf|infinity|nan)$/i.test(t)){ say('  <span class="r">invalid float literal</span>'); return; }
  const e=rangeErr(v,rg[0],rg[1]); if(e){ say('  <span class="r">'+e+'</span>'); return; }
  vals.push(v); field++;
  if(field<PROMPTS[prog].length) return;
  const m=prog, res=m==="wall"?wallTrial(...vals):diskTrial(...vals);
  trial[m]++; say('<span class="g">  running…</span>'); busy=true; setPS();
  timer=setTimeout(()=>{ timer=null;
    if(m==="wall") say("  rebound speed: <span class=\"b\">"+sgn(res.speed,7,3)+" m/s</span>\n  rebound angle: <span class=\"b\">"+sgn(res.angle,7,3)+" ° to normal</span>\n  angular speed: <span class=\"b\">"+sgn(res.omega,7,3)+" rad/s</span>\n");
    else if(res.hit) say('  <span class="g b">you got a hit!</span>\n  probe speed: <span class="b">'+sgn(res.speed,8,3)+' m/s</span>\n  probe angle: <span class="b">'+sgn(res.angle,8,3)+' ° to horizontal</span>\n');
    else say('<span class="y">  swing and a miss!</span>\n');
    busy=false; field=0; vals=[]; if(prog) trialHead(); setPS(); }, res.wait*1000);
}
function enter(line){
  say($("ps").innerHTML+'<span class="in">'+esc(line)+'</span>');
  if(line.trim()) hist.push(line); hpos=hist.length;
  if(prog) answer(line); else shell(line);
  if(!busy) setPS();
}
inp.addEventListener("keydown",e=>{
  if(e.ctrlKey&&(e.key==="c"||e.key==="C")){ if(prog||busy) quitProg("^C"); else { say($("ps").innerHTML+esc(inp.value)+'<span class="dim">^C</span>'); inp.value=""; } e.preventDefault(); return; }
  if(e.ctrlKey&&(e.key==="d"||e.key==="D")){ if(prog||busy) quitProg("^D"); e.preventDefault(); return; }
  if(e.ctrlKey&&(e.key==="l"||e.key==="L")){ screen.innerHTML=""; e.preventDefault(); return; }
  if(busy){ e.preventDefault(); return; }
  if(e.key==="Enter"){ const v=inp.value; inp.value=""; enter(v); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ if(hpos>0){ hpos--; inp.value=hist[hpos]; } e.preventDefault(); }
  else if(e.key==="ArrowDown"){ if(hpos<hist.length){ hpos++; inp.value=hist[hpos]||""; } e.preventDefault(); }
});
/* while a trial runs the input is disabled, so Ctrl+C has to be caught on the page */
document.addEventListener("keydown",e=>{ if(busy&&e.ctrlKey&&(e.key==="c"||e.key==="C"||e.key==="d"||e.key==="D")){ quitProg(e.key.toLowerCase()==="c"?"^C":"^D"); e.preventDefault(); } });
screen.addEventListener("mouseup",()=>{ if(!getSelection().toString()) inp.focus({preventScroll:true}); });
function restart(){ if(timer){clearTimeout(timer);timer=null;} busy=false; prog=null; field=0; vals=[]; cwd="~/Downloads"; screen.innerHTML=""; say('<span class="dim">'+esc(T[lang].motd)+'</span>'); setPS(); }
$("b-restart").onclick=restart;
$("b-copy").onclick=()=>navigator.clipboard.writeText(screen.textContent).then(()=>{ $("b-copy").textContent=T[lang].copied; setTimeout(()=>$("b-copy").textContent=T[lang].copy,1200); },()=>{});
$("b-save").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([screen.textContent],{type:"text/plain;charset=utf-8"})); a.download="collision-black-box.txt"; a.click(); URL.revokeObjectURL(a.href); };
applyLang(); restart();
</script>
