"use strict";
/* IOAA 2019, Keszthely (Hungary), data analysis: D1 photometry and spectroscopy of Nova Del 2013 (V339 Del; the
   AAVSO V light curve and six Hα spectra from the 1 m Konkoly telescope), D2 the triply eclipsing hierarchical
   triple HD 181068 (contact times of the outer eclipses seen by Kepler, the RV curve of star A and the eclipse
   timing variation of the close pair).  The sheet's own figures are the light curve and the spectra (both given
   in A3 at the examination; here at the resolution of the published sheet) and the pole-on sketch of the orbits;
   graph paper for the rest.  No official solution was published, so the solution is HaslaLab's. */
const MJD = ["56518.986", "56519.813", "56520.843", "56521.835", "56522.829", "56523.827"];
const EV = [["1", "I", "A, B", "2455476.1096"], ["", "II", "A, C", "2455476.4245"], ["", "III", "A, B", "2455477.9677"], ["", "IV", "A, B", "2455478.4722"],
            ["2", "I", "A, B", "2455521.5217"], ["3", "III", "A, C", "2455568.9434"], ["4", "I", "A, C", "2455612.4733"], ["", "III", "A, C", "2455614.3571"],
            ["5", "III", "A, B", "2455659.9241"], ["", "IV", "A, C", "2455660.2422"]];
/* HaslaLab's phases, rounded to four decimals */
const PH = [[0.1226, 0.9747], [0.4703, 0.9816], [0.1743, 0.0155], [0.7313, 0.0266], [0.2643, 0.9734], [0.6248, 0.0163], [0.6882, 0.9736], [0.7682, 0.0150], [0.0808, 0.0171], [0.4320, 0.0241]];
const EVN = ["1 I", "1 II", "1 III", "1 IV", "2 I", "3 III", "4 I", "4 III", "5 III", "5 IV"];
/* the two figures as printed: frame 44.5…652 px across, 29.5…443 px down; a ruler reads them from the frame's bottom-left corner */
const ruler = (x, y, L) => { const X = (x - 44.5) * 0.06, Y = (443 - y) * 0.06; return X < -0.3 || Y < -0.3 || X > 36.8 || Y > 25.1 ? "" : (L === "ko" ? "자: 테두리 왼쪽 아래 모서리에서 " : "Ruler, from the bottom-left corner of the frame: ") + "x = " + X.toFixed(2) + " cm, y = " + Y.toFixed(2) + " cm"; };
/* checking typed answers */
const num = (s) => { const t = String(s ?? "").replace(/[−–]/g, "-").replace(",", ".").replace(/\s/g, "").replace(/[×x]10\^?(-?\d+)/i, "e$1"); const v = parseFloat(t); return isFinite(v) ? v : null; };
const nums = (s) => [...String(s ?? "").replace(/[−–]/g, "-").matchAll(/-?\d+(?:[.,]\d+)?(?:e-?\d+)?/gi)].map((m) => parseFloat(m[0].replace(",", ".")));
const inR = (v, lo, hi) => v == null ? "" : (v >= lo && v <= hi ? " ✓" : " ✗");
const yours = (A, k, L) => A[k] ? (L === "ko" ? " · 당신의 답 " : " · yours ") + A[k] : "";
const chk = (A, k, L, lo, hi) => yours(A, k, L) + inR(num(A[k]), lo, hi);
const chkAbs = (A, k, L, lo, hi) => yours(A, k, L) + inR(num(A[k]) == null ? null : Math.abs(num(A[k])), lo, hi);
const pick = (A, k, L, right) => A[k] ? yours(A, k, L) + (A[k] === right ? " ✓" : " ✗") : "";
const phase = (A, k, L, a, b) => { const n = nums(A[k]); return yours(A, k, L) + (n.length === 2 ? (Math.abs(n[0] - a) <= 0.0002 && Math.abs(n[1] - b) <= 0.0002 ? " ✓" : " ✗") : ""); };
/* the solution figures, drawn over the sheet's own images */
const IM = {}; for (const k of ["lc", "sp"]) { IM[k] = new Image(); IM[k].src = "ioaa2019_D/" + k + ".png"; }
const LX = (t) => 44.5 + (t - 56509) * 607.5 / 102, LY = (m) => 35 + (m - 4) * 50.4;
const SX = (l) => 44.5 + (l - 6450) * 607.5 / 280;
const TR = [[6528.0, 209], [6531.3, 257.5], [6534.8, 299], [6538.6, 331], [6542.6, 353], [6543.5, 385]];
const VEL = [-1591, -1440, -1280, -1106, -924, -883];
function solLC(g, W, H, L) {
  g.drawImage(IM.lc, 0, 0, W, H); g.lineWidth = 1.3; g.font = "bold 11px sans-serif";
  for (const [m, t, s, c] of [[4.55, 56520.5, "m₀ = 4.55", "#c62828"], [6.55, 56532.4, "m₀ + 2", "#1f4fd1"], [7.55, 56545.4, "m₀ + 3", "#2e7d32"]]) {
    g.strokeStyle = g.fillStyle = c; g.setLineDash([5, 3]); g.beginPath(); g.moveTo(44.5, LY(m)); g.lineTo(652, LY(m)); g.moveTo(LX(t), LY(m)); g.lineTo(LX(t), 443); g.stroke(); g.setLineDash([]);
    g.beginPath(); g.arc(LX(t), LY(m), 4, 0, 7); g.stroke(); g.fillText(s + "  ·  MJD " + t.toFixed(1), LX(t) + 7, LY(m) - 5); }
  g.fillStyle = "#111"; g.fillText("t₂ ≈ 11.9 d, t₃ ≈ 24.9 d", 440, 120);
}
function solSP(g, W, H) {
  g.drawImage(IM.sp, 0, 0, W, H); g.strokeStyle = g.fillStyle = "#c62828"; g.lineWidth = 1.3; g.font = "bold 10px sans-serif";
  TR.forEach(([l, y], i) => { const x = SX(l); g.beginPath(); g.arc(x, y, 4, 0, 7); g.stroke(); g.setLineDash([3, 3]); g.beginPath(); g.moveTo(x, y + 5); g.lineTo(x, 443); g.stroke(); g.setLineDash([]);
    g.fillText(l.toFixed(1), x - 52, y + 3); });
  g.beginPath(); g.moveTo(SX(6562.82), 30); g.lineTo(SX(6562.82), 443); g.stroke(); g.fillText("λ₀ = 6562.82", SX(6562.82) + 3, 42);
}
function solV(g, W, H, L) {
  const x0 = 60, x1 = W - 20, y0 = H - 40, y1 = 20, X = (t) => x0 + (t - 56518.5) / 5.6 * (x1 - x0), Y = (v) => y0 - (v - 800) / 1000 * (y0 - y1);
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.strokeStyle = "#ddd"; g.lineWidth = 1; g.fillStyle = "#333"; g.font = "11px sans-serif";
  for (let t = 56519; t <= 56524; t++) { g.beginPath(); g.moveTo(X(t), y0); g.lineTo(X(t), y1); g.stroke(); g.fillText(String(t), X(t) - 17, y0 + 14); }
  for (let v = 800; v <= 1800; v += 200) { g.beginPath(); g.moveTo(x0, Y(v)); g.lineTo(x1, Y(v)); g.stroke(); g.fillText(String(v), x0 - 32, Y(v) + 4); }
  g.fillText("MJD", x1 - 26, y0 + 30); g.fillText(L === "ko" ? "|v_r| (km/s)" : "|v_r| (km s⁻¹)", x0 - 50, y1 - 6);
  g.fillStyle = "rgba(31,79,209,.16)"; g.beginPath(); g.moveTo(X(+MJD[0]), y0); MJD.forEach((t, i) => g.lineTo(X(+t), Y(-VEL[i]))); g.lineTo(X(+MJD[5]), y0); g.closePath(); g.fill();
  g.strokeStyle = "#1f4fd1"; g.lineWidth = 1.5; g.beginPath(); MJD.forEach((t, i) => i ? g.lineTo(X(+t), Y(-VEL[i])) : g.moveTo(X(+t), Y(-VEL[i]))); g.stroke();
  g.fillStyle = "#c62828"; MJD.forEach((t, i) => { g.beginPath(); g.arc(X(+t), Y(-VEL[i]), 3.5, 0, 7); g.fill(); });
  g.fillStyle = "#1f4fd1"; g.font = "bold 12px sans-serif"; g.fillText(L === "ko" ? "넓이 = ∫|v|dt ≈ 5745 km/s·d ≈ 3.3 au" : "area = ∫|v|dt ≈ 5745 km s⁻¹ d ≈ 3.3 au", X(56520.4), Y(1050));
}
/* D2: projected distance of B and C from A's centre (in units of a2) through outer eclipse 1, with HaslaLab's fit */
function solGeo(g, W, H, L) {
  const P1 = 0.9056768, P2 = 45.4711, T01 = 2455051.2361, T02 = 2455522.7318, kB = 0.02573, kC = 0.02641;
  const lines = [[0.14078, "R_A + R_B", "#c62828"], [0.12018, "R_A − R_B", "#c62828"], [0.14039, "R_A + R_C", "#1f4fd1"], [0.12049, "R_A − R_C", "#1f4fd1"]];
  const ta = 2455475.6, tb = 2455479.0, x0 = 50, x1 = W - 90, y0 = H - 34, y1 = 8, X = (t) => x0 + (t - ta) / (tb - ta) * (x1 - x0), Y = (d) => y0 - d / 0.2 * (y0 - y1);
  const dx = (t, s) => { const u = Math.sin(2 * Math.PI * (t - T02) / P2), w = Math.sin(2 * Math.PI * (t - T01) / P1); return Math.abs(s === "B" ? u + kB * w : u - kC * w); };
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.font = "11px sans-serif"; g.strokeStyle = "#ddd"; g.fillStyle = "#333";
  for (let t = 2455476; t <= 2455479; t++) { g.beginPath(); g.moveTo(X(t), y0); g.lineTo(X(t), y1); g.stroke(); g.fillText(String(t), X(t) - 26, y0 + 14); }
  for (let d = 0; d <= 0.2001; d += 0.05) { g.beginPath(); g.moveTo(x0, Y(d)); g.lineTo(x1, Y(d)); g.stroke(); g.fillText(d.toFixed(2), x0 - 32, Y(d) + 4); }
  g.fillText("BJD", x1 - 20, y0 + 28); g.fillText("|x − x_A| / a₂", x0 + 6, y1 + 10);
  for (const [d, s, c] of lines) { g.strokeStyle = g.fillStyle = c; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(x0, Y(d)); g.lineTo(x1, Y(d)); g.stroke(); g.setLineDash([]); if (c === "#c62828") g.fillText(s, x1 + 4, Y(d) + 4); else g.fillText(s, x0 + 4, Y(d) + (s.includes("+") ? -4 : 12)); }
  for (const [s, c] of [["B", "#c62828"], ["C", "#1f4fd1"]]) { g.strokeStyle = c; g.lineWidth = 1.4; g.beginPath(); for (let i = 0; i <= 600; i++) { const t = ta + (tb - ta) * i / 600; i ? g.lineTo(X(t), Y(dx(t, s))) : g.moveTo(X(t), Y(dx(t, s))); } g.stroke(); }
  g.fillStyle = "#111"; [[2455476.1096, "B"], [2455476.4245, "C"], [2455477.9677, "B"], [2455478.4722, "B"]].forEach(([t, s], i) => { g.beginPath(); g.arc(X(t), Y(dx(t, s)), 4, 0, 7); g.fill(); g.fillText(["I", "II", "III", "IV"][i], X(t) - 4, Y(dx(t, s)) - 8); });
}

  sub: {ko: "제13회 국제 천문·천체물리 올림피아드 · 헝가리 케스트헤이 · 150점 · 시험지 그림, 밀리미터 모눈종이, 계산기, 작업표", en: "13th International Olympiad on Astronomy and Astrophysics · Keszthely, Hungary · 150 points · the sheet's figures, millimetre graph paper, calculator, worksheet"},
  docTitle: {ko: "IOAA 2019 자료 분석 · HaslaLab", en: "IOAA 2019 data analysis · HaslaLab"},

  tasks: [{
    id: "D1", marks: 60, name: {ko: "신성 Del 2013의 측광과 분광", en: "Photometry and spectroscopy of Nova Del 2013"},
    lead: {ko: "고전 신성 V339 Del(신성 Delphini 2013)은 2013년 8월 14일 14:01 UT(MJD = 56518.584)에 이타가키 고이치가 6.8등급으로 발견했습니다. 알림 뒤 10시간이 안 되어 밤이 된 헝가리 콘콜리 천문대 피스케스테토 관측소에서 1 m 망원경에 붙인 eShel 에셸 분광기로 첫 스펙트럼을 얻었습니다. 그림 1.1은 AAVSO 자료의 V 광도 곡선(회색 점 약 38 000개, 검은 선은 반치전폭 0.5일 가우스 필터로 매끄럽게 한 평균 곡선), 그림 1.2는 최대 밝기 시각 t₀ 앞뒤 엿새 밤의 Hα 부근 스펙트럼입니다(위아래로 옮겨 그림, 오른쪽에 MJD).",
           en: "The classical nova V339 Del (Nova Delphini 2013) was discovered by Koichi Itagaki at magnitude 6.8 on 14 August 2013 at 14:01 UT (MJD = 56518.584). Less than 10 hours after the alert, when night fell at the Piszkéstető station of the Konkoly Observatory, Hungarian astronomers took its first spectrum with the eShel echelle spectrograph on the 1 m telescope. Figure 1.1 is the V light curve from AAVSO data (about 38 000 grey points; the black line is the average curve smoothed with a Gaussian filter of FWHM 0.5 day), Figure 1.2 the spectra around Hα on six consecutive nights around the time of maximum t₀ (shifted vertically, MJD on the right)."},
    maps: ["lc", "sp", "vt"],
    parts: [{h: {ko: "주어진 것", en: "Given"}, ko: "감소율 t₂, t₃는 신성이 최대 밝기에서 각각 2등급, 3등급 어두워지는 데 걸린 날수입니다. 최대 절대 등급 M₀(V)의 경험식 세 개와 색 초과 E(B − V) = 0.184 ± 0.035(Chochol 외 2014), R_V = 3.1(오차 없음). P Cygni 윤곽의 방출 봉우리는 정지 파장 λ₀ = 6562.82 Å(공기 중)에 있고, 청색 이동한 흡수선의 파장 λ에서 도플러 공식으로 껍질의 시선 팽창 속도를 얻습니다. Hα는 구형으로 팽창하는 껍질의 가장 바깥에서 생기고, 첫 스펙트럼을 찍을 때 껍질의 크기는 무시할 만했다고 둡니다.",
       en: "The rates of decline t₂ and t₃ are the days a nova takes to fade by 2 and 3 magnitudes from maximum. Three empirical formulae for the peak absolute magnitude M₀ (V); colour excess E(B − V) = 0.184 ± 0.035 (Chochol et al. 2014) and R_V = 3.1 (no error). The emission peak of the P Cygni profile sits at the rest wavelength λ₀ = 6562.82 Å (in air), and the Doppler formula turns the wavelength λ of the blueshifted absorption into the shell's radial expansion velocity. Hα is excited in the outermost part of the spherically expanding shell, whose extent was negligible when the first spectrum was taken.",
       eq: ["(a) M₀ = −7.92 − 0.81 arctan[(1.32 − log t₂)/0.23]  (Della Valle & Livio 1995)", "(b) M₀ = −11.32 + 2.55 log t₂  (Downes & Duerbeck 2000)", "(c) M₀ = −11.99 + 2.54 log t₃  (Downes & Duerbeck 2000)", "σ = √[Σ(xᵢ − x̄)² / (n − 1)]"]},

    id: "D2", marks: 90, name: {ko: "세 번 가려지는 계층적 삼중성", en: "Triply eclipsing hierarchical triple"},
    lead: {ko: "HD 181068은 케플러 우주망원경의 약 4년 주 임무 동안 계속 관측된 가장 밝은 표적 가운데 하나입니다. 0.453일마다 ≈ 3–4 × 10⁻³등급 어두워지고(짝수 번째가 조금 얕음), 22.7일마다 0.007등급, 2.3일 동안의 어두워짐이 더 있었습니다. 헝가리 천문학자들은 이것이 거의 옆으로(edge-on) 보이는 조밀한 계층적 삼중성임을 밝혔습니다: B와 C가 P₁ = 0.9056768일의 식쌍성을 이루고, 그 질량 중심과 별 A가 P₂ = 45.4711일의 바깥 쌍성을 이룹니다. B, C는 서로를 가릴 뿐 아니라 A를 가리거나 반 바퀴 뒤 A에게 가려집니다.",
           en: "HD 181068 was one of the brightest targets observed continuously during the almost four-year primary mission of Kepler. It dims by ≈ 3–4 × 10⁻³ mag every 0.453 days (the even dimmings slightly shallower) and, in addition, by 0.007 mag for 2.3 days every 22.7 days. Hungarian astronomers showed it is a compact hierarchical triple seen almost edge-on: B and C form a P₁ = 0.9056768-day eclipsing binary, and their centre of mass with star A the P₂ = 45.4711-day outer binary. B and C eclipse not only each other but also star A, or half an outer revolution later are eclipsed by it."},
    maps: ["orb", "g2"],
    parts: [{h: {ko: "i. 식의 기하로 별의 크기 구하기 — 가정: 두 궤도 모두 정확한 원, 두 궤도면은 같고 정확히 옆에서 봄(i₁ = i₂ = 90°, i_rel = 0°). 바깥 식은 중심식이라 접촉이 넷이고, 접촉마다 A와 닿는 별이 B인지 C인지 압니다. 시각은 BJD.", en: "i. Stellar sizes from the geometry of the eclipses — assume both orbits exactly circular, the two orbital planes identical and seen exactly edge-on (i₁ = i₂ = 90°, i_rel = 0°). The outer eclipses are central, with four contacts, and for each contact we know whether B or C touches A. Times are BJD."},
       table: [["event no.", "contact", "stars", "BJD"], ...EV]},
      {id: "a", mk: "10", ko: "T₀₁ = 2455051.2361은 안쪽 쌍성의 내합(C가 B를 가림), T₀₂ = 2455522.7318은 바깥 쌍성의 내합(A가 B, C의 질량 중심을 가림) 시각입니다. φ₁(t) = {(t − T₀₁)/P₁}, φ₂(t) = {(t − T₀₂)/P₂}({x}는 소수 부분, 음수면 +1)를 표의 접촉마다 소수 넷째 자리까지 구하세요.",
       en: "T₀₁ = 2455051.2361 is an inferior conjunction of the inner binary (C eclipses B) and T₀₂ = 2455522.7318 one of the outer binary (A eclipses the centre of mass of B and C). Compute φ₁(t) = {(t − T₀₁)/P₁} and φ₂(t) = {(t − T₀₂)/P₂} ({x} the decimal part, +1 if negative) for each contact, to four decimals."},
      {id: "b", mk: "5", ko: "각 식에서 A와 근접 쌍성(B, C) 가운데 어느 쪽이 관측자에게 더 가까웠나요?", en: "For each eclipse, was star A or the close binary (B and C) closer to the observer?"},
      {id: "c", mk: "30", ko: "표로 (1) 세 별의 반지름을 바깥 궤도 긴반지름으로 나눈 R_A,B,C/a₂, (2) 두 궤도의 긴반지름 비 a₁/a₂, (3) B와 C의 질량비 q₁ = m_C/m_B를 구하세요. 소수 넷째 자리 이상으로 계산하세요. 시각의 정밀도가 한정되어 있어 이론적으로 가능한 접촉 조합을 모두 쓸 수는 없을 수 있습니다.",
       en: "From the table compute (1) the radii relative to the outer semi-major axis, R_A,B,C/a₂, (2) the ratio a₁/a₂ and (3) the mass ratio q₁ = m_C/m_B. Keep at least four decimals. With the limited accuracy of the times it may not be possible to use every theoretically possible combination of contacts."},
      {id: "d", mk: "8", ko: "이 결과로 바깥 질량비 q₂ = m_BC/m_A를 구하세요.", en: "From these results, compute the outer mass ratio q₂ = m_BC/m_A."},
      {h: {ko: "ii. 시선속도(RV)와 식 시각 변화(ETV)로 질량 구하기 — 지상 분광에서는 A의 선만 보입니다. RV 곡선: V_rad,A = V_γ + K_A sin φ_RV, φ_RV = (2π/P₂)[t − (2455522.7318 ± 0.0095)]. 근접 쌍성의 N번째 식 중심 시각: T_N = T₀ + P₁N + A_ETV sin(2πP₁N/P₂ + φ₀) (N이 정수면 C가 B를 가리는 주극소, 반정수면 부극소).", en: "ii. Masses from radial velocities (RV) and eclipse timing variations (ETV) — only star A's lines are seen. RV curve: V_rad,A = V_γ + K_A sin φ_RV, φ_RV = (2π/P₂)[t − (2455522.7318 ± 0.0095)]. Mid-times of the close pair's eclipses: T_N = T₀ + P₁N + A_ETV sin(2πP₁N/P₂ + φ₀) (integer N: primary, C eclipses B; half-integer: secondary)."},
       table: [["V_γ", "K_A", "P₂", "T₀", "P₁", "A_ETV", "φ₀"], ["6.993 ± 0.011 km/s", "37.195 ± 0.053 km/s", "45.4711 ± 0.0002 d", "2455051.23607 ± 5×10⁻⁵", "0.9056768 ± 3×10⁻⁷ d", "0.001446 ± 0.000110 d", "−0.76779 ± 0.01937 rad"]]},
      {id: "ii", mk: "22", ko: "ii의 결과만으로 (1) q₂ = m_BC/m_A, (2) m_A, (3) m_BC와 각각의 오차를 구하세요. 질량은 태양 질량, 거리는 태양 반지름이나 au로 나타내면 시간이 덜 듭니다.", en: "Using only part ii, find (1) q₂ = m_BC/m_A, (2) m_A and (3) m_BC with their errors. Masses in solar masses and separations in solar radii or au save time."},
      {h: {ko: "iii.", en: "iii."}},
