<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}

body{margin:0;background:#1e1e1e;color:var(--fg);

      if (slotE.click && L2.emit) { L2.hand = L2.emit; L2.emit = null; L2.msg = '방출 전극을 꺼냈습니다.'; }
      else if (L2.coll) { L2.hand = L2.coll; L2.coll = null; L2.msg = '수집 전극을 꺼냈습니다.'; } }
    /* side window: the length */
    HL.text(g, L2.coll ? 'C ' + L2.coll.nom + ' cm' : 'C —', vx + 40, vy + 280, '#cfd6dc', 11);
    HL.text(g, L2.emit ? 'E ' + L2.emit.nom + ' cm' : 'E —', vx + 150, vy + 280, '#cfd6dc', 11);
    /* pump and gauge, filament */
    L2.pump = HL.toggle(ui, 'pump', vx + 30, vy + 302, 30, 46, L2.pump, { label: 'PUMP', zoom: zv });
    HL.lcd(g, vx + 80, vy + 306, 120, 34, L2.p >= 100 ? (L2.p / 1000).toFixed(0) + ' kPa' : L2.p.toExponential(1) + ' Pa', { col: '#7fd3ff', glow: 'rgba(120,200,255,.35)', bg: '#0c141b', frame: '#22323f' });
    L2.fil = HL.toggle(ui, 'fil', vx + 226, vy + 302, 30, 46, L2.fil, { label: 'FILAMENT', zoom: zv, onCol: '#d98a2b' });
    HL.text(g, L2.msg, vx + 12, vy + 392, '#e8e8e8', 10.5);
    HL.text(g, L2.hand ? '손: ' + (L2.hand.kind === 'C' ? '관 ' : '막대 ') + L2.hand.nom + ' cm' + (L2.hand.kind === 'E' && L2.hand.len < 989 ? ' (잘림)' : '') : '손: 비어 있음', vx + 12, vy + 410, '#9aa3ab', 10.5);
    /* ---- the HV supply ---- */
    var hx = 710, hy = 10, hw = 280, hh = 300, zh = { x: hx, y: hy, w: hw, h: hh, title: '고전압 전원' };
    ui.hit('hvbox', { x: hx, y: hy, w: hw, h: hh }, { cursor: 'default', zoom: zh });
    HL.rr(g, hx, hy, hw, hh, 8, '#d7dadd', '#8d9399', 2);
    HL.text(g, 'HIGH VOLTAGE 0–2000 V', hx + 12, hy + 16, '#2a2d31', 11.5, 'left', '700');
    HL.lcd(g, hx + 20, hy + 32, hw - 40, 46, (Vtrue * (1 + L2.vGain)).toFixed(0) + ' V', { col: '#ff9d5c', glow: 'rgba(255,140,60,.35)', bg: '#1a120c', frame: '#3a2a1e' });
    L2.hv = HL.knob(ui, 'hv', hx + 80, hy + 150, 36, L2.hv, { min: 0, max: 2000, turns: 10, sens: 2000 / 2400, wheelStep: 10, label: 'COARSE', labelCol: '#2a2d31', zoom: zh });
    HL.rr(g, hx + 50, hy + 222, 60, 20, 3, '#222'); HL.text(g, (L2.hv / 200).toFixed(2), hx + 80, hy + 232, '#eee', 11, 'center', '700', HL.MONO);
    HL.text(g, '회전 다이얼', hx + 80, hy + 252, '#2a2d31', 9, 'center');
    L2.hvFine = HL.knob(ui, 'hvf', hx + 190, hy + 150, 24, L2.hvFine, { min: -10, max: 10, sens: 20 / 300, wheelStep: 0.5, label: 'FINE', labelCol: '#2a2d31', zoom: zh, marks: [[-10, '−'], [0], [10, '+']], markCol: '#2a2d31' });
    L2.out = HL.toggle(ui, 'hvon', hx + 222, hy + 222, 32, 46, L2.out, { label: 'HV ON', labelCol: '#2a2d31', zoom: zh });
    HL.circle(g, hx + 196, hy + 245, 7, L2.out ? '#ff5a3c' : '#5a2a22', '#222', 1);
    /* ---- the ammeter ---- */
    var ax = 710, ay = 320, aw = 280, ah = 200, za = { x: ax, y: ay, w: aw, h: ah, title: '전류계' };
    ui.hit('amm', { x: ax, y: ay, w: aw, h: ah }, { cursor: 'default', zoom: za });
    HL.rr(g, ax, ay, aw, ah, 8, '#2b2f35', '#111', 2);
    HL.text(g, 'AMMETER  auto-range  40 A max', ax + 12, ay + 16, '#cfd6dc', 11, 'left', '700');
    var shownA;
    if (L2.burnt) shownA = '----';
    else { var Ia = I * (1 + L2.aGain); var str = displayCurrent(Ia).split(' '), num = parseFloat(str[0]);
      var dig = str[0].indexOf('.') >= 0 ? str[0].length - str[0].indexOf('.') - 1 : 0, q1 = Math.pow(10, -dig);
      num = Math.max(0, num + (Math.abs(L2.flick) > 0.35 ? Math.sign(L2.flick) * q1 : 0)); shownA = (Ia === 0 ? '0.00' : num.toFixed(dig)) + ' ' + str[1]; }
    HL.lcd(g, ax + 20, ay + 34, aw - 40, 56, shownA, L2.burnt ? { col: '#ff6b5a', glow: 'rgba(255,80,60,.35)' } : {});
    var fuse = HL.button(ui, 'fuse', ax + 20, ay + 110, 120, 32, { label: 'FUSE 교체', col: '#555b62', size: 11, zoom: za });
    if (fuse.click) { if (L2.out) L2.msg = 'HV를 끄고 퓨즈를 바꾸세요.'; else if (L2.burnt) { L2.burnt = false; L2.msg = '퓨즈를 바꿨습니다.'; } }
    if (L2.burnt) HL.text(g, '퓨즈 끊어짐', ax + 160, ay + 126, '#ff8b7b', 11, 'left', '700');
  }
};
