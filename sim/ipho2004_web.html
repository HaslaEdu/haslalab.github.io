<title>IPhO 2004 — 역학 블랙박스 · Mechanical Black Box · HaslaLab</title>
<meta name="description" content="IPhO 2004 실험을 브라우저에서 실행합니다. 공과 두 용수철이 든 검은 원통을 열지 않고, 균형점과 저울, 회전대에서 떨어지는 추의 속력, 양 끝으로 매단 진자의 주기로 공의 질량과 두 용수철 상수를 구합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IPhO 2004 — 역학 블랙박스 · Mechanical Black Box">
<meta property="og:description" content="IPhO 2004 실험을 브라우저에서 실행합니다. 검은 원통 속 공의 질량과 용수철 상수를 잽니다.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (SI)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const G=9.8;
const TRUE={
  m:U(0.056,0.068),                              /* the ball's mass: what Part B is after */
  M:U(0.076,0.082),                              /* the tube with its caps */
  L:0.400+U(-0.0006,0.0006), dl:0.005, r:0.011,  /* the tube's length, the caps' plugs, the ball's radius */
  k:U(7.6,9.4), asym:U(0.20,0.32),               /* the two springs together (N/m) and how unequal they are */
  Istage:U(0.50e-3,0.62e-3),                     /* the rotation stage's own moment of inertia */
  R:U(0.01945,0.01965),                          /* the stub's radius where the string winds */
  mo:U(0.1000,0.1010), d:U(0.0260,0.0264),       /* the falling weight and its length */
  fs:U(0.23,0.29), fk:U(0.035,0.06),             /* static and sliding friction on the ball (N) */
  Io1:U(1.0,1.08) };                             /* the tube's own moment about its end, in units of M L²/3 */
/* the two springs: k = k1 + k2, l = (k2 − k1)/(k1 + k2) (L/2 − δ − r); k ∝ 1/N */
TRUE.k2=TRUE.k*(1+TRUE.asym)/2; TRUE.k1=TRUE.k-TRUE.k2;
const XEND=()=>TRUE.L/2-TRUE.dl-TRUE.r;
TRUE.l=(TRUE.k2-TRUE.k1)/TRUE.k*XEND();
/* the tube with caps alone: its moment about the rotation axis through its middle, and about an end */
TRUE.Itube=TRUE.M*TRUE.L*TRUE.L/12*U(1.02,1.08);
TRUE.Io=TRUE.M*TRUE.L*TRUE.L/3*TRUE.Io1;
/* where the tube balances (from its centre), towards the ball */
TRUE.lcm=TRUE.m*TRUE.l/(TRUE.m+TRUE.M);
/* ── Part B: the weight falls h from rest; the ball holds by friction, then slides out to the cap ── */
function rotEnergy(w,x){ const I=TRUE.Istage+TRUE.Itube+TRUE.m*(x*x+0.4*TRUE.r*TRUE.r); return 0.5*(TRUE.mo*TRUE.R*TRUE.R+I)*w*w+0.5*TRUE.k*(x-TRUE.l)*(x-TRUE.l); }
function slideX(w,x0){ const den=TRUE.k-TRUE.m*w*w; if(den<=0) return XEND(); return Math.max(x0,Math.min(XEND(),(TRUE.k*TRUE.l-TRUE.fk)/den)); }
/* the speed of the weight after falling h from rest (the ball starting at x0 near l) */
function speedAfter(h,x0,fs){ const E=TRUE.mo*G*h, ws=Math.sqrt(fs/(TRUE.m*x0)), Es=rotEnergy(ws,x0);
  if(E<=Es){ /* stuck */ const I=TRUE.Istage+TRUE.Itube+TRUE.m*(x0*x0+0.4*TRUE.r*TRUE.r); return Math.sqrt(2*(E-0.5*TRUE.k*(x0-TRUE.l)**2)/(TRUE.mo*TRUE.R*TRUE.R+I))*TRUE.R; }
  /* sliding: at ws the ball jumps outward; while the energy goes into moving it, the spin stays near ws */
  const Ej=rotEnergy(ws,slideX(ws,x0)); if(E<=Ej){ let a=x0,b=slideX(ws,x0); for(let i=0;i<50;i++){ const x=(a+b)/2; if(rotEnergy(ws,x)<E) a=x; else b=x; } return ws*TRUE.R; }
  let a=ws,b=60; for(let i=0;i<60;i++){ const w=(a+b)/2; if(rotEnergy(w,slideX(w,x0))<E) a=w; else b=w; } return (a+b)/2*TRUE.R; }
/* ── Part C: hung from the pins at one end, the ball pulled down by Δl = mg/k ── */
function pendPeriod(end){ const M=TRUE.M, m=TRUE.m, L=TRUE.L, dlx=Math.min(XEND()-(end===1?TRUE.l:-TRUE.l),m*G/TRUE.k), arm=L/2+(end===1?TRUE.l:-TRUE.l)+dlx;
  const tq=M*G*L/2+m*G*arm, I=TRUE.Io+m*(arm*arm+0.4*TRUE.r*TRUE.r); return 2*Math.PI*Math.sqrt(I/tq); }

    const top=ST.h1-F.h, bot=top-TRUE.d;   /* the edges' crossings, interpolated within the step */

  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;

    if(t){ if(k==="mbb"&&t==="usup"&&!ST.at.usup){ ST.at.mbb="fulcrum"; ST.on.add(k); ST.edge=0.20; say("onFulcrum"); hand=null; return; } if(mountOn(k,t)) hand=null; return; }
    const [x,y]=unP(p[0],p[1],1.5); if(!fits(k,x,y)){ say("noFit"); return; } ST.pos[k]={x,y}; ST.on.add(k); say("placed",itemName(k)); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(busy(k)){ say("busy",itemName(k)); return; } clearK(k); say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const k=(CLW-60)/42; setEdge(cdrag.v-(cmouse[0]-cdrag.x)/k/100*(e.shiftKey?0.1:1)); });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  if(h.k==="tube"){ cdrag={x:p[0],v:ST.edge}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k.startsWith("cal:")) calObj=h.k.slice(4); });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP

let rows=0;
function setEdge(v){ if(ST.at.mbb!=="fulcrum"){ say("needFulcrum"); return; } ST.edge=Math.max(0.05,Math.min(TRUE.L-0.05,Math.round(v*100000)/100000)); }
function setH1(dv){ if(ST.fall){ say("running"); return; } if(ST.at.weight!=="stage"){ say("needFor",itemName("weight")); return; } ST.h1=Math.max(TRUE.d+0.02,Math.min(0.74,Math.round((ST.h1+dv)*10000)/10000)); }
function setH2(dv){ if(ST.at.gate!=="stand"){ say("needFor",itemName("gate")); return; } ST.h2=Math.max(0.03,Math.min(0.6,Math.round((ST.h2+dv)*10000)/10000)); }
for(const [id,f,v] of [["h1m1",setH1,-0.01],["h1m01",setH1,-0.001],["h1p01",setH1,0.001],["h1p1",setH1,0.01],["h2m1",setH2,-0.01],["h2m01",setH2,-0.001],["h2p01",setH2,0.001],["h2p1",setH2,0.01],
  ["em1",v=>setEdge(ST.edge+v),-0.001],["em01",v=>setEdge(ST.edge+v),-0.0001],["ep01",v=>setEdge(ST.edge+v),0.0001],["ep1",v=>setEdge(ST.edge+v),0.001]]) $(id).onclick=()=>f(v);
$("relBtn").onclick=()=>{ if(!ready()){ say("notReady"); return; } if(ST.fall){ say("running"); return; } if(wTop()<=ST.h2+TRUE.d){ say("belowGate"); } startFall(); say("released"); };
$("pushBtn").onclick=()=>{ if(ST.at.mbb!=="usup"){ say("needHang"); return; } ST.pend.amp=U(0.035,0.06); ST.pend.ph=0; ST.pend.acc=0; say("pushed"); };
$("flipBtn").onclick=()=>{ if(ST.at.mbb!=="usup"){ say("needHang"); return; } ST.pend.end=3-ST.pend.end; ST.pend.amp=0; ST.pend.th=0; say("hung",ST.pend.end); };
$("pwrBtn").onclick=()=>{ if(!has("timer")){ say("needFor",itemName("timer")); return; } ST.timer.on=!ST.timer.on; ST.timer.show=null; };
$("gateBtn").onclick=()=>{ ST.timer.mode="gate"; ST.timer.show=null; }; $("perBtn").onclick=()=>{ ST.timer.mode="period"; ST.timer.show=null; };
$("delBtn").onclick=()=>{ ST.timer.delay=!ST.timer.delay; }; $("rstBtn").onclick=()=>{ ST.timer.show=null; };
$("balBtn").onclick=()=>{ if(!has("balance")){ say("needFor",itemName("balance")); return; } ST.bal.on=!ST.bal.on; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(), s=timerShow(); $("dT").textContent=s===null?"—":s+(ST.timer.mode==="gate"?" ms":" s");
  $("pwrBtn").className=ST.timer.on?"on":""; $("gateBtn").className=ST.timer.mode==="gate"?"on":""; $("perBtn").className=ST.timer.mode==="period"?"on":""; $("delBtn").className=ST.timer.delay?"on":"";
  const b=balanceShow(); $("dB").textContent=b===null?"—":b+" g"; $("balBtn").className=ST.bal.on?"on":"";
  $("relBtn").textContent=ST.fall?t.falling:t.release; $("hang").textContent=ST.at.mbb==="usup"?t.hangTxt(ST.pend.end):"—"; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-t","hT"],["tHint","tHint"],["t-h-b","hB"],["t-h-w","hW"],["wHint","wHint"],["t-h-p","hP"],["t-h-a","hA"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["pushBtn","push"],["flipBtn","flip"],["balBtn","balOn"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
