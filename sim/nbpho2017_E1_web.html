<script>
/* NBPhO 2017 problem 5 "Virtual mass" (Jaan Kalda) on the 3-D bench: a ball (d = 72.0 mm) fixed to a
   spring hangs from a stand; a jar of water can be slid under it; a stopwatch and a metre stick.

   The ball's motion is integrated directly: spring force, gravity, buoyancy of the part under water
   (spherical cap), added mass ½ρV of the part under water, and quadratic drag in water and air.  The
   water level rises by what the ball displaces.  The spring is closed-coil: it cannot be shorter than
   its free length, so lifting the ball by hand slackens it.  The mass of the ball and the spring
   constant differ a little from visit to visit (the official values give T₁ = 1.066 s, T₂ = 1.136 s,
   m ≈ 720 g, m_v ≈ 98 g). */
var PROGRAM = {
  title: { ko: 'NBPhO 2017 실험 5 — 가상 질량', en: 'NBPhO 2017 Problem 5 — Virtual mass' },
  subtitle: { ko: '용수철에 매단 공을 공기와 물 속에서 진동시켜, 물 속에서 공에 더해지는 질량(가상 질량) m_v 를 잽니다. 공의 지름 d = 72.0 mm.',
              en: 'Oscillate a ball on a spring in air and in water and find the mass m_v that the water adds to it (the virtual mass). The ball\'s diameter is d = 72.0 mm.' },
  notes: { ko: [
    '장비: 용수철에 고정된 공, 스탠드, 스톱워치, 자, 물이 든 용기 (문제지 그대로).',
    '공의 운동은 매 순간 직접 적분합니다 — 용수철 힘, 중력, 물에 잠긴 부분의 부력(구의 일부 부피), 잠긴 부분에 붙는 부가 질량 ½ρV, 물과 공기의 저항(속도의 제곱). 공이 잠기면 수면이 그만큼 올라갑니다.',
    '용수철은 감긴 코일이 서로 닿아 있는 인장 용수철이라 자연 길이보다 짧아지지 않습니다 — 손으로 공을 들어 올리면 용수철이 느슨해집니다.',
    '공의 질량과 용수철 상수는 방문할 때마다 조금씩 다릅니다. 공식 해답의 값은 T₁ = 1.066 s, T₂ = 1.136 s, m ≈ 720 g, m_v ≈ 98 g 입니다.',
    '불확도는 계산하지 않아도 되지만 방법과 결과의 정확도가 채점됩니다.'], en: [
    'Equipment: a ball fixed to a spring, a stand, a stopwatch, a ruler and a container of water (as on the sheet).',
    'The ball\'s motion is integrated directly: spring force, gravity, the buoyancy of the part under water (a spherical cap), the added mass ½ρV of that part, and quadratic drag in water and in air. The water level rises by what the ball displaces.',
    'The spring is closed-coil, so it cannot be shorter than its free length — lift the ball by hand and the spring goes slack.',
    'The ball\'s mass and the spring constant differ a little from visit to visit. The official solution has T₁ = 1.066 s, T₂ = 1.136 s, m ≈ 720 g, m_v ≈ 98 g.',
    'You need not compute uncertainties, but the accuracy of your methods and results is graded.'] }
};

var LAB = { yc: null, vy: 0, Hc: 82, tank: [-26, 8], snapped: false, ruler: [14, 9], sw: null, wasHeld: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드(팔에 용수철과 지름 72.0 mm 공이 매달려 있음), 물이 든 유리 용기, 1 m 자, 스톱워치. 공을 아래로 끌었다 놓으면 진동합니다. 팔의 높이를 바꿔 공을 용기 속 물에 담글 수 있습니다.',
           en: 'On the desk: a stand (its arm holds the spring with the 72.0 mm ball), a glass jar of water, a 1 m stick and a stopwatch. Pull the ball down and let go and it oscillates. Change the arm\'s height to put the ball into the water.' },
  howto: { ko: ['공: 위아래로 끌었다 놓기 (위로 끝까지 들면 용수철이 자연 길이로 오므라듭니다)',
                '스탠드의 팔(고정 클램프): 위아래로 끌거나 휠로 높이 바꾸기 (Shift+휠: 미세)',
                '물 용기: 책상 위로 끌어서 옮기기 — 공 바로 아래에 가까이 가면 가운데로 맞춰집니다. 공이 용기 테두리보다 낮으면 옮길 수 없습니다',
                '자: 끌어서 옮기기, 클릭하면 공 높이에서 옆으로 보기',
                '스톱워치: 클릭해서 가까이 본 뒤 버튼 누르기 · <b>Space</b> = START/STOP',
                '빈 곳 끌기: 돌려 보기 · 휠: 확대 · 더블클릭: 처음 시점'],
           en: ['Ball: drag it up or down and let go (lift it all the way and the spring closes to its free length)',
                'The stand\'s arm (boss clamp): drag up or down, or roll the wheel on it (Shift+wheel: fine)',
                'Water jar: drag it over the desk — near the spot under the ball it centres itself. It cannot be moved while the ball is below its rim',
                'Stick: drag to move it, click to look across at the ball\'s height',
                'Stopwatch: click to look closer, then press its buttons · <b>Space</b> = START/STOP',
                'Drag empty space: turn · wheel: zoom · double-click: first view'] },
  notePlaceholder: { ko: '예) 공기 중 20회: 21.32 s → T₁ = …\n자 눈금: 공 아래 끝 (공기) … cm, (물) … cm', en: 'e.g. 20 oscillations in air: 21.32 s → T₁ = …\nstick: ball bottom (air) … cm, (water) … cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var g = 9.81, rho = 1000, R = 3.6, Vb = 4 / 3 * Math.PI * Math.pow(R / 100, 3);       /* m³ */
    var m = 0.720 * (1 + S.sys('mass', 0.03)), k = 25.0 * (1 + S.sys('k', 0.035));
    var L0 = 9.0, HOOK = 1.0, RODX = 0, RODZ = -14, ARM = 18.4;
    var TR = 10, TH = 30, LEVEL0 = 22, BASE = 0.6, AIN = Math.PI * Math.pow(TR - 0.3, 2);  /* cm² */
    var sw = LAB.sw = new B3.Stopwatch(0.04);
    var hookXZ = [RODX, RODZ + ARM - 0.6];
    function hookY() { return LAB.Hc - 0.5; }
    function floorY() { return (LAB.snapped ? BASE : 0) + R; }
    function capV(h) { h = Math.max(0, Math.min(2 * R, h)); return Math.PI * h * h * (3 * R - h) / 3; }    /* cm³ */
    function surface(yc) { var s = BASE + LEVEL0; if (!LAB.snapped) return s;
      for (var i = 0; i < 3; i++) s = BASE + LEVEL0 + capV(s - (yc - R)) / AIN; return s; }
    if (LAB.yc === null) LAB.yc = hookY() - HOOK - R - L0 - m * g / k * 100;
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '], speeds: [1, 0.5, 0.25], wheelIds: ['clamp'],
      home: { yaw: -0.38, pitch: 0.3, k: 5.6, tx: 4, ty: 44, tz: 0 },
      views: {
        ruler: { yaw: 0, pitch: 0.02, k: 34, tx: 8, ty: 30, tz: 8, title: { ko: '자와 공 (옆에서)', en: 'The stick and the ball (from the side)' },
                 hint: { ko: '공의 위·아래 끝이 자의 몇 cm에 오는지 읽기 · 휠로 더 확대 · Esc: 돌아가기', en: 'Read where the top or bottom of the ball comes on the stick · wheel to zoom · Esc: back' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 32, ty: 1.7, tz: 15, title: { ko: '스톱워치', en: 'Stopwatch' } }
      },
      frame: function (b) {
        var dt = b.dt, i;
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-48, 58, -30, 30);
        /* the stand and its arm */
        B3.stand(RODX, RODZ, 100, { bw: 11, bd: 14 });
        var dc = b.screenMoved('clamp'), wc = b.wheel('clamp');
        var minH = (LAB.snapped ? BASE : 0) + 2 * R + HOOK + L0 + 1.0;
        if (dc[1] || wc) {
          var nh = Math.max(minH, Math.min(96, LAB.Hc - dc[1] / Math.max(0.3, Math.cos(B3.CAM.pitch)) + wc * 0.5));
          if (nh < LAB.Hc && hookY() - HOOK - L0 - R <= LAB.yc + 0.01 && nh <= minH + 0.01) b.say('공이 바닥에 닿았습니다.', 'The ball is on the bottom.');
          LAB.Hc = nh;
        }
        B3.clampArm(RODX, RODZ, LAB.Hc, ARM, { id: 'm:clamp' });
        /* the jar: slid by hand, centred under the ball when near */
        var mt = b.moved('tank'), ballXZ = hookXZ;
        if (mt[0] || mt[1]) {
          var below = LAB.yc - R < TH + 0.3;
          if (LAB.snapped && below) b.say('공이 용기 안에 있습니다 — 먼저 팔을 올리세요.', 'The ball is in the jar — raise the arm first.');
          else {
            var nx = LAB.tank[0] + mt[0], nz = LAB.tank[1] + mt[1];
            var free = LAB.free || (LAB.free = [LAB.tank[0], LAB.tank[1]]); free[0] = nx; free[1] = nz;
            var d = Math.hypot(free[0] - ballXZ[0], free[1] - ballXZ[1]), snap = d < 4.5;
            var hit = !snap && d < TR + R + 0.2 && below;
            var deskOK = free[0] > -46 && free[0] < 56 && free[1] > -28 + TR && free[1] < 28 - TR * 0.4;
            var stand = free[1] - TR < RODZ + 4 && Math.abs(free[0] - RODX) < 11 + TR;
            if (hit) b.say('공에 부딪힙니다 — 팔을 올려 공을 용기 테두리보다 높게 하세요.', 'It would hit the ball — raise the arm so the ball clears the rim.');
            else if (deskOK && !stand) { LAB.tank = snap ? [ballXZ[0], ballXZ[1]] : [free[0], free[1]]; LAB.snapped = snap; }
          }
        } else LAB.free = null;
        /* the ball: the hand, or the forces */
        var held = b.dragging('ball');
        var top = hookY() - HOOK - L0 - R;                                     /* the highest the ball can be: spring closed */
        if (held) {
          var sm = b.screenMoved('ball');
          LAB.yc = Math.max(floorY(), Math.min(top, LAB.yc - sm[1] / Math.max(0.3, Math.cos(B3.CAM.pitch))));
          LAB.vy = 0;
        } else if (dt > 0) {
          var n = Math.max(1, Math.ceil(dt / 0.0008)), h = dt / n;
          for (i = 0; i < n; i++) {
            var yc = LAB.yc, ext = (hookY() - HOOK - R - yc - L0) / 100;
            var s = surface(yc), Vs = capV(s - (yc - R)) * 1e-6, fs = Vs / Vb;
            var F = k * Math.max(0, ext) - m * g + rho * g * Vs;
            var v = LAB.vy / 100;
            F -= 0.5 * 0.5 * (rho * fs + 1.2) * Math.PI * Math.pow(R / 100, 2) * v * Math.abs(v) + 0.004 * v;
            var meff = m + 0.5 * rho * Vs;
            LAB.vy += F / meff * h * 100; LAB.yc += LAB.vy * h;
            if (LAB.yc > top) { LAB.yc = top; if (LAB.vy > 0) LAB.vy = 0; }
            if (LAB.yc < floorY()) { LAB.yc = floorY(); if (LAB.vy < 0) LAB.vy = -0.15 * LAB.vy; }
          }
        }
        if (LAB.wasHeld && !held) LAB.vy = 0;
        LAB.wasHeld = held;
        var bc = [hookXZ[0], LAB.yc, hookXZ[1]], ty = LAB.yc + R;
        B3.spring([hookXZ[0], hookY(), hookXZ[1]], [hookXZ[0], ty + HOOK, hookXZ[1]], 38, 0.9, '#a9b0b6', 1.4);
        B3.line3([hookXZ[0], ty + HOOK, hookXZ[1]], [hookXZ[0], ty, hookXZ[1]], '#8d949a', 2);
        B3.sphere3(bc, R, '#e2733a', { id: 'm:ball' });
        /* the jar of water and the stick */
        var lvl = surface(LAB.yc) - BASE;
        B3.vessel(LAB.tank[0], LAB.tank[1], TR, TH, lvl, { id: 'm:tank' });
        var mr = b.moved('ruler');
        if (mr[0] || mr[1]) { var rx = LAB.ruler[0] + mr[0], rz = LAB.ruler[1] + mr[1];
          var inTank = Math.hypot(rx - LAB.tank[0], rz - LAB.tank[1]) < TR + 3.2, inStand = rz < RODZ + 7 && Math.abs(rx - RODX) < 14;
          if (!inTank && !inStand && rx > -45 && rx < 55 && rz > -26 && rz < 27) LAB.ruler = [rx, rz]; }
        B3.meterStick(LAB.ruler[0], LAB.ruler[1], 100, 'm:ruler');
        B3.stopwatch(b, 'sw', [32, 15], sw);
        /* the close-up across the stick follows the ball */
        var V = b.views.ruler; V.tx = (LAB.ruler[0] + hookXZ[0]) / 2; V.ty = LAB.yc; V.tz = Math.max(LAB.ruler[1], hookXZ[1]);
        V.k = Math.max(14, Math.min(40, 600 / (Math.abs(LAB.ruler[0] - hookXZ[0]) + 14)));
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>

  <script src="simfull.js"></script>
