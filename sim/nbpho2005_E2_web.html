  title: { ko: 'NBPhO 2005 실험 9 — 역학 블랙박스', en: 'NBPhO 2005 Problem 9 — Mechanical black box' },
  subtitle: { ko: '원통형 “블랙박스” 속에 작은 무언가가 들어 있습니다. 그 질량과, 그것과 상자 안쪽 면 사이의 마찰 계수를 구하세요. 장비: 블랙박스, 자, 나무 판, 타이머, 저울.',
              en: 'There is something small inside the cylindrical “black box”. Find its mass and the coefficient of friction between it and the inner surface of the box. Equipment: the black box, a ruler, a wooden plank, a timer and scales.' },
  notes: { ko: [
    '공식 해답: 1) 물체를 상자 바닥 쪽(비탈 위)에 두고 상자를 판과 나란히 놓아 판을 기울이면, 물체가 미끄러져 뚜껑을 치는 각 α 에서 μ = tan α (≈ 0.17).',
    '2) 상자를 판에 가로로 눕혀(구를 수 있게) 다시 기울이면 각 β 에서 구르기 시작합니다. 물체가 작으면 M sin β = m(sin α − sin β) (M 은 빈 상자의 질량). 저울로 M + m 을 재면 m 이 나옵니다 (해답: 10.4 g, m ≈ 4.3 g, 실제 4.5 g).',
    '판은 왼쪽 끝이 책상에 걸치고 35 cm 떨어진 스탠드 팔에 얹혀 tan α = h/35 입니다. 해답의 작은 진동 주기 방법은 해답 스스로 부정확하다고 하여 넣지 않았습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Official solution: 1) with the object at the box\'s bottom (uphill) and the box along the plank, tilt the plank; the object slides and hits the cover at α with μ = tan α (≈ 0.17).',
    '2) Lay the box across the plank (so it can roll) and tilt again; it starts rolling at β. For a small object, M sin β = m(sin α − sin β) (M the empty box). The scales give M + m, hence m (the solution: 10.4 g, m ≈ 4.3 g, actually 4.5 g).',
    'The plank\'s left end rests on the desk and it lies on a stand\'s arm 35 cm away, so tan α = h/35. The solution\'s small-oscillation method, which it calls unreliable itself, is left out. The values differ a little from visit to visit.'] }
};

var LAB = { h: 1.5, mode: 'along', s: 24, v: 0, moving: false, fallen: false, thr: 0, rot: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 왼쪽 끝을 책상에 대고 35 cm 떨어진 스탠드 팔에 얹은 나무 판, 판 위의 원통 상자(뚜껑이 아래쪽), 디지털 저울, 판 앞의 자.',
           en: 'On the desk: the wooden plank with its left end on the desk, lying on a stand\'s arm 35 cm away, the cylindrical box on it (cover downhill), digital scales and a ruler in front of the plank.' },
  howto: { ko: ['스탠드 팔(집게) 위아래로 끌기: 판 기울이기 · 휠: 미세 조정 · 막대 클릭: 눈금 가까이',
                '상자 클릭: 판과 나란히 (물체는 바닥 쪽) → 판에 가로로 → 저울 위 → 다시 처음 (놓을 때마다 판을 낮추세요)'],
           en: ['Drag the stand\'s arm (clamp) up or down: tilt the plank · wheel: fine · click the rod: its scale closely',
                'Click the box: along the plank (object at its bottom) → across the plank → on the scales → back again (lower the plank before each try)'] },
  notePlaceholder: { ko: '예) 나란히: h = 6.0, 5.8, 6.2 cm; 가로: h = 2.5, 2.6 cm; 저울 10.4 g', en: 'e.g. along: h = 6.0, 5.8, 6.2 cm; across: h = 2.5, 2.6 cm; scales 10.4 g' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var mu = 0.17 * (1 + S.sys('mu', 0.1)), m = 4.5 * (1 + S.sys('m', 0.08)), M = 5.9 * (1 + S.sys('M', 0.04)), HX = -25, D = 35, Lp = 42, TH = 1.0, W = 8, r = 1.6, BL = 5.2;
    var rodScale = B3.scaleTex(30, { width: 1.2, bg: '#f2f2ee', step: 0.1 }), ruler = B3.scaleTex(40, { horiz: true, width: 2.6, bg: '#e9eef2', label: 'cm' });
    var lcd = document.createElement('canvas'); lcd.width = 200; lcd.height = 60; var lg = lcd.getContext('2d'), shown = '';
    function newThr() {
      var mi = mu * (1 + HL.gauss(0.05));
      LAB.thr = LAB.mode === 'along' ? mi : Math.tan(Math.asin(m * Math.sin(Math.atan(mi)) / (M + m) * (1 + HL.gauss(0.02))));
    }
    newThr();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['clamp'],
      home: { yaw: -0.25, pitch: 0.45, k: 11, tx: -2, ty: 8, tz: 0 },
      views: { rod: { yaw: 0, pitch: 0.05, k: 45, tx: HX + D, ty: 4, tz: -8, title: { ko: '스탠드 막대의 눈금', en: 'The rod\'s scale' } },
               scales: { yaw: 0, pitch: 1.0, k: 45, tx: 22, ty: 2, tz: 9, title: { ko: '저울', en: 'The scales' } } },
      frame: function (b) {
        var dc = b.screenMoved('clamp'), wc = b.wheel('clamp');
        if (dc[1] || wc) LAB.h = Math.max(1.0, Math.min(20, LAB.h - dc[1] / Math.max(0.3, Math.cos(B3.CAM.pitch)) + wc * 0.05));
        if (b.clicked('m:box')) {
          LAB.mode = LAB.mode === 'along' ? 'across' : LAB.mode === 'across' ? 'scale' : 'along';
          LAB.s = 24; LAB.v = 0; LAB.moving = false; LAB.fallen = false; LAB.rot = 0; newThr();
          b.say(LAB.mode === 'along' ? '판과 나란히 놓았습니다 (물체는 바닥 쪽).' : LAB.mode === 'across' ? '판에 가로로 눕혔습니다.' : '저울 위에 올렸습니다.',
                LAB.mode === 'along' ? 'Along the plank (object at the bottom).' : LAB.mode === 'across' ? 'Across the plank.' : 'On the scales.');
        }
        var al = Math.atan2(LAB.h, D), ta = LAB.h / D;
        if (LAB.mode !== 'scale' && !LAB.moving && !LAB.fallen && ta > LAB.thr) { LAB.moving = true; b.say(LAB.mode === 'along' ? '덜컥! 물체가 뚜껑을 쳤습니다.' : '상자가 구르기 시작합니다!', LAB.mode === 'along' ? 'Clack! The object hit the cover.' : 'The box starts rolling!'); }
        if (LAB.moving) { LAB.v += (LAB.mode === 'along' ? 400 : 250) * b.dt; LAB.s -= LAB.v * b.dt; LAB.rot += LAB.v * b.dt / r;
          if (LAB.s <= -3) { LAB.moving = false; LAB.fallen = true; } }
        var u = [Math.cos(al), Math.sin(al), 0], n = [-Math.sin(al), Math.cos(al), 0];
        var at = function (s, up, z) { return [HX + u[0] * s + n[0] * up, u[1] * s + n[1] * up, z || 0]; };
        B3.desk(-40, 40, -18, 20);
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [HX - 0.5, 0.02, 5.5], [41, 0, 0], [0, 0, 2.6]);
        B3.obox(at(Lp / 2, TH / 2), u, n, Lp / 2, TH / 2, W / 2, '#c9a878', { top: '#d8b888' });
        B3.box3(HX + D - 5, HX + D + 5, 0, 1.4, -18, -6, '#3b4048', { top: '#474c55' });
        B3.cyl3('y', 1.4, 30, HX + D, -10, 0.6, '#c3c8cd', { id: 'm:rod', seg: 14, cap: '#dde1e4' });
        B3.tex3(rodScale, 0, 0, rodScale.width, rodScale.height, [HX + D - 0.6, 31, -10 + 0.62], [1.2, 0, 0], [0, -32, 0], { id: 'm:rod' });
        B3.box3(HX + D - 1.2, HX + D + 1.2, LAB.h - 2.0, LAB.h + 0.4, -11.2, -8.8, '#3a3f46', { id: 'm:clamp', top: '#474c55' });
        B3.cyl3('z', -8.8, 5, HX + D, LAB.h - 0.4, 0.4, '#c3c8cd', { id: 'm:clamp', seg: 12, cap: '#dde1e4' });
        /* the digital scales */
        B3.box3(16, 28, 0, 1.6, 4, 14, '#2b2f35', { top: '#33373e' }); B3.cyl3('y', 1.6, 1.9, 22, 7.2, 3.4, '#c3c8cd', { seg: 28, cap: '#d6dade' });
        var rd = LAB.mode === 'scale' ? (M + m + HL.gauss(0.02)).toFixed(1) : '0.0';
        if (rd !== shown || b.t % 1 < b.dt) { shown = rd; lg.fillStyle = '#9fb59a'; lg.fillRect(0, 0, 200, 60); lg.fillStyle = '#18200f'; lg.font = '700 40px monospace'; lg.textAlign = 'right'; lg.fillText(rd + ' g', 190, 46); }
        B3.tex3(lcd, 0, 0, 200, 60, [18, 1.61, 11.3], [8, 0, 0], [0, 0, 2.2], { id: 'm:scales' });
        /* the box: a film-can-like cylinder, its cover a little wider */
        var col = '#1d1f22', cap = '#3a3d42';
        if (LAB.mode === 'scale') { B3.cylAB([22 - BL / 2, 1.9 + r, 7.2], [22 + BL / 2 - 0.6, 1.9 + r, 7.2], r, col, { seg: 22, id: 'm:box', cap: col });
          B3.cylAB([22 + BL / 2 - 0.6, 1.9 + r, 7.2], [22 + BL / 2, 1.9 + r, 7.2], r + 0.15, cap, { seg: 22, id: 'm:box', cap: cap }); }
        else if (LAB.fallen) { var fx = HX - 4; B3.cylAB([fx - BL / 2, r, 2], [fx + BL / 2 - 0.6, r, 2], r, col, { seg: 22, id: 'm:box', cap: col });
          B3.cylAB([fx + BL / 2 - 0.6, r, 2], [fx + BL / 2, r, 2], r + 0.15, cap, { seg: 22, id: 'm:box', cap: cap }); }
        else if (LAB.mode === 'along') { var c0 = at(LAB.s + BL / 2, TH + r), c1 = at(LAB.s - BL / 2 + 0.6, TH + r), c2 = at(LAB.s - BL / 2, TH + r);
          B3.cylAB(c0, c1, r, col, { seg: 22, id: 'm:box', cap: col }); B3.cylAB(c1, c2, r + 0.15, cap, { seg: 22, id: 'm:box', cap: cap }); }
        else { var cc = at(LAB.s, TH + r + 0.15); B3.cylAB([cc[0], cc[1], -BL / 2], [cc[0], cc[1], BL / 2 - 0.6], r, col, { seg: 22, id: 'm:box', cap: col });
          B3.cylAB([cc[0], cc[1], BL / 2 - 0.6], [cc[0], cc[1], BL / 2], r + 0.15, cap, { seg: 22, id: 'm:box', cap: cap });
          var ph = LAB.rot; B3.line3([cc[0], cc[1], BL / 2 + 0.01], [cc[0] + Math.cos(ph) * (r + 0.1), cc[1] + Math.sin(ph) * (r + 0.1), BL / 2 + 0.01], '#8a8f96', 2); }
        b.views.rod.ty = LAB.h;
        LAB.state = { h: LAB.h, tan: ta, thr: LAB.thr, mode: LAB.mode, moving: LAB.moving, fallen: LAB.fallen, mu: mu, m: m, M: M };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
