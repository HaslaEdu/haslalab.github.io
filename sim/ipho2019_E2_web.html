/* ── helpers ── */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
class RNG{
  constructor(seed){ this.r=mulberry32(seed>>>0); this._sp=null; }
  uniform(a,b){ return a+this.r()*(b-a); }
  gauss(mu,sd){
    if(this._sp!==null){ const v=this._sp; this._sp=null; return mu+sd*v; }
    let u=0,v=0; while(u===0)u=this.r(); while(v===0)v=this.r();
    const R=Math.sqrt(-2*Math.log(u));
    this._sp=R*Math.sin(2*Math.PI*v);
    return mu+sd*R*Math.cos(2*Math.PI*v);
  }
}
function thomas(a,b,c,dd){
  const n=dd.length, cp=new Float64Array(n), dp=new Float64Array(n);
  cp[0]=c[0]/b[0]; dp[0]=dd[0]/b[0];
  for(let i=1;i<n;i++){
    const m=b[i]-a[i]*cp[i-1];
    cp[i]= i<n-1 ? c[i]/m : 0;
    dp[i]=(dd[i]-a[i]*dp[i-1])/m;
  }
  const x=new Float64Array(n); x[n-1]=dp[n-1];
  for(let i=n-2;i>=0;i--) x[i]=dp[i]-cp[i]*x[i+1];
  return x;
}

/* ══════════════════════════════════════════════════════════════
   2.  PHYSICS  —  1-D transient conduction, backward Euler
   ══════════════════════════════════════════════════════════════ */
class Rod{
  constructor(segs,mass,T0){
    this.L=segs.reduce((s,g)=>s+g[0],0);
    const n=Math.round(this.L/0.001)+1; this.n=n; this.dx=this.L/(n-1);
    const edges=[]; let acc=0; for(const g of segs){ acc+=g[0]; edges.push(acc); }
    const k=new Float64Array(n), rho=new Float64Array(n), cp=new Float64Array(n);
    for(let i=0;i<n;i++){
      const xi=i*this.dx; let j=0;
      while(j<edges.length-1 && xi>edges[j]-1e-9) j++;
      k[i]=segs[j][1]; rho[i]=segs[j][2]; cp[i]=segs[j][3];
    }
    this.dxl=new Float64Array(n).fill(this.dx); this.dxl[0]*=0.5; this.dxl[n-1]*=0.5;
    this.C=new Float64Array(n);
    for(let i=0;i<n;i++) this.C[i]=this.dxl[i]*ROD_A*rho[i]*cp[i];
    if(mass){
      let tot=0; for(let i=0;i<n;i++) tot+=this.dxl[i]*ROD_A*rho[i];
      const f=mass/tot; for(let i=0;i<n;i++) this.C[i]*=f;
    }
    this.G=new Float64Array(n-1);
    for(let i=0;i<n-1;i++) this.G[i]=2*k[i]*k[i+1]/(k[i]+k[i+1])*ROD_A/this.dx;
    this.T=new Float64Array(n).fill(T0);
    this.heatN=Math.max(1,Math.floor(0.015/this.dx));
    this.a=new Float64Array(n); this.b=new Float64Array(n);
    this.c=new Float64Array(n); this.d=new Float64Array(n);
  }
  step(dt,P,attached,Tw,Tamb,U,Rc,endG){
    const n=this.n, a=this.a, b=this.b, c=this.c, dd=this.d;
    for(let i=0;i<n;i++){
      a[i]=0; c[i]=0;
      b[i]=this.C[i]/dt+U*this.dxl[i];
      dd[i]=this.C[i]/dt*this.T[i]+U*this.dxl[i]*Tamb;
    }
    for(let i=0;i<n-1;i++){
      b[i]+=this.G[i]; c[i]=-this.G[i]; b[i+1]+=this.G[i]; a[i+1]=-this.G[i];
    }
    if(P>0){
      let hs=0; for(let i=0;i<this.heatN;i++) hs+=this.dxl[i];
      for(let i=0;i<this.heatN;i++) dd[i]+=P*this.dxl[i]/hs;
    }
    if(attached){ b[n-1]+=1/Rc; dd[n-1]+=Tw/Rc; }
    else if(endG>0){ b[n-1]+=endG; dd[n-1]+=endG*Tamb; }
    this.T=thomas(a,b,c,dd);
    return attached ? (this.T[n-1]-Tw)/Rc : 0;
  }
  at(pos){
    const u=pos/this.dx, i=Math.floor(u);
    if(i>=this.n-1) return this.T[this.n-1];
    const f=u-i; return this.T[i]*(1-f)+this.T[i+1]*f;
  }
  mean(){ let s=0; for(let i=0;i<this.n;i++) s+=this.T[i]; return s/this.n; }
}

/* small dense solver (Gaussian elimination, partial pivoting) */
function gsolve(M,rhs){
  const n=rhs.length, A=M.map((r,i)=>r.concat([rhs[i]]));
  for(let col=0;col<n;col++){
    let p=col; for(let r=col+1;r<n;r++) if(Math.abs(A[r][col])>Math.abs(A[p][col])) p=r;
    if(Math.abs(A[p][col])<1e-14) return null;
    [A[col],A[p]]=[A[p],A[col]];
    const pv=A[col][col];
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const f=A[r][col]/pv; if(!f) continue;
      for(let cc=col;cc<=n;cc++) A[r][cc]-=f*A[col][cc];
    }
  }
  return A.map((r,i)=>r[n]/r[i]);
}

/* Terminals: PS+ PS- (9 V supply), H1a H2a / H1b H2b (heater leads of
   Rod #1 / Rod #2), A1 ACOM (ammeter 10A / COM), V1 VCOM (voltmeter V / COM).
   Modified nodal analysis gives the true reading of every instrument, so a
   wrong circuit gives a wrong but physical reading. */
const TERMS=["PS+","PS-","H1a","H2a","H1b","H2b","A1","ACOM","V1","VCOM"];
class Circuit{
  constructor(emf,rInt,rHeat){
    this.emf=emf; this.rInt=rInt; this.rHeat=rHeat;
    this.wires=[]; this.amm="OFF"; this.volt="OFF";
  }
  has(t1,t2){ return this.wires.findIndex(w=>(w[0]===t1&&w[1]===t2)||(w[0]===t2&&w[1]===t1)); }
  toggle(t1,t2){
    const i=this.has(t1,t2);
    if(i>=0){ this.wires.splice(i,1); return false; }
    this.wires.push([t1,t2]); return true;
  }
  rOf(kind){
    if(kind==="A"){
      if(this.amm==="10A") return 0.012;
      if(["200m","20m","2000u","200u"].includes(this.amm)) return 2.0;
      if(this.amm==="OFF") return null;
      return 1e7;
    }
    if(this.volt==="OFF") return null;
    if(this.volt==="10A") return 0.012;
    return 1e7;
  }
  solve(){
    const par={}; for(const t of TERMS) par[t]=t;
    const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
    for(const [a,b] of this.wires){ const ra=find(a), rb=find(b); if(ra!==rb) par[ra]=rb; }
    const nodes=[...new Set(TERMS.map(find))].sort();
    const idx={}; nodes.forEach((nd,i)=>idx[nd]=i);
    let nn=nodes.length;
    const comps=[[find("H1a"),find("H2a"),this.rHeat[0]],[find("H1b"),find("H2b"),this.rHeat[1]]];
    const ra=this.rOf("A"); if(ra!==null) comps.push([find("A1"),find("ACOM"),ra]);
    const rv=this.rOf("V"); if(rv!==null) comps.push([find("V1"),find("VCOM"),rv]);
    idx.PSX=nn; nn++;
    comps.push(["PSX",find("PS+"),this.rInt]);
    const size=nn+1;
    const M=[...Array(size)].map(()=>new Array(size).fill(0)), rhs=new Array(size).fill(0);
    for(const [a,b,R] of comps){
      const ia=idx[a], ib=idx[b], g=1/R;
      M[ia][ia]+=g; M[ib][ib]+=g; M[ia][ib]-=g; M[ib][ia]-=g;
    }
    for(let i=0;i<nn;i++) M[i][i]+=1e-9;     /* 1 nS leak: floating nodes stay solvable */
    const ip=idx.PSX, im=idx[find("PS-")];
    M[ip][nn]+=1; M[im][nn]-=1; M[nn][ip]+=1; M[nn][im]-=1; rhs[nn]=this.emf;
    for(let j=0;j<size;j++) M[im][j]=0;
    M[im][im]=1; rhs[im]=0;
    const sol=gsolve(M,rhs);
    if(!sol) return {P:[0,0],I:0,V:0,ok:false};
    const v=nd=>sol[idx[nd]];
    const vha=v(find("H1a"))-v(find("H2a")), vhb=v(find("H1b"))-v(find("H2b"));
    return {P:[vha*vha/this.rHeat[0], vhb*vhb/this.rHeat[1]],
            I: ra!==null ? (v(find("A1"))-v(find("ACOM")))/ra : 0,
            V: v(find("V1"))-v(find("VCOM")), ok:true};
  }
}

class Lab{
  constructor(seed){
    seed=(seed===undefined)?Math.floor(Math.random()*(1<<30)):seed;
    const rng=this.rng=new RNG(seed);
    this.T_amb=rng.uniform(22.4,23.1); this.T_water=this.T_amb;
    this.C_water=4.0*4186.0+900.0;
    this.U=rng.uniform(0.190,0.220); this.Rc=rng.uniform(0.55,0.72);
    this.k_cu=rng.uniform(378,392); this.k_br=rng.uniform(115,125); this.k_al=rng.uniform(230,242);
    const rh=rng.uniform(11.0,11.6);
    this.circ=new Circuit(rng.uniform(8.92,9.08),rng.uniform(1.45,1.75),[rh,rh*rng.uniform(0.985,1.015)]);
    this.sigma={Cu:rng.uniform(5.85e7,6.08e7), Al:rng.uniform(2.80e7,2.98e7), Br:rng.uniform(1.55e7,1.67e7)};
    this.rod={
      1:new Rod([[0.200,this.k_cu,...CU]],0.58,this.T_amb),
      2:new Rod([[0.088,this.k_cu,...CU],[0.050,this.k_br,...BRASS],
                 [0.050,this.k_al,...ALU],[0.065,this.k_cu,...CU]],null,this.T_amb)};
    this.off={1:[...Array(8)].map(()=>rng.gauss(0,0.16)), 2:[...Array(8)].map(()=>rng.gauss(0,0.16))};
    this.calib={1:null,2:null};             /* offsets learnt at calibration */
    this.water=0; this.lid=false;
    this.place={1:"tray",2:"tray"};         /* tray | hand | table | pot */
    this.cap={1:false,2:false};           /* one cap in the kit */
    this.capOnBench=false;                  /* the loose cap, not on a rod */
    this.cableBox=false; this.cableRod=0; this.adapter=false;
    this.on=new Set();                      /* instruments on the bench */
    this.t=0; this.watch=0; this.watchRun=false; this.hold=false; this.frozen=null;
    this.res=this.circ.solve();
  }
  fallTime(tube){ return TUBE_K[tube]*this.sigma[tube]*(1+this.rng.gauss(0,DROP_JITTER)); }
  rodPlaced(r){ return this.place[r]==="table"||this.place[r]==="pot"; }
  advance(seconds){
    const steps=Math.max(1,Math.round(seconds/1.0)), dt=seconds/steps;
    this.res=this.circ.solve();
    for(let s=0;s<steps;s++){
      for(const r of [1,2]){
        const P=(this.res.ok&&this.rodPlaced(r)) ? Math.max(0,this.res.P[r-1]) : 0;
        const att=this.place[r]==="pot";
        const eg=(att||this.cap[r])?0:END_G;
        const fl=this.rod[r].step(dt,P,att,this.T_water,this.T_amb,this.U,this.Rc,eg);
        this.T_water+=fl*dt/this.C_water;
      }
      this.T_water-=(this.T_water-this.T_amb)*dt*0.9/this.C_water;
    }
    this.t+=seconds;
    if(this.adapter&&(this.watchRun||this.cableRod)) this.watch+=seconds;
  }
  raw(r){
    const xs=r===1?ROD1_X:ROD2_X, ord=r===1?ROD1_ORDER:ROD2_ORDER;
    return ord.map((i,j)=>this.rod[r].at(xs[i])+this.off[r][j]);
  }
  readSensors(){
    const r=this.cableRod; if(!r) return null;
    const raw=this.raw(r), cal=this.calib[r];
    return raw.map((v,j)=>Math.round((v-(cal?cal[j]:0)+this.rng.gauss(0,0.010))*100)/100);
  }
  /* The box learns the spread of the eight sensors at the moment it is
     calibrated.  Done on a rod at one uniform temperature, that removes the
     offsets; done on a rod with a gradient, it bakes the gradient in. */
  calibrate(){
    const r=this.cableRod; if(!r) return;
    const raw=this.raw(r), m=raw.reduce((s,v)=>s+v,0)/8;
    this.calib[r]=raw.map(v=>v-m);
  }
  press(){
    if(!this.adapter||!this.on.has("box")) return;
    if(this.cableRod){ this.hold=!this.hold; if(this.hold) this.frozen=this.readSensors(); }
    else if(!this.watchRun&&this.watch===0) this.watchRun=true;
    else if(this.watchRun) this.watchRun=false;
    else this.watch=0;
  }
  meters(){
    const r=this.res; if(!r.ok) return [0,0];
    return [r.I+this.rng.gauss(0,0.004), r.V+this.rng.gauss(0,0.006)];
  }
}

function rrect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function fillR(x,y,w,h,r,fill,stroke,lw){

  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}

}
function vgrad(x,y,w,h,stops){
  const g=ctx.createLinearGradient(x,y,x,y+h);
  stops.forEach(([o,c])=>g.addColorStop(o,c)); return g;
}
function hgrad(x,y,w,h,stops){
  const g=ctx.createLinearGradient(x,y,x+w,y);
  stops.forEach(([o,c])=>g.addColorStop(o,c)); return g;
}
function wood(x0,y0,x1,y1){
  ctx.fillStyle=vgrad(x0,y0,0,y1-y0,[[0,"#d3bc98"],[1,C_TABLE2]]);
  ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.strokeStyle=C_WOODLN; ctx.lineWidth=1;
  let y=y0+18, n=0;
  while(y<y1){ ctx.beginPath(); ctx.moveTo(x0,y);
    for(let x=x0;x<=x1;x+=60) ctx.lineTo(x,y+Math.sin(x*0.013+n)*1.6);
    ctx.stroke(); y+=34+(n%3)*9; n++; }
}
function dashed(x,y,w,h,label){
  ctx.setLineDash([5,5]); ctx.strokeStyle=C_GHOST; ctx.lineWidth=1.3;
  rrect(x,y,w,h,6); ctx.stroke(); ctx.setLineDash([]);
  if(label) text(label,x+w/2,y+h/2,C_GHOST,11,"center");
}

function dmmText(m){
  const [i,v]=lab.meters(), c=lab.circ;

    const r=c.amm;
    if(r==="OFF") return "";
    if(r==="10A") return Math.abs(i).toFixed(2);
    if(["200m","20m","2000u","200u"].includes(r)) return Math.abs(i)>0.0005?"1   ":"0.00";
    return " 0.00";
  }
  const r=c.volt;
  if(r==="OFF") return "";
  if(r==="20") return v.toFixed(2);
  if(r==="200") return v.toFixed(1);
  if(r==="1000") return v.toFixed(0);
  if(["2000m","200m","200u"].includes(r)) return Math.abs(v)>0.2?"1   ":(v*1000).toFixed(1);
  if(r==="10A") return Math.abs(i).toFixed(2);
  return "";
}

function stepMagnet(dt){
  if(magnet.state==="in"){
    magnet.t+=dt;

      magnet.y=TUBE_BOT+4; magnet.vy=0.25; }

    magnet.vy+=dt*1600; magnet.y+=magnet.vy*dt;
    if(magnet.y>=TUBE_BOT+22){ magnet.y=TUBE_BOT+22; magnet.state="pad"; }

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const inR=(p,x,y,w,h,m)=>{ m=m||0; return p[0]>=x-m&&p[0]<=x+w+m&&p[1]>=y-m&&p[1]<=y+h+m; };
const near=(p,q,r)=>(p[0]-q[0])**2+(p[1]-q[1])**2<=r*r;

function hitTerm(p){
  for(const [t,q] of Object.entries(termXY())) if(termLive(t)&&near(p,q,13)) return t;
  return null;
}
function hitTray(p){ return null; }
function returnHand(){
  if(!hand) return;
  const k=hand.k;
  if(k==="rod1"||k==="rod2") lab.place[+k[3]]="tray";
  if(k==="cablePlug"){ lab.cableBox=false; lab.cableRod=0; lab.hold=false; }
  if(k==="magnet"){ magnet.state="pad"; magnet.x=1010; magnet.y=585; }
  if(k==="psu"||k==="amm"||k==="volt"){        /* back in the box: its leads come off */
    const ids=k==="psu"?["PS+","PS-"]:k==="amm"?["A1","ACOM"]:["V1","VCOM"];
    lab.circ.wires=lab.circ.wires.filter(w=>!ids.includes(w[0])&&!ids.includes(w[1])); lab.res=lab.circ.solve();
  }
  say("back",itemName(k==="cablePlug"?"cable":k));
  hand=null;
}
function pickRod(r){
  /* lifting a rod pulls its heater leads and the thermometer plug */
  const s=r===1?"a":"b", before=lab.circ.wires.length;
  lab.circ.wires=lab.circ.wires.filter(w=>!(w[0].endsWith(s)&&w[0].startsWith("H"))&&!(w[1].endsWith(s)&&w[1].startsWith("H")));
  if(lab.cableRod===r){ lab.cableRod=0; lab.hold=false; }
  lab.place[r]="hand"; hand={k:"rod"+r};
  if(lab.circ.wires.length!==before) say("rodWires"); else say("picked",itemName("rod"+r));
}

function benchClick(p,right){
  if(right){
    if(hand){ returnHand(); return; }
    /* right-click returns an instrument to the tray */
    for(const k of ["amm","volt","psu","adapter","box","pot"]){
      const s=SLOT[k]; if(!lab.on.has(k)||!inR(p,s.x,s.y,s.w,s.h)) continue;
      if(k==="pot"&&(onPot()||lab.water)){ say("needFirst"); return; }
      if(k==="box"&&lab.cableBox){ say("needFirst"); return; }
      lab.on.delete(k); if(k==="adapter") lab.adapter=false;
      if(k==="psu"||k==="amm"||k==="volt"){
        const ids=k==="psu"?["PS+","PS-"]:k==="amm"?["A1","ACOM"]:["V1","VCOM"];
        lab.circ.wires=lab.circ.wires.filter(w=>!ids.includes(w[0])&&!ids.includes(w[1]));
      }
      say("back",itemName(k)); return;
    }
    for(const r of [1,2]) if(lab.rodPlaced(r)&&rodHit(r,p)){ pickRod(r); returnHand(); return; }
    return;
  }
  /* ---- hand full : put it down ---- */
  if(hand){
    const k=hand.k;
    if(FREE.includes(k)){
      const at=spotFor(k,p);
      if(!at){ say("noFit"); return; }
      SLOT[k].x=at[0]; SLOT[k].y=at[1];
      lab.on.add(k); if(k==="adapter") lab.adapter=true; say("placed",itemName(k)); hand=null;
      return;
    }
    if(k==="water"){
      if(!lab.on.has("pot")){ say("needPot"); return; }
      if(!inR(p,SLOT.pot.x,SLOT.pot.y-30,SLOT.pot.w,SLOT.pot.h+30,20)){ say("noFit"); return; }
      if(lab.water>=2){ say("potFull"); return; }
      lab.water++; waterLeft--; hand=null;
      if(lab.water===2){ lab.lid=true; say("lidOn"); } else say("poured",lab.water);
      return;
    }
    if(k==="rod1"||k==="rod2"){
      const r=+k[3];
      if(lab.on.has("pot")&&inR(p,ROD_POT.x,ROD_POT.y,ROD_POT.w,ROD_POT.h+SLOT.pot.h,30)){
        if(onPot()){ say("rodBusy"); return; }
        if(!(lab.water===2&&lab.lid)){ say("needWater"); return; }
        if(lab.cap[r]){ lab.cap[r]=false; lab.capOnBench=true; }
        lab.place[r]="pot"; hand=null; say("screwed",r); return;
      }
      if(inR(p,SLOT.table.x,SLOT.table.y,SLOT.table.w,SLOT.table.h,40)){
        if(onTable()){ say("rodBusy"); return; }
        lab.place[r]="table"; hand=null; say("onTable",r); return;
      }
      say("noFit"); return;
    }
    if(k==="cap"){
      const rt=onTable(); const [cx,cy]=capXY();
      if(rt&&!lab.cap[rt]&&near(p,[cx,cy],44)){ lab.cap[rt]=true; hand=null; say("capOn"); return; }
      say("capNeedRod"); return;
    }
    if(k==="cable"){
      const [jx,jy]=BOX_JACK();
      if(lab.on.has("box")&&(near(p,[jx,jy],40)||inR(p,SLOT.box.x,SLOT.box.y,SLOT.box.w,SLOT.box.h))){
        lab.cableBox=true; hand={k:"cablePlug"}; say("cableBox"); return;
      }
      say("needBoxEnd"); return;
    }
    if(k==="cablePlug"){
      for(const r of [1,2]){ const s=socketXY(r);
        if(s&&near(p,s,30)){
          lab.cableRod=r; hand=null; lab.hold=false;
          if($("latch").checked&&lab.adapter){ lab.calibrate(); say("cableCal",r); } else say("cableRod",r);
          return; } }
      say("noFit"); return;
    }
    return;
  }
  /* ---- hand empty ---- */
  const k=hitTray(p);
  if(k){
    if(!trayAvail(k)) return;
    if(k==="rod1"||k==="rod2"){ lab.place[+k[3]]="hand"; }
    hand={k}; say("picked",itemName(k)); return;
  }
  if(lab.on.has("box")&&near(p,BOX_BTN(),16)) return;       /* handled on pointer down/up */
  const t=hitTerm(p);
  if(t){
    if(!selTerm){ selTerm=t; say("wirePick",TERM_NAME[t]); }
    else if(selTerm===t){ selTerm=null; }
    else { const on=lab.circ.toggle(selTerm,t); say(on?"wireOn":"wireOff",TERM_NAME[selTerm],TERM_NAME[t]); selTerm=null; }
    lab.res=lab.circ.solve(); return;
  }
  for(const m of ["amm","volt"]){
    if(lab.on.has(m)&&near(p,KNOB[m],36)){ turnKnob(m,1); return; }
  }
  if(lab.cableRod){ const s=socketXY(lab.cableRod);
    if(s&&near(p,s,16)){ lab.cableRod=0; lab.hold=false; hand={k:"cablePlug"}; say("cableOut"); return; } }
  if(lab.cableBox&&!lab.cableRod&&near(p,[BOX_JACK()[0]+60,BOX_JACK()[1]+80],18)){ hand={k:"cablePlug"}; return; }
  const rt=onTable();
  if(rt&&lab.cap[rt]&&near(p,capXY(),26)){ lab.cap[rt]=false; hand={k:"cap"}; say("capOff"); return; }
  if(lab.capOnBench&&inR(p,SLOT.table.x+SLOT.table.w+30,SLOT.table.y+60,34,40,8)){
    lab.capOnBench=false; hand={k:"cap"}; say("picked",itemName("cap")); return; }
  for(const r of [1,2]) if(lab.rodPlaced(r)&&rodHit(r,p)){ pickRod(r); return; }
  for(const k of ["amm","volt","psu","adapter","box","pot"]){
    const s=SLOT[k]; if(!lab.on.has(k)||!inR(p,s.x,s.y,s.w,s.h)) continue;
    if((k==="pot"&&(onPot()||lab.water))||(k==="box"&&lab.cableBox)){ say("needFirst"); return; }
    lab.on.delete(k); if(k==="adapter") lab.adapter=false;
    hand={k,move:true}; say("picked",itemName(k)); return;
  }
}
function rodHit(r,p){
  if(lab.place[r]==="table") return inR(p,SLOT.table.x,SLOT.table.y,SLOT.table.w,SLOT.table.h,4);
  if(lab.place[r]==="pot") return inR(p,ROD_POT.x,ROD_POT.y,ROD_POT.w,ROD_POT.h,4);
  return false;
}
function turnKnob(m,dir){
  const pos=m==="amm"?AMM_POS:VOLT_POS, c=lab.circ;
  const cur=m==="amm"?c.amm:c.volt, i=(pos.indexOf(cur)+dir+pos.length)%pos.length;
  if(m==="amm") c.amm=pos[i]; else c.volt=pos[i];
  lab.res=c.solve(); say("knob",itemName(m),pos[i]);
}
function tubesClick(p,right){
  if(right){ if(hand) returnHand(); return; }

    for(const tb of TUBES){
      if(inR(p,tb.x-30,TUBE_TOP-40,60,70)){

        hand=null; say("dropIn",d().tubeName[tb.k]); return;
      }
    }
    if(p[1]>TUBE_BOT&&p[1]<TUBE_BOT+60){ magnet.state="pad"; magnet.x=Math.max(220,Math.min(1100,p[0])); magnet.y=TUBE_BOT+22;
      hand=null; say("dropFloor"); return; }
    magnet.state="pad"; magnet.x=1010; magnet.y=585; hand=null; say("dropFloor"); return;
  }
  if(magnet.state==="in"){ if(inR(p,200,TUBE_TOP-40,560,TUBE_BOT-TUBE_TOP+40)) say("falling"); }
  if(magnet.state==="pad"&&near(p,[magnet.x,magnet.y],24)){ hand={k:"magnet"}; say("picked",d().magnet); return; }
}

    if(lab.hold) L.push([t.stHold,false]);
  }
  if(view==="bench") L.push([t.stCalNote,false]);
  if(msg.key&&performance.now()-msg.t<9000){
    const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]);
  }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
/* ══════════════════════════════════════════════════════════════
   10.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d();
  document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("tab-bench").textContent=t.tabBench; $("tab-tubes").textContent=t.tabTubes;
  $("t-tray").textContent=t.trayTitle; $("t-closecap").textContent=t.closeCap;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-box").textContent=t.hBox; $("redBtn").textContent=t.red; $("t-latch").textContent=t.latch;
  $("t-boxhint").textContent=t.boxHint;
  $("t-h-wire").textContent=t.hWire; $("t-wirehint").textContent=t.wireHint; $("unwire").textContent=t.unwire;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2019 E2 — 비데만–프란츠 법칙 · HaslaLab":"IPhO 2019 E2 — Wiedemann–Franz Law · HaslaLab";
  setView(view); renderStatus();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   11.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let tPrev=performance.now()/1000, uiTick=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const sp=(view==="tubes")?1:speed;
  lab.advance(dt*sp);
  stepMagnet(dt);
  if(view==="bench"){ ctx.clearRect(0,0,LW,LH); drawBench(); }
  else if(view==="tubes"){ ctx.clearRect(0,0,LW,LH); drawTubes(); }
  if(++uiTick%3===0) drawClose();
  if(uiTick%6===0){ renderStatus(); drawTrayCv(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
layout(); applyLang(); requestAnimationFrame(tick);
</script>
