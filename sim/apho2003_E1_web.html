<meta name="description" content="APhO 2003 실험 1을 브라우저에서 실행합니다. 50 Hz 강압 변압기에 축전기와 저항(680·1500·3300 Ω과 그 조합 17가지)을 직렬로 잇고, 디지털 전압계로 R 양단의 실효 전압을 재어 P–R 그래프의 최댓값과 1/RP–1/R² 직선에서 전기 용량 C를 구합니다.">

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (V, Ω, F, Hz)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const TRUE={
  C:U(1.70,2.30)*1e-6,                  /* the capacitor: what the student is after */
  emf:U(24.2,26.4),                     /* the transformer's open-circuit secondary, V rms */
  Rs:U(8,22),                           /* its winding resistance, Ω */
  f:50*U(0.998,1.002),                  /* the mains */
  Rnom:{A:680,B:1500,C:3300},           /* as marked: ±5 % */
  gain:U(0.996,1.004),                  /* the meter's ac calibration */
  wander:U(0.0015,0.0035) };            /* the mains drifts by this fraction over a minute */
TRUE.R={A:TRUE.Rnom.A*U(0.96,1.04), B:TRUE.Rnom.B*U(0.96,1.04), C:TRUE.Rnom.C*U(0.96,1.04)};
/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const PARTS=["board","dmm","leads"];
const TERMS=["D","E","A1","A2","B1","B2","C1","C2","VJ","COM"];
const ST={ on:new Set(), pos:{}, at:{},
  leads:[], pick:null,                  /* leads: [a,b] terminal pairs; pick: the first end being placed */
  power:false, range:"off", mains:1, disp:0, dispT:0 };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
/* nets of joined terminals */
function nets(){ const par={}; const f=a=>{ while(par[a]!==a) a=par[a]=par[par[a]]; return a; }; for(const t of TERMS) par[t]=t;
  for(const [a,b] of ST.leads) par[f(a)]=f(b); return f; }
/* complex arithmetic and a small linear solver */
const cx=(r,i)=>[r,i||0], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]], csub=(a,b)=>[a[0]-b[0],a[1]-b[1]], cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
      cdiv=(a,b)=>{ const m=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/m,(a[1]*b[0]-a[0]*b[1])/m]; }, cabs=a=>Math.hypot(a[0],a[1]);
function csolve(A,b){ const n=b.length; for(let i=0;i<n;i++){ let p=i; for(let r=i+1;r<n;r++) if(cabs(A[r][i])>cabs(A[p][i])) p=r; [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    for(let r=i+1;r<n;r++){ const k=cdiv(A[r][i],A[i][i]); for(let c=i;c<n;c++) A[r][c]=csub(A[r][c],cmul(k,A[i][c])); b[r]=csub(b[r],cmul(k,b[i])); } }
  const x=new Array(n); for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s=csub(s,cmul(A[i][c],x[c])); x[i]=cdiv(s,A[i][i]); } return x; }
/* the whole board as admittances between nets; the source (behind its winding resistance) drives the capacitor's far end */
function solve(){ const f=nets(), w=2*Math.PI*TRUE.f, gnd=f("E");
  const el=[["S","D",cx(0,w*TRUE.C)]];                                             /* the capacitor: S is its inner end, wired to the transformer */
  for(const k of ["A","B","C"]) el.push([f(k+"1"),f(k+"2"),cx(1/TRUE.R[k])]);
  if(has("dmm")&&ST.range!=="off") el.push([f("VJ"),f("COM"),cx(1e-7,w*100e-12)]);   /* the meter's 10 MΩ ∥ 100 pF */
  el[0][1]=f("D");
  const names=[...new Set(el.flatMap(e=>[e[0],e[1]]))].filter(n=>n!==gnd), idx={}; names.forEach((n,i)=>idx[n]=i);
  const N=names.length, A=Array.from({length:N},()=>Array.from({length:N},()=>cx(1e-12))), b=Array.from({length:N},()=>cx(0));
  for(let i=0;i<N;i++) A[i][i]=cx(1e-9);

/* ══════════════════════════════════════════════════════════════
   4.  DRAWING HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;

function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function vgrad(y,h,stops){ const g=ctx.createLinearGradient(0,y,0,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function ell(x,y,rx,ry,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }

    c.font='11px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle"; c.fillStyle=av?"#e8eef2":"#868e96";
    c.fillText(itemName(k),44,y+12); c.font='9px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a"; c.fillText(av?t.trayTake:t.trayOut,44,y+25);
    trayCells.push([k,y,y+TROW-3]); y+=TROW; }
  c.font='10.5px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a"; t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14)); }
function setTab(k){ if(k!==tab&&window.HLzoom) HLzoom(closeCv); tab=k; renderTabs(); $("t-closecap").textContent=d().closeCap[tab]; }
function renderTabs(){ const box=$("tabs"); box.innerHTML=""; for(const k of ["wire"]){ const b=document.createElement("button"); b.textContent=d().tabs[k]; b.className=k===tab?"on":""; b.onclick=()=>setTab(k); box.appendChild(b); } }
const hitAdd=(k,x,y,w,h)=>HIT.push({k,x,y,w,h});
/* ── the board from above with the meter beside it: click two terminals to join them with a lead ── */
const TPOS={};
function geo(){ const W=CLW, H=CLH, bw=W*0.62, bh=H*0.80, bx=W*0.02, by=H*0.08, s=Math.min(bw/38,bh/18);
  const BX=u=>bx+bw/2+(u-1)*s, BY=v=>by+bh/2+(v-0.5)*s;
  for(const t in BT) TPOS[t]=[BX(BT[t][0]),BY(BT[t][1])];
  const mx=W*0.82, my=H*0.47, ms=Math.min(W*0.30/9.5,H*0.86/17.5);
  TPOS.COM=[mx-2.2*ms,my+6.6*ms]; TPOS.VJ=[mx+2.2*ms,my+6.6*ms];
  return {BX,BY,s,bx,by,bw,bh,mx,my,ms}; }
function drawWire(){ const t=d(); ctx.fillStyle="#e9e7e0"; ctx.fillRect(0,0,CLW,CLH);
  const g=geo(), {BX,BY,s,mx,my,ms}=g;
  if(has("board")){
    fillR(BX(-18),BY(-8.5),38*s,18*s,6,"#caa06c","#8a6a40",1.5);
    ctx.strokeStyle="#3b2f22"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(BX(-9),BY(-5.5)); ctx.lineTo(BX(-7.6),BY(-5.5)); ctx.moveTo(BX(-2.4),BY(-5.5)); ctx.lineTo(BX(3),BY(-5.5)); ctx.lineTo(BX(3),BY(-1.5));
    ctx.moveTo(BX(-9),BY(-2)); ctx.lineTo(BX(-6),BY(-2)); ctx.lineTo(BX(-6),BY(6.2)); ctx.lineTo(BX(3),BY(6.2)); ctx.stroke(); ctx.lineWidth=1;
    fillR(BX(-15.7),BY(-6.1),6.4*s,5.2*s,3,"#4a4d52","#2a2d33"); fillR(BX(-15.7),BY(-6.5),6.4*s,1.2*s,2,"#b0442a"); text("220V/24V",BX(-12.5),BY(-3),"#e8eef2",Math.max(9,s*0.6),"center","700");
    fillR(BX(-7.6),BY(-7.1),5.2*s,3.2*s,s*1.4,"#9aa3ab","#6b7177"); text("C",BX(-5),BY(-5.5),"#2a2d33",Math.max(10,s*1.0),"center","700");
    /* the mains switch: click it */
    fillR(BX(-13.9),BY(3.4),2.8*s,2.2*s,3,"#1f2226"); fillR(BX(-13.9)+(ST.power?1.4*s:0),BY(3.6),1.4*s,1.8*s,2,ST.power?"#c0392b":"#7a2a22"); circ(BX(-9.5),BY(4.5),0.5*s,ST.power?"#ff5a3a":"#5a2a22","#222");
    text("POWER",BX(-12.5),BY(6.8),"#2a1d10",Math.max(9,s*0.55),"center","700"); hitAdd("power",BX(-14.2),BY(3.0),3.4*s,3*s);
    for(const k of ["C","B","A"]){ const p=TPOS[k+"1"], q=TPOS[k+"2"]; ctx.strokeStyle="#9aa0a6"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); ctx.lineWidth=1;
      fillR(p[0]-0.55*s,BY(-1.6),1.1*s,3.6*s,0.5*s,"#d9c9a0","#9a8a60"); text("R"+k,p[0],BY(7.8),"#2a1d10",Math.max(10,s*0.75),"center","700"); }
    text(t.lab.nom,BX(12.5),BY(-7.5),"#2a1d10",Math.max(9,s*0.5),"center");
    text("D",BX(1.6),BY(-1.5),"#2a1d10",Math.max(10,s*0.9),"center","700"); text("E",BX(1.6),BY(6.2),"#2a1d10",Math.max(10,s*0.9),"center","700"); }
  else text(t.lab.noBoard,CLW*0.33,CLH/2,"#69717a",12.5,"center");
  if(has("dmm")) drawMeterFace(mx,my,ms); else text(t.lab.noDmm,CLW*0.82,CLH/2,"#69717a",12,"center");
  /* terminals */
  for(const tm of TERMS){ if(BT[tm]&&!has("board")||!BT[tm]&&!has("dmm")) continue; const p=TPOS[tm], col=tm==="D"||tm==="VJ"?"#c0392b":tm==="E"||tm==="COM"?"#1f2226":"#d4b25a";
    circ(p[0],p[1],8,col,"#111",1); circ(p[0],p[1],3,"#ddd");
    if(ST.pick===tm){ ctx.strokeStyle="#ffcf3a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p[0],p[1],12,0,7); ctx.stroke(); ctx.lineWidth=1; }
    hitAdd("t:"+tm,p[0]-11,p[1]-11,22,22); }
  /* leads, each with a handle to unplug it */
  ST.leads.forEach(([a,b],i)=>{ const p=TPOS[a], q=TPOS[b]; if(!p||!q) return; const mx2=(p[0]+q[0])/2, my2=Math.max(p[1],q[1])+30+i*4; ctx.strokeStyle=LCOL[i%LCOL.length]; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(mx2,my2,q[0],q[1]); ctx.stroke(); ctx.lineWidth=1; const hx=0.25*p[0]+0.5*mx2+0.25*q[0], hy=0.25*p[1]+0.5*my2+0.25*q[1];
    circ(hx,hy,5,"#fff",LCOL[i%LCOL.length],2); hitAdd("l:"+i,hx-7,hy-7,14,14); });
  if(ST.pick){ const p=TPOS[ST.pick]; ctx.setLineDash([4,4]); ctx.strokeStyle="#888"; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(cmouse[0],cmouse[1]); ctx.stroke(); ctx.setLineDash([]); }
  text(t.lab.wireHint,10,CLH-10,"#555",11,"left"); }
/* the meter's face: display, rotary switch with its ranges (click a range), the two jacks */
function drawMeterFace(mx,my,ms){ const t=d();
  fillR(mx-4.75*ms,my-8.75*ms,9.5*ms,17.5*ms,ms*0.9,"#e3b72d","#8a6d12",1.5); fillR(mx-4.2*ms,my-8.2*ms,8.4*ms,16.4*ms,ms*0.6,"#2a2d33");
  fillR(mx-3.6*ms,my-6.5*ms,7.2*ms,3.8*ms,ms*0.3,"#9fae8f","#5f6b52"); const s=dmmShow();
  if(s!==null){ const h=1.7*ms; lcd(s,mx-3.3*ms,my-5.4*ms,6.5*ms,h,"#1b1d20","rgba(0,0,0,.04)"); text(ST.range[0]==="a"?"AC":ST.range[0]==="d"?"DC":"Ω",mx-3.2*ms,my-6.0*ms,"#1b1d20",Math.max(8,ms*0.55),"left","700"); }
  const cx0=mx, cy0=my+1.2*ms, R=2.3*ms; circ(cx0,cy0,R,"#1b1d20","#000",1); circ(cx0,cy0,R*0.75,"#33363a");
  const a=DIAL[ST.range]; ctx.strokeStyle="#e8eef2"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx0,cy0); ctx.lineTo(cx0+R*0.95*Math.cos(a),cy0-R*0.95*Math.sin(a)); ctx.stroke(); ctx.lineWidth=1;
  const lbl={off:"OFF",a750:"750",a200:"200",a20:"20",a2:"2",d20:"V⎓ 20",o2k:"Ω 2k"};
  for(const k in DIAL){ const q=DIAL[k], x=cx0+R*1.45*Math.cos(q), y=cy0-R*1.45*Math.sin(q); text(lbl[k],x,y,ST.range===k?"#ffcf3a":"#e8eef2",Math.max(9,ms*0.55),"center","700"); hitAdd("rng:"+k,x-ms*0.9,y-ms*0.55,ms*1.8,ms*1.1); }
  text("V~",cx0-R*1.75,cy0+R*0.55,"#e8eef2",Math.max(9,ms*0.6),"center","700");
  text("COM",TPOS.COM[0],TPOS.COM[1]-ms*1.1,"#e8eef2",Math.max(9,ms*0.5),"center"); text("VΩ",TPOS.VJ[0],TPOS.VJ[1]-ms*1.1,"#e8eef2",Math.max(9,ms*0.5),"center"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ drawWire(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   5.  HANDS: the bench and the wiring close-up
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ const id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),1))||null; }
const wired=k=>ST.leads.some(([a,b])=>[a,b].some(t=>k==="board"?!!BT[t]:k==="dmm"?(t==="VJ"||t==="COM"):false));
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
function takeUp(k){ if(wired(k)){ say("unplugFirst"); return false; } if(k==="leads"&&ST.leads.length){ say("unplugAll"); return false; }
  const b=baseOf(k); hand={item:k,move:true,orig:{x:b.x,y:b.y}}; ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
function drop(k,x,y){ ST.pos[k]={x,y}; ST.on.add(k); say("placed",itemName(k)); }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(wired(k)||(k==="leads"&&ST.leads.length)){ say("unplugFirst"); return; } if(k==="board") ST.power=false; if(k==="dmm") ST.range="off";
    ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the wiring close-up: click a terminal, then another, to join them with a lead; click a lead's handle to unplug it */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button===2){ ST.pick=null; return; } if(e.button!==0) return;
  if(!h){ ST.pick=null; return; }
  if(h.k==="power"){ togglePower(); return; }
  if(h.k.startsWith("rng:")){ setRange(h.k.slice(4)); return; }
  if(h.k.startsWith("l:")){ const i=+h.k.slice(2); ST.leads.splice(i,1); say("unplugged"); return; }
  if(h.k.startsWith("t:")){ const t=h.k.slice(2);
    if(!has("leads")){ say("needFor",itemName("leads")); ST.pick=null; return; }
    if(!ST.pick){ ST.pick=t; return; } if(ST.pick===t){ ST.pick=null; return; }
    if(ST.leads.length>=10){ say("noLeads"); ST.pick=null; return; } if(ST.leads.some(([a,b])=>(a===ST.pick&&b===t)||(a===t&&b===ST.pick))){ ST.pick=null; return; }
    ST.leads.push([ST.pick,t]); say("joined",ST.pick,t); ST.pick=null; } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function togglePower(){ if(!has("board")){ say("needFor",itemName("board")); return; } ST.power=!ST.power; say(ST.power?"powerOn":"powerOff"); }
function setRange(k){ if(!has("dmm")){ say("needFor",itemName("dmm")); return; } ST.range=k; ST.dispT=0; if(k[0]==="d"||k[0]==="o") say("wrongMode"); else say("range"); }
$("pwrBtn").onclick=togglePower;
for(const k of ["off","a2","a20","a200","a750"]) $("rg_"+k).onclick=()=>setRange(k);
/* the display settles a few times a second, with a count of jitter */
function updDisp(dt){ ST.dispT-=dt; if(ST.dispT>0) return; ST.dispT=0.4; const r=meterRaw(); if(r===null||isNaN(r)) return;
  const R=RANGES[ST.range], lsd=R===2?0.001:R===20?0.01:R===200?0.1:1; ST.disp=Math.max(0,r+(Math.random()-0.5)*1.6*lsd); }
$("noteBtn").onclick=()=>{ rows++; const s=dmmShow(), n=$("note"), c=$("cfg").value.trim()||"?", line=rows+")  "+c+"   V = "+(s===null?"—":s.replace("1   ","OL"))+" V";
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(), s=dmmShow(); $("dV").textContent=s===null?"":s.replace("1   ","1 .  ").trim()+(ST.range[0]==="a"?" V~":""); $("pwrBtn").textContent=ST.power?t.pwrOff:t.pwrOn;
  for(const k of ["off","a2","a20","a200","a750"]) $("rg_"+k).className=ST.range===k?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(ST.pick),false]);
  if(has("dmm")&&(ST.range[0]==="d"||ST.range[0]==="o")) L.push([t.st.mode,true]);
  if(has("dmm")&&ST.range[0]==="a"&&dmmShow()==="1   ") L.push([t.st.over,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-pwr","hPwr"],["pwrHint","pwrHint"],["t-h-vm","hVm"],["vmHint","vmHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["cfgLbl","cfgLbl"]]) $(id).textContent=t[k];
  $("rg_off").textContent=t.off; $("cfg").placeholder=t.cfgPh;
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt); updDisp(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose(); ++frameN;
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
