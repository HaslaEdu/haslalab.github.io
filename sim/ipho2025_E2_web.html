   1.  RANDOM AND PHYSICS  (the same kit as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2025e2)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const G=9.81, RHO_0=1.2, CX=1.0;
const BTYPE=[{n:1,d:2.0,m:0.033},{n:2,d:5.0,m:0.51},{n:3,d:9.0,m:3.0},{n:4,d:16.0,m:17.0}];   /* mm, g */
const BALL=[0,0,0,1,2,3];                     /* the six balls: three #1, one #2, one #3, one #4 */
const KIT={c:0.0695*(1+0.015*gauss()), mu:0.500+0.020*gauss()};
function impactV2(d,m,h){ const vt2=8*m*G/(Math.PI*d*d*RHO_0*CX); return vt2*(1-Math.exp(-2*G*h/vt2)); }
function crater(i,hcm,levelled,shots){
  const b=BTYPE[BALL[i]], d=b.d/1000, m=b.m/1000, h=hcm/100;
  const E=0.5*m*impactV2(d,m,h);
  let D=KIT.c*Math.pow(E,0.25)*Math.max(0.82,1-0.05*shots);
  D*=1+0.045*gauss(); if(!levelled) D*=1+0.08*gauss();
  return D*1000;                                  /* mm */
}

function sideA(){

  ctx.fillStyle="#f6f5f1"; ctx.beginPath(); ctx.moveTo(X(-10),Z(0.4)); ctx.quadraticCurveTo(X(0),Z(-17),X(10),Z(0.4)); ctx.fill(); ctx.strokeStyle="#bfc3c7"; ctx.lineWidth=1.2; ctx.stroke();

function drawBench(){

  for(const k of ["box","track","bowl","balls","stand","rail"]) if(ST.on[k]) DRAW[k]();
  if(hand){ const c=cm(mouse);
    if(PLACE.includes(hand.k)){ const keep=ST.pos[hand.k], kon=ST.on[hand.k]; ST.pos[hand.k]=snapPos(hand.k,{x:c[0],y:c[1]}); ST.on[hand.k]=true;
      ctx.globalAlpha=overlap(hand.k,ST.pos[hand.k])?0.35:0.7; DRAW[hand.k](); ctx.globalAlpha=1; ST.pos[hand.k]=keep; ST.on[hand.k]=kon; }
    else if(hand.k==="ball") ballTop(mouse[0],mouse[1],hand.i);

/* the rail is laid against the end of the track when it is put down close to it */

const trayCv=$("tray"), trayCtx=trayCv.getContext("2d"), closeCv=$("closeCv"), closeCtx=closeCv.getContext("2d"), benchCtx=ctx;
const TRAY_LIST=["box","bowl","bottle","balls","tape","stand","sieve","rail","brush","track","putty","funnel","spoon","ruler"], TROW=44;
let TRW=190, TRH=600, CLW=900, CLH=300, trayCells=[];
const trayAvail=k=>TOOLS.includes(k)? !(hand&&hand.k===k) : !ST.on[k]&&!(hand&&hand.k===k);
function layout(){
  const w=cv.clientWidth||1000, dpr=Math.min(window.devicePixelRatio||1,2);
  S=w/LW; cv.width=Math.round(w*dpr); cv.height=Math.round(LH*S*dpr); cv.style.height=(LH*S)+"px";
  benchCtx.setTransform(dpr*S,0,0,dpr*S,0,0);
  const tdpr=window.devicePixelRatio||1, tr=trayCv.parentElement.getBoundingClientRect();
  TRW=Math.max(150,Math.floor(tr.width-16)); TRH=TRAY_LIST.length*TROW+50;
  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  CLW=Math.max(300,Math.floor(closeCv.parentElement.getBoundingClientRect().width-20)); CLH=Math.round(CLW*0.42);
  closeCv.style.height=CLH+"px"; closeCv.width=Math.round(CLW*tdpr); closeCv.height=Math.round(CLH*tdpr);
  const h=CLH-16, w1=Math.round((CLW-24)*0.58); P1={x:8,y:8,w:w1,h}; P2={x:16+w1,y:8,w:CLW-24-w1,h};

function drawTray(){

  trayCells=[]; let y=6; const wd=TRW-12;

    const av=trayAvail(k), sel=hand&&hand.k===k;
    c.fillStyle=av?"#1f242b":"#171a1e"; c.fillRect(6,y,wd,TROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TROW-5);
    const old=ctx; ctx=c; ctx.save(); ctx.globalAlpha=av?1:0.35; icon(k,28,y+(TROW-4)/2,0.62); ctx.restore(); ctx=old;
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=av?"#e8eef2":"#868e96"; c.fillText(itemName(k),52,y+13);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a";
    c.fillText(TOOLS.includes(k)?(av?t.trayTool:t.trayOut):(av?t.trayTake:t.trayOut),52,y+29);

  }
  c.font='10.5px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";

}

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const cm=p=>[p[0]/PX,p[1]/PX];
const busy=()=>!!(ST.fall||ST.roll);
function ballHome(i){ ST.inBox[i]=true; }
function railBallXY(){ const g=railGeom(); return [railLow()[0]-ST.s*Math.cos(g.th),ST.pos.rail.y]; }
function returnItem(k){
  ST.on[k]=false;
  if(k==="bowl"){ if(ST.bowl.ball!==null) ballHome(ST.bowl.ball); ST.bowl={...ST.bowl,state:"empty",shots:0,D:null,ball:null,lost:false,ruler:false}; ST.tapeA=false; }
  if(k==="stand"&&ST.held){ ballHome(ST.held.i); ST.held=null; }
  if(k==="rail"){ if(ST.held&&ST.held.where==="rail"){ ballHome(ST.held.i); ST.held=null; } ST.tapeB=false; ST.putty=0; }
  if(k==="track"){ if(ST.track.ball!==null) ballHome(ST.track.ball); ST.track={...ST.track,state:"empty",shots:0,ball:null,stop:null,ruler:false}; }
  if(k==="balls"){ for(let i=0;i<6;i++) ballHome(i); if(ST.held) ST.held=null; ST.bowl.ball=null; ST.bowl.lost=false; ST.track.ball=null; }
  say("back",itemName(k));
}
function benchClick(p,right){
  const c=cm(p);
  if(hand) return handClick(c,right);
  if(busy()) return;
  if(right){ for(const k of ["rail","stand","balls","bowl","track","box"]) if(inRect(k,c)){ returnItem(k); return; } return; }
  if(ST.on.balls) for(let i=0;i<6;i++) if(ST.inBox[i]&&near(c,ballSlotXY(i),0.9)){ ST.inBox[i]=false; hand={k:"ball",i}; say("ballPick",BTYPE[BALL[i]].n); return; }
  if(ST.held&&ST.held.where==="stand"&&near(c,R_PT(),1.6)){ hand={k:"ball",i:ST.held.i}; ST.held=null; say("back4"); return; }
  if(ST.held&&ST.held.where==="rail"&&near(c,railBallXY(),1.8)){ hand={k:"ball",i:ST.held.i}; ST.held=null; say("back4"); return; }
  const B=ST.bowl; if(ST.on.bowl&&B.ball!==null&&!B.lost&&near(c,[bowlC()[0]+B.off[0],bowlC()[1]+B.off[1]],2)){ hand={k:"ball",i:B.ball}; B.ball=null; say("back4"); return; }
  const Tr=ST.track; if(ST.on.track&&Tr.ball!==null&&near(c,[ST.pos.track.x-24+Math.min(48,Tr.stop||0),ST.pos.track.y],2)){ hand={k:"ball",i:Tr.ball}; Tr.ball=null; say("back4"); return; }
  for(const k of ["rail","stand","balls","bowl","track","box"]) if(inRect(k,c)){ hand={k,move:true,orig:{...ST.pos[k]}}; ST.on[k]=false; say("moveIt",itemName(k)); return; }
}
function handClick(c,right){
  const k=hand.k;
  if(right){ if(hand.move){ ST.pos[k]=hand.orig; ST.on[k]=true; hand=null; say("stays"); return; }
    if(k==="ball") ballHome(hand.i); hand=null; say("back",k==="ball"?itemName("balls"):itemName(k)); return; }
  if(PLACE.includes(k)){ const pos=snapPos(k,{x:c[0],y:c[1]}); if(overlap(k,pos)){ say("noFit"); return; }
    ST.pos[k]=pos; ST.on[k]=true; hand=null;
    if(k==="bowl"&&inRect("box",c)) say("bowlIn"); else if(k==="rail"&&railMounted()) say("railOn"); else say("placed",itemName(k)); return; }
  const onBowl=ST.on.bowl&&near(c,bowlC(),10.5), onTrack=inRect("track",c), onRail=ST.on.rail&&inRect("rail",c), B=ST.bowl, Tr=ST.track;
  if(k==="ball"){
    if(ST.on.stand&&!railMounted()&&near(c,R_PT(),2.5)){ ST.held={i:hand.i,where:"stand"}; hand=null; ST.focus="A"; say("ballHold"); return; }
    if(railMounted()&&onRail&&c[0]<railLow()[0]-1){ const g=railGeom(); ST.s=Math.max(3,Math.min(95,Math.round((railLow()[0]-c[0])/Math.cos(g.th)))); ST.held={i:hand.i,where:"rail"}; hand=null; ST.focus="B"; say("ballRail"); return; }
    say("ballWhere"); return; }
  if(k==="bottle"){
    if(onBowl){ if(B.ball!==null&&!B.lost){ say("noUse"); return; } Object.assign(B,{state:"filled",shots:0,D:null,ruler:false}); ST.focus="A"; say("fill"); return; }
    if(onTrack){ if(Tr.ball!==null){ say("noUse"); return; } Object.assign(Tr,{state:"filled",shots:0,stop:null}); ST.focus="B"; say("fillT"); return; } }
  if(k==="ruler"){
    if(onBowl&&B.state!=="empty"){ ST.focus="A";
      if(B.state==="crater"){ B.ruler=!B.ruler; if(B.ruler){ B.rulerX=-(B.D/20)-0.8; say("rulerOn"); } return; }
      B.state="level"; say("level"); return; }
    if(onTrack&&Tr.state!=="empty"){ ST.focus="B";
      if(Tr.state==="filled"){ Tr.state="level"; Tr.shots=0; Tr.stop=null; say("scrape"); return; }
      Tr.ruler=!Tr.ruler; if(Tr.ruler) say("rulerTrack"); return; } }
  if(k==="spoon"){
    if(onBowl&&B.state!=="empty"){ if(B.ball!==null&&!B.lost){ say("noUse"); return; } Object.assign(B,{state:"mixed",shots:0,D:null,ruler:false}); say("mix"); return; }
    if(onTrack&&Tr.state!=="empty"){ if(Tr.ball!==null){ say("noUse"); return; } Tr.state="filled"; Tr.stop=null; say("mix"); return; } }
  if(k==="sieve"&&onBowl&&B.lost){ ballHome(B.ball); Object.assign(B,{state:"mixed",shots:0,D:null,ball:null,lost:false,ruler:false}); say("sieve"); return; }
  if(k==="tape"){ if(onBowl&&aActive()){ ST.tapeA=!ST.tapeA; if(ST.tapeA) say("tapeA"); ST.focus="A"; return; }
    if(onRail&&railMounted()){ ST.tapeB=!ST.tapeB; if(ST.tapeB) say("tapeB"); ST.focus="B"; return; } }
  if(k==="putty"&&onRail){ ST.putty=Math.min(2,ST.putty+1); say("putty"); return; }
  if(k==="brush"&&(onRail||onTrack)){ say("brush"); return; }
  if(k==="funnel"){                      /* the sand goes back into the bottle: bowl or track emptied */
    if(onBowl&&B.state!=="empty"){ if(B.ball!==null&&!B.lost){ say("noUse"); return; } Object.assign(B,{state:"empty",shots:0,D:null,ruler:false}); say("funnel"); return; }
    if(onTrack&&Tr.state!=="empty"){ if(Tr.ball!==null){ say("noUse"); return; } Object.assign(Tr,{state:"empty",shots:0,stop:null,ruler:false}); say("funnel"); return; }
    if(ST.on.box&&inRect("box",c)){ say("funnel"); return; } }
  say("noUse");
}

/* the close up */
let drag=null;

const inP=(P,p)=>p[0]>=P.x&&p[0]<=P.x+P.w&&p[1]>=P.y&&p[1]<=P.y+P.h;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ if(e.button!==0||busy()) return; const p=clpos(e);
  if(inP(P1,p)){
    if(SV.ball&&near(p,SV.ball,SV.ball[2]+9)&&ST.held){ drag={kind:SV.mode==="A"?"h":"s",y0:p[1],x0:p[0],h0:ST.h,s0:ST.s,moved:false}; closeCv.setPointerCapture(e.pointerId); return; }
    if(SV.mode==="B"&&SV.clamp&&near(p,SV.clamp,14)){ drag={kind:"clamp",y0:p[1],z0:ST.clampZ,moved:true}; closeCv.setPointerCapture(e.pointerId); return; }
  }
  if(inP(P2,p)){ const tgt=SV.top==="A"?ST.bowl:ST.track; if(tgt.ruler){ drag={kind:"ruler",x0:p[0],r0:tgt.rulerX,tgt,k:SV.top==="A"?P2.w/9:P2.w/51,moved:true}; closeCv.setPointerCapture(e.pointerId); } }
});

  if(Math.hypot(p[0]-(drag.x0||p[0]),p[1]-(drag.y0||p[1]))>3) drag.moved=true;
  if(drag.kind==="h") ST.h=Math.max(3,Math.min(200,Math.round((drag.h0+(drag.y0-p[1])/SV.k)*2)/2));
  if(drag.kind==="s"&&SV.rail){ const g=SV.rail.g, ds=-((p[0]-drag.x0)*Math.cos(g.th)-(p[1]-drag.y0)*Math.sin(g.th))/SV.k; ST.s=Math.max(3,Math.min(95,Math.round((drag.s0+ds)*2)/2)); }
  if(drag.kind==="clamp") ST.clampZ=Math.max(2.5,Math.min(43,Math.round((drag.z0+(drag.y0-p[1])/SV.k)*10)/10));
  if(drag.kind==="ruler") drag.tgt.rulerX=drag.r0+(p[0]-drag.x0)/drag.k;
});
closeCv.addEventListener("pointerup",()=>{ if(drag&&!drag.moved){ if(drag.kind==="h") dropBall(); if(drag.kind==="s") rollBall(); } drag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e); if(!inP(P1,p)||!ST.held||busy()) return; e.preventDefault(); const s=e.deltaY<0?1:-1;
  if(SV.mode==="A") ST.h=Math.max(3,Math.min(200,ST.h+0.5*s)); else ST.s=Math.max(3,Math.min(95,ST.s+0.5*s)); },{passive:false});

function dropBall(){ if(!ST.held||ST.held.where!=="stand") return;
  ST.fall={i:ST.held.i,h0:ST.h,z:ST.h,t:0,over:aActive()}; ST.held=null; say("drop"); }
function rollBall(){ if(!ST.held||ST.held.where!=="rail") return;
  if(ST.putty<2) ST.clampZ=Math.max(2.5,ST.clampZ+0.15*gauss());
  const g=railGeom(); ST.roll={phase:"rail",i:ST.held.i,s0:ST.s,s:ST.s,t:0,x:0,v:0,th:g.th}; ST.held=null; say("roll"); }
function stepMotion(dt){
  if(ST.fall){ const F=ST.fall; F.t+=dt; F.z=F.h0-0.5*981*F.t*F.t;
    if(F.z<=0){ ST.fall=null; const B=ST.bowl;
      if(!F.over||B.state==="empty"){ ballHome(F.i); say("noUse"); return; }
      const lev=B.state==="level"||B.state==="crater";
      B.D=crater(F.i,F.h0,lev,B.shots); B.shots++; B.state="crater"; B.off=[0.6*gauss(),0.6*gauss()]; B.rim=[6*rnd(),6*rnd(),6*rnd()];
      B.ball=F.i; B.lost=BTYPE[BALL[F.i]].n===1; B.ruler=false; say("impact"); } }
  if(ST.roll){ const R=ST.roll, T=ST.track, acc=(5/7)*981*Math.sin(R.th);
    R.t+=dt;
    if(R.phase==="rail"){ R.s=R.s0-0.5*acc*R.t*R.t;
      if(R.s<=0){ R.v=Math.sqrt(2*acc*R.s0); R.phase="sand"; R.t=0; R.x=0;
        if(T.state!=="empty"){ const mu=KIT.mu*Math.max(0.8,1-0.05*T.shots);
          R.L=(5/7)*Math.sin(R.th)*R.s0/mu*(1+0.06*gauss())*(T.state==="level"?1:1+0.12*gauss()); R.a=R.v*R.v/(2*R.L); }
        else { R.L=Infinity; R.a=0; } } }
    else { R.x=R.v*R.t-0.5*R.a*R.t*R.t;
      const done=R.a>0&&R.t>=R.v/R.a;
      if(done||R.x>=48.8){ const x=done?R.L:48.8; ST.roll=null; T.ball=R.i; T.stop=Math.min(48.8,x); if(T.state!=="empty") T.shots++;
        if(x>=48.8){ say("off"); if(T.state==="empty"){ T.ball=null; ballHome(R.i); } } else say("stop"); } } }
}

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const fmt=t=>Math.floor(t/60)+":"+(t%60).toFixed(2).padStart(5,"0");
function swToggle(){ ST.swRun=!ST.swRun; renderPanel(); }
$("swBtn").onclick=swToggle;
$("swLap").onclick=()=>{ ST.laps.unshift(fmt(ST.sw)); ST.laps=ST.laps.slice(0,40); renderPanel(); };
$("swReset").onclick=()=>{ ST.sw=0; ST.laps=[]; ST.swRun=false; renderPanel(); };
document.addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"){ e.preventDefault(); if(!e.repeat) swToggle(); } });
function renderPanel(){ const t=d(); $("swBtn").textContent=ST.swRun?t.stop:t.start;
  $("laps").innerHTML=ST.laps.map((s,i)=>"<div>"+(ST.laps.length-i)+". "+s+"</div>").join(""); }
function renderStatus(){
  const L=[], t=d(), B=ST.bowl, Tr=ST.track;
  if(!PLACE.some(k=>ST.on[k])) L.push([t.st.none,false]);
  if(ST.on.bowl&&(B.state==="filled"||B.state==="mixed")) L.push([t.st.notLevel,false]);
  if(B.shots>=2) L.push([t.st.compact(B.shots),true]);
  if(Tr.shots>=2) L.push([t.st.trackHard(Tr.shots),true]);
  if(railMounted()&&ST.putty<2) L.push([t.st.noPutty,false]);
  if(B.lost) L.push([t.st.lost,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset; $("t-swhint").textContent=t.swHint;
  $("t-h-a").textContent=t.hA; $("t-ahint").textContent=t.aHint; $("t-h-b").textContent=t.hB; $("t-bhint").textContent=t.bHint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2025 E2 — 모래 크레이터와 사구 · HaslaLab":"IPhO 2025 E2 — Sand Craters and Dunes · HaslaLab";
  renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.25,Math.max(0,now-tPrev)); tPrev=now;
  if(ST.swRun) ST.sw+=dt;
  for(let left=dt;left>1e-9;left-=0.005) stepMotion(Math.min(0.005,left));
  ctx.clearRect(0,0,LW,LH); drawBench();
  $("swLbl").textContent=fmt(ST.sw);
  drawClose();
  if(++frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
