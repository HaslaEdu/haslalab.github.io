/* ══════════════════════════════════════════════════════════════
   1.  RANDOM AND PHYSICS, STATE  (the same kit as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2025e2)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const G=9.81, RHO_0=1.2, CX=1.0;
const BTYPE=[{n:1,d:2.0,m:0.033},{n:2,d:5.0,m:0.51},{n:3,d:9.0,m:3.0},{n:4,d:16.0,m:17.0}];   /* mm, g */
const BALL=[0,0,0,1,2,3];                     /* the six balls: three #1, one #2, one #3, one #4 */
const KIT={c:0.0695*(1+0.015*gauss()), mu:0.500+0.020*gauss()};
function impactV2(d,m,h){ const vt2=8*m*G/(Math.PI*d*d*RHO_0*CX); return vt2*(1-Math.exp(-2*G*h/vt2)); }
function crater(i,hcm,levelled,shots){
  const b=BTYPE[BALL[i]], d=b.d/1000, m=b.m/1000, h=hcm/100;
  const E=0.5*m*impactV2(d,m,h);
  let D=KIT.c*Math.pow(E,0.25)*Math.max(0.82,1-0.05*shots);
  D*=1+0.045*gauss(); if(!levelled) D*=1+0.08*gauss();
  return D*1000;                                  /* mm */
}

/* ══════════════════════════════════════════════════════════════
   2.  STATE AND GEOMETRY  (bench 160 cm × 96 cm, 7.5 px per cm)
   ══════════════════════════════════════════════════════════════ */
const LW=1200, LH=720, PX=7.5, TW=160, TD=96;
const PLACE=["box","bowl","balls","stand","rail","track"];
const TOOLS=["bottle","tape","sieve","brush","putty","funnel","spoon","ruler"];
const BOX={box:[-20,-15,40,30], bowl:[-10,-10,20,20], balls:[-4.5,-3,9,6], stand:[-12,-9,16,18], rail:[-50,-1,100,2], track:[-25,-4,50,8]};
const ST={
  on:{}, pos:{},
  bowl:{state:"empty",shots:0,D:null,rim:[0,0,0],off:[0,0],ball:null,lost:false,ruler:false,rulerX:-30},
  track:{state:"empty",shots:0,ruler:false,rulerX:-2,ball:null,stop:null,off:false},
  inBox:[true,true,true,true,true,true],
  held:null,                /* {i, where:"stand"|"rail"} */
  h:50, s:50, clampZ:10.4, tapeA:false, tapeB:false, putty:0,
  fall:null, roll:null, focus:"A",
  sw:0, swRun:false, laps:[]
};
for(const k of PLACE){ ST.on[k]=false; ST.pos[k]={x:75,y:45}; }
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const itemName=k=>d().items[k]||k;
const near=(p,q,r)=>Math.hypot(p[0]-q[0],p[1]-q[1])<r;
const R_PT=()=>[ST.pos.stand.x+22,ST.pos.stand.y];                         /* end of the horizontal rod */
const bowlC=()=>[ST.pos.bowl.x,ST.pos.bowl.y];
const aActive=()=>ST.on.stand&&ST.on.bowl&&near(R_PT(),bowlC(),6);
const railLow=()=>[ST.pos.rail.x+50,ST.pos.rail.y], railUp=()=>[ST.pos.rail.x-50,ST.pos.rail.y];
const trackL=()=>[ST.pos.track.x-25,ST.pos.track.y];
function railMounted(){
  if(!(ST.on.rail&&ST.on.track&&ST.on.stand)) return false;
  const lo=railLow(), tl=trackL(), rod=[ST.pos.stand.x,ST.pos.stand.y];
  return Math.abs(lo[0]-tl[0])<2.5&&Math.abs(lo[1]-tl[1])<2&&Math.abs(rod[1]-ST.pos.rail.y)<2&&rod[0]>railUp()[0]+2&&rod[0]<lo[0]-30;
}
const EDGE_Z=1.6;                                                          /* the edge of the track the rail rests on */
function railGeom(){ const span=railLow()[0]-ST.pos.stand.x, rise=ST.clampZ-EDGE_Z;
  const th=Math.atan2(rise,span); return {span,rise,th,len:Math.hypot(span,rise)}; }
function inRect(k,p){ if(!ST.on[k]) return false; const q=ST.pos[k], b=BOX[k]; return p[0]>=q.x+b[0]-0.4&&p[0]<=q.x+b[0]+b[2]+0.4&&p[1]>=q.y+b[1]-0.4&&p[1]<=q.y+b[1]+b[3]+0.4; }
function overlap(k,pos){
  const b=BOX[k], x0=pos.x+b[0], y0=pos.y+b[1], x1=x0+b[2], y1=y0+b[3];
  if(x0<0||y0<0||x1>TW||y1>TD) return true;
  for(const o of PLACE){ if(o===k||!ST.on[o]) continue;
    const pair=[k,o].sort().join("|"); if(["bowl|box","rail|stand","rail|track"].includes(pair)) continue;
    const c=BOX[o], q=ST.pos[o]; if(x0<q.x+c[0]+c[2]&&x1>q.x+c[0]&&y0<q.y+c[1]+c[3]&&y1>q.y+c[1]) return true; }
  return false;
}
/* where the balls are in their container */
function ballSlotXY(i){ const q=ST.pos.balls; return [[q.x-3.4,q.y-1.5],[q.x-2.4,q.y-1.5],[q.x-1.4,q.y-1.5],[q.x+0.2,q.y-1.4],[q.x+2.6,q.y-1.2],[q.x+0.5,q.y+1.3]][i]; }

const mulberry=mulberry32;
const busy=()=>!!(ST.fall||ST.roll);
function ballHome(i){ ST.inBox[i]=true; }
function railBallXY(){ const g=railGeom(); return [railLow()[0]-ST.s*Math.cos(g.th),ST.pos.rail.y]; }
function returnItem(k){
  ST.on[k]=false;
  if(k==="bowl"){ if(ST.bowl.ball!==null) ballHome(ST.bowl.ball); ST.bowl={...ST.bowl,state:"empty",shots:0,D:null,ball:null,lost:false,ruler:false}; ST.tapeA=false; }
  if(k==="stand"&&ST.held){ ballHome(ST.held.i); ST.held=null; }
  if(k==="rail"){ if(ST.held&&ST.held.where==="rail"){ ballHome(ST.held.i); ST.held=null; } ST.tapeB=false; ST.putty=0; }
  if(k==="track"){ if(ST.track.ball!==null) ballHome(ST.track.ball); ST.track={...ST.track,state:"empty",shots:0,ball:null,stop:null,ruler:false}; }
  if(k==="balls"){ for(let i=0;i<6;i++) ballHome(i); if(ST.held) ST.held=null; ST.bowl.ball=null; ST.bowl.lost=false; ST.track.ball=null; }
  say("back",itemName(k));
}
function benchClick(p,right){
  const c=cm(p);
  if(hand) return handClick(c,right);
  if(busy()) return;
  if(right){ for(const k of ["rail","stand","balls","bowl","track","box"]) if(inRect(k,c)){ returnItem(k); return; } return; }
  if(ST.on.balls) for(let i=0;i<6;i++) if(ST.inBox[i]&&near(c,ballSlotXY(i),0.9)){ ST.inBox[i]=false; hand={k:"ball",i}; say("ballPick",BTYPE[BALL[i]].n); return; }
  if(ST.held&&ST.held.where==="stand"&&near(c,R_PT(),1.6)){ hand={k:"ball",i:ST.held.i}; ST.held=null; say("back4"); return; }
  if(ST.held&&ST.held.where==="rail"&&near(c,railBallXY(),1.8)){ hand={k:"ball",i:ST.held.i}; ST.held=null; say("back4"); return; }
  const B=ST.bowl; if(ST.on.bowl&&B.ball!==null&&!B.lost&&near(c,[bowlC()[0]+B.off[0],bowlC()[1]+B.off[1]],2)){ hand={k:"ball",i:B.ball}; B.ball=null; say("back4"); return; }
  const Tr=ST.track; if(ST.on.track&&Tr.ball!==null&&near(c,[ST.pos.track.x-24+Math.min(48,Tr.stop||0),ST.pos.track.y],2)){ hand={k:"ball",i:Tr.ball}; Tr.ball=null; say("back4"); return; }
  for(const k of ["rail","stand","balls","bowl","track","box"]) if(inRect(k,c)){ hand={k,move:true,orig:{...ST.pos[k]}}; ST.on[k]=false; say("moveIt",itemName(k)); return; }
}
function handClick(c,right){
  const k=hand.k;
  if(right){ if(hand.move){ ST.pos[k]=hand.orig; ST.on[k]=true; hand=null; say("stays"); return; }
    if(k==="ball") ballHome(hand.i); hand=null; say("back",k==="ball"?itemName("balls"):itemName(k)); return; }
  if(PLACE.includes(k)){ const pos=snapPos(k,{x:c[0],y:c[1]}); if(overlap(k,pos)){ say("noFit"); return; }
    ST.pos[k]=pos; ST.on[k]=true; hand=null;
    if(k==="bowl"&&inRect("box",c)) say("bowlIn"); else if(k==="rail"&&railMounted()) say("railOn"); else say("placed",itemName(k)); return; }
  const onBowl=ST.on.bowl&&near(c,bowlC(),10.5), onTrack=inRect("track",c), onRail=ST.on.rail&&inRect("rail",c), B=ST.bowl, Tr=ST.track;
  if(k==="ball"){
    if(ST.on.stand&&!railMounted()&&near(c,R_PT(),2.5)){ ST.held={i:hand.i,where:"stand"}; hand=null; ST.focus="A"; say("ballHold"); return; }
    if(railMounted()&&onRail&&c[0]<railLow()[0]-1){ const g=railGeom(); ST.s=Math.max(3,Math.min(95,Math.round((railLow()[0]-c[0])/Math.cos(g.th)))); ST.held={i:hand.i,where:"rail"}; hand=null; ST.focus="B"; say("ballRail"); return; }
    say("ballWhere"); return; }
  if(k==="bottle"){
    if(onBowl){ if(B.ball!==null&&!B.lost){ say("noUse"); return; } Object.assign(B,{state:"filled",shots:0,D:null,ruler:false}); ST.focus="A"; say("fill"); return; }
    if(onTrack){ if(Tr.ball!==null){ say("noUse"); return; } Object.assign(Tr,{state:"filled",shots:0,stop:null}); ST.focus="B"; say("fillT"); return; } }
  if(k==="ruler"){
    if(onBowl&&B.state!=="empty"){ ST.focus="A";
      if(B.state==="crater"){ B.ruler=!B.ruler; if(B.ruler){ B.rulerX=-(B.D/20)-0.8; say("rulerOn"); } return; }
      B.state="level"; say("level"); return; }
    if(onTrack&&Tr.state!=="empty"){ ST.focus="B";
      if(Tr.state==="filled"){ Tr.state="level"; Tr.shots=0; Tr.stop=null; say("scrape"); return; }
      Tr.ruler=!Tr.ruler; if(Tr.ruler) say("rulerTrack"); return; } }
  if(k==="spoon"){
    if(onBowl&&B.state!=="empty"){ if(B.ball!==null&&!B.lost){ say("noUse"); return; } Object.assign(B,{state:"mixed",shots:0,D:null,ruler:false}); say("mix"); return; }
    if(onTrack&&Tr.state!=="empty"){ if(Tr.ball!==null){ say("noUse"); return; } Tr.state="filled"; Tr.stop=null; say("mix"); return; } }
  if(k==="sieve"&&onBowl&&B.lost){ ballHome(B.ball); Object.assign(B,{state:"mixed",shots:0,D:null,ball:null,lost:false,ruler:false}); say("sieve"); return; }
  if(k==="tape"){ if(onBowl&&aActive()){ ST.tapeA=!ST.tapeA; if(ST.tapeA) say("tapeA"); ST.focus="A"; return; }
    if(onRail&&railMounted()){ ST.tapeB=!ST.tapeB; if(ST.tapeB) say("tapeB"); ST.focus="B"; return; } }
  if(k==="putty"&&onRail){ ST.putty=Math.min(2,ST.putty+1); say("putty"); return; }
  if(k==="brush"&&(onRail||onTrack)){ say("brush"); return; }
  if(k==="funnel"){                      /* the sand goes back into the bottle: bowl or track emptied */
    if(onBowl&&B.state!=="empty"){ if(B.ball!==null&&!B.lost){ say("noUse"); return; } Object.assign(B,{state:"empty",shots:0,D:null,ruler:false}); say("funnel"); return; }
    if(onTrack&&Tr.state!=="empty"){ if(Tr.ball!==null){ say("noUse"); return; } Object.assign(Tr,{state:"empty",shots:0,stop:null,ruler:false}); say("funnel"); return; }
    if(ST.on.box&&inRect("box",c)){ say("funnel"); return; } }
  say("noUse");
}


function dropBall(){ if(!ST.held||ST.held.where!=="stand") return;
  ST.fall={i:ST.held.i,h0:ST.h,z:ST.h,t:0,over:aActive()}; ST.held=null; say("drop"); }
function rollBall(){ if(!ST.held||ST.held.where!=="rail") return;
  if(ST.putty<2) ST.clampZ=Math.max(2.5,ST.clampZ+0.15*gauss());
  const g=railGeom(); ST.roll={phase:"rail",i:ST.held.i,s0:ST.s,s:ST.s,t:0,x:0,v:0,th:g.th}; ST.held=null; say("roll"); }
function stepMotion(dt){
  if(ST.fall){ const F=ST.fall; F.t+=dt; F.z=F.h0-0.5*981*F.t*F.t;
    if(F.z<=0){ ST.fall=null; const B=ST.bowl;
      if(!F.over||B.state==="empty"){ ballHome(F.i); say("noUse"); return; }
      const lev=B.state==="level"||B.state==="crater";
      B.D=crater(F.i,F.h0,lev,B.shots); B.shots++; B.state="crater"; B.off=[0.6*gauss(),0.6*gauss()]; B.rim=[6*rnd(),6*rnd(),6*rnd()];
      B.ball=F.i; B.lost=BTYPE[BALL[F.i]].n===1; B.ruler=false; say("impact"); } }
  if(ST.roll){ const R=ST.roll, T=ST.track, acc=(5/7)*981*Math.sin(R.th);
    R.t+=dt;
    if(R.phase==="rail"){ R.s=R.s0-0.5*acc*R.t*R.t;
      if(R.s<=0){ R.v=Math.sqrt(2*acc*R.s0); R.phase="sand"; R.t=0; R.x=0;
        if(T.state!=="empty"){ const mu=KIT.mu*Math.max(0.8,1-0.05*T.shots);
          R.L=(5/7)*Math.sin(R.th)*R.s0/mu*(1+0.06*gauss())*(T.state==="level"?1:1+0.12*gauss()); R.a=R.v*R.v/(2*R.L); }
        else { R.L=Infinity; R.a=0; } } }
    else { R.x=R.v*R.t-0.5*R.a*R.t*R.t;
      const done=R.a>0&&R.t>=R.v/R.a;
      if(done||R.x>=48.8){ const x=done?R.L:48.8; ST.roll=null; T.ball=R.i; T.stop=Math.min(48.8,x); if(T.state!=="empty") T.shots++;
        if(x>=48.8){ say("off"); if(T.state==="empty"){ T.ball=null; ballHome(R.i); } } else say("stop"); } } }
}

/* the rail is laid against the end of the track when it is put down close to it */
function snapPos(k,pos){
  if(k==="rail"&&ST.on.track){ const tl=trackL(); if(Math.abs(pos.x+50-tl[0])<6&&Math.abs(pos.y-tl[1])<4) return {x:tl[0]-50,y:tl[1]}; }
  return pos;
}

const cv=$("bench"), ctxM=cv.getContext("2d");

/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  const sx=CAM.W/2+CAM.px+xr*CAM.k, sy=CAM.H/2+CAM.py-up*CAM.k;
  if(_REC) _REC.set(sx+","+sy,dep);
  return [sx, sy, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;
  const dz=(dx*c-xr)/s, dy=(up+(dx*s+dz*c)*sp)/cp;
  return [x0, CAM.ty+dy, CAM.tz+dz];
}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const _shadeCache=new Map();
function shade(col,f){
  const key=col+"|"+f.toFixed(2); let v=_shadeCache.get(key); if(v) return v;
  let a=1, rgb;
  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));
  v=a<1?`rgba(${r[0]},${r[1]},${r[2]},${a})`:`rgb(${r[0]},${r[1]},${r[2]})`;
  _shadeCache.set(key,v); return v;
}

  else if(k==="ruler"){ R2(x-16,y-3,x+16,y+3,"#d2d6da","#c0262a"); }
}
function drawTray(){
  const c=trayCtx, t=d(); c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[]; let y=6; const wd=TRW-12;
  for(const k of TRAY_LIST){ const av=trayAvail(k), sel=hand&&hand.k===k&&!hand.move;
    c.fillStyle=av?"#1f242b":"#171a1e"; c.fillRect(6,y,wd,TRAY_ROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TRAY_ROW-5);
    trayIcon(c,k,28,y+(TRAY_ROW-4)/2,!av);
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=av?"#e8eef2":"#868e96"; c.fillText(t.items[k],52,y+13);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a";
    c.fillText(TOOLS.includes(k)?t.trayTool:av?t.trayTake:t.trayOut,52,y+28);
    trayCells.push([k,y,y+TRAY_ROW-4]); y+=TRAY_ROW; }
  c.font='10.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ handClick([0,0],true); drawTray(); } });
trayCv.addEventListener("pointerdown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; B3.trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k&&!hand.move; if(hand) handClick([0,0],true);
    if(!same&&trayAvail(k)){ hand={k}; say(TOOLS.includes(k)?"tool":"picked",itemName(k)); } drawTray(); return; } });

/* ══════════════════════════════════════════════════════════════
   7.  HANDS ON THE BENCH  (the model's own rules, driven from the 3-D picture)
   ══════════════════════════════════════════════════════════════ */
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const LIVE=/^(m_|ball_|heldBall|bowlBall|trackBall|clampB|rulerA|rulerT|sandA|sandT|rodEnd|tapeA|tapeB)/;
/* where on the bench a click lands, for the model's rules: the thing clicked, or the desk under the pointer */
function benchPt(p,id){
  const w=deskPt(p), c=[w[0]+80,w[2]+48];
  if(/^(m_bowl|sandA|bowlBall|rulerA|tapeA)$/.test(id)&&ST.on.bowl) return bowlC();
  if(/^(m_track|sandT|trackBall|rulerT)$/.test(id)&&ST.on.track) return [Math.max(ST.pos.track.x-24,Math.min(ST.pos.track.x+24,c[0])),ST.pos.track.y];
  if(/^(m_rail|tapeB)$/.test(id)&&ST.on.rail){ let x=c[0];
    if(railMounted()){ const R=railPts(), pl=onPlane(p[0],p[1],8); x=Math.max(railUp()[0]+1,Math.min(railLow()[0]-1.5,pl[0]+80)); void R; }
    return [x,ST.pos.rail.y]; }
  if(ST.on.stand&&hand&&hand.k==="ball"&&!railMounted()){ if(/^(m_stand|rodEnd)$/.test(id)) return R_PT();
    /* a click close to the end of the arm, at the arm's height, counts too */
    const armY=aActive()?ROD_TOP-2:24, q=onPlane(p[0],p[1],armY), e=R_PT(); if(Math.hypot(q[0]+80-e[0],q[2]+48-e[1])<4) return e; }
  if(id==="m_box"&&hand&&TOOLS.includes(hand.k)) return [ST.pos.box.x,ST.pos.box.y];
  return c;
}
function pickUpAt(id){
  if(busy()) return true;
  if(id.startsWith("ball_")){ const i=+id.slice(5); ST.inBox[i]=false; hand={k:"ball",i}; say("ballPick",BTYPE[BALL[i]].n); return true; }
  if(id==="bowlBall"){ const B=ST.bowl; hand={k:"ball",i:B.ball}; B.ball=null; say("back4"); return true; }
  if(id==="trackBall"){ const Tr=ST.track; hand={k:"ball",i:Tr.ball}; Tr.ball=null; say("back4"); return true; }
  return false;
}
const DRAGS={ heldBall:{get:()=>ST.held&&ST.held.where==="stand"?ST.h:ST.s, set:v=>{ if(ST.held&&ST.held.where==="stand") ST.h=Math.max(3,Math.min(200,Math.round(v*2)/2)); else ST.s=Math.max(3,Math.min(95,Math.round(v*2)/2)); }, px:0.1, step:0.5},
  clampB:{get:()=>ST.clampZ,set:v=>ST.clampZ=Math.max(2.5,Math.min(43,Math.round(v*10)/10)),px:0.02,step:0.1},
  rulerA:{get:()=>ST.bowl.rulerX,set:v=>ST.bowl.rulerX=v,px:0,step:0.05,horiz:true},
  rulerT:{get:()=>ST.track.rulerX,set:v=>ST.track.rulerX=v,px:0,step:0.1,horiz:true} };
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  const p=mousePos(e); B3.mouse=p; B3.mouseW=deskPt(p);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(e.button===1||e.button===2){ B3.down={p0:p,last:p,pan:true,btn:e.button,moved:false}; return; }
  if(e.button!==0) return;
  const id=pick3(p[0],p[1])||"";
  if(hand&&!hand.drag){ handClick(benchPt(p,id),false); drawTray(); return; }
  if(DRAGS[id]&&!busy()){ B3.drag={id,y:p[1],x:p[0],p0:p,moved:false,w0:onPlane(p[0],p[1],sandY())[0]}; return; }
  if(pickUpAt(id)){ drawTray(); return; }
  if(/^m_/.test(id)&&!busy()){ B3.down={t:id,p0:p,last:p,moved:false}; return; }
  B3.down={p0:p,last:p,pan:e.shiftKey,moved:false};
});
cv.addEventListener("pointermove",e=>{
  const p=mousePos(e), dn=B3.down; B3.mouse=p; B3.mouseW=deskPt(p);
  if(B3.drag){ const D=DRAGS[B3.drag.id]; if(Math.hypot(p[0]-B3.drag.p0[0],p[1]-B3.drag.p0[1])>4) B3.drag.moved=true;
    if(D.horiz){ const y0=B3.drag.id==="rulerA"?sandY():0.1, w=onPlane(p[0],p[1],y0)[0]; D.set(D.get()+(w-B3.drag.w0)); B3.drag.w0=w; }
    else { const dy=B3.drag.y-p[1]; if(Math.abs(dy)>=1){ D.set(D.get()+dy/CAM.k*(e.shiftKey?0.2:1)*(B3.drag.id==="heldBall"&&ST.held&&ST.held.where==="rail"?1.6:1)); B3.drag.y=p[1]; } } return; }
  if(!dn){ const t=hand?null:pick3(p[0],p[1]); cv.classList.toggle("hand",!!(t&&LIVE.test(t))); return; }
  if(Math.hypot(p[0]-dn.p0[0],p[1]-dn.p0[1])>5) dn.moved=true;
  if(!dn.moved) return;
  if(dn.t){ const k=dn.t.slice(2); hand={k,move:true,orig:{...ST.pos[k]},drag:true}; ST.on[k]=false; say("moveIt",itemName(k)); B3.down=null; drawTray(); return; }
  const dx=p[0]-dn.last[0], dy=p[1]-dn.last[1]; dn.last=p;
  CAM.touched=true; CAMTW=null; renderViewBtn();
  if(dn.pan){ CAM.px+=dx; CAM.py+=dy; } else { CAM.yaw+=dx*0.008; CAM.pitch=Math.min(1.5,Math.max(0.02,CAM.pitch+dy*0.006)); }
  cv.classList.add("dragging");
});
cv.addEventListener("pointerup",e=>{
  const p=mousePos(e), dn=B3.down; B3.down=null; cv.classList.remove("dragging");
  if(B3.drag){ const g=B3.drag; B3.drag=null; if(!g.moved&&g.id==="heldBall"){ if(ST.held&&ST.held.where==="stand"){ if(!aActive()){ say("notOver"); return; } dropBall(); } else rollBall(); } return; }
  if(dn&&dn.btn===2&&!dn.moved){ rclick(p); return; }
  if(dn&&dn.t&&!dn.moved){ const k=dn.t.slice(2); hand={k,move:true,orig:{...ST.pos[k]}}; ST.on[k]=false; say("moveIt",itemName(k)); drawTray(); return; }
  if(hand&&hand.drag){ hand.drag=false; const id=pick3(p[0],p[1])||""; const was=hand; handClick(benchPt(p,id),false); if(hand===was&&was.move){ ST.pos[was.k]=was.orig; ST.on[was.k]=true; hand=null; } drawTray(); }
});
function rclick(p){
  if(hand){ handClick([0,0],true); drawTray(); return; }
  if(busy()) return;
  const id=pick3(p[0],p[1])||"";
  if(/^m_/.test(id)){ returnItem(id.slice(2)); drawTray(); }
}
window.addEventListener("pointerup",e=>{ if(B3.trayDrag&&hand&&e.target===cv){ const p=mousePos(e); handClick(benchPt(p,pick3(p[0],p[1])||""),false); drawTray(); } B3.trayDrag=false; });
window.addEventListener("pointermove",e=>{ if(B3.trayDrag&&hand){ const r=cv.getBoundingClientRect(), p=[e.clientX-r.left,e.clientY-r.top]; B3.mouse=p; B3.mouseW=deskPt(p); } });
$("viewBack").onclick=()=>goTo("all");
cv.addEventListener("dblclick",e=>{ const p=mousePos(e), t=pick3(p[0],p[1]); if(hand||(t&&LIVE.test(t))) return; goTo("all"); });
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=mousePos(e), dir=e.deltaY<0?1:-1, id=hand?null:pick3(p[0],p[1]);
  if(id&&DRAGS[id]&&!busy()){ const D=DRAGS[id]; D.set(D.get()+dir*D.step*(e.shiftKey?0.2:1)); return; }
  CAM.touched=true; CAMTW=null; renderViewBtn();
  const f=dir>0?1.12:1/1.12, nk=Math.min(220,Math.max(3,CAM.k*f)), r=nk/CAM.k;
  CAM.px=(p[0]-CAM.W/2)-(p[0]-CAM.W/2-CAM.px)*r; CAM.py=(p[1]-CAM.H/2)-(p[1]-CAM.H/2-CAM.py)*r; CAM.k=nk;
},{passive:false});
addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(hand) { handClick([0,0],true); drawTray(); } else goTo("all"); } });

/* ══════════════════════════════════════════════════════════════
   8.  SIDE PANEL, LANGUAGE, MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const fmt=t=>Math.floor(t/60)+":"+(t%60).toFixed(2).padStart(5,"0");
function swToggle(){ ST.swRun=!ST.swRun; renderPanel(); }
$("swBtn").onclick=swToggle;
$("swLap").onclick=()=>{ ST.laps.unshift(fmt(ST.sw)); ST.laps=ST.laps.slice(0,40); renderPanel(); };
$("swReset").onclick=()=>{ ST.sw=0; ST.laps=[]; ST.swRun=false; renderPanel(); };
document.addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); if(!e.repeat) swToggle(); } });
function renderPanel(){ const t=d(); $("swBtn").textContent=ST.swRun?t.stop:t.start;
  $("laps").innerHTML=ST.laps.map((s,i)=>"<div>"+(ST.laps.length-i)+". "+s+"</div>").join(""); }
function renderViews(){ const box=$("views"); box.innerHTML="";
  for(const [v,lbl] of d().views){ const b=document.createElement("button"); b.textContent=lbl; if(v===VIEW) b.className="on";
    b.disabled=v!=="all"&&!viewOf(v); b.onclick=()=>goTo(v); box.appendChild(b); } }
function renderStatus(){
  const L_=[], t=d(), B=ST.bowl, Tr=ST.track;
  if(!PLACE.some(k=>ST.on[k])) L_.push([t.st.none,false]);
  if(ST.on.bowl&&(B.state==="filled"||B.state==="mixed")) L_.push([t.st.notLevel,false]);
  if(B.shots>=2) L_.push([t.st.compact(B.shots),true]);
  if(Tr.shots>=2) L_.push([t.st.trackHard(Tr.shots),true]);
  if(railMounted()&&ST.putty<2) L_.push([t.st.noPutty,false]);
  if(B.lost) L_.push([t.st.lost,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L_.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L_){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.tray;
  $("t-benchcap").textContent=t.benchcap; $("t-h-view").textContent=t.hView;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset; $("t-swhint").textContent=t.swHint;
  $("t-h-a").textContent=t.hA; $("t-ahint").textContent=t.aHint; $("t-h-b").textContent=t.hB; $("t-bhint").textContent=t.bHint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2025 E2 — 모래 크레이터와 사구 · HaslaLab":"IPhO 2025 E2 — Sand Craters and Dunes · HaslaLab";
  renderPanel(); renderViews(); renderViewBtn(); drawTray();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.25,Math.max(0,now-tPrev)); tPrev=now;
  if(ST.swRun) ST.sw+=dt;
  for(let left=dt;left>1e-9;left-=0.005) stepMotion(Math.min(0.005,left));
  if(CW>10) draw();
  $("swLbl").textContent=fmt(ST.sw);
  if(++frameN%8===0){ renderStatus(); renderViews(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
paintStatic(); layout(); applyLang(); requestAnimationFrame(tick);
</script>
