<meta name="description" content="APhO 2017 실험 문제를 브라우저에서 실행합니다. 다공성 양극 산화 알루미늄 광결정 X, Y, Z를 회절격자 팔의 무지개 띠 너머로 들여다보며 투과 극소를 찾고, 빨강·초록·파랑 레이저와 포토다이오드·멀티미터로 입사각에 따른 투과 세기를 재고, 물을 적셔 다공도를 구합니다. 계산은 대신 해주지 않습니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }

  const [x,y]=unP(p[0],p[1],0); if(!fits(k,x,y)){ say("noFit"); return false; } ST.pos[k]={x,y}; ST.on.add(k); return true;
}
function returnItem(k){
  if(k==="bench"){ for(const j of ["arm","lholder","sholder","pd"]) if(has(j)&&!ST.pos[j]) returnItem(j); }
  if(k==="arm"||k==="lholder"){ if(ST.left===k){ ST.left=null; ST.lampOn=false; if(k==="lholder"&&ST.laser){ ST.on.delete(ST.laser); ST.laser=null; ST.lockOn=false; } } }
  if(k==="sholder"&&!ST.pos.sholder){ ST.sample=null; ST.cover=false; ST.wet=0; }
  if(k===ST.laser){ ST.laser=null; ST.lockOn=false; }
  if(k==="psu"){ ST.lampOn=false; ST.lockOn=false; }
  if(k==="samples"&&ST.sample){ ST.sample=null; ST.cover=false; ST.wet=0; }
  delete ST.pos[k]; ST.on.delete(k); say("back",itemName(k));
}
function itemAt(p){
  if(has("bench")&&ST.pos.bench){ if(ST.left&&inB(p,diskBox(holeL()),4)) return {k:ST.left,mounted:true}; if(has("sholder")&&!ST.pos.sholder&&inB(p,diskBox(holeR()),2)) return {k:"sholder",mounted:true};
    if(has("pd")&&!ST.pos.pd&&inB(p,box3(pdPos()[0]-2,pdPos()[1]-3,0,pdPos()[0]+2,pdPos()[1]+3,BEN.H+7),3)) return {k:"pd",mounted:true}; }
  for(const k of [...LOOSE].reverse()) if(onBench(k)&&inB(p,bbox(k),2)) return {k};
  if(onBench("bench")&&inB(p,benchB(),0)) return {k:"bench"}; return null;
}
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move&&hand.orig){ ST.pos[hand.item]=hand.orig; ST.on.add(hand.item); say("placed",itemName(hand.item)); } else say("back",itemName(hand.item)); hand=null; return; }
    const r=place(hand.item,p); if(r){ if(r===true) say("placed",itemName(hand.item)); hand=null; } return; }
  const h=itemAt(p); if(!h) return;
  if(right){ if(h.mounted&&h.k==="lholder"&&ST.laser){ const l=ST.laser; ST.on.delete(l); ST.laser=null; ST.lockOn=false; say("back",itemName(l)); return; } returnItem(h.k); return; }
  if(h.mounted) return;                                   /* mounted things are turned, not carried */
  const orig={...ST.pos[h.k]}; delete ST.pos[h.k]; ST.on.delete(h.k); hand={item:h.k,move:true,orig}; say("picked",itemName(h.k));
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
cv.addEventListener("wheel",e=>{ const p=lpos(e); if(!has("bench")||!ST.pos.bench) return; const s=(e.deltaY<0?1:-1)*(e.shiftKey?0.1:1);
  if(ST.left&&inB(p,diskBox(holeL()),4)){ e.preventDefault(); turnL(s); } else if(has("sholder")&&!ST.pos.sholder&&inB(p,diskBox(holeR()),2)){ e.preventDefault(); turnR(s); } },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ if(hand.move&&hand.orig){ ST.pos[hand.item]=hand.orig; ST.on.add(hand.item); } hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=hand&&hand.item===k; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
const clampA=a=>Math.max(-85,Math.min(85,+a.toFixed(2)));
function turnL(s){ if(ST.left==="arm") ST.phiL=clampA(ST.phiL+s); else if(ST.left==="lholder") ST.phiLaser=clampA(ST.phiLaser+s); }
function turnR(s){ if(has("sholder")&&!ST.pos.sholder) ST.thR=clampA(ST.thR+s); }

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let pdrag=null;
function angAt(h,p){ const cx=h.x+h.w/2, cy=h.y+h.w/2; return Math.atan2(p[1]-cy,p[0]-cx)/DEG+90; }
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(!h||e.button!==0) return;
  if(h.k.startsWith("M:")){ ST.mmMode=h.k.slice(2); return; }
  if(h.k==="pL"||h.k==="pR"){ pdrag={k:h.k,h:{...h},a0:angAt(h,p),v0:h.k==="pL"?(ST.left==="arm"?ST.phiL:ST.phiLaser):ST.thR}; closeCv.setPointerCapture(e.pointerId); } });
closeCv.addEventListener("pointermove",e=>{ if(!pdrag) return; const p=clpos(e), a=angAt(pdrag.h,p), v=clampA(pdrag.v0+(a-pdrag.a0)*0.5);
  if(pdrag.k==="pL"){ if(ST.left==="arm") ST.phiL=v; else ST.phiLaser=v; } else ST.thR=v; });
closeCv.addEventListener("pointerup",()=>{ pdrag=null; });
closeCv.addEventListener("wheel",e=>{ if(tab!=="prot") return; const p=clpos(e), h=hitAt(p); if(!h) return; e.preventDefault(); const s=(e.deltaY<0?1:-1)*(e.shiftKey?0.1:1); if(h.k==="pL") turnL(s); if(h.k==="pR") turnR(s); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
for(const [id,s] of [["l-1",-1],["l-01",-0.5],["l01",0.5],["l1",1]]) $(id).onclick=()=>{ turnL(s); say("rot"); };
for(const [id,s] of [["r-1",-1],["r-01",-0.5],["r01",0.5],["r1",1]]) $(id).onclick=()=>{ turnR(s); say("rot"); };
$("lampBtn").onclick=()=>{ if(ST.left!=="arm"){ say("needArm"); return; } if(!has("psu")){ say("needPsu"); return; } ST.lampOn=!ST.lampOn; say("lamp",ST.lampOn); };
$("lockBtn").onclick=()=>{ if(ST.left!=="lholder"){ say("needHolder"); return; } if(!ST.laser){ say("needLaser"); return; } if(!has("lock")&&!ST.lockOn){ say("needLock"); return; } if(!has("psu")){ say("needPsu"); return; }
  ST.lockOn=!ST.lockOn; if(ST.lockOn) ST.laserOnT=performance.now(); say("lock",ST.lockOn); };
$("lens").oninput=e=>{ ST.lens=+e.target.value; };
function renderLasers(){ const box=$("laserRow"); box.innerHTML=""; for(const c of ["red","green","blue"]){ const b=document.createElement("button"); b.textContent=d().laserName[c]; b.className=ST.laser===c?"on":""; b.style.borderColor=LCOL[c];
  b.onclick=()=>{ if(ST.left!=="lholder"){ say("needHolder"); return; } if(ST.laser===c) return; if(has(c)&&ST.laser!==c&&ST.pos[c]) delete ST.pos[c]; const prev=ST.laser; if(prev) ST.on.delete(prev);
    const swap=(prev==="red"&&c==="blue")||(prev==="blue"&&c==="red"); ST.laser=c; ST.on.add(c); if(swap) say("swapRB"); else { ST.lockOn=false; say("laserIn",itemName(c)); } ST.laserOnT=performance.now(); renderLasers(); }; box.appendChild(b); } }
function renderSamples(){ const box=$("sampleRow"); box.innerHTML=""; for(const s of ["X","Y","Z",null]){ const b=document.createElement("button"); b.textContent=s||d().none; b.className=ST.sample===s&&s?"on":"";
  b.onclick=()=>{ if(s===null){ ST.sample=null; ST.cover=false; ST.wet=0; renderSamples(); return; } if(!has("samples")||!has("sholder")||ST.pos.sholder){ say("needSamples"); return; } ST.sample=s; ST.cover=false; ST.wet=0; say("sample",s); renderSamples(); }; box.appendChild(b); } }
$("wetBtn").onclick=()=>{ if(!ST.sample){ say("noSample"); return; }
  if(ST.cover){ ST.cover=false; ST.drying=true; say("dry"); return; }
  if(!["syringe","water","cover","tweezers"].every(has)){ say("needWet"); return; } ST.cover=true; ST.drying=false; say("wet"); };
function renderMm(){ const box=$("mmRow"); box.innerHTML=""; for(const m of MM_MODES){ const b=document.createElement("button"); b.textContent=m; b.className=ST.mmMode===m?"on":""; b.onclick=()=>{ ST.mmMode=m; renderMm(); }; box.appendChild(b); } }
$("noteBtn").onclick=()=>{ const n=$("note"), L=ST.left==="arm"?"φ="+ST.phiL.toFixed(1)+"°":ST.left==="lholder"?"laser "+(ST.laser||"—"):"";
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+(ST.sample?ST.sample+(ST.cover?"(wet) ":" "):"")+L+"  θ="+ST.thR.toFixed(1)+"°  I="+(ST.mmTxt||"—")+(ST.mmTxt&&!ST.mmTxt.startsWith("1   ")?(ST.mmMode==="20mA"?" mA":" µA"):""); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d(); $("lampBtn").textContent=ST.lampOn?t.lampOn:t.lampOff; $("lockBtn").textContent=ST.lockOn?t.lockOn:t.lockOff; $("wetBtn").textContent=ST.cover?t.wetOn:t.wetOff;
  $("sampleLbl").textContent=t.sampleLbl(ST.sample,ST.wet,ST.cover); $("mmDisp").textContent=ST.mmTxt?(ST.mmTxt.startsWith("1   ")?"1":ST.mmTxt)+(ST.mmMode==="20mA"?" mA":" µA"):"----"; }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(laserLit()){ L.push([t.st.laser,true]); if(performance.now()-ST.laserOnT<150000) L.push([t.st.warm,false]); }
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-angles").textContent=t.hAngles; $("angHint").textContent=t.angHint; $("t-h-light").textContent=t.hLight; $("lensLbl").textContent=t.lensLbl;
  $("t-h-sample").textContent=t.hSample; $("t-h-mm").textContent=t.hMm; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2017 — 광결정 · HaslaLab":"APhO 2017 — Photonic Crystal · HaslaLab";
  renderTabs(); renderLasers(); renderSamples(); renderMm(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastRead=0, tPrev=performance.now();
function tick(){
  const now=performance.now(), dt=Math.min(0.2,(now-tPrev)/1000); tPrev=now;
  if(ST.cover) ST.wet=Math.min(1,ST.wet+dt/4); else if(ST.wet>0) ST.wet=Math.max(0,ST.wet-dt/40);
  if(now-lastRead>400){ lastRead=now; ST.mmTxt=has("mm")?mmText():""; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); if(frameN%60===0){ renderLasers(); renderSamples(); renderMm(); } }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
