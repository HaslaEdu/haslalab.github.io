<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

/* ══════════════════════════════════════════════════════════════
   1.  HIDDEN TRUTH AND THE OPTICS  (beam frame: x across, y up, z along the beam's horizontal projection; metres)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const PH={D:0.150, L0:0.120, LAM:650e-9, HALF:0.0075,
  h0:U(0.0520,0.0580), a3:U(9.6e-6,11.4e-6), b5:U(20.5e-6,23.5e-6), phiStar:U(18,30)*Math.PI/180, aZnSe:U(3.85e-10,4.15e-10), V:13000, Dr:0.26};
PH.lamE=12.247e-10/Math.sqrt(PH.V*(1+1e-6*PH.V)); PH.dxR=PH.Dr*PH.lamE/PH.aZnSe;
function beamHit(yL,tau,xL,psi){ if(tau<=1e-4) return null;
  const dv=[Math.sin(psi)*Math.cos(tau),-Math.sin(tau),Math.cos(psi)*Math.cos(tau)], s=yL/Math.sin(tau);
  return {H:[xL+s*dv[0],0,-PH.L0+s*dv[2]],dv}; }
const onSample=H=>Math.abs(H[0])<=PH.HALF&&Math.abs(H[2])<=PH.HALF;
function uVec(ct,t,s,phi){ const ux=t*Math.cos(phi)-s*Math.sin(phi), uz=ct-t*Math.sin(phi)-s*Math.cos(phi); if(uz<=1e-6) return null; const q=ux*ux+uz*uz; if(q>=1) return null; return [ux,Math.sqrt(1-q),uz]; }
function toBoard(H,psi,u){ const c=Math.cos(psi), s=Math.sin(psi), lx=u[0]*c+u[2]*s, lz=-u[0]*s+u[2]*c; if(lz<=1e-6) return null; const dz=PH.D-H[2]; if(dz<=0) return null; return [H[0]+dz*lx/lz, dz*u[1]/lz]; }
/* the pattern on the board: dots [x,y,b] and curves [[x,y,b]...], in metres */
function pattern(sample,phiDeg,yL,tau,xL,psi){
  const hit=beamHit(yL,tau,xL,psi), out={dots:[],arcs:[],hit:null}; if(!hit) return out; const H=hit.H; out.hit=H;
  if(!sample||!onSample(H)) return out;
  const ct=Math.cos(tau); let phi=phiDeg*Math.PI/180-psi; if(sample===4) phi+=PH.phiStar;
  const dot=(t,s,b)=>{ const u=uVec(ct,t,s,phi); if(!u) return; const p=toBoard(H,psi,u); if(p) out.dots.push([p[0],p[1],b]); };
  const arc=(s,b0,n)=>{ n=n||900; let seg=[]; for(let i=0;i<=n;i++){ const t=-1.2+2.4*i/n, u=uVec(ct,t,s,phi); const p=u?toBoard(H,psi,u):null;
      if(p) seg.push([p[0],p[1],b0*(0.45+0.55*u[2])*Math.exp(-((t/0.85)**2))]); else if(seg.length){ if(seg.length>1) out.arcs.push(seg); seg=[]; } } if(seg.length>1) out.arcs.push(seg); };
  if(sample===1) dot(0,0,1);
  else if(sample===2||sample===4){ arc(0,1); dot(0,0,1); }
  else if(sample===3){ for(let m=-22;m<=22;m++) dot(m*PH.LAM/PH.a3,0,0.35+0.65*Math.exp(-((m/9)**2))); }
  else if(sample===5){ for(let n=-9;n<=9;n++) arc(n*PH.LAM/PH.b5,0.3+0.7*Math.exp(-((n/3.2)**2)),500); dot(0,0,1); }
  return out;
}

  scr:{A:38,B:26,C:25,D:25}, ap:2.6, sw:false, phi:0, sheet:null, sample:null,
  marks:Object.fromEntries(SHEETS.map(k=>[k,[]])), notes:[]

let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const itemName=k=>d().items[k]||k;
/* the screws: turns → geometry (the student never sees these numbers) */
const yL=()=>ST.scr.A*1.0e-3, tau=()=>(5+ST.scr.B*0.5)*Math.PI/180, xL=()=>(ST.scr.C-25)*0.4e-3, psi=()=>(ST.scr.D-25)*0.2*Math.PI/180;
const spotMM=()=>ST.it.pinhole.on?Math.min(ST.ap,0.55):ST.ap;
const laserLive=()=>ST.it.laser.on&&ST.it.battery.on&&ST.sw;

const sampleNo=()=>ST.sample?+ST.sample.slice(1):0;

/* ══════════════════════════════════════════════════════════════
   4.  DRAWING HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,'Courier New',monospace";
function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function vgrad(y,h,stops){ const g=ctx.createLinearGradient(0,y,0,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function ell(x,y,rx,ry,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];
  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]-out[0]*KX<=0.02) continue;
    const f=0.80+0.2*out[1]-0.08*out[0];
    poly([P(p[0],p[1],z0),P(q[0],q[1],z0),P(q[0],q[1],z0+h),P(p[0],p[1],z0+h)],shade(side,f-1),edge,0.6); }
  poly(c.map(p=>P(p[0],p[1],z0+h)),top,edge,0.6);
  return c;
}
function vcyl(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC*Math.hypot(1,KX)*0.98, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=0.7; ctx.stroke(); }
  ell(t[0],t[1],rx,ry,top,edge,0.7);
}
function hcyl(p0,p1,z,r,col,hi){
  const a=P(p0[0],p0[1],z), b=P(p1[0],p1[1],z);
  ctx.lineCap="round"; ctx.strokeStyle=col; ctx.lineWidth=2*r*SC; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if(hi){ ctx.strokeStyle=hi; ctx.lineWidth=Math.max(0.8,r*SC*0.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]-r*SC*0.45); ctx.lineTo(b[0],b[1]-r*SC*0.45); ctx.stroke(); }
  ctx.lineCap="butt";
}

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}

/* ══════════════════════════════════════════════════════════════
   5.  THE BENCH  (mm; x right, y towards you, z up; a sheared view so the board's face shows)
   ══════════════════════════════════════════════════════════════ */
const LW=1200, LH=660, SC=0.95, KX=0.30, KY=0.5, OX=30, OY=330;
const P=(x,y,z)=>[OX+SC*(x+KX*y), OY+SC*(KY*y-(z||0))];
const unP=(X,Y,z)=>{ const y=((Y-OY)/SC+(z||0))/KY; return [(X-OX)/SC-KX*y,y]; };
const DESK={x1:1000,y1:600};
const v2=a=>[Math.cos(a),Math.sin(a)], sub2=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul2=(a,k)=>[a[0]*k,a[1]*k], dot2=(a,b)=>a[0]*b[0]+a[1]*b[1], nrm2=a=>{ const l=Math.hypot(a[0],a[1])||1; return [a[0]/l,a[1]/l]; };
const Z0=20;                                    /* the sample surface above the desk */
const disk=()=>[ST.it.platform.x+30,ST.it.platform.y];
/* beam frame → world */
function W(b){ const [cx,cy]=disk(); return [cx+b[2]*1000, cy+b[0]*1000, Z0+b[1]*1000]; }
const BX=()=>disk()[0]+150;
function rect(k,x,y){ const [w,dd]=DIM[k]; return [x-w/2,y-dd/2,x+w/2,y+dd/2]; }
const overl=(a,b,m)=>a[0]<b[2]+m&&a[2]>b[0]-m&&a[1]<b[3]+m&&a[3]>b[1]-m;
function footprint(k,x,y){ const r=rect(k,x,y); if(k==="platform"&&ST.it.board.on) r[2]=Math.max(r[2],x+30+165); return r; }
function fits(k,x,y,ignore){ const r=footprint(k,x,y); if(r[0]<4||r[2]>DESK.x1-4||r[1]<4||r[3]>DESK.y1-4) return false;
  for(const o of DESKTOP){ if(o===k||o===ignore||!ST.it[o].on) continue; if(overl(r,footprint(o,ST.it[o].x,ST.it[o].y),6)) return false; } return true; }
function drawDesk(){
  const a=P(0,0,0), b=P(DESK.x1,0,0), c=P(DESK.x1,DESK.y1,0), e=P(0,DESK.y1,0);
  ctx.fillStyle="#24272d"; ctx.fillRect(0,0,LW,LH);
  poly([a,b,c,e],vgrad(a[1],e[1]-a[1],[[0,"#c9ccc8"],[1,"#dcdedb"]]),"#9a9d99",1);
  poly([e,c,[c[0],c[1]+12],[e[0],e[1]+12]],"#8f928e");
}
function drawPlatform(){
  const it=ST.it.platform, [cx,cy]=disk();
  rbox(it.x,it.y,0,320,210,10,0,"#121417","#08090a","#3a4046");
  /* the fixed angular scale printed round the disk, and the disk itself */
  const ring=(r,z)=>{ const pts=[]; for(let i=0;i<=60;i++){ const a=i/60*2*Math.PI; pts.push(P(cx+Math.cos(a)*r,cy+Math.sin(a)*r,z)); } return pts; };
  poly(ring(84,10.2),"#e9eef1","#7c848c",0.8);
  ctx.strokeStyle="#333"; ctx.lineWidth=0.7; for(let dgr=0;dgr<360;dgr+=10){ const a=dgr*Math.PI/180, p=P(cx-Math.cos(a)*84,cy-Math.sin(a)*84,10.2), q=P(cx-Math.cos(a)*76,cy-Math.sin(a)*76,10.2); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); }
  poly(ring(72,16),"rgba(225,235,242,.85)","#8c969e",0.8);
  const ar=(ST.phi+180)*Math.PI/180, tip=P(cx+Math.cos(ar)*70,cy+Math.sin(ar)*70,16.2), tl=P(cx+Math.cos(ar+0.12)*58,cy+Math.sin(ar+0.12)*58,16.2), tr=P(cx+Math.cos(ar-0.12)*58,cy+Math.sin(ar-0.12)*58,16.2); poly([tip,tl,tr],"#c42a22");
  /* the square marking and the sample */
  const sq=(h,z,a)=>{ const c=Math.cos(a), s=Math.sin(a); return [[-h,-h],[h,-h],[h,h],[-h,h]].map(([u,v])=>P(cx+u*c-v*s,cy+u*s+v*c,z)); };
  const pa=ST.phi*Math.PI/180;
  poly(sq(10,16.1,pa),null,"#555",0.6);
  if(ST.sample){ poly(sq(10,Z0-0.5,pa),"#2a2d31","#111",0.6); const n=sampleNo(); poly(sq(7.5,Z0,pa),n===1?"#dfe8ee":n===3?"#c8cfd8":"#b6bcc2","#666",0.5); }
  /* the angle bar under the board */
  if(ST.it.board.on){ const x=BX(); rbox(x+4,cy,0,8,220,Z0,0,"#cfd4d8","#a9afb5","#6c7279"); }
}
function drawHolder(){
  const [cx,cy]=disk(), x=cx-PH.L0*1000-38, y=cy+xL()*1000, h=Z0+yL()*1000;
  rbox(x,cy,10,40,40,8,0,"#8f969c","#6c7279","#444");
  vcyl(x-14,cy,18,Z0+105,4.5,"#c3c8cd","#e4e7ea","#666");
  rbox(x,y,h-14,34,30,28,0,"#9aa0a6","#7d848a","#555");
  for(const [kx,ky,kz] of [[-17,0,h],[0,16,h+6],[0,-16,h-6],[12,22,14]]){ const q=P(x+kx,y+ky,kz); circ(q[0],q[1],6,"#1b1c1f","#000"); }
  if(ST.it.laser.on){ const t=tau(), ps=psi(), back=[x-28,y], front=[cx-PH.L0*1000+xL()*1000*0,cy+xL()*1000];
    const a=P(x-30,y,h+30*Math.tan(t)), b=P(front[0],front[1],h); ctx.strokeStyle="#16181b"; ctx.lineWidth=12*SC; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.strokeStyle="#e0c23a"; ctx.lineWidth=12*SC; ctx.lineCap="butt"; const m=P(x-12,y,h+12*Math.tan(t)), m2=P(x-4,y,h+4*Math.tan(t)); ctx.beginPath(); ctx.moveTo(m[0],m[1]); ctx.lineTo(m2[0],m2[1]); ctx.stroke();
    if(ST.it.pinhole.on){ const q=P(front[0]+3,front[1],h); circ(q[0],q[1],5,"#222","#000"); circ(q[0],q[1],1.5,laserLive()?"#ff3b2c":"#444"); }
    else { const q=P(front[0]+1,front[1],h); circ(q[0],q[1],3,laserLive()?"#ff3b2c":"#5a1612"); } }
}
function drawBattery(){ const it=ST.it.battery; rbox(it.x,it.y,0,60,30,25,0,"#15171a","#0d0e10","#42464b");
  const s=P(it.x+18,it.y-4,25); fillR(s[0]-6,s[1]-4,12,8,2,"#333","#000"); fillR(s[0]+(ST.sw?0:-6),s[1]-3,6,6,1,ST.sw?"#e0e0e0":"#888");
  if(ST.it.laser.on){ const [cx,cy]=disk(), a=P(it.x-30,it.y,12), b=P(cx-PH.L0*1000-70,cy,Z0+yL()*1000+30*Math.tan(tau())); ctx.strokeStyle="#111"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.bezierCurveTo(a[0]-60,a[1]+40,b[0]-80,b[1]+40,b[0],b[1]); ctx.stroke(); } }
function drawBoard(){
  const [cx,cy]=disk(), x=BX(), q=(Y,Zz)=>P(x,cy+Y,Z0+Zz);
  poly([q(-115,-12),q(115,-12),q(115,262),q(-115,262)],"#141619","#000",1);
  fillR(...(()=>{ const a=q(-30,262), b=q(30,248); return [a[0],a[1]-6,b[0]-a[0]+8,12,3]; })(),"#b9bec3","#666");
  if(ST.sheet){ const g=ST.sheet.startsWith("graph"), col=g?"#eef6ef":"#f7f7f3"; poly([q(-105,0),q(105,0),q(105,240),q(-105,240)],col,"#999",0.6);
    if(g){ ctx.strokeStyle="rgba(120,180,130,.5)"; ctx.lineWidth=0.5; for(let Y=-100;Y<=100;Y+=10){ const a=q(Y,0), b=q(Y,240); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } for(let Zz=0;Zz<=240;Zz+=10){ const a=q(-105,Zz), b=q(105,Zz); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } }
    if(ST.sheet==="align"){ const s=q(0,PH.h0*1000); ell(s[0],s[1],3,3,null,"#1b4d8a",1.2); }
    for(const [mx,my] of ST.marks[ST.sheet]){ const s=q(mx*10,my*10); ctx.strokeStyle="#1560c0"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(s[0]-3,s[1]); ctx.lineTo(s[0]+3,s[1]); ctx.moveTo(s[0],s[1]-3); ctx.lineTo(s[0],s[1]+3); ctx.stroke(); } }
  if(PAT&&boardReady()) for(const [X,Y,b] of PAT.dots){ if(Y<-0.012||Y>0.26||Math.abs(X)>0.115) continue; const s=q(X*1000,Y*1000); circ(s[0],s[1],1.4+1.2*b,"rgba(255,40,30,"+(0.35+0.6*b)+")"); }
  if(PAT&&boardReady()) for(const a of PAT.arcs){ ctx.strokeStyle="rgba(255,50,40,.55)"; ctx.lineWidth=1.6; ctx.beginPath(); a.forEach(([X,Y],i)=>{ const s=q(Math.max(-115,Math.min(115,X*1000)),Math.max(-12,Math.min(262,Y*1000))); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }); ctx.stroke(); }
  if(!ST.it.screws.on){ const s=q(0,120); text(d().lab.loose,s[0],s[1],"#f0a79f",11,"center","700"); }
  else for(const Y of [-90,0,90]){ const s=q(Y,-6); circ(s[0],s[1],2.2,"#c9ced3"); }
}
function drawBeam(){
  if(!PAT||!ST.it.laser.on) return; const [cx,cy]=disk();
  const A=W([xL(),yL(),-PH.L0]), hit=PAT.hit; if(!hit) return; const Hw=W(hit), pa=P(...A), ph=P(...Hw);
  ctx.save(); ctx.strokeStyle="rgba(255,40,30,.85)"; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(ph[0],ph[1]); ctx.stroke();
  circ(ph[0],ph[1],2.5,"#ff3b2c");
  if(boardReady()&&PAT.dots.length){ const z=PAT.dots.reduce((a,b)=>b[2]>a[2]?b:a), e=P(BX(),cy+z[0]*1000,Z0+z[1]*1000); ctx.strokeStyle="rgba(255,40,30,.45)"; ctx.beginPath(); ctx.moveTo(ph[0],ph[1]); ctx.lineTo(e[0],e[1]); ctx.stroke(); }
  ctx.restore();
}
function drawLoose(k){ const it=ST.it[k];
  if(k==="box"){ rbox(it.x,it.y,0,80,80,22,0,"rgba(230,235,238,.6)","rgba(190,198,204,.7)","#888"); rbox(it.x,it.y,2,70,70,16,0,"#16181b","#0d0e10",null); const c=P(it.x,it.y,22); fillR(c[0]-24,c[1]-5,48,10,1,"#fff"); text("Sample Box",c[0],c[1],"#c42a22",7,"center","700"); }
  else if(k==="lamp"){ rbox(it.x,it.y,0,60,60,14,0,"#f4f4f4","#cccccc","#888"); vcyl(it.x,it.y,14,150,3,"#c9ced3","#ddd","#888"); const h=P(it.x+25,it.y,150); ell(h[0],h[1],16,8,"#f4f4f4","#888"); }
  else if(k==="ruler") rbox(it.x,it.y,0,310,30,2,0,"rgba(235,240,245,.8)","#bbb","#888");
  else if(k==="driver"){ rbox(it.x-25,it.y,0,50,14,12,0,"#f2c21a","#c99e10","#7a6300"); rbox(it.x+30,it.y,3,60,4,4,0,"#c9ced3","#999",null); }
  else if(SHEETS.includes(k)){ const g=k.startsWith("graph"); poly([P(it.x-60,it.y-40,0.5),P(it.x+60,it.y-40,0.5),P(it.x+60,it.y+40,0.5),P(it.x-60,it.y+40,0.5)],g?"#eef6ef":"#f7f7f3","#999",0.6); const c=P(it.x,it.y,1); text(itemName(k),c[0],c[1],"#555",9,"center"); }
}
function drawBench(){
  drawDesk(); optics();
  const list=[];
  for(const k of ["platform","battery","box","lamp","ruler","driver"]) if(ST.it[k].on) list.push([ST.it[k].y+DIM[k][1]/2,k==="platform"?()=>{ drawPlatform(); drawHolder(); if(ST.it.board.on) drawBoard(); }:k==="battery"?drawBattery:()=>drawLoose(k)]);
  for(const k of SHEETS) if(ST.it[k].on&&ST.sheet!==k) list.push([ST.it[k].y+40,()=>drawLoose(k)]);
  list.sort((a,b)=>a[0]-b[0]); for(const [,fn] of list) fn();
  drawBeam(); drawGhost();

  for(let dg=Math.floor(ST.phi)-8;dg<=Math.ceil(ST.phi)+8;dg++){ const x=lx+(dg-ST.phi)*zz, L=dg%10===0?LR*0.5:dg%5===0?LR*0.36:LR*0.24; ctx.strokeStyle="#222"; ctx.lineWidth=dg%10===0?2:1.2; ctx.beginPath(); ctx.moveTo(x,ly-LR); ctx.lineTo(x,ly-LR+L); ctx.stroke();
    if(dg%5===0) text(String(((dg%360)+360)%360),x,ly-LR+L+12,"#222",13,"center","700"); }
  poly([[lx,ly-4],[lx-10,ly+30],[lx+10,ly+30]],"#c42a22"); ctx.restore();
}
/* ── the sample box ── */
const BOX_HIT=[];
function drawBoxView(){
  const t=d(); BOX_HIT.length=0; if(!ST.it.box.on){ text(t.lab.noBox,CLW/2,CLH/2,"#69717a",13,"center"); return; }
  fillR(14,14,CLW-28,CLH-28,8,"#16181b","#888",1.4);
  const w=(CLW-60)/5;
  SAMPLES.forEach((k,i)=>{ const x=30+i*w, y=CLH*0.22, s=Math.min(w-20,CLH*0.42), here=ST.sample!==k&&!inHand(k);
    fillR(x,y,s,s,4,here?"#2a2d31":"rgba(42,45,49,.25)","#555"); if(here){ fillR(x+s*0.12,y+s*0.12,s*0.76,s*0.76,0,i===0?"#dfe8ee":"#b6bcc2","#666"); poly([[x,y+s/2-6],[x+10,y+s/2],[x,y+s/2+6]],"#e8eef2"); }
    text(String(i+1),x+s/2,y+s+16,"#e8eef2",14,"center","700"); text(t.smp[k],x+s/2,y+s+34,"#9aa3ab",10,"center");
    BOX_HIT.push([k,x,y,s,s]); });
}
/* ── Figure 16 ── */
const RV={zoom:1,px:0};
function drawRheed(){
  const PP=96*RV.zoom, x0=CLW/2+RV.px, top=20, h=CLH*0.55;
  ctx.fillStyle="#050505"; ctx.fillRect(10,top,CLW-20,h);
  const dx=PH.dxR*100*PP, n=Math.ceil(CLW/dx)+2;
  for(let k=-n;k<=n;k++){ const px=x0+k*dx; if(px<12||px>CLW-12) continue; const amp=Math.exp(-((k/5)**2));
    for(let j=0;j<6;j++){ const g=Math.round(230*amp*Math.exp(-((j/2.4)**2))); if(g<6) continue; ctx.strokeStyle="rgb("+g+","+g+","+g+")"; for(const sg of j?[1,-1]:[1]){ ctx.beginPath(); ctx.moveTo(px+sg*j*RV.zoom,top+10); ctx.lineTo(px+sg*j*RV.zoom,top+h-6); ctx.stroke(); } } }
  const ry=top+h+12, x00=x0-((CLW/2-40)); ctx.fillStyle="#efe9dc"; ctx.fillRect(10,ry,CLW-20,70); ctx.strokeStyle="#b9b2a3"; ctx.strokeRect(10,ry,CLW-20,70);
  const start=x0-Math.floor((x0-14)/PP)*PP;
  for(let k=0;;k++){ const px=start+k*PP/10; if(px>CLW-12) break; const idx=Math.round((px-x0)/(PP/10)); const L=idx%10===0?26:idx%5===0?17:10; ctx.strokeStyle="#1b1b1b"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(px,ry); ctx.lineTo(px,ry+L); ctx.stroke(); if(idx%10===0) text(String(Math.round(idx/10)),px,ry+42,"#1b1b1b",15,"center","700"); }
  text("cm",CLW-30,ry+58,"#1b1b1b",11,"center");
}
function drawClose(){
  const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CLW,CLH);
  ({board:drawBoardView,holder:drawHolderView,disk:drawDiskView,box:drawBoxView,rheed:drawRheed})[tab]();
  ctx=old;
}

/* ══════════════════════════════════════════════════════════════
   7.  HANDS
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const inB=(b,p)=>b&&p[0]>=b[0]&&p[0]<=b[2]&&p[1]>=b[1]&&p[1]<=b[3];
function itemAt(p){ for(const k of ["laser","board","battery","box","lamp","driver","ruler",...SHEETS.filter(s=>ST.sheet!==s),"platform"]) if(inB(bbox(k),p)) return k; return null; }
function returnItem(k){
  if(k==="platform"){ for(const q of ["board","laser"]) if(ST.it[q].on) returnItem(q); if(ST.sample) returnSample(); }
  if(k==="board"){ if(ST.it.screws.on) ST.it.screws.on=false; if(ST.sheet) unstick(); }
  if(k==="laser"){ if(ST.it.pinhole.on) ST.it.pinhole.on=false; ST.sw=false; }
  if(k==="battery") ST.sw=false;
  ST.it[k].on=false; say("back",itemName(k));
}
function unstick(){ const k=ST.sheet; ST.sheet=null; const it=ST.it[k]; it.on=false; say("sheetOff",itemName(k)); }
function returnSample(){ const k=ST.sample; ST.sample=null; say("sampleOff",itemName(k)); }
function place(k,p){
  const it=ST.it[k], mv=hand&&hand.move, over=itemAt(p), onPlat=over==="platform"||over==="board"||over==="laser";
  if(k==="board"){ if(!ST.it.platform.on||!onPlat){ say("needPlat"); return false; } it.on=true; say("onPlat",itemName(k)); return true; }
  if(k==="laser"){ if(!ST.it.platform.on||!onPlat){ say("needPlat"); return false; } it.on=true; say("onPlat",itemName(k)); if(ST.it.battery.on) setTimeout(()=>say("connected"),900); return true; }
  if(k==="screws"){ if(!ST.it.board.on||over!=="board"){ say("needBoard"); return false; } it.on=true; say("screwed"); return true; }
  if(k==="pinhole"){ if(!ST.it.laser.on||over!=="laser"){ say("needLaser"); return false; } it.on=true; say("pinOn"); return true; }
  if(SAMPLES.includes(k)){ if(!ST.it.platform.on){ say("needPlat"); return false; } if(!inB(bbox("disk"),p)&&over!=="platform"){ say("noFit"); return false; } return putSample(k); }
  if(SHEETS.includes(k)&&over==="board"){ if(ST.sheet) unstick(); ST.sheet=k; it.on=true; say("sheetOn",itemName(k)); return true; }
  const [x,y]=unP(p[0],p[1],0);
  if(DIM[k]){ if(!fits(k,x,y,mv?k:null)){ say("noFit"); return false; } }
  else if(x<60||x>DESK.x1-60||y<40||y>DESK.y1-40){ say("noFit"); return false; }
  it.x=x; it.y=y; it.on=true; if(k==="battery"&&ST.it.laser.on) say("connected"); else say("placed",itemName(k)); return true;
}
function putSample(k){ if(ST.sample){ say("diskBusy"); return false; } const a=((ST.phi+180)%360+360)%360-180; if(Math.abs(a)>0.5){ say("notZero"); return false; } ST.sample=k; say("sampleOn",itemName(k)); return true; }
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move){ Object.assign(ST.it[hand.item],hand.orig); say("stays"); } else say("back",itemName(hand.item)); hand=null; return; }
    if(place(hand.item,p)) hand=null; return; }
  const k=itemAt(p);
  if(right){ if(k==="board"&&ST.sheet){ unstick(); return; } if(k==="platform"&&ST.sample&&inB(bbox("disk"),p)){ returnSample(); return; } if(k) returnItem(k); return; }
  if(!k) return;
  if(k==="battery"){ ST.sw=!ST.sw; say("sw",ST.sw); return; }
  if(k==="board"){ setTab("board"); return; }
  if(k==="laser"){ setTab("holder"); return; }
  if(k==="platform"&&inB(bbox("disk"),p)){ setTab("disk"); return; }
  if(k==="box"){ setTab("box"); return; }
  if(!DIM[k]&&!SHEETS.includes(k)) return;
  hand={item:k,move:true,orig:{...ST.it[k]}}; ST.it[k].on=false; say("moveIt",itemName(k));
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ if(hand.move) Object.assign(ST.it[hand.item],hand.orig); hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ if(hand.move) Object.assign(ST.it[hand.item],hand.orig); hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [g,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&!hand.move&&(GROUP[g]||[g]).includes(hand.item); if(hand&&hand.move) Object.assign(ST.it[hand.item],hand.orig); hand=null;
    if(!same&&trayAvail(g)){ const k=freeOf(g)[0]; hand={item:k}; say("picked",itemName(k)); }
    drawTray(); return; } });

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
let bvDrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2;
  if(tab==="board"&&ST.it.board.on){ const m=bvMap();
    if(right){ if(!ST.sheet) return; const L=ST.marks[ST.sheet]; let bi=-1, bd=10; L.forEach(([x,y],i)=>{ const dd=Math.hypot(m.X(x)-p[0],m.Y(y)-p[1]); if(dd<bd){ bd=dd; bi=i; } }); if(bi>=0){ L.splice(bi,1); say("unmark"); } return; }
    bvDrag={x:p[0],y:p[1],px:BV.px,py:BV.py,moved:false}; return; }
  if(tab==="disk"&&CL.disk){ const {cx,cy,R}=CL.disk; if(Math.hypot(p[0]-cx,p[1]-cy)<R*0.9){
      if(hand&&SAMPLES.includes(hand.item)){ if(putSample(hand.item)) hand=null; drawTray(); return; }
      if(right&&ST.sample){ returnSample(); return; }
      diskDrag={a:Math.atan2(p[1]-cy,p[0]-cx),phi:ST.phi}; } return; }
  if(tab==="box"){ for(const [k,x,y,w,h] of BOX_HIT) if(p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h){ if(ST.sample===k) return; if(hand&&hand.item===k){ hand=null; return; } hand={item:k}; say("picked",itemName(k)); return; } }
  if(tab==="rheed"){ bvDrag={rx:p[0],px:RV.px}; }
});
closeCv.addEventListener("pointermove",e=>{ const p=clpos(e);
  if(tab==="board"){ const m=bvMap(); hoverXY=[Math.round(m.x(p[0])*20)/20,Math.round(m.y(p[1])*20)/20]; }
  if(bvDrag&&bvDrag.rx!==undefined){ RV.px=bvDrag.px+p[0]-bvDrag.rx; return; }
  if(bvDrag){ const dx=p[0]-bvDrag.x, dy=p[1]-bvDrag.y; if(Math.hypot(dx,dy)>3) bvDrag.moved=true; if(bvDrag.moved){ BV.px=bvDrag.px+dx; BV.py=bvDrag.py+dy; } }
  if(diskDrag&&CL.disk){ const {cx,cy}=CL.disk, a=Math.atan2(p[1]-cy,p[0]-cx); ST.phi=((diskDrag.phi+(a-diskDrag.a)*180/Math.PI)%360+360)%360; } });
closeCv.addEventListener("pointerleave",()=>{ hoverXY=null; });
window.addEventListener("pointerup",e=>{ if(tab==="board"&&bvDrag&&bvDrag.x!==undefined&&!bvDrag.moved&&e.button===0&&e.target===closeCv&&ST.sheet){ const p=clpos(e), m=bvMap(), x=Math.round(m.x(p[0])*20)/20, y=Math.round(m.y(p[1])*20)/20;
    if(Math.abs(x)<=10.5&&y>=0&&y<=24){ ST.marks[ST.sheet].push([x,y]); say("mark"); } } bvDrag=null; diskDrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), dir=e.deltaY<0?1:-1; e.preventDefault();
  if(tab==="board"){ const m=bvMap(), z0=m.z; BV.zoom=Math.max(m.z0,Math.min(120,BV.zoom*(dir>0?1.2:1/1.2))); const cx=CLW/2+BV.px, cy=CLH/2+BV.py; BV.px+=(p[0]-cx)*(1-BV.zoom/z0); BV.py+=(p[1]-cy)*(1-BV.zoom/z0); if(BV.zoom<=m.z0+1e-6){ BV.px=0; BV.py=0; } return; }
  if(tab==="holder"){ for(const [k,x,y,r] of KNOB) if(Math.hypot(p[0]-x,p[1]-y)<r){ const fine=e.shiftKey;
      if(k==="ap"){ ST.ap=Math.max(0.4,Math.min(4,+(ST.ap-dir*(fine?0.02:0.1)).toFixed(3))); return; }
      const step={A:fine?0.02:0.2,B:fine?0.01:0.1,C:fine?0.02:0.2,D:fine?0.01:0.1}[k], lim={A:[0,80],B:[0,60],C:[0,50],D:[0,50]}[k];
      ST.scr[k]=Math.max(lim[0],Math.min(lim[1],+(ST.scr[k]+dir*step).toFixed(3))); return; } return; }
  if(tab==="disk"&&CL.disk){ ST.phi=((ST.phi+dir*(e.shiftKey?0.1:1))%360+360)%360; ST.phi=+ST.phi.toFixed(2); return; }
  if(tab==="rheed"){ const z0=RV.zoom; RV.zoom=Math.max(0.6,Math.min(4,RV.zoom*(dir>0?1.2:1/1.2))); RV.px*=RV.zoom/z0; }
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("swBtn").onclick=()=>{ if(!ST.it.battery.on){ say("noBattery"); return; } ST.sw=!ST.sw; say("sw",ST.sw); };
$("markClr").onclick=()=>{ if(ST.sheet){ ST.marks[ST.sheet]=[]; say("marksClr"); } };
$("noteBtn").onclick=()=>{ const t=d(), parts=[];
  if(ST.sample) parts.push(itemName(ST.sample)); if(ST.sheet) parts.push(itemName(ST.sheet)+": "+ST.marks[ST.sheet].map(([x,y])=>"("+x.toFixed(2)+", "+y.toFixed(2)+")").join(" "));
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(laserLive()) L.push([t.st.laserOn,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
  $("swBtn").textContent=ST.sw?t.swOff:t.swOn;
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-laser").textContent=t.hLaser; $("t-laserhint").textContent=t.laserHint;
  $("t-h-sheet").textContent=t.hSheet; $("markClr").textContent=t.markClr; $("t-sheethint").textContent=t.sheetHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2016 E1 — 1차원 구조의 반사 광학 회절 무늬 · HaslaLab":"APhO 2016 E1 — Reflected Optical Diffraction Patterns · HaslaLab";
  renderTabs(); renderNotes(); renderStatus(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0;
function tick(){
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ BV.zoom=0; layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
