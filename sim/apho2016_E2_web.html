<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,

  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;

  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}

  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}

/* ══════════════════════════════════════════════════════════════
   1.  HIDDEN TRUTH: the etalon, the platform's small misalignments
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const PH={LAM:650e-9, L:U(3.40e-6,4.60e-6), phiSn:U(-0.85,-0.15), alpha:U(0.5,1.5), v0:U(2,6), p0:U(-1.6,1.6), q0:U(-1.6,1.6), lat0:U(-2,2), id:101+Math.floor(Math.random()*299), nseed:Math.floor(Math.random()*1e6)};
PH.v1=PH.v0-11; PH.phiS=2*Math.PI*PH.phiSn;
const thetaActual=th=>Math.abs(th+PH.alpha);
/* two-beam interference, Equation (1) of the problem */
function rawSignal(th){ const c=Math.cos(thetaActual(th)*Math.PI/180), k=2*Math.PI/PH.LAM, V0=419.5+23.2*(0.996-c), A=7.6+3.0*(0.996-c); return [V0,A*Math.cos(2*k*PH.L*c+PH.phiS)]; }
/* millivolts across the detector's resistor */
function detectorMV(th,det,ev,p,q,lat,spot,on){
  if(!on) return 0.4;
  const [V0,mod]=rawSignal(th), tha=thetaActual(th)*Math.PI/180;
  const dd=Math.abs(det-(2*th+PH.alpha)), fDet=dd<=3.5?1:dd>=11?0:Math.cos(Math.PI/2*(dd-3.5)/7.5)**2;
  const fLat=Math.exp(-(((lat-PH.lat0)/1.7)**2));
  const walk=2*Math.hypot(p-PH.p0,q-PH.q0)*Math.sin(tha), fAx=Math.exp(-((walk/2.8)**2));
  const fAp=spot<=1.2?1:Math.exp(-(((spot-1.2)/1.6)**2));
  const w=Math.max(Math.exp(-(((ev-PH.v0)/3.2)**4)),Math.exp(-(((ev-PH.v1)/3.2)**4)));
  let v=(w*(V0+mod)+(1-w)*0.24*V0)*fDet*fLat*fAx*fAp+1.6;
  const h=(Math.round(th*10)*7919+PH.nseed)&0xFFFF; v+=((h*2654435761)%1000/1000-0.5)*0.8;
  return v;
}
/* straight through, no sample: the bare beam on the detector */
function directMV(det,lat,spot,on){ if(!on) return 0.4; const dd=Math.abs(det-180), f=dd<=1.5?1:dd>=6?0:Math.cos(Math.PI/2*(dd-1.5)/4.5)**2;
  return 1650*f*Math.exp(-(((lat-PH.lat0)/1.7)**2))*(spot<=1.2?1:Math.exp(-(((spot-1.2)/1.6)**2)))+1.6; }

/* ══════════════════════════════════════════════════════════════
   2.  STATE
   ══════════════════════════════════════════════════════════════ */
const DESKTOP=["platform","battery","meter","box","lamp","driver","leads"], ATTACH=["laser","capscrews","holder","etalon"];
const ITEMS=[...DESKTOP,...ATTACH];
const DIM={platform:[320,240,10],battery:[60,30,25],meter:[90,170,40],box:[80,80,22],lamp:[60,60,160],driver:[110,14,10],leads:[80,40,6]};
const ST={ it:Object.fromEntries(ITEMS.map(k=>[k,{on:false,x:0,y:0}])),
  scr:{C:25,V:25,P:25,Q:25}, ap:2.4, sw:false, th:0, det:180, rng:0, wires:[], pend:null, notes:[], disp:"", dt:0 };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const itemName=k=>d().items[k]||k;
const latMM=()=>(ST.scr.C-25)*0.25, evMM=()=>(ST.scr.V-25)*0.5, pMM=()=>(ST.scr.P-25)*0.2, qMM=()=>(ST.scr.Q-25)*0.2;
const laserLive=()=>ST.it.laser.on&&ST.it.battery.on&&ST.sw;
const RANGES=[["OFF",null],["200m",0.2],["2",2.0],["20",20.0]];
/* the polarity of the leads: +1, −1 or 0 when not wired as a voltmeter */
function polarity(){ const has=(a,b)=>ST.wires.some(w=>(w[0]===a&&w[1]===b)||(w[0]===b&&w[1]===a));
  if(has("DET+","M.V")&&has("DET-","M.COM")) return 1; if(has("DET-","M.V")&&has("DET+","M.COM")) return -1; return 0; }
function volts(){
  if(!ST.it.platform.on||!ST.it.laser.on) return null;
  const on=laserLive();
  let mv;
  if(ST.it.holder.on&&ST.it.etalon.on) mv=detectorMV(ST.th,ST.det,evMM(),pMM(),qMM(),latMM(),ST.ap,on);
  else if(ST.it.holder.on) mv=on?1.6+0.3:0.4;                      /* the holder's wall blocks the straight beam */
  else mv=directMV(ST.det,latMM(),ST.ap,on);
  return mv/1000;
}
function meterText(){ const [nm,full]=RANGES[ST.rng]; if(full===null||!ST.it.meter.on) return ""; const pol=polarity(); let v=pol?(volts()??0)*pol:0;
  v+=(Math.random()-0.5)*0.00002; if(Math.abs(v)>full) return (v<0?"-":"")+"1   "; if(full===0.2) return (v*1000).toFixed(1); if(full===2) return v.toFixed(3); return v.toFixed(2); }

/* ══════════════════════════════════════════════════════════════

function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e);
  if(tab==="disk"){ const w=diskPart(p); if(w) dDrag={w,a:ang(p),v:w==="disk"?ST.th:ST.det}; return; }
  if(tab==="meter"&&CL.meter){ const {x,y,s}=CL.meter, u=(p[0]-x)/s, v=(p[1]-y)/s; if(Math.hypot(u-55,v-105)<44){ ST.rng=(ST.rng+(e.button===2?3:1))%4; ST.dt=0; say("range",RANGES[ST.rng][0]); } } });
closeCv.addEventListener("pointermove",e=>{ if(!dDrag) return; const p=clpos(e); let dv=ang(p)-dDrag.a; dv=((dv+540)%360)-180; const v=+(dDrag.v+dv).toFixed(1);
  if(dDrag.w==="disk") ST.th=Math.max(-85,Math.min(85,((v+540)%360)-180)); else ST.det=((v%360)+360)%360; });
window.addEventListener("pointerup",()=>{ dDrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), dir=e.deltaY<0?1:-1, fine=e.shiftKey; e.preventDefault();
  if(tab==="disk"){ const w=diskPart(p); if(w==="disk") ST.th=Math.max(-85,Math.min(85,+(ST.th+dir*(fine?0.1:0.5)).toFixed(2))); else if(w==="det") ST.det=(((ST.det+dir*(fine?0.1:0.5))%360)+360)%360; return; }
  if(tab==="etalon"){ if(EHIT.et){ const [x,y,w,h]=EHIT.et; if(p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h){ ST.scr.V=Math.max(0,Math.min(50,+(ST.scr.V+dir*(fine?0.05:0.4)).toFixed(3))); return; } }
    for(const nm of ["P","Q"]){ const h=EHIT[nm]; if(h&&Math.hypot(p[0]-h[0],p[1]-h[1])<h[2]+4){ ST.scr[nm]=Math.max(0,Math.min(50,+(ST.scr[nm]+dir*(fine?0.05:0.4)).toFixed(3))); return; } } return; }
  if(tab==="holder"){ for(const [k,x,y,r] of KNOB) if(Math.hypot(p[0]-x,p[1]-y)<r){ if(k==="ap") ST.ap=Math.max(0.4,Math.min(4,+(ST.ap-dir*(fine?0.02:0.1)).toFixed(3))); else ST.scr.C=Math.max(0,Math.min(50,+(ST.scr.C+dir*(fine?0.05:0.4)).toFixed(3))); return; } return; }
  if(tab==="meter"&&CL.meter){ ST.rng=Math.max(0,Math.min(3,ST.rng+(dir>0?1:-1))); ST.dt=0; }
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("swBtn").onclick=()=>{ if(!ST.it.battery.on){ say("noBattery"); return; } ST.sw=!ST.sw; say("sw",ST.sw); };
$("wClear").onclick=()=>{ ST.wires=[]; ST.pend=null; say("cleared"); };
$("noteBtn").onclick=()=>{ ST.notes.push((lang==="ko"?"원판 눈금 ":"disk scale ")+ST.th.toFixed(1)+"° · "+(lang==="ko"?"검출기 ":"detector ")+ST.det.toFixed(1)+"° · "+(ST.disp||"—")+" "+(RANGES[ST.rng][1]===0.2?"mV":RANGES[ST.rng][1]?"V":"")); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; } box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){ const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]); if(hand) L.push([t.st.hand(itemName(hand.item)),false]); if(ST.pend) L.push([t.st.pend(termLabel(ST.pend)),false]); if(laserLive()) L.push([t.st.laserOn,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML=""; for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); } $("swBtn").textContent=ST.sw?t.swOff:t.swOn; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle; $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-laser").textContent=t.hLaser; $("t-laserhint").textContent=t.laserHint; $("t-h-wire").textContent=t.hWire; $("wClear").textContent=t.clear; $("t-wirehint").textContent=t.wireHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2016 E2 — 금속의 반사 위상 변화 · HaslaLab":"APhO 2016 E2 — Reflection Phase Shift of Metal · HaslaLab"; renderTabs(); renderNotes(); renderStatus(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); }; $("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){ const now=performance.now()/1000, dt=Math.min(0.25,Math.max(0,now-tPrev)); tPrev=now;
  ST.dt-=dt; if(ST.dt<=0){ ST.disp=meterText(); ST.dt=0.45; }
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose(); if(frameN%6===0){ renderStatus(); drawTray(); } requestAnimationFrame(tick); }
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
