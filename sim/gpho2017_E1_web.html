<script>
"use strict";
/* ====================================================================
   GPhO 2017 (Riyadh) - Experimental Problem E1
   ELECTRIC GUITAR

   A steel guitar string on a stand: tensioned over two saddles (the
   first glued to a piezo pickup, its signal amplified to S+ / S-), then
   pushed up by a screw tensioner between two pins.  A 5 V USB supply
   between A and the string, a set of resistors, an AX-100 and an
   AX-MS811 multimeter, nine test leads and a measuring tape.

   Nothing is computed for you.  The meters show what meters show; the
   tape is read by eye; the turns of the tensioner are counted by eye.

   The model is fitted to the official solution: l1 = 674 mm of string
   under tension (b = 504 mm between the saddles), d = 0.195 mm,
   rho = 1.89e-7 Ohm m, Lambda = 0.247 g/m, unstretched length about
   672.75 mm, f from about 200 Hz untensioned to about 370 Hz after 16
   turns, R between the saddles 3.20 Ohm at room temperature, the string
   reaching about 200 C when A and B are joined straight.
   ==================================================================== */

/* ------------------------- language ------------------------------- */
const I18N = {

           "가상 실험실 · 나사로 강철 줄을 조이고 퉁겨 S+ / S−에 물린 작은 멀티미터로 진동수를 읽고, 4단자 회로로 저항을 재며 5 V 전원으로 줄을 가열합니다. 회전 수와 줄자 눈금은 직접 읽으세요."],
  tray:   ["Parts box", "부품함"],
  vt3d:   ["3D bench", "3D 실험대"], vtstand: ["stand, front", "스탠드 정면"], vtmeters: ["meters", "멀티미터"], vtphoto: ["photo ×100", "사진 ×100"],
  cap_3d: ["the bench in 3D — drag to turn, right-drag to pan, wheel to zoom · click the string between the saddles to pluck it · wheel (or drag) over the knob under the stand turns the screw · click a terminal, then another, to run a test lead (a lead can also be clipped onto the string or the bar) · click the stand, a meter or the photo to look close · R-click: back / let go",

              "스탠드 정면 — 줄자는 끌어서 옮기고 줄자 위에서 휠로 기울이기 (Shift: 미세); 다른 곳에서 휠은 확대, 끌기는 이동 · 줄 클릭: 퉁김, 막대 클릭: 몸체에 리드 물리기 · 우클릭: 3D로"],
  cap_meters: ["the meters and the resistors — click the left or right half of a dial (or wheel over it) to turn it; the AX-MS811's keys under its display; its probes: click one, then a terminal · R-click: back to 3D",
               "멀티미터와 저항 — 다이얼의 왼쪽/오른쪽 절반을 클릭(또는 휠)해 돌리기; AX-MS811 화면 아래 버튼; 프로브는 클릭한 뒤 단자를 클릭 · 우클릭: 3D로"],
  cap_photo: ["the photo of the string, magnified 100× — lay the tape across it, wheel over the tape to tilt it, wheel elsewhere to zoom · R-click: back to 3D",
              "100배 확대한 줄 사진 — 줄자를 가로질러 놓고 읽기, 줄자 위 휠로 기울이기, 다른 곳 휠로 확대 · 우클릭: 3D로"],
  itTape: ["measuring tape (1 m)", "줄자 (1 m)"], itLead: ["test lead", "시험 리드"], itNew: ["spare string", "예비 줄"],
  tapeTake: ["click, then click where to lay it", "클릭한 뒤 놓을 곳을 클릭"], tapeOut: ["out on the bench — click to put it back", "실험대 위 — 클릭하면 부품함으로"],
  leadsLeft: ["leads left: ", "남은 리드: "],
  lgCtl: ["Controls", "조작"], lgNotes: ["Notes", "안내"],
  pluck: ["Pluck the string", "줄 퉁기기"],
  usbOn: ["5 V supply: the USB charger is plugged in", "5 V 전원: USB 충전기가 꽂혀 있음"], usbOff: ["5 V supply: the USB charger is unplugged", "5 V 전원: USB 충전기가 빠져 있음"],
  usbPlug: ["Plug in the USB charger", "USB 충전기 꽂기"], usbPull: ["Unplug the USB charger", "USB 충전기 뽑기"],
  trayHelp: ["click an item; R-click to cancel", "항목 클릭; 우클릭으로 취소"],
  holdTape: ["the tape is in your hand: click the stand (or the front view) to hold it against the stand, or the desk / photo to lay it flat", "줄자를 들고 있음: 스탠드(또는 정면 보기)를 클릭하면 스탠드에 대고, 책상·사진을 클릭하면 바닥에 놓습니다"],
  holdLead: ["a lead end is in your hand: click a terminal, the string or the bar (R-click / Esc: put it away)", "리드 끝을 들고 있음: 단자·줄·막대를 클릭 (우클릭 / Esc: 내려놓기)"],
  holdProbe: ["a probe is in your hand: click a terminal, the string or the bar (R-click: back in its holder)", "프로브를 들고 있음: 단자·줄·막대를 클릭 (우클릭: 홀더로)"],
  clear: ["Pull out all test leads", "시험 리드 모두 뽑기"], newString: ["Fit the spare string", "예비 줄로 교체"],
  sound: ["sound", "소리"],
  notes: ["• The tensioner screw rises 0.70 mm a turn; the white mark on its knob is there for counting turns.\n• The small meter reads frequency between S+ and S− only while the USB supply is plugged in; right after a pluck it may show a harmonic.\n• Do not tension the string past 400 Hz.\n• Over 200 mA, use the 10 A socket of the AX-100 (its mA socket is fused at 200 mA).\n• A lead can be clipped anywhere on the string: hold its end and click the string.",
          "• 조임 나사는 한 바퀴에 0.70 mm 올라갑니다. 손잡이의 흰 표시로 회전 수를 세세요.\n• 작은 멀티미터는 USB 전원이 꽂혀 있을 때만 S+와 S− 사이의 진동수를 읽습니다. 퉁긴 직후에는 배음을 보일 수 있습니다.\n• 400 Hz가 넘도록 줄을 조이지 마세요.\n• 200 mA가 넘으면 AX-100의 10 A 단자를 쓰세요 (mA 단자는 200 mA 퓨즈).\n• 리드 끝을 든 채 줄을 클릭하면 줄의 아무 곳에나 집게를 물릴 수 있습니다."],
  broke: ["the string snapped — it was tensioned past its limit. Fit the spare string.", "줄이 끊어졌습니다 — 한계를 넘어 조였습니다. 예비 줄로 교체하세요."],
  fuse: ["the AX-100's mA fuse has blown: more than 200 mA went through the VΩmA socket.", "AX-100의 mA 퓨즈가 끊어졌습니다: VΩmA 단자로 200 mA 넘게 흘렀습니다."],
  noLead: ["all nine test leads are in use", "시험 리드 아홉 개를 모두 쓰고 있습니다"],
  hot: ["the string is hot", "줄이 뜨겁습니다"],
};
let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
const tr = k => { const e = I18N[k]; return e ? (LANG === "ko" ? e[1] : e[0]) : k; };

/* ------------------------- randomness ----------------------------- */
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SEED = (Math.random() * 1e9) | 0, RNG = mulberry(SEED);
const gauss = () => { let u = 0, v = 0; while (!u) u = RNG(); while (!v) v = RNG(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

/* ==================================================================
   THE STRING  (cm in the 3D, SI in the physics)
   The string runs from its 0 V end over saddle 1 (the piezo), saddle 2,
   the first pin of the tensioner, the tensioner's rising post, the
   second pin, down to its other end which is joined to the stand body
   and to B.
   ================================================================== */
const BASE_Y = 4.0;                                   /* top of the stand's board */
const GEO = {E0:[8.0, BASE_Y+0.9], S1:[11.0, BASE_Y+2.2], S2:[61.4, BASE_Y+2.2], P1:[63.3, BASE_Y+1.3], TP:[67.6, BASE_Y+1.3], P2:[71.5, BASE_Y+1.3], E1:[74.9, BASE_Y+0.5]};
const TRUE = {
  d: 0.195e-3 * (1 + 0.012 * gauss()),                /* m */
  rho: 1.89e-7 * (1 + 0.02 * gauss()),                /* Ohm m at T0 */
  beta: 0.0020, Lam: 0.247e-3,                        /* 1/K, kg/m */
  E: 1.85e11 * (1 + 0.03 * gauss()),                  /* Pa */
  alpha: 1.12e-5 * (1 + 0.04 * gauss()),              /* 1/K */
  slackMM: 1.25 + 0.15 * gauss(),                     /* stretch already there with the screw right down (mm) */
  T0: 20.0 + 0.4 * gauss(),                           /* the room, C */
  g: 0.037,                                           /* heat lost per metre per kelvin, W/(m K) */
  c: 460,                                             /* J/(kg K) */
  Rint: 0.16,                                         /* the USB supply's own resistance */
  Rnom: [0.1, 1, 3, 10, 30, 100, 1000],
};
TRUE.A = Math.PI * TRUE.d * TRUE.d / 4;
TRUE.R = TRUE.Rnom.map(r => r * (1 + 0.025 * gauss()));
const H1 = 0.70;                                      /* mm per turn */
const ST = {turns: 0, T: TRUE.T0, broken: false, brokeAt: 0, usb: false, pluckT: -99, pluckAmp: 0, harm: 2, harmT: 0.5, leads: [], held: null,
  probe: {YV: null, YCOM: null}, tape: {where: "box", x: 8, y: 7.5, z: 26, ang: 0}, fuse: false, sound: true, t: 0, spare: 1};
/* the string's path, cm: [x, y] points from the 0 V end to the body end */
function pathPts(){ const dh = ST.turns * H1 / 10; return dh > 0 ? [GEO.E0, GEO.S1, GEO.S2, GEO.P1, [GEO.TP[0], GEO.TP[1] + dh], GEO.P2, GEO.E1] : [GEO.E0, GEO.S1, GEO.S2, GEO.P1, GEO.P2, GEO.E1]; }
function pathLen(pts){ let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return s; }
/* the length of path at the room temperature with the screw right down (the 674 mm of the solution) */
const L_PATH0 = (() => { const t = ST.turns; ST.turns = 0; const L = pathLen(pathPts()); ST.turns = t; return L; })();
/* the vibrating length: saddle to saddle */
const B_VIB = (GEO.S2[0] - GEO.S1[0]) / 100;
/* the unstretched length of the string at temperature T (m); the whole string carries the current, so it all warms */
const Lu = T => (L_PATH0 * 10 - TRUE.slackMM) / 1000 * (1 + TRUE.alpha * (T - TRUE.T0));
function tension(){ const L = pathLen(pathPts()) / 100, lu = Lu(ST.T); return Math.max(0, TRUE.E * TRUE.A * (L - lu) / lu); }
function fundamental(){ const F = tension(); return F <= 0 ? 0 : Math.sqrt(F / TRUE.Lam) / (2 * B_VIB); }
const F_BREAK = TRUE.Lam * Math.pow(2 * B_VIB * 432, 2);      /* about 430 Hz */
/* resistance of the whole string and of a stretch of it (path cm), at its temperature */
const rhoT = () => TRUE.rho * (1 + TRUE.beta * (ST.T - TRUE.T0));
const Rlen = cm => rhoT() * (cm / 100) / TRUE.A;
/* where along the string (path cm from the 0 V end) a point of a segment lies */
function pathAt(seg, u){ const p = pathPts(); let s = 0; for (let i = 1; i <= seg; i++) s += Math.hypot(p[i][0] - p[i-1][0], p[i][1] - p[i-1][1]);
  return s + u * Math.hypot(p[seg+1][0] - p[seg][0], p[seg+1][1] - p[seg][1]); }
function pointAt(s){ const p = pathPts(); for (let i = 1; i < p.length; i++){ const L = Math.hypot(p[i][0] - p[i-1][0], p[i][1] - p[i-1][1]);
    if (s <= L || i === p.length - 1){ const u = Math.min(1, s / L); return [p[i-1][0] + (p[i][0] - p[i-1][0]) * u, p[i-1][1] + (p[i][1] - p[i-1][1]) * u]; } s -= L; } return p[p.length - 1]; }

/* ==================================================================
   THE CIRCUIT
   Terminals: A (+5 V of the USB supply), B (= the stand body = the
   string's far end), S+ / S- (the pickup amplifier; S- is 0 V), the
   resistor posts R0a.. R6b, the meters' sockets, and clips put on the
   string anywhere ("c:<path cm>").  Leads join terminals.  The network is
   solved by nodal analysis every frame.
   ================================================================== */
const AX100_DIAL = ["OFF", "DCV 200m", "DCV 2", "DCV 20", "DCV 200", "DCV 600", "ACV 600", "ACV 200", "DCA 20µ", "DCA 200µ", "DCA 2m", "DCA 20m", "DCA 200m", "DCA 10", "→|", "Ω 200", "Ω 2k", "Ω 20k", "Ω 200k", "Ω 20M"];
const MS_DIAL = ["V⎓", "V~", "OFF", "Hz", "Ω"];          /* left to right over the top of its dial */
const METER = {ax100: {dial: 0}, ms811: {dial: 2, hold: false, held: null, rel: null, sel: 0, duty: false}};
const R_LEAD = 0.035, R_CLIP = 0.05, R_PROBE = 0.08;
const termIsClip = t => t.startsWith("c:");
const elec = t => t && t.startsWith("b:") ? "body" : t;          /* a clip on the stand's bar is the body */
const clipped = t => t.startsWith("c:") || t.startsWith("b:");
/* every terminal a lead can go to */
function termList(){ const L = ["A", "B", "Sp", "Sm", "body"]; for (let i = 0; i < 7; i++) L.push("R" + i + "a", "R" + i + "b");
  L.push("X10A", "XCOM", "XV", "YCOM", "YV"); for (const l of ST.leads) for (const e of [l.a, l.b]) if (e && termIsClip(e) && !L.includes(e)) L.push(e);
  for (const k of ["YV", "YCOM"]){ const e = ST.probe[k]; if (e && termIsClip(e) && !L.includes(e)) L.push(e); } return L; }
/* which terminals are joined by wire at all (for the meter's "is it across S+ / S-" test) */
function connect(){ const par = {}, f = x => { if (!(x in par)) par[x] = x; while (par[x] !== x){ par[x] = par[par[x]]; x = par[x]; } return x; };
  const join = (a, b) => { par[f(a)] = f(b); }; join("B", "body"); join("Sm", "GND");
  for (const l of ST.leads) if (l.b) join(elec(l.a), elec(l.b)); for (const k of ["YV", "YCOM"]) if (ST.probe[k]) join(k, elec(ST.probe[k])); return f; }
/* solve: node voltages, the power in the string, what each meter sees */
function solve(){

function trayLayout(){ const dpr = window.devicePixelRatio || 1, r = trayCv.parentElement.getBoundingClientRect();
  TRW = Math.max(150, Math.floor(r.width - 16)); trayCv.style.height = (TROW * 3 + 30) + "px"; trayCv.width = Math.round(TRW * dpr); trayCv.height = Math.round((TROW * 3 + 30) * dpr); drawTray(); }
function drawTray(){ const dpr = window.devicePixelRatio || 1, c = tctx, wd = TRW - 12;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = "#15181d"; c.fillRect(0, 0, TRW, TROW * 3 + 30);
  const row = (i, av, sel, icon, name, sub) => { const y = 6 + i * TROW; c.fillStyle = av ? "#1f242b" : "#171a1e"; c.fillRect(6, y, wd, TROW - 4);
    c.strokeStyle = sel ? "#f2c14e" : "#353b43"; c.lineWidth = 1; c.strokeRect(6.5, y + 0.5, wd - 1, TROW - 5); c.globalAlpha = av ? 1 : 0.4; icon(12, y + 8); c.globalAlpha = 1;
    c.font = '11.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign = "left"; c.textBaseline = "middle"; c.fillStyle = av ? "#e8eef2" : "#868e96"; c.fillText(name, 52, y + 13);
    c.font = '9.5px "Malgun Gothic",sans-serif'; c.fillStyle = "#69717a"; c.fillText(sub, 52, y + 29); };
  row(0, ST.tape.where === "box" || hand === "tape", hand === "tape", (x, y) => { c.fillStyle = "#2b2e33"; c.fillRect(x, y, 26, 26); c.fillStyle = "#f3cd2f"; c.fillRect(x + 20, y + 16, 14, 6); c.fillStyle = "#c4161c"; c.beginPath(); c.arc(x + 13, y + 13, 5, 0, 7); c.fill(); },
    tr("itTape"), hand === "tape" ? tr("tapeTake") : ST.tape.where === "box" ? tr("tapeTake") : tr("tapeOut"));
  const left = 9 - ST.leads.length;
  row(1, left > 0, false, (x, y) => { c.strokeStyle = "#c8262b"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, y + 4); c.bezierCurveTo(x + 30, y, x - 4, y + 26, x + 30, y + 24); c.stroke(); c.fillStyle = "#c9ced3"; c.fillRect(x - 2, y + 1, 5, 6); },
    tr("itLead"), tr("leadsLeft") + left + " / 9");
  row(2, ST.spare > 0, false, (x, y) => { c.strokeStyle = "#d6d9dc"; c.lineWidth = 1.2; for (let r = 4; r < 13; r += 2.2){ c.beginPath(); c.arc(x + 14, y + 13, r, 0, 7); c.stroke(); } },
    tr("itNew"), ST.spare > 0 ? (ST.broken ? tr("newString") : "×1") : "—");
  c.font = '10px "Malgun Gothic",sans-serif'; c.textAlign = "center"; c.textBaseline = "top"; c.fillStyle = "#69717a"; c.fillText(tr("trayHelp"), TRW / 2, TROW * 3 + 10); }
trayCv.addEventListener("contextmenu", e => { e.preventDefault(); hand = null; drawTray(); });
trayCv.addEventListener("mousedown", e => { if (e.button) return; const y = e.clientY - trayCv.getBoundingClientRect().top, i = Math.floor((y - 6) / TROW);
  if (i === 0){ if (hand === "tape") hand = null; else if (ST.tape.where === "box") hand = "tape"; else { ST.tape.where = "box"; } }
  if (i === 2) fitSpare();
  drawTray(); });
window.addEventListener("resize", () => { trayLayout(); layout3(); });

/* ---- pointer on the bench ---------------------------------------- */
let down3 = null, m3 = [0, 0], FLASH = {msg:"", t:0};
const flash = m => { FLASH = {msg:m, t:performance.now()}; };
const p3e = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => e.preventDefault());
function rclick3(e){ const p = p3e(e), id = pick3(p[0], p[1]);
  if (hand){ hand = null; drawTray(); return; }
  if (ST.held !== null){ if (typeof ST.held === "string"){ ST.probe[ST.held.slice(3)] = null; } dropHeld(); drawTray(); return; }
  if (id && id.startsWith("le:")){ ST.leads.splice(+id.split(":")[1], 1); drawTray(); return; }
  if (id && id.startsWith("pr:")){ ST.probe[id.slice(3)] = null; return; }
  if (id === "tape"){ ST.tape.where = "box"; drawTray(); return; }
  if (view3 !== "3d") showView("3d"); }
function leftClick(p, id){
  /* the tape from the parts box goes where it is put down */
  if (hand === "tape"){ if (view3 === "stand"){ const w = onPlaneZ(p[0], p[1], ZT); if (w) placeTape("stand", w); }
    else if (id && (id === "bar" || id.startsWith("str:") || id.startsWith("t:") || id === "knob")){ const w = onPlaneZ(p[0], p[1], ZT); if (w) placeTape("stand", [w[0], BASE_Y + 1.85, ZT]); }
    else { const w = onPlane(p[0], p[1], 0.03); placeTape("desk", w); } return; }
  if (!id){ if (ST.held !== null){ dropHeld(); drawTray(); } return; }
  if (id.startsWith("t:")){ termClick(id.slice(2)); drawTray(); return; }
  if (id.startsWith("str:")){ const seg = +id.slice(4), s = stringAt(p, seg);
    if (ST.held !== null){ attach("c:" + s.cm.toFixed(2)); drawTray(); return; }
    if (seg === 1 && !ST.broken) pluck(); else startLead("c:" + s.cm.toFixed(2)); drawTray(); return; }
  if (id === "bar"){ const x = Math.max(0.5, Math.min(77.5, alongLine(p, [0, 3.55, BAR.z1], [1, 3.55, BAR.z1])));
    if (ST.held !== null){ attach("b:" + x.toFixed(1)); drawTray(); return; } if (view3 === "3d"){ showView("stand"); return; } startLead("b:" + x.toFixed(1)); drawTray(); return; }
  if (id.startsWith("le:")){ const [, i, e] = id.split(":"), l = ST.leads[+i]; if (ST.held !== null) return;
    /* pick that end up again */ if (e === "a"){ l.a = l.b; } l.b = null; ST.held = +i; return; }
  if (id.startsWith("pr:")){ if (ST.held !== null) return; ST.held = id; ST.probe[id.slice(3)] = null; return; }
  if (ST.held !== null){ return; }
  if (id === "usb"){ ST.usb = !ST.usb; return; }
  if (id === "axdial"){ const c = P3(...axW(AX_DIALC[0], AX_DIALC[1])); METER.ax100.dial = (METER.ax100.dial + (p[0] > c[0] ? 1 : -1) + 20) % 20; readNow(); return; }
  if (id === "msdial"){ const c = P3(...msW(MS_DIALC[0], MS_DIALC[1])); msTurn(p[0] > c[0] ? 1 : -1); return; }
  if (id.startsWith("msb:")){ msKey(+id.slice(4)); return; }
  if (view3 === "3d"){ if (id === "axbody" || id === "msbody" || id === "rboard") showView("meters"); else if (id === "photo") showView("photo"); }
}
function msTurn(d){ const M = METER.ms811; M.dial = Math.max(0, Math.min(4, M.dial + d)); M.hold = false; M.rel = null; M.sel = 0; M.duty = false; readNow(); }
function msKey(i){ const M = METER.ms811; if (MS_DIAL[M.dial] === "OFF") return; M.press = i; setTimeout(() => { M.press = -1; }, 160);
  if (i === 0 && MS_DIAL[M.dial] === "Ω"){ M.sel = (M.sel + 1) % 4; M.rel = null; }
  if (i === 1){ if (M.rel === null){ const v = MS_DIAL[M.dial] === "V⎓" ? SOL.msV : MS_DIAL[M.dial] === "Ω" ? SOL.ohmBetween("YV", "YCOM") + 0.1 : null; M.rel = v !== null && isFinite(v) ? v : null; } else M.rel = null; }
  if (i === 2){ M.hold = !M.hold; M.held = M.hold ? MSSHOW.slice() : null; }
  if (i === 3 && MS_DIAL[M.dial] === "Hz") M.duty = !M.duty;
  readNow(); }
cv3.addEventListener("pointerdown", e => { audio();
  const p = p3e(e); m3 = p;
  if (e.button === 1 || e.button === 2){ e.preventDefault(); cv3.setPointerCapture(e.pointerId); down3 = {p, id:null, moved:false, shift:true, btn:e.button}; return; }
  if (e.button) return; cv3.setPointerCapture(e.pointerId);
  const id = pick3(p[0], p[1]);
  if (id === "tape" && !hand && ST.held === null){ const w = tapePoint(p); if (w){ tapeGrab = tapeLocal(w); down3 = {p, id:"tape", moved:true}; return; } }
  if (id === "knob" && !hand && ST.held === null){ down3 = {p, id:"knob", moved:false, last:p}; return; }
  down3 = {p, id, moved:false, shift:e.shiftKey || view3 !== "3d"}; });
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0] - down3.p[0], p[1] - down3.p[1]) > 4) down3.moved = true; if (!down3.moved) return;
  if (down3.id === "tape"){ const w = tapePoint(p); if (w){ const {U, V} = tapeFrame(), [a, b] = tapeGrab;
      const O = [w[0] - U[0] * a - V[0] * b, w[1] - U[1] * a - V[1] * b, w[2] - U[2] * a - V[2] * b]; ST.tape.x = O[0]; if (ST.tape.where === "stand") ST.tape.y = O[1]; else ST.tape.z = O[2]; } return; }
  if (down3.id === "knob"){ turnKnob(dx / 160); return; }
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.02, CAM.pitch + dy * 0.006)); }
  cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", e => { cv3.classList.remove("grabbing");
  if (down3 && down3.btn){ const d = down3; down3 = null; if (!d.moved && d.btn === 2) rclick3(e); return; }
  if (down3 && !down3.moved) leftClick(down3.p, down3.id);
  down3 = null; tapeGrab = null; });
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = p3e(e), s = e.deltaY < 0 ? 1 : -1, id = pick3(p[0], p[1]);
  if (id === "knob"){ turnKnob(s / 24); return; }
  if (id === "tape"){ tapeTurn(s, e.shiftKey); return; }
  if (id === "axdial"){ METER.ax100.dial = (METER.ax100.dial + s + 20) % 20; readNow(); return; }
  if (id === "msdial"){ msTurn(s); return; }
  const f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(view3 === "photo" ? 400 : 160, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive:false});
window.addEventListener("keydown", e => { if (e.key === "Escape"){ hand = null; if (ST.held !== null){ if (typeof ST.held === "string") ST.probe[ST.held.slice(3)] = null; dropHeld(); } drawTray(); } });

/* ---- the panel ---------------------------------------------------- */
document.getElementById("bPluck").onclick = () => { audio(); pluck(); };
document.getElementById("bUsb").onclick = () => { ST.usb = !ST.usb; };
document.getElementById("bClear").onclick = () => { ST.leads = []; ST.held = null; ST.probe = {YV:null, YCOM:null}; drawTray(); };
document.getElementById("bSpare").onclick = () => fitSpare();
document.getElementById("cSound").onchange = e => { ST.sound = e.target.checked; if (!ST.sound) stopTone(); };
function panel(){ document.getElementById("bUsb").textContent = ST.usb ? tr("usbPull") : tr("usbPlug");
  document.getElementById("bUsb").className = ST.usb ? "on" : "";
  document.getElementById("bSpare").disabled = !(ST.broken && ST.spare > 0); document.getElementById("bPluck").disabled = ST.broken;
  const w = []; if (ST.broken) w.push(tr("broke")); if (ST.fuse) w.push(tr("fuse")); if (ST.T > 60) w.push(tr("hot"));
  if (FLASH.msg && performance.now() - FLASH.t < 4000 && !w.includes(FLASH.msg)) w.push(FLASH.msg);
  const held = hand === "tape" ? tr("holdTape") : typeof ST.held === "number" ? tr("holdLead") : ST.held ? tr("holdProbe") : "";
  const html = w.map(s => '<div class="w">' + s + "</div>").join("") + (held ? "<div>" + held + "</div>" : "") + "<div>" + (ST.usb ? tr("usbOn") : tr("usbOff")) + "</div>";
  const el = document.getElementById("wwarn"); if (el._h !== html){ el.innerHTML = html; el._h = html; } }

/* ---- the loop ----------------------------------------------------- */
let lastT = performance.now(), lastAX = 0, lastMS = 0, fuseT = 0;
function readNow(){ lastAX = 0; lastMS = 0; }
function step(){ const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; ST.t += dt;
  SOL = solve();
  /* the string warms by its own Joule heat and cools to the room */
  const L = pathLen(pathPts()) / 100, C = TRUE.Lam * TRUE.c * L, gL = TRUE.g * L;
  for (let i = 0; i < 5; i++) ST.T += (SOL.Pstr - gL * (ST.T - TRUE.T0)) / C * dt / 5;
  if (!ST.broken && tension() > F_BREAK) snap();
  /* the mA fuse */
  if (Math.abs(SOL.Ima) > 0.2){ fuseT += dt * (Math.abs(SOL.Ima) > 0.3 ? 10 : 1); if (fuseT > 1.5){ ST.fuse = true; flash(tr("fuse")); } } else fuseT = Math.max(0, fuseT - dt);
  /* the tone follows the tension while it rings */
  if (TONE && AC){ const f0 = fundamental(); TONE.osc.forEach((o, n) => o.frequency.setTargetAtTime(f0 * (n + 1), AC.currentTime, 0.05)); }
  if (now - lastAX > 333){ lastAX = now; const r = axReading(); if (r[0] !== AXSHOW[0] || r[1] !== AXSHOW[1]){ AXSHOW = r; drawAX(); } }
  if (now - lastMS > 400){ lastMS = now; const r = msReading() || ["", "", []]; if (r.join("|") !== MSSHOW.join("|")){ MSSHOW = r; drawMS(); } }
}
function draw3(){ const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx3.createLinearGradient(0, 0, 0, CAM.H); g.addColorStop(0, "#2a3038"); g.addColorStop(1, "#1b1f25"); ctx3.fillStyle = g; ctx3.fillRect(0, 0, CAM.W, CAM.H);
  begin3(); if (view3 === "3d" || view3 === "meters") scene3(); else sceneView(view3); render3(ctx3);
  cv3.style.cursor = hand || ST.held !== null ? "copy" : ""; }
(function loop(){ try { step(); draw3(); panel(); } catch (err) { console.error(err); } requestAnimationFrame(loop); })();

/* ---- language ----------------------------------------------------- */
function applyLang(){ document.documentElement.lang = LANG;
  document.title = LANG === "ko" ? "GPhO 2017 E1 — 전기 기타 · HaslaLab" : "GPhO 2017 E1 — Electric Guitar · HaslaLab";
  document.getElementById("h1").textContent = tr("title"); document.getElementById("sub").textContent = tr("sub");
  document.getElementById("t-tray").textContent = tr("tray");
  for (const k of ["3d", "stand", "meters", "photo"]) document.getElementById("vt" + k).textContent = tr("vt" + k);
  document.getElementById("t-cap3").textContent = tr("cap_" + view3);
  document.getElementById("lg-ctl").textContent = tr("lgCtl"); document.getElementById("lg-notes").textContent = tr("lgNotes");
  document.getElementById("tx-notes").textContent = tr("notes");
  document.getElementById("bPluck").textContent = tr("pluck"); document.getElementById("bClear").textContent = tr("clear"); document.getElementById("bSpare").textContent = tr("newString");
  document.getElementById("l-sound").textContent = tr("sound");
  document.getElementById("btn-en").className = LANG === "en" ? "on" : ""; document.getElementById("btn-ko").className = LANG === "ko" ? "on" : "";
  trayLayout(); }
function setLang(l){ LANG = l; applyLang(); }
document.getElementById("btn-ko").addEventListener("click", () => setLang("ko"));
document.getElementById("btn-en").addEventListener("click", () => setLang("en"));

drawAX(); drawMS(); layout3(); applyLang(); showView("3d");

</script>
