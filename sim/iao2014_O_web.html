"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* Cholpon-Ata on the north shore of Issyk-Kul, 1610 m.  The Kungey Ala-Too rises behind the town to the north, the
   lake opens to the south with the Terskey Ala-Too low on the far shore 60–70 km away.  The round's night is not
   given on the sheet; the evening of 18 October 2014 (UT+6), moonless, is taken. */
const SITE = {lat: 42.65, lon: 77.08, tz: 6, name: "Cholpon-Ata"}, DAY = [2014, 10, 18], START = 22.0;
function skyline(az) { az = A.norm360(az); const dN = Math.abs(((az + 540) % 360) - 180);
  const rough = 0.9 * Math.sin(az * 0.31 + 0.4) + 0.55 * Math.sin(az * 0.93 + 2.1) + 0.3 * Math.sin(az * 2.7 + 1.3) + 0.15 * Math.sin(az * 6.1);
  const north = dN < 112 ? Math.pow(Math.cos(dN / 112 * Math.PI / 2), 0.75) : 0, south = Math.max(0, Math.min(1, (dN - 100) / 20));
  return north * (6.2 + 1.3 * rough) + south * (1.5 + 0.35 * Math.sin(az * 0.45 + 1) + 0.2 * Math.sin(az * 1.7) + 0.08 * Math.sin(az * 5.3)) + (1 - north - south) * 0.4; }
const TG = {aUMi: [37.955, 89.264], aAnd: [2.097, 29.090], aAri: [31.793, 23.462], aCyg: [310.358, 45.280], aTau: [68.980, 16.509],
            aCas: [10.127, 56.537], m45: [56.75, 24.12], pi1: [332.3068, 33.1723], pi2: [332.4968, 33.1782]};
const V = (k) => A.vec(...TG[k]);
/* the equinox of date in J2000 coordinates, the ecliptic of date */
