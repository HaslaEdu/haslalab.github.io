<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LHCb Masterclass - D0 Exercise</title>
<style>
:root{--bg:#f0f0f0;--panel:#fff;--fg:#111;--dim:#555;--line:#bbb;--btn:#e6e6e6;
      --sig:#1f77b4;--bkg:#d62728}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:13px/1.45 "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden}
#wrap{display:flex;height:100vh}
#left{width:270px;flex:none;padding:10px;overflow-y:auto;background:var(--panel);
      border-right:1px solid var(--line)}
#right{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
#grid{flex:3;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;min-height:0}
#meas{flex:2;min-height:0}
canvas{width:100%;height:100%;background:#fff;border:1px solid var(--line);display:block}
h1{font-size:14px;margin:0 0 2px}
p.note{margin:0 0 10px;color:var(--dim);font-size:11.5px}
label{display:block;font-size:12px;margin:6px 0 2px}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0}
input[type=text]{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:3px;
      font:12px ui-monospace,Consolas,monospace;background:#fff;color:var(--fg)}
input[type=range]{width:100%}
button{width:100%;padding:6px 8px;margin:4px 0;background:var(--btn);color:var(--fg);
      border:1px solid var(--line);border-radius:3px;cursor:pointer;font:13px inherit}
button:hover{background:#d8d8d8}
#status{margin:8px 0 4px;color:var(--dim);font-size:12px;min-height:1.2em}
#out{width:100%;height:190px;border:1px solid var(--line);background:#fff;color:var(--fg);
     font:11.5px/1.4 ui-monospace,Consolas,monospace;padding:5px;resize:vertical;white-space:pre}
.hint{font-size:11px;color:var(--dim);margin-top:2px}
.legend{font-size:11.5px;color:var(--dim);margin-top:6px}
.legend b{font-weight:600}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <h1>D0 Exercise</h1>
    <p class="note" id="hdr">loading real LHCb 2011 data&hellip;</p>

    <label>Sig range (MeV)</label>
    <div class="row">
      <input type="text" id="m1" value="1845">
      <input type="text" id="m2" value="1885">
    </div>
    <input type="range" id="m1s" min="1816" max="1914" step="1" value="1845">
    <input type="range" id="m2s" min="1816" max="1914" step="1" value="1885">

    <label>D0 IP: max log<sub>10</sub>(IP&chi;&sup2;)</label>
    <input type="range" id="ips" min="-5" max="6" step="0.05" value="6">
    <input type="text" id="ipmax" value="6">
    <div class="hint" id="ipHint"></div>

    <label>D0 TAU range (ps)</label>
    <div class="row">
      <input type="text" id="t1" value="0.25">
      <input type="text" id="t2" value="10">
    </div>

    <label>D0 PT range (GeV)</label>
    <div class="row">
      <input type="text" id="p1" value="0">
      <input type="text" id="p2" value="70">
    </div>

    <button id="bMass">Plot D0 mass</button>
    <button id="bFitMass">Fit mass distribution</button>
    <button id="bCuts">Apply cuts and plot variables</button>
    <button id="bFit">Fit lifetime</button>
    <button id="bClear">Clear measurements</button>

    <div id="status">Ready</div>
    <textarea id="out" readonly></textarea>
    <div class="legend">
      <b style="color:var(--sig)">blue</b> = signal region &nbsp;
      <b style="color:var(--bkg)">red</b> = sidebands
    </div>
  </div>

  <div id="right">
    <div id="grid">
      <canvas id="cMass"></canvas>
      <canvas id="cTau"></canvas>
      <canvas id="cIp"></canvas>
      <canvas id="cPt"></canvas>
    </div>
    <canvas id="meas"></canvas>
  </div>
</div>

/* ---------------------------------------------------------------------------
   Real LHCb 2011 data, CERN Open Data record 401 (MasterclassData.root).
   Packed as 4 x uint16 per candidate over these ranges.
--------------------------------------------------------------------------- */
var RANGES = { mass: [1700, 2500], tau: [0, 20], ip: [-5, 6], pt: [0, 70] };
var M_LO = 1816.0, M_HI = 1914.0, PDG = 0.4101;

var D = (function () {
  var bin = atob(EMBEDDED_DATA_B64), n = bin.length / 8;
  var mass = new Float32Array(n), tau = new Float32Array(n),
      ip = new Float32Array(n), pt = new Float32Array(n);
  function dq(v, r) { return r[0] + v / 65535 * (r[1] - r[0]); }
  for (var i = 0; i < n; i++) {
    var o = i * 8;
    mass[i] = dq(bin.charCodeAt(o) | (bin.charCodeAt(o + 1) << 8), RANGES.mass);
    tau[i] = dq(bin.charCodeAt(o + 2) | (bin.charCodeAt(o + 3) << 8), RANGES.tau);
    ip[i] = dq(bin.charCodeAt(o + 4) | (bin.charCodeAt(o + 5) << 8), RANGES.ip);
    pt[i] = dq(bin.charCodeAt(o + 6) | (bin.charCodeAt(o + 7) << 8), RANGES.pt);
  }
  return { mass: mass, tau: tau, ip: ip, pt: pt, n: n };
})();

/* What the sample actually spans.  The cut controls and every axis are set
   from this, so nothing can sit outside the range you are allowed to ask for
   -- the IP slider used to stop at 1.5 and shut 23 % of the candidates out for
   good, which also meant the uncut lifetime could never be measured. */
var LIM = (function () {
  function span(a) {
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < a.length; i++) {
      if (a[i] < lo) lo = a[i];
      if (a[i] > hi) hi = a[i];
    }
    return [Math.floor(lo * 100) / 100, Math.ceil(hi * 100) / 100];
  }
  return { ip: span(D.ip), pt: span(D.pt), tau: span(D.tau) };
})();

function applyLimits() {
  var s = $('ips'), t = $('ipmax');
  s.min = LIM.ip[0]; s.max = LIM.ip[1]; s.step = 0.05; s.value = LIM.ip[1];
  t.value = LIM.ip[1];
  $('ipHint').textContent = 'sample spans ' + LIM.ip[0].toFixed(2) + ' to ' +
    LIM.ip[1].toFixed(2) + '; at ' + LIM.ip[1].toFixed(2) + ' nothing is cut';
}

/* ------------------------------------------------------------------- fitting */
function fitMass() {
  var nb = 98, h = new Float64Array(nb), ctr = [], i, k;
  for (i = 0; i < D.n; i++) {
    var m = D.mass[i];
    if (m < M_LO || m >= M_HI) continue;
    h[Math.floor((m - M_LO) / (M_HI - M_LO) * nb)]++;
  }
  for (k = 0; k < nb; k++) ctr.push(M_LO + (k + 0.5) * (M_HI - M_LO) / nb);
  var sx = 0, sy = 0, sxx = 0, sxy = 0, cnt = 0;
  for (k = 0; k < nb; k++) {
    if (ctr[k] < M_LO + 0.3 * (M_HI - M_LO) || ctr[k] > M_HI - 0.3 * (M_HI - M_LO)) {
      sx += ctr[k]; sy += h[k]; sxx += ctr[k] * ctr[k]; sxy += ctr[k] * h[k]; cnt++;
    }
  }
  var a = (cnt * sxy - sx * sy) / (cnt * sxx - sx * sx), b = (sy - a * sx) / cnt;
  var tot = 0, mean = 0, bkg = 0, v = 0;
  for (k = 0; k < nb; k++) {
    var pk = Math.max(0, h[k] - (a * ctr[k] + b));
    tot += pk; mean += pk * ctr[k]; bkg += h[k] - pk;
  }
  mean /= tot;
  for (k = 0; k < nb; k++) {
    var q = Math.max(0, h[k] - (a * ctr[k] + b));
    v += q * (ctr[k] - mean) * (ctr[k] - mean);
  }
  return { hist: h, ctr: ctr, a: a, b: b, mean: mean, sigma: Math.sqrt(v / tot),
           signal: tot, bkg: bkg };
}

function fitTau(sumW, sumWT, lo, hi) {
  if (sumW <= 0) return [NaN, NaN];
  var mean = sumWT / sumW - lo, span = hi - lo, tau = Math.max(1e-4, mean), i;
  for (i = 0; i < 400; i++) {
    var e = Math.exp(-span / tau);
    var pred = tau - span * e / (1 - e);
    var d = mean - pred;
    tau = Math.max(1e-4, tau + 0.7 * d);
    if (Math.abs(d) < 1e-12) break;
  }
  return [tau, tau / Math.sqrt(Math.max(sumW, 1))];
}

function measure(c) {
  var sigW = c.m2 - c.m1, sbW = (c.m1 - M_LO) + (M_HI - c.m2);
  if (sbW <= 0) throw new Error('leave some sidebands outside the signal region');
  var wSide = -sigW / sbW, sumW = 0, sumWT = 0, i;
  for (i = 0; i < D.n; i++) {
    var m = D.mass[i];
    if (m < M_LO || m > M_HI || D.ip[i] > c.ipmax) continue;
    var t = D.tau[i];
    if (t < c.t1 || t > c.t2 || D.pt[i] < c.p1 || D.pt[i] > c.p2) continue;
    var w = (m >= c.m1 && m <= c.m2) ? 1 : wSide;
    sumW += w; sumWT += w * t;
  }
  var r = fitTau(sumW, sumWT, c.t1, c.t2);
  return { tau: r[0], err: r[1], yield_: sumW };
}

/* ------------------------------------------------------------------- drawing */
function ctxOf(id) {
  var cv = document.getElementById(id), r = cv.getBoundingClientRect();
  var d = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  var g = cv.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.fillStyle = '#fff'; g.fillRect(0, 0, r.width, r.height);
  return { g: g, w: r.width, h: r.height };
}

function frame(c, x0, x1, y0, y1, xlabel, title, logy) {
  var L = 46, R = 10, T = 20, B = 30, g = c.g;
  function X(v) { return L + (v - x0) / (x1 - x0) * (c.w - L - R); }
  function Y(v) {
    var f = logy ? (Math.log10(Math.max(v, 0.5)) / Math.log10(Math.max(y1, 1)))
                 : ((v - y0) / (y1 - y0));
    return c.h - B - f * (c.h - T - B);
  }
  g.strokeStyle = '#000'; g.lineWidth = 1;
  g.strokeRect(L, T, c.w - L - R, c.h - T - B);
  g.fillStyle = '#333'; g.font = '10px "Segoe UI",sans-serif';
  for (var k = 0; k <= 4; k++) {
    var gx = x0 + (x1 - x0) * k / 4;
    g.textAlign = 'center';
    g.fillText((Math.abs(gx) >= 100 ? gx.toFixed(0) : gx.toFixed(2)), X(gx), c.h - B + 13);
  }
  g.textAlign = 'center'; g.font = '11px "Segoe UI",sans-serif';
  g.fillText(xlabel, (L + c.w - R) / 2, c.h - 3);
  if (title) { g.fillText(title, c.w / 2, 13); }
  return { X: X, Y: Y, L: L, R: R, T: T, B: B };
}

function histogram(vals, lo, hi, nb, keep) {
  var h = new Float64Array(nb), i;
  for (i = 0; i < vals.length; i++) {
    if (keep && !keep[i]) continue;
    var v = vals[i];
    if (v < lo || v >= hi) continue;
    h[Math.floor((v - lo) / (hi - lo) * nb)]++;
  }
  return h;
}

function drawHist(id, hists, colours, lo, hi, xlabel, title, logy, shade) {
  var c = ctxOf(id), nb = hists[0].length, i, k, top = 1;
  for (k = 0; k < hists.length; k++) {
    for (i = 0; i < nb; i++) top = Math.max(top, hists[k][i]);
  }
  var ax = frame(c, lo, hi, 0, top * 1.08, xlabel, title, logy);
  if (shade) {
    c.g.fillStyle = 'rgba(255,196,0,0.20)';
    c.g.fillRect(ax.X(shade[0]), ax.T, ax.X(shade[1]) - ax.X(shade[0]), c.h - ax.T - ax.B);
  }
  for (k = 0; k < hists.length; k++) {
    c.g.strokeStyle = colours[k]; c.g.lineWidth = 1.3;
    c.g.beginPath();
    for (i = 0; i < nb; i++) {
      var x = lo + (i + 0.5) * (hi - lo) / nb;
      i ? c.g.lineTo(ax.X(x), ax.Y(hists[k][i])) : c.g.moveTo(ax.X(x), ax.Y(hists[k][i]));
    }
    c.g.stroke();
  }
  return { c: c, ax: ax };
}

function drawMeasurements(pts) {
  var c = ctxOf('meas');
  if (!pts.length) {
    c.g.fillStyle = '#777'; c.g.font = '12px "Segoe UI",sans-serif'; c.g.textAlign = 'center';
    c.g.fillText('press "Fit lifetime" to record a measurement', c.w / 2, c.h / 2);
    return;
  }
  var xs = pts.map(function (p) { return p.x; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  if (x1 === x0) { x0 -= 0.5; x1 += 0.5; }
  var y0 = 1e9, y1 = -1e9;
  pts.forEach(function (p) { y0 = Math.min(y0, p.tau - p.err); y1 = Math.max(y1, p.tau + p.err); });
  y0 = Math.min(y0, PDG) - 0.01; y1 = Math.max(y1, PDG) + 0.01;
  var ax = frame(c, x0, x1, y0, y1, 'upper log10(IP chi2) cut', 'recorded measurements');
  var g = c.g;
  g.fillStyle = '#333'; g.font = '10px "Segoe UI",sans-serif'; g.textAlign = 'right';
  for (var k = 0; k <= 4; k++) {
    var gy = y0 + (y1 - y0) * k / 4;
    g.fillText(gy.toFixed(3), ax.L - 4, ax.Y(gy) + 3);
  }
  g.strokeStyle = '#888'; g.setLineDash([4, 3]);
  g.beginPath(); g.moveTo(ax.X(x0), ax.Y(PDG)); g.lineTo(ax.X(x1), ax.Y(PDG)); g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#888'; g.textAlign = 'left'; g.font = '10px "Segoe UI",sans-serif';
  g.fillText('PDG 0.4101 ps', ax.X(x0) + 4, ax.Y(PDG) - 4);
  g.strokeStyle = '#1f77b4'; g.fillStyle = '#1f77b4'; g.lineWidth = 1.4;
  pts.forEach(function (p) {
    g.beginPath(); g.arc(ax.X(p.x), ax.Y(p.tau), 3, 0, 6.284); g.fill();
    g.beginPath();
    g.moveTo(ax.X(p.x), ax.Y(p.tau - p.err)); g.lineTo(ax.X(p.x), ax.Y(p.tau + p.err));
    g.stroke();
  });
}

/* ----------------------------------------------------------------------- app */
var $ = function (i) { return document.getElementById(i); };
var out = $('out'), statusEl = $('status'), pts = [];
function num(i) { return parseFloat($(i).value); }
function log(s) { out.value += s; out.scrollTop = out.scrollHeight; }

function cuts() {
  return { m1: num('m1'), m2: num('m2'), ipmax: num('ipmax'),
           t1: num('t1'), t2: num('t2'), p1: num('p1'), p2: num('p2') };
}

function plotMass() {
  var c = cuts(), f = fitMass();
  drawHist('cMass', [f.hist], ['#1f77b4'], M_LO, M_HI, 'D0 mass (MeV)',
           'D0 mass', false, [c.m1, c.m2]);
}

function fitMassBtn() {
  var f = fitMass();
  plotMass();
  log('mass fit: mean = ' + f.mean.toFixed(1) + ' MeV, sigma = ' + f.sigma.toFixed(1) +
      ' MeV\n          signal ~ ' + Math.round(f.signal) + ', background ~ ' +
      Math.round(f.bkg) + '\n');
  statusEl.textContent = 'mass fit done';
}

function applyCuts() {
  var c = cuts(), i;
  var inSig = new Uint8Array(D.n), inBkg = new Uint8Array(D.n);
  for (i = 0; i < D.n; i++) {
    var m = D.mass[i];
    if (m < M_LO || m > M_HI || D.ip[i] > c.ipmax) continue;
    var t = D.tau[i];
    if (t < c.t1 || t > c.t2 || D.pt[i] < c.p1 || D.pt[i] > c.p2) continue;
    if (m >= c.m1 && m <= c.m2) inSig[i] = 1; else inBkg[i] = 1;
  }
  plotMass();
  /* each panel spans the window you asked for, clipped only by what the sample
     holds, and shades the band the cut keeps */
  function panel(id, arr, lo, hi, xlabel, title, logy, band) {
    var lim = arr === D.tau ? LIM.tau : arr === D.pt ? LIM.pt : LIM.ip;
    lo = Math.max(lo, lim[0]);
    hi = Math.min(hi, lim[1]);
    if (!(hi > lo)) { lo = lim[0]; hi = lim[1]; }
    /* if the window still leaves candidates outside, the title says how many,
       so the axis can never quietly swallow part of the sample */
    var out = 0;
    for (var j = 0; j < D.n; j++) {
      if ((inSig[j] || inBkg[j]) && (arr[j] < lo || arr[j] > hi)) out++;
    }
    drawHist(id, [histogram(arr, lo, hi, 60, inSig), histogram(arr, lo, hi, 60, inBkg)],
             ['#1f77b4', '#d62728'], lo, hi, xlabel,
             out ? title + '  (' + out + ' outside the view)' : title, logy,
             band ? [Math.max(band[0], lo), Math.min(band[1], hi)] : null);
  }
  panel('cTau', D.tau, c.t1, c.t2, 'D0 TAU (ps)', 'D0 TAU', true, [c.t1, c.t2]);
  panel('cIp', D.ip, LIM.ip[0], LIM.ip[1], 'log10(D0 IP chi2)', 'D0 IP', false,
        [LIM.ip[0], c.ipmax]);
  panel('cPt', D.pt, c.p1, c.p2, 'D0 PT (GeV)', 'D0 PT', false, [c.p1, c.p2]);
  statusEl.textContent = 'cuts applied';
}

function fitLifetime() {
  var c = cuts();
  try {
    var r = measure(c);
    pts.push({ x: c.ipmax, tau: r.tau, err: r.err });
    pts.sort(function (a, b) { return b.x - a.x; });
    log('tau = ' + r.tau.toFixed(4) + ' +- ' + r.err.toFixed(4) +
        ' ps   (log10(IP) < ' + c.ipmax + ', yield ' + Math.round(r.yield_) + ')\n');
    drawMeasurements(pts);
    statusEl.textContent = 'tau = ' + r.tau.toFixed(4) + ' ps';
  } catch (e) { alert(e.message); }
}

function link(t, s) {
  $(t).addEventListener('input', function () { $(s).value = $(t).value; plotMass(); });
  $(s).addEventListener('input', function () { $(t).value = $(s).value; plotMass(); });
}
link('m1', 'm1s'); link('m2', 'm2s'); link('ipmax', 'ips');

$('bMass').onclick = plotMass;
$('bFitMass').onclick = fitMassBtn;
$('bCuts').onclick = applyCuts;
$('bFit').onclick = fitLifetime;
$('bClear').onclick = function () { pts = []; out.value = ''; drawMeasurements(pts); };

window.addEventListener('resize', function () { applyCuts(); drawMeasurements(pts); });

$('hdr').innerHTML = 'real LHCb 2011 data &mdash; <b>' + D.n.toLocaleString() +
  '</b> D0 &rarr; K&minus;&pi;+ candidates<br>CERN Open Data record 401';
applyLimits();
applyCuts();
fitMassBtn();
drawMeasurements(pts);
</script>
