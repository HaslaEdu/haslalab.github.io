var PROGRAM = {
  title: { ko: 'RMPh 2012 실험 2 — 레이저 광학', en: 'RMPh 2012 Problem 2 — Optics with lasers' },
  subtitle: { ko: '목표: 회절격자의 상수, 초록 레이저 포인터의 파장, 한 빛을 여러 갈래로 반사하는 ‘이상한 거울’(반사층이 있는 플라스틱 판)의 특성을 구합니다. 장비: 자-화면(A), 광학 기준이 되는 T 자(B), 빨강(650 nm)·초록 레이저 포인터, 회절격자 받침(C), 레이저 받침(D), 이상한 거울 1, 2 의 받침(E).',
              en: 'Goals: the constant of a diffraction grating, the wavelength of a green laser pointer, and a specific characteristic of the "strange mirrors" (plastic sheets with a reflective layer that turn one beam into several). Equipment: a ruler-screen (A), a T-ruler as the optical reference (B), red (650 nm) and green laser pointers, the grating holder (C), the laser holder (D) and the holder of the strange mirrors 1 and 2 (E).' },
  notes: { ko: [
    '과제 1: 격자를 d₁ = 30 cm 에 두고 빨간 빛으로 점 다섯 개 이상의 위치를 1 mm 정밀도로 적고 격자 상수와 오차를 구합니다. d₂ = 90 cm 에서 점 셋 이상으로 다시. 과제 2: 초록 빛으로 같은 측정을 해 파장을 구합니다.',
    '과제 3: 초록 레이저를 이상한 거울 1 에 비추어 거울–화면 거리 25–40 cm 의 세 거리에서 점 둘 이상의 위치를 재고, 거울 2 로 한 거리에서 잽니다. 공식 해답: a ≈ (2.0 ± 0.2) µm, λ_초록 ≈ (550 ± 10) nm, 거울 1 ≈ 1.6 µm (CD), 거울 2 ≈ 0.7 µm (DVD).',
    'a = kλ√(d² + ℓ²)/ℓ. 자-화면의 0 은 왼쪽 끝이고 빛줄기는 가운데 근처에 떨어지므로 좌우 대칭인 점의 차이로 ℓ 을 구하세요. 격자 상수는 방문할 때마다 조금 다릅니다.'], en: [
    'Task 1: grating at d₁ = 30 cm, red light: write down at least five spot positions to 1 mm, find the grating constant and its error; again at d₂ = 90 cm with at least three spots. Task 2: the same with green light, for its wavelength.',
    'Task 3: the green laser on strange mirror 1 at three mirror–screen distances in 25–40 cm, at least two spots each; mirror 2 at one distance. Official: a ≈ (2.0 ± 0.2) µm, λ_green ≈ (550 ± 10) nm, mirror 1 ≈ 1.6 µm (CD), mirror 2 ≈ 0.7 µm (DVD).',
    'a = kλ√(d² + ℓ²)/ℓ. The ruler-screen\'s 0 is at its left end and the beam lands near its middle, so take ℓ from the difference of symmetric spots. The grating constant differs a little from visit to visit.'] }
};

var LAB = { mode: 'grating', mir: 1, green: false, d: 30 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 왼쪽 끝의 자-화면 A(0–70 cm), 거기서 뻗은 T 자 B(cm), 그 위의 격자 받침 C 와 레이저 받침 D, 옆에 이상한 거울 1, 2 의 받침 E 와 레이저 둘.',
           en: 'On the desk: the ruler-screen A (0–70 cm) at the left, the T-ruler B (cm) running from it with the grating holder C and the laser holder D on it, and beside them holder E with strange mirrors 1 and 2, and the two lasers.' },
  howto: { ko: ['격자 받침 C 끌기: 자-화면까지의 거리 d 바꾸기 (레이저 D 가 따라옴) · 레이저 클릭: 빨강 ↔ 초록 바꾸기',
                '받침 E 클릭: 거울 1 → 거울 2 → 다시 격자 (거울일 때는 초록 레이저가 화면 쪽에서 거울을 비춤) · E 를 끌어 거리 바꾸기',
                '자-화면 클릭: 점 위치 가까이 읽기 (휠로 확대) · T 자 클릭: 받침의 위치 읽기'],
           en: ['Drag the grating holder C: change its distance d to the ruler-screen (the laser in D follows) · click the laser: red ↔ green',
                'Click holder E: mirror 1 → mirror 2 → back to the grating (with a mirror the green laser shines on it from the screen\'s side) · drag E to change the distance',
                'Click the ruler-screen: read the spots closely (wheel to zoom) · click the T-ruler: read the holder\'s position'] },
  notePlaceholder: { ko: '예) 빨강 d = 30.0 cm: 9.4, 20.3, 30.6, 41.0, 56.2 cm …', en: 'e.g. red, d = 30.0 cm: 9.4, 20.3, 30.6, 41.0, 56.2 cm …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var a = 2.0e-6 * (1 + S.sys('a', 0.03)), lamR = 650e-9, lamG = 550e-9 * (1 + S.sys('lg', 0.01)), aM = [1.6e-6 * (1 + S.sys('cd', 0.01)), 0.74e-6 * (1 + S.sys('dvd', 0.02))];
    var BH = 6, SL = 70, Zr = SL / 2 + S.uni('c0', -0.8, 0.8);   /* the z of the ruler-screen's 0 (its left end seen from the bench) */
    var bench3 = B3.scaleTex(100, { horiz: true, width: 3, bg: '#e9e1c6', label: 'cm' });
    var scr = document.createElement('canvas'); scr.width = SL * 20 + 40; scr.height = 160; var sg = scr.getContext('2d'), key = '';
    function drawScreen(spots, col) {
      var k = JSON.stringify(spots) + col; if (k === key) return; key = k; var px = 20;
      sg.fillStyle = '#f4f2ea'; sg.fillRect(0, 0, scr.width, scr.height); sg.fillStyle = '#1a1a1a'; sg.font = '700 13px sans-serif'; sg.textAlign = 'center';
      for (var m = 0; m <= SL * 10; m++) { var x = 20 + m * px / 10, L = m % 10 === 0 ? 46 : m % 5 === 0 ? 32 : 20; sg.fillRect(x - (m % 10 === 0 ? 1 : 0.5), 0, m % 10 === 0 ? 2 : 1, L); if (m % 10 === 0) sg.fillText(String(m / 10), x, 74); }
      spots.forEach(function (s) { var x = 20 + s[0] * px, r = 7 * s[1] + 3, g = sg.createRadialGradient(x, 105, 0, x, 105, r * 1.8);
        g.addColorStop(0, col === 'g' ? 'rgba(220,255,210,1)' : 'rgba(255,225,215,1)'); g.addColorStop(0.35, col === 'g' ? 'rgba(60,255,90,.95)' : 'rgba(255,40,30,.95)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        sg.fillStyle = g; sg.beginPath(); sg.arc(x, 105, r * 1.8, 0, 7); sg.fill(); });
    }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: 0.75, pitch: 0.5, k: 6.5, tx: 32, ty: 3, tz: 0 },
      views: { screen: { yaw: Math.PI / 2, pitch: 0.1, k: 22, tx: 0, ty: BH, tz: 0, title: { ko: '자-화면 A', en: 'The ruler-screen A' },
                         hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · Esc: back' } },
               tr: { yaw: 0, pitch: 1.3, k: 30, tx: 30, ty: 0, tz: 4, title: { ko: 'T 자 B', en: 'The T-ruler B' } } },
      frame: function (b) {
        if (b.clicked('m:mirrors')) { if (LAB.mode === 'grating') { LAB.mode = 'mirror'; LAB.mir = 1; LAB.green = true; } else if (LAB.mir === 1) LAB.mir = 2; else LAB.mode = 'grating';
          b.say(LAB.mode === 'grating' ? '격자로 돌아왔습니다.' : '이상한 거울 ' + LAB.mir + ' (초록 레이저)', LAB.mode === 'grating' ? 'Back to the grating.' : 'Strange mirror ' + LAB.mir + ' (green laser)'); }
        if (b.clicked('m:laser')) { if (LAB.mode === 'grating') LAB.green = !LAB.green; else b.say('거울 과제는 초록 레이저로 합니다.', 'The mirror task uses the green laser.'); }
        var mv = b.moved(LAB.mode === 'grating' ? 'grating' : 'mirrors'); if (mv[0]) LAB.d = Math.max(10, Math.min(95, LAB.d + mv[0]));
        if (b.clicked('c:screen')) b.go('screen');
        if (b.clicked('c:tr')) b.go('tr');
        var d = LAB.d, spots = [], lam = LAB.green ? lamG : lamR, A = LAB.mode === 'grating' ? a : aM[LAB.mir - 1];
        if (LAB.mode === 'mirror') lam = lamG;
        for (var k = -6; k <= 6; k++) { var s = k * lam / A; if (Math.abs(s) >= 1) continue; if (LAB.mode === 'mirror' && k === 0) continue;
          var z = d * Math.tan(Math.asin(s)), pos = Zr - z; if (pos > -0.5 && pos < SL + 0.5) spots.push([pos, k === 0 ? 1 : Math.max(0.25, 0.8 / Math.abs(k))]); }
        drawScreen(spots, LAB.green || LAB.mode === 'mirror' ? 'g' : 'r');
        var inScreen = b.view === 'screen';
        B3.desk(-12, 110, -45, 45);
        /* the ruler-screen A: a board standing across the bench at x = 0, its face towards +x */
        B3.box3(-1.6, -0.2, 0, BH + 4, Zr - SL - 1, Zr + 1, '#c9b48a', { top: '#d8c39a', id: 'c:screen' });
        B3.tex3(scr, 0, 0, scr.width, scr.height, [-0.18, BH + 2.5, Zr + 1], [0, 0, -(SL + 2)], [0, -5, 0], { id: 'c:screen' });
        /* the T-ruler B along +x */
        if (!inScreen) { B3.box3(0, 101, 0, 0.6, -2.5, 2.5, '#d8cfa8', { id: 'c:tr', top: '#e9e1c6' }); B3.tex3(bench3, 0, 0, bench3.width, bench3.height, [-1, 0.61, -1.5], [102, 0, 0], [0, 0, 3], { id: 'c:tr' }); }
        var red = LAB.green || LAB.mode === 'mirror' ? 'rgba(80,255,110,.8)' : 'rgba(255,50,40,.8)', lasCol = LAB.green || LAB.mode === 'mirror' ? '#1f4a2a' : '#4a1f1f';
        if (LAB.mode === 'grating') {
          /* C: the grating at d, D: the laser right behind it */
          if (!inScreen) { B3.box3(d - 1.5, d + 1.5, 0.6, 2.4, -4, 4, '#a8743c', { id: 'm:grating', top: '#b8844a' });
            B3.box3(d - 0.2, d + 0.2, 2.4, BH + 3, -3, 3, '#a8743c', { id: 'm:grating' });
            B3.box3(d + 6, d + 14, 0.6, BH - 1, -2.5, 2.5, '#a8743c', { id: 'm:grating', top: '#b8844a' });
            B3.cylAB([d + 14, BH, 0], [d + 2, BH, 0], 0.8, lasCol, { seg: 16, id: 'm:laser' }); }
          spots.forEach(function (s) { B3.line3([d, BH, 0], [0, BH, Zr - s[0]], red, s[1] > 0.9 ? 1.6 : 1); });
          if (!inScreen) B3.line3([d + 2, BH, 0], [d, BH, 0], red, 1.8);
          /* holder E with the mirrors, aside */
          B3.box3(60, 66, 0, 1.6, 22, 30, '#a8743c', { id: 'm:mirrors', top: '#b8844a' });
          [24, 28].forEach(function (z, i) { B3.box3(62.8, 63.2, 1.6, 6, z - 1.6, z + 1.6, i === 0 ? '#c6c9d6' : '#c8b8d8', { id: 'm:mirrors' }); });
        } else {
          /* the green laser just above the screen, pointing at the mirror in E at d */
          if (!inScreen) { B3.box3(0, 6, BH + 4, BH + 5, -1.5, 1.5, '#a8743c'); B3.cylAB([0.2, BH + 6, 0], [5, BH + 6, 0], 0.8, lasCol, { seg: 16, id: 'm:laser' });
            B3.box3(d - 2, d + 4, 0.6, 2.2, -5, 5, '#a8743c', { id: 'm:mirrors', top: '#b8844a' });
            B3.box3(d - 0.2, d + 0.2, 2.2, BH + 9, -4, 4, LAB.mir === 1 ? '#c6c9d6' : '#c8b8d8', { id: 'm:mirrors' });
            B3.text3([d - 0.25, BH + 7.5, -1], [0, 0, 1], [0, -1, 0], String(LAB.mir), 2, '#333', { weight: '800' }); }
          B3.line3([5, BH + 6, 0], [d, BH + 6, 0], red, 1.6);
          spots.forEach(function (s) { B3.line3([d, BH + 6, 0], [0, BH, Zr - s[0]], red, 1); });
          B3.box3(60, 66, 0, 1.6, 22, 30, '#a8743c', { top: '#b8844a' });
        }
        b.views.tr.tx = d;
        LAB.state = { mode: LAB.mode, mir: LAB.mir, green: LAB.green, d: d, spots: spots.map(function (s) { return +s[0].toFixed(2); }), a: a };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
