<script>
/* NBPhO 2004 problem 9 "Experiment" on the 3-D bench.  The box holds an electrolytic capacitor in series with a
   nonlinear element; the sheet does not say what the element is — here it is a diode (forward for the
   discharge) with a resistor in series, the two in parallel with a larger resistor, so the characteristic
   is not symmetric and the box can still be charged.  As in the official solution: charge it from the
   batteries (red wire to +), discharge it through the ammeter while timing; the area under I(t) is
   Q = C(U0 − U1); now and then break the discharge, read the voltage U, and pair it with the current just
   before — that is the V–I characteristic for I > 0.  Charging it the wrong way round makes the
   electrolytic capacitor leak. */
var PROGRAM = {
  title: { ko: 'NBPhO 2004 실험 9 — 블랙박스', en: 'NBPhO 2004 Problem 9 — Black box' },
  subtitle: { ko: '블랙박스 속에 비선형 소자(능동 저항)와 축전기가 직렬로 연결되어 있습니다. 축전기의 전기 용량 C 와 비선형 소자의 V–I 특성을 구하세요. (a) 전해 축전기는 한 극성으로만 충전됩니다(블랙박스 도선의 색으로 표시). (b) V–I 특성은 I = 0 에 대해 대칭이 아닐 수 있습니다 — 축전기의 방전에 해당하는 I > 0 범위를 조사하세요. 측정값을 표로 만들고 그래프를 그리세요. 장비: 전지, 도선, 멀티미터, 스톱워치, 모눈종이.',
              en: 'The black box contains a nonlinear element (active resistance) and a capacitor in series. Find the capacitance C and the V–I characteristic of the nonlinear element. (a) The electrolytic capacitor accepts only one polarity (shown by the colours of the box\'s wires); (b) the characteristic need not be symmetric about I = 0 — study I > 0, the discharge of the capacitor. Tabulate the data and draw graphs. Equipment: batteries, wires, a multimeter, a stopwatch, graph paper.' },
  notes: { ko: [
    '공식 해답: 방전 전류를 시간에 따라 읽어 I(t) 그래프 아래 넓이로 흘러나간 전하 Q 를, 처음과 끝의 전압 U₀, U₁ 로 C = Q/(U₀ − U₁) 를 구합니다.',
    'V–I 특성: 방전을 이따금 끊고 끊기 직전의 전류 I 와 끊은 뒤의 전압 U 를 읽어 짝짓습니다. 전류계의 작은 저항은 무시해도 됩니다.',
    '문제지는 소자가 무엇인지 말하지 않습니다 — 여기서는 방전 방향으로 다이오드와 저항, 그와 나란한 큰 저항입니다. 빨간 도선을 + 로 충전하세요. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Official solution: read the discharge current against time; the area under I(t) is the charge Q that flowed out, and with the voltages U₀ and U₁ at the start and end, C = Q/(U₀ − U₁).',
    'The V–I characteristic: now and then break the discharge, and pair the current I just before with the voltage U read after. The ammeter\'s small resistance can be neglected.',
    'The sheet does not say what the element is — here, a diode and a resistor in the discharge direction with a larger resistor across them. Charge with the red wire to +. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, sw: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 빨간·검은 도선 단자의 블랙박스, 전지 세 개짜리 전지함, 멀티미터, 스톱워치, 도선.',
           en: 'On the desk: the black box with red and black wire terminals, a holder of three cells, a multimeter, a stopwatch and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '충전: 빨강 ← 전지 +, 검정 ← 전지 − (충분히 기다리기) · 방전: 전지를 떼고 멀티미터(A⎓, mA–COM)로 빨강–검정을 이음',
                '전압: 방전 도선을 하나 뽑고 멀티미터를 V⎓ 로 · 멀티미터 클릭: 가까이 · 스톱워치: <b>Space</b>'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Charge: red ← battery +, black ← battery − (wait long enough) · discharge: take the battery off and join red–black through the multimeter (A⎓, mA–COM)',
                'Voltage: pull one discharge wire and set the multimeter to V⎓ · click the multimeter: closer · stopwatch: <b>Space</b>'] },
  notePlaceholder: { ko: '예) U₀ = 4.42 V; t = 0 s 3.81 mA, 2 s 2.95 mA, … ; 끊고 U = 3.10 V (직전 I = 2.40 mA) …', en: 'e.g. U₀ = 4.42 V; t = 0 s 3.81 mA, 2 s 2.95 mA, … ; broken: U = 3.10 V (I just before 2.40 mA) …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var Cap = 10e-3 * (1 + S.sys('C', 0.1)), Rs = 1000 * (1 + S.sys('Rs', 0.05)), Rp = 3.3e3 * (1 + S.sys('Rp', 0.05)), E = 1.5 * (1 + S.sys('E', 0.02));
    var nv = 1.8 * 0.02585, dio = { Is: 1e-3 / Math.exp(0.62 / nv), n: 1.8, Gl: 1e-11, Rs: 2 };
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: S.sys('mA', 0.006), R: S.sys('mR', 0.005) };
    var leads = LAB.leads = new B3.Leads({ max: 6 }), sw = LAB.sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit(), warned = false;
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 5],
      home: { yaw: -0.3, pitch: 0.85, k: 14, tx: 4, ty: 0, tz: 2 },
      views: {
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 10, ty: 3.4, tz: 2, title: { ko: '멀티미터', en: 'Multimeter' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 28, ty: 1.7, tz: 8, title: { ko: '스톱워치', en: 'Stopwatch' } }
      },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-32, 40, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-16, 2], [{ name: 'R', col: '#c0392b', label: '' }, { name: 'K', col: '#1b1b1b', label: '' }], { label: 'NBPhO 2004 · 9', w: 12, d: 9 });
        var cell = B3.cells(b, leads, 'bat', [-4, 13], { n: 3, e: E, r: 0.3 });
        var m = B3.dmm(b, 'dmm', [10, 2], dm, leads);
        B3.stopwatch(b, 'sw', [28, 8], sw);
        c.reset();
        /* the element between the red wire and the capacitor's + (node m): diode + Rs towards red, Rp across */
        c.R('box.m', T.R, Rp); var d = c.D('box.m', 'box.d', dio); c.R('box.d', T.R, Rs);
        c.C('box.m', T.K, Cap, 'cap'); c.R('box.m', T.K, 2e6);
        var vc = c.V_('box.m') - c.V_(T.K);
        if (vc < -0.4) { c.R('box.m', T.K, 60); if (!warned) { warned = true; b.say('전해 축전기를 거꾸로 충전하고 있습니다!', 'The electrolytic capacitor is being charged the wrong way!'); } } else warned = false;
        cell.stamp(c); m.stamp(c); leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.02)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-5);
        m.read(c);
        leads.draw(b);
        LAB.state = { U: c.V_('box.m') - c.V_(T.K), Id: c.cur(d), C: Cap, Rs: Rs, Rp: Rp };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
