var PROGRAM = {

  subtitle: { ko: '공업용 전지 Camelion 1.5 V 와 손수 만든 전지(구연산 용액이 든 플라스틱 관, 아래 철 막대 = −, 위 구리선 = +)의 특성을 조사합니다. 장비: 멀티미터(전지가 든 회로에서는 전압계로만), 20 kΩ 가변 저항, 약 1 Ω 저항 다섯 개의 사슬(0–5), 10 kΩ 저항, 도선, 스톱워치.',
              en: 'Investigate an industrial cell (Camelion 1.5 V) and a homemade one (a plastic tube of citric acid solution: an iron rod at the bottom = −, a copper wire at the top = +). Equipment: a multimeter (only as a voltmeter in circuits with cells), a 20 kΩ variable resistor, a chain of five ≈ 1 Ω resistors (0–5), a 10 kΩ resistor, wires and a stopwatch.' },
  notes: { ko: [
    '과제: 1 저항 사슬 R₀ₖ 를 재고, Camelion 을 0 과 k 에 이어 Uₖ, Iₖ = Uₖ/R₀ₖ, U(I) 로 ε, r. 2 손수 만든 전지의 U(I) — 10 kΩ 와 20 kΩ 가변 저항을 직렬로, U₀ (R₀ 양단) 와 U 를 재어 I = U₀/R₀. 3 두 전지의 네 가지 연결(직렬 같은 방향/반대, 병렬 둘)의 기전력. 4 Camelion 을 외부 전원으로 — 가변 저항(직렬) 회로와 분압기 회로, 극성 둘 — 전지에 흐르는 전류와 전지 전압의 특성, 직선 구간의 ε, r.',
    '공식 해답: Camelion ε = 1.53 ± 0.04 V, r = 0.18 ± 0.02 Ω (R₀₁ = 1.0 Ω 에서 1.300 V). 손수 만든 전지 ε ≈ 450 mV, r ≈ 5.5 kΩ. 4: 충전 쪽 ε ≈ 547 mV, r ≈ 2.75 kΩ; 방전 쪽 ε ≈ 503 mV, r ≈ 5.8 kΩ; 약 50 µA 부근에서 극성이 뒤집혀 ε ≈ −165 mV, r ≈ 3.15 kΩ.',
    '전지 전압은 수십 초에 걸쳐 자리를 잡습니다 — 스톱워치로 기다리세요(×10 으로 빨리 감기 가능). 용액 교체와 저항의 발열, 갈아 끼운 뒤의 이력은 넣지 않았습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 measure the chain R₀ₖ; with the Camelion across 0 and k, read Uₖ, Iₖ = Uₖ/R₀ₖ, U(I) for ε, r. 2 the homemade cell\'s U(I) — the 10 kΩ and the 20 kΩ variable resistor in series, U₀ across R₀ and U, I = U₀/R₀. 3 the EMF of the four connections of two cells (series aiding/opposing, two parallel). 4 the Camelion as an external source — a variable-resistor (series) circuit and a potentiometer circuit, both polarities — the cell\'s voltage against the current through it, ε and r of the linear sections.',
    'Official solution: Camelion ε = 1.53 ± 0.04 V, r = 0.18 ± 0.02 Ω (1.300 V on R₀₁ = 1.0 Ω). Homemade cell ε ≈ 450 mV, r ≈ 5.5 kΩ. 4: charging side ε ≈ 547 mV, r ≈ 2.75 kΩ; discharging ε ≈ 503 mV, r ≈ 5.8 kΩ; near 50 µA the polarity reverses, ε ≈ −165 mV, r ≈ 3.15 kΩ.',
    'The cell voltage settles over tens of seconds — wait with the stopwatch (×10 fast-forwards). Changing the solution, resistor heating and the history after it are not modelled. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, x: 0.5, Islow: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: Camelion 전지(빨강 +, 검정 −), 받침에 세운 손수 만든 전지(위 구리 = +, 아래 철 = −), 저항 사슬(단자 0–5), 10 kΩ 저항, 20 kΩ 가변 저항(양 끝 A, B 와 가운데 슬라이더 W), 멀티미터, 스톱워치, 도선.',
           en: 'On the desk: the Camelion cell (red +, black −), the homemade cell on its stand (copper at the top = +, iron at the bottom = −), the resistor chain (terminals 0–5), the 10 kΩ resistor, the 20 kΩ variable resistor (ends A, B and the wiper W), the multimeter, a stopwatch and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 한 단자에 여러 도선을 이을 수 있습니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '가변 저항 손잡이 위에서 휠 또는 좌우로 끌기: W 를 A 에서 B 로 (Shift + 휠: 잘게)',
                '멀티미터: 클릭해서 가까이 본 뒤 다이얼 — VΩ 와 COM 잭 (COM 에 − 를 이으면 양수) · 스톱워치: <b>Space</b>, ×10 으로 기다리기'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Several wires may go to one terminal. Click a plugged end to pull it out; click the desk to put it down',
                'Wheel or drag left/right over the variable resistor\'s knob: move W from A to B (Shift + wheel: finely)',
                'Multimeter: click it to look closer, then the dial — the VΩ and COM sockets (positive with − on COM) · stopwatch: <b>Space</b>, ×10 to wait'] },
  notePlaceholder: { ko: '예) R₀₁ = 1.0 Ω, U₁ = 1.30 V … / U₀ = 269 mV, U = 272 mV …', en: 'e.g. R₀₁ = 1.0 Ω, U₁ = 1.30 V … / U₀ = 269 mV, U = 272 mV …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var eC = 1.53 * (1 + S.sys('eC', 0.01)), rC = 0.18 * (1 + S.sys('rC', 0.08)), R0 = 10e3 * (1 + S.sys('R0', 0.01)), RP = 20e3 * (1 + S.sys('RP', 0.03));
    var Rk = [1, 2, 3, 4, 5].map(function (i) { return 1.0 * (1 + S.sys('r' + i, 0.025)); });
    var gU = 1 + S.sys('gU', 0.03), gI = 1 + S.sys('gI', 0.04), RS = 800, TAU = 12 * (1 + S.sys('tau', 0.15));
    /* the homemade cell's settled curve: I in µA, U in mV (official table 4), straight beyond its ends */
    var TAB = [[-89.2, 790], [-79.0, 764], [-64.4, 725], [-52.2, 692], [-38.1, 651], [-23.5, 606], [-16.4, 581], [-8.4, 548], [-3.5, 524], [1.9, 493], [5.8, 471], [10.2, 442], [15.1, 414], [21.9, 375], [30.7, 326], [35.4, 299], [39, 240], [42.5, 103], [48.2, -6], [58, -183], [66.9, -269], [87.1, -439], [100.5, -483], [110.5, -514], [119.5, -541]];
    function Uss(I) { var u = I * 1e6 / gI, n = TAB.length, U;
      if (u <= TAB[0][0]) U = TAB[0][1] + 2.75 * (TAB[0][0] - u);
      else if (u >= TAB[n - 1][0]) U = TAB[n - 1][1] - 3.15 * (u - TAB[n - 1][0]);
      else for (var i = 1; i < n; i++) if (u <= TAB[i][0]) { var a = TAB[i - 1], b = TAB[i]; U = a[1] + (b[1] - a[1]) * (u - a[0]) / (b[0] - a[0]); break; }
      return Math.max(-1800, U) * 1e-3 * gU; }
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: 0, R: S.sys('mR', 0.004) };
    var leads = LAB.leads = new B3.Leads({ max: 14 }), sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 0.2], ['V', 2], ['V', 20], ['Ω', 200], ['Ω', 2e4], ['Ω', 2e5]];
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10], wheelIds: ['pot'],
      home: { yaw: -0.25, pitch: 0.8, k: 12.5, tx: 2, ty: 2, tz: 1 },
      views: { dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 16, ty: 3.4, tz: 4, title: { ko: '멀티미터', en: 'Multimeter' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 31, ty: 1.7, tz: 10, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        var mp = b.screenMoved('pot'), wp = b.wheel('pot'); if (mp[0] || wp) LAB.x = Math.max(0, Math.min(1, LAB.x + mp[0] * 0.004 + wp * 0.01));
        B3.desk(-36, 40, -18, 20);
        /* the Camelion cell, wire leads soldered on */
        B3.cylAB([-27, 1.3, 10], [-21, 1.3, 10], 1.3, '#c9a227', { seg: 18, id: 'm:cam', cap: '#b8b8b8' });
        B3.cylAB([-26.4, 1.3, 10], [-21.8, 1.3, 10], 1.32, '#1f3f86', { seg: 18, caps: false, id: 'm:cam' });
        B3.text3([-26, 2.66, 10.6], [1, 0, 0], [0, 0, -1], 'Camelion 1.5V', 0.55, '#f2f2f2', { weight: '800' });
        leads.term(b, 'cam.plus', [-29.5, 0, 13], { col: '#c0392b', label: '+', post: true });
        leads.term(b, 'cam.minus', [-18.5, 0, 13], { col: '#1b1b1b', label: '−', post: true });
        B3.cable([-27.1, 1.3, 10], [-29.5, 1.2, 13], '#c0392b', 0.3, 2); B3.cable([-20.9, 1.3, 10], [-18.5, 1.2, 13], '#1b1b1b', 0.3, 2);
        /* the homemade cell: a tube of citric acid on an iron rod held in the cover-stand, a copper wire on top */
        B3.box3(-30, -20, 0, 1, -12, -4, '#e6e1d6', { top: '#efebe2' });
        B3.cyl3('y', 1, 3.2, -25, -8, 0.25, '#7a7f86', { seg: 10 });
        B3.cyl3('y', 1.6, 2.6, -25, -8, 1.2, '#c99a6b', { seg: 14, cap: '#b98a5b' });
        B3.cyl3('y', 2.6, 14, -25, -8, 0.9, 'rgba(225,235,200,.45)', { seg: 18, cap: 'rgba(235,240,210,.55)', noObst: true });
        B3.cyl3('y', 2.6, 13.4, -25, -8, 0.82, 'rgba(240,230,150,.35)', { seg: 16, caps: false, noObst: true });
        B3.cyl3('y', 2.7, 6.5, -25, -8, 0.28, '#6f747a', { seg: 10 });
        B3.cylAB([-25, 15.5, -8], [-25, 10.5, -8], 0.12, '#c87533', { seg: 6 });
        B3.text3([-29.5, 1.02, -4.5], [1, 0, 0], [0, 0, -1], b.L('손수 만든 전지', 'Homemade cell'), 0.6, '#333', { weight: '700' });
        leads.term(b, 'hc.Cu', [-25, 15.5, -8], { col: '#c87533', label: 'Cu +', post: true, lc: '#ffd2a8' });
        leads.term(b, 'hc.Fe', [-21.5, 1, -7], { col: '#6f747a', label: 'Fe −', post: true, lc: '#333' });
        B3.cable([-25, 1.6, -8], [-21.5, 1.2, -7], '#6f747a', 0.2, 1.8);
        /* the resistor chain 0–5 and the 10 kΩ resistor */
        B3.box3(-14, 4, 0, 0.8, 6, 12, '#2e6b4a', { top: '#357a55' });
        for (var i = 0; i < 6; i++) { leads.term(b, 'ch.' + i, [-12 + i * 3.2, 0.8, 9], { col: '#d8d8d8', label: String(i), lc: '#fff', lz: 1.6 });
          if (i < 5) { B3.cylAB([-11.4 + i * 3.2, 1.3, 9], [-9.4 + i * 3.2, 1.3, 9], 0.38, '#c8b48a', { seg: 10 }); } }
        B3.box3(-14, -2, 0, 0.8, -12, -6, '#2e6b4a', { top: '#357a55' });
        B3.cylAB([-10.5, 1.4, -9], [-5.5, 1.4, -9], 0.45, '#5b8fc0', { seg: 12 });
        B3.text3([-10, 0.82, -6.6], [1, 0, 0], [0, 0, -1], 'R₀ 10 kΩ', 0.6, '#fff', { weight: '700' });
        leads.term(b, 'r0.a', [-12.2, 0.8, -9], { col: '#d8d8d8' }); leads.term(b, 'r0.b', [-3.8, 0.8, -9], { col: '#d8d8d8' });
        /* the 20 kΩ variable resistor */
        B3.box3(2, 12, 0, 2, -13, -6, '#3a3f46', { top: '#474c55' });
        B3.cyl3('y', 2, 3.6, 7, -10.5, 1.5, '#2b2f35', { seg: 20, cap: '#3a3f46', id: 'm:pot' });
        var pa = (LAB.x - 0.5) * 4.5; B3.line3([7, 3.62, -10.5], [7 + Math.sin(pa) * 1.4, 3.62, -10.5 - Math.cos(pa) * 1.4], '#f2f2f2', 2.5);
        B3.text3([2.5, 2.02, -6.4], [1, 0, 0], [0, 0, -1], '20 kΩ', 0.6, '#ddd', { weight: '700' });
        ['A', 'W', 'B'].forEach(function (t, i) { leads.term(b, 'pot.' + t, [4 + i * 3, 2, -7.6], { col: '#b8b8b8', label: t, lc: '#e8e8e8', ls: 0.6 }); });
        var m = B3.dmm(b, 'dmm', [16, 4], dm, leads, { ranges: RANGES });
        B3.stopwatch(b, 'sw', [31, 10], sw);
        /* the circuit */
        c.reset();
        c.V('cam.plus', 'cam.minus', eC, rC);
        var hc = c.V('hc.Cu', 'hc.Fe', Uss(LAB.Islow) + RS * LAB.Islow, RS);
        for (var j = 0; j < 5; j++) c.R('ch.' + j, 'ch.' + (j + 1), Rk[j]);
        c.R('r0.a', 'r0.b', R0);
        c.R('pot.A', 'pot.W', Math.max(1, LAB.x * RP)); c.R('pot.W', 'pot.B', Math.max(1, (1 - LAB.x) * RP));
        m.stamp(c); leads.wire(c); c.solve(0.05);
        var Iout = -c.cur(hc); if (b.dt > 0) LAB.Islow += (Iout - LAB.Islow) * (1 - Math.exp(-b.dt / TAU));
        m.read(c);
        leads.draw(b);
        LAB.state = { Ucell: c.V_('hc.Cu') - c.V_('hc.Fe'), Iout: Iout, Islow: LAB.Islow, read: dm.now, x: LAB.x };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
