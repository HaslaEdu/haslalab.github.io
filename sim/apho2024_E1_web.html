<meta name="description" content="APhO 2024 실험 문제를 브라우저에서 실행합니다. 대전방지 매트 위에 A형 받침대에 별 노브를 끼우고 수직 스탠드, 알루미늄 튜브, DC 모터, 커플러와 아크릴 원판을 끼운 뒤 육각 렌치·드라이버로 나사를 직접 조이고, 별 노브로 수평을 맞춘 뒤 조절식 전원 어댑터의 전압을 바꿔 가며 세차 주기, 팔 길이·원판 질량·볼트 너트의 효과, 장동을 스톱워치·각도기·자로 직접 잽니다. 회전수는 어디에도 표시되지 않습니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row button{flex:1;text-align:center;min-width:0}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);
        border:1px solid var(--line);border-radius:6px;padding:6px 0;color:#e8eef2;letter-spacing:.04em}
  .laps{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa3ab;max-height:130px;overflow:auto;margin-top:4px}
  #closeCv{touch-action:none}
  .instr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .instr3 canvas{display:block;width:100%;background:var(--deep);border-radius:6px}
  .ilbl{font-size:12px;color:#f2c14e;font-weight:700;margin:0 0 4px}
  @media(max-width:900px){.instr3{grid-template-columns:1fr}}
  .chklist{font-size:12px;line-height:1.7}
  .chklist div{display:flex;justify-content:space-between;gap:8px;color:#9aa3ab}
  .chklist b{font-weight:600}.chklist .ok{color:#7fd39a}.chklist .no{color:#f0b35a}.chklist .na{color:#5c646d}
</style>
</head>

  axis(){ const c=Math.cos(this.phi); return [Math.cos(this.psi)*c,Math.sin(this.psi)*c,Math.sin(this.phi)]; }
}

function fmProps(){ /* mass, height of the centre of mass, I about the contact edge, I3 of the spinning disk (SI) */
  let M=M_MOTOR, Ms=M_MOTOR*0.036, I1=M_MOTOR*(0.055**2/12+0.036**2), I3=0;
  if(ST.cwAt==="motor"){ const [m,R]=DISKS["26_4"]; M+=m; Ms+=m*0.074; I1+=m*(0.25*R*R+0.074**2); }
  if(ST.coupler&&ST.disk){ const [m,R]=DISKS[ST.diskKey], z=ST.cwAt==="motor"?0.086:0.081; M+=m; Ms+=m*z; I1+=m*(0.25*R*R+z*z); I3=0.5*m*R*R; }
  return [M,Ms/M,I1,I3]; }
const FM_B=0.016;    /* half-width of the clamp block the device stands on, m */
function fmTick(dt){ if(ST.motorAt!=="desk") return;
  const [M,l,I1,I3]=fmProps(), V=FM.powerOn&&!kit.burnt?kit.volt*kit.pol:0;
  if(FM.powerOn&&kit.volt>MOTOR_BURN_VOLT){ kit.overVoltT+=dt; if(kit.overVoltT>MOTOR_BURN_TIME) kit.burnt=true; }
  if(I3>0){ const [,R,th]=DISKS[ST.diskKey], c0=DRAG_C0*(R/R_REF)**5, c1=DRAG_C1*(R/R_REF)**4*th, aw=Math.abs(FM.w), sg=Math.sign(FM.w)||Math.sign(V)||1;
    let tq=(K_EMF/R_ARM_COIL)*(V-K_EMF*FM.w)-(K_EMF/R_ARM_COIL)*(c0+c1)*aw**DRAG_N*sg-4.0e-4*sg*(aw>0.5?1:aw/0.5);
    let nw=FM.w+tq/I3*dt; if(V===0&&nw*FM.w<0) nw=0; FM.w=nw; FM.spin=mod2pi(FM.spin+FM.w*dt); }
  else FM.w=0;
  const L3=I3*Math.abs(FM.w), stab=L3*L3/(4*I1*M*G*l+1e-12), thc=Math.atan(FM_B/l), fall=Math.atan(0.075/0.12);

    const wn=L3/I1; FM.dtheta+=(-0.25*wn*wn*FM.theta)*dt; FM.dtheta*=Math.exp(-1.5*dt); FM.theta=Math.max(0,FM.theta+FM.dtheta*dt); FM.az+=M*G*l/Math.max(L3,1e-6)*dt*Math.sign(FM.w||1); }
  else { const g=1-stab;   /* the spin only part-way props it up */
    if(FM.theta<thc&&FM.dtheta<=0.4){ FM.dtheta+=(-60*FM.theta-6*FM.dtheta)*dt; }
    else FM.dtheta+=g*M*G*(l*Math.sin(FM.theta)-FM_B*Math.cos(FM.theta))/I1*dt;
    FM.theta=Math.max(0,FM.theta+FM.dtheta*dt); if(L3>0) FM.az+=M*G*l/Math.max(L3,1e-3)*dt*0.15;

}

  return null; }
function renderStatus(){
  const L=[], st=d().st, n=nextStep(); if(n) L.push([n,false]);
  if(kit.burnt) L.push([st.burnt,true]); else if((kit.powerOn||FM.powerOn)&&kit.volt>MOTOR_BURN_VOLT) L.push([st.warn6,true]);
  if(kit.runT>OVERHEAT_TIME) L.push([st.overheat,true]);
  const live=motorLive();
  if(live&&ST.motorAt==="tube"&&!allTight(ST.mc)) L.push([st.mcLoose,true]);
  if(live&&ST.motorAt&&ST.coupler&&ST.disk&&!driveTight()) L.push([st.driveLoose,true]);
  if(inst("pole")&&!ST.hk) L.push([st.hkLoose,true]);
  if(inst("tube")&&!ST.tk&&Math.abs(kit.w_s)>5) L.push([st.tkLoose,true]);
  if(inst("stand")&&!ST.feet.some(Boolean)&&inst("pole")) L.push([st.noFeet,false]);
  if(ST.motorAt==="desk"&&fmFallen()) L.push([st.fmFallen,true]);
  if(inst("tube")&&!kit.held&&Math.abs(kit.phi)>=PHI_STOP-1e-4&&Math.abs(kit.w_s)>30) L.push([st.holder,false]);
  if(msg.s&&performance.now()-msg.t<9000) L.push(["• "+msg.s,msg.warn]);
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join("");
  if(box.innerHTML!==html) box.innerHTML=html;
}

/* ══════════════════════════════════════════════════════════════
   9.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.tray; $("t-cap").textContent=t.cap;
  $("t-instrcap").textContent=t.instrcap; $("t-adlbl").textContent=t.adlbl; $("t-golbl").textContent=t.golbl; $("t-rulbl").textContent=t.rulbl;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("t-h-speed").textContent=t.hSpeed; $("t-speedhint").textContent=t.speedHint; $("t-h-chk").textContent=t.hChk;
  $("t-h-hand").textContent=t.hHand; $("t-handhelp").textContent=t.handHelp;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2024 E1 — 자이로스코프 · HaslaLab":"APhO 2024 E1 — Gyroscope · HaslaLab";
  updSw(); renderLaps(); renderSpeeds(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   10.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), fr=0;
kit.tubeLocked=false;
function tick(){
  const now=performance.now(), raw=Math.min(0.05,(now-last)/1000); last=now;
  const dt=raw*timeScale, sub=Math.max(1,Math.ceil(dt/0.004));
  syncKit();
  /* feet without their star knobs rest on the casting; an unclamped rod leans in the boss */
  kit.knobEff=[0,1,2].map(i=>(ST.feet[i]?kit.knob[i]:-0.008)+(inst("pole")&&!ST.hk&&i===1?0.006:0));
  powerChain();
  for(let i=0;i<sub;i++){ kit.step(dt/sub); fmTick(dt/sub); }
  /* a loose tube slides down through the head; a loose M6 screw lets the 26 cm disk come off */
  if(inst("tube")&&!ST.tk&&!kit.held&&!(drag&&drag.k==="arm")) kit.r_m=Math.max(0.08,Math.min(TUBE_L-0.12,kit.r_m-0.06*Math.sin(kit.phi)*dt));
  if(ST.cwAt==="tube"&&!ST.cw&&(kit.held||Math.abs(kit.dpsi)>0.05||Math.abs(kit.w_s)>5)){ ST.cwAt=null; kit.nBoltCw=0; say(t_().cwFell,true); }
  ctx.setTransform(DPR*S,0,0,DPR*S,0,0); ctx.clearRect(0,0,LW,LH);
  drawBench();
  const on=has("sw"); $("swLbl").textContent=on?fmtTime(swValue()):"-:--.--"; $("swLbl").style.opacity=on?1:0.4;
  $("swHint").textContent=on?d().swOk:d().swHint;
  if(++fr%3===0){ drawAdPanel(); drawGoPanel(); drawRuPanel(); }
  if(fr%10===0){ renderStatus(); renderChk(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
