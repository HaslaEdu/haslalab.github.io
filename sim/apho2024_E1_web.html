<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}

  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);

  #closeCv{touch-action:none}
  .instr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .instr3 canvas{display:block;width:100%;background:var(--deep);border-radius:6px}
  .ilbl{font-size:12px;color:#f2c14e;font-weight:700;margin:0 0 4px}
  @media(max-width:900px){.instr3{grid-template-columns:1fr}}

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){

/* seven-segment digits, for the meters and the scale */

  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;

      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

/* the strings the meters show, right-aligned on 3½ digits */

  if(!str) return;

  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;

/* ── the room: desk, the wall with its socket ── */
function drawRoom(){

  if(hand.move){ hand=null; say(t.moved(itemName(k))); return; }
  if(k==="bolts"){ if(!toolsOn()){ say(t.needTools,true); return; }
    const on=inst("disk")&&inZ(ZONES.disk,p)?"disk":inst("cw")&&inZ(ZONES.cw,p)?"cw":null; if(!on){ say(t.notHere,true); return; }
    if(spinning()){ say(t.spinning,true); return; }
    if(on==="disk"){ if(kit.nBoltSd>=12){ say(t.boltFull,true); return; } kit.nBoltSd++; say(t.boltOn(d().lab.disk,kit.nBoltSd)); }
    else { if(kit.nBoltCw>=12){ say(t.boltFull,true); return; } kit.nBoltCw++; say(t.boltOn(d().lab.cw,kit.nBoltCw)); }
    return; }
  if(k==="mat"||(DESK_ITEMS.includes(k)&&!((k==="gonio"&&inst("tube")&&inZ(ZONES.head,p,10))||(k==="ruler"&&inst("tube")&&(inZ(ZONES.endR,p,6)||inZ(ZONES.endL,p,6)||onTube(p)))))){
    ST.pos[k]=deskXY(k,p); ST.on.add(k); hand=null; say(t.placed(itemName(k))); return; }
  if(k==="gonio"){ ST.on.add("gonio"); ST.gonio=true; hand=null; say(t.placed(itemName(k))); return; }
  if(k==="ruler"){ ST.on.add("ruler"); ST.ruler=true; hand=null; say(t.placed(itemName(k))); return; }
  let ok=false;
  if(k==="stand") ok=inZ(ZONES.mat,p);
  else if(k==="pole") ok=inZ(ZONES.stand,p);
  else if(k==="tube") ok=inZ(ZONES.head,p,14);
  else if(k==="motor"||k==="coupler"||k.startsWith("d20_")) ok=inZ(ZONES.endR,p,14)||inZ(ZONES.disk,p);
  else if(k==="cw") ok=inZ(ZONES.endL,p,14);
  if(!ok){ say(t.notHere,true); return; }
  if(k==="stand"){ const [x,y]=unP(p[0],p[1],0.3); ST.standOff=[Math.max(-6,Math.min(6,x-ST.pos.mat[0])),Math.max(-3,Math.min(3,y-ST.pos.mat[1]))]; }
  if(k==="tube"){ kit.resetMotion(); kit.psi=-25*Math.PI/180; kit.phi=-PHI_STOP; }
  if(k.startsWith("d20_")){ kit.diskKey=k.slice(1); kit.installed.add("disk"); }
  else kit.installed.add(k);
  hand=null; say(t.placed(itemName(k)));
}
/* is p near the drawn tube? */
function onTube(p){ if(!inst("tube")) return false; const f=frame(), a=P3(along(-kit.r_c*100,f)), b=P3(along(kit.r_m*100,f)), ab=sub2(b,a), tt=Math.max(0,Math.min(1,dot2(sub2(p,a),ab)/dot2(ab,ab)));
  return len2(sub2(p,add2(a,mul2(ab,tt))))<1.2*SZ(); }

/* the arm in the hand: solve for the turn ψ and the tilt φ that put the grabbed end under the pointer */
function aimArm(side,target){
  const O=pivot(), L=(side>0?kit.r_m:kit.r_c)*100*side;
  const f=(a,b)=>P3(vadd(O,vmul([Math.cos(a)*Math.cos(b),Math.sin(a)*Math.cos(b),Math.sin(b)],L)));
  let ps=kit.psi, ph=kit.phi;
  for(let it=0;it<10;it++){ const p0=f(ps,ph), e=[target[0]-p0[0],target[1]-p0[1]], h=1e-3, pa=f(ps+h,ph), pb=f(ps,ph+h);
    const a=(pa[0]-p0[0])/h, b=(pb[0]-p0[0])/h, c=(pa[1]-p0[1])/h, dd=(pb[1]-p0[1])/h, lam=0.02*(a*a+b*b+c*c+dd*dd)+1e-9;
    const m11=a*a+c*c+lam, m12=a*b+c*dd, m22=b*b+dd*dd+lam, r1=a*e[0]+c*e[1], r2=b*e[0]+dd*e[1], det=m11*m22-m12*m12;
    let x=(m22*r1-m12*r2)/det, y=(m11*r2-m12*r1)/det; const n=Math.hypot(x,y); if(n>0.3){ x*=0.3/n; y*=0.3/n; }
    ps+=x; ph=Math.max(-PHI_STOP,Math.min(PHI_STOP,ph+y)); }
  kit.psi=mod2pi(ps); kit.phi=ph; kit.dpsi=0; kit.dphi=0;
}
let drag=null;
function zoneAt(p){
  for(const z of ["lock","mjack","foot0","foot1","foot2","acPlug","dcPlug","term"]) if(inZ(ZONES[z],p,2)) return z;
  if(inst("cw")&&inZ(ZONES.cw,p)) return "cw";
  if(inst("tube")&&inZ(ZONES.endR,p,4)) return "endR";
  if(inst("tube")&&inZ(ZONES.endL,p,4)) return "endL";
  for(const k of ["sw","tools","adapter","ruler","gonio"]) if(has(k)&&!(k==="gonio"&&ST.gonio)&&!(k==="ruler"&&ST.ruler)&&inZ(ZONES[k],p,2)) return k;
  if(inst("disk")&&inZ(ZONES.disk,p)) return "disk";
  if(inst("tube")&&onTube(p)) return "tube";
  if(inst("pole")&&inZ(ZONES.head,p,2)) return "head";
  if(inst("stand")&&inZ(ZONES.stand,p)) return "stand";
  if(has("mat")&&inZ(ZONES.mat,p)) return "mat";
  return null;
}
function turnFoot(i,steps){ kit.knob[i]=Math.max(-KNOB_RANGE,Math.min(KNOB_RANGE,kit.knob[i]+steps*KNOB_STEP)); }
function benchDown(p,right,e){
  const t=d().m;
  if(hand){
    if(right){ if(hand.move){ ST.pos[hand.item]=hand.orig; say(t.stays); } else if(hand.plug) say(t.plugOut); else say(t.removed(itemName(hand.item))); hand=null; return; }
    place(p); return; }
  let z=zoneAt(p);
  if(right){
    if(!z) return;
    if(z==="endR"&&inst("disk")) z="disk"; if(z==="endL"&&inst("cw")) z="cw";
    if(z.startsWith("foot")){ turnFoot(+z[4],-5); say(t.knob(+z[4],false)); return; }
    if(z==="acPlug"){ if(ST.ac){ ST.ac=false; say(t.plugOut); } return; }
    if(z==="dcPlug"||z==="term"){ if(ST.dc){ ST.dc=false; say(t.plugOut); } return; }
    if(z==="mjack"){ if(ST.mjack){ ST.mjack=false; say(t.motorJackOff); } return; }
    if(z==="disk"){ if(kit.nBoltSd){ if(spinning()){ say(t.spinning,true); return; } kit.nBoltSd--; say(t.boltOff(d().lab.disk,kit.nBoltSd)); return; } returnPart("disk"); return; }
    if(z==="cw"){ if(kit.nBoltCw){ if(spinning()){ say(t.spinning,true); return; } kit.nBoltCw--; say(t.boltOff(d().lab.cw,kit.nBoltCw)); return; } returnPart("cw"); return; }
    if(z==="endR"){ returnPart(inst("disk")?"disk":inst("coupler")?"coupler":inst("motor")?"motor":ST.ruler?"ruler":"tube"); return; }
    if(z==="endL"){ returnPart(inst("cw")?"cw":ST.ruler?"ruler":"tube"); return; }
    if(z==="tube"){ returnPart(ST.ruler?"ruler":"tube"); return; }
    if(z==="head"||z==="lock"){ returnPart(ST.gonio?"gonio":inst("tube")?"tube":"pole"); return; }
    if(z==="stand"){ returnPart(inst("pole")?"pole":"stand"); return; }
    returnPart(z); return; }
  if(!z){ drag=e&&e.shiftKey?{k:"pan",p,v:[VIEW.px,VIEW.py]}:{k:"orbit",p,v:[CAM.az,CAM.el]}; return; }
  if(z==="lock"){ kit.tubeLocked=!kit.tubeLocked; say(t.lock(kit.tubeLocked)); return; }
  if(z==="mjack"){ if(ST.mjack){ ST.mjack=false; say(t.motorJackOff); } else { ST.mjack=true; say(t.motorJack); } return; }
  if(z.startsWith("foot")){ turnFoot(+z[4],5); say(t.knob(+z[4],true)); return; }
  if(z==="acPlug"){ if(ST.ac){ ST.ac=false; } hand={plug:"ac"}; say(t.plugAc); return; }
  if(z==="dcPlug"||z==="term"){ if(z==="term"&&!ST.dc) return; ST.dc=false; hand={plug:"dc"}; say(t.plugDc); return; }
  if(z==="endR"||z==="endL"||z==="disk"||z==="cw"||z==="tube"){
    const side=(z==="endL"||z==="cw")?-1:z==="tube"?(dot2(sub2(p,P3(pivot())),sub2(P3(along(1,frame())),P3(pivot())))>=0?1:-1):1;
    const O=pivot(), endP=P3(vadd(O,vmul(kit.axis(),(side>0?kit.r_m:kit.r_c)*100*side)));
    drag={k:"arm",side,p,t0:performance.now(),off:sub2(p,endP),r0:kit.r_m,moved:false,cw:z==="cw"||z==="endL"}; return; }
  if(z==="mat"&&!spinning()||DESK_ITEMS.includes(z)){ hand={item:z,move:true,orig:[...ST.pos[z]]}; say(t.moveIt(itemName(z))); return; }
  drag={k:"orbit",p,v:[CAM.az,CAM.el]};
}
function benchMove(p){
  if(hand&&hand.move){ ST.pos[hand.item]=deskXY(hand.item,p); return; }
  if(!drag) return;
  if(drag.k==="pan"){ VIEW.px=drag.v[0]+p[0]-drag.p[0]; VIEW.py=drag.v[1]+p[1]-drag.p[1]; return; }
  if(drag.k==="orbit"){ CAM.az=Math.max(-1.1,Math.min(1.1,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.el=Math.max(0.18,Math.min(1.0,drag.v[1]+(p[1]-drag.p[1])*0.004)); setCam(); return; }
  if(drag.k==="arm"){
    if(!drag.moved&&len2(sub2(p,drag.p))<4) return; drag.moved=true;
    if(!kit.tubeLocked){ const f=frame(), a=P3(along(0,f)), b=P3(along(1,f)), u=sub2(b,a), dr=dot2(sub2(p,drag.p),u)/dot2(u,u);
      kit.r_m=Math.max(0.08,Math.min(TUBE_L-0.12,drag.r0+drag.side*dr/100)); return; }
    kit.held=true; aimArm(drag.side,sub2(p,drag.off)); }
}
function benchUp(){
  if(!drag) return;
  if(drag.k==="arm"){ const t=d().m;
    if(kit.held){ kit.held=false; kit.dpsi=0; kit.dphi=0; kit.trail=[]; say(t.released); }
    else if(!drag.moved&&drag.cw&&performance.now()-drag.t0<250&&kit.tubeLocked){ kit.impulse(); say(t.impulse); } }
  drag=null;
}
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; if(TAB.k!=="bench") return; cv.setPointerCapture(e.pointerId); benchDown(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p; if(TAB.k!=="bench") return; benchMove(p);
  if(!drag&&!hand){ const z=zoneAt(p); cv.style.cursor=!z?"default":["endR","endL","disk","cw","tube"].includes(z)?"grab":"pointer"; } else if(drag&&drag.k==="arm") cv.style.cursor="grabbing"; });
cv.addEventListener("pointerup",()=>{ benchUp(); });
cv.addEventListener("dblclick",e=>{ const p=lpos(e); if(!zoneAt(p)){ VIEW.z=1; VIEW.px=0; VIEW.py=0; CAM.az=0.36; CAM.el=0.44; setCam(); } });
cv.addEventListener("wheel",e=>{ if(TAB.k!=="bench") return; e.preventDefault(); const p=lpos(e), z=zoneAt(p), up=e.deltaY<0;
  if(z&&z.startsWith("foot")){ turnFoot(+z[4],up?1:-1); return; }
  const nz=Math.max(0.6,Math.min(3,VIEW.z*(up?1.12:1/1.12))), k=nz/VIEW.z;
  VIEW.px=p[0]-LW/2-(p[0]-LW/2-VIEW.px)*k; VIEW.py=p[1]-LH/2-(p[1]-LH/2-VIEW.py)*k; VIEW.z=nz; },{passive:false});
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ if(hand.move) ST.pos[hand.item]=hand.orig; hand=null; drawTray(); } });

/* the parts box */
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move&&!hand.plug){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top, t=d().m;
  if(TAB.k!=="bench"){ setTab("bench"); }
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    if(hand&&(hand.move||hand.plug)) return;
    if(hand&&hand.item===k){ hand=null; drawTray(); return; }
    hand=null;
    if(isOut(k)) return;
    if(k.startsWith("d20_")&&inst("disk")){ say(t.oneDisk,true); drawTray(); return; }
    const req=REQ[k]; if(req&&!inst(req)&&!has(req)){ say(t.need(itemName(req)),true); drawTray(); return; }
    if((k==="coupler"||k.startsWith("d20_")||k==="cw")&&!toolsOn()){ say(t.needTools,true); drawTray(); return; }
    if(k==="motor"&&kit.burnt){ kit.burnt=false; }
    hand={item:k}; say(k==="bolts"?t.boltPick:t.placeIt(itemName(k))); drawTray(); return; } });

/* ══════════════════════════════════════════════════════════════
   8.  PANEL
   ══════════════════════════════════════════════════════════════ */
function fmtTime(v){ v=Math.max(0,v); const m=Math.floor(v/60), s=v-60*m; return m+":"+s.toFixed(2).padStart(5,"0"); }
function swValue(){ return sw.acc+(sw.run?kit.t-sw.t0:0); }
const swGate=()=>{ if(has("sw")) return true; say(d().swNeed,true); return false; };
$("swBtn").onclick=()=>{ if(!swGate()) return; if(sw.run){ sw.acc+=kit.t-sw.t0; sw.run=false; } else { sw.t0=kit.t; sw.run=true; } updSw(); };
$("swLap").onclick=()=>{ if(!swGate()) return; sw.laps.push(swValue()); renderLaps(); };
$("swReset").onclick=()=>{ if(!swGate()) return; sw={acc:0,run:false,t0:kit.t,laps:[]}; renderLaps(); updSw(); };
function updSw(){ const b=$("swBtn"); b.textContent=sw.run?d().stop:d().start; b.classList.toggle("run",sw.run); }
function renderLaps(){ const box=$("laps"); box.innerHTML="";
  for(let i=sw.laps.length-1;i>=0;i--){ const el=document.createElement("div"); el.textContent=String(i+1).padStart(2," ")+"   "+fmtTime(sw.laps[i]); box.appendChild(el); } }
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,2,5,10,20]){ const b=document.createElement("button"); b.textContent=s+"×"; if(s===timeScale) b.className="on";
    b.onclick=()=>{ timeScale=s; renderSpeeds(); }; box.appendChild(b); } }
$("polBtn").onclick=()=>{ const t=d().m; if(!inst("motor")) { say(t.need(itemName("motor")),true); return; } if(!toolsOn()){ say(t.needDriver,true); return; }
  if(ST.knob>0){ say(t.knobFirst,true); return; } kit.pol*=-1; say(t.pol); };
function renderG(){
  $("gList").textContent=[...pg.stack].reverse().map((k,i)=>(pg.stack.length-i)+". "+d().gParts[k]).join("\n");
  const add=$("gAdd"); add.innerHTML="";
  for(const k of ["motor","cw","disk"]){ const b=document.createElement("button"); b.style.width="100%"; b.textContent="+ "+d().gParts[k];
    b.disabled=pg.stack.includes(k)||pg.running; b.onclick=()=>{ pg.stack.push(k); renderG(); }; add.appendChild(b); }
  const row=$("gDiskRow"); row.innerHTML="";
  for(const k of ["20_2","20_3","20_4"]){ const b=document.createElement("button"); b.textContent=DISKS[k][3]; b.className=pg.disk===k?"on":"";
    b.onclick=()=>{ pg.disk=k; renderG(); }; row.appendChild(b); }
}
$("gClear").onclick=()=>{ pg.stack=[]; pg.running=false; pg.theta=4*Math.PI/180; pg.dtheta=0; pg.w=0; renderG(); };
$("gRun").onclick=()=>{ if(!pg.stack.includes("disk")){ say(d().gNoDisk,true); return; }
  Object.assign(pg,{running:true,theta:4*Math.PI/180,dtheta:0,w:0}); renderG(); };
$("gStop").onclick=()=>{ pg.running=false; renderG(); };
/* what to do next, read off the bench */
function nextStep(){
  if(!has("mat")) return null;
  for(const k of ["stand","pole","tube","motor","coupler"]) if(!inst(k)) return itemName(k);
  if(!inst("disk")) return itemName("d20_3");
  if(!has("adapter")) return itemName("adapter");
  return "";
}
function renderStatus(){
  const L=[], t=d(), st=t.st;
  if(TAB.k==="bench"){
    if(!has("mat")&&!inst("stand")) L.push([st.nothing,false]);
    else { const n=nextStep(); if(n) L.push([st.next(n),false]);
      else if(!ST.ac) L.push([st.noPower,false]);
      else if(!ST.dc) L.push([st.noDc,false]);
      else if(!ST.mjack) L.push([st.noMotorJack,false]);
      else if(ST.knob===0) L.push([st.ready,false]); }
    if(kit.burnt) L.push([st.burnt,true]); else if(kit.powerOn&&kit.volt>MOTOR_BURN_VOLT) L.push([st.warn6,true]);
    if(kit.runT>OVERHEAT_TIME) L.push([st.overheat,true]);
    if(inst("tube")&&!kit.held&&Math.abs(kit.phi)>=PHI_STOP-1e-4&&Math.abs(kit.w_s)>30) L.push([st.holder,false]);
  }
  if(msg.s&&performance.now()-msg.t<9000) L.push(["• "+msg.s,msg.warn]);
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join("");
  if(box.innerHTML!==html) box.innerHTML=html;
}

/* ══════════════════════════════════════════════════════════════
   9.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.tray;
  $("t-instrcap").textContent=t.instrcap; $("t-adlbl").textContent=t.adlbl; $("t-golbl").textContent=t.golbl; $("t-rulbl").textContent=t.rulbl;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("t-h-speed").textContent=t.hSpeed; $("t-speedhint").textContent=t.speedHint;
  $("t-h-hand").textContent=t.hHand; $("t-handhelp").textContent=t.handHelp; $("polBtn").textContent=t.pol;
  $("t-h-gbuild").textContent=t.hGBuild; $("t-h-gdisk").textContent=t.hGDisk; $("t-h-gvolt").textContent=t.hGVolt;
  $("gRun").textContent=t.gRun; $("gStop").textContent=t.gStop; $("gClear").textContent=t.gClear; $("t-gnote").textContent=t.gNote;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2024 E1 — 자이로스코프 · HaslaLab":"APhO 2024 E1 — Gyroscope · HaslaLab";
  updSw(); renderLaps(); renderSpeeds(); renderG(); setTab(TAB.k); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   10.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), fr=0;
function tick(){
  const now=performance.now(), raw=Math.min(0.05,(now-last)/1000); last=now;
  const dt=raw*timeScale, sub=Math.max(1,Math.ceil(dt/0.004));
  powerChain();
  for(let i=0;i<sub;i++) kit.step(dt/sub);
  gTick(raw);
  ctx.setTransform(DPR*S,0,0,DPR*S,0,0); ctx.clearRect(0,0,LW,LH);
  if(TAB.k==="bench") drawBench(); else drawG();
  const on=has("sw"); $("swLbl").textContent=on?fmtTime(swValue()):"-:--.--"; $("swLbl").style.opacity=on?1:0.4;
  $("swHint").textContent=on?d().swOk:d().swHint;
  $("gvl").textContent=(+$("gv").value).toFixed(1)+" V";
  if(++fr%3===0&&TAB.k==="bench"){ drawAdPanel(); drawGoPanel(); drawRuPanel(); }
  if(fr%10===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
