  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}

  .pc.held{background:#4a3e1d;border-color:var(--accent)}
  .txt{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;

            margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}

  .row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .row button{flex:1 1 auto;text-align:center;margin:2px 0;padding:5px 6px;font-size:12px}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);

    <canvas id="ruler"></canvas>
    <p class="hint" id="t-rulerhint"></p>

    <h2>Part F</h2>
    <button id="impulse" style="width:100%"></button>
    <div class="row"><button id="liftU"></button><button id="liftD"></button></div>

    <h2 id="t-h-view"></h2>
    <label class="chk"><input type="checkbox" id="gonio"><span id="t-gonio"></span></label>
    <label class="chk"><input type="checkbox" id="trail"><span id="t-trail"></span></label>
    <div class="row" id="speeds"></div>
  </aside>

    <div id="gAdd"></div>
    <button id="gClear" style="width:100%">↺</button>
    <h2 id="t-h-gdisk"></h2>
    <div class="row" id="gDiskRow"></div>
    <h2 id="t-h-gvolt"></h2>
    <input type="range" id="gv" min="0" max="6" step="0.1" value="5">

    <div class="row"><button id="gRun"></button><button id="gStop"></button></div>
    <div class="warn" id="gMsg"></div>
    <p class="hint" id="t-gnote"></p>
  </aside>
</div>

   1.  PHYSICS  —  identical to the Python constants

const G=9.81;
const NOLOAD_SLOPE=2074.99, NOLOAD_INTCP=-143.66;
const K_EMF=4.602099e-3, R_ARM_COIL=2.0;
const DRAG_N=2.590, DRAG_C0=7.856826e-08, DRAG_C1=2.085102e-04, R_REF=0.100;
const MOTOR_BURN_VOLT=6.0, MOTOR_BURN_TIME=12.0, OVERHEAT_TIME=600.0;
const M_MOTOR=0.094;
const DISKS={"20_2":[0.065,0.100,0.002,"20 cm × 2 mm"],"20_3":[0.089,0.100,0.003,"20 cm × 3 mm"],
             "20_4":[0.131,0.100,0.004,"20 cm × 4 mm"],"26_4":[0.231,0.130,0.004,"26 cm × 4 mm"]};

const KNOB_STEP=5.0e-5, KNOB_RANGE=3.0e-3;

const REQUIRED=new Set(["mat","stand","knobs","pole","tube","motor","coupler","disk","adapter"]);
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const TAU=2*Math.PI, mod2pi=a=>((a%TAU)+TAU)%TAU;

class Kit{
  constructor(){ this.resetAll(); }
  resetAll(){
    this.installed=new Set(); this.diskKey="20_3"; this.nBoltCw=0; this.nBoltSd=0;
    this.r_m=0.15; this.tubeLocked=true;
    this.knob=[0,1,2].map(()=>(Math.random()*2-1)*1.2e-3);
    this.volt=0; this.powerOn=false; this.burnt=false; this.overVoltT=0; this.runT=0; this.jit=1;
    this.resetMotion(); this.t=0;
  }
  resetMotion(){ this.w_s=0; this.psi=0; this.dpsi=0; this.phi=0; this.dphi=0; this.spinAng=0; this.trail=[]; }
  ready(){ for(const k of REQUIRED) if(!this.installed.has(k)) return false; return true; }
  disk(){ return DISKS[this.diskKey]; }
  get r_c(){ return TUBE_L-this.r_m; }
  mHead(){ let m=this.installed.has("motor")?M_MOTOR:0; if(this.installed.has("disk")) m+=this.disk()[0]+this.nBoltSd*M_BOLT; return m; }
  mCw(){ return this.installed.has("cw")?DISKS["26_4"][0]+this.nBoltCw*M_BOLT:0; }
  imbalance(){ return this.mHead()*this.r_m-this.mCw()*this.r_c; }
  I3(){ if(!this.installed.has("disk")) return 0; const [m,R]=this.disk(); return 0.5*m*R*R+this.nBoltSd*M_BOLT*R*R; }
  I1(){
    let I=this.mHead()*this.r_m**2+this.mCw()*this.r_c**2;
    if(this.installed.has("disk")){ const [m,R]=this.disk(); I+=0.25*m*R*R; }
    if(this.installed.has("cw")) I+=0.25*DISKS["26_4"][0]*DISKS["26_4"][1]**2;
    return Math.max(I,1e-6);
  }
  tilt(){
    const h=this.knob, p=[0,1,2].map(i=>{ const a=(90+120*i)*Math.PI/180; return [BASE_R*Math.cos(a),BASE_R*Math.sin(a),h[i]]; });
    const u=[p[1][0]-p[0][0],p[1][1]-p[0][1],p[1][2]-p[0][2]], v=[p[2][0]-p[0][0],p[2][1]-p[0][1],p[2][2]-p[0][2]];
    let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
    const L=Math.hypot(...n); if(!L||!n[2]) return [0,0];
    n=n.map(x=>x/L); if(n[2]<0) n=n.map(x=>-x);
    return [Math.acos(Math.max(-1,Math.min(1,n[2]))), Math.atan2(-n[1],-n[0])];
  }
  dragCoef(){ if(!this.installed.has("disk")) return [0,0]; const [,R,t]=this.disk();
    return [DRAG_C0*(R/R_REF)**5, DRAG_C1*(R/R_REF)**4*t]; }
  step(dt){
    this.t+=dt; if(!this.ready()) return;
    const V=(this.powerOn&&!this.burnt)?this.volt:0;
    const lam=Math.exp(-dt/6);
    this.jit=1+(this.jit-1)*lam+gauss()*JITTER_SIGMA*Math.sqrt(Math.max(0,1-lam*lam));
    if(this.powerOn&&this.volt>MOTOR_BURN_VOLT){ this.overVoltT+=dt; if(this.overVoltT>MOTOR_BURN_TIME) this.burnt=true; }
    else this.overVoltT=Math.max(0,this.overVoltT-dt*0.5);
    this.runT=(this.powerOn&&V>0)?this.runT+dt:Math.max(0,this.runT-dt);
    const I3=this.I3();
    if(I3>0){
      const [c0,c1]=this.dragCoef(), drag=(c0+c1)*this.jit*this.w_s**DRAG_N;
      let tq=(K_EMF/R_ARM_COIL)*((V-K_EMF*this.w_s)-drag);
      tq-=4.0e-4*(this.w_s>0.5?1:this.w_s/0.5);
      this.w_s=Math.max(0,this.w_s+tq/I3*dt);
    }
    this.spinAng=mod2pi(this.spinAng+this.w_s*dt);
    /* fast-top linearisation: steady precession + a damped nutation oscillator.
       phi_eq is where the arm really settles (bearing play + tube sag) */
    const Q=this.imbalance(), I1=this.I1(), L3=I3*this.w_s, [alpha,az]=this.tilt();
    const tauG=Q*G*(1+LEVEL_SENS*Math.sin(alpha)*Math.cos(this.psi-az));
    const sag=Math.min(SAG_MAX,SAG0+SAG_K*Math.abs(Q*G));
    const phiEq=Math.abs(Q)>1e-9?-Math.sign(Q)*sag:0;
    if(L3>L3_MIN){
      const wn=L3/I1;
      this.dphi+=(-wn*wn*(this.phi-phiEq)-2*ZETA_NUT*wn*this.dphi)*dt;
      this.phi+=this.dphi*dt;
      this.dpsi=tauG/L3-wn*(this.phi-phiEq);
      this.psi=mod2pi(this.psi+this.dpsi*dt);
    } else {
      this.dphi+=(-25*(this.phi-phiEq)-7*this.dphi)*dt; this.phi+=this.dphi*dt;
      let tl=-G*Math.sin(alpha)*Q*Math.cos(this.phi)*Math.sin(this.psi-az);
      if(Math.abs(tl)<TAU_BEARING&&Math.abs(this.dpsi)<2e-3){ tl=0; this.dpsi=0; }
      else if(Math.abs(this.dpsi)>1e-4) tl-=Math.sign(this.dpsi)*TAU_BEARING;
      this.dpsi+=(tl/I1-DAMP_PSI*this.dpsi)*dt;
      this.psi=mod2pi(this.psi+this.dpsi*dt);
    }
    if(this.phi<-PHI_STOP){ this.phi=-PHI_STOP; this.dphi=0; }
    if(this.phi>PHI_STOP){ this.phi=PHI_STOP; this.dphi=0; }
    this.trail.push([this.t,this.psi,this.phi]);
    while(this.trail.length&&this.t-this.trail[0][0]>2.5) this.trail.shift();
  }
  impulse(){ this.dphi+=0.55; this.trail=[]; }
  lift(up){ this.phi+=(up?1:-1)*6*Math.PI/180; this.dphi=0; this.trail=[]; }
  turnArm(deg){ this.psi=mod2pi(this.psi+deg*Math.PI/180); this.dpsi=0; }
  axis(){ const c=Math.cos(this.phi); return [Math.cos(this.psi)*c,Math.sin(this.psi)*c,Math.sin(this.phi)]; }
}

/* ══════════════════════════════════════════════════════════════
   2.  A SMALL 3-D RENDERER  (orthographic, painter's algorithm)
   ══════════════════════════════════════════════════════════════ */
const norm=v=>{ const n=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/n,v[1]/n,v[2]/n]; };
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function shade(hex,f){ const h=hex.replace("#",""); const c=[0,2,4].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(h.substr(i,2),16)*f))));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join(""); }
class Scene{
  constructor(){ this.az=38*Math.PI/180; this.el=16*Math.PI/180; this.scale=900; this.cx=460; this.cy=330; this.items=[]; }
  dirs(){ const ca=Math.cos(this.az), sa=Math.sin(this.az), ce=Math.cos(this.el), se=Math.sin(this.el);
    return [[-sa,ca,0],[-ca*se,-sa*se,ce],[ca*ce,sa*ce,se]]; }
  prj(p){ const [r,u]=this.D; return [(p[0]*r[0]+p[1]*r[1]+p[2]*r[2])*this.scale+this.cx, -(p[0]*u[0]+p[1]*u[1]+p[2]*u[2])*this.scale+this.cy]; }
  depth(p){ const f=this.D[2]; return p[0]*f[0]+p[1]*f[1]+p[2]*f[2]; }
  begin(){ this.D=this.dirs(); this.items=[]; }
  poly(pts,fill,outline,width,dash){ let dd=0; for(const p of pts) dd+=this.depth(p);
    this.items.push([dd/pts.length,"poly",pts.map(p=>this.prj(p)),fill,outline,width||1,dash]); }
  line(a,b,fill,width,dash){ this.items.push([(this.depth(a)+this.depth(b))/2,"line",[this.prj(a),this.prj(b)],fill,"",width||2,dash]); }
  dot(p,r,fill){ this.items.push([this.depth(p),"dot",[this.prj(p),r],fill]); }
  text(p,s,fill,size){ this.items.push([this.depth(p)+1e6,"text",[this.prj(p),s,size||9],fill]); }
  static basis(n){ n=norm(n); const a=Math.abs(n[2])<0.9?[0,0,1]:[1,0,0]; const u=norm(cross(n,a)); return [u,cross(n,u)]; }
  disk3(c,n,R,fill,outline,seg,width){ seg=seg||48; const [u,v]=Scene.basis(n), pts=[];
    for(let i=0;i<seg;i++){ const t=TAU*i/seg; pts.push([c[0]+R*(Math.cos(t)*u[0]+Math.sin(t)*v[0]),c[1]+R*(Math.cos(t)*u[1]+Math.sin(t)*v[1]),c[2]+R*(Math.cos(t)*u[2]+Math.sin(t)*v[2])]); }
    this.poly(pts,fill,outline===undefined?"#5a5a5a":outline,width); return pts; }
  cyl(a,b,R,fill,outline,seg){ seg=seg||14; const n=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], [u,v]=Scene.basis(n), ring=[];
    for(let i=0;i<seg;i++){ const t=TAU*i/seg; ring.push([R*(Math.cos(t)*u[0]+Math.sin(t)*v[0]),R*(Math.cos(t)*u[1]+Math.sin(t)*v[1]),R*(Math.cos(t)*u[2]+Math.sin(t)*v[2])]); }
    for(let i=0;i<seg;i++){ const o1=ring[i], o2=ring[(i+1)%seg];
      this.poly([[a[0]+o1[0],a[1]+o1[1],a[2]+o1[2]],[a[0]+o2[0],a[1]+o2[1],a[2]+o2[2]],[b[0]+o2[0],b[1]+o2[1],b[2]+o2[2]],[b[0]+o1[0],b[1]+o1[1],b[2]+o1[2]]],
        shade(fill,0.62+0.38*i/seg),"",1); }
    this.disk3(b,n,R,shade(fill,1.05),outline===undefined?"#555":outline,seg); }
  box(c,n,w,h,dd,fill){ const [u,v]=Scene.basis(n); n=norm(n); const C=[];
    for(const sd of [-dd/2,dd/2]) for(const [sw,sh] of [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]])
      C.push([0,1,2].map(i=>c[i]+n[i]*sd+u[i]*sw+v[i]*sh));
    [[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]].forEach((f,k)=>this.poly(f.map(i=>C[i]),shade(fill,0.72+0.09*k),"#2b2b2b",1)); }
  render(ctx){
    this.items.sort((a,b)=>a[0]-b[0]);
    for(const it of this.items){
      const kind=it[1];
      if(kind==="poly"){ const pts=it[2]; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath();
        if(it[3]){ ctx.fillStyle=it[3]; ctx.fill(); } if(it[4]){ ctx.strokeStyle=it[4]; ctx.lineWidth=it[5]; ctx.setLineDash(it[6]||[]); ctx.stroke(); ctx.setLineDash([]); } }
      else if(kind==="line"){ const [a,b]=it[2]; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
        ctx.strokeStyle=it[3]; ctx.lineWidth=it[5]; ctx.lineCap="round"; ctx.setLineDash(it[6]||[]); ctx.stroke(); ctx.setLineDash([]); }
      else if(kind==="dot"){ const [p,r]=it[2]; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,TAU); ctx.fillStyle=it[3]; ctx.fill(); }
      else if(kind==="text"){ const [p,s,sz]=it[2]; ctx.fillStyle=it[3]; ctx.font=sz+"px 'Segoe UI',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(s,p[0],p[1]); }
    }
  }
}
const COL_MAT="#1f7a72", COL_STAND="#20232a", COL_ALU="#c9ccd1", COL_ACRYL="#dfe9ef", COL_MOTOR="#2c2f36";
function drawKit(sc,kit,ghost,trail){
  const ins=kit.installed, [alpha,az]=kit.tilt(), ca=Math.cos(alpha), sa=Math.sin(alpha);
  const W=p=>[p[0]-sa*Math.cos(az)*p[2], p[1]-sa*Math.sin(az)*p[2], p[2]*ca];
  const GH="#8899a0";
  if(ins.has("mat")||ghost==="mat"){ const g=ghost==="mat";
    sc.poly([[-0.2,-0.16,0],[0.2,-0.16,0],[0.2,0.16,0],[-0.2,0.16,0]],g?"":COL_MAT,g?GH:"#155f59",2,g?[5,4]:null); }
  if(ins.has("stand")||ghost==="stand"){ const g=ghost==="stand", hub=[0,0,0.016];
    for(let i=0;i<3;i++){ const a=(90+120*i)*Math.PI/180, p=[BASE_R*Math.cos(a),BASE_R*Math.sin(a),0.010];
      if(g) sc.line([p[0],p[1],0.006],hub,GH,3,[4,3]);
      else sc.box([(p[0]+hub[0])/2,(p[1]+hub[1])/2,(p[2]+hub[2])/2],[p[0]-hub[0],p[1]-hub[1],p[2]-hub[2]],0.020,0.024,BASE_R,COL_STAND); }
    if(!g){ sc.cyl([0,0,0.006],[0,0,0.034],0.021,"#33373f"); sc.disk3([0,0,0.034],[0,0,1],0.021,"#41464f","#1b1e23"); } }
  if(ins.has("knobs")||ghost==="knobs"){ const g=ghost==="knobs";
    for(let i=0;i<3;i++){ const a=(90+120*i)*Math.PI/180, p=[BASE_R*Math.cos(a),BASE_R*Math.sin(a),0];
      const hgt=0.012+(ins.has("knobs")?kit.knob[i]:0)*6;
      if(g) sc.dot([p[0],p[1],0.008],5,GH);
      else { sc.cyl([p[0],p[1],0],[p[0],p[1],Math.max(0.004,hgt)],0.016,"#3a3f47"); sc.disk3([p[0],p[1],Math.max(0.004,hgt)],[0,0,1],0.017,"#4a505a","#22262c"); } } }
  if(ins.has("pole")||ghost==="pole"){ const g=ghost==="pole", a=W([0,0,0.02]), b=W([0,0,PIVOT_Z]);
    if(g) sc.line(a,b,GH,3,[5,4]); else { sc.cyl(a,b,0.0085,"#b9bfc6",undefined,16); sc.box(W([0,0,PIVOT_Z]),[0,0,1],0.052,0.052,0.046,"#23262c"); } }
  if(!ins.has("pole")) return;
  const piv=W([0,0,PIVOT_Z]), u=kit.axis(), P=s=>[piv[0]+u[0]*s,piv[1]+u[1]*s,piv[2]+u[2]*s];
  if(ins.has("tube")||ghost==="tube"){ const g=ghost==="tube", a=P(-kit.r_c), b=P(kit.r_m-0.035);
    if(g) sc.line(a,b,GH,3,[5,4]); else sc.cyl(a,b,0.004,COL_ALU,undefined,12); }
  if(!ins.has("tube")) return;
  if(ins.has("motor")||ghost==="motor"){ const c=P(kit.r_m-0.030);
    if(ghost==="motor") sc.dot(c,8,GH); else { sc.box(c,u,0.038,0.042,0.055,COL_MOTOR); sc.cyl(P(kit.r_m-0.004),P(kit.r_m+0.006),0.0025,"#9aa0a8"); } }
  if(ins.has("coupler")||ghost==="coupler"){ if(ghost==="coupler") sc.dot(P(kit.r_m),6,GH); else sc.cyl(P(kit.r_m-0.004),P(kit.r_m+0.006),0.009,"#c8a24a"); }
  if(ins.has("disk")||ghost==="disk"){
    const [,R,th]=kit.disk(), c=P(kit.r_m);
    if(ghost==="disk") sc.disk3(c,u,R,"",GH);
    else {
      const back=P(kit.r_m-th/2), front=P(kit.r_m+th/2);
      sc.cyl(back,front,R,COL_ACRYL,undefined,44);
      const [uu,vv]=Scene.basis(u);
      const on=(t,rr)=>[0,1,2].map(i=>front[i]+R*rr*(Math.cos(t)*uu[i]+Math.sin(t)*vv[i]));
      if(kit.w_s<28) for(let k=0;k<3;k++) sc.line(front,on(kit.spinAng+TAU*k/3,0.88),"#7d8b94",2);
      else if(kit.w_s>1) sc.disk3(P(kit.r_m+th/2+1e-4),u,R*0.55,"#eef4f8","#cbd6de");
      for(let k=0;k<12;k++){ const f=k<kit.nBoltSd; sc.dot(on(TAU*k/12,0.90),f?3:2,f?"#3a3f47":"#b9c4cc"); }
    } }
  if(ins.has("cw")||ghost==="cw"){ const Rc=DISKS["26_4"][1], c=P(-kit.r_c);
    if(ghost==="cw") sc.disk3(c,u,Rc,"",GH);
    else { sc.cyl(P(-kit.r_c-0.002),P(-kit.r_c+0.002),Rc,COL_ACRYL,undefined,48);
      const [uu,vv]=Scene.basis(u);
      for(let k=0;k<12;k++){ const t=TAU*k/12, f=k<kit.nBoltCw;
        sc.dot([0,1,2].map(i=>c[i]+Rc*0.9*(Math.cos(t)*uu[i]+Math.sin(t)*vv[i])+u[i]*0.003),f?4:2,f?"#2b2f35":"#b9c4cc"); } } }
  if(ins.has("adapter")||ghost==="adapter"){ const gh=ghost==="adapter";
    sc.poly([[0.15,-0.235,0.001],[0.32,-0.235,0.001],[0.32,-0.145,0.001],[0.15,-0.145,0.001]],gh?"":"#0e1013",gh?GH:"#000",2,gh?[5,4]:null);
    if(!gh){ sc.poly([[0.262,-0.212,0.004],[0.306,-0.212,0.004],[0.306,-0.183,0.004],[0.262,-0.183,0.004]],"#2a0808","#000",1);
      sc.text([0.284,-0.198,0.006],kit.powerOn?kit.volt.toFixed(1):"",  "#ff3b30",11);
      sc.dot([0.226,-0.196,0.004],7,"#c8a24a"); sc.text([0.19,-0.163,0.004],"ADAPTER POWER","#b9c4cc",7);
      sc.line(W([0,0,0.055]),[0.20,-0.150,0.004],"#c0392b",2); sc.line(W([0,0,0.042]),[0.215,-0.150,0.004],"#111",2); } }
  if(trail&&kit.trail.length){ let prev=null;
    for(let i=0;i<kit.trail.length;i+=2){ const [,ps,ph]=kit.trail[i];
      const q=[piv[0]+Math.cos(ps)*Math.cos(ph)*kit.r_m,piv[1]+Math.sin(ps)*Math.cos(ph)*kit.r_m,piv[2]+Math.sin(ph)*kit.r_m];
      if(prev) sc.line(prev,q,"#e08a3c",2); prev=q; } }
}

const scA=new Scene(), scB=new Scene(), scG=new Scene();
let tab="asm", held=null, timeScale=1, sw={t:0,run:false,laps:[]};

function say(s,err){ const e=$("say"); e.textContent=s; e.className="say"+(err?" err":""); }
function nextGhost(){ for(const [k,req] of PART_KEYS){ if(kit.installed.has(k)) continue; if(!req||kit.installed.has(req)) return k; } return null; }
function slotXY(key){

  const pos={mat:[0,0,0],stand:[0,0,0.02],knobs:[0,BASE_R,0.01],pole:[0,0,PIVOT_Z*0.55],tube:[0,0,PIVOT_Z],

function buildParts(){
  const box=$("parts"); box.innerHTML="";
  const g=nextGhost();
  for(const [k] of PART_KEYS){
    const b=document.createElement("button"); b.className="pc"+(kit.installed.has(k)?" done":"")+(k===g?" next":"")+(held===k?" held":"");
    b.textContent=(kit.installed.has(k)?"✔ ":"")+d().parts[k]; b.onclick=()=>{ if(kit.installed.has(k)) return; held=held===k?null:k; buildParts(); };
    box.appendChild(b);
  }
  const h=document.createElement("div"); h.className="hint"; h.textContent=d().diskBox; box.appendChild(h);
  const row=document.createElement("div"); row.className="row";
  for(const k of ["20_2","20_3","20_4"]){ const b=document.createElement("button"); b.textContent=DISKS[k][3]; b.className=kit.diskKey===k?"on":"";
    b.onclick=()=>{ kit.diskKey=k; kit.resetMotion(); buildParts(); buildDiskRow(); }; row.appendChild(b); }
  box.appendChild(row);
  const rb=document.createElement("button"); rb.textContent=d().reset; rb.style.width="100%";
  rb.onclick=()=>{ kit.resetAll(); held=null; say(""); buildParts(); syncPanel(); }; box.appendChild(rb);
  if(kit.ready()) say(d().assembled);
}
function drawAsm(){
  const sc=scA, g=nextGhost(); sc.cx=LW*0.52; sc.cy=LH*0.64; sc.scale=Math.min(LW,LH*1.4)*0.85;
  sc.begin(); drawKit(sc,kit,g,false); sc.render(ctx);
  if(g){ const [x,y]=slotXY(g);
    ctx.setLineDash([4,3]); ctx.strokeStyle="#e08a3c"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,26,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#c2680f"; ctx.font="700 13px 'Segoe UI',sans-serif"; ctx.textAlign="center"; ctx.fillText("▼ "+d().parts[g],x,y-36); }
}
function drawBench(){
  const sc=scB; sc.cx=LW*0.5; sc.cy=LH*0.66; sc.scale=Math.min(LW,LH*1.35)*0.82;
  sc.begin(); drawKit(sc,kit,null,$("trail").checked); sc.render(ctx);
  if(!kit.ready()){ ctx.fillStyle="#b71c1c"; ctx.font="16px 'Segoe UI',sans-serif"; ctx.textAlign="center"; ctx.fillText(d().notReady,LW/2,LH/2); return; }
  if($("gonio").checked) drawGonio();
}
function drawGonio(){
  /* the goniometer held against the tube, seen square-on: 1-degree ticks and the tube edge */
  const cx=LW-205, cy=180, R=150;
  ctx.fillStyle="rgba(251,251,246,.96)"; ctx.strokeStyle="#9bb7d4"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.rect(cx-24,cy-R-24,R+48,2*R+48); ctx.fill(); ctx.stroke();
  ctx.strokeStyle="#0b5394"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,R,-Math.PI/4,Math.PI/4); ctx.stroke();
  ctx.lineWidth=1; ctx.fillStyle="#0b5394"; ctx.font="11px 'Segoe UI',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let dg=-45;dg<=45;dg++){ const a=dg*Math.PI/180, r0=R-(dg%10===0?16:dg%5===0?10:5);
    ctx.beginPath(); ctx.moveTo(cx+r0*Math.cos(a),cy-r0*Math.sin(a)); ctx.lineTo(cx+R*Math.cos(a),cy-R*Math.sin(a)); ctx.stroke();
    if(dg%10===0) ctx.fillText(String(Math.abs(dg)),cx+(R-30)*Math.cos(a),cy-(R-30)*Math.sin(a)); }
  ctx.setLineDash([4,3]); ctx.strokeStyle="#9bb7d4"; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R,cy); ctx.stroke(); ctx.setLineDash([]);
  const a=kit.phi; ctx.strokeStyle="#c0392b"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+(R+14)*Math.cos(a),cy-(R+14)*Math.sin(a)); ctx.stroke();
  ctx.fillStyle="#333"; ctx.beginPath(); ctx.arc(cx,cy,4,0,TAU); ctx.fill();
  ctx.fillStyle="#555"; ctx.textAlign="left"; ctx.fillText(d().gonioName,cx-16,cy+R+12);
}
function drawRuler(){
  const c=$("ruler"), w=c.clientWidth||300, dpr=Math.min(window.devicePixelRatio||1,2), H=54;
  c.width=Math.round(w*dpr); c.height=Math.round(H*dpr); c.style.height=H+"px";
  const x=c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle="#fdfcf2"; x.fillRect(0,0,w,H);
  const x0=10, span=w-20, cm=span/42;
  x.strokeStyle="#333"; x.fillStyle="#333"; x.font="9px ui-monospace,monospace"; x.textAlign="center";
  for(let mm=0;mm<=420;mm++){ const px=x0+mm/10*cm, L=mm%10===0?14:mm%5===0?9:5;
    x.lineWidth=mm%10===0?1:0.5; x.beginPath(); x.moveTo(px,0); x.lineTo(px,L); x.stroke();
    if(mm%50===0) x.fillText(String(mm/10),px,23); }
  /* the tube and the disk centre, as they lie against the ruler */
  x.fillStyle="#c9ccd1"; x.fillRect(x0,34,span*0.99,6);
  const pd=x0+kit.r_m*100*cm; x.fillStyle="#6c8ea2"; x.fillRect(pd-1,28,2,22);
  x.fillStyle="#222"; x.beginPath(); x.arc(x0,37,3,0,TAU); x.fill();
}
/* Part G */
const pg={stack:[],disk:"20_2",running:false,w:0,theta:4*Math.PI/180,dtheta:0,phiPrec:0};
function gProps(){
  let z=0,M=0,Ms=0,I1=0,I3=0;
  for(const k of pg.stack){ let m,hh,R;
    if(k==="motor"){ m=M_MOTOR; hh=0.055; I1+=m*(hh*hh/12+(z+hh/2)**2); }
    else if(k==="cw"){ [m,R]=DISKS["26_4"]; hh=0.004; I1+=m*(0.25*R*R+(z+hh/2)**2); }
    else { [m,R,hh]=DISKS[pg.disk]; I1+=m*(0.25*R*R+(z+hh/2)**2); I3=0.5*m*R*R; }
    M+=m; Ms+=m*(z+hh/2); z+=hh; }
  return [M,M?Ms/M:0,Math.max(I1,1e-6),I3];
}
function gTick(dt){
  if(!pg.running) return;
  const [M,l,I1,I3]=gProps(), [m,R,th]=DISKS[pg.disk];
  const c0=DRAG_C0*(R/R_REF)**5, c1=DRAG_C1*(R/R_REF)**4*th, V=+$("gv").value;
  const tq=(K_EMF/R_ARM_COIL)*((V-K_EMF*pg.w)-(c0+c1)*pg.w**DRAG_N);
  pg.w=Math.max(0,pg.w+tq/Math.max(I3,1e-6)*dt);
  const L3=I3*pg.w;
  if(L3*L3-4*I1*M*G*l>0){       /* sleeping top: precesses and settles upright */
    const wn=L3/I1; pg.dtheta+=(-wn*wn*0.25*pg.theta)*dt; pg.dtheta*=Math.exp(-1.2*dt);
    pg.theta=Math.max(0,pg.theta+pg.dtheta*dt); pg.phiPrec+=(M*G*l/Math.max(L3,1e-6))*dt;
  } else {
    pg.dtheta+=(M*G*l*Math.sin(pg.theta)/I1)*dt; pg.theta+=pg.dtheta*dt;
    pg.phiPrec+=(M*G*l/Math.max(L3,1e-3))*dt*0.2;
    if(pg.theta>75*Math.PI/180){ pg.theta=75*Math.PI/180; pg.dtheta=0; }
  }
}
function drawG(){
  const sc=scG; sc.cx=LW*0.5; sc.cy=LH*0.74; sc.scale=Math.min(LW,LH*1.3)*1.6; sc.az=35*Math.PI/180; sc.el=14*Math.PI/180;
  sc.begin(); sc.poly([[-0.12,-0.12,0],[0.12,-0.12,0],[0.12,0.12,0],[-0.12,0.12,0]],COL_MAT,"#155f59",2);
  const th=pg.theta, ph=pg.phiPrec, n=[Math.sin(th)*Math.cos(ph),Math.sin(th)*Math.sin(ph),Math.cos(th)];
  let z=0;
  for(const k of pg.stack){
    if(k==="motor"){ const hh=0.055; sc.box(n.map(v=>v*(z+hh/2)),n,0.038,0.042,hh,COL_MOTOR); z+=hh; }
    else { const R=k==="cw"?DISKS["26_4"][1]:DISKS[pg.disk][1], hh=k==="cw"?0.004:DISKS[pg.disk][2];
      sc.cyl(n.map(v=>v*z),n.map(v=>v*(z+hh)),R,COL_ACRYL); z+=hh; }
  }
  sc.render(ctx);
}
function renderG(){
  $("gList").textContent=[...pg.stack].reverse().map((k,i)=>(pg.stack.length-i)+". "+d().gParts[k]).join("\n");
  const add=$("gAdd"); add.innerHTML="";
  for(const k of ["motor","cw","disk"]){ const b=document.createElement("button"); b.style.width="100%"; b.textContent="+ "+d().gParts[k];
    b.disabled=pg.stack.includes(k); b.onclick=()=>{ pg.stack.push(k); renderG(); }; add.appendChild(b); }
  const row=$("gDiskRow"); row.innerHTML="";
  for(const k of ["20_2","20_3","20_4"]){ const b=document.createElement("button"); b.textContent=DISKS[k][3]; b.className=pg.disk===k?"on":"";
    b.onclick=()=>{ pg.disk=k; renderG(); }; row.appendChild(b); }
}
$("gClear").onclick=()=>{ pg.stack=[]; pg.running=false; $("gMsg").textContent=""; renderG(); };
$("gRun").onclick=()=>{ if(!pg.stack.includes("disk")){ $("gMsg").textContent=d().gNoDisk; return; }
  $("gMsg").textContent=""; Object.assign(pg,{running:true,theta:4*Math.PI/180,dtheta:0,w:0}); };
$("gStop").onclick=()=>{ pg.running=false; };

/* ══════════════════════════════════════════════════════════════
   4.  BENCH PANEL
   ══════════════════════════════════════════════════════════════ */
function buildDiskRow(){
  const row=$("diskRow"); row.innerHTML="";
  for(const k of ["20_2","20_3","20_4"]){ const b=document.createElement("button"); b.textContent=DISKS[k][3]; b.className=kit.diskKey===k?"on":"";
    b.onclick=()=>{ if(kit.w_s>5){ say(d().spinNote,true); return; } kit.diskKey=k; kit.resetMotion(); buildDiskRow(); }; row.appendChild(b); }
}
function buildKnobs(){
  const box=$("knobs"); box.innerHTML="";
  for(let i=0;i<3;i++){
    const l=document.createElement("span"); l.textContent=d().knob+" "+(i+1); box.appendChild(l);
    for(const n of [1,-1,10,-10]){ const b=document.createElement("button"); b.textContent=(n>0?"▲":"▼").repeat(Math.abs(n)>1?2:1);
      b.onclick=()=>{ kit.knob[i]=Math.max(-KNOB_RANGE,Math.min(KNOB_RANGE,kit.knob[i]+n*KNOB_STEP)); }; box.appendChild(b); }
  }
}
function renderSpeeds(){
  const box=$("speeds"); box.innerHTML="";
  const lb=document.createElement("span"); lb.textContent=d().speed; lb.style.cssText="font-size:12px;color:#9aa3ab;margin-right:4px"; box.appendChild(lb);
  for(const s of [1,2,5,10,20]){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===timeScale?"on":"";
    b.onclick=()=>{ timeScale=s; renderSpeeds(); }; box.appendChild(b); }
}
function vbump(){
  const row=$("vbump"); row.innerHTML="";
  for(const dv of [-1,-0.4,-0.1,0.1,0.4,1]){ const b=document.createElement("button"); b.textContent=(dv>0?"+":"")+dv.toFixed(1);
    b.onclick=()=>{ $("volt").value=Math.max(0,Math.min(12,Math.round((+$("volt").value+dv)*10)/10)); kit.volt=+$("volt").value; }; row.appendChild(b); }
}
$("volt").oninput=()=>{ kit.volt=Math.round(+$("volt").value*10)/10; };
$("pw").onchange=()=>{ kit.powerOn=$("pw").checked; };
$("lock").onchange=()=>{ kit.tubeLocked=$("lock").checked; };
$("arm").oninput=()=>{ if(kit.tubeLocked){ $("arm").value=kit.r_m*100; return; }
  kit.r_m=Math.max(8,Math.min(TUBE_L*100-12,+$("arm").value))/100; };
const bolt=(which,dn)=>{ if(kit.powerOn&&kit.w_s>5){ say(d().spinNote,true); return; }
  if(which==="cw"){ if(!kit.installed.has("cw")) return; kit.nBoltCw=Math.max(0,Math.min(12,kit.nBoltCw+dn)); }
  else kit.nBoltSd=Math.max(0,Math.min(12,kit.nBoltSd+dn)); };
$("bcwM").onclick=()=>bolt("cw",-1); $("bcwP").onclick=()=>bolt("cw",1);
$("bsdM").onclick=()=>bolt("sd",-1); $("bsdP").onclick=()=>bolt("sd",1);
$("turn90").onclick=()=>kit.turnArm(90); $("turn180").onclick=()=>kit.turnArm(180);
$("impulse").onclick=()=>kit.impulse(); $("liftU").onclick=()=>kit.lift(true); $("liftD").onclick=()=>kit.lift(false);
const fmt=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+(t%60).toFixed(2).padStart(5,"0");
$("swStart").onclick=()=>{ sw.run=true; }; $("swStop").onclick=()=>{ sw.run=false; };
$("swLap").onclick=()=>{ if(sw.run){ sw.laps.push(sw.t); renderLaps(); } };
$("swReset").onclick=()=>{ sw={t:0,run:false,laps:[]}; renderLaps(); };
function renderLaps(){ $("laps").textContent=sw.laps.map((t,i)=>String(i+1).padStart(2," ")+"  "+fmt(t)).join("\n"); $("laps").scrollTop=1e6; }
function syncPanel(){
  $("pw").checked=kit.powerOn; $("volt").value=kit.volt; $("lock").checked=kit.tubeLocked; buildDiskRow();
}

/* ══════════════════════════════════════════════════════════════
   5.  POINTER + TABS
   ══════════════════════════════════════════════════════════════ */
let rot=null;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)/S, y=(e.clientY-r.top)/S;
  if(tab==="asm"&&e.button===0&&held){
    const key=held, req=PART_KEYS.find(p=>p[0]===key)[1];
    held=null;
    if(req&&!kit.installed.has(req)){ say(d().needFirst,true); buildParts(); return; }
    const t=slotXY(key); if(!t){ buildParts(); return; }
    if((x-t[0])**2+(y-t[1])**2>95*95){ say(d().notHere,true); buildParts(); return; }
    kit.installed.add(key); kit.resetMotion(); say(""); buildParts(); return;
  }
  if(tab==="bench"||(tab==="asm"&&(e.button===2||e.shiftKey))){ rot=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); cv.style.cursor="grabbing"; }
});
cv.addEventListener("pointermove",e=>{
  if(!rot) return; const sc=tab==="asm"?scA:scB;
  sc.az-=(e.clientX-rot[0])*0.008; sc.el=Math.max(-0.15,Math.min(1.2,sc.el+(e.clientY-rot[1])*0.006)); rot=[e.clientX,e.clientY];
});
cv.addEventListener("pointerup",()=>{ rot=null; cv.style.cursor="grab"; });
function setTab(k){
  tab=k;
  for(const v of ["asm","bench","g","info"]) $("tab-"+v).className=v===k?"on":"";
  $("sceneBox").hidden=k==="info"; $("info").hidden=k!=="info"; $("parts").hidden=k!=="asm";
  $("pBench").hidden=k!=="bench"; $("pG").hidden=k!=="g";
  $("t-cap").textContent={asm:d().capAsm,bench:d().capBench,g:d().capG,info:d().capInfo}[k];
  if(k!=="asm") say(""); else buildParts();
  if(k!=="info") layout();
  if(k==="bench") drawRuler();
}
for(const k of ["asm","bench","g","info"]) $("tab-"+k).onclick=()=>setTab(k);

/* ══════════════════════════════════════════════════════════════
   6.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d();
  document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("tab-asm").textContent=t.tabAsm; $("tab-bench").textContent=t.tabBench; $("tab-g").textContent=t.tabG; $("tab-info").textContent=t.tabInfo;
  $("t-h-power").textContent=t.hPower; $("t-pw").textContent=t.pw;
  $("t-h-sw").textContent=t.hSw; $("swStart").textContent=t.start; $("swStop").textContent=t.stop; $("swLap").textContent=t.lap; $("swReset").textContent=t.rs;
  $("t-h-arm").textContent=t.hArm; $("t-lock").textContent=t.lock; $("t-rulerhint").textContent=t.rulerHint;
  $("t-h-disk").textContent=t.hDisk; $("t-h-bolts").textContent=t.hBolts; $("t-bcw").textContent=t.bcw; $("t-bsd").textContent=t.bsd;
  $("t-h-level").textContent=t.hLevel; $("impulse").textContent=t.impulse; $("liftU").textContent=t.liftU; $("liftD").textContent=t.liftD;
  $("t-h-view").textContent=t.hView; $("t-gonio").textContent=t.gonio; $("t-trail").textContent=t.trail;
  $("t-h-gbuild").textContent=t.hGBuild; $("t-h-gdisk").textContent=t.hGDisk; $("t-h-gvolt").textContent=t.hGVolt;
  $("gRun").textContent=t.gRun; $("gStop").textContent=t.gStop; $("t-gnote").textContent=t.gNote;
  $("info").textContent=INFO[lang];
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2024 E1 — 자이로스코프 · HaslaLab":"APhO 2024 E1 — Gyroscope · HaslaLab";
  buildKnobs(); buildDiskRow(); renderSpeeds(); vbump(); renderG(); setTab(tab);
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   7.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), fr=0;
function tick(){
  const now=performance.now(), raw=Math.min(0.05,(now-last)/1000); last=now;
  const dt=raw*timeScale, sub=Math.max(1,Math.floor(dt/0.004)+1);
  for(let i=0;i<sub;i++) kit.step(dt/sub);
  if(sw.run) sw.t+=dt;
  gTick(raw);
  if(tab!=="info"){
    ctx.clearRect(0,0,LW,LH); ctx.fillStyle="#f7f8f9"; ctx.fillRect(0,0,LW,LH);
    if(tab==="asm") drawAsm(); else if(tab==="bench") drawBench(); else drawG();
  }
  $("swLbl").textContent=fmt(sw.t);
  $("lcd").textContent=kit.volt.toFixed(1); $("lcd").className="lcd"+(kit.powerOn?"":" off");
  $("gvl").textContent=(+$("gv").value).toFixed(1)+" V";
  $("bcw").textContent=kit.nBoltCw+" "+d().sets; $("bsd").textContent=kit.nBoltSd+" "+d().sets;
  if(!kit.tubeLocked&&document.activeElement!==$("arm")) $("arm").value=kit.r_m*100;
  if(++fr%10===0){
    const m=[];
    if(kit.burnt) m.push(d().burnt); else if(kit.powerOn&&kit.volt>MOTOR_BURN_VOLT) m.push(d().warn6);
    if(kit.runT>OVERHEAT_TIME) m.push(d().overheat);
    m.push(d().noLevel);
    $("pwWarn").textContent=m.join("\n");
    if(tab==="bench") drawRuler();
  }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); drawRuler(); });
applyLang(); requestAnimationFrame(tick);
</script>
