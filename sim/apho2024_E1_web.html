<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 214px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin-bottom:6px}
  .tabs button{width:auto;margin:0;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  #cv{display:block;width:100%;height:auto;border-radius:6px;background:#20252c;touch-action:none;cursor:grab}
  .instr{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .instr>div{flex:1 1 240px;min-width:220px}
  .instr canvas{display:block;width:100%;height:auto;border-radius:6px;background:#15181d;touch-action:none}
  .ilbl{font-size:12px;color:var(--accent);font-weight:600;margin:0 0 4px}
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel,.tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray,.panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:6px;align-items:center}
  .row button{flex:1;text-align:center}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.4;cursor:default}
  .disp{background:#0d1512;border-radius:6px;padding:6px 10px;margin:2px 0 6px;text-align:center;
        color:#7dffb0;font:700 30px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.04em}
  #swBtn{background:#2f6f3f;border-color:#2f6f3f;color:#fff;font-weight:600}
  #swBtn.run{background:#8a3b34;border-color:#8a3b34}
  .laps{background:var(--deep);border:1px solid var(--line);border-radius:6px;margin-top:6px;
        height:82px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;color:var(--ink);padding:4px 7px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .knobs{display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr;gap:3px 4px;align-items:center;font-size:12px}
  .knobs button{margin:0;padding:3px 0;font-size:11.5px}
  .cnt{font:700 13px ui-monospace,Consolas,monospace;min-width:64px;text-align:center}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:10px;min-height:96px}
  .status div + div{margin-top:9px}
  .status .warn{color:#ff8b6a}
  .chk{display:flex;align-items:center;gap:7px;margin:5px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
</style>
</head>

</header>

  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <div class="tabs"><button id="tab-bench" class="on"></button><button id="tab-g"></button></div>
      <h3 id="t-cap"></h3>
      <canvas id="cv"></canvas>
    </div>
    <div class="card" id="instrCard">
      <h3 id="t-instrcap"></h3>

        <div><div class="ilbl" id="t-rulbl"></div><canvas id="ruCv"></canvas></div>
      </div>
    </div>
  </div>

  <aside class="panel">
    <div id="pBench">
      <h2 id="t-h-sw"></h2>
      <div class="disp" id="swLbl">0:00.00</div>
      <div class="row"><button id="swBtn"></button><button id="swLap"></button><button id="swReset"></button></div>
      <div class="laps" id="laps"></div>

      <h2 id="t-h-speed"></h2>
      <div class="row" id="speeds"></div>

      <h2 id="t-h-arm"></h2>
      <button id="lockBtn" style="width:100%"></button>
      <input type="range" id="arm" min="8" max="41" step="0.05" value="15">
      <div class="hint" id="t-armhint"></div>

      <h2 id="t-h-bolts"></h2>
      <div class="row"><span id="t-bcw" style="flex:1;font-size:12px"></span><span class="cnt" id="bcw"></span></div>
      <div class="row"><span id="t-bsd" style="flex:1;font-size:12px"></span><span class="cnt" id="bsd"></span></div>
      <div class="hint" id="t-bolthint"></div>

      <h2 id="t-h-level"></h2>
      <div class="knobs" id="knobs"></div>

      <h2 id="t-h-hand"></h2>
      <div class="row"><button id="turn90">↺ 90°</button><button id="turn180">↻ 180°</button></div>
      <button id="impulse" style="width:100%"></button>
      <div class="row"><button id="liftU"></button><button id="liftD"></button></div>
      <label class="chk"><input type="checkbox" id="trail"><span id="t-trail"></span></label>
      <button id="fitBtn" style="width:100%"></button>
    </div>

    <div id="pG" hidden>
      <h2 id="t-h-gbuild"></h2>
      <div class="laps" id="gList" style="min-height:60px"></div>
      <div id="gAdd"></div>
      <button id="gClear" style="width:100%">↺</button>
      <h2 id="t-h-gdisk"></h2>
      <div class="row" id="gDiskRow"></div>
      <h2 id="t-h-gvolt"></h2>
      <input type="range" id="gv" min="0" max="6" step="0.1" value="5">
      <div class="disp" id="gvl" style="font-size:22px;color:#ff3b30;background:#150708">5.0 V</div>
      <div class="row"><button id="gRun"></button><button id="gStop"></button></div>
      <div class="hint" id="t-gnote"></div>
    </div>

    <div class="status" id="status"></div>
  </aside>
</div>

}

/* ══════════════════════════════════════════════════════════════
   2.  A SMALL 3-D RENDERER  (orthographic, painter's algorithm)
   ══════════════════════════════════════════════════════════════ */
const norm=v=>{ const n=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/n,v[1]/n,v[2]/n]; };

  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join(""); }
class Scene{
  constructor(){ this.az=38*Math.PI/180; this.el=16*Math.PI/180; this.scale=900; this.cx=460; this.cy=330; this.items=[]; }
  dirs(){ const ca=Math.cos(this.az), sa=Math.sin(this.az), ce=Math.cos(this.el), se=Math.sin(this.el);
    return [[-sa,ca,0],[-ca*se,-sa*se,ce],[ca*ce,sa*ce,se]]; }

  depth(p){ const f=this.D[2]; return p[0]*f[0]+p[1]*f[1]+p[2]*f[2]; }
  begin(){ this.D=this.dirs(); this.items=[]; }
  poly(pts,fill,outline,width,dash){ let dd=0; for(const p of pts) dd+=this.depth(p);
    this.items.push([dd/pts.length,"poly",pts.map(p=>this.prj(p)),fill,outline,width||1,dash]); }
  line(a,b,fill,width,dash){ this.items.push([(this.depth(a)+this.depth(b))/2,"line",[this.prj(a),this.prj(b)],fill,"",width||2,dash]); }
  dot(p,r,fill){ this.items.push([this.depth(p),"dot",[this.prj(p),r],fill]); }

      this.poly([[a[0]+o1[0],a[1]+o1[1],a[2]+o1[2]],[a[0]+o2[0],a[1]+o2[1],a[2]+o2[2]],[b[0]+o2[0],b[1]+o2[1],b[2]+o2[2]],[b[0]+o1[0],b[1]+o1[1],b[2]+o1[2]]],

    }

}

   ══════════════════════════════════════════════════════════════ */
const COL_MAT="#1f8a7e", COL_STAND="#1b1d21", COL_ALU="#c9ccd1", COL_MOTOR="#23262c";

  if($("trail").checked&&kit.trail.length){ let prev=null;
    for(let i=0;i<kit.trail.length;i+=2){ const [,ps,ph]=kit.trail[i];
      const q=[piv[0]+Math.cos(ps)*Math.cos(ph)*kit.r_m,piv[1]+Math.sin(ps)*Math.cos(ph)*kit.r_m,piv[2]+Math.sin(ph)*kit.r_m];
      if(prev) sc.line(prev,q,"#e08a3c",2); prev=q; } }
}

let trayCells=[];

  else if(n==="tube") L(x-15,y+6,x+15,y-6,"#c9ccd1",3);
  else if(n==="motor"){ R(x-8,y-7,x+8,y+7,"#23262c","#555"); L(x-8,y+6,x-14,y+11,"#c0392b",1.5); }
  else if(n==="coupler"){ O(x,y,7,"#c9ccd1","#888"); O(x,y,2,"#555"); }
  else if(KEY_OF[n]||n==="cw"){ O(x,y,n==="cw"?12:10,"rgba(214,234,244,0.25)","#9fc2d4"); O(x,y,2,"#9aa0a8"); }

  else if(n==="gonio"){ c.beginPath(); c.arc(x,y+6,12,Math.PI,0); c.closePath(); c.fillStyle=g||"rgba(235,242,246,0.35)"; c.fill(); c.strokeStyle="#6fa0c8"; c.stroke(); }
  else if(n==="bolts"){ for(const dx of [-6,6]){ R(x+dx-2,y-8,x+dx+2,y+6,"#9aa0a8"); R(x+dx-4,y-10,x+dx+4,y-7,"#6d737a"); } }

trayCv.addEventListener("click",e=>{

function say(s,warn){ B.note={s,warn:!!warn,t:performance.now()}; renderStatus(); }
function slotWorld(key){
  const u=kit.axis(), P=s=>[u[0]*s,u[1]*s,PIVOT_Z+u[2]*s];
  return {mat:[0,0,0],stand:[0,0,0.02],knobs:[0,BASE_R,0.01],pole:[0,0,PIVOT_Z*0.55],tube:[0,0,PIVOT_Z],
    motor:P(kit.r_m-0.03),coupler:P(kit.r_m),disk:P(kit.r_m),cw:P(-kit.r_c),adapter:[0.235,-0.195,0.02],gonio:[0,0,PIVOT_Z]}[key];
}
function slotScreen(key){ const w=slotWorld(key); return w?sc.prj(w):null; }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function near(p,key,rad){ const s=slotScreen(key); return s&&Math.hypot(s[0]-p[0],s[1]-p[1])<rad; }
function install(n){
  const t=d(), k=kitKey(n);
  if(n==="gonio"){ B.gonio=true; }
  else { if(KEY_OF[n]) kit.diskKey=n.slice(1); kit.installed.add(k); if(k==="motor"){ kit.burnt=false; kit.overVoltT=0; } kit.resetMotion(); }
  B.carry=null; say(t.m.placed(t.trayItems[n])); drawTray();
}
function onPress(p){
  const t=d();
  if(B.tab!=="bench"){ B.rot=[p[0],p[1]]; return; }
  if(B.carry){
    const n=B.carry.id;
    if(n==="bolts"){
      const onSd=kit.installed.has("disk")&&near(p,"disk",sc.scale*0.11), onCw=kit.installed.has("cw")&&near(p,"cw",sc.scale*0.14);
      if(kit.w_s>5){ say(t.st.spin,true); return; }
      if(onSd&&kit.nBoltSd<12){ kit.nBoltSd++; say(t.m.boltOn(t.bsd,kit.nBoltSd)); }
      else if(onCw&&kit.nBoltCw<12){ kit.nBoltCw++; say(t.m.boltOn(t.bcw,kit.nBoltCw)); }
      else say(t.m.notHere,true);
      return;
    }
    const k=kitKey(n), rad=Math.max(40,sc.scale*(k==="mat"?0.2:k==="disk"||k==="cw"?0.12:0.07));
    if(near(p,k,rad)) install(n); else say(t.m.notHere,true);
    return;
  }
  B.rot=[p[0],p[1]]; cv.style.cursor="grabbing";
}
function dependents(k){
  const out=[];
  for(const [c,r] of PART_KEYS) if(r===k&&kit.installed.has(c)) out.push(c);
  if(k==="pole"&&B.gonio) out.push("gonio");
  return out;
}
function onRClick(p){
  const t=d();
  if(B.carry){ B.carry=null; drawTray(); say(t.m.removed(t.trayItems.bolts)); return; }
  if(B.tab!=="bench") return;
  /* the front-most installed part near the pointer */
  const cand=[...kit.installed].concat(B.gonio?["gonio"]:[]).map(k=>{ const s=slotScreen(k); return [k,s?Math.hypot(s[0]-p[0],s[1]-p[1]):1e9]; })
    .filter(([k,dd])=>dd<Math.max(30,sc.scale*(k==="mat"?0.2:k==="disk"||k==="cw"?0.11:0.06))).sort((a,b)=>a[1]-b[1]);
  if(!cand.length) return;
  let k=cand[0][0];
  if(k==="mat"&&cand.length>1) k=cand[1][0];
  if((k==="disk"&&kit.nBoltSd>0)||(k==="cw"&&kit.nBoltCw>0)){
    if(kit.w_s>5){ say(t.st.spin,true); return; }
    if(k==="disk"){ kit.nBoltSd--; say(t.m.boltOff(t.bsd,kit.nBoltSd)); } else { kit.nBoltCw--; say(t.m.boltOff(t.bcw,kit.nBoltCw)); }
    return;
  }
  if((k==="disk"||k==="motor"||k==="coupler")&&kit.w_s>5){ say(t.st.spin,true); return; }
  const dep=dependents(k);
  if(dep.length){ say(t.m.blocked(dep.map(c=>t.trayItems[c==="disk"?"d"+kit.diskKey:c]).join(", ")),true); return; }
  const name=k==="disk"?"d"+kit.diskKey:k;
  if(k==="gonio") B.gonio=false; else { kit.installed.delete(k); if(k==="disk") kit.nBoltSd=0; if(k==="cw") kit.nBoltCw=0; kit.resetMotion(); }
  say(t.m.removed(t.trayItems[name])); drawTray();
}

});

function adKnobAngle(){ return (-150+300*B.adKnob)*Math.PI/180; }
function drawAdapter(){
  const c=adCv.getContext("2d"), W=adCv.width/DPR, H=adCv.height/DPR, s=W/260;
  c.setTransform(DPR*s,0,0,DPR*s,0,0); c.fillStyle="#15181d"; c.fillRect(0,0,260,H/s);

  c.fillStyle="#1a1c20"; c.beginPath(); c.roundRect(18,22,224,112,10); c.fill();
  c.fillStyle="#d9dde1"; c.font="bold 11px Arial"; c.textAlign="left"; c.fillText("ADAPTER POWER",30,44);
  c.font="bold 9px Arial"; c.textAlign="left"; c.fillText("REGULATED",146,106); c.fillText("MODEL:ZY-009",146,118);
  c.fillText(d().lab.volt,150,40);

  else { c.fillStyle="#3b0d0b"; c.font="bold 30px ui-monospace,Consolas,monospace"; c.textAlign="right"; c.fillText("8.8.8",224,79); }

  c.fillStyle="#2d3036"; c.beginPath(); c.arc(kx,ky,r,0,7); c.fill();

  const a=adKnobAngle(); c.strokeStyle="#f2f2f2"; c.lineWidth=3; c.beginPath(); c.moveTo(kx+Math.sin(a)*6,ky-Math.cos(a)*6); c.lineTo(kx+Math.sin(a)*(r-4),ky-Math.cos(a)*(r-4)); c.stroke();

function adPress(e){
  const r=adCv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, [kx,ky,rr]=B.adKnobXY||[0,0,0];

function setKnob(v){

}

adCv.addEventListener("wheel",e=>{ if(!kit.installed.has("adapter")) return; e.preventDefault();
  const up=e.deltaY<0;
  if(B.adKnob===0&&up){ setKnob(0.005); return; }
  setKnob(B.adKnob+(up?1:-1)*(e.shiftKey?0.01:0.1)/9); },{passive:false});
function drawGonio(){

  c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle="#15181d"; c.fillRect(0,0,W,H);
  if(!B.gonio||!kit.installed.has("tube")){ c.fillStyle="#69717a"; c.font="12px 'Malgun Gothic',sans-serif"; c.textAlign="center"; c.fillText(d().lab.noGonio,W/2,H/2); return; }
  const cx=W*0.18, cy=H*0.5, R=Math.min(W*0.72,H*0.46);
  c.fillStyle="rgba(250,251,246,0.95)"; c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,R+10,-Math.PI/3.2,Math.PI/3.2); c.closePath(); c.fill();
  c.strokeStyle="#0b5394"; c.lineWidth=1.5; c.beginPath(); c.arc(cx,cy,R,-Math.PI/3.2,Math.PI/3.2); c.stroke();
  c.fillStyle="#0b5394"; c.font="10px Arial"; c.textAlign="center"; c.textBaseline="middle";
  for(let dg=-55;dg<=55;dg++){ const a=dg*Math.PI/180, r0=R-(dg%10===0?14:dg%5===0?9:5);
    c.lineWidth=dg%10===0?1.2:0.7; c.beginPath(); c.moveTo(cx+r0*Math.cos(a),cy-r0*Math.sin(a)); c.lineTo(cx+R*Math.cos(a),cy-R*Math.sin(a)); c.stroke();
    if(dg%10===0) c.fillText(String(Math.abs(dg)),cx+(R-24)*Math.cos(a),cy-(R-24)*Math.sin(a)); }
  c.setLineDash([4,3]); c.strokeStyle="#9bb7d4"; c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+R,cy); c.stroke(); c.setLineDash([]);
  const a=kit.phi; c.strokeStyle="#aeb4ba"; c.lineWidth=5; c.lineCap="round";
  c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+(R+14)*Math.cos(a),cy-(R+14)*Math.sin(a)); c.stroke();
  c.fillStyle="#222"; c.beginPath(); c.arc(cx,cy,5,0,TAU); c.fill();
}
function drawRuler(){
  const c=ruCv.getContext("2d"), W=ruCv.width/DPR, H=ruCv.height/DPR;
  c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle="#15181d"; c.fillRect(0,0,W,H);
  if(!kit.installed.has("tube")){ c.fillStyle="#69717a"; c.font="12px 'Malgun Gothic',sans-serif"; c.textAlign="center"; c.fillText(d().lab.noArm,W/2,H/2); return; }
  const x0=12, span=W-24, cm=span/42, y0=H*0.30;
  c.fillStyle="#fdfcf2"; c.fillRect(x0-6,y0-4,span+12,44);
  c.strokeStyle="#333"; c.fillStyle="#333"; c.font="9px ui-monospace,monospace"; c.textAlign="center";
  for(let mm=0;mm<=420;mm++){ const px=x0+mm/10*cm, L=mm%10===0?14:mm%5===0?9:5;
    c.lineWidth=mm%10===0?1:0.5; c.beginPath(); c.moveTo(px,y0-4); c.lineTo(px,y0-4+L); c.stroke();
    if(mm%50===0) c.fillText(String(mm/10),px,y0+20); }
  c.fillStyle="#c9ccd1"; c.fillRect(x0,y0+44,span*0.99,7);
  c.fillStyle="#222"; c.beginPath(); c.arc(x0,y0+47,4,0,TAU); c.fill();
  if(kit.installed.has("disk")||kit.installed.has("coupler")){
    const pd=x0+kit.r_m*100*cm; c.fillStyle="rgba(170,205,222,0.95)"; c.fillRect(pd-1.5,y0+26,3,40); }
  c.fillStyle="#9aa3ab"; c.font="10px 'Malgun Gothic',sans-serif"; c.textAlign="left"; c.fillText(d().lab.ruler,x0,H-10);
}

/* ══════════════════════════════════════════════════════════════

function fmtTime(v){ v=Math.max(0,v); const m=Math.floor(v/60), s=v-60*m; return m+":"+s.toFixed(2).padStart(5,"0"); }
function swValue(){ return sw.acc+(sw.run?kit.t-sw.t0:0); }
$("swBtn").onclick=()=>{ if(sw.run){ sw.acc+=kit.t-sw.t0; sw.run=false; } else { sw.t0=kit.t; sw.run=true; } updSw(); };
$("swLap").onclick=()=>{ sw.laps.push(swValue()); renderLaps(); };
$("swReset").onclick=()=>{ sw={acc:0,run:false,t0:kit.t,laps:[]}; renderLaps(); updSw(); };
function updSw(){ const b=$("swBtn"); b.textContent=sw.run?d().stop:d().start; b.classList.toggle("run",sw.run); }
function renderLaps(){ const box=$("laps"); box.innerHTML="";
  for(let i=sw.laps.length-1;i>=0;i--){ const el=document.createElement("div"); el.textContent=String(i+1).padStart(2," ")+"   "+fmtTime(sw.laps[i]); box.appendChild(el); } }
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,2,5,10,20]){ const b=document.createElement("button"); b.textContent=s+"×"; if(s===timeScale) b.className="on";
    b.onclick=()=>{ timeScale=s; renderSpeeds(); }; box.appendChild(b); } }
function buildKnobs(){
  const box=$("knobs"); box.innerHTML="";
  for(let i=0;i<3;i++){
    const l=document.createElement("span"); l.textContent=d().knob+" "+(i+1); box.appendChild(l);
    for(const n of [10,1,-1,-10]){ const b=document.createElement("button"); b.textContent=(n>0?"▲":"▼").repeat(Math.abs(n)>1?2:1);
      b.onclick=()=>{ if(!kit.installed.has("knobs")) return; kit.knob[i]=Math.max(-KNOB_RANGE,Math.min(KNOB_RANGE,kit.knob[i]+n*KNOB_STEP)); }; box.appendChild(b); }
  }
}
function updLock(){ $("lockBtn").textContent=kit.tubeLocked?d().lockOn:d().lockOff; $("lockBtn").className=kit.tubeLocked?"":"on"; }
$("lockBtn").onclick=()=>{ kit.tubeLocked=!kit.tubeLocked; updLock(); };
$("arm").oninput=()=>{ if(kit.tubeLocked){ $("arm").value=kit.r_m*100; say(d().m.locked,true); return; }
  kit.r_m=Math.max(8,Math.min(TUBE_L*100-12,+$("arm").value))/100; };
$("turn90").onclick=()=>kit.turnArm(90); $("turn180").onclick=()=>kit.turnArm(180);
$("impulse").onclick=()=>kit.impulse(); $("liftU").onclick=()=>kit.lift(true); $("liftD").onclick=()=>kit.lift(false);
function renderStatus(){
  const L=[], t=d();
  if(B.tab==="bench"){
    if(!kit.installed.size) L.push([t.st.nothing,false]);
    else if(!kit.ready()){ const nx=PART_KEYS.find(([k,r])=>REQUIRED.has(k)&&!kit.installed.has(k)&&(!r||kit.installed.has(r)));
      if(nx) L.push([t.st.next(t.trayItems[nx[0]==="disk"?"d20_3":nx[0]]),false]); }
    else if(!kit.powerOn) L.push([t.st.ready,false]);
    if(kit.burnt) L.push([t.st.burnt,true]); else if(kit.powerOn&&kit.volt>MOTOR_BURN_VOLT) L.push([t.st.warn6,true]);
    if(kit.runT>OVERHEAT_TIME) L.push([t.st.overheat,true]);
  }
  if(B.note&&performance.now()-B.note.t<9000) L.push(["• "+B.note.s,B.note.warn]);
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}

/* ---- Part G ---- */
/* Part G */
const pg={stack:[],disk:"20_2",running:false,w:0,theta:4*Math.PI/180,dtheta:0,phiPrec:0};
function gProps(){
  let z=0,M=0,Ms=0,I1=0,I3=0;
  for(const k of pg.stack){ let m,hh,R;
    if(k==="motor"){ m=M_MOTOR; hh=0.055; I1+=m*(hh*hh/12+(z+hh/2)**2); }
    else if(k==="cw"){ [m,R]=DISKS["26_4"]; hh=0.004; I1+=m*(0.25*R*R+(z+hh/2)**2); }
    else { [m,R,hh]=DISKS[pg.disk]; I1+=m*(0.25*R*R+(z+hh/2)**2); I3=0.5*m*R*R; }
    M+=m; Ms+=m*(z+hh/2); z+=hh; }
  return [M,M?Ms/M:0,Math.max(I1,1e-6),I3];
}
function gTick(dt){
  if(!pg.running) return;
  const [M,l,I1,I3]=gProps(), [m,R,th]=DISKS[pg.disk];
  const c0=DRAG_C0*(R/R_REF)**5, c1=DRAG_C1*(R/R_REF)**4*th, V=+$("gv").value;
  const tq=(K_EMF/R_ARM_COIL)*((V-K_EMF*pg.w)-(c0+c1)*pg.w**DRAG_N);
  pg.w=Math.max(0,pg.w+tq/Math.max(I3,1e-6)*dt);
  const L3=I3*pg.w;
  if(L3*L3-4*I1*M*G*l>0){       /* sleeping top: precesses and settles upright */
    const wn=L3/I1; pg.dtheta+=(-wn*wn*0.25*pg.theta)*dt; pg.dtheta*=Math.exp(-1.2*dt);
    pg.theta=Math.max(0,pg.theta+pg.dtheta*dt); pg.phiPrec+=(M*G*l/Math.max(L3,1e-6))*dt;
  } else {
    pg.dtheta+=(M*G*l*Math.sin(pg.theta)/I1)*dt; pg.theta+=pg.dtheta*dt;
    pg.phiPrec+=(M*G*l/Math.max(L3,1e-3))*dt*0.2;
    if(pg.theta>75*Math.PI/180){ pg.theta=75*Math.PI/180; pg.dtheta=0; }
  }
}

function drawG(){
  const s=scG; setupScene(s,true);
  s.begin(); s.poly([[-0.14,-0.14,0],[0.14,-0.14,0],[0.14,0.14,0],[-0.14,0.14,0]],COL_MAT,"#156b62",2); s.render(ctx);
  s.begin();
  const th=pg.theta, ph=pg.phiPrec, n=[Math.sin(th)*Math.cos(ph),Math.sin(th)*Math.sin(ph),Math.cos(th)];
  let z=0;
  for(const k of pg.stack){
    if(k==="motor"){ const hh=0.055; s.box(n.map(v=>v*(z+hh/2)),n,0.040,0.044,hh,COL_MOTOR); z+=hh; }
    else { const R=k==="cw"?DISKS["26_4"][1]:DISKS[pg.disk][1], hh=k==="cw"?0.004:DISKS[pg.disk][2];
      acrylDisk(s,n.map(v=>v*(z+hh/2)),n,R,hh); z+=hh; }
  }
  s.render(ctx);
}
function renderG(){
  $("gList").textContent=[...pg.stack].reverse().map((k,i)=>(pg.stack.length-i)+". "+d().gParts[k]).join("\n");
  const add=$("gAdd"); add.innerHTML="";
  for(const k of ["motor","cw","disk"]){ const b=document.createElement("button"); b.style.width="100%"; b.textContent="+ "+d().gParts[k];
    b.disabled=pg.stack.includes(k); b.onclick=()=>{ pg.stack.push(k); renderG(); }; add.appendChild(b); }
  const row=$("gDiskRow"); row.innerHTML="";
  for(const k of ["20_2","20_3","20_4"]){ const b=document.createElement("button"); b.textContent=DISKS[k][3]; b.className=pg.disk===k?"on":"";
    b.onclick=()=>{ pg.disk=k; renderG(); }; row.appendChild(b); }
}
$("gClear").onclick=()=>{ pg.stack=[]; pg.running=false; renderG(); };
$("gRun").onclick=()=>{ if(!pg.stack.includes("disk")){ say(d().gNoDisk,true); return; }
  Object.assign(pg,{running:true,theta:4*Math.PI/180,dtheta:0,w:0}); };
$("gStop").onclick=()=>{ pg.running=false; };

function setTab(k){
  B.tab=k; $("tab-bench").className=k==="bench"?"on":""; $("tab-g").className=k==="g"?"on":"";
  $("pBench").hidden=k!=="bench"; $("pG").hidden=k!=="g"; $("instrCard").hidden=k!=="bench";
  $("t-cap").textContent=k==="bench"?d().capBench:d().capG; B.carry=null; drawTray(); renderStatus();
}
$("tab-bench").onclick=()=>setTab("bench"); $("tab-g").onclick=()=>setTab("g");

  document.title=lang==="ko"?"APhO 2024 E1 — 자이로스코프 · HaslaLab":"APhO 2024 E1 — Gyroscope · HaslaLab";
  updSw(); renderLaps(); renderSpeeds(); buildKnobs(); updLock(); renderG(); setTab(B.tab);
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════

sc.az=CAM0.az; sc.el=CAM0.el; scG.az=35*Math.PI/180; scG.el=14*Math.PI/180;
let last=performance.now(), fr=0;
function tick(){
  const now=performance.now(), raw=Math.min(0.05,(now-last)/1000); last=now;
  const dt=raw*timeScale, sub=Math.max(1,Math.floor(dt/0.004)+1);
  for(let i=0;i<sub;i++) kit.step(dt/sub);
  gTick(raw);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,CH); g.addColorStop(0,"#1b2027"); g.addColorStop(1,"#2a3038");
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  if(B.tab==="bench"){
    setupScene(sc,false);
    sc.begin(); drawFloor(sc); sc.render(ctx);
    sc.begin(); drawKit(sc,B.carry?kitKey(B.carry.id):null); sc.render(ctx);
    if(B.carry){ ctx.fillStyle="#f2c14e"; ctx.font="bold 13px 'Malgun Gothic',sans-serif"; ctx.textAlign="left";
      ctx.fillText("⇱ "+d().trayItems[B.carry.id],B.mouse[0]+16,B.mouse[1]-12); }
  } else drawG();
  $("swLbl").textContent=fmtTime(swValue());
  $("gvl").textContent=(+$("gv").value).toFixed(1)+" V";
  $("bcw").textContent=kit.nBoltCw+" "+d().sets; $("bsd").textContent=kit.nBoltSd+" "+d().sets;
  if(document.activeElement!==$("arm")) $("arm").value=kit.r_m*100;
  if(++fr%4===0){ drawAdapter(); drawGonio(); drawRuler(); }
  if(fr%12===0) renderStatus();
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
layout(); applyLang(); requestAnimationFrame(tick);
