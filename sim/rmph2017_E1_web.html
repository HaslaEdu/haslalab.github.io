var PROGRAM = {
  title: { ko: 'RMPh 2017 실험 — 편광과 광다이오드', en: 'RMPh 2017 Problem — Polarization and photodiodes' },
  subtitle: { ko: '빛의 편광을 재는 장치(광다이오드 + 편광자·검광자)를 조사하고 보정한 뒤, 그 장치로 설탕물의 미지 농도를 구합니다. 장비: 멀티미터, 3 V 전지, 22 kΩ 가변 저항, 광다이오드와 100 Ω 부하 저항이 있는 회로판(단자 1–4), 레이저 포인터, 세로 받침(각도기), 원통 큐벳, 주사기와 호스, 농도별 설탕물 비커, 검광자, 편광자, 자, 도선. 오차 계산은 하지 않습니다.',
              en: 'Study and calibrate a device for measuring polarization (a photodiode with a polarizer and an analyzer), then use it to find the unknown concentration of a sugar solution. Equipment: a multimeter, a 3 V battery, a 22 kΩ potentiometer, a board with the photodiode and a 100 Ω load (terminals 1–4), a laser pointer, a vertical holder with a protractor, a cylindrical cuvette, a syringe and hose, beakers of sugar solutions, the analyzer, the polarizer, a ruler and wires. No error analysis is required.' },
  notes: { ko: [
    '과제: 4.1 광다이오드 — 개방 전압 U_CD 와 단락 전류 I_SC, 광전지 영역(4사분면)의 I–U 와 출력, 채움률 FFF; 레이저를 끄고 순방향 I–U 로 다이오드 계수 η; 역방향(3 V 까지) I–U. 4.2 검광자를 5° 씩 돌려 I = a·cos²θ + b. 4.3 설탕물 기둥 길이 d 와 농도 c 에 따른 회전각 β, 미지 농도.',
    '공식 해답: U_CD ≈ 667 mV, I_SC ≈ 14.6 mA, P_max ≈ 2.9 mW, FFF ≈ 0.27, 다이오드 계수 ≈ 3.3 (2–3.5 인정), 역전류 ≈ 8.3–8.6 mA, 평행일 때 ≈ 0.92 mA. d = 25 cm 에서 c = 50, 25, 12.5 → β ≈ 36°, 17°, 7°; 미지 용액 ≈ 23° → c_x ≈ 35.',
    '전류는 100 Ω 부하의 전압으로 잽니다(1 mV = 10 µA). 회로판 속에서 2 와 3 이 이어져 있습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 4.1 the photodiode — open-circuit voltage U_CD and short-circuit current I_SC, the I–U and power in photoelement mode (4th quadrant), the fill factor FFF; with the laser off, forward I–U for the diode factor η; reverse I–U up to 3 V. 4.2 turn the analyzer in 5° steps: I = a·cos²θ + b. 4.3 the rotation β against the sugar column length d and the concentration c, and the unknown one.',
    'Official solution: U_CD ≈ 667 mV, I_SC ≈ 14.6 mA, P_max ≈ 2.9 mW, FFF ≈ 0.27, diode factor ≈ 3.3 (2–3.5 accepted), reverse current ≈ 8.3–8.6 mA, ≈ 0.92 mA at parallel filters. At d = 25 cm, c = 50, 25, 12.5 → β ≈ 36°, 17°, 7°; the unknown ≈ 23° → c_x ≈ 35.',
    'Current is read as the voltage on the 100 Ω load (1 mV = 10 µA). Inside the board 2 and 3 are joined. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, laser: false, pol: false, an: false, cuv: false, phiP: 30, thA: 90, x: 0.5, sol: 0, d: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 세로 받침(위에서부터 레이저, 편광자, 큐벳, 각도기 위 검광자, 광다이오드 회로판), 3 V 전지, 22 kΩ 가변 저항, 멀티미터, 설탕물 비커(c₁ = 50, c₂ = 25, c₃ = 12.5, cₓ), 주사기, 버리는 비커, 도선.',
           en: 'On the desk: the vertical holder (from the top: laser, polarizer, cuvette, analyzer over a protractor, the photodiode board), a 3 V battery, a 22 kΩ potentiometer, the multimeter, sugar solution beakers (c₁ = 50, c₂ = 25, c₃ = 12.5, cₓ), the syringe, a waste beaker and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '레이저 클릭: 켜기/끄기 · 편광자·큐벳·검광자: 옆에 놓인 것을 클릭하면 받침에 끼우기 / 다시 클릭하면 빼기',
                '편광자 위에서 휠: 돌리기 · 검광자 바늘 좌우로 끌기(또는 휠): 각도기 위에서 돌리기 · 가변 저항 손잡이 휠/끌기: 저항 바꾸기',
                '비커 클릭: 주사기에 그 용액 담기 · 주사기 클릭: 큐벳에 1 cm 더 · 버리는 비커 클릭: 큐벳 비우기 · 큐벳 클릭: 액체 기둥 눈금 가까이'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Click the laser: on/off · polarizer, cuvette, analyzer: click the one lying beside to fit it on the holder / again to take it off',
                'Wheel over the polarizer: turn it · drag the analyzer\'s needle left/right (or wheel): turn it over the protractor · potentiometer knob, wheel/drag: change its resistance',
                'Click a beaker: fill the syringe with it · click the syringe: 1 cm more in the cuvette · click the waste beaker: empty the cuvette · click the cuvette: read the column\'s scale'] },
  notePlaceholder: { ko: '예) U_CD = 664 mV; 부하 전압 1452 mV → I_SC = 14.5 mA … θ = 90° 0.09 mV, 95° 1.9 mV …', en: 'e.g. U_CD = 664 mV; load 1452 mV → I_SC = 14.5 mA … θ = 90° 0.09 mV, 95° 1.9 mV …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var IL0 = 14.6e-3 * (1 + S.sys('IL', 0.03)), nD = 3.3 * (1 + S.sys('n', 0.04)), Is = IL0 / (Math.exp(0.667 / (nD * 0.02585)) - 1), psiL = 25 + S.uni('psi', -15, 15), offA = S.uni('offA', -4, 4);
    var kRot = 36 / (50 * 25) * (1 + S.sys('k', 0.03)), SOL = [{ c: 50, n: 'c₁ = 50' }, { c: 25, n: 'c₂ = 25' }, { c: 12.5, n: 'c₃ = 12.5' }, { c: 33 * (1 + S.sys('cx', 0.05)), n: 'cₓ' }];
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: S.sys('mA', 0.006), R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 8 }), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 0.2], ['V', 2], ['V', 20], ['A', 2e-3], ['A', 0.02], ['A', 0.2]];
    var prot = (function () { var cv = document.createElement('canvas'); cv.width = cv.height = 300; cv._static = true; var g = cv.getContext('2d');
      g.fillStyle = '#eef0f2'; g.beginPath(); g.arc(150, 150, 148, Math.PI, 2 * Math.PI); g.lineTo(298, 150); g.fill(); g.strokeStyle = '#222'; g.fillStyle = '#222'; g.font = '700 14px sans-serif'; g.textAlign = 'center';
      for (var i = 0; i <= 180; i++) { var a = Math.PI + i * Math.PI / 180, r1 = i % 10 === 0 ? 118 : i % 5 === 0 ? 128 : 136; g.lineWidth = i % 10 === 0 ? 2 : 1;
        g.beginPath(); g.moveTo(150 + Math.cos(a) * r1, 150 + Math.sin(a) * r1); g.lineTo(150 + Math.cos(a) * 146, 150 + Math.sin(a) * 146); g.stroke();
        if (i % 10 === 0) g.fillText(String(i), 150 + Math.cos(a) * 104, 155 + Math.sin(a) * 104); }
      return cv; })();
    var colScale = B3.scaleTex(30, { width: 0.9, bg: '#f4f4ee', step: 0.1 });
    var HX = -14, HZ = -4;                                     /* the vertical holder's axis */
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, wheelIds: ['pol', 'an', 'pot'],
      home: { yaw: -0.3, pitch: 0.55, k: 8.5, tx: 4, ty: 14, tz: 0 },
      views: { prot: { yaw: 0, pitch: 1.4, k: 45, tx: HX, ty: 6, tz: HZ, title: { ko: '검광자와 각도기 (위에서)', en: 'The analyzer and protractor (from above)' } },
               cuv: { yaw: 0, pitch: 0.05, k: 22, tx: HX, ty: 22, tz: HZ, title: { ko: '큐벳의 액체 기둥', en: 'The cuvette\'s column' } },
               dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 14, ty: 3.4, tz: 2, title: { ko: '멀티미터', en: 'Multimeter' } } },
      frame: function (b) {
        if (b.clicked('m:laser')) LAB.laser = !LAB.laser;
        if (b.clicked('m:pol')) LAB.pol = !LAB.pol;
        if (b.clicked('m:an')) LAB.an = !LAB.an;
        if (b.clicked('m:cuv')) { if (b.view === 'cuv') {} else if (LAB.cuv && LAB.d > 0) b.go('cuv'); else LAB.cuv = !LAB.cuv; }
        var wp = b.wheel('pol'); if (wp && LAB.pol) LAB.phiP = (LAB.phiP + wp + 360) % 180;
        var ma = b.screenMoved('an'), wa = b.wheel('an'); if ((ma[0] || wa) && LAB.an) LAB.thA = Math.max(0, Math.min(180, LAB.thA + ma[0] * 0.5 + wa * 0.5));
        var mp = b.screenMoved('pot'), wpt = b.wheel('pot'); if (mp[0] || wpt) LAB.x = Math.max(0, Math.min(1, LAB.x + mp[0] * 0.004 + wpt * 0.005));
        for (var s = 0; s < 4; s++) if (b.clicked('m:sol' + s)) { LAB.syr = s; b.say('주사기에 ' + SOL[s].n, 'Syringe: ' + SOL[s].n); }
        if (b.clicked('m:syr')) { if (!LAB.cuv) b.say('큐벳을 먼저 끼우세요.', 'Fit the cuvette first.'); else if (LAB.syr === undefined) b.say('비커를 먼저 고르세요.', 'Choose a beaker first.');
          else { if (LAB.d > 0 && LAB.sol !== LAB.syr) b.say('다른 용액이 섞입니다 — 먼저 비우세요.', 'A different solution would mix — empty it first.'); else { LAB.sol = LAB.syr; LAB.d = Math.min(28, LAB.d + 1); } } }
        if (b.clicked('m:waste')) LAB.d = 0;
        /* light on the photodiode */
        var I_L = 0;
        if (LAB.laser) { var pol = LAB.pol ? 0.25 * (0.25 + 0.75 * Math.pow(Math.cos((LAB.phiP - psiL) * Math.PI / 180), 2)) : 1, ang = LAB.pol ? LAB.phiP : psiL;
          var beta = LAB.cuv && LAB.d > 0 ? kRot * SOL[LAB.sol].c * LAB.d : 0, cuvT = LAB.cuv ? 0.92 : 1;
          var an = 1; if (LAB.an) { var axA = LAB.thA + offA + 90, dth = (ang + beta - axA) * Math.PI / 180; an = LAB.pol ? 0.25 * (0.002 + Math.pow(Math.cos(dth), 2)) : 0.25 * (0.25 + 0.75 * Math.pow(Math.cos(dth), 2)); }
          I_L = IL0 * pol * an * cuvT; }
        B3.desk(-34, 40, -18, 20);
        /* the vertical holder and what sits on it */
        B3.box3(HX - 7, HX + 7, 0, 1, HZ - 7, HZ + 5, '#c9a878', { top: '#d8b888' });
        B3.box3(HX - 0.6, HX + 0.6, 1, 40, HZ - 6, HZ - 4.8, '#c9a878');
        B3.tex3(prot, 0, 0, 300, 150, [HX - 6, 5.2, HZ - 3], [12, 0, 0], [0, 0, 6], { id: 'c:prot' });
        if (b.clicked('c:prot')) b.go('prot');
        /* the board with the photodiode under the analyzer, its four terminals */
        B3.box3(HX - 5, HX + 5, 1, 1.6, HZ + 0.5, HZ + 4.5, '#1f5a3a', { top: '#246b44' });
        B3.cyl3('y', 1.6, 2.1, HX, HZ, 0.9, '#2a2d3a', { seg: 18, cap: I_L > 1e-4 ? '#5a4d8a' : '#3a3d4a' });
        B3.box3(HX - 1.5, HX + 1.5, 1.0, 1.6, HZ - 1.4, HZ + 0.5, '#1f5a3a', { top: '#246b44' });
        ['1', '2', '3', '4'].forEach(function (t, i) { leads.term(b, 'bd.' + t, [HX - 3.6 + i * 2.4, 1.6, HZ + 3.2], { col: i === 0 ? '#1b1b1b' : i === 1 ? '#c0392b' : '#d8d8d8', label: t, lc: '#e8e8e8' }); });
        if (LAB.an) { B3.cyl3('y', 4.6, 5.6, HX, HZ, 1.3, 'rgba(60,60,70,.75)', { seg: 22, cap: 'rgba(40,40,50,.8)', id: 'm:an' });
          var na = (LAB.thA) * Math.PI / 180; B3.cylAB([HX, 5.3, HZ], [HX - Math.cos(na) * 5.5, 5.3, HZ - Math.sin(na) * 5.5], 0.08, '#e3c48a', { seg: 6, id: 'm:an' }); }
        else B3.cyl3('y', 0, 1, -24, 10, 1.3, 'rgba(60,60,70,.75)', { seg: 22, cap: 'rgba(40,40,50,.8)', id: 'm:an' });
        if (LAB.cuv) { B3.cyl3('y', 10, 40 - 9, HX, HZ, 1.0, 'rgba(220,235,245,.35)', { seg: 18, caps: false, id: 'm:cuv' });
          if (LAB.d > 0) B3.cyl3('y', 10.2, 10.2 + LAB.d * 0.6, HX, HZ, 0.95, 'rgba(225,215,170,.55)', { seg: 18, cap: 'rgba(235,225,180,.6)' });
          B3.tex3(colScale, 0, 0, colScale.width, colScale.height, [HX + 1.05, 10.2 - 0.6 + 19.2, HZ - 0.45], [0, 0, 0.9], [0, -19.2, 0], { id: 'm:cuv' }); }
        else B3.cyl3('y', 0, 12, -20, 13, 1.0, 'rgba(220,235,245,.4)', { seg: 18, caps: false, id: 'm:cuv' });
        if (LAB.pol) { B3.cyl3('y', 32, 33, HX, HZ, 1.3, 'rgba(60,60,70,.75)', { seg: 22, cap: 'rgba(40,40,50,.8)', id: 'm:pol' });
          var pa = LAB.phiP * Math.PI / 180; B3.line3([HX - Math.cos(pa) * 1.2, 33.02, HZ - Math.sin(pa) * 1.2], [HX + Math.cos(pa) * 1.2, 33.02, HZ + Math.sin(pa) * 1.2], '#e8e8e8', 1.5); }
        else B3.cyl3('y', 0, 1, -28, 10, 1.3, 'rgba(60,60,70,.75)', { seg: 22, cap: 'rgba(40,40,50,.8)', id: 'm:pol' });
        B3.cyl3('y', 34, 41, HX, HZ, 0.8, '#2b2f35', { seg: 16, cap: LAB.laser ? '#c0392b' : '#3b3f45', id: 'm:laser' });
        if (LAB.laser) B3.line3([HX, 34, HZ], [HX, 2.1, HZ], 'rgba(255,40,40,.7)', 2);
        /* battery, potentiometer, multimeter, beakers, syringe */
        var cell = B3.cells(b, leads, 'bat', [0, 14], { n: 2, e: 1.5, r: 0.3 });
        B3.box3(-4, 4, 0, 2, -14, -8, '#3a3f46', { top: '#474c55' });
        B3.cyl3('y', 2, 3.6, 0, -11, 1.5, '#2b2f35', { seg: 20, cap: '#3a3f46', id: 'm:pot' });
        var pa2 = (LAB.x - 0.5) * 4.5; B3.line3([0, 3.62, -11], [Math.sin(pa2) * 1.4, 3.62, -11 - Math.cos(pa2) * 1.4], '#f2f2f2', 2.5);
        ['L', 'C', 'R'].forEach(function (t, i) { leads.term(b, 'pot.' + t, [-2.5 + i * 2.5, 2, -8.5], { col: '#b8b8b8', label: { L: 'P_left', C: 'P_center', R: 'P_right' }[t].replace('P_', ''), lc: '#e8e8e8', ls: 0.5 }); });
        var m = B3.dmm(b, 'dmm', [14, 2], dm, leads, { ranges: RANGES });
        SOL.forEach(function (so, i) { B3.cyl3('y', 0, 4, 22 + i * 3.6, 14, 1.4, 'rgba(225,215,170,.6)', { seg: 18, cap: 'rgba(235,225,180,.7)', id: 'm:sol' + i });
          B3.text3([20.9 + i * 3.6, 4.02, 14.5], [1, 0, 0], [0, 0, -1], i < 3 ? String(so.c) : 'x', 0.7, '#333', { weight: '800' }); });
        B3.cyl3('y', 0, 4, 36, 6, 1.6, 'rgba(200,205,210,.5)', { seg: 18, cap: 'rgba(210,215,220,.5)', id: 'm:waste' });
        B3.cylAB([24, 1.0, 6], [31, 1.0, 6], 0.9, 'rgba(230,236,240,.85)', { seg: 14, id: 'm:syr' });
        if (LAB.syr !== undefined) B3.cylAB([24.2, 1.0, 6], [28, 1.0, 6], 0.8, 'rgba(225,215,170,.8)', { seg: 14 });
        /* the circuit */
        c.reset();
        c.R('bd.2', 'pd.j', 20); c.D('pd.j', 'bd.1', { Is: Is, n: nD, Gl: 1e-11, Rs: 0.5 }); c.I('pd.j', 'bd.1', I_L); c.R('pd.j', 'bd.1', 9e3);
        c.join('bd.2', 'bd.3'); c.R('bd.3', 'bd.4', 100);
        c.R('pot.L', 'pot.C', Math.max(1, LAB.x * 22e3)); c.R('pot.C', 'pot.R', Math.max(1, (1 - LAB.x) * 22e3));
        cell.stamp(c); m.stamp(c); leads.wire(c); c.solve(0.05); m.read(c);
        leads.draw(b);
        b.views.cuv.ty = 10 + LAB.d * 0.3 + 2;
        LAB.state = { IL: I_L, Ud: c.V_('bd.2') - c.V_('bd.1'), Ur: c.V_('bd.3') - c.V_('bd.4'), read: dm.now };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
