<script>
"use strict";
/* a small dark plot, in the colours of the OPhO site */
function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(r))), m=r/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function fmtTick(v,st){ const d=Math.max(0,-Math.floor(Math.log10(st)+1e-9)); return (Math.abs(v)<st/1e6?0:v).toFixed(Math.min(6,d)); }
function plotXY(cv,series,o){
  o=o||{}; const dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||800, H=Math.round(W*(o.aspect||0.5));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#100d0c"; c.fillRect(0,0,W,H);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of series) for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)) continue;
    x0=Math.min(x0,s.x[i]); x1=Math.max(x1,s.x[i]); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  if(!isFinite(x0)){x0=0;x1=1;y0=0;y1=1;}
  if(o.xlim){x0=o.xlim[0];x1=o.xlim[1];} if(o.ylim){y0=o.ylim[0];y1=o.ylim[1];}
  if(x1<=x0){x1=x0+1;} if(y1<=y0){y0-=0.5;y1+=0.5;}
  if(!o.ylim){ const p=(y1-y0)*0.06; y0-=p; y1+=p; }
  const L=58,R=14,T=14,B=38, pw=W-L-R, ph=H-T-B;
  if(o.equal){ const sx=(x1-x0)/pw, sy=(y1-y0)/ph, s=Math.max(sx,sy); x1=x0+s*pw; y1=y0+s*ph; }
  const X=v=>L+pw*(v-x0)/(x1-x0), Y=v=>T+ph*(1-(v-y0)/(y1-y0));
  c.font="11px 'Roboto Mono',monospace"; c.lineWidth=1;
  const sx=niceStep((x1-x0)/8), sy=niceStep((y1-y0)/6);
  c.strokeStyle="rgba(255,255,255,.08)"; c.fillStyle="rgba(255,255,255,.6)";
  c.textAlign="center"; c.textBaseline="top";
  for(let v=Math.ceil(x0/sx)*sx;v<=x1+1e-12;v+=sx){ c.beginPath(); c.moveTo(X(v),T); c.lineTo(X(v),T+ph); c.stroke(); c.fillText(fmtTick(v,sx),X(v),T+ph+5); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=Math.ceil(y0/sy)*sy;v<=y1+1e-12;v+=sy){ c.beginPath(); c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); c.stroke(); c.fillText(o.logy?"1e"+fmtTick(v,sy):fmtTick(v,sy),L-6,Y(v)); }
  c.strokeStyle="rgba(255,255,255,.28)"; c.strokeRect(L,T,pw,ph);
  c.fillStyle="rgba(255,255,255,.75)"; c.textAlign="center"; c.textBaseline="alphabetic"; c.fillText(o.xl||"",L+pw/2,H-6);
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.fillText(o.yl||"",0,0); c.restore();
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  for(const s of series){ c.strokeStyle=c.fillStyle=s.color||"#a7e26e"; c.lineWidth=s.lw||1.4;
    if(s.mode==="dot"){ for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(s.y[i]):s.y[i]; c.beginPath(); c.arc(X(s.x[i]),Y(y),s.r||2.4,0,7); c.fill(); } }
    else{ c.beginPath(); let st=false; for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)){st=false;continue;} const px=X(s.x[i]),py=Y(y); st?c.lineTo(px,py):c.moveTo(px,py); st=true; } c.stroke(); } }
  c.restore();
  let ly=T+14; c.textAlign="left"; c.textBaseline="alphabetic";
  for(const s of series) if(s.label){ c.fillStyle=s.color||"#a7e26e"; c.fillRect(L+10,ly-8,10,3); c.fillStyle="rgba(255,255,255,.8)"; c.fillText(s.label,L+26,ly-3); ly+=15; }
  return {X,Y,L,T,pw,ph,x0,x1,y0,y1};
}
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download=name; a.click(); }

const T={
 ko:{eb:"OPhO 2021 Invitational · 실험 문제",h1:"슬릿 간섭 무늬",
   lead:"슬릿을 λ × λ 조각으로 나누고, 스크린의 각 점 x에서 모든 조각에서 온 파동(페이저)을 더해 제곱한 뒤 최댓값이 1이 되게 맞춥니다. 슬릿 목록과 스크린 설정을 넣으면 주최측 노트북과 같은 data.csv (x, Intensity)가 나옵니다.",
   inT:"슬릿과 스크린",sl:"slits — 한 줄에 [중심 x, 폭 w, 높이 h, 격자 간격, 투과 진폭] (λ 단위)",
   p0:"얇은 슬릿 2개 (±4λ)",p1:"넓은 슬릿 2개 (1.2)",p2:"얇은 슬릿 3개",
   wd:"스크린까지 거리 width (λ)",q:"출력",qI:"세기 (정규화)",qA:"진폭 (√세기)",run:"간섭 무늬 계산 ↗",
   d31:"문제 3.1 데이터",d32:"문제 3.2 데이터",
   help:"λ = 1. 노트북의 파이썬 목록을 그대로 붙여 넣어도 됩니다(‘*wavelength’, 대괄호는 무시). 얇은 슬릿은 폭·높이 = λ, 즉 점광원입니다. 문제 3.1/3.2 버튼은 숨겨진 슬릿 배열로 계산한 데이터를 내놓습니다(배열은 보여 주지 않음). x 간격은 (x_upper − x_lower)/(N − 1).",
   outT:"스크린 위 세기",copy:"표 복사",csv:"data.csv 내려받기",pts:"개 점",lat:"격자점 ",hid:"숨겨진 슬릿 배열",big:"계산량이 너무 큽니다 (N × 격자점 ≤ 5×10⁷).",
   foot:"<b>모형</b> — 주최측 노트북의 generate_slit, dist(√(Δx² + Δy² + width²)), amplitude(exp(2πi·d/λ))와 정규화를 그대로 옮겼습니다. 문제 3.1, 3.2의 숨겨진 배열은 공식 풀이에 실린 것이며, x 범위는 ±200 000λ, N = 2000입니다(3.2는 진폭). 주최측 노트북 원본은 카탈로그의 ‘소스’에서 받을 수 있습니다."},
 en:{eb:"OPhO 2021 Invitational · Experimental",h1:"Slit Interference",
   lead:"The slits are cut into λ × λ segments; at each screen point x the waves (phasors) from every segment are added and squared, and the pattern is scaled so its maximum is 1. Enter the slit list and screen; out comes the same data.csv (x, Intensity) as the organisers' notebook.",
   inT:"Slits and screen",sl:"slits — one per line: [centre x, width w, height h, lattice step, amplitude] (in λ)",
   p0:"2 thin slits (±4λ)",p1:"2 wide slits (1.2)",p2:"3 thin slits",
   wd:"distance to screen width (λ)",q:"output",qI:"intensity (normalised)",qA:"amplitude (√intensity)",run:"Compute the pattern ↗",
   d31:"Problem 3.1 data",d32:"Problem 3.2 data",
   help:"λ = 1. You can paste the notebook's Python list as it is (‘*wavelength’ and brackets are ignored). A thin slit has width and height λ, i.e. a point source. The problem 3.1/3.2 buttons return data computed from the hidden apertures, which stay hidden. The x step is (x_upper − x_lower)/(N − 1).",
   outT:"Intensity on the screen",copy:"Copy table",csv:"Download data.csv",pts:" points",lat:"lattice points ",hid:"hidden aperture",big:"Too much work (N × lattice points ≤ 5×10⁷).",
   foot:"<b>Model</b> — generate_slit, dist (√(Δx² + Δy² + width²)), amplitude (exp(2πi·d/λ)) and the normalisation are taken over from the organisers' notebook unchanged. The hidden apertures of problems 3.1 and 3.2 are those printed in the official solution, computed over x = ±200 000λ with N = 2000 (3.2 as amplitude). The organisers' notebook itself is the catalogue's ‘source’ download."}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=i=>document.getElementById(i);
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{ const k=e.dataset.t; if(d[k]!==undefined) e.innerHTML=d[k]; });
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":"";
  if(typeof onLang==="function") onLang(); }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

const PRE=[
 "[-4, 1, 1, 1, 1],\n[4, 1, 1, 1, 1],",
 "[-5, 3, 1, 1, 1],\n[5, 3, 1, 1, 1],",
 "[-4, 1, 1, 1, 1],\n[0, 1, 1, 1, 1],\n[4, 1, 1, 1, 1],"];
/* problem 3.1 and 3.2, from the official solution */
const H31=[[0,1,1,1,3],[-5,1,1,1,0.45],[5,1,1,1,0.45],[-10,1,1,1,0.77],[10,1,1,1,0.77]];
const H32=[-4,-3,-2,-1,0,1,2,3,4].map(x=>[x,1,1,1,1-Math.abs(x)/5]);
let rows=[], qcol="Intensity", fname="data.csv";
function parseSlits(t){ t=t.replace(/(\d)\s*\*\s*wavelength/g,"$1").replace(/wavelength/g,"1");
  return t.split(/\]|\n/).map(l=>(l.match(/-?\d*\.?\d+(?:e-?\d+)?/gi)||[]).map(Number)).filter(r=>r.length>=5).map(r=>r.slice(0,5)); }
const ar=(a,b,st)=>{ const n=Math.max(0,Math.ceil((b-a)/st)), o=[]; for(let i=0;i<n;i++) o.push(a+i*st); return o; };  /* np.arange */
function lattice(sl){ const P=[]; for(const [xc,w,h,wl,am] of sl){ if(!(wl>0)) continue;
  for(const x of ar(xc-w/2+wl/2,xc+w/2+wl/2,wl)) for(const y of ar(-h/2+wl/2,h/2+wl/2,wl)) P.push([x,y,am]); } return P; }
function compute(sl,width,x0,x1,N,amp){
  const P=lattice(sl); if(!P.length) return null; if(P.length*N>5e7) return "big";
  const out=[], wl=1, w2=width*width; let mx=0;
  for(let k=0;k<N;k++){ const r=N===1?x0:x0+(x1-x0)*k/(N-1); let re=0,im=0;
    for(const p of P){ const d=Math.sqrt((p[0]-r)**2+p[1]**2+w2), ph=d/wl*2*Math.PI; re+=p[2]*Math.cos(ph); im+=p[2]*Math.sin(ph); }
    const I=re*re+im*im; out.push([r,I]); if(I>mx) mx=I; }
  for(const o of out){ o[1]/=mx; if(amp) o[1]=Math.sqrt(o[1]); }
  return {out,n:P.length};
}
const text=()=>"x,"+qcol+"\n"+rows.map(r=>(+r[0].toPrecision(12))+","+(+r[1].toPrecision(12))).join("\n");
function show(res,label){ const d=T[lang];
  if(res==="big"){ $("stat").textContent=d.big; return; } if(!res) return;
  rows=res.out; $("out").textContent=text(); $("stat").textContent=rows.length+d.pts+"  ·  "+(label||d.lat+res.n); draw(); }
function draw(){ if(!rows.length) return; plotXY($("plot"),[{x:rows.map(r=>r[0]),y:rows.map(r=>r[1]),color:"#a7e26e",lw:1.2,label:qcol}],{xl:"x (λ)",yl:qcol,aspect:0.42,ylim:[0,1.05]}); }
$("run").onclick=()=>{ const amp=$("q").value==="A"; qcol=amp?"Amplitude":"Intensity"; fname="data.csv";
  show(compute(parseSlits($("slits").value),parseFloat($("wd").value)||500000,parseFloat($("xl").value),parseFloat($("xu").value),Math.max(2,Math.min(100000,parseInt($("N").value)||1000)),amp)); };
$("d31").onclick=()=>{ qcol="Intensity"; fname="data_3_1.csv"; show(compute(H31,500000,-200000,200000,2000,false),T[lang].hid+" · 3.1"); };
$("d32").onclick=()=>{ qcol="Amplitude"; fname="data_3_2.csv"; show(compute(H32,500000,-200000,200000,2000,true),T[lang].hid+" · 3.2"); };
[0,1,2].forEach(i=>$("p"+i).onclick=()=>{ $("slits").value=PRE[i]; $("run").click(); });
$("copy").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(text());
$("csv").onclick=()=>rows.length&&download(fname,text(),"text/csv");
addEventListener("resize",draw);
$("slits").value=PRE[0]; applyLang(); $("run").click();
</script>

  <script src="simfull.js"></script>
</body>
