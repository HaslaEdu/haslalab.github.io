<meta name="description" content="IPhO 2015 실험 2를 브라우저에서 실행합니다. 물 트레이에 바이브레이터로 표면 장력파를 만들고, 스치듯 비춘 레이저의 회절 무늬를 버니어 캘리퍼에 단 광센서와 조도계로 읽어 표면 장력과 점성을 구합니다. 태블릿 사인파 발생기, 컨트롤 박스, 멀티미터, 줄자를 직접 다룹니다. 계산은 대신 해주지 않습니다.">

/* ══════════════════════════════════════════════════════════════
   3.  THE PHYSICS OF THE MEASUREMENT
   ══════════════════════════════════════════════════════════════ */
const trackX=()=>XT0-ST.baseX;                               /* cm, what the track scale reads at the base's marker */
const l1=()=>(TRAY.x0-ST.baseX)/100;                         /* m, aperture -> outer edge of the tray */
const Lm=()=>l1()+TRUE.l2;
const spotCentre=()=>(TRUE.yBase+Math.tan(TRUE.theta)*trackX()*0.01)*1000;   /* mm on the caliper */
const x1mm=()=>Lm()*kOf(ST.freq)*LAM/(2*Math.PI*Math.sin(TRUE.theta))*1000;
const vibConnected=()=>ST.plugged.audio&&ST.plugged.vibpin&&ST.plugged.usb;
function vrms(){ if(!(ST.gen&&has("tablet")&&has("ctrl")&&has("vib")&&vibConnected())) return 0; return 2*ST.amp*ST.knob; }
function waveAmp(){ const v=vrms(); if(v<=0||ST.water<500) return 0; const s=Math.max(0,(ST.vibMark+TRUE.xMark)*0.01);
  return TRUE.A*Math.pow(v,0.4)*Math.exp(-deltaOf(ST.freq)*s); }
const phaseDepth=()=>4*Math.PI*waveAmp()*Math.sin(TRUE.theta)/LAM;
function orders(){ const p=phaseDepth(), o=[]; for(let m=-4;m<=4;m++){ const j=besselJ(Math.abs(m),p); o.push([m,j*j]); } return o; }
const laserLit=()=>ST.laser&&has("laser2")&&has("psu")&&ST.plugged.laser&&has("tray")&&ST.water>=500;
/* illuminance on the sensor aperture, lux, at caliper reading y (mm) */
function illuminance(y){
  if(!laserLit()||!has("sensor")) return 0;
  const g=TRUE.gain*(ST.high?1:0.42), c=spotCentre(), x1=x1mm(), sg=TRUE.spot*1000; let tot=0;
  for(const [m,w] of orders()){ if(w<1e-9) continue; const dy=y-(c+m*x1); if(Math.abs(dy)>6*sg) continue; tot+=w*Math.exp(-dy*dy/(2*sg*sg)); }
  return g*tot+TRUE.dark+(ST.flap?2:0);
}
function meterText(){ if(!has("meter")||!ST.plugged.sensorw) return null; if(!ST.meterOn) return "";
  const lux=Math.max(0,illuminance(ST.calY)*(1+gauss()*(ST.flap?0.03:0.004)));
  const step={A:1,B:10,C:100}[ST.meterRange], top={A:1999,B:19990,C:50000}[ST.meterRange];
  if(lux>top) return "1   "; return String(Math.round(lux/step)*step); }
function dmmText(){ if(!has("dmm")) return null; if(!ST.plugged.dmmw) return ST.dmmRange==="200mV"?"0.0":ST.dmmRange==="2V"?"0.000":"0.00";
  let v=ST.dmmAC?vrms()*TRUE.dmmGain*(1+2e-4*gauss()):0; v=Math.max(0,v+(ST.dmmAC?0.00004*Math.abs(gauss()):0));
  const full={"200mV":0.19995,"2V":1.9995,"20V":19.995}[ST.dmmRange]; if(v>full) return "1   ";
  return ST.dmmRange==="200mV"?(v*1000).toFixed(1):ST.dmmRange==="2V"?v.toFixed(3):v.toFixed(2); }

/* ══════════════════════════════════════════════════════════════
   4.  DRAWING HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,'Courier New',monospace";
function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function vgrad(y,h,stops){ const g=ctx.createLinearGradient(0,y,0,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function ell(x,y,rx,ry,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];
  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]<=0.02) continue;
    const f=0.80+0.2*out[1]-0.08*out[0];
    poly([P(p[0],p[1],z0),P(q[0],q[1],z0),P(q[0],q[1],z0+h),P(p[0],p[1],z0+h)],shade(side,f-1),edge,0.6); }
  poly(c.map(p=>P(p[0],p[1],z0+h)),top,edge,0.6);
  return c;
}
function vcyl(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=0.7; ctx.stroke(); }
  ell(t[0],t[1],rx,ry,top,edge,0.7);
}
function hcyl(p0,p1,z,r,col,hi){
  const a=P(p0[0],p0[1],z), b=P(p1[0],p1[1],z);
  ctx.lineCap="round"; ctx.strokeStyle=col; ctx.lineWidth=2*r*SC; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if(hi){ ctx.strokeStyle=hi; ctx.lineWidth=Math.max(0.8,r*SC*0.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]-r*SC*0.45); ctx.lineTo(b[0],b[1]-r*SC*0.45); ctx.stroke(); }
  ctx.lineCap="butt";
}

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}
/* ══════════════════════════════════════════════════════════════
   5.  THE BENCH  (sheared oblique view from the front right, cm)
   ══════════════════════════════════════════════════════════════ */
const LW=1200, LH=400, SC=5.4, OX=168, OY=212, KY=0.45, KX=0.35;
const P=(x,y,z)=>[OX+SC*(x-KX*y), OY+SC*(KY*y-(z||0))];
const unP=(X,Y,z)=>{ const y=((Y-OY)/SC+(z||0))/KY; return [(X-OX)/SC+KX*y,y]; };
const RAD=Math.PI/180;
const TBL={x0:-10,x1:184,y0:-8,y1:56};
function abox(x0,y0,z0,x1,y1,z1,top,front,side,edge){
  poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],side,edge,0.6);
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],front,edge,0.6);
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],top,edge,0.6);
}
function seg3(a,b,col,w){ const p=P(...a), q=P(...b); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); }
let woodPat=null;
function drawTable(){
  ctx.fillStyle="#2a2d33"; ctx.fillRect(0,0,LW,LH);
  poly([P(TBL.x0,TBL.y0,-PLAT.t),P(TBL.x1,TBL.y0,-PLAT.t),P(TBL.x1,TBL.y1,-PLAT.t),P(TBL.x0,TBL.y1,-PLAT.t)],"#e8e8e4","#b9b9b2",1);
  if(!woodPat){ const c=document.createElement("canvas"); c.width=64; c.height=16; const g=c.getContext("2d"); g.fillStyle="#f1ebe0"; g.fillRect(0,0,64,16);
    for(let i=0;i<9;i++){ g.strokeStyle="rgba(170,140,100,"+(0.05+0.04*(i%3))+")"; g.beginPath(); g.moveTo(0,1+i*1.8); g.bezierCurveTo(20,i*1.8+2,40,i*1.8-1,64,1+i*1.8); g.stroke(); } woodPat=ctx.createPattern(c,"repeat"); }
  poly([P(0,PLAT.h,-PLAT.t),P(PLAT.w,PLAT.h,-PLAT.t),P(PLAT.w,PLAT.h,0),P(0,PLAT.h,0)],"#a8703e","#6b4421",0.8);
  poly([P(PLAT.w,0,-PLAT.t),P(PLAT.w,PLAT.h,-PLAT.t),P(PLAT.w,PLAT.h,0),P(PLAT.w,0,0)],"#8d5c31","#6b4421",0.8);
  poly([P(0,0,0),P(PLAT.w,0,0),P(PLAT.w,PLAT.h,0),P(0,PLAT.h,0)],woodPat,"#c9b48f",1);
  /* the track: two rails and its centimetre scale between them */
  for(const yr of [24,32]){ poly([P(3,yr-0.8,0),P(78,yr-0.8,0),P(78,yr+0.8,0.9),P(3,yr+0.8,0.9)],"#1b1c1f","#000",0.5); poly([P(3,yr-0.8,0.9),P(78,yr-0.8,0.9),P(78,yr+0.8,0.9),P(3,yr+0.8,0.9)],"#2c2e33",null); }
  poly([P(XT0-42,26.2,0.05),P(XT0+1,26.2,0.05),P(XT0+1,29.8,0.05),P(XT0-42,29.8,0.05)],"#f6f3e8","#bbb",0.5);
  for(let c=0;c<=40;c++){ const x=XT0-c, a=P(x,26.2,0.06), b=P(x,26.2+(c%10?0.9:(c%5?1.3:1.8)),0.06); ctx.strokeStyle="#333"; ctx.lineWidth=0.6; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    if(c%10===0){ const q=P(x,28.8,0.06); text(String(c),q[0],q[1],"#333",7,"center"); } }
}

/* ---------- the light sensor on its caliper, in the screen base ---------- */
const zAp=()=>ZCAL0+ST.calY/10;

/* ══════════════════════════════════════════════════════════════
   7.  HANDS: putting things down, moving them, putting them back
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const DEPS={tray:["cover"],vib:["cover"],laser2:["cover"],base:["sensor"]};
function itemAt(p){
  const order=["sensor","base","cover","vib","laser2","tray","cyl","hexkey","tablet","ctrl","dmm","meter","psu"];
  for(const k of order){ const b=bbox(k); if(b&&p[0]>=b[0]-2&&p[0]<=b[2]+2&&p[1]>=b[1]-2&&p[1]<=b[3]+2) return k; }
  return null;
}
function unplugFor(k){ for(const [c,org,,dev] of CABLES) if((org===k||dev===k)&&ST.plugged[c]) delete ST.plugged[c]; if(ST.plug&&CABLES.find(c=>c[0]===ST.plug)[1]===k) ST.plug=null; }
function returnItem(k,quiet){
  for(const dep of DEPS[k]||[]) if(has(dep)) returnItem(dep,true);
  unplugFor(k); if(k==="tray"){ ST.water=0; } if(k==="cover") ST.flap=false; if(k==="laser2"||k==="psu") ST.laser=false; if(k==="tablet") ST.gen=false;
  ST.it[k].on=false; if(!quiet) say("back",itemName(k));
}
function place(k,p){
  const it=ST.it[k];
  if(SEATED.includes(k)){ const b=box3(UNIT.x0,UNIT.y0,0,UNIT.x1,UNIT.y1,UNIT.top); if(p[0]<b[0]-20||p[0]>b[2]+20||p[1]<b[1]-20||p[1]>b[3]+20){ say("seat",itemName(k)); return false; }
    if(k==="cover"&&!(has("tray")&&has("vib")&&has("laser2"))){ say("coverNeeds"); return false; } it.on=true; return true; }
  if(k==="base"){ const [x,y]=unP(p[0],p[1],0); if(Math.abs(y-LANE)>6||x<XT0-40.5||x>XT0+0.5){ say("onTrack"); return false; } ST.baseX=Math.max(XT0-40,Math.min(XT0,x)); it.on=true; return true; }
  if(k==="sensor"){ if(!has("base")){ say("needBase"); return false; } if(!has("hexkey")){ say("needHex"); return false; } it.on=true; return true; }
  const [x,y]=unP(p[0],p[1],0);
  if(!fits(k,x,y)){ say("noFit"); return false; } it.x=x; it.y=y; it.on=true; return true;
}
function anchors(){ const o=[];
  if(has("sensor")) o.push([ST.baseX,LANE,zAp()]);
  if(has("tray")) o.push([TRAY.x0,LANE,TRAY.z1]);
  if(laserLit()) o.push([XI,LANE,ZW]);
  return o; }
function snapTape(p){ let best=null, bd=16; for(const a of anchors()){ const q=P(a[0],a[1],a[2]), dd=Math.hypot(q[0]-p[0],q[1]-p[1]); if(dd<bd){ bd=dd; best=a; } }
  if(best) return best; const [x,y]=unP(p[0],p[1],0); return [x,y,0]; }
function tapeClick(p){
  const a=snapTape(p);
  if(!ST.tapeA||ST.tapeB){ ST.tapeA=a; ST.tapeB=null; ST.tapeTxt=""; say("tapeA"); return; }
  ST.tapeB=a; const A=ST.tapeA, key=[A,a].map(v=>v.map(x=>x.toFixed(2)).join(",")).sort().join("|");
  const dd=Math.hypot(a[0]-A[0],a[1]-A[1])+noise(key,0.05);
  ST.tapeTxt=(Math.round(Math.max(0,dd)*10)/10).toFixed(1)+" cm"; say("tapeB",ST.tapeTxt);
}
function benchClick(p,right){
  if(hand&&hand.tape){ if(right){ hand=null; ST.tapeA=ST.tapeB=null; return; } tapeClick(p); return; }
  if(hand){ if(right){ if(hand.move) say("stays"); else say("back",itemName(hand.item)); hand=null; return; }
    if(hand.move){ const k=hand.item, o={...ST.it[k]}; ST.it[k].on=false; if(place(k,p)){ say("placed",itemName(k)); hand=null; } else Object.assign(ST.it[k],o); return; }
    if(place(hand.item,p)){ say("placed",itemName(hand.item)); hand=null; } return; }
  const k=itemAt(p); if(!k) return;
  if(right){ returnItem(k); return; }
  if(LOOSE.includes(k)||k==="base"){ if(k==="base"&&has("sensor")) return; hand={item:k,move:true}; say("moveIt",itemName(k)); }
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
cv.addEventListener("wheel",e=>{ const k=itemAt(lpos(e)); if(k!=="base"&&k!=="sensor") return; e.preventDefault();
  ST.baseX=Math.max(XT0-40,Math.min(XT0,+(ST.baseX-(e.deltaY<0?1:-1)*(e.shiftKey?0.02:0.1)).toFixed(3))); },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&!hand.tape&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ hand=null; ST.plug=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&!hand.move&&(hand.item===k||(k==="tape"&&hand.tape)); hand=null;
    if(!same&&trayAvail(k)){ if(k==="tape"){ hand={tape:true}; ST.tapeA=ST.tapeB=null; } else { hand={item:k}; say("picked",itemName(k)); } }
    drawTray(); return; } });

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let drag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(drag){ const h=drag, v=Math.max(0,Math.min(1,(cmouse[0]-h.x)/h.w)); if(h.k==="amp") ST.amp=+v.toFixed(3); else if(h.k==="fsl") ST.freq=Math.max(1,Math.round(v*200)); } });
closeCv.addEventListener("pointerup",()=>{ drag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2, h=hitAt(p);
  if(tab==="wires"){
    if(right){ if(h&&h.k.startsWith("u:")){ const k=h.k.slice(2); delete ST.plugged[k]; say("unplugged",d().cables[k]); } ST.plug=null; return; }
    if(h&&h.k.startsWith("p:")){ ST.plug=h.k.slice(2); say("plugPick",d().cables[ST.plug]); return; }
    if(h&&h.k.startsWith("s:")&&ST.plug){ const sk=h.k.slice(2), c=CABLES.find(c=>c[0]===ST.plug); if(c[2]!==sk){ say("wrong"); return; } ST.plugged[ST.plug]=true; say("plugged",d().cables[ST.plug]); ST.plug=null; return; }
    return; }
  if(!h) return;
  if(h.k==="mpow") ST.meterOn=!ST.meterOn;
  else if(h.k.startsWith("mr")) ST.meterRange=h.k.slice(2);
  else if(h.k==="amp"||h.k==="fsl"){ drag=h; const v=Math.max(0,Math.min(1,(p[0]-h.x)/h.w)); if(h.k==="amp") ST.amp=+v.toFixed(3); else ST.freq=Math.max(1,Math.round(v*200)); }
  else if(h.k==="gen") ST.gen=!ST.gen;
  else if(h.k==="acdc") ST.dmmAC=!ST.dmmAC;
  else if(h.k==="range"){ const r=["200mV","2V","20V"]; ST.dmmRange=r[(r.indexOf(ST.dmmRange)+(right?2:1))%3]; }
});
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), h=hitAt(p), dir=e.deltaY<0?1:-1; if(!h) return; e.preventDefault(); const f=e.shiftKey;
  if(h.k==="cal") ST.calY=Math.max(0,Math.min(150,+(ST.calY+dir*(f?0.02:0.1)).toFixed(3)));
  else if(h.k==="ffield"||h.k==="fsl") ST.freq=Math.max(1,Math.min(1000,+(ST.freq+dir*(f?0.1:1)).toFixed(1)));
  else if(h.k==="amp") ST.amp=Math.max(0,Math.min(1,+(ST.amp+dir*(f?0.002:0.01)).toFixed(4)));
  else if(h.k==="knob") ST.knob=Math.max(0,Math.min(1,+(ST.knob+dir*(f?0.002:0.01)).toFixed(4)));
  else if(h.k==="range"){ const r=["200mV","2V","20V"]; ST.dmmRange=r[Math.max(0,Math.min(2,r.indexOf(ST.dmmRange)+dir))]; }
  else if(h.k==="unit") ST.vibMark=Math.max(4,Math.min(16,+(ST.vibMark+dir*(f?0.02:0.1)).toFixed(3)));
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("laserBtn").onclick=()=>{ if(ST.laser){ ST.laser=false; say("laser",false); return; } if(!(has("laser2")&&has("psu")&&ST.plugged.laser)){ say("noLaser"); return; } ST.laser=true; say("laser",true); };
$("hiBtn").onclick=()=>{ ST.high=true; say("int","High"); };
$("loBtn").onclick=()=>{ ST.high=false; say("int","Low"); };
$("pourBtn").onclick=()=>{ if(!has("tray")){ say("needTray"); return; } if(!has("cyl")){ say("needCyl"); return; } if(ST.water>0){ say("full"); return; } ST.water=500; say("poured"); };
$("emptyBtn").onclick=()=>{ ST.water=0; say("emptied"); };
$("flapBtn").onclick=()=>{ if(!has("cover")){ say("noCover"); return; } ST.flap=!ST.flap; say("flap",ST.flap); };
$("noteBtn").onclick=()=>{ const parts=[];
  if(LUX) parts.push("lux "+LUX+" ("+ST.meterRange+")"); if(DMM&&has("dmm")) parts.push("DMM "+DMM+" "+(ST.dmmRange==="200mV"?"mV":"V")+(ST.dmmAC?" AC":" DC"));
  if(has("tablet")) parts.push("f "+ST.freq+" Hz"); if(ST.tapeB) parts.push("tape "+ST.tapeTxt);
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderPanel(){ const t=d();
  $("laserBtn").textContent=ST.laser?t.laserOff:t.laserOn; $("hiBtn").className=ST.high?"on":""; $("loBtn").className=ST.high?"":"on";
  $("flapBtn").textContent=ST.flap?t.flapDown:t.flapUp; $("waterLbl").textContent=t.lab.water(ST.water);
  $("luxDisp").textContent=LUX===null?"----":(ST.meterOn?LUX+" lux":t.lab.off); $("dmmDisp").textContent=DMM===null?"----":DMM+" "+(ST.dmmRange==="200mV"?"mV":"V")+(ST.dmmAC?" ~":" ⎓"); }
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>has(k))) L.push([t.st.none,false]);
  if(hand&&hand.tape) L.push([ST.tapeA&&!ST.tapeB?t.st.tape2:ST.tapeB?t.st.tapeRead(ST.tapeTxt):t.st.tape,false]);
  else if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.plug) L.push([t.st.plug(t.cables[ST.plug]),false]);
  if(ST.laser) L.push([t.st.laserOn,true]); if(ST.flap) L.push([t.st.flap,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-psu").textContent=t.hPsu; $("hiBtn").textContent=t.hi; $("loBtn").textContent=t.lo;
  $("t-h-water").textContent=t.hWater; $("pourBtn").textContent=t.pour; $("emptyBtn").textContent=t.empty;
  $("t-h-read").textContent=t.hRead; $("t-readhint").textContent=t.readHint; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2015 E2 — 표면 장력파에 의한 회절 · HaslaLab":"IPhO 2015 E2 — Diffraction due to Surface Tension Waves · HaslaLab";
  renderTabs(); renderPanel(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastRead=0;
function tick(){
  const now=performance.now(); if(now-lastRead>500){ lastRead=now; LUX=meterText(); DMM=dmmText(); }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
