<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  [hidden]{display:none!important}
  html,body{margin:0;padding:0}

  ri:U(0.70,0.78), wall:U(0.065,0.090), /* the test tube's bore radius and wall, cm */
  Lt:15.0*U(0.99,1.01),                /* its length, round bottom to rim, cm */
  rhoG:2.45, rhoW:0.9975,              /* glass, and the distilled water at room temperature */
  Rv:4.0, Hv:21, Vv0:U(830,870) };     /* the vessel: inner radius and height, cm, and the water in it, cm³ */

/* the close-up: drag the ruler, drag the view, wheel to zoom */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0) return; const z=sideMap().z;
  cdrag=h&&h.k==="rulerV"?{k:"rul",p,x:ST.rul.x,y:ST.rul.y,z}:{k:"pan",p,x:SV.cx,y:SV.cy,z}; closeCv.setPointerCapture(e.pointerId); });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e), dx=(p[0]-cdrag.p[0])/cdrag.z, dy=(p[1]-cdrag.p[1])/cdrag.z;
  if(cdrag.k==="rul"){ ST.rul.x=cdrag.x+dx; ST.rul.y=cdrag.y-dy; } else { SV.cx=cdrag.x-dx; SV.cy=cdrag.y+dy; } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const m=sideMap(), p=clpos(e), nz=Math.max(6,Math.min(400,m.z*(e.deltaY<0?1.2:1/1.2)));
  const wx=SV.cx+(p[0]-CLW/2)/m.z, wy=SV.cy-(p[1]-CLH/2)/m.z; SV.z=nz; SV.cx=wx-(p[0]-CLW/2)/nz; SV.cy=wy+(p[1]-CLH/2)/nz; },{passive:false});

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
const needDropper=f=>()=>{ if(!has("dropper")&&!inHand("dropper")){ say("needFor",itemName("dropper")); return; } f(); };
$("dWater").onclick=needDropper(()=>{ if(!has("water")){ say("needFor",itemName("water")); return; } fillDropper("water"); });
$("dOil").onclick=needDropper(()=>{ if(!has("oil")){ say("needFor",itemName("oil")); return; } fillDropper("oil"); });
$("dAll").onclick=needDropper(()=>squeeze(true)); $("dOne").onclick=needDropper(()=>squeeze(false)); $("dSuck").onclick=needDropper(suckBack);
$("dWaste").onclick=needDropper(()=>{ if(!has("waste")){ say("needFor",itemName("waste")); return; } squirtWaste(); });
for(const [id,dv] of [["bUp1",1],["bUp01",0.1],["bDn01",-0.1],["bDn1",-1]]) $(id).onclick=()=>{ if(ST.band===null){ say("noBand"); return; } ST.band=Math.max(2,Math.min(TRUE.Lt-0.5,Math.round((ST.band+dv)*10)/10)); say("bandMoved"); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), s=rows+")  "+$("cfg").value.trim();
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s; n.scrollTop=n.scrollHeight; $("cfg").value=""; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(); $("dropLbl").textContent=ST.drop.V>0.01?t.dropNow(t.liq[ST.drop.liq],ST.drop.V):t.dropEmpty;
  $("tubeLbl").textContent=t.tubeNow(ST.at.tube,ST.Vw>0.02,ST.Vo>0.02,ST.sunk); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.Vw>0.15&&ST.Vo>0.15) L.push([t.st.both,true]);
  if(ST.at.tube==="vessel"&&!ST.sunk&&!levels().upright) L.push([t.st.tilted,true]);
  if(ST.bob>0.2&&ST.at.tube==="vessel") L.push([t.st.bobbing,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-drop","hDrop"],["dWater","dWater"],["dOil","dOil"],["dAll","dAll"],["dOne","dOne"],["dSuck","dSuck"],["dWaste","dWaste"],["dropHint","dropHint"],
    ["t-h-band","hBand"],["bandHint","bandHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
