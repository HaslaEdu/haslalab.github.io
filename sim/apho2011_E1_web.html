  return k*Math.abs(dEmf2dz(z,RING.closed.rm))-BENCH.fIron*Math.exp(-Math.max(0,z)/BENCH.lamIron); }

/* ── complex numbers and an AC nodal solver ── */
const C=(re,im)=>[re,im||0], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]], csub=(a,b)=>[a[0]-b[0],a[1]-b[1]],
      cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
      cdiv=(a,b)=>{ const q=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q]; },
      cabs=a=>Math.hypot(a[0],a[1]);
function solveNet(net){
  /* net.z: [a,b,Z] branches, net.v: [a,b,V] sources (V = Va - Vb); "GND" is the reference */
  const idx={}; let N=0; const id=n=>n==="GND"?-1:(n in idx?idx[n]:(idx[n]=N++));
  const Zs=net.z.map(([a,b,Z])=>[id(a),id(b),Z]), Vs=net.v.map(([a,b,V])=>[id(a),id(b),V]);
  const M=Vs.length, n=N+M; if(!n) return {V:()=>C(0),I:[]};
  const A=Array.from({length:n},()=>Array.from({length:n},()=>[0,0])), y=Array.from({length:n},()=>[0,0]);
  const add=(i,j,v)=>{ if(i>=0&&j>=0){ A[i][j][0]+=v[0]; A[i][j][1]+=v[1]; } };
  for(const [a,b,Z] of Zs){ const g=cdiv(C(1),cabs(Z)<1e-12?C(1e-12):Z); add(a,a,g); add(b,b,g); add(a,b,[-g[0],-g[1]]); add(b,a,[-g[0],-g[1]]); }
  Vs.forEach(([a,b,V],k)=>{ const r=N+k; if(a>=0){ A[r][a][0]+=1; A[a][r][0]+=1; } if(b>=0){ A[r][b][0]-=1; A[b][r][0]-=1; } y[r]=cadd(y[r],V); });
  for(let i=0;i<N;i++) A[i][i][0]+=1e-11;                /* a whisker of leakage keeps floating parts defined */
  for(let c=0;c<n;c++){
    let p=c, best=cabs(A[c][c]); for(let r=c+1;r<n;r++){ const v=cabs(A[r][c]); if(v>best){ best=v; p=r; } }
    if(best<1e-20) continue;
    if(p!==c){ [A[c],A[p]]=[A[p],A[c]]; [y[c],y[p]]=[y[p],y[c]]; }
    const inv=cdiv(C(1),A[c][c]);
    for(let r=c+1;r<n;r++){ const f=cmul(A[r][c],inv); if(!f[0]&&!f[1]) continue;
      for(let k=c;k<n;k++) A[r][k]=csub(A[r][k],cmul(f,A[c][k])); y[r]=csub(y[r],cmul(f,y[c])); }
  }
  const x=Array.from({length:n},()=>[0,0]);
  for(let r=n-1;r>=0;r--){ if(cabs(A[r][r])<1e-20) continue; let acc=y[r]; for(let k=r+1;k<n;k++) acc=csub(acc,cmul(A[r][k],x[k])); x[r]=cdiv(acc,A[r][r]); }
  return {V:nm=>nm in idx?x[idx[nm]]:C(0), I:Vs.map((_,k)=>x[N+k])};
}

/* heights */

const childOf=s=>ITEMS.find(k=>ST.it[k].on&&ST.it[k].sup===s);
function rect(k,x,y){ const [w,dd]=DIM[k]; return [x-w/2,y-dd/2,x+w/2,y+dd/2]; }

const overl=(a,b,m)=>a[0]<b[2]+m&&a[2]>b[0]-m&&a[1]<b[3]+m&&a[3]>b[1]-m;

  for(const o of ITEMS){ if(o===k||!ST.it[o].on||ST.it[o].sup) continue;
    if(overl(r,rect(o,ST.it[o].x,ST.it[o].y),RINGS.includes(k)&&RINGS.includes(o)?2:6)) return false; }

}
/* how low the coil may come: the highest thing under it */
function coilStop(){
  if(!ST.it.stand.on) return H_MIN;
  const [ax,ay]=axis(); let top=12;
  for(const k of ITEMS){ if(k==="stand"||!ST.it[k].on) continue; if(!under(k,ax,ay)) continue; top=Math.max(top,topOf(k)); }
  return Math.max(H_MIN, top-12);

function under(k,ax,ay){

  if(k==="scale"){ const [px,py]=panC(); return Math.abs(px-ax)<PAN.w/2+COIL.r&&Math.abs(py-ay)<PAN.d/2+COIL.r; }
  const r=rect(k,it.x,it.y); return ax>r[0]-COIL.r&&ax<r[2]+COIL.r&&ay>r[1]-COIL.r&&ay<r[3]+COIL.r;

/* the ring under the coil, and its gap to the pole (m) */
function ringGap(k){
  const it=ST.it[k]; if(!it.on||!ST.it.stand.on) return null;
  const [ax,ay]=axis(); if(Math.hypot(it.x-ax,it.y-ay)>3) return null;
  return Math.max(0,(coilBot()-topOf(k))*1e-3);

/* ── sockets and plug ends ── */
function sockets(){
  const S=[]; const p=ST.it.psu;
  if(p.on){ const z=125;
    S.push({id:"P07a",w:[p.x-42,p.y-40,z],big:true,col:"#b8241f"},{id:"P07b",w:[p.x-42,p.y-4,z],big:true,col:"#b8241f"},
           {id:"P24a",w:[p.x+42,p.y-44,z],big:false,col:"#16181b"},{id:"P24b",w:[p.x+42,p.y-14,z],big:false,col:"#16181b"}); }
  for(const m of ["mA","mB"]){ const it=ST.it[m]; if(!it.on) continue;
    ["A","m","C","V"].forEach((j,i)=>S.push({id:m+"_"+j,w:[it.x-33+22*i,it.y+70,38],big:false,col:"#0e0f11",meter:m})); }
  return S;
}
const sockAt=id=>sockets().find(s=>s.id===id);
const occupied=id=>WKEYS.some(w=>ST.wire[w].ends.some(e=>e&&e.sock===id))||ST.lead.some(l=>l.sock===id);
function clipW(k,s){                     /* the crocodile on ring k at arc length s (m) */
  const R=RING[k], it=ST.it[k], dl=R.gap/(2*R.rm), th=-Math.PI/2+dl+s/R.rm, r=R.rm*1e3;

}
function arcAt(k,x,y){                   /* nearest point of ring k to the desk point x,y, or null */
  const R=RING[k], it=ST.it[k], dx=x-it.x, dy=y-it.y, rr=Math.hypot(dx,dy);
  if(Math.abs(rr-R.rm*1e3)>R.w*500+6) return null;

}
function endW(e){

  if(e.ring){ return ST.it[e.ring].on?clipW(e.ring,e.s):null; }
  if(e.desk) return [e.desk[0],e.desk[1],0];

}
function leadAnchor(){ const [ax,ay]=axis(); return [ax+30,ay+10,coilBot()+COIL.h+4]; }
function leadW(i){ const l=ST.lead[i]; if(l.sock){ const s=sockAt(l.sock); if(s) return s.w; l.sock=null; l.desk=null; }
  if(l.desk) return [l.desk[0],l.desk[1],0];

const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);

/* ══════════════════════════════════════════════════════════════
   3.  THE CIRCUIT AND THE INSTRUMENTS
   ══════════════════════════════════════════════════════════════ */
const nodeOf=(w,i)=>{ const e=ST.wire[w].ends[i]; if(!e) return w+"_f"+i; if(e.sock) return sockAt(e.sock)?e.sock:w+"_f"+i; if(e.ring) return w+"_c"+i; return w+"_f"+i; };
function drift(){ return 1+0.030*(1-Math.exp(-ST.loadT/18)); }
let SOLN=null, GAIN=C(0), FORCE={};
function buildNet(emf){
  const net={z:[],v:[]}, Z=(a,b,r)=>net.z.push([a,b,typeof r==="number"?C(r):r]);
  if(ST.it.psu.on&&ST.power){
    net.v.push(["P07i","P07b",C(BENCH.v07*drift())]); Z("P07a","P07i",BENCH.r07);
    net.v.push(["P24i","P24b",C(BENCH.v24)]); Z("P24a","P24i",BENCH.r24);
  }
  for(const m of ["mA","mB"]){ if(!ST.it[m].on) continue; const M=ST.meter[m];
    Z(m+"_A",m+"_C",BENCH.rShunt); if(M.fuse) Z(m+"_m",m+"_C",BENCH.rmA); Z(m+"_V",m+"_C",1e7);
    if(M.on&&DIALS[M.dial][1]==="R"){ net.v.push([m+"_Oi",m+"_C",C(0.3)]); Z(m+"_V",m+"_Oi",300); } }
  if(ST.it.stand.on){ const n0=ST.lead[0].sock&&sockAt(ST.lead[0].sock)?ST.lead[0].sock:"L0", n1=ST.lead[1].sock&&sockAt(ST.lead[1].sock)?ST.lead[1].sock:"L1";
    Z(n0,n1,C(...BENCH.zSol)); }
  const onRing={};
  for(const w of WKEYS){ const W=ST.wire[w]; if(!W.on) continue;
    const a=nodeOf(w,0), b=nodeOf(w,1), r=WIRES[w].r==="short"?BENCH.rShort:BENCH.rLong;
    let pick=null;
    W.ends.forEach((e,i)=>{ if(e&&e.ring&&ST.it[e.ring].on){ (onRing[e.ring]=onRing[e.ring]||[]).push({node:w+"_c"+i,s:e.s,rc:e.rc});
      if(emf&&emf[e.ring]&&!ST.braid) pick={ring:e.ring,s:e.s}; } });
    if(pick){ Z(a,w+"_mid",r); net.v.push([w+"_mid",b,[0,0]]); net.v[net.v.length-1].pick=pick; }
    else Z(a,b,r);
  }
  /* untwisted leads: the loop between two crocodiles on the same ring takes a share of its flux */
  const pv=net.v.filter(v=>v.pick);
  for(const v of pv){ const k=v.pick.ring, others=pv.filter(o=>o.pick.ring===k);
    if(others.length<2){ v[2]=C(0); continue; }
    const sMin=Math.min(...others.map(o=>o.pick.s)), sgn=v.pick.s===sMin?1:-1;
    v[2]=cmul(emf[k],C(0.5*sgn*BENCH.pick)); }
  for(const k in onRing){ const R=RING[k], clips=onRing[k].sort((p,q)=>p.s-q.s), pts=[0,...clips.map(c=>c.s),R.len];
    const e=emf&&emf[k]?emf[k]:null;
    for(let i=0;i<pts.length-1;i++){ const seg=Math.max(pts[i+1]-pts[i],1e-9), Rs=ringRho(k)*seg/R.A, a=k+"_n"+i, b=k+"_n"+(i+1);
      if(e){ Z(a,k+"_s"+i,Rs); net.v.push([k+"_s"+i,b,cmul(e,C(seg/R.len))]); } else Z(a,b,Rs); }
    if(R.gap<=0){ const a=k+"_n"+(pts.length-1), b=k+"_n0"; Z(a,b,C(ringRho(k)*1e-4/R.A,OMEGA*L_CL)); }
    clips.forEach((c,i)=>Z(c.node,k+"_n"+(i+1),c.rc*1));
  }
  return net;
}
function solveAll(){
  let net=buildNet(null), sol=solveNet(net);
  GAIN=C(0);
  if(ST.it.stand.on){ const n0=ST.lead[0].sock&&sockAt(ST.lead[0].sock)?ST.lead[0].sock:"L0", n1=ST.lead[1].sock&&sockAt(ST.lead[1].sock)?ST.lead[1].sock:"L1";
    const I=cdiv(csub(sol.V(n0),sol.V(n1)),C(...BENCH.zSol)); GAIN=cdiv(I,C(I_NOM)); }
  const g2=GAIN[0]**2+GAIN[1]**2, emf={};
  FORCE={};
  for(const k of RINGS){ const z=ringGap(k); if(z===null||g2<1e-12) continue;
    const e=emfRms(z,RING[k].rm); emf[k]=cmul(GAIN,C(0,-e));
    FORCE[k]=k==="closed"?g2*forceClosed(z):0; }
  if(Object.keys(emf).length){ net=buildNet(emf); sol=solveNet(net); }
  SOLN={sol,emf,g2}; return SOLN;
}
/* what each meter shows: the 3½-digit display string */
function meterRaw(m){
  const M=ST.meter[m], it=ST.it[m]; if(!it.on||!M.on) return null;
  const v=SOLN.sol.V, dial=DIALS[M.dial], f=drift;
  const vd=cabs(csub(v(m+"_V"),v(m+"_C")));
  switch(dial[1]){
    case "Vdc": return {kind:"Vdc",val:0.05*gauss()};
    case "V": return {kind:"V",val:vd*(1+0.002*gauss())+(dial[2]===0.2?(BENCH.emfBias+0.03*gauss())*1e-3:0),rng:dial[2]};
    case "A20": return {kind:"A",val:cabs(csub(v(m+"_A"),v(m+"_C")))/BENCH.rShunt+0.004*gauss(),rng:20};
    case "mA": return {kind:"A",val:M.fuse?cabs(csub(v(m+"_m"),v(m+"_C")))/BENCH.rmA:0,rng:dial[2]};
    case "R": { const I=cabs(csub(v(m+"_Oi"),v(m+"_V")))/300; return {kind:"R",val:I>1e-9?vd/I:1e9,rng:200}; }
  }
  return null;
}
function fmtMeter(r){
  if(!r) return "";
  if(r.kind==="Vdc"){ const mv=r.val; return (mv<0?"-":"")+Math.abs(mv).toFixed(1).padStart(4,"0"); }
  if(r.kind==="V"){ const rng=r.rng;
    if(rng===0.2){ const mv=Math.abs(r.val*1e3); return mv>199.9?"1   .":mv.toFixed(1).padStart(4,"0"); }
    const dec=rng===2?3:rng===20?2:1; return Math.abs(r.val)>rng*0.9995?"1   .":Math.abs(r.val).toFixed(dec); }
  if(r.kind==="A"){ const v=Math.abs(r.val), rng=r.rng;
    if(rng===20) return v>19.99?"1   .":v.toFixed(2);
    const ma=v*1e3; if(ma>rng*1e3*0.9995) return "1   ."; return ma.toFixed(rng===0.2?1:2); }
  if(r.kind==="R") return r.val>199.9?"1   .":r.val.toFixed(1);

/* what lies on the scale pan, in grams-force */
function loadG(k){
  let g=0; const it=ST.it[k];
  if(k==="block") g+=BENCH.mBlock*1e3;
  if(RINGS.includes(k)){ g+=RING[k].mass*1e3; if(FORCE[k]) g+=FORCE[k]/G*1e3;
    else if(SOLN&&SOLN.emf[k]&&k!=="closed") g+=0.008*gauss(); }
  const c=childOf(k); if(c) g+=loadG(c);
  return g;
}
function scaleRaw(){
  const s=ST.it.scale; if(!s.on) return 0;
  let g=BENCH.zeroDrift; const c=childOf("scale"); if(c) g+=loadG(c);
  /* the steel parts of the scale feel the field when the coil comes close to the pan */
  if(SOLN&&ST.it.stand.on&&s.sup==="stand"){ const dpan=coilBot()-topOf("scale"); g-=0.22*SOLN.g2*Math.exp(-Math.max(0,dpan)/14); }
  return g;
}

const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,'Courier New',monospace";
function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }

function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }

function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
/* a box in the bench projection: top face and front face (the view has no side faces) */
function box3(x0,y0,z0,x1,y1,z1,top,front,edge){
  const a=P(x0,y0,z1), b=P(x1,y1,z1), f=P(x0,y1,z0);

  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=0.8; ctx.strokeRect(a[0]+0.4,a[1]+0.4,b[0]-a[0]-0.8,f[1]-a[1]-0.8);

}
/* a vertical cylinder */
function cyl3(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}

/* a flat ring: the band, then the top face, with its gap */
function ringPath(k,cx,cy,z){
  const R=RING[k], ro=R.dOut*500, ri=R.dIn*500, dl=R.gap/(2*R.rm), a0=-Math.PI/2+dl, a1=-Math.PI/2+2*Math.PI-dl, c=P(cx,cy,z);
  ctx.beginPath(); ctx.ellipse(c[0],c[1],ro*SC,ro*SC*KY,0,a0,a1); ctx.ellipse(c[0],c[1],ri*SC,ri*SC*KY,0,a1,a0,true); ctx.closePath();
}
function drawRing(k){
  const it=ST.it[k], z=zOf(k), h=RING[k].h*1e3, hot=Math.min(1,RING.closed.T/25);
  const top=k==="closed"&&hot>0.05?shade("#c5cacf",-0.0):"#c5cacf";

function plugTop(e,w){ return e.sock?[w[0],w[1],w[2]+20]:e.ring?[w[0],w[1],w[2]+3]:[w[0],w[1],4]; }
function drawCable(a,b,col,len){
  const pa=P(...a), pb=P(...b), dd=Math.hypot(a[0]-b[0],a[1]-b[1]), slack=Math.max(0,len-dd-a[2]-b[2]);

    if(s==="stand"){ const r=rect("stand",it.x,it.y); ok=hitR(r,x,y,0)&&y>r[1]+BOARD.d; }
    else if(s==="scale"){ const [px,py]=panC(); ok=Math.abs(x-px)<PAN.w/2+8&&Math.abs(y-py)<PAN.d/2+8; }
    else ok=hitR(rect("block",it.x,it.y),x,y,10);
    if(!ok) continue;
    const [sx,sy]=snapOn(s,k);
    if(ST.it.stand.on){ const [ax,ay]=axis(), save={...ST.it[k]};
      Object.assign(ST.it[k],{on:true,x:sx,y:sy,sup:s}); const hit=under(k,ax,ay)&&topOf(k)>coilBot()+0.01; Object.assign(ST.it[k],save);
      if(hit) return {err:"hitsSol"}; }
    return {sup:s,x:sx,y:sy,z};
  }
  const [x,y]=unP(m[0],m[1],0);
  if(!deskFree(k,x,y)) return null;
  if(ST.it.stand.on&&k!=="stand"){ const r=rect("stand",ST.it.stand.x,ST.it.stand.y); if(overl(rect(k,x,y),r,4)) return null; }
  return {sup:null,x,y,z:0};
}
function itemRect(k){ const it=ST.it[k], [w,dd,h]=DIM[k], z=zOf(k), top=k==="stand"?12+BOARD.h:k==="scale"?z+22:z+h;
  const a=P(it.x-w/2,it.y-dd/2,top), b=P(it.x+w/2,it.y+dd/2,z); return [a[0],a[1],b[0],b[1]]; }
function itemAt(p){
  const order=[]; const push=k=>{ order.push(k); const c=childOf(k); if(c) push(c); };
  ITEMS.filter(k=>ST.it[k].on&&!ST.it[k].sup).sort((a,b)=>(ST.it[a].y+DIM[a][1]/2)-(ST.it[b].y+DIM[b][1]/2)).forEach(push);
  for(let i=order.length-1;i>=0;i--){ const k=order[i], r=itemRect(k);
    if(RINGS.includes(k)){ const [x,y]=unP(p[0],p[1],topOf(k)); const it=ST.it[k]; if(Math.hypot(x-it.x,y-it.y)<=RING[k].dOut*500+3) return k; continue; }
    if(p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3]) return k; }
  return null;
}
function psuBtnScr(){ const it=ST.it.psu; return scr([it.x-75+PSU_BTN[0],it.y-75+PSU_BTN[1],125]); }
function knobScr(){ const [ax,ay]=axis(); return scr([ax,ay,12+BOARD.h-12]); }
/* plugs and crocodiles that can be picked off */
function endsNear(p){
  for(const w of WKEYS){ const W=ST.wire[w]; if(!W.on) continue;
    for(let i=0;i<2;i++){ const e=W.ends[i]; if(!e) continue; const wp=endW(e); if(!wp) continue;
      const q=scr(e.sock?[wp[0],wp[1],wp[2]+12]:wp); if(nearS(p,q,e.sock?11:9)) return {wire:w,end:i}; } }
  if(ST.it.stand.on) for(let i=0;i<2;i++){ const wp=leadW(i), q=scr(ST.lead[i].sock?[wp[0],wp[1],wp[2]+12]:wp); if(nearS(p,q,11)) return {lead:i}; }
  return null;
}
function dropEndsOf(k){
  /* plugs in an item's sockets, and crocodiles on a ring, fall to the desk */
  for(const w of WKEYS) ST.wire[w].ends.forEach((e,i)=>{ if(!e) return; const s=e.sock?sockAt(e.sock):null;
    if((e.sock&&(!s||(s.meter===k)||(k==="psu"&&e.sock[0]==="P")))||(e.ring===k)){ const wp=endW(e)||[ST.it[k].x,ST.it[k].y,0]; ST.wire[w].ends[i]={desk:[wp[0],wp[1]+DIM[k][1]/2+14]}; } });
  for(const l of ST.lead) if(l.sock&&k==="psu"&&l.sock[0]==="P"){ const s=sockAt(l.sock); l.sock=null; l.desk=s?[s.w[0],s.w[1]+90]:null; }
}
function returnItem(k){
  if(childOf(k)){ say("topFirst"); return false; }
  dropEndsOf(k);
  if(k==="stand") ST.lead.forEach(l=>{ l.sock=null; l.desk=null; });
  if(k==="mA"||k==="mB"){ ST.meter[k].fuse=true; ST.meter[k].on=false; }
  if(k==="scale"){ ST.scale.on=false; }
  ST.it[k].on=false; ST.it[k].sup=null; say("back",itemName(k)); return true;
}
function returnWire(w){ ST.wire[w]={on:false,ends:[null,null]}; say("wireBack",itemName(w)); }
function returnHand(){
  if(!hand) return;
  if(hand.item){ if(hand.move){ Object.assign(ST.it[hand.item],hand.orig,{on:true}); say("stays"); } }
  else if(hand.wire){ const W=ST.wire[hand.wire]; if(hand.fresh) returnWire(hand.wire);
    else { const q=unP(mouse[0],mouse[1],0), other=endW(W.ends[1-hand.end]);
      if(hitR([DESK.x0,DESK.y0,DESK.x1,DESK.y1],q[0],q[1],0)&&(!other||dist3(other,[q[0],q[1],0])<=WIRES[hand.wire].len)){ W.ends[hand.end]={desk:q}; say("dropped"); }
      else returnWire(hand.wire); } }
  else if(hand.lead!==undefined){ const q=unP(mouse[0],mouse[1],0); ST.lead[hand.lead].desk=dist3(leadAnchor(),[q[0],q[1],0])<=LEAD_LEN?q:null; ST.lead[hand.lead].sock=null; say("dropped"); }
  hand=null;
}
function checkReach(){
  for(const w of WKEYS){ const W=ST.wire[w]; if(!W.on||!W.ends[0]||!W.ends[1]) continue;
    const a=endW(W.ends[0]), b=endW(W.ends[1]); if(a&&b&&dist3(a,b)>WIRES[w].len){ W.ends[1]={desk:[a[0]+40,a[1]+40]}; } }
  if(ST.it.stand.on) for(let i=0;i<2;i++) if(dist3(leadAnchor(),leadW(i))>LEAD_LEN){ ST.lead[i].sock=null; ST.lead[i].desk=null; }
}
function placeEnd(p){
  const t=d(), isLead=hand.lead!==undefined, kind=isLead?"ban":WIRES[hand.wire].ends[hand.end];
  const other=isLead?leadAnchor():endW(ST.wire[hand.wire].ends[1-hand.end]), len=isLead?LEAD_LEN:WIRES[hand.wire].len;
  const finish=(at,key,arg)=>{
    const pos=at.sock?sockAt(at.sock).w:at.ring?clipW(at.ring,at.s):[at.desk[0],at.desk[1],0];
    if(other&&dist3(other,pos)>len){ say("reach"); return; }
    if(isLead){ ST.lead[hand.lead]=at; hand=null; say(key,arg); return; }
    const W=ST.wire[hand.wire]; W.on=true; W.ends[hand.end]=at; say(key,arg);
    if(!W.ends[1-hand.end]) hand={wire:hand.wire,end:1-hand.end}; else hand=null; };
  for(const s of sockets()){ if(!nearS(p,scr(s.w),s.big?11:9)) continue;
    if(kind!=="ban"){ say("wrong"); return; } if(occupied(s.id)){ say("full"); return; }
    finish({sock:s.id},"plugged",s.meter?itemName(s.meter):itemName("psu")); return; }
  const order=RINGS.filter(k=>ST.it[k].on).sort((a,b)=>topOf(b)-topOf(a));
  for(const k of order){ const [x,y]=unP(p[0],p[1],topOf(k)), s=arcAt(k,x,y); if(s===null) continue;
    if(kind!=="croc"){ say("wrong"); return; }
    finish({ring:k,s,rc:BENCH.rClip*U(0.6,1.6)},"clipped",itemName(k)); return; }
  const [x,y]=unP(p[0],p[1],0);
  if(x>DESK.x0&&x<DESK.x1&&y>DESK.y0&&y<DESK.y1) finish({desk:[x,y]},"dropped");
}
function benchClick(p,right){
  if(hand){
    if(right){ returnHand(); return; }
    if(hand.item){ const k=hand.item, tg=target(k,p);
      if(!tg){ say("noFit"); return; } if(tg.err){ say(tg.err); return; }
      Object.assign(ST.it[k],{on:true,x:tg.x,y:tg.y,sup:tg.sup});
      say(tg.sup?"placedOn":"placed",itemName(k),tg.sup?itemName(tg.sup):""); hand=null; checkReach(); return; }
    placeEnd(p); return;
  }
  const en=endsNear(p);
  if(right){
    if(en){ if(en.lead!==undefined){ const l=ST.lead[en.lead]; if(l.sock){ const s=sockAt(l.sock); l.sock=null; l.desk=s?[s.w[0],s.w[1]+60]:null; say("unplug"); } return; }
      const e=ST.wire[en.wire].ends[en.end]; if(e.desk){ returnWire(en.wire); return; }
      const wp=endW(e); ST.wire[en.wire].ends[en.end]={desk:[wp[0],wp[1]+30]}; say("unplug"); return; }
    const k=itemAt(p); if(k) returnItem(k); return;
  }
  if(ST.it.psu.on&&nearS(p,psuBtnScr(),9)){ holdPower(true,"mouse"); return; }
  if(en){ if(en.lead!==undefined){ hand={lead:en.lead}; ST.lead[en.lead].sock=null; say("end",d().end.lead); return; }
    const e=ST.wire[en.wire].ends[en.end]; ST.wire[en.wire].ends[en.end]=null; hand={wire:en.wire,end:en.end}; say("end",d().end[WIRES[en.wire].ends[en.end]]); return; }
  const k=itemAt(p);
  if(k){ if(childOf(k)){ say("topFirst"); return; }
    hand={item:k,move:true,orig:{x:ST.it[k].x,y:ST.it[k].y,sup:ST.it[k].sup}}; dropEndsOf(k); ST.it[k].on=false; say("moveIt",itemName(k)); }
}
function turnScrew(turns){
  if(!ST.it.stand.on) return;
  let h=ST.h+turns*1.41; const lo=coilStop();
  if(h<lo){ h=lo; if(ST.h<=lo+1e-6) say("bottom"); } else if(h>H_MAX){ h=H_MAX; say("top"); } else say("turn",turns);
  ST.h=h; checkReach();
}
let powerBy=null;
function holdPower(on,by){ if(on){ if(!ST.it.psu.on) return; ST.power=true; powerBy=by; } else if(!by||by===powerBy){ ST.power=false; powerBy=null; } }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
cv.addEventListener("wheel",e=>{ if(!ST.it.stand.on) return; const p=lpos(e), r=itemRect("stand");
  if(!(p[0]>=r[0]-30&&p[0]<=r[2]+30&&p[1]>=r[1]-30&&p[1]<=r[3])) return;
  e.preventDefault(); turnScrew((e.deltaY<0?1:-1)*(e.shiftKey?1/32:1/8)); },{passive:false});
window.addEventListener("pointerup",()=>{ holdPower(false,"mouse"); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.code==="Space"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); if(!e.repeat) holdPower(true,"key"); }
  if(e.key==="Escape"&&hand){ returnHand(); drawTray(); } });
window.addEventListener("keyup",e=>{ if(e.code==="Space") holdPower(false,"key"); });
window.addEventListener("blur",()=>holdPower(false));
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&(hand.item===k||hand.wire===k)&&!hand.move; if(hand) returnHand();
    if(!same&&trayAvail(k)){ if(WIRES[k]){ hand={wire:k,end:0,fresh:true}; ST.wire[k].on=true; say("end",d().end.ban); } else { hand={item:k}; say("picked",itemName(k)); } }
    drawTray(); return; } });
/* the close up */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function meterHit(m,p){ const c=CL[m]; if(!c||!ST.it[m].on) return null; const u=(p[0]-c.x)/c.s, v=(p[1]-c.y)/c.s;
  if(Math.hypot(u-45.5,v-112)<26) return {dial:u<45.5?-1:1};
  const pw=m==="mA"?[76,64]:[16,64]; if(Math.hypot(u-pw[0],v-pw[1])<7) return {power:true};
  return null; }
function setDial(m,step){ const M=ST.meter[m]; M.dial=(M.dial+step+DIALS.length)%DIALS.length; M.dt=0; say("dial",itemName(m).split(" (")[0],DIALS[M.dial][0]); }
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{
  const p=clpos(e);
  if(tab==="meters"){
    for(const m of ["mA","mB"]){ const h=meterHit(m,p); if(!h) continue;
      if(h.power){ const M=ST.meter[m]; M.on=!M.on; M.dt=0; say("mpow",itemName(m).split(" (")[0],M.on); return; }
      setDial(m,e.button===2?-1:1); return; }
    const sc=CL.scale; if(sc&&ST.it.scale.on){ const u=(p[0]-sc.x)/sc.s, v=(p[1]-sc.y)/sc.s;
      for(const k in SCALE_BTN){ const [x,y,w,h]=SCALE_BTN[k]; if(u>=x&&u<=x+w&&v>=y&&v<=y+h){ scaleBtn(k); return; } } }
    const ps=CL.psu; if(ps&&ST.it.psu.on){ const u=(p[0]-ps.x)/ps.s, v=(p[1]-ps.y)/ps.s; if(Math.hypot(u-PSU_BTN[0],v-PSU_BTN[1])<PSU_BTN[2]){ holdPower(true,"mouse"); return; } }
  } else if(tab==="side"&&CL.knob){ const [kx,ky,kr]=CL.knob; if(Math.hypot(p[0]-kx,p[1]-ky)<kr) sideDrag={a:Math.atan2(p[1]-ky,p[0]-kx)}; }
  else if(tab==="ring"){
    for(const [k,x,y,w,h] of CL.btn||[]) if(p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h){ RV.k=k; RV.px=0; RV.py=0; return; }
    for(const [w,i,x,y] of CL.clips||[]) if(Math.hypot(p[0]-x,p[1]-y)<12){ rvDrag={clip:[w,i]}; return; }
    rvDrag={pan:[p[0]-RV.px,p[1]-RV.py]};
  }
});
closeCv.addEventListener("pointermove",e=>{ const p=clpos(e);
  if(sideDrag&&CL.knob){ const [kx,ky]=CL.knob, a=Math.atan2(p[1]-ky,p[0]-kx); let da=a-sideDrag.a; if(da>Math.PI) da-=2*Math.PI; if(da<-Math.PI) da+=2*Math.PI;
    sideDrag.a=a; turnScrew(da/(2*Math.PI)); return; }
  if(rvDrag&&rvDrag.pan){ RV.px=p[0]-rvDrag.pan[0]; RV.py=p[1]-rvDrag.pan[1]; return; }
  if(rvDrag&&rvDrag.clip&&RV.k){ const z=RV.zoom, cx=CLW/2+RV.px, cy=CLH/2+16+RV.py, R=RING[RV.k], dl=R.gap/(2*R.rm);
    let th=Math.atan2(p[1]-cy,p[0]-cx)+Math.PI/2-dl; th=((th%(2*Math.PI))+2*Math.PI)%(2*Math.PI); const s=th*R.rm;
    if(s>0.0015&&s<R.len-0.0015){ const [w,i]=rvDrag.clip, e=ST.wire[w].ends[i]; e.s=s; } }
});
window.addEventListener("pointerup",()=>{ sideDrag=null; rvDrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e);
  if(tab==="meters"){ for(const m of ["mA","mB"]){ const h=meterHit(m,p); if(h&&h.dial){ e.preventDefault(); setDial(m,e.deltaY<0?-1:1); return; } } }
  if(tab==="side"){ e.preventDefault(); turnScrew((e.deltaY<0?1:-1)*(e.shiftKey?1/32:1/8)); }
  if(tab==="ring"){ e.preventDefault(); const z0=RV.zoom; RV.zoom=Math.max(2,Math.min(16,RV.zoom*(e.deltaY<0?1.15:1/1.15)));
    const cx=CLW/2+RV.px, cy=CLH/2+16+RV.py; RV.px+=(p[0]-cx)*(1-RV.zoom/z0); RV.py+=(p[1]-cy)*(1-RV.zoom/z0); } },{passive:false});
function scaleBtn(k){ const s=ST.scale;
  if(k==="power"){ s.on=!s.on; if(s.on){ s.boot=1.4; s.disp="88888"; } say(s.on?"scaleOn":"scaleOff"); }
  if(k==="tare"&&s.on&&s.boot<=0){ s.tare=scaleRaw(); s.dt=0; say("tare"); } }

/* ══════════════════════════════════════════════════════════════
   9.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const rb=$("redBtn");
rb.addEventListener("pointerdown",e=>{ e.preventDefault(); holdPower(true,"mouse"); });
$("braid").onchange=e=>{ ST.braid=e.target.checked; say("braid",ST.braid); };
$("noteBtn").onclick=()=>{ const a=ST.it.mA.on&&ST.meter.mA.on?ST.meter.mA.disp||"—":"—", b=ST.it.mB.on&&ST.meter.mB.on?ST.meter.mB.disp||"—":"—",
  s=ST.it.scale.on&&ST.scale.on&&ST.scale.boot<=0?ST.scale.disp:"—";
  ST.notes.push(d().noteRow(a.replace("1   .","1"),b.replace("1   .","1"),s,ST.power)); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]);
  if(RING.closed.T>4) L.push([t.st.hot,true]);
  if(hand){ const n=hand.item?itemName(hand.item):hand.wire?itemName(hand.wire)+" · "+t.end[WIRES[hand.wire].ends[hand.end]]:t.end.lead; L.push([t.st.hand(n),false]); }
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-psu").textContent=t.hPsu; rb.textContent=t.red; $("t-psuhint").textContent=t.psuHint;
  $("t-h-leads").textContent=t.hLeads; $("t-braid").textContent=t.braid; $("t-leadhint").textContent=t.leadHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2011 E1 — 진동 자기장 속 도체의 부양 · HaslaLab":"APhO 2011 E1 — Levitation of Conductors in an Oscillating Magnetic Field · HaslaLab";
  renderTabs(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

let tPrev=performance.now()/1000, frameN=0, solveT=0;
function physStep(dt){
  if(!SOLN) return;
  /* contacts bed in while the 0.7 V circuit carries current: current and voltage creep up together */
  const i07=ST.power&&ST.it.psu.on?cabs(csub(SOLN.sol.V("P07a"),SOLN.sol.V("P07i")))/BENCH.r07:0;
  ST.loadT=i07>1?ST.loadT+dt:Math.max(0,ST.loadT-dt*0.5);
  /* the closed ring warms while its induced current flows */
  const R=RING.closed; let P=0;
  if(SOLN.emf.closed){ const Rr=ringR("closed"), I=cabs(SOLN.emf.closed)/Math.hypot(Rr,OMEGA*L_CL); P=I*I*Rr; }
  R.T+=(P/(R.mass*C_AL)-R.T/240)*dt;
}
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  solveT-=dt; if(solveT<=0){ solveAll(); solveT=0.12; }
  physStep(dt);
  for(const m of ["mA","mB"]){ const M=ST.meter[m]; M.dt-=dt;
    if(M.dt<=0){ M.disp=fmtMeter(meterRaw(m)); M.dt=0.4;
      if(M.fuse&&ST.it[m].on&&SOLN){ const im=cabs(csub(SOLN.sol.V(m+"_m"),SOLN.sol.V(m+"_C")))/BENCH.rmA; if(im>0.3){ M.fuse=false; } } } }
  const s=ST.scale; if(s.on){ if(s.boot>0){ s.boot-=dt; if(s.boot<=0){ s.tare=scaleRaw(); s.dt=0; } }
    else { s.dt-=dt; if(s.dt<=0){ const g=scaleRaw()-s.tare+0.006*gauss(); s.disp=Math.abs(g)>100?"o-Ld":(g<0?"-":"")+Math.abs(g).toFixed(2); s.dt=0.35; } } }
  rb.classList.toggle("on",ST.power);
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
