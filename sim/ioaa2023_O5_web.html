<title>IOAA 2023 플라네타륨 라운드 — 하늘 지식 · 화성의 역행 · TRAPPIST-1 · Planetarium Round · HaslaLab</title>
<meta name="description" content="제16회 국제 천문·천체물리 올림피아드(IOAA 2023, 폴란드 호주프) 플라네타륨 라운드를 시험 진행 그대로 풉니다. 적도의 하늘에서 유성우 복사점, 변광성의 밝기 상태, 경계로 표시된 별자리를 찾고, 1915–1916년 화성의 역행 루프를 날짜 눈금이 붙은 황도에서 재며, TRAPPIST-1f의 표면에서 520시간 동안 안쪽 행성들의 회합 주기와 최대 이각을 잽니다.">

<script>
"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* IOAA 2023 (Chorzów), planetarium round: three tasks of 10 minutes each, every projection shown once.
   O5 ‘Knowledge of the sky’: the sky from 0° N, 19° E, stopped for 2 minutes with a meteor shower, then turning once
   round in 8 minutes with eight variable stars in a given state and the IAU borders of eight constellations.
   O6 ‘Retrograde Mars’: Mars among the stars from its heliacal rising on 1 March 1915 for 548 days, through the
   aphelic opposition of February 1916 when it stood at its greatest ecliptic latitude — the real ephemeris (JPL
   approximate elements), which reproduces the official dates of quadrature and of the stationary points; the
   ecliptic carries the Sun's date marks and the current date is shown.  O7 ‘TRAPPIST-1’: 520 hours (1 s = 1 h)
   from the surface of TRAPPIST-1f, tidally locked on a circular orbit with no obliquity; planets b–h on the
   measured periods (Agol et al. 2021), sizes to scale, the star's disc and the transits true to size. */
const unit = (v) => { const n = Math.hypot(...v); return v.map((x) => x / n); };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const M3 = (R, v) => [R[0][0] * v[0] + R[0][1] * v[1] + R[0][2] * v[2], R[1][0] * v[0] + R[1][1] * v[1] + R[1][2] * v[2], R[2][0] * v[0] + R[2][1] * v[1] + R[2][2] * v[2]];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function seeded(s) { let x = (s % 2147483646) + 1; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
/* ---------------------------------------------------------------- the stars */

  about: {ko: "‘라운드 시작’은 시험장과 같이 준비 30분(건너뛸 수 있음) 뒤 세 과제를 10분씩 한 번만 상영하고, 끝나기 5·2·1분 전에 하늘에 경고를 띄웁니다. 그 뒤 처리 30분에 답안을 씁니다. 라운드 밖에서는 막대와 배속으로 자유롭게 다시 볼 수 있습니다. 과제 1은 북위 0°, 동경 19°의 하늘(별은 Hipparcos 6등급까지, 행성·달 없음)을 2분 멈춰 유성우를 보여 준 뒤 8분 동안 한 바퀴 돌리며, 변광성 여덟 개를 공식 해답의 밝기 상태로, 여덟 별자리의 IAU 경계(d3-celestial)를 붉은 점선으로 그립니다. 과제 2는 1915년 3월 1일(화성의 새벽 첫 보임)부터 548일 동안 화성의 실제 위치(JPL 근사 궤도 요소)를 별 사이에 보여 주며, 황도에 1916년 태양의 날짜 눈금을, 아래에 오늘 날짜를 띄웁니다. 이 천체력은 공식 해답의 구(11월 8일, 5월 15일)와 정류(1월 1일, 3월 21일) 날짜를 ±2일 안에서 되살립니다. 과제 3은 조석 고정된 TRAPPIST-1f의 적도에서 본 하늘을 1초에 1시간씩 520시간 보여 줍니다. 행성 b–h는 실제 주기(Agol 외 2021)와 크기로, 별의 원반(지름 1.65°)과 통과도 실제 크기로 그렸으며, 휠로 시야를 좁히면 위상과 통과가 보입니다. 각도는 ‘손 재기’(손가락 1°, 세 손가락 5°, 주먹 10°, 편 손 20°)로 잽니다.",
          en: "‘Start the round’ runs it as in the hall: 30 minutes of preparation (which you may skip), then the three tasks of 10 minutes, each projected once, with a warning on the sky 5, 2 and 1 minutes before the end, then 30 minutes of processing. Outside the round each projection can be replayed with the bar and the speed. Task 1 shows the sky from 0° N, 19° E (Hipparcos stars to 6th magnitude, no planets or Moon), stopped for 2 minutes with a meteor shower and then turning once round in 8 minutes, with the eight variable stars in the states of the official solution and the IAU borders of eight constellations (d3-celestial) in dashed red. Task 2 shows the true place of Mars among the stars (JPL approximate elements) for 548 days from 1 March 1915, its heliacal rising, with the Sun's 1916 date marks along the ecliptic and the current date below; this ephemeris reproduces the official dates of quadrature (8 Nov, 15 May) and of the stationary points (1 Jan, 21 Mar) within ±2 days. Task 3 shows 520 hours, one second per hour, from the equator of the tidally locked TRAPPIST-1f: planets b–h on their measured periods (Agol et al. 2021) and sizes, the star's disc (1.65° across) and the transits true to size; narrow the view with the wheel to see phases and transits. Angles are measured with the hand (finger 1°, three fingers 5°, fist 10°, spread hand 20°)."},

           en: "The projector will display the sky as seen from near the equator (0° N, 19° E). The rotation of the sky will be stopped for about 2 minutes for part (a), then it will start to rotate for parts (b) and (c). The objects for parts (b) and (c) will be displayed simultaneously. (Projection time 10 minutes)"},

    parts: [{id: "a", mk: "3", ko: "하늘에 유성우가 보입니다. 복사점의 별자리를 정하고 그 적경과 적위를 어림하세요.", en: "A meteor shower will be visible in the sky. Determine the constellation of the radiant and estimate its right ascension and declination coordinates."},
            {id: "b", mk: "8", ko: "하늘에 보이는 다음 변광성들이 밝기가 낮은 상태(‘DIM’)인지 높은 상태(‘BRIGHT’)인지 가려내세요. 별마다 성도책에 나온 평균 등급과 등급 범위가 주어져 있습니다.", en: "Identify which of the following variable stars visible in the sky are in low (write ‘DIM’) or high (write ‘BRIGHT’) brightness states. The mean magnitude as shown in the atlas and the magnitude range are given for each star.",
             table: [["Name", "atlas mag.", "mag. range"], ...VARS.map((v) => [v[0], v[3], v[4]])]},

    fields: [["con", {ko: "(a) 복사점의 별자리", en: "(a) Constellation"}], ["ra", {ko: "(a) 적경 (예: 22h30m)", en: "(a) Right ascension (e.g. 22h30m)"}], ["dec", {ko: "(a) 적위 (°)", en: "(a) Declination (°)"}],

    solNote: {ko: "공식 해답과 채점 기준입니다. 해답을 여는 동안 돔에 복사점, 변광성의 상태, 별자리 이름이 겹쳐 그려집니다.", en: "From the official solution and marking scheme. While the solution is open, the radiant, the variables' states and the constellation names are drawn on the dome."},
    key: [["(a)", (L, ANS) => "Aqr" + ok(ANS["O5.con"] ? /^\s*(aqr|aquarius|aquarii|물병)/i.test(ANS["O5.con"]) : null) + " · 22:30 ± 0.5h" + yours(ANS, "O5.ra", L) + ok(ANS["O5.ra"] ? Math.abs(hoursOf(ANS["O5.ra"]) - 22.5) <= 0.5 : null)
            + " · −15° ± 8°" + yours(ANS, "O5.dec", L) + ok(within(ANS, "O5.dec", -23, -7)) + (L === "ko" ? " (칸마다 1점). 유성의 자취를 거꾸로 이으면 δ Aqr(22h55m, −15.8°) 가까이에서 만납니다 — δ 물병자리 유성우입니다. 시뮬레이터의 복사점은 22h36m, −16°입니다." : " (1 point each). Traced back, the trails meet near δ Aqr (22h55m, −15.8°): the δ Aquariids. The simulator's radiant is 22h36m, −16°.")],
          ["(b)", (L, ANS) => VARS.map((v, i) => v[0] + " " + v[6] + (ANS["O5.v" + i] ? ok(ANS["O5.v" + i] === v[6]) : "")).join(" · ") + (L === "ko" ? " (하나에 1점). 투영된 등급: " : " (1 point each). Magnitudes projected: ") + VARS.map((v) => v[0].split(" ")[0] + " " + v[5].toFixed(1)).join(", ")],
          ["(c)", (L, ANS) => { const U = setOf(ANS["O5.bord"]), T = BORD.map((c) => c.toLowerCase()); if (!U.size) return "Cet, Cae, Pup, Crt, Mus, Ser (2), CrA, Equ" + (L === "ko" ? " — 9점" : " — 9 points");
            const pts = T.filter((c) => U.has(c)).reduce((s, c) => s + (c === "ser" ? 2 : 1), 0), bad = [...U].filter((c) => !T.includes(c));
            return "Cet, Cae, Pup, Crt, Mus, Ser (2), CrA, Equ — " + (L === "ko" ? "당신의 답: " + pts + " / 9점" + (bad.length ? ", 틀린 약호 " + bad.join(", ") : "") : "yours: " + pts + " / 9" + (bad.length ? ", wrong: " + bad.join(", ") : "")); }]],
    sol: []
  }, {
    id: "O6", marks: 20, name: {ko: "화성의 역행", en: "Retrograde Mars"},
    lead: {ko: "투영기는 화성의 한 철 보임(1.5년) 동안 배경 별에 대해 움직이는 화성을 보여 줍니다. 새벽에 처음 보이는 때(heliacal rising)부터 시작하며, 충에서 화성이 황위가 가장 큰 곳에 오도록 골랐습니다. 황도도 함께 보이며, 한 해 동안 태양의 위치(날짜 눈금)와 오늘 날짜가 표시됩니다. 태양은 늘 지평선 아래에 있습니다. 화성의 회합 주기 = 780일. (투영 10분)",
           en: "The projector will display Mars moving relative to the background stars over one season of visibility (1.5 years) starting from the heliacal rising, chosen so that Mars will be at maximum ecliptic latitude at opposition. The ecliptic will also be displayed, marked with the positions of the Sun during the year and the current date. The Sun will always be below the horizon. Synodic period of Mars = 780 days. (Projection time 10 minutes)"},
    maps: ["d6"],
    parts: [{id: "a", mk: "8", ko: "다음 값을 기록하세요. i. 구의 날짜(화성의 이각이 90°일 때) ii. 역행이 시작한 날짜와 끝난 날짜 iii. 충의 날짜 iv. 충에서의 황위 v. 화성이 만든 고리의 황경 방향 폭", en: "Record the following quantities: i. the dates of quadrature (when the elongation of Mars is 90°) ii. the date of the beginning of retrograde motion and the date of the end of retrograde motion iii. the date of opposition iv. the ecliptic latitude at opposition v. the width in ecliptic longitude of the loop made by the planet"},
            {id: "b", mk: "9", ko: "관측 결과로, 지구와 화성의 궤도가 원이라고 보고: 답안지의 태양중심 그림에 충과 구 때의 태양, 지구, 화성의 위치를 표시하고, 케플러 법칙을 쓰지 않고 기하학적으로 화성 궤도의 반지름을 au로 구하세요.", en: "Based on your observations and assuming the orbits of Earth and Mars are circular: mark the positions of the Sun, Earth and Mars at the moments of opposition and quadrature in the heliocentric system and determine the radius of the orbit of Mars in a.u. geometrically, without using Kepler's Laws."},
            {id: "c", mk: "3", ko: "황도에 대한 화성 궤도의 경사각을 구하세요.", en: "Derive the inclination of the orbit of Mars to the ecliptic."}],
    fields: [["q1", {ko: "i. 첫 구 (예: 1915-11-10)", en: "i. First quadrature (e.g. 1915-11-10)"}], ["q2", {ko: "i. 둘째 구", en: "i. Second quadrature"}], ["s1", {ko: "ii. 역행 시작", en: "ii. Retrograde begins"}], ["s2", {ko: "ii. 역행 끝", en: "ii. Retrograde ends"}],
             ["opp", {ko: "iii. 충", en: "iii. Opposition"}], ["beta", {ko: "iv. 충의 황위 (°)", en: "iv. Latitude at opposition (°)"}], ["width", {ko: "v. 고리의 폭 (°)", en: "v. Width of the loop (°)"}],
             ["r", {ko: "(b) 궤도 반지름 (au)", en: "(b) Orbital radius (au)"}], ["inc", {ko: "(c) 경사각 (°)", en: "(c) Inclination (°)"}]],
    solNote: {ko: "공식 해답과 채점 기준(충 2점, 나머지 1점, (b) 9점, (c) 3점)입니다. 날짜는 ±5일. HaslaLab이 상영한 천체력에서 다시 구한 값을 함께 적었습니다. 공식 해답의 충 ‘2월 20일’은 두 정류 날짜(1월 1일, 3월 21일)의 한가운데인 2월 10일과 맞지 않습니다 — 실제 충은 1916년 2월 10일이었습니다. 두 날짜 모두 ✓로 받고, (b)·(c)는 공식 값 또는 당신이 기록한 날짜에서 나오는 값과 맞으면 ✓입니다. 해답을 여는 동안 돔에 화성의 경로와 사건이 그려집니다.",
              en: "From the official solution and marking scheme (opposition 2 points, the others 1, (b) 9, (c) 3); dates ±5 days. HaslaLab's values recomputed from the projected ephemeris are given alongside. The official opposition ‘20 February’ does not sit midway between its own stationary dates (1 January, 21 March) as it must; the true opposition was 10 February 1916. Both are marked ✓, and (b) and (c) are ✓ when they match the official value or the one that follows from the dates you recorded. While the solution is open, Mars's path and the events are drawn on the dome."},
    key: [["(a) i", (L, ANS) => (L === "ko" ? "1915년 11월 8일, 1916년 5월 15일 (HaslaLab: " : "8 Nov 1915, 15 May 1916 (HaslaLab: ") + fmtD(EV6.q1, L) + ", " + fmtD(EV6.q2, L) + ")" + yours(ANS, "O6.q1", L) + ok(dOk(ANS, "O6.q1", OFF.q1, EV6.q1)) + yours(ANS, "O6.q2", L) + ok(dOk(ANS, "O6.q2", OFF.q2, EV6.q2))],
          ["(a) ii", (L, ANS) => (L === "ko" ? "역행 시작 1916년 1월 1일, 끝 3월 21일 (HaslaLab: " : "begins 1 Jan 1916, ends 21 Mar 1916 (HaslaLab: ") + fmtD(EV6.s1, L) + ", " + fmtD(EV6.s2, L) + ")" + yours(ANS, "O6.s1", L) + ok(dOk(ANS, "O6.s1", OFF.s1, EV6.s1)) + yours(ANS, "O6.s2", L) + ok(dOk(ANS, "O6.s2", OFF.s2, EV6.s2))],
          ["(a) iii", (L, ANS) => (L === "ko" ? "공식 1916년 2월 20일 · HaslaLab " : "official 20 Feb 1916 · HaslaLab ") + fmtD(EV6.opp, L) + yours(ANS, "O6.opp", L) + ok(dOk(ANS, "O6.opp", OFF.opp, EV6.opp))],
          ["(a) iv–v", (L, ANS) => (L === "ko" ? "황위 4.5° ± 1° (HaslaLab " : "latitude 4.5° ± 1° (HaslaLab ") + EV6.beta.toFixed(2) + "°)" + yours(ANS, "O6.beta", L) + ok(within(ANS, "O6.beta", 3.5, 5.5)) + (L === "ko" ? " · 폭 19° ± 2° (HaslaLab " : " · width 19° ± 2° (HaslaLab ") + EV6.width.toFixed(1) + "°)" + yours(ANS, "O6.width", L) + ok(within(ANS, "O6.width", 17, 21))
            + (L === "ko" ? ". 황도의 날짜 눈금은 하루에 약 1°이므로 경도 눈금으로도 씁니다. 구는 화성이 놓인 눈금의 날짜가 오늘보다 약 91일 앞서거나(서구) 뒤질 때(동구)입니다." : ". The date marks along the ecliptic are about 1° a day, so they double as a longitude scale; quadrature is when the mark under Mars is about 91 days before (western) or after (eastern) today's date.")],
          ["(b)", (L, ANS) => { const r = rFromDates(ANS), v = num(ANS["O6.r"]);
            return (L === "ko" ? "1.5 au. 충에서 태양–지구–화성이 한 줄이고, 구에서는 지구에서 직각입니다. 그 사이 Δt 동안 지구가 화성보다 360°·Δt/780만큼 더 돌므로, 태양에서 본 두 방향 사이의 각 θ = 360°·Δt/780이고 cos θ = 1/r. 공식 해답은 11월 8일–2월 20일(Δt = 104일, θ = 48°)에서 r = 1.5 au. 실제 충(2월 10일)으로는 Δt ≈ 92, 95일, θ ≈ 43°, r ≈ 1.37 au — 그때 화성은 원일점 근처(1.66 au)에 있어 원 궤도 가정의 한계가 드러납니다."
              : "1.5 au. At opposition Sun, Earth and Mars are in line; at quadrature the angle at Earth is 90°. In the interval Δt Earth gains 360°·Δt/780 on Mars, so seen from the Sun the two directions differ by θ = 360°·Δt/780 and cos θ = 1/r. The official solution, from 8 Nov to 20 Feb (Δt = 104 d, θ = 48°), gets r = 1.5 au. With the true opposition (10 Feb), Δt ≈ 92 and 95 d, θ ≈ 43° and r ≈ 1.37 au — Mars was then near aphelion (1.66 au), which shows the limit of the circular model.")
              + (r ? (L === "ko" ? " · 당신의 날짜로는 r = " : " · from your dates r = ") + r.toFixed(2) : "") + yours(ANS, "O6.r", L) + ok(v == null ? null : Math.abs(v - 1.5) <= 0.15 || (r != null && Math.abs(v - r) <= 0.08)); }],
          ["(c)", (L, ANS) => { const r = num(ANS["O6.r"]), b = num(ANS["O6.beta"]), i = r && b ? Math.atan((r - 1) / r * Math.tan(b * DEG)) / DEG : null, v = num(ANS["O6.inc"]);
            return (L === "ko" ? "1.5°. 충에서 화성–태양 거리 r, 화성–지구 거리 r − 1이므로 r sin i = (r − 1) tan β → tan i = (r − 1)/r · tan β = (0.5/1.5)·tan 4.5° → i = 1.5°. (실제 값 1.85°)" : "1.5°. At opposition Mars is r from the Sun and r − 1 from Earth, so r sin i = (r − 1) tan β → tan i = (r − 1)/r · tan β = (0.5/1.5)·tan 4.5° → i = 1.5°. (True value 1.85°.)")
              + (i != null ? (L === "ko" ? " · 당신의 r, β로는 " : " · from your r and β ") + i.toFixed(2) + "°" : "") + yours(ANS, "O6.inc", L) + ok(v == null ? null : Math.abs(v - 1.5) <= 0.3 || (i != null && Math.abs(v - i) <= 0.2)); }]],
    sol: [{w: 300, h: 300, cap: {ko: "(b) 태양중심 그림: 충(O)과 서구(Q, 104일 전)의 지구(파랑)와 화성(빨강) — 공식 날짜로, 지구에서 직각", en: "(b) Heliocentric sketch: Earth (blue) and Mars (red) at opposition (O) and at western quadrature (Q, 104 days earlier) — official dates, right angle at Earth"},
           draw(g, W, H, L) { g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); const cx = W / 2, cy = H / 2, s = 80, r = 1.5;
             g.strokeStyle = "#999"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, cy); g.lineTo(W, cy); g.moveTo(cx, 0); g.lineTo(cx, H); g.stroke();
             g.strokeStyle = "#333"; g.beginPath(); g.arc(cx, cy, s, 0, 7); g.stroke(); g.setLineDash([4, 3]); g.beginPath(); g.arc(cx, cy, s * r, 0, 7); g.stroke(); g.setLineDash([]);
             const pt = (a, rr, c, t) => { const x = cx + rr * s * Math.cos(a * DEG), y = cy - rr * s * Math.sin(a * DEG); g.fillStyle = c; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.font = "11px sans-serif"; g.fillText(t, x + 5, y - 5); return [x, y]; };
             g.fillStyle = "#e0a000"; g.beginPath(); g.arc(cx, cy, 6, 0, 7); g.fill();
             const E0 = pt(0, 1, "#2060d0", "E (O)"), M0 = pt(0, r, "#c03020", "M (O)");
             const aE = -104 * 0.9856, aM = aE + 104 * 360 / 780, E = pt(aE, 1, "#2060d0", "E (Q)"), M = pt(aM, r, "#c03020", "M (Q)");
             g.strokeStyle = "#2060d0"; g.beginPath(); g.moveTo(cx, cy); g.lineTo(...E); g.lineTo(...M); g.stroke(); g.strokeStyle = "#c03020"; g.beginPath(); g.moveTo(cx, cy); g.lineTo(...M); g.stroke();
             g.fillStyle = "#333"; g.font = "12px sans-serif"; g.fillText("θ = 360°·104/780 = 48°", 8, H - 26); g.fillText("cos θ = 1/r → r = 1.5 au", 8, H - 10);
             g.strokeStyle = "#c03020"; g.beginPath(); g.moveTo(cx, cy); g.lineTo(...M0); g.stroke(); }}]
