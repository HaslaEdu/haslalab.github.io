<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

</style>
</head>
<body>
<script>
/* NBPhO 2008 problem 5 "Ball" on the 3-D bench.  As in the official solution: one ruler lies on the desk, the
   glass ball on it, and a second ruler leans on the ball with its end A held down on the first ruler.  The
   ball touches the lower ruler at B and the upper one at C; at the threshold the reaction at C points through
   B, so μ = tan∠OAB = R/|AB|.  Pushing the ball towards A it stays while |AB| ≥ R/μ and is squeezed out as
   soon as |AB| < R/μ (each try slips at a slightly different place).  The radius comes from rolling the
   marked ball one turn along the paper. */
var PROGRAM = {
  title: { ko: 'NBPhO 2008 실험 5 — 유리공', en: 'NBPhO 2008 Problem 5 — Ball' },
  subtitle: { ko: '장비: 자, 유리공, 종이 한 장, 마커. 유리공과 자 사이의 마찰 계수를 구하고 불확도를 어림하세요.',
              en: 'Equipment: a ruler, a glass ball, a sheet of paper and a marker. Find the coefficient of friction between the glass ball and the ruler. Estimate the uncertainty of your result.' },
  notes: { ko: [
    '공식 해답: 자 하나를 책상에 놓고 그 위에 공, 다른 자를 공에 기대고 그 끝 A 를 손가락으로 아래 자에 누릅니다. 공과 아래 자의 접점 B, 위 자의 접점 C.',
    '문턱에서 C 의 힘(마찰+수직항력)은 B 를 지나므로 μ = tan∠OAB = R/|AB|. 공이 튀어나가지 않는 가장 가까운 자리를 여러 번 찾으세요.',
    '반지름은 마커로 공에 점을 찍고 종이 위에서 한 바퀴 굴려 2πR 로 잽니다(해답 R ≈ 40 mm). μ 는 방문할 때마다 조금 다릅니다.'], en: [
    'Official solution: one ruler lies on the desk, the ball on it, the other ruler leans on the ball with its end A held down on the first ruler by a finger. B is where the ball touches the lower ruler, C the upper one.',
    'At the threshold the force at C (friction plus reaction) passes through B, so μ = tan∠OAB = R/|AB|. Find the closest position from which the ball is not squeezed out, several times.',
    'The radius: mark the ball with the marker and roll it one turn along the paper, 2πR (the solution had R ≈ 40 mm). μ differs a little from visit to visit.'] }
};

var LAB = { where: 'ruler', xb: 8, px: -8, px0: -8, marked: false, prints: [], ticks: [], thr: 0, roll: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 놓인 30 cm 자와 그 위의 유리공, 공에 기댄 둘째 자(끝 A 를 손가락이 누름, 아래 자의 1 cm 눈금), 종이 한 장, 마커.',
           en: 'On the desk: a 30 cm ruler with the glass ball on it, the second ruler leaning on the ball (its end A held by a finger at the lower ruler\'s 1 cm mark), a sheet of paper and a marker.' },
  howto: { ko: ['자 위의 공 끌기(좌우): A 쪽으로 밀거나 떼기 — 너무 가까우면 튀어나갑니다. 튀어나간 공을 클릭하면 다시 올립니다',
                '아래 자 클릭: 공의 접점 B 에 마커로 표시 · 자 옆 가까이 보기는 휠로 확대',
                '종이 클릭: 공을 종이 위로 · 종이 위 공 클릭: 바닥에 마커 점 찍기 · 끌기: 굴리기 (점이 닿을 때마다 종이에 찍힘) · 자 클릭: 다시 자 위로'],
           en: ['Drag the ball on the ruler (left/right): push it towards A or away — too close and it is squeezed out. Click a squeezed-out ball to put it back',
                'Click the lower ruler: mark the contact point B with the marker · zoom in with the wheel to read the scale',
                'Click the paper: move the ball onto it · click the ball there: put a marker dot at its bottom · drag: roll it (the dot prints each time it touches) · click the ruler: back onto the ruler'] },
  notePlaceholder: { ko: '예) A = 1.0 cm, 튀어나가기 직전 B = 14.2, 14.6, 13.9 cm; 한 바퀴 25.1 cm → R = 4.0 cm', en: 'e.g. A = 1.0 cm, last stable B = 14.2, 14.6, 13.9 cm; one turn 25.1 cm → R = 4.0 cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R = 4.0 * (1 + S.sys('R', 0.02)), mu = 0.30 * (1 + S.sys('mu', 0.1)), H0 = 0.3, X0 = -15, XA = X0 + 1, PZ = 12;
    var ruler = B3.scaleTex(30, { horiz: true, width: 3, bg: '#e9eef2', label: 'cm' });
    var paper = (function () { var c = document.createElement('canvas'); c.width = 600; c.height = 240; var g = c.getContext('2d');
      g.fillStyle = '#fbfaf5'; g.fillRect(0, 0, 600, 240); return c; })();
    function newThr() { LAB.thr = R / (mu * (1 + HL.gauss(0.035))); }
    newThr();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.3, pitch: 0.55, k: 16, tx: 0, ty: 3, tz: 4 },
      views: {
        side: { yaw: 0, pitch: 0.12, k: 34, tx: 0, ty: 3, tz: 0, title: { ko: '자 옆에서', en: 'Along the ruler' },
                hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · Esc: back' } },
        paper: { yaw: 0, pitch: 1.45, k: 34, tx: 0, ty: 0, tz: PZ, title: { ko: '종이 (위에서)', en: 'The paper (from above)' } }
      },
      frame: function (b) {
        if (b.clicked('c:paper') && LAB.where === 'ruler') { LAB.where = 'paper'; LAB.px = LAB.px0 = -10; LAB.marked = false; b.say('공을 종이 위에 놓았습니다.', 'The ball is on the paper.'); }
        if (b.clicked('c:ruler')) {
          if (LAB.where === 'paper') { LAB.where = 'ruler'; LAB.xb = XA + 22; newThr(); }
          else if (LAB.where === 'ruler') { LAB.ticks.push(LAB.xb); if (LAB.ticks.length > 12) LAB.ticks.shift(); b.say('B 를 표시했습니다.', 'B marked.'); }
        }
        if (b.clicked('m:ball')) {
          if (LAB.where === 'gone') { LAB.where = 'ruler'; LAB.xb = XA + 22; newThr(); }
          else if (LAB.where === 'paper') { LAB.marked = true; LAB.px0 = LAB.px; LAB.prints.push(LAB.px + HL.gauss(0.04)); if (LAB.prints.length > 20) LAB.prints.shift(); }
        }
        var mv = b.moved('ball');
        if (LAB.where === 'ruler' && mv[0]) { LAB.xb = Math.max(XA + R * 0.8, Math.min(X0 + 30 - R * 0.3, LAB.xb + mv[0]));
          if (LAB.xb - XA < LAB.thr) { LAB.where = 'rolling'; LAB.roll = LAB.xb; b.say('공이 튀어나갔습니다!', 'The ball was squeezed out!'); } }
        if (LAB.where === 'rolling') { LAB.roll += 40 * b.dt; if (LAB.roll > X0 + 34) LAB.where = 'gone'; }
        if (LAB.where === 'paper' && mv[0]) { var p1 = Math.max(-15 + R, Math.min(15 - R, LAB.px + mv[0]));
          if (LAB.marked) { var k0 = Math.floor((LAB.px - LAB.px0) / (2 * Math.PI * R)), k1 = Math.floor((p1 - LAB.px0) / (2 * Math.PI * R));
            if (k1 !== k0) { LAB.prints.push(LAB.px0 + 2 * Math.PI * R * Math.max(k0, k1) + HL.gauss(0.04)); if (LAB.prints.length > 20) LAB.prints.shift(); } }
          LAB.px = p1; }
        B3.desk(-30, 30, -18, 22);
        /* the lower ruler with the marker's ticks */
        B3.box3(X0 - 0.5, X0 + 30.5, 0, H0, -1.5, 1.5, '#cfd8de', { id: 'c:ruler', top: '#e9eef2' });
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [X0 - 0.5, H0 + 0.01, -1.5], [31, 0, 0], [0, 0, 3], { id: 'c:ruler' });
        LAB.ticks.forEach(function (t) { B3.line3([t, H0 + 0.02, -1.5], [t, H0 + 0.02, -0.4], '#1d4fa0', 2); B3.line3([t, 0.02, 1.52], [t, H0, 1.52], '#1d4fa0', 2); });
        /* the paper */
        B3.tex3(paper, 0, 0, paper.width, paper.height, [-15, 0.01, PZ - 6], [30, 0, 0], [0, 0, 12], { id: 'c:paper' });
        LAB.prints.forEach(function (p) { B3.sphere3([p, 0.02, PZ], 0.12, '#1d2b6b'); });
        /* the ball and the upper ruler */
        var ang;
        if (LAB.where === 'ruler') {
          var x = LAB.xb - XA; ang = 2 * Math.atan(R / x);
          B3.sphere3([LAB.xb, H0 + R, 0], R, '#cfe6ec', { id: 'm:ball' });
        } else {
          ang = Math.atan2(0.3, 30);
          if (LAB.where === 'rolling') B3.sphere3([LAB.roll, H0 + R, 0], R, '#cfe6ec', { id: 'm:ball' });
          else if (LAB.where === 'gone') B3.sphere3([X0 + 36, R, 4], R, '#cfe6ec', { id: 'm:ball' });
          else { B3.sphere3([LAB.px, R, PZ], R, '#cfe6ec', { id: 'm:ball' });
            if (LAB.marked) { var ph = (LAB.px - LAB.px0) / R; B3.sphere3([LAB.px - (R + 0.02) * Math.sin(ph), R - (R + 0.02) * Math.cos(ph), PZ], 0.18, '#1d2b6b'); } }
        }
        var ux = Math.cos(ang), uy = Math.sin(ang), A = [XA, H0, 0];
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [A[0] - uy * 0.3, A[1] + ux * 0.3, -1.5], [31 * ux, 31 * uy, 0], [0, 0, 3]);
        B3.line3([A[0], A[1], 1.5], [A[0] + 31 * ux, A[1] + 31 * uy, 1.5], '#9aa4ab', 2);
        B3.sphere3([A[0] + 0.4, A[1] + 1.1, 0], 1.0, '#e8b9a0');                                          /* the fingertip at A */
        b.views.side.tx = LAB.where === 'ruler' ? (XA + LAB.xb) / 2 : 0; b.views.paper.tx = LAB.px;
        LAB.state = { AB: LAB.xb - XA, thr: LAB.thr, R: R, mu: mu };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
