var PROGRAM = {
  title: { ko: 'IZhO 2023 실험 — 푸리에 분광기', en: 'IZhO 2023 — Fourier spectrometer' },
  subtitle: { ko: '마이컬슨 간섭계의 거울 4 가 20 Hz 로 조화 진동하고, 광검출기 5 의 전압(직류 성분은 잘림)이 같은 시간 간격으로 메모리 칸에 기록됩니다(시간은 칸 번호 t). 기록은 늘 같은 거울 위치에서 시작합니다. 먼저 알려진 파장 λ₀ = 0.640 µm 로 장치를 보정하고(칸 하나의 시간, 거울 운동 x(t) = A·sin(2π(t − t₀)/T)), 그 다음 미지 파장의 빛과 두 파장이 섞인 빛을 조사하세요.',
              en: 'Mirror 4 of a Michelson interferometer oscillates harmonically at 20 Hz; the photodetector 5 voltage (DC part cut off) is recorded at equal intervals into memory cells (time = the cell number t). Each record starts at the same mirror position. First calibrate with the known wavelength λ₀ = 0.640 µm (the cell duration, the mirror motion x(t) = A·sin(2π(t − t₀)/T)), then study light of an unknown wavelength and light of two wavelengths.' },
  notes: { ko: [
    '과제: 1 두 파의 간섭 세기, I(x), 극대·극소의 거울 위치 x_m = mλ/4. 2 λ₀ 로 칸 하나의 시간 Δt (ms), 주기 T, 진폭 A, t₀, sin(2π(t − t₀)/T) 에 대한 x_m 의 직선 그래프. 3 미지 단색광 — 극값의 x_m 대 m 의 기울기로 λ. 4 두 파장 — 포락선의 공간 주기 Λ 로 1/λ₁ − 1/λ₂ = 1/Λ, 세기 비.',
    '공식 해답: t_min = 67, t_max = 901 → T = 1668, Δt = 0.030 ms; 극값 0…54, 가운데 m₀ = 27 은 t₀ = 486; A = 4.23 ± 0.01 µm. 미지 λ = 0.709 ± 0.003 µm. 두 파장: Λ = 5.64 ± 0.04 µm → λ₂ = 0.722 µm (또는 0.575 µm), I₂/I₁ ≈ 0.62 (또는 1.62).',
    '문제지는 기록된 그래프와 극값 표를 줍니다. 여기서는 화면의 커서로 칸 번호와 전압을 직접 읽습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 the intensity of two interfering waves, I(x), the mirror positions of maxima and minima x_m = mλ/4. 2 with λ₀: the cell duration Δt (ms), the period T, amplitude A, t₀, a straight-line graph of x_m against sin(2π(t − t₀)/T). 3 the unknown monochromatic light — λ from the slope of x_m against m. 4 two wavelengths — the envelope\'s spatial period Λ, 1/λ₁ − 1/λ₂ = 1/Λ, the intensity ratio.',
    'Official solution: t_min = 67, t_max = 901 → T = 1668, Δt = 0.030 ms; extrema 0…54, the middle m₀ = 27 at t₀ = 486; A = 4.23 ± 0.01 µm. Unknown λ = 0.709 ± 0.003 µm. Two wavelengths: Λ = 5.64 ± 0.04 µm → λ₂ = 0.722 µm (or 0.575 µm), I₂/I₁ ≈ 0.62 (or 1.62).',
    'The sheet gives the recorded graphs and tables of extrema. Here you read the cell number and voltage with the screen cursor. The values differ a little from visit to visit.'] }
};

var LAB = { src: 0, vib: true, rec: null, cur: 486, w0: 0, ww: 1000 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 광원 세 개(λ₀ = 0.640 µm, 미지 λ, 두 파장 광원), 마이컬슨 간섭계(빔 가르개 2, 고정 거울 3, 20 Hz 진동자에 붙은 거울 4, 광검출기 5), 기록 화면.',
           en: 'On the desk: three sources (λ₀ = 0.640 µm, the unknown λ, the two-wavelength source), the Michelson interferometer (beam splitter 2, fixed mirror 3, mirror 4 on a 20 Hz vibrator, photodetector 5) and the recording screen.' },
  howto: { ko: ['광원 클릭: 간섭계 앞에 놓기 · 진동자 클릭: 켜기/끄기',
                '화면 클릭: 가까이 — REC: 한 번 기록 (1000 칸) · 그래프 클릭/끌기: 커서 · 휠: 커서 둘레로 확대/축소 · ◀ ▶: 한 칸, ◀◀ ▶▶: 10 칸 · 전체: 처음 범위로'],
           en: ['Click a source: put it before the interferometer · click the vibrator: on/off',
                'Click the screen: close up — REC: record once (1000 cells) · click/drag the graph: cursor · wheel: zoom about the cursor · ◀ ▶: one cell, ◀◀ ▶▶: ten · ALL: the whole range'] },
  notePlaceholder: { ko: '예) λ₀: 극대 t = 67(0), 118(1) … 901(54) → T = 1668 …', en: 'e.g. λ₀: maxima t = 67 (0), 118 (1) … 901 (54) → T = 1668 …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var AMP = 4.23 * (1 + S.sys('A', 0.01)), T = 1668, T0c = 486 + Math.round(S.uni('t0', -3, 3)), LX = 0.709 * (1 + S.sys('lx', 0.008)), L2 = 0.722 * (1 + S.sys('l2', 0.008));
    var SRC = [{ n: 'λ₀ = 0.640 µm', w: [[0.640, 150]], col: '#ff5a3a' }, { n: 'λ = ?', w: [[LX, 150]], col: '#d01a2a' }, { n: 'λ₀ + λ₂', w: [[0.640, 105], [L2, 65]], col: '#ff8a3a' }];
    function record() { var w = SRC[LAB.src].w, out = new Float32Array(1000);
      for (var t = 0; t < 1000; t++) { var x = AMP * Math.sin(2 * Math.PI * (t - T0c) / T), u = 0;
        for (var i = 0; i < w.length; i++) u += w[i][1] * Math.cos(4 * Math.PI * x / w[i][0]);
        out[t] = Math.round(u + HL.gauss(1.5)); }
      return out; }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.3, pitch: 0.75, k: 12, tx: 4, ty: 3, tz: 0 },
      views: { scr: { yaw: 0, pitch: 0.12, k: 30, tx: 24, ty: 10, tz: 0, title: { ko: '기록 화면', en: 'Recording screen' } } },
      frame: function (b) {
        for (var s = 0; s < 3; s++) if (b.clicked('c:src' + s)) { LAB.src = s; b.say(SRC[s].n + ' 광원을 놓았습니다', SRC[s].n + ' source placed'); }
        if (b.clicked('c:vib')) LAB.vib = !LAB.vib;
        B3.desk(-36, 40, -18, 20);
        B3.box3(-24, 12, 0, 0.8, -16, 12, '#2b2f35', { top: '#33373e' });
        /* the three sources: the chosen one sits on the axis, the others beside it */
        for (var k = 0; k < 3; k++) { var on = k === LAB.src, sx = on ? -20 : -32, sz = on ? 0 : -8 + k * 7;
          B3.box3(sx - 3, sx + 3, on ? 0.8 : 0, (on ? 0.8 : 0) + 4, sz - 2, sz + 2, '#3a3f46', { id: 'c:src' + k, top: '#474c55' });
          B3.cyl3('x', sx + 3, sx + 3.6, (on ? 0.8 : 0) + 2, sz, 0.8, '#1b1b1b', { seg: 14, id: 'c:src' + k, cap: on ? SRC[k].col : '#333' });
          B3.text3([sx - 2.6, (on ? 0.8 : 0) + 4.02, sz + 1.5], [1, 0, 0], [0, 0, -1], SRC[k].n, 0.55, '#eee', { weight: '700' }); }
        var y0 = 2.8;
        /* beam splitter 2, fixed mirror 3, vibrating mirror 4, detector 5 */
        B3.obox([0, y0, 0], [Math.SQRT1_2, 0, -Math.SQRT1_2], [0, 1, 0], 2, 1.8, 0.12, 'rgba(170,210,235,.6)');
        B3.box3(9, 9.5, 0.8, 5, -2, 2, '#c8ced6'); B3.box3(9.5, 11, 0.8, 5, -2.5, 2.5, '#3a3f46');
        B3.box3(-2, 2, 0.8, 5, -9.5, -9, '#c8ced6'); B3.box3(-2.5, 2.5, 0.8, 5, -12.5, -9.5, '#3a3f46', { id: 'c:vib', top: LAB.vib ? '#3f8f4f' : '#474c55' });
        B3.text3([-2.3, 5.02, -10], [1, 0, 0], [0, 0, -1], '20 Hz', 0.55, '#eee', { weight: '700' });
        B3.cyl3('z', 9, 10.5, 0, y0, 1.2, '#1b1b1b', { seg: 16, cap: '#2a2a3a' }); B3.box3(-2, 2, 0.8, 1.6, 9, 11, '#3a3f46');
        [['2', 1.5, -2], ['3', 10, 3.2], ['4', 2.8, -10.5], ['5', 2.4, 10]].forEach(function (q) { B3.text3([q[1], 5.3, q[2]], [1, 0, 0], [0, 1, 0], q[0], 1.0, '#ffd479', { weight: '800' }); });
        var bc = SRC[LAB.src].col;
        B3.line3([-17, y0, 0], [9, y0, 0], bc, 2, { alpha: 0.7 }); B3.line3([0, y0, 0], [0, y0, -9], bc, 2); B3.line3([0, y0, 0], [0, y0, 9], bc, 2);
        /* the screen */
        var cv = b.panel('scr', 640, 400, function (ui) { var g = ui.g;
          HL.rr(g, 0, 0, 640, 400, 10, '#101418'); HL.text(g, 'U(t)', 14, 18, '#9ad0ff', 13, 'left', '800');
          HL.text(g, SRC[LAB.src].n + (LAB.vib ? '' : b.L('  · 진동자 꺼짐', '  · vibrator off')), 70, 18, '#c8ced6', 12, 'left', '600');
          var gx = 54, gy = 34, gw = 570, gh = 280, R = LAB.rec;
          HL.rr(g, gx, gy, gw, gh, 2, '#0b0f12', '#2a3036');
          var w0 = LAB.w0, ww = LAB.ww, X = function (t) { return gx + (t - w0) / ww * gw; }, Y = function (u) { return gy + gh / 2 - u / 400 * gh; };
          g.strokeStyle = '#1e262c'; g.lineWidth = 1; for (var u = -200; u <= 200; u += 100) { g.beginPath(); g.moveTo(gx, Y(u)); g.lineTo(gx + gw, Y(u)); g.stroke(); HL.text(g, String(u), gx - 6, Y(u), '#7d868f', 10, 'right'); }
          var step = Math.pow(10, Math.floor(Math.log10(ww / 4))); for (var tt = Math.ceil(w0 / step) * step; tt <= w0 + ww; tt += step) { g.beginPath(); g.moveTo(X(tt), gy); g.lineTo(X(tt), gy + gh); g.stroke(); HL.text(g, String(tt), X(tt), gy + gh + 10, '#7d868f', 10, 'center'); }
          if (R) { g.save(); g.beginPath(); g.rect(gx, gy, gw, gh); g.clip(); g.strokeStyle = '#4ec9b0'; g.lineWidth = ww < 120 ? 1.6 : 1; g.beginPath();
            for (var t = Math.max(0, Math.floor(w0)); t <= Math.min(999, Math.ceil(w0 + ww)); t++) { if (t === Math.max(0, Math.floor(w0))) g.moveTo(X(t), Y(R[t])); else g.lineTo(X(t), Y(R[t])); }
            g.stroke(); if (ww < 120) { g.fillStyle = '#4ec9b0'; for (t = Math.max(0, Math.floor(w0)); t <= Math.min(999, Math.ceil(w0 + ww)); t++) { g.fillRect(X(t) - 1.5, Y(R[t]) - 1.5, 3, 3); } }
            g.strokeStyle = '#ffd479'; g.beginPath(); g.moveTo(X(LAB.cur), gy); g.lineTo(X(LAB.cur), gy + gh); g.stroke(); g.restore();
            HL.text(g, 't = ' + LAB.cur + '    U = ' + R[LAB.cur], 360, 18, '#ffd479', 14, 'left', '700', HL.MONO); }
          else HL.text(g, b.L('REC 를 눌러 기록하세요', 'Press REC to record'), gx + gw / 2, gy + gh / 2, '#7d868f', 16, 'center', '600');
          var e = ui.hit('g', { x: gx, y: gy, w: gw, h: gh }, { wheel: true, cursor: 'crosshair' });
          if ((e.click || e.down) && e.x !== undefined && R) LAB.cur = Math.max(0, Math.min(999, Math.round(w0 + (e.x - gx) / gw * ww)));
          if (e.wheel) { var f = Math.pow(0.8, e.wheel), nw = Math.max(20, Math.min(1000, ww * f)); LAB.w0 = Math.max(0, Math.min(1000 - nw, LAB.cur - (LAB.cur - w0) * nw / ww)); LAB.ww = nw; }
          var bt = [['REC', 'rec', '#b83a32'], ['◀◀', -10], ['◀', -1], ['▶', 1], ['▶▶', 10], [b.L('전체', 'ALL'), 'all']];
          bt.forEach(function (q, i) { var r = HL.button(ui, 'b' + i, 54 + i * 96, 344, 86, 38, { label: q[0], col: q[2] || '#3b3f45', size: 14 });
            if (r.press) { if (q[1] === 'rec') { if (LAB.vib) { LAB.rec = record(); } else b.say('진동자가 꺼져 있어 신호가 변하지 않습니다', 'The vibrator is off — the signal does not change'); }
              else if (q[1] === 'all') { LAB.w0 = 0; LAB.ww = 1000; }
              else { LAB.cur = Math.max(0, Math.min(999, LAB.cur + q[1])); if (LAB.cur < LAB.w0) LAB.w0 = LAB.cur; if (LAB.cur > LAB.w0 + LAB.ww) LAB.w0 = LAB.cur - LAB.ww; } } });
        });
        B3.box3(16, 32, 0, 1, -6, -2, '#2b2f35'); B3.box3(23, 25, 1, 4, -5, -3, '#2b2f35');
        B3.box3(15.5, 32.5, 4, 15, -4.6, -3.8, '#1b1e22');
        B3.tex3(cv, 0, 0, cv.width, cv.height, [16, 14.6, -3.78], [16, 0, 0], [0, -10, 0], { id: 'p:scr' });
        B3.cable([11, 2, 0], [24, 1, -4], '#1b1b1b', 1, 2);
        LAB.state = { src: LAB.src, A: AMP, t0: T0c, rec: !!LAB.rec };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
