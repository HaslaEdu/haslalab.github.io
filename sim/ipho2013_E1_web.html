<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

  @media (max-width:1180px){ .panel{position:static} }

      if(xb<=xi1) return {kind:"vessel", x:xb, z:H+V_BOT, half:(TRUE.zLens-V_BOT/1000)/c1+alphaW()*ST.water/1000};
      const z=zAt(xi1); return {kind:"wall", x:xi1, z, half:dist(xi1,z)+(z<zw?0.004:0)}; }
    if(xt<xo0&&xb>=xo0){ const z=zAt(xo0); if(z>H&&z<top) return {kind:"wall", x:xo0, z, half:dist(xo0,z)}; } }
  const xT=xAt(H); if(xT<X_EDGE) return {kind:"table", x:xT, z:H, half:TRUE.zLens/c1};
  return {kind:"floor", x:xAt(0), z:0, half:(TRUE.zLens+TRUE.H)/c1};
}
/* one reading of the instrument: the string on its display */
function measure(){
  const k=ST.rear?TRUE.kRear:TRUE.kRear-BODY_LEN; let half=null, sg=0.0008;
  if(ST.mode==="edge"){ if(ST.felt) return "Error"; half=TRUE.H-TRUE.kRear; }
  else if(ST.mode==="flat"){ if(ST.felt){ if(!ST.fiberIn) return "Error"; half=0.5*TRUE.nCo*ST.cable/1000; sg=0.004; }
    else { const xr=ST.pos.ldm.x-LDM_L/2; half=TRUE.wall-xr/1000-TRUE.kRear; } }
  else { if(ST.felt) return "Error"; const t=tiltTarget(); if(!t) return "Error"; half=t.half; if(t.kind==="vessel") sg=0.00035; }
  const y=half+k+gauss()*sg; if(y<0.05||y>25) return "Error";
  return y.toFixed(3);
}

/* ══════════════════════════════════════════════════════════════
   4.  DRAWING HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,'Courier New',monospace";
function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function vgrad(y,h,stops){ const g=ctx.createLinearGradient(0,y,0,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function ell(x,y,rx,ry,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];
  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]<=0.02) continue;
    const f=0.80+0.2*out[1]-0.08*out[0];
    poly([P(p[0],p[1],z0),P(q[0],q[1],z0),P(q[0],q[1],z0+h),P(p[0],p[1],z0+h)],shade(side,f-1),edge,0.6); }
  poly(c.map(p=>P(p[0],p[1],z0+h)),top,edge,0.6);
  return c;
}
function vcyl(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=0.7; ctx.stroke(); }
  ell(t[0],t[1],rx,ry,top,edge,0.7);
}
function hcyl(p0,p1,z,r,col,hi){
  const a=P(p0[0],p0[1],z), b=P(p1[0],p1[1],z);
  ctx.lineCap="round"; ctx.strokeStyle=col; ctx.lineWidth=2*r*SC; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if(hi){ ctx.strokeStyle=hi; ctx.lineWidth=Math.max(0.8,r*SC*0.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]-r*SC*0.45); ctx.lineTo(b[0],b[1]-r*SC*0.45); ctx.stroke(); }
  ctx.lineCap="butt";
}

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}

    ctx.strokeStyle="#2f6f9e"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(m.X(-V_IN_W/2),m.Y(ST.water)-1.2*z); ctx.quadraticCurveTo(m.X(-V_IN_W/2+2),m.Y(ST.water),m.X(-V_IN_W/2+6),m.Y(ST.water)); ctx.lineTo(m.X(V_IN_W/2-6),m.Y(ST.water)); ctx.quadraticCurveTo(m.X(V_IN_W/2-2),m.Y(ST.water),m.X(V_IN_W/2),m.Y(ST.water)-1.2*z); ctx.stroke(); }
  /* the paper tape glued on the outside, 0 at the inner floor */
  const tx=m.X(w+1); ctx.fillStyle="#f6f2df"; ctx.fillRect(tx,m.Y(V_IN_H+8),16*Math.max(1,z/3),(V_IN_H+10)*z);
  for(let k=0;k<=V_IN_H+6;k++){ const py=m.Y(k), L=(k%10===0?9:k%5===0?6:3.5)*Math.max(1,z/3); if(z<2&&k%5) continue; ctx.strokeStyle="#222"; ctx.lineWidth=k%10===0?1.1:0.6; ctx.beginPath(); ctx.moveTo(tx,py); ctx.lineTo(tx+L,py); ctx.stroke();
    if(k%10===0) text(String(k/10),tx+L+3,py,"#222",Math.max(9,Math.min(14,z*1.4)),"left","600"); }
  if(laserLit()&&ST.mode==="angle"){ const T2=tiltTarget(); if(T2&&T2.kind==="vessel"){ const ta=Math.tan(TRUE.th1), xb=T2.x-ST.pos.vessel.x, s2=Math.sin(TRUE.th1)/TRUE.nW, t2=s2/Math.sqrt(1-s2*s2);
    const xs=ST.water>0?xb-(ST.water)*ta:xb, xe=ST.water>0?xs+ST.water*t2:xb, top=V_IN_H+30;
    ctx.strokeStyle="#ff3b2c"; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(m.X(xs-(top-ST.water)*ta),m.Y(top)); ctx.lineTo(m.X(xs),m.Y(ST.water)); ctx.lineTo(m.X(xe),m.Y(0)); ctx.stroke(); circ(m.X(xe),m.Y(0),3,"#ff4433"); } }
}
function drawClose(){
  const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CLW,CLH);
  if(tab==="ldm") drawLdmView(); else if(tab==="front") drawFrontView(); else if(tab==="fiber") drawFiberView(); else drawVesselView();
  ctx=old;
}
/* ══════════════════════════════════════════════════════════════
   7.  HANDS: putting things down, combining them, putting them back
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const inB=(p,b,m)=>b&&p[0]>=b[0]-(m||0)&&p[0]<=b[2]+(m||0)&&p[1]>=b[1]-(m||0)&&p[1]<=b[3]+(m||0);
const onTableXY=p=>{ const [x,y]=unPz(p[0],p[1],H_MM()); return [x,y]; };
function nearEdge(p){ const a=P(X_EDGE-20,0,H_MM()), b=P(X_EDGE+140,TD,H_MM()-140); return p[0]>=a[0]&&p[0]<=b[0]&&p[1]>=a[1]-10&&p[1]<=b[1]+20; }
const ldmBox=()=>has("ldm")?bbox("ldm"):null;
function place(k,p){
  const H=H_MM();
  if(k==="felt"){ if(!has("ldm")||!inB(p,ldmBox(),12)){ say("onLdm"); return false; } if(ST.mode!=="flat"){ say("needFlat"); return false; } ST.felt=true; ST.on.add("felt"); say("felt"); return "said"; }
  if(k==="fiber"&&has("ldm")&&inB(p,ldmBox(),12)){ if(ST.mode!=="flat"){ say("needFlat"); return false; } if(!ST.felt){ say("needFelt"); return false; } ST.fiberIn=true; ST.on.add("fiber"); say("fiberIn"); return "said"; }
  if(k==="foam"){ const ab=has("angle")?bbox("angle"):null; if(!ab||!inB(p,ab,12)){ say("onAngle"); return false; } ST.foam=true; ST.on.add("foam"); say("foam"); return "said"; }
  if(k==="magnet"&&has("box")&&inB(p,bbox("box"),6)){ ST.magnetIn=true; ST.on.add("magnet"); say("magnet"); return "said"; }
  if(k==="angle"&&has("box")&&inB(p,bbox("box"),6)){ if(!ST.magnetIn){ say("needMagnet"); return false; } ST.angleOn=true; ST.on.add("angle"); say("angle"); return "said"; }
  if(k==="ldm"){
    if(ST.angleOn&&has("box")&&inB(p,bbox("box"),30)&&p[1]<P(0,ST.pos.box.y,H+BOX.h)[1]+10){ if(ST.felt||ST.fiberIn){ say("removeFelt"); return false; } if(!ST.foam){ say("needFoam"); return false; } ST.mode="angle"; ST.on.add("ldm"); say("mounted"); return "said"; }
    if(nearEdge(p)){ if(ST.fiberIn){ say("removeFelt"); return false; } ST.mode="edge"; ST.on.add("ldm"); say("edge"); return "said"; } }
  const [x,y]=onTableXY(p); if(!fits(k,x,y)){ say("noFit"); return false; }
  ST.pos[k]={x,y}; if(k==="ldm") ST.mode="flat"; if(k==="angle") ST.angleOn=false; if(k==="fiber") ST.fiberIn=false; ST.on.add(k); return true;
}
function returnItem(k){
  if(k==="ldm"){ if(ST.fiberIn){ ST.fiberIn=false; ST.on.delete("fiber"); } if(ST.felt){ ST.felt=false; ST.on.delete("felt"); } }
  if(k==="box"){ if(has("ldm")&&ST.mode==="angle"){ say("busy"); return; } if(ST.angleOn){ ST.angleOn=false; ST.on.delete("angle"); ST.foam=false; ST.on.delete("foam"); } if(ST.magnetIn){ ST.magnetIn=false; ST.on.delete("magnet"); } }
  if(k==="angle"){ if(has("ldm")&&ST.mode==="angle"){ say("busy"); return; } ST.angleOn=false; if(ST.foam){ ST.foam=false; ST.on.delete("foam"); } }
  if(k==="vessel") ST.water=0;
  ST.on.delete(k); say("back",itemName(k));
}
/* R-click on the LDM takes off the fibre, then the felt pad, then the LDM itself */
function rightLdm(){ if(ST.fiberIn){ ST.fiberIn=false; ST.on.delete("fiber"); say("back",itemName("fiber")); return; } if(ST.felt){ ST.felt=false; ST.on.delete("felt"); say("back",itemName("felt")); return; } returnItem("ldm"); }
const PICK=["ldm","angle","bottle","vessel","fiber","felt","tapem","tape","scis","foam","magnet","box"];
function itemAt(p){ for(const k of PICK){ if(!has(k)) continue; if((k==="fiber"&&ST.fiberIn)||(k==="felt"&&ST.felt)||(k==="foam"&&ST.foam)||(k==="magnet"&&ST.magnetIn)) continue; const b=bbox(k); if(b&&inB(p,b,3)) return k; } return null; }
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move){ ST.on.add(hand.item); Object.assign(ST,hand.restore||{}); ST.pos[hand.item]=hand.orig; say("placed",itemName(hand.item)); } else say("back",itemName(hand.item)); hand=null; return; }
    const r=place(hand.item,p); if(r){ if(r===true) say("placed",itemName(hand.item)); hand=null; } return; }
  const k=itemAt(p); if(!k) return;
  if(right){ if(k==="ldm") rightLdm(); else returnItem(k); return; }
  if(k==="ldm"&&(ST.felt||ST.fiberIn)&&ST.mode==="flat"){ hand={item:k,move:true,orig:{...ST.pos.ldm},restore:{mode:"flat"}}; ST.on.delete(k); say("picked",itemName(k)); return; }
  if(k==="angle"&&ST.angleOn){ if(has("ldm")&&ST.mode==="angle"){ say("busy"); return; } ST.angleOn=false; ST.on.delete("angle"); hand={item:"angle",move:true,orig:null,restore:{angleOn:true}}; say("picked",itemName(k)); return; }
  if(k==="box"&&has("ldm")&&ST.mode==="angle"){ boxDrag={x:p[0],bx:ST.pos.box.x}; return; }
  const orig=ST.pos[k]?{...ST.pos[k]}:null, restore={mode:ST.mode}; ST.on.delete(k); hand={item:k,move:true,orig,restore}; say("picked",itemName(k));
}
let trayDrag=false, boxDrag=null;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); if(boxDrag) moveBox(boxDrag.bx+(mouse[0]-boxDrag.x)/S1-ST.pos.box.x); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("pointerup",()=>{ boxDrag=null; });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ if(hand.move){ ST.on.add(hand.item); Object.assign(ST,hand.restore||{}); if(hand.orig) ST.pos[hand.item]=hand.orig; } hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=hand&&hand.item===k; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
function moveBox(dx){ if(!has("box")){ say("noBox"); return; } const b=ST.pos.box, nx=Math.max(BOX.w/2+8,Math.min(X_EDGE-BOX.w/2-2,b.x+dx));
  const f=footOf("box",nx,b.y); for(const o of ITEMS){ if(o==="box"||!has(o)||!ST.pos[o]||!onTop(o)) continue; if(overl(f,footOf(o,ST.pos[o].x,ST.pos[o].y),2)) return; } b.x=nx; }

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e); if(e.button!==0) return; const h=hitAt(p);
  if(h&&"ABDE".includes(h.k)&&h.k.length===1){ ldmKey(h.k); return; }
  if(tab==="fiber"){ if(h&&h.k==="fib"){ const m=fvMap(); ST.mark=Math.round(m.U(p[0])*10)/10; say("cutMark"); return; } cdrag={x:p[0],cx:FV.cx}; closeCv.setPointerCapture(e.pointerId); return; }
  if(tab==="vessel"){ cdrag={y:p[1],cy:VV.cy}; closeCv.setPointerCapture(e.pointerId); } });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e);
  if(tab==="fiber"&&cdrag.cx!==undefined){ FV.cx=cdrag.cx-(p[0]-cdrag.x)/fvMap().z; }
  if(tab==="vessel"&&cdrag.cy!==undefined){ VV.cy=cdrag.cy+(p[1]-cdrag.y)/vvMap().z; } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e);
  if(tab==="fiber"){ e.preventDefault(); const m=fvMap(), mx=m.U(p[0]); FV.z=Math.min(30,Math.max((CLW-40)/1100,FV.z*(e.deltaY<0?1.2:1/1.2))); FV.cx+=mx-fvMap().U(p[0]); }
  else if(tab==="vessel"){ e.preventDefault(); const m=vvMap(), my=m.V(p[1]); VV.z=Math.min(40,Math.max((CLH-30)/130,VV.z*(e.deltaY<0?1.2:1/1.2))); VV.cy+=my-vvMap().V(p[1]); } },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  THE INSTRUMENT, PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
function readOnce(){ if(ST.hot){ ST.disp="----"; return; } ST.disp=measure(); }
function ldmKey(k){
  if(!has("ldm")) return; const now=performance.now();
  if(k==="A"){ ST.power=!ST.power; ST.cont=false; ST.asleep=false; ST.disp=""; if(ST.power){ ST.rear=true; ST.disp="0.000"; } return; }
  if(!ST.power){ if(k==="D"){ ST.power=true; ST.rear=true; ST.disp="0.000"; } else say("off"); return; }
  if(k==="B"){ ST.rear=!ST.rear; return; }
  if(k==="E"){ ST.cont=!ST.cont; ST.asleep=false; ST.contT=0; ST.lastTick=now; if(ST.cont) readOnce(); return; }
  if(k==="D"){ if(ST.cont){ ST.asleep=false; ST.contT=0; readOnce(); return; } ST.laserT=now+1600; readOnce(); }
}
for(const k of "ABDE") $("b"+k).onclick=()=>ldmKey(k);
$("cutBtn").onclick=()=>{ if(!has("scis")){ say("needScis"); return; } if(ST.fiberIn){ say("fiberBusy"); return; } if(!has("fiber")||ST.mark===null){ say("noMark"); return; }
  if(ST.mark<30||ST.mark>ST.cable-4){ say("tooShort"); ST.mark=null; return; } ST.cable=ST.mark+gauss()*1.2; ST.cuts++; ST.mark=null; say("cut"); };
for(const [id,dx] of [["bx-10",-10],["bx-1",-1],["bx1",1],["bx10",10]]) $(id).onclick=()=>moveBox(dx);
function addWater(dz){ if(!has("vessel")||!has("bottle")){ say("needVessel"); return; } ST.water=Math.max(0,Math.min(V_IN_H-3,ST.water+dz+gauss()*0.25)); if(ST.water<0.3) ST.water=0; say("water",(dz>0?"+":"")+dz+" mm"); }
for(const [id,dz] of [["w5",5],["w1",1],["wm1",-1],["wm5",-5]]) $(id).onclick=()=>addWater(dz);
$("wEmpty").onclick=()=>{ if(!has("vessel")) return; ST.water=0; };
$("noteBtn").onclick=()=>{ const n=$("note"); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+"y = "+(ST.disp||"—")+(ST.disp&&ST.disp!=="Error"?" m":"")+"    x = "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d(); $("ldmDisp").textContent=ST.power?(ST.disp?(ST.disp+(ST.disp==="Error"||ST.disp==="----"?"":" m")):"0.000 m"):"-----"; $("fiberLbl").textContent=t.fiberLbl(ST.cuts,ST.mark!==null); }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(laserLit()) L.push([t.st.laser,true]);
  if(ST.hot) L.push([t.st.hot,true]);
  if(ST.asleep) L.push([t.st.sleep,false]);
  if(ST.power&&!ST.rear) L.push([t.st.front,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-ldm").textContent=t.hLdm; for(const k of "ABDE") $("b"+k).textContent=t["b"+k]; $("ldmHint").textContent=t.ldmHint;
  $("t-h-fiber").textContent=t.hFiber; $("cutBtn").textContent=t.cut; $("t-h-box").textContent=t.hBox; $("boxHint").textContent=t.boxHint;
  $("t-h-water").textContent=t.hWater; $("wEmpty").textContent=t.wEmpty; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2013 E1 — 빛의 속력 · HaslaLab":"IPhO 2013 E1 — Speed of Light · HaslaLab";
  renderTabs(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, tPrev=performance.now();
function tick(){
  const now=performance.now(), dt=Math.min(0.2,(now-tPrev)/1000); tPrev=now;
  /* continuous mode: a new reading about once a second, sleep after three minutes, heat builds up */
  if(ST.power&&ST.cont&&!ST.asleep){ ST.contT+=dt; ST.heat+=dt; if(now-ST.lastTick>1000){ ST.lastTick=now; readOnce(); } if(ST.contT>180) ST.asleep=true; }
  else ST.heat=Math.max(0,ST.heat-dt*(ST.power?0.6:2.5));
  if(!ST.hot&&ST.heat>420) ST.hot=true; if(ST.hot&&ST.heat<120) ST.hot=false;
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
