const yours = (A, k, L) => A[k] ? (L === "ko" ? " · 당신의 답 " : " · yours ") + A[k] : "";

      {id: "d", mk: "24", ko: "주어진 좌표를 X′Y′Z′로 바꾸세요.", en: "Convert the coordinates to X′, Y′, Z′."},

      {id: "e", mk: "11", ko: "X′Y′Z′를 중심 은하 중심의 구면 좌표로 바꾸는 식을 쓰고 R과 φ를 구하세요(φ는 X′축에서 반시계 방향 0–2π, θ는 Z′축에서 0–π).", en: "Write the equations converting X′Y′Z′ to spherical coordinates centred on the central galaxy and calculate R and φ (φ anticlockwise from X′, 0 to 2π; θ from Z′, 0 to π)."},
      {id: "f", mk: "9", ko: "중심 은하로부터의 거리에 따른 위성 은하 수의 히스토그램을 그리세요(0.2–2 Mpc, 같은 폭 구간 8개).", en: "Plot a histogram of the number of satellite galaxies against distance from the central galaxy (8 equal bins, 0.2 to 2 Mpc)."},
      {id: "g", mk: "4", ko: "히스토그램 세로축 오른쪽에 확률 밀도용 눈금을 덧붙이세요(3부에서 씁니다).", en: "On the right of the histogram's vertical axis, add the rescaled axis for the probability density (used in Part 3)."},
      {h: {ko: "2부 (17점) — 공전 운동이 적색 이동 거리에 주는 오차를 고칩니다. 중심 은하의 유효 질량 1×10¹⁰ M⊙, 위성은 원궤도, 서로의 상호작용은 무시합니다.", en: "Part 2 (17 points) — Correct the redshift distances for orbital motion. The central galaxy has an effective mass of 1×10¹⁰ M⊙, satellites move on circular orbits, and their mutual interactions are neglected."}},
      {id: "2a", mk: "5", ko: "방위각 φ의 히스토그램(60° 구간)을 만들고 표준편차를 구하세요. 고르게 나와야 하는데 그렇지 않습니다.", en: "Make a histogram of the azimuth φ (60° bins) and calculate its standard deviation. It should be uniform but is not."},
      {id: "2b", mk: "4", ko: "Y′축 쪽 두 구간이 유난히 적은 것은 그 은하들의 공전 속도가 시선과 거의 나란해 적색 이동 거리의 오차가 가장 크기 때문입니다. 방위각 보정 식을 유도하세요(R은 거의 변하지 않는다고 둠).", en: "The two bins along Y′ are low because those galaxies orbit almost along the line of sight, giving the largest redshift-distance error. Derive the correction to each azimuth (R hardly changes)."},
      {id: "2c", mk: "8", ko: "각 줄의 방위각을 고치고 히스토그램과 표준편차를 다시 구하세요.", en: "Correct the azimuths, then redo the histogram and its standard deviation."},
      {h: {ko: "3부 (28점) — 헤일로 500개(N_C = 500), 헤일로마다 위성 평균 1000개(N_S = 1000). 다른 헤일로 중심 은하 사이 거리의 확률 밀도(가상의 값):", en: "Part 3 (28 points) — 500 halos (N_C = 500), 1000 satellites per halo on average (N_S = 1000). Probability density of distances between central galaxies of different halos (not real data):"}, table: tabCC,
       eq: ["ρ*_SS(R) = c₁ R (ρ*_CS(R))²", "ρ_CS(R) = c₂ R (ρ*_CS(R))² √(ρ_CC(R) + 1)", "ρ_SS(R) = c₃ R (ρ*_CS(R) (ρ_CC(R) − 5))²"]},
      {id: "3a", mk: "5", ko: "N_CC(중심–중심 쌍), N*_CS(같은 헤일로의 중심–위성 쌍), N_CS(다른 헤일로), N*_SS(같은 헤일로의 위성–위성 쌍), N_SS(다른 헤일로)를 구하세요.", en: "Calculate N_CC (central pairs), N*_CS (central–satellite pairs in the same halo), N_CS (in different halos), N*_SS (satellite pairs in the same halo) and N_SS (in different halos)."},
      {id: "3b", mk: "15", ko: "c₁, c₂, c₃로 정규화한 ρ*_SS, ρ_CS, ρ_SS를 구하세요.", en: "Calculate the normalised ρ*_SS, ρ_CS and ρ_SS."},
      {id: "3c", mk: "8", ko: "모든 분포를 알맞은 가중치로 합친 은하 쌍 전체의 확률 밀도를 구하고, 그림 1의 A–F 중 어느 것과 가장 닮았는지 고르세요.", en: "Combine all distributions with appropriate weights into the probability density of all galaxy pairs. Which of A–F in Figure 1 does it resemble most?"}],
