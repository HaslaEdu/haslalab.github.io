<style>

     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

</style>
</head>
<body>
<script>
/* RMPh 2018 experimental problem on the 3-D bench (no official solution was published).
   A: a plummet on a thread from a pin in the polystyrene plate, the grid behind it; T = 2π√(L/g) turns the
      grid's arbitrary unit into millimetres (here 1 a.u. ≈ 4 mm).
   B: the electron diffraction print of gold — an f.c.c. lattice, a = 4.08 Å, λ = 3.70 pm at 100 kV, L = 75 cm,
      the print enlarged 5.3 times in area — rings at D = 2Lλ√(h²+k²+l²)/a · √5.3 for 111, 200, 220, 311, 222,
      400, 331, 420; the transparent grid slides over it.
   C: the pipette's drops (σ ≈ 0.026 N/m, tip 1.6 mm, so V_p ≈ 15 µL) fill a round-bottomed test tube read
      against the grid; on talc-dusted water the stearic acid layer opens a clear circle, D_s ≈ 2.19√N cm as in
      the sheet's table. */
var PROGRAM = {
  title: { ko: 'RMPh 2018 실험 — 다결정과 단분자막', en: 'RMPh 2018 Problem — Polycrystals and monomolecular layers' },
  subtitle: { ko: '보정된 측정 기구는 스톱워치 하나뿐입니다. 간단한 물건들로 다결정 금, 스테아르산 단분자막, 탄소 원자의 성질을 구하고 기본 상수를 어림하세요. 장비: 스톱워치, 간격을 모르는 모눈 종이와 같은 모눈의 투명 판, 추, 스티로폼 판과 핀, 금 박막의 전자 회절 사진, 시험관 둘(하나에 용액), 피펫, 투명 판, 흰 종이, 마커, 물티슈, 폐액 그릇. 오차 계산은 하지 않습니다.',
              en: 'The only calibrated instrument is a stopwatch. With a few simple objects find properties of polycrystalline gold, of stearic acid monolayers and of the carbon atom, and estimate a fundamental constant. Equipment: a stopwatch, a sheet ruled with a grid of unknown spacing and a clear plastic sheet with the same grid, a plummet, a polystyrene plate and a pin, the electron diffraction image of a gold film, two test tubes (one with a solution), a pipette, a clear plastic sheet, white paper, a marker, wipes and a waste vessel. No error analysis is required.' },
  notes: { ko: [
    '과제 A: 모눈 간격(a.u.)을 mm 로 — 추의 진동 주기와 실 길이(a.u.)로. 과제 B: 100 kV 전자의 드브로이 파장, D_hkl·d_hkl = C·λ·L, 단순·면심·체심 입방의 고리 지름 비, 사진(넓이로 5.3 배 확대, L = 75 cm)의 고리 지름으로 구조와 격자 상수. 과제 C: 방울 부피, 피펫 끝 지름으로 표면장력, 막의 높이, 탄소 원자 하나의 높이, 아보가드로 수.',
    '문제지의 C.2 표: 방울 수 N = 5, 7, 9, 11, 13, 15, 17 에서 막 지름 4.9, 5.7, 6.5, 7.2, 7.9, 8.5, 9.0 cm. 스테아르산: 284 kg/kmol, 941 kg/m³, 단면적 21·10⁻²⁰ m², 용액 농도 0.02 kg/m³, 용매 878 kg/m³, g = 9.8 m/s².',
    '공식 해답은 공개되지 않았습니다. 여기 값: 1 a.u. ≈ 4 mm, 금은 면심 입방 a = 4.08 Å, 방울 ≈ 15 µL(피펫 끝 1.6 mm, σ ≈ 0.026 N/m). 편의상 모눈은 다섯 칸마다 조금 진합니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Task A: the grid spacing (a.u.) in mm — from the plummet\'s period and the thread length in a.u. Task B: the de Broglie wavelength at 100 kV, D_hkl·d_hkl = C·λ·L, the ring ratios of simple, face- and body-centred cubic, and from the print (enlarged 5.3 times in area, L = 75 cm) the structure and the lattice constant. Task C: the drop volume, the surface tension from the pipette tip, the layer\'s height, one carbon atom\'s height and Avogadro\'s number.',
    'The sheet\'s table C.2: drops N = 5, 7, 9, 11, 13, 15, 17 give layer diameters 4.9, 5.7, 6.5, 7.2, 7.9, 8.5, 9.0 cm. Stearic acid: 284 kg/kmol, 941 kg/m³, cross-section 21·10⁻²⁰ m², solution 0.02 kg/m³, solvent 878 kg/m³, g = 9.8 m/s².',
    'No official solution was published. Values here: 1 a.u. ≈ 4 mm, gold f.c.c. a = 4.08 Å, drop ≈ 15 µL (tip 1.6 mm, σ ≈ 0.026 N/m). For convenience every fifth grid line is a little darker. The values differ a little from visit to visit.'] }
};

var LAB = { sw: null, Lp: 30, th: 0, w: 0, gx: 6, gz: 6, pip: 0, tube: 0, glass: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위 왼쪽부터: 모눈 종이를 붙인 스티로폼 판과 핀에 매단 추, 금 회절 사진과 그 위의 투명 모눈 판, 시험관 둘(용액, 빈 것)과 피펫(뒤에 모눈 종이), 활석 가루를 뿌린 물이 담긴 시계 접시, 스톱워치.',
           en: 'On the desk from the left: the polystyrene plate with the grid paper and the plummet on a pin, the gold diffraction print with the clear grid sheet on it, the two test tubes (solution, empty) and the pipette (grid paper behind), a watch glass of water dusted with talc, and the stopwatch.' },
  howto: { ko: ['추 위아래로 끌기: 실 길이 바꾸기 · 추 클릭: 살짝 밀어 흔들기 · 스톱워치: <b>Space</b> · 스티로폼 판 클릭: 가까이',
                '투명 모눈 판 끌기: 사진 위에서 옮기기 · 사진 클릭: 위에서 가까이 (휠로 확대)',
                '용액 시험관 클릭: 피펫에 빨아들이기 · 빈 시험관 클릭: 한 방울 떨어뜨리기 · 시계 접시 클릭: 한 방울 · 물티슈 클릭: 접시의 물과 활석을 새로 · 폐액 그릇 클릭: 빈 시험관 비우기',
                '피펫 클릭: 끝을 모눈 위에서 가까이 보기 · 시험관 뒤 모눈 클릭: 액면 가까이'],
           en: ['Drag the plummet up/down: change the thread length · click it: nudge it into a swing · stopwatch: <b>Space</b> · click the polystyrene plate: closer',
                'Drag the clear grid sheet: move it over the print · click the print: look down closely (wheel to zoom)',
                'Click the solution tube: draw the pipette full · click the empty tube: let one drop fall · click the watch glass: one drop · click the wipes: fresh water and talc · click the waste vessel: empty the tube',
                'Click the pipette: look at its tip over the grid · click the grid behind the tubes: look at the level'] },
  notePlaceholder: { ko: '예) L = 62 a.u.: 10 T = 9.95 s …; 고리 지름 13.5, 15.6 … a.u.; 40 방울 → 액면 …', en: 'e.g. L = 62 a.u.: 10 T = 9.95 s …; ring diameters 13.5, 15.6 … a.u.; 40 drops → level …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var au = 0.40 * (1 + S.sys('au', 0.05)), g = 981, aAu = 4.078e-10 * (1 + S.sys('a', 0.005)), lam = 3.70e-12, Lcam = 0.75, enl = Math.sqrt(5.3);
    var Vp = 0.0152 * (1 + S.sys('Vp', 0.04)), rTube = 0.62, dTip = 0.16 * (1 + S.sys('tip', 0.04));
    var sw = LAB.sw = new B3.Stopwatch(0.04);
    var grid = function (w, h, px, clear) { var c = document.createElement('canvas'); c.width = Math.round(w * px); c.height = Math.round(h * px); c._static = true; var g2 = c.getContext('2d');
      g2.fillStyle = clear ? 'rgba(240,248,255,0.12)' : '#fbfaf3'; g2.fillRect(0, 0, c.width, c.height);
      var step = au * px; for (var i = 0; i * step <= c.width + 1; i++) { g2.fillStyle = i % 5 === 0 ? 'rgba(30,60,140,.8)' : 'rgba(60,90,170,.5)'; g2.fillRect(Math.round(i * step), 0, i % 5 === 0 ? 2 : 1, c.height); }
      for (i = 0; i * step <= c.height + 1; i++) { g2.fillStyle = i % 5 === 0 ? 'rgba(30,60,140,.8)' : 'rgba(60,90,170,.5)'; g2.fillRect(0, Math.round(i * step), c.width, i % 5 === 0 ? 2 : 1); }
      return c; };
    var plateGrid = grid(16, 64, 40), tubeGrid = grid(10, 16, 60), clearGrid = grid(18, 18, 60, true);
    var Ds = [3, 4, 8, 11, 12, 16, 19, 20].map(function (N) { return 2 * Lcam * lam * Math.sqrt(N) / aAu * enl * 100; });   /* cm on the print */
    var print = (function () { var c = document.createElement('canvas'); c.width = c.height = 1024; c._static = true; var g2 = c.getContext('2d'), P = 1024 / 17;
      g2.fillStyle = '#0d0d0f'; g2.fillRect(0, 0, 1024, 1024);
      var gr = g2.createRadialGradient(512, 512, 0, 512, 512, 60); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g2.fillStyle = gr; g2.beginPath(); g2.arc(512, 512, 60, 0, 7); g2.fill();
      var I = [1, 0.55, 0.45, 0.45, 0.2, 0.12, 0.25, 0.22];
      Ds.forEach(function (D, i) { var r = D / 2 * P; for (var k = 0; k < 900; k++) { var a = Math.random() * 6.283, rr = r + (Math.random() - 0.5) * 3.2; g2.fillStyle = 'rgba(235,235,225,' + (0.25 + 0.6 * I[i] * Math.random()).toFixed(2) + ')'; g2.fillRect(512 + Math.cos(a) * rr, 512 + Math.sin(a) * rr, 2, 2); }
        g2.strokeStyle = 'rgba(230,230,220,' + (0.35 * I[i] + 0.12).toFixed(2) + ')'; g2.lineWidth = 2.2; g2.beginPath(); g2.arc(512, 512, r, 0, 7); g2.stroke(); });
      g2.fillStyle = 'rgba(255,255,255,.75)'; g2.font = '700 20px sans-serif'; [1, 2, 3, 4, 5, 6, 7, 8].forEach(function (n, i) { var r = Ds[i] / 2 * P; g2.fillText(String(n), 512 + r * 0.72 + 4, 512 - r * 0.70); });
      return c; })();
    var talc = (function () { var c = document.createElement('canvas'); c.width = c.height = 256; c._static = true; var g2 = c.getContext('2d');
      g2.fillStyle = '#9ec3d8'; g2.fillRect(0, 0, 256, 256); for (var k = 0; k < 2600; k++) { g2.fillStyle = 'rgba(250,250,250,' + (0.5 + Math.random() * 0.5).toFixed(2) + ')'; g2.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); } return c; })();
    var PX = -26, PZ = -6, PINY = 58, TX = 14, TZ = -6, GX = 26, GZ = 6;
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '],
      home: { yaw: -0.25, pitch: 0.5, k: 6.4, tx: 4, ty: 18, tz: 0 },
      views: { plate: { yaw: 0, pitch: 0.02, k: 12, tx: PX, ty: 34, tz: PZ, title: { ko: '스티로폼 판과 모눈', en: 'The plate and the grid' },
                        hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · Esc: back' } },
               print: { yaw: 0, pitch: 1.5, k: 38, tx: -2, ty: 0, tz: 6, title: { ko: '회절 사진과 투명 모눈', en: 'The print and the clear grid' } },
               tip: { yaw: 0, pitch: 0.02, k: 120, tx: TX + 6, ty: 9.5, tz: TZ + 0.5, title: { ko: '피펫 끝 (모눈 앞)', en: 'The pipette tip (before the grid)' } },
               tubes: { yaw: 0, pitch: 0.05, k: 45, tx: TX + 3, ty: 4, tz: TZ, title: { ko: '시험관과 모눈', en: 'The tubes and the grid' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: -28, ty: 1.7, tz: 14, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        /* A: the plummet */
        var mp = b.screenMoved('bob'); if (mp[1]) { LAB.Lp = Math.max(8, Math.min(54, LAB.Lp + mp[1] / Math.max(0.3, Math.cos(B3.CAM.pitch)))); LAB.th = 0; LAB.w = 0; }
        if (b.clicked('m:bob')) { LAB.w = 0.12; }
        if (b.clicked('c:plate')) b.go('plate');
        var n = Math.max(1, Math.ceil(b.dt / 0.004)), h = b.dt / n;
        for (var i = 0; i < n; i++) { LAB.w += (-g / LAB.Lp * Math.sin(LAB.th) - 0.01 * LAB.w) * h; LAB.th += LAB.w * h; }
        /* B: the clear grid */
        var mg = b.moved('grid'); if (mg[0] || mg[1]) { LAB.gx = Math.max(-14, Math.min(8, LAB.gx + mg[0])); LAB.gz = Math.max(-4, Math.min(16, LAB.gz + mg[1])); }
        if (b.clicked('c:print')) b.go('print');
        /* C: pipette, tubes, watch glass */
        if (b.clicked('m:sol')) { LAB.pip = 1; b.say('피펫을 채웠습니다.', 'The pipette is full.'); }
        if (b.clicked('m:empty')) { if (LAB.pip) { LAB.tube += Vp; LAB.drop = 0.35; } else b.say('피펫이 비었습니다.', 'The pipette is empty.'); }
        if (b.clicked('m:glass')) { if (LAB.pip) { LAB.glass++; LAB.drop = 0.35; } else b.say('피펫이 비었습니다.', 'The pipette is empty.'); }
        if (b.clicked('m:wipes')) LAB.glass = 0;
        if (b.clicked('m:waste')) LAB.tube = 0;
        if (b.clicked('m:pip')) b.go('tip');
        if (b.clicked('c:tgrid')) b.go('tubes');
        LAB.drop = Math.max(0, (LAB.drop || 0) - b.dt);
        B3.desk(-40, 44, -18, 22);
        /* A */
        B3.box3(PX - 9, PX + 9, 0, 66, PZ - 2.2, PZ - 0.2, '#f4f4f4', { id: 'c:plate' });
        B3.tex3(plateGrid, 0, 0, plateGrid.width, plateGrid.height, [PX - 8, 65, PZ - 0.18], [16, 0, 0], [0, -64, 0], { id: 'c:plate' });
        B3.cylAB([PX, PINY, PZ - 0.2], [PX, PINY, PZ + 0.8], 0.08, '#c3c8cd', { seg: 6 }); B3.sphere3([PX, PINY, PZ + 0.85], 0.2, '#c0392b');
        var bx = PX + Math.sin(LAB.th) * LAB.Lp, by = PINY - Math.cos(LAB.th) * LAB.Lp;
        B3.line3([PX, PINY, PZ + 0.6], [bx, by, PZ + 0.6], '#222', 1.3);
        B3.cyl3('y', by - 1.6, by, bx, PZ + 0.6, 0.55, '#8a6a3a', { seg: 16, cap: '#9a7a4a', id: 'm:bob' }); B3.cylAB([bx, by - 1.6, PZ + 0.6], [bx, by - 2.4, PZ + 0.6], 0.25, '#8a6a3a', { seg: 10, id: 'm:bob' });
        /* B */
        B3.tex3(print, 0, 0, 1024, 1024, [-10, 0.02, -2.5], [17, 0, 0], [0, 0, 17], { id: 'c:print' });
        B3.tex3(clearGrid, 0, 0, clearGrid.width, clearGrid.height, [LAB.gx - 9, 0.05, LAB.gz - 9], [18, 0, 0], [0, 0, 18], { id: 'm:grid' });
        /* C: grid paper behind the tubes, the tubes, the pipette */
        B3.tex3(tubeGrid, 0, 0, tubeGrid.width, tubeGrid.height, [TX - 2, 16, TZ - 1.4], [10, 0, 0], [0, -16, 0], { id: 'c:tgrid' });
        B3.box3(TX - 2.4, TX + 8.4, 0, 1, TZ - 1.5, TZ + 1.5, '#a8743c', { top: '#b8844a' });
        [[TX + 1.5, 'm:sol', 6.0], [TX + 4.5, 'm:empty', 0]].forEach(function (tb) {
          B3.cyl3('y', 1.4, 13, tb[0], TZ, rTube + 0.06, 'rgba(225,235,240,.35)', { seg: 18, caps: false, id: tb[1] });
          B3.sphere3([tb[0], 1.4, TZ], rTube + 0.06, 'rgba(225,235,240,.35)', { id: tb[1] });
          var V = tb[1] === 'm:sol' ? 6.0 : LAB.tube, hemi = 2 / 3 * Math.PI * Math.pow(rTube, 3), lev;
          if (V > 0) { if (V <= hemi) { lev = rTube * (Math.cbrt(V / hemi) - 1); } else lev = (V - hemi) / (Math.PI * rTube * rTube);
            B3.sphere3([tb[0], 1.4, TZ], rTube - 0.02, 'rgba(245,235,190,.6)');
            if (lev > 0) B3.cyl3('y', 1.4, 1.4 + lev, tb[0], TZ, rTube - 0.02, 'rgba(245,235,190,.6)', { seg: 18, cap: 'rgba(250,240,200,.7)' }); }
        });
        var pipX = TX + 6, pipY = 10;
        B3.cylAB([pipX, pipY, TZ + 0.5], [pipX, pipY + 5, TZ + 0.5], 0.35, 'rgba(230,236,240,.75)', { seg: 14, id: 'm:pip' });
        B3.cylAB([pipX, pipY - 1.2, TZ + 0.5], [pipX, pipY, TZ + 0.5], dTip / 2 + 0.03, 'rgba(230,236,240,.75)', { seg: 12, id: 'm:pip' });
        B3.cylAB([pipX, pipY + 5, TZ + 0.5], [pipX, pipY + 7, TZ + 0.5], 0.5, '#c0392b', { seg: 14, id: 'm:pip' });
        if (LAB.pip) B3.cylAB([pipX, pipY - 1.1, TZ + 0.5], [pipX, pipY + 3, TZ + 0.5], 0.3, 'rgba(245,235,190,.7)', { seg: 12 });
        if (LAB.drop > 0) B3.sphere3([pipX, pipY - 1.4 - (0.35 - LAB.drop) * 20, TZ + 0.5], 0.15, 'rgba(245,235,190,.9)');
        /* the watch glass, wipes, waste */
        B3.cyl3('y', 0, 0.8, GX, GZ, 7, 'rgba(225,235,240,.4)', { seg: 36, caps: false, id: 'm:glass' });
        B3.tex3(talc, 0, 0, 256, 256, [GX - 6.6, 0.7, GZ - 6.6], [13.2, 0, 0], [0, 0, 13.2], { id: 'm:glass' });
        if (LAB.glass > 0) { var dS = 2.19 * Math.sqrt(LAB.glass) * (1 + S.sys('ds', 0.02)); B3.cyl3('y', 0.71, 0.72, GX, GZ, Math.min(6.5, dS / 2), '#9ec3d8', { seg: 40, cap: '#9ec3d8' }); }
        B3.box3(36, 42, 0, 2, -6, 0, '#e8eef2', { id: 'm:wipes', top: '#f4f8fa' });
        B3.cyl3('y', 0, 5, 38, -13, 2.2, 'rgba(200,205,210,.5)', { seg: 18, cap: 'rgba(210,215,220,.5)', id: 'm:waste' });
        B3.stopwatch(b, 'sw', [-28, 14], sw);
        b.views.plate.ty = PINY - LAB.Lp / 2;
        LAB.state = { Lp: LAB.Lp, T: 2 * Math.PI * Math.sqrt(LAB.Lp / g), au: au, Ds: Ds.map(function (d) { return +d.toFixed(2); }), tube: LAB.tube, glass: LAB.glass };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
