<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2013e1)>>>0);
const U=(a,b)=>a+(b-a)*rnd();
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const G_ACC=9.81, RHO_A=1.2, D_BALL=0.0395, ALPHA_W=4.5e-3, C1_TUNNEL=0.0873, R_BRIDGE=10.0, R_BLADE=0.055;
/* the hidden truth of this session */
const TR=(()=>{
  const t={};

  t.fan_k2=0.027070*U(0.94,1.06); t.fan_k1=-0.25702*U(0.92,1.08); t.fan_k0=2.886*U(0.92,1.08);
  t.fan_fmin=U(6.2,7.0); t.fan_Vmin=t.fan_k2*t.fan_fmin**2+t.fan_k1*t.fan_fmin+t.fan_k0;

  t.R0_wire=U(6.2,7.9); const Irun=U(0.188,0.200); t.k_wire=Irun**2*t.R0_wire; t.beta_wire=U(1.20,1.45); t.c_wire=U(0.748,0.792);

function netSolve(el){
  const idx={}; let n=0; const id=k=>k in idx?idx[k]:(idx[k]=n++);

  const stamp=(a,b,g)=>{ G[a][a]+=g; G[b][b]+=g; G[a][b]-=g; G[b][a]-=g; };
  for(const e of el){ const a=idx[e[1]], b=idx[e[2]];
    if(e[0]==="R") stamp(a,b,1/Math.max(1e-9,e[3]));
    else if(e[0]==="V"){ const g=1/Math.max(1e-6,e[4]); stamp(a,b,g); I[a]+=e[3]*g; I[b]-=e[3]*g; }
    else { stamp(a,b,1/e[4]); I[a]+=e[3]; I[b]-=e[3]; } }
  for(let i=0;i<n;i++) G[i][i]+=1e-12;
  for(let j=0;j<n;j++) G[0][j]=0; G[0][0]=1; I[0]=0;
  const M=G.map((r,i)=>[...r,I[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-18){ M[c][c]=1; continue; } [M[c],M[p]]=[M[p],M[c]]; const piv=M[c][c]; for(let j=c;j<=n;j++) M[c][j]/=piv;
    for(let r=0;r<n;r++) if(r!==c&&M[r][c]!==0){ const f=M[r][c]; for(let j=c;j<=n;j++) M[r][j]-=f*M[c][j]; } }
  const out={}; for(const k in idx) out[k]=M[idx[k]][n]; return out;
}

  if(tab==="side"&&ST.on.tunnel){
    if(CL.clips) for(const nm of ["A","B"]){ const [x,y]=CL.clips[nm]; if(Math.hypot(p[0]-x,p[1]-y)<12){ svDrag={clip:nm}; return; } }
    if(ST.on.ruler){ const wx=svWX(p[0]), wy=svWY(p[1]); const onR=RULER.vert?(Math.abs(wx-RULER.x)<16&&wy>=RULER.y&&wy<=RULER.y+500):(Math.abs(wy-RULER.y)<16&&wx>=RULER.x&&wx<=RULER.x+500);
      if(onR){ if(right){ RULER.vert=!RULER.vert; return; } svDrag={ruler:[wx-RULER.x,wy-RULER.y]}; return; } }
    if(CL.fanBlade&&SIM.fFan<0.05){ const [cx,cy,rr]=CL.fanBlade; if(Math.abs(p[0]-cx)<20&&Math.abs(p[1]-cy)<rr){ svDrag={blade:p[1]}; return; } }
    svDrag={pan:[svWX(p[0]),svWY(p[1])]}; }
});
closeCv.addEventListener("pointermove",e=>{ if(!svDrag) return; const p=clpos(e);
  if(svDrag.clip){ const v=Math.max(0,Math.min(50,(svWX(p[0])-20)/10)); if(svDrag.clip==="A") ST.clipA=v; else ST.clipB=v; }
  else if(svDrag.ruler){ RULER.x=svWX(p[0])-svDrag.ruler[0]; RULER.y=svWY(p[1])-svDrag.ruler[1]; }
  else if(svDrag.blade!==undefined){ ST.blade+=(p[1]-svDrag.blade)*1.2; svDrag.blade=p[1]; }
  else if(svDrag.pan){ SV.ox+=svDrag.pan[0]-svWX(p[0]); SV.oy+=svDrag.pan[1]-svWY(p[1]); } });
window.addEventListener("pointerup",()=>{ svDrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e); e.preventDefault();
  if(tab==="meters"){ const h=meterHit(p); if(!h) return; const dir=e.deltaY<0?1:-1;
    if(h.psu==="k15") ST.V15=Math.max(0,Math.min(15,+(ST.V15+dir*(e.shiftKey?0.01:0.1)).toFixed(3)));
    if(h.psu==="k9") ST.V9=Math.max(0,Math.min(9,+(ST.V9+dir*(e.shiftKey?0.01:0.1)).toFixed(3)));
    if(h.eb==="pot") ST.pot=Math.max(0,Math.min(1,+(ST.pot+dir*(e.shiftKey?0.0005:0.005)).toFixed(4)));
    if(h.dmm&&h.dial){ const D=ST.dmm[h.dmm], n=DMM_MODES[h.dmm].length; D.mode=Math.max(0,Math.min(n-1,D.mode-dir)); D.dt=0; }
    return; }
  const wx=svWX(p[0]), wy=svWY(p[1]); SV.s=Math.max(0.35,Math.min(14,SV.s*(e.deltaY<0?1.15:1/1.15))); SV.ox=wx-(p[0]-CLW/2)/SV.s; SV.oy=wy-(p[1]-CLH/2)/SV.s; },{passive:false});

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("wClear").onclick=()=>{ ST.wires=[]; ST.pend=null; say("cleared"); };
$("fuseBtn").onclick=()=>{ const k=ST.selDmm; if(!k){ say("fuseWhich"); return; }
  const D=ST.dmm[k]; if(D.fuse){ say("fuseOk"); return; } if(ST.spareFuse<=0){ say("noSpare"); return; } ST.spareFuse--; D.fuse=true; say("fuseNew"); };
$("hwBtn").onclick=()=>{ if(!ST.hwDead){ say("hwOk"); return; } if(ST.spareHw<=0){ say("noSpare"); return; } ST.spareHw--; ST.hwDead=false; say("hwNew"); };
$("noteBtn").onclick=()=>{ const parts=[1,2,3].filter(k=>ST.on["dmm"+k]&&ST.dmm[k].mode>0).map(k=>"#"+k+" "+DMM_MODES[k][ST.dmm[k].mode]+": "+(ST.dmm[k].disp||""));
  if(ST.on.psu&&ST.psOn) parts.push("PSU 15V "+ST.V15.toFixed(2)+" · 9V "+ST.V9.toFixed(2)); if(ST.on.tunnel) parts.push("clip A "+ST.clipA.toFixed(1)+" · B "+ST.clipB.toFixed(1)+" cm");
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>ST.on[k])) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pend) L.push([t.st.pend(termLabel(ST.pend)),false]);
  if(ST.on.hotwire&&ST.hwDead) L.push([t.st.dead,true]); else if(ST.on.hotwire&&wireDT(SIM.Rw||TR.R0_wire)>650) L.push([t.st.glow,true]);
  L.push([t.lab.spares(ST.spareFuse,ST.spareHw),false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-wire").textContent=t.hWire; $("wClear").textContent=t.clear; $("t-wirehint").textContent=t.wireHint;
  $("t-h-spare").textContent=t.hSpare; $("fuseBtn").textContent=t.fuse; $("hwBtn").textContent=t.hw; $("t-sparehint").textContent=t.spareHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2013 — 풍력과 그 계측 · HaslaLab":"APhO 2013 — Wind Power and Its Metrologies · HaslaLab";
  renderTabs(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0, solveT=0, bladePh=0, turbPh=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  solveT-=dt; if(solveT<=0){ SOL=solveRaw(); if(SOL) hazards(SOL); solveT=0.15; }
  for(const k of [1,2,3]){ const D=ST.dmm[k]; D.dt-=dt; if(D.dt<=0){ D.disp=readDMM(k); D.dt=0.45; if(SOL) SOL=solveRaw(); } }
  if(SIM.fFan>0.05) bladePh+=2*Math.PI*Math.min(SIM.fFan,9)*dt; else bladePh=ST.blade*Math.PI/180;
  turbPh+=2*Math.PI*Math.min(SIM.omegaT/(2*Math.PI),9)*dt;
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
