<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EuPhO 2024 실험 — 압전 현상의 물리 · Physics of Piezoelectricity · HaslaLab</title>
<meta name="description" content="EuPhO 2024 실험을 브라우저에서 실행합니다. 압전 소자, 멀티미터, 전지, 다이오드 달린 축전기, 누름 스위치를 직접 배선하고, 저울 위에서 누르거나 고무공을 떨어뜨려 전압·힘·튀어 오른 높이를 잽니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="EuPhO 2024 실험 — 압전 현상의 물리 · Physics of Piezoelectricity">
<meta property="og:description" content="EuPhO 2024 실험: 압전 소자와 고무공 충돌.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}

  if(cdrag.k==="rel"){ const v=V2("drop",{x0:2,z0:26,k:CLH/58}); setRel(cdrag.h+(v.iz(p[1])-cdrag.z)/100); return; } });
closeCv.addEventListener("pointerup",()=>{ if(cdrag&&cdrag.k==="press"){ ST.pressT=0; ST.pressing=false; } if(swHeld>=0){ CIR.sw[swHeld]=false; CIR.dirty=true; swHeld=-1; } cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2; closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="circuit"){
    if(right){ for(const [i,x,y] of WIREH) if(Math.hypot(p[0]-x,p[1]-y)<16){ CIR.wires.splice(i,1); CIR.dirty=true; say("unwired"); return; } if(h&&h.k==="dial"){ turnDial(-1); return; } SELT=null; return; }
    if(!h) { SELT=null; return; }
    if(h.k.startsWith("t:")){ const tm=h.k.slice(2); if(!SELT){ SELT=tm; say("termSel",termLabel(tm)); } else { addWire(SELT,tm); SELT=null; } return; }
    if(h.k==="dial"){ turnDial(1); return; }
    if(h.k.startsWith("sw")){ swHeld=+h.k.slice(2); CIR.sw[swHeld]=true; CIR.dirty=true; return; } return; }
  if(tab==="press"){ if(h&&h.k==="tare"){ doTare(); return; }
    if(!right&&PRS.x0!==undefined&&p[0]>=PRS.x0&&p[0]<=PRS.x1&&p[1]>=PRS.y0&&p[1]<=PRS.y1+10){ cdrag={k:"press",y:p[1]}; ST.pressing=true; return; }
    cdrag={k:"pan",p,v:[VW.press.px,VW.press.py]}; return; }
  if(tab==="drop"){ const hd=DRP.handle; if(hd&&p[0]>=hd[0]&&p[0]<=hd[0]+hd[2]&&p[1]>=hd[1]&&p[1]<=hd[1]+hd[3]&&!right){ const v=V2("drop",{x0:2,z0:26,k:CLH/58}); cdrag={k:"rel",z:v.iz(p[1]),h:ST.relH}; return; }
    cdrag={k:"pan",p,v:[VW.drop.px,VW.drop.py]}; return; } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function turnDial(dir){ if(!need("meter")) return; const i=DIAL.indexOf(CIR.dial); CIR.dial=DIAL[(i+dir+DIAL.length)%DIAL.length]; CIR.dirty=true; ST.mdispT=0; }
function doTare(){ if(!need("scales")) return; ST.tare=ST.scFilt/TRUE.g; say("tared"); }
function setRel(h){ if(!has("stand")) return; if(ST.ball) return; ST.relH=Math.max(0.04,Math.min(0.43,Math.round(h*1000)/1000)); }
const dsel=$("dial"); for(const dd of DIAL){ const o=document.createElement("option"); o.value=dd; o.textContent=dd==="OHM"?"Ω":dd; dsel.appendChild(o); }
dsel.onchange=()=>{ if(!need("meter")){ dsel.value=CIR.dial; return; } CIR.dial=dsel.value; CIR.dirty=true; };
for(let i=0;i<4;i++){ const b=$("s"+(i+1)); b.onpointerdown=()=>{ if(!need("switches")) return; CIR.sw[i]=true; CIR.dirty=true; }; b.onpointerup=b.onpointerleave=()=>{ if(CIR.sw[i]){ CIR.sw[i]=false; CIR.dirty=true; } }; }
$("clrW").onclick=()=>{ CIR.wires=[]; CIR.dirty=true; say("unwired"); };
$("tareBtn").onclick=doTare;
$("pzMove").onclick=()=>{ if(!need("piezo")) return; if(ST.pzOn==="scale"){ ST.pzOn="desk"; say("pzDesk"); } else { if(!need("scales")) return; ST.pzOn="scale"; ST.over="desk"; say("pzScale"); } };
$("stickBtn").onclick=()=>{ if(!need("piezo")||!need("sticks")) return; ST.stick=!ST.stick; say(ST.stick?"stickIn":"stickOut"); };
$("screwBtn").onclick=()=>{ if(!need("piezo")||!need("screw")) return; ST.screwOn=!ST.screwOn; say(ST.screwOn?"screw":"unscrew"); };
for(const [id,dv] of [["hm5",-0.05],["hm1",-0.01],["hm01",-0.001],["hp01",0.001],["hp1",0.01],["hp5",0.05]]) $(id).onclick=()=>{ if(!need("stand")) return; setRel(ST.relH+dv); };
$("ld1").onclick=()=>loadBall("ball1"); $("ld2").onclick=()=>loadBall("ball2");
$("overBtn").onclick=()=>{ if(ST.over==="piezo") ST.over="desk"; else { if(!need("piezo")) return; ST.over="piezo"; ST.pzOn="desk"; } };
$("slowBtn").onclick=()=>{ ST.slow=ST.slow===1?0.05:1; };
$("dropBtn").onclick=()=>{ if(!need("stand")) return; drop(); };
$("swGo").onclick=()=>{ if(!need("watch")) return; ST.swRun=!ST.swRun; }; $("swRst").onclick=()=>{ if(!ST.swRun) ST.sw=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  if(has("meter")){ ST.mdispT--; if(ST.mdispT<=0){ ST.mdisp=meterShow(); ST.mdispT=4; } $("mV").textContent=CIR.dial==="OFF"?"OFF":ST.mdisp+" "+(RANGES[CIR.dial]?RANGES[CIR.dial][4]:""); } else $("mV").textContent="—";
  if(dsel.value!==CIR.dial) dsel.value=CIR.dial;
  for(let i=0;i<4;i++) $("s"+(i+1)).className=CIR.sw[i]?"on":"";
  $("scV").textContent=has("scales")?(scaleShow()+" kg"):"—";
  $("pzMove").textContent=ST.pzOn==="scale"?t.pzToDesk:t.pzToScale; $("stickBtn").textContent=ST.stick?t.stickOut:t.stickIn; $("screwBtn").textContent=ST.screwOn?t.screwOff:t.screwOn;
  const rr=readRuler(ST.relH,0); $("relV").textContent=t.relV(rr===null?"—":(Math.round((ST.relH-TRUE.r0)*1000))+" mm",ST.over==="piezo"?t.overP.replace(/^.*: /,""):t.overD.replace(/^.*: /,""));
  $("overBtn").textContent=ST.over==="piezo"?t.overP:t.overD; $("slowBtn").textContent=ST.slow<1?t.slowOn:t.slowOff; $("slowBtn").className=ST.slow<1?"on":"";
  $("apexV").textContent=t.apex(ST.apex.map(a=>a===null?"—":a)); $("swV").textContent=has("watch")?swStr():"—"; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.press>100) L.push([t.st.over,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-m","hM"],["clrW","clrW"],["swHint","swHint"],["t-h-p","hP"],["tareBtn","tare"],["t-h-d","hD"],["ld1","ld1"],["ld2","ld2"],["dropBtn","drop"],["t-h-w","hW"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; advance(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
