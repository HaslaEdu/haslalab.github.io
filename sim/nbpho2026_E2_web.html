<meta name="description" content="NBPhO 2026 실험 문제 10 공 자석을 브라우저에서 실행합니다. 지름 10 mm 네오디뮴 공 자석의 자화 방향을 철판과 지구 자기장으로 찾아 표시하고, 레일 판을 기울여 지구 자기장의 세기를, 티타늄 진자를 끌어당겨 티타늄의 자화율을 구합니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);

/* ── small vector and rotation helpers ── */

/* ══════════════════════════════════════════════════════════════
   2.  THE FIELD: the Earth's, bent by the iron on the bench

const BE_VEC=(()=>{ const t=TRUE, h=Math.cos(t.dip), n=[Math.cos(t.north),-Math.sin(t.north),0];

/* ══════════════════════════════════════════════════════════════
   3.  THE BENCH STATE
   ══════════════════════════════════════════════════════════════ */
const POS={stand:[22,20],disk:[70,56],plate:[118,44],holder:[60,20],ruler:[34,62],tape:[60,30],marker:[150,62]};
const ST={ on:new Set(), R:randomR(), where:"box", marks:[], pen:"dot",
  plate:{az:0, h:0, raise:0, s:95, roll:0, tReact:0, rolled:false, fTrial:1, rulerFlat:false},
  pend:{hx:25, x:0, att:false, v:0, a:0, vset:0, dz:U(-2.2,2.2), adj:0, grip:"pin", eps:0, fTrial:1, theta:0, om:0, tapeUp:false},

const has=k=>ST.on.has(k);

/* the iron that bends the field: the stand's base and the disk, when they are on the bench */
IRON=()=>{ const L=[]; if(has("stand")) L.push([[POS.stand[0],POS.stand[1],0.8],9]); if(has("disk")) L.push([[POS.disk[0],POS.disk[1],0.25],3.2]); return L; };

/* where the ball sits now, in cm */
function ballPos(){ const w=ST.where;
  if(w==="disk") return [POS.disk[0],POS.disk[1],0.5+0.5];
  if(w==="table") return [POS.disk[0]-14,POS.disk[1]+6,0.5];
  if(w==="rails"){ const q=platePt(ST.plate.s/10,0); return [q[0],q[1],q[2]+0.5]; }

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const PL_W=8, PL_T=0.9;                             /* cm: width, thickness */

const plateBeta=()=>Math.asin(Math.min(0.9,ST.plate.h/TRUE.Lp));
/* a point on the plate's top surface: s along it from the foot (cm), w across it (cm) */
function platePt(s,w){ const d=plateDir(), n=[-d[1],d[0],0], b=plateBeta(), f=POS.plate;

  if(w==="pin"){ ST.R=alignAxis(ST.R,pinAxis()); return; }

/* ══════════════════════════════════════════════════════════════

  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];
  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]<=0.02) continue;

function vcyl(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();

function hcyl(p0,p1,z,r,col,hi){
  const a=P(p0[0],p0[1],z), b=P(p1[0],p1[1],z);
  ctx.lineCap="round"; ctx.strokeStyle=col; ctx.lineWidth=2*r*SC; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if(hi){ ctx.strokeStyle=hi; ctx.lineWidth=Math.max(0.8,r*SC*0.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]-r*SC*0.45); ctx.lineTo(b[0],b[1]-r*SC*0.45); ctx.stroke(); }

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){

  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }

const add2=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub2=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul2=(a,k)=>[a[0]*k,a[1]*k], dot2=(a,b)=>a[0]*b[0]+a[1]*b[1],

/* ══════════════════════════════════════════════════════════════

const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};

  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;

}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;

  if(has("holder")){ const pt=ST.where==="pin"?pinTip():[holderX(),0,TI_REST()[2]], bx=X(pt[0]*10), bz=pt[2]*10;
    vpoly(v,[[bx+4.5,bz-1.3],[bx+4.5+62,bz-1.3],[bx+4.5+62,bz+1.3],[bx+4.5,bz+1.3]],"#8d939a","#555",1);
    vpoly(v,[[bx+26,bz-10-Math.max(0,bz-20)*0],[bx+106,bz-10],[bx+106,bz+0],[bx+26,bz+0]].map(([a,c])=>[a,Math.max(0,c)]),"#c49a62","#8a6a3e",1);
    if(ST.where==="pin"){ const r=5*v.s, Xb=VX(v,bx), Yb=VY(v,bz); const g=ctx.createRadialGradient(Xb-r*0.35,Yb-r*0.4,r*0.05,Xb,Yb,r); g.addColorStop(0,"#fff"); g.addColorStop(0.35,"#c9cdd2"); g.addColorStop(1,"#5c636a"); circ(Xb,Yb,r,g,"#555",1); } }
  /* the measuring tape: on the table along the path, or held up beside the thread */
  if(has("tape")){ if(ST.pend.tapeUp) scaleBar(v,[-14,0],[0,1],1000,0,"#f2d13a","#b49a20","tape");
    else scaleBar(v,[-TRUE.tape0,-1],[1,0],600,0,"#f2d13a","#b49a20","tape"); }
  else text(L.noTape,CLW/2,24,"#7a5b2e",12,"center","600");
  if(cmouse[1]>0&&cmouse[0]>0){ ctx.strokeStyle="rgba(192,57,43,0.45)"; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(cmouse[0],0); ctx.lineTo(cmouse[0],CLH); ctx.moveTo(0,cmouse[1]); ctx.lineTo(CLW,cmouse[1]); ctx.stroke(); ctx.setLineDash([]); }
  text(t.pendHint,12,CLH-14,"#555",11,"left"); }
let cmouse=[-1,-1];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0);
  try{ if(tab==="ball") drawBallView(); else if(tab==="plate") drawPlateView(); else drawPendView(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   7.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ return pick3(p[0],p[1])||null; }
let drag=null;
const itemName=k=>d().items[k]||k;
/* put the ball somewhere; it settles at once */
function putBall(w){
  if(w==="disk"&&!has("disk")) { say("needFor",itemName("disk")); return false; }
  if(w==="rails"&&!has("plate")) { say("needFor",itemName("plate")); return false; }
  if(w==="pin"&&!has("holder")) { say("needFor",itemName("holder")); return false; }
  if(w==="pin"&&!has("stand")) { say("needFor",itemName("stand")); return false; }
  if(ST.where==="pin"&&w!=="pin"){ ST.pend.att=false; }
  ST.where=w; hand=null;
  if(w==="rails"){ const P=ST.plate; P.s=TRUE.Lp/2; P.roll=0; P.rolled=false; P.fTrial=Math.max(0.96,Math.min(1.03,gauss(1,0.013))); }
  if(w==="pin"){ const P=ST.pend; P.att=false; P.hx=25; P.theta=0; P.om=0; P.vset=0; P.v=0; }
  settleBall(0.01); say(w==="disk"?"onDisk":w==="table"?"onTable":w==="rails"?"onRails":"onPin"); setTab(w==="pin"?"pend":w==="rails"&&tab==="pend"?"plate":"ball"); return true; }
function benchClick(p,right,e){
  const k0=hitItem(p);
  if(hand){ const k=hand.item;
    if(right){ say("back",itemName(k)); if(k==="magnet") ST.where="box"; hand=null; return; }
    if(k==="magnet"){ const w=k0==="disk"?"disk":k0==="plate"?"rails":k0==="holder"||k0==="ti"?"pin":"table"; putBall(w); return; }
    if(k==="plate"||k==="disk"){ const q=unP(p[0],p[1],0); POS[k]=[Math.max(12,Math.min(158,q[0])),Math.max(10,Math.min(70,q[1]))]; }
    ST.on.add(k); hand=null; say("placed",itemName(k)); if(k==="plate") setTab("plate"); if(k==="stand") setTab("pend"); return; }
  let k=k0;
  if(!k||k==="table"){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(k==="ti") k="stand";
  if(right){ if(k==="magnet"){ ST.where="box"; ST.pend.att=false; say("back",itemName("magnet")); return; }
    if(k==="stand"||k==="holder"){ if(ST.where==="pin") ST.where="box"; ST.pend.att=false; }
    if(k==="plate"&&ST.where==="rails") ST.where="box"; if(k==="disk"&&ST.where==="disk") ST.where="box";
    ST.on.delete(k); say("back",itemName(k)); return; }
  if(k==="magnet"){ ST.pend.att=false; ST.where="hand"; hand={item:"magnet"}; say("picked",itemName("magnet")); return; }
  if(k==="plate"){ setTab("plate"); return; } if(k==="stand"||k==="holder"||k==="tape"){ setTab("pend"); return; }
  if(k==="disk"||k==="marker"){ setTab("ball"); return; }
  ST.on.delete(k); hand={item:k}; say("picked",itemName(k)); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.5,Math.min(1.5,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  const h=hitItem(p); cv.style.cursor=hand?"crosshair":h&&h!=="table"?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand){ const h=hitItem(lpos(e)); if(!h||h==="table") camReset(); } });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(2,Math.min(160,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ benchClick(mouse,true); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ if(hand.item==="magnet") ST.where="box"; hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); if(hand&&hand.item==="magnet"&&!same) ST.where="box"; hand=null;
    if(same&&k==="magnet") ST.where="box";
    if(!same&&trayAvail(k)){ hand={item:k}; if(k==="magnet") ST.where="hand"; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
let cdrag=null;
closeCv.addEventListener("wheel",e=>{ if(tab==="ball") return; e.preventDefault(); const v=viewOf(tab), p=clpos(e);
  const mx=v.cx+(p[0]-CLW/2)/v.s, my=v.cy-(p[1]-CLH/2)/v.s, f=e.deltaY<0?1.25:1/1.25; v.s=Math.max(0.05,Math.min(80,v.s*f));
  v.cx=mx-(p[0]-CLW/2)/v.s; v.cy=my+(p[1]-CLH/2)/v.s; },{passive:false});
closeCv.addEventListener("dblclick",()=>{ if(tab!=="ball") VW[tab]=null; });
closeCv.addEventListener("pointerleave",()=>{ cmouse=[-1,-1]; });
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(cdrag){ const v=viewOf(tab); v.cx=cdrag.v[0]-(cmouse[0]-cdrag.p[0])/v.s; v.cy=cdrag.v[1]+(cmouse[1]-cdrag.p[1])/v.s; } });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e); closeCv.setPointerCapture(e.pointerId);
  if(tab!=="ball"){ const v=viewOf(tab); cdrag={p,v:[v.cx,v.cy]}; return; }
  if(!BALL_C) return; const [cx,cy,R]=BALL_C, dx=(p[0]-cx)/R, dy=(p[1]-cy)/R, r2=dx*dx+dy*dy;
  if(e.button===2){ let bi=-1, bd=1e9; ST.marks.forEach((m,i)=>{ const q=mApply(ST.R,m.v); if(q[2]<=0) return; const dd=Math.hypot(q[0]-dx,q[1]-dy); if(dd<bd){ bd=dd; bi=i; } });
    if(bi>=0&&bd<0.4){ ST.marks.splice(bi,1); say("markDel"); } return; }
  if(r2>=1) return; if(!has("marker")){ say("noMarker"); return; }
  const w=[dx,dy,Math.sqrt(1-r2)]; ST.marks.push({k:ST.pen,v:mT(ST.R,w)}); say("markAdd",ST.pen); });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
const needBall=()=>{ if(ST.where==="box"||ST.where==="hand"){ say("needFor",itemName("magnet")); return false; } return true; };
$("wDisk").onclick=()=>putBall("disk"); $("wTable").onclick=()=>putBall("table"); $("wRails").onclick=()=>putBall("rails"); $("wPin").onclick=()=>putBall("pin");
$("flip").onclick=()=>{ if(!needBall()) return; const w=ST.where; ST.R=mOrtho(mRot(ST.R,[gauss(0,1),gauss(0,1),0],Math.PI)); ST.R=mOrtho(mRot(ST.R,[0,0,1],U(0,6.28)));
  if(w==="rails"){ ST.plate.rolled=false; ST.plate.roll=0; } if(w==="pin") ST.pend.att=false; settleBall(0.01); say("flip"); };
$("penDot").onclick=()=>{ ST.pen="dot"; }; $("penX").onclick=()=>{ ST.pen="x"; };
/* the invigilator looks at where the marks are against the true poles: N is where µ points */
$("hand").onclick=()=>{ if(!needBall()) return; const t=d(), Rmm=TRUE.R*1000, near=(k,pole)=>{ let best=null; for(const m of ST.marks){ if(m.k!==k) continue;
    const a=Math.acos(Math.max(-1,Math.min(1,v3dot(v3nrm(m.v),pole))))*Rmm; if(best===null||a<best) best=a; } return best; };
  const a=near("dot",[0,0,1]), b=near("x",[0,0,-1]), wrong=near("x",[0,0,1]);
  say("check",a===null?t.missing:t.off(a),b===null?t.missing:t.off(b),wrong!==null&&wrong<2.5?t.wrongX:""); };
for(const [id,a] of [["az-15",-15],["az-2",-2],["az2",2],["az15",15]]) $(id).onclick=()=>{ if(!need("plate")) return; ST.plate.az+=a*Math.PI/180; if(ST.where==="rails"&&ST.plate.h<0.05) settleBall(0.01); };
for(const [id,dh] of [["hm1",-1],["hp02",0.2],["hp1",1]]) $(id).onclick=()=>{ if(!need("plate")) return; ST.plate.raise=0; ST.plate.h=Math.max(0,Math.min(60,ST.plate.h+dh)); };
$("hSlow").onclick=()=>{ if(!need("plate")) return; ST.plate.raise=ST.plate.raise?0:0.5; };
$("hFlat").onclick=()=>{ if(!need("plate")) return; const P=ST.plate; P.raise=0; P.h=0; P.tReact=0; if(ST.where==="rails"){ P.s=TRUE.Lp/2; P.roll=0; P.rolled=false; P.fTrial=Math.max(0.96,Math.min(1.03,gauss(1,0.013))); settleBall(0.01); } say("flat"); };
$("rulerPos").onclick=()=>{ ST.plate.rulerFlat=!ST.plate.rulerFlat; };
$("adjUp").onclick=()=>{ if(!need("stand")) return; ST.pend.adj+=0.2; say("adj"); }; $("adjDn").onclick=()=>{ if(!need("stand")) return; ST.pend.adj-=0.2; say("adj"); };
$("gripPin").onclick=()=>{ ST.pend.grip="pin"; if(ST.pend.att) ST.pend.eps=0; say("grip"); }; $("gripHand").onclick=()=>{ ST.pend.grip="hand"; if(ST.pend.att) ST.pend.eps=U(0.25,0.6); say("grip"); };
for(const [id,v] of [["pull2",2],["pull6",6],["pull20",20]]) $(id).onclick=()=>{ if(ST.where!=="pin"){ say("needPin"); return; } ST.pend.vset=v; };
$("pullStop").onclick=()=>{ ST.pend.vset=0; ST.pend.v=0; };
$("back").onclick=()=>{ if(ST.where!=="pin"){ say("needPin"); return; } ST.pend.vset=-12; };
$("tapePos").onclick=()=>{ ST.pend.tapeUp=!ST.pend.tapeUp; };
function saveText(name,txt){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved"); }
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
$("noteSave").onclick=()=>{ saveText("NBPhO2026_P10_notebook.txt",$("note").value); };
function renderPanel(){ const t=d();
  $("penDot").className=ST.pen==="dot"?"on":""; $("penX").className=ST.pen==="x"?"on":"";
  $("hSlow").textContent=ST.plate.raise?t.hSlowOn:t.hSlowOff; $("hSlow").className=ST.plate.raise?"on":"";
  $("rulerPos").textContent=ST.plate.rulerFlat?t.rulerFlat:t.rulerUp; $("tapePos").textContent=ST.pend.tapeUp?t.tapeUp:t.tapeTable;
  $("gripPin").className=ST.pend.grip==="pin"?"on":""; $("gripHand").className=ST.pend.grip==="hand"?"on":"";
  for(const [id,v] of [["pull2",2],["pull6",6],["pull20",20]]) $(id).className=ST.pend.vset===v?"on":"";
  for(const [id,w] of [["wDisk","disk"],["wTable","table"],["wRails","rails"],["wPin","pin"]]) $(id).className=ST.where===w?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(ST.where==="box"&&!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.where==="rails"||ST.where==="table"){ const p=ballPos(); for(const [c,a] of IRON()) if(v3len(v3sub(p,c))<a*4.5){ L.push([t.st.iron,true]); break; } }
  if(ST.pend.att) L.push([t.st.att,false]);
  if(msg.key&&performance.now()-msg.t<12000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-mag","hMag"],["wDisk","wDisk"],["wTable","wTable"],["wRails","wRails"],["wPin","wPin"],["flip","flip"],["hand","hand"],
    ["t-h-plate","hPlate"],["hFlat","hFlat"],["t-h-pend","hPend"],["adjUp","adjUp"],["adjDn","adjDn"],["gripPin","gripPin"],["gripHand","gripHand"],["pull2","pull2"],["pull6","pull6"],["pull20","pull20"],["pullStop","pullStop"],["back","back"],
    ["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"]]) $(id).textContent=t[k];
  $("penDot").textContent=t.pen.dot; $("penX").textContent=t.pen.x;
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let rem=dt; while(rem>1e-9){ const h=Math.min(0.01,rem); step(h); rem-=h; }
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
