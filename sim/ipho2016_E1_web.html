<meta name="description" content="IPhO 2016 실험 1을 브라우저에서 실행합니다. 흑연 코팅 종이와 크로뮴 코팅 실리콘 웨이퍼 위에 스프링 핀 8개가 달린 플렉시글라스 판을 얹고, 직류 전압원으로 쓰는 신호 발생기와 두 멀티미터를 연결해 4탐침(4PP) 저항, 종이 폭에 따른 보정 인자, van der Pauw 측정을 직접 합니다. 계산은 대신 해주지 않습니다.">

const Grect=(x1,y1,x2,y2,W,L)=>Gstrip(x1,y1,x2,y2,W)+Gstrip(x1,y1,-x2,y2,W)+Gstrip(x1,y1,2*L-x2,y2,W);

/* sample coordinates: paper — origin at its near-left corner, x along the long side; wafer — origin at its centre, flat on the +x side */
function pinPos(i){ const a=ST.plate.ang*Math.PI/180, [x,y]=PIN_XY[i]; return [ST.plate.cx+x*Math.cos(a)-y*Math.sin(a), ST.plate.cy+x*Math.sin(a)+y*Math.cos(a)]; }

  return pins.map((p,i)=>pins.map((q,j)=>{ const [x1,y1]=pos[i], [x2,y2]=pos[j]; const g=s==="paper"?Grect(x1,y1,x2,y2,ST.paperW,TRUE.L0):Gdisc(x1,y1,x2,y2,WAFER_R); return rho*g+(i===j?TRUE.Rc[p]:0); })); }
/* the signal generator in DC mode: 0–5 V over 12 turns of the left potentiometer (3) */
const sgVolt=()=>ST.usb?Math.max(0,Math.min(5,5*ST.tv/12)):0;

/* the two digital multimeters (3½ digits), VΩmA and COM sockets */
const DMM_MODES=[["OFF",null,0,0],["200mV","V",0.2,0],["2V","V",2,0],["20V","V",20,0],["200V","V",200,0],["200µA","I",0.2,1000],["2mA","I",2,100],["20mA","I",20,10],["200mA","I",200,1]];
const modeOf=k=>DMM_MODES.find(m=>m[0]===ST.dmm[k].mode);

const TERMS=["SGV","SGM","SGG","M1V","M1C","M2V","M2C","Ra","Rb",...PINS];
function solveCircuit(){
  const par={}; const find=x=>{ if(!(x in par)) par[x]=x; while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  for(const t of TERMS) find(t); for(const [a,b] of ST.wires){ const ra=find(a), rb=find(b); if(ra!==rb) par[ra]=rb; }
  const roots=[...new Set(TERMS.map(find))], idx={}; roots.forEach((r,i)=>idx[r]=i); const N=roots.length, nd=t=>idx[find(t)];
  const Gm=[...Array(N)].map(()=>new Array(N).fill(0)), I=new Array(N).fill(0);
  const G=(a,b,g)=>{ const p=nd(a), q=nd(b); if(p===q) return; Gm[p][p]+=g; Gm[q][q]+=g; Gm[p][q]-=g; Gm[q][p]-=g; };
  const src=(a,b,v,r)=>{ G(a,b,1/r); const p=nd(a), q=nd(b); if(p===q) return; I[p]+=v/r; I[q]-=v/r; };
  if(ST.usb) src("SGV","SGG",sgVolt(),R_OUT);
  if(ST.usb&&ST.spk) src("SGM","SGG",sgMon(),1000); else G("SGM","SGG",1e-6);
  for(const k of [1,2]){ const m=modeOf(k); if(has("dmm"+k)&&m[1]) G("M"+k+"V","M"+k+"C",m[1]==="V"?1e-7:1/m[3]); }
  if(has("resistor")) G("Ra","Rb",1/TRUE.Rohm);
  const pins=contacting(); if(pins.length>=2){ const Y=indefY(sampleZ(pins)); if(Y) pins.forEach((p,i)=>pins.forEach((q,j)=>{ Gm[nd(PINS[p])][nd(PINS[q])]+=Y[i][j]; })); }
  for(let i=0;i<N;i++) Gm[i][i]+=1e-12;
  const g=nd("SGG"), keep=[...Array(N).keys()].filter(i=>i!==g), A=keep.map(i=>[...keep.map(j=>Gm[i][j]),I[i]]), n=keep.length;
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]]; const dd=A[c][c]; if(Math.abs(dd)<1e-30) continue;
    for(let j=c;j<=n;j++) A[c][j]/=dd; for(let r=0;r<n;r++) if(r!==c&&A[r][c]){ const f=A[r][c]; for(let j=c;j<=n;j++) A[r][j]-=f*A[c][j]; } }

const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;

function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }

function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);

function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }

function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;

  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }

closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const p=cmouse, s=curView(); if(!s) return; const m=smMap(s), dx=(p[0]-cdrag.p[0])/m.z, dy=-(p[1]-cdrag.p[1])/m.z;
  if(cdrag.what==="plate"){ ST.plate.cx=cdrag.x+dx; ST.plate.cy=cdrag.y+dy; }
  else if(cdrag.what==="ruler"){ ST.ruler.x=cdrag.x+dx; ST.ruler.y=cdrag.y+dy; } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2, h=hitAt(p);
  if(tab==="sample"&&ST.cutMode&&!right&&curView()==="paper"){ const m=smMap("paper"), [x,y]=m.U(p); if(x>=0&&x<=TRUE.L0&&y>0&&y<ST.paperW){ ST.cutY=Math.round(y*2)/2; say("line"); return; } }
  if(!h) return;
  if(h.k.startsWith("T:")){ termClick(h.k.slice(2),right); return; }
  if(h.k.startsWith("D:")){ const [,k,md]=h.k.split(":"); ST.dmm[k].mode=md; return; }
  if(h.k==="usb"){ toggleUsb(); return; } if(h.k==="spk"){ toggleSpk(); return; }
  if(h.k.startsWith("pv:")||h.k.startsWith("pa:")){ turnPot(h.k.slice(0,2),h.k[3]==="+"?0.25:-0.25); return; }
  if(h.k.startsWith("view:")){ view=h.k.slice(5); return; }
  if(h.k.startsWith("pin:")){ const i=+h.k.slice(4); ST.plate.down[i]=!ST.plate.down[i]; say(ST.plate.down[i]?"pinDn":"pinUp",PINS[i]); return; }
  if(right) return;
  if(h.k==="ruler"){ cdrag={what:"ruler",p,x:ST.ruler.x,y:ST.ruler.y}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="plate"){ cdrag={what:"plate",p,x:ST.plate.cx,y:ST.plate.cy}; ST.plate.down.fill(false); closeCv.setPointerCapture(e.pointerId); return; }
  if((h.k==="paper"||h.k==="wafer")&&hand&&hand.item==="plate"&&!hand.move){ if(putPlateOn(h.k)) hand=null; return; } });
closeCv.addEventListener("wheel",e=>{ if(tab!=="sample"||!(ST.plate.on&&has("plate"))) return; e.preventDefault(); ST.plate.ang=((ST.plate.ang+(e.deltaY<0?1:-1))%360+360)%360; ST.plate.down.fill(false); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("usbBtn").onclick=toggleUsb; $("spkBtn").onclick=toggleSpk;
for(const [id,dt] of [["v-1",-1],["v-q",-0.25],["vq",0.25],["v1",1]]) $(id).onclick=()=>turnPot("pv",dt);
for(const [id,da] of [["rot-15",-15],["rot-1",-1],["rot1",1],["rot15",15]]) $(id).onclick=()=>{ if(!(ST.plate.on&&has("plate"))){ say("needPlate"); return; } ST.plate.ang=((ST.plate.ang-da)%360+360)%360; ST.plate.down.fill(false); };
$("pinsDn").onclick=()=>{ if(!(ST.plate.on&&has("plate"))){ say("needPlate"); return; } ST.plate.down.fill(true); setTab("sample"); };
$("pinsUp").onclick=()=>{ ST.plate.down.fill(false); };
$("plateOff").onclick=()=>{ if(!(ST.plate.on&&has("plate"))){ say("needPlate"); return; } const s=ST.plate.on; liftPlate();
  /* set it down on a free spot of the bench */
  for(let x=10;x<92;x+=3) for(let y=8;y<46;y+=3) if(fits("plate",x,y)){ ST.pos.plate={x,y}; say("plateOff"); return; } ST.on.delete("plate"); dropWiresOf(t=>t[0]==="P"); say("back",itemName("plate")); };
$("cutMode").onclick=()=>{ if(ST.cutMode){ ST.cutMode=false; return; } if(!has("scissors")){ say("needScissors"); return; } if(!has("paper")){ say("needPaper"); return; } ST.cutMode=true; view="paper"; setTab("sample"); };
$("cutBtn").onclick=()=>{ if(!has("scissors")){ say("needScissors"); return; } if(!has("paper")){ say("needPaper"); return; } if(ST.plate.on==="paper"&&has("plate")){ say("liftFirst"); return; }
  if(ST.cutY===null){ say("noLine"); return; } if(ST.cutY<4||ST.cutY>ST.paperW-1){ say("badCut"); return; }
  const nw=ST.cutY+gauss()*0.4; /* the narrower sheet keeps its near edge */
  ST.pos.paper.y+=(ST.paperW-nw)/20; ST.paperW=nw; ST.cuts++; ST.cutY=null; ST.cutMode=false; say("cut"); };
$("rulBtn").onclick=()=>{ if(ST.ruler.on){ ST.ruler.on=false; return; } if(!has("ruler")){ say("needRuler"); return; } ST.ruler.on=true; const s=curView(); if(s==="wafer"){ ST.ruler.x=-60; ST.ruler.y=-70; } else { ST.ruler.x=0; ST.ruler.y=-32; } setTab("sample"); };
$("rulRot").onclick=()=>{ if(!has("ruler")){ say("needRuler"); return; } ST.ruler.on=true; ST.ruler.rot=ST.ruler.rot?0:90; if(ST.ruler.rot){ ST.ruler.x=curView()==="wafer"?-64:-2; ST.ruler.y=curView()==="wafer"?-60:-2; } else { ST.ruler.x=curView()==="wafer"?-60:0; ST.ruler.y=curView()==="wafer"?-70:-32; } };
$("leadClr").onclick=()=>{ ST.wires=[]; ST.sel=null; };
const unit=k=>{ const m=modeOf(k); return !m[1]?"":m[0]==="200µA"?" µA":m[0]==="200mV"?" mV":m[1]==="I"?" mA":" V"; };
const shown=k=>has("dmm"+k)&&ST.read[k]?(ST.read[k].startsWith("1   ")?"1":ST.read[k])+unit(k):"----";
$("noteBtn").onclick=()=>{ const n=$("note"), s=["1","2"].map(k=>"DMM"+k+": "+(ST.read[k]?shown(k):"—")).join("   ");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s+"   "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d();
  for(const k of ["1","2"]) $("d"+k).textContent=k+"  "+shown(k);
  $("usbBtn").textContent=ST.usb?t.usbOn:t.usbOff; $("spkBtn").textContent=ST.spk?t.spkOn:t.spkOff;
  $("plateHint").textContent=t.plateHint(ST.plate.on&&has("plate")?t.lab[ST.plate.on]:"");
  $("cutMode").textContent=ST.cutMode?t.cutOn:t.cutOff; $("rulBtn").textContent=ST.ruler.on?t.rulOn:t.rulOff;
  const box=$("leadList"); box.innerHTML=ST.wires.length?ST.wires.map(([a,b],i)=>"<div><span style='color:"+WCOL[i%WCOL.length]+"'>●</span> "+tName(a)+" ↔ "+tName(b)+"</div>").join(""):t.noLead; }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.sel) L.push([t.st.sel(tName(ST.sel)),false]);
  if(ST.cutMode) L.push([t.st.cut,false]);
  const c=contacting(); if(ST.plate.on&&has("plate")) L.push([t.st.pins(c.length?c.map(i=>PINS[i]).join(" "):"—"),false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-meters").textContent=t.hMeters; $("t-h-sg").textContent=t.hSg; $("sgHint").textContent=t.sgHint; $("t-h-plate").textContent=t.hPlate;
  $("pinsDn").textContent=t.pinsDn; $("pinsUp").textContent=t.pinsUp; $("plateOff").textContent=t.plateOff; $("t-h-tools").textContent=t.hTools; $("cutBtn").textContent=t.cutBtn; $("rulRot").textContent=t.rulRot;
  $("t-h-leads").textContent=t.hLeads; $("leadClr").textContent=t.leadClr; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2016 E1 — 2차원 전기 전도도 · HaslaLab":"IPhO 2016 E1 — Electrical Conductivity in 2D · HaslaLab";
  renderTabs(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastRead=0;
function tick(){
  const now=performance.now(); if(now-lastRead>350){ lastRead=now; readMeters(); }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
