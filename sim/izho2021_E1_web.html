<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>

<body>
<script>
/* IZhO 2021 on the 3-D bench.  The sheet is a computer experiment done by hand (splitting φ₀ → 0 into N
   uniformly accelerated pieces); this bench is the real experiment it stands for: a small heavy ball on a thread,
   integrated exactly (φ'' = −(g/l)·sin φ, very light air damping), a protractor at the pivot and a light gate under
   it whose timer shows one full period (between the 1st and 3rd interruptions).  Official: T(φ₀)/T₀ = 1 + φ₀²/b,
   b ≈ 14, a = 1; T(90°)/T₀ = 1.18; "small" up to ≈ 45° at 5 %. */
var PROGRAM = {
  title: { ko: 'IZhO 2021 실험 — 수학 진자 (계산 실험)', en: 'IZhO 2021 — A mathematical pendulum (computer experiment)' },
  subtitle: { ko: '문제지는 수학 진자의 주기가 진폭(최대 기울기 각) φ₀ 에 따라 어떻게 변하는지 “계산 실험”으로 조사합니다: 무차원 시간 τ = t√(g/l), φ₀ 에서 0 까지를 N 개의 등가속 구간으로 나누어 T_N 을 손으로 계산하고, 오차 ε_N = C/N^γ, T(φ₀) = T₀(a + φ₀²/b) 를 구합니다. 이 책상에서는 같은 의존성을 실제 진자로 재어 볼 수 있습니다.',
              en: 'The sheet studies by a "computer experiment" how the period of a mathematical pendulum depends on its amplitude φ₀: dimensionless time τ = t√(g/l), the way from φ₀ to 0 split into N uniformly accelerated pieces, T_N by hand, the error ε_N = C/N^γ and T(φ₀) = T₀(a + φ₀²/b). On this desk the same dependence can be measured with a real pendulum.' },
  notes: { ko: [
    '과제: 1 T₀ = 2π√(l/g), ω(φ) = √(2g(cosφ − cosφ₀)/l), t₁ = ∫dφ/ω, T = 4t₁, 무차원 T̃₀ = 2π, ω̃ = √(2(cosφ − cosφ₀)). 2 Δφ = φ₀/N, φ_k, ω_k, 구간 시간 Δt_k = 2Δφ/(ω_{k−1} + ω_k), T_N = 4Σ Δt_k. 3 φ₀ = π/2 에서 N = 1…32, 법칙 φ(t), ε_N 와 C, γ, N_min. 4 φ₀ = 15°…90° 의 T, a, b, “작은” 각.',
    '공식 해답: T₁₆ = 7.4197, T₃₂ = 7.4171 (φ₀ = 90°, 무차원; 2π·1.1803 = 7.4163); γ ≈ 2.3, C ≈ 0.19, N_min = 8. T/T₀ = 1.0127 (15°), 1.0255 (30°), 1.0474 (45°), 1.0796 (60°), 1.1238 (75°), 1.1826 (90°) → a = 1, b ≈ 14, 5 % 에서 φ₀ ≲ 45°.',
    '실제 진자의 주기 측정기는 공의 그림자가 광센서를 세 번째 가릴 때까지의 시간(한 주기)을 보여 줍니다. 공기 저항은 아주 작아 진폭이 천천히 줄어듭니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 T₀ = 2π√(l/g), ω(φ) = √(2g(cosφ − cosφ₀)/l), t₁ = ∫dφ/ω, T = 4t₁, dimensionless T̃₀ = 2π, ω̃ = √(2(cosφ − cosφ₀)). 2 Δφ = φ₀/N, φ_k, ω_k, the piece time Δt_k = 2Δφ/(ω_{k−1} + ω_k), T_N = 4Σ Δt_k. 3 at φ₀ = π/2, N = 1…32, the law φ(t), ε_N with C, γ, N_min. 4 T for φ₀ = 15°…90°, a, b, the "small" angles.',
    'Official solution: T₁₆ = 7.4197, T₃₂ = 7.4171 (φ₀ = 90°, dimensionless; 2π·1.1803 = 7.4163); γ ≈ 2.3, C ≈ 0.19, N_min = 8. T/T₀ = 1.0127 (15°), 1.0255 (30°), 1.0474 (45°), 1.0796 (60°), 1.1238 (75°), 1.1826 (90°) → a = 1, b ≈ 14, φ₀ ≲ 45° at 5 %.',
    'The real pendulum\'s timer shows the time until the ball cuts the light gate for the third time (one period). Air drag is very small, so the amplitude dies slowly. The values differ a little from visit to visit.'] }
};

var LAB = { l: 50, ph: 0, w: 0, held: false, n: 0, tA: null, T: null, T0: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 받침대의 축에 매단 실과 쇠공(실 길이 조절), 축 둘레의 각도기, 맨 아래 광센서와 주기 측정기, 스톱워치.',
           en: 'On the desk: the thread and steel ball hung from the stand\'s pivot (adjustable length), a protractor about the pivot, the light gate at the bottom with its period timer, and a stopwatch.' },
  howto: { ko: ['공을 끌기: 각도기 위에서 원하는 각까지 들어 올리기 — 놓으면 그대로 출발합니다 · 공 클릭: 붙잡아 세우기',
                '축 위에서 휠: 실 길이 1 cm 씩 (Shift: 1 mm) · 각도기 클릭: 가까이 · 측정기 클릭: 가까이, RESET',
                '스톱워치 <b>Space</b>'],
           en: ['Drag the ball: lift it to the angle you want on the protractor — it starts as you let go · click the ball: catch it',
                'Wheel over the pivot: thread length by 1 cm (Shift: 1 mm) · click the protractor: close up · click the timer: close up, RESET',
                'Stopwatch <b>Space</b>'] },
  notePlaceholder: { ko: '예) l = 50 cm: φ₀ = 15° T = 1.433 s, 30° 1.451 s …', en: 'e.g. l = 50 cm: φ₀ = 15° T = 1.433 s, 30° 1.451 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var G = 981 * (1 + S.sys('g', 0.002)), YP = 70, sw = new B3.Stopwatch(0.04);
    var prot = (function () { var c = document.createElement('canvas'); c.width = 600; c.height = 320; c._static = true; var g = c.getContext('2d');
      g.fillStyle = 'rgba(240,242,236,.88)'; g.beginPath(); g.moveTo(300, 20); g.arc(300, 20, 290, 0, Math.PI); g.closePath(); g.fill(); g.strokeStyle = '#222'; g.fillStyle = '#222'; g.textAlign = 'center'; g.font = '700 15px sans-serif';
      for (var i = -90; i <= 90; i++) { var a = Math.PI / 2 - i * Math.PI / 180, r1 = i % 10 === 0 ? 240 : i % 5 === 0 ? 260 : 272; g.lineWidth = i % 10 === 0 ? 2 : 1;
        g.beginPath(); g.moveTo(300 + Math.cos(a) * r1, 20 + Math.sin(a) * r1); g.lineTo(300 + Math.cos(a) * 288, 20 + Math.sin(a) * 288); g.stroke();
        if (i % 10 === 0) g.fillText(String(Math.abs(i)), 300 + Math.cos(a) * 222, 25 + Math.sin(a) * 222); } return c; })();
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '], wheelIds: ['piv'], moveY: 0,
      home: { yaw: -0.2, pitch: 0.2, k: 6.5, tx: 6, ty: 40, tz: 0 },
      views: { prot: { yaw: 0, pitch: 0.02, k: 12, tx: 0, ty: YP - 22, tz: 0, title: { ko: '각도기', en: 'Protractor' } },
               tim: { yaw: 0, pitch: 1.2, k: 40, tx: 30, ty: 3, tz: 12, title: { ko: '주기 측정기', en: 'Period timer' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 44, ty: 1.7, tz: 10, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        var wv = b.wheel('piv'); if (wv) { LAB.l = Math.max(20, Math.min(62, Math.round((LAB.l + wv) * 10) / 10)); b.say('실 길이 ' + LAB.l.toFixed(1) + ' cm', 'Thread ' + LAB.l.toFixed(1) + ' cm'); }
        if (b.clicked('c:prot')) b.go('prot');
        if (b.clicked('m:ball')) { LAB.held = true; LAB.w = 0; LAB.ph = LAB.ph; }
        var bp0 = [Math.sin(LAB.ph) * LAB.l, YP - Math.cos(LAB.ph) * LAB.l];
        if (b.dragging('ball')) { var p = b.pointer(), m = b.mouseOn(0); var sm = b.screenMoved('ball');
          var bx = bp0[0] + sm[0], by = bp0[1] - sm[1]; LAB.ph = Math.max(-Math.PI * 0.75, Math.min(Math.PI * 0.75, Math.atan2(bx, YP - by))); LAB.held = true; LAB.w = 0; LAB.drag = true; }
        else if (LAB.drag) { LAB.drag = false; LAB.held = false; LAB.n = 0; LAB.tA = null; LAB.T = null; }
        if (!LAB.held && b.dt > 0) { var n = Math.ceil(b.dt / 0.0005), h = b.dt / n, k = G / LAB.l;
          for (var i = 0; i < n; i++) { var p0 = LAB.ph; LAB.w += (-k * Math.sin(LAB.ph) - 0.004 * LAB.w) * h; LAB.ph += LAB.w * h;
            if (p0 * LAB.ph < 0 || (p0 !== 0 && LAB.ph === 0)) { var tc = b.t - b.dt + (i + 1) * h; LAB.n++;
              if (LAB.n === 1) LAB.tA = tc; else if (LAB.n === 3) { LAB.T = Math.round((tc - LAB.tA) * 1000) / 1000; } } } }
        B3.desk(-36, 56, -18, 20);
        /* the stand, pivot, protractor */
        B3.box3(-10, 10, 0, 2, -14, -6, '#3b4048', { top: '#474c55' });
        B3.cylSeg('y', 2, YP + 6, 0, -10, 0.8, '#c3c8cd', { seg: 14, cap: '#dde1e4' }, 6);
        B3.cyl3('z', -10, 0.6, 0, YP, 0.7, '#9aa0a6', { seg: 12, cap: '#b5bbc1', id: 'm:piv' });
        B3.tex3(prot, 0, 0, 600, 320, [-29, YP + 1, -1.2], [58, 0, 0], [0, -30.9, 0], { id: 'c:prot' });
        /* thread and ball */
        var bp = [Math.sin(LAB.ph) * LAB.l, YP - Math.cos(LAB.ph) * LAB.l, 0];
        B3.line3([0, YP, 0], bp, '#f0f0f0', 1.3);
        B3.cyl3('z', -1.2, 1.2, bp[0], bp[1], 1.2, '#b8bcc2', { seg: 16, cap: '#d0d4d8', id: 'm:ball' });
        /* the light gate under the pivot */
        var gy = YP - LAB.l; B3.box3(-1.5, 1.5, 0, Math.max(1, gy - 2), -6, -4, '#2b2f35'); B3.box3(-1.5, 1.5, 0, Math.max(1, gy - 2), 4, 6, '#2b2f35');
        B3.box3(-1.5, 1.5, 0, 1, -6, 6, '#2b2f35');
        B3.line3([0, gy, -4], [0, gy, 4], Math.abs(bp[0]) < 1.2 ? 'rgba(255,60,60,.25)' : 'rgba(255,60,60,.8)', 1.2);
        B3.box3(22, 38, 0, 4, 7, 17, '#2b2f35', { top: '#33373e', id: 'p:tim' });
        var cv = b.panel('tim', 320, 200, function (ui) { var g = ui.g; HL.rr(g, 0, 0, 320, 200, 10, '#33373e');
          HL.rr(g, 16, 16, 288, 90, 6, '#0d1210'); HL.text(g, 'T = ' + (LAB.T === null ? '-.---' : LAB.T.toFixed(3)) + ' s', 160, 61, '#ff6a4a', 32, 'center', '700', HL.MONO);
          HL.text(g, 'PERIOD', 30, 128, '#c8ced6', 13, 'left', '800');
          var r = HL.button(ui, 'rst', 180, 136, 110, 44, { label: 'RESET', col: '#b83a32', size: 14 }); if (r.press) { LAB.n = 0; LAB.tA = null; LAB.T = null; } });
        B3.tex3(cv, 0, 0, cv.width, cv.height, [22.5, 4.01, 7.5], [15, 0, 0], [0, 0, 9], { id: 'p:tim' });
        B3.cable([22, 2, 10], [1.5, 0.5, 5], '#1b1b1b', 1, 1.6);
        B3.stopwatch(b, 'sw', [44, 10], sw);
        LAB.state = { l: LAB.l, phi: LAB.ph * 180 / Math.PI, T: LAB.T };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
