<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}

     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

</style>

<body>
<script>
/* RMPh 2014 problem 1 on the 3-D bench.  The can hangs on two threads of length L from holes at the ends of a
   diameter of its rim (a bifilar suspension).  Small twists oscillate with 4π²/T² = g a² m_k/(J L): the water
   is an ideal fluid and does not turn with the can, so it adds to the mass m_k = m + k·m₁ but not to J — hence
   4π²/T² = B + A·k is a straight line in the number k of syringe portions.  Dimensions after the official
   solution: a = 32, b = 100, t = 0.30, L = 440 a.u. with 1 a.u. ≈ 0.96 mm; m ≈ 48 g, ρ ≈ 6.9·10³ kg/m³,
   v ≈ 11 cm³, B ≈ 26 s⁻², A ≈ 5.7 s⁻². */
var PROGRAM = {
  title: { ko: 'RMPh 2014 실험 1 — 크로노미터로 길이·질량·밀도', en: 'RMPh 2014 Problem 1 — Length, mass and density with a chronometer' },
  subtitle: { ko: '크로노미터와 임의 단위(a.u.)로 줄이 그어진 종이만으로 깡통의 크기를 미터로, 질량을 킬로그램으로, 재료의 밀도를 SI 로 구하세요. 장비: 한쪽이 막힌 깡통, 간격을 모르는 등간격 줄 종이, 크로노미터, 질량을 무시할 수 있는 실, 매달기 틀, 물통, 눈금 주사기(한 칸 = 부피의 1/5, “기본 부피”), 이쑤시개. g = 9.8 m/s², 물의 밀도 1.0·10³ kg/m³.',
              en: 'With only a chronometer and a sheet ruled in arbitrary units (a.u.), find the can\'s dimensions in metres, its mass in kilograms and its material\'s density in SI units. Equipment: a can closed at one end, a sheet with equidistant lines of unknown spacing, a chronometer, a massless thread, a suspension template, a water tank, a syringe with divisions (one division = 1/5 of its volume, the "elementary volume") and a toothpick. g = 9.8 m/s², water 1.0·10³ kg/m³.' },
  notes: { ko: [
    '문제지의 이론(과제 1): 두 실(길이 L)에 매단 반지름 a 의 깡통을 작게 비틀면 단진동하며, 물은 점성이 없는 이상 유체라 깡통과 함께 돌지 않으므로 4π²/T² = B + A·k (k 는 넣은 기본 부피의 수).',
    '공식 해답의 예: a = 32, b = 100, t = 0.30 (판 10 장 묶음으로), L = 440 a.u.; B ≈ 26 s⁻², A ≈ 5.7 s⁻² → L = 0.42 m, 1 a.u. ≈ 0.96 mm, m ≈ 48 g, ρ ≈ 6.9·10³ kg/m³, v ≈ 1.1·10⁻⁵ m³ (가득 채우려면 N ≈ 30 칸).',
    '편의상 종이는 열 줄마다 조금 진합니다. 종이를 클릭하면 줄 방향을 돌릴 수 있습니다(가로 길이 재기). 값은 방문할 때마다 조금 다릅니다.'], en: [
    'The sheet\'s theory (task 1): the can of radius a hung on two threads of length L oscillates harmonically under small twists; the water is ideal and does not turn with the can, so 4π²/T² = B + A·k (k the number of elementary volumes added).',
    'The official example: a = 32, b = 100, t = 0.30 (from the stack of 10 sheets), L = 440 a.u.; B ≈ 26 s⁻², A ≈ 5.7 s⁻² → L = 0.42 m, 1 a.u. ≈ 0.96 mm, m ≈ 48 g, ρ ≈ 6.9·10³ kg/m³, v ≈ 1.1·10⁻⁵ m³ (N ≈ 30 divisions to fill it).',
    'For convenience every tenth line of the sheet is a little darker. Click the sheet to turn its lines (for horizontal lengths). The values differ a little from visit to visit.'] }
};

var LAB = { k: 0, th: 0, w: 0, held: false, rot: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드 팔의 매달기 틀에 두 실로 매단 깡통, 그 뒤에 세운 줄 종이(a.u.), 금속 판 10 장 묶음, 눈금 주사기와 물통, 크로노미터.',
           en: 'On the desk: the can hung on two threads from the template on a stand\'s arm, the ruled sheet (a.u.) standing behind it, a stack of 10 metal sheets, the syringe with the water tank and the chronometer.' },
  howto: { ko: ['깡통(이쑤시개) 좌우로 끌기: 비틀기 — 놓으면 진동 · 크로노미터: <b>Space</b>',
                '주사기 클릭: 기본 부피 한 칸의 물을 깡통에 넣기 · 물통 클릭: 깡통을 비우기',
                '줄 종이 클릭: 가까이 보기 / 다시 클릭: 줄 방향 돌리기 · 판 10 장 묶음은 깡통 아래 책상에 있습니다'],
           en: ['Drag the can (toothpick) left/right: twist it — let go and it oscillates · chronometer: <b>Space</b>',
                'Click the syringe: add one elementary volume of water to the can · click the tank: empty the can',
                'Click the ruled sheet: look closer / click again: turn its lines · the stack of 10 sheets lies on the desk below the can'] },
  notePlaceholder: { ko: '예) k = 0: 10 T = 12.6 s; k = 1: 10 T = 11.5 s …; L = 440, a = 32, b = 100 a.u.', en: 'e.g. k = 0: 10 T = 12.6 s; k = 1: 10 T = 11.5 s …; L = 440, a = 32, b = 100 a.u.' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var u = 0.096 * (1 + S.sys('u', 0.02)), a = 32 * u, bh = 100 * u, t = 0.30 * u, L = 440 * u, rho0 = 6.9 * (1 + S.sys('rho', 0.04)), g = 981;
    var mSide = 2 * Math.PI * a * bh * t * rho0, mBot = Math.PI * a * a * t * rho0, m = mSide + mBot, J = mSide * a * a + mBot * a * a / 2;
    var Vcan = Math.PI * a * a * bh, v1 = Vcan / 30 * (1 + S.sys('v1', 0.02)), m1 = v1;              /* grams, cm³ */
    var sw = LAB.sw = new B3.Stopwatch(0.04), ARM = 64, Ytop = ARM - L, CX = 0, CZ = 0;
    var sheet = (function () { var c = document.createElement('canvas'); c.width = 512; c.height = 4096; c._static = true; var g2 = c.getContext('2d');
      g2.fillStyle = '#fbfaf3'; g2.fillRect(0, 0, 512, 4096); var H = 60, ppl = 4096 / (H / u);
      for (var i = 0; i * ppl < 4096; i++) { g2.fillStyle = i % 10 === 0 ? 'rgba(40,70,140,.75)' : 'rgba(70,100,170,.45)'; g2.fillRect(0, Math.round(i * ppl), 512, i % 10 === 0 ? 2 : 1); }
      return c; })();
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '],
      home: { yaw: -0.35, pitch: 0.2, k: 6.2, tx: 6, ty: 34, tz: 0 },
      views: { paper: { yaw: 0, pitch: 0.02, k: 26, tx: 0, ty: Ytop + 4, tz: 0, title: { ko: '줄 종이 (a.u.)', en: 'The ruled sheet (a.u.)' },
                        hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · 다시 클릭: 줄 방향 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · click again: turn the lines · Esc: back' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 24, ty: 1.7, tz: 10, title: { ko: '크로노미터', en: 'Chronometer' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        if (b.clicked('c:paper')) { if (b.view === 'paper') LAB.rot = !LAB.rot; else b.go('paper'); }
        if (b.clicked('m:syringe')) { if (LAB.k < 30) LAB.k++; b.say('물 ' + LAB.k + ' 칸', 'Water: ' + LAB.k + ' portions'); }
        if (b.clicked('m:tank')) { LAB.k = 0; LAB.th = 0; LAB.w = 0; b.say('깡통을 비웠습니다.', 'The can is empty.'); }
        var md = b.screenMoved('can');
        if (md[0]) { LAB.held = true; LAB.th = Math.max(-0.6, Math.min(0.6, LAB.th + md[0] * 0.01)); LAB.w = 0; }
        if (!b.dragging) LAB.held = false;
        var mk = m + LAB.k * m1, om2 = g * a * a * mk / (J * L), gam = 0.025;
        if (!LAB.held) { var n = Math.max(1, Math.ceil(b.dt / 0.004)), h = b.dt / n;
          for (var i = 0; i < n; i++) { LAB.w += (-om2 * Math.sin(LAB.th) * Math.cos(LAB.th) - gam * LAB.w) * h; LAB.th += LAB.w * h; } }
        var th = LAB.th, ce = Math.cos(th), se = Math.sin(th);
        B3.desk(-30, 36, -18, 20);
        /* the stand and its arm with the template */
        B3.box3(-26, -14, 0, 1.6, -10, 2, '#3b4048', { top: '#474c55' });
        B3.cyl3('y', 1.6, ARM + 6, -20, -4, 0.8, '#c3c8cd', { seg: 14, cap: '#dde1e4' });
        B3.box3(-21, a + 4, ARM, ARM + 1.2, -4, 4, '#e8e4d8', { top: '#f2eee2' });
        /* the ruled sheet standing behind the can, the stack of sheets in front of its foot */
        if (!LAB.rot) B3.tex3(sheet, 0, 0, 512, 4096, [-8, ARM + 1, -6.5], [16, 0, 0], [0, -60, 0], { id: 'c:paper' });
        else B3.tex3(sheet, 0, 0, 512, 4096, [-30, Ytop - bh - 4, -6.5], [0, 16, 0], [60, 0, 0], { id: 'c:paper' });
        if (!LAB.rot) B3.box3(-8, 8, ARM - 61, ARM + 1.5, -7.2, -6.6, '#5d4630'); else B3.box3(-30, 30, Ytop - bh - 4.5, Ytop - bh + 12.5, -7.2, -6.6, '#5d4630');
        B3.box3(-6, -1, 0, 0.29 * 0 + t * 10, 3, 8, '#9aa0a6', { top: '#b4b9be' });
        /* the threads: from the template's holes to the ends of a rim diameter, turned by θ */
        var top = Ytop, P1 = [CX + a * ce, top, CZ + a * se], P2 = [CX - a * ce, top, CZ - a * se];
        B3.line3([CX + a, ARM, CZ], P1, '#2a2a2a', 1.4); B3.line3([CX - a, ARM, CZ], P2, '#2a2a2a', 1.4);
        /* the can, open at the top, its water, the toothpick across the rim */
        B3.cyl3('y', top - bh, top, CX, CZ, a, '#b9bec4', { seg: 30, caps: false, id: 'm:can' });
        B3.cyl3('y', top - bh, top - bh + 0.05, CX, CZ, a, '#a9aeb4', { seg: 30, id: 'm:can' });
        if (LAB.k > 0) B3.cyl3('y', top - bh + 0.05, top - bh + 0.05 + bh * LAB.k / 30, CX, CZ, a - 0.03, 'rgba(120,170,220,.75)', { seg: 30, cap: 'rgba(140,190,235,.8)' });
        B3.cylAB([CX + (a + 2) * se, top + 0.1, CZ - (a + 2) * ce], [CX - (a + 2) * se, top + 0.1, CZ + (a + 2) * ce], 0.08, '#e3c48a', { seg: 6, id: 'm:can' });
        /* the syringe, the tank, the chronometer */
        B3.cylAB([14, 1.2, 8], [24, 1.2, 8], 1.2, 'rgba(230,236,240,.8)', { seg: 16, id: 'm:syringe' });
        B3.cylAB([24, 1.2, 8], [27, 1.2, 8], 0.3, '#c3c8cd', { seg: 8, id: 'm:syringe' });
        B3.cyl3('y', 0, 6, 26, -8, 4, 'rgba(160,200,230,.7)', { seg: 26, cap: 'rgba(170,210,240,.75)', id: 'm:tank' });
        B3.stopwatch(b, 'sw', [24, 10], sw);
        b.views.paper.ty = top - bh / 2 + 4;
        LAB.state = { k: LAB.k, T: 2 * Math.PI / Math.sqrt(om2), om2: om2, m: m, a: a, L: L, u: u };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
