<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}

  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}

  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

/* the wheel on the bench works the knob under the cursor */
function wheelBench(k,dir,fine){
  if(k==="laser") turnKnob("rot",dir,fine); else if(k==="refL") turnKnob("tL",dir,fine); else if(k==="refR") turnKnob("tR",dir,fine); else if(k==="screen"||ONSCREEN.includes(k)) turnKnob("tilt",dir,fine); else return false;
  return true; }
function turnKnob(k,dir,fine){ const K=KNOBS.find(o=>o[0]===k); const st=K[3]*(fine?0.2:1);
  ST.knob[k]=Math.max(K[1],Math.min(K[2],+(ST.knob[k]+dir*st).toFixed(4))); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
cv.addEventListener("wheel",e=>{ const k=itemAt(lpos(e)); if(!k) return; if(wheelBench(k,e.deltaY<0?1:-1,e.shiftKey)) e.preventDefault(); },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&!hand.tape&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    if(k==="goggles"){ ST.goggles=!ST.goggles; say(ST.goggles?"worn":"off"); if(!ST.goggles&&ST.power){ ST.power=false; say("goggles"); } drawTray(); trayDrag=false; return; }
    const same=hand&&!hand.move&&(hand.item===k||(k==="tape"&&hand.tape)); hand=null;
    if(!same&&trayAvail(k)){ if(k==="tape"){ hand={tape:true}; ST.tapeA=ST.tapeB=null; } else { hand={item:k}; say("picked",itemName(k)); } }
    drawTray(); return; } });

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
let svDrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2;
  if(tab==="sheet"){ const sh=sheet(), m=svMap();
    if(right){ if(!sh||!ST.it.sheet.on) return; let bi=-1, bd=10; sh.marks.forEach(([x,y],i)=>{ const dd=Math.hypot(m.X(x)-p[0],m.Y(y)-p[1]); if(dd<bd){ bd=dd; bi=i; } });
      if(bi>=0){ sh.marks.splice(bi,1); ST.calSel=[]; ST.cal=null; say("unmark"); return; }
      let si=-1; sh.stickers.forEach(([x,y,r],i)=>{ if(Math.hypot(m.X(x)-p[0],m.Y(y)-p[1])<r*m.z) si=i; }); if(si>=0){ sh.stickers.splice(si,1); IMG.key=""; } return; }
    svDrag={x:p[0],y:p[1],px:SV.px,py:SV.py,moved:false}; return; }
});
closeCv.addEventListener("pointermove",e=>{ if(!svDrag) return; const p=clpos(e), dx=p[0]-svDrag.x, dy=p[1]-svDrag.y; if(Math.hypot(dx,dy)>3) svDrag.moved=true; if(svDrag.moved){ SV.px=svDrag.px+dx; SV.py=svDrag.py+dy; } });
closeCv.addEventListener("pointerup",e=>{ const p=clpos(e);
  if(tab==="sheet"&&svDrag&&!svDrag.moved&&e.button===0) sheetClick(p); svDrag=null; });
function toolOut(k){ if(!ST.it[k].on){ say("needTool",itemName(k)); return false; } return true; }
function sheetClick(p){
  if(ST.mode==="pan") return;
  const sh=sheet(); if(!ST.it.sheet.on||!sh){ say("needSheet"); return; }
  const m=svMap(), x=m.U(p[0]), y=m.V(p[1]);
  if(ST.mode==="pencil"){ if(!toolOut("pencil")) return; if(Math.abs(x)>SHEET.bw/2||Math.abs(y)>SHEET.bh/2){ say("outBox"); return; }
    sh.marks.push([x+0.10*gauss(),y+0.10*gauss()]); say("mark",sh.marks.length); return; }
  if(ST.mode==="sticker"){ if(!toolOut("sticker")) return; if(Math.abs(x)>SHEET.w/2||Math.abs(y)>SHEET.h/2) return; sh.stickers.push([x,y,4]); IMG.key=""; say("sticker"); return; }
  if(ST.mode==="caliper"){ if(!toolOut("caliper")) return; let bi=-1, bd=12; sh.marks.forEach(([mx,my],i)=>{ const dd=Math.hypot(m.X(mx)-p[0],m.Y(my)-p[1]); if(dd<bd){ bd=dd; bi=i; } });
    if(bi<0) return; if(ST.calSel.length>=2) ST.calSel=[]; if(ST.calSel[0]===bi) return; ST.calSel.push(bi);
    if(ST.calSel.length===2){ const [i,j]=ST.calSel, a=sh.marks[i], b=sh.marks[j], v=Math.hypot(a[0]-b[0],a[1]-b[1])+0.008*gauss();
      ST.cal={v:Math.round(v*100)/100,i,j,sheet:ST.cur}; say("calRead",ST.cal.v.toFixed(2)+" mm"); } }
}
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), dir=e.deltaY<0?1:-1; e.preventDefault();
  if(tab==="sheet"){ const z0=svMap().z, mn=(CLH-24)/SHEET.h; SV.zoom=Math.max(mn,Math.min(40,SV.zoom*(dir>0?1.2:1/1.2))); const cx=CLW/2+SV.px, cy=CLH/2+SV.py;
    SV.px+=(p[0]-cx)*(1-SV.zoom/z0); SV.py+=(p[1]-cy)*(1-SV.zoom/z0); if(SV.zoom<=mn+1e-6){ SV.px=0; SV.py=0; } return; }
  if(tab==="align"){ for(const [k,x,y,r] of KHIT) if(Math.hypot(p[0]-x,p[1]-y)<r){ turnKnob(k,dir,e.shiftKey); return; } }
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("pwrBtn").onclick=()=>{ if(ST.power){ ST.power=false; say("laser",false); return; }
  if(!ST.it.laser.on||!ST.it.psu.on){ say("needPsu"); return; } if(!ST.goggles){ say("goggles"); return; } ST.power=true; say("laser",true); };
$("hiBtn").onclick=()=>{ ST.high=true; say("int","High"); };
$("loBtn").onclick=()=>{ ST.high=false; say("int","Low"); };
$("roomBtn").onclick=()=>{ ST.room=!ST.room; say("room",ST.room); };
$("newSheet").onclick=()=>{ if(!ST.it.sheet.on){ say("needSheet"); return; } ST.sheets.push({marks:[],stickers:[]}); ST.cur=ST.sheets.length-1; ST.calSel=[]; IMG.key=""; say("newSheet","P-"+ST.sheets.length); renderSheets(); };
$("undoMark").onclick=()=>{ const sh=sheet(); if(sh&&sh.marks.length){ sh.marks.pop(); ST.calSel=[]; say("undone"); } };
$("noteBtn").onclick=()=>{ const parts=[];
  if(ST.cal) parts.push("P-"+(ST.cal.sheet+1)+" #"+(ST.cal.i+1)+"–#"+(ST.cal.j+1)+" "+ST.cal.v.toFixed(2)+" mm");
  if(ST.tapeB) parts.push("tape "+ST.tapeTxt);
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderSheets(){ const box=$("sheetRow"); box.innerHTML="";
  ST.sheets.forEach((s,i)=>{ const b=document.createElement("button"); b.textContent="P-"+(i+1); b.className=i===ST.cur?"on":""; b.style.flex="0 0 auto";
    b.onclick=()=>{ ST.cur=i; ST.calSel=[]; IMG.key=""; renderSheets(); }; box.appendChild(b); });
  if(!ST.sheets.length){ const s=document.createElement("span"); s.className="hint"; s.textContent="—"; box.appendChild(s); } }
function renderModes(){ const box=$("modeRow"); box.innerHTML="";
  for(const k of ["pencil","sticker","caliper","pan"]){ const b=document.createElement("button"); b.textContent=d().modes[k]; b.className=k===ST.mode?"on":"";
    b.onclick=()=>{ ST.mode=k; ST.calSel=[]; renderModes(); }; box.appendChild(b); } }
function renderPanel(){ const t=d();
  $("pwrBtn").textContent=ST.power?t.pwrOff:t.pwrOn; $("hiBtn").className=ST.high?"on":""; $("loBtn").className=ST.high?"":"on";
  $("roomBtn").textContent=ST.room?t.roomOn:t.roomOff;
  $("calDisp").textContent=ST.cal?ST.cal.v.toFixed(2)+" mm":"-----";
  $("calLbl").textContent=ST.calSel.length===1?t.calOne(ST.calSel[0]+1):ST.cal?t.calPair("P-"+(ST.cal.sheet+1),ST.cal.i+1,ST.cal.j+1):t.calNone; }
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]);
  if(hand&&hand.tape) L.push([ST.tapeA&&!ST.tapeB?t.st.tape2:ST.tapeB?t.st.tapeRead(ST.tapeTxt):t.st.tape,false]);
  else if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.power) L.push([t.st.laserOn,true]);
  if(ST.power&&!ST.goggles) L.push([t.st.noGog,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-psu").textContent=t.hPsu; $("hiBtn").textContent=t.hi; $("loBtn").textContent=t.lo;
  $("t-h-sheet").textContent=t.hSheet; $("newSheet").textContent=t.newSheet; $("undoMark").textContent=t.undo; $("t-modehint").textContent=t.modeHint;
  $("t-h-cal").textContent=t.hCal; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2015 E1 — 나선 구조에 의한 회절 · HaslaLab":"IPhO 2015 E1 — Diffraction due to Helical Structure · HaslaLab";
  renderTabs(); renderSheets(); renderModes(); renderPanel(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, sheetKey="";
function tick(){
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); const sk=ST.sheets.length+":"+ST.cur; if(sk!==sheetKey){ sheetKey=sk; renderSheets(); } drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
