<meta name="description" content="APhO 2007 실험 2를 브라우저에서 실행합니다. 두 코일 고리로 된 센서와 표준 저항으로 V2/V1–1/R 관계를 보정하고, 센서를 소금물에 담가 액체의 전기 전도도를 구합니다. 배선은 직접 단자를 이어 꾸밉니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}

  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  @media (max-width:760px){ .panel{flex:1 1 100%} }

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (V, Ω, S, mm)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const TRUE={
  K:0.434*U(0.95,1.05),                 /* the sensor's constant: V2/V1 = K / |Z_loop|, Ω */
  X:U(0.26,0.34), rl:U(0.03,0.06),      /* reactance of the one-turn loop through both cores, and the thread's own resistance, Ω */
  Xl:U(0.2,0.4),                        /* the liquid loop's reactance, Ω */
  sig0:U(1.2e-3,2.2e-3),                /* the salt water, S/mm at the start */
  alT:0.021, T0:U(10,14), Troom:U(19,23),  /* conductivity rises 2.1 %/K; the liquid creeps towards the room */
  Lmm:30.5*U(0.9995,1.0005), dmm:13.9*U(0.9995,1.0005),
  R:[0.1,0.2,0.5,1,2,5],                /* the plug-in resistor box, 0.1 % each */
  drift:U(0.012,0.025) };               /* generator amplitude wander, V per minute (rms) */

/* ══════════════════════════════════════════════════════════════
   2.  THE BENCH STATE
   ══════════════════════════════════════════════════════════════ */
const PARTS=["box","sensor","beaker","rod"];
const TERMS=["G+","G-","V+","V-","SWc","SW1","SW2","P0","P1","P2","P3","P4","P5","P6","S1","S1'","S2","S2'","T1","T2"];
const ST={ on:new Set(), pos:{}, at:{},
  leads:[], pick:null,                 /* leads: [a,b] terminal pairs; pick: the first end being placed */
  amp:1.85, ampTrue:1.85, sw:1, inLiquid:false,
  Tl:TRUE.T0, mix:0, strat:0, speed:1 };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
/* nets of joined terminals (the switch joins its common to throw 1 or 2) */
function nets(){ const par={}; const f=a=>{ while(par[a]!==a) a=par[a]=par[par[a]]; return a; }; for(const t of TERMS) par[t]=t;
  const u=(a,b)=>{ par[f(a)]=f(b); }; for(const [a,b] of ST.leads) u(a,b); u("SWc",ST.sw===1?"SW1":"SW2"); return f; }
/* resistance the box puts between the two thread ends (sections whose ends are joined are shorted out) */
function threadR(f){ const a=f("T1"), b=f("T2"); if(a===b) return 0;
  const ia=[], ib=[]; for(let i=0;i<=6;i++){ if(f("P"+i)===a) ia.push(i); if(f("P"+i)===b) ib.push(i); }
  if(!ia.length||!ib.length) return Infinity;
  let best=Infinity; for(const i of ia) for(const j of ib){ let r=0; for(let k=Math.min(i,j);k<Math.max(i,j);k++) if(f("P"+k)!==f("P"+(k+1))) r+=TRUE.Rerr[k]; best=Math.min(best,r); } return best; }
const sigma=()=>TRUE.sig0*(1+TRUE.alT*(ST.Tl-TRUE.T0))*(1+ST.strat);
const Rliq=()=>TRUE.Lmm/(sigma()*Math.PI*TRUE.dmm*TRUE.dmm/4);
/* the loop admittance threading both cores: thread circuit and/or liquid */
function loopY(f){ let yr=0, yi=0; const R=threadR(f);
  if(isFinite(R)){ const a=R+TRUE.rl+0.004*ST.leads.length, b=TRUE.X, m=a*a+b*b; yr+=a/m; yi-=b/m; }
  if(ST.inLiquid){ const a=Rliq(), b=TRUE.Xl, m=a*a+b*b; yr+=a/m; yi-=b/m; }
  return [yr,yi]; }
/* what the ac voltmeter reads, V rms */
function meter(){ if(!has("box")) return null; const f=nets();
  if(f("G+")===f("G-")) return 0;                                          /* generator shorted: the output collapses */
  const V1=ST.ampTrue, pot={}; pot[f("G-")]=[0,0]; pot[f("G+")]=[V1,0];
  const drive=(f("S1")===f("G+")&&f("S1'")===f("G-"))||(f("S1")===f("G-")&&f("S1'")===f("G+"));
  if(has("sensor")&&drive){ const [yr,yi]=loopY(f), mag=V1*TRUE.K*Math.hypot(yr,yi);

function stepPhys(dt){

  ST.Tl+=(TRUE.Troom-ST.Tl)*dt/5400;

/* ══════════════════════════════════════════════════════════════

const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;

function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);

function vgrad(y,h,stops){ const g=ctx.createLinearGradient(0,y,0,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function ell(x,y,rx,ry,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];
  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);

  for(let i=0;i<6;i++){ const a=TPOS["P"+i], b=TPOS["P"+(i+1)]; fillR(a[0]+9,a[1]-6,b[0]-a[0]-18,12,2,"#2b2e33"); text(TRUE.R[i]+" Ω",(a[0]+b[0])/2,a[1]+18,"#333",11,"center"); }
  /* the sensor: two cores side by side, the thread loop through them */
  fillR(sx-CLW*0.12,sy-CLH*0.12,CLW*0.11,CLH*0.24,10,"#7f868e","#555"); fillR(sx+CLW*0.01,sy-CLH*0.12,CLW*0.11,CLH*0.24,10,"#7f868e","#555");
  text("1 1′",sx-CLW*0.065,sy,"#eee",12,"center","700"); text("2 2′",sx+CLW*0.065,sy,"#eee",12,"center","700");
  ctx.strokeStyle="#b07a3a"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(TPOS.T1[0],TPOS.T1[1]); ctx.bezierCurveTo(sx-CLW*0.15,sy+CLH*0.05,sx-CLW*0.15,sy,sx,sy); ctx.bezierCurveTo(sx+CLW*0.15,sy,sx+CLW*0.15,sy+CLH*0.05,TPOS.T2[0],TPOS.T2[1]); ctx.stroke(); ctx.lineWidth=1;
  text(ST.inLiquid?t.lab.inLiquid:t.lab.dry,sx,sy+CLH*0.42,ST.inLiquid?"#2b6cb0":"#555",12,"center","700");
  /* terminals */
  for(const tm of TERMS){ const p=TPOS[tm]; const neg=tm.endsWith("-")||tm.endsWith("'"); circ(p[0],p[1],8,tm[0]==="P"?"#c9a64a":tm[0]==="T"?"#b07a3a":neg?"#1f2226":"#c0392b","#111",1); circ(p[0],p[1],3,"#ddd");
    if(ST.pick===tm){ ctx.strokeStyle="#ffcf3a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p[0],p[1],12,0,7); ctx.stroke(); ctx.lineWidth=1; }
    text(tm.replace("SWc","").replace("SW1","").replace("SW2",""),p[0],p[1]-14,"#333",10,"center","700"); hitAdd("t:"+tm,p[0]-11,p[1]-11,22,22); }
  /* leads, each with a handle to unplug it */
  ST.leads.forEach(([a,b],i)=>{ const p=TPOS[a], q=TPOS[b], mx=(p[0]+q[0])/2, my=Math.max(p[1],q[1])+30+i*4; ctx.strokeStyle=LCOL[i%LCOL.length]; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(mx,my,q[0],q[1]); ctx.stroke(); ctx.lineWidth=1; const hx=0.25*p[0]+0.5*mx+0.25*q[0], hy=0.25*p[1]+0.5*my+0.25*q[1];
    circ(hx,hy,5,"#fff",LCOL[i%LCOL.length],2); hitAdd("l:"+i,hx-7,hy-7,14,14); });
  if(ST.pick){ const p=TPOS[ST.pick]; ctx.setLineDash([4,4]); ctx.strokeStyle="#888"; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(cmouse[0],cmouse[1]); ctx.stroke(); ctx.setLineDash([]); }
  text(t.lab.wireHint,10,CLH-10,"#555",11,"left"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ drawWire(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   5.  HANDS: the bench, the cups, the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const childrenOf=k=>Object.keys(ST.at).filter(o=>ST.at[o]===k);
function put(k,t){
  if(k==="sensor"&&t==="beaker"){ ST.at.sensor="beaker"; ST.inLiquid=true; say("immersed"); return true; }
  if(k==="rod"&&t==="beaker"){ ST.at.rod="beaker"; say("rodIn"); return true; }
  return false; }
function hitItem(p){ const id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),1))||null; }
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.parent){ ST.on.add(k); ST.at[k]=hand.parent; if(k==="sensor"&&hand.parent==="beaker") ST.inLiquid=true; say("placed",itemName(k)); } else if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
function takeUp(k){ if(k==="box"&&ST.leads.length){ say("unplugFirst"); return false; } if(k==="sensor"&&ST.inLiquid){ ST.inLiquid=false; }
  const b=baseOf(k), par=ST.at[k]; if(par) delete ST.at[k]; hand={item:k,move:true,orig:{x:b.x,y:b.y},parent:par};
  ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
function drop(k,x,y){ ST.pos[k]={x,y}; ST.on.add(k); delete ST.at[k]; if(k==="sensor") ST.inLiquid=false; say("placed",itemName(k)); }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const t=targetAt(k,p); if(t){ ST.on.add(k); if(put(k,t)) hand=null; else ST.on.delete(k); return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(childrenOf(k).length){ say("emptyFirst"); return; } if((k==="box"||k==="sensor")&&ST.leads.length){ say("unplugFirst"); return; } if(k==="sensor") ST.inLiquid=false;
    delete ST.at[k]; ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the wiring board: click a terminal, then another, to join them with a lead; click a lead's handle to unplug it */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button===2){ ST.pick=null; return; } if(e.button!==0) return;
  if(!h){ ST.pick=null; return; }
  if(h.k==="swLever"){ toggleSw(); return; }
  if(h.k.startsWith("l:")){ const i=+h.k.slice(2); ST.leads.splice(i,1); say("unplugged"); return; }
  if(h.k.startsWith("t:")){ const t=h.k.slice(2); if((t[0]==="S"&&t!=="SWc"&&t!=="SW1"&&t!=="SW2"||t[0]==="T")&&!has("sensor")){ say("needFor",itemName("sensor")); return; }
    if(!ST.pick){ ST.pick=t; return; } if(ST.pick===t){ ST.pick=null; return; }
    if(ST.leads.length>=12){ say("noLeads"); ST.pick=null; return; } if(ST.leads.some(([a,b])=>(a===ST.pick&&b===t)||(a===t&&b===ST.pick))){ ST.pick=null; return; }
    ST.leads.push([ST.pick,t]); say("joined",ST.pick,t); ST.pick=null; } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function toggleSw(){ ST.sw=ST.sw===1?2:1; say("sw",ST.sw); }
$("swBtn1").onclick=toggleSw;
for(const [id,dv] of [["am01",-0.1],["am001",-0.01],["ap001",0.01],["ap01",0.1]]) $(id).onclick=()=>{ if(!has("box")) return; ST.amp=Math.max(0,Math.min(2.2,Math.round((ST.amp+dv)*100)/100)); };
$("stirBtn").onclick=()=>{ if(!has("beaker")){ say("needFor",itemName("beaker")); return; } if(!has("rod")){ say("needFor",itemName("rod")); return; } ST.strat=(Math.random()-0.5)*0.004; say("stirred"); };
$("noteBtn").onclick=()=>{ rows++; const v=meter(), n=$("note"), s=rows+")  "+d().lab.swPos+" "+ST.sw+"   "+(v===null?"":fmtV(v));
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(), v=meter(); $("dV").textContent=v===null?"":fmtV(v); $("swBtn1").textContent=t.swL+" "+ST.sw; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(ST.pick),false]);
  if(has("box")&&ST.sw===1&&meter()>0.5&&(meter()<1.7||meter()>1.99)) L.push([t.st.range,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-gen","hGen"],["genHint","genHint"],["t-h-vm","hVm"],["t-h-liq","hLiq"],["stirBtn","stir"],["liqHint","liqHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose(); ++frameN;
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
