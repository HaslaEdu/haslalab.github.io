<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">

<title>IZhO 2014 실험 — 자기 상호작용 · Magnetic Interactions · HaslaLab</title>
<meta name="description" content="IZhO 2014 실험 문제를 브라우저에서 해 봅니다. 자석 구슬이 든 진자의 주기를 코일 전류에 따라, 아래 놓은 자석 구슬까지의 거리에 따라 재어 힘이 전류에 비례하고 거리의 네제곱에 반비례함을 보이고, 은박에 싼 초콜릿이 진동의 감쇠를 바꾸는 것을 확인합니다.">
<meta property="og:site_name" content="HaslaLab">

<meta property="og:title" content="IZhO 2014 실험 — 자기 상호작용 · Magnetic Interactions · HaslaLab">
<meta property="og:description" content="IZhO 2014 실험: 자석 구슬 진자의 주기로 자기력 재기.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* IZhO 2014 on the 3-D bench.  The pendulum (two chopsticks in an eraser on a needle axis, clay at both ends, a
   magnetized bead in the lower lump) swings with ν₀² ≈ 0.142 s⁻² (T₀ ≈ 2.65 s, official).  1: a coil under it
   adds ν² − ν₀² ≈ 0.105 s⁻²/A × I (sign with the current's direction; official table 1).  2: a bead on clay a
   gap x below attracts it with F = C/r⁴: ν² = ν₀² + K(l + x)/x⁵ (l ≈ 150 mm; K fitted to official table 2).
   3: chocolate in foil under the swinging end: eddy currents in the foil raise the damping, the period stays. */
var PROGRAM = {
  title: { ko: 'IZhO 2014 실험 — 자기 상호작용', en: 'IZhO 2014 — Magnetic interactions' },
  subtitle: { ko: '진자: 지우개에 꽂은 나무젓가락 둘, 양 끝의 점토(아래 점토 속에 자석 구슬), 지우개를 꿰뚫은 바늘 축. 장비: 삼각대, 진자, 점토, 자, 자석 구슬, 스톱워치, 4.5 V 전지, 6 Ω 가변 저항, 코일, 멀티미터, 스위치, 도선, 못, 초콜릿 한 조각. 구슬의 방향은 바꾸지 마세요.',
              en: 'The pendulum: two wooden chopsticks in an eraser, clay at both ends (a magnetized bead inside the lower lump), a needle through the eraser as the axis. Equipment: a tripod, the pendulum, clay, a ruler, magnetized beads, a stopwatch, a 4.5 V battery, a 6 Ω rheostat, a coil, a multimeter, a switch, wires, nails and a piece of chocolate. Do not change the beads\' orientation.' },
  notes: { ko: [
    '과제: 1.1 진자의 주기와 오차(주기 2 s 이상). 1.2–1.4 진자 아래(구슬에서 코일 반지름의 절반쯤)에 코일을 두고 전류에 따른 주기 — 힘이 전류에 비례함을 ν² − ν₀² 대 I 로. 2 아래에 자석 구슬(끌어당기게) — 운동 방정식과 작은 진동의 주기, 구슬 중심 사이 거리에 따른 주기, F = C/r^γ 의 γ. 3 초콜릿(포장째) 위 1–2 mm 를 지나게 하면 진자의 무엇이 달라지는지와 그 증거.',
    '공식 해답: 10T = 25.02, 25.06, 24.92 s → T = 2.50 ± 0.01 s. 코일: I = 0, 0.80, 0.37, −0.37, −0.72 A → T = 2.655, 2.062, 2.350, 3.083, 3.724 s, ν² − ν₀² 가 I 에 비례. 구슬: x = 23, 33, 43, 53 mm → T = 0.409, 0.886, 1.579, 1.940 s; ξ = (ν² − ν₀²)x/(l + x) 의 로그 그래프 기울기 → γ = 4. 초콜릿: 주기는 그대로, 감쇠가 커짐(은박의 맴돌이 전류).',
    '전류의 방향은 코일 단자를 바꿔 꽂아 바꿉니다. 진폭은 진자 끝 뒤의 자로 읽습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 the period with its error (above 2 s). 1.2–1.4 with the coil under the pendulum (the bead about half the coil radius from its centre), the period against the current — the force is proportional to the current, from ν² − ν₀² against I. 2 a bead underneath (attracting) — the equation of motion and the small-oscillation period, the period against the distance between the bead centres, γ in F = C/r^γ. 3 with the chocolate (still wrapped) 1–2 mm under the swinging end: what changes, and the evidence.',
    'Official solution: 10T = 25.02, 25.06, 24.92 s → T = 2.50 ± 0.01 s. Coil: I = 0, 0.80, 0.37, −0.37, −0.72 A → T = 2.655, 2.062, 2.350, 3.083, 3.724 s, ν² − ν₀² proportional to I. Bead: x = 23, 33, 43, 53 mm → T = 0.409, 0.886, 1.579, 1.940 s; the slope of ξ = (ν² − ν₀²)x/(l + x) on log scales → γ = 4. Chocolate: the period stays, the damping grows (eddy currents in the foil).',
    'Reverse the current by swapping the coil leads. Read the amplitude on the ruler behind the pendulum\'s end. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, x: 0.5, mode: 1, gap: 33, th: 0, w: 0, held: false, swOn: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 삼각대에 걸린 진자, 그 뒤의 자(진폭 읽기), 아래쪽 자리(카드 1: 코일, 2: 점토 위 자석 구슬, 3: 초콜릿), 4.5 V 전지, 6 Ω 가변 저항, 스위치, 멀티미터, 스톱워치, 도선.',
           en: 'On the desk: the pendulum on the tripod, a ruler behind it (for amplitudes), the place underneath (card 1: the coil, 2: a bead on clay, 3: the chocolate), the 4.5 V battery, the 6 Ω rheostat, the switch, the multimeter, a stopwatch and wires.' },
  howto: { ko: ['진자 아래 끝을 좌우로 끌기: 기울였다 놓기 · 진자 클릭: 붙잡기',
                '카드 1·2·3 클릭: 진자 아래에 둘 것 바꾸기 · 2: 점토 구슬 위에서 휠 — 구슬 사이 간격 1 mm 씩',
                '도선: 단자 클릭으로 잇기 · 스위치 클릭: 켜기/끄기 · 가변 저항 손잡이 휠/끌기 · 멀티미터 다이얼(10 A 전류 단자는 mA 잭) · 스톱워치 <b>Space</b>'],
           en: ['Drag the pendulum\'s lower end left/right: tilt it and let go · click the pendulum: catch it',
                'Click card 1, 2 or 3: change what sits under the pendulum · 2: wheel over the clay bead — the gap between the beads by 1 mm',
                'Wires: click terminals to join · click the switch: on/off · rheostat knob wheel/drag · multimeter dial (the current jack is mA) · stopwatch <b>Space</b>'] },
  notePlaceholder: { ko: '예) 10T = 25.02 s … / I = 0.80 A: 10T = 20.6 s … / x = 23 mm: 10T = 4.27 s …', en: 'e.g. 10T = 25.02 s … / I = 0.80 A: 10T = 20.6 s … / x = 23 mm: 10T = 4.27 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var NU0 = 0.142 * (1 + S.sys('nu', 0.02)), MU = 0.105 * (1 + S.sys('mu', 0.05)), KB = 2.42e5 * (1 + S.sys('kb', 0.06)), LB = 150, G0 = 0.012, GC = 0.07 * (1 + S.sys('gc', 0.1));
    var RC = 2.4 * (1 + S.sys('rc', 0.05)), RH = 6 * (1 + S.sys('rh', 0.03));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: S.sys('mA', 0.006), R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 10 }), sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit(), Icoil = 0;
    var RANGES = [['OFF'], ['V', 2], ['V', 20], ['A', 0.2], ['A', 2]];
    var amp = B3.scaleTex(20, { horiz: true, width: 2.4, from: -10, every: 2, bg: '#f2efe6' });
    var PX = 0, PY = 34, LL = 30;                       /* axis, length to the lower lump (cm) */
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '], speeds: [1, 0.25], wheelIds: ['rh', 'bead'],
      home: { yaw: -0.25, pitch: 0.42, k: 10, tx: 6, ty: 16, tz: 0 },
      views: { dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 24, ty: 3.4, tz: 4, title: { ko: '멀티미터', en: 'Multimeter' } },
               low: { yaw: 0, pitch: 0.12, k: 28, tx: PX, ty: 3, tz: 0, title: { ko: '진자의 아래 끝', en: 'The pendulum\'s lower end' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 34, ty: 1.7, tz: 12, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        for (var q = 1; q <= 3; q++) if (b.clicked('c:card' + q)) LAB.mode = q;
        if (b.clicked('c:sw')) LAB.swOn = !LAB.swOn;
        if (b.clicked('c:ruler')) b.go('low');
        var mr = b.screenMoved('rh'), wr = b.wheel('rh'); if (mr[0] || wr) LAB.x = Math.max(0, Math.min(1, LAB.x + mr[0] * 0.004 + wr * 0.01));
        var wb = b.wheel('bead'); if (wb && LAB.mode === 2) LAB.gap = Math.max(18, Math.min(70, Math.round(LAB.gap + wb)));
        if (b.dragging('pend')) { LAB.th = Math.max(-0.3, Math.min(0.3, LAB.th + b.screenMoved('pend')[0] / LL)); LAB.w = 0; LAB.held = true; LAB.drag = true; }
        else if (LAB.drag) { LAB.drag = false; LAB.held = false; }
        else if (b.clicked('m:pend')) { LAB.held = true; LAB.w = 0; }
        var nu2 = NU0 + (LAB.mode === 1 ? MU * Icoil : 0) + (LAB.mode === 2 ? KB * (LB + LAB.gap) / Math.pow(LAB.gap, 5) : 0), gam = G0 + (LAB.mode === 3 ? GC : 0);
        if (!LAB.held && b.dt > 0) { var n = Math.ceil(b.dt / 0.002), h = b.dt / n, k = 4 * Math.PI * Math.PI * nu2;
          for (var i = 0; i < n; i++) { LAB.w += (-k * Math.sin(LAB.th) - 2 * gam * LAB.w) * h; LAB.th += LAB.w * h; } }
        B3.desk(-36, 44, -18, 20);
        /* tripod and pendulum */
        B3.box3(-10, 10, 0, 1.4, -14, -8, '#3b4048', { top: '#474c55' }); B3.cylSeg('y', 1.4, PY + 4, -6, -11, 0.7, '#c3c8cd', { seg: 12, cap: '#dde1e4' }, 6);
        B3.box3(-7, 1, PY - 0.6, PY + 0.6, -11.6, -10.4, '#9aa0a6'); B3.box3(-0.6, 0.6, PY - 0.6, PY + 0.6, -11, -0.5, '#9aa0a6');
        var s = Math.sin(LAB.th), co = Math.cos(LAB.th), P = function (r) { return [PX + s * r, PY - co * r, 0]; };
        B3.cyl3('z', -0.6, 0.6, PX, PY, 0.08, '#dde1e4', { seg: 6 });
        B3.box3(-1.2, 1.2, PY - 1, PY + 1, -0.8, 0.8, '#d8708a', { id: 'm:pend' });
        B3.cylAB(P(-1), P(-12), 0.25, '#d8b27a', { seg: 8, id: 'm:pend' }); B3.cylAB(P(1), P(LL - 1.4), 0.25, '#d8b27a', { seg: 8, id: 'm:pend' });
        var u = P(-12.5), lo = P(LL); B3.cyl3('z', -1.2, 1.2, u[0], u[1], 1.2, '#7a8a5a', { seg: 16, cap: '#8a9a6a', id: 'm:pend' });
        B3.cyl3('z', -1.4, 1.4, lo[0], lo[1], 1.4, '#7a8a5a', { seg: 16, cap: '#8a9a6a', id: 'm:pend' });
        /* the amplitude ruler behind the lower end */
        B3.box3(-11, 11, PY - LL - 3.6, PY - LL - 1.2, -3.2, -3.0, '#f2efe6', { id: 'c:ruler' });
        B3.tex3(amp, 0, 0, amp.width, amp.height, [-11, PY - LL - 1.2, -2.98], [22, 0, 0], [0, -2.4, 0], { id: 'c:ruler' });
        /* underneath: coil / bead on clay / chocolate */
        var by = PY - LL - 1.4;
        if (LAB.mode === 1) { B3.cyl3('y', 0, 2.2, PX, 0, 3.4, '#b87333', { seg: 28, cap: '#c88343' }); B3.cyl3('y', 2.2, 2.25, PX, 0, 1.2, '#2b2f35', { seg: 18 });
          leads.term(b, 'coil.1', [PX - 4.5, 0, 2.5], { col: '#d8d8d8', label: '1', lc: '#333', post: true }); leads.term(b, 'coil.2', [PX + 4.5, 0, 2.5], { col: '#d8d8d8', label: '2', lc: '#333', post: true });
          B3.cable([PX - 3, 1, 1.5], [PX - 4.5, 1, 2.5], '#b87333', 0.2, 1.4); B3.cable([PX + 3, 1, 1.5], [PX + 4.5, 1, 2.5], '#b87333', 0.2, 1.4); }
        else if (LAB.mode === 2) { var cy = by - LAB.gap / 10; B3.cyl3('y', 0, Math.max(0.3, cy - 0.4), PX, 0, 1.6, '#7a8a5a', { seg: 16, cap: '#8a9a6a', id: 'm:bead' });
          B3.cyl3('y', Math.max(0.3, cy - 0.4), Math.max(0.3, cy - 0.4) + 0.8, PX, 0, 0.45, '#3a3f46', { seg: 12, id: 'm:bead' }); }
        else { B3.box3(PX - 6, PX + 6, 0, by - 0.25, -2.5, 2.5, '#b8bcc2', { top: '#d0d4d8' }); B3.box3(PX - 6.02, PX + 6.02, 0, by - 2.2, -2.52, 2.52, '#6a2a2a'); }
        [1, 2, 3].forEach(function (q2) { var x = 12 + q2 * 5; B3.box3(x - 2, x + 2, 0, 0.1, 13, 17, q2 === LAB.mode ? '#ffd479' : '#e8e4d8', { id: 'c:card' + q2 });
          B3.text3([x - 0.6, 0.12, 16], [1, 0, 0], [0, 0, -1], String(q2), 1.8, '#333', { weight: '800' }); });
        /* battery, rheostat, switch, meter */
        var bat = B3.cells(b, leads, 'bat', [-26, 10], { n: 3, e: 1.5 * (1 + S.sys('eb', 0.02)), r: 0.35 });
        B3.box3(-18, -8, 0, 2, 8, 14, '#3a3f46', { top: '#474c55' }); B3.cyl3('y', 2, 3.6, -13, 11, 1.5, '#2b2f35', { seg: 20, cap: '#3a3f46', id: 'm:rh' });
        var pa = (LAB.x - 0.5) * 4.5; B3.line3([-13, 3.62, 11], [-13 + Math.sin(pa) * 1.4, 3.62, 11 - Math.cos(pa) * 1.4], '#f2f2f2', 2.5);
        ['A', 'W', 'B'].forEach(function (t, j) { leads.term(b, 'rh.' + t, [-16 + j * 3, 2, 13], { col: '#b8b8b8', label: t, lc: '#e8e8e8', ls: 0.6 }); });
        B3.box3(-5, 1, 0, 1.4, 9, 13, '#2b2f35', { top: '#33373e' }); B3.box3(-3, -1, 1.4, 2.2, 10, 12, LAB.swOn ? '#3f8f4f' : '#7a2a2a', { id: 'c:sw' });
        leads.term(b, 'k.a', [-4, 1.4, 12.2], { col: '#b8b8b8', ls: 0.5 }); leads.term(b, 'k.b', [0, 1.4, 12.2], { col: '#b8b8b8', ls: 0.5 });
        var m = B3.dmm(b, 'dmm', [24, 4], dm, leads, { ranges: RANGES, rA: { 0.2: 0.5, 2: 0.05 }, fuseI: 3 });
        B3.stopwatch(b, 'sw', [34, 12], sw);
        c.reset(); bat.stamp(c);
        c.R('rh.A', 'rh.W', Math.max(0.05, LAB.x * RH)); c.R('rh.W', 'rh.B', Math.max(0.05, (1 - LAB.x) * RH));
        var ec = LAB.mode === 1 ? c.R('coil.1', 'coil.2', RC) : null; if (LAB.swOn) c.join('k.a', 'k.b');
        m.stamp(c); leads.wire(c); c.solve(0.05); m.read(c);
        Icoil = ec ? c.cur(ec) : 0;
        leads.draw(b);
        LAB.state = { mode: LAB.mode, I: Icoil, T: 1 / Math.sqrt(nu2), gap: LAB.gap, amp: LAB.th * LL };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
