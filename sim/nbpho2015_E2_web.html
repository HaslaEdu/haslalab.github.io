<meta property="og:description" content="NBPhO 2015 실험: U자 관 물 압력계로 미지 액체의 포화 증기압 재기.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}

#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>

<body>
<script>
/* NBPhO 2015 problem 10 "Vapour pressure" (J. Kalda, M. Heidelberg, E. Uustalu).  The flexible pipe hangs on
   the stand as a U and holds water; one end goes through the plug into the 0.5 L bottle, whose needle
   hole lets the pressure even out until it is taped.  The unknown fluid (ethanol, as the official
   solution reveals: 6.52 kPa at 21.6 °C; Antoine's equation here) evaporates into the bottle with a time
   constant of about a minute, a quarter of that while the bottle is shaken.  What evaporated before the
   hole was taped is lost to the reading.  The gas is ideal: its volume grows as the water in the bottle's
   arm goes down, (p0 + ρgΔh)(V0 + SΔh/2) as in the solution, and a hand on the bottle warms it. */
var PROGRAM = {
  title: { ko: 'NBPhO 2015 실험 10 — 포화 증기압', en: 'NBPhO 2015 Problem 10 — Vapour pressure' },
  subtitle: { ko: '주사기 속 미지의 액체의 상온 포화 증기압을 재세요. 병의 부피 V = 0.50 L, 관의 안지름 d = 6.0 mm. 현재 기압 p₀ 와 실온 T₀ 는 칠판에 있습니다. 불확도를 어림하세요.',
              en: 'Measure the room-temperature saturated vapour pressure of the unknown fluid in the syringe. The bottle\'s volume is V = 0.50 L, the pipe\'s inner diameter d = 6.0 mm. The air pressure p₀ and room temperature T₀ are on the blackboard. Estimate the uncertainty.' },
  notes: { ko: [
    '장비: 미지의 액체가 든 주사기, 물이 든 주사기, 병, 유연한 관, 자, 마개, 스탠드, 테이프 (문제지 그대로).',
    '공식 해답에서 액체는 에탄올이었습니다(21.6 °C에서 6.52 kPa). 여기서는 앙투안 식으로 온도에 따라 계산합니다.',
    '액체는 약 1분의 시간 상수로 증발하고, 병을 흔들면(끌기) 네 배 빨라집니다. 구멍을 테이프로 막기 전에 증발한 몫은 측정에서 빠집니다. 병을 손으로 오래 쥐면 데워집니다.',
    '관 속 물이 움직이면 기체 부피도 SΔh/2 만큼 늘어납니다 — 공식 해답은 이 보정을 합니다.',
    '“한 번 잘 재면 다시 할 필요가 없습니다. 병에서 증기를 빼는 데 오래 걸리니까요.” (문제지) — 여기서도 병을 빼면 몇 분 동안 환기해야 깨끗해집니다.'], en: [
    'Equipment: a syringe of the unknown fluid, a syringe of water, the bottle, a flexible pipe, a ruler, a plug, a stand and tape (as on the sheet).',
    'In the official solution the fluid was ethanol (6.52 kPa at 21.6 °C); here Antoine\'s equation gives it at any temperature.',
    'The fluid evaporates with a time constant of about a minute, four times faster while the bottle is shaken (dragged). What evaporates before the hole is taped is lost from the reading. A hand held on the bottle warms it.',
    'As the water moves, the gas volume grows by SΔh/2 — the official solution corrects for it.',
    '"There is no need to repeat the measurement after a successful attempt as getting the bottle free from vapours is time consuming" (the sheet) — here too, an opened bottle needs a few minutes to air.'] }
};

var LAB = { water: 0, conn: false, taped: false, liq: 0, pv: 0, nAir: null, dh: 0, dT: 0, air: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드에 U자로 건 관(왼쪽 끝은 열림, 오른쪽 끝은 마개에 꽂힘)과 그 사이의 1 m 자, 바늘구멍이 뚫린 0.5 L 병, 물 주사기, 미지 액체 주사기, 테이프, 기압과 실온을 적은 칠판.',
           en: 'On the desk: the pipe hung as a U on the stand (its left end open, its right end through the plug) with a 1 m ruler between the arms, the 0.5 L bottle with a needle hole, the water syringe, the syringe of unknown fluid, tape, and the blackboard with the air pressure and room temperature.' },
  howto: { ko: ['물 주사기 클릭: 관의 왼쪽 끝으로 물 5 mL 넣기 (U자 바닥을 채우고 양쪽 팔에 물이 오도록)',
                '병의 입(마개) 클릭: 관이 꽂힌 마개를 병에 끼우기 / 빼기 (빼면 병이 환기됨)',
                '미지 액체 주사기 클릭: 병의 바늘구멍으로 0.5 mL 쏘기 (구멍이 열려 있어야 함)',
                '바늘구멍 클릭: 테이프로 막기 / 떼기 — 쏘고 나서 빨리!',
                '병 끌기: 흔들어 증발을 빠르게 (손의 열이 병을 데움)',
                '자 클릭: 두 수면 높이 가까이 보기 · ×10 으로 시간을 빨리'],
           en: ['Click the water syringe: 5 mL of water into the pipe\'s left end (fill the bottom of the U so that both arms hold water)',
                'Click the bottle\'s mouth: put the plug (with the pipe through it) in or take it out (out airs the bottle)',
                'Click the syringe of unknown fluid: squirt 0.5 mL through the needle hole (the hole must be open)',
                'Click the needle hole: tape it shut / take the tape off — quickly after squirting!',
                'Drag the bottle: shake it to speed the evaporation (your hand warms it)',
                'Click the ruler: look closely at the two water levels · ×10 to make time run faster'] },
  notePlaceholder: { ko: '예) 막기 전 수면 차 0; 막고 3분 뒤 왼쪽 61.3 cm, 오른쪽 28.6 cm → Δh = 32.7 cm', en: 'e.g. before taping no difference; 3 min after: left 61.3 cm, right 28.6 cm → Δh = 32.7 cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var p0 = 101.3e3 + S.sys('p0', 800), T0 = 21.6 + S.sys('T0', 1.0), Rg = 8.314, rho = 998, g = 9.81;
    var Sx = Math.PI * 0.003 * 0.003;                                   /* m²: the pipe */
    var Vb = 0.5e-3 * (1 + S.sys('Vb', 0.015)), Mol = 46.07e-3, rhoL = 789;
    function psat(Tc) { return 133.322 * Math.pow(10, 8.20417 - 1642.89 / (230.3 + Tc)); }
    var XL = -6, XR = 6, YB = 8, YTOP = 96, HOLE = [36, 14.5, 5.2], BX = 36, BZ = 0;
    var tape = false;
    /* where the water stands: mean level from the amount, the two arms ± Δh/2 */
    function levels() {
      var Lw = LAB.water * 1e-6 / Sx * 100 - (XR - XL);                  /* cm of water in the two arms together */
      if (Lw <= 0) return null;
      var mean = YB + Lw / 2; return [mean + LAB.dh / 2, mean - LAB.dh / 2];
    }
    var stick = 'm:ruler';
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, speeds: [1, 10],
      home: { yaw: -0.4, pitch: 0.32, k: 5.2, tx: 14, ty: 46, tz: 0 },
      views: {
        ruler: { yaw: 0, pitch: 0.02, k: 22, tx: 0, ty: 50, tz: 2, title: { ko: '자와 두 수면', en: 'The ruler and the two levels' },
                 hint: { ko: '수면(물의 아래쪽 굽은 면)의 눈금 읽기 · 휠로 확대 · Esc: 돌아가기', en: 'Read the levels (the bottom of the meniscus) · wheel to zoom · Esc: back' } },
        bottle: { yaw: -0.2, pitch: 0.35, k: 26, tx: BX, ty: 10, tz: BZ, title: { ko: '병', en: 'The bottle' } },
        board: { yaw: 0.25, pitch: 0.35, k: 30, tx: -30, ty: 9, tz: -8, title: { ko: '칠판', en: 'The blackboard' } }
      },
      frame: function (b) {
        var dt = b.dt, i;
        /* the physics */
        var shaking = b.dragging('bottle');
        if (shaking) LAB.dT = Math.min(3, LAB.dT + dt * 0.02); else LAB.dT -= dt * LAB.dT / 300;
        var Tk = T0 + LAB.dT + 273.15, lv = levels();
        if (dt > 0) {
          var V = Vb + (lv ? Sx * (YTOP - lv[1]) / 100 : Sx * (YTOP - YB) / 100);
          if (!LAB.conn) {                                                /* the open bottle airs */
            LAB.pv -= dt * LAB.pv / 120; LAB.liq = Math.max(0, LAB.liq - dt * 0.004); LAB.dh += (0 - LAB.dh) * Math.min(1, dt * 3);
          } else {
            var nv = LAB.pv * V / (Rg * Tk), mlLeft = LAB.liq - nv * Mol / rhoL * 1e6;
            var target = Math.min(psat(Tk - 273.15), (LAB.liq * 1e-6 * rhoL / Mol) * Rg * Tk / V);
            var tau = shaking ? 15 : 60; LAB.pv += (target - LAB.pv) * Math.min(1, dt / tau);
            if (!LAB.taped) { LAB.nAir = (p0 - LAB.pv) * V / (Rg * Tk); LAB.dh += (0 - LAB.dh) * Math.min(1, dt * 3); }
            else if (lv) {
              /* (n_air RT/V(Δh) + p_v) − p0 = ρgΔh, solved by bisection; the water follows in about a second */
              var lo = -0.95, hi = 0.95;
              for (i = 0; i < 50; i++) { var m = (lo + hi) / 2, mean = (lv[0] + lv[1]) / 2, yR = mean - m * 50,
                Vg = Vb + Sx * (YTOP - yR) / 100, f = LAB.nAir * Rg * Tk / Vg + LAB.pv - p0 - rho * g * m; if (f > 0) lo = m; else hi = m; }
              var want = (lo + hi) / 2 * 100; LAB.dh += (want - LAB.dh) * Math.min(1, dt * 1.5);
            }
          }
        }
        lv = levels();
        if (lv && lv[1] < YB + 0.5 && LAB.conn && LAB.taped) { b.say('물이 U자 바닥까지 밀려 공기가 빠져나갔습니다.', 'The water was pushed to the bottom of the U and the gas escaped.'); LAB.taped = false; }
        if (lv && lv[0] > YTOP) { LAB.water -= Sx * (lv[0] - YTOP) / 100 * 1e6; b.say('물이 관 끝으로 넘쳤습니다.', 'Water spilled out of the open end.'); }
        /* the desk, the stand, the U-pipe and the ruler */
        B3.desk(-45, 55, -24, 24);
        B3.stand(0, -9, 100, { bw: 12, bd: 10 });
        B3.box3(-8, 8, YTOP - 1, YTOP + 1, -9.6, -8.4, '#9aa0a6');                   /* the cross-bar the pipe is taped to */
        var pr = 0.5, wr = 0.32, pc = 'rgba(210,230,240,.28)', wc = 'rgba(90,150,215,.75)';
        B3.cyl3('y', YB, YTOP, XL, -8, pr, pc, { seg: 12, caps: false });
        B3.cyl3('y', YB, YTOP, XR, -8, pr, pc, { seg: 12, caps: false });
        B3.cyl3('x', XL, XR, YB, -8, pr, pc, { seg: 12, caps: false });
        if (LAB.water > 0) {
          var have = LAB.water * 1e-6 / Sx * 100;
          if (lv) { B3.cyl3('x', XL, XR, YB, -8, wr, wc, { seg: 10 }); B3.cyl3('y', YB, lv[0], XL, -8, wr, wc, { seg: 10 }); B3.cyl3('y', YB, lv[1], XR, -8, wr, wc, { seg: 10 }); }
          else B3.cyl3('x', XL, XL + have, YB, -8, wr, wc, { seg: 10 });
        }
        var yr = B3.meterStick(0, -7.6, 100, stick);
        /* the pipe from the right arm over to the bottle */
        B3.cable([XR, YTOP, -8], LAB.conn ? [BX, 23.5, BZ] : [BX - 9, 2, BZ + 6], 'rgba(205,225,235,.7)', 18, 4);
        /* the bottle, its plug and its needle hole */
        var jig = shaking ? Math.sin(b.t * 40) * 0.4 : 0, bx = BX + jig;
        B3.cyl3('y', 0, 17, bx, BZ, 4.6, 'rgba(200,225,235,.3)', { id: 'm:bottle', seg: 28, cap: 'rgba(210,235,245,.3)' });
        B3.cyl3('y', 17, 20, bx, BZ, 2.0, 'rgba(200,225,235,.35)', { id: 'm:bottle', seg: 20, caps: false });
        if (LAB.liq > 0.02) B3.cyl3('y', 0.05, 0.05 + Math.min(1, LAB.liq * 0.02 + 0.03), bx, BZ, 4.3, 'rgba(240,230,170,.6)', { seg: 24 });
        if (LAB.conn) B3.cyl3('y', 19.5, 22, bx, BZ, 1.6, '#3a3a3a', { id: 'c:mouth', seg: 16 });
        else { B3.cyl3('y', 20, 20.1, bx, BZ, 1.8, 'rgba(0,0,0,.25)', { id: 'c:mouth', seg: 16 }); B3.cyl3('y', 0, 2.5, BX - 9, BZ + 6, 1.6, '#3a3a3a', { seg: 16 }); }
        B3.cyl3('z', BZ + 4.55, BZ + 4.7, bx, HOLE[1], LAB.taped ? 0.9 : 0.25, LAB.taped ? '#d9cf9f' : '#111', { id: 'c:hole', seg: 12 });
        /* the syringes, the tape, the blackboard */
        B3.cyl3('x', 14, 26, 1.2, 14, 0.9, 'rgba(220,235,245,.6)', { id: 'c:syrW', seg: 14 }); B3.cyl3('x', 14, 14 + Math.max(0.5, 12 - LAB.water * 0.12), 1.2, 14, 0.75, 'rgba(90,150,215,.7)', { seg: 12 });
        B3.text3([14, 2.3, 15.2], [1, 0, 0], [0, 0, -1], 'H₂O', 0.9, '#2f6ea6', { weight: '800' });
        B3.cyl3('x', 14, 22, 1.0, 19, 0.7, 'rgba(220,235,245,.6)', { id: 'c:syrX', seg: 14 }); B3.cyl3('x', 14, 14 + Math.max(0.3, 8 - LAB.used * 3 || 8), 1.0, 19, 0.55, 'rgba(240,230,170,.8)', { seg: 12 });
        B3.text3([14, 1.9, 20.2], [1, 0, 0], [0, 0, -1], '?', 1.1, '#8a6a10', { weight: '800' });
        B3.cyl3('y', 0, 2, 44, 16, 2.2, '#d9cf9f', { seg: 18, cap: '#bdb385' }); B3.cyl3('y', 0, 2.05, 44, 16, 1.2, '#b8b8b8', { seg: 14 });
        B3.box3(-40, -20, 0, 18, -14, -12.5, '#26302a', { id: 'm:board' });
        B3.text3([-38.5, 15, -12.45], [1, 0, 0], [0, -1, 0], 'p₀ = ' + (p0 / 1000).toFixed(1) + ' kPa', 1.6, '#f0f0e8', { weight: '600' });
        B3.text3([-38.5, 11, -12.45], [1, 0, 0], [0, -1, 0], 'T₀ = ' + T0.toFixed(1) + ' °C', 1.6, '#f0f0e8', { weight: '600' });
        /* the hands' clicks */
        if (b.clicked('c:syrW')) { if (lv && lv[0] > YTOP - 6) b.say('관이 거의 찼습니다.', 'The pipe is nearly full.'); else { LAB.water += 5; b.say('물 5 mL를 넣었습니다.', '5 mL of water added.'); } }
        if (b.clicked('c:mouth')) { LAB.conn = !LAB.conn; if (LAB.conn) { LAB.taped = false; b.say('마개를 끼웠습니다 — 바늘구멍은 아직 열려 있습니다.', 'Plug in — the needle hole is still open.'); } else { LAB.taped = false; b.say('마개를 뺐습니다. 병을 환기합니다.', 'Plug out; the bottle airs.'); } }
        if (b.clicked('c:hole')) { if (!LAB.conn) b.say('먼저 마개를 끼우세요.', 'Put the plug in first.'); else { LAB.taped = !LAB.taped; b.say(LAB.taped ? '테이프로 막았습니다.' : '테이프를 뗐습니다.', LAB.taped ? 'Taped shut.' : 'Tape off.'); } }
        if (b.clicked('c:syrX')) { if (LAB.taped) b.say('구멍이 테이프로 막혀 있습니다.', 'The hole is taped.'); else if ((LAB.used || 0) >= 2.5) b.say('주사기가 비었습니다.', 'The syringe is empty.'); else { LAB.liq += 0.5; LAB.used = (LAB.used || 0) + 0.5; b.say('미지의 액체 0.5 mL를 쏘았습니다 — 얼른 막으세요!', '0.5 mL of the fluid squirted in — tape the hole quickly!'); } }
        b.views.ruler.ty = lv ? (lv[0] + lv[1]) / 2 : 30;
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
