<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;

  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

/* ══════════════════════════════════════════════════════════════
   4.  THE CIRCUIT  (a small nodal solver with the non-linear photodiode)
   ══════════════════════════════════════════════════════════════ */
function solveGauss(A,b){ const n=b.length, M=A.map((r,i)=>[...r,b[i]]);

function netOf(){ const par=Object.fromEntries(TERMS.map(t=>[t[0],t[0]])); const f=a=>{ while(par[a]!==a){ par[a]=par[par[a]]; a=par[a]; } return a; };

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }

/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}

function dropWires(k){ ST.wires=ST.wires.filter(([a,b])=>OWNER[a]!==k&&OWNER[b]!==k); if(ST.pend&&OWNER[ST.pend]===k) ST.pend=null; }
function clearSlot(s){ const k=ST.slot[s]; if(!k) return;
  if(k==="screen"){ ST.sample=null; } if(k==="lcc") ST.lccConn=false; if(k==="led"||k==="laser"){ ST.srcConn=false; ST.srcOn=false; }
  if(k==="pd") dropWires("pd"); if(s==="1c"){ ST.paper=false; ST.filtersOn=false; ST.nf=0; } ST.slot[s]=null; ST.back[k]=false; }
function place(k,p){
  if(["led","laser","pol1","pol2","screen","lcc","pd"].includes(k)){ const s=nearSlot(p); if(!s){ say("noFit"); return false; }
    if(!ACCEPT[s].includes(k)){ say("slotNo",s); return false; } if(ST.slot[s]){ say("noFit"); return false; }
    ST.slot[s]=k; ST.hand=false; if(k==="led"||k==="laser") ST.srcConn=false; return true; }
  if(["ruler1","ruler2","strip"].includes(k)){
    const b=slotBox("1e"), q1=P(SX["1c"],BY,ZA), q2=P(SX["1d"],BY,ZA);
    if(ST.slot["1e"]==="screen"&&inBox(p,b,20)){ const c=ST.sample; ST.hand=false;
      ST.sample=k==="strip"?"strip":(k==="ruler1"?(c==="ruler2"||c==="both"?"both":"ruler1"):(c==="ruler1"||c==="both"?"both":"ruler2")); say("onScreen"); return true; }
    if(!ST.slot["1e"]&&p[0]>q1[0]&&p[0]<q2[0]&&Math.abs(p[1]-q1[1])<90){ ST.sample=k; ST.hand=true; ST.rot=0; say("byHand"); return true; }
    say("between"); return false; }
  if(k==="filters"||k==="paper"){ if(!polAt("1c")){ say("needPol"); return false; } if(!inBox(p,slotBox("1c"),25)){ say("onPol"); return false; }
    if(k==="filters"){ ST.filtersOn=true; ST.nf=0; } else ST.paper=true; return true; }
  const [x,y]=unP(p[0],p[1],0); if(!fits(k,x,y)){ say("noFit"); return false; } ST.it[k].x=x; ST.it[k].y=y; ST.it[k].on=true; return true;
}
function returnAt(p){
  const s=slotAt(p);
  if(s){ if(s==="1e"&&ST.sample&&!ST.hand){ say("back",itemName(ST.sample==="both"?"ruler2":ST.sample)); ST.sample=ST.sample==="both"?"ruler1":null; return; }
    if(s==="1c"&&ST.paper){ ST.paper=false; say("back",itemName("paper")); return; } if(s==="1c"&&ST.filtersOn){ ST.filtersOn=false; ST.nf=0; say("back",itemName("filters")); return; }
    const k=ST.slot[s]; clearSlot(s); say("back",itemName(k)); return; }
  if(ST.hand&&ST.sample){ const q1=P(SX["1c"],BY,ZA), q2=P(SX["1d"],BY,ZA); if(p[0]>q1[0]&&p[0]<q2[0]&&Math.abs(p[1]-q1[1])<60){ say("back",itemName(ST.sample)); ST.sample=null; ST.hand=false; return; } }
  const k=tableAt(p); if(k){ dropWires(k); if(k==="supply"){ ST.srcConn=false; ST.srcOn=false; } if(k==="lccsupply"){ ST.lccConn=false; ST.lccOn=false; } ST.it[k].on=false; say("back",itemName(k)); }
}
function benchClick(p,right){
  if(hand){ if(right){ say(hand.move?"placed":"back",itemName(hand.item)); if(hand.move) ST.it[hand.item].on=true; hand=null; return; }
    if(hand.move){ const k=hand.item; if(place(k,p)){ say("placed",itemName(k)); hand=null; } return; }
    if(place(hand.item,p)){ say("placed",itemName(hand.item)); hand=null; } return; }
  if(right){ ST.pend=null; returnAt(p); return; }
  const t=termAt(p);
  if(t){ if(!ST.pend){ ST.pend=t; return; } if(ST.pend===t){ ST.pend=null; return; }
    const a=ST.pend, b=t; if(!ST.wires.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))) ST.wires.push([a,b]); ST.pend=null; say("wire"); return; }
  for(let i=0;i<WIRE_MID.length;i++){ if(Math.hypot(WIRE_MID[i][0]-p[0],WIRE_MID[i][1]-p[1])<8){ ST.wires.splice(i,1); say("unwire"); return; } }
  const k=tableAt(p); if(k){ ST.it[k].on=false; hand={item:k,move:true,from:[ST.it[k].x,ST.it[k].y]}; say("picked",itemName(k)); }
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
cv.addEventListener("wheel",e=>{ const p=lpos(e), s=slotAt(p), dir=e.deltaY<0?1:-1, f=e.shiftKey; if(!s) return; const k=ST.slot[s];
  if(k==="screen"){ e.preventDefault(); ST.screenX=Math.max(0,Math.min(140,+(ST.screenX+dir*(f?0.1:0.5)).toFixed(2))); }
  else if(k==="pol1"||k==="pol2"){ e.preventDefault(); ST.back[k]=!ST.back[k]; say("flip",itemName(k)); }
  else if(k==="laser"){ e.preventDefault(); ST.ring=((ST.ring+dir*(f?0.5:2))%360+360)%360; } },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(hand&&hand.move) ST.it[hand.item].on=true; hand=null; ST.pend=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    if(hand&&hand.move) return; const same=hand&&hand.item===k; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); }
    drawTray(); return; } });

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const h=hitAt(clpos(e)); if(!h) return;
  if(h.k.startsWith("mm:")) ST.mm=h.k.slice(3);
  else if(h.k==="sw") ST.sw=!ST.sw;
  else if(h.k==="lpow") $("lccPwr").onclick();
  else if(h.k==="src") $("srcBtn").onclick(); });
closeCv.addEventListener("wheel",e=>{ const h=hitAt(clpos(e)); if(!h) return; e.preventDefault(); const dir=e.deltaY<0?1:-1, f=e.shiftKey;
  if(h.k==="view") ST.screenX=Math.max(0,Math.min(140,+(ST.screenX+dir*(f?0.1:0.5)).toFixed(2)));
  else if(h.k==="rknob") ST.Rknob=Math.max(0,Math.min(1,+(ST.Rknob+dir*(f?0.0005:0.004)).toFixed(5)));
  else if(h.k==="lknob") ST.lccKnob=Math.max(0,Math.min(1,+(ST.lccKnob+dir*(f?0.0005:0.003)).toFixed(5)));
  else if(h.k==="ring") ST.ring=((ST.ring+dir*(f?0.5:2))%360+360)%360;
  else if(h.k==="screw") ST.laserW=Math.max(1.5,Math.min(12,+(ST.laserW+dir*(f?0.05:0.25)).toFixed(3)));
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("srcBtn").onclick=()=>{ if(!ST.it.supply.on){ say("needSup"); return; } ST.srcOn=!ST.srcOn; say("src",ST.srcOn); };
$("leadBtn").onclick=()=>{ if(ST.srcConn){ ST.srcConn=false; say("lead",false); return; } if(!source()){ say("needSrc"); return; } if(!ST.it.supply.on){ say("needSup"); return; } ST.srcConn=true; say("lead",true); };
$("lccBtn").onclick=()=>{ if(ST.lccConn){ ST.lccConn=false; say("lcc",false); return; } if(ST.slot["1e"]!=="lcc"){ say("needLcc"); return; } if(!ST.it.lccsupply.on){ say("needLccSup"); return; } ST.lccConn=true; say("lcc",true); };
$("lccPwr").onclick=()=>{ if(!ST.it.lccsupply.on){ say("needLccSup"); return; } ST.lccOn=!ST.lccOn; say("lccPwr",ST.lccOn); };
$("fMinus").onclick=()=>{ if(!ST.filtersOn){ say("noFilt"); return; } ST.nf=Math.max(0,ST.nf-1); say("filt",ST.nf); };
$("fPlus").onclick=()=>{ if(!ST.filtersOn){ say("noFilt"); return; } ST.nf=Math.min(5,ST.nf+1); say("filt",ST.nf); };
$("rotL").onclick=()=>{ if(!ST.hand){ say("noHand"); return; } ST.rot-=5; say("rot"); };
$("rotR").onclick=()=>{ if(!ST.hand){ say("noHand"); return; } ST.rot+=5; say("rot"); };
$("wireClr").onclick=()=>{ ST.wires=[]; ST.pend=null; say("wiresClr"); };
$("noteBtn").onclick=()=>{ const parts=[]; if(MMT[0]) parts.push(MMT[0]+" "+MMT[1]); if(ST.slot["1e"]==="screen") parts.push("x≈"+ST.screenX.toFixed(1)+" mm"); if(ST.filtersOn) parts.push("n="+ST.nf);
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderPanel(){ const t=d();
  $("srcBtn").textContent=ST.srcOn?t.srcOff:t.srcOn; $("leadBtn").textContent=ST.srcConn?t.leadOff:t.leadOn; $("lccBtn").textContent=ST.lccConn?t.lccOff:t.lccOn; $("lccPwr").textContent=ST.lccOn?t.lccPwrOff:t.lccPwrOn;
  $("filtLbl").textContent=ST.filtersOn?t.filtLbl(ST.nf):t.filtNone; }
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>placed(k))) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pend) L.push([t.st.pend(t.tlab[ST.pend]),false]);
  if(lit()) L.push([t.st.srcOn,true]); if(lit()&&source()==="laser") L.push([t.st.laser,true]);
  if(ST.mm==="ohm"&&lit()&&ST.sw) L.push([t.st.ohmLive,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-src").textContent=t.hSrc; $("t-h-filt").textContent=t.hFilt; $("t-h-rot").textContent=t.hRot; $("rotL").textContent=t.rotL; $("rotR").textContent=t.rotR; $("t-rothint").textContent=t.rotHint;
  $("t-h-wire").textContent=t.hWire; $("wireClr").textContent=t.wireClr; $("t-wirehint").textContent=t.wireHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2014 — 보이지 않는 것을 보라! · HaslaLab":"IPhO 2014 — To See Invisible! · HaslaLab";
  renderTabs(); renderPanel(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastRead=0;
function tick(){
  const now=performance.now(); if(now-lastRead>400){ lastRead=now; MMT=mmText(); }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
