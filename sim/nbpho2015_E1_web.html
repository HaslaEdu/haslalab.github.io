<script>
/* NBPhO 2015 problem 5 "Radiator" (Mihkel Heidelberg) on the 3-D bench.  An aluminium profile (A = 36 mm²,
   k = 205 W/(K·m)) lies flat on the table; a heating wire is wound round one end and fed from a DC
   supply.  The profile is integrated as a 1-D rod (5 mm cells): ρcA ∂T/∂t = kA ∂²T/∂x² − h(T − T0) + heater,
   so it takes the five to ten minutes to settle that the solution speaks of, and in the steady state
   T − T0 falls off as exp(−x√(h/kA)).  h itself is 0.3–0.5 W/(K·m) (the official range) and differs from
   visit to visit.  The infrared thermometer reads the spot under its dot to 0.1 °C. */
var PROGRAM = {
  title: { ko: 'NBPhO 2015 실험 5 — 방열판', en: 'NBPhO 2015 Problem 5 — Radiator' },
  subtitle: { ko: '알루미늄 막대와 주변 공기 사이의 열전달 계수 h = p/(T − T₀) 를 재세요 (p 는 단위 길이당 열 흐름). k = 205 W/(K·m), 단면적 A = 36 mm².',
              en: 'Measure the heat transfer coefficient h = p/(T − T₀) between an aluminium profile and the air (p is the heat flux per unit length). k = 205 W/(K·m), cross-section A = 36 mm².' },
  notes: { ko: [
    '장비: 알루미늄 막대, 전열선, 직류 전원, 적외선 온도계, 자 (문제지 그대로). 막대는 책상에 평평하게 놓아 둡니다.',
    '힌트(문제지): 정상 상태의 온도 분포는 T″(x) = h(T − T₀)/(kA) 를 따르고, 일반해는 T = T₀ + C₁e^{x√(h/kA)} + C₂e^{−x√(h/kA)}.',
    '막대를 5 mm 칸으로 나눠 시간에 따라 적분합니다(알루미늄 ρc = 2.43 MJ/(m³·K)) — 전류를 바꾸면 5~10분 뒤에야 다시 안정됩니다. 오른쪽 위 ×10 · ×60 으로 시간을 빨리 흐르게 할 수 있습니다.',
    '<b>전열선 온도를 150 °C 아래로</b> 유지하세요 — 넘으면 피복과 책상에서 연기가 납니다.',
    '공식 해답: h 는 0.3 ~ 0.5 W/(K·m) (막대를 놓은 모양에 따라 조금 다름). 방문할 때마다 다릅니다.'], en: [
    'Equipment: the aluminium profile, a heating wire, a DC power source, an infrared thermometer and a ruler (as on the sheet). The profile lies flat on the table.',
    'Hint (from the sheet): the stationary temperature obeys T″(x) = h(T − T₀)/(kA), whose general solution is T = T₀ + C₁e^{x√(h/kA)} + C₂e^{−x√(h/kA)}.',
    'The profile is integrated in 5 mm cells over time (aluminium ρc = 2.43 MJ/(m³·K)) — after the current changes it takes five to ten minutes to settle again. The ×10 and ×60 buttons top right make time run faster.',
    '<b>Keep the wire below 150 °C</b> — above that its insulation and the table start to smoke.',
    'Official answer: h between 0.3 and 0.5 W/(K·m) (it depends a little on how the profile lies). It differs from visit to visit.'] }
};

var LAB = { T: null, ir: -20, psu: {}, smoke: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 길이 80 cm 알루미늄 막대(왼쪽 끝 5 cm에 전열선이 감겨 있음)와 그 옆의 1 m 자, KORAD 직류 전원, 적외선 온도계. 전열선은 전원에 이미 이어져 있습니다.',
           en: 'On the desk: an 80 cm aluminium profile (the heating wire wound round its left 5 cm) with a 1 m ruler beside it, a KORAD DC supply and an infrared thermometer. The wire is already connected to the supply.' },
  howto: { ko: ['전원: 클릭해서 가까이 본 뒤 <b>I-SET</b> 을 누르고 엔코더로 전류 한계 설정(엔코더를 누르면 자릿수 이동), <b>V-SET</b> 은 넉넉히, <b>OUTPUT</b> 으로 출력. 전열선 저항은 약 0.5 Ω',
                '온도계: 막대 위로 끌어 옮기기 — 빨간 점 아래가 재는 곳. 클릭하면 위에서 내려다보며 표시창과 자 눈금을 함께 봅니다',
                '시간: 오른쪽 위 ×10 · ×60 (정상 상태까지 실제로는 5~10분)',
                '빈 곳 끌기: 돌려 보기 · 휠: 확대 · 더블클릭: 처음 시점'],
           en: ['Supply: click it to look closer, press <b>I-SET</b> and turn the encoder for the current limit (push the encoder to step the digit), set <b>V-SET</b> high enough, then <b>OUTPUT</b>. The wire is about 0.5 Ω',
                'Thermometer: drag it along the profile — the red dot marks the spot it reads. Click it to look down at its display and the ruler together',
                'Time: ×10 · ×60 top right (the steady state takes 5–10 minutes in real time)',
                'Drag empty space: turn · wheel: zoom · double-click: first view'] },
  notePlaceholder: { ko: '예) I = 4.00 A, 10분 뒤: x = 6 cm 71.2 °C, x = 10 cm 52.8 °C, …, 끝 23.1 °C', en: 'e.g. I = 4.00 A, after 10 min: x = 6 cm 71.2 °C, x = 10 cm 52.8 °C, …, far end 23.1 °C' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var h = 0.4 * (1 + S.sys('h', 0.1)), T0 = 22.0 + S.sys('T0', 0.8), kA = 205 * 36e-6, rcA = 2.43e6 * 36e-6;
    var Rw = 0.5 * (1 + S.sys('Rw', 0.05)), eta = 0.55;                                 /* the part of the wire's heat that goes into the profile */
    var Lm = 0.8, N = 160, dx = Lm / N, HEAT = 10;                                      /* the wire covers the first 10 cells (5 cm) */
    var irOff = S.sys('irOff', 0.3);
    if (!LAB.T) { LAB.T = new Float64Array(N); LAB.T.fill(T0); LAB.Tw = T0; }
    var T = LAB.T, X0 = -40, BW = 1.8, BH = 0.25, PZ = 10;                                       /* the profile from x = X0 cm */
    LAB.psu.loadR = function () { return Rw; };
    LAB.psu.iset = LAB.psu.iset || 0;
    var ruler = B3.scaleTex(100, { horiz: true, width: 2.6, bg: '#d9dcdf', label: 'cm' });
    var cellAt = function (xcm) { return Math.max(0, Math.min(N - 1, Math.floor((xcm - X0) / 100 / dx))); };
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, speeds: [1, 10, 60],
      home: { yaw: -0.35, pitch: 0.75, k: 8.5, tx: 5, ty: 2, tz: 0 },
      views: {
        psu: { yaw: 0, pitch: 0.1, k: 52, tx: 26, ty: 6, tz: -12, title: { ko: 'KORAD 직류 전원', en: 'KORAD DC supply' } },
        ir: { yaw: 0, pitch: 1.2, k: 40, tx: 0, ty: 2, tz: 13, title: { ko: '적외선 온도계와 자', en: 'IR thermometer and ruler' },
              hint: { ko: '온도계를 끌어 옮기기 · 빨간 점의 자 눈금과 표시창 읽기 · Esc: 돌아가기', en: 'Drag the thermometer · read the dot on the ruler and the display · Esc: back' } }
      },
      frame: function (b) {
        var dt = b.dt, I = LAB.psu.I || 0, P = I * I * Rw;
        /* the rod, explicitly, 0.1 s steps */
        if (dt > 0) {
          var n = Math.ceil(dt / 0.1), s = dt / n, q = eta * P / (HEAT * dx), Tn = new Float64Array(N);
          for (var it = 0; it < n; it++) {
            for (var i = 0; i < N; i++) {
              var l = i > 0 ? T[i - 1] : T[i], r = i < N - 1 ? T[i + 1] : T[i];
              var src = (i < HEAT ? q : 0) - h * (T[i] - T0) - (i < HEAT ? 0.35 * (T[i] - T0) : 0);      /* the coil also sheds some heat */
              Tn[i] = T[i] + s * (kA * (l - 2 * T[i] + r) / (dx * dx) + src) / rcA;
            }
            T.set(Tn);
            /* the wire: its own small heat capacity, joined to the profile's end */
            LAB.Tw += s * ((1 - eta) * P - 0.25 * (LAB.Tw - T[4])) / 1.5;
          }
          if (LAB.Tw > 150) { LAB.smoke += dt; if (LAB.smoke > 2) { b.say('전열선에서 연기가 납니다! 전류를 줄이세요.', 'The wire is smoking! Turn the current down.'); LAB.smoke = -6; } } else LAB.smoke = Math.min(LAB.smoke, 0);
        }
        B3.desk(-50, 50, -28, 22);
        /* the profile, tinted by nothing — aluminium looks the same hot or cold */
        B3.box3(X0, X0 + Lm * 100, 0, BH, PZ - BW / 2, PZ + BW / 2, '#b8bec4', { top: '#cdd3d8', id: 'm:prof' });
        B3.spring([X0 + 0.3, BH / 2, PZ], [X0 + 5, BH / 2, PZ], 14, 1.05, LAB.Tw > 150 ? '#8a5a2a' : '#c87533', 1.8);
        if (LAB.Tw > 150) B3.sphere3([X0 + 2.5, 3 + Math.sin(b.t * 3) * 0.5, PZ], 1.2, 'rgba(200,200,200,.35)');
        /* the leads from the wire to the supply */
        var j = B3.korad(b, 'psu', [26, -12], LAB.psu);
        B3.cable([X0 + 0.3, BH / 2, PZ - 1.1], j.plus, '#c0392b', 6, 2.2); B3.cable([X0 + 5, BH / 2, PZ - 1.1], j.minus, '#1b1b1b', 6, 2.2);
        /* the ruler beside it, its 0 at the heated end */
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [X0 - 1, 0.03, PZ + 1.4], [102, 0, 0], [0, 0, 2.6]);
        /* the infrared thermometer, held over the profile */
        var mi = b.moved('ir'); if (mi[0]) LAB.ir = Math.max(X0 - 6, Math.min(X0 + Lm * 100 + 6, LAB.ir + mi[0]));
        var gx = LAB.ir, gy = 9;
        B3.box3(gx - 1.6, gx + 1.6, gy, gy + 3.2, PZ - 1.2, PZ + 1.2, '#2b2f35', { id: 'm:ir', top: '#3a3f46' });
        B3.box3(gx - 1.0, gx + 1.0, gy - 4.5, gy, PZ - 0.9, PZ + 0.9, '#c94a2b', { id: 'm:ir' });              /* the grip */
        var onProf = gx >= X0 && gx <= X0 + Lm * 100, tread;
        if (onProf) { var c = cellAt(gx), c0 = cellAt(gx - 0.3), c1 = cellAt(gx + 0.3), sum = 0; for (var k = c0; k <= c1; k++) sum += T[k]; tread = sum / (c1 - c0 + 1); }
        else tread = T0;
        tread = Math.round((tread + irOff + HL.gauss(0.05)) * 10) / 10;
        B3.line3([gx, gy - 0.2, PZ + 1.25], [gx, onProf ? BH : 0.02, PZ + 0.15], 'rgba(255,40,40,.5)', 1);
        B3.sphere3([gx, (onProf ? BH : 0.02) + 0.02, PZ + 0.15], 0.18, '#ff2a2a');
        var cv = b.panel('irlcd', 200, 120, function (ui) { var g = ui.g; HL.rr(g, 0, 0, 200, 120, 10, '#20242a'); HL.rr(g, 12, 12, 176, 96, 6, '#b8c6a4');
          HL.text(g, tread.toFixed(1), 160, 66, '#1b2318', 46, 'right', '700', HL.MONO); HL.text(g, '°C', 182, 40, '#1b2318', 16, 'right', '800'); });
        B3.tex3(cv, 0, 0, cv.width, cv.height, [gx - 1.4, gy + 3.21, PZ - 1.0], [2.8, 0, 0], [0, 0, 1.7], { id: 'm:ir' });
        b.views.ir.tx = gx;
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
