/* ══════════════════════════════════════════════════════════════
   1.  PHYSICS  —  identical to the Python constants
   ══════════════════════════════════════════════════════════════ */
const MU0=4e-7*Math.PI, SB=5.670e-8, T_AMB=303.5;
const MAT={
  AL:   {sigma:3.70e7,mur:1,  t:0.73e-3,alpha:0.005,n:5,c1:"#d5d9dd"},
  CU:   {sigma:5.88e7,mur:1,  t:0.71e-3,alpha:0.005,n:5,c1:"#d98a55"},
  SS304:{sigma:1.39e6,mur:1,  t:0.72e-3,alpha:0.005,n:4,c1:"#c3c8cc"},
  SS410:{sigma:1.70e6,mur:700,t:0.76e-3,alpha:0.55, n:4,c1:"#cfd6da"}};
const PAN={AL:{rho:2700,c:900,t:0.73e-3,e:0.65,r40:0.0546}, SS410:{rho:7700,c:460,t:0.76e-3,e:0.80,r40:0.1377}};
for(const k in PAN){ const p=PAN[k]; p.area=2*0.02*0.02; p.mass=p.rho*0.02*0.02*p.t; }
const COIL_L=47.2e-6, COIL_RL=0.47, COIL_M=5.79e-6;
const R1_OHM=1.0, RCAB=0.0225, RSCOPE=1e6;
const FG_EMAX=32.0, FG_RS=2.0, FG_ILIM=4.0;
const NTC_R0=10000, NTC_T0=298, NTC_B=3950;
const CAPS={C470N:[470e-9,0.010,"470 nF",true], C470U:[470e-6,0.030,"470 µF",false],
            C1000U:[1000e-6,0.030,"1000 µF",false], C2200U:[2200e-6,0.030,"2200 µF",false]};
const CAP_ORDER=["C470N","C470U","C1000U","C2200U"];
const TERMS=["FGP","FGN","R1A","R1B","CBA","CBB","C1A","C1B","C2A","C2B","NTCA","NTCB"];
const TIDX={}; TERMS.forEach((t,i)=>TIDX[t]=i);

const skinDepth=(k,f)=>1/Math.sqrt(Math.PI*MAT[k].sigma*MAT[k].mur*MU0*Math.max(f,1e-9));
function shielding(stack,f){
  if(!stack.length) return 1;
  const dFr=6e-3*Math.pow(1000/Math.max(f,1),0.15);
  let s=0, sf=0, al=0;
  for(const k of stack){ const m=MAT[k]; s+=m.t/skinDepth(k,f); sf+=m.t/dFr; al=Math.max(al,m.alpha); }
  return (1-al)*Math.exp(-s)+al*Math.exp(-sf);
}
const rntc=T=>NTC_R0*Math.exp(NTC_B*(1/T-1/NTC_T0));
const rload=(k,f)=>PAN[k].r40*Math.sqrt(Math.max(f,1)/40000);

/* complex numbers as [re, im] */
const C=(r,i)=>[r,i||0];
const cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const csub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cdiv=(a,b)=>{ const q=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q]; };
const cabs=a=>Math.hypot(a[0],a[1]);
function csolve(A,b){
  const n=b.length, M=A.map((r,i)=>r.map(v=>[v[0],v[1]]).concat([[b[i][0],b[i][1]]]));
  for(let k=0;k<n;k++){
    let piv=k, best=cabs(M[k][k]);
    for(let i=k+1;i<n;i++){ const a=cabs(M[i][k]); if(a>best){best=a;piv=i;} }
    if(best<1e-300) return null;
    if(piv!==k){ const t=M[k]; M[k]=M[piv]; M[piv]=t; }
    const dk=M[k][k];
    for(let j=k;j<=n;j++) M[k][j]=cdiv(M[k][j],dk);
    for(let i=0;i<n;i++){
      if(i===k) continue;
      const f=M[i][k]; if(f[0]===0&&f[1]===0) continue;
      for(let j=k;j<=n;j++) M[i][j]=csub(M[i][j],cmul(f,M[k][j]));
    }
  }
  return M.map(r=>r[n]);
}
/* complex modified nodal analysis */
function analyze(st,f){
  const N=TERMS.length, gnd=TIDX.FGN, w=2*Math.PI*f;
  const nmap=new Array(N); let c=0;
  for(let i=0;i<N;i++) nmap[i]= i===gnd ? -1 : c++;
  const size=(N-1)+3;
  const A=[...Array(size)].map(()=>[...Array(size)].map(()=>C(0))), b=[...Array(size)].map(()=>C(0));
  const at=(i,j,v)=>{ if(i>=0&&j>=0) A[i][j]=cadd(A[i][j],v); };
  const stampY=(na,nb,Y)=>{ const a=nmap[na], bb=nmap[nb]; at(a,a,Y); at(bb,bb,Y); at(a,bb,[-Y[0],-Y[1]]); at(bb,a,[-Y[0],-Y[1]]); };
  const stampR=(na,nb,R)=>{ if(R>0) stampY(na,nb,C(1/R)); };
  for(let i=0;i<N;i++) if(i!==gnd) at(nmap[i],nmap[i],C(1e-9));
  for(const [ca,cb] of st.cables) stampR(TIDX[ca],TIDX[cb],RCAB);
  stampR(TIDX.R1A,TIDX.R1B,R1_OHM);
  if(st.cap){ const [Cc,esr]=CAPS[st.cap]; stampY(TIDX.CBA,TIDX.CBB,cdiv(C(1),C(esr,-1/(w*Cc)))); }
  if(st.pan) stampR(TIDX.NTCA,TIDX.NTCB,rntc(st.panT));
  if(st.scope&&st.scope[0]&&st.scope[1]) stampR(TIDX[st.scope[0]],TIDX[st.scope[1]],RSCOPE);
  if(st.dmm&&st.dmm[0]&&st.dmm[1]) stampR(TIDX[st.dmm[0]],TIDX[st.dmm[1]],1e7);
  let rex=0;
  if(st.pan) rex+=rload(st.pan,f);
  if(st.stack.length) rex+=0.02*Math.sqrt(Math.max(f,1)/40000)*st.stack.length;
  const Meff=COIL_M*shielding(st.stack,f);
  const bFG=N-1, bL1=N, bL2=N+1;
  at(nmap[TIDX.FGP],bFG,C(1)); at(nmap[TIDX.FGN],bFG,C(-1));
  at(bFG,nmap[TIDX.FGP],C(1)); at(bFG,nmap[TIDX.FGN],C(-1));
  at(bFG,bFG,C(-FG_RS)); b[bFG]=C(st.E);
  const Zc=C(COIL_RL+rex,w*COIL_L), Zm=C(0,w*Meff);
  for(const [br,p,m,other] of [[bL1,"C1A","C1B",bL2],[bL2,"C2A","C2B",bL1]]){
    at(nmap[TIDX[p]],br,C(1)); at(nmap[TIDX[m]],br,C(-1));
    at(br,nmap[TIDX[p]],C(1)); at(br,nmap[TIDX[m]],C(-1));
    at(br,br,[-Zc[0],-Zc[1]]); at(br,other,[-Zm[0],-Zm[1]]);
  }
  let x=csolve(A,b);
  if(!x) return null;
  const ifg=cabs(x[bFG]);
  if(ifg>FG_ILIM){ const s2=FG_ILIM/ifg; x=x.map(v=>[v[0]*s2,v[1]*s2]); }
  const V={}; for(const t of TERMS) V[t]= TIDX[t]===gnd ? C(0) : x[nmap[TIDX[t]]];
  return {V, I1:x[bL1], I2:x[bL2], amp:(t1,t2)=>(t1&&t2)?cabs(csub(V[t1],V[t2])):0};
}
/* multimeter ohms: the generator is a 2 ohm source impedance, the capacitor is open */
function measureR(st,ta,tb){
  if(!ta||!tb||ta===tb) return Infinity;
  const N=TERMS.length, G=[...Array(N)].map(()=>new Array(N).fill(0));
  const add=(a,b,g)=>{ G[a][a]+=g; G[b][b]+=g; G[a][b]-=g; G[b][a]-=g; };
  for(const [ca,cb] of st.cables) add(TIDX[ca],TIDX[cb],1/RCAB);
  add(TIDX.R1A,TIDX.R1B,1/R1_OHM); add(TIDX.C1A,TIDX.C1B,1/COIL_RL); add(TIDX.C2A,TIDX.C2B,1/COIL_RL);
  if(st.pan) add(TIDX.NTCA,TIDX.NTCB,1/rntc(st.panT));
  add(TIDX.FGP,TIDX.FGN,1/FG_RS);
  for(let i=0;i<N;i++) G[i][i]+=1e-12;
  const ref=TIDX[tb], src=TIDX[ta], keep=[...Array(N).keys()].filter(i=>i!==ref);
  const M=keep.map(i=>keep.map(j=>C(G[i][j]))), rhs=keep.map(i=>C(i===src?1:0));
  const x=csolve(M,rhs); if(!x) return Infinity;
  const R=x[keep.indexOf(src)][0];
  return R>1e7?Infinity:R;
}
/* terminals carrying the generator's signal (both coils once either is in the net) */
function liveTerms(st){
  const par={}; for(const t of TERMS) par[t]=t;
  const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  const join=(a,b)=>{ const ra=find(a), rb=find(b); if(ra!==rb) par[ra]=rb; };
  for(const [a,b] of st.cables) join(a,b);
  join("R1A","R1B"); join("FGP","FGN"); join("C1A","C1B"); join("C2A","C2B");
  if(st.cap) join("CBA","CBB");
  let g=find("FGP");
  if(find("C1A")===g||find("C2A")===g){ join("C1A","C2A"); g=find("FGP"); }
  return new Set(TERMS.filter(t=>find(t)===g));
}
function thermalStep(k,T,Irms,f,dt,uncovered){
  const p=PAN[k];
  const Pin=Irms*Irms*rload(k,f);
  let Pl=p.e*p.area*SB*(T**4-T_AMB**4);
  if(uncovered) Pl+=8*p.area*(T-T_AMB);
  return T+(Pin-Pl)*dt/(p.mass*p.c);
}
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

const TDIV=[1e-6,2e-6,5e-6,1e-5,2e-5,5e-5,1e-4,2e-4,5e-4,1e-3,2e-3,5e-3,1e-2,2e-2,5e-2];

const BOXES={fg:[28,34,264,158], cbox:[28,196,264,328], r1:[28,366,264,498], stage:[330,24,1000,544]};
const TERM_DEF=[["FGP",232,72,"b","r","FG +"],["FGN",232,116,"b","k","FG −"],

  cv.width=Math.round(w*dpr); cv.height=Math.round(lh*s*dpr); cv.style.height=(lh*s)+"px";
  ctx.setTransform(dpr*s,0,0,dpr*s,0,0); return s;
}

function rect(c,x0,y0,x1,y1,fill,stroke,lw){ if(fill){c.fillStyle=fill;c.fillRect(x0,y0,x1-x0,y1-y0);}

function bez2(a,b,k){
  const [ax,ay]=TPOS[a], [bx_,by]=TPOS[b], mx=(ax+bx_)/2, my=Math.max(ay,by)+34+(k%3)*12, out=[];
  for(let i=0;i<=16;i++){ const t=i/16, u=1-t; out.push(u*u*ax+2*u*t*mx+t*t*bx_, u*u*ay+2*u*t*my+t*t*by); }

}
function bez3(p0,p1,p2,p3){ const out=[];
  for(let i=0;i<=14;i++){ const t=i/14,u=1-t;
    out.push(u**3*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t**3*p3[0], u**3*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t**3*p3[1]); }
  return out; }

const sig3=x=>{ if(!x||!isFinite(x)) return 0; const dd=Math.pow(10,Math.floor(Math.log10(Math.abs(x)))-3); return Math.round(x/dd)*dd; };
const fmtV=v=>v>=1?v.toFixed(3)+" V":v>=1e-3?(v>=0.1?(v*1000).toFixed(1):(v*1000).toFixed(2))+" mV":(v*1e6).toFixed(0)+" µV";
const fmtF=f=>!f?"- - -":f>=1000?(f>=10000?(f/1000).toFixed(2):(f/1000).toFixed(3))+" kHz":f.toFixed(1)+" Hz";
const fmtR=R=>R===-1?"- - -":!isFinite(R)?"O.L":R>=1000?(R/1000).toFixed(3)+" kΩ":R.toFixed(3)+" Ω";
const fmtT=x=>x>=1e-3?(x>=1e-2?(x*1e3).toFixed(0):(x*1e3).toFixed(1))+" ms":(x>=1e-5?(x*1e6).toFixed(0):(x*1e6).toFixed(1))+" µs";
function scopeSignal(){
  const f=freq();
  if(!st.sp||!st.sn||!termLive(st.sp)||!termLive(st.sn)) return {off:true,amp:0,f:0};
  const a=(st.sol&&st.fg.on)?st.sol.amp(st.sp,st.sn):0;
  return {off:false,amp:a*st.px,f};
}
function refreshDisp(force){
  const now=performance.now();
  if(!force&&now-st.disp.t<240) return;
  st.disp.t=now;
  const s=scopeSignal(), vd=VDIV[st.vi];
  let v=s.amp; const clip=v>4*vd; if(clip) v=4*vd;
  v=sig3(v*(1+0.004*gauss())+0.0025*vd*gauss());
  Object.assign(st.disp,{v:Math.max(0,v),clip,off:s.off,f:s.amp>0.04*vd?s.f*(1+0.0015*gauss()):0});
  if(st.mode==="DMM"&&st.dmmFn==="R"){
    const live=st.fg.on?liveTerms(pstate()):new Set();
    if(live.has(st.dp)||live.has(st.dn)) st.disp.r=-1;
    else if(!st.dp||!st.dn||!termLive(st.dp)||!termLive(st.dn)) st.disp.r=Infinity;
    else { const R=measureR(pstate(),st.dp,st.dn);
      st.disp.r=isFinite(R)?Math.max(0,sig3(R*(1+0.002*gauss())+0.004*gauss())):Infinity; }
  }
}
function dmmAcv(){
  const f=freq();
  if(!st.dp||!st.dn||!termLive(st.dp)||!termLive(st.dn)||!st.fg.on) return ["0.000 V",""];
  if(f<40||f>1000) return ["- - -",d().dmmfreq];
  const r=analyze(pstate(),f);
  return [(r.amp(st.dp,st.dn)/Math.SQRT2).toFixed(4)+" V",""];
}

  const part=(label,sw,cmd,on,dis,cnt)=>{
    const b=document.createElement("button"); b.className="part"+(on?" on":""); b.disabled=!!dis;
    b.innerHTML=(sw?`<i style="background:${sw}"></i>`:"")+`<span></span>`+(cnt?`<em>${cnt}</em>`:"");
    b.querySelector("span").textContent=label; b.onclick=cmd; box.appendChild(b);
  };
  sect(t.tCap);
  for(const k of CAP_ORDER){ const [,,nm,film]=CAPS[k]; part(nm,film?"#8a5228":"#2f4f9e",()=>{ st.cap=st.cap===k?null:k; redrawAll(); },st.cap===k); }
  sect(t.tPlate);
  for(const k in MAT){ const used=st.stack.filter(x=>x===k).length;
    part(t.mat[k],MAT[k].c1,()=>{ st.stack.push(k); redrawAll(); },false,used>=MAT[k].n||!!st.pan||st.stack.length>=6,(MAT[k].n-used)+" / "+MAT[k].n); }
  sect(t.tPan);
  for(const k in PAN) part(t.pan[k],MAT[k].c1,()=>{ st.pan=st.pan===k?null:k; st.panT=T_AMB; if(st.pan) st.stack=[];
    if(!st.pan){ for(const a of ["sp","sn","dp","dn"]) if(st[a]==="NTCA"||st[a]==="NTCB") st[a]=null;
      st.cables=st.cables.filter(c=>!c.some(x=>x==="NTCA"||x==="NTCB")); }
    redrawAll(); },st.pan===k,st.stack.length>0&&st.pan!==k);
  sect(t.tMisc);
  part(t.slotClear,null,()=>{ st.stack=[]; if(st.pan){ st.pan=null;
    for(const a of ["sp","sn","dp","dn"]) if(st[a]==="NTCA"||st[a]==="NTCB") st[a]=null;
    st.cables=st.cables.filter(c=>!c.some(x=>x==="NTCA"||x==="NTCB")); } redrawAll(); });
  part(t.cover+" · "+(st.covered?t.coverOn:t.coverOff),null,()=>{ st.covered=!st.covered; redrawAll(); },st.covered);
}
function buildTools(){
  const box=$("tools"); box.innerHTML="";
  for(const k of ["cable","probeP","probeN","dmmP","dmmN","erase"]){
    const b=document.createElement("button"); b.textContent=d().tools[k]; b.className=st.tool===k?"on":"";
    b.onclick=()=>{ st.tool=k; st.pending=null; buildTools(); drawBench(); }; box.appendChild(b);
  }
  const h=document.createElement("span"); h.className="hint";
  h.textContent=st.tool==="cable"?d().hints.cable:st.tool==="erase"?d().hints.erase:st.tool.startsWith("probe")?d().hints.probe:d().hints.dmm;
  box.appendChild(h);
}
function refreshButtons(){
  $("mode").textContent="MODE: "+st.mode;
  $("hold").className=st.hold?"on":"";
  $("px").textContent="PROBE "+(st.px===10?"10X":"1X"); $("px").className=st.px===10?"on":"";
  $("acv").className=(st.mode==="DMM"&&st.dmmFn==="V")?"on":""; $("ohm").className=(st.mode==="DMM"&&st.dmmFn==="R")?"on":"";
}
function renderSpeeds(){
  const box=$("speeds"); box.innerHTML="";
  for(const s of SPEEDS){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===st.speed?"on":"";
    b.onclick=()=>{ st.speed=s; renderSpeeds(); }; box.appendChild(b); }
}
/* bench clicks */
function hitTerm(x,y){ let best=null, bd=18;
  for(const [tid,tx_,ty] of TERM_DEF){ if(!termLive(tid)) continue; const dd=Math.hypot(tx_-x,ty-y); if(dd<bd){bd=dd;best=tid;} }
  return best; }
function hitCable(x,y){
  for(let i=0;i<st.cables.length;i++){ const p=bez2(st.cables[i][0],st.cables[i][1],i);
    for(let j=0;j<p.length;j+=2) if(Math.hypot(p[j]-x,p[j+1]-y)<9) return i; }
  return -1; }
bench.addEventListener("pointerdown",e=>{
  const r=bench.getBoundingClientRect(), x=(e.clientX-r.left)/BS, y=(e.clientY-r.top)/BS, t=hitTerm(x,y);
  if(st.tool==="erase"){
    const i=hitCable(x,y);
    if(i>=0) st.cables.splice(i,1);
    else if(t){ st.cables=st.cables.filter(c=>!c.includes(t)); for(const a of ["sp","sn","dp","dn"]) if(st[a]===t) st[a]=null; }
  } else if(st.tool==="cable"){
    if(!t) st.pending=null;
    else if(!st.pending) st.pending=t;
    else if(st.pending===t) st.pending=null;
    else { const pair=[st.pending,t];
      if(!st.cables.some(c=>(c[0]===pair[0]&&c[1]===pair[1])||(c[0]===pair[1]&&c[1]===pair[0]))){
        if(st.cables.length>=8) flash(d().maxcable); else st.cables.push(pair); }
      st.pending=null; }
  } else if(t){ const a={probeP:"sp",probeN:"sn",dmmP:"dp",dmmN:"dn"}[st.tool]; st[a]=st[a]===t?null:t; }
  solve(); drawBench(); refreshDisp(true);
});
/* generator knobs: drag vertically or roll the wheel */
let drag=null;
function fgPos(e){ const r=fgc.getBoundingClientRect(); return [(e.clientX-r.left)/FS,(e.clientY-r.top)/FS]; }
fgc.addEventListener("pointerdown",e=>{
  const [x,y]=fgPos(e);
  for(const [k,kx,ky,r] of KNOBS){
    if(Math.hypot(kx-x,ky-y)<r+4){
      if(k==="range"){ st.fg.range=(st.fg.range+1)%4; redrawAll(); }
      else if(k==="wave") flash(d().wave);
      else { drag=[k,e.clientY,st.fg[k]]; fgc.setPointerCapture(e.pointerId); }
      return;
    }
  }
  if(Math.hypot(300-x,74-y)<14||Math.hypot(300-x,114-y)<14){ st.fg.on=!st.fg.on; redrawAll(); }
});
fgc.addEventListener("pointermove",e=>{ if(!drag) return; const [k,y0,v0]=drag;
  st.fg[k]=Math.max(0,Math.min(100,v0+(y0-e.clientY)*0.45/FS)); solve(); drawFg(); });
fgc.addEventListener("pointerup",()=>{ drag=null; });
fgc.addEventListener("wheel",e=>{ const [x,y]=fgPos(e);
  for(const [k,kx,ky,r] of KNOBS) if(Math.hypot(kx-x,ky-y)<r+4&&k!=="range"&&k!=="wave"){
    e.preventDefault(); st.fg[k]=Math.max(0,Math.min(100,st.fg[k]+(e.deltaY<0?1:-1)*(e.shiftKey?0.2:1))); solve(); drawFg(); return; } },{passive:false});
document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.b.split(":"); st.fg[k]=Math.max(0,Math.min(100,st.fg[k]+(+v))); solve(); drawFg(); });
$("fgOut").onclick=()=>{ st.fg.on=!st.fg.on; redrawAll(); };
$("fgRange").onclick=()=>{ st.fg.range=(st.fg.range+1)%4; redrawAll(); };
$("mode").onclick=()=>{ st.mode=st.mode==="SCOPE"?"DMM":"SCOPE"; solve(); refreshButtons(); refreshDisp(true); };
$("hold").onclick=()=>{ st.hold=!st.hold; st.held=st.hold?scopeSignal():null; refreshButtons(); };
$("px").onclick=()=>{ st.px=st.px===1?10:1; refreshButtons(); refreshDisp(true); };
$("vUp").onclick=()=>{ st.vi=Math.min(VDIV.length-1,st.vi+1); refreshDisp(true); };
$("vDn").onclick=()=>{ st.vi=Math.max(0,st.vi-1); refreshDisp(true); };
$("tUp").onclick=()=>{ st.ti=Math.min(TDIV.length-1,st.ti+1); };
$("tDn").onclick=()=>{ st.ti=Math.max(0,st.ti-1); };
$("acv").onclick=()=>{ st.dmmFn="V"; st.mode="DMM"; solve(); refreshButtons(); refreshDisp(true); };
$("ohm").onclick=()=>{ st.dmmFn="R"; st.mode="DMM"; solve(); refreshButtons(); refreshDisp(true); };
$("unclip").onclick=()=>{ st.sp=st.sn=null; redrawAll(); };
$("undmm").onclick=()=>{ st.dp=st.dn=null; redrawAll(); };
$("auto").onclick=()=>{
  const s=scopeSignal();
  if(s.amp>0){ st.vi=VDIV.length-1; for(let i=0;i<VDIV.length;i++) if(s.amp/VDIV[i]<=3.2){ st.vi=i; break; }
    st.ti=TDIV.length-1; for(let i=0;i<TDIV.length;i++) if(TDIV[i]*10>=3/s.f){ st.ti=i; break; } }
  refreshDisp(true);
};
/* stopwatch + log */
const fmtSw=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+(t%60).toFixed(1).padStart(4,"0");
$("swGo").onclick=()=>{ st.swRun=!st.swRun; };
$("swLap").onclick=()=>{ st.laps=[st.sw,...st.laps].slice(0,6); renderLaps(); };
$("swReset").onclick=()=>{ st.sw=0; st.laps=[]; renderLaps(); };
function renderLaps(){ $("laps").textContent=st.laps.map((t,i)=>"L"+(st.laps.length-i)+"  "+t.toFixed(1)+" s").join("\n"); }
function setupText(){
  const p=[];
  if(st.cap) p.push("C="+CAPS[st.cap][2]);
  if(st.stack.length) p.push("N="+st.stack.length+"×"+st.stack[0]);
  if(st.pan) p.push(st.pan+" pan");
  p.push("probe "+(st.sp||"—")+"/"+(st.sn||"—"));
  if(!st.covered) p.push("lid open");
  return p.join(", ");
}
$("recBtn").onclick=()=>{
  const nm=$("recName").value.trim()||(st.mode==="DMM"?(st.dmmFn==="R"?"R":"V(AC)"):"Vmax");
  let val, fr;
  if(st.mode==="DMM"){ val=st.dmmFn==="R"?fmtR(st.disp.r):dmmAcv()[0]; fr=st.fg.on?fmtF(freq()):"—"; }
  else { val=fmtV(st.disp.v)+(st.disp.clip?" (clip)":""); fr=fmtF(st.disp.f); }
  st.nno++; const row=[st.nno,st.sw.toFixed(1),nm,val,fr,setupText()];
  st.notes.push(row); renderLog(); flash(d().logged+" · "+nm+" = "+val);
};
function renderLog(){
  $("logHead").innerHTML=""; for(const c of d().cols){ const th=document.createElement("th"); th.textContent=c; $("logHead").appendChild(th); }
  const tb=$("logBody"); tb.innerHTML="";
  for(const r of [...st.notes].reverse()){ const tr=document.createElement("tr");
    for(const v of r){ const td=document.createElement("td"); td.textContent=v; tr.appendChild(td); } tb.appendChild(tr); }
}
$("csv").onclick=()=>{
  const lines=["no,time_s,item,value,frequency,conditions"].concat(st.notes.map(r=>r.slice(0,5).join(",")+',"'+r[5]+'"'));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="apho2025_E1_log.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  flash(d().saved);
};
$("clearLog").onclick=()=>{ st.notes=[]; renderLog(); };

function setTab(k){
  for(const v of ["lab","task","log","help"]){ $("tab-"+v).className=v===k?"on":""; $("v-"+v).hidden=v!==k; }
  if(k==="lab") layout();
}
for(const v of ["lab","task","log","help"]) $("tab-"+v).onclick=()=>setTab(v);

/* ══════════════════════════════════════════════════════════════
   6.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d();
  document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("tab-lab").textContent=t.tabLab; $("tab-task").textContent=t.tabTask; $("tab-log").textContent=t.tabLog; $("tab-help").textContent=t.tabHelp;
  $("t-h-speed").textContent=t.hSpeed; $("t-h-fg").textContent=t.hFg; $("t-h-scope").textContent=t.hScope; $("t-h-sw").textContent=t.hSw;
  $("t-fgtip").textContent=t.fgtip; $("unclip").textContent=t.unclip; $("undmm").textContent=t.undmm;
  $("swGo").textContent=t.start; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("recName").placeholder=t.recPh; $("recBtn").textContent=t.rec; $("csv").textContent=t.csv; $("clearLog").textContent=t.clearLog;
  $("v-task").textContent=TASK[lang]; $("v-help").textContent=HELP[lang];
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2025 E1 — 유도가열 조리기의 물리 · HaslaLab":"APhO 2025 E1 — Physics of Induction Cooking · HaslaLab";
  buildTools(); renderSpeeds(); renderLog(); redrawAll();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   7.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), frame=0;
function tick(){
  const now=performance.now(), dt=Math.min(0.25,(now-last)/1000)*st.speed; last=now;
  solve();
  if(st.pan&&st.sol){
    const Irms=(cabs(st.sol.I1)+cabs(st.sol.I2))/Math.SQRT2, n=Math.max(1,Math.ceil(dt/0.5));
    for(let i=0;i<n;i++) st.panT=thermalStep(st.pan,st.panT,Irms,freq(),dt/n,!st.covered);
  }
  if(st.swRun) st.sw+=dt;
  $("swLbl").textContent=fmtSw(st.sw);
  const Ipk=st.sol?cabs(st.sol.I1)+cabs(st.sol.I2):0;
  let m="";
  if(st.fg.on&&!st.cap&&Ipk>0.05) m=d().nocap; else if(Ipk>2.0) m=d().ovr;
  const w=$("warn");
  if(now<st.msgUntil){ w.textContent=st.msg; w.className="warn ok"; } else { w.textContent=m; w.className="warn"; }
  if(++frame%3===0) drawScope();
  if(frame%10===0) drawBench();
  setTimeout(()=>requestAnimationFrame(tick),40);
}
window.addEventListener("resize",layout);
applyLang(); layout(); requestAnimationFrame(tick);
