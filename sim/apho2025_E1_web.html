<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }

  /* ── tray ── */
  .tray{flex:0 0 214px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #bench{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;
         background:#232830;cursor:crosshair}
  #bench.dragging{cursor:grabbing}
  .imodal{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.74);display:flex;align-items:center;justify-content:center}
  .imodal[hidden]{display:none}
  .imbox{background:#1f242b;border:1px solid #353b43;border-radius:10px;padding:10px 12px 12px;max-height:96vh;max-width:96vw;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .imhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;font-size:12.5px;color:#9aa3ab}

  #imBody canvas{display:block;width:100%;height:auto;background:#191c21;border-radius:6px}
  #imBody.pair{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
  #imBody .zbig canvas{background:#030405;border:6px solid #16181b;border-radius:8px}
  .instr{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .instr .ibox{flex:1 1 520px;min-width:280px}
  .instr .zbox{flex:0 0 270px}
  .instr canvas{display:block;width:100%;height:auto;background:#191c21;border-radius:6px;

  .ilbl{font-size:12px;color:var(--accent);font-weight:600;margin:0 0 4px;letter-spacing:.03em}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel,.tray{position:static} }
  @media (max-width:1180px){ .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray,.panel{flex:1 1 100%} .instr .zbox{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .disp{background:#0d1512;border-radius:6px;padding:6px 10px;margin:2px 0 6px;text-align:center;
        color:#7dffb0;font:700 30px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.04em}
  .row{display:flex;gap:6px}
  .row button{flex:1;text-align:center}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  #swBtn{background:#2f6f3f;border-color:#2f6f3f;color:#fff;font-weight:600}
  #swBtn.run{background:#8a3b34;border-color:#8a3b34}
  .laps{background:var(--deep);border:1px solid var(--line);border-radius:6px;margin-top:6px;
        height:82px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;
        color:var(--ink);padding:4px 7px}
  #xsec{display:block;width:100%;height:auto;background:var(--deep);border-radius:6px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:10px;min-height:110px}
  .status div + div{margin-top:9px}
  .status .warn{color:#ff8b6a}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="imodal" id="imodal" hidden><div class="imbox" id="imbox">
  <div class="imhead"><span id="t-instrcap"></span><button id="imClose"></button></div>
  <div id="imBody"></div></div></div>
<div class="wrap">
  <!-- ═══════════ TRAY ═══════════ -->
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <!-- ═══════════ STAGE ═══════════ -->
  <div class="stage">
    <div class="card">
      <h3 id="t-benchcap"></h3>
      <canvas id="bench"></canvas>
    </div>
    <div class="instrHold" hidden>
      <div class="ibox" id="fgBox"><div class="ilbl" id="t-fglbl"></div><canvas id="fgCv"></canvas></div>
      <div class="zbox" id="zBox"><div class="ilbl" id="t-zlbl"></div><canvas id="zoyiCv"></canvas></div>
      <div class="zbig" id="zBigBox"><canvas id="zBig"></canvas></div>
    </div>
  </div>

  <!-- ═══════════ CONTROLS ═══════════ -->
  <aside class="panel">
    <h2 id="t-h-sw"></h2>
    <div class="disp" id="swLbl">0:00.00</div>
    <div class="row">
      <button id="swBtn"></button>
      <button id="swLap"></button>
      <button id="swReset"></button>
    </div>
    <div class="laps" id="laps"></div>
    <div class="hint" id="swHint"></div>

    <h2 id="t-h-speed"></h2>
    <div class="row" id="speeds"></div>
    <div class="hint" id="t-speedhint"></div>

    <h2 id="t-h-sec"></h2>
    <canvas id="xsec"></canvas>
    <div class="hint" id="secTxt"></div>
    <button id="flipBtn" style="width:100%;margin-top:6px"></button>

    <div class="status" id="status"></div>
  </aside>
</div>

/* ══════════════════════════════════════════════════════════════
   1.  PHYSICS
   ══════════════════════════════════════════════════════════════ */
const MU0=4e-7*Math.PI, SB=5.670e-8, T_AMB=303.5;
const MAT={
  AL:   {sigma:3.70e7,mur:1,  t:0.73e-3,alpha:0.005,n:5,col:"#d7dbdf",edge:"#9aa2a8"},
  CU:   {sigma:5.88e7,mur:1,  t:0.71e-3,alpha:0.005,n:5,col:"#d98a55",edge:"#9c5a30"},
  SS304:{sigma:1.39e6,mur:1,  t:0.72e-3,alpha:0.005,n:4,col:"#c3c8cc",edge:"#7c8388"},
  SS410:{sigma:1.70e6,mur:700,t:0.76e-3,alpha:0.55, n:4,col:"#e3e8ec",edge:"#8d959b"}};
const PLATE_OF={plAL:"AL",plCU:"CU",plS4:"SS304",plS10:"SS410"};
const PAN={AL:{rho:2700,c:900,t:0.73e-3,e:0.65,r40:0.0546}, SS410:{rho:7700,c:460,t:0.76e-3,e:0.80,r40:0.1377}};
for(const k in PAN){ const p=PAN[k]; p.area=2*0.02*0.02; p.mass=p.rho*0.02*0.02*p.t; }
const PAN_OF={panAL:"AL",panSS:"SS410"};
const COIL_L=47.2e-6, COIL_RL=0.47, COIL_M=5.79e-6;
const R1_OHM=1.0, RCAB=0.0225, RSCOPE=1e6, RDMM=1e7;
const FG_EMAX=32.0, FG_RS=2.0, FG_ILIM=4.0;
const NTC_R0=10000, NTC_T0=298, NTC_B=3950;
const CAPS={
  C470N: {C:470e-9, esr:0.010,film:true, node:"K1",lab:"470 nF", r:0,   h:1.1},
  C470U: {C:470e-6, esr:0.030,film:false,node:"K2",lab:"470 µF", r:0.4, h:1.6},
  C1000U:{C:1000e-6,esr:0.030,film:false,node:"K3",lab:"1000 µF",r:0.5, h:2.0},
  C2200U:{C:2200e-6,esr:0.030,film:false,node:"K4",lab:"2200 µF",r:0.63,h:2.1}};
const CAP_KEYS=["C470N","C470U","C1000U","C2200U"];
const NODES=["FGP","FGN","R1A","R1B","B1","B2","B3","B4","C1A","C1B","C2A","C2B",
             "K1A","K1B","K2A","K2B","K3A","K3B","K4A","K4B","NTCA","NTCB","DCOM","DVO"];
const NI={}; NODES.forEach((t,i)=>NI[t]=i);

const skinDepth=(k,f)=>1/Math.sqrt(Math.PI*MAT[k].sigma*MAT[k].mur*MU0*Math.max(f,1e-9));
function shielding(stack,f){
  if(!stack.length) return 1;
  const dFr=6e-3*Math.pow(1000/Math.max(f,1),0.15);
  let s=0, sf=0, al=0;
  for(const k of stack){ const m=MAT[k]; s+=m.t/skinDepth(k,f); sf+=m.t/dFr; al=Math.max(al,m.alpha); }
  return (1-al)*Math.exp(-s)+al*Math.exp(-sf);
}
const rntc=T=>NTC_R0*Math.exp(NTC_B*(1/T-1/NTC_T0));
const rload=(k,f)=>PAN[k].r40*Math.sqrt(Math.max(f,1)/40000);

const C=(r,i)=>[r,i||0];
const cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const csub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cdiv=(a,b)=>{ const q=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q]; };
const cabs=a=>Math.hypot(a[0],a[1]);
function csolve(A,b){
  const n=b.length, M=A.map((r,i)=>r.map(v=>[v[0],v[1]]).concat([[b[i][0],b[i][1]]]));
  for(let k=0;k<n;k++){
    let piv=k, best=cabs(M[k][k]);
    for(let i=k+1;i<n;i++){ const a=cabs(M[i][k]); if(a>best){best=a;piv=i;} }
    if(best<1e-300) return null;
    if(piv!==k){ const t=M[k]; M[k]=M[piv]; M[piv]=t; }
    const dk=M[k][k];
    for(let j=k;j<=n;j++) M[k][j]=cdiv(M[k][j],dk);
    for(let i=0;i<n;i++){
      if(i===k) continue;
      const f=M[i][k]; if(f[0]===0&&f[1]===0) continue;
      for(let j=k;j<=n;j++) M[i][j]=csub(M[i][j],cmul(f,M[k][j]));
    }
  }
  return M.map(r=>r[n]);
}
/* complex modified nodal analysis of the whole bench */
function analyze(net,f){
  const N=NODES.length, gnd=NI.FGN, w=2*Math.PI*f;
  const nmap=new Array(N); let c=0;
  for(let i=0;i<N;i++) nmap[i]= i===gnd ? -1 : c++;
  const size=(N-1)+3;
  const A=[...Array(size)].map(()=>[...Array(size)].map(()=>C(0))), b=[...Array(size)].map(()=>C(0));
  const at=(i,j,v)=>{ if(i>=0&&j>=0) A[i][j]=cadd(A[i][j],v); };
  const stampY=(na,nb,Y)=>{ const a=nmap[na], bb=nmap[nb]; at(a,a,Y); at(bb,bb,Y); at(a,bb,[-Y[0],-Y[1]]); at(bb,a,[-Y[0],-Y[1]]); };
  const stampR=(na,nb,R)=>{ if(R>0) stampY(na,nb,C(1/R)); };
  for(let i=0;i<N;i++) if(i!==gnd) at(nmap[i],nmap[i],C(1e-9));
  for(const [a,bb,R] of net.res) stampR(NI[a],NI[bb],R);
  for(const [a,bb,R] of net.loads) stampR(NI[a],NI[bb],R);
  for(const [a,bb,Cc,esr] of net.caps) stampY(NI[a],NI[bb],cdiv(C(1),C(esr,-1/(w*Cc))));
  /* plates between the coils load both; the pan loads the coil(s) it lies against */
  const rs=net.stack.length?0.02*Math.sqrt(Math.max(f,1)/40000)*net.stack.length:0, rp=net.pan?rload(net.pan,f):0;
  const rex1=rs+(net.panC1?rp:0), rex2=rs+(net.panC2?rp:0);
  const Meff=COIL_M*net.mfac*shielding(net.stack,f);
  const bFG=N-1, bL1=N, bL2=N+1;
  at(nmap[NI.FGP],bFG,C(1)); at(nmap[NI.FGN],bFG,C(-1));
  at(bFG,nmap[NI.FGP],C(1)); at(bFG,nmap[NI.FGN],C(-1));
  at(bFG,bFG,C(-FG_RS)); b[bFG]=C(net.E);
  const Zm=C(0,w*Meff);
  for(const [br,p,m,other,Zc] of [[bL1,"C1A","C1B",bL2,C(COIL_RL+rex1,w*COIL_L)],[bL2,"C2A","C2B",bL1,C(COIL_RL+rex2,w*COIL_L)]]){

function measureR(net,ta,tb){

  XSW=Math.max(200,Math.floor(xsCv.parentElement.getBoundingClientRect().width-24)); XSH=Math.round(XSW*0.6);

function fit(){
  if(CW<30||CH<30) return;

    const du=VIEW_U1-VIEW_U0, dv=VIEW_V1-VIEW_V0;
    S.basePpcm=Math.min(CW/du,CH/dv);
    const k=S.basePpcm*S.zoom;
    S.cam=[VIEW_U0-(CW/k-du)/2.0, VIEW_V0-(CH/k-dv)/2.0];

const UV=(u,v)=>{ const k=ppcm(); return [(u-S.cam[0])*k, CH-(v-S.cam[1])*k]; };
let OFF=[0,0];               /* the part being drawn is shifted by OFF (cm) */
const NP=(x,y,z)=>{ const p=proj(x+OFF[0],y,z+OFF[1]); return UV(p[0],p[1]); };
function withOff(o,fn){ const keep=OFF; OFF=o; try{ return fn(); } finally{ OFF=keep; } }
/* the bench point (y = 0) under a screen point */
function benchAt(px,py){ const [u,v]=INV(px,py); return [(u/KC-v/KS)/2,(u/KC+v/KS)/2]; }
const INV=(px,py)=>{ const k=ppcm(); return [px/k+S.cam[0], (CH-py)/k+S.cam[1]]; };

function faceM(F){ const [X,Y]=NP(F.x0,F.y1,F.z), k=ppcm(); return [k*KC,k*KS,0,k,X,Y]; }
function faceInv(F,px,py){
  const m=faceM(F), k=ppcm();
  const a=(px-m[4])/(k*KC), t=(py-m[5]-k*KS*a)/k;
  return [a,t];
}

/* ══════════════════════════════════════════════════════════════
   5.  DRAWING PRIMITIVES
   ══════════════════════════════════════════════════════════════ */
const FONT='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const MONO='ui-monospace,Consolas,"DejaVu Sans Mono",monospace';
function TXT(x,y,txt,opt){
  opt=opt||{};
  ctx.font=(opt.bold?"bold ":"")+((opt.size||8)*1.33).toFixed(1)+"px "+FONT;
  ctx.textAlign=opt.align||"center"; ctx.textBaseline=opt.base||"middle";
  ctx.fillStyle=opt.fill||"#e8eef2";
  ctx.fillText(txt,x,y);
}
/* text printed on a flat face of a part, so it lies on the surface and turns with it: O is where the line
   starts (its middle with align "center"), U the direction it runs along, V the way the letters point down
   (both 1 cm long, world units), size the letter height in cm */
function PRINT(O,U,V,txt,size,fill,opt){
  opt=opt||{}; const p=NP(...O), a=NP(O[0]+U[0],O[1]+U[1],O[2]+U[2]), b=NP(O[0]+V[0],O[1]+V[1],O[2]+V[2]);
  const m=[a[0]-p[0],a[1]-p[1],b[0]-p[0],b[1]-p[1]];
  if(size*Math.hypot(m[2],m[3])<2.0||Math.abs(m[0]*m[3]-m[1]*m[2])<1e-6) return;          /* too small to read: not drawn */
  ctx.save(); ctx.transform(m[0],m[1],m[2],m[3],p[0],p[1]); ctx.scale(size/10,size/10);
  ctx.font=(opt.bold?"bold ":"")+"10px "+FONT; ctx.textAlign=opt.align||"center"; ctx.textBaseline="middle"; ctx.fillStyle=fill;
  ctx.fillText(txt,0,0); ctx.restore();
}
function LINE(pts,stroke,width,cap,dash){
  if(pts.length<2) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=stroke; ctx.lineWidth=width||1; ctx.lineJoin="round"; ctx.lineCap=cap||"round";
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  if(dash) ctx.setLineDash([]);
}
function POLY(pts,fill,outline,width){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.lineJoin="round"; ctx.stroke(); }
}
function OVAL(cx,cy,rx,ry,fill,outline,width){
  ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(0.1,rx),Math.max(0.1,ry),0,0,2*Math.PI);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.stroke(); }
}
function rectOf(pts){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
}
function BOX(b,top,side,front,outline){
  const [x0,x1,y0,y1,z0,z1]=b;
  POLY([NP(x1,y0,z0),NP(x1,y1,z0),NP(x1,y1,z1),NP(x1,y0,z1)],side,outline,1);
  POLY([NP(x0,y1,z0),NP(x1,y1,z0),NP(x1,y1,z1),NP(x0,y1,z1)],top,outline,1);
  if(front) POLY([NP(x0,y0,z0),NP(x1,y0,z0),NP(x1,y1,z0),NP(x0,y1,z0)],front,outline,1);

function boxRect(b){ const [x0,x1,y0,y1,z0,z1]=b; const P=[];
  for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) P.push(NP(x,y,z));
  return rectOf(P); }
function boxFoot(b){ const [x0,x1,,,z0,z1]=b; return [NP(x0,0,z0),NP(x1,0,z0),NP(x1,0,z1),NP(x0,0,z1)]; }
/* upright cylinder; horizontal circles project to axis-aligned ellipses */
function CYL(cx,y0,y1,cz,r,side,top,outline){
  const k=ppcm(), rx=k*KC*1.41421*r, ry=k*KS*1.41421*r;
  const b=NP(cx,y0,cz), t=NP(cx,y1,cz);
  OVAL(b[0],b[1],rx,ry,side,outline,1);
  ctx.fillStyle=side; ctx.fillRect(b[0]-rx,t[1],2*rx,b[1]-t[1]);
  if(outline){ LINE([[b[0]-rx,b[1]],[t[0]-rx,t[1]]],outline,1); LINE([[b[0]+rx,b[1]],[t[0]+rx,t[1]]],outline,1); }
  OVAL(t[0],t[1],rx,ry,top,outline,1);
}
function HCIRC(cx,y,cz,r,fill,outline,w){ const k=ppcm(), c=NP(cx,y,cz);
  OVAL(c[0],c[1],k*KC*1.41421*r,k*KS*1.41421*r,fill,outline,w); }
function inRect(z,x,y,m){ m=m||0; return !!z&&z[0]-m<=x&&x<=z[2]+m&&z[1]-m<=y&&y<=z[3]+m; }
function inPoly(P,x,y){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){
  if(((P[i][1]>y)!==(P[j][1]>y))&&(x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])) c=!c; } return c; }

/* local-unit helpers used by the instrument faces (c = any 2-D context in cm units) */
function rr(c,x0,y0,x1,y1,r,fill,stroke,lw){
  c.beginPath(); c.moveTo(x0+r,y0); c.arcTo(x1,y0,x1,y1,r); c.arcTo(x1,y1,x0,y1,r);
  c.arcTo(x0,y1,x0,y0,r); c.arcTo(x0,y0,x1,y0,r); c.closePath();
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||0.05; c.stroke(); }
}
function circ(c,x,y,r,fill,stroke,lw){ c.beginPath(); c.arc(x,y,Math.max(0.001,r),0,2*Math.PI);
  if(fill){ c.fillStyle=fill; c.fill(); } if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||0.05; c.stroke(); } }
function seg(c,x0,y0,x1,y1,col,lw){ c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.strokeStyle=col; c.lineWidth=lw||0.05; c.lineCap="round"; c.stroke(); }
/* text at size s (cm) drawn through a scale so tiny sizes stay crisp */
function FT(c,txt,x,y,s,col,align,bold,mono){
  c.save(); c.translate(x,y); c.scale(s/10,s/10);
  c.font=(bold?"bold ":"")+"10px "+(mono?MONO:"Arial,Helvetica,"+FONT);
  c.textAlign=align||"center"; c.textBaseline="middle"; c.fillStyle=col;
  c.fillText(txt,0,0); c.restore();
}

function apho25Logo(c,X,Y,K){
  const G="#2f8a3c", Au="#b8862b", x=0, y=0;
  c.save(); c.translate(X,Y); c.scale(K,K);
  c.save(); c.lineCap="round";
  c.strokeStyle=G; c.lineWidth=0.06;                                           /* palm crown */
  for(let i=-4;i<=4;i++){ const a=-Math.PI/2+i*0.3; c.beginPath(); c.moveTo(x+Math.cos(a)*0.12,y-0.38+Math.sin(a)*0.12); c.lineTo(x+Math.cos(a)*0.42,y-0.38+Math.sin(a)*0.36); c.stroke(); }
  c.strokeStyle=Au; c.lineWidth=0.07;                                          /* the two brackets */
  c.beginPath(); c.arc(x+0.12,y,0.62,Math.PI*0.68,Math.PI*1.32); c.stroke();
  c.beginPath(); c.arc(x-0.12,y,0.62,-Math.PI*0.32,Math.PI*0.32); c.stroke();
  c.strokeStyle="#1d2a5e"; c.lineWidth=0.035; c.beginPath();                  /* the wave */
  for(let i=0;i<=24;i++){ const u=x-0.48+i*0.04, v=y-0.02+Math.sin(i/24*Math.PI*4)*0.06; i?c.lineTo(u,v):c.moveTo(u,v); } c.stroke();
  c.strokeStyle=Au; c.lineWidth=0.05; c.beginPath();                           /* the derrick */
  c.moveTo(x-0.2,y+0.58); c.lineTo(x,y+0.12); c.lineTo(x+0.2,y+0.58); c.moveTo(x-0.13,y+0.42); c.lineTo(x+0.13,y+0.42);
  c.moveTo(x-0.08,y+0.28); c.lineTo(x+0.08,y+0.28); c.moveTo(x-0.3,y+0.6); c.lineTo(x+0.3,y+0.6); c.stroke();
  c.restore();
  c.save(); c.translate(x+0.78,y+0.08); c.scale(0.82,1); c.font="900 0.95px Arial,sans-serif"; c.textAlign="left"; c.textBaseline="alphabetic";
  c.fillStyle="#1d2a5e"; c.fillText("APhO",0,0); c.restore();
  FT(c,"Asian Physics Olympiad",x+0.82,y+0.42,0.2,"#1f4a9e","left",true);
  FT(c,"Dhahran , Saudi Arabia 2025",x+0.82,y+0.68,0.17,"#1d2a5e","left");
  c.restore();
}
function drawFgFace(c,bench){
  rr(c,0,0,24,9,0.45,"#141518");
  rr(c,0.45,0.4,18.4,8.6,0.15,"#e6e7e8","#b9bbbd",0.03);
  rr(c,18.7,0.4,23.55,8.6,0.15,"#e6e7e8","#b9bbbd",0.03);
  /* label tabs */
  rr(c,0.45,7.85,7.4,8.6,0.1,"#17181b"); FT(c,"FUNCTION GENERATOR",3.92,8.23,0.42,"#f2f2f2","center",true);
  rr(c,19.3,7.85,23.0,8.6,0.1,"#17181b"); FT(c,"POWER AMP",21.15,8.23,0.42,"#f2f2f2","center",true);
  /* 1 power LED */
  circ(c,1.35,1.35,0.42,"#2a2b2e");
  if(!bench){ circ(c,1.35,1.35,0.3,fgLive()?"#ff3b2f":"#5b1f1a");
    if(fgLive()) circ(c,1.35,1.35,0.55,"rgba(255,70,50,0.25)"); }
  /* 2 amplitude */
  FT(c,"AMPLITUDE",2.9,3.25,0.42,"#1b1c1e","center",true);
  FT(c,"MIN",1.55,6.35,0.3,"#333"); FT(c,"MAX",4.25,6.35,0.3,"#333");
  if(!bench) drawKnob(c,2.9,4.9,1.15,knobAngle("amp"));
  /* 3 frequency range */
  FT(c,"FREQUENCY",6.6,1.55,0.44,"#1b1c1e","center",true);
  [-120,-40,40,120].forEach((a,i)=>{ const q=a*Math.PI/180;
    seg(c,6.6+Math.sin(q)*1.12,4.9-Math.cos(q)*1.12,6.6+Math.sin(q)*1.4,4.9-Math.cos(q)*1.4,"#333",0.06);
    FT(c,FRANGE_LBL[i],6.6+Math.sin(q)*1.95,4.9-Math.cos(q)*1.75,0.27,S.fg.range===i?"#b0261c":"#333","center",S.fg.range===i); });
  if(!bench) drawKnob(c,6.6,4.9,1.0,knobAngle("range"));
  /* 4 coarse / fine */
  FT(c,"COARSE",10.6,1.2,0.36,"#1b1c1e","center",true);
  FT(c,"MIN",9.25,3.95,0.27,"#333"); FT(c,"MAX",11.95,3.95,0.27,"#333");
  if(!bench) drawKnob(c,10.6,2.7,0.95,knobAngle("coarse"));
  FT(c,"FINE",10.6,5.0,0.36,"#1b1c1e","center",true);
  FT(c,"MIN",9.45,7.55,0.27,"#333"); FT(c,"MAX",11.75,7.55,0.27,"#333");
  if(!bench) drawKnob(c,10.6,6.5,0.8,knobAngle("fine"));

function dmmReading(){
  const z=S.z, net=S.net;
  if(z.dfn==="ACV"||z.dfn==="DCV"){
    if(!S.sol) return {txt:"0.000",unit:"V",flag:""};
    if(z.dfn==="DCV") return {txt:(0.0004*gauss()).toFixed(3),unit:"V",flag:"DC"};
    const f=freq(); let v=S.sol.amp("DVO","DCOM")/Math.SQRT2;
    const band=f<40||f>1000;
    if(f>1000) v/=Math.sqrt(1+Math.pow(f/1000-1,2)*1.7);
    if(f<40) v*=f/40;
    v=v*(1+0.002*gauss());
    const u=Math.abs(v)<1?"mV":"V", x=Math.abs(v)<1?v*1000:v;
    return {txt:x.toFixed(Math.abs(x)>=100?1:Math.abs(x)>=10?2:3),unit:u,flag:"AC",band};
  }
  /* resistance family */
  const live=net.E>0?liveNodes(net):new Set();
  const isLive=live.has("DVO")||live.has("DCOM");
  if(z.rfn===0||z.rfn===1){
    let R=measureR(net,"DVO","DCOM");
    if(isLive) R=isFinite(R)?R*(1+0.6*Math.random())+5*Math.random():1e6*Math.random();
    const beep=z.rfn===1&&R<30;
    if(!isFinite(R)||R>60e6) return {txt:"OL",unit:"Ω",flag:z.rfn===1?"•)))":"",live:isLive,beep};
    R=Math.max(0,R*(1+0.0015*gauss())+0.003*gauss());
    const [m,u]=R>=1e6?[1e6,"MΩ"]:R>=1e3?[1e3,"kΩ"]:[1,"Ω"];
    const x=R/m;
    return {txt:x.toFixed(x>=100?1:x>=10?2:3),unit:u,flag:z.rfn===1?"•)))":"",live:isLive,beep};
  }
  if(z.rfn===2) return {txt:"OL",unit:"V",flag:"▶|"};
  return {txt:"0.000",unit:"nF",flag:"⊣⊢"};
}

/* the convex outline of a set of screen points (for a cylinder lying on its side) */
function hull(P){
  P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]), lo=[], hi=[];
  for(const p of P){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(hi.length>=2&&cr(hi[hi.length-2],hi[hi.length-1],p)<=0) hi.pop(); hi.push(p); }
  return lo.slice(0,-1).concat(hi.slice(0,-1));
}

function endPos(id,info){

function cablePts(a,b){
  const A=termInfo(a), B=termInfo(b);
  return curve3(endPos(a,A),A.d,endPos(b,B),B.d);

function curve3(p0,d0,p3,d3){
  const dist=Math.hypot(p3[0]-p0[0],p3[2]-p0[2]);
  const L=Math.max(3,dist*0.35);
  const p1=[p0[0]+d0[0]*L,p0[1]+d0[1]*L,p0[2]+d0[2]*L], p2=[p3[0]+d3[0]*L,p3[1]+d3[1]*L,p3[2]+d3[2]*L];
  const sag=Math.min(12,dist*0.25), out=[];
  for(let i=0;i<=28;i++){ const t=i/28, u=1-t;
    const f=(k)=>u*u*u*p0[k]+3*u*u*t*p1[k]+3*u*t*t*p2[k]+t*t*t*p3[k];
    const y=f(1)-sag*Math.sin(Math.PI*t);
    out.push(NP(f(0),Math.max(0.3,y),f(2))); }
  return out;
}

trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top;
  S.trayDrag=true;
  for(const [name,y0,y1] of trayCells){
    if(y<y0||y>y1) continue;
    cancelCarry(true);
    const [out]=trayState(name);
    const t=d();
    if(out){ say((name==="bb"||name==="bp")?t.m.noCable:t.trayOut); return; }
    if(name==="bb"||name==="bp"){ const col=S.stock[name].r>=S.stock[name].k?"r":"k"; S.stock[name][col]--; S.carry={k:"cable",type:name,col,a:null}; say(t.m.cable1); }
    else if(PLATE_OF[name]){ S.plates[PLATE_OF[name]]--; S.carry={k:"plate",id:name,mat:PLATE_OF[name]}; say(t.m.plateTake(t.mat[PLATE_OF[name]])); }
    else if(PAN_OF[name]){ if(!lowHs()){ say(t.m.noCoil,true); return; } if(S.pan){ say(t.m.slotBusy,true); return; } S.carry={k:"pan",id:name}; say(t.m.panTake(t.trayItems[name])); }

    else if(name==="probe"){ S.carry={k:"item",id:"probe"}; say(t.m.probeWhere); }
      else { S.carry={k:"item",id:name}; say(t.m.placeIt(t.trayItems[name])); }

function say(s,warn){ S.msg={s,warn:!!warn,t:performance.now()}; renderStatus(); }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function termAt(px,py){
  let best=null, bd=Math.max(14,ppcm()*1.1);
  for(const id of ALL_TERMS){
    const info=termInfo(id); if(!info||info.hidden) continue;
    for(const P of [info.p,endPos(id,info)]){
      const p=NP(...P), dd=Math.hypot(p[0]-px,p[1]-py);
      if(dd<bd){ bd=dd; best=id; }
    }
  }
  return best;
}
function termOk(cr,id,info){
  const t=d().m;
  const n=plugsAt(id).length;
  if(cr.a===id) return t.same;
  if(cr.type==="bb"){
    if(info.k!=="sock") return t.needSock;
    if(n>=2) return t.full;
    return true;
  }
  if(cr.a){
    const aKind=termInfo(cr.a).k;
    if(aKind===info.k) return aKind==="sock"?t.needPin:t.needSock;
  }
  if(info.k==="sock"&&n>=2) return t.full;
  if(info.k==="pin"&&n>=1) return t.full;
  return true;
}
function cancelCarry(silent){
  const cr=S.carry; if(!cr) return;
  if(cr.k==="cable") S.stock[cr.type][cr.col]++;
  if(cr.k==="cord"){ const c=cr.id==="fgcord"?S.cord.fg:S.cord.chg; S.carry=null; say(c.sock===null?d().m.returned(d().trayItems[cr.id]):d().m.cordDrop); solve(); drawTray(); return; }
  if(cr.k==="plate"){ if(cr.from){ S.dplates.push(cr.from); S.carry=null; say(d().m.stays); return; } S.plates[cr.mat]++; }
  if(cr.k==="item"&&cr.id==="probe"&&cr.from){ S.probeDesk=cr.from; S.carry=null; say(d().m.stays); drawTray(); return; }
  S.carry=null;
  if(cr.move){ say(d().m.stays); return; }
  if(!silent) say(d().m.returned(cr.k==="probe"?d().lab.probe:(d().trayItems[cr.id||cr.type]||"")));
  drawTray();
}

function onPress(p){
  const [x,y]=p, cr=S.carry, t=d();
  if(cr){ place(x,y); return; }
  if(S.on.scope&&S.probeScr){ const end=probeHit(x,y);
    if(end){ S.probe[end]=null; S.carry={k:"probe",end}; say(t.m.probeTake(end==="tip"?t.lab.hook:t.lab.gnd)); solve(); return; } }
  { const hit=cableEndAt(x,y); if(hit){ const cb=S.cables.splice(hit.i,1)[0];
      S.carry={k:"cable",type:cb.type,col:cb.col,a:hit.end==="a"?cb.b:cb.a}; say(t.m.cableEnd); solve(); drawTray(); return; } }
  if(S.on.fg){ const [a,b]=withOff(S.at.fg,()=>faceInv(FG_FACE,x,y)); if(a>=-2&&a<=24&&b>=0&&b<=10.5){ const h=fgPress(a,b,"bench"); if(h){ S.knob=h; h(y); return; } } }
  if(S.on.scope){ const [a,b]=withOff(S.at.scope,()=>faceInv(Z_FACE,x,y)); if(a>=-0.5&&a<=Z_FACE.W&&b>=0&&b<=Z_FACE.H){ if(zoyiPress(a,b)) return; } }
  if(S.probeDesk&&inRect(S.zones.probeDesk,x,y,3)){ S.carry={k:"item",id:"probe",from:S.probeDesk}; S.probeDesk=null; say(t.m.probeWhere); drawTray(); return; }
  /* pick a loose plate up off the desk */
  for(let i=S.dplates.length-1;i>=0;i--){
    if(!inRect(S.zones["dp"+i],x,y,2)) continue;
    const q=S.dplates.splice(i,1)[0], id=Object.keys(PLATE_OF).find(k=>PLATE_OF[k]===q.mat);
    S.carry={k:"plate",id,mat:q.mat,from:q}; say(t.m.plateTake(t.mat[q.mat])); return;
  }
  /* grab a part standing on the desk to move it (its leads stay plugged in) */
  /* pick up a mains cord hanging from the wall outlet (unplugging it from its instrument if it is in one) */
  for(const id of ["fgcord","charger"]){ const pts=(S.cordPts||{})[id]; if(!pts) continue;
    if(pts.some(q=>Math.hypot(q[0]-x,q[1]-y)<Math.max(7,ppcm()*0.6))){ if(id==="fgcord") S.cord.fg.fg=false; else S.cord.chg.scope=false; S.carry={k:"cord",id}; say(id==="fgcord"?t.m.cord1:t.m.chg1); solve(); return; } }
  for(const id of ["sw","C470N","C470U","C1000U","C2200U","c1","box","base","scope","fg"]){
    if(!(CAPS[id]?S.cap[id]==="desk":id==="box"?!!S.on.box:id==="c1"?S.hs.c1.at==="desk":!!S.on[id])||!inRect(S.zones[id],x,y)) continue;
    S.carry={k:"item",id,move:true}; S.lastMove={id,at:S.at[id]?S.at[id].slice():null,box:S.on.box,t:performance.now()}; say(t.m.moveIt(t.trayItems[id])); return;
  }
  S.view0=[x,y,S.cam[0],S.cam[1]];
  cv.classList.add("dragging");
}
/* the plug of a banana cable under the pointer: the last one plugged in is on top */
function cableEndAt(x,y){
  const r=Math.max(8,ppcm()*0.55);
  for(let i=S.cables.length-1;i>=0;i--){ const cb=S.cables[i];
    for(const end of ["a","b"]){ const id=cb[end], info=termInfo(id); if(!info||info.hidden) continue;
      const p=NP(...info.p), q=NP(...endPos(id,info));
      if(segD([x,y],p,q)<r) return {i,end}; } }
  return null; }
const sockUser=i=>S.cord.fg.sock===i?"fgcord":S.cord.chg.sock===i?"charger":null;
function cordEnd(tg){
  const cr=S.carry, t=d(), c=cr.id==="fgcord"?S.cord.fg:S.cord.chg;
  if(tg==="fg"){ if(cr.id!=="fgcord"){ say(t.m.cordWhere,true); return; } c.fg=true; }
  else if(tg==="scope"){ if(cr.id!=="charger"){ say(t.m.cordWhere,true); return; } c.scope=true; }
  else { say(t.m.cordWhere,true); return; }
  S.carry=null; say(t.m.cordIn); if(cr.id==="charger"&&chgLive()&&S.bat.soc<0.995) setTimeout(()=>say(d().m.chgOn),800);
  solve(); drawTray();
}
function unplugCord(id){ if(id==="fgcord") S.cord.fg.fg=false; else S.cord.chg.scope=false; say(d().m.cordOut(d().trayItems[id])); solve(); drawTray(); }
function place(x,y){
  const cr=S.carry, t=d();
  if(cr.k==="cord"){
    const c=cr.id==="fgcord"?S.cord.fg:S.cord.chg;
    if(c.sock===null){                        /* first the plug into the wall */
      const i=[0,1].find(j=>inRect((S.zones.sock||[])[j],x,y,4));
      if(i===undefined){ say(t.m.cordWall,true); return; }
      if(sockUser(i)){ say(t.m.sockBusy,true); return; }
      c.sock=i; say(cr.id==="fgcord"?t.m.cord1:t.m.chg1); drawTray(); return; }
    if(cr.id==="fgcord"&&S.on.fg&&inRect(S.zones.fg,x,y)){ cordEnd("fg"); return; }
    if(cr.id==="charger"&&S.on.scope&&inRect(S.zones.scope,x,y)){ cordEnd("scope"); return; }
    say(t.m.cordWhere,true); return;
  }
  if(cr.k==="cable"){
    const id=termAt(x,y);
    if(!id){ say(t.m.noTerm,true); return; }
    const ok=termOk(cr,id,termInfo(id));
    if(ok!==true){ say(ok,true); return; }
    if(!cr.a){ cr.a=id; say(t.m.cable2); return; }
    S.cables.push({type:cr.type,col:cr.col,a:cr.a,b:id});
    S.carry=null; say(t.m.plugged); solve(); drawTray(); return;
  }
  if(cr.k==="probe"){
    const id=termAt(x,y);
    if(!id){ say(t.m.noTerm,true); return; }
    /* the ground lead is 14 cm: measured from the front of the handle to the clip */
    const reach=(A,B)=>Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])<=GND_REACH+0.5;
    const ti=termInfo(id), E=endPos(id,ti);
    if(cr.end==="tip"){ const C0=coaxStart(); if(Math.hypot(E[0]-C0[0],E[2]-C0[2])>COAX_DESK-PRB.tail+2){ say(t.m.coaxReach,true); return; } }
    if(cr.end==="gnd"){ const A=probeAttachW(); if(A&&!reach(A,E)){ say(t.m.gndReach,true); return; } }
    else if(S.probe.gnd){ const G=termInfo(S.probe.gnd), h=leadDir(ti), s0=PRB.gAt, A=[E[0]+h[0]*s0,Math.max(0.55,E[1]-(E[1]-0.55)*Math.min(1,s0/9)),E[2]+h[2]*s0];
      if(G&&!reach(A,endPos(S.probe.gnd,G))){ say(t.m.gndReach,true); return; } }
    S.probe[cr.end]=id; S.carry=null; say(t.m.probeOn); solve(); return;
  }
  if(cr.k==="key"||cr.k==="plate"||cr.k==="pan"){
    const onKit=inRect(S.zones.stack,x,y,6)||inRect(S.zones.base,x,y,4)||(S.on.box==="cover"&&inRect(S.zones.box,x,y));
    if(!onKit&&cr.k==="plate"){
      const [bx,bz]=benchAt(x,y);
      if(!plateSpot(bx,bz)){ say(t.m.noFit,true); return; }
      S.dplates.push({mat:cr.mat,x:bx,z:bz}); S.carry=null; say(t.m.plateDesk(t.mat[cr.mat])); drawTray(); return; }
    if(!onKit){
      if(cr.k==="key"){ S.carry=null; drawTray(); say(t.m.returned(t.trayItems.key)); } else say(t.m.noFit,true);
      return; }
    if(S.on.box==="cover"){ say(t.m.covered,true); return; }
    const up=upHs(), lo=lowHs();
    if(!lo){ say(t.m.needHs,true); return; }
    if(cr.k==="key"){ if(!up){ say(t.m.keyNoUp,true); return; }
      if(!S.loose&&S.pan&&S.hs[up].flip){ say(t.m.panFalls,true); return; }
      S.loose=!S.loose; say(S.loose?t.m.loosened:t.m.tightened); return; }
    if(cr.k==="plate"){                       /* slid in sideways through the open gap: no need to touch the clamps */
      if(up&&gapUsed()+PLATE_MM[cr.mat]>gapMM()+1e-6){ say(t.m.slotFull,true); return; }
      if(!up&&S.pan){ say(t.m.slotBusy,true); return; }
      S.stack.push(cr.mat); S.carry=null;
      say(up?t.m.plateIn(t.mat[cr.mat],S.stack.length,(gapMM()-gapUsed()).toFixed(1)):t.m.plateOnC2(t.mat[cr.mat],S.stack.length));
    }else{
      if(!up){ if(S.pan||S.stack.length){ say(t.m.slotBusy,true); return; }
        S.pan=PAN_OF[cr.id]; S.panPos="gap"; S.panOn="low"; S.panItem=cr.id; S.panT=T_AMB; S.carry=null; say(t.m.panOnC2); solve(); drawTray(); return; }
      if(S.hs[up].flip){ say(t.m.panFlipBack,true); return; }
      if(!S.loose){ say(t.m.needLoose,true); return; }
      if(S.pan){ say(t.m.slotBusy,true); return; }
      S.pan=PAN_OF[cr.id]; S.panPos="top"; S.panOn="up"; say(t.m.panTop);
      S.panItem=cr.id; S.panT=T_AMB; S.carry=null;
    }
    solve(); drawTray(); return;
  }
  if(cr.k==="item"&&cr.id==="probe"){        /* its BNC plug goes into CH1 or CH2 on top of the scope, or it is laid on the desk */
    if(!S.on.scope||!inRect(S.zones.scope,x,y,6)){ const [bx,bz]=benchAt(x,y);
      if(bx<DESK[0]+6||bx>DESK[1]-8||bz<DESK[2]+7||bz>DESK[3]-7){ say(t.m.probeWhere,true); return; }
      S.probeDesk=[bx,bz]; S.carry=null; say(t.m.probeDesk); drawTray(); return; }
    S.probeDesk=null;
    const dz=Z_BNC.map(([bx])=>{ const q=withOff(S.at.scope,()=>NP(bx,Z_BOX[3],(Z_BOX[4]+Z_BOX[5])/2)); return Math.hypot(q[0]-x,q[1]-y); });
    S.probeCh=dz[1]<dz[0]?1:0; S.on.probe=true; S.carry=null; say(t.m.probeIn(Z_BNC[S.probeCh][1])); solve(); drawTray(); return; }
  if(cr.k==="item"){
    const id=cr.id, [bx,bz]=benchAt(x,y);
    let where="desk", o=null;
    if(S.hs[id]){                              /* a coil housing goes onto the base plate, on the other housing, or stands on the desk */
      const onKit=S.on.base&&(inRect(S.zones.base,x,y,8)||inRect(S.zones.stack,x,y,8));
      if(!onKit){ const o2=freeSpot(id,bx,bz); if(!o2){ say(t.m.noFit,true); return; }
        S.at[id]=o2; S.hs[id].at="desk"; S.carry=null; say(t.m.hsDesk(t.trayItems[id])); solve(); drawTray(); return; }
      if(S.on.box==="cover"){ say(t.m.covered,true); return; }
      if(!upHs()){ S.hs[id].at="up"; S.loose=true; say(t.m.hsUp(t.trayItems[id])); }
      else { say(t.m.stackFull,true); return; }
      S.carry=null; solve(); drawTray(); return;
    }
    if(id==="box"&&S.on.base&&(inRect(S.zones.base,x,y)||inRect(S.zones.stack,x,y))) where="cover";
    if(CAPS[id]){                              /* legs into the two front posts of the box, or lying on the desk */
      const bo=boxOrigin();
      if(bo){
        const q=NP(bo[0]+(POSTS.B1[0]+POSTS.B2[0])/2,BOX_H+POST_H,bo[1]+POSTS.B1[1]);
        if(Math.hypot(q[0]-x,q[1]-y)<Math.max(16,ppcm()*3)){
          if(CAP_KEYS.some(k=>k!==id&&S.cap[k]==="box")){ say(t.m.capBusy,true); return; }
          where="box"; }
      }
    }
    if(where==="desk"){ o=freeSpot(id,bx,bz); if(!o){ say(t.m.noFit,true); return; } }
    if(id==="box"&&where==="cover"&&cr.move&&S.on.box==="cover"){ S.carry=null; return; }
    if(o) S.at[id]=o;
    if(id==="box") S.on.box=where;
    else if(CAPS[id]) S.cap[id]=where;
    else S.on[id]=true;
    S.carry=null;
    if(id==="base"&&!S.hs.c2.at){ S.hs.c2.at="low"; S.hs.c2.flip=false; say(t.m.baseIn); }
    else say(CAPS[id]&&where!=="desk"?t.m.capBox:t.m.placed(t.trayItems[id]));
    if(id==="fg"&&!S.fg.pow&&!cr.move) setTimeout(()=>say(t.m.fgRear),1500);
    solve(); drawTray(); return;
  }
}
function onRClick(p){
  const [x,y]=p, t=d();
  if(S.carry){

      const st=FG_STOPS[key], a0=st[S.fg[key]], lo=st[0]-12, hi=st[st.length-1]+12; let y0=null;

      if(!f){ R(hx0,0,hx0+0.7,b,col,ed); R(hx1-0.7,0,hx1,b,col,ed); } else { R(hx0,tp,hx0+0.7,tp+HS.leg,col,ed); R(hx1-0.7,tp,hx1,tp+HS.leg,col,ed); }
      R(hx0,b,hx1,tp,col,ed); R(hx0+0.9,y-0.07,hx1-0.9,y+0.07,"#e8a2a2"); R(hx1,(b+tp)/2-0.07,hx1+0.5,(b+tp)/2+0.07,"#d4b050");
      L(t.lab.coil1+(f?" ("+t.flipped+")":""),hx1+1.6,y,"#e8eef2"); $("secTxt").textContent=t.lab.c1Desk; return; }
    L(t.lab.noKit,6,1.6,"#69717a","center"); $("secTxt").textContent=""; return; }
  R(0.3,0,11.7,BASE.t,"#3a3d42",ed);
  const lo=lowHs(), up=upHs();
  const wind=(cc)=>{ const y=coilY(cc), ym=plateMid(cc); R(hx0+0.9,y-0.07,hx1-0.9,y+0.07,"#e8a2a2"); R(hx1,ym-0.07,hx1+0.5,ym+0.07,"#d4b050");
    L((cc==="c1"?t.lab.coil1:t.lab.coil2)+(S.hs[cc].flip?" ("+t.flipped+")":""),hx1+1.6,y,"#e8eef2"); };
  if(lo){ R(hx0,BASE.t,hx1,LOW_TOP,col,ed); R(hx0,LOW_TOP,hx0+0.7,LOW_TOP+HS.post,col,ed); R(hx1-0.7,LOW_TOP,hx1,LOW_TOP+HS.post,col,ed); wind(lo); }
  let py=LOW_TOP; const groups=[];
  for(const m of S.stack){ const th=PLATE_MM[m]/10; R(hx0+1.35,py,hx1-1.35,py+th,MAT[m].col,MAT[m].edge); py+=th;
    if(groups.length&&groups[groups.length-1][0]===m) groups[groups.length-1][1]++; else groups.push([m,1]); }
  const pc=S.pan?MAT[S.pan==="AL"?"AL":"SS410"].col:null, pth=S.pan?PAN_MM[S.pan]/10:0;
  if(up){
    const [b,tp]=upPlate(), f=S.hs[up].flip;
    if(!f){ R(hx0,b-HS.leg,hx0+0.7,b,col,ed); R(hx1-0.7,b-HS.leg,hx1,b,col,ed); }
    R(hx0,b,hx1,tp,col,ed);
    if(f){ R(hx0,tp,hx0+0.7,tp+HS.leg,col,ed); R(hx1-0.7,tp,hx1,tp+HS.leg,col,ed);
      R(hx0+0.05,b-0.3,hx0+1.45,b,"#1a1c1f",ed); R(hx1-1.45,b-0.3,hx1-0.05,b,"#1a1c1f",ed);
      R(hx0+1.45,b-0.3,hx0+1.85,b-0.18,"#1a1c1f",ed); R(hx1-1.85,b-0.3,hx1-1.45,b-0.18,"#1a1c1f",ed); L(t.lab.clamp,hx0-0.9,b-0.15,"#9aa3ab","right"); }
    else { R(hx0+0.05,tp,hx0+1.45,tp+0.3,"#1a1c1f",ed); R(hx1-1.45,tp,hx1-0.05,tp+0.3,"#1a1c1f",ed); L(t.lab.clamp,hx1+1.6,tp+0.25,"#9aa3ab"); }
    if(S.pan&&S.panPos==="gap"&&S.panOn==="up") R(hx0+1.8,b-pth,hx1-1.8,b,pc,"#000");
    if(S.pan&&S.panPos==="top") R(hx0+1.8,tp,hx1-1.8,tp+pth,pc,"#000");
    wind(up);
  }
  if(S.pan&&S.panPos==="gap"&&S.panOn==="low") R(hx0+1.8,py,hx1-1.8,py+pth,pc,"#000");
  L(t.lab.pins,hx1+0.6,3.9,"#d4b050");
  if(S.on.box==="cover"){ c.setLineDash([5,4]); c.strokeStyle="#f2c14e"; c.strokeRect(X(0.1),Y(4.1),11.8*s,4.1*sy); c.setLineDash([]); }
  const gapTxt=up?" · "+t.lab.gap(gapMM().toFixed(1),gapUsed().toFixed(2)):"";
  const stTxt= S.pan ? t.lab.pan+" — "+t.trayItems[S.panItem].replace(/^\d+\.\s*/,"")+" ("+(S.panPos==="top"?t.up:t.lo)+")"
             : groups.length ? groups.map(([m,n])=>t.mat[m]+" × "+n).join(" + ") : t.lab.empty;
  $("secTxt").textContent=t.secTxt(up?(S.loose?t.lab.loose:t.lab.tight):"—", S.on.box==="cover"?t.lab.covered:t.lab.open, stTxt+gapTxt)+(S.hs.c1.at==="desk"?"\n"+t.lab.c1Out:"");
}
function renderStatus(){
  const L=[], t=d();
  if(!S.on.fg&&!S.on.scope&&!S.on.base) L.push([t.stNothing,false]);
  const sol=S.sol;
  if(sol){ const ipk=Math.max(cabs(sol.I1),cabs(sol.I2)); if(ipk>2.0) L.push([t.st.hot,true]); }
  if(S.on.scope&&S.z.on&&S.z.mode==="DMM"){
    const r=S.z.rd;
    if(r.live&&S.z.dfn==="OHM") L.push([t.st.live,true]);
    if(r.band&&S.z.dfn==="ACV") L.push([t.st.band,true]);
  }
  if(fgLive()&&S.fg.wave!==0) L.push([t.st.wave,true]);
  if(S.on.fg&&S.fg.pow&&!fgMains()) L.push([t.pw.noMains,true]);
  if(S.on.scope&&S.z.on&&batBars()===0&&!chgLive()) L.push([t.pw.bat0,true]);
  if(S.pan&&S.on.box!=="cover") L.push([t.st.open,false]);
  if(S.msg&&performance.now()-S.msg.t<9000) L.push(["• "+S.msg.s,S.msg.warn]);
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
/* stopwatch runs on bench time */
function fmtTime(v){ v=Math.max(0,v); const m=Math.floor(v/60), s=v-60*m; return m+":"+s.toFixed(2).padStart(5,"0"); }
function swValue(){ return S.swAcc+(S.swRun?S.t-S.swT0:0); }
$("swBtn").onclick=()=>{ if(!S.on.sw){ say(d().m.swNeed,true); return; } if(S.swRun){ S.swAcc+=S.t-S.swT0; S.swRun=false; } else { S.swT0=S.t; S.swRun=true; } updSwBtn(); };
$("swLap").onclick=()=>{ if(!S.on.sw){ say(d().m.swNeed,true); return; } S.laps.push(swValue()); renderLaps(); };
$("swReset").onclick=()=>{ if(!S.on.sw){ say(d().m.swNeed,true); return; } S.swRun=false; S.swAcc=0; S.swT0=S.t; S.laps=[]; renderLaps(); updSwBtn(); };
function updSwBtn(){ const b=$("swBtn"); b.textContent=S.swRun?d().stop:d().start; b.classList.toggle("run",S.swRun); }
function renderLaps(){ const box=$("laps"); box.innerHTML="";
  for(let i=S.laps.length-1;i>=0;i--){ const el=document.createElement("div"); el.textContent=String(i+1).padStart(2," ")+"   "+fmtTime(S.laps[i]); box.appendChild(el); } }
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of SPEEDS){ const b=document.createElement("button"); b.textContent=s+"×"; if(s===S.speed) b.className="on";
    b.onclick=()=>{ S.speed=s; renderSpeeds(); }; box.appendChild(b); } }
/* the close-up window: the instrument's own canvas is moved into it, so it is the very same instrument */
let imOpen=null;
function openInstr(which){
  closeInstr(); const box=$(which==="fg"?"fgBox":"zBox"), vw=window.innerWidth, vh=window.innerHeight;
  const w=which==="fg"?Math.min(1000,vw*0.92):Math.max(240,Math.min(480,vw*0.92,(vh*0.94-80)*9.9/19.6));
  box.style.width=Math.floor(w)+"px"; $("imBody").appendChild(box);
  /* the scope also shows its LCD large beside it, as if leaning in to read it */
  if(which==="scope"){ const bw=Math.floor(Math.min(980,vw*0.94-w-60,(vh*0.9-80)*7.78/5.56));
    if(bw>=240){ $("imBody").classList.add("pair"); zBig.style.width=bw+"px"; zBig.style.height=Math.round(bw*5.56/7.78)+"px";
      zBig.width=Math.round(bw*DPR); zBig.height=Math.round(bw*5.56/7.78*DPR); $("imBody").appendChild($("zBigBox")); } }
  $("imodal").hidden=false; imOpen=which; layout(); }
function closeInstr(){ if(!imOpen) return; const box=$(imOpen==="fg"?"fgBox":"zBox"); box.style.width=""; document.querySelector(".instrHold").appendChild(box);
  $("imBody").classList.remove("pair"); document.querySelector(".instrHold").appendChild($("zBigBox")); $("imodal").hidden=true; imOpen=null; S.knob=null; layout(); }
$("imClose").onclick=closeInstr;
$("imodal").addEventListener("mousedown",e=>{ if(e.target===$("imodal")) closeInstr(); });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&imOpen) closeInstr(); });
cv.addEventListener("dblclick",e=>{ const [x,y]=mousePos(e);
  const which=S.on.fg&&inRect(S.zones.fg,x,y)?"fg":S.on.scope&&inRect(S.zones.scope,x,y)?"scope":null;
  if(!which){ if(!S.carry){ S.zoom=1; S.touched=false; fit(); } return; }                  /* a bare spot: back to the whole bench */
  /* the two clicks of a double-click must not leave the part moved or picked up */
  const m=S.lastMove; if(m&&performance.now()-m.t<700&&m.id===which){ if(m.at) S.at[which]=m.at; }
  if(S.carry&&S.carry.move) S.carry=null;
  S.knob=null; openInstr(which); });

/* the displays refresh a few times a second, like the real instrument */
function updateReadings(){
  const z=S.z, now=performance.now();
  if(now-z.rd.t<260) return;
  z.rd.t=now;
  if(!S.on.scope||!z.on) return;
  if(z.mode==="SCOPE"){
    if(z.hold) return;
    if(z.tmode==="SINGLE"&&!z.armed) return;
    const v=scopeView();
    z.rd.wait=v.wait;
    if(v.wait) return;
    if(z.tmode==="SINGLE"&&v.amp>0){ z.armed=false; z.held=v; say(d().m.single); }
    const A=v.amp*z.probe, vd=VDIV[z.vi];
    const clip=A/vd>4.2, shown=Math.min(A,4.2*vd);
    const lb=batBars()===0&&!chgLive()?4:1, noisy=x=>Math.max(0,x*(1+0.003*lb*gauss())+0.004*lb*vd*gauss());
    z.rd.vpp=noisy(2*shown); z.rd.vmax=noisy(shown)*(Math.random()<0.06?1+0.15*Math.random():1);
    z.rd.f=A>0.3*vd?v.f*(1+(clip?0.02:0.0008)*gauss()):0;
  }else{
    Object.assign(z.rd,{live:false,band:false,beep:false},dmmReading());
  }
}

$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   12.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let tPrev=performance.now()/1000, ui=0;
function tick(){
  const now=performance.now()/1000;
  const dtr=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const dt=dtr*S.speed;
  S.t+=dt;
  solve();
  if(S.pan&&S.sol){
    const Irms=((S.net.panC1?cabs(S.sol.I1):0)+(S.net.panC2?cabs(S.sol.I2):0))/Math.SQRT2, n=Math.max(1,Math.ceil(dt/0.5));
    for(let i=0;i<n;i++) S.panT=thermalStep(S.pan,S.panT,Irms,freq(),dt/n,S.on.box!=="cover");
  }
  batStep(dt);
  updateReadings();
  if(CW>10) draw();
  drawFgPanel(); drawZoyiPanel(); drawZoyiBig();
  $("swLbl").textContent=S.on.sw?fmtTime(swValue()):"-:--.--"; $("swLbl").style.opacity=S.on.sw?1:0.35;
  if(ui%6===0) $("swHint").textContent=S.on.sw?d().swOk:d().swHint;
  if(++ui%6===0){ drawXsec(); renderStatus(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
layout(); applyLang(); solve(); requestAnimationFrame(tick);
