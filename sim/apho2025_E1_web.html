<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }

  /* ── tray ── */
  .tray{flex:0 0 214px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #bench{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;
         background:#232830;cursor:crosshair}
  #bench.dragging{cursor:grabbing}
  .instr{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .instr .ibox{flex:1 1 520px;min-width:280px}
  .instr .zbox{flex:0 0 270px}
  .instr canvas{display:block;width:100%;height:auto;background:#191c21;border-radius:6px;
                touch-action:none;cursor:pointer}
  .ilbl{font-size:12px;color:var(--accent);font-weight:600;margin:0 0 4px;letter-spacing:.03em}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel,.tray{position:static} }
  @media (max-width:1180px){ .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray,.panel{flex:1 1 100%} .instr .zbox{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .disp{background:#0d1512;border-radius:6px;padding:6px 10px;margin:2px 0 6px;text-align:center;
        color:#7dffb0;font:700 30px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.04em}
  .row{display:flex;gap:6px}
  .row button{flex:1;text-align:center}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  #swBtn{background:#2f6f3f;border-color:#2f6f3f;color:#fff;font-weight:600}
  #swBtn.run{background:#8a3b34;border-color:#8a3b34}
  .laps{background:var(--deep);border:1px solid var(--line);border-radius:6px;margin-top:6px;
        height:82px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;
        color:var(--ink);padding:4px 7px}
  #xsec{display:block;width:100%;height:auto;background:var(--deep);border-radius:6px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:10px;min-height:110px}
  .status div + div{margin-top:9px}
  .status .warn{color:#ff8b6a}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
</style>

    <div class="status" id="status"></div>
  </aside>
</div>

const MU0=4e-7*Math.PI, SB=5.670e-8, T_AMB=303.5;
const MAT={
  AL:   {sigma:3.70e7,mur:1,  t:0.73e-3,alpha:0.005,n:5,col:"#d7dbdf",edge:"#9aa2a8"},
  CU:   {sigma:5.88e7,mur:1,  t:0.71e-3,alpha:0.005,n:5,col:"#d98a55",edge:"#9c5a30"},
  SS304:{sigma:1.39e6,mur:1,  t:0.72e-3,alpha:0.005,n:4,col:"#c3c8cc",edge:"#7c8388"},
  SS410:{sigma:1.70e6,mur:700,t:0.76e-3,alpha:0.55, n:4,col:"#e3e8ec",edge:"#8d959b"}};
const PLATE_OF={plAL:"AL",plCU:"CU",plS4:"SS304",plS10:"SS410"};
const PAN={AL:{rho:2700,c:900,t:0.73e-3,e:0.65,r40:0.0546}, SS410:{rho:7700,c:460,t:0.76e-3,e:0.80,r40:0.1377}};
for(const k in PAN){ const p=PAN[k]; p.area=2*0.02*0.02; p.mass=p.rho*0.02*0.02*p.t; }
const PAN_OF={panAL:"AL",panSS:"SS410"};
const COIL_L=47.2e-6, COIL_RL=0.47, COIL_M=5.79e-6;
const R1_OHM=1.0, RCAB=0.0225, RSCOPE=1e6, RDMM=1e7;
const FG_EMAX=32.0, FG_RS=2.0, FG_ILIM=4.0;
const NTC_R0=10000, NTC_T0=298, NTC_B=3950;
const CAPS={
  C470N: {C:470e-9, esr:0.010,film:true, node:"K1",lab:"470 nF", r:0,   h:1.1},
  C470U: {C:470e-6, esr:0.030,film:false,node:"K2",lab:"470 µF", r:0.5, h:1.6},
  C1000U:{C:1000e-6,esr:0.030,film:false,node:"K3",lab:"1000 µF",r:0.65,h:2.0},
  C2200U:{C:2200e-6,esr:0.030,film:false,node:"K4",lab:"2200 µF",r:0.8, h:2.6}};
const CAP_KEYS=["C470N","C470U","C1000U","C2200U"];
const NODES=["FGP","FGN","R1A","R1B","B1","B2","B3","B4","C1A","C1B","C2A","C2B",
             "K1A","K1B","K2A","K2B","K3A","K3B","K4A","K4B","NTCA","NTCB","DCOM","DVO"];
const NI={}; NODES.forEach((t,i)=>NI[t]=i);

const skinDepth=(k,f)=>1/Math.sqrt(Math.PI*MAT[k].sigma*MAT[k].mur*MU0*Math.max(f,1e-9));
function shielding(stack,f){
  if(!stack.length) return 1;
  const dFr=6e-3*Math.pow(1000/Math.max(f,1),0.15);
  let s=0, sf=0, al=0;
  for(const k of stack){ const m=MAT[k]; s+=m.t/skinDepth(k,f); sf+=m.t/dFr; al=Math.max(al,m.alpha); }
  return (1-al)*Math.exp(-s)+al*Math.exp(-sf);
}
const rntc=T=>NTC_R0*Math.exp(NTC_B*(1/T-1/NTC_T0));
const rload=(k,f)=>PAN[k].r40*Math.sqrt(Math.max(f,1)/40000);

const C=(r,i)=>[r,i||0];
const cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const csub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cdiv=(a,b)=>{ const q=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/q,(a[1]*b[0]-a[0]*b[1])/q]; };
const cabs=a=>Math.hypot(a[0],a[1]);
function csolve(A,b){
  const n=b.length, M=A.map((r,i)=>r.map(v=>[v[0],v[1]]).concat([[b[i][0],b[i][1]]]));
  for(let k=0;k<n;k++){
    let piv=k, best=cabs(M[k][k]);
    for(let i=k+1;i<n;i++){ const a=cabs(M[i][k]); if(a>best){best=a;piv=i;} }
    if(best<1e-300) return null;
    if(piv!==k){ const t=M[k]; M[k]=M[piv]; M[piv]=t; }
    const dk=M[k][k];
    for(let j=k;j<=n;j++) M[k][j]=cdiv(M[k][j],dk);
    for(let i=0;i<n;i++){
      if(i===k) continue;
      const f=M[i][k]; if(f[0]===0&&f[1]===0) continue;
      for(let j=k;j<=n;j++) M[i][j]=csub(M[i][j],cmul(f,M[k][j]));
    }
  }
  return M.map(r=>r[n]);
}
/* complex modified nodal analysis of the whole bench */
function analyze(net,f){
  const N=NODES.length, gnd=NI.FGN, w=2*Math.PI*f;
  const nmap=new Array(N); let c=0;
  for(let i=0;i<N;i++) nmap[i]= i===gnd ? -1 : c++;
  const size=(N-1)+3;
  const A=[...Array(size)].map(()=>[...Array(size)].map(()=>C(0))), b=[...Array(size)].map(()=>C(0));
  const at=(i,j,v)=>{ if(i>=0&&j>=0) A[i][j]=cadd(A[i][j],v); };
  const stampY=(na,nb,Y)=>{ const a=nmap[na], bb=nmap[nb]; at(a,a,Y); at(bb,bb,Y); at(a,bb,[-Y[0],-Y[1]]); at(bb,a,[-Y[0],-Y[1]]); };
  const stampR=(na,nb,R)=>{ if(R>0) stampY(na,nb,C(1/R)); };
  for(let i=0;i<N;i++) if(i!==gnd) at(nmap[i],nmap[i],C(1e-9));
  for(const [a,bb,R] of net.res) stampR(NI[a],NI[bb],R);
  for(const [a,bb,R] of net.loads) stampR(NI[a],NI[bb],R);
  for(const [a,bb,Cc,esr] of net.caps) stampY(NI[a],NI[bb],cdiv(C(1),C(esr,-1/(w*Cc))));
  /* plates between the coils load both; the pan loads the coil(s) it lies against */
  const rs=net.stack.length?0.02*Math.sqrt(Math.max(f,1)/40000)*net.stack.length:0, rp=net.pan?rload(net.pan,f):0;
  const rex1=rs+(net.panC1?rp:0), rex2=rs+(net.panC2?rp:0);
  const Meff=COIL_M*net.mfac*shielding(net.stack,f);
  const bFG=N-1, bL1=N, bL2=N+1;
  at(nmap[NI.FGP],bFG,C(1)); at(nmap[NI.FGN],bFG,C(-1));
  at(bFG,nmap[NI.FGP],C(1)); at(bFG,nmap[NI.FGN],C(-1));
  at(bFG,bFG,C(-FG_RS)); b[bFG]=C(net.E);
  const Zm=C(0,w*Meff);
  for(const [br,p,m,other,Zc] of [[bL1,"C1A","C1B",bL2,C(COIL_RL+rex1,w*COIL_L)],[bL2,"C2A","C2B",bL1,C(COIL_RL+rex2,w*COIL_L)]]){
    at(nmap[NI[p]],br,C(1)); at(nmap[NI[m]],br,C(-1));
    at(br,nmap[NI[p]],C(1)); at(br,nmap[NI[m]],C(-1));
    at(br,br,[-Zc[0],-Zc[1]]); at(br,other,[-Zm[0],-Zm[1]]);
  }
  let x=csolve(A,b);
  if(!x) return null;
  const ifg=cabs(x[bFG]);
  if(ifg>FG_ILIM){ const s2=FG_ILIM/ifg; x=x.map(v=>[v[0]*s2,v[1]*s2]); }
  const V={}; for(const t of NODES) V[t]= NI[t]===gnd ? C(0) : x[nmap[NI[t]]];
  return {V, I1:x[bL1], I2:x[bL2], amp:(t1,t2)=>(t1&&t2)?cabs(csub(V[t1],V[t2])):0};
}
/* ohmmeter: dc, capacitors open, generator = its 2 ohm output stage */
function measureR(net,ta,tb){
  const N=NODES.length, G=[...Array(N)].map(()=>new Array(N).fill(0));
  const add=(a,b,g)=>{ G[a][a]+=g; G[b][b]+=g; G[a][b]-=g; G[b][a]-=g; };
  for(const [a,b,R] of net.res) add(NI[a],NI[b],1/R);
  add(NI.C1A,NI.C1B,1/COIL_RL); add(NI.C2A,NI.C2B,1/COIL_RL);
  add(NI.FGP,NI.FGN,1/FG_RS);
  for(let i=0;i<N;i++) G[i][i]+=1e-12;
  const ref=NI[tb], src=NI[ta], keep=[...Array(N).keys()].filter(i=>i!==ref);
  const M=keep.map(i=>keep.map(j=>C(G[i][j]))), rhs=keep.map(i=>C(i===src?1:0));
  const x=csolve(M,rhs); if(!x) return Infinity;
  const R=x[keep.indexOf(src)][0];
  return R>2e7?Infinity:R;
}
/* nodes carrying the generator signal */
function liveNodes(net){
  const par={}; for(const t of NODES) par[t]=t;
  const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  const join=(a,b)=>{ const ra=find(a), rb=find(b); if(ra!==rb) par[ra]=rb; };
  for(const [a,b] of net.res) join(a,b);
  for(const [a,b] of net.caps) join(a,b);
  join("FGP","FGN"); join("C1A","C1B"); join("C2A","C2B");
  const g=find("FGP");
  if(find("C1A")===g||find("C2A")===g) join("C1A","C2A");
  const g2=find("FGP");
  return new Set(NODES.filter(t=>find(t)===g2));
}
function thermalStep(k,T,Irms,f,dt,uncovered){
  const p=PAN[k];
  const Pin=Irms*Irms*rload(k,f);
  let Pl=p.e*p.area*SB*(T**4-T_AMB**4);
  if(uncovered) Pl+=8*p.area*(T-T_AMB);
  return T+(Pin-Pl)*dt/(p.mass*p.c);
}
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

function freq(){
  const [lo,hi]=FRANGE[S.fg.range];
  const f=(lo+(hi-lo)*S.fg.coarse)*(1+0.04*(S.fg.fine-0.5));

function buildNet(){
  const res=[], caps=[], loads=[];
  for(const cb of S.cables) if(cb.b) res.push([cb.a,cb.b,RCAB]);
  if(S.on.box) res.push(["R1A","R1B",R1_OHM]);           /* R1 is screwed onto the black box */
  for(const k of CAP_KEYS){
    const p=S.cap[k]; if(!p) continue;
    const n=CAPS[k].node;
    caps.push([n+"A",n+"B",CAPS[k].C,CAPS[k].esr]);
    if(p==="box") res.push([n+"A","B1",1e-3],[n+"B","B2",1e-3]);
  }
  if(S.pan) res.push(["NTCA","NTCB",rntc(S.panT)]);
  if(S.on.scope&&S.z.on){
    if(S.z.mode==="SCOPE"&&S.probe.tip&&S.probe.gnd) loads.push([S.probe.tip,S.probe.gnd,RSCOPE]);
    if(S.z.mode==="DMM"&&S.z.dfn!=="OHM") loads.push(["DVO","DCOM",RDMM]);
  }
  const E=(S.on.fg&&S.fg.pow)?FG_EMAX*S.fg.amp:0;
  const cp=coilPlace();
  return {res,caps,loads,E,stack:S.stack,pan:S.pan,panC1:cp.panC1,panC2:cp.panC2,mfac:cp.mfac};
}
function solve(){ S.net=buildNet(); S.sol=analyze(S.net,freq()); return S.sol; }
/* which housing sits where, and what that means for the coupling */
const hsAt=slot=>S.hs.c1.at===slot?"c1":S.hs.c2.at===slot?"c2":null;
const lowHs=()=>hsAt("low"), upHs=()=>hsAt("up"), topHs=()=>upHs()||lowHs();
/* is the winding of housing c next to the gap between the housings? (Fig. 3b: no for both, as delivered) */
function windingInner(c){ return S.hs[c].flip; }   /* as delivered both windings face outwards */
function coilPlace(){
  const lo=lowHs(), up=upHs();
  let mfac=0;
  if(lo&&up) mfac=(windingInner(lo)?1.35:1)*(windingInner(up)?1.35:1);
  let p1=false, p2=false;
  if(S.pan){
    if(S.panPos==="gap"){ p1=!!S.hs.c1.at; p2=!!S.hs.c2.at; }
    else { const t=topHs(); p1=t==="c1"; p2=t==="c2"; }
  }
  return {mfac,panC1:p1,panC2:p2};
}

function fit(){

const UV=(u,v)=>{ const k=ppcm(); return [(u-S.cam[0])*k, CH-(v-S.cam[1])*k]; };
let OFF=[0,0];               /* the part being drawn is shifted by OFF (cm) */
const NP=(x,y,z)=>{ const p=proj(x+OFF[0],y,z+OFF[1]); return UV(p[0],p[1]); };

/* the bench point (y = 0) under a screen point */
function benchAt(px,py){ const [u,v]=INV(px,py); return [(u/KC-v/KS)/2,(u/KC+v/KS)/2]; }
const INV=(px,py)=>{ const k=ppcm(); return [px/k+S.cam[0], (CH-py)/k+S.cam[1]]; };

function faceM(F){ const [X,Y]=NP(F.x0,F.y1,F.z), k=ppcm(); return [k*KC,k*KS,0,k,X,Y]; }
function faceInv(F,px,py){

const FONT='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const MONO='ui-monospace,Consolas,"DejaVu Sans Mono",monospace';
function TXT(x,y,txt,opt){
  opt=opt||{};

  ctx.textAlign=opt.align||"center"; ctx.textBaseline=opt.base||"middle";
  ctx.fillStyle=opt.fill||"#e8eef2";

function LINE(pts,stroke,width,cap,dash){

function POLY(pts,fill,outline,width){

  ctx.closePath();

function inRect(z,x,y,m){ m=m||0; return !!z&&z[0]-m<=x&&x<=z[2]+m&&z[1]-m<=y&&y<=z[3]+m; }
function inPoly(P,x,y){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){

function waveShape(ph){
  const w=S.fg.wave;

  if(w===1){ const x=((ph/(2*Math.PI))%1+1)%1; return x<0.25?4*x:x<0.75?2-4*x:4*x-4; }
  return Math.sin(ph)>=0?1:-1;
}

function scopeView(){
  const inp=scopeInput(), z=S.z;
  const noise=[]; for(let i=0;i<23;i++) noise.push(gauss());
  const v=inp.amp, lvl=z.trig*VDIV[z.vi];
  const wait=z.tmode!=="AUTO"&&Math.abs(lvl)>v;
  const s=v>0?Math.max(-1,Math.min(1,lvl/v)):0;
  const phase=z.edge>0?-Math.asin(s):Math.PI+Math.asin(s);
  return {amp:v,f:inp.f,phase,noise,wait,none:inp.none};
}
function dmmReading(){
  const z=S.z, net=S.net;
  if(z.dfn==="ACV"||z.dfn==="DCV"){
    if(!S.sol) return {txt:"0.000",unit:"V",flag:""};
    if(z.dfn==="DCV") return {txt:(0.0004*gauss()).toFixed(3),unit:"V",flag:"DC"};
    const f=freq(); let v=S.sol.amp("DVO","DCOM")/Math.SQRT2;
    const band=f<40||f>1000;
    if(f>1000) v/=Math.sqrt(1+Math.pow(f/1000-1,2)*1.7);
    if(f<40) v*=f/40;
    v=v*(1+0.002*gauss());
    const u=Math.abs(v)<1?"mV":"V", x=Math.abs(v)<1?v*1000:v;
    return {txt:x.toFixed(Math.abs(x)>=100?1:Math.abs(x)>=10?2:3),unit:u,flag:"AC",band};
  }
  /* resistance family */
  const live=net.E>0?liveNodes(net):new Set();
  const isLive=live.has("DVO")||live.has("DCOM");
  if(z.rfn===0||z.rfn===1){
    let R=measureR(net,"DVO","DCOM");
    if(isLive) R=isFinite(R)?R*(1+0.6*Math.random())+5*Math.random():1e6*Math.random();
    const beep=z.rfn===1&&R<30;
    if(!isFinite(R)||R>60e6) return {txt:"OL",unit:"Ω",flag:z.rfn===1?"•)))":"",live:isLive,beep};
    R=Math.max(0,R*(1+0.0015*gauss())+0.003*gauss());
    const [m,u]=R>=1e6?[1e6,"MΩ"]:R>=1e3?[1e3,"kΩ"]:[1,"Ω"];
    const x=R/m;
    return {txt:x.toFixed(x>=100?1:x>=10?2:3),unit:u,flag:z.rfn===1?"•)))":"",live:isLive,beep};
  }
  if(z.rfn===2) return {txt:"OL",unit:"V",flag:"▶|"};
  return {txt:"0.000",unit:"nF",flag:"⊣⊢"};
}

function curve3(p0,d0,p3,d3){

    R(x-17,y-9,x-11,y-3,"#c0392b"); R(x+11,y+1,x+17,y+7,name==="bb"?"#c0392b":"#d4b050"); }
  else if(name==="box"){ R(x-15,y-8,x+15,y+9,"#1f2023","#000"); R(x-8,y-6,x+8,y-1,"#e8bf3a"); O(x-11,y-4,2.2,"#c8261d"); O(x+11,y-4,2.2,"#17181a","#666");
    O(x-6,y+4,2.2,"#c8261d"); O(x+6,y+4,2.2,"#17181a","#666"); }

  else if(CAPS[name]){ const r=3+CAPS[name].r*4; R(x-r,y-8,x+r,y+4,"#27479a"); L(x+r-2,y-7,x+r-2,y+3,"#b9c4de",1.5); L(x-2,y+4,x-2,y+10,"#ccc",1.5); L(x+2,y+4,x+2,y+10,"#ccc",1.5); }

}
function drawTray(){
  const c=trayCtx;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[];
  let y=6; const wd=TRW-12;
  for(const name of TRAY_ORDER){
    const [out,sub]=trayState(name);
    const sel=S.carry&&(S.carry.id===name||S.carry.type===name);
    c.fillStyle=out?"#171a1e":"#1f242b"; c.fillRect(6,y,wd,TRAY_ROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TRAY_ROW-5);
    trayIcon(c,name,28,y+(TRAY_ROW-4)/2,out);
    c.font='12px '+FONT; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=out?"#868e96":"#e8eef2";
    c.fillText(d().trayItems[name],52,y+13);
    c.font='9.5px '+FONT; c.fillStyle="#69717a"; c.fillText(sub,52,y+28);
    trayCells.push([name,y,y+TRAY_ROW-4]);
    y+=TRAY_ROW;
  }
  c.font='10.5px '+FONT; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  d().trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top;
  S.trayDrag=true;
  for(const [name,y0,y1] of trayCells){
    if(y<y0||y>y1) continue;
    cancelCarry(true);
    const [out]=trayState(name);
    const t=d();
    if(out){ say((name==="bb"||name==="bp")?t.m.noCable:t.trayOut); return; }
    if(name==="bb"||name==="bp"){ const col=S.stock[name].r>=S.stock[name].k?"r":"k"; S.stock[name][col]--; S.carry={k:"cable",type:name,col,a:null}; say(t.m.cable1); }
    else if(PLATE_OF[name]){ if(!lowHs()){ say(t.m.noCoil,true); return; } S.plates[PLATE_OF[name]]--; S.carry={k:"plate",id:name,mat:PLATE_OF[name]}; say(t.m.plateTake(t.mat[PLATE_OF[name]])); }
    else if(PAN_OF[name]){ if(!lowHs()){ say(t.m.noCoil,true); return; } if(S.pan){ say(t.m.slotBusy,true); return; } S.carry={k:"pan",id:name}; say(t.m.panTake(t.trayItems[name])); }
    else if(S.hs[name]&&!S.on.base){ say(t.m.needBase,true); return; }
    else if(name==="key"){ S.carry={k:"key",id:"key"}; say(t.m.keyTake); }
    else { S.carry={k:"item",id:name}; say(t.m.placeIt(t.trayItems[name])); }
    drawTray();
    return;
  }
});

/* ══════════════════════════════════════════════════════════════
   9.  INTERACTION
   ══════════════════════════════════════════════════════════════ */
function say(s,warn){ S.msg={s,warn:!!warn,t:performance.now()}; renderStatus(); }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function termAt(px,py){
  let best=null, bd=Math.max(9,ppcm()*0.9);
  for(const id of ALL_TERMS){
    const info=termInfo(id); if(!info||info.hidden) continue;
    for(const P of [info.p,endPos(id,info)]){
      const p=NP(...P), dd=Math.hypot(p[0]-px,p[1]-py);
      if(dd<bd){ bd=dd; best=id; }
    }
  }
  return best;
}
function termOk(cr,id,info){
  const t=d().m;
  const n=plugsAt(id).length;
  if(cr.a===id) return t.same;
  if(cr.type==="bb"){
    if(info.k!=="sock") return t.needSock;
    if(n>=2) return t.full;
    return true;
  }
  if(cr.a){
    const aKind=termInfo(cr.a).k;
    if(aKind===info.k) return aKind==="sock"?t.needPin:t.needSock;
  }
  if(info.k==="sock"&&n>=2) return t.full;
  if(info.k==="pin"&&n>=1) return t.full;
  return true;
}
function cancelCarry(silent){
  const cr=S.carry; if(!cr) return;
  if(cr.k==="cable") S.stock[cr.type][cr.col]++;
  if(cr.k==="plate") S.plates[cr.mat]++;
  S.carry=null;
  if(cr.move){ say(d().m.stays); return; }
  if(!silent) say(d().m.returned(cr.k==="probe"?d().lab.probe:(d().trayItems[cr.id||cr.type]||"")));
  drawTray();
}

function onPress(p){
  const [x,y]=p, cr=S.carry, t=d();
  if(cr){ place(x,y); return; }
  if(S.on.scope&&S.probeScr){
    for(const end of ["tip","gnd"]){
      const q=S.probeScr[end];
      if(Math.hypot(q[0]-x,q[1]-y)<Math.max(10,ppcm()*0.9)){
        S.probe[end]=null; S.carry={k:"probe",end}; say(t.m.probeTake(end==="tip"?t.lab.hook:t.lab.gnd)); solve(); return; }
    }
  }
  if(S.on.fg){ const [a,b]=withOff(S.at.fg,()=>faceInv(FG_FACE,x,y)); if(a>=0&&a<=24&&b>=0&&b<=9){ const h=fgPress(a,b,"bench"); if(h){ S.knob=h; h(y); return; } } }
  if(S.on.scope){ const [a,b]=withOff(S.at.scope,()=>faceInv(Z_FACE,x,y)); if(a>=0&&a<=9.5&&b>=0&&b<=18.5){ if(zoyiPress(a,b)) return; } }
  /* grab a part standing on the desk to move it (its leads stay plugged in) */
  for(const id of ["C470N","C470U","C1000U","C2200U","box","base","scope","fg"]){
    if(!(CAPS[id]?S.cap[id]==="desk":id==="box"?!!S.on.box:!!S.on[id])||!inRect(S.zones[id],x,y)) continue;
    S.carry={k:"item",id,move:true}; say(t.m.moveIt(t.trayItems[id])); return;
  }
  S.view0=[x,y,S.cam[0],S.cam[1]];
  cv.classList.add("dragging");
}
function place(x,y){
  const cr=S.carry, t=d();
  if(cr.k==="cable"){
    const id=termAt(x,y);
    if(!id){ say(t.m.noTerm,true); return; }
    const ok=termOk(cr,id,termInfo(id));
    if(ok!==true){ say(ok,true); return; }
    if(!cr.a){ cr.a=id; say(t.m.cable2); return; }
    S.cables.push({type:cr.type,col:cr.col,a:cr.a,b:id});
    S.carry=null; say(t.m.plugged); solve(); drawTray(); return;
  }
  if(cr.k==="probe"){
    const id=termAt(x,y);
    if(!id){ say(t.m.noTerm,true); return; }
    S.probe[cr.end]=id; S.carry=null; say(t.m.probeOn); solve(); return;
  }
  if(cr.k==="key"||cr.k==="plate"||cr.k==="pan"){
    const onKit=inRect(S.zones.stack,x,y,6)||inRect(S.zones.base,x,y,4)||(S.on.box==="cover"&&inRect(S.zones.box,x,y));
    if(!onKit){
      if(cr.k==="key"){ S.carry=null; drawTray(); say(t.m.returned(t.trayItems.key)); } else say(t.m.noFit,true);
      return; }
    if(S.on.box==="cover"){ say(t.m.covered,true); return; }
    const up=upHs(), lo=lowHs();
    if(!lo){ say(t.m.needHs,true); return; }
    if(cr.k==="key"){ if(!up){ say(t.m.keyNoUp,true); return; } S.loose=!S.loose; say(S.loose?t.m.loosened:t.m.tightened); return; }
    if(up&&!S.loose){ say(t.m.needLoose,true); return; }
    if(cr.k==="plate"){
      if(S.pan&&S.panPos==="gap"){ say(t.m.slotBusy,true); return; }
      if(S.stack.length>=8){ say(t.m.slotFull,true); return; }
      S.stack.push(cr.mat); S.carry=null; say(t.m.plateIn(t.mat[cr.mat],S.stack.length));
    }else{
      if(S.pan){ say(t.m.slotBusy,true); return; }
      if(up){ S.pan=PAN_OF[cr.id]; S.panPos="top"; S.panOn="up"; say(t.m.panTop); }
      else { if(S.stack.length){ say(t.m.slotBusy,true); return; } S.pan=PAN_OF[cr.id]; S.panPos="gap"; S.panOn="low"; say(t.m.panIn); }
      S.panItem=cr.id; S.panT=T_AMB; S.carry=null;
    }
    solve(); drawTray(); return;
  }
  if(cr.k==="item"){
    const id=cr.id, [bx,bz]=benchAt(x,y);
    let where="desk", o=null;
    if(S.hs[id]){                              /* a coil housing goes onto the base plate, or on the other housing */
      if(!S.on.base){ say(t.m.needBase,true); return; }
      if(!(inRect(S.zones.base,x,y,8)||inRect(S.zones.stack,x,y,8))){ say(t.m.noFit,true); return; }
      if(S.on.box==="cover"){ say(t.m.covered,true); return; }
      if(!lowHs()){ S.hs[id].at="low"; say(t.m.hsLow(t.trayItems[id])); }
      else if(!upHs()){ S.hs[id].at="up"; S.loose=true; say(t.m.hsUp(t.trayItems[id])); }
      else { say(t.m.stackFull,true); return; }
      S.carry=null; solve(); drawTray(); return;
    }
    if(id==="box"&&S.on.base&&(inRect(S.zones.base,x,y)||inRect(S.zones.stack,x,y))) where="cover";
    if(CAPS[id]){                              /* legs into the two front posts of the box, or lying on the desk */
      const bo=boxOrigin();
      if(bo){
        const q=NP(bo[0]+(POSTS.B1[0]+POSTS.B2[0])/2,BOX_H+POST_H,bo[1]+POSTS.B1[1]);
        if(Math.hypot(q[0]-x,q[1]-y)<Math.max(16,ppcm()*3)){
          if(CAP_KEYS.some(k=>k!==id&&S.cap[k]==="box")){ say(t.m.capBusy,true); return; }
          where="box"; }
      }
    }
    if(where==="desk"){ o=freeSpot(id,bx,bz); if(!o){ say(t.m.noFit,true); return; } }
    if(id==="box"&&where==="cover"&&cr.move&&S.on.box==="cover"){ S.carry=null; return; }
    if(o) S.at[id]=o;
    if(id==="box") S.on.box=where;
    else if(CAPS[id]) S.cap[id]=where;
    else S.on[id]=true;
    S.carry=null;
    say(CAPS[id]&&where!=="desk"?t.m.capBox:t.m.placed(t.trayItems[id]));
    if(id==="fg"&&!S.fg.pow&&!cr.move) setTimeout(()=>say(t.m.fgRear),1500);
    solve(); drawTray(); return;
  }
}
function onRClick(p){
  const [x,y]=p, t=d();
  if(S.carry){
    if(S.carry.k==="probe"){ S.carry=null; say(t.m.probeOff); solve(); return; }
    cancelCarry(false); return;
  }
  for(let i=S.cables.length-1;i>=0;i--){
    const pts=S.cabPts&&S.cabPts[i]; if(!pts) continue;
    for(let j=0;j<pts.length;j++) if(Math.hypot(pts[j][0]-x,pts[j][1]-y)<Math.max(7,ppcm()*0.6)){ removeCable(i); say(t.m.unplug); solve(); return; }
  }
  if(S.probeScr) for(const end of ["tip","gnd"]){ const q=S.probeScr[end];
    if(S.probe[end]&&Math.hypot(q[0]-x,q[1]-y)<Math.max(10,ppcm()*0.9)){ S.probe[end]=null; say(t.m.probeOff); solve(); return; } }
  if(S.on.box==="cover"&&inRect(S.zones.box,x,y)){ returnItem("box"); return; }
  if(S.on.base&&inRect(S.zones.stack,x,y)){ unstackOne(); return; }
  for(const k of CAP_KEYS) if(S.cap[k]==="desk"&&inRect(S.zones[k],x,y)){ returnItem(k); return; }
  for(const id of ["box","base","scope","fg"]){
    if(inRect(S.zones[id],x,y)){ returnItem(id); return; }
  }
}
/* right-click on the stack: take the top thing off — pan, plate, housing — in the order a hand would */
function unstackOne(){
  const t=d(), up=upHs(), lo=lowHs();
  const panOut=()=>{ detachTerms(["NTCA","NTCB"]); S.pan=null; S.panItem=null; S.panPos=null; S.panOn=null; say(t.m.panOut); };
  if(up){
    if(!S.loose){ say(t.m.needLoose,true); return; }
    if(S.pan&&S.panOn==="up"&&S.panPos==="top") panOut();
    else if(S.stack.length){ const m=S.stack.pop(); S.plates[m]++; say(t.m.plateOut); }
    else if(S.pan&&S.panOn==="low") panOut();
    else { if(S.pan&&S.panOn==="up") panOut(); takeHousing(up); }
  } else if(lo){
    if(S.stack.length){ const m=S.stack.pop(); S.plates[m]++; say(t.m.plateOut); }
    else if(S.pan) panOut();
    else takeHousing(lo);
  }
  solve(); drawTray();
}
function takeHousing(c){
  detachTerms(c==="c1"?["C1A","C1B"]:["C2A","C2B"]);
  S.hs[c].at=null; S.hs[c].flip=false; S.loose=false;
  say(d().m.hsOut(d().trayItems[c]));
}
function flipTop(){
  const t=d(), c=topHs();
  if(!c){ say(t.m.flipNone,true); return; }
  if(S.on.box==="cover"){ say(t.m.covered,true); return; }
  if(S.hs[c].at==="up"){
    if(!S.loose){ say(t.m.needLoose,true); return; }
    if(S.pan&&S.panOn==="up"){
      const to=S.panPos==="top"?"gap":"top";
      if(to==="gap"&&S.stack.length){ say(t.m.slotBusy,true); return; }
      S.panPos=to;
    } else if(S.pan&&S.panPos==="top"){ say(t.m.slotBusy,true); return; }
  } else if(S.stack.length||S.pan){ say(t.m.flipEmpty,true); return; }
  S.hs[c].flip=!S.hs[c].flip;
  say(t.m.flipDone(t.trayItems[c],S.hs[c].flip)); solve();
}
$("flipBtn").onclick=flipTop;
function detachTerms(list){
  for(let i=S.cables.length-1;i>=0;i--) if(list.includes(S.cables[i].a)||list.includes(S.cables[i].b)) removeCable(i);
  for(const end of ["tip","gnd"]) if(list.includes(S.probe[end])) S.probe[end]=null;
}
function removeCable(i){ const cb=S.cables[i]; S.stock[cb.type][cb.col]++; S.cables.splice(i,1); drawTray(); }
function returnItem(id){
  const t=d();
  if(id==="fg"){ detachTerms(["FGP","FGN"]); S.on.fg=false; S.fg.pow=false; }
  else if(id==="scope"){ detachTerms(["DCOM","DVO"]); S.probe={tip:null,gnd:null}; S.on.scope=false; S.z.on=false; }
  else if(id==="base"){
    if(S.on.box==="cover"){ say(t.m.covered,true); return; }
    if(lowHs()){ say(t.m.baseBusy,true); return; }
    S.on.base=false;
  }
  else if(id==="box"){
    detachTerms(["R1A","R1B","B1","B2"]);
    for(const k of CAP_KEYS) if(S.cap[k]==="box") S.cap[k]=null;
    S.on.box=null;
  }
  else if(CAPS[id]){ detachTerms([CAPS[id].node+"A",CAPS[id].node+"B"]); S.cap[id]=null; }
  say(t.m.returned(t.trayItems[id])); solve(); drawTray();
}
function onWheel(p,dir,shift){
  const [x,y]=p;
  if(S.on.fg){ const [a,b]=withOff(S.at.fg,()=>faceInv(FG_FACE,x,y)); if(a>=0&&a<=24&&b>=0&&b<=9&&fgWheel(a,b,dir,shift)) return; }
  const [u,v]=INV(x,y);
  S.zoom=Math.max(0.6,Math.min(7,S.zoom*(dir>0?1.15:1/1.15)));
  S.touched=true;
  const k=ppcm();
  S.cam=[u-x/k, v-(CH-y)/k];
}
cv.addEventListener("mousemove",e=>{
  const p=mousePos(e); S.mouse=p;
  if(S.knob){ S.knob(p[1]); return; }
  if(S.view0){ const [x0,y0,a,b]=S.view0, k=ppcm(); S.touched=true; S.cam=[a-(p[0]-x0)/k, b+(p[1]-y0)/k]; }
});
cv.addEventListener("mousedown",e=>{ const p=mousePos(e); S.mouse=p; if(e.button!==0) return; onPress(p); });
window.addEventListener("mouseup",e=>{
  /* a part dragged out of the parts box is put down where it is let go on the bench */
  if(S.trayDrag&&S.carry&&e.target===cv){ const p=mousePos(e); S.mouse=p; place(p[0],p[1]); }
  S.trayDrag=false; S.view0=null; S.knob=null; cv.classList.remove("dragging"); });
cv.addEventListener("contextmenu",e=>{ e.preventDefault(); onRClick(mousePos(e)); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); onWheel(mousePos(e),e.deltaY<0?1:-1,e.shiftKey); },{passive:false});

  const r=cv.getBoundingClientRect(), p=[e.touches[0].clientX-r.left,e.touches[0].clientY-r.top];
  S.mouse=p; onPress(p); },{passive:false});
cv.addEventListener("touchmove",e=>{ if(e.touches.length!==1) return; e.preventDefault();
  const r=cv.getBoundingClientRect(), p=[e.touches[0].clientX-r.left,e.touches[0].clientY-r.top];
  S.mouse=p; if(S.knob){ S.knob(p[1]); return; }
  if(S.view0){ const [x0,y0,a,b]=S.view0, k=ppcm(); S.touched=true; S.cam=[a-(p[0]-x0)/k, b+(p[1]-y0)/k]; } },{passive:false});
cv.addEventListener("touchend",()=>{ S.view0=null; S.knob=null; },{passive:true});

/* ---- instrument controls (same handlers for the bench and the close-ups) ---- */
function fgPress(a,b,where){
  for(const key in FG_CTRL){
    const c=FG_CTRL[key];
    if(Math.hypot(a-c.x,b-c.y)>c.r+0.25) continue;
    if(!c.cont){
      if(key==="range") S.fg.range=(S.fg.range+1)%4;
      else { S.fg.wave=(S.fg.wave+1)%3; if(S.fg.wave!==0) say(d().m.wave,true); }
      solve(); return ()=>{};
    }
    const v0=S.fg[key]; let y0=null;
    return (py)=>{ if(y0===null){ y0=py; return; }
      const sens=key==="fine"?0.0035:0.0025;
      S.fg[key]=Math.max(0,Math.min(1,v0+(y0-py)*sens)); solve(); };
  }
  if(Math.hypot(a-21.2,b-2.9)<1.1||Math.hypot(a-21.2,b-6.3)<1.1){ if(where!=="bench") say(d().m.cableHere); return null; }
  if(where==="panel"&&a>=FG_REAR.rocker[0]&&a<=FG_REAR.rocker[2]&&b>=FG_REAR.rocker[1]&&b<=FG_REAR.rocker[3]){
    if(!S.on.fg){ say(d().m.noFgHere,true); return ()=>{}; }
    S.fg.pow=!S.fg.pow; say(d().m.fgPow(S.fg.pow)); solve(); return ()=>{}; }
  return null;
}
function fgWheel(a,b,dir,shift){
  for(const key in FG_CTRL){
    const c=FG_CTRL[key];
    if(Math.hypot(a-c.x,b-c.y)>c.r+0.25) continue;
    if(c.cont) S.fg[key]=Math.max(0,Math.min(1,S.fg[key]+dir*(shift?0.002:0.01)));
    else if(key==="range") S.fg.range=Math.max(0,Math.min(3,S.fg.range+dir));
    else { S.fg.wave=Math.max(0,Math.min(2,S.fg.wave+dir)); if(S.fg.wave!==0) say(d().m.wave,true); }
    solve(); return true;
  }
  return false;
}
function zoyiPress(a,b){
  for(const id in ZK){
    const [x0,y0,x1,y1]=ZK[id];
    if(a<x0-0.05||a>x1+0.05||b<y0-0.05||b>y1+0.05) continue;
    zoyiKey(id); return true;
  }
  return false;
}
function zoyiKey(id){
  const z=S.z, t=d();
  if(!S.on.scope) return;
  if(id==="POWER"){ z.on=!z.on; z.menu=false; z.hold=false; say(t.m.zoyiPow(z.on)); solve(); return; }
  if(!z.on){ say(t.m.zoyiOff,true); return; }
  if(id==="MODE"){ z.mode=z.mode==="SCOPE"?"DMM":"SCOPE"; z.menu=false; z.hold=false; solve(); return; }
  if(id==="HOLD"){ if(z.tmode==="SINGLE"&&!z.armed){ z.armed=true; z.held=null; return; }
    z.hold=!z.hold; z.held=z.hold?scopeView():null; return; }
  if(z.mode==="DMM"){
    if(id==="F1"){ z.dfn=z.dfn==="ACV"?"DCV":"ACV"; solve(); }
    else if(id==="F2"){ if(z.dfn==="OHM") z.rfn=(z.rfn+1)%4; else { z.dfn="OHM"; z.rfn=0; } solve(); }
    return;
  }
  if(id==="MENU"){ z.menu=!z.menu; return; }
  if(z.menu){
    if(id==="F1") z.menu=false;
    else if(id==="F2"){ z.tmode=z.tmode==="AUTO"?"NORMAL":z.tmode==="NORMAL"?"SINGLE":"AUTO"; z.armed=true; z.held=null; }
    else if(id==="F3") z.edge=-z.edge;
    else if(id==="F4"){ z.probe=z.probe===1?10:1; say(t.m.probeX(z.probe)); }
    return;
  }
  if(id==="F1") z.fsel="VT"; else if(id==="F2") z.fsel="MOVE"; else if(id==="F3") z.fsel="TRIG";
  else if(id==="F4") z.couple=z.couple==="AC"?"DC":"AC";
  else if(id==="AUTO"){
    const s=scopeInput();
    if(s.amp>0){ z.vi=VDIV.length-1; for(let i=0;i<VDIV.length;i++) if(s.amp*z.probe/VDIV[i]<=3.0){ z.vi=i; break; }
      z.ti=TDIV.length-1; for(let i=0;i<TDIV.length;i++) if(TDIV[i]*10>=2.5/s.f){ z.ti=i; break; } }
    z.ypos=0; z.xpos=0; z.trig=0;
  }
  else if(["UP","DOWN","LEFT","RIGHT"].includes(id)){
    const dv=id==="UP"?1:id==="DOWN"?-1:0, dh=id==="RIGHT"?1:id==="LEFT"?-1:0;
    if(z.fsel==="VT"){ z.vi=Math.max(0,Math.min(VDIV.length-1,z.vi+dv)); z.ti=Math.max(0,Math.min(TDIV.length-1,z.ti+dh)); }
    else if(z.fsel==="MOVE"){ z.ypos=Math.max(-4,Math.min(4,z.ypos+0.2*dv)); z.xpos=Math.max(-5,Math.min(5,z.xpos+0.2*dh)); }
    else if(z.fsel==="TRIG"){ z.trig=Math.max(-4,Math.min(4,z.trig+0.2*dv)); }
  }
}
/* close-up canvases */
function panelPos(cvs,e,s){ const r=cvs.getBoundingClientRect(); return [(e.clientX-r.left)/s,(e.clientY-r.top)/s]; }
fgCv.addEventListener("pointerdown",e=>{
  const [a,b]=panelPos(fgCv,e,FGS); const h=fgPress(a-0.4,b-0.4,"panel");
  if(h){ fgCv.setPointerCapture(e.pointerId); S.knob=h; h(e.clientY); }
});
fgCv.addEventListener("pointermove",e=>{ if(S.knob) S.knob(e.clientY); });
fgCv.addEventListener("pointerup",()=>{ S.knob=null; });
fgCv.addEventListener("wheel",e=>{ const [a,b]=panelPos(fgCv,e,FGS);
  if(fgWheel(a-0.4,b-0.4,e.deltaY<0?1:-1,e.shiftKey)) e.preventDefault(); },{passive:false});
zCv.addEventListener("pointerdown",e=>{ const [a,b]=panelPos(zCv,e,ZS); zoyiPress(a-0.5,b-1.3); });

/* ══════════════════════════════════════════════════════════════
   10.  CLOSE-UPS, SECTION, PANEL
   ══════════════════════════════════════════════════════════════ */
function drawFgPanel(){
  const c=fgCtx;
  c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle="#191c21"; c.fillRect(0,0,fgCv.width,fgCv.height);
  c.setTransform(DPR*FGS,0,0,DPR*FGS,DPR*FGS*0.4,DPR*FGS*0.4);
  if(!S.on.fg) c.globalAlpha=0.35;
  drawFgFace(c); drawFgRear(c,9.6);
  c.globalAlpha=1;
  const nums=[[1.35,0.15,"1"],[2.9,6.95,"2"],[6.6,6.95,"3"],[12.05,2.7,"4"],[12.05,6.5,"4"],[14.5,6.95,"5"],[17.2,5.0,"6"],[22.8,4.6,"7"]];
  for(const [x,y,n] of nums){ circ(c,x,y,0.32,"#1b1c1e"); FT(c,n,x,y+0.01,0.36,"#fff","center",true); }
}
function drawZoyiPanel(){
  const c=zCtx;
  c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle="#191c21"; c.fillRect(0,0,zCv.width,zCv.height);
  c.setTransform(DPR*ZS,0,0,DPR*ZS,DPR*ZS*0.5,DPR*ZS*1.3);
  if(!S.on.scope) c.globalAlpha=0.35;
  rr(c,2.4,-1.1,3.6,0.1,0.15,"#b9bdc1","#6f7479",0.04); rr(c,2.6,-1.25,3.4,-0.9,0.1,"#d9dde1");
  FT(c,"BNC",4.4,-0.6,0.3,"#9aa3ab","left");
  drawZoyiFace(c);
  c.globalAlpha=1;
}
function drawXsec(){
  const c=xsCtx, W=XSW, H=XSH, t=d();
  c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  c.fillStyle="#12161b"; c.fillRect(0,0,W,H);
  const s=W/26, ox=W*0.08;
  const X=x=>ox+x*s, Y=y=>H-14-y*s;
  const R=(x0,y0,x1,y1,f,o)=>{ c.fillStyle=f; c.fillRect(X(x0),Y(y1),(x1-x0)*s,(y1-y0)*s); if(o){ c.strokeStyle=o; c.lineWidth=1; c.strokeRect(X(x0)+.5,Y(y1)+.5,(x1-x0)*s-1,(y1-y0)*s-1); } };
  const L=(txt,x,y,col,al)=>{ c.font="11px "+FONT; c.fillStyle=col||"#9aa3ab"; c.textAlign=al||"left"; c.textBaseline="middle"; c.fillText(txt,X(x),Y(y)); };
  $("flipBtn").disabled=!topHs();
  if(!S.on.base){ L("—",8,4,"#69717a","center"); $("secTxt").textContent=""; return; }
  R(0,0,16,0.6,"#3a3d42","#52565c");
  const lo=lowHs(), up=upHs(), hh=2.6, lift=S.loose&&up?0.5:0;
  const housing=(cc,y0,slot)=>{                   /* a housing with its recess facing the gap */
    const inner=S.hs[cc].flip, nearTop=(slot==="up")!==inner;
    R(4,y0,12,y0+hh,"#2c2f34","#52565c");
    const rec=slot==="low"?[y0+hh-0.45,y0+hh]:[y0,y0+0.45];
    R(5,rec[0],11,rec[1],"#12161b");
    const wy=nearTop?y0+hh-0.85:y0+0.55; R(5,wy-0.15,11,wy+0.15,"#e8a2a2");
    R(3.3,wy-0.15,4,wy+0.15,"#d4b050");
    L((cc==="c1"?t.lab.coil1:t.lab.coil2)+(inner?" ("+t.flipped+")":""),12.6,y0+hh/2,"#e8eef2");
  };
  let y=0.6;
  if(lo){ housing(lo,y,"low"); }
  const gy=0.6+hh-0.45;
  let py=gy; const th=0.22, groups=[];
  for(const m of S.stack){ R(6.65,py,9.35,py+th,MAT[m].col,MAT[m].edge); py+=th;
    if(groups.length&&groups[groups.length-1][0]===m) groups[groups.length-1][1]++; else groups.push([m,1]); }
  const uy=0.6+hh+lift;
  if(up) housing(up,uy,"up");
  const pc=S.pan?MAT[S.pan==="AL"?"AL":"SS410"].col:null;
  if(S.pan&&S.panPos==="gap") R(7,S.panOn==="up"?uy:gy,9,(S.panOn==="up"?uy:gy)+th,pc,"#000");
  const topY=(up?uy:0.6)+(lo?hh:0);
  if(S.pan&&S.panPos==="top") R(7,topY,9,topY+th,pc,"#000");
  if(up){ R(4.2,topY,5.6,topY+0.4,"#1a1c1f","#52565c"); R(10.4,topY,11.8,topY+0.4,"#1a1c1f","#52565c"); L(t.lab.clamp,12.9,topY+0.3,"#9aa3ab"); }
  L(t.lab.pins,0.1,7.9,"#d4b050");
  if(S.on.box==="cover"){ c.setLineDash([5,4]); c.strokeStyle="#f2c14e"; c.strokeRect(X(-0.5),Y(9.2),17*s,9.2*s); c.setLineDash([]); }
  const stTxt= S.pan ? t.lab.pan+" — "+t.trayItems[S.panItem].replace(/^\d+\.\s*/,"")+" ("+(S.panPos==="top"?t.up:t.lo)+")"
             : groups.length ? groups.map(([m,n])=>t.mat[m]+" × "+n).join(" + ") : t.lab.empty;
  $("secTxt").textContent=t.secTxt(up?(S.loose?t.lab.loose:t.lab.tight):"—", S.on.box==="cover"?t.lab.covered:t.lab.open, stTxt);
}
function renderStatus(){
  const L=[], t=d();
  if(!S.on.fg&&!S.on.scope&&!S.on.base) L.push([t.stNothing,false]);
  const sol=S.sol;
  if(sol){ const ipk=Math.max(cabs(sol.I1),cabs(sol.I2)); if(ipk>2.0) L.push([t.st.hot,true]); }
  if(S.on.scope&&S.z.on&&S.z.mode==="DMM"){
    const r=S.z.rd;
    if(r.live&&S.z.dfn==="OHM") L.push([t.st.live,true]);
    if(r.band&&S.z.dfn==="ACV") L.push([t.st.band,true]);
  }
  if(S.on.fg&&S.fg.pow&&S.fg.wave!==0) L.push([t.st.wave,true]);
  if(S.pan&&S.on.box!=="cover") L.push([t.st.open,false]);
  if(S.msg&&performance.now()-S.msg.t<9000) L.push(["• "+S.msg.s,S.msg.warn]);
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
/* stopwatch runs on bench time */
function fmtTime(v){ v=Math.max(0,v); const m=Math.floor(v/60), s=v-60*m; return m+":"+s.toFixed(2).padStart(5,"0"); }
function swValue(){ return S.swAcc+(S.swRun?S.t-S.swT0:0); }
$("swBtn").onclick=()=>{ if(S.swRun){ S.swAcc+=S.t-S.swT0; S.swRun=false; } else { S.swT0=S.t; S.swRun=true; } updSwBtn(); };
$("swLap").onclick=()=>{ S.laps.push(swValue()); renderLaps(); };
$("swReset").onclick=()=>{ S.swRun=false; S.swAcc=0; S.swT0=S.t; S.laps=[]; renderLaps(); updSwBtn(); };
function updSwBtn(){ const b=$("swBtn"); b.textContent=S.swRun?d().stop:d().start; b.classList.toggle("run",S.swRun); }
function renderLaps(){ const box=$("laps"); box.innerHTML="";
  for(let i=S.laps.length-1;i>=0;i--){ const el=document.createElement("div"); el.textContent=String(i+1).padStart(2," ")+"   "+fmtTime(S.laps[i]); box.appendChild(el); } }
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of SPEEDS){ const b=document.createElement("button"); b.textContent=s+"×"; if(s===S.speed) b.className="on";
    b.onclick=()=>{ S.speed=s; renderSpeeds(); }; box.appendChild(b); } }
$("fitBtn").onclick=()=>{ S.zoom=1; S.touched=false; fit(); };

/* the displays refresh a few times a second, like the real instrument */
function updateReadings(){
  const z=S.z, now=performance.now();
  if(now-z.rd.t<260) return;
  z.rd.t=now;
  if(!S.on.scope||!z.on) return;
  if(z.mode==="SCOPE"){
    if(z.hold) return;
    if(z.tmode==="SINGLE"&&!z.armed) return;
    const v=scopeView();
    z.rd.wait=v.wait;
    if(v.wait) return;
    if(z.tmode==="SINGLE"&&v.amp>0){ z.armed=false; z.held=v; say(d().m.single); }
    const A=v.amp*z.probe, vd=VDIV[z.vi];
    const clip=A/vd>4.2, shown=Math.min(A,4.2*vd);
    const noisy=x=>Math.max(0,x*(1+0.003*gauss())+0.004*vd*gauss());
    z.rd.vpp=noisy(2*shown); z.rd.vmax=noisy(shown)*(Math.random()<0.06?1+0.15*Math.random():1);
    z.rd.f=A>0.3*vd?v.f*(1+(clip?0.02:0.0008)*gauss()):0;
  }else{
    Object.assign(z.rd,{live:false,band:false,beep:false},dmmReading());
  }
}

$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   12.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let tPrev=performance.now()/1000, ui=0;
function tick(){
  const now=performance.now()/1000;
  const dtr=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const dt=dtr*S.speed;
  S.t+=dt;
  solve();
  if(S.pan&&S.sol){
    const Irms=((S.net.panC1?cabs(S.sol.I1):0)+(S.net.panC2?cabs(S.sol.I2):0))/Math.SQRT2, n=Math.max(1,Math.ceil(dt/0.5));
    for(let i=0;i<n;i++) S.panT=thermalStep(S.pan,S.panT,Irms,freq(),dt/n,S.on.box!=="cover");
  }
  updateReadings();
  if(CW>10) draw();
  drawFgPanel(); drawZoyiPanel();
  $("swLbl").textContent=fmtTime(swValue());
  if(++ui%6===0){ drawXsec(); renderStatus(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
layout(); applyLang(); solve(); requestAnimationFrame(tick);
