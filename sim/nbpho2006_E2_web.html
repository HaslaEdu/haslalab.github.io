<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>

<body>
<script>
/* NBPhO 2006 problem 8 "Optics experiment" on the 3-D bench.  The view through the bottle is ray-traced
   column by column: a ray from the eye at distance L with impact parameter b = R sin i refracts (sin r =
   sin i / n), crosses the water and meets the back wall at the angle θ = 2r − i + asin(R sin i / L) from the
   far point; the scale reading there is drawn.  θ has a maximum, where the image of the scale turns back —
   the ends of the visible arc.  For L → ∞ the arc is 2R·max(2r − i), the official d ≈ 22 mm for R = 31 mm, and
   the rainbow angle is α = d/R ≈ 41°.  n = 1.333. */
var PROGRAM = {
  title: { ko: 'NBPhO 2006 실험 8 — 광학 실험', en: 'NBPhO 2006 Problem 8 — Optics experiment' },
  subtitle: { ko: '장비: 물을 채우고 둘레의 절반에 mm 눈금을 붙인 원통 병(병을 통해 보임), 줄자. 1) 눈금 높이에서 아주 먼 곳(병 지름보다 훨씬 먼)에서 병을 통해 볼 때 한꺼번에 보이는 눈금의 호의 길이를 구하세요. 2) 그 결과로 무지개의 각반지름을 구하세요.',
              en: 'Equipment: a cylindrical bottle filled with water, with a millimetre scale across half of its perimeter (seen through the bottle), and a measuring tape. 1) Find how long an arc of the scale can be seen at once through the bottle from a very distant point (much farther than the bottle\'s diameter) at the height of the scale. 2) From this, find the angular radius of the rainbow.' },
  notes: { ko: [
    '무지개는 물방울에 들어가 안에서 한 번 반사하고 다시 굴절해 나오는 빛으로 생깁니다.',
    '공식 해답: 멀리서 보면 눈금 가운데는 바로 보이고 가장자리는 뒤집혀 보입니다. 뒤집히는 곳이 보이는 눈금의 끝입니다. 가까이서 보면 더 길게 보이므로 여러 L 에서 재어 1/L → 0 으로 외삽하세요 (해답: d ≈ 22 mm, R = 31 mm).',
    '광선의 기하가 무지개와 같아 d/2 = R·α/2, 곧 α = d/R ≈ 41°. 화면은 광선 추적으로 그립니다 (n = 1.333). 눈금이 붙은 자리는 방문할 때마다 조금 다릅니다.'], en: [
    'A rainbow is formed by rays that enter a spherical droplet, reflect once inside and leave after a second refraction.',
    'Official solution: from far away the middle of the scale looks right and the edges reversed; where it turns is the end of the visible part. From nearer it looks longer, so measure at several L and extrapolate 1/L → 0 (the solution: d ≈ 22 mm with R = 31 mm).',
    'The ray geometry is that of the rainbow, d/2 = R·α/2, so α = d/R ≈ 41°. The view is ray-traced (n = 1.333). Where the scale is glued differs a little from visit to visit.'] }
};

var LAB = { L: 60 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 물을 채운 원통 병(뒤쪽 절반에 mm 눈금, 눈금 높이 8–9.5 cm), 눈금 높이에 맞춘 들여다보는 구멍판(스탠드), 병 앞면에서 시작하는 2 m 줄자.',
           en: 'On the desk: the water-filled bottle (a mm scale round its back half, 8–9.5 cm up), a peep sight on a stand at the scale\'s height, and a 2 m tape starting at the bottle\'s front.' },
  howto: { ko: ['구멍판 끌기: 병과의 거리 바꾸기 (줄자를 따라)', '구멍판 클릭: 들여다보기 — 휠로 확대, 빈 곳 끌기로 옮겨 보기', '줄자 클릭: 구멍판 위치 읽기 · 병 클릭: 병을 가까이 (지름 재기)'],
           en: ['Drag the peep sight: change the distance to the bottle (along the tape)', 'Click the sight: look through it — wheel to zoom, drag empty space to pan', 'Click the tape: read the sight\'s position · click the bottle: look closely (measure its diameter)'] },
  notePlaceholder: { ko: '예) 줄자 30 cm (+R): 보이는 눈금 34.0–60.5 mm; 60 cm: …; 120 cm: … → 1/L 그래프', en: 'e.g. tape 30 cm (+R): visible 34.0–60.5 mm; 60 cm: …; 120 cm: … → plot against 1/L' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R = 3.1 * (1 + S.sys('R', 0.02)), n = 1.333, s0 = 47.5 + S.uni('s0', -3, 3), BX = 40, Y0 = 8, Y1 = 9.5, SL = 95;
    var tape = B3.scaleTex(200, { horiz: true, width: 2.6, bg: '#f2d33c', label: 'cm' }), diaRuler = B3.scaleTex(10, { horiz: true, width: 2.2, bg: '#e9eef2', label: 'cm', step: 0.1 });
    var strip = (function () { var c = document.createElement('canvas'); c.width = 1000; c.height = 150; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#fbfbf6'; g.fillRect(0, 0, 1000, 150); g.fillStyle = '#111'; g.font = '700 30px sans-serif'; g.textAlign = 'center';
      for (var m = 0; m <= SL; m++) { var x = m * 10 + 1, h = m % 10 === 0 ? 70 : m % 5 === 0 ? 50 : 32; g.fillRect(x - 1, 0, 2, h); if (m % 10 === 0) g.fillText(String(m), x, 108); }
      return c; })();
    var wall = (function () { var c = document.createElement('canvas'); c.width = 256; c.height = 32; c._static = true; var g = c.getContext('2d');
      g.drawImage(strip, 0, 0, 1000, 150, 0, 0, 256, 32); return c; })();
    var view = document.createElement('canvas'); view.width = 800; view.height = 400; var vg = view.getContext('2d'), key = '';
    function drawView(L) {
      var k = L.toFixed(2); if (k === key) return; key = k;
      var pmax = Math.asin(R / L), span = 2.5 * pmax, pxcm = 800 / (2.5 * R);
      vg.fillStyle = '#2a2d31'; vg.fillRect(0, 0, 800, 400);
      var band0 = 200 - (Y1 - Y0) / 2 * pxcm, bandH = (Y1 - Y0) * pxcm;
      for (var col = 0; col < 800; col++) {
        var psi = ((col + 0.5) / 800 - 0.5) * span, bb = L * Math.sin(psi);
        if (Math.abs(bb) >= R) continue;
        var i = Math.asin(Math.abs(bb) / R), r = Math.asin(Math.sin(i) / n), th = (2 * r - i + Math.abs(psi)) * Math.sign(bb), s = s0 + R * 10 * th;
        var edge = Math.max(0, (i - 1.1) / (Math.PI / 2 - 1.1));
        vg.fillStyle = 'rgb(' + Math.round(150 - 90 * edge) + ',' + Math.round(178 - 100 * edge) + ',' + Math.round(190 - 100 * edge) + ')'; vg.fillRect(col, 0, 1, 400);
        if (s >= 0 && s <= SL + 0.5) { vg.globalAlpha = 1 - 0.7 * edge; vg.drawImage(strip, Math.max(0, Math.min(999, s * 10 + 1)), 0, 1, 150, col, band0, 1, bandH); vg.globalAlpha = 1; }
      }
    }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.4, pitch: 0.4, k: 7.5, tx: 12, ty: 8, tz: 0 },
      views: {
        eye: { yaw: 0, pitch: 0, k: 70, tx: 0, ty: 300, tz: 0, title: { ko: '구멍판으로 본 병', en: 'The bottle through the sight' },
               hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · Esc: back' } },
        tape: { yaw: Math.PI, pitch: 1.3, k: 30, tx: 0, ty: 0, tz: 3, title: { ko: '줄자 (구멍판 쪽)', en: 'The tape (at the sight)' } },
        bottle: { yaw: 0, pitch: 1.2, k: 40, tx: BX, ty: 4, tz: 3, title: { ko: '병', en: 'The bottle' } }
      },
      frame: function (b) {
        var mv = b.moved('eye'); if (mv[0]) LAB.L = Math.max(R + 4, Math.min(190 + R, LAB.L - mv[0]));
        var L = LAB.L, ex = BX - L;
        drawView(L);
        if (b.view === 'eye') { B3.tex3(view, 0, 0, 800, 400, [-2.5 * R / 2 * 1.0 - 0, 300 + 2, 0], [2.5 * R, 0, 0], [0, -2.5 * R / 2, 0]); return; }
        B3.desk(-160, 55, -20, 20);
        /* the bottle: water, glass, the scale round the back half, a cap */
        B3.cyl3('y', 0, 20, BX, 0, R, 'rgba(170,205,220,.55)', { seg: 36, cap: 'rgba(190,220,235,.6)', id: 'm:bottle' });
        for (var q = 0; q < 24; q++) { var a0 = -Math.PI / 2 + q / 24 * Math.PI, a1 = -Math.PI / 2 + (q + 1) / 24 * Math.PI;
          B3.tex3(wall, q / 24 * 256, 0, 256 / 24, 32, [BX + Math.cos(a0) * (R + 0.02), Y1, Math.sin(a0) * (R + 0.02)], [Math.cos(a1) * (R + 0.02) - Math.cos(a0) * (R + 0.02), 0, Math.sin(a1) * (R + 0.02) - Math.sin(a0) * (R + 0.02)], [0, Y0 - Y1, 0]); }
        B3.cyl3('y', 20, 23, BX, 0, 1.3, '#2a6ab0', { seg: 18, cap: '#3a7ac0' });
        B3.tex3(diaRuler, 0, 0, diaRuler.width, diaRuler.height, [BX - R - 1.5, 0.02, R + 0.6], [11, 0, 0], [0, 0, 2.2]);
        /* the tape from the bottle's front towards the sight */
        B3.tex3(tape, 0, 0, tape.width, tape.height, [BX - R + 0.5, 0.02, 4.5], [-201, 0, 0], [0, 0, -2.6], { id: 'c:tape' });
        if (b.clicked('c:tape')) b.go('tape');
        /* the peep sight */
        var EY = (Y0 + Y1) / 2;
        B3.box3(ex - 3, ex + 3, 0, 1, -3, 3, '#3a3f46', { id: 'm:eye', top: '#474c55' });
        B3.cyl3('y', 1, EY - 1.5, ex, 0, 0.4, '#c3c8cd', { seg: 10, id: 'm:eye' });
        B3.box3(ex - 0.15, ex + 0.15, EY - 1.5, EY + 1.5, -1.5, 1.5, '#1b1b1b', { id: 'm:eye' });
        B3.line3([ex + 0.2, EY, 0], [BX - R, EY, 0], 'rgba(255,255,255,.12)', 1);
        b.views.tape.tx = ex;
        LAB.state = { L: L, R: R, s0: s0 };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
