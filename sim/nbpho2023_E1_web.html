<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NBPhO 2023 실험 — 블랙박스 · Black Box · HaslaLab</title>
<meta name="description" content="NBPhO 2023 실험 문제 4 블랙박스를 브라우저에서 실행합니다. 두 단자만 나온 상자를 멀티미터와 스톱워치로 조사해, 단자를 단락했다 풀었을 때의 전압과 열어 두었다 이었을 때의 전류가 시간에 따라 변하는 모양으로 상자 속 전지·저항 2개·축전기의 회로와 값을 구합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="NBPhO 2023 실험 — 블랙박스 · Black Box">
<meta property="og:description" content="NBPhO 2023 실험: 두 단자 블랙박스의 전압·전류 이완으로 전지, 저항 2개, 축전기의 연결과 값 찾기.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }

         ax:"t (s, 스톱워치)", ay:"멀티미터 (mV 또는 µA)", noPts:"아직 찍힌 점이 없습니다 — 스톱워치를 놓고 '적기'를 누르세요",

    st:{none:"부품함에서 블랙박스, 멀티미터, 스톱워치, 도선 묶음을 꺼내 실험대에 놓으세요.", hand:n=>"손에 든 것: "+n, pick:t=>"도선 한쪽을 "+t+"에 꽂았습니다 — 다른 단자를 클릭하세요.",

       unplugFirst:"먼저 거기 꽂힌 도선을 뽑으세요.", unplugAll:"도선을 모두 뽑아야 묶음을 치울 수 있습니다.", needFor:n=>"먼저 "+n+"을(를) 실험대에 놓으세요.", noLeads:"도선이 더 없습니다 (4개).",

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);
const d=()=>T[lang];
/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (V, Ω, F, s)
   Inside the box (the official solution's circuit A): between the two terminals, the battery E in series with R2,
   and side by side with it the capacitor C in series with R1. Seen from the terminals it is a Norton source whose
   current follows the capacitor's voltage Vc; Vc relaxes through R1 towards the terminal voltage.
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const TRUE={
  E:U(3.05,3.25), R1:U(4.6e3,5.3e3), R2:U(8.8e3,9.8e3), C:U(2.2e-3,2.7e-3),
  gain:U(0.997,1.003) };
/* ══════════════════════════════════════════════════════════════
   2.  THE BENCH STATE
   ══════════════════════════════════════════════════════════════ */
const PARTS=["box","dmm","watch","leads"];
/* terminals: the box's red (+) and black posts; the meter's VΩµAmA and COM jacks */
const TERMS=["P","N","V","C"];
const FUNCS=["off","V","uA","mA"];
const RIN={V:1.2e7,uA:103.2,mA:4.2};                 /* the meter's resistance on each function, Ω (the sheet's values) */
const RNG={V:[0.6,6,60],uA:[600e-6,6000e-6],mA:[60e-3,600e-3]};   /* a 6000-count meter's ranges, in V or A */
const ST={ on:new Set(), pos:{}, leads:[], pick:null,
  Vc:TRUE.E*U(0.25,0.9), fn:"off", hold:false, ri:0, disp:null, dispT:0, busy:0,
  sw:{run:false,t:0}, speed:1, t:0 };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
/* nets of joined terminals */
function nets(){ const par={}; const f=a=>{ while(par[a]!==a) a=par[a]=par[par[a]]; return a; }; for(const t of TERMS) par[t]=t;
  for(const [a,b] of ST.leads) par[f(a)]=f(b); return f; }
function lsolve(A,b){ const n=b.length; for(let i=0;i<n;i++){ let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r; [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    for(let r=i+1;r<n;r++){ const k=A[r][i]/A[i][i]; if(!k) continue; for(let c=i;c<n;c++) A[r][c]-=k*A[i][c]; b[r]-=k*b[i]; } }
  const x=new Array(n); for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s-=A[i][c]*x[c]; x[i]=s/A[i][i]; } return x; }
/* the node voltages for the present Vc; the box's black post (or the meter's COM) is the reference */
function solve(){ const f=nets(), gnd=has("box")?f("N"):f("C"), G=[], Is=[];
  if(has("box")){ const p=f("P"), n=f("N"); G.push([p,n,1/TRUE.R1+1/TRUE.R2]); Is.push([n,p,TRUE.E/TRUE.R2+ST.Vc/TRUE.R1]); }
  if(has("dmm")&&ST.fn!=="off") G.push([f("V"),f("C"),1/RIN[ST.fn]]);
  const names=[...new Set([...G.flatMap(e=>[e[0],e[1]]),...Is.flatMap(e=>[e[0],e[1]])])].filter(n=>n!==gnd), idx={};
  names.forEach((n,i)=>idx[n]=i); const N=names.length, A=Array.from({length:N},()=>new Array(N).fill(0)), b=new Array(N).fill(0);
  for(let i=0;i<N;i++) A[i][i]=1e-12;
  for(const [p,q,g] of G){ const i=idx[p], j=idx[q]; if(i!==undefined) A[i][i]+=g; if(j!==undefined) A[j][j]+=g; if(i!==undefined&&j!==undefined){ A[i][j]-=g; A[j][i]-=g; } }
  for(const [p,q,I] of Is){ const i=idx[p], j=idx[q]; if(i!==undefined) b[i]-=I; if(j!==undefined) b[j]+=I; }
  const x=N?lsolve(A,b):[]; const V=n=>n===gnd||idx[n]===undefined?0:x[idx[n]]; return {V,f}; }
/* the capacitor relaxes through R1 towards the terminal voltage */
function stepPhys(dt){ dt*=ST.speed; ST.t+=dt; if(ST.sw.run) ST.sw.t+=dt;
  if(!has("box")) return; const n=Math.max(1,Math.ceil(dt/0.05)), h=dt/n;
  for(let i=0;i<n;i++){ const {V,f}=solve(), vt=V(f("P"))-V(f("N")); ST.Vc+=-(ST.Vc-vt)/(TRUE.R1*TRUE.C)*h; } }
/* what the meter senses: volts across it, or amps through it */
function meterRaw(){ if(!has("dmm")||ST.fn==="off") return null; const {V,f}=solve(), v=V(f("V"))-V(f("C"));
  return (ST.fn==="V"?v:v/RIN[ST.fn])*TRUE.gain; }

/* screen point → world point on the horizontal plane y = h */

  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;

  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;

/* RANGE: the first press holds the present range, each further press steps up a range; AUTO lets it hunt again */
function rangeBtn(){ if(!has("dmm")||ST.fn==="off") return; if(!ST.hold){ ST.hold=true; say("held"); } else { ST.ri=(ST.ri+1)%RNG[ST.fn].length; say("stepped"); } ST.dispT=0; }
function autoBtn(){ if(!has("dmm")||ST.fn==="off") return; ST.hold=false; ST.dispT=0; say("auto"); }
function swStart(){ if(!has("watch")){ say("needFor",itemName("watch")); return; } ST.sw.run=!ST.sw.run; }
function swReset(){ if(!has("watch")) return; ST.sw.run=false; ST.sw.t=0; }
for(const k of FUNCS) $("fn_"+k).onclick=()=>setFn(k);
$("rngBtn").onclick=rangeBtn; $("autoBtn").onclick=autoBtn;
$("swBtn").onclick=swStart; $("swRst").onclick=swReset;
for(const s of [1,4]) $("sp"+s).onclick=()=>{ ST.speed=s; };
const showTxt=()=>{ const s=dmmShow(); if(!s||s==="----") return "—"; return s+(s==="OL"?"":" "+unitNow()); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), c=$("cfg").value.trim(), line=rows+")  "+(c?c+"   ":"")+"t = "+(has("watch")?fmtSW(ST.sw.t):"—")+"   DMM = "+showTxt();
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight;
  const s=dmmShow(); if(has("watch")&&s&&s!=="----"&&s!=="OL"){ const u=unitNow(), v=+s*(u==="V"?1000:u==="mA"?1000:1); PTS.push({t:ST.sw.t,v,tag:(c||"—")+" ("+(ST.fn==="V"?"mV":"µA")+")"}); say("plotted"); }
  else say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; PTS.length=0; };
function saveText(name,txt){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved"); }
$("noteSave").onclick=()=>{ saveText("NBPhO2023_P4_notebook.txt",$("note").value); };
function renderPanel(){ const t=d();
  $("mD").textContent=has("dmm")?(ST.fn==="off"?"OFF":showTxt()+"   "+(ST.hold?"MANU":"AUTO")):"—";
  for(const k of FUNCS) $("fn_"+k).className=ST.fn===k?"on":"";
  $("rngBtn").className=ST.hold?"on":""; $("autoBtn").className=ST.fn!=="off"&&!ST.hold?"on":"";
  $("swD").textContent=has("watch")?fmtSW(ST.sw.t):"—"; $("swBtn").textContent=ST.sw.run?t.swStop:t.swStart;
  for(const s of [1,4]) $("sp"+s).className=ST.speed===s?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(tname(ST.pick)),false]);
  if(ST.speed>1) L.push([t.st.fast(ST.speed),true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-m","hM"],["mHint","mHint"],["rngBtn","rangeB"],["autoBtn","autoB"],
    ["t-h-sw","hSw"],["swRst","swReset"],["lbSp","speedL"],["swHint","swHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"]]) $(id).textContent=t[k];
  for(const k of FUNCS) $("fn_"+k).textContent=t.fnl[k];
  $("cfg").placeholder=t.cfgPh;
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; stepPhys(dt); updDisp(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose(); ++frameN;
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
</body>
</html>
