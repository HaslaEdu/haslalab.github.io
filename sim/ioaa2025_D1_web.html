<meta name="description" content="IOAA 2025(인도 뭄바이) 자료 분석 시험 D01 외계행성 30년과 D02 코로나 질량 방출의 도착 시각 예측을 브라우저에서 풉니다. 시험지의 시선속도 그래프와 통과 광도 곡선 위에 곡선을 그리고 값을 읽고, 모눈종이에 직접 축을 그려 점을 찍고 자로 기울기를 읽습니다. 공학용 계산기와 계산표가 있고, 맞춤 계산은 대신 해주지 않습니다.">

  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .maps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .maps button{margin:0;padding:5px 10px;font-size:12.5px;border-radius:6px;border:1px solid var(--line);background:#1a1d22;color:var(--muted);cursor:pointer}
  .maps button.on{border-color:var(--accent);color:var(--accent)}
  .q{font-size:13.3px;line-height:1.65;color:#d6dde2}
  .q h2{font-size:14px;color:var(--accent);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
  .q .lead{color:#c3cbd2;margin:0 0 8px}
  .q h4{color:#f3d58a;margin:12px 0 4px;font-size:13px}
  .q .part{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:7px 0}
  .q .part b{color:#f3d58a}.q .part .mk{float:right;color:var(--muted);font-size:12px;margin-left:6px}
  .q .eq{font-family:"Cambria Math","Times New Roman",serif;font-size:14px;margin:4px 0 4px 10px;color:#e8eef2}
  .q img{display:block;max-width:100%;background:#fff;border-radius:4px;margin:6px 0}
  .side h2.t{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin:4px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .fld{margin:6px 0;display:grid;grid-template-columns:1fr 128px;gap:6px;align-items:center}.fld label{font-size:12.3px;color:#c3cbd2}
  .fld input,.fld select{width:100%;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:#14171c;color:var(--ink);font:13px ui-monospace,Consolas,monospace}
  .btn{width:100%;margin:8px 0 0;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);font:600 13px inherit;cursor:pointer}
  .btn:hover{border-color:var(--accent)}.btn.on{background:var(--accent);color:#1c2027;border-color:var(--accent)}
  .hint{font-size:11.8px;color:var(--muted);line-height:1.6}
  .sol img{display:block;max-width:100%;border-radius:4px;background:#fff;margin:6px 0 2px}

  .sheet{background:#fbfaf6;border-radius:6px;padding:8px 10px;color:#222;font:600 12px "Segoe UI","Malgun Gothic",sans-serif;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
</style>
</head>
