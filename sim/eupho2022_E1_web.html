<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c2027">
<title>EuPhO 2022 실험 — 조명의 물리 · Physics of Illumination · HaslaLab</title>
<meta name="description" content="EuPhO 2022 실험을 브라우저에서 실행합니다. 백열전구와 LED를 직류 전원으로 켜고, 조도계와 색 필터로 색 온도와 광효율을, 적외선 온도계로 검정·흰 판의 복사 가열을 잽니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="EuPhO 2022 실험 — 조명의 물리 · Physics of Illumination">
<meta property="og:description" content="EuPhO 2022 실험: 조도계, 색 필터, 적외선 온도계로 재는 광원의 물리.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row button{flex:1;text-align:center;min-width:0}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);

  #closeCv{touch-action:none}
  .instr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .instr3 canvas{display:block;width:100%;background:var(--deep);border-radius:6px}
  .ilbl{font-size:12px;color:#f2c14e;font-weight:700;margin:0 0 4px}

  .chklist{font-size:12px;line-height:1.7}
  .chklist div{display:flex;justify-content:space-between;gap:8px;color:#9aa3ab}
  .chklist b{font-weight:600}.chklist .ok{color:#7fd39a}.chklist .no{color:#f0b35a}.chklist .na{color:#5c646d}
button.on{background:#3a3220;border-color:#f2c14e;color:#ffd77a}
  .row button.on{background:#f2c14e;color:#1b1d20;border-color:#f2c14e}

<body>

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="wrap">
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-cap"></h3>
      <canvas id="cv"></canvas>
    </div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <h3 id="t-closecap"></h3>
      <canvas id="closeCv"></canvas>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-t"></h2>
    <div class="row"><button id="sp1">×1</button><button id="sp10">×10</button><button id="sp60">×60</button></div>
    <div class="hint" id="clockV"></div>

    <h2 id="t-h-p"></h2>
    <div class="disp" id="psuV" style="font-size:19px"></div>

    <h2 id="t-h-s"></h2>
    <div class="hint" id="srcV"></div>
    <div class="row"><button id="hm10">−10°</button><button id="hm1">−1°</button><button id="hp1">+1°</button><button id="hp10">+10°</button></div>
    <div class="row"><button id="repBtn"></button></div>

    <h2 id="t-h-m"></h2>
    <div class="disp" id="mV"></div>
    <div class="row"><button id="mPow">⏻</button><button id="mHold">HOLD</button><button id="mUnit">lx / fc</button></div>
    <div class="row"><button id="fN"></button><button id="fR"></button><button id="fG"></button><button id="fB"></button></div>

    <h2 id="t-h-i"></h2>
    <div class="disp" id="irV"></div>
    <div class="row"><select id="irSel" style="flex:1;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;padding:4px"></select></div>
    <div class="row"><button id="irBtn"></button></div>

    <h2 id="t-h-x"></h2>
    <div class="hint" id="selV"></div>
    <div class="row"><button id="rm1">r −1</button><button id="rm01">r −0.1</button><button id="rp01">r +0.1</button><button id="rp1">r +1</button></div>
    <div class="row"><button id="am5">θ −5°</button><button id="am1">θ −1°</button><button id="ap1">θ +1°</button><button id="ap5">θ +5°</button></div>

    <h2 id="t-h-note"></h2>

  </aside>
</div>

  if(!conn){ P.vt=P.on?P.vl:0; P.it=0; P.mode="CV"; return; }
  const [v,i,m]=solve(s,P.vl,P.il);
  if(s==="bulb"&&v>TRUE.bulbBurnV||s==="led"&&(v>TRUE.ledBurnV||i>TRUE.ledBurnI)){ killSource(); P.vt=P.vl; P.it=0; P.mode="CV"; return; }
  P.vt=v; P.it=i; P.mode=m; }

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ return pick3(p[0],p[1])||null; }
let drag=null;
const NEEDS={stand:["mat"],bulb:["stand"],led:["stand"],wires:["stand","psu"],meter:["mat"],black:["mat"],white:["mat"],filters:["meter"],protractor:["stand"]};
function clearK(k){ ST.on.delete(k);
  if(k==="mat"){ for(const x of ["stand","meter","black","white","bulb","led","wires","filters","protractor"]) ST.on.delete(x); ST.plugged=false; }
  if(k==="stand"){ for(const x of ["bulb","led","wires","protractor"]) ST.on.delete(x); ST.plugged=false; }
  if(k==="bulb"||k==="led"||k==="wires"){ if(k==="wires"||!source()){ ST.plugged=false; ST.on.delete("wires"); } }
  if(k==="psu"){ ST.on.delete("wires"); ST.plugged=false; ST.psu.on=false; }
  if(k==="meter"){ ST.on.delete("filters"); ST.meter.on=false; ST.meter.filter=null; }
  if(k==="filters") ST.meter.filter=null;
  if(SEL===k) SEL=null; electrical(); }
function place(k){
  for(const n of NEEDS[k]||[]) if(!has(n)){ say("needFor",itemName(n)); return false; }
  if((k==="bulb"&&has("led"))||(k==="led"&&has("bulb"))){ say("oneModule"); return false; }
  if(k==="wires"&&!source()){ say("needFor",itemName("bulb")); return false; }
  ST.on.add(k);
  if(k==="wires"){ ST.plugged=true; hotPlug(); electrical(); say("plugged"); return true; }
  if(k==="meter"||k==="black"||k==="white") SEL=k;
  electrical(); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item; if(right){ say("back",itemName(k)); hand=null; return; } if(place(k)) hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ clearK(k); say("back",itemName(k)); return; }
  if(k==="psu"){ setTab("psu"); return; } if(k==="meter"||k==="filters"){ setTab("meter"); return; } if(k==="ir"){ setTab("ir"); return; }
  if(k==="mat"||k==="stand"||k==="black"||k==="white"||k==="bulb"||k==="led"||k==="protractor"){ if(k==="black"||k==="white") SEL=k; setTab("mat"); return; }
  say("fixed",itemName(k)); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(90,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
function knobStep(kn,dir){ const P=ST.psu; let s=P.sel; if(!s||s[0]!==(kn==="iK"?"i":"v")) s=kn==="iK"?"i1":"v1";
  P.sel=s; P.selT=performance.now(); const st=STEP[s];
  if(s[0]==="i") P.il=Math.max(0,Math.min(3,Math.round((P.il+dir*st)*1000)/1000)); else P.vl=Math.max(0,Math.min(30,Math.round((P.vl+dir*st)*100)/100));
  electrical(); }
function knobPress(kn){ const P=ST.psu, list=kn==="iK"?SEGI:SEGV; if(P.sel&&P.sel[0]===list[0][0]&&performance.now()-P.selT<4000){ P.sel=list[(list.indexOf(P.sel)+1)%4]; } else P.sel=list[1]; P.selT=performance.now(); say("sel"); }
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const p=clpos(e);
  if(tab==="psu"){ const h=hitAt(p); if(h&&(h.k==="iK"||h.k==="vK")){ if(!ST.psu.on) return; knobStep(h.k,e.deltaY<0?1:-1); } return; }
  if(tab==="mat"){ const v=VW.mat, f=e.deltaY<0?1.15:1/1.15, nz=Math.max(0.6,Math.min(10,v.z*f)), g=nz/v.z; v.px=p[0]-CLW/2-(p[0]-CLW/2-v.px)*g; v.py=p[1]-CLH/2-(p[1]-CLH/2-v.py)*g; v.z=nz; } },{passive:false});
closeCv.addEventListener("dblclick",()=>{ if(tab==="mat"){ VW.mat.z=1; VW.mat.px=0; VW.mat.py=0; } });
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const p=cmouse;
  if(cdrag.k==="pan"){ VW.mat.px=cdrag.v[0]+p[0]-cdrag.p[0]; VW.mat.py=cdrag.v[1]+p[1]-cdrag.p[1]; return; }
  if(cdrag.k==="item"){ const v=V(); let x=v.ix(p[0])-cdrag.off[0], y=v.iy(p[1])-cdrag.off[1]; x=Math.max(MAT.x0+2,Math.min(MAT.x0+MAT.w-2,x)); y=Math.max(MAT.y0+2,Math.min(MAT.y0+MAT.h-2,y));
    const r=Math.max(2.5,Math.hypot(x-O[0],y-O[1])), a=Math.atan2(y-O[1],x-O[0])*180/Math.PI; ST.pos[cdrag.key]={r:Math.round(r*10)/10,a:Math.round(a*2)/2}; return; }
  if(cdrag.k==="knob"){ const dy=p[1]-cdrag.y; if(Math.abs(dy)>=12){ knobStep(cdrag.kn,dy<0?1:-1); cdrag.y=p[1]; cdrag.moved=true; } return; } });
closeCv.addEventListener("pointerup",()=>{ if(cdrag&&cdrag.k==="knob"&&!cdrag.moved) knobPress(cdrag.kn); cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); closeCv.setPointerCapture(e.pointerId); if(e.button!==0) return;
  if(tab==="mat"){ for(const key of ["meter","black","white"]){ if(MP[key]&&pointIn(MP[key],p[0],p[1])){ SEL=key; const v=V(), c=posXY(key); cdrag={k:"item",key,off:[v.ix(p[0])-c[0],v.iy(p[1])-c[1]]}; return; } }
    cdrag={k:"pan",p,v:[VW.mat.px,VW.mat.py]}; return; }
  if(!h) return;
  if(tab==="psu"){ if(h.k==="pwr"){ ST.psu.on=!ST.psu.on; if(ST.psu.on){ hotPlug(); } electrical(); say(ST.psu.on?"psuOn":"psuOff"); return; }
    if(h.k==="iK"||h.k==="vK"){ if(!ST.psu.on) return; cdrag={k:"knob",kn:h.k,y:p[1],moved:false}; return; }
    if(h.k==="plus"||h.k==="minus"){ if(ST.plugged){ ST.plugged=false; ST.on.delete("wires"); electrical(); say("unplugged"); } else { if(!has("stand")||!source()){ say("needFor",itemName(source()?"stand":"bulb")); return; } ST.on.add("wires"); ST.plugged=true; hotPlug(); electrical(); say("plugged"); } return; } return; }
  if(tab==="meter"){ meterBtn(h.k); return; }
  if(tab==="ir"&&h.k==="trig"){ irPull(); return; } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function meterBtn(k){ if(!need("meter")) return; const m=ST.meter; m.touch=ST.simT;
  if(k==="mPow"){ m.on=!m.on; m.hold=false; m.dispT=0; say(m.on?"mOn":"mOff"); return; } if(!m.on) return;
  if(k==="mHold"){ if(m.hold) m.hold=false; else { m.held=meterRaw(); m.hold=true; } m.dispT=0; return; }
  if(k==="mUnit"){ m.unit=m.unit==="lx"?"fc":"lx"; m.dispT=0; } }
for(const id of ["mPow","mHold","mUnit"]) $(id).onclick=()=>meterBtn(id);
for(const [id,f] of [["fN",null],["fR",0],["fG",1],["fB",2]]) $(id).onclick=()=>{ if(f!==null&&!need("filters")) return; if(!need("meter")) return; ST.meter.filter=f; ST.meter.dispT=0; say("filt"); };
function irPull(){ if(!need("ir")) return; if(ST.ir.busy) return; ST.ir.busy=true; setTimeout(()=>{ irTrigger(); ST.ir.busy=false; say("trig"); },550); }
$("irBtn").onclick=irPull;
const irs=$("irSel"); irs.onchange=()=>{ ST.ir.target=irs.value||null; };
for(const [id,s] of [["sp1",1],["sp10",10],["sp60",60]]) $(id).onclick=()=>{ ST.speed=s; say("speed",s); };
for(const [id,dv] of [["hm10",-10],["hm1",-1],["hp1",1],["hp10",10]]) $(id).onclick=()=>{ if(!need("stand")) return; ST.head=Math.max(-100,Math.min(100,ST.head+dv)); };
$("repBtn").onclick=()=>{ const s=source(); if(s&&ST.dead[s]&&ST.spare[s]>0){ ST.spare[s]--; ST.dead[s]=false; electrical(); say("replaced"); } else say("noSpare"); };
function nudge(dr,da){ if(!SEL||!has(SEL)) return; const p=ST.pos[SEL]; let r=Math.max(2.5,Math.round((p.r+dr)*10)/10), a=p.a+da;
  const x=O[0]+r*Math.cos(a*Math.PI/180), y=O[1]+r*Math.sin(a*Math.PI/180); if(x<MAT.x0+2||x>MAT.x0+MAT.w-2||y<MAT.y0+2||y>MAT.y0+MAT.h-2) return; ST.pos[SEL]={r,a}; }
for(const [id,dr,da] of [["rm1",-1,0],["rm01",-0.1,0],["rp01",0.1,0],["rp1",1,0],["am5",0,-5],["am1",0,-1],["ap1",0,1],["ap5",0,5]]) $(id).onclick=()=>nudge(dr,da);
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
const mmss=t=>{ const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); };
function renderPanel(){ const t=d();
  for(const [id,s] of [["sp1",1],["sp10",10],["sp60",60]]) $(id).className=ST.speed===s?"on":"";
  $("clockV").textContent=t.clock(mmss(ST.simT),ST.speed);
  const sh=has("psu")?psuShow():null; $("psuV").textContent=!has("psu")?"—":!sh?"OFF":sh.I+" A   "+sh.V+" V  "+sh.mode;
  const s=source(); $("srcV").textContent=t.src(s,s&&ST.dead[s],s?ST.spare[s]:0);
  const ms=meterShow(); $("mV").textContent=!has("meter")?"—":ST.meter.on?(ms+" "+ST.meter.unit+(ST.meter.hold?"  H":"")):"OFF";
  for(const [id,f] of [["fN",null],["fR",0],["fG",1],["fB",2]]) $(id).className=ST.meter.filter===f?"on":"";
  $("irV").textContent=has("ir")?irShow()+" °C":"—"; if(irs.value!==(ST.ir.target||"")) irs.value=ST.ir.target||"";
  if(SEL&&has(SEL)){ const p=ST.pos[SEL]; $("selV").textContent=t.selV(SEL==="meter"?t.lab.meterN:SEL==="black"?t.lab.blackN:t.lab.whiteN,p.r.toFixed(1),p.a.toFixed(1)); } else $("selV").textContent=t.selNone; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(srcDead()) L.push([t.st.dead,true]);
  if(has("meter")&&!ST.meter.on) L.push([t.st.meterOff,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-t","hT"],["t-h-p","hP"],["t-h-s","hS"],["repBtn","rep"],["t-h-m","hM"],["fN","fN"],["fR","fR"],["fG","fG"],["fB","fB"],["t-h-i","hI"],["irBtn","irBtn"],["t-h-x","hX"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  irs.innerHTML=""; const o0=document.createElement("option"); o0.value=""; o0.textContent="—"; irs.appendChild(o0);
  for(const k of ["black","blackB","white","whiteB","mat","lamp"]){ const o=document.createElement("option"); o.value=k; o.textContent=t.irT[k]; irs.appendChild(o); }
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; advance(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
