<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}

  g.fillText("☰  " + (ST.app === "tone" ? "Tone Detector" : "Spectrum Analyzer"), 14, 30); g.font = "11px Arial"; g.fillStyle = "#9aa3ab"; g.fillText("Physics Toolbox", W - 100, 30);
  /* the two tabs at the bottom */
  [["tone", "Tone"], ["spec", "Spectrum"]].forEach(([k, t], i) => { g.fillStyle = ST.app === k ? "#3a7bd5" : "#20262c"; g.fillRect(i * W / 2, H - 52, W / 2, 52); g.fillStyle = "#e8eef2"; g.font = "bold 15px Arial"; g.textAlign = "center"; g.fillText(t, i * W / 2 + W / 4, H - 26); });
  if (ST.app === "tone"){ const f = ST.toneShow; g.textAlign = "center"; g.fillStyle = "#9aa3ab"; g.font = "15px Arial"; g.fillText("Frequency", W / 2, 120);
    g.fillStyle = "#7df08f"; g.font = "bold 56px Arial"; g.fillText(f ? f.toFixed(1) : "—", W / 2, 185); g.font = "20px Arial"; g.fillStyle = "#e8eef2"; g.fillText("Hz", W / 2, 230);
    g.fillStyle = "#9aa3ab"; g.font = "15px Arial"; g.fillText("Note", W / 2, 290); g.fillStyle = "#e8eef2"; g.font = "bold 40px Arial"; g.fillText(f ? noteOf(f) : "—", W / 2, 335);
    const x0 = 20, y0 = 400, w = W - 40, h = 220; g.strokeStyle = "#33404a"; g.strokeRect(x0, y0, w, h); g.strokeStyle = "#7df08f"; g.lineWidth = 2; g.beginPath();
    toneHist.forEach((v, i) => { const x = x0 + i / 59 * w, y = y0 + h - Math.min(1, Math.log10(v / 50) / Math.log10(40)) * h; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.lineWidth = 1;
    g.fillStyle = "#6b7680"; g.font = "11px Arial"; g.textAlign = "left"; g.fillText("2000 Hz", x0 + 4, y0 + 12); g.fillText("50 Hz", x0 + 4, y0 + h - 6); }
  else { const FM = ST.fmax, x0 = 44, y0 = 80, w = W - 60, h = 470, X = f => x0 + f / FM * w, Y = d => y0 + (-(d) - 20) / 80 * h;
    g.strokeStyle = "#26323a"; g.lineWidth = 1; g.textAlign = "right"; g.fillStyle = "#6b7680"; g.font = "11px Arial";
    for (let d = -20; d >= -100; d -= 20){ g.beginPath(); g.moveTo(x0, Y(d)); g.lineTo(x0 + w, Y(d)); g.stroke(); g.fillText(d + "", x0 - 4, Y(d) + 4); }
    g.textAlign = "center"; for (let f = 0; f <= FM; f += FM / 8){ g.beginPath(); g.moveTo(X(f), y0); g.lineTo(X(f), y0 + h); g.stroke(); if (f % (FM / 4) === 0) g.fillText(f + "", X(f), y0 + h + 16); }
    g.fillText("Hz", x0 + w - 10, y0 + h + 30); g.save(); g.translate(14, y0 + h / 2); g.rotate(-Math.PI / 2); g.fillText("dB", 0, 0); g.restore();
    g.strokeStyle = "#5ab0ff"; g.lineWidth = 1.5; g.beginPath(); for (let i = 1; i < NB && i * BINW <= FM; i++){ const x = X(i * BINW), y = Math.min(y0 + h, Math.max(y0, Y(SPEC[i]))); i > 1 ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.lineWidth = 1;
    const cx = X(ST.cursor); g.strokeStyle = "#f2c14e"; g.beginPath(); g.moveTo(cx, y0); g.lineTo(cx, y0 + h); g.stroke();
    const bi = Math.max(1, Math.min(NB - 1, Math.round(ST.cursor / BINW))); g.fillStyle = "#f2c14e"; g.font = "bold 15px Arial"; g.textAlign = "left";
    g.fillText((bi * BINW).toFixed(1) + " Hz   " + SPEC[bi].toFixed(1) + " dB", x0, y0 + h + 52);
    g.fillStyle = ST.hold ? "#c8262b" : "#20262c"; g.fillRect(W - 100, y0 + h + 66, 84, 34); g.fillStyle = "#e8eef2"; g.font = "bold 14px Arial"; g.textAlign = "center"; g.fillText(ST.hold ? "Live" : "Hold", W - 58, y0 + h + 84);
    g.fillStyle = "#26323a"; g.fillRect(16, y0 + h + 66, 34, 34); g.fillRect(56, y0 + h + 66, 34, 34); g.fillStyle = "#e8eef2"; g.fillText("◀", 33, y0 + h + 84); g.fillText("▶", 73, y0 + h + 84); g.fillStyle = "#26323a"; g.fillRect(W - 196, y0 + h + 66, 88, 34); g.fillStyle = "#e8eef2"; g.fillText("0–" + FM + " Hz", W - 152, y0 + h + 84); }
  return PHONEC; }
/* where on the phone's screen a point is (for clicks in the phone view) */
let PHONE_RECT = null;
function phoneClick(px, py, drag){ const W = PHONEC.width, H = PHONEC.height; if (py > H - 52){ ST.app = px < W / 2 ? "tone" : "spec"; return; }
  if (ST.app === "spec"){ const x0 = 44, w = W - 60, y0 = 80, h = 470;
    if (!drag && py > y0 + h + 66 && py < y0 + h + 100){ if (px > W - 100) ST.hold = !ST.hold; else if (px > W - 196 && px < W - 108){ ST.fmax = ST.fmax === 2000 ? 1000 : ST.fmax === 1000 ? 500 : 2000; ST.cursor = Math.min(ST.cursor, ST.fmax); } else if (px > 16 && px < 50) ST.cursor = Math.max(0, ST.cursor - BINW); else if (px > 56 && px < 90) ST.cursor = Math.min(2000, ST.cursor + BINW); return; }
    if (py > y0 && py < y0 + h) ST.cursor = Math.max(0, Math.min(ST.fmax, (px - x0) / w * ST.fmax)); } }

/* ---- the sound you hear (WebAudio) --------------------------------------- */
let AC = null, AU = null;
function audioInit(){ if (AC || !ST.sound) return; try { AC = new (window.AudioContext || window.webkitAudioContext)();
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(), g1 = AC.createGain(), g2 = AC.createGain(), master = AC.createGain();
  const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true; const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8; const gn = AC.createGain();
  o1.connect(g1); o2.connect(g2); ns.connect(bp); bp.connect(gn); g1.connect(master); g2.connect(master); gn.connect(master); master.connect(AC.destination);
  g1.gain.value = 0; g2.gain.value = 0; gn.gain.value = 0; master.gain.value = 0.25; o1.start(); o2.start(); ns.start(); AU = {o1, o2, g1, g2, gn, bp, master}; } catch (e) { AC = null; } }
function audioUpdate(){ if (!AU) return; const s = soundNow(), t = AC.currentTime, on = ST.sound ? 1 : 0;
  const p0 = s.peaks[0] || [200, 0], p1 = s.peaks[1] || [400, 0];
  AU.o1.frequency.setTargetAtTime(p0[0], t, 0.02); AU.o2.frequency.setTargetAtTime(p1[0], t, 0.02);
  AU.g1.gain.setTargetAtTime(on * 0.5 * p0[1], t, 0.03); AU.g2.gain.setTargetAtTime(on * 0.5 * p1[1], t, 0.03);
  AU.bp.frequency.setTargetAtTime(Math.max(300, (s.f || 600) * 3), t, 0.05); AU.gn.gain.setTargetAtTime(on * 0.35 * s.noise, t, 0.03); }

/* ---- views ------------------------------------------------------------------- */
function layout3(){
  const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1.5), 2), w = cv3.parentElement.clientWidth || 900;
  const h = Math.max(440, Math.min(Math.round(w * 0.62), Math.round(window.innerHeight * 0.78)));
  cv3.style.width = w + "px"; cv3.style.height = h + "px"; cv3.width = Math.round(w * dpr); cv3.height = Math.round(h * dpr);
  const first = !CAM0.k; CAM.W = w; CAM.H = h; CAM.dpr = dpr;
  if (first){ Object.assign(CAM, {k:w / 62, tx:3, ty:8, tz:0, yaw:-0.3, pitch:0.42, px:0, py:0}); camSave(); } }
const VIEWS = ["3d", "phone", "cup"];
function showView(v){ view3 = v; for (const k of VIEWS) document.getElementById("vt" + k).className = k === v ? "on" : ""; document.getElementById("t-cap3").textContent = tr("cap_" + v); }
for (const k of VIEWS) document.getElementById("vt" + k).onclick = () => showView(k);
function drawPhone(c, W, H){ c.fillStyle = "#c8a87e"; c.fillRect(0, 0, W, H); const s = Math.min((H - 40) / (PHONEC.height + 60), (W - 40) / (PHONEC.width + 40)), pw = (PHONEC.width + 30) * s, ph = (PHONEC.height + 60) * s, x = W / 2 - pw / 2, y = H / 2 - ph / 2;
  c.fillStyle = "#1d1f22"; c.beginPath(); c.roundRect ? c.roundRect(x, y, pw, ph, 24 * s) : c.rect(x, y, pw, ph); c.fill();
  const sx = x + 15 * s, sy = y + 30 * s; c.drawImage(phoneTex(), sx, sy, PHONEC.width * s, PHONEC.height * s); PHONE_RECT = {x:sx, y:sy, s}; }
function drawCupView(c, W, H){ c.fillStyle = "#3a3d42"; c.fillRect(0, 0, W, H); const k = Math.min((H - 60) / 8, W / 12), cx = W / 2, by = H - 30, r = CUP_R * k, hh = CUP_H * k, ri = (CUP_R - 0.1) * k;
  c.fillStyle = "#c8a87e"; c.fillRect(0, by, W, H - by);
  const lv = (0.25 + ST.cup / (Math.PI * (CUP_R - 0.1) * (CUP_R - 0.1))) * k; if (ST.cup > 0.3){ c.fillStyle = "rgba(120,170,215,0.6)"; c.fillRect(cx - ri, by - lv, 2 * ri, lv - 0.25 * k); c.fillStyle = "rgba(160,200,235,0.9)"; c.fillRect(cx - ri, by - lv - 1, 2 * ri, 3); }
  c.strokeStyle = "rgba(230,238,242,0.9)"; c.lineWidth = 3; c.beginPath(); c.moveTo(cx - r, by - hh); c.lineTo(cx - r, by); c.lineTo(cx + r, by); c.lineTo(cx + r, by - hh); c.stroke();
  c.fillStyle = "#c8262b"; c.font = "bold " + Math.round(0.42 * k) + "px Arial"; c.textAlign = "left"; c.textBaseline = "middle";
  for (let ml = 5; ml <= 100; ml += 5){ const y = by - (0.25 + ml / (Math.PI * (CUP_R - 0.1) * (CUP_R - 0.1))) * k, len = ml % 10 ? 0.35 * k : ml % 50 ? 0.6 * k : 0.9 * k;
    c.fillRect(cx - r * 0.2, y - 1, len, 2); if (ml % 10 === 0) c.fillText(ml + " ml", cx - r * 0.2 + len + 6, y); } }
let down3 = null, m3 = [0, 0], FLASH = {msg:"", t:0};
function flash(m){ FLASH = {msg:m, t:performance.now()}; }
const p3e = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => e.preventDefault());
function pourCup(){ if (ST.cup < 0.5) return; const keep = Math.min(ST.cup, 0.8 + 0.6 * RNG()), go = ST.cup - keep; ST.cup = keep; ST.V += go; if (ST.V > V_BRIM){ ST.V = V_BRIM; flash(tr("overflow")); } }
cv3.addEventListener("pointerdown", e => { const p = p3e(e); m3 = p; audioInit();
  if (e.button === 2 || e.button === 1){ e.preventDefault(); cv3.setPointerCapture(e.pointerId); down3 = {p, moved:false, shift:true, btn:e.button}; return; }
  if (e.button) return; cv3.setPointerCapture(e.pointerId);
  if (view3 === "phone"){ if (PHONE_RECT){ const q = [(p[0] - PHONE_RECT.x) / PHONE_RECT.s, (p[1] - PHONE_RECT.y) / PHONE_RECT.s]; phoneClick(q[0], q[1], false); down3 = {p, moved:false, phone:true}; } return; }
  if (view3 === "cup") return;
  const id = pick3(p[0], p[1]);
  if (id === "jug"){ ST.filling = true; down3 = {p, moved:false, hold:"fill"}; return; }
  if (id === "mouth" || id === "bottle"){ ST.blowing = true; down3 = {p, moved:false, hold:"blow"}; return; }
  down3 = {p, id, moved:false, shift:e.shiftKey}; });
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0] - down3.p[0], p[1] - down3.p[1]) > 3) down3.moved = true; if (!down3.moved || down3.hold) return;
  if (down3.phone){ const q = [(p[0] - PHONE_RECT.x) / PHONE_RECT.s, (p[1] - PHONE_RECT.y) / PHONE_RECT.s]; phoneClick(q[0], q[1], true); return; }
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.02, CAM.pitch + dy * 0.006)); } cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", e => { cv3.classList.remove("grabbing"); ST.filling = false; ST.blowing = blowKey || blowBtn;
  if (down3 && down3.btn){ const d = down3; down3 = null; if (!d.moved && d.btn === 2 && view3 !== "3d") showView("3d"); return; }
  if (down3 && !down3.moved && !down3.hold && !down3.phone && view3 === "3d"){ const id = down3.id; if (id === "cup") pourCup(); else if (id === "phone") showView("phone"); }
  down3 = null; });
cv3.addEventListener("wheel", e => { e.preventDefault(); if (view3 !== "3d") return; const p = p3e(e), s = e.deltaY < 0 ? 1 : -1, f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(400, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive:false});
let blowKey = false, blowBtn = false;
window.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); audioInit(); blowKey = true; ST.blowing = true; } });
window.addEventListener("keyup", e => { if (e.code === "Space"){ blowKey = false; ST.blowing = blowBtn; } });

/* ---- panel -------------------------------------------------------------------- */
const bBlow = document.getElementById("bBlow"), rStr = document.getElementById("rStr"), bSound = document.getElementById("bSound");
const holdBtn = (b, on, off) => { b.addEventListener("pointerdown", e => { audioInit(); on(); b.setPointerCapture(e.pointerId); }); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); };
holdBtn(bBlow, () => { blowBtn = true; ST.blowing = true; }, () => { blowBtn = false; ST.blowing = blowKey; });
holdBtn(document.getElementById("bFill"), () => { ST.filling = true; }, () => { ST.filling = false; });
document.getElementById("bPour").onclick = pourCup;
document.getElementById("bDump").onclick = () => { ST.cup = 0; };
document.getElementById("bEmpty").onclick = () => { ST.V = Math.min(ST.V, 1.5 + RNG() * 2); };
rStr.oninput = () => { ST.strength = +rStr.value / 100; };
bSound.onclick = () => { ST.sound = !ST.sound; if (ST.sound) audioInit(); };
function panel(){ bBlow.className = ST.blowing ? "on" : ""; bSound.textContent = ST.sound ? tr("sound") : tr("soundOff"); bSound.className = ST.sound ? "on" : "";
  document.getElementById("lbStr").textContent = tr("strength") + ": " + Math.round(ST.strength * 100) + " %";
  const w = []; if (FLASH.msg && performance.now() - FLASH.t < 5000) w.push(FLASH.msg); if (ST.blowing && !helmholtz(ST.V)) w.push(tr("waterNeck"));
  if (ST.spilled > 0.5 && ST.filling) w.push(tr("cupOver"));
  const html = w.map(s => '<div class="w">' + s + "</div>").join(""); const el = document.getElementById("wwarn"); if (el._h !== html){ el.innerHTML = html; el._h = html; } }
let lastT = performance.now(), lastTone = 0;
function draw3(){ const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (view3 === "phone") return drawPhone(ctx3, CAM.W, CAM.H); if (view3 === "cup") return drawCupView(ctx3, CAM.W, CAM.H);
  const g = ctx3.createLinearGradient(0, 0, 0, CAM.H); g.addColorStop(0, "#2a3038"); g.addColorStop(1, "#1b1f25"); ctx3.fillStyle = g; ctx3.fillRect(0, 0, CAM.W, CAM.H);
  begin3(); scene3(); render3(ctx3); }
(function loop(){ try { const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; ST.t += dt; step(dt); updateSpectrum(dt);
    if (now - lastTone > 150){ lastTone = now; updateTone(); } audioUpdate(); draw3(); panel(); } catch (err) { console.error(err); } requestAnimationFrame(loop); })();
function applyLang(){ document.documentElement.lang = LANG;
  document.title = LANG === "ko" ? "NBPhO 2020 P5 — 병의 소리 · HaslaLab" : "NBPhO 2020 P5 — Bottle's Sound · HaslaLab";
  document.getElementById("h1").textContent = tr("title"); document.getElementById("sub").textContent = tr("sub");
  for (const k of VIEWS) document.getElementById("vt" + k).textContent = tr("vt" + k); document.getElementById("t-cap3").textContent = tr("cap_" + view3);
  document.getElementById("lgCtl").textContent = tr("lgCtl"); document.getElementById("lgNotes").textContent = tr("lgNotes"); document.getElementById("txNotes").textContent = tr("notes");
  bBlow.textContent = tr("blow"); document.getElementById("bFill").textContent = tr("fill"); document.getElementById("bPour").textContent = tr("pour"); document.getElementById("bDump").textContent = tr("dump"); document.getElementById("bEmpty").textContent = tr("emptyB");
  document.getElementById("t-tray").textContent = tr("tray"); drawItems();
  document.getElementById("btn-en").className = LANG === "en" ? "on" : ""; document.getElementById("btn-ko").className = LANG === "ko" ? "on" : ""; }

document.getElementById("btn-ko").addEventListener("click", () => { LANG = "ko"; applyLang(); });
document.getElementById("btn-en").addEventListener("click", () => { LANG = "en"; applyLang(); });
window.addEventListener("resize", layout3);
layout3(); applyLang(); showView("3d");
