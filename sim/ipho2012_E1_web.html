<title>IPhO 2012 E1 — 물의 자기 투자율 · The Magnetic Permeability of Water · HaslaLab</title>
<meta name="description" content="IPhO 2012 실험 1을 브라우저에서 실행합니다. 네오디뮴 자석 위 1 mm 물층에서 반사된 레이저를 모눈종이 스크린에 비추고, 디지털 캘리퍼로 레이저를 옮기며 점의 높이를 읽어 수면의 모양과 물의 자기 감수율을 구합니다. 계산은 대신 해주지 않습니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IPhO 2012 E1 — 물의 자기 투자율 · The Magnetic Permeability of Water">
<meta property="og:description" content="IPhO 2012 실험 1을 브라우저에서 실행합니다. 자석 위 물 표면에서 반사된 레이저 점의 높이를 캘리퍼 위치에 따라 재어 물이 반자성임을 확인합니다.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}

/* ══════════════════════════════════════════════════════════════
   1.  THE MAGNET AND THE WATER SURFACE ABOVE IT  (SI inside, mm outside)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{ const u=Math.max(1e-12,Math.random()), v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const MU0=4e-7*Math.PI, RHO=1000, GACC=9.8, GAMMA_W=0.0728;
/* complete elliptic integrals K(m), E(m) by the arithmetic-geometric mean */
function ellipKE(m){ m=Math.min(1-1e-15,Math.max(0,m)); let a=1, b=Math.sqrt(1-m), c=Math.sqrt(m), s=0.5*c*c, p=1;
  for(let i=0;i<40&&Math.abs(c)>1e-17;i++){ const a2=0.5*(a+b), b2=Math.sqrt(a*b); c=0.5*(a-b); a=a2; b=b2; p*=2; s+=p*0.5*c*c; }
  const K=0.5*Math.PI/a; return [K,K*(1-s)]; }
/* (Br, Bz) of a circular current loop of radius a, unit current, at (r, zeta) */
function loopField(a,r,z){
  if(r<1e-12){ const dd=a*a+z*z; return [0,MU0*a*a/(2*dd*Math.sqrt(dd))]; }
  const s=(a+r)**2+z*z, dd=(a-r)**2+z*z, [K,E]=ellipKE(4*a*r/s), rs=Math.sqrt(s);
  return [MU0/(2*Math.PI)*z/(r*rs)*(-K+(a*a+r*r+z*z)/dd*E), MU0/(2*Math.PI)/rs*(K+(a*a-r*r-z*z)/dd*E)]; }
function gaussLegendre(n){ const xs=[], ws=[];
  for(let i=1;i<=n;i++){ let x=Math.cos(Math.PI*(i-0.25)/(n+0.5)), dp=1;
    for(let it=0;it<100;it++){ let p0=1, p1=x; for(let k=2;k<=n;k++){ const p2=((2*k-1)*x*p1-(k-1)*p0)/k; p0=p1; p1=p2; } dp=n*(x*p1-p0)/(x*x-1); const dx=-p1/dp; x+=dx; if(Math.abs(dx)<1e-15) break; }
    xs.push(x); ws.push(2/((1-x*x)*dp*dp)); }
  return [xs,ws]; }
const [GX,GW]=gaussLegendre(8);
/* an axially magnetised cylinder (flat top face at z = 0) as an equivalent solenoid */
function Magnet(R,L,Br){
  const K=Br/MU0, edges=[0,-0.05e-3,-0.15e-3,-0.5e-3,-1.5e-3,-4e-3,-10e-3].filter(e=>e>-L); edges.push(-L);
  const nodes=[]; for(let i=0;i<edges.length-1;i++){ const z1=edges[i], z2=edges[i+1], hm=0.5*(z2-z1), hc=0.5*(z1+z2); for(let j=0;j<8;j++) nodes.push([hc+hm*GX[j],Math.abs(hm)*GW[j]*K]); }
  return { R, L, Br,
    bmag(r,z){ let br=0, bz=0; for(const [zp,w] of nodes){ const [a,b]=loopField(R,r,z-zp); br+=a*w; bz+=b*w; } return Math.hypot(br,bz); },
    bzAxis(z){ const r2=R*R; return 0.5*Br*((z+L)/Math.sqrt((z+L)**2+r2)-z/Math.sqrt(z*z+r2)); } };
}
/* the free surface:  rho g eta − gamma ∇²eta = chi B² / 2 mu0  (radial grid, Thomas algorithm) */
function solveSurface(mag,depth,chi,gamma){
  const dr=0.00025, rmax=0.070, n=Math.floor(rmax/dr)+1, b2=new Float64Array(n), db2=new Float64Array(n); let eta=new Float64Array(n);
  for(let i=0;i<n;i++){ const r=i*dr, b1=mag.bmag(r,depth), bh=mag.bmag(r,depth+20e-6); b2[i]=b1*b1; db2[i]=(bh*bh-b1*b1)/20e-6; }
  const rg=RHO*GACC, dr2=dr*dr;
  for(let it=0;it<4;it++){
    const a=new Float64Array(n), b=new Float64Array(n), c=new Float64Array(n), rhs=new Float64Array(n);
    for(let i=0;i<n;i++) rhs[i]=chi*(b2[i]+db2[i]*eta[i])/(2*MU0);
    b[0]=rg+gamma*4/dr2; c[0]=-gamma*4/dr2;
    for(let i=1;i<n-1;i++){ const r=i*dr; a[i]=-gamma*(1/dr2-1/(2*r*dr)); b[i]=rg+gamma*2/dr2; c[i]=-gamma*(1/dr2+1/(2*r*dr)); }
    b[n-1]=1; rhs[n-1]=0;
    for(let i=1;i<n;i++){ const w=a[i]/b[i-1]; b[i]-=w*c[i-1]; rhs[i]-=w*rhs[i-1]; }
    const x=new Float64Array(n); x[n-1]=rhs[n-1]/b[n-1]; for(let i=n-2;i>=0;i--) x[i]=(rhs[i]-c[i]*x[i+1])/b[i];
    eta=x; }
  return {dr,n,eta};
}
/* eta(r) [m] and d eta / dr, Catmull–Rom on the radial grid */
function etaAt(S,r){ r=Math.abs(r); const t=r/S.dr, i=Math.floor(t); if(i>=S.n-2) return [0,0];
  const f=t-i, e=S.eta, p0=i>=1?e[i-1]:e[1], p1=e[i], p2=e[i+1], p3=e[i+2];
  const c1=0.5*(p2-p0), c2=p0-2.5*p1+2*p2-0.5*p3, c3=-0.5*p0+1.5*p1-1.5*p2+0.5*p3;
  return [p1+f*(c1+f*(c2+f*c3)), (c1+f*(2*c2+3*f*c3))/S.dr]; }

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const TRUE=(()=>{ const R=U(11.6,12.4)*1e-3, L=U(16,20)*1e-3, B0=U(0.487,0.513);

  const half=TRAY_IN[0]/2; if(Math.abs(u)>half||Math.abs(ST.trayV)>TRAY_IN[1]/2){ out.reason="dry"; return out; }
  if(ST.depth<0.30&&Math.abs(u)<TRUE.R*1e3+4){ out.reason="broken"; return out; }
  const fb=freeboard(); if((half-u)*ta<fb){ out.reason="wall_in"; return out; }

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};

    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";

      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);

  const m=svMap(), z=m.z;
  ctx.fillStyle="#dde3e8"; ctx.fillRect(0,0,CLW,CLH);
  const x0=m.X(-PAPER_W/2), x1=m.X(PAPER_W/2), y0=m.Y(PAPER_H+6), y1=m.Y(-6);
  ctx.fillStyle="#f7f5ea"; ctx.fillRect(x0,y0,x1-x0,y1-y0); ctx.strokeStyle="#bdb69c"; ctx.strokeRect(x0,y0,x1-x0,y1-y0);
  const yb=m.Y(0), yt=m.Y(PAPER_H);
  const minor="#c8d6bd", half="#a9be9a", major="#6f8f5f";
  for(let k=-PAPER_W/2;k<=PAPER_W/2;k++){ if(z<2.2&&k%5) continue; const px=m.X(k); if(px<-2||px>CLW+2) continue; ctx.strokeStyle=k%10===0?major:k%5===0?half:minor; ctx.lineWidth=k%10===0?1.2:0.6; ctx.beginPath(); ctx.moveTo(px,yt); ctx.lineTo(px,yb); ctx.stroke(); }
  for(let k=0;k<=PAPER_H;k++){ if(z<2.2&&k%5) continue; const py=m.Y(k); if(py<-2||py>CLH+2) continue; ctx.strokeStyle=k%10===0?major:k%5===0?half:minor; ctx.lineWidth=k%10===0?1.2:0.6; ctx.beginPath(); ctx.moveTo(x0,py); ctx.lineTo(x1,py); ctx.stroke();
    if(k%10===0){ const fs=Math.max(9,Math.min(13,z*3)); if(x0>30) text(String(k),x0-4,py,"#5a6a52",fs,"right","600"); else { const lx=Math.max(x0+3,6); fillR(lx-1,py-fs*0.6-1,fs*1.9,fs*1.2,2,"rgba(247,245,234,.92)"); text(String(k),lx,py-fs*0.05,"#3f5537",fs,"left","700"); }
      if(x1<CLW-30) text(String(k),x1+4,py,"#5a6a52",fs,"left","600"); } }
  for(const [u,v] of [[-PAPER_W/2,PAPER_H+3],[PAPER_W/2,PAPER_H+3],[-PAPER_W/2,-3],[PAPER_W/2,-3]]) circ(m.X(u),m.Y(v),Math.max(5,6*z),"#26292d","#000",1);
  const sp=spot();
  if(sp){ const cx=m.X(0), cy=m.Y(sp.y), rx=sp.wid/2*z, ry=sp.hgt/2*z;
    for(const [f,a] of [[2.0,0.14],[1.45,0.32],[1.0,0.7],[0.62,0.95],[0.3,0.95]]){ ctx.fillStyle=f<0.5?"rgba(255,225,220,"+a+")":"rgba(240,30,30,"+a+")"; ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(3*f,rx*f),Math.max(3*f,ry*f),0,0,7); ctx.fill(); }
    if(ST.dust) text(t.lab.smear,CLW/2,CLH-14,"#8a5a00",11,"center","600"); }
  else if(laserOn()&&assembled()){ const tr=trace(ST.carriage); text(tr.reason==="wall_in"||tr.reason==="wall_out"?t.lab.wall:tr.reason==="broken"?t.lab.broken:tr.reason==="dry"?t.lab.dry:t.lab.spotOff,CLW/2,16,"#b3372f",12,"center","600"); }
}

/* ── 4. the water surface seen from above: the straight edge of a sheet reflected in it ── */
function reflMap(){ const z=Math.min((CLW-20)/140,(CLH-20)/100); return {z,X:u=>CLW/2+u*z,Y:v=>CLH/2+v*z,V:p=>(p-CLH/2)/z}; }
function drawReflView(){
  const t=d(); if(!has("tray")){ text(t.lab.noRefl,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  const m=reflMap(), z=m.z, S=surface(), K=300;             /* the sheet is held ~15 cm above the water */
  ctx.fillStyle="#1d2a33"; ctx.fillRect(0,0,CLW,CLH);
  ctx.fillStyle="#2b4b62"; ctx.fillRect(m.X(-65),m.Y(-50),130*z,100*z);
  circ(m.X(0),m.Y(0),TRUE.R*1e3*z,"rgba(10,12,14,.55)");
  /* the bright image of the sheet: everything on the sheet's side of the edge's mirror image */
  ctx.beginPath(); ctx.moveTo(m.X(-65),m.Y(-50));
  const pts=[]; for(let i=0;i<=260;i++){ const u=-65+130*i/260, v=ST.edgeV, [,de]=etaAt(S,Math.hypot(u,v)*1e-3), sl=Math.hypot(u,v)>1e-6?de*(v/Math.hypot(u,v)):0;
    pts.push([u,Math.max(-50,Math.min(50,v+K*sl))]); }
  for(const [u,v] of pts) ctx.lineTo(m.X(u),m.Y(v)); ctx.lineTo(m.X(65),m.Y(-50)); ctx.closePath();
  ctx.fillStyle="rgba(236,240,232,.88)"; ctx.fill();
  ctx.strokeStyle="#1a1a1a"; ctx.lineWidth=1.4; ctx.beginPath(); pts.forEach(([u,v],i)=>i?ctx.lineTo(m.X(u),m.Y(v)):ctx.moveTo(m.X(u),m.Y(v))); ctx.stroke();
  ctx.strokeStyle="#0b0c0d"; ctx.lineWidth=6; ctx.strokeRect(m.X(-65)-3,m.Y(-50)-3,130*z+6,100*z+6);
  text(t.lab.edge+" ↕",m.X(-62),m.Y(Math.max(-46,ST.edgeV-6)),"#33414d",11,"left","700");
  hitAdd("edge",0,0,CLW,CLH);
}
function drawClose(){
  const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CLW,CLH);
  if(tab==="top") drawTopView(); else if(tab==="cal") drawCalView(); else if(tab==="paper") drawPaperView(); else drawReflView();
  ctx=old;
}
/* ══════════════════════════════════════════════════════════════
   7.  HANDS: putting things down, moving them, putting them back
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const inB=(p,b,m)=>b&&p[0]>=b[0]-(m||0)&&p[0]<=b[2]+(m||0)&&p[1]>=b[1]-(m||0)&&p[1]<=b[3]+(m||0);
function onTable(p){ const [x,y]=unP(p[0],p[1],0); return x>TBL.x0&&x<TBL.x1&&y>TBL.y0&&y<TBL.y1; }
function place(k,p){
  const need=NEEDS[k]; if(need&&!has(need)){ say("need",itemName(k),itemName(need)); return false; }
  if(k==="tray"){ const [x,y]=unP(p[0],p[1],Z_PLATE); if(Math.abs(x)>90||Math.abs(y)>80){ say("noFit"); return false; }
    ST.trayT=Math.max(-40,Math.min(40,x)); ST.trayV=hand.move?trayFitsV(y):ST.trayV0; if(!hand.move&&Math.abs(ST.trayT)<4) ST.trayT=ST.trayT0; ST.on.add(k); return true; }
  if(k==="tube"){ if(has("laser")&&inB(p,bbox("laser"),14)){ ST.tube=true; ST.on.add(k); say("tube"); return "said"; }
    const [x,y]=unP(p[0],p[1],0); if(!fits(k,x,y)){ say(has("laser")?"onLaser":"noFit"); return false; } ST.pos[k]={x,y}; ST.tube=false; ST.on.add(k); return true; }
  if(LOOSE.includes(k)){ const [x,y]=unP(p[0],p[1],0); if(!fits(k,x,y)){ say("noFit"); return false; } ST.pos[k]={x,y}; ST.on.add(k); return true; }
  if(!onTable(p)&&!(has("stand")&&inB(p,bbox("stand"),0))){ say("noFit"); return false; }
  ST.on.add(k); return true;
}
function returnItem(k,quiet){
  if(k==="stand") for(const j of ["plate","caliper","screen"]) if(has(j)) returnItem(j,true);
  if(k==="plate"&&has("tray")) returnItem("tray",true);
  if(k==="caliper"&&has("laser")) returnItem("laser",true);
  if(k==="laser"&&ST.tube){ ST.tube=false; ST.on.delete("tube"); }
  if(k==="tube") ST.tube=false;
  if(k==="caliper"){ ST.offset=0; }
  ST.on.delete(k); if(!quiet) say("back",itemName(k));
}
const PICK=["tube","laser","caliper","cup","syringe","tray","screen","plate","stand"];
function itemAt(p){ for(const k of PICK) if(has(k)&&inB(p,bbox(k),3)) return k; return null; }
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move){ ST.on.add(hand.item); if(hand.item==="tube"&&hand.was) ST.tube=true; say("placed",itemName(hand.item)); } else say("back",itemName(hand.item)); hand=null; return; }
    const r=place(hand.item,p); if(r){ if(r===true) say("placed",itemName(hand.item)); hand=null; } return; }
  const k=itemAt(p); if(!k) return;
  if(right){ returnItem(k); return; }
  if(k==="tray"||LOOSE.includes(k)||k==="tube"){ const was=k==="tube"&&ST.tube; ST.on.delete(k); if(k==="tube") ST.tube=false; hand={item:k,move:true,was}; say("picked",itemName(k)); }
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
cv.addEventListener("wheel",e=>{ const p=lpos(e); if(!has("caliper")||!(inB(p,bbox("caliper"),6)||inB(p,bbox("laser"),6))) return; e.preventDefault(); moveCar((e.deltaY<0?1:-1)*(e.shiftKey?0.01:0.1)); },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ if(hand.move){ ST.on.add(hand.item); if(hand.item==="tube"&&hand.was) ST.tube=true; } hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=hand&&hand.item===k; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
function moveCar(dx){ if(!has("caliper")) return; setCarriage(+(ST.carriage+dx).toFixed(4)); }

/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e); if(e.button!==0) return;
  if(tab==="top"&&has("tray")){ const m=topMap(), x=m.U(p[0]), y=m.V(p[1]), r=trayRect(ST.trayT,ST.trayV);
    if(x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3]){ cdrag={tray:true,x,y,t:ST.trayT,v:ST.trayV}; closeCv.setPointerCapture(e.pointerId); } return; }
  if(tab==="paper"){ cdrag={pan:true,x:p[0],y:p[1],cx:SV.cx,cy:SV.cy}; closeCv.setPointerCapture(e.pointerId); return; }
  if(tab==="refl"&&has("tray")){ cdrag={edge:true}; ST.edgeV=Math.max(-48,Math.min(48,reflMap().V(p[1]))); closeCv.setPointerCapture(e.pointerId); return; }
  const h=hitAt(p); if(!h) return;
  if(h.k==="onoff"){ ST.calOn=!ST.calOn; return; }
  if(h.k==="unit"){ if(!ST.calOn){ say("calOff"); return; } ST.inch=!ST.inch; say("unit"); return; }
  if(h.k==="origin"){ if(!ST.calOn){ say("calOff"); return; } ST.offset=ST.carriage-TRUE.calZero; say("origin"); return; }
  if(h.k==="slider"){ cdrag={slider:true,x:p[0],c:ST.carriage}; closeCv.setPointerCapture(e.pointerId); } });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e);
  if(cdrag.tray){ const m=topMap(); ST.trayT=Math.max(-40,Math.min(40,cdrag.t+m.U(p[0])-cdrag.x)); ST.trayV=trayFitsV(cdrag.v+m.V(p[1])-cdrag.y); return; }
  if(cdrag.pan){ const m=svMap(); SV.cx=cdrag.cx-(p[0]-cdrag.x)/m.z; SV.cy=cdrag.cy+(p[1]-cdrag.y)/m.z; return; }
  if(cdrag.edge){ ST.edgeV=Math.max(-48,Math.min(48,reflMap().V(p[1]))); return; }
  if(cdrag.slider){ const m=calMap(); setCarriage(cdrag.c+(p[0]-cdrag.x)/m.z); } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e);
  if(tab==="cal"){ e.preventDefault(); moveCar((e.deltaY<0?1:-1)*(e.shiftKey?0.01:0.1)); return; }
  if(tab!=="paper") return; e.preventDefault(); const m=svMap(), mx=m.U(p[0]), my=m.V(p[1]); SV.z=Math.min(40,Math.max(1,SV.z*(e.deltaY<0?1.16:1/1.16)));
  const m2=svMap(); SV.cx+=mx-m2.U(p[0]); SV.cy+=my-m2.V(p[1]); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
for(const [id,dx] of [["mv-5",-5],["mv-1",-1],["mv-01",-0.1],["mv01",0.1],["mv1",1],["mv5",5]]) $(id).onclick=()=>moveCar(dx);
$("tubeBtn").onclick=()=>{ if(ST.tube){ ST.tube=false; ST.on.delete("tube"); say("tubeOff"); return; } if(!has("laser")){ say("need",itemName("tube"),itemName("laser")); return; } ST.tube=true; ST.on.add("tube"); say("tube"); };
function addWater(ml){ if(!has("cup")||!has("syringe")||!has("tray")){ say("needWater"); return; }
  const dz=ml/13, top=Z_RIM-0.4-Z_MAG(); ST.depth=Math.max(0.05,Math.min(top,+(ST.depth+dz).toFixed(3))); ST.added+=ml; say("water",(ml>0?"+":"")+ml); }
for(const [id,ml] of [["w-13",-13],["w-13b",-1.3],["w13b",1.3],["w13",13]]) $(id).onclick=()=>addWater(ml);
$("dustBtn").onclick=()=>{ ST.dust=false; dustT=performance.now(); say("dust"); };
for(const [id,dt,dv] of [["al-t",-0.5,0],["al+t",0.5,0],["al+v",0,-0.5],["al-v",0,0.5]]) $(id).onclick=()=>{ if(!has("tray")){ say("noTray"); return; } ST.trayT=Math.max(-40,Math.min(40,ST.trayT+dt)); ST.trayV=trayFitsV(ST.trayV+dv); say("push"); };
$("noteBtn").onclick=()=>{ const n=$("note"), s=calText(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+"x = "+(s||"—")+"    y = "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d(); $("calDisp").textContent=calText()||"--------"; $("tubeBtn").textContent=ST.tube?t.tubeOn:t.tubeOff; $("waterLbl").textContent=t.water(ST.added); }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(laserOn()) L.push([t.st.laser,true]);
  if(has("tray")&&ST.depth<0.45) L.push([t.st.low,true]);
  if(has("tray")&&freeboard()<1.2) L.push([t.st.high,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-cal").textContent=t.hCal; $("calHint").textContent=t.calHint; $("t-h-laser").textContent=t.hLaser; $("t-h-water").textContent=t.hWater; $("dustBtn").textContent=t.dust;
  $("t-h-align").textContent=t.hAlign; $("alignHint").textContent=t.alignHint; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2012 E1 — 물의 자기 투자율 · HaslaLab":"IPhO 2012 E1 — The Magnetic Permeability of Water · HaslaLab";
  renderTabs(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastJ=0, dustT=performance.now(), dustNext=U(180,420)*1000;
function tick(){
  const now=performance.now();
  if(now-lastJ>120){ lastJ=now; ST.jx=gauss()*TRUE.jitter; }
  if(!ST.dust&&now-dustT>dustNext){ ST.dust=true; dustT=now; dustNext=U(240,600)*1000; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
