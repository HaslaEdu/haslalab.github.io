"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* The planetarium at Vassouras (22.40° S, 43.66° W, UT−3).  The sheet does not give the projected dates; they are
   recovered from the official solution.  Problem 1: the sheet's positions of Antares (az 254°23′, alt 68°22′) and
   Fomalhaut (113°24′, 24°30′) fix the sidereal time to within a minute — 22 August 2024 at 19:52, during the
   olympiad, matches both and puts exactly the solution's eight zodiacal constellations above the horizon.
   Problem 2: the Sun set 1 h 26 min before, in March (21 March per the solution), the Moon in Leo — 21 March 2024
   at 19:34. */
const SITE = {lat: -22.40, lon: -43.66, tz: -3, name: "Vassouras"};
const SC = {P1: {day: [2024, 8, 22], hour: 19 + 52 / 60}, P2: {day: [2024, 3, 21], hour: 19 + 34 / 60}};
let SKY = null, OPT = null, solOn = false, LANGF = () => "ko", curTask = new URLSearchParams(location.search).get("task") === "P2" ? "P2" : "P1";
const T = {sco: A.vec(247.352, -26.432), psa: A.vec(344.413, -29.622), lyr: A.vec(279.235, 38.784), m8: A.vec(270.9, -24.38), m20: A.vec(270.6, -23.03), cmi: A.vec(114.825, 5.225), tau: A.vec(68.98, 16.509)};
const CIRC = [["α Car", 95.988, -52.696, false], ["γ Cru", 187.791, -57.113, false], ["β Hyi", 6.438, -77.255, true], ["β Pav", 311.240, -66.203, true], ["β Crv", 188.597, -23.397, false], ["β Car", 138.300, -69.717, true],
              ["α Eri", 24.429, -57.237, false], ["υ Oct", 322.600, -77.400, true], ["α Sco", 247.352, -26.432, false], ["β Lup", 224.633, -43.134, false], ["γ Vel", 122.383, -47.337, false], ["α Cnc", 134.622, 11.858, false]];
const SAT = [[98 + 47 / 60, 7 + 31 / 60], [2 + 27 / 60, 54 + 47 / 60], [311 + 19 / 60, 26 + 47 / 60]];
function setScene(k) { curTask = k; if (!SKY) return; OPT.start = [...SC[k].day, SC[k].hour]; SKY.setTime(SC[k].hour); }
const UIX = {ko: {start: "플라네타륨 입장 (암적응 5분 → 문제 1 10분 → 문제 2 10분)", adapt: "암적응", p1: "문제 1", p2: "문제 2", left: "남은 시간", five: "5분 남았습니다", one: "1분 남았습니다", over: "끝났습니다. 질서 있게 나가세요.", idle: "‘입장’을 누르면 시험처럼 진행됩니다. 위의 탭(P1, P2)으로 두 하늘을 자유롭게 볼 수도 있습니다."},
             en: {start: "Enter the planetarium (5 min adaptation → problem 1, 10 min → problem 2, 10 min)", adapt: "Eye adaptation", p1: "Problem 1", p2: "Problem 2", left: "Time left", five: "5 minutes left", one: "1 minute left", over: "Finished. Leave quickly and in good order.", idle: "‘Enter’ runs it like the examination. The tabs above (P1, P2) also show the two skies freely."}};
const RUN = {t0: 0};
function skySheet(host, lang) { LANGF = lang;
  const box = document.createElement("div"); host.appendChild(box);
  OPT = {el: box, site: SITE, start: [...SC[curTask].day, SC[curTask].hour], look: {az: 180, alt: 40, fov: 120}, lang, tools: ["look", "hand"], drawOver: overlay};
  SKY = NightSky.create(OPT);
  const ctl = document.createElement("div"); ctl.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px";
  const b = document.createElement("button"); b.className = "cr-btn"; b.style.cssText = "width:auto;margin:0;padding:6px 12px";
  const st = document.createElement("span"); st.style.cssText = "font:600 13px 'Segoe UI','Malgun Gothic',sans-serif;color:#f3d58a";
  ctl.append(b, st); host.appendChild(ctl);
  b.onclick = () => { RUN.t0 = performance.now(); clickTab("P1"); };
  setInterval(() => { const u = UIX[lang()]; b.textContent = u.start; if (!RUN.t0) { st.textContent = u.idle; st.style.color = "#9aa3ab"; return; }
    const t = (performance.now() - RUN.t0) / 1000, fm = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    let lab, left, k = null;
    if (t < 300) { lab = u.adapt; left = 300 - t; } else if (t < 900) { lab = u.p1; left = 900 - t; k = "P1"; } else if (t < 1500) { lab = u.p2; left = 1500 - t; k = "P2"; } else { st.textContent = u.over; st.style.color = "#ff8a70"; return; }
    if (k && k !== curTask) clickTab(k);
    st.style.color = k && left < 60 ? "#ff8a70" : "#f3d58a";
    st.textContent = lab + " · " + u.left + " " + fm(left) + (k && left < 300 && left > 290 ? " — " + u.five : k && left < 60 && left > 50 ? " — " + u.one : ""); }, 250);
  return {lang: () => SKY.lang(), show: SKY.show}; }
function clickTab(k) { const btn = document.querySelector('.cr-tabs button[data-t="' + k + '"]'); if (btn) btn.click(); else setScene(k); }
document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest(".cr-tabs button"); if (t && SC[t.dataset.t]) setScene(t.dataset.t); }, true);
/* the solution drawn on the dome */
function overlay(g, V) { if (!solOn) return; const L = LANGF(), P = (v) => V.proj(V.hor(v)), H = (alt, az) => V.proj(A.hvec(alt, az));
  const lab = (p, t, c, dx, dy) => { if (!p) return; g.font = "bold 13px 'Segoe UI',sans-serif"; g.fillStyle = c; g.fillText(t, p[0] + (dx ?? 9), p[1] + (dy ?? -8)); };
  const ring = (p, c) => { if (!p) return; g.strokeStyle = c; g.lineWidth = 1.8; g.beginPath(); g.arc(p[0], p[1], 11, 0, 7); g.stroke(); };
  /* the local meridian */
  g.strokeStyle = "rgba(200,180,255,0.6)"; g.lineWidth = 1.2; g.setLineDash([6, 5]); g.beginPath(); let on = false;
  for (let a = 0; a <= 180; a += 2) { const p = a <= 90 ? H(a, 180) : H(180 - a, 0); if (!p) { on = false; continue; } on ? g.lineTo(...p) : g.moveTo(...p); on = true; } g.stroke();
  /* the ecliptic */
  g.strokeStyle = "rgba(255,200,90,0.7)"; g.beginPath(); on = false; const e = 23.4393 * DEG;
  for (let l = 0; l <= 360; l += 2) { const c = Math.cos(l * DEG), s = Math.sin(l * DEG), p = P([c, s * Math.cos(e), s * Math.sin(e)]); if (!p) { on = false; continue; } on ? g.lineTo(...p) : g.moveTo(...p); on = true; } g.stroke(); g.setLineDash([]);
  if (curTask === "P1") {
    const cen = {Vir: [195, -4], Lib: [228, -15], Sco: [254, -27], Oph: [258, -8], Sgr: [286, -28], Cap: [315, -18], Aqr: [334, -10], Psc: [10, 12]};
    for (const c in cen) lab(P(A.vec(...cen[c])), c, "#78c8ff", 0, 0);
    ring(P(T.sco), "#ff8a70"); lab(P(T.sco), "1 · α Sco", "#ff8a70", 14, 4); ring(P(T.psa), "#ff8a70"); lab(P(T.psa), "2 · α PsA", "#ff8a70", 14, 4);
    ring(P(T.lyr), "#c8b4ff"); lab(P(T.lyr), "α Lyr", "#c8b4ff", 14, 4); ring(P(T.m8), "#ffd25a"); lab(P(T.m8), "M8 / M20", "#ffd25a", 14, 14);
    for (const [az, alt, n] of [[254 + 23 / 60, 68 + 22 / 60, "1"], [113 + 24 / 60, 24.5, "2"]]) { const p = H(alt, az); if (p) { g.strokeStyle = "#ffffff"; g.beginPath(); g.moveTo(p[0] - 6, p[1]); g.lineTo(p[0] + 6, p[1]); g.moveTo(p[0], p[1] - 6); g.lineTo(p[0], p[1] + 6); g.stroke(); } }
  } else {
    const mv = V.state.moon.v; lab(P(mv), (L === "ko" ? "달 · " : "Moon · ") + "Leo", "#ffd25a", 16, -10);
    /* the circumpolar limit: the stars south of it never set */
    const lim = -(90 - Math.abs(SITE.lat)); g.strokeStyle = "rgba(120,255,160,0.6)"; g.setLineDash([4, 4]); g.beginPath(); on = false;
    for (let ra = 0; ra <= 360; ra += 3) { const p = P(A.vec(ra, lim)); if (!p) { on = false; continue; } on ? g.lineTo(...p) : g.moveTo(...p); on = true; } g.stroke(); g.setLineDash([]);
    for (const [n, ra, de, ok] of CIRC) { const p = P(A.vec(ra, de)); if (!p) continue; lab(p, n + (ok ? " ✓" : ""), ok ? "#78ff9e" : "rgba(200,200,200,0.6)", 7, -6); }
    g.strokeStyle = "rgba(255,255,255,0.8)"; g.setLineDash([3, 5]); g.beginPath(); SAT.forEach(([az, alt], i) => { const p = H(alt, az); if (p) i ? g.lineTo(...p) : g.moveTo(...p); }); g.stroke(); g.setLineDash([]);
    SAT.forEach(([az, alt], i) => { const p = H(alt, az); if (!p) return; g.fillStyle = "#fff"; g.beginPath(); g.arc(p[0], p[1], 3.5, 0, 7); g.fill(); lab(p, ["rise", "max", "set"][i], "#fff", 7, 14); });
    ring(P(T.cmi), "#ff8a70"); lab(P(T.cmi), "a · α CMi", "#ff8a70", 14, 4); ring(P(T.tau), "#ff8a70"); lab(P(T.tau), "b · α Tau", "#ff8a70", 14, 4); } }

/* checking written answers: Bayer designations, Latin names or abbreviations */
const GREEK = {alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", upsilon: "υ", a: "α", b: "β", g: "γ", u: "υ"};
const NAMES = {antares: "αsco", fomalhaut: "αpsa", vega: "αlyr", procyon: "αcmi", aldebaran: "αtau"};
function norm(s) { s = String(s || "").toLowerCase().trim(); if (NAMES[s.replace(/\s+/g, "")]) return NAMES[s.replace(/\s+/g, "")];
  return s.replace(/^(alpha|beta|gamma|delta|epsilon|upsilon|a|b|g|u)(?=[\s.\-]|$)/, (m) => GREEK[m]).replace(/[\s.\-]+/g, "").replace("piscisaustrini", "psa").replace("lyrae", "lyr").replace("scorpii", "sco").replace("canisminoris", "cmi").replace("tauri", "tau"); }
const mk = (ok) => ok ? " ✓" : " ✗";
const ZOD = {aries: "Ari", taurus: "Tau", gemini: "Gem", cancer: "Cnc", leo: "Leo", virgo: "Vir", libra: "Lib", scorpius: "Sco", scorpio: "Sco", ophiuchus: "Oph", sagittarius: "Sgr", capricornus: "Cap", capricorn: "Cap", aquarius: "Aqr", pisces: "Psc"};
function zodSet(s) { return new Set(String(s || "").split(/[,;\/\s]+/).filter(Boolean).map((w) => { const l = w.toLowerCase(); return ZOD[l] || (l[0].toUpperCase() + l.slice(1, 3)); })); }
function gradeZod(L, ANS) { const U = zodSet(ANS["P1.z"]), Tr = ["Psc", "Aqr", "Cap", "Sgr", "Oph", "Sco", "Lib", "Vir"]; if (!U.size) return "";
  const hit = Tr.filter((c) => U.has(c)).length, bad = [...U].filter((c) => !Tr.includes(c)); const pts = Math.max(0, 0.5 * hit - 0.8 * bad.length);
  return "<br>" + (L === "ko" ? "당신의 답: 맞음 " + hit + "개, 틀림 " + bad.length + "개 → " : "Yours: " + hit + " right, " + bad.length + " wrong → ") + pts.toFixed(1) + " / 4"; }
const MON = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"].map((k, i) => ({ko: k, en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][i]}));

  docTitle: {ko: "IOAA 2024 플라네타륨 라운드 · HaslaLab", en: "IOAA 2024 planetarium round · HaslaLab"},
