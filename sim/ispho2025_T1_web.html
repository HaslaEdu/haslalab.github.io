  .navbar .nbt img{width:24px;height:24px;display:block}
  .navbar .nbt:hover{border:1px solid #a0a0a0;box-shadow:inset 1px 1px #fff,inset -1px -1px #fff}
  .navbar .nbt.on{background:#dadada;border:1px solid #6f6f6f;box-shadow:inset 1px 1px #a0a0a0}
  .navbar .nbt.dis img{opacity:.35}
  .navbar .nbt.dis:hover{border-color:transparent;box-shadow:none}
  .navbar .sep{width:2px;height:24px;background:#a9a9a9;margin:0 4px;border-left:1px solid #8a8a8a}
  .navbar .msg{margin-left:auto;font-size:13.3px;white-space:pre;text-align:right;padding-right:4px;line-height:17px}
  /* panel.Panel: a grid of tk widgets, gridded at column 2 with padx=10 */
  .panel{grid-column:2;grid-row:1;margin:0 10px;display:grid;grid-template-columns:auto auto;align-items:center;justify-items:center}
  .panel .lab{padding:2px 4px}
  .ent{width:145px;height:20px;font:12px "Segoe UI",Tahoma,sans-serif;padding:0 3px;outline:0;border-radius:0;
       border:1px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;box-shadow:inset 1px 1px #696969,inset -1px -1px #e3e3e3;
       background:#fff;color:#000}
  .ent.r{text-align:right}
  .ent:disabled{background:#f0f0f0!important;color:#6d6d6d}
  .btn{grid-column:1/3;justify-self:stretch;height:26px;font:12px "Segoe UI",Tahoma,sans-serif;color:#000;padding:0;
       border:1px solid;border-color:#fff #696969 #696969 #fff;box-shadow:inset -1px -1px #a0a0a0,inset 1px 1px #e3e3e3;
       background:#f0f0f0;outline:0;border-radius:0;cursor:default}
  .btn:active:not(:disabled){border-color:#696969 #fff #fff #696969;box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #e3e3e3;padding:1px 0 0 1px}
  .btn:disabled{color:#a0a0a0}
  .cbx{width:92px;height:22px;border:1px solid #adadad;background:#e5e5e5;display:flex;align-items:center;position:relative;
       font:12px "Segoe UI",Tahoma,sans-serif;cursor:default}
  .cbx:hover{border-color:#0078d7;background:#e5f1fb}
  .cbx span{flex:1;text-align:center}
  .cbx i{width:17px;height:100%;display:flex;align-items:center;justify-content:center}
  .cbx select{position:absolute;inset:0;opacity:0;width:100%;cursor:default}
  .pbar{grid-column:1/3;justify-self:stretch;height:20px;border:1px solid #bcbcbc;background:#e6e6e6;position:relative}
  .pbar i{position:absolute;left:0;top:0;bottom:0;background:#06b025;width:0}
  .vs{grid-column:1/3}

  /* dialogs */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
  .dlg{background:#fff;border:1px solid #8f8f8f;box-shadow:0 10px 32px -8px rgba(0,0,0,.5);min-width:380px;
       font:12px "Segoe UI",Tahoma,"Malgun Gothic",sans-serif;user-select:none}
  .dlg .dcap{height:30px;display:flex;align-items:center;padding-left:10px}
  .dlg .dcap span{flex:1}
  .dlg .dbody{padding:18px 18px 22px;display:flex;align-items:center;gap:10px}
  .dlg .dbody input{flex:1;height:23px;border:1px solid #7a7a7a;padding:0 4px;font:12px "Segoe UI",sans-serif;outline:0}
  .dlg .dbody input:focus{border-color:#0078d7}
  .dlg .dfoot{background:#f0f0f0;padding:11px;display:flex;justify-content:flex-end;gap:8px}
  .dlg .dfoot .tb{width:88px;height:26px;border:1px solid #adadad;background:#e1e1e1;font:12px "Segoe UI",sans-serif}
  .dlg .dfoot .tb:hover{background:#e5f1fb;border-color:#0078d7}
  .stool{position:fixed;z-index:40;background:#f0f0f0;border:1px solid #8f8f8f;box-shadow:0 10px 32px -8px rgba(0,0,0,.5);
         font:12px "Segoe UI",Tahoma,sans-serif;user-select:none}
  .stool .dcap{height:30px;display:flex;align-items:center;padding-left:8px;background:#fff;cursor:move}
  .stool .dcap span{flex:1;margin-left:6px}
  .stool canvas{display:block;background:#fff}
</style>
</head>

/* ── a small matplotlib 3.7 for one Axes: MaxNLocator('auto'), AutoMinorLocator,
      ScalarFormatter (offset, order of magnitude, sig. figures), format_data_short ── */
const MPL=(()=>{
  const STEPS=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20];         /* MaxNLocator._extended_steps */
  const log10=Math.log10, floor=Math.floor;
  /* Python's float divmod, which floor() of a quotient does not always reproduce */
  function pyDivmod(v,w){
    let mod=v%w, div=(v-mod)/w;
    if(mod){ if((w<0)!==(mod<0)){ mod+=w; div-=1; } } else mod=0*Math.sign(w);
    let fd;
    if(div){ fd=Math.floor(div); if(div-fd>0.5) fd+=1; } else fd=0*Math.sign(v/w);
    return [fd,mod];
  }
  const pyFloorDiv=(a,b)=>pyDivmod(a,b)[0];
  const pyMod=(a,b)=>pyDivmod(a,b)[1];
  function scaleRange(vmin,vmax,n){
    const dv=Math.abs(vmax-vmin), meanv=(vmax+vmin)/2;
    let offset=0;
    if(!(Math.abs(meanv)/dv<100)) offset=Math.sign(meanv)*Math.pow(10,floor(log10(Math.abs(meanv))));
    const scale=Math.pow(10,floor(log10(dv/n)));
    return [scale,offset];
  }
  function edge(step,offset){
    const closeto=(ms,e)=>{
      let tol;
      if(offset>0){const digits=log10(offset/step); tol=Math.max(1e-10,Math.pow(10,digits-12)); tol=Math.min(0.4999,tol);}
      else tol=1e-10;
      return Math.abs(ms-e)<tol;};
    return {
      le:x=>{const d=pyFloorDiv(x,step),m=pyMod(x,step); return closeto(m/step,1)?d+1:d;},
      ge:x=>{const d=pyFloorDiv(x,step),m=pyMod(x,step); return closeto(m/step,0)?d:d+1;}};
  }
  function nonsingular(a,b){
    if(!isFinite(a)||!isFinite(b)) return [-0.001,0.001];
    let flip=false; if(b<a){[a,b]=[b,a];flip=true;}
    const maxabs=Math.max(Math.abs(a),Math.abs(b));
    if(maxabs<(1e6/Number.MIN_VALUE)*Number.EPSILON*0 + 1e-300){ a=-0.001; b=0.001; }
    else if(b-a<=maxabs*1e-13){ if(b===0&&a===0){a=-0.001;b=0.001;} else {a-=1e-13*Math.abs(a); b+=1e-13*Math.abs(b);} }
    return flip?[b,a]:[a,b];
  }
  function majorTicks(vmin,vmax,nbins){
    [vmin,vmax]=nonsingular(vmin,vmax);
    const [scale,offset]=scaleRange(vmin,vmax,nbins);
    const _vmin=vmin-offset,_vmax=vmax-offset;
    const steps=STEPS.map(s=>s*scale);
    const raw=(_vmax-_vmin)/nbins;
    let istep=steps.findIndex(s=>s>=raw); if(istep<0) istep=steps.length-1;
    let ticks=[];
    for(let k=istep;k<steps.length;k++){
      const step=steps[k];
      const best=pyFloorDiv(_vmin,step)*step;
      const e=edge(step,offset);
      const low=e.le(_vmin-best), high=e.ge(_vmax-best);
      ticks=[]; for(let i=low;i<=high;i++) ticks.push(i*step+best);
      const n=ticks.filter(t=>t<=_vmax&&t>=_vmin).length;
      if(n>=2) break;
    }
    return ticks.map(t=>t+offset);
  }
  function minorTicks(maj,vmin,vmax){
    if(maj.length<2) return [];
    const ms=maj[1]-maj[0];
    const ne=Math.pow(10,pyMod(log10(ms),1));
    const ndivs=[1,2.5,5,10].some(v=>Math.abs(ne-v)<=1e-8+1e-5*v)?5:4;
    const st=ms/ndivs; if(vmin>vmax)[vmin,vmax]=[vmax,vmin];
    const t0=maj[0];
    const tmin=(pyFloorDiv(vmin-t0,st)+1)*st, tmax=(pyFloorDiv(vmax-t0,st)+1)*st;
    const out=[]; const n=Math.ceil((tmax-tmin)/st);
    for(let i=0;i<n;i++) out.push(tmin+i*st+t0);
    /* Axis drops minor ticks that sit on major ones */
    const tol=(maj[1]-maj[0])*1e-5;
    return out.filter(m=>!maj.some(M=>Math.abs(M-m)<tol));
  }
  const fixMinus=s=>s.replace(/-/g,"−");
  function fmtF(v,d){ let s=v.toFixed(d); if(/^-0\.?0*$/.test(s)) s=s.slice(1); return s; }
  function pctG(v,prec,alt){ /* printf %#.Ng (alt keeps trailing zeros) */
    if(v===0) return alt?(prec>1?"0."+"0".repeat(prec-1):"0."):"0";
    const P=prec===0?1:prec;
    const X=floor(log10(Math.abs(v)));
    let e=X; let r=Math.abs(v).toExponential(P-1); e=parseInt(r.split("e")[1]);
    let s;
    if(P>e && e>=-4){ s=v.toFixed(P-1-e); if(alt&&s.indexOf(".")<0) s+="."; if(!alt) s=s.replace(/\.?0+$/,""); }
    else { s=v.toExponential(P-1); let [m,ex]=s.split("e"); if(!alt) m=m.replace(/\.?0+$/,""); else if(m.indexOf(".")<0) m+=".";
      const en=parseInt(ex); s=m+"e"+(en<0?"-":"+")+String(Math.abs(en)).padStart(2,"0"); }
    return s;
  }
  function formatData(value){
    const e=floor(log10(Math.abs(value)));
    const s=Math.round(value/Math.pow(10,e)*1e10)/1e10;
    const sig=(s%1===0)?String(s):pctG(s,10,false);
    return e===0?sig:sig+"e"+e;
  }
  function scalar(locs,vmin,vmax){
    if(vmin>vmax)[vmin,vmax]=[vmax,vmin];
    const vis=locs.filter(l=>vmin<=l&&l<=vmax);
    /* _compute_offset */
    let offset=0;
    if(vis.length){
      const lmin=Math.min(...vis), lmax=Math.max(...vis);
      if(!(lmin===lmax||(lmin<=0&&0<=lmax))){
        const [amin,amax]=[Math.abs(lmin),Math.abs(lmax)].sort((a,b)=>a-b);
        const sign=lmin<0?-1:1;
        const oomMax=Math.ceil(log10(amax));
        let oom=oomMax; while(pyFloorDiv(amin,10**oom)===pyFloorDiv(amax,10**oom)) oom--; oom+=1;
        if((amax-amin)/10**oom<=1e-2){ oom=oomMax; while(!(pyFloorDiv(amax,10**oom)-pyFloorDiv(amin,10**oom)>1)) oom--; oom+=1; }
        offset=pyFloorDiv(amax,10**oom)>=1000 ? sign*pyFloorDiv(amax,10**oom)*10**oom : 0;
      }
    }
    /* _set_order_of_magnitude, powerlimits (-5, 6) */
    let om=0;
    if(vis.length){
      let oom;
      if(offset) oom=floor(log10(vmax-vmin));
      else { const v=Math.max(...vis.map(Math.abs)); oom=v===0?0:floor(log10(v)); }
      om=(oom<=-5||oom>=6)?oom:0;
    }
    /* _set_format */
    let L=(locs.length<2?[...locs,vmin,vmax]:locs).map(l=>(l-offset)/10**om);
    let range=Math.max(...L)-Math.min(...L);
    if(range===0) range=Math.max(...L.map(Math.abs)); if(range===0) range=1;
    if(locs.length<2) L=L.slice(0,-2);
    const rOom=floor(log10(range));
    let sig=Math.max(0,3-rOom); const thresh=1e-3*10**rOom;
    const rnd=(x,d)=>{const f=10**d; return Math.round(x*f)/f;};
    while(sig>=0){ if(Math.max(...L.map(x=>Math.abs(x-rnd(x,sig))))<thresh) sig--; else break; }
    sig+=1;
    const labels=locs.map(l=>fixMinus(fmtF((l-offset)/10**om,sig)));
    let off="";
    if(om||offset){ let o=""; if(offset){o=formatData(offset); if(offset>0)o="+"+o;} off=fixMinus((om?"1e"+om:"")+o); }
    return {labels,offset:off};
  }
  function gSig(value,delta){
    if(!isFinite(value)) return 0;
    return Math.max(0,(value?floor(log10(Math.abs(value)))+1:1)-floor(log10(delta)));
  }
  const short=(v,delta)=>fixMinus(pctG(v,gSig(v,delta),true));
  return {majorTicks,minorTicks,scalar,short,formatData,pctG};
})();

function pyFloat(s){
  const t=String(s).trim();
  if(/^[+-]?(inf|infinity)$/i.test(t)) return t[0]==="-"?-Infinity:Infinity;
  if(/^[+-]?nan$/i.test(t)) return NaN;
  if(!/^[+-]?(\d+(_\d+)*(\.(\d+(_\d+)*)?)?|\.\d+(_\d+)*)([eE][+-]?\d+(_\d+)*)?$/.test(t)) throw new ValueError();
  return parseFloat(t.replace(/_/g,"")); }
function ValueError(){}
function check_entry_integrity(res,min,max){
  if(res==="") return null;
  try{ const a=pyFloat(res); return (a>=min&&a<=max)?a:null; }
  catch(e){ return null; }
}

function system_drive(m,out,P){
  const n=P.n, k=1, k1=1, h=P.h, a=P.a, alpha=P.alpha, gr=1/(1+alpha*alpha);
  for(let x=0;x<n;x++){
    const i=3*x, mx=m[i], my=m[i+1], mz=m[i+2];
    let mx1,my1,mz1;
    if(x===0){ mx1=m[3]; my1=m[4]; mz1=m[5]; }
    else if(x===n-1){ mx1=m[3*n-6]; my1=m[3*n-5]; mz1=m[3*n-4]; }
    else { mx1=m[i-3]+m[i+3]; my1=m[i-2]+m[i+4]; mz1=m[i-1]+m[i+5]; }
    const hx=a*mx1, hy=-k1*my+a*my1, hz=k*mz+a*mz1+h;
    const sp=mx*hx+my*hy+mz*hz;
    out[i]  =-gr*(my*hz-mz*hy)-alpha*gr*(mx*sp-hx);
    out[i+1]=-gr*(mz*hx-mx*hz)-alpha*gr*(my*sp-hy);
    out[i+2]=-gr*(mx*hy-my*hx)-alpha*gr*(mz*sp-hz);
  }
}
function init_values_gen(n,center){
  const k=center, o=[];
  for(let i=0;i<k-2;i++) o.push(0,0,1);
  for(let i=0;i<5;i++) o.push(1,0,0);
  for(let i=0;i<n-k-3;i++) o.push(0,0,-1);
  return o;
}

    fun(t+h0,y1,f1); for(let i=0;i<n;i++) q0[i]=(f1[i]-f[i])/sc[i];

        for(let i=0;i<n;i++){ let d=0; for(let j=0;j<s;j++) d+=K[j][i]*a[j]; tmp[i]=y[i]+d*h; }

        err[i]=d*h/(atol+Math.max(Math.abs(y[i]),Math.abs(ynew[i]))*rtol); }
      const en=norm(err);
      if(en<1){ let fac=en===0?MAX_FACTOR:Math.min(MAX_FACTOR,SAFETY*Math.pow(en,ee));
        if(rejected) fac=Math.min(1,fac); ha*=fac; accepted=true; }
      else { ha*=Math.max(MIN_FACTOR,SAFETY*Math.pow(en,ee)); rejected=true; }
    }
    /* dense output on the t_eval points this step passed (side='right') */
    let j=ti; while(j<t_eval.length&&t_eval[j]<=tnew) j++;
    if(j>ti){
      const Q=[]; for(let i=0;i<n;i++){ const r=[0,0,0,0];
        for(let s=0;s<7;s++){ const k=K[s][i]; if(k!==0) for(let c=0;c<4;c++) r[c]+=k*RK.P[s][c]; } Q.push(r); }

        for(let i=0;i<n;i++){ const r=Q[i]; yy[i]=h*(r[0]*p[0]+r[1]*p[1]+r[2]*p[2]+r[3]*p[3])+y[i]; }

function nextafter(x){ const b=new Float64Array([x]), u=new BigInt64Array(b.buffer);

function runCalc(which,progress){
  const C=config[which];
  if(which==="C") C.L=Math.trunc(C.L);
  const n= which==="B" ? 201 : C.L+50;
  const P={n, h:C.b, a:C.beta, alpha:C.alpha};
  const y0= which==="B" ? init_values_gen(n,101) : INIT_C.slice(0,(50+C.L)*3);
  const T=C.T, te=linspace(0,T,200);
  let lastT=0;
  const fun=(t,y,out)=>{ lastT=t; system_drive(y,out,P); };
  const gen=solve_ivp(fun,T,y0,te);

    const tick=()=>{ let r;
      try{ r=gen.next(); }catch(e){ rej(e); return; }
      progress(T>0?lastT/T*config.full_progress:0);
      if(r.done){ config["solution_"+which]=[{y:r.value.y,t:r.value.t},deepcopy(C)]; res(); }

/* ════════════════════ files.py — numpy's tofile(sep=';') and json.dumps, in Python's own float format ════════════════════ */
function pyRepr(x){
  if(Number.isInteger(x)&&!Object.is(x,-0)&&Math.abs(x)<1e16) return x.toFixed(1);
  if(!isFinite(x)) return isNaN(x)?"nan":(x>0?"inf":"-inf");
  let s=String(x); const m=/^(-?)(\d+)(?:\.(\d+))?(?:e([+-]\d+))?$/.exec(s);
  let sign=m[1], digits=(m[2]+(m[3]||"")).replace(/^0+/,""), exp=parseInt(m[4]||"0")+m[2].length-1;
  if(m[2]==="0"){ const z=(m[3]||"").match(/^0*/)[0].length; digits=(m[3]||"").slice(z); exp=-z-1; }
  digits=digits.replace(/0+$/,"")||"0";
  if(exp<-4||exp>=16){ let mant=digits[0]+(digits.length>1?"."+digits.slice(1):"");
    return sign+mant+"e"+(exp<0?"-":"+")+String(Math.abs(exp)).padStart(2,"0"); }
  if(exp<0) return sign+"0."+"0".repeat(-exp-1)+digits;
  if(digits.length<=exp+1) return sign+digits+"0".repeat(exp+1-digits.length)+".0";
  return sign+digits.slice(0,exp+1)+"."+digits.slice(exp+1);
}

function jsonDumps(o){ return "{"+Object.keys(o).map(k=>JSON.stringify(k)+": "+(o[k]===null?"null":typeof o[k]==="number"?(k==="L"?String(Math.trunc(o[k])):pyRepr(o[k])):JSON.stringify(o[k]))).join(", ")+"}"; }
function save(){
  askSave(name=>{
    if(name==="") return;
    if(!/\.[^.\\/]+$/.test(name)) name+=".ispho";
    let filename=name.slice(0,-6)+".ispho";
    let pardict, sol;
    if(config.task==="B"){ pardict=config.B; pardict.task="B"; sol=config.solution_B[0]; }
    else { pardict=config.C; pardict.task="C"; sol=config.solution_C[0]; }
    const parts=[]; sol.t.forEach(v=>parts.push(pyRepr(v)));
    const n=sol.y[0].length;
    for(let i=0;i<n;i++) for(let k=0;k<sol.y.length;k++) parts.push(pyRepr(sol.y[k][i]));
    const txt=parts.join(";")+"\n"+jsonDumps(pardict);
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/octet-stream"}));
    a.download=filename.split(/[\\/]/).pop(); a.click();
  });
}
function open_file(done){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".ispho";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    f.text().then(s=>{
      s=s.split("\n");
      const arr=s[0].split(";").map(Number); const rows=arr.length/200;
      const params=JSON.parse(s[1]); const task=params.task; delete params.task;
      const tt=arr.slice(0,200), y=[];
      for(let c=0;c<200;c++){ const col=new Float64Array(rows-1); for(let r=1;r<rows;r++) col[r-1]=arr[r*200+c]; y.push(col); }
      if(task==="B"){ config.task="B"; config.solution_B=[{t:tt,y},params]; config.B=config.solution_B[1]; }
      else { config.task="C"; config.solution_C=[{t:tt,y},params]; config.C=config.solution_C[1]; }

    }); };

}
function askSave(cb){

function runs(s){ const out=[]; const parts=s.split("$");

/* Tk variables with write traces, and widgets addressed by name as in Panel.getobj */
const vars={}, objs={};
function StringVar(name,value){ const v={name,value:String(value),traces:[],
  get(){return this.value;}, set(x){ this.value=(x===null||x===undefined)?"None":(typeof x==="number"?pyRepr(x):String(x)); this.sync&&this.sync();
    if(this.busy) return;                       /* Tcl does not re-enter a variable's own write trace */
    this.busy=true; try{ this.traces.forEach(f=>f(this)); } finally{ this.busy=false; } }};
  vars[name]=v; return v; }
function setvar(name,value){ (vars[name]||StringVar(name,"")).set(value); }
function getobj(name){ const o=objs[name]; if(!o) throw new KeyErr(name); return o; }
function KeyErr(n){ this.n=n; }
function widget(name,el,kind){
  const o={el,kind,_state:"normal",_bg:null,
    get state(){return this._state;}, set state(v){ this._state=v; el.disabled=(v==="disabled"); },
    get background(){return this._bg;}, set background(v){ if(Array.isArray(v)) v=v[0]; this._bg=v; el.style.background=v; }};
  objs[name]=o; return o; }
const UI={
  widgets(desc){ for(const q in desc) for(const v in desc[q]) for(const e of desc[q][v]) getobj(e)[q]=v; },
  init(){ this.widgets({state:{normal:["entry_alpha","entry_beta","entry_T","entry_b"],disabled:["entry_L","button_calculate"],readonly:["combobox_task"]},
                       background:{"#55FF55":["button_calculate"],"#FFFFFF":["entry_alpha","entry_beta","entry_T","entry_b","entry_L"]}}); },
  calc_started(){ getobj("button_calculate").background=["#FFAAAA"];
    this.widgets({state:{disabled:["button_calculate","entry_alpha","entry_beta","entry_L","entry_T","entry_b","button_plot","entry_t"]}}); },
  calc_finished(){ setProgress(0); getobj("button_calculate").background=["#AAFFAA"];
    this.widgets({state:{normal:["button_calculate","entry_t","entry_alpha","entry_beta","entry_T","entry_b","button_save"]}});
    if(config.t!==null) getobj("button_plot").state="normal";
    if(config.task==="C") getobj("entry_L").state="normal"; },
  file_opened(){
    if(config.task==="B"){
      this.widgets({state:{normal:["entry_alpha","entry_beta","entry_T","entry_b","entry_t"],disabled:["entry_L","button_plot"]},
                    background:{"#FFFFFF":["entry_alpha","entry_beta","entry_T","entry_b","entry_L"]}});
      setvar("variable_task",config.task);
      setvar("variable_beta",config.B.beta); setvar("variable_T",config.B.T); setvar("variable_b",config.B.b); setvar("variable_alpha",config.B.alpha);
    } else {
      this.widgets({state:{normal:["entry_alpha","entry_beta","entry_T","entry_b","entry_L","entry_t"],disabled:["button_plot"]},
                    background:{"#FFFFFF":["entry_alpha","entry_beta","entry_T","entry_b","entry_L"]}});
      setvar("variable_task",config.task);
      setvar("variable_beta",config.C.beta); setvar("variable_T",config.C.T); setvar("variable_b",config.C.b); setvar("variable_alpha",config.C.alpha);
      setvar("entry_L",config.C.L);           /* sic: a Tcl variable called entry_L, not the field */
    } },
  switch_to_C(){ this.init(); config.task="C"; getobj("entry_L").state="normal";
    this.widgets({state:{normal:["entry_L"],disabled:["button_plot","button_save","button_calculate"]}});
    setvar("variable_task",config.task); getobj("entry_alpha"); },
  switch_to_B(){ this.init(); config.task="B"; config.B={alpha:null,beta:null,b:null,T:null};
    this.widgets({state:{disabled:["entry_L","button_plot","button_save","button_calculate"]}});
    vars.variable_task.set(String(config.task)); setvar("variable_alpha",String(config.B.alpha));
    setvar("variable_task",config.task); setvar("variable_alpha",config.B.alpha); setvar("variable_beta",config.B.beta);
    setvar("variable_T",config.B.T); setvar("variable_b",config.B.b);
    if(!("L" in config.B)) throw new KeyErr("L");          /* config.B["L"]: the KeyError the original stops at */
  }};
function setProgress(v){ $("pbar").style.width=Math.max(0,Math.min(1,v/config.full_progress))*100+"%"; }

function buildPanel(root){
  const p=document.createElement("div"); p.className="panel"; root.appendChild(p);
  const vs=px=>{ const d=document.createElement("div"); d.className="vs"; d.style.height=px+"px"; p.appendChild(d); };
  const lab=t=>{ const l=document.createElement("span"); l.className="lab"; l.textContent=t; p.appendChild(l); return l; };
  /* selector */
  lab("Select task:");
  const cb=document.createElement("div"); cb.className="cbx";
  cb.innerHTML='<span>B</span><i><svg width="7" height="4"><path d="M0 0l3.5 4L7 0z" fill="#000"/></svg></i><select><option>B</option><option>C</option></select>';
  p.appendChild(cb); widget("combobox_task",cb.querySelector("select"),"combobox");
  const vt=StringVar("variable_task","B"); vt.sync=()=>{ cb.querySelector("span").textContent=vt.value; cb.querySelector("select").value=vt.value; };
  vt.traces.push(()=>{ try{ if(vt.get()==="C"){ config.task="C"; UI.switch_to_C(); } else { config.task="B"; UI.switch_to_B(); } }
                       catch(e){ if(!(e instanceof KeyErr)) throw e; } });
  cb.querySelector("select").onchange=e=>{ vt.set(e.target.value); };
  vs(20);
  const param=(name,descr,min,max)=>{
    const v=StringVar("variable_"+name,"");
    lab(descr); const e=document.createElement("input"); e.className="ent r"; e.spellcheck=false; p.appendChild(e);
    widget("entry_"+name,e,"entry"); v.sync=()=>{ if(e.value!==v.value) e.value=v.value; };
    e.addEventListener("input",()=>v.set(e.value));
    v.traces.push(val=>{
      const res=check_entry_integrity(val.get(),min,max), D=config.task==="B"?config.B:config.C;
      if(res!==null){ D[name]=res; getobj("entry_"+name).background="#AAFFAA"; }
      else { D[name]=null; getobj("entry_"+name).background="#FFAAAA"; getobj("button_calculate").state="disabled"; }
      if(config.task==="B"&&!Object.values(config.B).includes(null)) getobj("button_calculate").state="normal";
      if(config.task==="C"&&!Object.values(config.C).includes(null)) getobj("button_calculate").state="normal";
    });
    e.addEventListener("blur",()=>{ const D=config.task==="B"?config.B:config.C; if(D[name]!==null&&D[name]!==undefined) getobj("entry_"+name).background="#DDFFDD"; });
  };
  param("alpha","α",0,1); vs(10); param("beta","β",0,500); vs(10); param("b","b",0,1); vs(10); param("T","T",0,100); vs(10); param("L","L",50,200);
  vs(40);
  const bc=document.createElement("button"); bc.className="btn"; bc.textContent="Solve"; p.appendChild(bc); widget("button_calculate",bc,"button");
  bc.onclick=()=>{ UI.calc_started(); const w=config.task;
    runCalc(w,setProgress).then(()=>UI.calc_finished()).catch(err=>{ console.error(err); }); };
  vs(5);
  const pb=document.createElement("div"); pb.className="pbar"; pb.innerHTML='<i id="pbar"></i>'; p.appendChild(pb);
  vs(40);
  const vtt=StringVar("variable_t","");
  lab("t:"); const et=document.createElement("input"); et.className="ent"; et.spellcheck=false; p.appendChild(et); widget("entry_t",et,"entry");
  vtt.sync=()=>{ if(et.value!==vtt.value) et.value=vtt.value; }; et.addEventListener("input",()=>vtt.set(et.value));
  vtt.traces.push(val=>{ try{
      const S=config.task==="B"?config.solution_B:config.solution_C; const tmax=S[1].T;
      const res=check_entry_integrity(val.get(),0,tmax);
      if(res!==null){ getobj("entry_t").background="#AAFFAA"; getobj("button_plot").state="normal"; config.t=res; }
      else { getobj("entry_t").background="#FFAAAA"; getobj("button_plot").state="disabled"; config.t=null; }
    }catch(e){ /* TypeError on a missing solution: Tk prints it and goes on */ } });
  vs(5);
  const bp=document.createElement("button"); bp.className="btn"; bp.textContent="Plot"; p.appendChild(bp); widget("button_plot",bp,"button");
  bp.onclick=()=>plot.update_plot();
  vs(40);
  const bs=document.createElement("button"); bs.className="btn"; bs.textContent="Save"; p.appendChild(bs); widget("button_save",bs,"button");
  bs.onclick=()=>save();
  vs(5);
  const bo=document.createElement("button"); bo.className="btn"; bo.textContent="Load"; p.appendChild(bo); widget("button_open",bo,"button");
  bo.onclick=()=>open_file(ok=>{ if(ok) UI.file_opened(); });
  [bc,bp,bs,bo].forEach(b=>b.onmousedown=e=>e.preventDefault());
  getobj("button_plot").state="disabled"; getobj("button_save").state="disabled"; getobj("entry_t").state="disabled";
  UI.init();
}

/* app.py: initGUI */
(function(){
  const root=$("root");
  root.appendChild(plot.fig.wrap); root.appendChild(plot.fig.bar);
  buildPanel(root);
  plot.update_plot();
})();

function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  $("t-h1").textContent=d.h1; $("t-h2").textContent=d.h2; $("t-note").innerHTML=d.note;
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":""; }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};
applyLang();
</script>
