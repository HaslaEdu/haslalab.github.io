/* ══════════════════════════════════════════════════════════════
   1.  RANDOM AND PHYSICS  (the same model as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const mulberry=mulberry32;
const rnd=mulberry32((Date.now()^0x2024e1)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const KB=8.61733e-5, R0=100.00, ALPHA=0.0039083, D_FAR=44.0;
const SX=[0,7,14,21,28,35,42];                  /* thermistors 1..7, cm from thermistor 1 */
/* the apparatus of this session (the official solution is matched by the mean values) */
const K={
  P1:1.95, P2:5.00, P3r:0.600*(1+0.010*gauss()),
  CS:49.8*(1+0.010*gauss()), gamma:710e-6*(1+0.008*gauss()), Eg:0.6983*(1+0.004*gauss()), R9_0:0.012012,
  lam:0.0530*(1+0.012*gauss()), g0:3.446*(1+0.010*gauss()),
  room:24.60+0.25*gauss(), boxGain:0.42, env:25.87+0.25*gauss()
};
const DELAY=32, TAU_LONG=420, TAU_BOX=240;
const gfun=x=>K.g0*(Math.exp(-K.lam*x)+Math.exp(-2*K.lam*D_FAR)*Math.exp(K.lam*x));
const PH={ t:0, short:K.env, tb:K.room, long:SX.map(()=>K.room), hist:[] };
/* the state of the panel and the plug */
const ST={ plug:false, sw:{fan:false,h1:false,h2:false,h3:false}, show9:false,
           timer:0, run:false, laps:[], view:-1, lapDown:null, lapErased:false, press:null };
const powered=()=>ST.plug;
function heatersOn(){ const p=powered(); return [p&&ST.sw.h1, p&&ST.sw.h2, p&&ST.sw.h3]; }
function steadyLong(){
  const [,h2,h3]=heatersOn(), P2=h2?K.P2:0, P3=h3?K.P2*K.P3r:0;
  const tb=K.room+K.boxGain*(P2+P3);
  let prof=SX.map(x=>tb+P2*gfun(x)+P3*gfun(42-x));
  if(!(powered()&&ST.sw.fan)) prof=prof.map(v=>tb+(v-tb)*1.35);       /* weaker convection without the fans */
  return [prof,tb];
}
function physStep(dt){
  let left=dt;
  while(left>1e-9){
    const h=Math.min(1.0,left); left-=h;
    const [h1]=heatersOn(), P1=h1?K.P1:0;
    PH.short+=(P1/K.CS-K.gamma*(PH.short-K.env))*h;
    const [prof,tb]=steadyLong(), a=1-Math.exp(-h/TAU_LONG), b=1-Math.exp(-h/TAU_BOX);
    for(let i=0;i<7;i++) PH.long[i]+=(prof[i]-PH.long[i])*a;
    PH.tb+=(tb-PH.tb)*b;
    PH.t+=h;
    PH.hist.push([PH.t,PH.short,PH.long.slice(),PH.tb]);
    while(PH.hist.length>2&&PH.hist[1][0]<PH.t-DELAY-5) PH.hist.shift();
  }
}
PH.hist.push([0,PH.short,PH.long.slice(),PH.tb]);
function delayed(){ const tgt=PH.t-DELAY; for(const e of PH.hist) if(e[0]>=tgt) return e; return PH.hist[PH.hist.length-1]; }
const q=(v,s)=>Math.round(v/s)*s;
/* what the AVA monitor shows: refreshed every 2 s */
let reading=null, readT=-1e9;
function readAVA(){
  if(reading&&PH.t-readT<2) return reading;
  const [,ths,thl,thb]=delayed();
  const Rpt=R0*(1+ALPHA*(ths+0.004*gauss()));
  const Tk=ths+273.15+0.010*gauss();
  const R9=K.R9_0*Math.exp(K.Eg/(2*KB*Tk));
  reading={R:q(Rpt,0.01), R9:Math.round(R9*(1+0.0015*gauss())), th:thl.map(v=>q(v+0.012*gauss(),0.01)), tb:q(thb+0.012*gauss(),0.01)};
  readT=PH.t; return reading;
}
const hotWarn=()=>powered()&&ST.sw.h1&&readAVA().R>=121;

/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  const sx=CAM.W/2+CAM.px+xr*CAM.k, sy=CAM.H/2+CAM.py-up*CAM.k;
  if(_REC) _REC.set(sx+","+sy,dep);
  return [sx, sy, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;

  return [x0, CAM.ty+dy, CAM.tz+dz];

  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));
  v=a<1?`rgba(${r[0]},${r[1]},${r[2]},${a})`:`rgb(${r[0]},${r[1]},${r[2]})`;

const LIGHT=(()=>{ const v=[-0.45,0.85,0.35], n=Math.hypot(...v); return v.map(a=>a/n); })();

function _cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
function _sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
/* a flat polygon; o = {fill, stroke, lw, id, layer, cull, flat, bias, alpha} */

  o=o||{};
  const n=_cross(_sub(pts[1],pts[0]),_sub(pts[2],pts[0])), nl=Math.hypot(...n)||1;
  const nn=n.map(a=>a/nl);

  if(!o.noBot) face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],f);          /* bottom -y */
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f);          /* +z */
  face([[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],f);          /* -z */
  face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],f);          /* +x */

/* make a polygon face the direction `want` (a world vector) */

  return (n[0]*want[0]+n[1]*want[1]+n[2]*want[2])<0?pts.slice().reverse():pts;

/* cylinder (or cone, with o.r1) along an axis ("x","y","z") from a0 to a1, centre (u,v) across it */

  const pt=(a,rr,ang)=>W(a,u+rr*Math.cos(ang),v+rr*Math.sin(ang));

    const q=[pt(a0,r,t0),pt(a0,r,t1),pt(a1,r1,t1),pt(a1,r1,t0)];
    const rad=_sub(pt(a0,1,tm),pt(a0,0,tm));

/* a prism: polygon pts2 [[u,v]..] in the plane across `axis`, extruded from a0 to a1 */
function prism3(axis,a0,a1,pts2,col,o){

/* tall parts cut into short slices, so each slice is sorted at its own height
   (one long face sorted by its centre is what makes posts jump in front of things) */
function boxY(x0,x1,y0,y1,z0,z1,col,o,step){ const n=Math.max(1,Math.ceil((y1-y0)/(step||1)));
  for(let i=0;i<n;i++) box3(x0,x1,y0+(y1-y0)*i/n,y0+(y1-y0)*(i+1)/n,z0,z1,col,Object.assign({},o,{noTop:i<n-1,noBot:i>0})); }
function cylSeg(axis,a0,a1,u,v,r,col,o,step){ const n=Math.max(1,Math.ceil(Math.abs(a1-a0)/(step||1)));
  for(let i=0;i<n;i++) cyl3(axis,a0+(a1-a0)*i/n,a0+(a1-a0)*(i+1)/n,u,v,r,col,Object.assign({},o,{cap0:i===0&&(o||{}).cap0!==false,cap1:i===n-1&&(o||{}).cap1!==false})); }
function line3(a,b,col,lw,o){ ITEMS.push({t:"l",p:[a,b],o:Object.assign({col,lw:lw||1},o||{})}); }
function poly3(pts,col,lw,o){ ITEMS.push({t:"pl",p:pts,o:Object.assign({col,lw:lw||1},o||{})}); }
/* text lying in the plane spanned by U (right) and V (up), size in cm */
function text3(O,U,V,str,size,col,o){ ITEMS.push({t:"x",p:[O],O,U,V,str,size,o:Object.assign({col},o||{})}); }
/* anything else: draw(ctx) is called in its depth order; ref is a world point */
function custom3(ref,draw,o){ ITEMS.push({t:"c",p:[ref],draw,o:o||{}}); }

function render3_2d(ctx){
  const vis=[];
  for(const it of ITEMS){
    const q=it.p.map(p=>P3(p[0],p[1],p[2]));
    let dep=0; for(const v of q) dep+=v[2]; dep/=q.length;
    if(it.t==="f"&&it.o.cull){
      let a=0; for(let i=0;i<q.length;i++){ const j=(i+1)%q.length; a+=q[i][0]*q[j][1]-q[j][0]*q[i][1]; }
      if(a>=0) continue;                                  /* facing away */
    }
    vis.push({it,q,dep:dep+(it.o.bias||0),layer:it.o.layer||0});
  }
  vis.sort((a,b)=>a.layer-b.layer||a.dep-b.dep);

    const it=v.it, o=it.o, q=v.q;
    if(it.t==="f"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]); ctx.closePath();
      if(o.fill){ if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.fillStyle=o.flat?o.fill:shade(o.fill,it.lum); ctx.fill(); ctx.globalAlpha=1; }
      if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=o.lw||0.8; ctx.lineJoin="round"; ctx.stroke(); }
      else if(o.fill&&o.alpha===undefined){ ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=0.6; ctx.stroke(); }
      if(o.id) HITS.push([o.id,q]);
    }else if(it.t==="l"||it.t==="pl"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]);
      ctx.strokeStyle=o.col; ctx.lineWidth=o.lw; ctx.lineCap=o.cap||"round"; ctx.lineJoin="round";
      if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.stroke(); ctx.globalAlpha=1;
    }else if(it.t==="x"){

/* ══════════════════════════════════════════════════════════════

   so parts can no longer show through one another from some angles
   (the 2-D painter above stays as the fallback without WebGL)
   ══════════════════════════════════════════════════════════════ */
function sphere3(c,r,col,o){ if(!gl3Init()) return sphere3_2d(c,r,col,o); ITEMS.push({t:"sp",p:[c],c,r,col,o:o||{}}); }

const GL3={ok:null};
function gl3Init(){

                  "precision mediump float;varying vec4 v;void main(){gl_FragColor=v;}");

const add3=(a,b,s)=>[a[0]+b[0]*(s===undefined?1:s),a[1]+b[1]*(s===undefined?1:s),a[2]+b[2]*(s===undefined?1:s)];
function bez(P0,P1,P2,P3,n){ const out=[]; for(let i=0;i<=n;i++){ const t=i/n,u=1-t;
  out.push([0,1,2].map(j=>u*u*u*P0[j]+3*u*u*t*P1[j]+3*u*t*t*P2[j]+t*t*t*P3[j])); } return out; }

function tube(pts,r,col,o){ o=o||{}; const lw=Math.max(1.2,2*r*CAM.k);

  if(o.id){ const step=Math.max(1,Math.floor(pts.length/10)); for(let i=0;i<pts.length;i+=step) sphere3(pts[i],r*1.6,"rgba(0,0,0,0.004)",{id:o.id}); } }

let msg={k:null,a:[],t:0};
function say(k,...a){ msg={k,a,t:performance.now()}; renderStatus(); }
const SWNAME={fan:"FAN",h1:"HEATER 1",h2:"HEATER 2",h3:"HEATER 3"};
function avaPress(k){
  if(k in ST.sw){ ST.sw[k]=!ST.sw[k]; say("sw",SWNAME[k],ST.sw[k]); return; }
  if(k==="tog"){ ST.show9=!ST.show9; say("toggle",ST.show9?"R9":"θb"); return; }
  ST.press=k; setTimeout(()=>{ if(ST.press===k) ST.press=null; },180);
  if(!powered()){ say("noPower"); return; }
  if(k==="start"){ ST.run=!ST.run; say(ST.run?"start":"stop"); return; }
  if(k==="next"||k==="prev"){
    if(!ST.laps.length){ say("none"); return; }
    if(ST.view<0) ST.view=ST.laps.length-1;
    else ST.view=Math.max(0,Math.min(ST.laps.length-1,ST.view+(k==="next"?1:-1)));
    say("browse",ST.view+1); return; }
  if(k==="lap"){ ST.lapDown=performance.now(); ST.lapErased=false; }
}
function lapRelease(){
  if(ST.lapDown===null) return;
  const held=performance.now()-ST.lapDown; ST.lapDown=null;
  if(ST.lapErased||held>=5000) return;
  if(ST.view>=0){ ST.view=-1; say("exit"); return; }
  if(ST.run){ const r=readAVA();
    ST.laps.push({t:Math.floor(ST.timer),th:r.th.slice(),tb:r.tb,R:r.R,R9:r.R9}); say("lap",ST.laps.length); renderMem(); }
  else { ST.timer=0; say("reset"); }
}
function eraseLaps(){ ST.laps=[]; ST.view=-1; renderMem(); }
function togglePlug(){
  ST.plug=!ST.plug;
  if(ST.plug){ readT=-1e9; reading=null; say("plugIn"); }
  else { ST.run=false; ST.timer=0; eraseLaps(); say("plugOut"); }
}

/* ══════════════════════════════════════════════════════════════
   7.  HISTORY  —  a snapshot every few simulated seconds, and one
       before each action, so time can be wound back
   ══════════════════════════════════════════════════════════════ */
let HIST=[], UNDO=[], recAt=-1e9;
function snapshot(kind){ return {t:PH.t,kind,at:performance.now(),PH:structuredClone(PH),
  ST:structuredClone(Object.assign({},ST,{lapDown:null,press:null})),reading:reading?structuredClone(reading):null,readT}; }
function restore(sn){
  Object.assign(PH,structuredClone(sn.PH)); Object.assign(ST,structuredClone(sn.ST)); reading=sn.reading?structuredClone(sn.reading):null; readT=sn.readT;
  HIST=HIST.filter(h=>h.t<=sn.t+1e-9); UNDO=UNDO.filter(h=>h.t<=sn.t+1e-9);
  acc=0; recAt=sn.t; scrSig=""; renderMem(); renderStatus(); syncScrub();
}
function record(){
  if(PH.t-recAt<5&&HIST.length) return;
  recAt=PH.t; HIST.push(snapshot("t"));
  if(HIST.length>1600){ const keep=[]; HIST.forEach((h,i)=>{ if(i>=800||i%2===0) keep.push(h); }); HIST=keep; }
}
function act(kind){ UNDO.push(snapshot(kind)); if(UNDO.length>80) UNDO.shift(); }
function rewind(sec){
  const target=PH.t-sec; let sn=null;
  for(let i=HIST.length-1;i>=0;i--) if(HIST[i].t<=target+1e-9){ sn=HIST[i]; break; }
  if(!sn) sn=HIST[0];
  if(!sn){ note(d().noHist,true); return; }
  restore(sn); note(d().rewound());
}
function undo(){ const sn=UNDO.pop(); if(!sn){ note(d().noHist,true); return; } restore(sn); note(d().undone); }
let scrubbing=false;
function syncScrub(){ if(scrubbing) return; const s=$("scrub"); s.max=Math.max(1,HIST.length); s.value=HIST.length; }
$("scrub").addEventListener("input",()=>{ scrubbing=true; });
$("scrub").addEventListener("change",e=>{ scrubbing=false; const i=+e.target.value;
  if(i<HIST.length){ restore(HIST[i]); note(d().rewound()); } syncScrub(); });
let own=null;
function note(s,warn){ own={s,warn:!!warn,t:performance.now()}; renderStatus(); }

/* ══════════════════════════════════════════════════════════════
   8.  THE APPARATUS LIST (left)
   ══════════════════════════════════════════════════════════════ */
const TRAY_ROW=48; let trayCells=[];
function trayIcon(c,k,x,y){
  const R2=(a,b,e,f,fill,out)=>{ if(fill){c.fillStyle=fill;c.fillRect(a,b,e-a,f-b);} if(out){c.strokeStyle=out;c.lineWidth=1;c.strokeRect(a+.5,b+.5,e-a-1,f-b-1);} };
  if(k==="panel"){ R2(x-15,y-10,x+15,y+10,"#0c0d10","#3a3c42"); R2(x-3,y-6,x+7,y+3,"#69ff63"); R2(x-12,y-6,x-7,y+6,"#222"); c.strokeStyle="#38c6ea"; c.strokeRect(x+9.5,y-6.5,4,6); }
  else if(k==="below"){ R2(x-16,y-8,x+16,y+8,"#1a1b1e","#3a3c42"); for(let i=0;i<4;i++){ c.strokeStyle="#55585e"; c.beginPath(); c.arc(x-12+i*8,y-1,3.5,0,7); c.stroke(); } R2(x-16,y+3,x+16,y+5,"#c47a45"); }
  else if(k==="short"){ R2(x-14,y-6,x+12,y+6,"#f1efe8","#b8b4aa"); R2(x+12,y-1,x+17,y+1,"#d8432c"); R2(x-17,y-1,x-14,y+1,"#b8bec4"); }
  else if(k==="back"){ R2(x-8,y-11,x+8,y+11,"#f7f7f4","#999"); R2(x-5,y+2,x+5,y+7,"#333"); R2(x-6,y-6,x+6,y-4,"#555"); }
  else if(k==="psu"){ R2(x-12,y-6,x+8,y+6,"#1b1c1f","#3a3c42"); R2(x+8,y-1,x+13,y+1,"#151618"); R2(x+13,y-3,x+17,y+3,"#26272a"); }
  else { R2(x-16,y+4,x+16,y+8,"#cfcfca"); R2(x-10,y-6,x+10,y+4,"#1a1b1e"); R2(x-14,y-1,x-10,y+2,"#f1efe8"); R2(x+10,y-1,x+14,y+2,"#f1efe8"); }
}
function drawTray(){
  const c=trayCtx, t=d(); c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[]; let y=6; const wd=TRW-12;
  for(const [k,name,sub] of t.trayItems){
    const sel=VIEW===k;
    c.fillStyle=sel?"#2a2f37":"#1f242b"; c.fillRect(6,y,wd,TRAY_ROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TRAY_ROW-5);
    trayIcon(c,k,28,y+(TRAY_ROW-4)/2);
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle="#e8eef2"; c.fillText(name,52,y+15);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#7b848d"; c.fillText(sub,52,y+31);
    trayCells.push([k,y,y+TRAY_ROW-4]); y+=TRAY_ROW;
  }
  c.font='10.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
trayCv.addEventListener("pointerdown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top;
  for(const [k,y0,y1] of trayCells) if(y>=y0&&y<=y1){ goTo(k); drawTray(); return; }
});

/* ══════════════════════════════════════════════════════════════
   9.  HANDS ON THE BENCH
   ══════════════════════════════════════════════════════════════ */
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const LIVE=/^(fan|h[123]|tog|next|start|prev|lap|mains|outlet|pan|scr|front|back|top|end[LR]|rod|short|psu)$/;
function clickAction(t){
  if(!t) return false;
  if(/^(fan|h[123]|tog|next|start|prev|lap)$/.test(t)){ act("ava"); avaPress(t); scrSig=""; return true; }
  if(t==="mains"||(t==="outlet"&&!ST.plug)){ act("plug"); togglePlug(); scrSig=""; return true; }
  const fly={pan:"panel",scr:"panel",front:"panel",back:"back",top:"top",endL:"below",endR:"below",rod:"below",short:"short",psu:"psu"}[t];
  if(fly) return goTo(fly);
  return false;
}
let down=null;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  const p=mousePos(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(e.button===1||e.button===2){ down={p0:p,last:p,pan:true,moved:false}; return; }
  if(e.button!==0) return;
  const t=pick3(p[0],p[1]);
  if(t&&/^(fan|h[123]|tog|next|start|prev|lap|mains|outlet)$/.test(t)){ clickAction(t); return; }
  down={p0:p,last:p,pan:e.shiftKey,moved:false,t};
});
cv.addEventListener("pointermove",e=>{
  const p=mousePos(e), dn=down;
  if(!dn){ const t=pick3(p[0],p[1]); cv.classList.toggle("hand",!!(t&&LIVE.test(t))); return; }
  if(Math.hypot(p[0]-dn.p0[0],p[1]-dn.p0[1])>5) dn.moved=true;
  if(!dn.moved) return;
  const dx=p[0]-dn.last[0], dy=p[1]-dn.last[1]; dn.last=p;
  CAM.touched=true; CAMTW=null; renderViewBtn();
  if(dn.pan){ CAM.px+=dx; CAM.py+=dy; }
  else { CAM.yaw+=dx*0.008;
    if(CAM.pitch<0) CAM.pitch=Math.min(-0.08,Math.max(-1.45,CAM.pitch+dy*0.006));
    else CAM.pitch=Math.min(1.45,Math.max(0.04,CAM.pitch+dy*0.006)); }
  cv.classList.add("dragging");
});
cv.addEventListener("pointerup",e=>{
  const dn=down; down=null; cv.classList.remove("dragging");
  if(dn&&!dn.moved&&!dn.pan&&dn.t) clickAction(dn.t);
});
window.addEventListener("pointerup",()=>lapRelease());
$("viewBack").onclick=()=>goTo("all");
cv.addEventListener("dblclick",e=>{ const p=mousePos(e), t=pick3(p[0],p[1]); if(t&&LIVE.test(t)) return; goTo("all"); });
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=mousePos(e), dir=e.deltaY<0?1:-1;
  CAM.touched=true; CAMTW=null; renderViewBtn();
  const f=dir>0?1.12:1/1.12, nk=Math.min(140,Math.max(3,CAM.k*f)), r=nk/CAM.k;
  CAM.px=(p[0]-CAM.W/2)-(p[0]-CAM.W/2-CAM.px)*r; CAM.py=(p[1]-CAM.H/2)-(p[1]-CAM.H/2-CAM.py)*r; CAM.k=nk;
},{passive:false});
addEventListener("keydown",e=>{ if(e.key==="Escape") goTo("all"); });
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.code==="KeyZ"){ e.preventDefault(); undo(); return; }
  if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); running=!running; renderSpeeds(); } });

/* ══════════════════════════════════════════════════════════════
   10.  SIDE PANEL, LANGUAGE, MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let speed=1, running=true;
function renderMem(){
  const box=$("mem");
  if(!ST.laps.length){ box.textContent=d().memEmpty; return; }
  box.innerHTML=ST.laps.map((l,i)=>"<div>"+String(i+1).padStart(2,"0")+"  t="+String(l.t).padStart(5,"0")+" s  R="+l.R.toFixed(2)+" Ω<br>&nbsp;&nbsp;θ1–7: "+
    l.th.map(v=>v.toFixed(2)).join(" ")+"<br>&nbsp;&nbsp;θb="+l.tb.toFixed(2)+" °C  R9="+l.R9+" Ω</div>").join("");
  box.scrollTop=box.scrollHeight;
}
function renderStatus(){
  const L_=[], t=d();
  if(!powered()) L_.push([t.st.off,false]);
  if(hotWarn()) L_.push([t.st.hot,true]);
  if(ST.view>=0) L_.push([t.st.browse,false]);
  if(ST.lapDown!==null&&performance.now()-ST.lapDown>600&&!ST.lapErased) L_.push([t.st.hold,false]);
  if(!running) L_.push([t.st.paused,true]);
  if(msg.k&&performance.now()-msg.t<9000){ const f=t.m[msg.k]; if(f!==undefined) L_.push(["• "+(typeof f==="function"?f(...msg.a):f),false]); }
  if(own&&performance.now()-own.t<9000) L_.push(["• "+own.s,own.warn]);
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L_){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
function renderSpeeds(){
  const box=$("speeds"); box.innerHTML="";
  for(const sp of [1,10,60,300]){ const b=document.createElement("button"); b.textContent="×"+sp; if(sp===speed) b.className="on";
    b.onclick=()=>{ speed=sp; renderSpeeds(); }; box.appendChild(b); }
  const p=document.createElement("button"); p.textContent=running?"❚❚":"▶"; p.title=running?d().pause:d().run;
  if(!running) p.className="on"; p.onclick=()=>{ running=!running; renderSpeeds(); }; box.appendChild(p);
}
function renderRewind(){
  const box=$("rewind"); box.innerHTML="";
  for(const [lbl,sec] of d().rw){ const b=document.createElement("button"); b.textContent=lbl; b.onclick=()=>rewind(sec); box.appendChild(b); }
  const u=document.createElement("button"); u.textContent=d().undo; u.onclick=undo; u.style.flex="1.6"; box.appendChild(u);
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("t-benchcap").textContent=t.benchcap; $("t-tray").textContent=t.tray;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint; $("t-h-how").textContent=t.hHow;
  $("t-howto").textContent=t.howto; $("t-h-mem").textContent=t.hMem;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2024 E1 — 구리 막대의 열전도 · HaslaLab":"IPhO 2024 E1 — Heat Conduction in a Copper Rod · HaslaLab";
  drawTray(); renderSpeeds(); renderRewind(); renderMem(); renderStatus(); renderViewBtn();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

let last=performance.now(), acc=0, ui=0;
function tick(){
  const now=performance.now(); let real=(now-last)/1000; last=now; if(real>0.25) real=0.25;
  if(running){
    acc+=real*speed; const budget=performance.now()+20;
    while(acc>1e-9){ const dt=Math.min(1,acc); physStep(dt); if(powered()&&ST.run) ST.timer+=dt; acc-=dt; record(); if(performance.now()>budget){ acc=0; break; } }
  }
  if(ST.lapDown!==null&&!ST.lapErased&&performance.now()-ST.lapDown>=5000){ ST.lapErased=true; eraseLaps(); say("erase"); }
  if(powered()&&ST.sw.fan) fanAng+=real*(running?22:0);
  if(CW>10) draw();
  if(++ui%8===0){ renderStatus(); syncScrub(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
paintStatic(); layout(); applyLang(); record(); requestAnimationFrame(tick);
</script>
