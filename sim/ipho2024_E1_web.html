/* ══════════════════════════════════════════════════════════════
   1.  RANDOM AND PHYSICS  (the same model as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2024e1)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const KB=8.61733e-5, R0=100.00, ALPHA=0.0039083, D_FAR=44.0;
const SX=[0,7,14,21,28,35,42];                  /* thermistors 1..7, cm from the end of heater 2 */
/* the apparatus of this session (the official solution is matched by the mean values) */
const K={
  P1:1.95, P2:5.00, P3r:0.600*(1+0.010*gauss()),
  CS:49.8*(1+0.010*gauss()), gamma:710e-6*(1+0.008*gauss()), Eg:0.6983*(1+0.004*gauss()), R9_0:0.012012,
  lam:0.0530*(1+0.012*gauss()), g0:3.446*(1+0.010*gauss()),
  room:24.60+0.25*gauss(), boxGain:0.42, env:25.87+0.25*gauss()
};
const DELAY=32, TAU_LONG=420, TAU_BOX=240;
const gfun=x=>K.g0*(Math.exp(-K.lam*x)+Math.exp(-2*K.lam*D_FAR)*Math.exp(K.lam*x));
const PH={ t:0, short:K.env, tb:K.room, long:SX.map(()=>K.room), hist:[] };
function heatersOn(){ const p=powered(); return [p&&ST.sw.h1, p&&ST.sw.h2, p&&ST.sw.h3]; }
function steadyLong(){
  const [,h2,h3]=heatersOn(), P2=h2?K.P2:0, P3=h3?K.P2*K.P3r:0;
  const tb=K.room+K.boxGain*(P2+P3);
  let prof=SX.map(x=>tb+P2*gfun(x)+P3*gfun(42-x));
  if(!(powered()&&ST.sw.fan)) prof=prof.map(v=>tb+(v-tb)*1.35);       /* weaker convection without the fans */
  return [prof,tb];
}
function physStep(dt){
  let left=dt;
  while(left>1e-9){
    const h=Math.min(1.0,left); left-=h;
    const [h1]=heatersOn(), P1=h1?K.P1:0;
    PH.short+=(P1/K.CS-K.gamma*(PH.short-K.env))*h;
    const [prof,tb]=steadyLong(), a=1-Math.exp(-h/TAU_LONG), b=1-Math.exp(-h/TAU_BOX);
    for(let i=0;i<7;i++) PH.long[i]+=(prof[i]-PH.long[i])*a;
    PH.tb+=(tb-PH.tb)*b;
    PH.t+=h;
    PH.hist.push([PH.t,PH.short,PH.long.slice(),PH.tb]);
    while(PH.hist.length>2&&PH.hist[1][0]<PH.t-DELAY-5) PH.hist.shift();
  }
}
PH.hist.push([0,PH.short,PH.long.slice(),PH.tb]);
function delayed(){ const tgt=PH.t-DELAY; for(const e of PH.hist) if(e[0]>=tgt) return e; return PH.hist[PH.hist.length-1]; }
const q=(v,s)=>Math.round(v/s)*s;
/* what the AVA monitor shows: refreshed every 2 s */
let reading=null, readT=-1e9;
function readAVA(){
  if(reading&&PH.t-readT<2) return reading;
  const [,ths,thl,thb]=delayed();
  const Rpt=R0*(1+ALPHA*(ths+0.004*gauss()));
  const Tk=ths+273.15+0.010*gauss();
  const R9=K.R9_0*Math.exp(K.Eg/(2*KB*Tk));
  reading={R:q(Rpt,0.01), R9:Math.round(R9*(1+0.0015*gauss())), th:thl.map(v=>q(v+0.012*gauss(),0.01)), tb:q(thb+0.012*gauss(),0.01)};
  readT=PH.t; return reading;
}

  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  CLW=Math.max(300,Math.floor(closeCv.parentElement.getBoundingClientRect().width-20)); CLH=Math.round(CLW*0.40);
  closeCv.style.height=CLH+"px"; closeCv.width=Math.round(CLW*tdpr); closeCv.height=Math.round(CLH*tdpr);
  const h=CLH-16, w1=Math.round(Math.min(CLW*0.58,h*600/360));
  P1={x:8,y:8,w:w1,h}; P2={x:16+w1,y:8,w:CLW-24-w1,h};
  drawTray();
}
function drawTray(){
  const dpr=window.devicePixelRatio||1, c=trayCtx, t=d();
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[]; let y=6; const wd=TRW-12;
  for(const k of TRAY_LIST){
    const av=trayAvail(k), sel=hand&&hand.k===k;
    c.fillStyle=av?"#1f242b":"#171a1e"; c.fillRect(6,y,wd,TROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TROW-5);
    const old=ctx; ctx=c; ctx.save(); ctx.globalAlpha=av?1:0.35; icon(k,28,y+(TROW-4)/2,0.62); ctx.restore(); ctx=old;
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=av?"#e8eef2":"#868e96";
    const nm=itemName(k); if(c.measureText(nm).width>wd-52){ const p=nm.split(" · "); c.font='11px "Malgun Gothic",sans-serif'; c.fillText(p.length>2?p[0]+" · "+p[1]+" ·":nm,52,y+11); if(p.length>2) c.fillText(p[2],52,y+24); }
    else c.fillText(nm,52,y+14);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a";
    c.fillText(av?t.trayTake:t.trayOut,52,y+36);
    trayCells.push([k,y,y+TROW-4]); y+=TROW;
  }
  c.font='10.5px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
let fanAng=0;
function panelBg(P,col){ ctx.fillStyle=col; ctx.fillRect(P.x,P.y,P.w,P.h); ctx.strokeStyle="#353b43"; ctx.lineWidth=1; ctx.strokeRect(P.x+0.5,P.y+0.5,P.w-1,P.h-1); }
function drawClose(){
  const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CLW,CLH);
  /* left: the panel */
  panelBg(P1,"#101216");
  if(ST.on.box){ const s=Math.min(P1.w/600,P1.h/360); P1.s=s; P1.ox=P1.x+(P1.w-600*s)/2; P1.oy=P1.y+(P1.h-360*s)/2; drawAVA(P1.ox,P1.oy,s,false); }
  else text(d().st.none,P1.x+P1.w/2,P1.y+P1.h/2,"#69717a",12,"center");
  /* right: the box from below and the short rod */
  panelBg(P2,"#1a1c20");
  if(ST.on.box) drawBelow(P2); else text("—",P2.x+P2.w/2,P2.y+P2.h/2,"#69717a",12,"center");
  ctx=old;
}
function drawBelow(P){
  const t=d(), k=P.w/64, x0=P.x+4*k;          /* 1 unit = 1 cm of the rod, rod from x0 to x0+57k */
  ctx.save(); ctx.beginPath(); ctx.rect(P.x,P.y,P.w,P.h); ctx.clip();
  text(t.lab.below,P.x+8,P.y+12,"#9aa3ab",11);
  const yR=P.y+P.h*0.40, fanR=Math.min(6.4*k,P.h*0.17);
  fillR(x0-2*k,yR-fanR-14,61*k,2*fanR+28,4,"#0d0e10","#2e3036",1.5);
  for(let i=0;i<4;i++){ const fx=x0+(8.5+i*13.3)*k;
    circ(fx,yR,fanR,"#141518","#2a2b30",1.2); ctx.save(); ctx.translate(fx,yR); ctx.rotate(fanAng+i*0.7);
    for(let b=0;b<7;b++){ ctx.rotate(2*Math.PI/7); ctx.fillStyle="#26272c"; ctx.beginPath(); ctx.ellipse(fanR*0.55,0,fanR*0.42,fanR*0.16,0.5,0,7); ctx.fill(); }
    ctx.restore(); circ(fx,yR,fanR*0.25,"#1c1d21","#33353b"); }
  /* the rod, its two sleeves and the heaters inside */
  const rr=Math.max(3,0.6*k);
  ctx.fillStyle=vgrad(yR-rr,2*rr,[[0,"#e8a070"],[0.5,"#b8642e"],[1,"#7a3c18"]]); ctx.fillRect(x0,yR-rr,57*k,2*rr);
  for(const [sx,lab] of [[x0-0.5*k,t.lab.heater2],[x0+50.5*k,t.lab.heater3]]){
    fillR(sx,yR-2.2*k,7*k,4.4*k,2.2*k,"rgba(240,238,232,.93)","#b8b4aa",1);
    ctx.fillStyle="#d43a2a"; ctx.fillRect(sx+(lab===t.lab.heater2?0.5:1.3)*k,yR-0.25*k,5.2*k,0.5*k);
    text(lab,sx+3.5*k,yR+3.4*k,"#f0a080",10,"center","700"); }
  /* the thermistors */
  for(let i=0;i<7;i++){ const sx=x0+(7.5+SX[i])*k;
    ctx.strokeStyle="#e8eef2"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(sx,yR-rr); ctx.lineTo(sx+3,yR-fanR-8); ctx.stroke();
    circ(sx,yR,Math.max(2,rr*0.45),"#20242a","#e8eef2",1); text(String(i+1),sx,yR+rr+10,"#f2c14e",11,"center","700"); }
  const s8=x0+29*k; ctx.strokeStyle="#e8eef2"; ctx.beginPath(); ctx.moveTo(s8,yR-fanR-14); ctx.lineTo(s8,yR-fanR*0.55); ctx.stroke();
  circ(s8,yR-fanR*0.55,3,"#5ab0ff"); text(t.lab.box8,s8+6,yR-fanR*0.55,"#7fc4ff",9.5,"left");
  for(let i=0;i<6;i++){ const a=x0+(7.5+SX[i])*k, b=x0+(7.5+SX[i+1])*k, yy=yR+rr+24;
    ctx.strokeStyle="#69717a"; ctx.beginPath(); ctx.moveTo(a,yy); ctx.lineTo(b,yy); ctx.stroke(); text("7.0 cm",(a+b)/2,yy+8,"#9aa3ab",8.5,"center"); }
  /* Fig. 4: the short rod */
  const y4=P.y+P.h*0.80, L=Math.min(P.w*0.62,34*k), xs=P.x+(P.w-L)/2, hh=Math.max(14,P.h*0.09);
  text(t.lab.short,P.x+8,y4-hh-14,"#9aa3ab",11);
  ctx.fillStyle="#e8803a"; ctx.fillRect(xs,y4-hh/2,L,hh);
  ctx.strokeStyle="rgba(120,50,10,.45)"; ctx.lineWidth=1; for(let u=0;u<L+hh;u+=8){ ctx.beginPath(); ctx.moveTo(xs+u,y4-hh/2); ctx.lineTo(xs+u-hh,y4+hh/2); ctx.stroke(); }
  ctx.fillStyle="#e02a1e"; ctx.fillRect(xs+L*0.56,y4-hh*0.38,L*0.44,hh*0.76); text(t.lab.heater1,xs+L*0.78,y4,"#fff",10,"center","700");
  ctx.fillStyle="#8c8f94"; ctx.fillRect(xs,y4,L*0.42,hh*0.36); text(t.lab.pt100,xs+L*0.21,y4+hh*0.18,"#111",8.5,"center","700");
  ctx.fillStyle="#3aa04a"; ctx.fillRect(xs+L*0.18,y4-hh*0.44,L*0.08,hh*0.36); text(t.lab.r9,xs+L*0.22,y4-hh*0.26,"#fff",8,"center","700");
  ctx.strokeStyle="#d43a2a"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(xs+L,y4-3); ctx.lineTo(xs+L+16,y4-3); ctx.moveTo(xs+L,y4+3); ctx.lineTo(xs+L+16,y4+3); ctx.stroke();
  ctx.strokeStyle="#111"; ctx.lineWidth=1.5; for(const dy of [-hh*0.3,-hh*0.1,hh*0.15]){ ctx.beginPath(); ctx.moveTo(xs-16,y4+dy); ctx.lineTo(xs+4,y4+dy); ctx.stroke(); }
  ctx.strokeStyle="#69717a"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(xs,y4+hh/2+10); ctx.lineTo(xs+L,y4+hh/2+10); ctx.stroke(); text("12.0 cm",xs+L/2,y4+hh/2+19,"#9aa3ab",9,"center");
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════
   7.  THE AVA KEYS AND SWITCHES
   ══════════════════════════════════════════════════════════════ */
const SWNAME={fan:"FAN",h1:"HEATER 1",h2:"HEATER 2",h3:"HEATER 3"};
function avaPress(k){
  if(!ST.on.box) return;
  if(k in ST.sw){ ST.sw[k]=!ST.sw[k]; say("sw",SWNAME[k],ST.sw[k]); return; }
  if(k==="toggle"){ ST.show9=!ST.show9; say("toggle",ST.show9?"R9":"θb"); return; }
  if(!powered()){ say("noPowerBtn"); return; }
  ST.press=k; setTimeout(()=>{ if(ST.press===k) ST.press=null; },160);
  if(k==="start"){ ST.run=!ST.run; say(ST.run?"start":"stop"); return; }
  if(k==="next"||k==="prev"){
    if(!ST.laps.length){ say("none"); return; }
    if(ST.view<0) ST.view=ST.laps.length-1;
    else ST.view=Math.max(0,Math.min(ST.laps.length-1,ST.view+(k==="next"?1:-1)));
    say("browse",ST.view+1); return; }
  if(k==="lap"){ ST.lapDown=performance.now(); ST.lapErased=false; }
}
function lapRelease(){
  if(ST.lapDown===null) return;
  const held=performance.now()-ST.lapDown; ST.lapDown=null;
  if(ST.lapErased||held>=5000) return;
  if(ST.view>=0){ ST.view=-1; say("exit"); return; }
  if(ST.run){ const r=readAVA();
    ST.laps.push({t:Math.floor(ST.timer),th:r.th.slice(),tb:r.tb,R:r.R,R9:r.R9}); say("lap",ST.laps.length); renderMem(); }
  else { ST.timer=0; say("reset"); }
}
function eraseLaps(){ ST.laps=[]; ST.view=-1; renderMem(); }

/* ══════════════════════════════════════════════════════════════
   8.  HANDS ON THE BENCH
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function inItem(k,p){ if(!ST.on[k]) return false; const x=ST.x[k];
  if(k==="box") return p[0]>=x-60&&p[0]<=x+BOX.w+60&&p[1]>=BOX.top-18&&p[1]<=TABLE_Y;
  return p[0]>=x&&p[0]<=x+SZ.psu[0]&&p[1]>=TABLE_Y-PSU_H&&p[1]<=TABLE_Y; }
function panelKeyAt(p){ if(!ST.on.box) return null; const P=PANEL(); return avaHitAt((p[0]-P.x)/P.s,(p[1]-P.y)/P.s); }
function returnItem(k){
  if(k==="box"){ if(ST.plug.dc==="jack") ST.plug.dc=null; }
  if(k==="psu"){ ST.plug.mains=null; ST.plug.dc=null; }
  ST.on[k]=false; say("back",itemName(k));
}
function returnHand(){
  if(!hand) return;
  if(hand.move){ ST.x[hand.k]=hand.orig; ST.on[hand.k]=true; say("stays"); }
  hand=null;
}
function benchClick(p,right){
  const t=d();
  if(hand){
    if(right){ returnHand(); return; }
    if(PLACE.includes(hand.k)){ const x=Math.round(p[0]-SZ[hand.k][0]/2);
      if(p[1]<BOX.top-40||overlapX(hand.k,x)){ say("noFit"); return; }
      ST.x[hand.k]=x; ST.on[hand.k]=true; say("placed",itemName(hand.k)); hand=null; return; }
    if(hand.k==="plug"){ const w=hand.which;
      if(w==="mains"&&near(p,OUTLET,30)){ ST.plug.mains="outlet"; hand=null; say("plugged",t.term.outlet); return; }
      if(w==="dc"&&ST.on.box&&near(p,JACK(),22)){ ST.plug.dc="jack"; hand=null; say("plugged",t.term.jack); return; }
      if(near(p,OUTLET,30)||(ST.on.box&&near(p,JACK(),22))){ say("wrong"); return; }
      if(p[1]>=TABLE_Y-20){ hand=null; say("unplugged"); return; }
      say("wrong"); return; }
    return;
  }
  if(right){
    for(const k of ["mains","dc"]) if(ST.on.psu&&ST.plug[k]&&near(p,plugPos(k),16)){ ST.plug[k]=null; say("unplugged"); return; }
    for(const k of ["psu","box"]) if(inItem(k,p)){ returnItem(k); return; }
    return;
  }
  for(const k of ["mains","dc"]) if(ST.on.psu&&near(p,plugPos(k),16)){ ST.plug[k]=null; hand={k:"plug",which:k}; say("plug",t.term[k]); return; }
  const key=panelKeyAt(p); if(key){ avaPress(key); return; }
  for(const k of ["psu","box"]) if(inItem(k,p)){ hand={k,move:true,orig:ST.x[k]}; ST.on[k]=false;
    if(k==="box"&&ST.plug.dc==="jack") ST.plug.dc=null;
    say("moveIt",itemName(k)); return; }
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("pointerup",()=>lapRelease());
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k&&!hand.move; if(hand) returnHand();
    if(!same&&trayAvail(k)){ hand={k}; say("picked",itemName(k)); } drawTray(); return; } });
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ if(e.button!==0||!ST.on.box||!P1.s) return; const p=clpos(e);
  const k=avaHitAt((p[0]-P1.ox)/P1.s,(p[1]-P1.oy)/P1.s); if(k) avaPress(k); });
closeCv.addEventListener("pointermove",e=>{ if(!ST.on.box||!P1.s) return; const p=clpos(e);
  closeCv.style.cursor=avaHitAt((p[0]-P1.ox)/P1.s,(p[1]-P1.oy)/P1.s)?"pointer":"default"; });

/* ══════════════════════════════════════════════════════════════
   9.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const fmt=t=>Math.floor(t/60)+":"+(t%60).toFixed(2).padStart(5,"0");
$("swBtn").onclick=()=>{ ST.swRun=!ST.swRun; renderPanel(); };
$("swLap").onclick=()=>{ ST.swLaps.unshift(fmt(ST.sw_t)); ST.swLaps=ST.swLaps.slice(0,40); renderPanel(); };
$("swReset").onclick=()=>{ ST.sw_t=0; ST.swLaps=[]; ST.swRun=false; renderPanel(); };
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,5,20,60]){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===speed?"on":"";
    b.onclick=()=>{ speed=s; renderSpeeds(); }; box.appendChild(b); } }
function renderPanel(){ const t=d(); $("swBtn").textContent=ST.swRun?t.stop:t.start;
  $("laps").innerHTML=ST.swLaps.map((s,i)=>"<div>"+(ST.swLaps.length-i)+". "+s+"</div>").join(""); }
function renderMem(){
  const box=$("mem");
  if(!ST.laps.length){ box.textContent=d().memEmpty; return; }
  box.innerHTML=ST.laps.map((l,i)=>"<div>"+String(i+1).padStart(2,"0")+"  t="+String(l.t).padStart(5,"0")+" s  R="+l.R.toFixed(2)+" Ω<br>&nbsp;&nbsp;θ1–7: "+
    l.th.map(v=>v.toFixed(2)).join(" ")+"<br>&nbsp;&nbsp;θb="+l.tb.toFixed(2)+" °C  R9="+l.R9+" Ω</div>").join("");
  box.scrollTop=box.scrollHeight;
}
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.box) L.push([t.st.none,false]);
  else if(!ST.on.psu) L.push([t.st.noPsu,false]);
  else if(!powered()) L.push([t.st.off,false]);
  if(hotWarn()) L.push([t.st.hot,true]);
  if(ST.view>=0) L.push([t.st.browse,false]);
  if(ST.lapDown!==null&&performance.now()-ST.lapDown>600&&!ST.lapErased) L.push([t.m.hold,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-ava").textContent=t.hAva; $("t-avahint").textContent=t.avaHint; $("t-h-mem").textContent=t.hMem;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2024 E1 — 구리 막대의 열전도 · HaslaLab":"IPhO 2024 E1 — Heat Conduction in a Copper Rod · HaslaLab";
  renderPanel(); renderSpeeds(); renderMem(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

let tPrev=performance.now()/1000, frameN=0, wasPowered=false;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const sdt=dt*speed;
  physStep(sdt);
  const pw=powered();
  if(pw&&!wasPowered){ say("powerOn"); readT=-1e9; }
  if(!pw&&wasPowered){ ST.run=false; ST.timer=0; if(ST.laps.length) say("powerOff"); eraseLaps(); }
  wasPowered=pw;
  if(pw&&ST.run) ST.timer+=sdt;
  if(ST.swRun) ST.sw_t+=sdt;
  if(ST.lapDown!==null&&!ST.lapErased&&performance.now()-ST.lapDown>=5000){ ST.lapErased=true; eraseLaps(); say("erase"); }
  if(pw&&ST.sw.fan) fanAng+=dt*25;
  ctx.clearRect(0,0,LW,LH); drawBench();
  $("swLbl").textContent=fmt(ST.sw_t);
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
