var PROGRAM = {
  title: { ko: 'IZhO 2019 실험 — 빛의 흡수', en: 'IZhO 2019 — Absorption of light' },
  subtitle: { ko: '광학대 위에 광원(레이저 또는 흰 LED)과 광검출기(광다이오드)를 놓고, 광다이오드에 100 kΩ 가변 저항을 이어 그 양단 전압으로 빛의 세기를 잽니다. 장비: 광학대와 받침, 중성 필터(2a), LED(4), 레이저(5, 돌리는 고리 5a), 광원 전원(6, 스위치 6a), 100 kΩ 가변 저항(7), 스위치(8), 멀티미터(11), 회색·파랑·노랑 필름 필터 다섯 장씩, 빨래집게.',
              en: 'A light source (laser or white LED) and a photodetector (photodiode) stand on the optical bench; a 100 kΩ variable resistor across the photodiode turns the light into a voltage. Equipment: the bench and holders, a neutral filter (2a), the LED (4), the laser (5, turning ring 5a), the power supply (6, switch 6a), the 100 kΩ variable resistor (7), a switch (8), the multimeter (11), five grey, five blue and five yellow film filters, a clothes-peg.' },
  notes: { ko: [
    '과제: 1.1 스위치를 넣어 멀티미터 하나로 저항과 전압을 모두 재는 회로. 1.2–1.5 R 에 따른 U, U(I), P(R), 최대 전력의 R. 2 R ≈ 3 kΩ, 최대 약 180–190 mV 에서 필터 수 n 에 따른 I_n = kⁿI₀, 세 필터의 투과율과 오차, 서로 다른 두 필터 쌍. 3 흰 LED, R ≈ 10 kΩ 에서 같은 측정 — 공식이 맞는지와 그 까닭.',
    '공식 해답: 표 1 — R = 104 kΩ 389 mV … 5.3 kΩ 307 mV … 1.3 kΩ 86 mV, 최대 전력 R ≈ 5.4 kΩ. 레이저: k = 0.508 ± 0.007 (회색), 0.915 ± 0.007 (노랑), 0.364 ± 0.012 (파랑); 쌍은 곱과 맞음 (파랑+노랑 0.342/0.333 …). 흰빛: 회색 ≈ 0.45 는 지수 법칙을 따르나 파랑·노랑은 어긋남 — 투과율이 파장에 따라 다르기 때문; 쌍도 곱과 다름 (파랑+노랑 0.271 대 0.327).',
    '레이저 고리는 중성 필터를 지나는 빛의 세기를 바꿉니다. 필터는 빨래집게에 끼워 광검출기 바로 앞에 둡니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 a circuit with the switch so that one multimeter reads both the resistance and the voltage. 1.2–1.5 U against R, U(I), P(R), the R of maximum power. 2 at R ≈ 3 kΩ and a maximum of about 180–190 mV, I_n = kⁿI₀ against the number of filters n, the three transmittances with errors, pairs of different filters. 3 the same with the white LED at R ≈ 10 kΩ — whether the law holds, and why.',
    'Official solution: table 1 — 389 mV at R = 104 kΩ … 307 mV at 5.3 kΩ … 86 mV at 1.3 kΩ, maximum power at R ≈ 5.4 kΩ. Laser: k = 0.508 ± 0.007 (grey), 0.915 ± 0.007 (yellow), 0.364 ± 0.012 (blue); pairs agree with the products (blue + yellow 0.342/0.333 …). White: grey ≈ 0.45 follows the power law, blue and yellow do not — transmittance depends on wavelength; pairs differ from the products (blue + yellow 0.271 vs 0.327).',
    'The laser ring changes the light passing the neutral filter. The filters go in the clothes-peg right in front of the photodetector. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, src: 'laser', on: false, nf: true, ring: 0.3, x: 1, sw8: false, peg: { g: 0, y: 0, b: 0 } };
PROGRAM.lab = {
  intro: { ko: '책상 위: 광학대(왼쪽 광원 받침, 가운데 중성 필터, 오른쪽 광검출기), 레이저와 LED, 광원 전원, 100 kΩ 가변 저항(7a, 7b, 7c), 스위치(8a, 8b), 멀티미터, 필름 필터 세 묶음, 빨래집게, 도선.',
           en: 'On the desk: the optical bench (source holder left, the neutral filter in the middle, the photodetector right), the laser and the LED, the power supply, the 100 kΩ variable resistor (7a, 7b, 7c), the switch (8a, 8b), the multimeter, three packs of film filters, the clothes-peg and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '전원 스위치 클릭: 광원 켜기/끄기 · 옆에 놓인 광원 클릭: 레이저 ↔ LED · 레이저 위에서 휠: 고리 돌리기 · 중성 필터 클릭: 빼기/넣기',
                '가변 저항 손잡이 휠/끌기: 저항 · 스위치 8 클릭: 닫기/열기 · 필터 묶음 클릭: 집게에 한 장 더 · 집게 클릭: 모두 빼기'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Click the supply switch: source on/off · click the spare source: laser ↔ LED · wheel over the laser: turn its ring · click the neutral filter: take out / put in',
                'Variable resistor knob, wheel/drag: resistance · click switch 8: close/open · click a filter pack: one more into the peg · click the peg: empty it'] },
  notePlaceholder: { ko: '예) R = 104 kΩ 389 mV, 87.4 kΩ 388 mV … / 레이저, 3.3 kΩ: 회색 n = 0 196, 1 104 …', en: 'e.g. R = 104 kΩ 389 mV, 87.4 kΩ 388 mV … / laser, 3.3 kΩ: grey n = 0 196, 1 104 …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var W = [0.031, 0.167, 0.109, 0.028, 0.665], TF = { g: [0.564, 0.348, 0.177, 0.327, 0.508], y: [0.942, 0.247, 0.526, 0.102, 0.915], b: [0.312, 0.935, 0.478, 0.326, 0.364] };
    ['g', 'y', 'b'].forEach(function (k) { var f = 1 + S.sys('t' + k, 0.01); TF[k] = TF[k].map(function (v) { return Math.min(0.99, v * f); }); });
    var ILmax = 66e-6 * (1 + S.sys('IL', 0.03)), nD = 1.52, Voc = 0.390, Is = ILmax / (Math.exp(Voc / (nD * 0.02585)) - 1), RP = 100e3 * (1 + S.sys('RP', 0.03)), th0 = S.uni('th0', 0, 3.1);
    var ILed = 8.3e-6 * (1 + S.sys('led', 0.04));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: 0, R: S.sys('mR', 0.004) };
    var leads = LAB.leads = new B3.Leads({ max: 8 }), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 0.2], ['V', 2], ['Ω', 2e4], ['Ω', 2e5]];
    function light() { if (!LAB.on) return 0; var P = LAB.peg;
      if (LAB.src === 'laser') { var a = (LAB.nf ? 0.12 + 0.88 * Math.pow(Math.cos(LAB.ring * Math.PI - th0), 2) : 3.2) * ILmax * 0.985;
        return a * Math.pow(TF.g[4], P.g) * Math.pow(TF.y[4], P.y) * Math.pow(TF.b[4], P.b); }
      var s = 0; for (var i = 0; i < 5; i++) s += W[i] * Math.pow(TF.g[i], P.g) * Math.pow(TF.y[i], P.y) * Math.pow(TF.b[i], P.b);
      return ILed * s * (LAB.nf ? 0.55 : 1); }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['laser', 'pot'],
      home: { yaw: -0.25, pitch: 0.75, k: 11.5, tx: 4, ty: 3, tz: 1 },
      views: { dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 22, ty: 3.4, tz: 5, title: { ko: '멀티미터', en: 'Multimeter' } } },
      frame: function (b) {
        if (b.clicked('c:psw')) LAB.on = !LAB.on;
        if (b.clicked('c:spare')) { LAB.src = LAB.src === 'laser' ? 'led' : 'laser'; b.say(LAB.src === 'laser' ? '레이저를 받침에' : 'LED 를 받침에', LAB.src === 'laser' ? 'Laser on the holder' : 'LED on the holder'); }
        if (b.clicked('c:nf')) LAB.nf = !LAB.nf;
        var wl = b.wheel('laser'); if (wl && LAB.src === 'laser') LAB.ring = ((LAB.ring + wl * 0.01) % 1 + 1) % 1;
        var mp = b.screenMoved('pot'), wp = b.wheel('pot'); if (mp[0] || wp) LAB.x = Math.max(0, Math.min(1, LAB.x + mp[0] * 0.004 + wp * 0.005));
        if (b.clicked('c:sw8')) LAB.sw8 = !LAB.sw8;
        ['g', 'y', 'b'].forEach(function (k) { if (b.clicked('c:f' + k)) { if (LAB.peg.g + LAB.peg.y + LAB.peg.b >= 8) b.say('집게가 가득 찼습니다', 'The peg is full'); else LAB.peg[k]++; } });
        if (b.clicked('c:peg')) LAB.peg = { g: 0, y: 0, b: 0 };
        B3.desk(-36, 40, -18, 20);
        /* the optical bench */
        B3.box3(-30, 6, 0, 1.2, -14, -10, '#5b6168', { top: '#6b7178' });
        var IL = light();
        /* source holder with the source */
        B3.box3(-28, -24, 1.2, 5, -13.5, -10.5, '#3a3f46');
        if (LAB.src === 'laser') { B3.cyl3('x', -29, -20, 7, -12, 1.1, '#2b2f35', { seg: 16, cap: LAB.on ? '#c0392b' : '#3a3f46', id: 'm:laser' });
          B3.cyl3('x', -24.5, -23.5, 7, -12, 1.35, '#b8bcc2', { seg: 18, cap: '#d0d4d8', id: 'm:laser' });
          var ra = LAB.ring * Math.PI * 2; B3.line3([-23.4, 7 + Math.sin(ra) * 1.3, -12 + Math.cos(ra) * 1.3], [-23.4, 7 + Math.sin(ra) * 0.6, -12 + Math.cos(ra) * 0.6], '#c0392b', 2); }
        else { B3.cyl3('x', -27, -21, 7, -12, 1.0, '#e8e8e8', { seg: 16, cap: LAB.on ? '#fffbe6' : '#cfcfcf' }); }
        /* the spare source lying on the desk */
        if (LAB.src === 'laser') B3.cyl3('x', -30, -24, 1, 4, 1.0, '#e8e8e8', { seg: 16, cap: '#cfcfcf', id: 'c:spare' });
        else B3.cyl3('x', -31, -22, 1.1, 4, 1.1, '#2b2f35', { seg: 16, cap: '#3a3f46', id: 'c:spare' });
        /* neutral filter */
        if (LAB.nf) { B3.box3(-12.5, -11.5, 1.2, 3, -13.5, -10.5, '#3a3f46'); B3.box3(-12.3, -11.7, 3, 11, -14, -10, 'rgba(60,60,70,.75)', { id: 'c:nf' }); }
        else { B3.box3(-14, -6, 0, 0.6, 6, 10, 'rgba(60,60,70,.75)', { id: 'c:nf' }); }
        /* photodetector with its terminals, the peg of filters in front */
        B3.box3(1, 5, 1.2, 11, -14, -10, '#2b2f35', { top: '#33373e' }); B3.cyl3('x', 0.6, 1, 7, -12, 1.0, '#1a1a2a', { seg: 16, cap: IL > 1e-6 ? '#4a3d7a' : '#252535' });
        leads.term(b, 'pd.p', [2, 11, -12], { col: '#c0392b', label: '+', lc: '#e8e8e8' }); leads.term(b, 'pd.n', [4.2, 11, -12], { col: '#1b1b1b', label: '−', lc: '#e8e8e8' });
        var np = LAB.peg.g + LAB.peg.y + LAB.peg.b;
        B3.box3(-2.6, -1.2, 9, 12, -12.6, -11.4, '#c49a5a', { id: 'c:peg' });
        if (np) { var cols = [], k; for (k = 0; k < LAB.peg.g; k++) cols.push('rgba(90,90,90,.55)'); for (k = 0; k < LAB.peg.y; k++) cols.push('rgba(230,200,40,.5)'); for (k = 0; k < LAB.peg.b; k++) cols.push('rgba(40,90,220,.5)');
          cols.forEach(function (cl, i) { B3.box3(-1.0 + i * 0.12, -0.92 + i * 0.12, 4, 10, -14.5, -9.5, cl, { id: 'c:peg', noObst: true }); }); }
        if (LAB.on) B3.line3([LAB.src === 'laser' ? -20 : -21, 7, -12], [1, 7, -12], LAB.src === 'laser' ? 'rgba(255,40,40,.75)' : 'rgba(255,250,220,.45)', LAB.src === 'laser' ? 2 : 6);
        /* power supply */
        B3.box3(-30, -20, 0, 5, 8, 15, '#3a3f46', { top: '#474c55' }); B3.box3(-24, -21, 5, 5.6, 9.5, 11.5, LAB.on ? '#3f8f4f' : '#7a2a2a', { id: 'c:psw' });
        B3.text3([-29.5, 5.02, 13.8], [1, 0, 0], [0, 0, -1], b.L('전원 6', 'Supply 6'), 0.8, '#ddd', { weight: '700' });
        B3.cable([-25, 3, 8], [-25, 5, -12], '#1b1b1b', 3, 1.8);
        /* variable resistor 7 and switch 8 */
        B3.box3(-14, -4, 0, 2, -6, 0, '#3a3f46', { top: '#474c55' }); B3.cyl3('y', 2, 3.6, -9, -3.5, 1.5, '#2b2f35', { seg: 20, cap: '#3a3f46', id: 'm:pot' });
        var pa = (LAB.x - 0.5) * 4.5; B3.line3([-9, 3.62, -3.5], [-9 + Math.sin(pa) * 1.4, 3.62, -3.5 - Math.cos(pa) * 1.4], '#f2f2f2', 2.5);
        ['a', 'b', 'c'].forEach(function (t, i) { leads.term(b, 'r7.' + t, [-12 + i * 3, 2, -0.8], { col: '#b8b8b8', label: '7' + t, lc: '#e8e8e8', ls: 0.55 }); });
        B3.box3(-2, 6, 0, 1.6, -4, 0, '#2b2f35', { top: '#33373e' }); B3.box3(0.8, 3.2, 1.6, 2.4, -3.2, -2, LAB.sw8 ? '#3f8f4f' : '#7a2a2a', { id: 'c:sw8' });
        leads.term(b, 'k8.a', [-0.6, 1.6, -0.8], { col: '#b8b8b8', label: '8a', lc: '#e8e8e8', ls: 0.55 }); leads.term(b, 'k8.b', [4.6, 1.6, -0.8], { col: '#b8b8b8', label: '8b', lc: '#e8e8e8', ls: 0.55 });
        /* filter packs */
        [['g', '#6d6d6d'], ['y', '#e6c828'], ['b', '#2a5ad8']].forEach(function (q, i) { B3.box3(-12 + i * 5, -8 + i * 5, 0, 0.6, 12, 16, q[1], { id: 'c:f' + q[0] }); });
        B3.text3([-12, 0.62, 17.8], [1, 0, 0], [0, 0, -1], b.L('회색  노랑  파랑', 'grey   yellow   blue'), 0.7, '#333', { weight: '700' });
        var m = B3.dmm(b, 'dmm', [22, 5], dm, leads, { ranges: RANGES });
        /* the circuit */
        c.reset();
        c.I('pd.p', 'pd.n', IL); c.D('pd.p', 'pd.n', { Is: Is, n: nD, Gl: 2e-9, Rs: 5 });
        c.R('r7.a', 'r7.b', Math.max(1, LAB.x * RP)); c.R('r7.b', 'r7.c', Math.max(1, (1 - LAB.x) * RP));
        if (LAB.sw8) c.join('k8.a', 'k8.b');
        m.stamp(c); leads.wire(c); c.solve(0.05); m.read(c);
        leads.draw(b);
        LAB.state = { IL: IL, U: c.V_('pd.p') - c.V_('pd.n'), Rab: LAB.x * RP, read: dm.now };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
