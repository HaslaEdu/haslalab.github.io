<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">

<title>IZhO 2012 실험 — 부피 속의 전류 · Electric Currents in Volume · HaslaLab</title>
<meta name="description" content="IZhO 2012 실험 문제를 브라우저에서 해 봅니다. 물이 든 그릇에 담근 두 쇠살 사이 물의 저항을, 알려진 저항과 직렬로 이은 두 전압으로 재어 물 높이, 쇠살 사이 거리, 절연한 쇠살 끝의 높이에 따라 조사하고 물의 비저항을 어림합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IZhO 2012 실험 — 부피 속의 전류 · Electric Currents in Volume · HaslaLab">
<meta property="og:description" content="IZhO 2012 실험: 물속 두 전극 사이 저항의 높이·거리 의존성.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* IZhO 2012 on the 3-D bench.  The water between the spokes, after the official tables: R = A/h + B with A ≈ 178
   kΩ·mm, B ≈ 0.17 kΩ for spokes at opposite walls (table 1); against the distance at 200 ml R − B grows as
   0.23 ln L + 0.54 kΩ (L in cm; table 2), scaled to the same water; with one spoke in a tube bared only at its
   bottom 1 cm and the vessel full, R = 6.0 kΩ + 0.071 kΩ/mm × l, the height of the other spoke's end (table 3).
   R₀ = 2.0 kΩ, a 4.5 V battery; the vessel holds 200 ml in 170 mm (0.85 mm/ml, D ≈ 39 mm). */
var PROGRAM = {
  title: { ko: 'IZhO 2012 실험 — 부피 속의 전류', en: 'IZhO 2012 — Electric currents in volume' },
  subtitle: { ko: '물속에 담근 두 쇠살 사이로 전류가 흐를 때 물의 저항을 잽니다. 장비: 250 ml 그릇(눈금), 쇠살 둘, 멀티미터, 4.5 V 전지, 몇 kΩ 의 저항, 두 극 스위치, 칵테일 빨대(플라스틱 관), 도선, 깨끗한 물, 플라스틱 컵, 지우개, 자, 접착테이프. 물의 저항은 알려진 저항 R₀ 와 직렬로 이은 회로에서 두 전압으로만 구하고, 멀티미터는 전압계로만 쓰세요.',
              en: 'Measure the resistance of water when a current flows between two spokes dipped in it. Equipment: a 250 ml vessel (scale), two steel spokes, a multimeter, a 4.5 V battery, a resistor of several kΩ, a two-pole switch, a cocktail straw (plastic tube), wires, clean water, a plastic cup, an eraser, a ruler and adhesive tape. Find the water\'s resistance only from two voltages in series with the known resistor R₀; use the multimeter only as a voltmeter.' },
  notes: { ko: [
    '과제: 1 R₀ 를 재고, R_x = R₀·U_x/U_R. 2 쇠살을 그릇 벽 양쪽에 두고 물 높이 h 에 따른 R, 전류선 그림, R = A/h + B 와 그 직선화. 3 200 ml 에서 한 쇠살을 벽을 따라 옮기며 거리 L 에 따른 R, R = a·ln L + b. 4 한 쇠살을 아래 1 cm 만 드러나게 관에 넣고 그릇을 가득 채운 뒤 다른 쇠살 끝 높이 l 에 따른 R. 5 물의 비저항 ρ.',
    '공식 해답: R₀ = 2.0 ± 0.1 kΩ; 200 ml = 170 mm (0.85 mm/눈금). 2: h = 30 … 220 눈금에서 R = 7.07 … 1.12 kΩ, R 대 1/h 직선 a = 210 kΩ·눈금, b = 0.17 kΩ → A = 178 kΩ·mm. 3: 호 l = 1 … 6 cm, L = D sin(l/D), R = 0.713 … 1.031 kΩ, R = 0.23 ln L + 0.71 kΩ. 4: l = 20 … 240 ml 에서 R = 7.3 … 20.8 kΩ, 0.060 kΩ/눈금 = 0.071 kΩ/mm, b = 6.0 kΩ. 5: ρ = a·V₀/h₀ ≈ 83 Ω·m.',
    '쇠살 사이 거리는 벽을 따른 호의 길이(테이프 눈금)로 읽습니다. 물을 바꾸면(비우고 다시 붓기) 값이 조금 달라집니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 measure R₀; R_x = R₀·U_x/U_R. 2 spokes at opposite walls, R against the water height h, the current lines, R = A/h + B and its linearization. 3 at 200 ml move one spoke along the wall: R against the distance L, R = a·ln L + b. 4 one spoke in the tube bared only at its bottom 1 cm, the vessel full: R against the height l of the other spoke\'s end. 5 the water\'s resistivity ρ.',
    'Official solution: R₀ = 2.0 ± 0.1 kΩ; 200 ml = 170 mm (0.85 mm per division). 2: R = 7.07 … 1.12 kΩ for h = 30 … 220 divisions, R against 1/h straight with a = 210 kΩ·div, b = 0.17 kΩ → A = 178 kΩ·mm. 3: arc l = 1 … 6 cm, L = D sin(l/D), R = 0.713 … 1.031 kΩ, R = 0.23 ln L + 0.71 kΩ. 4: R = 7.3 … 20.8 kΩ for l = 20 … 240 ml, 0.060 kΩ/div = 0.071 kΩ/mm, b = 6.0 kΩ. 5: ρ = a·V₀/h₀ ≈ 83 Ω·m.',
    'Read the spokes\' separation as the arc along the wall (the tape marks). Changing the water (empty and refill) shifts the values a little. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, V: 0, arc: 6.1, tipB: 0, tube: false, swOn: false, water: 1 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 눈금 그릇(벽 양쪽에 쇠살 A, B, 위에 테이프 눈금), 물병, 버리는 컵, 빨대, 4.5 V 전지, 저항 R₀, 스위치, 멀티미터, 도선.',
           en: 'On the desk: the graduated vessel (spokes A and B on its wall, a tape scale round the rim), a water bottle, a waste cup, the straw, the 4.5 V battery, the resistor R₀, the switch, the multimeter and wires.' },
  howto: { ko: ['물병 클릭: 물 10 ml 붓기 (Shift+클릭 대신 휠: 1 ml) · 버리는 컵 클릭: 그릇 비우기 (새 물)',
                '쇠살 B 위에서 휠: 벽을 따라 옮기기(호 0.1 cm) · 쇠살 B 를 위아래로 끌기: 끝의 높이 · 빨대 클릭: 쇠살 A 에 끼우기/빼기',
                '도선: 단자 클릭으로 잇기 · 스위치 클릭 · 멀티미터 다이얼 · 그릇 클릭: 가까이'],
           en: ['Click the bottle: pour 10 ml (wheel over it: 1 ml) · click the waste cup: empty the vessel (fresh water)',
                'Wheel over spoke B: move it along the wall (arc 0.1 cm) · drag spoke B up/down: the height of its end · click the straw: slip it onto spoke A / off',
                'Wires: click terminals to join · click the switch · multimeter dial · click the vessel: close up'] },
  notePlaceholder: { ko: '예) h = 30 눈금: U_x = 3.82 V, U_R = 1.08 V … / 호 1 cm: 1.29, 3.62 V …', en: 'e.g. h = 30 div: U_x = 3.82 V, U_R = 1.08 V … / arc 1 cm: 1.29, 3.62 V …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R0 = 2.0e3 * (1 + S.sys('R0', 0.03)), A = 178 * (1 + S.sys('A', 0.04)), B = 0.17 * (1 + S.sys('B', 0.1)), K4 = 0.071 * (1 + S.sys('k4', 0.04)), B4 = 6.0 * (1 + S.sys('b4', 0.05));
    var D = 3.9, MMML = 0.85, VX = -6, VZ = -4, RV = D / 2, f = function (L) { return 0.23 * Math.log(Math.max(0.1, L)) + 0.54; };
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: 0, R: S.sys('mR', 0.004) };
    var leads = LAB.leads = new B3.Leads({ max: 10 }), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 2], ['V', 20], ['Ω', 2e4]];
    var scale = (function () { var cv = document.createElement('canvas'); cv.width = 80; cv.height = 640; cv._static = true; var g = cv.getContext('2d');
      g.clearRect(0, 0, 80, 640); g.strokeStyle = 'rgba(255,255,255,.9)'; g.fillStyle = 'rgba(255,255,255,.95)'; g.font = '700 16px sans-serif';
      for (var v = 0; v <= 250; v += 5) { var y = 620 - v * 2.4; g.lineWidth = v % 50 === 0 ? 2 : 1; g.beginPath(); g.moveTo(0, y); g.lineTo(v % 50 === 0 ? 40 : v % 10 === 0 ? 28 : 18, y); g.stroke(); if (v % 50 === 0) g.fillText(String(v), 44, y + 6); } return cv; })();
    function Rwater() { var level = LAB.V * MMML / 10; if (level <= 0.05) return 1e9;
      var aw = LAB.water;
      if (LAB.tube) { var tipB = LAB.tipB; if (tipB > level) return 1e9; return (B4 + K4 * tipB * 10) * aw * 1e3; }
      var wet = level - LAB.tipB; if (wet <= 0.02) return 1e9; var L = D * Math.sin(LAB.arc / D);
      return (B + A / (wet * 10) * f(L) / f(D)) * aw * 1e3; }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['spB', 'bottle'],
      home: { yaw: -0.25, pitch: 0.75, k: 12.5, tx: 4, ty: 4, tz: 1 },
      views: { ves: { yaw: 0, pitch: 0.2, k: 30, tx: VX, ty: 10, tz: VZ, title: { ko: '그릇과 눈금', en: 'The vessel and its scale' } },
               dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 22, ty: 3.4, tz: 4, title: { ko: '멀티미터', en: 'Multimeter' } } },
      frame: function (b) {
        if (b.clicked('c:bottle')) LAB.V = Math.min(250, LAB.V + 10);
        var wbt = b.wheel('bottle'); if (wbt) LAB.V = Math.max(0, Math.min(250, LAB.V + wbt));
        if (b.clicked('c:waste')) { LAB.V = 0; LAB.water = 1 + HL.gauss(0.05); }
        if (b.clicked('c:tube')) LAB.tube = !LAB.tube;
        if (b.clicked('c:sw')) LAB.swOn = !LAB.swOn;
        if (b.clicked('c:ves')) b.go('ves');
        var ws = b.wheel('spB'); if (ws) LAB.arc = Math.max(0.6, Math.min(Math.PI * D / 2, Math.round((LAB.arc - ws * 0.1) * 10) / 10));
        if (b.dragging('spB')) LAB.tipB = Math.max(0, Math.min(20, LAB.tipB - b.screenMoved('spB')[1]));
        var level = LAB.V * MMML / 10;
        B3.desk(-36, 40, -18, 20);
        /* the vessel */
        B3.cyl3('y', 0, 0.4, VX, VZ, RV + 0.15, 'rgba(200,225,235,.5)', { seg: 32, cap: 'rgba(210,235,245,.35)', id: 'c:ves' });
        if (level > 0) B3.cyl3('y', 0.4, 0.4 + level, VX, VZ, RV, 'rgba(110,170,220,.38)', { seg: 32, cap: 'rgba(140,195,235,.45)', noObst: true });
        B3.cyl3('y', 0.4, 22, VX, VZ, RV + 0.15, 'rgba(205,228,238,.16)', { seg: 32, caps: false, noObst: true, id: 'c:ves' });
        B3.tex3(scale, 0, 0, 80, 640, [VX - 0.4, 0.4 + 620 / 2.4 * 0.085 + 0.0, VZ + RV + 0.17], [1, 0, 0], [0, -640 / 2.4 * 0.085, 0], { id: 'c:ves' });
        /* spoke A at angle 0 (the −x wall), spoke B round the wall by the arc */
        var pA = [VX - RV + 0.15, VZ], aB = LAB.arc / RV, pB = [VX - Math.cos(aB) * (RV - 0.15), VZ + Math.sin(aB) * (RV - 0.15)];
        B3.cylAB([pA[0], 0.5, pA[1]], [pA[0], 23, pA[1]], 0.08, '#b8bcc2', { seg: 6 }); B3.cylAB([pA[0], 23, pA[1]], [pA[0] - 1.5, 23, pA[1]], 0.08, '#b8bcc2', { seg: 6 });
        if (LAB.tube) B3.cylAB([pA[0], 1.4, pA[1]], [pA[0], 24, pA[1]], 0.3, 'rgba(240,240,250,.55)', { seg: 10, id: 'c:tube' });
        else B3.cylAB([12, 0.3, 14], [30, 0.3, 14], 0.3, 'rgba(240,240,250,.7)', { seg: 10, id: 'c:tube' });
        B3.cylAB([pB[0], 0.5 + LAB.tipB, pB[1]], [pB[0], 23 + LAB.tipB, pB[1]], 0.12, '#c8ccd2', { seg: 6, id: 'm:spB' }); B3.cylAB([pB[0], 23 + LAB.tipB, pB[1]], [pB[0], 23 + LAB.tipB, pB[1] + 1.5], 0.08, '#b8bcc2', { seg: 6 });
        leads.term(b, 'spA', [pA[0] - 1.5, 23, pA[1]], { col: '#b8bcc2', label: 'A', lc: '#e8e8e8', post: true });
        leads.term(b, 'spB', [pB[0], 23 + LAB.tipB, pB[1] + 1.5], { col: '#b8bcc2', label: 'B', lc: '#e8e8e8', post: true });
        /* tape scale on the rim: arc from spoke A */
        for (var k = 0; k <= 6; k++) { var ak = k / RV; B3.line3([VX - Math.cos(ak) * (RV + 0.16), 21.5, VZ + Math.sin(ak) * (RV + 0.16)], [VX - Math.cos(ak) * (RV + 0.16), 22, VZ + Math.sin(ak) * (RV + 0.16)], '#222', 2); }
        /* bottle and waste cup */
        B3.cyl3('y', 0, 14, -22, 8, 2.6, 'rgba(160,200,235,.55)', { seg: 22, cap: 'rgba(180,215,240,.6)', id: 'c:bottle' }); B3.cyl3('y', 14, 16, -22, 8, 1.0, '#2f6ea6', { seg: 14, id: 'c:bottle' });
        B3.cyl3('y', 0, 7, -15, 13, 3, 'rgba(230,230,230,.6)', { seg: 22, caps: false, id: 'c:waste' }); B3.cyl3('y', 0, 0.2, -15, 13, 3, 'rgba(230,230,230,.6)', { seg: 22, id: 'c:waste' });
        /* battery, R0, switch */
        var bat = B3.cells(b, leads, 'bat', [-28, -8], { n: 3, e: 1.5 * (1 + S.sys('eb', 0.02)), r: 0.3 });
        B3.box3(2, 9, 0, 0.8, 8, 13, '#2e6b4a', { top: '#357a55' }); B3.cylAB([4.3, 1.3, 10.5], [6.7, 1.3, 10.5], 0.4, '#c8b48a', { seg: 10 });
        leads.term(b, 'r0.a', [2.9, 0.8, 10.5], { col: '#d8d8d8' }); leads.term(b, 'r0.b', [8.1, 0.8, 10.5], { col: '#d8d8d8' }); B3.text3([2.5, 0.82, 12.6], [1, 0, 0], [0, 0, -1], 'R₀', 0.7, '#fff', { weight: '700' });
        B3.box3(2, 9, 0, 1.4, -2, 2, '#2b2f35', { top: '#33373e' }); B3.box3(4.5, 6.5, 1.4, 2.2, -1, 1, LAB.swOn ? '#3f8f4f' : '#7a2a2a', { id: 'c:sw' });
        leads.term(b, 'k.a', [3, 1.4, 1.2], { col: '#b8b8b8', ls: 0.5 }); leads.term(b, 'k.b', [8, 1.4, 1.2], { col: '#b8b8b8', ls: 0.5 });
        var m = B3.dmm(b, 'dmm', [22, 4], dm, leads, { ranges: RANGES });
        c.reset(); bat.stamp(c); c.R('spA', 'spB', Rwater()); c.R('r0.a', 'r0.b', R0); if (LAB.swOn) c.join('k.a', 'k.b');
        m.stamp(c); leads.wire(c); c.solve(0.05); m.read(c); leads.draw(b);
        LAB.state = { V: LAB.V, level_mm: level * 10, arc: LAB.arc, tipB: LAB.tipB, tube: LAB.tube, Rx: Rwater(), read: dm.now };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
