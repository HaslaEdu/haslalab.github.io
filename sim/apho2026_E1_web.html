<style>

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{

  /* ── tray ── */
  .tray{flex:0 0 184px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;

  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}

  .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #bench{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;
         background:#232830;cursor:crosshair}
  #bench.dragging{cursor:grabbing}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel,.tray{position:static} }

  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);

  .disp{background:#0d1512;border-radius:6px;padding:6px 10px;margin:2px 0 6px;text-align:center;

  .row{display:flex;gap:6px}
  .row button{flex:1;text-align:center}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  #swBtn{background:#2f6f3f;border-color:#2f6f3f;color:#fff;font-weight:600}
  #swBtn.run{background:#8a3b34;border-color:#8a3b34}
  .laps{background:var(--deep);border:1px solid var(--line);border-radius:6px;margin-top:6px;
        height:82px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;
        color:var(--ink);padding:4px 7px}
  .lvbox{display:flex;gap:8px;align-items:flex-start}
  #level{background:var(--deep);border-radius:6px;flex:0 0 116px}
  #lvtxt{font-size:11.5px;color:var(--ink);line-height:1.55}
  .pedals{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:4px 0}
  .ped{text-align:center;font-size:11.5px;color:var(--ink)}
  .ped .bb{display:flex;gap:3px;justify-content:center;margin-top:2px}
  .ped .bb button{width:36px;padding:3px 0;margin:0;font-size:12px;user-select:none}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:10px;min-height:110px}
  .status div + div{margin-top:9px}

  /* ── header ── */
  header{max-width:1620px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}

const A_INNER_H=15.1, A_OUT_Z=1.0, A_CAP=TANK_AREA*A_INNER_H, N_MARKS=13;
const B_INNER_H=15.2, B_HOLE_Z=0.7, B_CAP=TANK_AREA*B_INNER_H;
const BOTTLE_CAP=2000.0, BEAKER_CAP=250.0;
const PUMP_RATE=150.0, PUMP_STROKE_T=0.55, RIGID_LEN=40.0, HOSE_LEN=100.0, SLOSH_V0=20.0;
const BOTTLE_POLY=[[-3.7,0.3],[3.7,0.3],[3.7,15.0],[2.0,17.5],[1.35,21.4],[-1.35,21.4],[-2.0,17.5],[-3.7,15.0]];
const BOTTLE_LIP=[0.0,22.6], A_NECK=Math.PI*1.1*1.1, CD_NECK=0.35;
const BEAKER_POLY=[[-3.15,0.2],[3.15,0.2],[4.05,9.5],[-4.05,9.5]];
const BEAKER_LIP=[4.4,9.7], A_LIP=2.6, CD_LIP=0.45;
const PUDDLE_T=0.22, PUDDLE_SPREAD=7.0;
const BIN_X0=3.0, BIN_X1=48.0, BIN_Z0=0.0, BIN_Z1=28.0;
const BIN_H=16.0, BIN_WALL=0.6, BIN_FLOOR=0.6;
const BIN_IW=BIN_X1-BIN_X0-2*BIN_WALL, BIN_ID=BIN_Z1-BIN_Z0-2*BIN_WALL;
const BIN_AREA=BIN_IW*BIN_ID, FLOAT_DEPTH=2.2;
const BASE_W=30.0, BASE_D=22.0, BASE_T=1.2;
const PEDAL_NOM=3.0, PEDAL_STEP=0.02, PEDAL_MIN=2.2, PEDAL_MAX=3.8;
const ST_W=25.0, ST_D=12.0, ST_STEP_X=13.0, ST_TALL_H=27.0, ST_STEP_H=9.0;
const SLOT={base:{desk:[46.0,1.5], bin:[7.0,1.5]},
            stand:{desk:[47.0,2.0], bin:[12.0,8.0], base:[12.0,8.0]},
            tankA:{desk:[48.0,2.0], bin:[28.0,5.0], base:[28.0,3.0]},
            tankB:{desk:[57.0,2.0], bin:[28.0,5.0], base:[28.0,3.0]}};
const DESK_TILT=[0.0004,-0.0003];
const VIEW_U0=-5.0, VIEW_U1=70.0, VIEW_V0=-29.0, VIEW_V1=50.0;
const KC=0.91355, KS=0.40674;

const C_DESK="#b8926a", C_DESK2="#9d7a56";
const C_BIN="#e6eaea", C_BIN2="#d3d9d9";
const C_BLK="#17181b", C_BLK2="#26282c";
const C_STAND="#202226", C_STAND3="#141518";
const C_WATER="#3f9fd0", C_WATER_T="#7fd0ee";
const C_TXT="#e8eef2", C_ACC="#f2c14e", C_ORANGE="#e8622a", C_METAL="#b7bcc1";

const TRAY_ORDER=["tankA","tankB","stand","base","bottle1","bottle2","beaker","pump","ruler","level","towel"];

/* ── helpers ── */
function proj(x,y,z){ return [KC*(x+z), y+KS*(z-x)]; }
function rot(pts,a){
  const ca=Math.cos(a), sa=Math.sin(a);
  return pts.map(([x,y])=>[x*ca-y*sa, x*sa+y*ca]);
}
function polyArea(pts){
  const n=pts.length; let s=0;
  for(let i=0;i<n;i++){ const j=(i+1)%n; s+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1]; }
  return 0.5*Math.abs(s);
}
function clipBelow(pts,nx,ny,dd){
  const out=[], n=pts.length;
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[(i+1)%n];
    const da=nx*a[0]+ny*a[1]-dd, db=nx*b[0]+ny*b[1]-dd;
    if(da<=0) out.push(a);
    if((da<0&&0<db)||(db<0&&0<da)){
      const t=da/(da-db);
      out.push([a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1])]);
    }
  }
  return out;
}
function fillLine(pts,frac,nx,ny){
  nx = nx===undefined?0.0:nx; ny = ny===undefined?1.0:ny;
  frac=Math.max(0,Math.min(1,frac));
  const total=polyArea(pts);
  const proj_=p=>nx*p[0]+ny*p[1];
  if(total<=0||frac<=0) return Math.min.apply(null,pts.map(proj_))-1e-6;
  if(frac>=1.0) return Math.max.apply(null,pts.map(proj_))+1e-6;
  let lo=Math.min.apply(null,pts.map(proj_)), hi=Math.max.apply(null,pts.map(proj_));
  for(let i=0;i<26;i++){
    const mid=0.5*(lo+hi);
    const a=polyArea(clipBelow(pts,nx,ny,mid));
    if(a<frac*total) lo=mid; else hi=mid;
  }
  return 0.5*(lo+hi);
}
function vesselGeom(src){
  return src==="beaker" ? [BEAKER_POLY,BEAKER_LIP,BEAKER_CAP] : [BOTTLE_POLY,BOTTLE_LIP,BOTTLE_CAP];
}
function mix(c1,c2,f){
  const a=[1,3,5].map(i=>parseInt(c1.substr(i,2),16));
  const b=[1,3,5].map(i=>parseInt(c2.substr(i,2),16));
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*f).toString(16).padStart(2,"0")).join("");
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
class RNG{
  constructor(seed){ this.r=mulberry32(seed>>>0); this._sp=null; }
  uniform(a,b){ return a+this.r()*(b-a); }
  gauss(mu,sd){
    if(this._sp!==null){ const v=this._sp; this._sp=null; return mu+sd*v; }
    let u=0,v=0; while(u===0)u=this.r(); while(v===0)v=this.r();
    const R=Math.sqrt(-2*Math.log(u));
    this._sp=R*Math.sin(2*Math.PI*v);
    return mu+sd*R*Math.cos(2*Math.PI*v);
  }
}

/* ══════════════════════════════════════════════════════════════
   2.  WORLD  —  apparatus state + physics (no drawing)
   ══════════════════════════════════════════════════════════════ */
class World{
  constructor(seed){
    seed = (seed===undefined)?Math.floor(Math.random()*(1<<30)):seed;
    this.seed=seed; this.rng=new RNG(seed);
    this.t=0.0;
    this.on={base:null, stand:null, tankA:null, tankB:null};
    this.VA=0; this.VB=0; this.Vbin=0; this.beaker=0;
    this.bottle=[BOTTLE_CAP,BOTTLE_CAP];
    this.puddles=[]; this.wiped=0.0; this.towel_wet=0.0;
    this.surge={tankA:0.0, tankB:0.0};
    this.land={}; this._spill_xz=null;
    this._valve=false; this._plugA4=true; this._plugA5=true; this.plugB=true;
    while(true){
      this.bin_tilt=[this.rng.uniform(-0.005,0.005), this.rng.uniform(-0.005,0.005)];
      if(0.0015<Math.max(Math.abs(this.bin_tilt[0]),Math.abs(this.bin_tilt[1])) &&
         Math.max(Math.abs(this.bin_tilt[0]),Math.abs(this.bin_tilt[1]))<0.005) break;
    }
    while(true){
      this.pedal=[0,1,2,3].map(()=>PEDAL_NOM+this.rng.uniform(-0.3,0.3));
      const tx=(0.5*(this.pedal[0]+this.pedal[2])-0.5*(this.pedal[1]+this.pedal[3]))/BASE_W+this.bin_tilt[0];
      const tz=(0.5*(this.pedal[0]+this.pedal[1])-0.5*(this.pedal[2]+this.pedal[3]))/BASE_D+this.bin_tilt[1];
      if(0.004<Math.max(Math.abs(tx),Math.abs(tz)) && Math.max(Math.abs(tx),Math.abs(tz))<0.02) break;
    }
    this.wobble=0.0; this.pouring=null;
    this.slosh={bottle1:0.0, bottle2:0.0, beaker:0.0};
    this.pour_head=0.0; this.pour_tilt=0.55; this.pour_drop=14.0;
    this.inflight=[];
    this.pump_in=null; this.pump_out=null; this.pumping=false;
    this.run_jit={valve:1.0, h4:1.0, h5:1.0};
    this.tw=TANK_W+this.rng.uniform(-TANK_TOL,TANK_TOL);
    this.td=TANK_D+this.rng.uniform(-TANK_TOL,TANK_TOL);
    this.area=this.tw*this.td;
    this.temp=this.rng.gauss(T_WATER,1.5);
    const visc=1.0-DCD_DT*(this.temp-T_WATER);
    this.kv=KV*visc*this.rng.gauss(1.0,0.0018);
    this.cd4=CD_HOLE*visc*this.rng.gauss(1.0,0.0018);
    this.cd5=CD_HOLE*visc*this.rng.gauss(1.0,0.0018);
    this.cdb=CD_B5*visc*this.rng.gauss(1.0,0.0018);
    this.msg=null;
    this.CAP={tankA:A_CAP+200.0, tankB:B_CAP+200.0, bin:BIN_AREA*BIN_H,
              beaker:BEAKER_CAP, bottle1:BOTTLE_CAP, bottle2:BOTTLE_CAP};
  }
  _fresh_run(key){ this.run_jit[key]=Math.min(1.012,Math.max(0.988,this.rng.gauss(1.0,0.004))); }
  get valve(){ return this._valve; }
  set valve(v){ if(v&&!this._valve) this._fresh_run("valve"); this._valve=!!v; }
  get plugA4(){ return this._plugA4; }
  set plugA4(v){ if(this._plugA4&&!v) this._fresh_run("h4"); this._plugA4=!!v; }
  get plugA5(){ return this._plugA5; }
  set plugA5(v){ if(this._plugA5&&!v) this._fresh_run("h5"); this._plugA5=!!v; }

  get plate_y(){
    const y0 = this.on.base==="bin" ? BIN_FLOOR : 0.0;
    return y0 + (this.pedal[0]+this.pedal[1]+this.pedal[2]+this.pedal[3])/4.0 + BASE_T;
  }
  surface_y(s){
    if(s==="desk") return 0.0;
    if(s==="bin") return BIN_FLOOR;
    if(s==="base") return this.plate_y;
    if(s==="stand_low"||s==="stand_high"){
      const b=this.on.stand;
      if(b===null) return null;
      return this.surface_y(b)+(s==="stand_low"?ST_STEP_H:ST_TALL_H);
    }
    return null;
  }
  surface_tilt(s){
    if(s==="desk") return DESK_TILT.slice();
    if(s==="bin"){ const [tx,tz]=this.bin_tilt; return [tx+this.wobble, tz+0.6*this.wobble]; }
    if(s==="base"){
      const left=0.5*(this.pedal[0]+this.pedal[2]), right=0.5*(this.pedal[1]+this.pedal[3]);
      const front=0.5*(this.pedal[0]+this.pedal[1]), back=0.5*(this.pedal[2]+this.pedal[3]);
      const [bx,bz]=this.surface_tilt(this.on.base||"desk");
      return [(left-right)/BASE_W+bx, (front-back)/BASE_D+bz];
    }
    if(s==="stand_low"||s==="stand_high") return this.surface_tilt(this.on.stand||"desk");
    return [0.0,0.0];
  }
  slot(obj){
    const s=this.on[obj];
    if(s===null||s===undefined) return null;
    if(s==="stand_low"||s==="stand_high"){
      const st=this.slot("stand");
      if(st===null) return null;
      const dx = s==="stand_low" ? 13.5 : 1.0;
      return [st[0]+dx, st[1]+0.5];
    }
    return SLOT[obj][s];
  }
  obj_y(obj){ const s=this.on[obj]; return s===null?null:this.surface_y(s); }
  tilt_of(obj){ const s=this.on[obj]; return s?this.surface_tilt(s):[0.0,0.0]; }
  get hA(){ return this.VA/this.area-A_OUT_Z; }
  get hB(){ return this.VB/this.area-B_HOLE_Z; }
  get bin_depth(){ return this.Vbin/BIN_AREA; }
  get bin_surface_y(){ return BIN_FLOOR+this.bin_depth; }
  outlet_y(){ const y=this.obj_y("tankA"); return y===null?null:y+WALL+A_OUT_Z; }
  head_at(xr,zr){ const [tx,tz]=this.tilt_of("tankA"); return this.hA+xr*tx+zr*tz; }
  over_bin(obj){
    let s=this.on[obj];
    for(let i=0;i<6;i++){
      if(s==="bin") return true;
      if(s==="desk"||s===null||s===undefined) return false;
      s = s==="base" ? this.on.base : this.on.stand;
    }
    return false;
  }
  _submerge(h){
    const oy=this.outlet_y();
    if(oy===null||!this.over_bin("tankA")) return h;
    const dd=this.bin_surface_y-oy;
    return dd>0 ? h-dd : h;
  }
  q_valve(){
    if(!(this.valve&&this.on.tankA)) return 0.0;
    const h=this._submerge(this.head_at(+5.0,+2.5));
    if(h<=H_STOP4) return 0.0;
    return A_VALVE*this.kv*this.run_jit.valve*Math.pow(h,XV);
  }
  q_hole4(){
    if(this.plugA4||!this.on.tankA) return 0.0;
    const h=this._submerge(this.head_at(+1.5,-5.0));
    if(h<=H_STOP4) return 0.0;
    return A_HOLE4*this.cd4*this.run_jit.h4*Math.sqrt(2*G*h);
  }
  q_hole5(){
    if(this.plugA5||!this.on.tankA) return 0.0;
    const h=this._submerge(this.head_at(-1.5,-5.0));
    if(h<=H_STOP5) return 0.0;
    return A_HOLE5*this.cd5*this.run_jit.h5*Math.sqrt(2*G*h);
  }
  q_tankB(){
    if(this.plugB||!this.on.tankB) return 0.0;
    const h=this.hB;
    if(h<=H_STOP5) return 0.0;
    return A_HOLE5*this.cdb*Math.sqrt(2*G*h);
  }
  jet_land(){
    if(!this.on.tankA) return null;
    const sl=this.slot("tankA"), oy=this.outlet_y();
    const insideBin=this.over_bin("tankA");
    const yl = insideBin ? BIN_FLOOR+this.bin_depth : 0.0;
    const t=Math.sqrt(Math.max(0.0,2.0*(oy-yl))/G);
    let best=null;
    const rows=[[this.q_valve(),A_VALVE,sl[0]+TANK_W+2*WALL+2.6,sl[1]+WALL+8.0,1.0,0.0],
                [this.q_hole4(),A_HOLE4,sl[0]+WALL+6.5,sl[1]-1.0,0.0,-1.0],
                [this.q_hole5(),A_HOLE5,sl[0]+WALL+3.5,sl[1]-1.0,0.0,-1.0]];
    for(const [q,area,x0,z0,vx,vz] of rows){
      if(q<=0.5) continue;
      const v=q/area;
      let x=x0+v*vx*t, z=z0+v*vz*t;
      if(insideBin){ x=Math.min(x,BIN_X1-BIN_WALL-0.5); z=Math.max(z,BIN_Z0+BIN_WALL+0.5); }
      if(best===null||q>best[2]) best=[x,z,q];
    }
    return best?[best[0],best[1]]:null;
  }
  b_jet(){
    if(!this.on.tankB) return null;
    const sl=this.slot("tankB");
    const y0=this.obj_y("tankB")+WALL+B_HOLE_Z;
    const x0=sl[0]+TANK_W+2*WALL, z0=sl[1]+WALL+TANK_D/2.0;
    const q=this.q_tankB();
    return [x0,y0,z0, q>0?q/A_HOLE5:0.0];
  }
  b_feeds_a(){
    const j=this.b_jet();
    if(!j||j[3]<=0||!this.on.tankA) return false;
    const [x0,y0,z0,v]=j;
    const sa=this.slot("tankA"), ya=this.obj_y("tankA");
    const ysurf=ya+WALL+Math.max(0.0,this.VA/this.area);
    if(ysurf>=y0) return false;
    const t=Math.sqrt(2.0*(y0-ysurf)/G);
    const xl=x0+v*t;
    return sa[0]+WALL<=xl && xl<=sa[0]+WALL+TANK_W && sa[1]+WALL<=z0 && z0<=sa[1]+WALL+TANK_D;
  }
  tilt_angle(){ return (18.0+112.0*this.pour_tilt)*Math.PI/180.0; }
  head_over_lip(){
    if(!this.pouring) return 0.0;
    const src=this.pouring[0];
    if(src!=="bottle1"&&src!=="bottle2"&&src!=="beaker") return 0.0;
    const [poly,lip,cap]=vesselGeom(src);
    const a=-this.tilt_angle();
    const Pp=rot(poly,a), L=rot([lip],a)[0];
    const dd=fillLine(Pp,this.vol(src)/cap);
    return dd-L[1];
  }
  get pour_rate(){
    if(!this.pouring) return 0.0;
    const src=this.pouring[0];
    if(src==="bottle1"||src==="bottle2"||src==="beaker") this.pour_head=this.head_over_lip();
    const h=Math.max(0.0,this.pour_head);
    if(src==="bottle1"||src==="bottle2") return CD_NECK*A_NECK*Math.sqrt(2.0*G*h);
    if(src==="beaker") return CD_LIP*A_LIP*Math.sqrt(2.0*G*h);
    return 150.0;
  }
  fall_time(){ return Math.sqrt(2.0*Math.max(0.5,this.pour_drop)/G); }
  overflowing(tank){
    if(tank==="tankA") return !!this.on.tankA && this.VA>=A_CAP-0.5 && this._inflow("tankA")>0.5;
    return !!this.on.tankB && this.VB>=B_CAP-0.5 && this._inflow("tankB")>0.5;
  }
  _inflow(cid){
    let q=0.0;
    if(this.pouring && this.pouring[1]===cid) q+=this.pour_rate;
    for(const p of this.inflight) if(p[2]===cid) q+=1.0;
    if(cid==="tankA"&&this.b_feeds_a()) q+=this.q_tankB();
    return q;
  }
  vol(cid){
    return {tankA:this.VA, tankB:this.VB, bin:this.Vbin, beaker:this.beaker,
            bottle1:this.bottle[0], bottle2:this.bottle[1]}[cid] || 0.0;
  }
  pending_(cid){ let s=0; for(const p of this.inflight) if(p[2]===cid) s+=p[0]; return s; }
  room(cid){ return Math.max(0.0,(this.CAP[cid]||0.0)-this.vol(cid)-this.pending_(cid)); }
  add(cid,v){
    if(cid==="tankA") this.VA+=v;
    else if(cid==="tankB") this.VB+=v;
    else if(cid==="bin") this.Vbin+=v;
    else if(cid==="beaker") this.beaker+=v;
    else if(cid==="bottle1") this.bottle[0]+=v;
    else if(cid==="bottle2") this.bottle[1]+=v;
    else { const [x,z]=this._spill_xz||[26.0,-7.0]; this.spill(v,x,z); }
  }
  get puddle(){ let s=0; for(const p of this.puddles) s+=p[2]; return s; }
  get spilled(){ return this.puddle+this.wiped; }
  spill(v,x,z){
    if(v<=0.0) return;
    for(const pd of this.puddles){
      if((pd[0]-x)**2+(pd[1]-z)**2 < (pd[3]+2.0)**2){ pd[2]+=v; return; }
    }
    this.puddles.push([x,z,v,0.4]);
  }
  wipe(v,x,z){
    v = v===undefined?250.0:v;
    if(!this.puddles.length) return 0.0;
    let i;
    if(x===undefined||x===null){
      i=0; for(let k=1;k<this.puddles.length;k++) if(this.puddles[k][2]>this.puddles[i][2]) i=k;
    }else{
      i=0; let bd=Infinity;
      for(let k=0;k<this.puddles.length;k++){
        const dd=(this.puddles[k][0]-x)**2+(this.puddles[k][1]-z)**2;
        if(dd<bd){ bd=dd; i=k; }
      }
    }
    const pd=this.puddles[i];
    const got=Math.min(v,pd[2]);
    pd[2]-=got; this.wiped+=got;
    this.towel_wet=Math.min(1.0,this.towel_wet+got/400.0);
    if(pd[2]<0.5) this.puddles.splice(i,1);
    return got;
  }
  take(cid,v){ v=Math.min(v,this.vol(cid)); this.add(cid,-v); return v; }
  step(dt,sub){
    sub=sub||0.01;
    if(dt<=0) return;
    const n=Math.max(1,Math.ceil(dt/sub)), h=dt/n;
    for(let i=0;i<n;i++) this._one(h);
  }
  _one(dt){
    this.t+=dt;
    const in_bin = this.on.base==="bin"||this.on.stand==="bin"||this.on.tankA==="bin";
    if(in_bin && this.bin_depth>FLOAT_DEPTH){
      const a=Math.min(0.03,0.05*(this.bin_depth-FLOAT_DEPTH));
      this.wobble=a*Math.sin(2.2*this.t)+0.4*a*Math.sin(5.7*this.t+1.0);
    }else this.wobble=0.0;

    if(this.pouring){
      const [src,dst]=this.pouring;
      const v=Math.min(this.pour_rate*dt, this.vol(src), this.room(dst));
      if(this.vol(src)<=1e-9||this.room(dst)<=1e-9) this.pouring=null;
      else if(v>1e-9){
        this.take(src,v);
        const ta=this.t+this.fall_time();
        const last=this.inflight[this.inflight.length-1];
        if(last && last[2]===dst && ta-last[1]<0.02) last[0]+=v;
        else this.inflight.push([v,ta,dst]);
      }
    }
    if(this.inflight.length){
      const keep=[];
      for(const parcel of this.inflight){
        if(parcel[1]<=this.t){
          this.add(parcel[2],parcel[0]);
          if(parcel[2] in this.surge) this.surge[parcel[2]]+=parcel[0];
        }else keep.push(parcel);
      }
      this.inflight=keep;
    }
    if(this.pumping&&this.pump_in&&this.pump_out){
      const ph=(this.t%PUMP_STROKE_T)/PUMP_STROKE_T;
      const f=Math.max(0.0,Math.sin(Math.PI*ph))*(Math.PI/2.0);
      if(this.vol(this.pump_in)<=1e-9||this.room(this.pump_out)<=1e-9) this.pumping=false;
      else{
        const v=Math.min(PUMP_RATE*f*dt, this.vol(this.pump_in), this.room(this.pump_out));
        this.take(this.pump_in,v); this.add(this.pump_out,v);
      }
    }
    const qb=this.q_tankB();
    if(qb>0){
      const v=this.take("tankB",qb*dt);
      const j=this.b_jet();
      if(this.b_feeds_a()){
        const sa=this.slot("tankA");
        this.land.tankA=[sa[0]+8.0,sa[1]+5.5];
        this.add("tankA",v);
      }else if(this.over_bin("tankB")){
        this.land.bin = j?[j[0]+8.0,j[2]]:[26.0,12.0];
        this.add("bin",v);
      }else{
        this._spill_xz = j?[j[0]+8.0,j[2]-3.0]:null;
        this.add("spill",v);
        this._spill_xz=null;
      }
    }
    const q=this.q_valve()+this.q_hole4()+this.q_hole5();
    if(q>0){
      const v=this.take("tankA",q*dt);
      const px=this.jet_land()||[26.0,10.0];
      if(this.over_bin("tankA")){ this.land.bin=px; this.add("bin",v); }
      else{ this._spill_xz=[px[0],px[1]-6.0]; this.add("spill",v); this._spill_xz=null; }
    }
    for(const [tank,cap] of [["tankA",A_CAP],["tankB",B_CAP]]){
      const vol = tank==="tankA"?this.VA:this.VB;
      if(vol>cap){
        const over=vol-cap;
        if(tank==="tankA") this.VA=cap; else this.VB=cap;
        const sl=this.slot(tank);
        if(this.over_bin(tank)){
          if(sl) this.land.bin=[sl[0]+5.5,sl[1]-2.0];
          this.add("bin",over);
        }else{
          this._spill_xz = sl?[sl[0]+5.5,sl[1]-3.0]:null;
          this.add("spill",over);
          this._spill_xz=null;
        }
      }
    }
    for(const k in this.slosh)
      if(this.slosh[k]>0.0) this.slosh[k]=Math.max(0.0,this.slosh[k]-3.0*dt);
    for(const pd of this.puddles){
      const req=Math.sqrt(Math.max(pd[2],1.0)/(Math.PI*PUDDLE_T));
      pd[3] = pd[3]<req ? Math.min(req,pd[3]+PUDDLE_SPREAD*dt) : req;
    }
    for(const k in this.surge){
      if(this.surge[k]>1e-6){
        const h=Math.max(1.0,(k==="tankA"?this.VA:this.VB)/this.area);
        const tau=Math.max(0.001,TANK_D/(2.0*Math.sqrt(G*h)));
        this.surge[k]*=Math.exp(-dt/tau);
        if(this.surge[k]<1e-6) this.surge[k]=0.0;
      }
    }
    if(this.beaker>BEAKER_CAP){ this.add("puddle",this.beaker-BEAKER_CAP); this.beaker=BEAKER_CAP; }
    for(const i of [0,1])
      if(this.bottle[i]>BOTTLE_CAP){ this.add("puddle",this.bottle[i]-BOTTLE_CAP); this.bottle[i]=BOTTLE_CAP; }
    this.VA=Math.max(0.0,this.VA);
    this.VB=Math.max(0.0,this.VB);
  }
}

function layout(){

function fit(){

  if(!S.touched){
    const du=VIEW_U1-VIEW_U0, dv=VIEW_V1-VIEW_V0;
    S.basePpcm=Math.min(CW/du,CH/dv);
    const k=S.basePpcm*S.zoom;
    S.pan=[VIEW_U0-(CW/k-du)/2.0, VIEW_V0-(CH/k-dv)/2.0];
  }
}
const UV = (u,v)=>{ const k=ppcm(); return [(u-S.pan[0])*k, CH-(v-S.pan[1])*k]; };
const NP = (x,y,z)=>{ const p=proj(x,y,z); return UV(p[0],p[1]); };
const INV = (px,py)=>{ const k=ppcm(); return [px/k+S.pan[0], (CH-py)/k+S.pan[1]]; };

function shearOf(obj,x,z){
  const sl=w.slot(obj);
  if(sl===null) return 0.0;
  const [tx,tz]=w.tilt_of(obj);
  const cx=sl[0]+(obj==="base"?BASE_W/2:obj==="stand"?ST_W/2:5.5);
  const cz=sl[1]+(obj==="base"?BASE_D/2:obj==="stand"?ST_D/2:5.5);
  return -(x-cx)*tx-(z-cz)*tz;
}
function OP(obj,x,y,z){
  const sl=w.slot(obj);
  if(sl===null) return NP(x,y,z);
  const [tx,tz]=w.tilt_of(obj);
  const cx=sl[0]+(obj==="base"?BASE_W/2:obj==="stand"?ST_W/2:5.5);
  const cz=sl[1]+(obj==="base"?BASE_D/2:obj==="stand"?ST_D/2:5.5);
  return NP(x, y-(x-cx)*tx-(z-cz)*tz, z);
}

function F(pt,bold){
  return (bold?"bold ":"")+(pt*1.33).toFixed(1)+'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
}
function anchorSet(a){
  if(a==="w"){ ctx.textAlign="left"; ctx.textBaseline="middle"; }
  else if(a==="e"){ ctx.textAlign="right"; ctx.textBaseline="middle"; }
  else if(a==="sw"){ ctx.textAlign="left"; ctx.textBaseline="bottom"; }
  else if(a==="nw"){ ctx.textAlign="left"; ctx.textBaseline="top"; }
  else { ctx.textAlign="center"; ctx.textBaseline="middle"; }
}
function TXT(x,y,txt,opt){
  opt=opt||{};
  ctx.font=F(opt.size||8,opt.bold);
  anchorSet(opt.anchor);
  ctx.fillStyle=opt.fill||C_TXT;
  const lines=String(txt).split("\n");
  const lh=(opt.size||8)*1.33*1.25;
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lh));
}
function LINE(pts,stroke,width,round,dash){
  if(pts.length<2) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=stroke; ctx.lineWidth=width||1;
  ctx.lineJoin="round"; ctx.lineCap=round?"round":"butt";
  if(dash) ctx.setLineDash(dash);
  ctx.stroke();
  if(dash) ctx.setLineDash([]);
  ctx.lineCap="butt";
}
function POLY(pts,fill,outline,width){
  if(pts.length<2) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.lineJoin="round"; ctx.stroke(); }
}
function OVAL(x0,y0,x1,y1,fill,outline,width){
  ctx.beginPath();
  ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,2*Math.PI);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.stroke(); }
}
function RECTPX(x0,y0,x1,y1,fill,outline,width){
  const a=Math.min(x0,x1), b=Math.min(y0,y1);
  if(fill){ ctx.fillStyle=fill; ctx.fillRect(a,b,Math.abs(x1-x0),Math.abs(y1-y0)); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1;
               ctx.strokeRect(a,b,Math.abs(x1-x0),Math.abs(y1-y0)); }
}
function rectOf(pts){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  return [Math.min.apply(null,xs),Math.min.apply(null,ys),
          Math.max.apply(null,xs),Math.max.apply(null,ys)];
}
function boxFaces(f,x0,x1,y0,y1,z0,z1,top,side,front,outline){
  POLY([f(x1,y0,z0),f(x1,y1,z0),f(x1,y1,z1),f(x1,y0,z1)],side,outline,1);
  POLY([f(x0,y1,z0),f(x1,y1,z0),f(x1,y1,z1),f(x0,y1,z1)],top,outline,1);
  POLY([f(x0,y0,z0),f(x1,y0,z0),f(x1,y1,z0),f(x0,y1,z0)],front,outline,1);
}
function sp(pts,u,v,ang){
  ang=ang||0.0;
  const ca=Math.cos(ang), sa=Math.sin(ang);
  return pts.map(([dx,dy])=>UV(u+dx*ca-dy*sa, v+dx*sa+dy*ca));
}

function drawRipples(){
  for(const cid of ["tankA","tankB","bin"]){
    if(w._inflow(cid)<=0.5 || !(cid in w.land)) continue;
    const [x,z]=w.land[cid];
    let y, rmax;
    if(cid==="tankA"&&w.on.tankA){ const b=tankABox(); y=b[2]+WALL+w.VA/w.area; rmax=5.0; }
    else if(cid==="tankB"&&w.on.tankB){ const b=tankBBox(); y=b[2]+WALL+w.VB/w.area; rmax=5.0; }
    else if(cid==="bin"){ y=BIN_FLOOR+w.bin_depth; rmax=9.0; }
    else continue;
    const h=Math.max(0.6,(cid==="tankA"?w.VA:cid==="tankB"?w.VB:w.bin_depth*w.area)/w.area);
    const c=Math.sqrt(G*Math.min(h,12.0));
    for(let k=0;k<3;k++){
      const r=(w.t*c+k*rmax/3.0)%rmax;
      if(r<0.3) continue;
      const pts=[];
      for(let i=0;i<14;i++){ const a=2*Math.PI*i/14; pts.push(NP(x+r*Math.cos(a),y,z+r*Math.sin(a))); }
      POLY(pts,null,"#cdeffb",1);
    }
  }
}
function jetTrace(x,y,z,vx,vz,area,vy){
  vy=vy||0.0;
  const pts=[]; let t=0.0; const dt=0.018;
  const insideBin=w.over_bin("tankA");
  const yl=insideBin?BIN_FLOOR+w.bin_depth:0.0;
  const wx1=BIN_X1-BIN_WALL, wz0=BIN_Z0+BIN_WALL;
  let hit=null;
  for(let i=0;i<90;i++){
    const px=x+vx*t, pz=z+vz*t, py=y+vy*t-0.5*G*t*t;
    if(insideBin&&(px>=wx1||pz<=wz0)){
      hit=[Math.min(px,wx1),py,Math.max(pz,wz0)];
      pts.push(NP(hit[0],hit[1],hit[2]));
      break;
    }
    pts.push(NP(px,py,pz));
    if(py<=yl) break;
    t+=dt;
  }
  if(hit){
    LINE([NP(hit[0],hit[1],hit[2]),NP(hit[0],yl,hit[2])],"#a6e0f4",
         Math.max(1,0.9*Math.sqrt(area/Math.PI)*ppcm()));
  }
  if(pts.length<2) return null;
  LINE(pts,"#a6e0f4",Math.max(1,2.0*Math.sqrt(area/Math.PI)*ppcm()),true);
  return pts[pts.length-1];
}
function drawJets(){
  if(w.on.tankA){
    const [x0,x1,y0,y1,z0,z1]=tankABox();
    const oy=y0+WALL+A_OUT_Z;
    const [tx,tz]=w.tilt_of("tankA");
    for(const [q,area,xx,zz,vxs,vzs] of
        [[w.q_valve(),A_VALVE,x1+2.6,z0+WALL+7.5,1.0,0.0],
         [w.q_hole4(),A_HOLE4,x0+WALL+6.5,z0-1.0,0.0,-1.0],
         [w.q_hole5(),A_HOLE5,x0+WALL+3.5,z0-1.0,0.0,-1.0]]){
      if(q>0.5){
        const v=q/area;
        const ys=oy+shearOf("tankA",xx,zz);
        const vy=-v*(vxs*tx+vzs*tz);
        const p=jetTrace(xx,ys,zz,v*vxs,v*vzs,area,vy);
        if(p) OVAL(p[0]-5,p[1]-3,p[0]+5,p[1]+3,null,"#c8ecf8",1);
      }
    }
  }
  for(const tank of ["tankA","tankB"]) if(w.overflowing(tank)) drawOverflow(tank);
  const j=w.b_jet();
  if(j&&j[3]>1.0){
    let [bx,by,bz,v]=j;
    let ytop;
    if(w.on.tankA){
      const ay=w.obj_y("tankA");
      ytop=ay+WALL+w.VA/w.area;
    }else ytop = w.over_bin("tankB") ? BIN_FLOOR+w.bin_depth : 0.0;
    const pts=[]; let t=0.0; const dt=0.02;
    const [btx,btz]=w.tilt_of("tankB");
    by+=shearOf("tankB",bx,bz);
    const vyb=-v*btx;
    for(let i=0;i<90;i++){
      const px=bx+0.9+v*t, py=by+vyb*t-0.5*G*t*t;
      pts.push(NP(px,py,bz));
      if(py<=ytop) break;
      t+=dt;
    }
    if(pts.length>1) LINE(pts,"#a6e0f4",Math.max(2,2.0*Math.sqrt(A_HOLE5/Math.PI)*ppcm()),true);
  }
}
function drawOverflow(tank){
  const box = tank==="tankA"?tankABox():tankBBox();
  if(!box) return;
  const [x0,x1,y0,y1,z0,z1]=box;
  const f=(x,y,z)=>OP(tank,x,y,z);
  let yl;
  if(tank==="tankA") yl = w.over_bin("tankA") ? BIN_FLOOR+w.bin_depth : 0.02;
  else if(w.on.tankA){ const ab=tankABox(); yl=ab[2]+WALL+w.VA/w.area; }
  else yl = w.over_bin("tankB") ? BIN_FLOOR+w.bin_depth : 0.02;
  for(const [xx,zz] of [[x0+2.0,z0],[x1-2.5,z0],[x1,z0+3.0],[x1,z1-2.5]]){
    const top=f(xx,y1,zz), mid=f(xx,y0,zz), bot=NP(xx,yl,zz);
    const wid=Math.max(2,0.3*ppcm());
    LINE([top,mid],"#bfe8f8",wid);

    OVAL(bot[0]-r*1.6,bot[1]-r*0.6,bot[0]+r*1.6,bot[1]+r*0.6,null,"#cdeffb",1);

  TXT(p[0],p[1],d().overflow,{anchor:"e",fill:"#a6e0f4",size:8});

/* ── hand-held vessels ── */
function zoneOf(cid){
  return {tankA:"mouthA", tankB:"mouthB", bin:"bin", beaker:"beaker",
          bottle1:"bottle1", bottle2:"bottle2"}[cid] || cid;
}
function pourPose(name,u,v,lipvec){
  if(!(w.pouring&&w.pouring[0]===name)) return [u,v,0.0,null];
  const z=S.zones[zoneOf(w.pouring[1])];
  const tilt=(18.0+112.0*w.pour_tilt)*Math.PI/180.0;
  if(!z) return [u,v,-tilt,null];
  const tx=(z[0]+z[2])/2.0, ty=z[1];
  const ang = tx<CW*0.5 ? -tilt : tilt;
  let [lu,lv]=INV(tx,ty);
  lv+=3.5;
  const ca=Math.cos(ang), sa=Math.sin(ang);
  const [lx,ly]=lipvec;
  const bu=lu-(lx*ca-ly*sa), bv=lv-(lx*sa+ly*ca);
  return [bu,bv,ang,UV(lu,lv)];
}
function vesselWater(name,u,v,ang,vol,cap,poly){
  const frac=vol/cap;
  if(frac<=0.002) return;
  const sl=w.slosh[name]||0.0;
  const sa=0.3*sl*Math.sin(9.0*w.t);
  const Pp=rot(poly,ang);
  const nx=-Math.sin(sa), ny=Math.cos(sa);
  const dd=fillLine(Pp,frac,nx,ny);
  const wp=clipBelow(Pp,nx,ny,dd);
  if(wp.length<3) return;
  const pp=wp.map(([x,y])=>UV(u+x,v+y));
  POLY(pp,"#3f9fd0",null);
  const order=wp.map((p,i)=>i).sort((a,b)=>
    (wp[b][0]*nx+wp[b][1]*ny)-(wp[a][0]*nx+wp[a][1]*ny)).slice(0,2);
  if(order.length===2) LINE([pp[order[0]],pp[order[1]]],"#bfe8fa",2);
}
function tiltGauge(pts){
  const xs=pts.map(q=>q[0]), ys=pts.map(q=>q[1]);
  const L=46;
  let x0=Math.max.apply(null,xs)+12;
  const y0=Math.min.apply(null,ys)-6;
  if(x0+L>CW-6) x0=Math.min.apply(null,xs)-L-12;
  LINE([[x0,y0],[x0+L,y0]],"#4a525b",1);
  LINE([[x0,y0],[x0+L*w.pour_tilt,y0]],"#e8623a",5);
  TXT(x0+L/2,y0-9,d().tiltGauge,{fill:"#9aa3ab",size:7,anchor:"c"});
}
function stream(m,tgt,wide){
  let dia;
  if(wide===undefined||wide===null){
    const q=w.pour_rate;
    if(q<1.0) return;
    dia=2.0*Math.sqrt(q/120.0/Math.PI);
  }else dia=wide/Math.max(1.0,ppcm());
  const k0=Math.max(1.2,dia*ppcm()), k1=k0*0.72;
  const mx=(m[0]+tgt[0])/2.0;
  const my=Math.min(m[1],tgt[1])+Math.abs(tgt[0]-m[0])*0.1;
  const n=8;
  for(let i=0;i<n;i++){
    const t0=i/n, t1=(i+1)/n;
    const p0=[(1-t0)**2*m[0]+2*(1-t0)*t0*mx+t0*t0*tgt[0],
              (1-t0)**2*m[1]+2*(1-t0)*t0*my+t0*t0*tgt[1]];
    const p1=[(1-t1)**2*m[0]+2*(1-t1)*t1*mx+t1*t1*tgt[0],
              (1-t1)**2*m[1]+2*(1-t1)*t1*my+t1*t1*tgt[1]];
    LINE([p0,p1],"#a6e0f4",Math.max(1,k0+(k1-k0)*t0),true);
  }
}
function drBottle(name,u,v){
  const idx = name.endsWith("1")?0:1;
  const vol=w.bottle[idx];
  const pouring = w.pouring && w.pouring[0]===name;
  let ang, lipPx;
  [u,v,ang,lipPx]=pourPose(name,u,v,BOTTLE_LIP);
  const body=[[-4,0],[4,0],[4,15],[2.2,17.5],[1.6,21.5],[-1.6,21.5],[-2.2,17.5],[-4,15]];
  const pts=sp(body,u,v,ang);
  POLY(pts,"#eaf5fa",null);
  vesselWater(name,u,v,ang,vol,BOTTLE_CAP,BOTTLE_POLY);
  POLY(pts,null,"#5d8fa6",2);
  POLY(sp([[-1.7,21.5],[1.7,21.5],[1.7,23.2],[-1.7,23.2]],u,v,ang),"#2f6f9f","#1b415e",1);
  for(let k=1;k<4;k++){
    const yy=15.0*k/4.0;
    LINE(sp([[-4.0,yy],[-2.6,yy]],u,v,ang),"#8fb3c4",1);

  LINE(sp([[-3.0,1.5],[-3.0,14.0]],u,v,ang),"#ffffff",1);

    stream(m,land);

}

function drPump(u,v){
  const T0=UV(u,v);
  let tgt=null;
  if(w.pump_in){
    const z=S.zones[zoneOf(w.pump_in)];
    if(z) tgt=[(z[0]+z[2])/2,(z[1]+z[3])/2];
  }
  let dx,dy,L;
  if(tgt){
    dx=tgt[0]-T0[0]; dy=tgt[1]-T0[1];
    L=Math.hypot(dx,dy)||1.0; dx/=L; dy/=L;
  }else{ dx=0.0; dy=1.0; L=RIGID_LEN*ppcm(); }
  const nx=-dy, ny=dx, k=ppcm();
  const PP=(along,across)=>[T0[0]+dx*along*k+nx*across*k, T0[1]+dy*along*k+ny*across*k];
  const tubeLen=RIGID_LEN;
  for(const [off,col] of [[0.62,"#dfe5e6"],[0.0,"#f6f9f9"],[-0.62,"#cfd6d7"]])
    LINE([PP(1.4,off),PP(tubeLen,off)],col,Math.max(2,0.45*k));
  const squeeze = (w.pumping && (w.t%PUMP_STROKE_T)<0.5*PUMP_STROKE_T) ? 0.8 : 1.0;
  const BL=6.8*squeeze, nrib=11;
  for(let i=0;i<nrib;i++){
    const t0=1.9+BL*i/nrib, t1=1.9+BL*(i+1)/nrib;
    const r0=1.85+0.55*i/nrib, r1=1.85+0.55*(i+1)/nrib;
    POLY([PP(-t0,-r0),PP(-t1,-r1),PP(-t1,r1),PP(-t0,r0)], i%2?"#f04a2e":"#d3341f","#8e2114",1);
  }
  POLY([PP(-1.9-BL,-2.4),PP(-2.6-BL,-1.9),PP(-2.6-BL,1.9),PP(-1.9-BL,2.4)],"#e8402c","#8e2114",1);
  POLY([PP(-1.9,-1.45),PP(1.5,-1.45),PP(1.5,1.45),PP(-1.9,1.45)],"#f4f7f7","#a9b0b0",1);
  POLY([PP(0.1,-2.1),PP(0.75,-2.1),PP(0.75,2.1),PP(0.1,2.1)],"#eef2f2","#a9b0b0",1);
  POLY([PP(-0.9,-2.0),PP(-0.2,-2.0),PP(-0.2,-1.3),PP(-0.9,-1.3)],"#eef2f2","#a9b0b0",1);
  S.zones.pumpbulb=rectOf([PP(-2.6-BL,-2.6),PP(-2.6-BL,2.6),PP(-1.6,2.6),PP(-1.6,-2.6)]);
  S.zones.pump=rectOf([PP(-1.6,-2.2),PP(-1.6,2.2),PP(2.2,2.2),PP(2.2,-2.2)]);
  if(tgt){
    const p=PP(tubeLen*0.55,1.9);
    TXT(p[0],p[1],d().intake,{fill:"#9fb0b4",size:8,anchor:"c"});
  }
  S.pumpBranch=PP(0.45,2.0);
}
function drHose(u,v){
  const a=S.pumpBranch||UV(S.toolPos.pump[0],S.toolPos.pump[1]);
  const b=UV(u,v);
  const mid=[(a[0]+b[0])/2, Math.max(a[1],b[1])+30];
  ctx.beginPath(); ctx.moveTo(a[0],a[1]);
  ctx.quadraticCurveTo(mid[0],mid[1],b[0],b[1]);
  ctx.strokeStyle="#e4e9ea"; ctx.lineWidth=Math.max(3,0.72*ppcm());
  ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt";
  const n=14;
  for(let i=1;i<n;i++){
    const t=i/n;
    const x=(1-t)**2*a[0]+2*(1-t)*t*mid[0]+t*t*b[0];
    const y=(1-t)**2*a[1]+2*(1-t)*t*mid[1]+t*t*b[1];
    const r=Math.max(2,0.36*ppcm());
    LINE([[x-r,y],[x+r,y]],"#c3cacb",1);
  }
  const pts=sp([[-0.7,0],[0.7,0],[0.7,2.6],[-0.7,2.6]],u,v,0);
  POLY(pts,"#f2f5f5","#9aa3a4",1);
  const lab=d().outlet+(w.pump_out?" → "+d().cont[w.pump_out]:"");
  TXT(b[0],b[1]-8,lab,{fill:"#9fb0b4",size:8,anchor:"c"});
  S.zones.hose=rectOf(pts);
}
function drRuler(u,v){
  const L=30.0, Wd=3.4, ang=S.rulerAng;
  const pts=sp([[0,0],[L,0],[L,Wd],[0,Wd]],u,v,ang);
  POLY(pts,"#eef5f8","#5d6a70",1);
  const ca=Math.cos(ang), sa=Math.sin(ang);
  const step = ppcm()>15 ? 1 : ppcm()>8 ? 5 : 10;
  for(let i=0;i<=Math.round(L*10);i+=step){
    const x=i/10.0;
    const h = i%10===0 ? 2.1 : i%5===0 ? 1.4 : 0.8;
    const a=UV(u+x*ca, v+x*sa);
    const b=UV(u+x*ca-h*sa, v+x*sa+h*ca);
    LINE([a,b],"#20282c", i%10===0?2:1);
    if(i%50===0&&ppcm()>8){
      const t=UV(u+x*ca-2.8*sa, v+x*sa+2.8*ca);
      TXT(t[0],t[1],String(Math.floor(i/10)),{fill:"#20282c",size:Math.max(6,0.5*ppcm()),anchor:"c"});
    }
  }
  POLY(sp([[L-4.5,0],[L,0],[L,Wd],[L-4.5,Wd]],u,v,ang),"#1f4fa0","#123268",1);
  S.zones.ruler=rectOf(pts);
}
function levelAnchor(){
  const s = (S.levelSurf==="desk"||S.levelSurf==="base") ? S.levelSurf : "desk";
  if(s==="base"&&w.on.base){
    const sl=SLOT.base[w.on.base];
    return ["base", sl[0]+19.0, w.plate_y, sl[1]+1.0];
  }
  return ["desk",50.0,0.0,-3.5];
}
function drLevel(){
  const [surf,ax,ay,az]=levelAnchor();
  const f = surf==="base" ? ((x,y,z)=>OP("base",x,y,z)) : NP;
  const W_=5.4, H_=1.2;
  boxFaces(f,ax,ax+W_,ay,ay+H_,az,az+W_,"#e2dc2a","#a39d15","#c8c31d","#6f6c0c");
  const c=f(ax+W_/2, ay+H_, az+W_/2);
  const r=1.75*ppcm();
  OVAL(c[0]-r,c[1]-r*0.9,c[0]+r,c[1]+r*0.9,"#e6f7e8","#5c6b3d",2);
  const rr=0.85*ppcm();
  OVAL(c[0]-rr,c[1]-rr*0.9,c[0]+rr,c[1]+rr*0.9,null,"#8fa06d",1);
  const [tx,tz]=w.surface_tilt(surf);
  const dx=Math.max(-1,Math.min(1,-tx*90.0))*1.15*ppcm();
  const dy=Math.max(-1,Math.min(1, tz*90.0))*1.05*ppcm();
  const b=0.62*ppcm();
  OVAL(c[0]+dx-b,c[1]+dy-b,c[0]+dx+b,c[1]+dy+b,"#7fd48f","#2f6b3c",1);
  S.zones.level=[c[0]-r-4,c[1]-r-4,c[0]+r+4,c[1]+r+4];
}
function drTowel(u,v){
  const pts=sp([[0,0],[9,0],[9,6],[0,6]],u,v,0);
  const col=mix("#cf7f6a","#7a4a52",Math.min(1.0,w.towel_wet));
  POLY(pts,col,"#8d503f",1);
  for(const i of [1.5,3.0,4.5]) LINE([UV(u+0.4,v+i),UV(u+8.6,v+i)],"#8d503f",1);
  S.zones.towel=rectOf(pts);
}
function drawTargets(){
  if(!S.carry) return;
  const [px,py]=S.mouse;
  const lbl=d().trayItems[S.carry]||S.carry;
  TXT(px+14,py-12,"⇱ "+lbl,{anchor:"w",fill:C_ACC,size:10,bold:true});
}

   6.  MAIN RENDER

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(S.side){ drawSide(); return; }
  if(S.plan){ drawPlan(); return; }
  ctx.fillStyle="#232830"; ctx.fillRect(0,0,CW,CH);

  /* bg */
  drawDesk();
  drawBinBack();
  /* bin water */
  if(w.Vbin>1) water(NP,BIN_X0+BIN_WALL,BIN_X1-BIN_WALL,BIN_Z0+BIN_WALL,BIN_Z1-BIN_WALL,
                     BIN_FLOOR,w.bin_surface_y,true);
  /* back group */
  if(w.on.base) drawBase();
  if(w.on.stand) drawStand();
  if(w.on.tankA) drawTankABack();
  if(w.on.tankB) drawTankBBack();
  /* tank water */
  for(const o of ["tankA","tankB"]){
    if(!w.on[o]) continue;
    const b = o==="tankA"?tankABox():tankBBox();
    const vol = o==="tankA"?w.VA:w.VB;
    if(vol>1){
      const f=(x,y,z)=>OP(o,x,y,z);
      water(f,b[0]+WALL,b[1]-WALL,b[4]+WALL,b[5]-WALL,b[2]+WALL,b[2]+WALL+vol/w.area,false);
    }
  }
  /* front group */
  if(w.on.tankA) drawTankAFront();
  if(w.on.tankB) drawTankBFront();
  drawBinFront();
  if(S.toolOut.ruler) drRuler(S.toolPos.ruler[0],S.toolPos.ruler[1]);
  if(S.toolOut.towel) drTowel(S.toolPos.towel[0],S.toolPos.towel[1]);
  if(S.toolOut.level) drLevel();
  /* dynamic overlays */
  drawPuddles();
  drawJets();
  drawRipples();
  if(S.toolOut.pump) drPump(S.toolPos.pump[0],S.toolPos.pump[1]);
  if(S.toolOut.hose) drHose(S.toolPos.hose[0],S.toolPos.hose[1]);
  if(S.toolOut.beaker) drBeaker(S.toolPos.beaker[0],S.toolPos.beaker[1]);
  if(S.toolOut.bottle1) drBottle("bottle1",S.toolPos.bottle1[0],S.toolPos.bottle1[1]);
  if(S.toolOut.bottle2) drBottle("bottle2",S.toolPos.bottle2[0],S.toolPos.bottle2[1]);
  drawTargets();
}

function drawPlan(){
  ctx.fillStyle="#232830"; ctx.fillRect(0,0,CW,CH);
  const Pp=(x,z)=>UV(x,z);
  const box=(x0,z0,x1,z1,fill,outline,width)=>{
    const a=Pp(x0,z0), b=Pp(x1,z1);
    RECTPX(a[0],b[1],b[0],a[1],fill,outline,width);
  };
  box(BIN_X0-6,BIN_Z0-6,BIN_X1+6,BIN_Z1+6,C_DESK,null);
  box(BIN_X0,BIN_Z0,BIN_X1,BIN_Z1,C_BIN2,"#9aa8a8",2);
  const ix0=BIN_X0+BIN_WALL, ix1=BIN_X1-BIN_WALL;
  const iz0=BIN_Z0+BIN_WALL, iz1=BIN_Z1-BIN_WALL;
  box(ix0,iz0,ix1,iz1, w.Vbin>1?"#2b6f95":"#dfe6e6","#8fa0a0",2);
  if(w.on.base){
    const sl=SLOT.base[w.on.base];
    box(sl[0],sl[1],sl[0]+BASE_W,sl[1]+BASE_D,C_BLK,"#000",1);
  }
  if(w.on.stand){
    const sl=w.slot("stand");
    box(sl[0],sl[1],sl[0]+ST_W,sl[1]+ST_D,C_STAND,"#000",1);
  }
  for(const [tk,col] of [["tankA","#9fd9ef"],["tankB","#c6e8f6"]]){
    if(!w.on[tk]) continue;
    const sl=w.slot(tk);
    box(sl[0],sl[1],sl[0]+TANK_W+2*WALL,sl[1]+TANK_D+2*WALL,col,"#5d8fa6",2);
    const p=Pp(sl[0]+0.4,sl[1]+TANK_D);
    TXT(p[0],p[1], tk==="tankA"?d().labTankA:d().labTankB,
        {anchor:"w",fill:"#1d4453",size:8,bold:true});
  }
  const p=Pp(BIN_X0,BIN_Z1+2.0);
  TXT(p[0],p[1],d().planCap,{anchor:"w",fill:C_ACC,size:9,bold:true});
  drRuler(S.toolPos.ruler[0],S.toolPos.ruler[1]);
  S.zones.bin=rectOf([Pp(ix0,iz0),Pp(ix1,iz0),Pp(ix1,iz1),Pp(ix0,iz1)]);
}

function drawSide(){
  ctx.fillStyle="#232830"; ctx.fillRect(0,0,CW,CH);
  const tk=S.side;
  const b = tk==="tankA"?tankABox():tankBBox();
  if(!b){ S.side=null; return; }
  const [x0,x1,y0,y1]=[b[0],b[1],b[2],b[3]];
  const vol = tk==="tankA"?w.VA:w.VB;
  const Pp=(x,y)=>UV(x,y);
  const box=(xa,ya,xb,yb,fill,outline,width)=>{
    const a=Pp(xa,ya), c=Pp(xb,yb);
    RECTPX(a[0],c[1],c[0],a[1],fill,outline,width);
  };
  box(x0-14,y0-3.0,x1+14,y0,C_DESK,null);
  box(x0,y0,x1,y1,"#eaf5fa","#5d8fa6",3);
  const ix0=x0+WALL, ix1=x1-WALL, fl=y0+WALL;
  box(ix0,fl,ix1,y1,"#f7fcfe","#a8c6d2",1);
  const ys=fl+vol/w.area;
  if(vol>1){
    box(ix0,fl,ix1,ys,"#3f9fd0",null);
    box(ix0,ys,ix1,ys+MENISCUS,"#bfe8fa",null);
  }
  if(tk==="tankA"){
    const oy=fl+A_OUT_Z;
    const fsz=Math.max(7,Math.min(0.62*ppcm(),16));
    for(let kk=0;kk<=N_MARKS;kk++){
      const y=oy+kk;
      if(y>y1-0.2) break;
      LINE([Pp(ix0+1.2,y),Pp(ix0+4.4,y)],"#0d1f27",2);
      const t=Pp(ix0+1.0,y);
      TXT(t[0],t[1],String(kk),{anchor:"e",fill:"#0b1d24",size:fsz});
    }
    for(const [xr,plugged] of [[3.5,w.plugA5],[6.5,w.plugA4]]){
      const a=Pp(ix0+xr,oy), r=0.28*ppcm();
      OVAL(a[0]-r,a[1]-r,a[0]+r,a[1]+r, plugged?"#fbfbf8":"#123039","#7f97a2",1);
    }
    const a=Pp(x1,oy-0.35), c=Pp(x1+2.6,oy+0.35);
    RECTPX(a[0],c[1],c[0],a[1],C_METAL,"#5b6167",1);
    const hv=Pp(x1+1.2,oy), L=2.6*ppcm();
    const hx = w.valve?hv[0]+L:hv[0]+0.2*L;
    const hy = w.valve?hv[1]:hv[1]+L;
    LINE([hv,[hx,hy]],C_ORANGE,5,true);
    /* jets */
    const floor=y0-3.0;
    const qv=w.q_valve();
    if(qv>0.5){
      const v=qv/A_VALVE, pts=[]; let t=0.0;
      for(let i=0;i<80;i++){
        const xx=x1+2.6+v*t, yy=oy-0.5*G*t*t;
        pts.push(Pp(xx,yy));
        if(yy<=floor) break;
        t+=0.02;
      }
      if(pts.length>=2) LINE(pts,"#a6e0f4",Math.max(2,2.0*Math.sqrt(A_VALVE/Math.PI)*ppcm()),true);
    }
    for(const [xr,q,area] of [[3.5,w.q_hole5(),A_HOLE5],[6.5,w.q_hole4(),A_HOLE4]]){
      if(q<=0.5) continue;
      const a2=Pp(ix0+xr,oy), c2=Pp(ix0+xr,floor);
      LINE([a2,c2],"#a6e0f4",Math.max(2,2.0*Math.sqrt(area/Math.PI)*ppcm()));
      const r=0.5*ppcm();
      OVAL(c2[0]-r*1.6,c2[1]-r*0.6,c2[0]+r*1.6,c2[1]+r*0.6,null,"#cdeffb",1);
    }
  }else{
    const qb=w.q_tankB();
    if(qb>0.5){
      const v=qb/A_HOLE5, oyb=fl+B_HOLE_Z, pts=[]; let t=0.0;
      for(let i=0;i<80;i++){
        const xx=x1+0.9+v*t, yy=oyb-0.5*G*t*t;
        pts.push(Pp(xx,yy));
        if(yy<=y0-3.0) break;
        t+=0.02;
      }
      if(pts.length>=2) LINE(pts,"#a6e0f4",Math.max(2,2.0*Math.sqrt(A_HOLE5/Math.PI)*ppcm()),true);
    }
  }
  const p=Pp(x0,y1+1.6);
  TXT(p[0],p[1], tk==="tankA"?d().sideCapA:d().sideCapB,
      {anchor:"w",fill:C_ACC,size:9,bold:true});
  drRuler(S.toolPos.ruler[0],S.toolPos.ruler[1]);
}

let trayCells=[];
function trayIcon(c,name,x,y,dim){
  const g = dim?"#474d54":null;
  const rect=(a,b,e,f2,fill,out)=>{
    if(fill){ c.fillStyle=fill; c.fillRect(a,b,e-a,f2-b); }
    if(out){ c.strokeStyle=out; c.lineWidth=1; c.strokeRect(a,b,e-a,f2-b); }
  };
  const line=(a,b,e,f2,col,wd)=>{
    c.beginPath(); c.moveTo(a,b); c.lineTo(e,f2);
    c.strokeStyle=col; c.lineWidth=wd||1; c.stroke();
  };
  const oval=(a,b,e,f2,fill,out)=>{
    c.beginPath(); c.ellipse((a+e)/2,(b+f2)/2,(e-a)/2,(f2-b)/2,0,0,2*Math.PI);
    if(fill){ c.fillStyle=fill; c.fill(); }
    if(out){ c.strokeStyle=out; c.lineWidth=1; c.stroke(); }
  };
  if(name==="tankA"||name==="tankB"){
    rect(x-11,y-11,x+9,y+9,g||"#dff0f6","#7fa3b4");
    rect(x-10,y-1,x+8,y+8,g||"#5fb8dc",null);
    if(name==="tankA") line(x+9,y+3,x+15,y+3,g||C_ORANGE,3);
  }else if(name==="stand"){
    rect(x-12,y-12,x+2,y+12,g||C_STAND,"#000");
    rect(x+2,y+3,x+14,y+12,g||"#31343a","#000");
  }else if(name==="base"){
    rect(x-14,y-2,x+14,y+3,g||C_BLK,"#000");
    for(const dx of [-11,-4,4,11]) line(x+dx,y+3,x+dx,y+10,g||"#25282d",3);
  }else if(name.startsWith("bottle")){
    rect(x-6,y-9,x+6,y+11,g||"#e2f0f6","#7fa3b4");
    rect(x-5,y+1,x+5,y+10,g||"#5fb8dc",null);
    rect(x-2,y-13,x+2,y-9,g||"#2f6f9f",null);
  }else if(name==="beaker"){
    c.beginPath(); c.moveTo(x-6,y-8); c.lineTo(x+6,y-8); c.lineTo(x+8,y+10); c.lineTo(x-8,y+10);
    c.closePath(); c.fillStyle=g||"#eaf4f8"; c.fill();
    c.strokeStyle="#7d9fae"; c.lineWidth=1; c.stroke();
  }else if(name==="pump"){
    for(let i=0;i<5;i++) rect(x-5,y-10+i*4,x+5,y-7+i*4,g||"#e8402c","#8e2114");
    line(x,y+10,x+12,y+12,g||"#e9edee",3);
  }else if(name==="ruler"){
    rect(x-15,y-4,x+15,y+4,g||"#eef5f8","#5d6a70");
    rect(x+9,y-4,x+15,y+4,g||"#1f4fa0",null);
    for(let i=-13;i<9;i+=3) line(x+i,y-4,x+i,y,"#20282c",1);
  }else if(name==="level"){
    rect(x-9,y-9,x+9,y+9,g||"#d9d520","#8a870f");
    oval(x-6,y-6,x+6,y+6,g||"#e6f7e8","#5c6b3d");
    oval(x-2,y-2,x+2,y+2,g||"#7fd48f",null);
  }else if(name==="towel"){
    rect(x-12,y-8,x+12,y+8,g||"#cf7f6a","#8d503f");
  }
}
function drawTray(){
  const c=trayCtx;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,TRW,TRH);
  c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[];
  let y=6;
  const wd=TRW-12;
  for(const name of TRAY_ORDER){
    const out = !!S.toolOut[name] || !!w.on[name];
    c.fillStyle = out?"#171a1e":"#1f242b";
    c.fillRect(6,y,wd,48);
    c.strokeStyle = S.carry===name ? C_ACC : "#353b43";
    c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,47);
    trayIcon(c,name,28,y+24,out);
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle = out?"#868e96":C_TXT;
    c.fillText(d().trayItems[name],52,y+17);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    c.fillStyle="#69717a";
    c.fillText(out?d().trayOut:d().trayTake,52,y+33);
    trayCells.push([name,y,y+48]);
    y+=52;
  }
  c.font='10.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  c.textAlign="center"; c.textBaseline="top";
  c.fillStyle="#69717a";
  d().trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
trayCv.addEventListener("click",e=>{
  const r=trayCv.getBoundingClientRect();
  const y=e.clientY-r.top;
  for(const [name,y0,y1] of trayCells){
    if(y0<=y&&y<=y1){
      if(S.toolOut[name]||w.on[name]){ say("alreadyOut"); return; }
      S.carry=name; S.moving=null;
      if(["base","stand","tankA","tankB"].includes(name)) say("placeIt");
      else if(name==="pump") say("pumpFirst");
      drawTray();
      return;
    }
  }
});

/* ══════════════════════════════════════════════════════════════
   8.  INTERACTION
   ══════════════════════════════════════════════════════════════ */
function say(k){ w.msg = k===null?null:{k:k,a:Array.prototype.slice.call(arguments,1)}; }
function inZone(z,x,y){ return !!z && z[0]<=x && x<=z[2] && z[1]<=y && y<=z[3]; }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function benchPoint(px,py){
  const [u,v]=INV(px,py);
  return [u/(2*KC)-v/(2*KS), u/(2*KC)+v/(2*KS)];
}
function onBench(px,py){
  const [x,z]=benchPoint(px,py);
  return !(BIN_X0-1<=x&&x<=BIN_X1+1&&BIN_Z0-1<=z&&z<=BIN_Z1+1);
}
function allowedSurfaces(name){
  let out;
  if(name==="base") out=["desk","bin"];
  else if(name==="stand") out=["desk","bin"].concat(w.on.base?["base"]:[]);
  else if(name==="tankA"||name==="tankB"){
    out=["desk","bin"].concat(w.on.base?["base"]:[]);
    if(w.on.stand) out=out.concat(["stand_low","stand_high"]);
  }else return [];
  const res=[];
  for(const s of out){
    let occupied=false;
    for(const oo in w.on)
      if(w.on[oo]===s && oo!==name && (oo==="tankA"||oo==="tankB")) occupied=true;
    if((s==="stand_low"||s==="stand_high")&&occupied) continue;
    res.push(s);
  }
  const order={stand_high:0, stand_low:1, base:2, bin:3, desk:4};
  return res.sort((a,b)=>(order[a]===undefined?9:order[a])-(order[b]===undefined?9:order[b]));
}

cv.addEventListener("mousemove",e=>{
  const p=mousePos(e); S.mouse=p;
  if(S.drag){ onDrag(p); return; }
  if(S.view0){
    const [x0,y0,a,b]=S.view0;
    S.touched=true;
    const k=ppcm();
    S.pan=[a-(p[0]-x0)/k, b+(p[1]-y0)/k];
  }
  if(S.midPan){
    const [x0,y0,a,b]=S.midPan;
    S.touched=true;
    const k=ppcm();
    S.pan=[a-(p[0]-x0)/k, b+(p[1]-y0)/k];
  }
});
cv.addEventListener("mousedown",e=>{
  const p=mousePos(e); S.mouse=p;
  if(e.button===1){ e.preventDefault(); S.touched=true;
    S.midPan=[p[0],p[1],S.pan[0],S.pan[1]]; cv.classList.add("dragging"); return; }
  if(e.button!==0) return;
  onPress(p);
});
window.addEventListener("mouseup",e=>{
  if(S.midPan){ S.midPan=null; cv.classList.remove("dragging"); return; }
  if(e.target===cv||S.drag||S.view0||S.squeezing) onRelease(S.mouse);
});
cv.addEventListener("contextmenu",e=>{ e.preventDefault(); onRClick(mousePos(e)); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); onWheel(mousePos(e), e.deltaY<0?1:-1); },{passive:false});

function onPress(p){
  const [x,y]=p;
  if(S.carry){ drop(x,y); return; }
  for(const nm of ["valve","plugA4","plugA5","plugB"]){
    if(inZone(S.zones[nm],x,y)){ toggle(nm); return; }
  }
  if(S.toolOut.pump && inZone(S.zones.pumpbulb,x,y)){
    pump(true); S.squeezing=true; return;
  }
  for(const nm of ["hose","towel","ruler","level","beaker","bottle1","bottle2","pump"]){
    if(S.toolOut[nm] && inZone(S.zones[nm],x,y)){
      if(w.pouring&&w.pouring[0]===nm) w.pouring=null;
      const [u,v]=INV(x,y);
      S.drag=[nm, S.toolPos[nm][0]-u, S.toolPos[nm][1]-v];
      S.dragT=performance.now()/1000;
      say("dragIt");
      return;
    }
  }
  S.view0=[x,y,S.pan[0],S.pan[1]];
}
function onDrag(p){
  const [px,py]=p;
  if(S.squeezing) return;
  if(!S.drag) return;
  const [nm,dx,dy]=S.drag;
  const [u,v]=INV(px,py);
  const old=S.toolPos[nm];
  let neu=[u+dx, v+dy];
  const now=performance.now()/1000;
  const dt=Math.max(0.001, now-(S.dragT||now-0.02));
  S.dragT=now;
  if(nm==="beaker"||nm==="bottle1"||nm==="bottle2"){
    const spd=Math.hypot(neu[0]-old[0],neu[1]-old[1])/dt;
    slosh(nm,spd,px,py,dt);
  }else if(nm==="towel"){
    mop(px,py,dt);
  }else if(nm==="pump"&&w.pump_in){
    neu=tubeClamp(neu);
  }
  S.toolPos[nm]=neu;
}
function onRelease(p){
  S.view0=null;
  if(S.squeezing){ S.squeezing=false; pump(false); return; }
  if(!S.drag) return;
  const nm=S.drag[0];
  S.drag=null;
  S.carry=nm;
  drop(p[0],p[1]);
}
function mop(px,py,dt){
  if(!w.puddles.length) return;
  const [bx,bz]=benchPoint(px,py);
  for(const pd of w.puddles){
    if((pd[0]-bx)**2+(pd[1]-bz)**2 <= (pd[3]+1.5)**2){
      const got=w.wipe(700.0*dt,bx,bz);
      if(got>0) say("mopping");
      return;
    }
  }
}
function tubeClamp(pos){
  const z=S.zones[zoneOf(w.pump_in)];
  if(!z) return pos;
  const [cu,cvv]=INV((z[0]+z[2])/2,(z[1]+z[3])/2);
  let dx=pos[0]-cu, dy=pos[1]-cvv;
  const dd=Math.hypot(dx,dy)||1.0;
  return [cu+dx/dd*RIGID_LEN, cvv+dy/dd*RIGID_LEN];
}
function slosh(nm,speed,px,py,dt){
  const vol = nm==="beaker" ? w.beaker : w.bottle[nm.endsWith("1")?0:1];
  const cap = nm==="beaker" ? BEAKER_CAP : BOTTLE_CAP;
  const frac=vol/cap;
  if(vol<=1.0) return;
  const excess=Math.max(0.0,speed-SLOSH_V0)*frac;
  w.slosh[nm]=Math.min(1.0,w.slosh[nm]+excess*dt*0.25);
  if(excess<=0.0||nm!=="beaker") return;
  const lost=Math.min(w.beaker,0.9*excess*dt);
  if(lost<=1e-9) return;
  w.take("beaker",lost);
  let cont=null;
  for(const [cid,zn] of [["tankB","mouthB"],["tankA","mouthA"],["bin","bin"]]){
    if(cid==="bin"&&onBench(px,py)) continue;
    if(inZone(S.zones[zn],px,py)){ cont=cid; break; }
  }
  if(cont){
    w.add(cont,lost);
    if(cont in w.surge) w.surge[cont]+=lost;
  }else{
    const [bx,bz]=benchPoint(px,py);
    w.spill(lost,bx,bz);
  }
  say("slop");
}
function drop(px,py){
  const name=S.carry;
  if(name==="towel"){
    if(w.puddle>1.0){
      const [bx,bz]=benchPoint(px,py);
      const got=w.wipe(300.0,bx,bz);
      say("mopped",got);
    }
    const [u,v]=INV(px,py);
    S.toolPos.towel=[u,v]; S.toolOut.towel=true;
    S.carry=null; S.moving=null; drawTray();
    return;
  }
  if(["base","stand","tankA","tankB"].includes(name)){
    for(const s of allowedSurfaces(name)){
      if(inZone(S.zones[s],px,py)){
        w.on[name]=s; S.carry=null; drawTray();
        say("placedOn", d().trayItems[name], d().surf[s]);
        return;
      }
    }
    say("noFit");
    return;
  }
  let cont=null;
  const bare=onBench(px,py);
  for(const [cid,zn] of [["beaker","beaker"],["bottle1","bottle1"],["bottle2","bottle2"],
                         ["tankB","mouthB"],["tankA","mouthA"],["bin","bin"]]){
    if(cid==="bin"&&bare) continue;
    if(cid!==name && inZone(S.zones[zn],px,py)){ cont=cid; break; }
  }
  let [u,v]=INV(px,py);
  if(name.startsWith("bottle")){
    S.toolOut[name]=true;
    if(cont){
      const z=S.zones[zoneOf(cont)];
      const [cu,cvv]=INV((z[0]+z[2])/2, z[1]);
      S.toolPos[name]=[cu-3.0, cvv+2.0];
      w.pouring=[name,cont]; w.pour_tilt=0.0;
      say("heldBottle");
    }else S.toolPos[name]=[u,v];
  }else if(name==="beaker"){
    S.toolOut[name]=true;
    if(!cont && w.beaker>1.0 && onBench(px,py)){
      const v0=w.take("beaker",w.beaker);
      const [bx,bz]=benchPoint(px,py);
      w.spill(v0,bx,bz);
      S.toolPos[name]=[u,v];
      say("dumped",v0);
      S.carry=null; S.moving=null; drawTray();
      return;
    }
    if(cont){
      const z=S.zones[zoneOf(cont)];
      const [cu,cvv]=INV((z[0]+z[2])/2, z[1]);
      S.toolPos[name]=[cu-2.0, cvv+1.5];
      if(w.beaker>1.0){ w.pouring=["beaker",cont]; w.pour_tilt=0.0; say("heldBeaker"); }
      else{ w.pouring=[cont,"beaker"]; say("scooping"); }
    }else S.toolPos[name]=[u,v];
  }else if(name==="pump"){
    S.toolOut.pump=true; S.toolOut.hose=true;
    S.toolPos.pump=[u,v];
    if(cont){
      w.pump_in=cont;
      S.toolPos.pump=tubeClamp([u,v]);
      u=S.toolPos.pump[0]; v=S.toolPos.pump[1];
      if(w.pump_out===cont) w.pump_out=null;
      say("intakeIn", d().cont[cont]||cont);
    }else say("intakeNeed");
    S.toolPos.hose=[u+7.0, v-3.0];
  }else if(name==="hose"){
    S.toolOut.hose=true;
    S.toolPos.hose=[u,v];
    const [pu,pv]=S.toolPos.pump;
    if(cont && Math.hypot(u-pu,v-pv)>HOSE_LEN){
      w.pump_out=null; say("hoseShort",Math.round(HOSE_LEN));
    }else if(cont && cont!==w.pump_in){
      w.pump_out=cont;
      say("siphonReady", d().cont[w.pump_in]||"?", d().cont[cont]||cont);
    }else if(cont){ w.pump_out=null; say("hoseSame"); }
    else w.pump_out=null;
  }else if(name==="ruler" && inZone(S.zones.bin,px,py)
           && !(w.on.tankA&&inZone(S.zones.tankA,px,py))
           && !(w.on.tankB&&inZone(S.zones.tankB,px,py))){
    S.plan=true; S.toolOut.ruler=true;
    S.toolPos.ruler=[BIN_X0+BIN_WALL, BIN_Z0+BIN_WALL-0.15];
    S.rulerAng=0.0; S.touched=true;
    S.zoom=Math.max(0.4,Math.min(6.0, Math.min(CW/56.0,CH/40.0)/S.basePpcm));
    const k=ppcm();
    S.pan=[(BIN_X0+BIN_X1)/2-CW/(2*k), (BIN_Z0+BIN_Z1)/2-CH/(2*k)];
    S.carry=null; S.moving=null; drawTray();
    say("planView");
    return;
  }else if(name==="ruler" && ((inZone(S.zones.tankA,px,py)&&w.on.tankA)
                           || (inZone(S.zones.tankB,px,py)&&w.on.tankB))){
    openSide( (w.on.tankB && inZone(S.zones.tankB,px,py)) ? "tankB" : "tankA" );
    return;
  }else{
    S.toolOut[name]=true;
    S.toolPos[name]=[u,v];
    if(name==="level"){
      S.levelSurf = (w.on.base && inZone(S.zones.base,px,py)) ? "base" : "desk";
      say("levelOn", d().surf[S.levelSurf]);
    }
  }
  S.carry=null; S.moving=null; drawTray();
}
function openSide(tk){
  S.side=tk; S.plan=false;
  const b = tk==="tankA"?tankABox():tankBBox();
  const [x0,x1,y0,y1]=[b[0],b[1],b[2],b[3]];
  S.toolOut.ruler=true;
  S.rulerAng=Math.PI/2.0;
  S.toolPos.ruler=[x0-0.15, y0+WALL+(tk==="tankA"?A_OUT_Z:0.0)];
  S.touched=true;
  S.zoom=Math.max(0.4,Math.min(8.0, Math.min(CW/34.0, CH/(y1-y0+8.0))/S.basePpcm));
  const k=ppcm();
  S.pan=[(x0+x1)/2-CW/(2*k), (y0+y1)/2-CH/(2*k)];
  S.carry=null; S.moving=null; drawTray();
  say("sideView");
}
function onRClick(p){
  const [x,y]=p;
  if(S.plan||S.side){
    S.plan=false; S.side=null; S.touched=false;
    fit(); say("backView");
    return;
  }
  if(S.carry){
    if(S.moving){
      S.toolOut[S.moving]=false;
      if(S.moving==="pump"){ w.pump_in=null; w.pump_out=null; w.pumping=false; }
    }
    S.carry=null; S.moving=null; drawTray();
    return;
  }
  for(const nm of ["hose","ruler","level","beaker","bottle1","bottle2","towel","pump"]){
    if(S.toolOut[nm] && inZone(S.zones[nm],x,y)){
      if(nm==="hose"){
        w.pump_out=null; w.pumping=false;
        S.toolPos.hose=S.toolHome.hose.slice();
        say("hoseOut");
        return;
      }
      S.toolOut[nm]=false;
      if(w.pouring&&w.pouring[0]===nm) w.pouring=null;
      if(nm==="pump"){
        S.toolOut.hose=false;
        w.pump_in=null; w.pump_out=null; w.pumping=false;
        S.toolPos.hose=S.toolHome.hose.slice();
      }
      drawTray();
      return;
    }
  }
  for(const nm of ["tankB","tankA"]){
    if(w.on[nm] && inZone(S.zones[nm],x,y)){
      w.add(w.over_bin(nm)?"bin":"spill", w.take(nm,w.vol(nm)));
      w.on[nm]=null; drawTray();
      return;
    }
  }
  for(const [nm,zn] of [["stand","stand_low"],["base","base"]]){
    if(w.on[nm] && inZone(S.zones[zn],x,y)){
      const targets = nm==="stand" ? ["stand_low","stand_high"] : ["base"];
      const carried = ["tankA","tankB","stand"].filter(o=>targets.includes(w.on[o]));
      if(carried.length){ say("clearFirst"); return; }
      w.on[nm]=null; drawTray();
      return;
    }
  }
}
function toggle(nm){
  if(nm==="valve"){
    w.valve=!w.valve;
    say(w.valve?"valveOpen":"valveShut");
  }else{
    w[nm]=!w[nm];
    say("plugKey",nm,w[nm]);
  }
}
function axisAngles(){
  const o=UV(0.0,0.0), out=[];
  for(const [dx,dy,dz] of [[1,0,0],[0,0,1],[0,1,0]]){
    const [u,v]=proj(dx,dy,dz);
    const p=UV(u,v);
    out.push(Math.atan2(-(p[1]-o[1]), p[0]-o[0]));
  }
  return out;
}
function onWheel(p,dir){
  const [x,y]=p;
  if(w.pouring && ["bottle1","bottle2","beaker"].includes(w.pouring[0])){
    w.pour_tilt=Math.max(0.0,Math.min(1.0,w.pour_tilt+0.06*dir));
    w.pour_head=w.head_over_lip();
    say("tiltWheel");
    return;
  }
  if(S.toolOut.ruler && inZone(S.zones.ruler,x,y)){
    const old=S.rulerAng;
    let neu=old+dir*(2.0*Math.PI/180.0);
    const wrap=t=>((t+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    for(const a of axisAngles()){
      for(const k of [0,Math.PI]){
        const pq=wrap(old-a-k), q=wrap(neu-a-k);
        if(pq===0.0) continue;
        if(pq*q<=0 && Math.abs(pq)<Math.PI/2) neu=a+k;
      }
    }
    S.rulerAng=neu;
    return;
  }
  S.touched=true;
  const [u0,v0]=INV(x,y);
  S.zoom=Math.max(0.5,Math.min(6.0,S.zoom*(dir>0?1.12:1/1.12)));
  const [u1,v1]=INV(x,y);
  S.pan[0]+=u0-u1;
  S.pan[1]+=v0-v1;
}
function pump(on){
  if(on&&!S.toolOut.pump){ say("needPump"); return; }
  if(on&&!w.pump_in){ say("intakeNeed"); return; }
  if(on&&!w.pump_out){ say("needOut"); return; }
  if(on&&w.vol(w.pump_in)<1.0){ say("noWater",w.pump_in); return; }
  if(on&&w.room(w.pump_out)<1.0){ say("isFull",w.pump_out); return; }
  w.pumping=on;
  if(on) say("pumpingNow", w.pump_in, w.pump_out);
}

/* touch: tap = click, drag = pan (or move a held item) */
let touch0=null;
cv.addEventListener("touchstart",e=>{
  if(e.touches.length!==1) return;
  const r=cv.getBoundingClientRect();
  touch0=[e.touches[0].clientX-r.left, e.touches[0].clientY-r.top, Date.now(), false];
  S.mouse=[touch0[0],touch0[1]];
  onPress([touch0[0],touch0[1]]);
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(e.touches.length!==1||!touch0) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const p=[e.touches[0].clientX-r.left, e.touches[0].clientY-r.top];
  S.mouse=p; touch0[3]=true;
  if(S.drag) onDrag(p);
  else if(S.view0){
    const [x0,y0,a,b]=S.view0; S.touched=true; const k=ppcm();
    S.pan=[a-(p[0]-x0)/k, b+(p[1]-y0)/k];
  }
},{passive:false});
cv.addEventListener("touchend",()=>{ if(touch0) onRelease(S.mouse); touch0=null; },{passive:true});

function fmtTime(v){
  v=Math.max(0.0,v);
  const m=Math.floor(v/60), s=v-60*m;
  return m+":"+s.toFixed(2).padStart(5,"0");
}
function swValue(){ return S.swAcc+(S.swRun ? w.t-S.swT0 : 0.0); }
$("swBtn").onclick=()=>{

const lvCv=$("level"), lvCtx=lvCv.getContext("2d");
function levelPanel(){
  const c=lvCtx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,116,116);
  c.fillStyle="#12161b"; c.fillRect(0,0,116,116);
  if(!S.toolOut.level){
    c.font='11px "Malgun Gothic",sans-serif';
    c.textAlign="center"; c.textBaseline="middle"; c.fillStyle="#69717a";
    d().lvNone.split("\n").forEach((ln,i)=>c.fillText(ln,58,50+i*15));
    $("lvtxt").textContent="";
    return;
  }
  const oval=(a,b,e,f,fill,out,lw)=>{
    c.beginPath(); c.ellipse((a+e)/2,(b+f)/2,(e-a)/2,(f-b)/2,0,0,2*Math.PI);
    if(fill){ c.fillStyle=fill; c.fill(); }
    if(out){ c.strokeStyle=out; c.lineWidth=lw||1; c.stroke(); }
  };
  oval(8,8,108,108,"#e6f7e8","#5c6b3d",2);
  oval(44,44,72,72,null,"#8fa06d",1);
  c.strokeStyle="#b7c4a8"; c.lineWidth=1;
  c.beginPath(); c.moveTo(58,8); c.lineTo(58,108); c.moveTo(8,58); c.lineTo(108,58); c.stroke();
  const [tx,tz]=w.surface_tilt(S.levelSurf);
  const dx=Math.max(-44,Math.min(44,-tx*2600));
  const dy=Math.max(-44,Math.min(44, tz*2600));
  oval(58+dx-11,58+dy-11,58+dx+11,58+dy+11,"#7fd48f","#2f6b3c",2);
  const ok=Math.abs(tx)<0.0016 && Math.abs(tz)<0.0016;
  $("lvtxt").textContent = d().lvOn(d().surf[S.levelSurf])+"\n\n"+d().lvText+(ok?"\n\n"+d().lvOk:"");
}

function buildPedals(){
  const box=$("pedals"); box.innerHTML="";
  d().pedNames.forEach((nm,i)=>{
    const f=document.createElement("div"); f.className="ped";
    const lab=document.createElement("div"); lab.textContent=nm; f.appendChild(lab);
    const bb=document.createElement("div"); bb.className="bb";
    for(const [sgn,sym] of [[+1,"▲"],[-1,"▼"]]){
      const b=document.createElement("button");
      b.textContent=sym;
      const start=ev=>{ ev.preventDefault(); pedalStart(i,sgn); };
      b.addEventListener("mousedown",start);
      b.addEventListener("touchstart",start,{passive:false});
      bb.appendChild(b);
    }
    f.appendChild(bb); box.appendChild(f);
  });
}
let pedalJob=null;
function pedalStart(k,s){
  pedalStop();
  const step=()=>{
    w.pedal[k]=Math.max(PEDAL_MIN,Math.min(PEDAL_MAX,w.pedal[k]+s*PEDAL_STEP));
  };
  step();
  pedalJob=setInterval(step,90);
}
function pedalStop(){ if(pedalJob){ clearInterval(pedalJob); pedalJob=null; } }
window.addEventListener("mouseup",pedalStop);
window.addEventListener("touchend",pedalStop);

function pourDrop(){
  const [src,dst]=w.pouring;
  let rim,sv;
  if(dst==="tankA"&&w.on.tankA){
    const b=tankABox();
    rim=proj(b[0]+5.5,b[3],b[4]+5.5)[1];
    sv=proj(b[0]+5.5,b[2]+WALL+w.VA/w.area,b[4]+5.5)[1];
  }else if(dst==="tankB"&&w.on.tankB){
    const b=tankBBox();
    rim=proj(b[0]+5.5,b[3],b[4]+5.5)[1];
    sv=proj(b[0]+5.5,b[2]+WALL+w.VB/w.area,b[4]+5.5)[1];
  }else if(dst==="bin"){
    rim=proj(20.0,BIN_H,12.0)[1];
    sv=proj(20.0,BIN_FLOOR+w.bin_depth,12.0)[1];
  }else{ rim=12.0; sv=0.0; }
  return Math.max(1.0, 3.5+rim-sv);
}

function msgText(){
  if(!w.msg) return null;
  const t=d();
  const k=w.msg.k, a=w.msg.a;
  if(k==="plugKey") return t.m.plug(t.m.plugName[a[0]], a[1]);
  if(k==="pumpingNow") return t.m.pumping(t.cont[a[0]]||"?", t.cont[a[1]]||"?");
  if(k==="noWater") return t.m.noWater(t.cont[a[0]]||"?");
  if(k==="isFull") return t.m.isFull(t.cont[a[0]]||"?");
  const f=t.m[k];
  if(f===undefined) return null;
  return typeof f==="function" ? f.apply(null,a) : f;
}
function renderStatus(){
  if(w.pump_in||w.pump_out)
    $("pumpLbl").textContent=d().pumpState(d().cont[w.pump_in]||"—", d().cont[w.pump_out]||"—");
  else $("pumpLbl").textContent=d().pumpIdle;

  if(w.bin_depth>FLOAT_DEPTH) L.push(d().stFloat);
  if(w.puddle>20) L.push(d().stSpill);
  if(w.bottle[0]+w.bottle[1]<60) L.push(d().stBottles);
  if(w.on.tankA && w.VA>=A_CAP-1.0) L.push(d().stFullA);

  const box=$("status");
  box.innerHTML="";
  for(const line of L){ const el=document.createElement("div"); el.textContent=line; box.appendChild(el); }
}

  $("swLap").textContent=t.lap;
  $("swReset").textContent=t.reset;
  $("t-pumphint").textContent=t.pumpHint;
  $("btn-ko").className = lang==="ko"?"on":"";
  $("btn-en").className = lang==="en"?"on":"";
  document.title = lang==="ko"
    ? "APhO 2026 E1 — 물시계 실험 · HaslaLab"
    : "APhO 2026 E1 — Water Clock · HaslaLab";
  updSwBtn(); buildPedals(); renderLaps(); drawTray(); renderStatus(); levelPanel();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   11.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let tPrev=performance.now()/1000;
let uiTick=0;
function tick(){
  const now=performance.now()/1000;
  const dt=Math.min(0.1,Math.max(0.0,now-tPrev));
  tPrev=now;
  if(w.pouring) w.pour_drop=pourDrop();
  w.step(dt);
  if(CW>10) draw();
  $("swLbl").textContent=fmtTime(swValue());
  if(++uiTick%5===0){ levelPanel(); renderStatus(); }
  requestAnimationFrame(tick);
}

window.addEventListener("resize",layout);
layout(); applyLang(); requestAnimationFrame(tick);
</script>
