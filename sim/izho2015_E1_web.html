  subtitle: { ko: '흑연 막대의 저항은 온도에 따라 R_g = R₀(1 + αΔT) 로 변하고, 공기로 빠져나가는 열은 P = βΔT 라 봅니다. 장비: 흑연 막대(악어 집게로 연결, 잘 부러짐), 멀티미터, 4.5 V 전지, 1.0 Ω 과 10 Ω 저항, 가변 저항(자의 날카로운 끝으로 돌림), 도선, 스톱워치, 눈이 담긴 그릇. 실온은 20 °C 입니다.',
              en: 'The graphite rod\'s resistance changes with temperature as R_g = R₀(1 + αΔT), and the heat it loses to the air is P = βΔT. Equipment: the graphite rod (joined with crocodile clips, very fragile), a multimeter, a 4.5 V battery, 1.0 Ω and 10 Ω resistors, a variable resistor (turned with the sharp edge of a ruler), wires, a stopwatch and a vessel of snow. The room is at 20 °C.' },
  notes: { ko: [
    '과제: 1.1 저항계로 가변 저항의 미끄럼 핀 찾기. 1.2 공기 중 막대의 I(U) (멀티미터는 전압계로, 전류는 1.0 Ω 양단으로; 바꾼 뒤 30–40 s 기다리기), 회로도, 이론식, 실온 비저항과 오차 (d = 1.0 ± 0.05 mm), R_g = R₀(1 + γP), R_g(P), γ. 1.3 녹는 눈 속에서 I(U), α 와 오차. 2 브리지(R₁ = 10 Ω): 위치 1 에서 평형 → 위치 2 로 1 분 가열 → 위치 1 에서 전압의 시간 변화, dT/dt = −(T − T̄)/τ 의 τ.',
    '공식 해답: 미끄럼 핀은 b. 공기: U = 0.150 V, I = 0.040 A … 2.280 V, 0.640 A, R₀ = 3.78 ± 0.03 Ω, l = 5.0 cm → ρ = (5.9 ± 0.6)·10⁻⁵ Ω·m; P > 0.2 W 에서 R = 0.13·P + 3.75 → γ ≈ 0.035 W⁻¹ (크기). 눈: R = 3.88 ± 0.03 Ω → α ≈ −1.3·10⁻³ K⁻¹. 식음: 44 mV → 28 mV, 기울기 0.044 s⁻¹ → τ ≈ 23 s.',
    '막대를 클릭하면 눈 그릇에 넣고 뺍니다. 전압계 읽기는 막대 온도를 따라 천천히 변합니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 find the trimmer\'s sliding pin with the ohmmeter. 1.2 the rod\'s I(U) in air (multimeter as a voltmeter, the current from the 1.0 Ω; wait 30–40 s after each change), the circuit, the theory, the room-temperature resistivity with error (d = 1.0 ± 0.05 mm), R_g = R₀(1 + γP), R_g(P), γ. 1.3 I(U) in melting snow, α with its error. 2 the bridge (R₁ = 10 Ω): balance at position 1 → heat a minute at position 2 → back at 1, voltage against time, τ in dT/dt = −(T − T̄)/τ.',
    'Official solution: the sliding pin is b. Air: U = 0.150 V, I = 0.040 A … 2.280 V, 0.640 A, R₀ = 3.78 ± 0.03 Ω, l = 5.0 cm → ρ = (5.9 ± 0.6)·10⁻⁵ Ω·m; for P > 0.2 W R = 0.13·P + 3.75 → γ ≈ 0.035 W⁻¹ (magnitude). Snow: R = 3.88 ± 0.03 Ω → α ≈ −1.3·10⁻³ K⁻¹. Cooling: 44 mV → 28 mV, slope 0.044 s⁻¹ → τ ≈ 23 s.',
    'Click the rod to put it in the snow or take it out. The voltmeter follows the rod\'s temperature slowly. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, x: 0.5, T: 20, snow: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 받침 위 흑연 막대(양 끝 악어 집게 단자 G1, G2 — 5.0 cm 사이, 아래 모눈종이), 4.5 V 전지, 1.0 Ω 과 10 Ω 저항, 가변 저항(핀 a, b, c), 멀티미터, 눈 그릇, 스톱워치, 도선.',
           en: 'On the desk: the graphite rod on its holder (crocodile-clip terminals G1, G2 at its ends — 5.0 cm apart, graph paper under it), the 4.5 V battery, the 1.0 Ω and 10 Ω resistors, the trimmer (pins a, b, c), the multimeter, the vessel of snow, a stopwatch and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다 — 브리지의 위치 1/2 는 전지 도선을 옮겨 꽂아 바꿉니다',
                '가변 저항 위에서 휠 또는 좌우로 끌기: 돌리기 (Shift + 휠: 잘게) · 막대 클릭: 눈 속에 넣기/빼기',
                '멀티미터: 클릭해서 가까이 본 뒤 다이얼 · 스톱워치 <b>Space</b> · ×10 으로 기다리기'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down — move the battery wire to switch the bridge between positions 1 and 2',
                'Wheel or drag left/right over the trimmer: turn it (Shift + wheel: finely) · click the rod: into the snow / out',
                'Multimeter: click it to look closer, then the dial · stopwatch <b>Space</b> · ×10 to wait'] },
  notePlaceholder: { ko: '예) 공기: U = 0.150 V, U₀ = 40 mV … / 눈: 0.144 V, 37 mV … / 식음: 44 mV 0 s, 42 mV 2.2 s …', en: 'e.g. air: U = 0.150 V, U₀ = 40 mV … / snow: 0.144 V, 37 mV … / cooling: 44 mV at 0 s, 42 mV at 2.2 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R0 = 3.78 * (1 + S.sys('R0', 0.02)), AL = -1.3e-3 * (1 + S.sys('al', 0.08)), BETA = 0.037 * (1 + S.sys('b', 0.06)), TAU = 23 * (1 + S.sys('tau', 0.06)), CAP = BETA * TAU, BS = 0.6;
    var Ra = 1.0 * (1 + S.sys('ra', 0.02)), Rb = 10 * (1 + S.sys('rb', 0.02)), RP = 100 * (1 + S.sys('rp', 0.05)), EB = 4.5 * (1 + S.sys('eb', 0.02));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: 0, R: S.sys('mR', 0.004) };
    var leads = LAB.leads = new B3.Leads({ max: 12 }), sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 0.2], ['V', 2], ['V', 20], ['Ω', 200], ['Ω', 2000]];
    var grid = (function () { var cv = document.createElement('canvas'); cv.width = 400; cv.height = 120; cv._static = true; var g = cv.getContext('2d'); g.fillStyle = '#fbfbf5'; g.fillRect(0, 0, 400, 120);
      for (var i = 0; i <= 100; i++) { g.strokeStyle = i % 10 === 0 ? '#c86a3a' : '#efc6b0'; g.lineWidth = i % 10 === 0 ? 1.4 : 0.6; g.beginPath(); g.moveTo(i * 4, 0); g.lineTo(i * 4, 120); g.stroke(); }
      for (var j = 0; j <= 30; j++) { g.strokeStyle = j % 10 === 0 ? '#c86a3a' : '#efc6b0'; g.beginPath(); g.moveTo(0, j * 4); g.lineTo(400, j * 4); g.stroke(); } return cv; })();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10], wheelIds: ['pot'],
      home: { yaw: -0.25, pitch: 0.8, k: 12.5, tx: 2, ty: 2, tz: 1 },
      views: { dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 22, ty: 3.4, tz: 4, title: { ko: '멀티미터', en: 'Multimeter' } },
               rod: { yaw: 0, pitch: 1.4, k: 45, tx: -18, ty: 2, tz: -8, title: { ko: '흑연 막대와 모눈종이', en: 'The rod on graph paper' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 31, ty: 1.7, tz: 12, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        var mp = b.screenMoved('pot'), wp = b.wheel('pot'); if (mp[0] || wp) LAB.x = Math.max(0, Math.min(1, LAB.x + mp[0] * 0.004 + wp * 0.004));
        if (b.clicked('c:rod')) { LAB.snow = !LAB.snow; b.say(LAB.snow ? '막대를 녹는 눈 속에 넣었습니다' : '막대를 공기 중으로 꺼냈습니다', LAB.snow ? 'The rod is in the melting snow' : 'The rod is back in the air'); }
        if (b.clicked('c:paper')) b.go('rod');
        B3.desk(-36, 40, -18, 20);
        /* the rod: on its holder over graph paper, or down in the snow */
        var Tenv = LAB.snow ? 0 : 20, Rg = R0 * (1 + AL * (LAB.T - 20));
        B3.tex3(grid, 0, 0, 400, 120, [-23, 0.02, -11], [10, 0, 0], [0, 0, 3], { id: 'c:paper' });
        B3.cyl3('y', 0, 12, -4, -2, 5, 'rgba(225,235,245,.35)', { seg: 26, caps: false, noObst: true });
        B3.cyl3('y', 0, 9, -4, -2, 4.8, '#eef2f6', { seg: 26, cap: '#f8fafc' });
        var rx0 = LAB.snow ? -6.5 : -20.5, rx1 = LAB.snow ? -1.5 : -15.5, ry = LAB.snow ? 9.2 : 1.2, rz = LAB.snow ? -2 : -9.5;
        if (!LAB.snow) { B3.box3(-22.5, -21.5, 0, 1.2, -10.5, -8.5, '#3a3f46'); B3.box3(-14.5, -13.5, 0, 1.2, -10.5, -8.5, '#3a3f46'); }
        B3.cyl3('x', rx0 - 1, rx1 + 1, ry, rz, 0.15, LAB.T > 40 ? '#4a3a3a' : '#2a2a2a', { seg: 8, id: 'c:rod' });
        leads.term(b, 'g.1', [rx0, ry + 0.2, rz], { col: '#9aa0a6', label: 'G1', lc: '#e8e8e8', ls: 0.55, post: true });
        leads.term(b, 'g.2', [rx1, ry + 0.2, rz], { col: '#9aa0a6', label: 'G2', lc: '#e8e8e8', ls: 0.55, post: true });
        /* battery, resistors, trimmer */
        var bat = B3.cells(b, leads, 'bat', [-26, 12], { n: 3, e: EB / 3, r: 2.2 / 3 });
        B3.text3([-29, 1.02, 15.6], [1, 0, 0], [0, 0, -1], '4.5 V', 0.8, '#333', { weight: '800' });
        [['r1', '1.0 Ω', -12], ['r10', '10 Ω', -2]].forEach(function (q) { var x = q[2];
          B3.box3(x - 3.5, x + 3.5, 0, 0.8, 9, 14, '#2e6b4a', { top: '#357a55' }); B3.cylAB([x - 1.4, 1.3, 11.5], [x + 1.4, 1.3, 11.5], 0.4, '#c8b48a', { seg: 10 });
          leads.term(b, q[0] + '.a', [x - 2.6, 0.8, 11.5], { col: '#d8d8d8' }); leads.term(b, q[0] + '.b', [x + 2.6, 0.8, 11.5], { col: '#d8d8d8' });
          B3.text3([x - 3, 0.82, 13.6], [1, 0, 0], [0, 0, -1], q[1], 0.6, '#fff', { weight: '700' }); });
        B3.box3(4, 12, 0, 1.6, 8, 14, '#2b4a7a', { top: '#335a8a' }); B3.cyl3('y', 1.6, 2.4, 8, 11.8, 1.2, '#e8e8e8', { seg: 18, cap: '#f2f2f2', id: 'm:pot' });
        var pa = LAB.x * 5; B3.line3([8 - Math.cos(pa) * 1, 2.42, 11.8 - Math.sin(pa) * 1], [8 + Math.cos(pa) * 1, 2.42, 11.8 + Math.sin(pa) * 1], '#333', 2.5);
        ['a', 'b', 'c'].forEach(function (t, j) { leads.term(b, 'p.' + t, [5.5 + j * 2.5, 1.6, 9.2], { col: '#b8b8b8', label: t, lc: '#e8e8e8', ls: 0.55 }); });
        var m = B3.dmm(b, 'dmm', [22, 4], dm, leads, { ranges: RANGES });
        B3.stopwatch(b, 'sw', [31, 12], sw);
        /* circuit and heat */
        c.reset();
        var er = c.R('g.1', 'g.2', Rg); c.R('r1.a', 'r1.b', Ra); c.R('r10.a', 'r10.b', Rb);
        c.R('p.a', 'p.b', Math.max(0.2, LAB.x * RP)); c.R('p.b', 'p.c', Math.max(0.2, (1 - LAB.x) * RP));
        bat.stamp(c); m.stamp(c); leads.wire(c); c.solve(0.05);
        var I = c.cur(er), P = I * I * Rg, bet = LAB.snow ? BS : BETA;
        if (b.dt > 0) { var n = Math.ceil(b.dt / 0.05), h = b.dt / n; for (var i = 0; i < n; i++) LAB.T += (P - bet * (LAB.T - Tenv)) / CAP * h; }
        if (LAB.snow && LAB.T < 0) LAB.T = 0;
        m.read(c); leads.draw(b);
        LAB.state = { T: LAB.T, Rg: Rg, I: I, P: P, read: dm.now };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
