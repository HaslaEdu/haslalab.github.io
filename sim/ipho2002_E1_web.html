<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

/* screen point → world point on the horizontal plane y = h */

  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;

  fillR(x0+s0*g,sy,(C+4)*g,g*3,0,"rgba(255,255,255,.93)","#888"); ctx.strokeStyle="#1b3fa0"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0+(s0+C)*g,sy-2); ctx.lineTo(x0+(s0+C)*g,sy+g*3+2); ctx.stroke(); ctx.lineWidth=1;
  text(t.lab.stripStart,x0+s0*g,sy-12,"#333",10.5,"left"); text(t.lab.stripMark,x0+(s0+C)*g,sy+g*3+14,"#1b3fa0",10.5,"center","700");
  text(t.lab.stripHint,10,CLH-14,"#555",10.5,"left"); }
/* ── 4. the organizers' card ── */
function drawCard(){ const t=d(); ctx.fillStyle="#e9e7e0"; ctx.fillRect(0,0,CLW,CLH);
  if(!has("cards")){ text(t.lab.noCard,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  const w=Math.min(CLW*0.6,460), h=230, x=(CLW-w)/2, y=(CLH-h)/2; fillR(x,y,w,h,6,"#fff8dc","#999");
  text(t.lab.cardTitle,x+w/2,y+30,"#1b1d20",15,"center","700");
  const rows=[["T",(TRUE.T-273.15).toFixed(1)+" °C"],["P",(TRUE.P/100).toFixed(0)+" hPa"],["g","9.78 ± 0.01 m/s²"],["α",t.lab.alpha]];
  rows.forEach(([k,v],i)=>{ text(k,x+40,y+76+i*36,"#1b1d20",15,"left","700"); text(v,x+90,y+76+i*36,"#1b1d20",15,"left"); }); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="tube") drawTubeView(); else if(tab==="strip") drawStrip(); else if(tab==="card") drawCard(); else drawPendView(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   6.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ let id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&inB(p,bbox(o),0.3))||null; }
let drag=null;
const riders=k=>PARTS.filter(o=>ST.at[o]===k);
function cancelHand(){ const k=hand.item; if(hand.move&&hand.orig){ if(hand.orig.at) ST.at[k]=hand.orig.at; else ST.pos[k]=hand.orig.pos; ST.on.add(k); say("placed",itemName(k)); } else say("back",itemName(k)); hand=null; }
function clearK(k){ ST.on.delete(k); delete ST.at[k]; delete ST.pos[k];
  if(k==="pend") ST.swing={amp:0,ph:0,n:0};
  if(k==="tube"){ ST.filled=false; ST.gas=0; }
  if(k==="container"){ ST.water=false; } }
function takeUp(k){ if(riders(k).length){ say("busy",itemName(riders(k)[0])); return false; }
  hand={item:k,move:true,orig:{at:ST.at[k],pos:ST.pos[k]}}; clearK(k); say("picked",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item, host=ONTO[k];
    if(right){ cancelHand(); return; }
    if(host&&has(host)&&inB(p,bbox(host),0)){ if(host==="container"&&k==="tube"&&ST.at.electrodes!=="container"){ say("needFor",itemName("electrodes")); return; }
      ST.at[k]=host; ST.on.add(k); say("mounted",itemName(k),itemName(host)); hand=null; return; }
    const [x,y]=unP(p[0],p[1],1.5); if(!fits(k,x,y)){ say("noFit"); return; } ST.pos[k]={x,y}; ST.on.add(k); say("placed",itemName(k)); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(riders(k).length){ say("busy",itemName(riders(k)[0])); return; } clearK(k); say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(2,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); watchToggle(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
/* the close-ups: pull the wire through the clamp; draw the ball aside and let it go; fill the tube */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
const MARK_MIN=20, MARK_MAX=215;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return;
  if(cdrag.k==="tape"){ ST.mark=Math.max(MARK_MIN,Math.min(MARK_MAX,cdrag.v+(cmouse[1]-cdrag.y)/PM.ppm*(e.shiftKey?0.25:1))); }
  if(cdrag.k==="ball"){ const a=Math.atan2(cmouse[0]-PM.px,Math.max(20,cmouse[1]-PM.py)); PM.hold=Math.max(-0.17,Math.min(0.17,a)); } });
closeCv.addEventListener("pointerup",()=>{ if(cdrag&&cdrag.k==="ball"&&PM.hold!==undefined){ const a=PM.hold; delete PM.hold; if(Math.abs(a)>0.004){ ST.swing={amp:Math.abs(a),ph:a>0?Math.PI/2:-Math.PI/2,n:0}; say("released",(Math.abs(a)*180/Math.PI).toFixed(1)); } } cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  if(h.k==="tape"){ if(ST.swing.amp>0){ say("swinging"); return; } cdrag={k:"tape",y:p[1],v:ST.mark}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="ball"){ if(ST.swing.amp>0){ ST.swing={amp:0,ph:0,n:0}; say("caught"); return; } cdrag={k:"ball"}; PM.hold=0; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="fillTube"||h.k==="refill") return fillTube();
  if(h.k==="swapPol") return swapPol(); });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
function fillTube(){ if(ST.at.tube!=="container"){ say("needFor",itemName("tube")); return; } if(!ST.water){ say("noWater"); return; }
  ST.filled=true; ST.gas=TRUE.bubble*Math.PI*rIn()*rIn()*TRUE.u*U(0.8,1.2); say("filled"); }
function swapPol(){ ST.cathodeIn=!ST.cathodeIn; say(ST.cathodeIn?"polH":"polO"); }
function watchToggle(){ if(!has("watch")){ say("needFor",itemName("watch")); return; } ST.watch.run=!ST.watch.run; }
function setV(v){ if(!has("psu")){ say("needFor",itemName("psu")); return; } ST.psu.V=Math.max(0,Math.min(60,Math.round(v*10)/10)); ST.dispT=0; }
for(const [id,dv] of [["vm10",-10],["vm1",-1],["vm01",-0.1],["vp01",0.1],["vp1",1],["vp10",10]]) $(id).onclick=()=>setV(ST.psu.V+dv);
$("psuBtn").onclick=()=>{ if(!has("psu")){ say("needFor",itemName("psu")); return; } ST.psu.on=!ST.psu.on; ST.dispT=0; };
$("waterBtn").onclick=()=>{ if(!has("container")){ say("needFor",itemName("container")); return; } if(ST.water){ if(ST.at.tube==="container"){ say("busy",itemName("tube")); return; } ST.water=false; say("emptied"); } else { ST.water=true; say("watered"); } };
$("fillBtn").onclick=fillTube; $("polBtn").onclick=swapPol;
const markBy=dm=>{ if(!has("pend")||ST.at.pend!=="stand"){ say("needFor",itemName("pend")); return; } if(ST.swing.amp>0){ say("swinging"); return; } ST.mark=Math.max(MARK_MIN,Math.min(MARK_MAX,ST.mark+dm*U(0.97,1.03))); };
for(const [id,dm] of [["mk10",-10],["mk1",-1],["mp1",1],["mp10",10]]) $(id).onclick=()=>markBy(dm);
$("relBtn").onclick=()=>{ if(!has("pend")||ST.at.pend!=="stand"){ say("needFor",itemName("pend")); return; } if(ST.swing.amp>0){ ST.swing={amp:0,ph:0,n:0}; say("caught"); return; } const a=U(4.5,5.5)*Math.PI/180; ST.swing={amp:a,ph:Math.PI/2,n:0}; say("released",(a*180/Math.PI).toFixed(1)); };
const sel=$("m_dmm"); for(const m of Object.keys(MODES)){ const o=document.createElement("option"); o.value=m; o.textContent=m==="off"?"OFF":m.replace(/^mA/,"mA ").replace(/^V/,"V "); sel.appendChild(o); }
sel.onchange=()=>{ if(!has("dmm")){ say("needFor",itemName("dmm")); sel.value="off"; return; } ST.dmmMode=sel.value; ST.dispT=0; };
for(const s of [1,10,60]) $("sp"+s).onclick=()=>{ ST.speed=s; };
$("wBtn").onclick=watchToggle; $("wRst").onclick=()=>{ ST.watch.t=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
const meterShow=()=>{ if(!has("dmm")) return null; if(!MODES[ST.dmmMode]) return ""; return ST.disp===null?"":ST.disp; };
function renderPanel(){ const t=d(), s=meterShow();
  $("d_dmm").textContent=s===null?"—":s===""?"OFF":(s==="1"?"1 .  ":s)+" "+MODES[ST.dmmMode].u; if(sel.value!==ST.dmmMode) sel.value=ST.dmmMode;
  $("psuV").textContent=has("psu")?(ST.psu.on?ST.psu.V.toFixed(1)+" V":"OFF  ("+ST.psu.V.toFixed(1)+" V)"):"—"; $("psuBtn").textContent=ST.psu.on?t.psuOff:t.psuOn; $("psuBtn").className=ST.psu.on?"on":"";
  $("waterBtn").textContent=ST.water?t.waterOut:t.waterIn; $("polBtn").textContent=ST.cathodeIn?t.polToO:t.polToH; $("fillBtn").textContent=ST.filled?t.refill:t.fillTube;
  $("relBtn").textContent=ST.swing.amp>0?t.catch:t.release; $("relBtn").className=ST.swing.amp>0?"on":"";
  for(const s2 of [1,10,60]) $("sp"+s2).className=ST.speed===s2?"on":""; $("watch").textContent=ST.watch.t.toFixed(2)+" s"; $("wBtn").textContent=ST.watch.run?t.wStop:t.wGo; $("clock").textContent=t.clock(ST.simT); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(has("psu")&&ST.psu.on&&cellOK()&&!has("dmm")) L.push([t.st.open,true]);
  if(cellOK()&&has("dmm")&&!ST.dmmMode.startsWith("mA")) L.push([t.st.noAmm,true]);
  if(ST.filled&&gasMarks()*TRUE.u*100>TUBE_L-1.5) L.push([t.st.full,true]);
  if(meterShow()==="1") L.push([t.st.over,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-v","hV"],["t-h-s","hS"],["t-h-e","hE"],["t-h-p","hP"],["pHint","pHint"],["t-h-c","hC"],["t-h-t","hT"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["wRst","wRst"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function advance(dt){ let T=dt*ST.speed; while(T>0){ const h=Math.min(0.02,T); stepPhys(h); T-=h; } if(ST.filled) ST.gas=Math.min(ST.gas,TUBE_L/100*Math.PI*rIn()*rIn()); updDisp(dt); }
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; advance(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0||tab==="pend") drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
