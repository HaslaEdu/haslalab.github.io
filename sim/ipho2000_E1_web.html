<meta name="description" content="IPhO 2000 실험 1을 브라우저에서 실행합니다. CD 조각으로 만든 오목 격자와 광저항으로 텅스텐 전구의 스펙트럼을 재고, 필라멘트의 V–I와 온도 매칭으로 온도를 구해 플랑크 곡선으로 광저항의 감도를 보정합니다.">

<meta property="og:description" content="IPhO 2000 실험 1: CD 격자 분광기와 광저항, 텅스텐 필라멘트의 온도.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (SI unless marked)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
/* tungsten's resistivity (µΩ cm) against temperature (K): the graph the organizers hand out */
const RHO=[[300,5.65],[400,8.06],[500,10.56],[600,13.23],[700,16.0],[800,18.8],[900,21.7],[1000,24.9],[1200,31.1],[1400,37.5],[1600,44.0],[1800,50.6],[2000,57.2],[2200,64.0],[2400,71.0],[2600,78.0],[2800,85.3],[3000,92.6],[3200,100.0],[3400,107.5]];
function rhoOf(T){ if(T<=RHO[0][0]) return RHO[0][1]; for(let i=1;i<RHO.length;i++) if(T<=RHO[i][0]){ const [a,ra]=RHO[i-1],[b,rb]=RHO[i]; return ra+(rb-ra)*(T-a)/(b-a); } return RHO[RHO.length-1][1]; }

  RA:U(0.19,0.23), TA12:U(2850,3050), kcA:0.001,  /* bulbs A and B (12 V 50 W): their cold resistance; A's temperature on 12 V; loss through the leads (W/K) */
  RC:U(1.0,1.4), TC2:U(2250,2400), kcC:0.00001,    /* bulb C (small): cold resistance; its temperature straight on 2 V */
  rB:U(0.99,1.01),                               /* B is A's twin, to a per cent */
  L:U(18,22), xoff:0,                            /* the grating to the LDR's track (cm) */
  d:1/620e3,                                     /* the CD's line spacing (m) */

TRUE.krA=(144/(TRUE.RA*rhoOf(TRUE.TA12)/rhoOf(T0))-TRUE.kcA*(TRUE.TA12-T0))/(Math.pow(TRUE.TA12,4)-Math.pow(T0,4));

/* a bulb fed through a series resistance: its temperature, current and voltage (bisection on the power balance) */
function bulb(R300,kr,kc,E,Rs){ if(E<=0) return {T:T0,I:0,V:0,R:R300};

const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
const AS=()=>bulb(TRUE.RA,TRUE.krA,TRUE.kcA,has("can")?ST.VA:0,0.015);
const BS=()=>bulb(TRUE.RA*TRUE.rB,TRUE.krA,TRUE.kcA,has("board")&&ST.two?2.0:0,0.01);

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function setRv(v){ if(!need("board")) return; ST.Rv=Math.max(0,Math.min(50,Math.round(v*100)/100)); ST.dispT=0; }
for(const [id,dv] of [["vm1",-1],["vm01",-0.1],["vp01",0.1],["vp1",1]]) $(id).onclick=()=>{ if(!need("can")) return; ST.VA=Math.max(0,Math.min(12,Math.round((ST.VA+dv)*10)/10)); ST.dispT=0; };
$("v12").onclick=()=>{ if(!need("can")) return; ST.VA=12; ST.dispT=0; }; $("v0").onclick=()=>{ if(!need("can")) return; ST.VA=0; ST.dispT=0; };
for(const [id,dv] of [["xm1",-1],["xm01",-0.1],["xm002",-0.02],["xp002",0.02],["xp01",0.1],["xp1",1]]) $(id).onclick=()=>{ if(!need("track")) return; ST.xl=Math.max(1.6,Math.min(14.6,Math.round((ST.xl+dv)*100)/100)); ST.dispT=0; };
for(const [id,dv] of [["rm5",-5],["rm1",-1],["rm01",-0.1],["rp01",0.1],["rp1",1],["rp5",5]]) $(id).onclick=()=>setRv(ST.Rv+dv);
$("twoBtn").onclick=()=>{ if(!need("board")) return; ST.two=!ST.two; ST.dispT=0; };
const sel=$("mX"); for(const m of Object.keys(MODES)){ const o=document.createElement("option"); o.value=m; o.textContent=m==="off"?"OFF":m.replace("Ω","Ω ").replace(/^V/,"V "); sel.appendChild(o); }
sel.onchange=()=>{ if(!has("dmm")){ say("needFor",itemName("dmm")); sel.value="off"; return; } ST.mode=sel.value; ST.dispT=0; };
for(const c of ["none","ldr","A","B","C"]) $("c_"+c).onclick=()=>{ if(!need("dmm")) return; ST.conn=c; ST.dispT=0; if(MODES[ST.mode]&&MODES[ST.mode].f==="ohm"&&live(c)) say("liveOhm"); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
const meterShow=()=>{ if(!has("dmm")) return null; if(!MODES[ST.mode]) return ""; return ST.disp===null?"":ST.disp; };
function renderPanel(){ const t=d(), s=meterShow();
  $("dX").textContent=s===null?"—":s===""?"OFF":s==="ERR"?"Err":(s==="1"?"1 .  ":s)+" "+MODES[ST.mode].u; if(sel.value!==ST.mode) sel.value=ST.mode;
  for(const c of ["none","ldr","A","B","C"]) $("c_"+c).className=ST.conn===c?"on":"";
  $("dialA").textContent=has("can")?t.dial(ST.VA):"—"; $("aA").textContent=has("can")?ST.amm.A+" A":"—"; $("aB").textContent=has("board")?ST.amm.B+" A":"—"; $("aC").textContent=has("board")?ST.amm.C+" A":"—";
  $("twoBtn").textContent=ST.two?t.twoOff:t.twoOn; $("twoBtn").className=ST.two?"on":""; $("rvV").textContent=has("board")?t.rv(ST.Rv):"—"; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(meterShow()==="ERR") L.push([t.st.live,true]);
  if(meterShow()==="1") L.push([t.st.over,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-x","hX"],["t-h-a","hA"],["t-h-b","hB"],["t-h-l","hLdr"],["c_none","cNone"],["c_ldr","cLdr"],["c_A","cA"],["c_B","cB"],["c_C","cC"],["lA","lA"],["lB","lB"],["lC","lC"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; stepPhys(dt); updDisp(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
