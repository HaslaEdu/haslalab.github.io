/* ══════════════════════════════════════════════════════════════
   1.  RANDOM AND PHYSICS  (the same kit as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2025e1)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const MU0=4e-7*Math.PI, G0=9.81;
const COIL_A=0.015, COIL_S=0.030, Z0_COIL=0.023, MAG_R=0.005, MAG_L=0.010, BATT_FULL=0.300*3600;
const K={
  N:50.64*(1+0.015*gauss()), m:0.335+0.010*gauss(), face:0.002+0.001*gauss(),
  Be:47.0e-6+1.5e-6*gauss(), thE:(rnd()-0.5)*0.6, Cf:5.1e-7+0.15e-7*gauss(), Jpod:6.70e-7+0.20e-7*gauss(), Jmag:1.30e-7+0.10e-7*gauss(),
  hallOff:4e-6*gauss(), forceOff:0.15*gauss(), w0:(rnd()-0.5)*1.2, ra:0.040
};
K.Br=K.m*MU0/(Math.PI*MAG_R*MAG_R*MAG_L);
const fC=u=>1/Math.pow(u*u+COIL_A*COIL_A,1.5);
function Bcoils(z,i){ const C=MU0*K.N*COIL_A*COIL_A/2*i; return C*(fC(z-(Z0_COIL-COIL_S/2))-fC(z-(Z0_COIL+COIL_S/2))); }
const ALPHA=3*(MU0*K.N*COIL_A*COIL_A/2)*COIL_S/Math.pow((COIL_S/2)**2+COIL_A**2,2.5);
function Bmagnet(dd){ dd=Math.max(dd,1e-4); return K.Br/2*((dd+MAG_L)/Math.hypot(dd+MAG_L,MAG_R)-dd/Math.hypot(dd,MAG_R)); }

/* ══════════════════════════════════════════════════════════════
   2.  STATE AND GEOMETRY  (bench 120 cm × 72 cm, 10 px per cm)
   ══════════════════════════════════════════════════════════════ */
const LW=1200, LH=720, PX=10, TW=120, TD=72;
const PLACE=["ard","coils","dmm","ruler","stand","field","force","mag3","podMag"];
const SZ={ard:[17,11], coils:[8,9], dmm:[8,15], ruler:[40,3], stand:[17,17], field:[13,1.6], force:[5,4], mag3:[1.4,1.4], podMag:[1.4,1.4]};
const ST={
  on:{}, pos:{},
  batts:[{q:BATT_FULL,slot:null},{q:BATT_FULL,slot:null},{q:BATT_FULL,slot:null}],
  wires:[], sw:false, knob:0.4, dial:"OFF", idle:0, fuse:true,
  field:{where:"bench",z:20,d:60,plug:null}, force:{where:"bench",plug:null,zero:0,powered:false,broken:false,paste:0},
  magOnRuler:false, podMagnet:true,
  pod:{th:K.thE+0.02, w:0, f2a:0, L:0.34, hold:null, paste:{l:[],r:[]}},
  t:0, sw_t:0, swRun:false, laps:[]
};
for(const k of PLACE){ ST.on[k]=false; ST.pos[k]={x:60,y:36}; }
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0}, speed=1;

const itemName=k=>d().items[k]||k;
const near=(p,q,r)=>Math.hypot(p[0]-q[0],p[1]-q[1])<r;
const at=(k,dx,dy)=>[ST.pos[k].x+dx,ST.pos[k].y+dy];
/* terminals and slots, cm on the bench */
/* laid out after Fig. 1(c): the two tube sockets (v) at the left of the shield, (iii) and (iv) at the back, the 9 V pads (i)
   at the back right and (ii) at the front left, the current knob (vii) and the switch (vi) at the front, the LCD at the right */
const TERM={ "V+":()=>at("ard",-8.9,-1.3), "V-":()=>at("ard",-8.9,-3.5), "C+":()=>at("coils",1.0,2.75), "C-":()=>at("coils",-1.0,2.75),
             "A10":()=>at("dmm",-2.4,5.9), "AmA":()=>at("dmm",-0.8,5.9), "COM":()=>at("dmm",0.8,5.9) };
const TERM_OWNER={"V+":"ard","V-":"ard","C+":"coils","C-":"coils","A10":"dmm","AmA":"dmm","COM":"dmm"};
const SLOT={ s1:()=>at("ard",7.0,-4.1), s2:()=>at("ard",-5.4,4.3), s3:()=>at("ard",-1.2,-4.3), s4:()=>at("ard",2.8,-4.3) };
const SW=()=>at("ard",-1.8,3.5), KNOB=()=>at("ard",-5.4,0.9), DIALP=()=>at("dmm",0,1.2);
function battBody(slot){ return slot==="s1"? at("ard",11.6,-3.6) : at("ard",-11.4,5.0); }
function plugXY(s){ const p=ST[s].plug; if(p) return SLOT[p](); const b=sensorTail(s); return [b[0]+2.5,b[1]+3.5]; }
function sensorTail(s){                         /* where the cable leaves the sensor */
  if(s==="force") return ST.force.where==="coil"? at("coils",0,0) : at("force",2.5,0);
  const f=ST.field;
  if(f.where==="coil"){ const tip=at("coils",(Z0_COIL*100-f.z/10),0); return [tip[0]+12,tip[1]]; }
  if(f.where==="ruler"){ const tip=at("ruler",-20+f.d/10,0); return [tip[0]+12,tip[1]]; }
  return at("field",6.5,0);
}
function fieldTip(){ const f=ST.field; if(f.where==="coil") return at("coils",(Z0_COIL*100-f.z/10),0); if(f.where==="ruler") return at("ruler",-20+f.d/10,0); return at("field",-6.5,0); }
function overlap(k,pos){
  const [w,h]=SZ[k];
  if(pos.x-w/2<0||pos.x+w/2>TW||pos.y-h/2<0||pos.y+h/2>TD) return true;
  for(const o of PLACE){ if(o===k||!ST.on[o]) continue;
    if(o==="field"&&ST.field.where!=="bench") continue; if(o==="force"&&ST.force.where!=="bench") continue;
    if(o==="mag3"&&ST.magOnRuler) continue;
    const q=ST.pos[o], [a,b]=SZ[o];
    if(Math.abs(pos.x-q.x)<(w+a)/2+0.4&&Math.abs(pos.y-q.y)<(h+b)/2+0.4) return true; }
  return false;
}
function inItem(k,p){ if(!ST.on[k]) return false; const q=ST.pos[k], [w,h]=SZ[k]; return Math.abs(p[0]-q.x)<=w/2+0.3&&Math.abs(p[1]-q.y)<=h/2+0.3; }

/* ── the coil circuit: which way the current goes, and through what ── */
function circuit(){
  const out={I:0, coil:0, a10:0, ama:0, ok:false};
  if(!ST.on.ard) return out;
  const b2=ST.batts.find(b=>b.slot==="s2"), b1=ST.batts.find(b=>b.slot==="s1");
  if(!b1||b1.q<=0||!b2||b2.q<=0||!ST.sw) return out;
  const f=b2.q/BATT_FULL, Imax=f>0.15?2.5:2.5*f/0.15, I=Math.min(ST.knob*2.5,Imax);
  const edges=ST.wires.map(w=>[w.a,w.b,"w"]);
  if(ST.on.coils) edges.push(["C+","C-","coil"]);
  if(ST.on.dmm){ edges.push(["A10","COM","a10"]); if(ST.fuse) edges.push(["AmA","COM","ama"]); }
  const conn=(a,b,skip)=>{ const seen=new Set([a]), st=[a];
    while(st.length){ const x=st.pop(); if(x===b) return true;
      for(const [p,q,t] of edges){ if(t===skip) continue; const y=p===x?q:q===x?p:null; if(y&&!seen.has(y)){ seen.add(y); st.push(y); } } }
    return false; };
  if(!conn("V+","V-")) return out;
  out.ok=true; out.I=I;
  if(!conn("V+","V-","coil")) out.coil=conn("V+","C+","coil")? I : -I;
  if(!conn("V+","V-","a10")) out.a10=conn("V+","A10","a10")? I : -I;
  else if(!conn("V+","V-","ama")) out.ama=conn("V+","AmA","ama")? I : -I;
  return out;
}

/* ── the pod: torque of the wire, of the horizontal field, and of what lies around ── */
const SOURCES={mag3:"mag", podMag:"mag", force:"mag", ard:"metal", dmm:"metal", coils:"metal"};
const SRC_ANG={}; for(const k in SOURCES) SRC_ANG[k]=rnd()*2*Math.PI;
function podField(){
  let bx=K.Be*Math.sin(K.thE), by=-K.Be*Math.cos(K.thE), worst=1e9;
  if(!ST.on.stand) return {bx,by,worst};
  const s=at("stand",0,1.5);
  const add=(p,k)=>{ const rx=(s[0]-p[0])/100, ry=(s[1]-p[1])/100, r=Math.hypot(rx,ry); worst=Math.min(worst,r);
    if(r>0.6) return;
    if(SOURCES[k]==="mag"){ const mx=Math.cos(SRC_ANG[k]), my=Math.sin(SRC_ANG[k]), ux=rx/r, uy=ry/r, md=mx*ux+my*uy, c=MU0*K.m/(4*Math.PI*r*r*r);
      bx+=c*(3*md*ux-mx); by+=c*(3*md*uy-my); }
    else { const c=0.15*K.Be*Math.pow(0.08/r,3); bx+=c*Math.cos(SRC_ANG[k]); by+=c*Math.sin(SRC_ANG[k]); } };
  for(const k of ["mag3","podMag","ard","dmm","coils"]) if(ST.on[k]) add(k==="mag3"&&ST.magOnRuler?at("ruler",-20,0):[ST.pos[k].x,ST.pos[k].y],k);
  if(ST.on.force) add(ST.force.where==="coil"?at("coils",0,0):[ST.pos.force.x,ST.pos.force.y],"force");
  for(const b of ST.batts) if(b.slot){ const p=battBody(b.slot), rx=(s[0]-p[0])/100, ry=(s[1]-p[1])/100, r=Math.hypot(rx,ry); worst=Math.min(worst,r);
    if(r<0.6){ const c=0.08*K.Be*Math.pow(0.08/r,3); bx+=c; } }
  return {bx,by,worst};
}
function podJ(){ const P=ST.pod; return K.Jpod+(ST.podMagnet?K.Jmag:0)+(P.paste.l.reduce((a,b)=>a+b,0)+P.paste.r.reduce((a,b)=>a+b,0))*1e-3*K.ra*K.ra; }
function podTorque(th,F){ const P=ST.pod, th0=P.f2a*Math.PI/180+K.w0;
  let tq=-(K.Cf/P.L)*(th-th0);
  if(ST.podMagnet){ const B=Math.hypot(F.bx,F.by), thB=Math.atan2(F.bx,-F.by); tq-=K.m*B*Math.sin(th-thB); }
  return tq; }
function podStep(dt,F){ const P=ST.pod; if(P.hold!==null){ P.th=P.hold; P.w=0; return; }
  const J=podJ(), c=2*J/110; P.w+=(podTorque(P.th,F)-c*P.w)/J*dt; P.th+=P.w*dt; }
function podDamp(F){ const P=ST.pod; let th=P.th;
  for(let i=0;i<60;i++){ const h=1e-5, f=podTorque(th,F), g=(podTorque(th+h,F)-podTorque(th-h,F))/(2*h); if(Math.abs(g)<1e-15) break;
    let s=-f/g; if(Math.abs(s)>0.3) s=0.3*Math.sign(s); th+=s; if(Math.abs(s)<1e-9) break; }
  P.th=th; P.w=0; }

const mulberry=mulberry32;
let circ={I:0,coil:0,a10:0,ama:0,ok:false}, lcd=["",""], sleeping=false, zErr=0, dErr=0;
const ardOn=()=>ST.on.ard&&ST.batts.some(b=>b.slot==="s1"&&b.q>0);
function hallB(){
  const f=ST.field; let B=0;
  if(f.where==="coil") B=Bcoils(f.z/1000+zErr,circ.coil);
  else if(f.where==="ruler"&&ST.magOnRuler) B=Bmagnet(f.d/1000-K.face+dErr);
  return B+K.hallOff+3e-6*gauss();
}
function forceRaw(){
  let m=K.forceOff+ST.force.paste;
  if(ST.force.where==="coil") m+=K.m*ALPHA*circ.coil/G0*1000;
  return m;
}
function readLcd(){
  if(!ardOn()) return ["",""];
  const l1=ST.field.plug==="s3"&&ST.on.field? "B: "+((Math.round(hallB()*1e5)/100).toFixed(2)).padStart(6," ")+" mT" : "B:   ---- mT";
  let l2="m:   ---- g";
  if(ST.force.plug==="s4"&&ST.on.force){
    if(ST.force.broken) l2="m:   ERROR";
    else { const v=forceRaw()-ST.force.zero+0.12*gauss(); l2="m: "+((Math.round(v*10)/10).toFixed(1)).padStart(6," ")+" g"; } }
  return [l1,l2];
}
function dmmText(){
  if(!ST.on.dmm||ST.dial==="OFF"||sleeping) return "";
  if(ST.dial==="A") return (circ.a10+0.004*gauss()).toFixed(2);
  if(ST.dial==="mA") return (circ.ama*1000+0.2*gauss()).toFixed(1);
  return (0.01*gauss()).toFixed(2);
}


/* ══════════════════════════════════════════════════════════════
   2.  CANVASES AND 2-D HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("bench"), ctxM=cv.getContext("2d");
let ctx=ctxM;
const trayCv=$("tray"), trayCtx=trayCv.getContext("2d");
let CW=0, CH=0, DPR=1, TRW=180, TRH=420;
const FONT="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif", MONO="ui-monospace,Consolas,monospace";
function lerp(c1,c2,f){ f=Math.max(0,Math.min(1,f)); const a=[1,3,5].map(i=>parseInt(c1.substr(i,2),16)), b=[1,3,5].map(i=>parseInt(c2.substr(i,2),16));
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*f).toString(16).padStart(2,"0")).join(""); }
function R(x0,y0,x1,y1,fill,stroke,lw){ if(fill){ctx.fillStyle=fill;ctx.fillRect(x0,y0,x1-x0,y1-y0);}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.strokeRect(x0,y0,x1-x0,y1-y0);} }
function O(x0,y0,x1,y1,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function L(pts,col,w){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.strokeStyle=col; ctx.lineWidth=w||1; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke(); }
function P(pts,fill,stroke,lw){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function X(s,x,y,col,size,anchor,bold,font){
  ctx.fillStyle=col; ctx.font=(bold?"700 ":"")+size+"px "+(font||FONT);
  ctx.textAlign=anchor==="w"?"left":anchor==="e"?"right":"center"; ctx.textBaseline="middle";
  const lines=String(s).split("\n"), lh=size*1.15;
  lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*lh)); }
function RR(x,y,w,h,r,fill,stroke,lw){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
/* paint onto an offscreen canvas with the helpers above */
function paint(c,fn){ const old=ctx; ctx=c.getContext("2d"); ctx.setTransform(1,0,0,1,0,0); fn(c.width,c.height); ctx=old; }
function mkCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }

function undo(){
  const now=sigOf(snapST()); while(UNDO.length&&UNDO[UNDO.length-1].g===now) UNDO.pop();

  const o=JSON.parse(h.s); for(const k of Object.keys(ST)) if(!UNDO_KEEP.has(k)&&!(k in o)) delete ST[k];

  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2025 E1 — 지구 자기장 측정 · HaslaLab":"IPhO 2025 E1 — Earth's Magnetic Field · HaslaLab";
  renderPanel(); renderSpeeds(); renderViews(); renderViewBtn(); drawTray();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0, lcdT=0, wasPowered=false, Fnow=null;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const sdt=dt*speed; ST.t+=sdt; if(ST.swRun) ST.sw_t+=sdt;
  circ=circuit();
  if(Math.abs(circ.ama)>0.4&&ST.fuse){ ST.fuse=false; say("fuse"); circ=circuit(); }
  const b2=ST.batts.find(b=>b.slot==="s2"); if(b2&&circ.ok) b2.q=Math.max(0,b2.q-circ.I*sdt);
  const b1=ST.batts.find(b=>b.slot==="s1"); if(b1&&ST.on.ard) b1.q=Math.max(0,b1.q-0.05*sdt);
  if(ST.dial!=="OFF"){ ST.idle+=sdt; if(ST.idle>900) sleeping=true; }
  const powered=ardOn()&&ST.force.plug==="s4"&&ST.on.force;
  if(powered&&!wasPowered){ ST.force.zero=forceRaw(); say("zeroed"); } wasPowered=powered;
  if(powered&&!ST.force.broken&&Math.abs(forceRaw()-K.forceOff)>200){ ST.force.broken=true; say("broken"); }
  const F=podField(); Fnow=F; let left=sdt; while(left>1e-9){ const h=Math.min(left,0.002); podStep(h,F); left-=h; }
  lcdT-=dt; if(lcdT<=0){ lcd=readLcd(); lcdT=0.25; }
  if(CW>10) draw();
  if(!ST.on.watch&&ST.swRun&&!(B.carry&&B.carry.id==="watch")) ST.swRun=false;
  $("swLbl").textContent=ST.on.watch?fmt(ST.sw_t):"-:--.--"; $("swLbl").style.opacity=ST.on.watch?1:0.35;
  if(++frameN%8===0){ renderStatus(F); renderViews(); $("t-swhint").textContent=ST.on.watch?d().swOk:d().swHint;
    for(const b of ["swBtn","swLap","swReset"]) $(b).classList.toggle("off",!ST.on.watch); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
paintStatic(); layout(); applyLang(); requestAnimationFrame(tick);
</script>

  <script src="simfull.js"></script>
