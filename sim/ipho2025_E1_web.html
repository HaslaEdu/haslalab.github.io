/* ══════════════════════════════════════════════════════════════
   1.  RANDOM AND PHYSICS  (the same kit as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2025e1)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const MU0=4e-7*Math.PI, G0=9.81;
const COIL_A=0.015, COIL_S=0.030, Z0_COIL=0.023, MAG_R=0.005, MAG_L=0.010, BATT_FULL=0.300*3600;
const K={
  N:50.64*(1+0.015*gauss()), m:0.335+0.010*gauss(), face:0.002+0.001*gauss(),
  Be:47.0e-6+1.5e-6*gauss(), thE:(rnd()-0.5)*0.6, Cf:5.1e-7+0.15e-7*gauss(), Jpod:6.70e-7+0.20e-7*gauss(), Jmag:1.30e-7+0.10e-7*gauss(),
  hallOff:4e-6*gauss(), forceOff:0.15*gauss(), w0:(rnd()-0.5)*1.2, ra:0.040
};
K.Br=K.m*MU0/(Math.PI*MAG_R*MAG_R*MAG_L);
const fC=u=>1/Math.pow(u*u+COIL_A*COIL_A,1.5);
function Bcoils(z,i){ const C=MU0*K.N*COIL_A*COIL_A/2*i; return C*(fC(z-(Z0_COIL-COIL_S/2))-fC(z-(Z0_COIL+COIL_S/2))); }
const ALPHA=3*(MU0*K.N*COIL_A*COIL_A/2)*COIL_S/Math.pow((COIL_S/2)**2+COIL_A**2,2.5);
function Bmagnet(dd){ dd=Math.max(dd,1e-4); return K.Br/2*((dd+MAG_L)/Math.hypot(dd+MAG_L,MAG_R)-dd/Math.hypot(dd,MAG_R)); }

/* ══════════════════════════════════════════════════════════════
   2.  STATE AND GEOMETRY  (bench 120 cm × 72 cm, 10 px per cm)
   ══════════════════════════════════════════════════════════════ */

const TERM={ "V+":()=>at("ard",-7.2,-3.2), "V-":()=>at("ard",-7.2,-0.8), "C+":()=>at("coils",-1.6,3.6), "C-":()=>at("coils",1.6,3.6),
             "A10":()=>at("dmm",-2.7,5.6), "AmA":()=>at("dmm",-0.9,5.6), "COM":()=>at("dmm",0.9,5.6) };

function plugXY(s){ const p=ST[s].plug; if(p) return SLOT[p](); const b=sensorTail(s); return [b[0]+2.5,b[1]+3.5]; }
function sensorTail(s){                         /* where the cable leaves the sensor */
  if(s==="force") return ST.force.where==="coil"? at("coils",0,0) : at("force",2.5,0);
  const f=ST.field;
  if(f.where==="coil"){ const tip=at("coils",(Z0_COIL*100-f.z/10),0); return [tip[0]+12,tip[1]]; }
  if(f.where==="ruler"){ const tip=at("ruler",-20+f.d/10,0); return [tip[0]+12,tip[1]]; }

}
function fieldTip(){ const f=ST.field; if(f.where==="coil") return at("coils",(Z0_COIL*100-f.z/10),0); if(f.where==="ruler") return at("ruler",-20+f.d/10,0); return at("field",-6.5,0); }
function overlap(k,pos){
  const [w,h]=SZ[k];
  if(pos.x-w/2<0||pos.x+w/2>TW||pos.y-h/2<0||pos.y+h/2>TD) return true;
  for(const o of PLACE){ if(o===k||!ST.on[o]) continue;
    if(o==="field"&&ST.field.where!=="bench") continue; if(o==="force"&&ST.force.where!=="bench") continue;
    if(o==="mag3"&&ST.magOnRuler) continue;
    const q=ST.pos[o], [a,b]=SZ[o];
    if(Math.abs(pos.x-q.x)<(w+a)/2+0.4&&Math.abs(pos.y-q.y)<(h+b)/2+0.4) return true; }
  return false;
}
function inItem(k,p){ if(!ST.on[k]) return false; const q=ST.pos[k], [w,h]=SZ[k]; return Math.abs(p[0]-q.x)<=w/2+0.3&&Math.abs(p[1]-q.y)<=h/2+0.3; }

/* ── the coil circuit: which way the current goes, and through what ── */
function circuit(){
  const out={I:0, coil:0, a10:0, ama:0, ok:false};
  if(!ST.on.ard) return out;
  const b2=ST.batts.find(b=>b.slot==="s2"), b1=ST.batts.find(b=>b.slot==="s1");
  if(!b1||b1.q<=0||!b2||b2.q<=0||!ST.sw) return out;
  const f=b2.q/BATT_FULL, Imax=f>0.15?2.5:2.5*f/0.15, I=Math.min(ST.knob*2.5,Imax);
  const edges=ST.wires.map(w=>[w.a,w.b,"w"]);
  if(ST.on.coils) edges.push(["C+","C-","coil"]);
  if(ST.on.dmm){ edges.push(["A10","COM","a10"]); if(ST.fuse) edges.push(["AmA","COM","ama"]); }
  const conn=(a,b,skip)=>{ const seen=new Set([a]), st=[a];
    while(st.length){ const x=st.pop(); if(x===b) return true;
      for(const [p,q,t] of edges){ if(t===skip) continue; const y=p===x?q:q===x?p:null; if(y&&!seen.has(y)){ seen.add(y); st.push(y); } } }
    return false; };
  if(!conn("V+","V-")) return out;
  out.ok=true; out.I=I;
  if(!conn("V+","V-","coil")) out.coil=conn("V+","C+","coil")? I : -I;
  if(!conn("V+","V-","a10")) out.a10=conn("V+","A10","a10")? I : -I;
  else if(!conn("V+","V-","ama")) out.ama=conn("V+","AmA","ama")? I : -I;
  return out;
}

/* ── the pod: torque of the wire, of the horizontal field, and of what lies around ── */
const SOURCES={mag3:"mag", podMag:"mag", force:"mag", ard:"metal", dmm:"metal", coils:"metal"};
const SRC_ANG={}; for(const k in SOURCES) SRC_ANG[k]=rnd()*2*Math.PI;
function podField(){
  let bx=K.Be*Math.sin(K.thE), by=-K.Be*Math.cos(K.thE), worst=1e9;
  if(!ST.on.stand) return {bx,by,worst};
  const s=at("stand",0,1.5);
  const add=(p,k)=>{ const rx=(s[0]-p[0])/100, ry=(s[1]-p[1])/100, r=Math.hypot(rx,ry); worst=Math.min(worst,r);
    if(r>0.6) return;
    if(SOURCES[k]==="mag"){ const mx=Math.cos(SRC_ANG[k]), my=Math.sin(SRC_ANG[k]), ux=rx/r, uy=ry/r, md=mx*ux+my*uy, c=MU0*K.m/(4*Math.PI*r*r*r);
      bx+=c*(3*md*ux-mx); by+=c*(3*md*uy-my); }
    else { const c=0.15*K.Be*Math.pow(0.08/r,3); bx+=c*Math.cos(SRC_ANG[k]); by+=c*Math.sin(SRC_ANG[k]); } };
  for(const k of ["mag3","podMag","ard","dmm","coils"]) if(ST.on[k]) add(k==="mag3"&&ST.magOnRuler?at("ruler",-20,0):[ST.pos[k].x,ST.pos[k].y],k);
  if(ST.on.force) add(ST.force.where==="coil"?at("coils",0,0):[ST.pos.force.x,ST.pos.force.y],"force");
  for(const b of ST.batts) if(b.slot){ const p=battBody(b.slot), rx=(s[0]-p[0])/100, ry=(s[1]-p[1])/100, r=Math.hypot(rx,ry); worst=Math.min(worst,r);
    if(r<0.6){ const c=0.08*K.Be*Math.pow(0.08/r,3); bx+=c; } }
  return {bx,by,worst};
}
function podJ(){ const P=ST.pod; return K.Jpod+(ST.podMagnet?K.Jmag:0)+(P.paste.l.reduce((a,b)=>a+b,0)+P.paste.r.reduce((a,b)=>a+b,0))*1e-3*K.ra*K.ra; }
function podTorque(th,F){ const P=ST.pod, th0=P.f2a*Math.PI/180+K.w0;
  let tq=-(K.Cf/P.L)*(th-th0);
  if(ST.podMagnet){ const B=Math.hypot(F.bx,F.by), thB=Math.atan2(F.bx,-F.by); tq-=K.m*B*Math.sin(th-thB); }
  return tq; }
function podStep(dt,F){ const P=ST.pod; if(P.hold!==null){ P.th=P.hold; P.w=0; return; }
  const J=podJ(), c=2*J/110; P.w+=(podTorque(P.th,F)-c*P.w)/J*dt; P.th+=P.w*dt; }
function podDamp(F){ const P=ST.pod; let th=P.th;
  for(let i=0;i<60;i++){ const h=1e-5, f=podTorque(th,F), g=(podTorque(th+h,F)-podTorque(th-h,F))/(2*h); if(Math.abs(g)<1e-15) break;
    let s=-f/g; if(Math.abs(s)>0.3) s=0.3*Math.sign(s); th+=s; if(Math.abs(s)<1e-9) break; }
  P.th=th; P.w=0; }

      ctx.beginPath(); ctx.moveTo(x,cy+0.3*k); ctx.lineTo(x,cy+0.3*k+L); ctx.stroke(); if(i%10===0) text(String(i/10),x,cy+0.3*k+0.75*k,"#2b333a",11,"center"); }
    if(ST.magOnRuler){ const x=xr(0); ctx.fillStyle="#c7ccd2"; ctx.fillRect(x-1.0*k,cy-0.5*k,1.0*k,1.0*k); ctx.strokeStyle="#666"; ctx.strokeRect(x-1.0*k,cy-0.5*k,1.0*k,1.0*k); }
    const tip=xr(tipD); ctx.fillStyle="#2d8a4a"; ctx.fillRect(tip,cy-0.6*k,12*k,0.7*k); ctx.fillStyle="#111"; ctx.fillRect(tip,cy-0.37*k,0.25*k,0.24*k);
    text(d().items.ruler+" · "+d().items.field,P.x+8,P.y+14,"#5d5446",11);

/* ── right: the stand from the front, the dial f2a and the protractor f1a from above ── */
let F3={};
function drawP3(){
  const P=P3; panelBg(P,"#eeeae2");
  if(!ST.on.stand){ msgIn(P,d().noStand); F3={}; return; }
  const fw=P.w*0.46, kz=(P.h-24)/47, xb=P.x+12, yb=P.y+P.h-10, xp=xb+0.18*fw, xpod=xb+fw*0.72;
  const Y=z=>yb-z*kz, zc=44, zpod=zc-ST.pod.L*100;
  ctx.fillStyle="#e3c99a"; ctx.fillRect(xb,yb-1.6*kz,fw-6,1.6*kz);
  ctx.fillStyle="#9aa0a6"; ctx.fillRect(xp-0.4*kz,Y(46),0.8*kz,46*kz-1.6*kz);
  /* the scale on the post, read from the clamp of the wire */
  ctx.strokeStyle="#3b444c"; ctx.lineWidth=1;
  for(let c=0;c<=42;c++){ const y=Y(zc-c), L=c%5===0?7:4; ctx.beginPath(); ctx.moveTo(xp+0.4*kz,y); ctx.lineTo(xp+0.4*kz+L,y); ctx.stroke(); if(c%5===0) text(String(c),xp+0.4*kz+9,y,"#2b333a",9.5); }
  ctx.fillStyle="#2a2c30"; ctx.fillRect(xp,Y(zc+1.6),xpod-xp+1.5*kz,1.0*kz);
  ctx.fillStyle="#1f2023"; ctx.fillRect(xpod-1.4*kz,Y(zc+0.6),2.8*kz,0.6*kz);
  ctx.strokeStyle="#5a5a5a"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(xpod,Y(zc)); ctx.lineTo(xpod,Y(zpod+0.8)); ctx.stroke();
  const ca=Math.cos(ST.pod.th), ra=K.ra*100;
  ctx.fillStyle="#222"; ctx.fillRect(xpod-ra*Math.abs(ca)*kz-0.15*kz,Y(zpod+0.25),2*ra*Math.abs(ca)*kz+0.3*kz,0.5*kz);
  ctx.fillStyle="#2a2a2e"; ctx.fillRect(xpod-0.7*kz,Y(zpod+0.8),1.4*kz,1.6*kz);
  if(ST.podMagnet){ ctx.fillStyle="#c7ccd2"; ctx.fillRect(xpod-0.45*kz,Y(zpod+0.55),0.9*kz,1.0*kz); }
  for(const [side,sg] of [["l",-1],["r",1]]){ const m=ST.pod.paste[side].reduce((a,b)=>a+b,0); if(m>0){ ctx.fillStyle="#efe4b0";
    ctx.beginPath(); ctx.arc(xpod+sg*ra*ca*kz,Y(zpod+0.5),(0.3+0.25*Math.cbrt(m))*kz,0,7); ctx.fill(); ctx.strokeStyle="#b9a96a"; ctx.stroke(); } }
  ctx.fillStyle="#2a2c30"; ctx.fillRect(xp,Y(Math.max(1.8,zpod-2.2)),xpod-xp-4.8*kz,0.8*kz);
  F3={xpod,ypod:Y(zpod),kz,ra,ca,front:[xb,P.y,fw,P.h]};
  /* f2a seen from above */
  const rx=P.x+fw+16, rw=P.w-fw-24, rD=Math.min(rw*0.5,(P.h-24)/4)-4, c2=[rx+rw/2,P.y+rD+10], c1=[rx+rw/2,P.y+P.h-rD-10];
  F3.c2=c2; F3.c1=c1; F3.r=rD;
  dial(c2,rD,ST.pod.f2a,5,30,false);
  text("f2a",c2[0]-rD,c2[1]-rD+4,"#5d5446",11);
  protractor(c1,rD); text("f1a",c1[0]-rD,c1[1]-rD+4,"#5d5446",11);
}
function dial(c,r,ang,step,lab){
  ctx.fillStyle="#f8f8f6"; ctx.beginPath(); ctx.arc(c[0],c[1],r,0,7); ctx.fill(); ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.stroke();
  ctx.save(); ctx.translate(c[0],c[1]); ctx.rotate(-ang*Math.PI/180);
  for(let a=0;a<360;a+=step){ const L=a%lab===0?0.16*r:0.08*r, t=a*Math.PI/180; ctx.beginPath(); ctx.moveTo(Math.sin(t)*r,-Math.cos(t)*r); ctx.lineTo(Math.sin(t)*(r-L),-Math.cos(t)*(r-L)); ctx.stroke();
    if(a%lab===0){ ctx.save(); ctx.rotate(t); text(String(a),0,-r+0.27*r,"#222",Math.max(8,r*0.11),"center"); ctx.restore(); } }
  ctx.fillStyle="#2a2c30"; ctx.beginPath(); ctx.arc(0,0,0.18*r,0,7); ctx.fill(); ctx.restore();
  ctx.fillStyle="#c62a22"; ctx.beginPath(); ctx.moveTo(c[0],c[1]-r-1); ctx.lineTo(c[0]-6,c[1]-r-11); ctx.lineTo(c[0]+6,c[1]-r-11); ctx.closePath(); ctx.fill();
}
function protractor(c,r){
  ctx.fillStyle="#f8f8f6"; ctx.beginPath(); ctx.arc(c[0],c[1],r,0,7); ctx.fill(); ctx.strokeStyle="#333"; ctx.lineWidth=0.8; ctx.stroke();
  ctx.save(); ctx.translate(c[0],c[1]);
  for(let a=0;a<360;a++){ const L=a%10===0?0.14*r:a%5===0?0.09*r:0.05*r, t=a*Math.PI/180; ctx.beginPath(); ctx.moveTo(Math.sin(t)*r,-Math.cos(t)*r); ctx.lineTo(Math.sin(t)*(r-L),-Math.cos(t)*(r-L)); ctx.stroke();
    if(a%30===0){ ctx.save(); ctx.rotate(t); text(String(a),0,-r+0.24*r,"#222",Math.max(7.5,r*0.09),"center"); ctx.restore(); } }
  const th=ST.pod.th, ra=r*0.62;
  ctx.rotate(th);
  ctx.fillStyle="rgba(30,30,30,.85)"; ctx.fillRect(-ra,-0.035*r,2*ra,0.07*r);
  for(const [side,sg] of [["l",-1],["r",1]]){ const m=ST.pod.paste[side].reduce((a,b)=>a+b,0); if(m>0){ ctx.fillStyle="#efe4b0"; ctx.beginPath(); ctx.arc(sg*ra,0,0.04*r+0.03*r*Math.cbrt(m),0,7); ctx.fill(); } }
  ctx.strokeStyle="#c9a35a"; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-0.97*r); ctx.stroke();
  ctx.fillStyle="#2a2a2e"; ctx.fillRect(-0.07*r,-0.07*r,0.14*r,0.14*r);
  ctx.restore();
}

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const cm=p=>[p[0]/PX,p[1]/PX];
function termAt(c){ for(const t in TERM) if(ST.on[TERM_OWNER[t]]&&near(c,TERM[t](),0.9)) return t; return null; }
function slotAt(c){ if(!ST.on.ard) return null; for(const s in SLOT) if(near(c,SLOT[s](),1.3)) return s; return null; }
function returnHand(){
  if(!hand) return;
  if(hand.move){ ST.pos[hand.k]=hand.orig; if(hand.where) restoreWhere(hand); }
  hand=null;
}
function restoreWhere(h){ if(h.k==="field"){ ST.field.where=h.where; ST.on.field=true; } if(h.k==="force"){ ST.force.where=h.where; ST.on.force=true; } if(h.k==="mag3"&&h.where==="ruler"){ ST.magOnRuler=true; ST.on.mag3=true; } }
function returnItem(k){
  ST.on[k]=false;
  if(k==="ard"){ for(const b of ST.batts) b.slot=null; ST.field.plug=null; ST.force.plug=null; ST.wires=ST.wires.filter(w=>TERM_OWNER[w.a]!=="ard"&&TERM_OWNER[w.b]!=="ard"); }
  if(k==="coils"||k==="dmm") ST.wires=ST.wires.filter(w=>TERM_OWNER[w.a]!==k&&TERM_OWNER[w.b]!==k);
  if(k==="coils"){ if(ST.field.where==="coil") ST.field.where="bench", ST.on.field=false; if(ST.force.where==="coil"){ ST.force.where="bench"; ST.on.force=false; } }
  if(k==="ruler"){ if(ST.field.where==="ruler"){ ST.field.where="bench"; ST.on.field=false; } if(ST.magOnRuler){ ST.magOnRuler=false; ST.on.mag3=false; } }
  if(k==="field"){ ST.field.where="bench"; ST.field.plug=null; }
  if(k==="force"){ ST.force.where="bench"; ST.force.plug=null; ST.force.paste=0; }
  if(k==="mag3") ST.magOnRuler=false;
  say("back",itemName(k));
}
function takeFromTray(k){
  if(!trayAvail(k)) return;
  if(k==="batt"){ const i=ST.batts.findIndex((b,j)=>!b.slot); hand={k,i}; say("picked",itemName(k)); return; }
  if(k==="wire"){ hand={k,a:null}; say("wire1"); return; }
  if(k==="paste"){ hand={k,g:0.5,m:null}; say("picked",itemName(k)); return; }
  hand={k}; say("picked",itemName(k));
}
function podMagOut(){ ST.podMagnet=false; ST.on.podMag=true; const s=ST.pos.stand;
  const cand=[[10.5,0],[-10.5,0],[0,10.5],[0,-10.5],[10.5,10.5],[-10.5,10.5]].map(([dx,dy])=>({x:s.x+dx,y:s.y+dy}));
  ST.pos.podMag=cand.find(q=>!overlap("podMag",q))||cand[0]; say("magOut"); }
function benchClick(p,right){
  const c=cm(p);
  if(hand) return handClick(c,right);
  if(right){
    for(let i=ST.wires.length-1;i>=0;i--){ const w=ST.wires[i], a=TERM[w.a](), b=TERM[w.b](), L=Math.hypot(a[0]-b[0],a[1]-b[1]), sag=3+L*0.15;
      for(let s=0;s<=20;s++){ const t=s/20, m=1-t, x=m*m*m*a[0]+3*m*m*t*(a[0]*0.7+b[0]*0.3)+3*m*t*t*(a[0]*0.3+b[0]*0.7)+t*t*t*b[0],
        y=m*m*m*a[1]+3*m*m*t*(a[1]*0.7+b[1]*0.3+sag)+3*m*t*t*(a[1]*0.3+b[1]*0.7+sag)+t*t*t*b[1];
        if(near(c,[x,y],0.8)){ ST.wires.splice(i,1); say("unwire"); return; } } }
    for(const b of ST.batts) if(b.slot&&near(c,battBody(b.slot),2.4)){ b.slot=null; say("back",itemName("batt")); return; }
    for(const s of ["field","force"]) if(ST[s].plug&&near(c,plugXY(s),1.2)){ ST[s].plug=null; return; }
    if(ST.on.podMag&&inItem("podMag",c)){ ST.on.podMag=false; ST.podMagnet=true; say("magIn"); return; }
    if(ST.field.where!=="bench"&&ST.on.field&&near(c,fieldTip(),3)){ returnItem("field"); return; }
    if(ST.force.where==="coil"&&near(c,at("coils",0,0),1.5)){ if(ST.force.paste>0){ ST.force.paste=0; say("pasteOff"); return; } returnItem("force"); return; }
    if(ST.magOnRuler&&near(c,at("ruler",-20.6,0),1.5)){ returnItem("mag3"); return; }
    for(const k of ["mag3","force","field","dmm","ard","coils","stand","ruler"]) if(inItem(k,c)&&!(k==="field"&&ST.field.where!=="bench")&&!(k==="force"&&ST.force.where!=="bench")){ returnItem(k); return; }
    return;
  }
  if(ST.on.ard){
    if(near(c,SW(),1.2)){ ST.sw=!ST.sw; say("sw",ST.sw); return; }
    if(near(c,KNOB(),1.3)){ ST.knob=Math.max(0,Math.min(1,ST.knob+(c[0]<KNOB()[0]?-0.02:0.02))); say("knob"); return; }
  }
  if(ST.on.dmm&&near(c,DIALP(),2.4)){ const seq=["OFF","V","mA","A"]; ST.dial=seq[(seq.indexOf(ST.dial)+1)%4]; ST.idle=0; if(ST.dial==="OFF") sleeping=false; say("dial",d().dial[ST.dial]); return; }
  for(const s of ["field","force"]) if(ST.on[s]&&near(c,plugXY(s),1.2)){ ST[s].plug=null; hand={k:"plug",s}; say("plug"); return; }
  for(const [i,b] of ST.batts.entries()) if(b.slot&&near(c,battBody(b.slot),2.4)){ b.slot=null; hand={k:"batt",i}; say("picked",itemName("batt")); return; }
  if(ST.force.where==="coil"&&near(c,at("coils",0,0),1.4)){
    if(ST.force.paste>0){ hand={k:"paste",g:Math.round(ST.force.paste*10)/10,m:ST.force.paste}; ST.force.paste=0; say("pasteBack"); return; }
    hand={k:"force",move:true,orig:{...ST.pos.force},where:"coil"}; ST.force.where="bench"; ST.on.force=false; say("picked",itemName("force")); return; }
  if(ST.field.where!=="bench"&&ST.on.field&&near(c,[fieldTip()[0]+6,fieldTip()[1]],6.5)&&Math.abs(c[1]-fieldTip()[1])<1){
    hand={k:"field",move:true,orig:{...ST.pos.field},where:ST.field.where}; ST.field.where="bench"; ST.on.field=false; say("picked",itemName("field")); return; }
  if(ST.magOnRuler&&near(c,at("ruler",-20.6,0),1.2)){ hand={k:"mag3",move:true,orig:{...ST.pos.mag3},where:"ruler"}; ST.magOnRuler=false; ST.on.mag3=false; say("picked",itemName("mag3")); return; }
  for(const k of ["podMag","mag3","force","field","dmm","ard","coils","stand","ruler"]){
    if(!inItem(k,c)) continue; if((k==="field"&&ST.field.where!=="bench")||(k==="force"&&ST.force.where!=="bench")) continue;
    hand={k,move:true,orig:{...ST.pos[k]}}; ST.on[k]=false; say("moveIt",itemName(k)); return; }
}
function handClick(c,right){
  const k=hand.k;
  if(right){
    if(k==="wire"&&hand.a){ hand.a=null; say("wire1"); return; }
    if(hand.move){ ST.on[k]=true; const h=hand; returnHand(); if(!h.where){} say("stays"); return; }
    if(k==="podMag"){ hand=null; ST.podMagnet=true; say("magIn"); return; }
    hand=null; say("back",itemName(k==="plug"?"field":k)); return;
  }
  if(k==="batt"){ const s=slotAt(c); if(s!=="s1"&&s!=="s2"){ say("battWhere"); return; }
    if(ST.batts.some(b=>b.slot===s)){ say("slotBusy"); return; } ST.batts[hand.i].slot=s; hand=null; say("battIn",s==="s1"?"(i)":"(ii)"); return; }
  if(k==="plug"){ const s=slotAt(c);
    if(s==="s3"||s==="s4"){ if(ST.field.plug===s||ST.force.plug===s){ say("slotBusy"); return; } ST[hand.s].plug=s; hand=null; say("plugged",s==="s3"?"(iii)":"(iv)"); return; }
    hand=null; return; }
  if(k==="wire"){ const t=termAt(c); if(!t){ say("noTerm"); return; }
    if(!hand.a){ hand.a=t; say("wire2"); return; } if(t===hand.a){ say("same"); return; }
    ST.wires.push({a:hand.a,b:t}); say("wired",d().term[hand.a],d().term[t]); hand=null; return; }
  if(k==="paste"){
    if(ST.force.where==="coil"&&near(c,at("coils",0,0),1.6)){ if(ST.force.paste>0){ say("slotBusy"); return; }
      ST.force.paste=hand.m||hand.g*(1+0.08*gauss()); hand=null; say("pasteScale"); return; }
    say("picked",itemName("paste")); return; }
  /* putting an item down */
  if(k==="field"&&ST.on.coils&&ST.force.where!=="coil"&&Math.abs(c[1]-ST.pos.coils.y)<1.6&&Math.abs(c[0]-ST.pos.coils.x)<6){
    ST.field.where="coil"; ST.field.z=Math.max(0,Math.min(60,Math.round((Z0_COIL*100-(c[0]-ST.pos.coils.x))*10))); zErr=4e-4*gauss(); ST.on.field=true; hand=null; say("inCoil"); return; }
  if(k==="field"&&ST.on.ruler&&inItem("ruler",c)){ ST.field.where="ruler"; ST.field.d=Math.max(3,Math.min(380,Math.round((c[0]-(ST.pos.ruler.x-20))*10))); dErr=5e-4*gauss(); ST.on.field=true; hand=null; say("onRuler"); return; }
  if(k==="force"&&ST.on.coils&&inItem("coils",c)){ if(ST.field.where==="coil"){ say("coilBusy"); return; } ST.force.where="coil"; ST.on.force=true; hand=null; say("forceIn"); return; }
  if(k==="mag3"&&ST.on.ruler&&near(c,at("ruler",-20,0),3)){ ST.magOnRuler=true; ST.on.mag3=true; hand=null; say("magRuler"); return; }
  if(k==="podMag"&&ST.on.stand&&inItem("stand",c)){ ST.podMagnet=true; ST.on.podMag=false; hand=null; say("magIn"); return; }
  const pos={x:c[0],y:c[1]};
  if(overlap(k,pos)){ say("noFit"); return; }
  ST.pos[k]=pos; ST.on[k]=true; if(k==="field") ST.field.where="bench"; if(k==="force") ST.force.where="bench"; hand=null; say("placed",itemName(k));
}

  if(drag.kind==="pod") ST.pod.hold=Math.atan2(p[0]-F3.c1[0],-(p[1]-F3.c1[1]));

});
closeCv.addEventListener("pointerup",()=>{ if(drag&&drag.kind==="pod"){ ST.pod.th=ST.pod.hold; ST.pod.hold=null; ST.pod.w=0; say("release"); }
  if(drag&&drag.kind==="L") say("L"); drag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e);
  if(inP(P2,p)&&(ST.field.where==="coil"||ST.field.where==="ruler")){ e.preventDefault(); const s=e.deltaY<0?1:-1;
    if(ST.field.where==="coil") ST.field.z=Math.max(0,Math.min(60,Math.round((ST.field.z+0.5*s)*2)/2)); else ST.field.d=Math.max(3,Math.min(380,Math.round(ST.field.d+s))); return; }
  if(F3.c2&&near(p,F3.c2,F3.r)){ e.preventDefault(); ST.pod.f2a=((ST.pod.f2a+(e.deltaY<0?1:-1)*(e.shiftKey?10:1))%360+360)%360; say("turn"); }
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
const fmt=t=>Math.floor(t/60)+":"+(t%60).toFixed(2).padStart(5,"0");
$("swBtn").onclick=()=>{ ST.swRun=!ST.swRun; renderPanel(); };
$("swLap").onclick=()=>{ ST.laps.unshift(fmt(ST.sw_t)); ST.laps=ST.laps.slice(0,40); renderPanel(); };
$("swReset").onclick=()=>{ ST.sw_t=0; ST.laps=[]; ST.swRun=false; renderPanel(); };
$("unwire").onclick=()=>{ ST.wires=[]; if(hand&&hand.k==="wire") hand=null; say("unwired"); drawTray(); };
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,2,5]){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===speed?"on":"";
    b.onclick=()=>{ speed=s; renderSpeeds(); }; box.appendChild(b); } }
function renderPanel(){ const t=d(); $("swBtn").textContent=ST.swRun?t.stop:t.start;
  $("laps").innerHTML=ST.laps.map((s,i)=>"<div>"+(ST.laps.length-i)+". "+s+"</div>").join(""); }
function renderStatus(F){
  const L=[], t=d();
  if(!PLACE.some(k=>ST.on[k])) L.push([t.st.none,false]);
  if(ST.on.ard&&!ardOn()) L.push([t.st.noPower,false]);
  const b2=ST.batts.find(b=>b.slot==="s2"); if(b2&&b2.q<0.15*BATT_FULL) L.push([t.st.flat,true]);
  if(ST.force.broken) L.push([t.st.broken,true]);
  if(ST.on.stand&&ST.podMagnet&&F.worst<0.2) L.push([t.st.near,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-ard").textContent=t.hArd; $("t-ardhint").textContent=t.ardHint; $("unwire").textContent=t.unwire;
  $("t-h-pod").textContent=t.hPod; $("t-podhint").textContent=t.podHint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2025 E1 — 지구 자기장 측정 · HaslaLab":"IPhO 2025 E1 — Earth's Magnetic Field · HaslaLab";
  renderPanel(); renderSpeeds(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

let tPrev=performance.now()/1000, frameN=0, lcdT=0, wasPowered=false;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const sdt=dt*speed; ST.t+=sdt; if(ST.swRun) ST.sw_t+=sdt;
  circ=circuit();
  if(Math.abs(circ.ama)>0.4&&ST.fuse){ ST.fuse=false; say("fuse"); circ=circuit(); }
  const b2=ST.batts.find(b=>b.slot==="s2"); if(b2&&circ.ok) b2.q=Math.max(0,b2.q-circ.I*sdt);
  const b1=ST.batts.find(b=>b.slot==="s1"); if(b1&&ST.on.ard) b1.q=Math.max(0,b1.q-0.05*sdt);
  if(ST.dial!=="OFF"){ ST.idle+=sdt; if(ST.idle>900) sleeping=true; }
  const powered=ardOn()&&ST.force.plug==="s4"&&ST.on.force;
  if(powered&&!wasPowered){ ST.force.zero=forceRaw(); say("zeroed"); } wasPowered=powered;
  if(powered&&!ST.force.broken&&Math.abs(forceRaw()-K.forceOff)>200){ ST.force.broken=true; say("broken"); }
  const F=podField(); let left=sdt; while(left>1e-9){ const h=Math.min(left,0.002); podStep(h,F); left-=h; }
  lcdT-=dt; if(lcdT<=0){ lcd=readLcd(); lcdT=0.25; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  $("swLbl").textContent=fmt(ST.sw_t);
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(F); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
