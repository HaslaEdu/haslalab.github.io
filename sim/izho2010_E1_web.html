<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IZhO 2010 실험 — 느린 운동 · Slow Motion · HaslaLab</title>
<meta name="description" content="IZhO 2010 실험 문제를 브라우저에서 해 봅니다. 젤을 채운 유리관(안지름 4.6 mm) 속에서 굵기가 다른 쇠막대가 가라앉고 나무 막대가 떠오르는 속도를 재어, 틈 h 에 따른 V = C·h^γ 의 지수와 나무 막대 속도가 길이에 무관함을 확인합니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IZhO 2010 실험 — 느린 운동 · Slow Motion · HaslaLab">
<meta property="og:description" content="IZhO 2010 실험: 젤 속 막대의 느린 운동과 틈의 세제곱 법칙.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* IZhO 2010 on the 3-D bench.  A glass tube (D = 4.6 mm) full of gel on a ruler.  Metal rods 4 cm long sink at
   V = C·h³ with h = (D − d)/2 (official table 2: d = 4.0, 3.5, 3.0, 2.5 mm → 0.13, 0.85, 2.99, 6.01 cm/s, γ ≈ 3);
   wooden sticks (d = 3 mm) rise at ≈ 0.082 cm/s whatever their length (table 3).  Runs scatter by a few %, and
   a rod starts a little fast for its first few centimetres. */
var PROGRAM = {
  title: { ko: 'IZhO 2010 실험 — 느린 운동', en: 'IZhO 2010 — Slow motion' },
  subtitle: { ko: '점성 매질 속 물체의 운동을 조사합니다. 장비: 삼각대, 30 cm 자, 스톱워치, 10 ml 주사기, 액체 젤(물비누) 20 ml, 안지름 D = 4.6 mm 유리관, 나무 막대(지름 3 mm), 길이 4 cm 의 쇠막대(d = 2.5, 3.0, 3.5, 4.0 mm), 컵, 휴지. 주사기 끝에 붙인 유리관은 자에 테이프로 붙어 있고, 삼각대에 관을 위로 또는 아래로 세울 수 있습니다.',
              en: 'Study motion in a viscous medium. Equipment: a tripod, a 30 cm ruler, a stopwatch, a 10 ml syringe, 20 ml of liquid gel (liquid soap), a glass tube of inner diameter D = 4.6 mm, wooden sticks (3 mm), metal rods 4 cm long (d = 2.5, 3.0, 3.5, 4.0 mm), a cup and napkins. The tube is glued to the syringe tip and taped to the ruler; the tripod holds it vertically, open end up or down.' },
  notes: { ko: [
    '과제: 1.1 d = 4.0 mm 쇠막대의 운동이 고른지 보이고 속도와 오차. 1.2 지름에 따른 속도. 1.3–1.4 틈 h = (D − d)/2 에 대해 V = C·h^γ 가 맞는지와 γ, 오차. 1.5 이론적 근거. 2.1 관을 뒤집어 나무 막대가 떠오르는 운동, 속도와 오차 (가장 긴 막대). 2.2 길이에 따른 속도, 2.3 그 까닭.',
    '공식 해답: d = 4.0 mm 가 1 cm 마다 t = 6.9, 14.3, 21.8 … 114.6 s (16 cm) — 고른 운동. 10 cm 시간 d = 4.0, 3.5, 3.0 mm: 78.6, 11.8, 3.35 s, 2.5 mm 는 20 cm 에 3.33 s → V = 0.13, 0.85, 2.99, 6.01 cm/s; log–log 기울기 γ ≈ 3 (틈의 흐름: V ∝ h³). 나무: 1 cm 마다 t = 13.1, 25.6 … 146.0 s (12 cm) → V ≈ 0.082 cm/s, 길이와 무관.',
    '막대는 처음 4–5 cm 동안은 조금 빠르게 움직입니다 — 그 뒤부터 재세요. 실행마다 몇 % 흩어집니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 show the d = 4.0 mm rod moves uniformly; its velocity with error. 1.2 velocity against diameter. 1.3–1.4 whether V = C·h^γ holds for the gap h = (D − d)/2, γ with its error. 1.5 a theoretical reason. 2.1 turn the tube over: a wooden stick rising, its velocity with error (the longest stick). 2.2 velocity against length, 2.3 why.',
    'Official solution: d = 4.0 mm takes t = 6.9, 14.3, 21.8 … 114.6 s for each further cm (16 cm) — uniform. 10 cm times for d = 4.0, 3.5, 3.0 mm: 78.6, 11.8, 3.35 s, 2.5 mm 3.33 s for 20 cm → V = 0.13, 0.85, 2.99, 6.01 cm/s; log–log slope γ ≈ 3 (gap flow: V ∝ h³). Wood: t = 13.1, 25.6 … 146.0 s each cm (12 cm) → V ≈ 0.082 cm/s, independent of length.',
    'A rod moves a little fast for its first 4–5 cm — measure after that. Runs scatter by a few %. The values differ a little from visit to visit.'] }
};

var LAB = { up: true, rod: null, y: 0, v: 0, trav: 0, sw: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 삼각대에 세운 자와 젤을 채운 유리관(아래 주사기), 쇠막대 넷(d = 2.5, 3.0, 3.5, 4.0 mm), 나무 막대 넷(길이 4, 7, 10, 13 cm), 랩 메모리 스톱워치.',
           en: 'On the desk: the ruler on the tripod with the gel-filled glass tube (the syringe below), four metal rods (d = 2.5, 3.0, 3.5, 4.0 mm), four wooden sticks (4, 7, 10, 13 cm long) and a stopwatch with lap memory.' },
  howto: { ko: ['막대 클릭: 관의 열린 끝에 넣기 (쇠막대는 관이 위로, 나무 막대는 관이 아래로) · 관 안의 막대 클릭: 꺼내기',
                '삼각대 집게 클릭: 관 뒤집기 · 자 클릭: 가까이',
                '스톱워치: <b>Space</b> 시작/정지 · <b>L</b> 랩 (메모리) · 멈춘 뒤 L: 초기화'],
           en: ['Click a rod: put it in the open end (metal with the tube upward, wood with it downward) · click the rod in the tube: take it out',
                'Click the tripod clamp: turn the tube over · click the ruler: close up',
                'Stopwatch: <b>Space</b> start/stop · <b>L</b> lap (memory) · L when stopped: reset'] },
  notePlaceholder: { ko: '예) d = 4.0 mm: 1 cm 6.9 s, 2 cm 14.3 s … / 나무 13 cm: 10 cm 122 s', en: 'e.g. d = 4.0 mm: 1 cm 6.9 s, 2 cm 14.3 s … / wood 13 cm: 10 cm 122 s' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var C3 = 5.2 * (1 + S.sys('C', 0.05)), D = 4.6, VW = 0.082 * (1 + S.sys('vw', 0.05)), GA = 3 + S.uni('ga', -0.1, 0.1);
    var METAL = [2.5, 3.0, 3.5, 4.0], WOOD = [4, 7, 10, 13], Y0 = 12, Y1 = 38;
    var sw = LAB.sw = new B3.Stopwatch(0.04, { memory: true }), rul = B3.scaleTex(30, { width: 2.6 });
    var mem = document.createElement('canvas'); mem.width = 300; mem.height = 460;
    function vOf(r) { if (r.k === 'm') { var h = (D - r.d) / 2; return -C3 * Math.pow(h, GA) / Math.pow(0.8, GA - 3); } return VW; }
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' ', 'l', 'L'], speeds: [1, 10],
      home: { yaw: -0.25, pitch: 0.3, k: 10, tx: 6, ty: 20, tz: 0 },
      views: { rul: { yaw: 0, pitch: 0.05, k: 26, tx: 0, ty: 25, tz: 0, title: { ko: '관과 자', en: 'The tube and the ruler' } },
               sw: { yaw: 0, pitch: 1.25, k: 46, tx: 29, ty: 1.7, tz: 10, title: { ko: '스톱워치와 메모리', en: 'Stopwatch and memory' } } },
      frame: function (b) {
        for (var i = 0; i < b.keys.length; i++) { if (b.keys[i] === ' ') sw.startStop(b.t); else sw.lapReset(b.t); }
        if (b.clicked('c:clamp')) { LAB.up = !LAB.up; if (LAB.rod) { LAB.y = Y0 + Y1 - LAB.y - LAB.rod.L; LAB.trav = 0; } }
        if (b.clicked('c:rul')) b.go('rul');
        if (b.clicked('c:inrod')) { LAB.rod = null; }
        for (var k = 0; k < 4; k++) {
          if (b.clicked('c:m' + k)) { if (!LAB.up) b.say('쇠막대는 관의 열린 끝이 위일 때 넣습니다', 'Metal rods go in with the open end up'); else { LAB.rod = { k: 'm', d: METAL[k], L: 4, f: 1 + HL.gauss(0.03) }; LAB.y = Y1 - 4; LAB.trav = 0; } }
          if (b.clicked('c:w' + k)) { if (LAB.up) b.say('나무 막대는 관을 뒤집어 아래에서 넣습니다', 'Wooden sticks go in from below with the tube turned over'); else { LAB.rod = { k: 'w', d: 3, L: WOOD[k], f: 1 + HL.gauss(0.03) }; LAB.y = Y0; LAB.trav = 0; } } }
        if (LAB.rod && b.dt > 0) { var V = vOf(LAB.rod) * LAB.rod.f, fast = 1 + 0.5 * Math.exp(-LAB.trav / 1.5), dy = V * fast * b.dt;
          var lo = Y0 + (LAB.up ? 0.3 : 0), hi = Y1 - LAB.rod.L - (LAB.up ? 0 : 0.3);
          var ny = Math.max(lo, Math.min(hi, LAB.y + dy)); LAB.trav += Math.abs(ny - LAB.y); LAB.y = ny; }
        B3.desk(-30, 40, -18, 20);
        /* tripod, ruler, tube, syringe */
        B3.box3(-8, 8, 0, 1.4, -12, -4, '#3b4048', { top: '#474c55' }); B3.cylSeg('y', 1.4, 46, -6, -8, 0.7, '#c3c8cd', { seg: 12, cap: '#dde1e4' }, 6);
        B3.box3(-7, -4.6, 26, 29, -9, -7, '#3a3f46', { id: 'c:clamp', top: '#474c55' }); B3.cyl3('x', -4.6, -1.6, 27.5, -2.5, 0.4, '#9aa0a6', { seg: 8, id: 'c:clamp' });
        B3.box3(-1.6, 1.4, Y0 - 4, Y0 + 30, -2.2, -1.6, '#d9c48f', { id: 'c:rul' });
        B3.tex3(rul, 0, 0, rul.width, rul.height, [-1.6, Y0 - 1 + 32, -1.58], [2.6, 0, 0], [0, -32, 0], { id: 'c:rul' });
        B3.cyl3('y', Y0, Y1, 2.6, -1, 0.42, 'rgba(225,240,248,.45)', { seg: 14, caps: false, noObst: true });
        B3.cyl3('y', Y0 + 0.05, Y1 - 0.05, 2.6, -1, 0.3, 'rgba(255,230,150,.45)', { seg: 12, cap: 'rgba(255,230,150,.55)', noObst: true });
        var sy0 = LAB.up ? Y0 - 7 : Y1, sy1 = LAB.up ? Y0 : Y1 + 7;
        B3.cyl3('y', sy0, sy1, 2.6, -1, 0.9, 'rgba(235,240,245,.65)', { seg: 16, cap: 'rgba(235,240,245,.7)' });
        B3.cyl3('y', LAB.up ? sy0 - 2 : sy1, LAB.up ? sy0 : sy1 + 2, 2.6, -1, 0.3, '#e8e8e8', { seg: 10 });
        if (LAB.rod) B3.cyl3('y', LAB.y, LAB.y + LAB.rod.L, 2.6, -1, LAB.rod.d / 20, LAB.rod.k === 'm' ? '#8d949c' : '#c8a26a', { seg: 10, id: 'c:inrod' });
        /* rods on the desk */
        METAL.forEach(function (d, j) { B3.cyl3('x', 12, 16, 0.3, 4 + j * 1.6, d / 20 * 1.5, '#8d949c', { seg: 10, cap: '#a7aeb6', id: 'c:m' + j }); B3.text3([16.5, 0.05, 4.3 + j * 1.6], [1, 0, 0], [0, 0, -1], d.toFixed(1), 0.6, '#333', { weight: '700' }); });
        WOOD.forEach(function (L, j) { B3.cyl3('x', 12, 12 + L, 0.3, 12 + j * 1.4, 0.3, '#c8a26a', { seg: 8, cap: '#d8b27a', id: 'c:w' + j }); });
        B3.stopwatch(b, 'sw', [25, 10], sw);
        var g = mem.getContext('2d'); g.fillStyle = '#20252b'; g.fillRect(0, 0, 300, 460); g.fillStyle = '#b9c4a4'; g.fillRect(10, 10, 280, 440); g.fillStyle = '#1d2318'; g.font = '800 20px sans-serif'; g.textAlign = 'left'; g.fillText('MEMORY', 22, 40); g.font = '700 15px monospace';
        sw.laps.slice(-40).forEach(function (t, i2) { g.fillText(String(Math.max(0, sw.laps.length - 40) + i2 + 1).padStart(2, ' ') + ' ' + t.toFixed(2).padStart(6, ' '), 22 + (i2 < 20 ? 0 : 138), 70 + (i2 % 20) * 19); });
        B3.tex3(mem, 0, 0, 300, 460, [30, 0.05, 6], [5.5, 0, 0], [0, 0, 8.4], { id: 'm:sw' });
        LAB.state = { up: LAB.up, rod: LAB.rod, y: LAB.y, V: LAB.rod ? vOf(LAB.rod) : 0 };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
