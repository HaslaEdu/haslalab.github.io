<script>
/* EuPhO 2021 E1 "Hidden wire" — browser build of the official console program
   (E1_hidden_wire_win.exe / _linux / _osx).

   EuPhO did not publish the source for 2021, so the engine is written from the
   problem statement with the parameters the official solution states are "the
   values preset in the simulation program": h = 5.0 mm, B_E = 4.0e-5 T and a
   wire projection y = -0.58 x + 75.3 mm.  Checked against the official data
   tables: I = +5 A at (0, 75) gives -143 deg, at (20, 75) gives -79 deg. */

var A_WIRE = -0.58, B_WIRE = 75.3, H_DEPTH = 5.0e-3, B_EARTH = 4.0e-5;
var MU0 = 4e-7 * Math.PI, L_SIDE = 100.0, I_MAX = 5.0, POS_SIGMA = 0.5;
var SEP = new Array(32).join('-');

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function phiDeg(I, xmm, ymm) {
  var theta = Math.atan(A_WIRE);
  var tx = Math.cos(theta), ty = Math.sin(theta);
  var rx = xmm * 1e-3, ry = (ymm - B_WIRE) * 1e-3, rz = H_DEPTH;
  var dot = rx * tx + ry * ty;
  var px = rx - dot * tx, py = ry - dot * ty, pz = rz;
  var d2 = px * px + py * py + pz * pz;
  var c = MU0 * I / (2 * Math.PI * d2);
  return Math.atan2(c * (ty * pz), c * (-tx * pz) + B_EARTH) * 180 / Math.PI;
}

var PROGRAM = {
  title: 'EuPhO 2021 E1 — Hidden wire',
  subtitle: '주최측이 배포한 것은 콘솔 실행 파일뿐입니다. 이 페이지는 그 프로그램을 브라우저에서 그대로 돌리는 판입니다.',
  notes: [
    '공식 바이너리는 <code>EuPhO-2021/official/official_binaries/{Windows,Linux,OSX}/</code>에 있습니다. 이 페이지는 그것과 같은 프롬프트·범위·반올림·출력 형식을 씁니다.',
    '2021년은 소스가 공개되지 않아 물리는 문제지에서 다시 썼고, 숨은 값은 공식 해답이 "시뮬레이션에 설정된 값과 두 자리까지 일치한다"고 밝힌 h = 5.0 mm, B<sub>E</sub> = 4.0&times;10<sup>-5</sup> T, 도선 y = &minus;0.58x + 75.3 mm를 씁니다.',
    '공식 해답의 데이터 표와 대조했습니다 — I = +5 A일 때 (0, 75)에서 &phi; = &minus;143&deg;, (20, 75)에서 &minus;79&deg;로 일치합니다.',
    'I는 0.1 A, x·y는 1 mm로 반올림되고, 나침반을 놓을 때마다 약 0.5 mm의 오차가 생깁니다. &phi;는 1&deg; 단위로 출력됩니다.',
    '과제: (a) 도선의 식 y = ax + b와 그 불확도, 양의 전류 방향 (b) 깊이 h와 지구자기 수평성분 B<sub>E</sub>.'
  ],
  run: async function (term) {
    async function ask(prompt, lo, hi) {
      for (;;) {
        var raw = (await term.ask(prompt)).trim();
        var v = parseFloat(raw);
        if (raw === '' || isNaN(v)) { term.writeln('Invalid input.'); continue; }
        if (!(v >= lo && v <= hi)) { term.writeln('Value out of range.'); continue; }
        return v;
      }
    }
    for (;;) {
      var I = await ask('Enter I (A) between -5.0 and 5.0: ', -I_MAX, I_MAX);
      var x = await ask('Enter X (mm) between 0 and 100: ', 0, L_SIDE);
      var y = await ask('Enter Y (mm) between 0 and 100: ', 0, L_SIDE);
      I = Math.round(I * 10) / 10;
      x = Math.round(x);
      y = Math.round(y);
      var phi = Math.round(phiDeg(I, x + gauss(POS_SIGMA), y + gauss(POS_SIGMA)));
      term.writeln('PHI = ' + phi + ' degrees');
      term.writeln(SEP);
    }
  }
};


/* Simulation mode: the same phiDeg() with the same placing error, drawn as the 10 cm board seen
   from above with the compass where it was put.  The wire stays hidden under the board. */
PROGRAM.sim = {
  intro: '10 cm × 10 cm 판을 위에서 본 모습입니다. 판 아래 5 mm 깊이에 도선이 숨어 있습니다. 전류 I를 흘리고 나침반을 (x, y)에 놓으면 ' +
         '바늘이 지구 자기장과 도선의 자기장의 합 방향을 가리킵니다. 각 φ는 +x 축에서 시계 반대 방향으로 잽니다(전류가 없으면 0°). 앞서 잰 자리에는 바늘 방향이 흐리게 남습니다.',
  fields: [
    { id: 'I', label: '전류 I', unit: 'A', lo: -I_MAX, hi: I_MAX, step: 0.1, quant: 0.1, value: 5 },
    { id: 'x', label: '나침반 x', unit: 'mm', lo: 0, hi: L_SIDE, step: 1, quant: 1, value: 50 },
    { id: 'y', label: '나침반 y', unit: 'mm', lo: 0, hi: L_SIDE, step: 1, quant: 1, value: 50 }
  ],
  columns: ['#', 'I (A)', 'x (mm)', 'y (mm)', 'φ (°)'],
  aspect: 0.62,
  goLabel: '나침반 놓고 읽기',
  n: 0, prev: 0,
  measure: function (v) {
    var phi = Math.round(phiDeg(v.I, v.x + gauss(POS_SIGMA), v.y + gauss(POS_SIGMA)));
    this.n++;
    var from = this.prev; this.prev = phi;
    return { st: { phi: phi, from: from }, rows: [[this.n, v.I.toFixed(1), v.x, v.y, phi]], ms: 1600 };
  },
  draw: function (g, W, H, S) {
    var D = SIMDRAW, st = S.st, run = st && !S.done, v = run || !S.last ? S.vals : S.last;
    g.fillStyle = '#16130f'; g.fillRect(0, 0, W, H);
    var side = H - 56, bx = 46, by = 22, sc = side / L_SIDE;
    var P = function (x, y) { return [bx + x * sc, by + side - y * sc]; };
    /* the board: a sheet of mm paper on wood */
    g.fillStyle = '#7a5a3a'; g.fillRect(bx - 12, by - 12, side + 24, side + 24);
    g.fillStyle = '#f3f1e8'; g.fillRect(bx, by, side, side);
    for (var m = 0; m <= 100; m += 2) { g.strokeStyle = m % 10 ? 'rgba(220,120,90,.18)' : 'rgba(200,90,60,.5)'; g.lineWidth = m % 10 ? 0.5 : 1;
      var a = P(m, 0), b = P(m, 100); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      a = P(0, m); b = P(100, m); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    for (m = 0; m <= 100; m += 20) { var q = P(m, 0); D.text(g, String(m), q[0], by + side + 14, '#cbbca8', 11, 'center');
      q = P(0, m); D.text(g, String(m), bx - 16, q[1], '#cbbca8', 11, 'right'); }
    D.text(g, 'x (mm)', bx + side, by + side + 30, '#cbbca8', 11, 'right');
    D.text(g, 'y (mm)', bx - 40, by - 6, '#cbbca8', 11);
    /* earlier readings */
    S.hist.forEach(function (h) { var c = P(h.vals.x, h.vals.y), a = -h.st.phi * Math.PI / 180;
      D.arrow(g, c[0] - 7 * Math.cos(a), c[1] - 7 * Math.sin(a), c[0] + 7 * Math.cos(a), c[1] + 7 * Math.sin(a), 'rgba(60,60,160,.45)', 1.2); });
    /* the compass: 14 mm across, the needle swinging into place */
    var c = P(v.x, v.y), R = Math.max(14, 7 * sc), ang;
    if (!st) ang = 0;
    else if (run) { var e = S.p, d = st.phi - st.from; ang = st.from + d * (1 - Math.exp(-5 * e) * Math.cos(9 * e)); }
    else ang = st.phi;
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.arc(c[0] + 2, c[1] + 3, R + 3, 0, 7); g.fill();
    g.fillStyle = '#c9ccd0'; g.beginPath(); g.arc(c[0], c[1], R + 3, 0, 7); g.fill();
    g.fillStyle = '#fbfbf7'; g.beginPath(); g.arc(c[0], c[1], R, 0, 7); g.fill();
    for (var k = 0; k < 36; k++) { var t = k * Math.PI / 18; g.strokeStyle = '#555'; g.lineWidth = k % 9 ? 0.6 : 1.3;
      g.beginPath(); g.moveTo(c[0] + R * Math.cos(t), c[1] + R * Math.sin(t)); g.lineTo(c[0] + R * (k % 9 ? 0.9 : 0.8) * Math.cos(t), c[1] + R * (k % 9 ? 0.9 : 0.8) * Math.sin(t)); g.stroke(); }
    var A = -ang * Math.PI / 180, ux = Math.cos(A), uy = Math.sin(A), nx = -uy, ny = ux, L = R * 0.78, w = R * 0.14;
    g.fillStyle = '#d23a2e'; g.beginPath(); g.moveTo(c[0] + ux * L, c[1] + uy * L); g.lineTo(c[0] + nx * w, c[1] + ny * w); g.lineTo(c[0] - nx * w, c[1] - ny * w); g.fill();
    g.fillStyle = '#2f3b4a'; g.beginPath(); g.moveTo(c[0] - ux * L, c[1] - uy * L); g.lineTo(c[0] + nx * w, c[1] + ny * w); g.lineTo(c[0] - nx * w, c[1] - ny * w); g.fill();
    g.fillStyle = '#888'; g.beginPath(); g.arc(c[0], c[1], 2.2, 0, 7); g.fill();
    if (run && S.p > 0.15) D.arrow(g, c[0], c[1], c[0], c[1], '#000', 1);
    /* side panel: the supply, the reading, north */
    var px = bx + side + 40, pw = W - px - 16;
    D.text(g, '직류 전원', px, 36, '#e8e8e8', 12, 'left', true);
    D.lcd(g, px, 46, Math.min(200, pw), 32, (st ? (run ? v.I : v.I) : v.I).toFixed(1) + ' A', '#ff9b6b');
    D.text(g, '나침반 눈금', px, 108, '#e8e8e8', 12, 'left', true);
    D.lcd(g, px, 118, Math.min(200, pw), 32, st && !run ? 'φ = ' + st.phi + '°' : '— °');
    D.arrow(g, px + 20, 210, px + 70, 210, '#e8e8e8', 2); D.text(g, '+x 방향 = φ 0°', px + 78, 210, '#cfd6dc', 12);
    D.text(g, '(' + v.x + ', ' + v.y + ') mm', px, 250, '#cfd6dc', 12);
  }
};
</script>
