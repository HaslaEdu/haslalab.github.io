<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>

<body>
<script>
/* RMPh 2014 problem 2 on the 3-D bench.  The sheet gives the three tables; here they are measured.  Inside: the
   official solution's triangle — R12 = 10 Ω, R23 = 5 Ω, R31 = 2 Ω with emfs V1 − V2 = −2 V, V2 − V3 = +5 V,
   V3 − V1 = +10 V (each plus R·I along the branch) — the signs that reproduce all three tables exactly.  The
   device: a variable source S in series with an ammeter A between P and Q, a voltmeter V across P–Q; the
   current is positive when it passes through the ammeter from P to Q. */
var PROGRAM = {
  title: { ko: 'RMPh 2014 실험 2 — 전기 블랙박스', en: 'RMPh 2014 Problem 2 — Electrical black box' },
  subtitle: { ko: '단자 1, 2, 3 의 전기 블랙박스를 가변 전원 S 와 직렬 전류계 A(단자 P, Q), P–Q 의 전압계 V 로 조사합니다. (1, 2, P | 3, Q), (2, 3, P | 1, Q), (3, 1, P | 2, Q) 로 이어 전원을 바꾸며 전류–전압을 재고, 직선의 절편과 기울기로 가장 간단한 삼각형 회로의 저항과 기전력을 구하세요. 가장 작은 저항과 직렬인 이상 전원의 기전력은 10 V 입니다.',
              en: 'Study the electrical black box with terminals 1, 2, 3 using a variable source S in series with an ammeter A (terminals P, Q) and a voltmeter V across P–Q. Connect (1, 2, P | 3, Q), (2, 3, P | 1, Q) and (3, 1, P | 2, Q), vary the source, record current against voltage, and from the lines\' intercepts and slopes find the resistors and emfs of the simplest triangle circuit. The ideal source in series with the smallest resistor has an emf of 10 V.' },
  notes: { ko: [
    '문제지는 세 표를 줍니다 — 표 1: U = −6…4 V 에서 I = −0.2…6.8 A, 표 2: U = 0…10 V 에서 I = −5.2…0.8 A, 표 3: U = −6…2 V 에서 I = −0.6…1.8 A. 여기서는 직접 잽니다. 모든 특성은 직선이고, 오차 계산은 하지 않습니다.',
    '공식 해답: R₁₂ = 10 Ω, R₂₃ = 5 Ω, R₃₁ = 2 Ω, E₃₁ = 10 V, E₂₃ = 5 V, E₁₂ = 2 V. 과제 3: P, Q 를 1, 2 에 이으면 단락 전류 164/70 A, 열린 회로 전압 164/17 V.',
    '전류는 전류계 안에서 P 에서 Q 로 흐를 때 양수입니다. 전원과 전류계의 내부 저항은 무시, 전압계는 무한대로 봅니다.'], en: [
    'The sheet gives three tables — table 1: I = −0.2…6.8 A for U = −6…4 V; table 2: I = −5.2…0.8 A for U = 0…10 V; table 3: I = −0.6…1.8 A for U = −6…2 V. Here you measure them. All characteristics are linear; no error analysis is needed.',
    'Official solution: R₁₂ = 10 Ω, R₂₃ = 5 Ω, R₃₁ = 2 Ω, E₃₁ = 10 V, E₂₃ = 5 V, E₁₂ = 2 V. Task 3: with P, Q on 1, 2 the short-circuit current is 164/70 A and the open-circuit voltage 164/17 V.',
    'The current is positive when it passes through the ammeter from P to Q. The source and ammeter have negligible resistance, the voltmeter infinite.'] }
};

var LAB = { leads: null, c: null, U: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 1, 2, 3 의 블랙박스, 가변 전원 S·전류계 A·전압계 V 가 든 측정 장치(단자 P, Q), 도선.',
           en: 'On the desk: the black box with terminals 1, 2, 3, the measuring device with the variable source S, the ammeter A and the voltmeter V (terminals P, Q), and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다 — 두 단자를 P 에 함께 이으려면 도선 두 개를 씁니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '전원 손잡이 위에서 휠 또는 좌우로 끌기: 전압 U 바꾸기 (−10…+10 V) · 장치 클릭: 표시 가까이'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in — use two wires to join two terminals to P. Click a plugged end to pull it out; click the desk to put it down',
                'Wheel or drag left/right over the source knob: change the voltage U (−10…+10 V) · click the device: read its displays'] },
  notePlaceholder: { ko: '예) (1,2,P | 3,Q): U = −6 V, I = −0.20 A; −4 V, 1.20 A …', en: 'e.g. (1,2,P | 3,Q): U = −6 V, I = −0.20 A; −4 V, 1.20 A …' },
  mount: function (host, ctx) {
    var leads = LAB.leads = new B3.Leads({ max: 6 }), c = LAB.c = new B3.Circuit();
    var lcdV = document.createElement('canvas'), lcdA = document.createElement('canvas'); lcdV.width = lcdA.width = 220; lcdV.height = lcdA.height = 70;
    function lcd(cv, txt, unit) { var g = cv.getContext('2d'); g.fillStyle = '#a9c0a2'; g.fillRect(0, 0, 220, 70); g.fillStyle = '#16200f'; g.font = '700 40px monospace'; g.textAlign = 'right'; g.fillText(txt, 180, 50); g.font = '700 22px sans-serif'; g.fillText(unit, 214, 50); }
    var DX = 12, DZ = 2;
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['knob'],
      home: { yaw: -0.3, pitch: 0.85, k: 14, tx: 2, ty: 0, tz: 2 },
      views: { dev: { yaw: 0, pitch: 0.75, k: 40, tx: DX, ty: 3, tz: DZ + 3, title: { ko: '측정 장치', en: 'The measuring device' } } },
      frame: function (b) {
        var mk = b.screenMoved('knob'), wk = b.wheel('knob'); if (mk[0] || wk) LAB.U = Math.max(-10, Math.min(10, Math.round((LAB.U + mk[0] * 0.05 + wk * 0.1) * 10) / 10));
        if (b.clicked('m:dev')) b.go('dev');
        B3.desk(-32, 36, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-14, 2], [{ name: '1', col: '#d8d8d8', label: '1' }, { name: '2', col: '#d8d8d8', label: '2' }, { name: '3', col: '#d8d8d8', label: '3' }], { label: 'RMPh 2014 · 2', w: 15 });
        /* the device: housing, knob, two displays, the terminals P and Q */
        B3.box3(DX - 9, DX + 9, 0, 5, DZ - 4, DZ + 5, '#2b2f35', { id: 'm:dev', top: '#33373e' });
        B3.tex3(lcdV, 0, 0, 220, 70, [DX - 8, 5.01, DZ - 3], [6.5, 0, 0], [0, 0, 2.1], { id: 'm:dev' });
        B3.tex3(lcdA, 0, 0, 220, 70, [DX - 0.5, 5.01, DZ - 3], [6.5, 0, 0], [0, 0, 2.1], { id: 'm:dev' });
        B3.text3([DX - 8, 5.02, DZ - 0.3], [1, 0, 0], [0, 0, -1], 'V', 0.8, '#ddd', { weight: '800' }); B3.text3([DX - 0.5, 5.02, DZ - 0.3], [1, 0, 0], [0, 0, -1], 'A', 0.8, '#ddd', { weight: '800' });
        var ka = LAB.U / 10 * 2.4;
        B3.cyl3('y', 5, 6.2, DX - 4.5, DZ + 2.6, 1.3, '#4a4f55', { seg: 22, cap: '#5a5f65', id: 'm:knob' });
        B3.line3([DX - 4.5, 6.22, DZ + 2.6], [DX - 4.5 + Math.sin(ka) * 1.2, 6.22, DZ + 2.6 - Math.cos(ka) * 1.2], '#f2f2f2', 2.5);
        B3.text3([DX - 6.6, 5.02, DZ + 4.6], [1, 0, 0], [0, 0, -1], 'S', 0.8, '#ddd', { weight: '800' });
        leads.term(b, 'dev.P', [DX + 3, 5, DZ + 3], { col: '#c0392b', label: 'P', lc: '#e8e8e8' });
        leads.term(b, 'dev.Q', [DX + 7, 5, DZ + 3], { col: '#1b1b1b', label: 'Q', lc: '#e8e8e8' });
        c.reset();
        c.V(T['1'], T['2'], -2, 10); c.V(T['2'], T['3'], 5, 5); c.V(T['3'], T['1'], 10, 2);
        var e = c.V('dev.P', 'dev.Q', LAB.U, 1e-4);
        leads.wire(c); c.solve(0.05);
        var I = -c.cur(e), U = c.V_('dev.P') - c.V_('dev.Q');      /* positive from P to Q through the ammeter */
        lcd(lcdV, U.toFixed(2), 'V'); lcd(lcdA, (Math.abs(I) < 20 ? I.toFixed(2) : (I > 0 ? '1' : '-1') + '   '), 'A');
        leads.draw(b);
        LAB.state = { U: U, I: I };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
