<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}

/* ══════════════════════════════════════════════════════════════

const U=(a,b)=>a+Math.random()*(b-a);
const gauss=(m,s)=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const TRUE=(()=>{ const t={};
  t.Lam=U(58,64); t.d=U(57.5,62.5); t.A=U(4.6,5.4); t.s=U(8.5,11.5); t.lam=U(650,658);
  t.x0=U(8,40);                                  /* where, on the scale, a sinusoid crosses its axis going up */
  t.off=[gauss(0,1.2),gauss(0,1.2)]; t.tilt=[gauss(0,0.0015),gauss(0,0.0015)];   /* the laser's aim, mm and rad */

   ══════════════════════════════════════════════════════════════ */

const ST={ on:new Set(), las:false, focus:U(22,45), p:U(15,65), L:55, marks:[], t:0 };

function say(key,...args){ msg={key,args,t:performance.now()}; }

const itemName=k=>d().items[k]||k;
const LAS_X=6, FX=14, BY=30, BZ=11;            /* the laser, the foil plane, the beam line (cm on the bench) */
const faceX=()=>FX+ST.L;
const lasing=()=>has("laser")&&has("stands")&&ST.las;
const foilIn=()=>has("foil")&&has("stands");
/* the slope of the printed lines where the beam crosses the foil */
const kW=()=>2*Math.PI/TRUE.Lam;
const theta=()=>Math.atan(TRUE.A*kW()*Math.cos(kW()*(ST.p-TRUE.x0)));

const spotR=()=>{ const D=faceX()-LAS_X; return 0.35+1.4*Math.abs(D-ST.focus)/ST.focus; };

function spots(){ const Lm=ST.L*10, o=[TRUE.off[0]+Lm*TRUE.tilt[0],TRUE.off[1]+Lm*TRUE.tilt[1]], out=[[o[0],o[1],1]];

function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);

  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]<=0.02) continue;

  poly(c.map(p=>P(p[0],p[1],z0+h)),top,edge,0.6);
  return c;
}

  ctx.strokeStyle="#333"; for(let r=0;r<=10;r++){ ctx.lineWidth=r%5===0?1.4:0.7; ctx.beginPath(); ctx.moveTo(Math.max(0,X(0)),ry(r)); ctx.lineTo(Math.min(CLW,X(80)),ry(r)); ctx.stroke(); text(String(r),Math.max(4,X(0)-12),ry(r),"#333",11,"center"); }
  for(let i=Math.max(0,Math.floor(ST.p-6));i<=Math.min(80,Math.ceil(ST.p+6));i++){ ctx.lineWidth=i%10===0?1.6:i%5===0?1.2:0.8; ctx.beginPath(); ctx.moveTo(X(i),y0); ctx.lineTo(X(i),y1+(i%5===0?14:8)); ctx.stroke();
    if(i%1===0) text(String(i),X(i),y1+26,"#222",i%5===0?13:10.5,"center",i%5===0?"700":"400");
    if(i<80){ ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(X(i),y1); ctx.lineTo(X(i+1),y0); ctx.stroke(); } }
  text("mm",X(ST.p)-k*4.4,y1+44,"#555",11,"left");
  /* the ruler along the bottom, and the steel side of the stand */
  ctx.fillStyle="rgba(200,220,232,0.55)"; ctx.fillRect(0,y1+52,CLW,CLH-y1-52); ctx.strokeStyle="#8aa"; ctx.beginPath(); ctx.moveTo(0,y1+52); ctx.lineTo(CLW,y1+52); ctx.stroke();
  const e=X(ST.p); const gr=ctx.createLinearGradient(e,0,e+40,0); gr.addColorStop(0,"#6f757c"); gr.addColorStop(0.1,"#a3a9b0"); gr.addColorStop(1,"#8b9198"); ctx.fillStyle=gr; ctx.fillRect(e,y0-40,CLW-e,y1-y0+92);
  ctx.strokeStyle="#2a2d31"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(e,y0-40); ctx.lineTo(e,y1+52); ctx.stroke();
  text(t.lab.foilEdge,e+12,y0-24,"#1b1d20",12,"left","700"); }

/* ── 3. the layout from above, with the measuring tape ── */
let TV={};
function drawTop(){ const t=d(); ctx.fillStyle="#2a2d33"; ctx.fillRect(0,0,CLW,CLH);
  const k=(CLW-40)/122, X=x=>20+x*k, Y=y=>CLH*0.55+(y-BY)*k; TV={k,X,Y};
  fillR(X(0),Y(0),122*k,72*k,4,"#e9eaec");
  if(has("stands")){ fillR(X(LAS_X-6),Y(BY+1),6*k,6*k,1,"#a3a9b0","#555"); const ye=yEdge(); fillR(X(FX-6),Y(ye),6.3*k,8*k,1,"#a3a9b0","#555"); hitAdd("stand",X(FX-6),Y(ye-3),7*k,11*k);
    if(has("foil")){ ctx.fillStyle="rgba(200,200,180,0.9)"; ctx.fillRect(X(FX+0.3),Y(ye-6),Math.max(2,0.25*k),9*k); text(t.lab.foil,X(FX+1),Y(ye-6.5),"#333",11,"left"); } }
  if(has("laser")&&has("stands")){ fillR(X(LAS_X-5.5),Y(BY-0.6),5.8*k,1.2*k,1,"#2b2e33"); text(t.lab.laser,X(LAS_X-5.5),Y(BY-2),"#333",11,"left"); }
  if(has("ruler")){ ctx.fillStyle="rgba(200,220,232,0.8)"; ctx.fillRect(X(FX-7.5),Y(BY-12),1.5*k*2,30*k); }
  if(has("scale")){ ctx.fillStyle="#f7f6ef"; ctx.fillRect(X(FX-6),Y(BY-5),2.8*k,10*k); }
  if(has("screen")){ const f=faceX(); fillR(X(f),Y(BY-20),12*k,40*k,2,"#c9a46a","#7a5f33",1.5); hitAdd("screen",X(f)-6,Y(BY-20),12*k+12,40*k); text(t.lab.screenFace,X(f)-4,Y(BY-21.5),"#333",11,"right"); }
  if(lasing()){ ctx.strokeStyle="rgba(255,50,50,0.85)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(LAS_X),Y(BY)); ctx.lineTo(X(has("screen")?faceX():121),Y(BY)); ctx.stroke(); }
  if(has("tape")){ ctx.fillStyle="#f4d641"; ctx.fillRect(X(FX),Y(BY-11.6),(faceX()-FX)*k,0.7*k);
    /* the end of the tape at the screen, magnified */
    const W=Math.min(360,CLW*0.42), H=92, bx=CLW-W-14, by=12, mm=W/50, c=ST.L*10; fillR(bx,by,W,H,6,"#15181d","#555"); text(t.lab.tape,bx+8,by+12,"#c9ced3",11,"left","700");
    ctx.save(); ctx.beginPath(); ctx.rect(bx+4,by+20,W-8,H-24); ctx.clip(); ctx.fillStyle="#f4d641"; ctx.fillRect(bx,by+30,W,40);
    for(let v=Math.floor(c-26);v<=c+26;v++){ const x=bx+W/2+(v-c+0)*mm-W*0.1, L0=v%10===0?18:v%5===0?12:7; ctx.strokeStyle="#111"; ctx.lineWidth=v%10===0?1.4:0.8; ctx.beginPath(); ctx.moveTo(x,by+30); ctx.lineTo(x,by+30+L0); ctx.stroke(); if(v%10===0) text(String(v/10),x,by+60,"#111",12,"center","700"); }
    const fx=bx+W/2-W*0.1; ctx.fillStyle="rgba(201,164,106,0.95)"; ctx.fillRect(fx,by+20,W,H); ctx.strokeStyle="#7a5f33"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(fx,by+20); ctx.lineTo(fx,by+H); ctx.stroke(); ctx.restore(); }
  else text(t.lab.noTape,14,CLH-12,"#c9ced3",11,"left"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="scale") drawScale(); else if(tab==="top") drawTop(); else drawScr(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   6.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ return pick3(p[0],p[1])||null; }
let drag=null;
function clearK(k){ ST.on.delete(k);
  if(k==="laser"||k==="stands") ST.las=false;
  if(k==="screen"){ ST.marks=[]; ST.on.delete("gonio"); } }
const NEEDS={gonio:["screen"]};
function place(k){ for(const n of NEEDS[k]||[]) if(!has(n)){ say("needFor",itemName(n)); return false; } ST.on.add(k); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item; if(right){ say("back",itemName(k)); hand=null; return; } if(place(k)) hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ clearK(k); say("back",itemName(k)); return; }
  if(k==="laser"&&has("stands")){ toggleLaser(); return; }
  if(k==="screen"||k==="gonio") setTab("scr"); else if(k==="scale"||k==="ruler"||k==="stands"||k==="foil") setTab("scale"); else if(k==="tape") setTab("top"); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(120,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const p=clpos(e), up=e.deltaY<0;
  if(tab==="scr"){ const m=sMm(p[0],p[1]), nz=Math.max(0.8,Math.min(40,SV.z*(up?1.15:1/1.15))); SV.z=nz; const q=sMm(p[0],p[1]); SV.c=[SV.c[0]+m[0]-q[0],SV.c[1]+m[1]-q[1]]; return; }
  if(tab==="scale"||tab==="top"){ const h=tab==="top"?hitAt(p):true; if(h&&(tab==="scale"||h.k==="stand")) slide(up?0.1:-0.1); } },{passive:false});
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const p=cmouse;
  if(cdrag.k==="pan"){ if(Math.hypot(p[0]-cdrag.p[0],p[1]-cdrag.p[1])>4) cdrag.moved=true; SV.c=[cdrag.c[0]-(p[0]-cdrag.p[0])/SV.z,cdrag.c[1]+(p[1]-cdrag.p[1])/SV.z]; return; }
  if(cdrag.k==="screen"){ moveScreen(Math.round(((p[0]-TV.X(FX))/TV.k)*10)/10-ST.L); return; }
  if(cdrag.k==="stand"){ const dmm=(p[1]-cdrag.y)/TV.k*10; if(Math.abs(dmm)>=0.5){ slide(Math.round(dmm)); cdrag.y=p[1]; } return; }
  if(cdrag.k==="scaleDrag"){ const dmm=(p[0]-cdrag.x)/(CLW/10); if(Math.abs(dmm)>=0.1){ slide(Math.round(dmm*10)/10); cdrag.x=p[0]; } } });
closeCv.addEventListener("pointerup",e=>{ if(cdrag&&cdrag.k==="pan"&&!cdrag.moved&&tab==="scr"&&has("screen")){ ST.marks.push(sMm(cdrag.p[0],cdrag.p[1])); say("mark"); } cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2; closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="scr"){ if(right){ const m=sMm(p[0],p[1]); let bi=-1, bd=12/SV.z; ST.marks.forEach((q,i)=>{ const dd=Math.hypot(q[0]-m[0],q[1]-m[1]); if(dd<bd){ bd=dd; bi=i; } }); if(bi>=0){ ST.marks.splice(bi,1); say("unmark"); } return; }
    cdrag={k:"pan",p,c:SV.c.slice(),moved:false}; return; }
  if(tab==="top"&&h&&!right){ if(h.k==="screen") cdrag={k:"screen"}; else if(h.k==="stand") cdrag={k:"stand",y:p[1]}; return; }
  if(tab==="scale"&&!right&&has("stands")) cdrag={k:"scaleDrag",x:p[0]}; });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
/* sliding by hand along the ruler: the stand goes where it is pushed, give or take a few hundredths */
function slide(dmm){ if(!need("stands")) return; const np=ST.p+dmm+(Math.abs(dmm)>0?gauss(0,0.015):0); if(np<0||np>80){ say("end"); } ST.p=Math.max(0,Math.min(80,Math.round(np*100)/100)); }
function moveScreen(dcm){ if(!need("screen")) return; const nl=Math.round((ST.L+dcm)*10)/10; if(nl<15||nl>94) say("far"); ST.L=Math.max(15,Math.min(94,nl)); }
function toggleLaser(){ if(!need("laser")||!need("stands")) return; ST.las=!ST.las; say(ST.las?"las":"lasOff"); }
$("lasBtn").onclick=toggleLaser;
$("fm").onclick=()=>{ if(need("laser")) ST.focus=Math.max(8,ST.focus/1.08); }; $("fp").onclick=()=>{ if(need("laser")) ST.focus=Math.min(300,ST.focus*1.08); };
for(const [id,dv] of [["pm1",-1],["pm01",-0.1],["pp01",0.1],["pp1",1]]) $(id).onclick=()=>slide(dv);
for(const [id,dv] of [["sm5",-5],["sm1",-1],["sp1",1],["sp5",5]]) $(id).onclick=()=>moveScreen(dv);
$("mkClr").onclick=()=>{ ST.marks=[]; say("unmark"); }; $("mkUndo").onclick=()=>{ if(ST.marks.length){ ST.marks.pop(); say("unmark"); } };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function step(dt){ ST.t+=dt; }
function renderPanel(){ const t=d();
  $("lasBtn").textContent=ST.las?t.lasOn:t.lasOff; $("lasBtn").className=ST.las?"on":""; $("focV").textContent=t.focV; $("mkV").textContent=t.mkV(ST.marks.length); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(lasing()&&spotR()>1.6) L.push([t.st.blur,true]);
  if(has("screen")&&ST.L<40) L.push([t.st.near,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-l","hL"],["t-h-f","hF"],["t-h-s","hS"],["t-h-m","hM"],["mkClr","mkClr"],["mkUndo","mkUndo"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; step(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
