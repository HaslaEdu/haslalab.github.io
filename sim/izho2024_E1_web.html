var PROGRAM = {
  title: { ko: 'IZhO 2024 실험 — 진동의 중첩', en: 'IZhO 2024 — Superposition of oscillations' },
  subtitle: { ko: '삼각대의 가로 막대에 길이가 같은 두 실(간격 a)로 나사 막대를 매달았고, 막대에는 길쭉한 너트 두 개가 중심에서 ±z 에 대칭으로 끼워져 있습니다(한 바퀴 돌리면 1.0 mm). 막대를 축 방향으로 밀었다 놓으면 앞뒤(종) 진동, 수직축 둘레로 돌렸다 놓으면 비틀림 진동, 둘을 함께 주면 혼합 진동을 합니다. 장비: 삼각대, 진자, 30 cm 자, 전자 스톱워치. 진폭은 20°–30° 로 하세요.',
              en: 'A threaded rod hangs on two equal threads (a apart) from a horizontal bar on a tripod; two elongated nuts sit symmetrically at ±z from its centre (one turn moves a nut by 1.0 mm). Push the rod along its axis and release: longitudinal oscillations; turn it about the vertical axis: torsional; both at once: mixed oscillations. Equipment: tripod, the pendulum, a 30 cm ruler, an electronic stopwatch. Keep the amplitudes at 20°–30°.' },
  notes: { ko: [
    '과제: 1 혼합 진동에서 막대 끝의 궤적 모양들, x(t), y(t), 맥놀이 주기 T_C = T₀T₁/|T₀ − T₁|, N_C = T₁/|T₀ − T₁|. 2 종진동 주기 T₀ 와 오차. 3 z = 17 cm 에서 T₁(a), T₁/T₀ = a^q·F(z) 의 q; a = 10 cm 에서 T₁(z), F(z) = √(A + Bz²) 의 A, B 와 오차. 4 a = 20 cm, z > 10 cm 에서 N_C(z) 와 그 검증.',
    '공식 해답: t₂₀ = 26.41 s → T₀ = 1.321 ± 0.003 s. q = −1 (T₁ 은 a 에 반비례; 표 2: a = 4.8 cm 에서 5.91 s … 24 cm 에서 1.20 s). a = 10 cm: z = 6 cm 2.229 s … 15 cm 2.846 s; (aT₁/T₀)² = A + Bz², A = 254 ± 4 cm², B = 0.93 ± 0.03.',
    '여기서 T₁ = T₀·√(A + Bz²)/a 를 그대로 씁니다 — 공식 표 3 과 맞고, 표 2 보다는 약 6 % 깁니다. 작은 감쇠가 있습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 the shapes of the rod end\'s path in mixed oscillations, x(t), y(t), the cycle T_C = T₀T₁/|T₀ − T₁|, N_C = T₁/|T₀ − T₁|. 2 the longitudinal period T₀ with its errors. 3 T₁(a) at z = 17 cm and q in T₁/T₀ = a^q·F(z); T₁(z) at a = 10 cm, A and B in F(z) = √(A + Bz²) with errors. 4 N_C(z) at a = 20 cm, z > 10 cm, and its check.',
    'Official solution: t₂₀ = 26.41 s → T₀ = 1.321 ± 0.003 s. q = −1 (T₁ inversely proportional to a; table 2: 5.91 s at a = 4.8 cm … 1.20 s at 24 cm). a = 10 cm: 2.229 s at z = 6 cm … 2.846 s at 15 cm; (aT₁/T₀)² = A + Bz², A = 254 ± 4 cm², B = 0.93 ± 0.03.',
    'Here T₁ = T₀·√(A + Bz²)/a is used as it stands — it matches the official table 3 and runs about 6 % longer than table 2. There is light damping. The values differ a little from visit to visit.'] }
};

var LAB = { a: 20, z: 17, X: 0, vX: 0, be: 0, vb: 0, rx: 0, trail: [] };
PROGRAM.lab = {
  intro: { ko: '책상 위: 삼각대(위에 가로 막대), 두 실에 매단 나사 막대와 너트 두 개, 막대 아래 평형선을 그은 종이, 30 cm 자, 스톱워치.',
           en: 'On the desk: the tripod with its horizontal bar, the threaded rod on two threads with its two nuts, a sheet of paper under it with the equilibrium line, a 30 cm ruler and a stopwatch.' },
  howto: { ko: ['막대를 끌기: 좌우(막대 방향)로 밀면 종진동, 앞뒤로 끌면 비틀림 — 둘 다 주면 혼합 진동. 놓으면 그대로 진동합니다',
                '가로 막대 위에서 휠: 실 간격 a 바꾸기 (0.1 cm, Shift: 0.01 cm) · 너트 위에서 휠: 두 너트를 한 바퀴(1 mm)씩 대칭으로 · 막대를 클릭: 멈추기',
                '자: 끌어서 옮기기 · 종이 클릭: 위에서 보기 · 스톱워치 <b>Space</b>'],
           en: ['Drag the rod: push it along its length for longitudinal, sideways for torsional — both for mixed oscillations. It oscillates on release',
                'Wheel over the top bar: change the thread spacing a (0.1 cm, Shift: 0.01 cm) · wheel over a nut: both nuts by one turn (1 mm) · click the rod: stop it',
                'Ruler: drag it · click the paper: view from above · stopwatch <b>Space</b>'] },
  notePlaceholder: { ko: '예) t₂₀ = 26.41, 26.32 … s / a = 10 cm: z = 6 cm t₂₀ = 44.6 s …', en: 'e.g. t₂₀ = 26.41, 26.32 … s / a = 10 cm: z = 6 cm t₂₀ = 44.6 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var T0 = 1.321 * (1 + S.sys('T0', 0.006)), A = 254 * (1 + S.sys('A', 0.03)), B = 0.93 * (1 + S.sys('B', 0.03)), TAU = 90 * (1 + S.sys('tau', 0.2));
    var L = 981 * Math.pow(T0 / (2 * Math.PI), 2), YR = 3, YT = YR + L, ROD = 36;
    var sw = new B3.Stopwatch(0.04), ruler = B3.scaleTex(30, { horiz: true, width: 3, bg: '#f2efe6' });
    var paper = (function () { var c = document.createElement('canvas'); c.width = 900; c.height = 420; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#fbfbf7'; g.fillRect(0, 0, 900, 420); g.strokeStyle = '#2a3a8a'; g.lineWidth = 2; g.beginPath(); g.moveTo(20, 210); g.lineTo(880, 210); g.stroke();
      g.beginPath(); g.moveTo(450, 190); g.lineTo(450, 230); g.stroke(); return c; })();
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '], wheelIds: ['bar', 'nut'], moveY: YR,
      home: { yaw: -0.3, pitch: 0.42, k: 9.5, tx: 4, ty: 20, tz: 0 },
      views: { top: { yaw: 0, pitch: 1.565, k: 17, tx: 0, ty: YR, tz: 2, title: { ko: '위에서 본 막대와 종이', en: 'The rod and the paper from above' }, hint: { ko: '막대 끌기: 진동 주기 · 휠(너트/가로 막대): z, a · Esc: 돌아가기', en: 'Drag the rod: excite it · wheel (nut / bar): z, a · Esc: back' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 32, ty: 1.7, tz: 12, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        var wb = b.wheel('bar'), wn = b.wheel('nut');
        if (wb) { LAB.a = Math.max(4, Math.min(26, Math.round((LAB.a + wb * 0.1) * 100) / 100)); b.say('실 간격을 옮겼습니다', 'Thread spacing moved'); }
        if (wn) LAB.z = Math.max(2, Math.min(17, Math.round((LAB.z + wn * 0.1) * 100) / 100));
        if (b.clicked('m:rod')) { LAB.vX = 0; LAB.vb = 0; LAB.X = 0; LAB.be = 0; }
        if (b.clicked('c:paper')) b.go('top');
        var dr = b.dragging('rod'), mv = b.moved('rod');
        if (dr) { LAB.X = Math.max(-22, Math.min(22, LAB.X + mv[0])); LAB.rx = Math.max(-14, Math.min(14, LAB.rx + mv[1])); LAB.be = Math.asin(LAB.rx / (ROD / 2)); LAB.vX = 0; LAB.vb = 0; }
        else if (b.dt > 0) {
          var w0 = 2 * Math.PI / T0, w1 = 2 * Math.PI / (T0 * Math.sqrt(A + B * LAB.z * LAB.z) / LAB.a), n = Math.ceil(b.dt / 0.004), h = b.dt / n;
          for (var i = 0; i < n; i++) {
            var al = Math.asin(Math.max(-0.99, Math.min(0.99, LAB.X / L)));
            LAB.vX += (-w0 * w0 * L * Math.sin(al) - LAB.vX / TAU) * h; LAB.X += LAB.vX * h;
            LAB.vb += (-w1 * w1 * Math.sin(LAB.be) - LAB.vb / TAU) * h; LAB.be += LAB.vb * h; }
          LAB.rx = Math.sin(LAB.be) * ROD / 2; }
        var mr = b.moved('ruler'); LAB.rul = (LAB.rul === undefined ? -15 : LAB.rul) + mr[0];
        var al2 = Math.asin(Math.max(-0.99, Math.min(0.99, LAB.X / L))), yR = YT - L * Math.cos(al2), cb = Math.cos(LAB.be), sb = Math.sin(LAB.be), d = [cb, 0, -sb];
        B3.desk(-36, 40, -18, 20);
        B3.tex3(paper, 0, 0, 900, 420, [-30, 0.03, -14], [60, 0, 0], [0, 0, 28], { id: 'c:paper' });
        /* the tripod: base, post, the horizontal bar the threads hang from */
        B3.box3(-8, 8, 0, 1.2, -16, -10, '#3b4048', { top: '#474c55' });
        B3.cylSeg('y', 1.2, YT + 3, 0, -13, 0.7, '#c3c8cd', { seg: 14, cap: '#dde1e4' }, 5);
        B3.box3(-1.4, 1.4, YT + 1.6, YT + 4.4, -14.4, -11.6, '#3a3f46', { top: '#474c55' });
        B3.cyl3('z', -12, 0.8, 0, YT + 3, 0.6, '#c3c8cd', { seg: 12, cap: '#dde1e4' });
        B3.cyl3('x', -16, 16, YT + 0.6, 0, 0.6, '#b8bcc2', { seg: 12, cap: '#d0d4d8', id: 'm:bar' });
        /* threads and the rod with its nuts */
        var a2 = LAB.a / 2, C = [LAB.X, yR, 0];
        B3.line3([-a2, YT, 0], [C[0] - a2 * d[0], yR + 0.4, -a2 * d[2]], '#f0f0f0', 1.3);
        B3.line3([a2, YT, 0], [C[0] + a2 * d[0], yR + 0.4, a2 * d[2]], '#f0f0f0', 1.3);
        B3.cylAB([C[0] - d[0] * ROD / 2, yR, -d[2] * ROD / 2], [C[0] + d[0] * ROD / 2, yR, d[2] * ROD / 2], 0.4, '#a9adb3', { seg: 10, id: 'm:rod' });
        [1, -1].forEach(function (sg) { var p = [C[0] + sg * LAB.z * d[0], yR, sg * LAB.z * d[2]];
          B3.cylAB([p[0] - d[0] * 1.3, yR, p[2] - d[2] * 1.3], [p[0] + d[0] * 1.3, yR, p[2] + d[2] * 1.3], 0.75, '#8d9399', { seg: 6, id: 'm:nut', cap: '#a2a8ae' });
          B3.line3([p[0], yR + 0.77, p[2]], [p[0], yR + 0.77, p[2]].map(function (v, k) { return k === 1 ? v + 0.01 : v; }), '#c0392b', 3); });
        /* the end's trace on the paper */
        var E = [C[0] + d[0] * ROD / 2, 0.08, d[2] * ROD / 2]; LAB.trail.push(E); if (LAB.trail.length > 400) LAB.trail.shift();
        if (LAB.trail.length > 2) B3.poly3(LAB.trail, 'rgba(192,57,43,.55)', 1.4);
        /* the 30 cm ruler */
        B3.box3(LAB.rul - 1, LAB.rul + 31, 0.03, 0.25, 4.5, 7.5, '#e8e4d8', { id: 'm:ruler', top: '#f2efe6' });
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [LAB.rul - 1, 0.26, 4.5], [32, 0, 0], [0, 0, 3], { id: 'm:ruler' });
        B3.stopwatch(b, 'sw', [32, 12], sw);
        LAB.state = { T0: T0, T1: T0 * Math.sqrt(A + B * LAB.z * LAB.z) / LAB.a, a: LAB.a, z: LAB.z, X: LAB.X, beta: LAB.be * 180 / Math.PI };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
