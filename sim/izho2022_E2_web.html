<style>

*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}

#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}

#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>

<body>
<script>
/* IZhO 2022 experiment 2 on the 3-D bench.  The sheet gives tables 2 and 3; here they are measured.  A massive
   cylinder (radius R = x₀/π ≈ 5.03 cm) with a light rod on its side rolls on two plates: (3/2)M·ẍ =
   −(m g l/R)·sin(x/R) − δ_r·M g·sign(ẋ), with m l/M from the small-oscillation period T = 2π√(3MR²/(2mgl)) ≈ 1.47 s
   and δ_r ≈ 8.7·10⁻³ (the official values); it stops for good once the rod's pull cannot beat the friction. */
var PROGRAM = {
  title: { ko: 'IZhO 2022 실험 2 — 구름 마찰', en: 'IZhO 2022 Experiment 2 — Rolling friction' },
  subtitle: { ko: '무거운 원기둥의 옆면에 작은 막대를 단단히 붙였습니다(막대를 늘이면 원기둥의 축을 지납니다). 원기둥은 두 수평판 위를 미끄러지지 않고 구르며, 막대는 늘 판 사이 틈에 있습니다. 막대를 똑바로 위로 세운 자리에서 밀지 않고 놓으면 구름 마찰 때문에 감쇠 진동을 합니다 — 차례로 멈추는 점의 좌표 x₀, x₁, x₂, … (x = 0 은 막대가 똑바로 아래, Δx = 0.2 cm) 를 적고, 평형점 둘레 작은 진동 다섯 번의 시간도 재세요.',
              en: 'A small rod is fixed to the side of a massive cylinder (its prolongation crosses the axis). The cylinder rolls without slipping on two horizontal plates with the rod always in the gap between them. Released without a push with the rod straight up, it performs damped oscillations because of rolling friction — note the successive stopping points x₀, x₁, x₂, … (x = 0 with the rod straight down, Δx = 0.2 cm), and time five small oscillations about equilibrium.' },
  notes: { ko: [
    '과제: 2.1 작은 진동의 주기 T = 2π√(3MR²/(2mgl)). 2.2 멈춤점 사이 관계 1 − cos(x_k/R) = 1 − cos(x_{k−1}/R) − δ_r (M/ml)|x_k − x_{k−1}|. 2.3 x₀ = πR 로 정리하면 1 − cos(πx_k/x₀) = 2 − δ_r·T²g·S_k/(6x₀²), S_k = Σ|x_j − x_{j−1}|. 2.4 T 와 오차. 2.5–2.6 Y = 1 − cos(πx_k/x₀) 대 S_k 의 직선, 기울기로 δ_r.',
    '공식 해답(문제지의 표 2, 3): x_k = 15.8, −11.6, 10.1, −9.0, 7.7, −7.0, 5.7, −5.3, 4.7, −3.9, 2.8 cm; t₅ = 7.39, 7.21, 7.26, 7.47, 7.44 s → T = 1.47 ± 0.02 s. 기울기 C = 1.23 ± 0.02 m⁻¹ → δ_r = (8.7 ± 0.4)·10⁻³.',
    '원기둥의 축(끝면의 흰 점) 위치를 판 옆의 눈금으로 읽습니다. 맨 위에 똑바로 세운 자리는 불안정한 평형이라 몇 mm 비켜 놓아야 굴러갑니다(처음 자리는 그대로 x₀ 로 적습니다). 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 2.1 the small-oscillation period T = 2π√(3MR²/(2mgl)). 2.2 between stops: 1 − cos(x_k/R) = 1 − cos(x_{k−1}/R) − δ_r (M/ml)|x_k − x_{k−1}|. 2.3 with x₀ = πR: 1 − cos(πx_k/x₀) = 2 − δ_r·T²g·S_k/(6x₀²), S_k = Σ|x_j − x_{j−1}|. 2.4 T with its error. 2.5–2.6 the straight line Y = 1 − cos(πx_k/x₀) against S_k, δ_r from its slope.',
    'Official solution (the sheet\'s tables 2, 3): x_k = 15.8, −11.6, 10.1, −9.0, 7.7, −7.0, 5.7, −5.3, 4.7, −3.9, 2.8 cm; t₅ = 7.39, 7.21, 7.26, 7.47, 7.44 s → T = 1.47 ± 0.02 s. Slope C = 1.23 ± 0.02 m⁻¹ → δ_r = (8.7 ± 0.4)·10⁻³.',
    'Read the axis (the white dot on the end face) against the scale beside the plates. Straight up is an unstable equilibrium, so set it a few mm aside for it to roll (note that start as x₀). The values differ a little from visit to visit.'] }
};

var LAB = { x: 15.7, v: 0, held: true, stopped: true, stops: [] };
PROGRAM.lab = {
  intro: { ko: '책상 위: 받침 위의 두 수평판(사이에 틈, 옆에 눈금), 막대가 달린 무거운 원기둥, 스톱워치.',
           en: 'On the desk: two horizontal plates on supports (a gap between them, a scale alongside), the massive cylinder with its rod and a stopwatch.' },
  howto: { ko: ['원기둥을 좌우로 끌기: 굴려 옮기기 — 손을 떼면 밀지 않고 놓은 것입니다 · 원기둥 클릭: 붙잡아 세우기',
                '눈금 클릭: 가까이 보기 · ×0.25 와 ❚❚ 로 멈춤점을 읽기 좋게 · 스톱워치 <b>Space</b>'],
           en: ['Drag the cylinder left/right: roll it there — letting go releases it without a push · click the cylinder: catch it',
                'Click the scale: close up · ×0.25 and ❚❚ help to read the stops · stopwatch <b>Space</b>'] },
  notePlaceholder: { ko: '예) x₀ = 15.8, x₁ = −11.6, x₂ = 10.1 … cm / t₅ = 7.39 s …', en: 'e.g. x₀ = 15.8, x₁ = −11.6, x₂ = 10.1 … cm / t₅ = 7.39 s …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R = 15.8 / Math.PI * (1 + S.sys('R', 0.01)), T = 1.47 * (1 + S.sys('T', 0.02)), DR = 8.7e-3 * (1 + S.sys('dr', 0.05)), G = 981;
    var K = 6 * Math.PI * Math.PI * R * R / (G * T * T);              /* m·l / M (cm) */
    var YP = 14, sw = new B3.Stopwatch(0.04), scale = B3.scaleTex(40, { horiz: true, width: 2.4, bg: '#f2efe6', from: -20, every: 2 });
    LAB.x = Math.PI * R - 0.4;
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 0.25], moveY: YP + R,
      home: { yaw: -0.3, pitch: 0.38, k: 11, tx: 4, ty: 14, tz: 0 },
      views: { sc: { yaw: 0, pitch: 0.35, k: 26, tx: 0, ty: YP + 2, tz: 6, title: { ko: '원기둥과 눈금', en: 'The cylinder and the scale' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 32, ty: 1.7, tz: 10, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        if (b.clicked('c:scale')) b.go('sc');
        if (b.clicked('m:cyl')) { LAB.held = true; LAB.v = 0; }
        if (b.dragging('cyl')) { LAB.x = Math.max(-25, Math.min(25, LAB.x + b.moved('cyl')[0])); LAB.held = true; LAB.v = 0; }
        else if (LAB.held && !b.clicked('m:cyl') && b.moved('cyl')[0] === 0 && LAB.wasDrag) LAB.held = false;
        LAB.wasDrag = b.dragging('cyl');
        if (!LAB.held && b.dt > 0) { var n = Math.ceil(b.dt / 0.001), h = b.dt / n;
          for (var i = 0; i < n; i++) { var Fp = -(K * G / R) * Math.sin(LAB.x / R), Ff = DR * G;
            if (LAB.v === 0) { if (Math.abs(Fp) <= Ff) continue; LAB.v = 1e-9 * Math.sign(Fp); }
            var acc = 2 / 3 * (Fp - Ff * Math.sign(LAB.v)), v1 = LAB.v + acc * h;
            if (v1 * LAB.v < 0) { LAB.v = 0; LAB.stops.push(LAB.x); } else { LAB.v = v1; LAB.x += LAB.v * h; } } }
        B3.desk(-36, 40, -18, 20);
        /* two plates on supports with the gap between them */
        [[-4.5, -1.0], [1.0, 4.5]].forEach(function (zz) { B3.box3(-30, 30, YP - 1, YP, zz[0], zz[1], '#9aa0a6', { top: '#b5bbc1' });
          B3.box3(-28, -25, 0, YP - 1, zz[0], zz[1], '#5b4630'); B3.box3(25, 28, 0, YP - 1, zz[0], zz[1], '#5b4630'); });
        B3.tex3(scale, 0, 0, scale.width, scale.height, [-21, YP + 0.01, 4.5], [42, 0, 0], [0, 0, 2.4], { id: 'c:scale' });
        B3.box3(-21, 21, YP - 1, YP, 4.5, 6.9, '#e8e4d8', { id: 'c:scale', noTop: true });
        /* the cylinder and its rod (φ = x/R from straight down) */
        var cx = LAB.x, cy = YP + R, ph = LAB.x / R;
        B3.cyl3('z', -4, 4, cx, cy, R, '#7d848b', { seg: 30, cap: '#959ca3', id: 'm:cyl' });
        B3.cyl3('z', 4.01, 4.05, cx, cy, 0.35, '#ffffff', { seg: 10 });
        B3.line3([cx, cy, 4.03], [cx + Math.sin(ph) * R * 0.95, cy - Math.cos(ph) * R * 0.95, 4.03], '#2b2f35', 2);
        B3.cylAB([cx + Math.sin(ph) * R, cy - Math.cos(ph) * R, 0], [cx + Math.sin(ph) * (R + 7), cy - Math.cos(ph) * (R + 7), 0], 0.35, '#c0392b', { seg: 8, id: 'm:cyl' });
        B3.stopwatch(b, 'sw', [32, 10], sw);
        LAB.state = { x: LAB.x, v: LAB.v, held: LAB.held, stops: LAB.stops.slice(-12).map(function (s) { return Math.round(s * 10) / 10; }), T: T, R: R };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
