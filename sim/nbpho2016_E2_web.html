<body>
<script>
/* NBPhO 2016 problem 5 of the second set, "Black box" (Mihkel Heidelberg, Jaan Kalda).  Three terminal
   wires, blue, black and white; inside, two resistors R1 < R2 < 1 kΩ and a Zener diode that in these
   voltage ranges acts as a leaky diode (up to 1 mA backwards).  The arrangement is the official
   solution's option A: black–R1–X, blue–R2–X, X–diode→white.  The diode is fitted to the official data
   (1.80 mA at 697 mV, 4.33 mA at 732 mV, 5.86 mA at 760 mV; 85 µA backwards at 1.5 V).  The source is a
   1.5 V cell (the solution measured 1581 mV); the multimeter is a 4000-count meter whose ammeter has
   RA = 100 Ω on 400 µA and 4000 µA and next to nothing on 40 mA and 400 mA, as the sheet says.
   Shorting the cell through the ammeter blows the fuse. */
var PROGRAM = {
  title: { ko: 'NBPhO 2016 실험 5(2일차) — 블랙박스', en: 'NBPhO 2016 Problem 5 (2nd set) — Black box' },
  subtitle: { ko: '세 단자 선(파랑 · 검정 · 흰색)이 달린 상자 속에 저항 둘(R₁ < R₂ < 1 kΩ)과 제너 다이오드 하나가 있습니다. 회로를 알아내고, R₁, R₂ 와 다이오드의 전류-전압 곡선을 재세요.',
              en: 'The box has three terminal wires, blue, black and white, and holds two resistors R₁ < R₂ < 1 kΩ and a single Zener diode. Find the circuit, measure R₁ and R₂, and measure the diode\'s current–voltage curve.' },
  notes: { ko: [
    '장비: 블랙박스, 직류 전원(1.5 V 전지), 멀티미터 (문제지 그대로). 전압계의 내부 저항은 무시해도 되고, 전류계는 400 µA · 4000 µA 범위에서 R<sub>A</sub> = 100 Ω, 40 mA · 400 mA 범위에서는 무시할 만합니다.',
    '이 전압 범위에서 제너 다이오드는 보통 다이오드처럼 행동합니다 — 정방향으로 잘 흐르고, 역방향으로는 조금(최대 1 mA) 샙니다.',
    '다이오드 특성은 공식 해답의 측정값(697 mV에서 1.80 mA, 732 mV에서 4.33 mA, 760 mV에서 5.86 mA, 역방향 1.5 V에서 약 85 µA)에 맞췄습니다. 방문할 때마다 저항과 전지 값이 조금 다릅니다.',
    '<b>전류계로 전원을 바로 단락시키면 퓨즈가 끊어집니다</b> (문제지: “Eero를 화나게 하지 마세요”).',
    '(i) 회로도 2점, (ii) R₁, R₂ 4점, (iii) 다이오드 I–V 곡선 4점.'], en: [
    'Equipment: the black box, a DC voltage source (a 1.5 V cell) and a multimeter (as on the sheet). Neglect the voltmeter\'s internal resistance; the ammeter has R<sub>A</sub> = 100 Ω on the 400 µA and 4000 µA ranges and next to nothing on 40 mA and 400 mA.',
    'In these voltage ranges the Zener diode acts as an ordinary diode: it conducts well forwards and leaks a little (up to 1 mA) backwards.',
    'The diode follows the official solution\'s data (1.80 mA at 697 mV, 4.33 mA at 732 mV, 5.86 mA at 760 mV, about 85 µA backwards at 1.5 V). The resistors and the cell differ a little from visit to visit.',
    '<b>Shorting the source with the ammeter blows the fuse</b> (the sheet: "do not anger Eero").',
    '(i) circuit, 2 points; (ii) R₁ and R₂, 4 points; (iii) the diode\'s I–V curve, 4 points.'] }
};

var LAB = { dmm: {}, leads: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 셋(파랑 · 검정 · 흰색)의 블랙박스, 1.5 V 전지(+ · − 단자), 4000 카운트 멀티미터. 도선으로 이어 전압과 전류를 잽니다. 단자 둘을 도선으로 바로 이을 수도 있습니다.',
           en: 'On the desk: the black box with three terminals (blue, black, white), a 1.5 V cell (+ and − sockets) and a 4000-count multimeter. Wire them up to measure voltages and currents; two terminals may also be joined straight together.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '멀티미터: 클릭해서 가까이 본 뒤 다이얼 눈금 클릭 또는 휠 (V⎓ · A⎓ · Ω). 전류는 mA 와 COM 잭',
                '저항계는 회로에 전원이 없을 때만 믿을 수 있습니다 — 다이오드도 저항계의 전압을 받습니다',
                '전류계를 전지에 바로 대면 퓨즈가 끊어집니다. 끊어진 퓨즈는 다시 살아나지 않습니다'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Multimeter: click it to look closer, then click a dial mark or roll the wheel (V⎓ · A⎓ · Ω). Current goes through the mA and COM jacks',
                'The ohmmeter can be trusted only with no source in the circuit — and the diode feels the ohmmeter\'s voltage too',
                'Putting the ammeter straight across the cell blows the fuse, and it stays blown'] },
  notePlaceholder: { ko: '예) 전지 + → 검정, 흰색 → mA, COM → 전지 −: 40 mA 범위 4.33 mA', en: 'e.g. cell + → black, white → mA, COM → cell −: 40 mA range 4.33 mA' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R1 = 196 * (1 + S.sys('R1', 0.03)), R2 = 491 * (1 + S.sys('R2', 0.03)), E = 1.585 * (1 + S.sys('E', 0.01));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: S.sys('mA', 0.006), R: S.sys('mR', 0.005) };
    var DIODE = { Is: 4.7e-11, n: 1.545, Gl: 5.6e-5, Rs: 10 };
    var leads = LAB.leads = new B3.Leads({ max: 8 }), c = LAB.c = new B3.Circuit();
    var RANGES = [['OFF'], ['V', 0.4], ['V', 4], ['V', 40], ['A', 4e-4], ['A', 4e-3], ['A', 0.04], ['A', 0.4], ['Ω', 400], ['Ω', 4e3], ['Ω', 4e4], ['Ω', 4e5], ['Ω', 4e6]];
    var RA = { 4e-4: 100, 4e-3: 100, 0.04: 0.5, 0.4: 0.05 };
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.3, pitch: 0.85, k: 15, tx: 2, ty: 0, tz: 2 },
      views: {
        box: { yaw: 0, pitch: 1.0, k: 42, tx: -14, ty: 3, tz: 2, title: { ko: '블랙박스', en: 'The black box' } },
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 9, ty: 3.4, tz: 2, title: { ko: '멀티미터', en: 'Multimeter' },
               hint: { ko: '다이얼 눈금 클릭 또는 휠 · 잭을 클릭해 도선 잇기 · Esc: 돌아가기', en: 'Click a dial mark or roll the wheel · click a jack to wire it · Esc: back' } },
        cell: { yaw: 0, pitch: 1.1, k: 45, tx: 24, ty: 1, tz: 4, title: { ko: '전지', en: 'The cell' } }
      },
      frame: function (b) {
        B3.desk(-32, 38, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-14, 2], [{ name: 'blue', col: '#2f6ea6', label: '' }, { name: 'black', col: '#151515', label: '' }, { name: 'white', col: '#ececec', label: '' }], { label: 'NBPhO 2016 · 5' });
        var m = B3.dmm(b, 'dmm', [9, 2], dm, leads, { ranges: RANGES, counts: 4000, rA: RA, fuseI: 0.4, model: 'UT61B' });
        var cell = B3.cells(b, leads, 'cell', [24, 4], { n: 1, e: E, r: 0.35 });
        c.reset();
        c.R(T.black, 'box.X', R1); c.R(T.blue, 'box.X', R2);
        c.D('box.X', T.white, DIODE);
        cell.stamp(c); m.stamp(c); leads.wire(c);
        c.solve(Math.max(1e-3, b.dt)); m.read(c);
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
