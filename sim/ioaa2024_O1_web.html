<script>
"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* The observing field of the olympiad at Vassouras (22.40° S, 43.66° W).  The sheet gives no date or place for the
   telescope stage; the evening of 23 August 2024 at 20:00 (UT−3), during the olympiad, is taken.  The target of the
   first stage, chosen by the instructors, is not in the sheet either: the official solution says only that it was
   near enough for the parallax between the 40 tables to change its coordinates.  Here it is a red lamp on a mast
   (HaslaLab's choice), and each desk gets one of the 40 tables. */
const SITE = {lat: -22.40, lon: -43.66, tz: -3, name: "Vassouras"}, DAY = [2024, 8, 23], START = 20.0;
function skyline(az) { az = A.norm360(az);
  return 2.2 + 0.9 * Math.sin(az * 0.035 + 1.2) + 0.5 * Math.sin(az * 0.11 + 0.3) + 0.25 * Math.sin(az * 0.47 + 2.0) + 0.12 * Math.sin(az * 1.9)
    + 1.6 * Math.exp(-((((az - 300 + 540) % 360 - 180) / 18) ** 2)); }
/* the 40 tables: 5 rows of 8, 3 m apart (x east, y north, metres from table 1); the lamp 4.5 m above the tubes */
const LAMP = {x: 18, y: -32, z: 4.5}, MAST_W = 0.06, BULB = 0.02;
function tablePos(n) { const r = Math.floor((n - 1) / 8), c = (n - 1) % 8; return {x: c * 3 - 10.5, y: -r * 3}; }
function lampFrom(n) { const p = tablePos(n), dx = LAMP.x - p.x, dy = LAMP.y - p.y, d = Math.hypot(dx, dy);
  return {az: A.norm360(Math.atan2(dx, dy) / DEG), alt: Math.atan2(LAMP.z, d) / DEG, dist: Math.hypot(d, LAMP.z), ground: Math.atan2(-1.2, d) / DEG}; }
const TKEY = "hl-ioaa2024-o1-table";
let TABLE = 0; try { TABLE = +localStorage.getItem(TKEY) || 0; } catch (e) {}
if (!(TABLE >= 1 && TABLE <= 40)) { TABLE = 1 + Math.floor(Math.random() * 40); try { localStorage.setItem(TKEY, TABLE); } catch (e) {} }
