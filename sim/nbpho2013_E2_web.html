<style>

     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;

header p{margin:0;color:var(--dim);font-size:12.5px}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

<body>
<script>
/* NBPhO 2013 problem 10 "Resistive heating" on the 3-D bench.  A resistor (0.47 Ω ± 5 % in the official
   set) sits in a calorimeter with 80 mL of water and 27 g of aluminium; a pack of two cells drives it
   through the ammeter.  The cells run down as in the solution: their EMF sags and their internal
   resistance climbs with the charge drawn, until after 10–15 minutes they are spent (spare packs are
   at hand).  The water warms by I²R/(c_a m_a + c_w m_w) and loses a little to the room; the thermometer
   reads the water near it, which lags unless the calorimeter is stirred. */
var PROGRAM = {
  title: { ko: 'NBPhO 2013 실험 10 — 저항의 발열', en: 'NBPhO 2013 Problem 10 — Resistive heating' },
  subtitle: { ko: '저항의 값을 재세요 (불확도는 묻지 않습니다). 열량계에는 물 V = 0.80 dL 와 알루미늄 m_a = 27 g 이 있습니다. c_w = 4.2 J/(K·g), c_a = 0.90 J/(K·g).',
              en: 'Measure the resistor (no uncertainty asked). The calorimeter holds V = 0.80 dL of water and m_a = 27 g of aluminium; c_w = 4.2 J/(K·g), c_a = 0.90 J/(K·g).' },
  notes: { ko: [
    '장비: 저항, 전원(전지), 전류계, 열량계, 온도계, 스톱워치 (문제지 그대로). 전지의 내부 저항은 변하고, 전지가 닳을 수 있습니다 — 여분이 있습니다.',
    '전지는 공식 해답처럼 10~15분 만에 닳습니다: 쓴 전하에 따라 기전력이 낮아지고 내부 저항이 커집니다. 물은 I²R 로 데워지고 실내로 조금 식습니다.',
    '온도계는 그 근처의 물을 잽니다 — 젓지 않으면 늦게 따라옵니다. 공식 해답의 값은 R = 0.47 Ω ± 5 %, 온도 상승 7~10 °C 였습니다.',
    '오른쪽 위 ×10 으로 시간을 빨리 흐르게 할 수 있습니다 (스톱워치도 같이).'], en: [
    'Equipment: the resistor, a voltage source (batteries), an ammeter, the calorimeter, a thermometer and a stopwatch (as on the sheet). The batteries\' internal resistance varies and they may run down — spares are available.',
    'The cells run down in 10–15 minutes as in the official solution: their EMF sags and their internal resistance climbs with the charge drawn. The water warms by I²R and loses a little to the room.',
    'The thermometer reads the water near it — it lags unless the water is stirred. The official set had R = 0.47 Ω ± 5 % and a rise of 7–10 °C.',
    'The ×10 button top right makes time run faster (the stopwatch too).'] }
};

var LAB = { dmm: {}, leads: null, c: null, sw: null, Tw: null, Tth: null, q: 0, pack: 1 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 뚜껑에 저항 단자 둘과 온도계, 젓개가 꽂힌 열량계, 전지 두 개짜리 전지함(+ 여분 둘), 전류계(10 A 단자), 스톱워치.',
           en: 'On the desk: the calorimeter (the resistor\'s two terminals, a thermometer and a stirrer through its lid), a holder of two cells (and two spare packs), an ammeter (10 A jack) and a stopwatch.' },
  howto: { ko: ['도선: 소켓을 클릭하면 도선이 들리고, 다른 소켓을 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '전류계: 클릭해서 가까이 본 뒤 다이얼 (A 범위). 큰 전류는 <b>10A</b> 잭과 COM 으로',
                '젓개 클릭: 물 젓기 · 온도계 클릭: 눈금 가까이 보기',
                '여분 전지함 클릭: 전지함 바꾸기 (새 전지) · 스톱워치: <b>Space</b> = START/STOP'],
           en: ['Wires: click a socket to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Ammeter: click it to look closer, then turn the dial (A ranges). Large currents go through the <b>10A</b> jack and COM',
                'Click the stirrer: stir the water · click the thermometer: look closely at it',
                'Click a spare pack: swap in fresh cells · stopwatch: <b>Space</b> = START/STOP'] },
  notePlaceholder: { ko: '예) 시작 21.3 °C; 30 s마다 I: 2.84, 2.80, … A; 끝 29.9 °C', en: 'e.g. start 21.3 °C; I every 30 s: 2.84, 2.80, … A; end 29.9 °C' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R = 0.47 * (1 + S.sys('R', 0.04)), T0 = 21 + S.sys('T0', 1), C = 27 * 0.90 + 80 * 4.2, Kl = 0.035;   /* J/K; W/K to the room */
    var dm = LAB.dmm; dm.err = { V: 0, A: S.sys('mA', 0.008), R: 0 };
    var leads = LAB.leads = new B3.Leads({ max: 6 }), c = LAB.c = new B3.Circuit(), sw = LAB.sw = new B3.Stopwatch(0.04);
    if (LAB.Tw === null) { LAB.Tw = T0; LAB.Tth = T0; }
    var Qcap = function () { return 2600 * (1 + S.sys('cap' + LAB.pack, 0.12)); };     /* C: what a pack gives at this current */
    var RANGES = [['OFF'], ['A', 0.2], ['A', 2], ['A', 10]], RA = { 0.2: 1, 2: 0.05, 10: 0.01 };
    var stir = 0;
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10],
      home: { yaw: -0.3, pitch: 0.75, k: 11, tx: 4, ty: 4, tz: 2 },
      views: {
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 14, ty: 3.4, tz: 4, title: { ko: '전류계', en: 'Ammeter' } },
        th: { yaw: 0, pitch: 0.05, k: 38, tx: -16, ty: 22, tz: 2, title: { ko: '온도계 (0.1 °C)', en: 'Thermometer (0.1 °C)' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 30, ty: 1.7, tz: 10, title: { ko: '스톱워치', en: 'Stopwatch' } }
      },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-36, 40, -20, 22);
        /* the calorimeter: an outer can, the lid with two posts, the thermometer, the stirrer */
        var cx = -16, cz = 2;
        B3.cyl3('y', 0, 11, cx, cz, 5.5, '#b9bec3', { seg: 32, cap: '#c9ced2' });
        B3.cyl3('y', 11, 11.6, cx, cz, 5.7, '#2c2f33', { seg: 32, cap: '#383c41' });
        leads.term(b, 'res.a', [cx - 2.6, 11.6, cz + 2.2], { post: true, col: '#c0392b' });
        leads.term(b, 'res.b', [cx + 2.6, 11.6, cz + 2.2], { post: true, col: '#1b1b1b' });
        B3.cyl3('y', 11.6, 30, cx, cz - 2.2, 0.32, 'rgba(235,240,245,.75)', { id: 'm:th', seg: 12 });
        var thY = 11.6 + 2 + (LAB.Tth - 10) * 0.5;                                  /* the column: 0.5 cm per °C from 10 °C */
        B3.cyl3('y', 11.6, Math.min(30, thY), cx, cz - 2.2 + 0.05, 0.12, '#c0392b', { seg: 8 });
        for (var tt = 10; tt <= 40; tt++) { var y = 13.6 + (tt - 10) * 0.5; B3.line3([cx - (tt % 5 === 0 ? 0.6 : 0.4), y, cz - 1.85], [cx - 0.3, y, cz - 1.85], '#111', tt % 5 === 0 ? 1.4 : 0.8);
          if (tt % 5 === 0) B3.text3([cx - 1.6, y + 0.15, cz - 1.84], [0.6, 0, 0], [0, -0.6, 0], String(tt), 0.45, '#111', { weight: '700' }); }
        B3.cyl3('y', 11.6, 16, cx + 1.5, cz - 1, 0.2, '#8a9096', { id: 'c:stir', seg: 8 }); B3.cyl3('y', 16, 16.4, cx + 1.5, cz - 1, 0.6, '#c94a2b', { id: 'c:stir', seg: 12 });
        if (b.clicked('c:stir')) { stir = 2.5; b.say('물을 저었습니다.', 'Stirred.'); }
        /* the cells and the spares */
        var cells = B3.cells(b, leads, 'bat', [2, 13], { n: 2 });
        for (var k = 0; k < 2; k++) { B3.box3(14 + k * 5, 18 + k * 5, 0, 1.6, 14, 19, '#1b1b1b', { id: 'c:spare' + k, top: '#262626' }); B3.text3([14.3 + k * 5, 1.62, 18.5], [1, 0, 0], [0, 0, -1], '2×1.5V', 0.55, '#d8d8d8', { weight: '700' });
          if (b.clicked('c:spare' + k)) { LAB.pack++; LAB.q = 0; b.say('새 전지로 바꿨습니다.', 'Fresh cells in.'); } }
        var m = B3.dmm(b, 'dmm', [14, 4], dm, leads, { ranges: RANGES, rA: RA, fuseI: 12, model: 'UT33C+', aJack: '10A' });
        B3.stopwatch(b, 'sw', [30, 10], sw);
        /* the pack as it runs down: EMF 3.1 V falling, internal resistance climbing */
        var f = Math.min(1.2, LAB.q / Qcap()), E = f < 1 ? 3.1 * (1 - 0.18 * f - 0.25 * Math.pow(f, 8)) : Math.max(0, 3.1 * 0.57 * (1.2 - f) / 0.2);
        var rint = 0.5 * (1 + 2.5 * Math.pow(f, 3)) * (1 + S.sys('rint' + LAB.pack, 0.15));
        c.reset(); c.V(cells.plus, cells.minus, E, rint); c.R('res.a', 'res.b', R); m.stamp(c); leads.wire(c);
        c.solve(0.05); m.read(c);
        var res = c.els[1], I = Math.abs(c.cur(res)), dt = b.dt;
        if (dt > 0) { LAB.q += I * dt * (1 + 0.0 * f);
          LAB.Tw += dt * (I * I * R - Kl * (LAB.Tw - T0)) / C;
          LAB.Tth += (LAB.Tw - LAB.Tth) * Math.min(1, dt / (stir > 0 ? 2 : 25)); stir -= b.real; }
        leads.draw(b);
        b.views.th.ty = Math.max(14, Math.min(28, thY));
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
