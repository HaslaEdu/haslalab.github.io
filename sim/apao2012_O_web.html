<script>
"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* Cox's Bazar beach, the evening of 29 November 2012 (UT+6).  The Bay of Bengal is to the west; to the east a line of
   casuarinas and palms, the town to the north-east. */
const SITE = {lat: 21.43, lon: 91.98, tz: 6, name: "Cox's Bazar"}, START = 20.5;
const PALMS = (() => { let s = 2012; const r = () => (s = (s * 16807) % 2147483647) / 2147483647, L = []; for (let i = 0; i < 46; i++) { const az = 345 + r() * 205; L.push([az % 360, 2.2 + r() * 4.2, 0.6 + r() * 0.9]); } return L; })();
function skyline(az) { az = A.norm360(az); const inSea = az > 186 && az < 334; if (inSea) return -0.15;
  const edge = Math.min(Math.abs(((az - 186 + 540) % 360) - 180), Math.abs(((az - 334 + 540) % 360) - 180)), ramp = Math.min(1, edge / 8);
  let h = (0.9 + 0.5 * Math.sin(az * 0.21) + 0.35 * Math.sin(az * 0.67 + 1) + 0.2 * Math.sin(az * 1.9)) * ramp;
  for (const [a, ht, w] of PALMS) { const d = Math.abs(((az - a + 540) % 360) - 180); if (d < w * 2.2) h = Math.max(h, ramp * (d < 0.12 ? ht : ht - 1.1 * Math.pow(d / w, 1.4))); }
  return h; }
const T = {ald: A.vec(68.980, 16.509), alnath: A.vec(81.573, 28.608), capella: A.vec(79.172, 45.998), m31: A.vec(10.685, 41.269)};
const CAS = [["β", 2.294, 59.150], ["α", 10.127, 56.537], ["γ", 14.177, 60.717], ["δ", 21.454, 60.235], ["ε", 28.599, 63.670]];
let SKY = null, solOn = false, pts = [];
const PSK = "hl-apao2012-o-points";
try { pts = JSON.parse(localStorage.getItem(PSK) || "[]"); } catch (e) { pts = []; }
const savePts = () => { try { localStorage.setItem(PSK, JSON.stringify(pts)); } catch (e) {} };
const NAMES = {ko: ["엘나스", "카펠라", "안드로메다 은하"], en: ["Alnath", "Capella", "Andromeda Galaxy"]};
let LANGF = () => "ko";
const UIX = {ko: {start: "시험 시작 (9–11번, 15분)", next: "시험관 교체 → 12번 (4분)", left: "남은 시간", over: "시간이 끝났습니다", pts: "12번 — 가리킨 순서", clear: "가리킨 것 지우기", none: "아직 가리킨 것이 없습니다. 위의 ‘가리키기’로 순서대로 클릭하세요.", reset: "처음 시각으로"},
             en: {start: "Start (questions 9–11, 15 min)", next: "Change examiner → question 12 (4 min)", left: "Time left", over: "Time is up", pts: "Question 12 — what you showed, in order", clear: "Clear pointing", none: "Nothing shown yet. Use ‘Point’ above and click in order.", reset: "Back to the start time"}};
function skySheet(host, lang) { LANGF = lang;
  const box = document.createElement("div"); host.appendChild(box);
  SKY = NightSky.create({el: box, site: SITE, start: [2012, 11, 29, START], look: {az: 80, alt: 32, fov: 95}, lang, skyline,
    ground: {sea: [186, 334], lights: [[28, 14], [52, 9], [95, 5], [12, 6]], domes: [[30, 1.6, 9], [70, 0.6, 7]]},
    mags: [[2.294, 59.150, 2.25], [14.177, 60.717, 2.15], [21.454, 60.235, 2.65]],
    onPoint(p) { if (pts.length >= 3) pts.shift(); pts.push({h: p.h, eq: p.eq}); savePts(); syncPts(); },
    drawOver: overlay});
  const ctl = document.createElement("div"); ctl.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px";
  const b1 = document.createElement("button"), b2 = document.createElement("button"), b3 = document.createElement("button"), tm = document.createElement("span");
  for (const b of [b1, b2, b3]) b.className = "cr-btn", b.style.cssText = "width:auto;margin:0;padding:6px 12px";
  tm.style.cssText = "font:600 13px ui-monospace,Consolas,monospace;color:#f3d58a;margin-left:6px";
  const ptsBox = document.createElement("div"); ptsBox.style.cssText = "margin-top:8px;font-size:12.8px;color:#c3cbd2";
  ctl.append(b1, b2, b3, tm); host.append(ctl, ptsBox);
  let tEnd = 0, phase = 0;
  b1.onclick = () => { SKY.setTime(START); phase = 1; tEnd = performance.now() + 15 * 60000; };
  b2.onclick = () => { phase = 2; tEnd = performance.now() + 4 * 60000; };
  b3.onclick = () => { pts = []; savePts(); syncPts(); };
  setInterval(() => { const u = UIX[lang()]; if (!phase) { tm.textContent = ""; return; } const s = Math.max(0, Math.round((tEnd - performance.now()) / 1000));
    tm.textContent = s ? u.left + " " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + (phase === 1 ? " (9–11)" : " (12)") : u.over; tm.style.color = s ? (s < 60 ? "#ff8a70" : "#f3d58a") : "#ff8a70"; }, 250);
  function syncPts() { const u = UIX[lang()], N = NAMES[lang()];
    SKY.setPoints(pts.map((p, i) => ({h: p.h, n: String(i + 1)})));
    ptsBox.innerHTML = "<b style='color:#f3d58a'>" + u.pts + "</b><br>" + (pts.length ? pts.map((p, i) => (i + 1) + ". " + N[i] + " → " + fmtRD(p.eq)).join("<br>") : u.none); }
  function build() { const u = UIX[lang()]; b1.textContent = u.start; b2.textContent = u.next; b3.textContent = u.clear; SKY.lang(); syncPts(); }
  build();
  return {lang: build, show: SKY.show}; }
function fmtRD(v) { const [ra, de] = A.radec(v), h = ra / 15; return Math.floor(h) + "h" + String(Math.round((h % 1) * 60)).padStart(2, "0") + "m " + (de >= 0 ? "+" : "−") + Math.abs(de).toFixed(0) + "°"; }
/* the solution drawn on the sky: what to see, never shown before the solution is opened */
function overlay(g, V) { if (!solOn) return; const s = V.state, P = (v) => V.proj(V.hor(v)), L = LANGF();
  const ju = (() => { const q = A.planetGeo("jupiter", V.J); return q.map((x) => x / Math.hypot(...q)); })();
  const tri = [s.moon.v, ju, T.ald].map(P); g.lineWidth = 1.5; g.strokeStyle = "rgba(255,210,90,0.9)"; g.setLineDash([6, 4]);
  if (tri.every(Boolean)) { g.beginPath(); g.moveTo(...tri[0]); g.lineTo(...tri[1]); g.lineTo(...tri[2]); g.closePath(); g.stroke(); } g.setLineDash([]);
  const lab = (v, t, c, dx) => { const p = P(v); if (!p) return; g.font = "bold 13px 'Segoe UI',sans-serif"; g.fillStyle = c; g.fillText(t, p[0] + (dx || 9), p[1] - 8); };
  lab(s.moon.v, L === "ko" ? "달" : "Moon", "#ffd25a", 16); lab(ju, L === "ko" ? "목성" : "Jupiter", "#ffd25a"); lab(T.ald, L === "ko" ? "알데바란" : "Aldebaran", "#ffd25a");
  /* Pegasus and the neighbours in the list */
  const ring = (c, col, w) => { for (const r of SKY_DATA.bounds[c] || []) { g.beginPath(); let first = true;
      for (let i = 0; i < r.length; i++) { const a = r[i], b = r[(i + 1) % r.length], dr = ((b[0] - a[0] + 540) % 360) - 180; for (let j = 0; j < 6; j++) { const p = P(A.vec(a[0] + dr * j / 6, a[1] + (b[1] - a[1]) * j / 6)); if (!p) { first = true; continue; } first ? g.moveTo(...p) : g.lineTo(...p); first = false; } }
      g.strokeStyle = col; g.lineWidth = w; g.stroke(); } };
  ring("Peg", "rgba(120,200,255,0.9)", 1.8); for (const c of ["And", "Aqr", "Psc"]) ring(c, "rgba(120,255,160,0.55)", 1.1);
  const cen = {Peg: [340, 20], And: [12, 38], Aqr: [334, -10], Psc: [10, 12], Aql: [297, 5], Cas: [15, 62], Per: [50, 45]};
  for (const c in cen) lab(A.vec(...cen[c]), c + (c === "Peg" ? "" : ["And", "Aqr", "Psc"].includes(c) ? " ✓" : " ✗"), c === "Peg" ? "#78c8ff" : ["And", "Aqr", "Psc"].includes(c) ? "#78ff9e" : "#ff8a70", 0);
  for (const [n, ra, de] of CAS) lab(A.vec(ra, de), n, "#c8b4ff", 7);
  const circ = (v, t) => { const p = P(v); if (!p) return; g.strokeStyle = "#ff8a70"; g.lineWidth = 1.8; g.beginPath(); g.arc(p[0], p[1], 11, 0, 7); g.stroke(); g.font = "bold 13px 'Segoe UI',sans-serif"; g.fillStyle = "#ff8a70"; g.fillText(t, p[0] + 14, p[1] + 4); };
  circ(T.alnath, "1 " + NAMES[L][0]); circ(T.capella, "2 " + NAMES[L][1]); circ(T.m31, "3 " + NAMES[L][2] + " (M31)"); }

/* the key, worked out for the time of the round */
const J0 = A.jdUT(2012, 11, 29, START - SITE.tz), J1 = J0 + 15 / 1440;
const juAt = (j) => { const q = A.planetGeo("jupiter", j); return q.map((x) => x / Math.hypot(...q)); };
const AREA0 = A.triArea(A.moonTopo(J0, SITE).v, juAt(J0), T.ald), AREA1 = A.triArea(A.moonTopo(J1, SITE).v, juAt(J1), T.ald);
const S_MJ = A.sep(A.moonTopo(J0, SITE).v, juAt(J0)), S_JA = A.sep(juAt(J0), T.ald), S_MA = A.sep(A.moonTopo(J0, SITE).v, T.ald);
function grade12(L) { if (!pts.length) return L === "ko" ? "가리킨 것이 없습니다." : "Nothing was pointed at.";
  return pts.map((p, i) => { const d = A.sep(p.eq, [T.alnath, T.capella, T.m31][i]); return (i + 1) + ". " + NAMES[L][i] + ": " + d.toFixed(1) + "° " + (L === "ko" ? "떨어짐" : "off") + (d < 3 ? " ✓" : d < 6 ? " △" : " ✗"); }).join("<br>"); }

  sub: {ko: "제8회 아시아·태평양 천문 올림피아드 · 방글라데시 콕스바자르 · 2012년 11월 29일 밤, 바닷가 · 맨눈과 손으로만 · 9–11번 15분, 12번 4분",
        en: "VIII Asian-Pacific Astronomy Olympiad · Cox's Bazar, Bangladesh · the night of 29 November 2012, on the beach · eyes and hands only · questions 9–11 in 15 minutes, 12 in 4 minutes"},
  docTitle: {ko: "APAO 2012 관측 라운드 — 콕스바자르의 밤하늘 · HaslaLab", en: "APAO 2012 observational round — Cox's Bazar · HaslaLab"},
  solTitle: {ko: "HaslaLab 해답 (공식 해답은 공개되지 않음)", en: "HaslaLab's solution (no official solution was published)"},
  about: {ko: "2012년 11월 29일 20:30(UT+6) 콕스바자르 바닷가(북위 21.4°, 동경 92.0°)의 하늘을 계산해 보여 줍니다. 별은 히파르코스 6.5등급까지, 행성과 달은 궤도 요소로, 하늘 밝기는 밤하늘·달빛(보름 하루 뒤)·읍내 불빛으로 정하고 그 밝기에서 맨눈에 보이는 가장 어두운 별을 계산합니다. 시야를 넓혀도 확대되지 않습니다. 문제지에 주어진 카시오페이아 별의 등급을 그대로 썼습니다. 공식 해답이 공개되지 않아 해답은 HaslaLab이 계산했습니다.",
          en: "The sky over the beach at Cox's Bazar (21.4° N, 92.0° E) at 20:30 (UT+6) on 29 November 2012, computed: Hipparcos stars to V 6.5, planets and the Moon from their orbits, the brightness of the sky from the night sky, the Moon one day after full, and the town, and from it the faintest star the eye catches. Widening the view does not magnify. The magnitudes of the Cassiopeia stars given on the sheet are used. No official solution was published; the solution is HaslaLab's."},
  maps: {sky: {name: {ko: "하늘", en: "Sky"}, custom: skySheet}},

    id: "9–12", name: {ko: "맨눈 관측", en: "Naked-eye observation"},
    lead: {ko: "실제 하늘을 보고 답합니다. 쌍안경이나 성도는 없습니다. 각도는 팔을 쭉 뻗은 손으로 잽니다(‘손 재기’).", en: "Answer from the real sky, without binoculars or charts. Measure angles with your hand at arm's length (‘Hand’)."},
    maps: ["sky"],

      {id: "10", ko: "<b>페가수스.</b> 페가수스자리를 보세요. 오른쪽 목록(안드로메다, 물병, 독수리, 카시오페이아, 페르세우스, 물고기)에서 페가수스자리와 경계를 맞대는 별자리에 표시하세요.",
                 en: "<b>Pegasus.</b> Look at the constellation Pegasus. In the list (Andromeda, Aquarius, Aquila, Cassiopeia, Perseus, Pisces) tick the constellations which share a boundary with Pegasus."},
      {id: "11", ko: "<b>카시오페이아.</b> 카시오페이아자리의 별 β, α, γ, δ, ε Cas는 왼쪽에서 오른쪽으로 놓여 있습니다. β Cas는 2.25등급, γ Cas는 2.15등급, δ Cas는 2.65등급입니다. α Cas의 등급을 어림하세요.",
                 en: "<b>Cassiopeia.</b> In Cassiopeia the stars β, α, γ, δ and ε Cas are named from left to right. β Cas has magnitude 2.25, γ Cas 2.15 and δ Cas 2.65. Estimate the magnitude of α Cas."},
      {h: {ko: "시험관 교체", en: "Change examiner"}},

             ["c10", {ko: "10. 페가수스와 맞닿은 별자리", en: "10. Share a boundary with Pegasus"}, {checks: [{ko: "안드로메다 (And)", en: "Andromeda"}, {ko: "물병 (Aqr)", en: "Aquarius"}, {ko: "독수리 (Aql)", en: "Aquila"}, {ko: "카시오페이아 (Cas)", en: "Cassiopeia"}, {ko: "페르세우스 (Per)", en: "Perseus"}, {ko: "물고기 (Psc)", en: "Pisces"}]}],

      ["10", {ko: "안드로메다, 물병, 물고기 (✓). 독수리, 카시오페이아, 페르세우스는 페가수스와 닿지 않습니다. 페가수스의 이웃은 이 밖에 백조, 도마뱀, 여우, 돌고래, 조랑말자리입니다.",
