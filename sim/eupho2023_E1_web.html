<title>EuPhO 2023 실험 1 — 자기 진자 · Magnetic Pendulum · HaslaLab</title>
<meta name="description" content="EuPhO 2023 실험 1을 브라우저에서 실행합니다. 합판 진자의 아래 끝에 붙인 자석과 레일 위 외부 자석 사이의 힘으로 진동수가 바뀝니다. 스톱워치로 주기를, 레이저 점으로 기울기를 재어 자기 모멘트와 미지 자석의 거듭제곱 법칙을 찾습니다.">
<meta property="og:site_name" content="HaslaLab">

<meta property="og:description" content="EuPhO 2023 실험 1: 자석으로 진동수를 바꾸는 물리 진자.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}

  .status .w{color:#f0a79f}

         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

button.on{background:#3a3220;border-color:#f2c14e;color:#ffd77a}

/* every external dipole: [y position along the rail axis (m, + towards you), moment along +y (A m²)] */
function sources(){
  const out=[]; if(!has("rails")||!ST.ext) return out;
  for(const k of ["L","R"]){ const S=ST.side[k], sg=k==="L"?-1:1, dd=(ST.snapped===k?0.016:S.d/100);
    if(ST.ext==="E") out.push([sg*dd,S.s*TRUE.j2]);
    else{ const f=S.f==="F1"?1:-1;                   /* F1: north out at both ends; F2: south out */

/* the equilibrium nearest the present angle */

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ const id=pick3(p[0],p[1]); return id||null; }
let drag=null;
function clearK(k){
  const drop=x=>{ ST.on.delete(x); };
  drop(k);
  if(k==="tower"){ for(const x of ["body","magD"]) drop(x); if(ST.taped){ drop("tape"); ST.taped=false; } ST.laser=false; ST.drift=0; }
  if(k==="body"){ drop("magD"); }
  if(k==="rails"){ drop("magE"); drop("magF"); ST.ext=null; ST.snapped=null; }
  if(k==="magE"||k==="magF"){ ST.ext=null; ST.snapped=null; }
  if(k==="tape") ST.taped=false;
  if(k==="watch"){ ST.sw.run=false; ST.sw.t=0; }
  if(k==="magD"){ ST.snapped=null; }
  if(!hung()){ ST.th=0; ST.om=0; }
  rebuild(); }
function afterMagnets(){ const ev=settleRails(); if(ev) say(ev); }
function place(k){
  if(k==="body"||k==="tape"){ if(!has("tower")){ say("needFor",itemName("tower")); return false; } }
  if(k==="magD"&&!has("body")){ say("needFor",itemName("body")); return false; }
  if((k==="magE"||k==="magF")&&!has("rails")){ say("needFor",itemName("rails")); return false; }
  if(k==="tape"){ ST.on.add("tape"); ST.taped=true; ST.drift=0; rebuild(); say("taped"); return true; }
  if(k==="magE"||k==="magF"){ const other=k==="magE"?"magF":"magE"; if(has(other)) ST.on.delete(other);
    ST.on.add(k); ST.ext=k==="magE"?"E":"F"; ST.snapped=null;
    ST.side.L={d:12,s:1,f:"F1"}; ST.side.R={d:12,s:1,f:"F2"}; rebuild(); say("inRails",itemName(k)); afterMagnets(); return true; }
  ST.on.add(k);
  if(k==="body"){ ST.th=0; ST.om=0; rebuild(); ST.th=restAngle(0); say("hung"); return true; }
  if(k==="magD"){ ST.dm.u=SLOT().u; ST.dm.v=SLOT().v; rebuild(); ST.th=restAngle(ST.th); say("magOn"); afterMagnets(); return true; }
  rebuild(); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item; if(right){ say("back",itemName(k)); hand=null; return; }
    if(place(k)) hand=null; return; }
  let k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(k==="laser"){ if(right) k="tower"; else { toggleLaser(); return; } }
  if(right){ clearK(k); say("back",itemName(k)); return; }
  if(k==="watch"){ swToggle(); return; }
  if(k==="body"){ if(Math.abs(ST.om)>0.05){ ST.om=0; ST.held=false; say("held"); } else setTab("front"); return; }
  if(k==="rails"||k==="magE"||k==="magF"){ setTab("rails"); return; }
  if(k==="screen"){ setTab("screen"); return; }
  say("fixed",itemName(k)); }

cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(80,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ hand=null; drawTray(); } if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); swToggle(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
function inBodyPoly(Q,p){ const pts=[]; for(const [v,w] of BODYW) pts.push(Q(w,v)); for(let i=BODYW.length-1;i>=0;i--){ const [v,w]=BODYW[i]; pts.push(Q(-w,v)); } return pointIn(pts,p[0],p[1]); }
let cdrag=null;
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const p=clpos(e), v=VW[tab], f=e.deltaY<0?1.15:1/1.15, nz=Math.max(0.6,Math.min(14,v.z*f)), g=nz/v.z;
  v.px=p[0]-CLW/2-(p[0]-CLW/2-v.px)*g; v.py=p[1]-CLH/2-(p[1]-CLH/2-v.py)*g; v.z=nz; drawClose(); },{passive:false});
closeCv.addEventListener("dblclick",()=>{ const v=VW[tab]; v.z=1; v.px=0; v.py=0; });
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const p=cmouse;
  if(cdrag.k==="pan"){ const v=VW[tab]; v.px=cdrag.v[0]+p[0]-cdrag.p[0]; v.py=cdrag.v[1]+p[1]-cdrag.p[1]; return; }
  if(cdrag.k==="body"){ const v=V("front"), x=v.ix(p[0]), z=v.iy(p[1]); const th=Math.atan2(x-PX,ZP-z)-cdrag.a; ST.th=Math.max(-1.1,Math.min(1.1,th)); ST.om=0; return; }
  if(cdrag.k==="ext"){ const v=V("rails"), y=v.ix(p[0]), kk=cdrag.side, sg=kk==="L"?-1:1; let dd=sg*(y-PY)-cdrag.off;
    const lim=ST.ext==="E"?1.6+0.4:1.6+0.6; dd=Math.max(lim+0.05,Math.min(33.5,dd)); ST.side[kk].d=Math.round(dd*20)/20; if(ST.snapped===kk){ ST.snapped=null; say("unsnap"); }
    if(cdrag.both){ const o=kk==="L"?"R":"L"; if(ST.snapped!==o) ST.side[o].d=ST.side[kk].d; } rebuild(); return; }
  if(cdrag.k==="joint"){ const v=V("rails"), x=v.iy(p[1]); ST.railX=Math.max(-2,Math.min(2,cdrag.r+(x-cdrag.x))); rebuild(); return; }
  if(cdrag.k==="ruler"){ const v=V("face"); RU.x=cdrag.r[0]+v.ix(p[0])-cdrag.x[0]; RU.y=cdrag.r[1]+v.iy(p[1])-cdrag.x[1]; return; }
  if(cdrag.k==="balance"){ const v=V("face"); ST.bal.v=Math.max(2,Math.min(22,cdrag.b-(v.iy(p[1])-cdrag.y))); return; } });
closeCv.addEventListener("pointerup",()=>{ if(!cdrag) return;
  if(cdrag.k==="body"){ ST.held=false; ST.om=0; say("released"); }
  if(cdrag.k==="ext"){ afterMagnets(); }
  if(cdrag.k==="joint"){ const xe=alignTarget(); if(Math.abs(ST.railX+ST.drift-xe)<0.06){ ST.railX=xe-ST.drift; rebuild(); say("aligned"); } }
  cdrag=null; });
/* where the rails' centre line should be: under the pendulum magnets at rest */
function alignTarget(){ if(!magOn()) return 0; const th=restAngle(0); return ST.dm.u*Math.cos(th)+ST.dm.v*Math.sin(th); }
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p), right=e.button===2; closeCv.setPointerCapture(e.pointerId);
  if(tab==="front"){
    if(!right&&has("body")&&PM.Q&&inBodyPoly(PM.Q,p)){ if(Math.abs(ST.om)>0.05&&!ST.held){ ST.om=0; say("held"); }
      const v=V("front"), x=v.ix(p[0]), z=v.iy(p[1]); ST.held=true; cdrag={k:"body",a:Math.atan2(x-PX,ZP-z)-ST.th}; return; }
    cdrag={k:"pan",p,v:[VW.front.px,VW.front.py]}; return; }
  if(tab==="rails"){
    if(h&&h.k.startsWith("ext")){ const kk=h.k.slice(3);
      if(right){ if(ST.ext==="E"){ ST.side[kk].s*=-1; rebuild(); say("flipped"); afterMagnets(); } else say("stuckF"); return; }
      const v=V("rails"), sg=kk==="L"?-1:1, dd=ST.snapped===kk?1.6+(ST.ext==="E"?0.4:0.6):ST.side[kk].d; cdrag={k:"ext",side:kk,off:sg*(v.ix(p[0])-PY)-dd,both:BOTH}; return; }
    if(h&&h.k==="joint"&&!right){ cdrag={k:"joint",x:V("rails").iy(p[1]),r:ST.railX}; return; }
    cdrag={k:"pan",p,v:[VW.rails.px,VW.rails.py]}; return; }
  if(tab==="face"){
    if(h&&!right){ if(h.k==="bal"){ ST.bal.on=!ST.bal.on; if(ST.bal.on) ST.bal.v=Math.round((comV()+U(-2.5,2.5))*10)/10; return; }
      if(h.k==="mark"){ ST.marks.push(Math.round(ST.bal.v*100)/100); say("marked"); return; } if(h.k==="clr"){ ST.marks=[]; say("cleared"); return; } }
    const v=V("face"), u=v.ix(p[0]), vv=v.iy(p[1]);
    if(ST.bal.on){ if(!right) cdrag={k:"balance",y:vv,b:ST.bal.v}; return; }
    if(has("ruler")){ /* on the ruler? */ const lu=RU.rot?(vv-RU.y):(u-RU.x), lv=RU.rot?-(u-RU.x):(vv-RU.y);
      if(lu>-0.5&&lu<30.5&&lv>-3.0&&lv<0){ if(right){ RU.rot=RU.rot?0:1; return; } cdrag={k:"ruler",x:[u,vv],r:[RU.x,RU.y]}; return; } }
    if(!right){ const hw=bodyHalf(vv); if(hw>0&&Math.abs(u)<hw-0.6&&vv>1.0){ if(!has("magD")){ say("needD"); return; }
        const sl=SLOT(); if(Math.hypot(u-sl.u,vv-sl.v)<0.7){ ST.dm.u=sl.u; ST.dm.v=sl.v; } else { ST.dm.u=Math.round(u*20)/20; ST.dm.v=Math.round(vv*20)/20; }
        rebuild(); ST.th=restAngle(ST.th); ST.om=0; say("magAt"); afterMagnets(); return; } }
    cdrag={k:"pan",p,v:[VW.face.px,VW.face.py]}; return; }
  if(tab==="screen"){ cdrag={k:"pan",p,v:[VW.screen.px,VW.screen.py]}; return; } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0, BOTH=true;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function toggleLaser(){ if(!need("tower")) return; ST.laser=!ST.laser; say(ST.laser?"laserOn":"laserOff"); }
$("swBtn").onclick=swToggle; $("swRst").onclick=swReset;
$("holdBtn").onclick=()=>{ if(!need("body")) return; ST.th=restAngle(ST.th); ST.om=0; say("rest"); };
$("nudgeBtn").onclick=()=>{ if(!need("body")) return; ST.om+=(Math.random()<0.5?-1:1)*U(0.10,0.16); say("nudged"); };
$("flipD").onclick=()=>{ if(!need("magD")) return; ST.dm.sP*=-1; rebuild(); say("flipped"); afterMagnets(); };
$("slotBtn").onclick=()=>{ if(!need("magD")) return; ST.dm.u=SLOT().u; ST.dm.v=SLOT().v; rebuild(); ST.th=restAngle(ST.th); ST.om=0; say("magOn"); afterMagnets(); };
$("flipL").onclick=()=>{ if(!ST.ext){ say("needFor",itemName("magE")); return; } if(ST.ext==="F"){ const a=ST.side.L.f; ST.side.L.f=ST.side.R.f; ST.side.R.f=a; rebuild(); say("swapped"); afterMagnets(); return; } ST.side.L.s*=-1; rebuild(); say("flipped"); afterMagnets(); };
$("flipR").onclick=()=>{ if(!ST.ext){ say("needFor",itemName("magE")); return; } if(ST.ext==="F"){ $("flipL").onclick(); return; } ST.side.R.s*=-1; rebuild(); say("flipped"); afterMagnets(); };
function moveD(kk,dv){ if(!ST.ext){ say("needFor",itemName("magE")); return; }
  const lim=ST.ext==="E"?2.05:2.25, sides=BOTH?["L","R"]:[kk];
  for(const s of sides){ if(ST.snapped===s){ ST.snapped=null; ST.side[s].d=lim; say("unsnap"); } let nd=Math.round((ST.side[s].d+dv)*100)/100; if(nd<lim||nd>33.5){ say("noRoom"); nd=Math.max(lim,Math.min(33.5,nd)); } ST.side[s].d=nd; }
  rebuild(); afterMagnets(); }
for(const [id,kk,dv] of [["lm1","L",-1],["lm01","L",-0.1],["lp01","L",0.1],["lp1","L",1],["rm1","R",-1],["rm01","R",-0.1],["rp01","R",0.1],["rp1","R",1]]) $(id).onclick=()=>moveD(kk,dv);
$("bothBtn").onclick=()=>{ BOTH=!BOTH; renderPanel(); };
$("laserBtn").onclick=toggleLaser;
for(const [id,dv] of [["dm5",-5],["dm1",-1],["dp1",1],["dp5",5]]) $(id).onclick=()=>{ if(!need("screen")) return; ST.D=Math.max(25,Math.min(90,ST.D+dv)); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  $("swV").textContent=has("watch")?swStr():"—";
  $("laserBtn").textContent=ST.laser?t.laserOff:t.laserOn; $("laserBtn").className=ST.laser?"on":"";
  const fmt=k=>ST.snapped===k?"—":ST.side[k].d.toFixed(2)+" cm";
  $("extV").textContent=t.ext(ST.ext,fmt("L"),fmt("R"));
  $("flipL").textContent=ST.ext==="F"?t.swapF:t.flipL; $("flipR").textContent=ST.ext==="F"?t.swapF:t.flipR; $("flipR").hidden=ST.ext==="F";
  $("bothBtn").textContent=BOTH?t.bothOn:t.both; $("bothBtn").className=BOTH?"on":"";
  $("dV").textContent=has("screen")?t.dV(ST.D):""; }
let splitN=1;
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.snapped) L.push([t.st.snapped,true]);
  if(has("rails")&&magOn()&&Math.abs(ST.railX+ST.drift-alignTarget())>0.06) L.push([t.st.notAligned,true]);
  if(ST.ext&&!ST.snapped&&Math.abs(ST.side.L.d-ST.side.R.d)>0.05) L.push([t.st.asym,true]);
  if(ST.ext==="E"&&ST.side.L.s!==ST.side.R.s) L.push([t.st.parallel,true]);
  if(has("tower")&&!ST.taped) L.push([t.st.untaped,false]);
  if(hung()&&splitN>1) L.push([t.st.split,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-w","hW"],["swBtn","swGo"],["swRst","swRst"],["t-h-p","hP"],["holdBtn","hold"],["nudgeBtn","nudge"],["flipD","flipD"],["slotBtn","slot"],["t-h-x","hX"],["t-l","lHint"],["t-r","rHint"],["t-h-l","hL"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; ST.simT+=dt; stepPend(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(frameN%30===0&&hung()) splitN=nMinima();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
