<style>
  :root{

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}

  holdLead: ["a lead in your hand: click a terminal for its other end (R-click / Esc: put it away)", "리드를 들고 있음: 다른 끝을 꽂을 단자 클릭 (우클릭 / Esc: 내려놓기)"],
  holdTape: ["the tape in your hand: click the desk to lay it down, or the screen's paper to hold it there", "줄자를 들고 있음: 책상을 클릭해 놓거나 스크린 종이를 클릭해 대기"],

const tr = k => { const e = I18N[k]; return e ? (LANG === "ko" ? e[1] : e[0]) : k; };
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

const RNG = mulberry((Math.random() * 1e9) | 0);
const gauss = () => { let u = 0, v = 0; while (!u) u = RNG(); while (!v) v = RNG(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

/* ------------------------- the filaments -------------------------- */
const SIG = 5.67e-8, RHO25 = 5.65e-8, DW = 19250, T0 = 298.15;

FIL.A = Math.PI * FIL.d * FIL.l; FIL.R25 = RHO25 * FIL.l / (Math.PI * FIL.d * FIL.d / 4); FIL.Cth = DW * Math.PI * FIL.d * FIL.d / 4 * FIL.l * FIL.c;

function rRatio(T){ if (T <= 400) return 1 + (R400 - 1) * (T - T0) / (400 - T0); return (216 - Math.sqrt(Math.max(0, 216 * 216 - 4 * 2.46 * (T - 104)))) / (2 * 2.46); }

const TERMS = ["PSP", "PSN", "BT0", "BT1", "BT2", "RA", "RB", "RC", "CP", "CN", "L0a", "L0b", "L1a", "L1b", "L2a", "L2b", "X10A", "XCOM", "XV"];
