<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}

  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}

   1.  THE BOARD  (the same hardware model as the Python edition)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2021ab)>>>0);
const U=(a,b)=>a+(b-a)*rnd();
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const R_HEAT=3.90, RTH_INS=78.0, RTH_OPEN=55.0, C_TH=1.50;
const NTC_B=3500, NTC_R0=0.03435, R3=2260, U_SUP=3.3;
const LED_M=0.06497294, LED_IS=1.7679150e-15, LED_RS=4.70832, LED_TREF=22.0, RTH_LED=400;
const LED_S=[[0.003,-1.563],[0.010,-1.722],[0.020,-1.790],[0.040,-2.010]];
const C1_NOM=0.1000e-6, C2_A=19.33e-6, C2_TC=-17.8, C2_W0=2.19, C2_WT=0.025, C2_P=2.66, C2_FLOOR=0.060e-6;
const C2_BR=[[0.060,0.030],[0.050,0.250],[0.040,1.50],[0.030,12.0]], C2_FBR=C2_BR.reduce((a,b)=>a+b[0],0);
const R_LEAK=30.0e9, R_WET=20.0e9, I_VM=20e-12, R_W1=100e6;
const SOURCES={P9A:9,P9B:9,N9A:-9,N9B:-9,GNDA:0,GNDB:0}, IN_S=["INA","INB"];
const LED_MAX=50, HEAT_MAX=500, PULSE_MIN=0.1, PULSE_MAX=25.5;
function ledDUdT(i){ const xs=LED_S.map(a=>Math.log(a[0])), ys=LED_S.map(a=>a[1]), x=Math.log(Math.max(i,1e-9)); let y;
  if(x<=xs[0]) y=ys[0]+(ys[1]-ys[0])/(xs[1]-xs[0])*(x-xs[0]);
  else if(x>=xs[3]) y=ys[3]+(ys[3]-ys[2])/(xs[3]-xs[2])*(x-xs[3]);
  else for(let j=0;j<3;j++) if(xs[j]<=x&&x<=xs[j+1]){ y=ys[j]+(x-xs[j])/(xs[j+1]-xs[j])*(ys[j+1]-ys[j]); break; }
  return Math.max(-2.2,Math.min(-1.0,y))*1e-3; }
const qz=(x,lsb,sig)=>Math.round((x+sig*gauss())/lsb)*lsb;
const B={
  roomT:Math.round(U(21,26)*10)/10, id:String(Math.floor(U(100000,999999))),
  ntcR0:NTC_R0*(1+U(-0.02,0.02)), c1:C1_NOM*(1+U(-0.006,0.006)), c2s:1+U(-0.02,0.02), ledDU:U(-0.0015,0.0015),
  powered:false, data:false, insulation:true, sw1:"C1", wires:{W1:[null,null],W2:[null,null]}, short:false, resetAt:-1e9,
  iH:0, iL:0, tL:0, t:0, clock:0, heatCode:4095, Tpcb:0, uC:0, vb:[0,0,0,0], duC:0, duT:0, duL:0, uTp:null, uLp:null, timestep:0.140
};
B.Tpcb=B.roomT;
function wirePaths(){ const out=[]; B.short=false;
  for(const [nm,[a,b]] of Object.entries(B.wires)){ const R=nm==="W1"?R_W1:0;
    if(a in SOURCES&&b in SOURCES&&SOURCES[a]!==SOURCES[b]&&R===0) B.short=true;
    for(const [x,y] of [[a,b],[b,a]]) if(IN_S.includes(x)&&y in SOURCES) out.push([R,SOURCES[y]]); }
  return out; }
function c2Total(u,Tc){ const w=C2_W0+C2_WT*(Tc-29), hi=C2_A/(Tc-C2_TC); return B.c2s*(hi/(1+Math.pow(Math.abs(u)/w,C2_P))+C2_FLOOR); }
function capValue(u,Tc){ if(B.sw1==="C1") return B.c1; if(B.sw1==="C2") return (1-C2_FBR)*c2Total(u,Tc); return 1e-12; }
function ledV(imA,Tj){ if(imA<=1e-6) return 0; const i=imA*1e-3; return LED_M*Math.log1p(i/LED_IS)+LED_RS*i+B.ledDU+ledDUdT(i)*(Tj-LED_TREF); }
function ledState(){
  if(B.iL<=1e-6||!B.powered) return [0,B.Tpcb,0];
  if(B.tL>0){ const u=ledV(B.iL,B.Tpcb), duty=Math.min(1,B.tL*1e-3/Math.max(B.timestep,1e-3)); return [u,B.Tpcb,u*B.iL*1e-3*duty]; }
  let Tj=B.Tpcb, u=0; for(let k=0;k<4;k++){ u=ledV(B.iL,Tj); Tj=B.Tpcb+RTH_LED*u*B.iL*1e-3; } u=ledV(B.iL,Tj); return [u,Tj,u*B.iL*1e-3]; }
const ntcV=()=>{ const R=B.ntcR0*Math.exp(NTC_B/(B.Tpcb+273.15)); return U_SUP*R/(R+R3); };
function boardStep(dt){
  if(!B.powered){ B.iH=0; B.iL=0; B.tL=0; B.heatCode=4095; B.clock=0; }
  B.t+=dt; if(B.powered) B.clock+=dt;
  const ph=(B.iH*1e-3)**2*R_HEAT, [uLn,,pl]=ledState(), rth=B.insulation?RTH_INS:RTH_OPEN;
  B.Tpcb+=(ph+pl-(B.Tpcb-B.roomT)/rth)/C_TH*dt;
  const C=capValue(B.uC,B.Tpcb); let clamp=null, iext=0;
  for(const [R,V] of wirePaths()){ if(R<=0) clamp=V; else iext+=(V-B.uC)/R; }
  const u=B.uC;
  iext-=u/R_LEAK*(1+0.5*(u/9)**2);
  if(Math.abs(u)>1e-3) iext-=Math.sign(u)*I_VM;
  if(B.insulation) iext-=u/R_WET;
  if(B.sw1==="C2"){ C2_BR.forEach(([f,tau],k)=>{ const Cb=f*c2Total(B.vb[k],B.Tpcb), ib=(B.uC-B.vb[k])*Cb/tau; iext-=ib; B.vb[k]+=ib/Cb*dt; }); }
  else for(let k=0;k<4;k++) B.vb[k]+=(B.uC-B.vb[k])*dt/0.05;
  if(clamp!==null){ B.uC=clamp; B.duC=0; }
  else { B.duC=iext/C; B.uC=Math.max(-12,Math.min(12,B.uC+B.duC*dt)); }
  const uTn=ntcV();
  B.duT=B.uTp!==null?(uTn-B.uTp)/dt:0; B.duL=B.uLp!==null?(uLn-B.uLp)/dt:0; B.uTp=uTn; B.uLp=uLn;
}
function sample(){
  if(!B.powered||!B.data) return null;
  const uL=ledState()[0];
  return {t:B.t, uC:qz(B.uC,0.25e-3,0.20e-3), uT:qz(ntcV(),0.10e-3,0.10e-3), uL:qz(uL,0.10e-3,0.15e-3),
          duC:B.duC+0.6e-3*gauss(), duT:B.duT+3e-4*gauss(), duL:B.duL+5e-3*gauss(), iL:B.iL, iH:B.iH};
}

    const same=hand&&hand.k===k&&!hand.move; if(hand) returnHand();
    if(!same&&trayAvail(k)){ hand={k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ══════════════════════════════════════════════════════════════
   4.  THE LINK TO THE APP  (IPhO 2021 Experiments)
   The app is its own page, ipho2021_app.html, as it was its own program
   on the examination tablet.  Before the round the student chooses where
   it runs: on the virtual Android tablet below the bench (an iframe), or
   on their own tablet, phone or computer, paired by a code - a window on
   the same computer over BroadcastChannel, another device over WebRTC
   (PeerJS).  The board streams raw samples at the app's time step; the
   app sends the drive currents and the sweep.
   ══════════════════════════════════════════════════════════════ */
const LINK={mode:null, code:"", peer:null, peerState:"", conns:new Set(), bc:null, bcSeen:false, remote:0,
  run:null, next:0, out:[], usb:false, resetting:false, cmdNr:0, appOpen:false};
const frame=$("dApp");
const deviceHere=()=>ST.on.tablet&&(LINK.mode==="virtual"||(LINK.mode==="remote"&&LINK.remote>0));
const linkOn=()=>B.powered&&B.data&&deviceHere();
function toApp(m){
  if(LINK.mode==="virtual"){ if(frame.contentWindow&&LINK.appOpen) frame.contentWindow.postMessage({hl21board:m},"*"); }
  else if(LINK.mode==="remote"){ if(LINK.bc&&LINK.bcSeen) LINK.bc.postMessage({hl21board:m}); for(const c of LINK.conns){ try{ c.send({hl21board:m}); }catch(e){} } }
}
function countRemote(){ LINK.remote=LINK.conns.size+(LINK.bcSeen?1:0); renderLinkUI(); }
/* the board's STM32 as the app sees it (UsbProtocol.java / Converter.java): requests in, 30-byte frames out */
const HEAT_V=A=>A>0?A/2.2+0.139:0;
function heatFromApp(A){ const v=Math.max(0,Math.min(0.5,HEAT_V(A))); B.heatCode=4095+Math.trunc(-4095*(v/0.5));
  const v2=(4095-B.heatCode)/4095*0.5; B.iH=v2>0.139?Math.min(HEAT_MAX,(v2-0.139)*2.2*1000):0; }
function ledCode(A){ let max,bit; if(A<=0.001){ max=0.001; bit=0; } else { max=0.05; bit=0x80; } A=Math.max(0,Math.min(max,A)); const c=Math.trunc(4095*(A/max)); return [c&255,((c>>>8)&255)|bit]; }
const ledAmps=(b0,b1)=>((b0|((b1&0x7f)<<8))/4095)*((b1&0x80)?0.05:0.001);
function ledFromApp(A,pw){ const b=ledCode(A); B.iL=ledAmps(b[0],b[1])*1000; B.tL=pw>0?pw:0; }
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b,n){ let c=0xFFFFFFFF; for(let i=0;i<n;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const put=(b,o,v,n)=>{ for(let i=0;i<n;i++) b[o+i]=Math.floor(v/Math.pow(256,i))&255; };
const clampI=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));
function boardFrame(code){ const b=new Uint8Array(30); b[0]=27; b[1]=30; b[2]=code; b[3]=(LINK.cmdNr++)&255;
  const uL=ledState()[0];
  put(b,6,clampI((ntcV()+60e-6*gauss())/3.3*65535,0,65535),2);
  put(b,8,clampI((uL+(uL>0?100e-6*gauss():0))/3.3*65535,0,65535),2);
  put(b,10,clampI((B.uC+50e-6*gauss()+10.05)/(10.04998+10.05)*16777200,0,16777215),3);
  put(b,13,B.heatCode,2); const lb=ledCode(B.iL/1000); b[15]=lb[0]; b[16]=lb[1];
  put(b,17,clampI(B.iH*(1+0.002*gauss())/3300*65535,0,65535),2); put(b,19,Math.floor(B.clock*100),4);
  b[25]=0; put(b,26,crc32(b,26),4);
  let s=""; for(let i=0;i<30;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function fromApp(m,src){ if(!m||typeof m!=="object"||src!==LINK.mode) return;
  switch(m.type){
    case "hello": if(src==="virtual") LINK.appOpen=true; toApp({type:"welcome",lang,attached:LINK.usb}); break;
    case "bye": if(src==="remote"){ LINK.bcSeen=false; countRemote(); } LINK.run=null; break;
    case "run": if(!m.on||!linkOn()){ LINK.run=null; break; } B.timestep=Math.max(0.03,Math.min(1,m.ts||0.14));
      LINK.run={ts:B.timestep, sweep:Array.isArray(m.sweep)?m.sweep:null, si:0, prev:B.iL/1000, pw:m.pw||0}; LINK.next=simNow+0.5;
      if(!LINK.run.sweep&&typeof m.led==="number"&&B.powered) ledFromApp(m.led,m.pw||0); break;
    case "led": if(B.powered&&LINK.usb) ledFromApp(+m.A||0,+m.pw||0); break;
    case "heat": if(B.powered&&LINK.usb) heatFromApp(+m.A||0); break;
    case "orient": setPortrait(!!m.portrait); break;
    case "exit": droidCloseApp(); break;
  }
}
addEventListener("message",e=>{ if(e.source===frame.contentWindow&&e.data&&e.data.hl21app) fromApp(e.data.hl21app,"virtual"); });
/* the app's measurement thread runs at 140 ms of board time, so the speed buttons work */
function linkStep(){ const R=LINK.run; if(!R) return;
  if(!linkOn()||!LINK.usb){ LINK.run=null; return; }
  if(simNow<LINK.next) return; LINK.next+=R.ts; if(LINK.next<simNow) LINK.next=simNow+R.ts;
  if(R.sweep){ if(R.si>=R.sweep.length){ LINK.run=null; LINK.out.push("@done"); return; }
    const d7=R.sweep[R.si], cross=(d7>0.001&&R.prev<=0.001)||(d7<=0.001&&R.prev>0.001); ledFromApp(d7,R.pw); R.prev=d7;
    if(cross) return; R.si++; LINK.out.push(boardFrame(4)); return; }
  LINK.out.push(boardFrame(1)); }
function firmwareReset(){ B.iH=0; B.iL=0; B.tL=0; B.heatCode=4095; B.clock=0; LINK.run=null;
  if(LINK.usb){ LINK.usb=false; toApp({type:"detach"}); } LINK.resetting=true; setTimeout(()=>{ LINK.resetting=false; },900); }
function flushLink(){
  const on=linkOn()&&!LINK.resetting;
  if(on!==LINK.usb){ LINK.usb=on; if(!on) LINK.run=null; toApp({type:on?"attach":"detach"}); }
  if(LINK.out.length){ const fr=LINK.out.filter(x=>x!=="@done"); if(fr.length) toApp({type:"frames",list:fr}); if(fr.length!==LINK.out.length) toApp({type:"done"}); LINK.out=[]; }
}
/* pairing your own device */
const CODE_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode=()=>Array.from({length:6},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join("");
const ONLINE="https://haslalab.org/sim/";
/* ?peer=host:port uses your own PeerJS signalling server instead of the public one (tests, school networks) */
const PEER_Q=new URLSearchParams(location.search).get("peer")||"";
const PEER_OPT=PEER_Q?{host:PEER_Q.split(":")[0],port:+(PEER_Q.split(":")[1]||443),path:"/",secure:!/^(localhost|127\.|10\.|192\.168\.)/.test(PEER_Q)}:{};
function appUrl(code,forOther){ const base=(location.protocol==="file:"||forOther&&/^(localhost|127\.)/.test(location.hostname))?ONLINE:new URL(".",location.href).href; return base+"ipho2021_app.html?code="+code+"&lang="+lang+(PEER_Q?"&peer="+encodeURIComponent(PEER_Q):""); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=rej; document.head.appendChild(s); }); }
function startRemote(){
  if(!LINK.code) LINK.code=newCode();
  if(!LINK.bc&&"BroadcastChannel" in window){ LINK.bc=new BroadcastChannel("haslalab-ipho2021-"+LINK.code);
    LINK.bc.onmessage=e=>{ const m=e.data&&e.data.hl21app; if(!m) return; if(m.type==="hello"){ LINK.bcSeen=true; countRemote(); } fromApp(m,"remote"); }; }
  if(!LINK.peer){ LINK.peerState="load"; renderLinkUI();
    (window.Peer?Promise.resolve():loadScript("https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js")).then(()=>{
      const p=new Peer("haslalab-ipho2021-"+LINK.code,PEER_OPT); LINK.peer=p;
      p.on("open",()=>{ LINK.peerState="ready"; renderLinkUI(); });
      p.on("disconnected",()=>{ try{ p.reconnect(); }catch(e){} });
      p.on("error",err=>{ LINK.peerState="error"; if(err&&err.type==="unavailable-id"){ try{ p.destroy(); }catch(e){} LINK.peer=null; LINK.code=newCode(); if(LINK.bc){ LINK.bc.close(); LINK.bc=null; } startRemote(); return; } renderLinkUI(); });
      p.on("connection",c=>{ c.on("open",()=>{ LINK.conns.add(c); countRemote(); }); c.on("data",dt=>fromApp(dt&&dt.hl21app,"remote")); c.on("close",()=>{ LINK.conns.delete(c); countRemote(); }); });
    }).catch(()=>{ LINK.peerState="noload"; renderLinkUI(); }); }
  drawQR(); renderLinkUI();
}
let qrFor="";
function drawQR(){ const url=appUrl(LINK.code,true); if(qrFor===url) return; qrFor=url; $("qr").innerHTML="";
  (window.QRCode?Promise.resolve():loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js")).then(()=>{ new QRCode($("qr"),{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }).catch(()=>{ $("qr").textContent="QR"; }); }
function renderLinkUI(){ const t=d().ln;
  $("droidWrap").hidden=LINK.mode!=="virtual"; $("remoteWrap").hidden=LINK.mode!=="remote";
  $("t-closecap").textContent=LINK.mode==="remote"?t.capRemote:t.capVirtual;
  $("t-linkmode").textContent=LINK.mode==="remote"?t.modeRemote:LINK.mode==="virtual"?t.modeVirtual:"";
  $("bLinkMode").textContent=t.change;

  $("rCopy").textContent=t.copy; $("rWin").textContent=t.window;

  const st=$("rSt");
  if(LINK.remote>0){ st.className="rst ok"; st.textContent=t.linked(LINK.remote); }
  else if(LINK.peerState==="ready"){ st.className="rst wait"; st.textContent=t.waiting; }
  else if(LINK.peerState==="error"||LINK.peerState==="noload"){ st.className="rst bad"; st.textContent=t.noPeer; }
  else { st.className="rst wait"; st.textContent=t.starting; }
}
$("rCopy").onclick=()=>{ const u=appUrl(LINK.code,true); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>say("copied")).catch(()=>say("copied")); };
$("rWin").onclick=()=>{ window.open(appUrl(LINK.code,false),"hl21app","width=1100,height=680"); };
function setMode(mode){ LINK.mode=mode; LINK.run=null; LINK.usb=false; $("startOv").hidden=true;

$("ovVirt").onclick=()=>setMode("virtual"); $("ovRem").onclick=()=>setMode("remote");
$("bLinkMode").onclick=()=>{ $("startOv").hidden=false; };
/* the examination tablet: launcher, the IPhO app, a calculator, settings, ◀ ● ■ */
let droidApp=null, droidStack=[], portrait=false;
function droidSize(){ const w=$("droidWrap").clientWidth||900, el=$("droid");
  const W=portrait?Math.min(w,Math.round(w*0.46)+60):Math.min(w,1000); el.style.width=W+"px"; el.classList.toggle("port",portrait);

/* Chrome on the tablet: the real web in a mobile browser (vbrowser.js) */

    links:[{t:{ko:"실험 1 문제지",en:"Problem E1"},url:lang==="ko"?"../pdf/IPhO_2021_E1_KO.pdf":"../pdf/IPhO_2021_E1_EN.pdf",ic:"📄",col:"#c0392b"},{t:{ko:"실험 2 문제지",en:"Problem E2"},url:lang==="ko"?"../pdf/IPhO_2021_E2_KO.pdf":"../pdf/IPhO_2021_E2_EN.pdf",ic:"📄",col:"#c0392b"},
      {t:"HaslaLab",url:"../index.html",ic:"H",col:"#2f6fbf"},{t:{ko:"위키백과",en:"Wikipedia"},url:"https://ko.m.wikipedia.org/",ic:"W"},{t:"YouTube",url:"https://m.youtube.com/",ic:"▶",col:"#e62117"}]});
    $("dWeb").appendChild(BRW.el); } return BRW; }

$("nRec").onclick=()=>{ if(droidApp==="rec"){ droidShow(null); return; } if(droidApp==="exp"&&LINK.appOpen) frame.contentWindow.postMessage({hl21board:{type:"os",cmd:"pause"}},"*");
  const t=d().ln, names={exp:["IPhO",'<img src="ipho2021_app_icon.png" alt="">',""],calc:[t.calc,"±"," c"],set:[t.settings,"⚙"," s"],web:["Chrome",'<span class="ic web" style="width:28px;height:28px;border-radius:50%;display:inline-block"></span>'," s"]};
  $("dRec").innerHTML=droidStack.length?droidStack.map(k=>'<div class="card2'+names[k][2]+'" data-app="'+k+'">'+names[k][1]+"<span>"+names[k][0]+"</span></div>").join(""):'<span class="none">'+t.noRecent+"</span>";
  for(const c of $("dRec").querySelectorAll(".card2")) c.onclick=()=>droidOpen(c.dataset.app); droidShow("rec"); };
function renderSettings(){ const t=d().ln; $("dSet").innerHTML="<h4>"+t.settings+"</h4>"+t.about.map(([k,v])=>'<div class="it"><b>'+k+"</b><span>"+v+"</span></div>").join("")+'<div class="it"><b>'+t.boardId+"</b><span>"+B.id+"</span></div>"+

  $("dClear").onclick=()=>{ try{ localStorage.removeItem("haslalab.ipho2021.app.v1"); }catch(e){} if(LINK.appOpen) droidCloseApp(); say("appCleared"); renderSettings(); }; }
const CALC_KEYS=["7","8","9","÷","(",")","4","5","6","×","√","^","1","2","3","−","ln","exp","0",".","+","π","C","="];

      if(!/^[0-9+\-*/().eMathPIsqrtlogxp ]*$/.test(js)) throw 0; const v=Function("return ("+js+")")(); calcExpr=String(+v.toPrecision(12)); disp.textContent=calcExpr; }catch(e){ disp.textContent="Error"; calcExpr=""; } return; }
  calcExpr+=(k==="√"||k==="ln"||k==="exp")?k+"(":k; disp.textContent=calcExpr; }

let tPrev=performance.now()/1000, frameN=0;
