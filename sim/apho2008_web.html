<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }

  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),1))||null; }
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.parent){ ST.on.add(k); ST.at[k]=hand.parent; if(k==="coax") ST.wired=true; say("placed",itemName(k)); } else if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
function takeUp(k){ if(k==="coax"&&ST.wired) ST.wired=false; if(k==="phones"&&ST.toPhones){ ST.toPhones=false; }
  if(k==="rail"&&Object.values(ST.at).includes("rail")){ say("emptyFirst"); return false; } if(k==="rot"&&Object.values(ST.at).includes("rot")){ say("emptyFirst"); return false; }
  const b=baseOf(k), par=ST.at[k]; if(par) delete ST.at[k]; hand={item:k,move:true,orig:{x:b.x,y:b.y},parent:par};
  ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
function drop(k,x,y){ ST.pos[k]={x,y}; ST.on.add(k); delete ST.at[k]; say("placed",itemName(k)); }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const t=targetAt(k,p); if(t){ ST.on.add(k); if(put(k,t)) hand=null; else ST.on.delete(k); return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(Object.values(ST.at).includes(k)&&k!=="fg"){ say("emptyFirst"); return; } if(k==="fg"&&(ST.wired||ST.at.phones)){ say("emptyFirst"); return; } if(k==="coax") ST.wired=false;
    delete ST.at[k]; ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* close-ups: drag carriers along the rail, the detector arm round the holder */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointerdown",e=>{ if(e.button!==0) return; const p=clpos(e), h=hitAt(p);
  if(tab==="rail"){ if(h&&h.k.startsWith("car:")){ const k=h.k.slice(4); cdrag={k,p,v:k==="src"?ST.xs:k==="det"?ST.xd:ST.xm}; } else cdrag={k:"pan",p,v:RV.cx}; }
  else if(tab==="rot"&&h){ cdrag={k:"arm"}; setArmFrom(p); }
  closeCv.setPointerCapture(e.pointerId); });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e);
  if(cdrag.k==="arm"){ setArmFrom(p); return; }
  const dmm=(p[0]-cdrag.p[0])/RV.z; if(cdrag.k==="pan"){ RV.cx=cdrag.v-dmm; return; } setRail(cdrag.k,cdrag.v+dmm); });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ if(tab!=="rail") return; e.preventDefault(); RV.z=Math.max(CLW/640,Math.min(40,RV.z*(e.deltaY<0?1.25:0.8))); },{passive:false});
function setArmFrom(p){ const cx=CLW/2, cy=CLH*0.82; let a=Math.atan2(p[0]-cx,cy-p[1])*180/Math.PI; ST.phi=Math.max(-90,Math.min(90,Math.round(a))); }
function setRail(k,mm){ mm=Math.max(0,Math.min(600,Math.round(mm*2)/2)); if(k==="src") ST.xs=mm; else if(k==="det") ST.xd=mm; else ST.xm=mm;
  const xs=[ST.xs,ST.xd,ST.xm]; if(where("mirror")==="rail"&&where("det")==="rail"&&ST.xd>ST.xm-2&&ST.xd<ST.xm+2) say("bump"); }

/* ══════════════════════════════════════════════════════════════
   6.  PANEL, SOUND AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0;
const r1=v=>Math.round(v*10)/10;
function setF(df){ if(!has("fg")) return; ST.f=Math.max(1,Math.min(99999.9,r1(ST.f+df))); if(!ST.toPhones&&(ST.f<30000||ST.f>50000)&&ST.out&&where("src")) say("range"); }
for(const [id,v] of [["fm10k",-10000],["fm1k",-1000],["fm100",-100],["fm10",-10],["fm1",-1],["fp1",1],["fp10",10],["fp100",100],["fp1k",1000],["fp10k",10000]]) $(id).onclick=()=>setF(v);
$("am1").onclick=()=>{ ST.ampl=Math.max(0,Math.round((ST.ampl-0.1)*100)/100); }; $("am01").onclick=()=>{ ST.ampl=Math.max(0,Math.round((ST.ampl-0.01)*100)/100); };
$("ap01").onclick=()=>{ ST.ampl=Math.min(5,Math.round((ST.ampl+0.01)*100)/100); }; $("ap1").onclick=()=>{ ST.ampl=Math.min(5,Math.round((ST.ampl+0.1)*100)/100); };
$("outBtn").onclick=()=>{ if(!has("fg")){ say("needFor",itemName("fg")); return; } ST.out=!ST.out; };
$("vfBtn").onclick=()=>{ ST.vf=!ST.vf; };
$("routeBtn").onclick=()=>{ if(!ST.at.phones){ say("needPhones"); return; } ST.toPhones=!ST.toPhones; say(ST.toPhones?"toPhones":"toSrc"); };
$("mvBtn").onclick=()=>{ if(!has("mv")){ say("needFor",itemName("mv")); return; } ST.mvOn=!ST.mvOn; if(ST.mvOn) ST.rng=10; };
$("rm").onclick=()=>{ ST.rng=Math.max(0,ST.rng-1); }; $("rp").onclick=()=>{ ST.rng=Math.min(RANGES.length-1,ST.rng+1); };
$("fcBtn").onclick=()=>{ if(!has("fc")){ say("needFor",itemName("fc")); return; } ST.fcOn=!ST.fcOn; };
$("dcBtn").onclick=()=>{ if(!has("dc")){ say("needFor",itemName("dc")); return; } if(!has("disk")){ say("needFor",itemName("disk")); return; } ST.dcOn=!ST.dcOn; };
for(const [id,v] of [["um1",-1],["um01",-0.1],["up01",0.1],["up1",1]]) $(id).onclick=()=>{ ST.Udc=Math.max(0,Math.min(16,r1(ST.Udc+v))); };
for(const [id,v] of [["pm5",-5],["pm1",-1],["pp1",1],["pp5",5]]) $(id).onclick=()=>{ if(!has("rot")) return; ST.phi=Math.max(-90,Math.min(90,ST.phi+v)); };
for(const [id,k,v] of [["dm",'det',-0.5],["dp",'det',0.5],["mm",'mirror',-0.5],["mp",'mirror',0.5]]) $(id).onclick=()=>{ if(where(k)==="rail") setRail(k,(k==="det"?ST.xd:ST.xm)+v); };
$("vm").onclick=()=>{ ST.vol=Math.max(0,Math.round((ST.vol-0.02)*100)/100); }; $("vp").onclick=()=>{ ST.vol=Math.min(1,Math.round((ST.vol+0.02)*100)/100); };
/* part 4 is your own ears: a real tone through your headphones */
let AC=null, OSC=null, GAIN=null;
$("wearBtn").onclick=()=>{ if(!ST.at.phones){ say("needPhones"); return; } ST.wear=!ST.wear;
  if(ST.wear&&!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); OSC=AC.createOscillator(); GAIN=AC.createGain(); GAIN.gain.value=0; OSC.type="sine"; OSC.connect(GAIN); GAIN.connect(AC.destination); OSC.start(); }catch(e){ AC=null; say("noAudio"); } }
  if(AC&&AC.state==="suspended") AC.resume(); say(ST.wear?"wear":"unwear"); };
function sound(){ if(!AC) return; const g=ST.wear&&ST.toPhones&&ST.out?Math.min(0.3,0.12*phonesV()):0; GAIN.gain.setTargetAtTime(g,AC.currentTime,0.03); OSC.frequency.setTargetAtTime(Math.min(22000,Math.max(10,ST.f)),AC.currentTime,0.01); }
$("noteBtn").onclick=()=>{ const n=$("note"), rv=RANGES[ST.rng], cf=counterF(), s="f = "+fgText()+"   MV "+(rv>=1?rv+" V":(rv*1000)+" mV")+d().lab.rangeW+(cf&&!isNaN(cf)?"   FC "+cf.toFixed(0)+" Hz":"")+(ST.dcOn?"   U "+ST.Udc.toFixed(1)+" V":"");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s+"   "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d(); $("dF").textContent=has("fg")?fgText():"";
  $("outBtn").textContent=ST.out?t.outOff:t.outOn; $("vfBtn").textContent=ST.vf?t.showF:t.showV; $("routeBtn").textContent=ST.toPhones?t.routeP:t.routeS;
  $("mvBtn").textContent=ST.mvOn?t.mvOff:t.mvOn; $("fcBtn").textContent=ST.fcOn?t.fcOff:t.fcOn; $("dcBtn").textContent=ST.dcOn?t.dcOff:t.dcOn;
  $("dU").textContent=ST.dcOn?ST.Udc.toFixed(1)+" V":"-- V"; $("phiL").textContent=t.angle+" "+ST.phi+"°"; $("volL").textContent=t.volume+" "+Math.round(ST.vol*100)+" %"; $("wearBtn").textContent=ST.wear?t.unwear:t.wearB; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.mvOn&&ST.needle>1.02) L.push([t.st.over,true]);
  if(ST.out&&!ST.toPhones&&ST.ampl>1.25&&where("src")) L.push([t.st.sat,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-fg","hFg"],["fgHint","fgHint"],["t-h-mv","hMv"],["t-h-dc","hDc"],["t-h-pos","hPos"],["t-h-ear","hEar"],["earHint","earHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt); sound();
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
