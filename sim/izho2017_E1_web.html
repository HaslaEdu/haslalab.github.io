<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">

<title>IZhO 2017 실험 — 비틀림 진자 · Torsion Pendulum · HaslaLab</title>
<meta name="description" content="IZhO 2017 실험 문제를 브라우저에서 해 봅니다. 두 실에 매단 볼트 진자의 작은 비틀림 진동 주기를 실 길이와 실 장력(자의 휨)에 따라 재고, 크게 꼬았을 때의 풀림 시간과 다시 꼬이는 반바퀴 수, 추를 들어 에너지를 넣는 효과를 조사합니다.">

<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* IZhO 2017 on the 3-D bench.  Small oscillations: T = 4πR/h·√(l/g) (R ≈ 4.33 cm, h ≈ 2.8 cm, official) with the
   upper threads only; with lower threads tied to a bent ruler (both 20 cm) T⁻² grows linearly with the bending z
   (the official slope ≈ 0.147 s⁻²/mm).  Large twists, N in half-turns from parallel threads: the bifilar well
   U₂(1 − cos πN)/2 for |N| ≤ 1, then U₂ + C(|N| − 1)^γ with γ ≈ 1.54, drag c·v|v| in the twisted part and a
   constant loss f — fitted to the official tables 3–4 (untwisting 1.9–2.6 s, N₁ ≈ 0.46N₀ + 0.84), all scaled
   with the tension.  The 100 g weight on the ruler stiffens the threads and adds loss; lifting it while the
   pendulum re-twists lets it go further (tables 5). */
var PROGRAM = {
  title: { ko: 'IZhO 2017 실험 — 비틀림 진자', en: 'IZhO 2017 — Torsion pendulum' },
  subtitle: { ko: '너트로 단단히 이은 두 볼트를 두 실에 매단 비틀림 진자입니다. 진자는 수평면에서 비틀림 진동만 하게 하세요. 장비: 두 볼트와 이음 너트, 홀더 둘이 있는 삼각대, 실, 40 cm 나무 자 둘, 스톱워치, 100 g 추, 점토. g = 9.81 m/s².',
              en: 'A torsion pendulum: two bolts rigidly joined by a coupling nut, hung on two threads. Make sure it only twists in a horizontal plane. Equipment: two bolts and the coupling nut, a tripod with two holders, thread, two 40 cm wooden rulers, a stopwatch, a 100 g weight and clay. g = 9.81 m/s².' },
  notes: { ko: [
    '과제: 1 실 길이 10–50 cm 에서 작은 비틀림 진동 주기, 이론 T = 4π√(Il/(mgh²)), T²(l) 직선, 회전 반지름 R 과 오차. 2 아래에도 실 두 가닥을 매어 40 cm 자에 묶고(위아래 모두 약 20 cm), 위 홀더를 올려 자가 휜 정도 z 로 장력을 바꾸며 주기, T⁻² ∝ z. 3 반바퀴 수 N ≤ 20 의 큰 꼬임: 풀리는 시간 t(N₀), U = CN^γ 의 γ 범위, 다시 꼬이는 N₁(N₀) (장력 두 가지), 자 아래 100 g 추를 단 채로/다시 꼬일 때만 추를 들어 올린 채로의 N₁(N₀).',
    '공식 해답: l = 61, 49, 39, 28, 19, 10 cm → T = 4.82, 4.36, 3.84, 3.29, 2.67, 1.92 s; T² = 0.385·l − 0.12, h = 2.8 ± 0.1 cm → R = 4.33 ± 0.16 cm. z = 12, 20, 27, 37, 52 mm → T = 1.03, 0.71, 0.56, 0.45, 0.38 s. N = 5 … 21 → t = 1.91 … 2.63 s 이므로 γ < 2. N₁ = 0.46N₀ + 0.84 (장력에 거의 무관); 추를 단 채 N₁ ≈ 0.58N₀ − 3.5, 다시 꼬일 때 추를 들면 N₁ ≈ 0.37N₀ + 2.5 (더 높음 — 에너지 유입).',
    '꼬임 반바퀴 수는 막대가 평행한 실 자리(N = 0)에서 셉니다. 큰 꼬임은 빠르니 ×0.25 로 보세요. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 the small torsional period for thread lengths 10–50 cm, the theory T = 4π√(Il/(mgh²)), the line T²(l), the radius of gyration R with its error. 2 tie two more threads below to a 40 cm ruler (about 20 cm above and below), raise the upper holder and vary the tension by the ruler\'s bending z: the period, T⁻² ∝ z. 3 large twists of N ≤ 20 half-turns: the untwisting time t(N₀), the range of γ in U = CN^γ, the re-twist N₁(N₀) at two tensions, and N₁(N₀) with a 100 g weight under the ruler — left hanging, or lifted only while the pendulum re-twists.',
    'Official solution: l = 61, 49, 39, 28, 19, 10 cm → T = 4.82, 4.36, 3.84, 3.29, 2.67, 1.92 s; T² = 0.385·l − 0.12, h = 2.8 ± 0.1 cm → R = 4.33 ± 0.16 cm. z = 12, 20, 27, 37, 52 mm → T = 1.03, 0.71, 0.56, 0.45, 0.38 s. N = 5 … 21 → t = 1.91 … 2.63 s, so γ < 2. N₁ = 0.46N₀ + 0.84 (nearly independent of tension); with the weight hanging N₁ ≈ 0.58N₀ − 3.5, lifting it on re-twist N₁ ≈ 0.37N₀ + 2.5 (higher — energy goes in).',
    'Half-turns count from the parallel-thread position (N = 0). Large twists are fast — watch them at ×0.25. The values differ a little from visit to visit.'] }
};

var LAB = { mode: 'A', l: 40, z: 20, N: 0, v: 0, held: false, wt: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 삼각대(위 홀더 — 위쪽 실, 아래 홀더 — 40 cm 자), 볼트 진자, 100 g 추, 스톱워치. 아래 자를 클릭하면 아래쪽 실을 매거나 풉니다.',
           en: 'On the desk: the tripod (upper holder — the upper threads, lower holder — a 40 cm ruler), the bolt pendulum, the 100 g weight and a stopwatch. Click the lower ruler to tie or untie the lower threads.' },
  howto: { ko: ['진자 위에서 휠: 반바퀴씩 꼬기 (Shift: 0.1) · 진자를 좌우로 끌기: 조금 돌리기 — 돌리는 동안 손에 잡고 있습니다 · 진자 클릭: 놓기 / 잡기',
                '위 홀더 위에서 휠: 아래 실이 없으면 실 길이 l (1 cm), 있으면 홀더를 올려 자의 휨 z (1 mm) · 아래 자 클릭: 아래 실 매기/풀기',
                '추 클릭: 자 아래에 걸기/떼기 · 추를 누르고 있는 동안: 들어 올리기 · 스톱워치 <b>Space</b>'],
           en: ['Wheel over the pendulum: twist by half-turns (Shift: 0.1) · drag it left/right: turn it a little — you hold it while turning · click it: release / catch',
                'Wheel over the upper holder: without lower threads the thread length l (1 cm), with them raise the holder — the ruler\'s bending z (1 mm) · click the lower ruler: tie/untie the lower threads',
                'Click the weight: hang it under the ruler / take it off · press and hold the weight: lift it · stopwatch <b>Space</b>'] },
  notePlaceholder: { ko: '예) l = 61 cm: 10T = 48.19, 48.02 s … / z = 12 mm: 10T = 10.22 s … / N₀ = 20: t = 2.6 s, N₁ = 10', en: 'e.g. l = 61 cm: 10T = 48.19, 48.02 s … / z = 12 mm: 10T = 10.22 s … / N₀ = 20: t = 2.6 s, N₁ = 10' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var RG = 4.33 * (1 + S.sys('R', 0.02)), H = 2.8 * (1 + S.sys('h', 0.02)), G = 981, GAM = 1.54, C0 = 1.224 * (1 + S.sys('C', 0.04)), CQ = 0.0275, F0 = 0.788 * (1 + S.sys('f', 0.05)), KW = 1.343, FW = 2.32;
    var YH = 75, sw = new B3.Stopwatch(0.04);
    function omega2() { if (LAB.mode === 'A') { var T = 4 * Math.PI * RG / H * Math.sqrt(LAB.l / G); return 4 * Math.PI * Math.PI / (T * T); }
      var T20 = 4 * Math.PI * RG / H * Math.sqrt(20 / G), inv = 1 / (T20 * T20) * (1 + 1.097 * LAB.z) * (LAB.wt ? KW : 1); return 4 * Math.PI * Math.PI * inv; }
    var k35 = 4 * Math.PI * Math.PI * (1 / Math.pow(4 * Math.PI * RG / H * Math.sqrt(20 / G), 2)) * (1 + 1.097 * 35);
    function accel(N, v, lifted) { var w2 = omega2(); if (LAB.wt && lifted) w2 /= KW; var kC = w2 / k35, U2 = 2 * w2 / (Math.PI * Math.PI), a = Math.abs(N), s = N > 0 ? 1 : -1, F, q = 0;
      if (a > 1) { F = -s * GAM * C0 * kC * Math.pow(a - 1, GAM - 1); q = CQ * v * Math.abs(v); } else F = -U2 * Math.PI / 2 * Math.sin(Math.PI * N);
      var fr = F0 * kC + (LAB.wt && !lifted ? FW * kC / KW : 0); fr *= Math.min(1, Math.abs(v) * 5);
      return F - q - fr * (v > 0 ? 1 : v < 0 ? -1 : 0); }
    var rul = B3.scaleTex(8, { width: 1.6, step: 0.1, every: 1 });
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' '], speeds: [1, 0.25], wheelIds: ['pend', 'hold'],
      home: { yaw: -0.3, pitch: 0.28, k: 7.2, tx: 2, ty: 40, tz: 0 },
      views: { top: { yaw: 0, pitch: 1.45, k: 26, tx: 0, ty: 40, tz: 0, title: { ko: '위에서 본 진자', en: 'The pendulum from above' } },
               zr: { yaw: 0, pitch: 0.05, k: 30, tx: 6, ty: 12, tz: 0, title: { ko: '자의 휨', en: 'The ruler\'s bending' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 30, ty: 1.7, tz: 12, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        var wh = b.wheel('hold'); if (wh) { if (LAB.mode === 'A') LAB.l = Math.max(10, Math.min(61, Math.round(LAB.l + wh))); else LAB.z = Math.max(0, Math.min(60, Math.round(LAB.z + wh))); }
        if (b.clicked('c:ruler')) { LAB.mode = LAB.mode === 'A' ? 'B' : 'A'; LAB.N = 0; LAB.v = 0; if (LAB.mode === 'A') LAB.wt = false; }
        if (b.clicked('c:wt') && !LAB.wasHeld) { if (LAB.mode === 'B') LAB.wt = !LAB.wt; else b.say('먼저 아래 실을 자에 매세요', 'Tie the lower threads to the ruler first'); }
        var lifted = LAB.wt && b.held('c:wt'); LAB.wasHeld = false;
        var wp = b.wheel('pend'), mp = b.screenMoved('pend');
        if (wp || mp[0]) { LAB.N += wp + mp[0] * 0.01; LAB.held = true; LAB.v = 0; b.say('N = ' + LAB.N.toFixed(1) + b.L(' 반바퀴', ' half-turns'), 'N = ' + LAB.N.toFixed(1) + ' half-turns'); }
        else if (b.clicked('m:pend')) { if (LAB.held) LAB.held = false; else { LAB.held = true; LAB.v = 0; } }
        if (!LAB.held && b.dt > 0) { var n = Math.ceil(b.dt / 0.0005), h = b.dt / n;
          for (var i = 0; i < n; i++) { LAB.v += accel(LAB.N, LAB.v, lifted) * h; LAB.N += LAB.v * h; } }
        var l = LAB.mode === 'A' ? LAB.l : 20, YP = LAB.mode === 'A' ? YH - LAB.l : 40, yH = LAB.mode === 'A' ? YH : 60 + LAB.z / 10;
        B3.desk(-36, 44, -18, 20);
        /* tripod */
        B3.box3(-24, -8, 0, 1.6, -10, 6, '#3b4048', { top: '#474c55' }); B3.cylSeg('y', 1.6, 82, -18, -2, 0.8, '#c3c8cd', { seg: 14, cap: '#dde1e4' }, 6);
        B3.box3(-19.4, -16.6, yH - 1.4, yH + 1.4, -3.4, -0.6, '#3a3f46', { top: '#474c55', id: 'm:hold' });
        B3.cyl3('x', -16.6, 2, yH, -2, 0.5, '#9aa0a6', { seg: 10, cap: '#b5bbc1', id: 'm:hold' }); B3.box3(-1, 1, yH - 0.6, yH + 0.6, -3, 3, '#3a3f46', { id: 'm:hold' });
        /* the pendulum: two bolts and the nut, turned by θ = πN */
        var th = Math.PI * LAB.N, d = [Math.cos(th), 0, -Math.sin(th)], e = [Math.sin(th), 0, Math.cos(th)];
        B3.cylAB([-7.5 * d[0], YP, -7.5 * d[2]], [7.5 * d[0], YP, 7.5 * d[2]], 0.45, '#9aa0a6', { seg: 8, id: 'm:pend' });
        B3.cylAB([-1.5 * d[0], YP, -1.5 * d[2]], [1.5 * d[0], YP, 1.5 * d[2]], 0.75, '#8d9399', { seg: 6, id: 'm:pend', cap: '#a2a8ae' });
        [-1, 1].forEach(function (sg) { B3.cylAB([sg * 7.5 * d[0], YP, sg * 7.5 * d[2]], [sg * 8.6 * d[0], YP, sg * 8.6 * d[2]], 0.8, '#7d848b', { seg: 6, id: 'm:pend', cap: '#959ca3' }); });
        function threads(yA, yB, fixedTop) { var aN = Math.abs(LAB.N), h2 = H / 2;
          var Pf = function (sg) { return [0, fixedTop ? yA : yB, sg * h2]; }, Pm = function (sg) { return [sg * h2 * e[0], fixedTop ? yB : yA, sg * h2 * e[2]]; };
          if (aN <= 1) { [-1, 1].forEach(function (sg) { B3.line3(Pf(sg), Pm(sg), '#f0f0f0', 1.2); }); return; }
          var y1 = fixedTop ? yA - 2 : yB + 2, y2 = fixedTop ? yB + 2 : yA - 2, M = Math.max(16, Math.round(aN * 10));
          [-1, 1].forEach(function (sg) { var pts = [Pf(sg)];
            for (var i = 0; i <= M; i++) { var u = i / M, ph = (sg > 0 ? Math.PI / 2 : -Math.PI / 2) + th * (fixedTop ? u : 1 - u), yy = fixedTop ? y1 + (y2 - y1) * u : y1 + (y2 - y1) * u;
              pts.push([0.12 * Math.sin(ph), yy, 0.12 * Math.cos(ph)]); }
            pts.push(Pm(sg)); B3.poly3(fixedTop ? pts : pts, '#f0f0f0', 1.2); }); }
        threads(yH - 0.6, YP + 0.45, true);
        /* lower holder with the ruler (cantilever, bent up by z at the tie point) */
        var zr = LAB.mode === 'B' ? LAB.z / 10 : 0, YR = 20;
        B3.box3(-19.4, -16.6, YR - 1.4, YR + 1.4, -3.4, -0.6, '#3a3f46', { top: '#474c55' });
        var segs = 8; for (var k = 0; k < segs; k++) { var x0 = -16.6 + k * 5, x1 = x0 + 5, bend = function (x) { var u = Math.max(0, (x + 16.6) / 18); return zr * (u < 1 ? u * u * (3 - u) / 2 : 1 + 1.5 * (u - 1)); };
          B3.box3(x0, x1, YR - 0.3 + (bend(x0) + bend(x1)) / 2, YR + 0.3 + (bend(x0) + bend(x1)) / 2, -2.8, 0.8, '#d9c48f', { id: 'c:ruler' }); }
        var tieY = YR + 0.3 + zr;
        if (LAB.mode === 'B') { B3.box3(0.8, 2.4, YR - 6, YR + 2, -3.2, -2.9, '#f2efe6', { noObst: true });
          B3.tex3(rul, 0, 0, rul.width, rul.height, [0.8, YR + 2 + 1 * 0.1 - 0.1, -2.88], [1.6, 0, 0], [0, -10 * 0.8 - 0 , 0], { id: 'c:zr' });
          threads(YP - 0.45, tieY, false);
          if (LAB.wt) { var wy = lifted ? 10 : 6; B3.line3([1.4, tieY, 2.5], [1.4, wy + 3, 2.5], '#f0f0f0', 1.2); B3.cyl3('y', wy, wy + 3, 1.4, 2.5, 1.1, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:wt' }); } }
        if (!LAB.wt) B3.cyl3('y', 0, 3, 18, 10, 1.1, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:wt' });
        if (b.clicked('c:zr')) b.go('zr');
        B3.stopwatch(b, 'sw', [30, 12], sw);
        LAB.state = { mode: LAB.mode, l: LAB.l, z: LAB.z, N: LAB.N, T: 2 * Math.PI / Math.sqrt(omega2()), held: LAB.held };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
