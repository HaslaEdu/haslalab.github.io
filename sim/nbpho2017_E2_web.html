<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}

     padding:6px 16px 10px}

    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

</style>

<body>
<script>
/* NBPhO 2017 problem 10 "Black box" (Jaan Kalda, Siim Ainsaar) on the 3-D bench.  In the box with three
   terminals there is a resistor R1, a capacitor C, and a battery E in series with a resistor R2 — joined
   in a star (the official solution's option A: black–R1–N, white–(E, R2)–N, blue–C–N).  The circuit,
   the multimeter (10 MΩ on volts, a shunt on amps, a 1 V source behind the range resistor on ohms) and
   the leads are solved together every frame (B3.Circuit), so the meter loads the box as a real one
   does.  The electrolytic capacitor leaks a little.  The official values are E ≈ 1.57 V, R1 ≈ 200 kΩ,
   R2 ≈ 51 kΩ, C ≈ 330 µF; each visit's box differs by a few per cent. */
var PROGRAM = {
  title: { ko: 'NBPhO 2017 실험 10 — 블랙박스', en: 'NBPhO 2017 Problem 10 — Black box' },
  subtitle: { ko: '단자 셋(A, B, C)이 달린 상자 속에 저항(R₁), 축전기(C), 그리고 전지(기전력 E)와 저항(R₂)의 직렬 연결이 있습니다. 회로도를 알아내고 E, R₁, R₂, C를 재세요.',
              en: 'A box with three terminals (A, B and C) holds a resistor (R₁), a capacitor (C), and a battery (EMF E) in series with another resistor (R₂). Find the circuit diagram and measure E, R₁, R₂ and C.' },
  notes: { ko: [
    '장비: 블랙박스, 멀티미터, 스톱워치, 도선, 모눈종이 (문제지 그대로). 단자는 검정(A) · 흰색(B) · 파랑(C)입니다.',
    '상자 속 회로와 멀티미터, 도선을 매 순간 함께 풉니다 — 전압계는 10 MΩ, 전류계는 범위마다 분류 저항(200 µA 범위 1 kΩ …), 저항계는 범위 저항 뒤의 1 V 전원입니다. 그래서 측정기가 상자에 주는 영향도 실제와 같습니다.',
    '멀티미터 표시는 1초에 세 번쯤 바뀌고 마지막 자리가 조금 흔들립니다. 전해 축전기는 조금 샙니다.',
    '공식 해답의 값은 E ≈ 1.57 V, R₁ ≈ 200 kΩ, R₂ ≈ 51 kΩ, C ≈ 330 µF 입니다. 방문할 때마다 상자의 값이 몇 % 다릅니다.',
    '(i) 회로도 3점, (ii) 값과 불확도 7점. 측정할 때마다 회로도와 멀티미터 설정을 적으세요.'], en: [
    'Equipment: the black box, a multimeter, a stopwatch, wires and graph paper (as on the sheet). The terminals are black (A), white (B) and blue (C).',
    'The circuit in the box, the multimeter and the leads are solved together at every moment — the voltmeter is 10 MΩ, the ammeter a shunt for each range (1 kΩ on 200 µA …), the ohmmeter a 1 V source behind the range resistor — so the meter loads the box as a real one does.',
    'The display takes about three readings a second and its last digit wanders a little. The electrolytic capacitor leaks a little.',
    'The official solution has E ≈ 1.57 V, R₁ ≈ 200 kΩ, R₂ ≈ 51 kΩ, C ≈ 330 µF. Each visit\'s box differs by a few per cent.',
    '(i) circuit diagram, 3 points; (ii) values and uncertainties, 7 points. Always write down the circuit and the multimeter setting you used.'] }
};

var LAB = { dmm: {}, leads: null, sw: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 셋(검정 A · 흰색 B · 파랑 C)이 달린 블랙박스, 멀티미터(COM · VΩ · mA 단자), 스톱워치. 도선으로 단자끼리 이어 측정합니다. 단자 둘을 도선으로 바로 이어(단락) 둘 수도 있습니다.',
           en: 'On the desk: the black box with three terminals (black A · white B · blue C), a multimeter (COM · VΩ · mA jacks) and a stopwatch. Join terminals with wires to measure; you may also short two terminals straight together with a wire.' },
  howto: { ko: ['도선: 단자(또는 멀티미터 잭)를 클릭하면 도선이 손에 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 도선 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '멀티미터: 클릭해서 가까이 본 뒤 다이얼의 눈금을 클릭하거나 휠로 돌리기 (V⎓ · A⎓ · Ω)',
                '전류를 잴 때는 mA 와 COM 잭을 씁니다. 큰 전류를 흘리면 퓨즈가 끊어집니다',
                '스톱워치: 클릭해서 가까이 본 뒤 버튼 · <b>Space</b> = START/STOP',
                '오른쪽 위 ×1 · ×10 으로 시간을 빨리 흐르게 할 수 있습니다 (스톱워치도 같이 빨라집니다)'],
           en: ['Wires: click a terminal (or a meter jack) to take up a wire, click another terminal to plug it in. Click a plugged end to pull it out and hold it again; click the desk to put it down',
                'Multimeter: click it to look closer, then click a mark on the dial or roll the wheel on it (V⎓ · A⎓ · Ω)',
                'Measure current with the mA and COM jacks. Too large a current blows the fuse',
                'Stopwatch: click it to look closer, then press its buttons · <b>Space</b> = START/STOP',
                'The ×1 · ×10 buttons top right make time run faster (the stopwatch too)'] },
  notePlaceholder: { ko: '예) A–B, V 2 V 범위: 1.571 V\nC–B 단락 30 s 뒤, A–C, A 200µ 범위: t = 0 s … µA', en: 'e.g. A–B, V 2 V range: 1.571 V\nafter shorting C–B for 30 s, A–C, A 200µ range: t = 0 s … µA' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var E = 1.57 * (1 + S.sys('E', 0.01)), R1 = 200e3 * (1 + S.sys('R1', 0.03)), R2 = 51e3 * (1 + S.sys('R2', 0.03));
    var Cap = 330e-6 * (1 + S.sys('C', 0.06)), Rleak = 4e6 * (1 + S.sys('leak', 0.3));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.002), A: S.sys('mA', 0.005), R: S.sys('mR', 0.004) };
    var leads = LAB.leads = new B3.Leads({ max: 8 }), sw = LAB.sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit();
    var BX = -14, BZ = 2;                                        /* the box */
    var T = { A: 'box.A', B: 'box.B', C: 'box.C' };
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10],
      home: { yaw: -0.3, pitch: 0.85, k: 15, tx: 2, ty: 0, tz: 2 },
      views: {
        box: { yaw: 0, pitch: 1.0, k: 42, tx: BX, ty: 3, tz: BZ, title: { ko: '블랙박스', en: 'The black box' },
               hint: { ko: '단자를 클릭해 도선 잇기 · Esc: 돌아가기', en: 'Click terminals to wire them · Esc: back' } },
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 8, ty: 3.4, tz: 2, title: { ko: '멀티미터', en: 'Multimeter' },
               hint: { ko: '다이얼 눈금 클릭 또는 휠 · 잭을 클릭해 도선 잇기 · Esc: 돌아가기', en: 'Click a dial mark or roll the wheel · click a jack to wire it · Esc: back' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 26, ty: 1.7, tz: 6, title: { ko: '스톱워치', en: 'Stopwatch' } }
      },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-32, 38, -18, 20);
        /* the black box: a plastic case with three sockets on top */
        B3.box3(BX - 7, BX + 7, 0, 5, BZ - 5, BZ + 5, '#1d1f22', { id: 'm:box', top: '#26292d' });
        B3.text3([BX - 6, 5.02, BZ + 4.2], [1, 0, 0], [0, 0, -1], 'NBPhO 2017 · №10', 0.75, '#8a9096', { weight: '700' });
        leads.term(b, T.A, [BX - 4, 5, BZ - 0.5], { col: '#151515', label: 'A', lc: '#d8d8d8', ls: 1.0 });
        leads.term(b, T.B, [BX, 5, BZ - 0.5], { col: '#e8e8e8', label: 'B', lc: '#d8d8d8', ls: 1.0 });
        leads.term(b, T.C, [BX + 4, 5, BZ - 0.5], { col: '#2f6ea6', label: 'C', lc: '#d8d8d8', ls: 1.0 });
        /* the multimeter and the stopwatch */
        var m = B3.dmm(b, 'dmm', [8, 2], dm, leads);
        B3.stopwatch(b, 'sw', [26, 6], sw);
        /* the circuit: the box, the meter, the leads */
        c.reset();
        c.R(T.A, 'box.N', R1);
        c.V(T.B, 'box.N', E, R2);
        c.C(T.C, 'box.N', Cap, 'cap'); c.R(T.C, 'box.N', Rleak);
        m.stamp(c); leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.05)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-6);
        m.read(c);
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
