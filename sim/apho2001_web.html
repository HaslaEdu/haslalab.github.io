<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

function meterFace(b,i,t){ const [x,y,w,h]=b, k="dmm"+(i+1); fillR(x,y,w,h,8,i?"#3a8fd5":"#e3b72d","#555",1.5); fillR(x+w*0.05,y+h*0.05,w*0.9,h*0.72,6,"#2a2d33");
  fillR(x+w*0.10,y+h*0.10,w*0.8,h*0.22,4,"#9fae8f","#5f6b52"); const s=meterShow(i); if(s!==null){ lcd(s,x+w*0.12,y+h*0.13,w*0.62,h*0.16,"#1b1d20","rgba(0,0,0,.04)"); text(MODES[ST.mode[i]].unit,x+w*0.80,y+h*0.22,"#1b1d20",Math.max(10,h*0.06),"center","700"); }
  Object.keys(MLAB).forEach((md,j)=>{ const bx=x+w*0.08+j*w*0.172, by=y+h*0.40, bw=w*0.16, bh=h*0.14; fillR(bx,by,bw,bh,3,ST.mode[i]===md?"#f2c14e":"#3a3d42","#111"); text(MLAB[md],bx+bw/2,by+bh/2,ST.mode[i]===md?"#1b1d20":"#e8eef2",Math.max(8,h*0.045),"center","700"); hitAdd("md:"+i+":"+md,bx,by,bw,bh); });
  text(t.lab.dmm+" "+(i+1),x+w/2,y+h*0.66,"#e8eef2",Math.max(10,h*0.055),"center","700"); text("COM",TPOS["M"+(i+1)+"-"][0],TPOS["M"+(i+1)+"-"][1]-16,"#e8eef2",10,"center"); text("V·mA",TPOS["M"+(i+1)+"+"][0],TPOS["M"+(i+1)+"+"][1]-16,"#e8eef2",10,"center"); }
function drawWire(){ const t=d(); ctx.fillStyle="#e9e7e0"; ctx.fillRect(0,0,CLW,CLH); const B=geo();
  if(has("cellbox")){ const [x,y,w,h]=B.cellbox; fillR(x,y,w,h,8,"#1b1d20","#555",1.5); fillR(x+w*0.08,y+h*0.12,w*0.2,h*0.4,2,ST.boxCover?"#11151a":"#3b3a6a"); text(t.lab.box,x+w*0.62,y+h*0.3,"#e8eef2",Math.max(10,h*0.07),"center","700"); text("+",TPOS["C+"][0],TPOS["C+"][1]-16,"#e8eef2",12,"center","700"); text("−",TPOS["C-"][0],TPOS["C-"][1]-16,"#e8eef2",12,"center","700"); }
  if(has("bat")){ const [x,y,w,h]=B.bat; fillR(x,y,w,h,8,"#1b1d20","#555",1.5); fillR(x+w*0.08,y+h*0.15,w*0.84,h*0.16,6,"#c8a24c"); fillR(x+w*0.08,y+h*0.38,w*0.84,h*0.16,6,"#c8a24c"); text("1.5 V × 2",x+w/2,y+h*0.64,"#e8eef2",Math.max(9,h*0.06),"center","700");
    text("+",TPOS["B+"][0],TPOS["B+"][1]-16,"#e8eef2",12,"center","700"); text("−",TPOS["B-"][0],TPOS["B-"][1]-16,"#e8eef2",12,"center","700"); }
  if(has("pot")){ const [x,y,w,h]=B.pot; fillR(x,y,w,h,8,"#2b6cb0","#1b4c80",1.5); const cx2=x+w*0.5, cy2=y+h*0.36, R=Math.min(w,h)*0.22; circ(cx2,cy2,R,"#1b1d20","#000");
    const a=-ST.turns%1*2*Math.PI-Math.PI/2; ctx.strokeStyle="#ffcf3a"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.lineTo(cx2+R*0.9*Math.cos(a),cy2+R*0.9*Math.sin(a)); ctx.stroke(); ctx.lineWidth=1;
    for(let i=0;i<50;i++){ const q=-i/50*2*Math.PI-Math.PI/2, l=i%5===0?R*0.22:R*0.1; ctx.strokeStyle="#e8eef2"; ctx.beginPath(); ctx.moveTo(cx2+R*Math.cos(q),cy2+R*Math.sin(q)); ctx.lineTo(cx2+(R+l)*Math.cos(q),cy2+(R+l)*Math.sin(q)); ctx.stroke(); }
    fillR(cx2-R*0.5,cy2+R*0.35,R,R*0.42,2,"#0d1f12"); text(ST.potBurnt?"--":String(Math.floor(ST.turns+1e-9)),cx2,cy2+R*0.56,"#ffcf3a",Math.max(10,R*0.32),"center","700",MONO);
    hitAdd("potL",cx2-R*1.3,cy2-R*1.3,R*1.3,R*2.6); hitAdd("potR",cx2,cy2-R*1.3,R*1.3,R*2.6); text("0–5 kΩ · 10 turns",x+w/2,y+h*0.08,"#e8eef2",Math.max(9,h*0.05),"center");
    text("1",TPOS.R1[0],TPOS.R1[1]-15,"#e8eef2",11,"center","700"); text(t.lab.wiper,TPOS.RW[0],TPOS.RW[1]-15,"#ffcf3a",10,"center","700"); text("2",TPOS.R2[0],TPOS.R2[1]-15,"#e8eef2",11,"center","700"); }
  for(let i=0;i<2;i++) if(has("dmm"+(i+1))) meterFace(B["dmm"+(i+1)],i,t);
  for(const tm of TERMS){ if(!has(termOwner(tm))) continue; const p=TPOS[tm], col=tm.endsWith("+")||tm==="RW"?"#c0392b":tm.endsWith("-")?"#1f2226":"#c9a64a";
    circ(p[0],p[1],8,col,"#111",1); circ(p[0],p[1],3,"#ddd");
    if(ST.pick===tm){ ctx.strokeStyle="#ffcf3a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p[0],p[1],12,0,7); ctx.stroke(); ctx.lineWidth=1; }
    hitAdd("t:"+tm,p[0]-11,p[1]-11,22,22); }
  ST.leads.forEach(([a,b],i)=>{ const p=TPOS[a], q=TPOS[b]; if(!p||!q) return; const mx2=(p[0]+q[0])/2, my2=Math.max(p[1],q[1])+26+i*5; ctx.strokeStyle=LCOL[i%LCOL.length]; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(mx2,my2,q[0],q[1]); ctx.stroke(); ctx.lineWidth=1; const hx=0.25*p[0]+0.5*mx2+0.25*q[0], hy=0.25*p[1]+0.5*my2+0.25*q[1];
    circ(hx,hy,5,"#fff",LCOL[i%LCOL.length],2); hitAdd("l:"+i,hx-7,hy-7,14,14); });
  if(ST.pick){ const p=TPOS[ST.pick]; ctx.setLineDash([4,4]); ctx.strokeStyle="#888"; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(cmouse[0],cmouse[1]); ctx.stroke(); ctx.setLineDash([]); }
  text(t.lab.wireHint,10,CLH-10,"#555",11,"left"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="wire") drawWire(); else drawRailView(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   5.  HANDS: the bench and the wiring close-up
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ let id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),1))||null; }
const wired=k=>ST.leads.some(([a,b])=>[a,b].some(t=>termOwner(t)===k));
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.cover){ ST.on.add(k); ST.at.shield="cover"; ST.boxCover=true; say("covered"); }
  else if(hand.parent==="rail"){ ST.on.add(k); ST.at[k]="rail"; ST.rail[k]=hand.rail; say("placed",itemName(k)); } else if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
const onRailNow=()=>ONRAIL.filter(o=>has(o)&&onRail(o));
function takeUp(k){ if(wired(k)){ say("unplugFirst"); return false; } if(k==="leads"&&ST.leads.length){ say("unplugAll"); return false; }
  if(k==="rail"&&onRailNow().length){ say("railBusy"); return false; }
  if(k==="cellbox"&&ST.boxCover){ say("uncoverFirst"); return false; }
  if(k==="shield"&&ST.boxCover){ ST.boxCover=false; delete ST.at.shield; ST.on.delete(k); hand={item:k,move:true,cover:true}; say("uncovered"); return true; }
  const b=baseOf(k), par=ST.at[k]; if(par) delete ST.at[k]; hand={item:k,move:true,orig:{x:b.x,y:b.y},parent:par,rail:par==="rail"?ST.rail[k]:null}; ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
/* the optical bench has its place at the back of the table */
const RAILPOS={x:RX0+35,y:RY};
function drop(k,x,y){ if(k==="rail"){ x=RAILPOS.x; y=RAILPOS.y; } ST.pos[k]={x,y}; ST.on.add(k); delete ST.at[k]; say("placed",itemName(k)); return true; }
/* what each carrier takes up along the bench, cm: no two may overlap */
const SPAN={lamp:[-3,3],mount:[-1.5,1.5],cellbox:[-1,9],shield:[-0.8,0.8]};
function railFree(k,pos){ const a=[pos+SPAN[k][0],pos+SPAN[k][1]]; return !ONRAIL.some(o=>o!==k&&has(o)&&onRail(o)&&a[0]<ST.rail[o]+SPAN[o][1]+0.3&&a[1]>ST.rail[o]+SPAN[o][0]-0.3); }
function put(k,t){ if(t==="rail"){ const pos=railPos(k,mouse); if(!railFree(k,pos)){ say("railClash"); return false; } ST.at[k]="rail"; ST.rail[k]=pos; ST.on.add(k); say("onRail",itemName(k),pos.toFixed(1)); return true; }
  if(k==="shield"&&t==="cellbox"){ ST.at.shield="cover"; ST.boxCover=true; ST.on.add(k); say("covered"); return true; }
  return false; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const t=targetAt(k,p); if(t){ if(put(k,t)) hand=null; return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(wired(k)||(k==="leads"&&ST.leads.length)){ say("unplugFirst"); return; } if(k==="rail"&&onRailNow().length){ say("railBusy"); return; } if(k==="cellbox"&&ST.boxCover){ say("uncoverFirst"); return; }
    if(k==="shield"&&ST.boxCover){ ST.boxCover=false; } if(k==="lamp") ST.lampOn=false; delete ST.at[k]; ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the wiring close-up: click a terminal, then another, to join them with a lead; click a lead's handle to unplug it */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(cdrag){ const pos=Math.max(0,Math.min(70,Math.round((cdrag.r0+(cmouse[0]-cdrag.x0)/cdrag.z)*10)/10)); if(railFree(cdrag.k,pos)) ST.rail[cdrag.k]=pos; } });
closeCv.addEventListener("pointerup",()=>{ if(cdrag){ say("onRail",itemName(cdrag.k),ST.rail[cdrag.k].toFixed(1)); cdrag=null; } });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button===2){ ST.pick=null; return; } if(e.button!==0) return;
  if(!h){ ST.pick=null; return; }
  if(h.k.startsWith("md:")){ const [,i,md]=h.k.split(":"); setMode(+i,md); return; }
  if(h.k==="potL"||h.k==="potR"){ turnPot((h.k==="potL"?-1:1)*(e.shiftKey?1:0.1)); return; }
  if(h.k.startsWith("mt:")){ toggleMount(h.k.slice(3)); return; }
  if(h.k==="polL"||h.k==="polR"){ turnPol((h.k==="polL"?-1:1)*(e.shiftKey?1:5)); return; }
  if(h.k.startsWith("rail:")){ const k=h.k.slice(5), z=railMap().z; cdrag={k,x0:p[0],r0:ST.rail[k],z}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k.startsWith("l:")){ const i=+h.k.slice(2); ST.leads.splice(i,1); say("unplugged"); return; }
  if(h.k.startsWith("t:")){ const t=h.k.slice(2);
    if(!has("leads")){ say("needFor",itemName("leads")); ST.pick=null; return; }
    if(!ST.pick){ ST.pick=t; return; } if(ST.pick===t){ ST.pick=null; return; }
    if(ST.leads.length>=12){ say("noLeads"); ST.pick=null; return; } if(ST.leads.some(([a,b])=>(a===ST.pick&&b===t)||(a===t&&b===ST.pick))){ ST.pick=null; return; }
    ST.leads.push([ST.pick,t]); say("joined",ST.pick,t); ST.pick=null; } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function setMode(i,md){ if(!has("dmm"+(i+1))){ say("needFor",itemName("dmm"+(i+1))); return; } ST.mode[i]=md; ST.dispT=0; say("mode"); }
function turnPot(dt){ if(!has("pot")){ say("needFor",itemName("pot")); return; } if(ST.potBurnt){ say("potDead"); return; } ST.turns=Math.max(0,Math.min(10,Math.round((ST.turns+dt)*100)/100)); }
function toggleMount(k){ if(!has("mount")){ say("needFor",itemName("mount")); return; } ST.inMount[k]=!ST.inMount[k]; if(onRail("mount")&&onRail("lamp")&&ST.rail.mount-ST.rail.lamp<8&&ST.inMount[k]) say("tooClose"); else say(ST.inMount[k]?"inserted":"removed"); }
function turnPol(dd){ if(!ST.inMount.P2){ say("noP2"); return; } ST.pol=((Math.round(ST.pol+dd)%360)+360)%360; }
$("lampBtn").onclick=()=>{ if(!has("lamp")){ say("needFor",itemName("lamp")); return; } ST.lampOn=!ST.lampOn; say(ST.lampOn?"lampOn":"lampOff"); };
for(const [id,dv] of [["pm1",-1],["pm01",-0.1],["pp01",0.1],["pp1",1]]) $(id).onclick=()=>turnPot(dv);
for(const [id,dv] of [["am5",-5],["am1",-1],["ap1",1],["ap5",5]]) $(id).onclick=()=>turnPol(dv);
$("newPot").onclick=()=>{ if(!ST.potBurnt){ say("potOk"); return; } ST.potBurnt=false; say("potNew"); };
function updDisp(dt){ ST.dispT-=dt; if(ST.dispT>0) return; ST.dispT=0.4; for(let i=0;i<2;i++){ const r=meterRaw(i); if(r===null) continue; const m=MODES[ST.mode[i]], lsd=m.full<2?0.001:0.01; ST.disp[i]=r+(Math.random()-0.5)*1.2*lsd; } }
function meterShow(i){ if(!has("dmm"+(i+1))) return null; const m=MODES[ST.mode[i]]; if(!m) return null; const v=ST.disp[i]; if(Math.abs(v)>m.full) return "1   "; const s=Math.abs(v).toFixed(m.full<2?3:2); return (v<0&&Math.abs(v)>=(m.full<2?0.0005:0.005)?"-":"")+s; }
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), f=i=>{ const s=meterShow(i); return s===null?"—":s.replace("1   ","OL")+" "+MODES[ST.mode[i]].unit; };
  const line=rows+")  M1 "+f(0)+"   M2 "+f(1)+($("cfg").value.trim()?"   "+$("cfg").value.trim():"");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(); for(let i=0;i<2;i++){ const s=meterShow(i); $("d_m"+(i+1)).textContent=(s===null?"—":s.replace("1   ","1 .  ").trim()+" "+MODES[ST.mode[i]].unit); }
  $("lampBtn").textContent=ST.lampOn?t.lampOff:t.lampOn; $("lampBtn").className=ST.lampOn?"on":""; $("dPot").textContent=ST.potBurnt?t.burnt:ST.turns.toFixed(2)+" "+t.turnsU; $("dPol").textContent=ST.inMount.P2?ST.pol.toFixed(0)+"°":"—";
  $("dDist").textContent=onRail("lamp")&&onRail("cellbox")?t.dist((ST.rail.cellbox-ST.rail.lamp).toFixed(1)):"—"; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(ST.pick),false]);
  if(ST.potBurnt) L.push([t.st.burnt,true]);
  for(let i=0;i<2;i++) if(meterShow(i)==="1   ") L.push([t.st.over(i+1),true]);
  if(ST.lampOn&&onRail("mount")&&onRail("lamp")&&ST.rail.mount-ST.rail.lamp<8&&Object.values(ST.inMount).some(v=>v)) L.push([t.st.hot,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-m","hM"],["t-h-l","hL"],["lHint","lHint"],["t-h-pot","hPot"],["newPot","newPot"],["potHint","potHint"],["t-h-pol","hPol"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; updDisp(dt);
  if(frameN%10===0&&potPower()>0.25){ ST.potBurnt=true; say("burnt"); }
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
