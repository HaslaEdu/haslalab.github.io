<style>
  /* the look of opho.physoly.org (2026): near-black ground, lime accent, Helvetica + Roboto Mono */
  :root{--bg:#161512;--surface:#1c1717;--card:#1f1b1a;--line:rgba(255,255,255,.12);--fg:#fff;--dim:rgba(255,255,255,.62);
        --faint:rgba(255,255,255,.38);--acc:#a7e26e;--accd:#86c24f;--mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
        --sans:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
  body{font:400 14px/1.55 var(--sans);
       background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
       background-size:48px 48px}
  .wrap{max-width:1140px;margin:0 auto;padding:22px 18px 40px}
  .glow{position:fixed;inset:-30vh auto auto -20vw;width:70vw;height:70vh;background:radial-gradient(closest-side,rgba(110,190,80,.20),transparent);pointer-events:none;z-index:0}
  .top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font:400 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}
  .eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
  h1{font:300 clamp(30px,4.4vw,48px)/1.05 var(--sans);letter-spacing:-.025em;margin:10px 0 10px}
  .lead{max-width:640px;color:var(--dim);font-size:14px;margin:0}
  .lang{display:flex;gap:6px}
  .lang button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:29px;padding:7px 14px;font:500 12px var(--sans);cursor:pointer}
  .lang button.on{background:var(--acc);border-color:var(--acc);color:#000}
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:14px;margin-top:22px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px}
  .card.hi{background:linear-gradient(180deg,rgba(167,226,110,.10),rgba(167,226,110,.02));border-color:rgba(167,226,110,.35)}
  .card h2{font:400 18px/1.3 var(--sans);margin:4px 0 12px}
  .tag{font:400 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .fld{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
  .fld label{font-size:13px;color:var(--dim)}
  .fld input,.fld select,.fld textarea{width:150px;background:#120f0e;border:1px solid var(--line);border-radius:6px;color:var(--fg);
       font:400 13px var(--mono);padding:7px 9px;outline:none}
  .fld input:focus,.fld textarea:focus{border-color:var(--acc)}
  .wide input,.wide textarea{width:100%}
  .wide{display:block}.wide label{display:block;margin-bottom:5px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#000;border:0;border-radius:29px;
       padding:10px 18px;font:500 14px var(--sans);cursor:pointer;width:100%;margin-top:10px}

    <div><span class="eyebrow" data-t="eb"></span><h1 data-t="h1"></h1><p class="lead" data-t="lead"></p></div>

      <div class="row"><button class="btn" id="go" data-t="start"></button><button class="btn ghost" id="stp" data-t="step"></button></div>

      <hr class="sep">

      <div class="fld"><label data-t="shape"></label><select id="shape"></select></div>
      <button class="btn ghost" id="clear" data-t="clear"></button>
      <hr class="sep">
      <div class="fld"><label data-t="plot"></label><select id="plot"><option value="curl" data-t="pCurl"></option><option value="speed" data-t="pSpeed"></option><option value="ux" data-t="pUx"></option><option value="uy" data-t="pUy"></option><option value="rho" data-t="pRho"></option></select></div>

      <div class="chk"><input type="checkbox" id="lines"><label for="lines" data-t="lines"></label></div>

        <div><span data-t="tStep"></span><b id="rt">0</b></div>
        <div><span>ρ</span><b id="rr">—</b></div>

      <div class="stat" id="stat"></div>
      <hr class="sep">
      <div class="fld"><label data-t="every"></label><input id="every" value="100"></div>
      <div class="row"><button class="btn ghost" id="rec" data-t="recOn"></button><button class="btn ghost" id="csv" data-t="csv"></button><button class="btn ghost" id="wipe" data-t="wipe"></button></div>
      <pre class="out" id="out"></pre>
    </div>
  </div>
  <p class="foot" data-t="foot"></p>
</div>
<script>
"use strict";
/* a small dark plot, in the colours of the OPhO site */
function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(r))), m=r/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function fmtTick(v,st){ const d=Math.max(0,-Math.floor(Math.log10(st)+1e-9)); return (Math.abs(v)<st/1e6?0:v).toFixed(Math.min(6,d)); }
function plotXY(cv,series,o){
  o=o||{}; const dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||800, H=Math.round(W*(o.aspect||0.5));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#100d0c"; c.fillRect(0,0,W,H);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of series) for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)) continue;
    x0=Math.min(x0,s.x[i]); x1=Math.max(x1,s.x[i]); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  if(!isFinite(x0)){x0=0;x1=1;y0=0;y1=1;}
  if(o.xlim){x0=o.xlim[0];x1=o.xlim[1];} if(o.ylim){y0=o.ylim[0];y1=o.ylim[1];}
  if(x1<=x0){x1=x0+1;} if(y1<=y0){y0-=0.5;y1+=0.5;}
  if(!o.ylim){ const p=(y1-y0)*0.06; y0-=p; y1+=p; }
  const L=58,R=14,T=14,B=38, pw=W-L-R, ph=H-T-B;
  if(o.equal){ const sx=(x1-x0)/pw, sy=(y1-y0)/ph, s=Math.max(sx,sy); x1=x0+s*pw; y1=y0+s*ph; }
  const X=v=>L+pw*(v-x0)/(x1-x0), Y=v=>T+ph*(1-(v-y0)/(y1-y0));
  c.font="11px 'Roboto Mono',monospace"; c.lineWidth=1;
  const sx=niceStep((x1-x0)/8), sy=niceStep((y1-y0)/6);
  c.strokeStyle="rgba(255,255,255,.08)"; c.fillStyle="rgba(255,255,255,.6)";
  c.textAlign="center"; c.textBaseline="top";
  for(let v=Math.ceil(x0/sx)*sx;v<=x1+1e-12;v+=sx){ c.beginPath(); c.moveTo(X(v),T); c.lineTo(X(v),T+ph); c.stroke(); c.fillText(fmtTick(v,sx),X(v),T+ph+5); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=Math.ceil(y0/sy)*sy;v<=y1+1e-12;v+=sy){ c.beginPath(); c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); c.stroke(); c.fillText(o.logy?"1e"+fmtTick(v,sy):fmtTick(v,sy),L-6,Y(v)); }
  c.strokeStyle="rgba(255,255,255,.28)"; c.strokeRect(L,T,pw,ph);
  c.fillStyle="rgba(255,255,255,.75)"; c.textAlign="center"; c.textBaseline="alphabetic"; c.fillText(o.xl||"",L+pw/2,H-6);
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.fillText(o.yl||"",0,0); c.restore();
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  for(const s of series){ c.strokeStyle=c.fillStyle=s.color||"#a7e26e"; c.lineWidth=s.lw||1.4;
    if(s.mode==="dot"){ for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(s.y[i]):s.y[i]; c.beginPath(); c.arc(X(s.x[i]),Y(y),s.r||2.4,0,7); c.fill(); } }
    else{ c.beginPath(); let st=false; for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)){st=false;continue;} const px=X(s.x[i]),py=Y(y); st?c.lineTo(px,py):c.moveTo(px,py); st=true; } c.stroke(); } }
  c.restore();
  let ly=T+14; c.textAlign="left"; c.textBaseline="alphabetic";
  for(const s of series) if(s.label){ c.fillStyle=s.color||"#a7e26e"; c.fillRect(L+10,ly-8,10,3); c.fillStyle="rgba(255,255,255,.8)"; c.fillText(s.label,L+26,ly-3); ly+=15; }
  return {X,Y,L,T,pw,ph,x0,x1,y0,y1};
}
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download=name; a.click(); }

const T={
 ko:{eb:"OPhO 2022 Invitational · 실험 문제",h1:"유체역학 (Fluid Dynamics)",
   lead:"격자 볼츠만 방법으로 2차원 유체를 흘려 보내는 풍동입니다. 마우스로 장벽을 그리고 시작을 누르면, 왼쪽에서 오른쪽으로 흐르는 유체가 장벽을 돌아 나갑니다. 센서를 켜면 그 자리의 밀도 ρ와 속도 u<sub>x</sub>, u<sub>y</sub>가 숫자로 나오고, 시간에 따라 기록할 수도 있습니다.",
   inT:"시뮬레이션 설정",size:"격자 크기",u0:"흐름 속력 u₀",nu:"점성 ν",spf:"스텝 / 화면",start:"시작 ▶",pause:"정지 ❚❚",step:"한 스텝",reset:"유체 초기화",
   mouse:"마우스로",mDraw:"장벽 그리기",mErase:"장벽 지우기",shape:"장벽 모양",clear:"장벽 모두 지우기",
   plot:"그림",pCurl:"소용돌이도 (curl)",pSpeed:"속력",pUx:"x 속도",pUy:"y 속도",pRho:"밀도",contrast:"대비",lines:"유선 (Flowlines)",sensor:"센서 (Sensor)",
   help:"문제지대로 기본 설정(흐름 속력 0.100, 점성 0.020)을 바꾸지 마세요. 격자가 클수록 정확하지만 느립니다. 낮은 해상도에서 장벽을 그린 뒤 높은 해상도로 바꿔 돌려도 장벽은 그대로 옮겨집니다. 센서는 십자 표시를 끌어 옮깁니다. 모든 값은 격자 단위(격자 간격 = 1, 한 스텝 = 1)입니다.",
   outT:"풍동",tStep:"시간 스텝",every:"기록 간격 (스텝)",recOn:"센서 기록 시작",recOff:"센서 기록 멈춤",csv:"CSV 내려받기",wipe:"기록 지우기",
   sps:" 스텝/초",unstable:"계산이 불안정해져 유체를 초기화했습니다. 흐름 속력을 줄이거나 점성을 늘리세요.",
   shapes:["짧은 선","긴 선","대각선","완만한 대각선","작은 원","큰 원","선과 스포일러","원과 스포일러","직각","쐐기","날개꼴"],
   foot:"<b>모형</b> — D2Q9 격자 볼츠만(BGK) 방법: 매 스텝 각 칸의 분포 함수를 평형 분포 쪽으로 이완(ω = 1/(3ν + ½))시킨 뒤 이웃 칸으로 흘려 보내고, 장벽에서는 튕겨 냅니다(bounce-back). 네 가장자리는 매 스텝 밀도 1, 속도 (u₀, 0)의 평형 상태로 되돌립니다. 주최측은 이 문제에 D. Schroeder의 공개 웹 앱(physics.weber.edu/schroeder/fluids)을 쓰도록 했습니다. 주최측이 직접 만든 프로그램은 아니며, 여기서는 같은 알고리즘과 기본값으로 HaslaLab이 다시 만들었습니다."},
 en:{eb:"OPhO 2022 Invitational · Experimental",h1:"Fluid Dynamics",
   lead:"A two-dimensional wind tunnel run by the lattice-Boltzmann method. Draw barriers with the mouse and press start; the fluid flows from left to right around them. Switch the sensor on to read the density ρ and the velocity u<sub>x</sub>, u<sub>y</sub> at its position, and record them over time.",
   inT:"Simulation",size:"grid size",u0:"flow speed u₀",nu:"viscosity ν",spf:"steps / frame",start:"Start ▶",pause:"Pause ❚❚",step:"Step",reset:"Reset fluid",
   mouse:"mouse",mDraw:"draw barriers",mErase:"erase barriers",shape:"barrier shape",clear:"Clear barriers",
   plot:"plot",pCurl:"curl",pSpeed:"speed",pUx:"x velocity",pUy:"y velocity",pRho:"density",contrast:"contrast",lines:"Flowlines",sensor:"Sensor",
   help:"Keep the default settings (flow speed 0.100, viscosity 0.020), as the problem asks. A larger grid is more accurate but slower; barriers drawn at a low resolution carry over when you switch to a higher one. Drag the cross to move the sensor. Everything is in lattice units (cell size = 1, one step = 1).",
   outT:"Wind tunnel",tStep:"time step",every:"record every (steps)",recOn:"Start recording",recOff:"Stop recording",csv:"Download CSV",wipe:"Clear record",
   sps:" steps/s",unstable:"The simulation went unstable and the fluid was reset. Lower the flow speed or raise the viscosity.",
   shapes:["Short line","Long line","Diagonal","Shallow diagonal","Small circle","Large circle","Line with spoiler","Circle with spoiler","Right angle","Wedge","Airfoil"],
   foot:"<b>Model</b> — the D2Q9 lattice-Boltzmann (BGK) method: every step each cell's distribution relaxes towards equilibrium (ω = 1/(3ν + ½)) and then streams to its neighbours, bouncing back off barriers. The four edges are reset every step to equilibrium at density 1 and velocity (u₀, 0). The organisers had this problem done on D. Schroeder's public web app (physics.weber.edu/schroeder/fluids), which they did not write themselves; this page rebuilds it by HaslaLab with the same algorithm and defaults."}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=i=>document.getElementById(i);
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{ const k=e.dataset.t; if(d[k]!==undefined) e.innerHTML=d[k]; });
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":"";
  if(typeof onLang==="function") onLang(); }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

const SIZES=[[600,240],[300,120],[200,80],[150,60],[120,48],[100,40],[75,30],[60,24]];
const EX=[0,1,0,-1,0,1,-1,-1,1], EY=[0,0,1,0,-1,1,1,-1,-1], W9=[4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36], OPP=[0,3,4,1,2,7,8,5,6];
let NX,NY,N,F,G,BAR,RHO,UX,UY,t=0,running=false,sensor=[0,0],rec=false,rows=[],img=null,buf=null,bctx=null,lastSps=0,stepsDone=0,lastT=performance.now();
const num=(id,lo,hi,d)=>{ const v=parseFloat($(id).value); return isFinite(v)?Math.max(lo,Math.min(hi,v)):d; };
function setup(nx,ny,keep){
  const old=keep&&BAR?{b:BAR,nx:NX,ny:NY}:null;
  NX=nx; NY=ny; N=NX*NY; F=new Float64Array(9*N); G=new Float64Array(9*N); BAR=new Uint8Array(N);
  RHO=new Float64Array(N); UX=new Float64Array(N); UY=new Float64Array(N);
  if(old){ for(let y=0;y<NY;y++) for(let x=0;x<NX;x++){ const ox=Math.floor(x*old.nx/NX), oy=Math.floor(y*old.ny/NY); BAR[y*NX+x]=old.b[oy*old.nx+ox]; } }
  buf=document.createElement("canvas"); buf.width=NX; buf.height=NY; bctx=buf.getContext("2d"); img=bctx.createImageData(NX,NY);
  if(!keep) sensor=[Math.round(NX*0.75),Math.round(NY*0.5)]; else sensor=[Math.min(NX-1,Math.round(sensor[0])),Math.min(NY-1,Math.round(sensor[1]))];
  initFluid();
}
function eqInto(A,i,rho,ux,uy){ const u2=ux*ux+uy*uy;
  for(let k=0;k<9;k++){ const eu=EX[k]*ux+EY[k]*uy; A[k*N+i]=W9[k]*rho*(1+3*eu+4.5*eu*eu-1.5*u2); } }
function initFluid(){ const u0=num("u0",0,0.12,0.1); for(let i=0;i<N;i++){ eqInto(F,i,1,u0,0); RHO[i]=1; UX[i]=u0; UY[i]=0; } t=0; }
function moments(){ for(let i=0;i<N;i++){ let r=0,mx=0,my=0; for(let k=0;k<9;k++){ const f=F[k*N+i]; r+=f; mx+=EX[k]*f; my+=EY[k]*f; } RHO[i]=r; UX[i]=r>0?mx/r:0; UY[i]=r>0?my/r:0; } }
function step(){
  const u0=num("u0",0,0.12,0.1), om=1/(3*num("nu",0.005,0.2,0.02)+0.5);
  /* the edges: back to equilibrium at density 1 and velocity (u0, 0) */
  for(let x=0;x<NX;x++){ eqInto(F,x,1,u0,0); eqInto(F,(NY-1)*NX+x,1,u0,0); }
  for(let y=1;y<NY-1;y++){ eqInto(F,y*NX,1,u0,0); eqInto(F,y*NX+NX-1,1,u0,0); }
  /* collide */
  for(let i=0;i<N;i++){ if(BAR[i]) continue;
    let r=0,mx=0,my=0; for(let k=0;k<9;k++){ const f=F[k*N+i]; r+=f; mx+=EX[k]*f; my+=EY[k]*f; }
    const ux=mx/r, uy=my/r, u2=ux*ux+uy*uy; RHO[i]=r; UX[i]=ux; UY[i]=uy;
    for(let k=0;k<9;k++){ const eu=EX[k]*ux+EY[k]*uy, j=k*N+i; F[j]+=om*(W9[k]*r*(1+3*eu+4.5*eu*eu-1.5*u2)-F[j]); } }
  /* stream (pull), bouncing back off barriers */
  for(let y=0;y<NY;y++) for(let x=0;x<NX;x++){ const i=y*NX+x;
    for(let k=0;k<9;k++){ const sx=x-EX[k], sy=y-EY[k];
      if(sx<0||sx>=NX||sy<0||sy>=NY){ G[k*N+i]=F[k*N+i]; continue; }
      const s=sy*NX+sx; G[k*N+i]=BAR[s]?F[OPP[k]*N+i]:F[k*N+s]; } }
  const tmp=F; F=G; G=tmp; t++;
}
const COOL=[[0,[32,140,220]],[0.5,[16,13,12]],[1,[240,140,60]]], SEQ=[[0,[16,13,12]],[0.5,[60,120,40]],[1,[200,240,150]]];
function cmap(m,v){ v=Math.max(0,Math.min(1,v)); for(let k=1;k<m.length;k++) if(v<=m[k][0]){ const a=m[k-1],b=m[k],f=(v-a[0])/(b[0]-a[0]); return [0,1,2].map(c=>a[1][c]+(b[1][c]-a[1][c])*f); } return m[m.length-1][1]; }
function draw(){
  const kind=$("plot").value, cf=Math.pow(1.2,parseInt($("contrast").value)||0), u0=num("u0",0,0.12,0.1)||0.1, d=img.data;
  for(let y=0;y<NY;y++) for(let x=0;x<NX;x++){ const i=y*NX+x, p=4*((NY-1-y)*NX+x); let c;
    if(BAR[i]) c=[232,232,226];
    else{ let v;
      if(kind==="curl"){ const xl=Math.max(0,x-1), xr=Math.min(NX-1,x+1), yd=Math.max(0,y-1), yu=Math.min(NY-1,y+1);
        v=0.5+cf*12*((UY[y*NX+xr]-UY[y*NX+xl])-(UX[yu*NX+x]-UX[yd*NX+x])); c=cmap(COOL,v); }
      else if(kind==="speed"){ v=cf*Math.hypot(UX[i],UY[i])/(2*u0); c=cmap(SEQ,v); }
      else if(kind==="ux"){ v=0.5+cf*(UX[i]-u0)/(2*u0); c=cmap(COOL,v); }
      else if(kind==="uy"){ v=0.5+cf*UY[i]/(2*u0); c=cmap(COOL,v); }
      else { v=0.5+cf*(RHO[i]-1)*10; c=cmap(COOL,v); } }
    d[p]=c[0]; d[p+1]=c[1]; d[p+2]=c[2]; d[p+3]=255; }
  bctx.putImageData(img,0,0);
  const cv=$("fluid"), dpr=Math.min(devicePixelRatio||1,2), Wc=cv.clientWidth||760, Hc=Math.round(Wc*NY/NX);
  if(cv.width!==Math.round(Wc*dpr)||cv.height!==Math.round(Hc*dpr)){ cv.width=Math.round(Wc*dpr); cv.height=Math.round(Hc*dpr); cv.style.height=Hc+"px"; }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.imageSmoothingEnabled=false; c.drawImage(buf,0,0,Wc,Hc);
  const s=Wc/NX;
  if($("lines").checked){ c.strokeStyle="rgba(255,255,255,.55)"; c.lineWidth=1; c.beginPath(); const sp=Math.max(1,Math.round(10/s));
    for(let y=sp>>1;y<NY;y+=sp) for(let x=sp>>1;x<NX;x+=sp){ const i=y*NX+x; if(BAR[i]) continue; const L=sp*s*0.9/(u0*2);
      const px=(x+0.5)*s, py=(NY-1-y+0.5)*s, dx=UX[i]*L, dy=-UY[i]*L; c.moveTo(px-dx/2,py-dy/2); c.lineTo(px+dx/2,py+dy/2); } c.stroke(); }
  if($("sensor").checked){ const px=(sensor[0]+0.5)*s, py=(NY-1-sensor[1]+0.5)*s; c.strokeStyle="#a7e26e"; c.lineWidth=1.5;
    c.beginPath(); c.arc(px,py,7,0,7); c.moveTo(px-12,py); c.lineTo(px+12,py); c.moveTo(px,py-12); c.lineTo(px,py+12); c.stroke(); }
  readout();
}
function readout(){ $("rt").textContent=t;
  if($("sensor").checked){ const i=sensor[1]*NX+sensor[0]; $("rr").textContent=RHO[i].toFixed(4); $("rx").textContent=UX[i].toFixed(4); $("ry").textContent=UY[i].toFixed(4); }
  else { $("rr").textContent=$("rx").textContent=$("ry").textContent="—"; } }
function record(){ if(!rec||!$("sensor").checked) return; const ev=Math.max(1,parseInt($("every").value)||100);
  if(t%ev===0){ const i=sensor[1]*NX+sensor[0]; rows.push([t,sensor[0],sensor[1],RHO[i],UX[i],UY[i]]); if(rows.length>20000) rows.shift(); } }
const text=()=>"t, x, y, rho, ux, uy\n"+rows.map(r=>[r[0],r[1],r[2],r[3].toFixed(5),r[4].toFixed(5),r[5].toFixed(5)].join(", ")).join("\n");
let shownRows=0;
function showRows(){ if(rows.length===shownRows) return; shownRows=rows.length; const tail=rows.slice(-400); $("out").textContent="t, x, y, rho, ux, uy\n"+tail.map(r=>[r[0],r[1],r[2],r[3].toFixed(5),r[4].toFixed(5),r[5].toFixed(5)].join(", ")).join("\n"); $("out").scrollTop=1e9; }
function healthy(){ for(let k=0;k<N;k+=97) if(!isFinite(RHO[k])||RHO[k]<0||RHO[k]>3) return false; return true; }
function frame(){
  if(running){ const n=Math.max(1,Math.min(200,parseInt($("spf").value)||20)); for(let k=0;k<n;k++){ step(); record(); } stepsDone+=n;
    if(!healthy()){ initFluid(); running=false; $("go").innerHTML=T[lang].start; $("stat").textContent=T[lang].unstable; } }
  const now=performance.now(); if(now-lastT>1000){ lastSps=stepsDone*1000/(now-lastT); stepsDone=0; lastT=now; if(running) $("stat").textContent=NX+" × "+NY+"  ·  "+Math.round(lastSps)+T[lang].sps; }
  draw(); showRows(); requestAnimationFrame(frame);
}
/* barrier presets, after the shapes of the original app, scaled to the grid */
function preset(k){ BAR.fill(0); const H=NY, cx=Math.round(NX/3), cy=Math.round(NY/2), put=(x,y)=>{ x=Math.round(x); y=Math.round(y); if(x>0&&x<NX-1&&y>0&&y<NY-1) BAR[y*NX+x]=1; };
  const line=(x0,y0,x1,y1)=>{ const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))+1; for(let i=0;i<=n;i++) put(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n); };
  const disc=(r)=>{ for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r) put(cx+x,cy+y); };
  const L=H/8;
  if(k===0) line(cx,cy-L,cx,cy+L);
  else if(k===1) line(cx,cy-2*L,cx,cy+2*L);
  else if(k===2) line(cx-L,cy-L,cx+L,cy+L);
  else if(k===3) line(cx-2*L,cy-L/2,cx+2*L,cy+L/2);
  else if(k===4) disc(Math.round(H/12));
  else if(k===5) disc(Math.round(H/6));
  else if(k===6){ line(cx,cy-L,cx,cy+L); line(cx,cy+L,cx+L,cy+L); }
  else if(k===7){ disc(Math.round(H/12)); line(cx,cy,cx+2*L,cy); }
  else if(k===8){ line(cx,cy-L,cx,cy+L); line(cx,cy+L,cx+2*L,cy+L); }
  else if(k===9){ for(let i=0;i<=2*L;i++){ line(cx+i,cy-i/2,cx+i,cy+i/2); } }
  else if(k===10){ const c=4*L, th=0.12; for(let i=0;i<=c;i++){ const xx=i/c, yt=5*th*(0.2969*Math.sqrt(xx)-0.126*xx-0.3516*xx*xx+0.2843*xx**3-0.1015*xx**4)*c;
      const a=-0.15, X=cx-c/2+i, Y=cy+(i-c/2)*a; line(X,Y-yt,X,Y+yt); } }
  initFluid(); }
/* mouse: draw or erase barriers, or drag the sensor */
let drag=null, lastCell=null;
function cellAt(e){ const r=$("fluid").getBoundingClientRect(); return [Math.floor((e.clientX-r.left)/r.width*NX), NY-1-Math.floor((e.clientY-r.top)/r.height*NY), e.clientX-r.left, e.clientY-r.top, r.width/NX]; }
function paint(a,b){ const v=$("mouse").value==="draw"?1:0, n=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))+1;
  for(let i=0;i<=n;i++){ const x=Math.round(a[0]+(b[0]-a[0])*i/n), y=Math.round(a[1]+(b[1]-a[1])*i/n); if(x>0&&x<NX-1&&y>0&&y<NY-1){ const j=y*NX+x; if(BAR[j]!==v){ BAR[j]=v; if(!v) eqInto(F,j,1,num("u0",0,0.12,0.1),0); } } } }
$("fluid").addEventListener("pointerdown",e=>{ const c=cellAt(e); $("fluid").setPointerCapture(e.pointerId);
  if($("sensor").checked){ const s=c[4], px=(sensor[0]+0.5)*s, py=(NY-1-sensor[1]+0.5)*s; if(Math.hypot(c[2]-px,c[3]-py)<14){ drag="sensor"; return; } }
  drag="paint"; lastCell=c; paint(c,c); });
$("fluid").addEventListener("pointermove",e=>{ if(!drag) return; const c=cellAt(e);
  if(drag==="sensor") sensor=[Math.max(0,Math.min(NX-1,c[0])),Math.max(0,Math.min(NY-1,c[1]))]; else { paint(lastCell,c); lastCell=c; } });
const up=()=>{ drag=null; }; $("fluid").addEventListener("pointerup",up); $("fluid").addEventListener("pointercancel",up);
$("go").onclick=()=>{ running=!running; $("go").innerHTML=running?T[lang].pause:T[lang].start; if(running) $("stat").textContent=""; };
$("stp").onclick=()=>{ step(); record(); };
$("reset").onclick=()=>initFluid();
$("clear").onclick=()=>{ BAR.fill(0); initFluid(); };
$("shape").onchange=()=>preset(parseInt($("shape").value));
$("size").onchange=()=>{ const s=SIZES[parseInt($("size").value)]; setup(s[0],s[1],true); };
$("rec").onclick=()=>{ rec=!rec; $("rec").innerHTML=rec?T[lang].recOff:T[lang].recOn; if(rec&&!$("sensor").checked){ $("sensor").checked=true; } };
$("csv").onclick=()=>rows.length&&download("sensor_data.csv",text(),"text/csv");
$("wipe").onclick=()=>{ rows=[]; shownRows=-1; $("out").textContent=""; };
function onLang(){ const d=T[lang];
  $("size").innerHTML=SIZES.map((s,i)=>`<option value="${i}">${s[0]} × ${s[1]}</option>`).join(""); $("size").value=String(SIZES.findIndex(s=>s[0]===NX));
  const sv=$("shape").value; $("shape").innerHTML=d.shapes.map((n,i)=>`<option value="${i}">${n}</option>`).join(""); $("shape").value=sv||"0";
  $("go").innerHTML=running?d.pause:d.start; $("rec").innerHTML=rec?d.recOff:d.recOn; }
setup(200,80,false); preset(0); applyLang(); requestAnimationFrame(frame);
</script>
