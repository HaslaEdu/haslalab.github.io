<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;

  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;

/* ------------------------------------------------------------------
   Replay a Tk canvas dump.  The desktop programs draw these pages with
   Tk canvas items, so the dump carries their exact coordinates, fills,
   outlines, widths, dashes, fonts and anchors, and this paints them
   back the same way.  Nothing here is a redrawing by eye.
   ------------------------------------------------------------------ */
function tkSize(spec){
  const m = String(spec || "").match(/-?\d+/);
  return Math.round((m ? Math.abs(parseInt(m[0], 10)) : 8) * 1.34);
}
function tkFont(spec){
  if (!spec) return "11px 'Segoe UI',sans-serif";
  const s = String(spec);
  let size = 11, bold = false, italic = false, fam = "'Segoe UI',sans-serif";
  const m = s.match(/-?\d+/);
  if (m) size = Math.abs(parseInt(m[0], 10));
  if (/bold/i.test(s)) bold = true;
  if (/italic/i.test(s)) italic = true;
  if (/Consolas|Courier|monospace|TkFixed/i.test(s))
    fam = "Consolas,ui-monospace,monospace";
  return (italic ? "italic " : "") + (bold ? "bold " : "")
         + Math.round(size * 1.34) + "px " + fam;
}
function tkAnchor(a){
  return {n:["center","top"], s:["center","alphabetic"],
          e:["right","middle"], w:["left","middle"],
          ne:["right","top"], nw:["left","top"],
          se:["right","alphabetic"], sw:["left","alphabetic"],
          center:["center","middle"]}[a] || ["center","middle"];
}
function tkSmooth(c, p, close){
  /* Tk's smooth line is a quadratic B-spline through the midpoints */
  if (p.length < 6){ p.forEach((v, i) => { if (i % 2 === 0)
      i ? c.lineTo(p[i], p[i+1]) : c.moveTo(p[i], p[i+1]); }); return; }
  c.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length - 2; i += 2)
    c.quadraticCurveTo(p[i], p[i+1], (p[i] + p[i+2]) / 2,
                       (p[i+1] + p[i+3]) / 2);
  c.lineTo(p[p.length-2], p[p.length-1]);
  if (close) c.closePath();
}
function tkPlay(c, dump){
  c.save();
  c.fillStyle = dump.bg || "#41454a";
  c.fillRect(0, 0, dump.w, dump.h);
  for (const it of dump.items){
    const p = it.c;
    if (it.t === "rectangle"){
      const [x0, y0, x1, y1] = p;
      if (it.f){ c.fillStyle = it.f; c.fillRect(x0, y0, x1 - x0, y1 - y0); }
      if (it.o && it.w > 0){ c.strokeStyle = it.o; c.lineWidth = it.w;
        c.strokeRect(x0, y0, x1 - x0, y1 - y0); }
    } else if (it.t === "oval"){
      const [x0, y0, x1, y1] = p;
      c.beginPath();
      c.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2,
                Math.abs(y1 - y0) / 2, 0, 0, 6.2832);
      if (it.f){ c.fillStyle = it.f; c.fill(); }
      if (it.o && it.w > 0){ c.strokeStyle = it.o; c.lineWidth = it.w;
        c.stroke(); }
    } else if (it.t === "polygon"){
      c.beginPath();
      if (it.sm) tkSmooth(c, p, true);
      else { for (let i = 0; i < p.length; i += 2)
        i ? c.lineTo(p[i], p[i+1]) : c.moveTo(p[i], p[i+1]);
        c.closePath(); }
      if (it.f){ c.fillStyle = it.f; c.fill(); }
      if (it.o && it.w > 0){ c.strokeStyle = it.o; c.lineWidth = it.w;
        c.stroke(); }
    } else if (it.t === "line"){
      c.beginPath();
      if (it.sm) tkSmooth(c, p, false);
      else { for (let i = 0; i < p.length; i += 2)
        i ? c.lineTo(p[i], p[i+1]) : c.moveTo(p[i], p[i+1]); }
      c.strokeStyle = it.f || "#000";
      c.lineWidth = it.w || 1;
      c.lineCap = it.cap === "round" ? "round" : "butt";
      if (it.d) c.setLineDash(String(it.d).trim().split(/\s+/)

    } else if (it.t === "arc"){
      const [x0, y0, x1, y1] = p;

      if (it.f){ c.fillStyle = it.f; c.fill(); }

  c.restore();

const G_UB = 9.804, L_PEND = 0.315405;
const E_YOUNG = 200e9, NU = 0.30;
const E_RED = 1 / (2 * (1 - NU * NU) / E_YOUNG);
const C_TAU = 2.755;
const C_SOUND = 5180.0;          /* m/s, sqrt(E'/rho) as the organisers use */
const E_REDUCED = E_RED;
/* The measured contact stiffness of the real balls sits about 10% above
   the ideal Hertz value (finite half space, surface curvature, oxide
   film).  Using it here makes the simulated contact time reproduce the
   official Part D table, while the students still analyse their data
   with the nominal E = 200 GPa / nu = 0.3 from the question sheet. */
const E_CONTACT = E_RED * 1.1220;
const BALLS = [{d: 31.75e-3, m: 131.48e-3, name: "big"},
               {d: 25.42e-3, m: 67.55e-3, name: "small"}];

for (let k = -9; k <= 1; k++) for (const v of [1, 2, 5]) TDIV.push(v * 10 ** k);
TDIV.push(100);
const VDIV = [5e-4];
for (let k = -3; k <= 0; k++) for (const v of [1, 2, 5]) VDIV.push(v * 10 ** k);
VDIV.push(10);

const NX = 14, NY = 8, V_LOW = -0.1;

/* Canvas sizing.  Everything is drawn in CSS pixels; the backing store
   is devicePixelRatio times bigger, which is what keeps the lettering on
   the instrument sharp instead of the blurry upscale a fixed-size canvas
   gives on a high-resolution screen. */
function fit(cv, w, h, k){
  const dpr = k || Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return c;
}

function gauss(rng){ let u = 0, v = 0;
  while (!u) u = rng(); while (!v) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tlab(v){ return v >= 1 ? v.toFixed(0) + " s"
  : v >= 1e-3 ? (v * 1e3).toPrecision(3) / 1 + " ms"
  : v >= 1e-6 ? (v * 1e6).toPrecision(3) / 1 + " us"
  : (v * 1e9).toPrecision(3) / 1 + " ns"; }
function mlab(n){ return n >= 1e6 ? (n / 1e6) + "M" : (n / 1e3) + "k"; }
function fslab(f){ return f >= 1e9 ? (f / 1e9).toFixed(2) + " GSa/s"
  : f >= 1e6 ? (f / 1e6).toFixed(2) + " MSa/s" : (f / 1e3).toFixed(0) + " kSa/s"; }

/* ===================================================================
   The bench.  This is Bench.simulate of the desktop program, ported
   line for line and checked against it: on five geometries the step
   counts, the gate crossings and the contact intervals come out
   identical, and the ball positions agree to 2e-10 m.

   The model the page used before had neither spin, nor friction at the
   contact, nor a wire that could go slack, and it stepped at a fixed
   0.4 microseconds whenever the balls were within 4 mm of each other,
   whatever their closing speed.  That cost so many steps that it hit
   its own 4e6 step ceiling after 13.6 s and the pendulum stopped dead.
   The step here is sized by the Hertzian contact time instead, so the
   whole 300 s of swing costs about a tenth of what 13.6 s used to.
   =================================================================== */
function hertzContactTime(m1, m2, R1, R2, v) {
  if (v <= 0) return null;
  const mu = m1 * m2 / (m1 + m2);
  const Rs = R1 * R2 / (R1 + R2);
  return C_TAU * Math.pow(mu * mu / (Rs * E_REDUCED * E_REDUCED * v), 0.2);
}
function sphereModeFrequency(R) { return 0.844 * C_SOUND / (2.0 * R); }

/* Bench carries the geometry; simulate() is the integrator.  The random
   draws (wire ring amplitude and frequency) are handed in so that a
   session can randomise them however it likes and a cross-check can pin
   them to the Python values. */
class BenchCore {
  constructor(o) {
    this.g = G_UB;
    this.R1 = o.R1; this.R2 = o.R2;
    this.m1 = o.m1; this.m2 = o.m2;
    this.l = o.l.slice();
    this.xh = o.xh.slice();
    this.active2 = o.active2;
    this.phi0 = o.phi0;
    this.x_gate = o.x_gate;
    this.air = o.air;
    this.amp_w = o.amp_w;
    this.f_w = o.f_w;
  }
  kContact() {
    return (4.0 / 3.0) * E_CONTACT
           * Math.sqrt(this.R1 * this.R2 / (this.R1 + this.R2));
  }
  centre(i, th) {
    const l = this.l[i], x = this.xh[i];
    return [x + l * Math.sin(th), -l * Math.cos(th)];
  }
  /* static equilibrium of the pair, by the same crude descent the
     desktop program uses - the answer is what matters, not the route */
  equilibrium() {
    if (!this.active2) return [0.0, 0.0];
    const R1 = this.R1, R2 = this.R2, k = 1.0e7, self = this;
    const energy = th => {
      const c1 = self.centre(0, th[0]), c2 = self.centre(1, th[1]);
      let u = -self.m1 * self.g * self.l[0] * Math.cos(th[0])
              - self.m2 * self.g * self.l[1] * Math.cos(th[1]);
      const d = Math.hypot(c2[0] - c1[0], c2[1] - c1[1]);
      const ov = (R1 + R2) - d;
      if (ov > 0) u += 0.4 * k * Math.pow(ov, 2.5);
      return u;
    };
    let th = [0.0, 0.0], step = 2e-3, e0 = energy(th);
    for (let it = 0; it < 300; it++) {
      const gr = [];
      for (let j = 0; j < 2; j++) {
        const tp = th.slice(); tp[j] += 1e-7;
        gr.push((energy(tp) - e0) / 1e-7);
      }
      const gn = Math.hypot(gr[0], gr[1]) || 1.0;
      let moved = false;
      for (let q = 0; q < 30; q++) {
        const cand = [th[0] - step * gr[0] / gn, th[1] - step * gr[1] / gn];
        const e1 = energy(cand);
        if (e1 < e0) { th = cand; e0 = e1; moved = true; break; }
        step *= 0.5;
      }
      if (!moved || step < 1e-10) break;
      step *= 1.6;
    }
    return th;
  }

  simulate(tmax, frameDt, init, maxSteps) {
    frameDt = frameDt || 0.004;
    maxSteps = maxSteps || 2000000;
    const R1 = this.R1, R2 = this.R2, m1 = this.m1, m2 = this.m2;
    const Is1 = 0.4 * m1 * R1 * R1, Is2 = 0.4 * m2 * R2 * R2;
    const l1 = this.l[0], l2 = this.l[1];
    const k = this.kContact(), two = this.active2, mu_f = 0.15;
    const th_eq = this.equilibrium();
    const P1 = [this.xh[0], 0.0], P2 = [this.xh[1], 0.0];
    const a1 = -this.phi0 * Math.PI / 180.0;
    let p1 = [P1[0] + l1 * Math.sin(a1), -l1 * Math.cos(a1)];
    let p2 = [P2[0] + l2 * Math.sin(th_eq[1]), -l2 * Math.cos(th_eq[1])];
    let v1 = [0, 0], v2 = [0, 0], sp1 = 0, sp2 = 0;
    if (init) {
      p1 = init[0].slice(); v1 = init[1].slice();
      p2 = init[2].slice(); v2 = init[3].slice();
      sp1 = init[4]; sp2 = init[5];
    }
    const amp_w = this.amp_w, f_w = this.f_w, z_gate = -l1;
    let c_hc = 0.0, dt_c = 2.0e-7, t_c0 = 0.0, tau_est = 1.0e-4;
    const Rsum = R1 + R2, air = this.air, gg = this.g;
    const CQ1 = 0.5 * 1.204 * 0.47 * Math.PI * R1 * R1;
    const CQ2 = 0.5 * 1.204 * 0.47 * Math.PI * R2 * R2;

    const framesT = [], frames = [];
    const gateEdges = [], contactEdges = [], impacts = [];
    let gatePrev = null, fPrev = 0.0, ovPrev = -1.0;
    let inContact = false, t = 0.0, nextFrame = 0.0, steps = 0;

    /* the force vectors and the per-ball pack are reused: allocating
       them inside the loop made the collector the biggest single cost
       in the whole integration */
    const F1 = [0.0, 0.0], F2 = [0.0, 0.0];
    const pack = [[P1, p1, v1, m1, l1, F1, CQ1],
                  [P2, p2, v2, m2, l2, F2, CQ2]];
    while (t < tmax && steps < maxSteps) {
      steps++;
      F1[0] = 0.0; F1[1] = -m1 * gg;
      F2[0] = 0.0; F2[1] = -m2 * gg;
      let Tq1 = 0.0, Tq2 = 0.0, ov = -1.0, ddot = 0.0;
      if (two) {
        const dx = p2[0] - p1[0], dz = p2[1] - p1[1];
        const d = Math.hypot(dx, dz) || 1e-12;
        ov = Rsum - d;
        const nx = dx / d, nz = dz / d;
        ddot = -((v2[0] - v1[0]) * nx + (v2[1] - v1[1]) * nz);
        if (ov > 0.0) {
          if (!inContact) {
            const v_imp = Math.max(Math.abs(ddot), 0.01);
            /* hardened steel: the restitution is not quite 1 and it
               falls as the impact gets harder */
            const e_rest = Math.min(0.990, 1.0 - 0.038 * Math.pow(v_imp, 0.25));
            c_hc = 3.0 * (1.0 - e_rest) / (2.0 * v_imp);
            tau_est = hertzContactTime(m1, m2, R1, R2, v_imp);
            dt_c = Math.min(Math.max(tau_est / 400.0, 2.0e-8), 2.0e-6);
            t_c0 = t;
            const tx0 = -nz, tz0 = nx;
            const vt = (v2[0] - v1[0]) * tx0 + (v2[1] - v1[1]) * tz0;
            impacts.push([t, Math.atan2(Math.abs(vt), v_imp)]);
          }
          const Fn = Math.max(k * Math.pow(ov, 1.5) * (1.0 + c_hc * ddot), 0.0);
          const tx = -nz, tz = nx;
          const d1x = R1 * nx, d1z = R1 * nz;
          const d2x = -R2 * nx, d2z = -R2 * nz;
          const u1x = v1[0] + sp1 * (-d1z), u1z = v1[1] + sp1 * d1x;
          const u2x = v2[0] + sp2 * (-d2z), u2z = v2[1] + sp2 * d2x;
          const ut = (u1x - u2x) * tx + (u1z - u2z) * tz;
          const Ft = -mu_f * Fn * Math.tanh(ut / 0.005);
          const f1x = -Fn * nx + Ft * tx, f1z = -Fn * nz + Ft * tz;
          const f2x = Fn * nx - Ft * tx, f2z = Fn * nz - Ft * tz;
          F1[0] += f1x; F1[1] += f1z;
          F2[0] += f2x; F2[1] += f2z;
          Tq1 = d1x * f1z - d1z * f1x;
          Tq2 = d2x * f2z - d2z * f2x;
        }
      }

      /* the time step: fine only while a contact is actually happening,
         and sized by the Hertzian contact time rather than fixed */
      let dt;
      if (ov > 0.0) {
        dt = ((t - t_c0) < 6.0 * tau_est) ? dt_c : 2.0e-4;
      } else if (two && ov > -4.0e-3) {
        dt = Math.min(Math.max(0.04 * (-ov) / Math.max(Math.abs(ddot), 1e-3),
                               4.0e-7), 2.0e-4);
      } else {
        dt = two ? 4.0e-4 : 8.0e-4;
      }

      for (let i = 0; i < 2; i++) {
        const P = pack[i][0], p = pack[i][1], v = pack[i][2];
        const m = pack[i][3], l = pack[i][4], F = pack[i][5], cq = pack[i][6];
        const vmag = Math.hypot(v[0], v[1]);
        F[0] -= (air * m + cq * vmag) * v[0];
        F[1] -= (air * m + cq * vmag) * v[1];
        let rx = p[0] - P[0], rz = p[1] - P[1];
        let rn = Math.hypot(rx, rz) || 1e-12;
        let hx = rx / rn, hz = rz / rn;
        if (rn >= l - 1e-9) {
          const vr = v[0] * hx + v[1] * hz;
          const vt2 = Math.max(v[0] * v[0] + v[1] * v[1] - vr * vr, 0.0);
          const Tn = m * vt2 / l + (F[0] * hx + F[1] * hz);
          if (Tn > 0.0) { F[0] -= Tn * hx; F[1] -= Tn * hz; }
        }
        const E0 = 0.5 * m * (v[0] * v[0] + v[1] * v[1]) + m * gg * p[1];
        const sp0 = Math.hypot(v[0], v[1]);
        const dW = (air * m + cq * sp0) * sp0 * sp0 * dt;
        v[0] += F[0] / m * dt; v[1] += F[1] / m * dt;
        p[0] += v[0] * dt;     p[1] += v[1] * dt;
        rx = p[0] - P[0]; rz = p[1] - P[1];
        rn = Math.hypot(rx, rz) || 1e-12;
        if (rn > l) {
          hx = rx / rn; hz = rz / rn;
          p[0] = P[0] + hx * l; p[1] = P[1] + hz * l;
          const vr = v[0] * hx + v[1] * hz;
          if (vr > 0.0) { v[0] -= vr * hx; v[1] -= vr * hz; }
        }
        /* projecting the wire constraint quietly eats energy: put back
           exactly what the step was not supposed to lose */
        if (ov <= 0.0) {
          const ke = E0 - dW - m * gg * p[1];
          const vsq = v[0] * v[0] + v[1] * v[1];
          if (ke > 0.0 && vsq > 1e-16) {
            const sc = Math.sqrt(2.0 * ke / (m * vsq));
            if (sc > 0.5 && sc < 2.0) { v[0] *= sc; v[1] *= sc; }
          }
        }
      }
      sp1 += Tq1 / Is1 * dt;
      sp2 += Tq2 / Is2 * dt;
      t += dt;

      /* the photogate, with the edge interpolated inside the step */
      const wire = amp_w * Math.exp(-t / 0.16) * Math.sin(2 * Math.PI * f_w * t);
      const xb = p1[0] + wire;
      const fNow = (Math.abs(p1[1] - z_gate) < 0.020)
        ? R1 - Math.abs(xb - this.x_gate) : -1.0;
      const inside = fNow > 0.0;
      if (gatePrev === null) { gatePrev = inside; fPrev = fNow; }
      else {
        if (inside !== gatePrev) {
          const den = fPrev - fNow;
          const fr = Math.abs(den) > 1e-15 ? fPrev / den : 0.5;
          gateEdges.push([t - dt + Math.min(Math.max(fr, 0), 1) * dt, inside]);
          gatePrev = inside;
        }
        fPrev = fNow;
      }

      const now = ov > 0.0;
      if (now !== inContact) {
        const den = ovPrev - ov;
        const fr = Math.abs(den) > 1e-18 ? ovPrev / den : 0.5;
        contactEdges.push([t - dt + Math.min(Math.max(fr, 0), 1) * dt, now]);
        inContact = now;
      }
      ovPrev = ov;

      if (t >= nextFrame) {
        framesT.push(t);
        frames.push([p1[0], p1[1], p2[0], p2[1], sp1, sp2]);
        nextFrame += frameDt;
      }
    }

    const toIntervals = edges => {
      const out = []; let start = null;
      for (const e of edges) {
        if (e[1] && start === null) start = e[0];
        else if (!e[1] && start !== null) { out.push([start, e[0]]); start = null; }
      }
      return out;
    };
    return {
      t: framesT, p: frames,
      gate: toIntervals(gateEdges), contact: toIntervals(contactEdges),
      impacts: impacts, th_eq: th_eq, steps: steps,
      f_vib: sphereModeFrequency(Math.min(R1, R2)),
      psi: impacts.length ? impacts[0][1] : 0.0,
    };
  }
}


/* the page's own wrapper: geometry from the sliders, one cached
   equilibrium, and the session's random draws */
class Bench {
  constructor(seed){
    const rng = mulberry(seed);
    this.rng = rng; this.serial = seed;
    this.ball = [0, 0];
    this.two = false;
    this.gap = 0; this.dz = 0;
    this.phi0 = 70;
    this.xGate = 0;
    this.air = 0.0025;
    this.tScale = 1 + 0.004 * gauss(rng);      /* gate timing bias */
    /* the wire rings after the ball is let go: drawn once a session */
    this.ampW = 1.4e-3 * (1 + 0.25 * gauss(rng));
    this.fW = 11.5 * (1 + 0.08 * gauss(rng));
    this._eqKey = null; this._eq = [0, 0];
  }
  R(i){ return BALLS[this.ball[i]].d / 2; }
  M(i){ return BALLS[this.ball[i]].m; }
  hang(){
    const R1 = this.R(0), R2 = this.R(1);
    return [-R1 - this.gap * 5e-4, R2 + this.gap * 5e-4];
  }
  wire(){ return [this.l0(), this.l0() - this.dz * 1e-3]; }
  l0(){ return L_PEND; }

  core(){
    const xh = this.hang(), l = this.wire();
    return new BenchCore({
      R1: this.R(0), R2: this.R(1), m1: this.M(0), m2: this.M(1),
      l: l, xh: xh, active2: this.two, phi0: this.phi0,
      x_gate: xh[0] + this.xGate * 1e-3, air: this.air,
      amp_w: this.ampW, f_w: this.fW });
  }

  /* The static equilibrium is a little gradient descent and costs more
     than a second of integration does, so it is worked out once per
     geometry and handed to every chunk that follows. */
  equilibrium(){
    const k = [this.ball[0], this.ball[1], this.two, this.gap, this.dz].join();
    if (this._eqKey !== k){ this._eqKey = k; this._eq = this.core().equilibrium(); }
    return this._eq;
  }

  run(tmax, init){
    const c = this.core();
    const eq = this.equilibrium();
    c.equilibrium = () => eq;               /* use the cached one */
    const r = c.simulate(tmax, 0.004, init);
    /* the photogate has a small timing bias of its own */
    r.gate = r.gate.map(g => [g[0] * this.tScale, g[1] * this.tScale]);
    return r;
  }

  /* the state at the end of a stretch, so the next one can carry on */
  static tail(res){
    const n = res.p.length;
    if (n < 2) return null;
    const f = res.p[n - 1], a = res.p[n - 2];
    const dt = Math.max(res.t[n - 1] - res.t[n - 2], 1e-9);
    return [[f[0], f[1]], [(f[0] - a[0]) / dt, (f[1] - a[1]) / dt],
            [f[2], f[3]], [(f[2] - a[2]) / dt, (f[3] - a[3]) / dt],
            f[4], f[5]];
  }
}

/* ---- the acquisition chain -------------------------------------- */
function pulseSignal(pulses, vhi, rise, noise, rng){
  return function(t){
    let v = V_LOW;
    for (const [a, b] of pulses){
      if (t < a - rise || t > b + rise) continue;
      const up = 0.5 * (1 + Math.tanh((t - a) / (0.35 * rise)));
      const dn = 0.5 * (1 - Math.tanh((t - b) / (0.35 * rise)));
      v = Math.max(v, V_LOW + (vhi - V_LOW) * up * dn);
    }
    return v + noise * (rng() - 0.5);
  };
}

/* the sample rate snaps to the 1-2-2.5-5 sequence, as the instrument
   does, and is capped at the real 1 GSa/s */
function snapFs(fs){
  fs = Math.min(fs, FS_MAX);
  if (fs <= 1) return 1;
  const dec = Math.pow(10, Math.floor(Math.log10(fs)));
  let best = dec / 10;
  for (const d of [dec / 10, dec, dec * 10])
    for (const m of [1, 2, 2.5, 5]){
      const c = m * d;
      if (c <= fs * (1 + 1e-9) && c > best) best = c;
    }
  return best;
}
function sinc(x){
  if (Math.abs(x) < 1e-9) return 1;
  const y = Math.PI * x;
  return Math.sin(y) / y;
}
/* sin(x)/x reconstruction of the frozen record, which is the Siglent
   default and the reason a feature only one or two samples wide comes
   back as a hump instead of an edge */
function sinxx(rec, t0, fs, t, ntaps){
  ntaps = ntaps || 16;
  const idx = (t - t0) * fs, k0 = Math.floor(idx);
  let out = 0;
  for (let j = -ntaps; j <= ntaps; j++){
    const k = k0 + j;
    if (k < 0 || k >= rec.length) continue;
    const u = idx - k;
    out += rec[k] * sinc(u) * sinc(u / (ntaps + 1));
  }
  return out;
}

/* straight lines between the samples (Acquire > Interpolation: x) */
function linInterp(rec, t0, fs, t){ const u = (t - t0) * fs, k = Math.floor(u); if (k < 0) return rec[0]; if (k >= rec.length - 1) return rec[rec.length - 1]; return rec[k] + (rec[k + 1] - rec[k]) * (u - k); }
class Run {
  constructor(res, source, rng){
    this.res = res; this.source = source;
    if (source === "photogate"){
      this.pulses = res.gate; this.vhi = 5.0;
      this.sig = pulseSignal(res.gate, 5.0, 1.3e-4, 0.02, rng);
      this.feature = 1.3e-4;
    } else {
      this.pulses = res.contact; this.vhi = 4.0;
      this.sig = pulseSignal(res.contact, 4.0, 2e-6, 0.012, rng);
      this.feature = res.contact.length
        ? Math.min(...res.contact.map(c => c[1] - c[0])) : null;
    }
    this.t0 = this.pulses.length ? this.pulses[0][0] : 0;
    this.rec = null;
  }
  /* Build the record the way the instrument does: sample the analog
     signal at the snapped rate, then quantise it to 8 bits over the
     eight vertical divisions.  That quantisation and the analog noise
     are what put a floor under how well a contact time can be read. */
  /* Continuous acquisition: when the window just captured has run out,
     arm again on the first pulse after it, which is what the instrument
     does between sweeps in Run. */
  retrigger(tdiv, vdiv, mem, build){
    const end = this.t0 + this.recT0 + this.n / this.fs;
    const nxt = this.pulses.find(q => q[0] > end);
    if (!nxt) return false;
    this.t0 = nxt[0];
    this.chain(tdiv, vdiv, mem, build);
    return true;
  }

  chain(tdiv, vdiv, mem, build){
    const span = NX * tdiv;
    this.fs = snapFs(mem / span);
    this.n = Math.floor(Math.min(mem, Math.max(span * this.fs, 8)));
    this.recT0 = -0.05 * span;
    this.recTdiv = tdiv;
    if (!build){ this.rec = null; return; }
    const full = 8 * vdiv, lsb = full / 256;
    const rec = new Float32Array(this.n);
    for (let k = 0; k < this.n; k++){
      const v = this.sig(this.t0 + this.recT0 + k / this.fs);
      rec[k] = Math.max(-full / 2, Math.min(full / 2,
                                            Math.round(v / lsb) * lsb));
    }
    this.rec = rec;
  }
}

/* A live coil is a magnet: it takes the ball as soon as the circuit is
   made, and drops it the moment the circuit is broken.  Nothing else on

function syncCoil(){
  const live = circuit().coil;

function circuit(){
  const gate = linked("photogate", "box_gate");
  const balls = linked("box_ball", "ball1") && linked("box_ball", "ball2");
  const source = S.srcGate ? (gate ? "photogate" : null) : (balls ? "contact" : null);
  const ch = linked("box_ch", "ch1") ? "ch1"
           : (linked("box_ch", "ch2") ? "ch2" : null);
  const gnd = linked("box_gnd", "gnd");
  const plugged = linked("adaptor", "box_dc") && S.mains;
  const powered = plugged && S.boxOn;      /* the box switch decides */
  const coil = powered && linked("magnet", "box_mag");
  return {source, ch, gnd, plugged, powered, coil,
          live: !!source && !!ch && gnd};
}
function fault(){
  const c = circuit();
  if (!c.source || !c.ch) return "open";
  const ix = c.ch === "ch2" ? 1 : 0;
  if (!S.chOn[ix]) return "wrongch";
  if (S.autoDone && S.trigSrc !== ix) return "trigsrc";
  if (!c.gnd) return "float";
  return null;
}

/* Is CH1 fed by a lead whose ground return is not connected?  A 1 M ohm
   input on the far end of a metre of wire with no return path is an
   aerial, not a probe. */
function floatNow(){
  const c = circuit();
  return c.source !== null && !!c.ch && !c.gnd;
}
/* Is there any path at all from the bench to CH1 and back? */
function noSignalNow(){
  const c = circuit();

}
/* What is wrong with the connection as it stands, in one line. */
function wireHint(){
  const f = fault();
  if (f === "open"){ const g = linked("photogate", "box_gate"), bw = linked("box_ball", "ball1") && linked("box_ball", "ball2");
    if ((S.srcGate && !g && bw) || (!S.srcGate && g && !bw)) return tr("hSel"); return tr("hOpen"); }
  if (f === "wrongch") return tr("hWrongch");

}

/* ---- release and acquisition ------------------------------------ */
function release(){
  const c = circuit();
  if (!c.coil){ warn("no 12 V on the box: plug the adaptor into DC 12V and "
    + "the holder coil into MAGNET on the cabling page."); return; }
  const b = S.bench;
  b.two = document.getElementById("two").checked;
  b.ball = [+document.getElementById("b1").value,
            +document.getElementById("b2").value];
  b.gap = +document.getElementById("gap").value;
  b.dz = +document.getElementById("dz").value;
  b.xGate = +document.getElementById("gate").value;
  b.phi0 = +document.getElementById("phi").value;
  /* Only as much as is needed to start: the rest is added in the
     background.  Computing 40 s of two-ball swing here locked the tab
     up for nearly two seconds on the click that lets the ball go. */
  const res = b.run(b.two ? 3 : 12, null);
  const src = c.source || "photogate";
  const r = new Run(res, src, S.rng);
  const f = fault();
  r.fault = f;
  if (f === "float") spoil(r);
  r.chain(S.tdiv, recVdiv(), MEM[S.memi],
          f === "float" || !rollingNow());
  S.played = r;
  /* A floating input is drawn live by drawFreeRun - there is no point
     building a record out of mains hum - and nothing is captured at all
     until Auto Setup has been pressed for the leads that are in. */
  const usable = c.source !== null && !!c.ch && S.trigSrc === (c.ch === "ch2" ? 1 : 0) && c.gnd && S.autoDone;
  S.run = (S.armed && usable && S.trig > 0 && S.trig < r.vhi) ? r : null;
  if (S.run) S.delay = r.recT0 + 0.5 * NX * S.tdiv;
  S.playT = 0; S.playing = true; S.frozen = null;
  S.growing = false;                      /* the tail is grown as it plays */
  S.faultMsg = {open:"nothing is feeding CH1: check the source lead and the "
             + "CH1/2 lead on the cabling page.",
        wrongch:"the lead is in a channel that is switched off: press its channel key.",
        trigsrc:"the trigger is taken from the other channel: press Auto Setup, or set the source in Trigger Setup.",
        float:"the ground lead is missing, so the input is floating: what "
              + "you see is mains pickup and drift, not your signal."}[f] || "";

function spoil(r){
  const base = r.sig, ph = Math.random() * 6.283;
  r.sig = t => 0.55 * base(t)
    + 3.1 * Math.sin(6.283 * 50 * t + ph)
    + 0.9 * Math.sin(6.283 * 150 * t + 2 * ph)
    + 1.6 * Math.sin(6.283 * 0.27 * t + ph)
    + 0.25 * (Math.sin(t * 9.1e5) + Math.sin(t * 1.37e6 + 1));
  r.feature = null;
}
/* Carry on from the state the bench is already in.  Hanging the second
   pendulum, or moving the gate, while the first ball is still swinging
   is perfectly possible on the bench, and the collisions that follow
   have to be recorded like any others. */
function liveState(){
  const r = S.played.res, t = Math.max(0, Math.min(S.playT,
                                                   r.t[r.t.length - 1]));
  let i = 1; while (i < r.t.length - 1 && r.t[i] < t) i++;
  const a = r.p[i - 1], b2 = r.p[i];
  const dt = Math.max(r.t[i] - r.t[i - 1], 1e-9);
  /* the balls carry their own spin now, so it has to be carried across
     too: hanging the second pendulum while the first is still turning
     must not quietly stop it turning */
  return [[b2[0], b2[1]], [(b2[0]-a[0])/dt, (b2[1]-a[1])/dt],
          [b2[2], b2[3]], [(b2[2]-a[2])/dt, (b2[3]-a[3])/dt],
          b2[4], b2[5]];
}
function restartFrom(){
  const st = liveState(), b = S.bench;
  const res = b.run(b.two ? 3 : 12, st);   /* the rest grows as it plays */
  const c = circuit();
  const r = new Run(res, c.source || "photogate", S.rng);
  r.fault = fault();
  if (r.fault === "float") spoil(r);
  r.chain(S.tdiv, recVdiv(), MEM[S.memi],
          r.fault === "float" || !rollingNow());
  S.played = r;
  /* A floating input is drawn live by drawFreeRun - there is no point
     building a record out of mains hum - and nothing is captured at all
     until Auto Setup has been pressed for the leads that are in. */
  const usable = c.source !== null && !!c.ch && S.trigSrc === (c.ch === "ch2" ? 1 : 0) && c.gnd && S.autoDone;
  S.run = (S.armed && usable && S.trig > 0 && S.trig < r.vhi) ? r : null;
  if (S.run) S.delay = r.recT0 + 0.5 * NX * S.tdiv;
  S.playT = 0; S.playing = true; S.frozen = null;
}

function armNow(){
  if (!S.autoDone) return false;       /* not set up for these leads */                       /* switch the scope on mid-swing */
  const p = S.played, c = circuit();
  if (!p || !p.pulses.length) return false;
  if (c.source === null || !c.ch || S.trigSrc !== (c.ch === "ch2" ? 1 : 0)) return false;
  if (!(S.trig > 0 && S.trig < p.vhi)) return false;
  const nxt = p.pulses.find(q => q[0] > S.playT + 0.02);
  if (!nxt) return false;
  p.t0 = nxt[0];
  p.chain(S.tdiv, recVdiv(), MEM[S.memi], !rollingNow());
  S.run = p; S.delay = p.recT0 + 0.5 * NX * S.tdiv;
  S.armed = S.cont;
  return true;
}

  c.fillStyle = "#1f4f9c"; c.font = "bold " + (0.024 * IW).toFixed(1) + "px Segoe UI";
  c.fillText("SIGLENT", 0.052 * IW, 0.055 * IH + 10);
  c.fillStyle = "#55565a"; c.font = (0.017 * IW).toFixed(1) + "px Segoe UI";
  c.fillText("SDS 1202X-E", 0.20 * IW, 0.052 * IH + 10);
  c.fillText("200 MHz   1 GSa/s", 0.42 * IW, 0.052 * IH + 10);
  /* glass */
  const [gx, gy, gw, gh] = grat();
  c.fillStyle = "#000"; c.fillRect(SX0, SY0, SW, SH);
  c.fillStyle = C_BAR;
  c.fillRect(SX0, SY0, SW, SH * BAR_T);
  c.fillRect(SX0 + gw, SY0, SW - gw, SH);
  if (!S.power){
    /* dark glass: no graticule, no readouts, just the black screen */
    for (const k in KNOBS) drawKnob(c, k);
    for (const b in BTNS) drawBtn(c, b);
    drawPanel(c);
    document.getElementById("mpos").textContent = tr("scopeoff");
    return;
  }
  /* graticule 14 x 8 */
  c.strokeStyle = "#39463a"; c.lineWidth = 0.6; c.setLineDash([1, 3]);
  c.beginPath();
  for (let i = 0; i <= NX; i++){ const x = gx + i * gw / NX;
    c.moveTo(x, gy); c.lineTo(x, gy + gh); }
  for (let j = 0; j <= NY; j++){ const y = gy + j * gh / NY;
    c.moveTo(gx, y); c.lineTo(gx + gw, y); }
  c.stroke(); c.setLineDash([]);
  /* status bar */
  c.fillStyle = "#fff"; c.fillRect(SX0 + 2, SY0 + 1, 0.070 * IW, SH * BAR_T - 2);
  c.fillStyle = "#000"; c.font = "bold " + (0.0125 * IW).toFixed(1) + "px Segoe UI";
  c.fillText("SIGLENT", SX0 + 5, SY0 + SH * BAR_T - 4);
  const st = S.power ? scopeState() : ["", "#000"];
  c.fillStyle = st[1]; c.font = "bold " + (0.0145 * IW).toFixed(1) + "px Consolas";
  c.fillText(st[0], SX0 + 0.078 * IW, SY0 + SH * BAR_T - 4);
  c.fillStyle = "#e6e6e6"; c.font = (0.0125 * IW).toFixed(1) + "px Consolas";
  c.fillText("M " + tlab(S.tdiv) + "/   Delay:" + S.delay.toFixed(3) + "s",
             SX0 + 0.155 * IW, SY0 + SH * BAR_T - 4);
  /* sidebar */
  c.fillStyle = "#e6e6e6"; c.font = (0.0115 * IW).toFixed(1) + "px Consolas";
  const r = S.run;
  c.fillText("Sa " + (r ? fslab(r.fs) : "----"), SX0 + gw + 3, gy + 0.030 * IH);
  c.fillText("Curr " + mlab(MEM[S.memi]), SX0 + gw + 3, gy + 0.055 * IH);
  c.fillStyle = "#e8c020";
  c.fillText("CH1  " + S.vdiv + "V/", SX0 + gw + 3, gy + 0.090 * IH);
  c.fillText("L " + S.trig.toFixed(2) + " V", SX0 + gw + 3, gy + 0.115 * IH);
  /* trace, unless the instrument is switched off.  A floating input is
     a mess whatever the sweep is doing, and an instrument that has not
     been Auto Set since the leads changed is not locked to anything. */
  if (S.power){
    if (!S.frozen && (S.cont || S.armed) && floatNow())
      drawFreeRun(c, gx, gy, gw, gh, true);
    else if (!S.frozen && S.cont && (!S.autoDone || noSignalNow()))
      drawFreeRun(c, gx, gy, gw, gh, false);
    else drawTrace(c, gx, gy, gw, gh);
  }
  /* bottom bar */
  c.fillStyle = C_TRACE; c.font = (0.013 * IW).toFixed(1) + "px Consolas";
  c.fillText("M " + tlab(S.tdiv) + "   CH1 = " + S.vdiv + " V   M Pos = "
             + S.delay.toFixed(6) + " s", SX0 + 4, SY0 + SH - 6);
  drawPanel(c);
}

function drawPanel(c){
  /* ---- the panel, laid out like the instrument ---------------- */
  drawGroup(c, 0.6329, 0.7859, 0.3089, 0.7098, "Vertical");
  drawGroup(c, 0.7859, 0.8993, 0.3089, 0.7098, "Horizontal");
  drawGroup(c, 0.8993, 0.9726, 0.3089, 0.7098, "Trigger");
  drawGroup(c, 0.6300, 0.8700, 0.1500, 0.3100, "");
  drawGroup(c, 0.0490, 0.4880, 0.1710, 0.2780, "");
  /* softkeys under the screen, Menu On/Off, USB and power */
  for (let i = 0; i < 6; i++)
    plate(c, 0.1230 + i * 0.0688, 0.2192, 0.0465, 0.0386);
  ring(c, 0.0567, 0.2279, 0.0140, S.power ? "#7cc45c" : "#c2c2bf");
  lab(c, 0.0567, 0.2279 + 0.045, "Power");
  lab(c, 0.0567, 0.2279 - 0.045, "On/Off");
  c.fillStyle = "#3b3f44";
  c.fillRect(0.5330 * IW, (1 - 0.2430) * IH, 0.0400 * IW, 0.0420 * IH);
  /* the three inputs */
  for (const [fx, col, xy, num] of [[0.6418, "#f2c500", "X", "1"],
                                    [0.7457, "#e86ab4", "Y", "2"],
                                    [0.8496, "#9a9a97", "", "Ext"]]){
    const x = fx * IW, y = (1 - 0.2341) * IH, r = 0.0191 * IW;
    c.fillStyle = "#c2c2bf"; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
    c.strokeStyle = "#8d8d8a"; c.lineWidth = 1.4; c.stroke();
    c.fillStyle = "#4a4a48"; c.beginPath(); c.arc(x, y, r * 0.62, 0, 6.283);
    c.fill();
    c.fillStyle = "#d8d8d5"; c.beginPath(); c.arc(x, y, r * 0.22, 0, 6.283);
    c.fill();
    c.fillStyle = col === "#9a9a97" ? "#3a3b3e" : col;
    c.font = "bold " + (0.013 * IW).toFixed(1) + "px Segoe UI";
    c.textAlign = "center";
    c.fillText(num, x + 0.012 * IW, y - r - 0.014 * IH);
    if (xy){ c.fillStyle = "#3a3b3e";
      c.fillText(xy, x - r - 0.008 * IW, y - r - 0.014 * IH); }
    c.textAlign = "left";
  }
  lab(c, 0.7457, 0.1700, "All inputs : 1 M\u03a9 / 16 pF   400 Vpk", "#2f6fa8");
  /* the knob legends, as printed on the case */
  lab(c, 0.6431, 0.8170 - 0.050, "Intensity");
  lab(c, 0.6431, 0.8170 - 0.078, "Adjust");
  lab(c, 0.6431, 0.6339 - 0.048, "Variable");
  lab(c, 0.6960, 0.3798, "Position");
  lab(c, 0.8508, 0.6401 - 0.058, "Zoom");
  lab(c, 0.8508, 0.4300, "Position");
  lab(c, 0.9464, 0.4300, "Level");
  for (const fx of [0.6431, 0.7476, 0.8508]) lab(c, fx, 0.3110, "Zero");
  lab(c, 0.9464, 0.3110, "50%");
  for (const k in KNOBS) drawKnob(c, k);
  for (const b in BTNS) drawBtn(c, b);
  warn(S.faultMsg || sampleWarn());
  const rr2 = S.run;
  document.getElementById("mpos").textContent =
    "M Pos = " + S.delay.toFixed(7) + " s      " + tlab(S.tdiv) + "/div      "
    + mlab(MEM[S.memi]) + "      " + (rr2 ? fslab(rr2.fs) : "");
}
function drawGroup(c, fx0, fx1, fy0, fy1, title){
  const x = fx0 * IW, y = (1 - fy1) * IH;
  const w = (fx1 - fx0) * IW, h = (fy1 - fy0) * IH;
  c.strokeStyle = "#7ec8e8"; c.lineWidth = 1;
  rr(c, x, y, w, h, 5); c.stroke();
  if (!title) return;
  c.fillStyle = "#3a3b3e";
  c.font = "bold " + (0.0135 * IW).toFixed(1) + "px Segoe UI";
  c.textAlign = "center";
  c.fillText(title, x + w / 2, y - 0.012 * IH);
  c.textAlign = "left";
}
function plate(c, fx, fy, fw, fh){
  const x = fx * IW - fw * IW / 2, y = (1 - fy) * IH - fh * IH / 2;
  c.fillStyle = "#e8e8e6"; rr(c, x, y, fw * IW, fh * IH, 3); c.fill();
  c.strokeStyle = "#a9a9a6"; c.lineWidth = 0.7; c.stroke();
}
function ring(c, fx, fy, fr, col){
  const x = fx * IW, y = (1 - fy) * IH;
  c.fillStyle = col || "#d2d2cf";
  c.beginPath(); c.arc(x, y, fr * IW, 0, 6.283); c.fill();
  c.strokeStyle = "#a9a9a6"; c.lineWidth = 1; c.stroke();
}
function lab(c, fx, fy, t, col){
  c.fillStyle = col || "#55565a";
  c.font = (0.0105 * IW).toFixed(1) + "px Segoe UI";
  c.textAlign = "center";
  c.fillText(t, fx * IW, (1 - fy) * IH);
  c.textAlign = "left";
}
function scopeState(){
  if (S.frozen) return ["Stop", "#ff4040"];
  /* with a floating input the sweep does fire - on the hum */
  if ((S.cont || S.armed) && floatNow())
    return Math.abs(S.trig) < 5.0 ? ["Trig'd", "#ffd23a"] : ["Auto", "#40ff40"];
  if (S.cont && (!S.autoDone || noSignalNow())) return ["Auto", "#40ff40"];
  if (!S.run) return !S.armed ? ["Stop", "#ff4040"]
    : (S.mode === "Auto" ? ["Auto", "#40ff40"] : ["Ready", "#40ff40"]);
  if (rolling()) return ["Roll", "#ffd23a"];
  const live = S.playT - S.run.t0;
  if (live <= S.run.recT0) return ["Ready", "#40ff40"];
  if (live < S.run.recT0 + S.run.n / S.run.fs) return ["Trig'd", "#ffd23a"];
  return ["Stop", "#ff4040"];
}
function rollingNow(){
  if (S.run && S.run.fault === "float") return false;
  return S.roll && S.cont && S.tdiv >= ROLL_MIN;
}
function rolling(){
  /* with no ground lead the trace is mains pickup and drift, so it can
     no longer be drawn from the clean pulse train: fall back to the
     spoilt analog signal even at a slow sweep */
  if (S.run && S.run.fault === "float") return false;
  return S.roll && S.cont && S.run && S.played && S.tdiv >= ROLL_MIN;
}
/* The screen when the sweep is not locked to the experiment.

   floating = true
     The ground lead is out.  The mains and its harmonics arrive at
     several volts, the baseline wanders, and the sweep triggers on the
     hum instead of on the photogate.  None of that comes from the
     bench, so it is there whether the pendulum swings or hangs dead
     still - which is exactly how you recognise the fault.

   floating = false
     The leads are right but Auto Setup has not been pressed since they
     were changed.  Nothing is synchronised and each sweep starts
     somewhere else, so the pulses slide across the glass. */
function drawFreeRun(c, gx, gy, gw, gh, floating){
  const npix = 700;
  const X = i => gx + i * gw / npix;
  const Y = v => yOf(v, gy, gh);
  const span = NX * S.tdiv;
  const nowW = ((typeof performance !== "undefined" && performance.now)
                ? performance.now() : Date.now()) / 1000 - S.t0Wall;
  c.save(); c.beginPath(); c.rect(gx, gy, gw, gh); c.clip();
  c.strokeStyle = C_TRACE; c.lineWidth = 1.2; c.beginPath();
  const ys = [];
  if (floating){
    /* enough samples per mains period that a slow sweep really does
       come out as the solid band a real one shows */
    const k = Math.min(Math.max(Math.round(2400 * span / npix), 1), 30);
    const ph = S.junkPh; S.junkPh += 0.37;
    const t0 = nowW + S.rng() * 0.02;
    for (let i = 0; i < npix; i++){
      let lo = 1e9, hi = -1e9;
      for (let q = 0; q < k; q++){
        const t = t0 + (i * k + q) * span / (npix * k);
        const v = 4.6 * Math.sin(2 * Math.PI * 50 * t + ph)
                + 1.8 * Math.sin(2 * Math.PI * 150 * t + 2.1 * ph + 0.7)
                + 0.8 * Math.sin(2 * Math.PI * 250 * t + 1.3)
                + 2.6 * Math.sin(2 * Math.PI * 0.23 * t + 0.4 * ph)
                + 0.35 * Math.sin(2 * Math.PI * 8.7e3 * t)
                + 0.55 * gauss(S.rng);
        if (v < lo) lo = v; if (v > hi) hi = v;
      }
      ys.push(lo, hi);
      const x = X(i);
      i ? c.lineTo(x, Y(lo)) : c.moveTo(x, Y(lo));
      c.lineTo(x, Y(hi));
    }
  } else {
    /* an open or misplugged input has nothing on it but its own noise
       floor, however hard the bench is working */
    const dead = noSignalNow();
    const p = S.played;
    const a0 = S.rng() * Math.max(S.playT, span);
    for (let i = 0; i < npix; i++){
      const ta = a0 + i * span / npix, tb = ta + span / npix;
      let hi = V_LOW;
      if (!dead && p && p.pulses)
        for (const [a, b] of p.pulses)
          if (b >= ta && a <= tb){ hi = p.vhi; break; }
      const nz = 0.02 * gauss(S.rng);
      const lo = V_LOW + nz, hh = hi + nz;
      ys.push(lo, hh);
      const x = X(i);
      i ? c.lineTo(x, Y(lo)) : c.moveTo(x, Y(lo));
      c.lineTo(x, Y(hh));
    }
  }
  c.stroke(); c.restore();
  S.lastTrace = ys;
  /* the trigger level marker, as always */
  c.fillStyle = C_TRACE; c.beginPath();
  const yl = Y(S.trig);
  c.moveTo(gx + gw - 2, yl); c.lineTo(gx + gw - 9, yl - 4);
  c.lineTo(gx + gw - 9, yl + 4); c.closePath(); c.fill();
}

function drawTrace(c, gx, gy, gw, gh){
  const npix = 700;
  const X = i => gx + i * gw / npix;
  const Y = v => yOf(v, gy, gh);
  c.save(); c.beginPath(); c.rect(gx, gy, gw, gh); c.clip();
  c.strokeStyle = C_TRACE; c.lineWidth = 1.2; c.beginPath();
  if (S.frozen){
    const f = S.frozen;
    for (let i = 0; i < f.length; i++)
      i ? c.lineTo(X(i), Y(f[i])) : c.moveTo(X(i), Y(f[i]));
  } else if (rolling()){
    const t1 = S.playT - S.run.t0, t0 = t1 - NX * S.tdiv;
    S.delay = 0.5 * (t0 + t1);
    const ys = [];
    for (let i = 0; i < npix; i++){
      const ta = S.run.t0 + t0 + i * (t1 - t0) / npix;
      const tb = ta + (t1 - t0) / npix;
      let hi = V_LOW;
      for (const [a, b] of S.run.pulses)
        if (b >= ta && a <= tb){ hi = S.run.vhi; break; }
      /* the desktop roll trace is noisy too, and it draws the low and
         the high of every column, not just the high */
      const nz = 0.010 * (S.rng() - 0.5);
      const lo = V_LOW + nz, hh = hi + nz;
      ys.push(lo, hh);
      const x = X(i);
      i ? c.lineTo(x, Y(lo)) : c.moveTo(x, Y(lo));
      c.lineTo(x, Y(hh));
    }
    S.lastTrace = ys;
  } else if (S.run && S.run.rec){
    const r = S.run;
    let t0 = S.delay - NX / 2 * S.tdiv, t1 = S.delay + NX / 2 * S.tdiv;
    const live = S.playT - r.t0;
    t1 = Math.min(t1, live);
    if (t1 > t0){
      const spp = r.fs * (t1 - t0) / npix;
      const ys = [];
      if (spp > 2){
        /* more than two samples a pixel: the instrument shows the
           envelope of what it caught, which is why a narrow pulse is
           still visible at a slow sweep */
        const k0 = Math.max(Math.floor((t0 - r.recT0) * r.fs), 0);
        const k1 = Math.min(Math.floor((t1 - r.recT0) * r.fs) + 2,
                            r.rec.length);
        const m = Math.floor((k1 - k0) / npix);
        if (m >= 1){
          for (let i = 0; i < npix; i++){
            let lo = Infinity, hi = -Infinity;
            const a = k0 + i * m, bnd = (i === npix - 1) ? k1 : a + m;
            for (let k = a; k < bnd; k++){
              const v = r.rec[k];
              if (v < lo) lo = v;
              if (v > hi) hi = v;
            }
            ys.push(lo, hi);
            const x = X(i);
            i ? c.lineTo(x, Y(lo)) : c.moveTo(x, Y(lo));
            c.lineTo(x, Y(hi));
          }
        }
      } else {
        /* fewer than two samples a pixel: sin(x)/x reconstruction, so a
           feature one or two samples wide comes out as a sinc hump */
        for (let i = 0; i < npix; i++){
          const t = t0 + i * (t1 - t0) / npix;
          const v = S.interp === "x" ? linInterp(r.rec, r.recT0, r.fs, t) : sinxx(r.rec, r.recT0, r.fs, t);
          ys.push(v);
          i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v));
        }
      }
      S.lastTrace = ys;
      c.stroke();
      if (spp < 0.25){
        /* and the samples themselves, as the instrument marks them */
        c.fillStyle = C_TRACE;
        const k0 = Math.max(Math.floor((t0 - r.recT0) * r.fs), 0);
        const k1 = Math.min(Math.floor((t1 - r.recT0) * r.fs) + 1,
                            r.rec.length);
        for (let k = k0; k < k1; k++){
          const t = r.recT0 + k / r.fs;
          const px = gx + (t - t0) / (t1 - t0) * gw;
          c.beginPath(); c.arc(px, Y(r.rec[k]), 1.6, 0, 6.283); c.fill();
        }
      }
      c.beginPath();
    }
  }
  c.stroke();
  /* markers */
  c.fillStyle = "#40c0ff";
  const xd = gx + gw / 2; c.beginPath();
  c.moveTo(xd - 4, gy); c.lineTo(xd + 4, gy); c.lineTo(xd, gy + 6); c.fill();
  c.fillStyle = C_TRACE; c.beginPath();
  const yl = Y(S.trig);
  c.moveTo(gx + gw, yl - 4); c.lineTo(gx + gw, yl + 4);
  c.lineTo(gx + gw - 6, yl); c.fill();
  c.restore();
}
function drawKnob(c, k){
  const [fx, fy, fr] = KNOBS[k];
  const x = fx * IW, y = (1 - fy) * IH, r = fr * IW;
  if (k === "vscale" || k === "vpos"){ c.strokeStyle = "#f2c500"; c.lineWidth = 2.4;
    c.beginPath(); c.arc(x, y, r + 3, 0, 6.283); c.stroke(); }
  if (k === "vscale2" || k === "vpos2"){ c.strokeStyle = "#e86ab4"; c.lineWidth = 2.4;
    c.beginPath(); c.arc(x, y, r + 3, 0, 6.283); c.stroke(); }
  c.fillStyle = "#d2d2cf"; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
  c.strokeStyle = "#a9a9a6"; c.lineWidth = 0.8; c.stroke();
  c.fillStyle = "#eeeeec"; c.beginPath(); c.arc(x, y, r * 0.72, 0, 6.283); c.fill();
  const a = knobAng[k];
  c.strokeStyle = "#8d8d8a"; c.lineWidth = 2; c.beginPath();
  c.moveTo(x + r * 0.2 * Math.sin(a), y - r * 0.2 * Math.cos(a));
  c.lineTo(x + r * 0.62 * Math.sin(a), y - r * 0.62 * Math.cos(a)); c.stroke();
  if (S.sel === k){ c.strokeStyle = "#e03030"; c.lineWidth = 2;
    c.beginPath(); c.arc(x, y, r + 5, 0, 6.283); c.stroke(); }
}
function drawBtn(c, b){
  const [fx, fy, fw, fh, lab, col] = BTNS[b];
  const x = fx * IW - fw * IW / 2, y = (1 - fy) * IH - fh * IH / 2;
  const w = fw * IW, h = fh * IH;
  c.fillStyle = (b === "roll" && S.roll) || (b === "run" && S.cont)
    ? "#9fd97a" : col;
  rr(c, x, y, w, h, 3); c.fill();
  c.strokeStyle = "#a9a9a6"; c.lineWidth = 0.7; c.stroke();
  c.fillStyle = (col === "#2f9fe0" || col === "#2b2c30") ? "#fff" : "#3a3b3e";
  c.font = "bold " + (0.0105 * IW).toFixed(1) + "px Segoe UI";
  c.textAlign = "center";
  lab.split("\n").forEach((s, i, A) =>
    c.fillText(s, x + w / 2, y + h / 2 + 0.004 * IH
      + (i - (A.length - 1) / 2) * 0.013 * IH));
  c.textAlign = "left";
}

/* ---- panel interaction ------------------------------------------ */
scope.addEventListener("mousedown", ev => {
  const R = scope.getBoundingClientRect();
  scopeClick((ev.clientX - R.left) * IW / R.width, (ev.clientY - R.top) * IH / R.height);
});
/* a click on the front panel at (x, y) in panel pixels */
function scopeClick(x, y){
  if (Math.hypot(x - 0.1103 * IW, y - (1 - 0.1270) * IH) < 0.0153 * IW + 6){
    S.power = !S.power;              /* On/Off switches the instrument */
    if (S.power){
      S.autoDone = false;            /* it boots set up for nothing */
      S.run = null; S.frozen = null;
      S.cont = true; S.armed = true; S.mode = "Auto";
    }
    warn(S.power ? wireHint() : "");
    drawScope(); return;
  }
  if (!S.power) return;                       /* a dead panel ignores you */
  for (const k in KNOBS){
    const [fx, fy, fr] = KNOBS[k];
    const kx = fx * IW, ky = (1 - fy) * IH, r = fr * IW;
    if (Math.hypot(x - kx, y - ky) <= r + 3){
      if (Math.hypot(x - kx, y - ky) < r * 0.4) push(k);
      else { S.sel = k;
        document.getElementById("wheel").textContent =
          tr("wheel") + " " + k.toUpperCase(); }
      drawScope(); return;
    }
  }
  for (const b in BTNS){
    const [fx, fy, fw, fh] = BTNS[b];
    const bx = fx * IW - fw * IW / 2, by = (1 - fy) * IH - fh * IH / 2;
    if (x >= bx && x <= bx + fw * IW && y >= by && y <= by + fh * IH){
      press(b); drawScope(); return;
    }
  }
}
scope.addEventListener("wheel", ev => {
  if (!S.sel || !S.power) return;
  ev.preventDefault(); turn(S.sel, ev.deltaY < 0 ? 1 : -1); drawScope();
}, {passive: false});

function push(k){                    /* knob pushes, from the manual */
  if (k === "hpos") S.delay = 0;
  else if (k === "hscale") S.zoom = !S.zoom;
  else if (k === "vpos") S.voff = 0;
  else if (k === "vscale" || k === "vscale2") S.fine = !S.fine;
  else if (k === "trig") S.trig = 0.5 * ((S.run ? S.run.vhi : 5) + V_LOW);
}
function turn(k, s){
  const step = S.fine ? 0.1 : 1;
  if (k === "hscale"){
    let i = TDIV.indexOf(S.tdiv); i = Math.max(0, Math.min(TDIV.length - 1, i + s));
    S.tdiv = TDIV[i];
    if (S.run){ S.run.chain(S.tdiv, recVdiv(), MEM[S.memi],
                            !rollingNow());
      S.delay = S.run.recT0 + 0.5 * NX * S.tdiv; }
  } else if (k === "vscale"){
    let i = VDIV.indexOf(S.vdiv); i = Math.max(0, Math.min(VDIV.length - 1, i + s));
    S.vdiv = VDIV[i];
  } else if (k === "hpos" || k === "univ") S.delay += s * step * S.tdiv * 0.5;
  else if (k === "vpos") S.voff += s * step * S.vdiv * 0.25;
  else if (k === "trig") S.trig += s * step * S.vdiv * 0.1;
  knobAng[k] += s * 0.35;
}
function press(b){
  if (b === "single"){ S.mode = "Single"; S.frozen = null; S.roll = false;
    S.cont = false; S.armed = true; S.run = null;
    if (S.playing) armNow(); }
  else if (b === "run"){
    if (S.cont){ S.frozen = S.lastTrace ? S.lastTrace.slice() : null;
                 S.cont = false; S.armed = false; }
    else { S.frozen = null; S.cont = true; S.armed = true;
           if (S.playing && !S.run) armNow(); }
  }
  else if (b === "roll"){ S.roll = !S.roll; }
  else if (b === "tauto"){ S.mode = "Auto"; S.cont = S.armed = true; S.frozen = null; }
  else if (b === "tnormal"){ S.mode = "Normal"; S.cont = S.armed = true; S.frozen = null; }
  else if (b === "acquire"){ S.memi = (S.memi + 1) % MEM.length;
    if (S.run) S.run.chain(S.tdiv, recVdiv(), MEM[S.memi],
                           !rollingNow()); }
  else if (b === "auto"){
    /* Auto Setup: the instrument looks at what is actually on the input,
       picks a timebase and a scale for it and locks the sweep to it.
       Until this has been done once for the leads that are in now,
       nothing on the glass stands still. */
    S.autoDone = true;
    S.tdiv = 0.5; S.vdiv = 2; S.voff = 0; S.trig = 1; S.memi = 2;
    S.roll = true; S.cont = true; S.armed = true; S.frozen = null;
    S.run = null;
    if (S.playing) armNow();
    warn(wireHint());
  }
  else if (b === "deflt"){
    /* factory settings, which includes forgetting the setup */
    S.autoDone = false; S.run = null; S.frozen = null;
    S.tdiv = 0.5; S.vdiv = 2; S.voff = 0; S.trig = 1; S.memi = 2;
    S.roll = true; S.cont = true; S.armed = true;
    warn(wireHint());
  }
}

/* ---- the bench -------------------------------------------------- */
const BW = 700;
const BH = Math.round(BW * (0.401405 + 0.062) / 0.810);
/* the wire is 315.4 mm and has to fit between the frame and the rail
   with room for the protractor scale, so one metre is 760 px */
const PX = 760, OX = BW / 2, OY = 56;
const bench = document.getElementById("bench"), bx = fit(bench, BW, BH);
/* metres -> canvas, with the same window the desktop axes use */
function BX(x){ const [x0, x1] = BENCH_ART.xlim;
  return 8 + (x - x0) / (x1 - x0) * (BW - 16); }
function BY(y){ const [y0, y1] = BENCH_ART.ylim;
  return BH - 8 - (y - y0) / (y1 - y0) * (BH - 16); }
function BS(){ const [x0, x1] = BENCH_ART.xlim;
  return (BW - 16) / (x1 - x0); }

function paintArt(c){
  for (const it of BENCH_ART.items){
    if (it.t === "poly"){
      c.beginPath();
      for (const ring of it.rings){
        ring.forEach(([x, y], i) => i ? c.lineTo(BX(x), BY(y))
                                     : c.moveTo(BX(x), BY(y)));
        c.closePath();
      }
      if (it.fc){ c.globalAlpha = it.fc[1]; c.fillStyle = it.fc[0]; c.fill(); }
      if (it.ec && it.w > 0){ c.globalAlpha = it.ec[1];
        c.strokeStyle = it.ec[0]; c.lineWidth = it.w; c.stroke(); }
      c.globalAlpha = 1;
    } else if (it.t === "segs"){
      c.globalAlpha = it.c[1]; c.strokeStyle = it.c[0];
      c.lineWidth = Math.max(it.w, 0.4); c.beginPath();
      for (const sg of it.segs){
        sg.forEach(([x, y], i) => i ? c.lineTo(BX(x), BY(y))
                                   : c.moveTo(BX(x), BY(y)));
      }
      c.stroke(); c.globalAlpha = 1;
    } else if (it.t === "line"){
      c.globalAlpha = it.c[1]; c.strokeStyle = it.c[0];
      c.lineWidth = Math.max(it.w, 0.5);
      if (it.dash) c.setLineDash([3, 3]);
      c.beginPath();
      it.pts.forEach(([x, y], i) => i ? c.lineTo(BX(x), BY(y))
                                     : c.moveTo(BX(x), BY(y)));
      c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
    } else if (it.t === "text"){
      c.globalAlpha = it.c[1]; c.fillStyle = it.c[0];
      c.font = (it.bold ? "bold " : "") + (it.size * 1.25).toFixed(1)
               + "px Segoe UI";
      c.textAlign = it.ha === "center" ? "center"
                  : (it.ha === "right" ? "right" : "left");
      c.textBaseline = it.va === "center" ? "middle" : "alphabetic";
      c.fillText(it.s, BX(it.x), BY(it.y));
      c.textAlign = "left"; c.textBaseline = "alphabetic";
      c.globalAlpha = 1;
    }
  }
}

function drawBench(){
  const c = bx, b = S.bench, sc = BS();
  c.clearRect(0, 0, BW, BH);
  c.fillStyle = "#eceae5"; c.fillRect(0, 0, BW, BH);
  paintArt(c);                       /* the apparatus, as the desktop draws it */
  const st = state();
  const yr = BENCH_ART.rail;

  /* the photogate follows its slider, and the hanger units follow the
     separation slider, so neither can be baked into the picture above */
  const gx = b.xGate * 1e-3;
  for (const dx of [-0.011, 0.011]){
    c.fillStyle = "#f2f2ee";
    c.fillRect(BX(gx + dx - 0.004), BY(yr + 0.062),
               0.008 * sc, 0.055 * sc);
    c.strokeStyle = "#9aa0a6"; c.lineWidth = 0.8;
    c.strokeRect(BX(gx + dx - 0.004), BY(yr + 0.062),
                 0.008 * sc, 0.055 * sc);
  }
  c.fillStyle = "#2b2e32";
  c.fillRect(BX(gx - 0.007), BY(yr + 0.042), 0.005 * sc, 0.012 * sc);
  c.strokeStyle = "#e03030"; c.lineWidth = 0.9; c.setLineDash([2, 2]);
  c.beginPath(); c.moveTo(BX(gx - 0.007), BY(yr + 0.036));
  c.lineTo(BX(gx + 0.007), BY(yr + 0.036)); c.stroke(); c.setLineDash([]);

  for (let i = 0; i < 2; i++){
    const hx = b.hang()[i];
    c.fillStyle = "#dfe2e6";
    c.fillRect(BX(hx - 0.013), BY(-0.004), 0.026 * sc, 0.016 * sc);
    c.strokeStyle = "#8b9096"; c.lineWidth = 0.8;
    c.strokeRect(BX(hx - 0.013), BY(-0.004), 0.026 * sc, 0.016 * sc);
    c.beginPath(); c.arc(BX(hx - 0.005), BY(-0.025), 0.005 * sc, 0, 6.283);
    c.fillStyle = "#fbfaf6"; c.fill(); c.stroke();
    c.beginPath(); c.arc(BX(hx + 0.006), BY(-0.025), 0.004 * sc, 0, 6.283);
    c.fillStyle = "#3b4149"; c.fill();
    c.strokeStyle = "#20242a"; c.stroke();
  }

  /* ---- wires and balls, in the desktop colours ------------------- */
  for (let i = 0; i < (b.two ? 2 : 1); i++){
    const p = st.p[i], R = b.R(i) * sc, hx = b.hang()[i];
    c.strokeStyle = "#c05a1e"; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(BX(hx), BY(0)); c.lineTo(BX(p[0]), BY(p[1]));
    c.stroke();
    const g = c.createRadialGradient(BX(p[0]) - R * 0.35, BY(p[1]) - R * 0.35,
                                     R * 0.1, BX(p[0]), BY(p[1]), R);
    g.addColorStop(0, "#f2f4f6"); g.addColorStop(1, "#9aa0a6");
    c.fillStyle = g;
    c.beginPath(); c.arc(BX(p[0]), BY(p[1]), R, 0, 6.283); c.fill();
    c.strokeStyle = "#6b7078"; c.lineWidth = 1; c.stroke();
  }

  /* ---- the electromagnet holder, drawn the way the desktop does:
     a rail clamp, a chrome rod, a cross boss with three knurled screws
     and the short black magnet clamped straight into it -------------- */
  const railY = BENCH_ART.rail;      /* the real rail height */
  if (S.held){
    /* the pole face is one ball radius out along the same radius as the
       ball, so the whole holder follows the angle you set */
    const p = st.p[0], n = Math.hypot(p[0], p[1]) || 1;
    const ux = p[0] / n, uy = p[1] / n;
    const fx = p[0] + ux * b.R(0), fy = p[1] + uy * b.R(0);
    let body = 0.024;
    if (uy < -1e-6) body = Math.min(body, Math.max((fy - (railY + 0.010))
                                                  / (-uy), 0.010));
    const kx = fx + ux * body, ky = fy + uy * body;
    c.strokeStyle = "#26292d"; c.lineWidth = 0.011 * sc;
    c.lineCap = "butt";
    c.beginPath(); c.moveTo(BX(fx), BY(fy)); c.lineTo(BX(kx), BY(ky));
    c.stroke();
    c.strokeStyle = "#9aa0a6"; c.lineWidth = 0.011 * sc;   /* pole face */
    c.beginPath(); c.moveTo(BX(fx), BY(fy));
    c.lineTo(BX(fx + ux * 0.0025), BY(fy + uy * 0.0025)); c.stroke();
    c.strokeStyle = "#b9bec4"; c.lineWidth = 0.006 * sc;
    c.beginPath(); c.moveTo(BX(kx), BY(ky)); c.lineTo(BX(kx), BY(railY));
    c.stroke();
    c.strokeStyle = "#f2f4f6"; c.lineWidth = 0.0016 * sc;
    c.beginPath(); c.moveTo(BX(kx - 0.0016), BY(ky));
    c.lineTo(BX(kx - 0.0016), BY(railY)); c.stroke();
    c.fillStyle = "#d3d7dc";
    c.fillRect(BX(kx - 0.017), BY(ky + 0.011), 0.034 * sc, 0.022 * sc);
    c.strokeStyle = "#8b9096"; c.lineWidth = 1;
    c.strokeRect(BX(kx - 0.017), BY(ky + 0.011), 0.034 * sc, 0.022 * sc);
    for (const d of [-0.011, 0, 0.011]){
      c.beginPath(); c.arc(BX(kx + d), BY(ky), 0.004 * sc, 0, 6.283);
      c.fillStyle = "#eceef0"; c.fill(); c.stroke();
    }
    c.fillStyle = "#c8ccd1";
    c.fillRect(BX(kx - 0.020), BY(railY + 0.014), 0.040 * sc, 0.013 * sc);
    c.strokeRect(BX(kx - 0.020), BY(railY + 0.014), 0.040 * sc, 0.013 * sc);
    c.beginPath(); c.arc(BX(kx + 0.024), BY(railY + 0.007), 0.006 * sc,
                         0, 6.283);
    c.fillStyle = "#e6e8ea"; c.fill(); c.stroke();
    c.strokeStyle = "#26292d"; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(BX(kx + 0.004), BY(ky - 0.011));
    c.quadraticCurveTo(BX(kx + 0.012), BY((ky + railY) / 2),
                       BX(kx + 0.004), BY(railY + 0.014));
    c.stroke();
  }

  /* ---- the two lines of text the desktop version prints ---------- */
  c.fillStyle = "#30507a"; c.font = "bold 11px Consolas"; c.textAlign = "left";
  c.fillText(b.two ? tr("cfg2") : tr("cfg1"), 12, 18);
  c.fillStyle = "#1f6b3a"; c.font = "bold 11px Segoe UI";
  c.textAlign = "center";
  c.fillText(S.held ? tr("attached")
    : (circuit().coil ? "" : tr("dead")), BW / 2, 34);
  c.textAlign = "left";
  document.getElementById("grip").textContent = S.held ? tr("gripOn")
    : (circuit().coil ? tr("gripFree") : tr("gripDead"));
}
function state(){
  const b = S.bench;
  if (S.played && S.playing){
    const r = S.played.res;
    const t = Math.max(0, Math.min(S.playT, r.t[r.t.length - 1]));
    let i = 0; while (i < r.t.length - 1 && r.t[i] < t) i++;
    const f = r.p[i];
    return {p: [[f[0], f[1]], [f[2], f[3]]]};
  }
  const l = b.wire(), h = b.hang();
  /* the desktop version is explicit about this: the coil grips ball 1
     and pulls it aside to wherever the holder is, and when it is not
     gripped the ball just hangs straight down */
  if (!S.held) return {p: [[h[0], -l[0]], [h[1], -l[1]]]};
  const th = -(+document.getElementById("phi").value) * Math.PI / 180;
  return {p: [[h[0] + l[0] * Math.sin(th), -l[0] * Math.cos(th)],
              [h[1], -l[1]]]};
}

/* ---- the cabling page ------------------------------------------- */
const WW = WIRE_ART.w, WH = WIRE_ART.h;
const wire = document.getElementById("wire"), wx = fit(wire, WW, WH);
function bez(a, b, f){ return [a.x + (b.x - a.x) * f,
  a.y + (b.y - a.y) * f + 24 * Math.sin(Math.PI * f)]; }
function drawWire(){
  const c = wx;
  /* the lever shows where the switch is, whatever is plugged in; the
     lamp beside it shows whether the coil is actually live */
  tkPlay(c, WIRE_ART_OFF);        /* the box with a bare base */
  /* the lever itself, at the desktop program's coordinates */
  const upx = S.boxOn ? 426 : 398, upy = S.boxOn ? 152 : 204;
  c.strokeStyle = "#c42030"; c.lineWidth = 9; c.lineCap = "butt";
  c.beginPath(); c.moveTo(412, 178); c.lineTo(upx, upy); c.stroke();
  c.beginPath(); c.arc(upx, upy, 6, 0, 6.283);
  c.fillStyle = "#e04050"; c.fill();
  c.strokeStyle = "#8a1620"; c.lineWidth = 1; c.stroke();
  /* the indicator on the face of the box: it lights when the box has
     its 12 V, which is the adaptor plus the ON/OFF lever */
  const pw = circuit().powered;
  c.beginPath(); c.arc(470, 108, 8, 0, 6.283);
  c.fillStyle = pw ? "#ff3b30" : "#5a1a18"; c.fill();
  c.strokeStyle = "#7a1218"; c.lineWidth = 2; c.stroke();
  if (pw){
    const g = c.createRadialGradient(470, 108, 2, 470, 108, 28);
    g.addColorStop(0, "rgba(255,60,45,0.55)");
    g.addColorStop(1, "rgba(255,60,45,0)");
    c.fillStyle = g;
    c.beginPath(); c.arc(470, 108, 28, 0, 6.283); c.fill();
  }
  /* the holder coil, when it is in circuit, is energised: the lead
     glows and the magnet on the bench takes the ball */
  if (circuit().coil){
    const t = T.magnet;
    const g2 = c.createRadialGradient(t.x, t.y, 2, t.x, t.y, 22);
    g2.addColorStop(0, "rgba(160,90,220,0.45)");
    g2.addColorStop(1, "rgba(160,90,220,0)");
    c.fillStyle = g2;
    c.beginPath(); c.arc(t.x, t.y, 22, 0, 6.283); c.fill();
  }
  /* the leads and the terminals are live, so they are drawn on top */
  for (const k of S.links){
    const [a2, b2] = k.split("|");
    c.strokeStyle = T[a2].c; c.lineWidth = 3; c.beginPath();
    for (let i = 0; i <= 26; i++){
      const [x, y] = bez(T[a2], T[b2], i / 26);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.stroke();
  }
  if (S.pick){
    const d = T[S.pick];
    c.strokeStyle = d.c; c.lineWidth = 3; c.setLineDash([6, 4]);
    c.beginPath(); c.moveTo(d.x, d.y); c.lineTo(S.mouse[0], S.mouse[1]);
    c.stroke(); c.setLineDash([]);
  }
  for (const k in T){
    const d = T[k], used = [...S.links].some(l => l.split("|").includes(k));
    const r = k === S.pick ? 12 : 9;
    c.fillStyle = used ? d.c : "#f4f4f0";
    c.beginPath(); c.arc(d.x, d.y, r, 0, 6.283); c.fill();
    c.strokeStyle = k === S.pick ? "#e03030" : d.c;
    c.lineWidth = k === S.pick ? 3 : 2; c.stroke();
    if (d.lab){ c.fillStyle = "#e6e8ea"; c.font = "bold 12px 'Segoe UI'";
      c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText(d.lab, d.x + 16, d.y); }
  }
  c.textAlign = "left"; c.textBaseline = "alphabetic";
}

function termAt(x, y){
  for (const k in T) if (Math.hypot(x - T[k].x, y - T[k].y) <= 16) return k;
  return null;
}
function leadAt(x, y){
  for (const k of S.links){
    const [a, b] = k.split("|");
    for (let i = 0; i <= 40; i++){
      const [px, py] = bez(T[a], T[b], i / 40);
      if (Math.hypot(x - px, y - py) < 8) return k;
    }
  }
  return null;
}
wire.addEventListener("mousemove", ev => {
  const R = wire.getBoundingClientRect();
  S.mouse = [(ev.clientX - R.left) * WW / R.width,
             (ev.clientY - R.top) * WH / R.height];
  if (S.pick) drawWire();
});
wire.addEventListener("contextmenu", ev => { ev.preventDefault();
  S.pick = null; drawWire(); });
wire.addEventListener("mousedown", ev => {
  if (ev.button) return;
  const R = wire.getBoundingClientRect();
  const x = (ev.clientX - R.left) * WW / R.width;
  const y = (ev.clientY - R.top) * WH / R.height;
  if (x >= 388 && x <= 436 && y >= 146 && y <= 220){ toggleBox(); return; }
  const k = termAt(x, y);
  if (k){ wireClick(k); return; }
  const l = leadAt(x, y);
  if (l){ S.links.delete(l); S.pick = null; wiringChanged();
    syncCoil(); drawWire(); drawBench(); drawScope(); return; }
  S.pick = null; drawWire();
});

/* the mains lever on the junction box */
function toggleBox(){
  S.boxOn = !S.boxOn;
  syncCoil();
  if (!S.boxOn && S.held){       /* the coil cannot hold without it */
    S.held = false;
    document.getElementById("coil").textContent = tr("coilDown");
    release();
  }
  drawWire(); drawBench(); drawScope();
}
/* a terminal clicked: the first one takes the lead's end, the second one plugs it in */
function wireClick(k){
  if (!S.pick || S.pick === k) S.pick = S.pick === k ? null : k;
  else {
    for (const end of [S.pick, k]) if (!MULTI.has(end))
      for (const l of [...S.links]) if (l.split("|").includes(end))
        S.links.delete(l);
    S.links.add(key(S.pick, k)); S.pick = null;
    wiringChanged();
  }
  syncCoil(); drawWire(); drawBench(); drawScope();
}
/* every lead on terminal k pulled out */
function unplug(k){
  let any = false;
  for (const l of [...S.links]) if (l.split("|").includes(k)){ S.links.delete(l); any = true; }
  S.pick = null; if (any) wiringChanged();
  syncCoil(); drawWire(); drawBench(); drawScope();
}

/* The leads have moved, so whatever the instrument was set up for is no
   longer what is on its input: it has to be Auto Set again, and anything
   it had captured belongs to the old connection. */
function wiringChanged(){
  S.autoDone = false;
  S.run = null;
  S.frozen = null;
  warn(wireHint());
}

/* ---- controls --------------------------------------------------- */
function toggleCoil(){
  const btn = document.getElementById("coil");
  if (!S.held){
    if (!circuit().coil){ warn(tr("nopower")); return; }
    S.held = true; S.playing = false; S.played = null; S.frozen = null;
    btn.textContent = tr("coilUp");
    warn("");
  } else {
    S.held = false;
    btn.textContent = tr("coilDown");
    release();
  }
  drawBench(); drawScope(); drawWire();
}
document.getElementById("coil").onclick = toggleCoil;
document.getElementById("stopp").onclick = () => {
  S.playing = false; drawBench();
};
for (const id of ["b1", "b2", "two", "gap", "dz", "gate", "phi"])
  document.getElementById(id).oninput = () => {
    const b = S.bench;
    const running = S.playing && S.played;
    b.two = document.getElementById("two").checked;
    b.ball = [+document.getElementById("b1").value,
              +document.getElementById("b2").value];
    b.gap = +document.getElementById("gap").value;
    b.dz = +document.getElementById("dz").value;
    b.xGate = +document.getElementById("gate").value;
    b.phi0 = +document.getElementById("phi").value;
    if (running) restartFrom();      /* keep going from where it is */
    drawBench(); drawScope();
  };
document.getElementById("tab0").onclick = () => showTab(0);
document.getElementById("tab1").onclick = () => showTab(1);
function showTab(i){
  document.getElementById("tab0").className = i ? "" : "on";
  document.getElementById("tab1").className = i ? "on" : "";
  document.getElementById("page0").className = "page" + (i ? "" : " on");
  document.getElementById("page1").className = "page" + (i ? " on" : "");
  if (i) drawWire();
}

/* ---- the frame loop: bench and instrument, quite separately ----- */
let last = performance.now();
/* ------------------------------------------------------------------
   Keeping the bench alive.

   A release only computes the first few seconds, so the trajectory has
   to grow as it is played.  It grows in short chunks scheduled off the
   frame loop: five seconds of two-ball swing is about twenty
   milliseconds of arithmetic, which the browser absorbs without a
   visible stutter, and the pendulum then swings for as long as you
   care to watch instead of stopping dead.
   ------------------------------------------------------------------ */
function tEnd(){
  const r = S.played && S.played.res;
  return (r && r.t.length) ? r.t[r.t.length - 1] : 0;
}
function growTrajectory(){
  if (!S.played || S.growing) return;
  const r = S.played.res;
  const st = Bench.tail(r);
  if (!st) return;
  S.growing = true;
  const t0 = r.t[r.t.length - 1];
  setTimeout(() => {
    try {
      const add = S.bench.run(3.0, st);
      if (add.t.length){
        for (let i = 0; i < add.t.length; i++){
          r.t.push(add.t[i] + t0);
          r.p.push(add.p[i]);
        }
        for (const kk of ["gate", "contact"])
          for (const g of add[kk]) r[kk].push([g[0] + t0, g[1] + t0]);
        /* the pulse train the scope triggers on has grown too */
        S.played.pulses = (S.played.source === "photogate")
          ? r.gate : r.contact;
      }
    } catch (e){ /* never let a failed chunk kill the frame loop */ }
    S.growing = false;
  }, 0);

function frame(now){
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (S.playing && S.played){
    /* never run past what has been computed: the clock waits for the
       next chunk rather than freezing and then jumping */
    S.playT = Math.min(S.playT + dt, tEnd());
    if (S.playT > tEnd() - 5.0) growTrajectory();
  }
  /* in Run, and not rolling, the scope re-arms between sweeps */
  const r0 = S.run;
  if (S.cont && !rollingNow() && r0 && r0.rec
      && S.playT - r0.t0 > r0.recT0 + r0.n / r0.fs){
    if (r0.retrigger(S.tdiv, recVdiv(), MEM[S.memi], true))
      S.delay = r0.recT0 + 0.5 * NX * S.tdiv;
  }
  if (S.playing) drawBench();
  if (S.playing || (S.cont && S.power)) drawScope();
  requestAnimationFrame(frame);
}

const trayCv = document.getElementById("tray"), tctx = trayCv.getContext("2d");
const TRAY = [["big", "itBig"], ["small", "itSmall"]], TROW = 44;
let hand = null, TRW = 190, trayCells = [];
function trayLayout(){
  const dpr = window.devicePixelRatio || 1, r = trayCv.parentElement.getBoundingClientRect();
  TRW = Math.max(150, Math.floor(r.width - 16)); const h = TRAY.length * TROW + 44;
  trayCv.style.height = h + "px"; trayCv.width = Math.round(TRW * dpr); trayCv.height = Math.round(h * dpr);
  drawTray();
}
function ballIcon(c, x, y, r){
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.35, "#c9ced3"); g.addColorStop(1, "#5d646b");

    c.fillStyle = "#e8eef2"; let nm = tr(lab); while (c.measureText(nm).width > wd - 52 && nm.length > 4) nm = nm.slice(0, -2) + "…";
    c.fillText(nm, 50, y + 13);

trayCv.addEventListener("mousedown", e => {
  if (e.button) return; const y = e.clientY - trayCv.getBoundingClientRect().top;
  for (const [k, y0, y1] of trayCells) if (y >= y0 && y <= y1){ setHand(hand === k ? null : k); return; }

bench.addEventListener("contextmenu", e => e.preventDefault());
bench.addEventListener("mousedown", e => {
  const R = bench.getBoundingClientRect(), fx = (e.clientX - R.left) / R.width;
  const right = fx > 0.5;

      document.getElementById("two").checked = false; document.getElementById("two").oninput(); ballState(); }

window.addEventListener("resize", trayLayout);


/* ══════════════════════════════════════════════════════════════

   (the APhO 2026 bench style: a wooden desk seen from above at an

   World units are centimetres: x and z lie on the desk, y is up.

const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};

function leadPath(a, na, b, nb){ const ea = exitOf(a, na), eb = exitOf(b, nb), mid = deskRoute([ea[0], ea[2]], [eb[0], eb[2]]);

function socket3(k){ const t = term3(k), n = TERM[k].n, col = pickCol(k), at = d => [t[0] + n[0] * d, t[1] + n[1] * d, t[2] + n[2] * d], id = "t:" + k, kind = TERM[k].kind;

/* the close-ups are the 3D bench looked at square on, as the student would bend down to it */
