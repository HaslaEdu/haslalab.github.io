}
function plateBtn(c, fx, fy, fw, fh, label, col, fg, rad){
  const x = QX(fx) - QX(fw) / 2, y = QY(fy) - IH * fh / 2, w = QX(fw), h = IH * fh, r = (rad || 0.004) * IW;
  c.fillStyle = "#b9b9b6"; rr(c, x + 0.0012 * IW, y + 0.003 * IH, w, h, r); c.fill();
  c.fillStyle = col; rr(c, x, y, w, h, r); c.fill(); c.strokeStyle = "#a9a9a6"; c.lineWidth = 0.7; c.stroke();
  if (label){ c.fillStyle = fg || "#3a3b3e"; c.font = FPB(4.6); c.textAlign = "center"; c.textBaseline = "middle";
    label.split("\n").forEach((s, i, A) => c.fillText(s, x + w / 2, y + h / 2 + (i - (A.length - 1) / 2) * 0.0175 * IH));
    c.textAlign = "left"; c.textBaseline = "alphabetic"; }
}
function drawBtn(c, b){
  const [fx, fy, fw, fh, lab, col] = BTNS[b];
  const on = (b === "roll" && S.roll) || (b === "run" && S.cont);
  const fg = (col === "#2f9fe0" || col === "#2b2c30") ? "#ffffff" : "#3a3b3e";
  plateBtn(c, fx, fy, fw, fh, lab, on ? "#9fd97a" : col, fg);
}
function drawKnob(c, k){
  const [fx, fy, fr] = KNOBS[k], x = QX(fx), y = QY(fy), r = fr * IW;
  const ring = {vscale:"#f2c500", vpos:"#f2c500", vscale2:"#e86ab4", vpos2:"#e86ab4"}[k];
  if (ring){ c.strokeStyle = ring; c.lineWidth = 3.2; c.beginPath(); c.arc(x, y, r + 0.010 * IW, 0, 6.283); c.stroke(); }
  c.fillStyle = "#b9b9b6"; c.beginPath(); c.arc(x + 0.0015 * IW, y + 0.004 * IH, r * 1.03, 0, 6.283); c.fill();
  c.fillStyle = "#d2d2cf"; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill(); c.strokeStyle = "#a9a9a6"; c.lineWidth = 0.9; c.stroke();
  c.fillStyle = "#eeeeec"; c.beginPath(); c.arc(x, y - 0.003 * IH, r * 0.72, 0, 6.283); c.fill(); c.strokeStyle = "#c9c9c6"; c.lineWidth = 0.7; c.stroke();
  c.strokeStyle = "#c4c4c1"; c.lineWidth = 0.6; c.beginPath();
  for (let i = 0; i < 18; i++){ const a = i * Math.PI / 9; c.moveTo(x + r * 0.80 * Math.cos(a), y + r * 0.80 * Math.sin(a)); c.lineTo(x + r * 0.96 * Math.cos(a), y + r * 0.96 * Math.sin(a)); }
  c.stroke();
  const a = knobAng[k];
  c.strokeStyle = "#8d8d8a"; c.lineWidth = 2.2; c.lineCap = "round"; c.beginPath();
  c.moveTo(x + r * 0.2 * Math.sin(a), y - r * 0.2 * Math.cos(a)); c.lineTo(x + r * 0.62 * Math.sin(a), y - r * 0.62 * Math.cos(a)); c.stroke(); c.lineCap = "butt";
  if (S.sel === k){ c.strokeStyle = "#e03030"; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r + 9, 0, 6.283); c.stroke(); }
}

/* ---- the parts box: balls for the hangers ------------------------ */
const trayCv = document.getElementById("tray"), tctx = trayCv.getContext("2d");
const TRAY = [["big", "itBig"], ["small", "itSmall"]], TROW = 44;
let hand = null, TRW = 190, trayCells = [];
function trayLayout(){
  const dpr = window.devicePixelRatio || 1, r = trayCv.parentElement.getBoundingClientRect();
  TRW = Math.max(150, Math.floor(r.width - 16)); const h = TRAY.length * TROW + 44;
  trayCv.style.height = h + "px"; trayCv.width = Math.round(TRW * dpr); trayCv.height = Math.round(h * dpr);
  drawTray();
}
function ballIcon(c, x, y, r){
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.35, "#c9ced3"); g.addColorStop(1, "#5d646b");
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
}
function drawTray(){
  const dpr = window.devicePixelRatio || 1, c = tctx, h = TRAY.length * TROW + 44;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = "#15181d"; c.fillRect(0, 0, TRW, h);
  trayCells = []; let y = 6; const wd = TRW - 12;
  for (const [k, lab] of TRAY){
    const sel = hand === k;
    c.fillStyle = "#1f242b"; c.fillRect(6, y, wd, TROW - 4);
    c.strokeStyle = sel ? "#f2c14e" : "#353b43"; c.lineWidth = 1; c.strokeRect(6.5, y + 0.5, wd - 1, TROW - 5);
    ballIcon(c, 26, y + (TROW - 4) / 2, k === "big" ? 12 : 9.6);
    c.font = '11.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign = "left"; c.textBaseline = "middle";
    c.fillStyle = "#e8eef2"; let nm = tr(lab); while (c.measureText(nm).width > wd - 52 && nm.length > 4) nm = nm.slice(0, -2) + "…";
    c.fillText(nm, 50, y + 13);
    c.font = '9.5px "Malgun Gothic",sans-serif'; c.fillStyle = "#69717a"; c.fillText(sel ? "" : tr("trayTake"), 50, y + 28);
    trayCells.push([k, y, y + TROW - 4]); y += TROW;
  }
  c.font = '10.5px "Malgun Gothic",sans-serif'; c.textAlign = "center"; c.textBaseline = "top"; c.fillStyle = "#69717a";
  c.fillText(tr("trayHelp"), TRW / 2, y + 6);
}
function ballState(){
  const b1 = +document.getElementById("b1").value, b2 = +document.getElementById("b2").value, two = document.getElementById("two").checked;
  const nm = v => tr(v ? "bsSmall" : "bsBig");
  document.getElementById("ballState").textContent =
    tr("bs1") + ": " + nm(b1) + "\n" + tr("bs2") + ": " + (two ? nm(b2) : tr("bsNone"));
  document.getElementById("ballState").style.whiteSpace = "pre";
}
function setHand(k){ hand = k; bench.style.cursor = k ? "copy" : "default"; drawTray(); }
trayCv.addEventListener("contextmenu", e => { e.preventDefault(); setHand(null); });
trayCv.addEventListener("mousedown", e => {
  if (e.button) return; const y = e.clientY - trayCv.getBoundingClientRect().top;
  for (const [k, y0, y1] of trayCells) if (y >= y0 && y <= y1){ setHand(hand === k ? null : k); return; }
});
bench.addEventListener("contextmenu", e => e.preventDefault());
bench.addEventListener("mousedown", e => {
  const R = bench.getBoundingClientRect(), fx = (e.clientX - R.left) / R.width;
  const right = fx > 0.5;
  if (e.button === 2){
    if (hand){ setHand(null); return; }
    if (right && document.getElementById("two").checked){
      document.getElementById("two").checked = false; document.getElementById("two").oninput(); ballState(); }
    return;
  }
  if (!hand) return;
  document.getElementById(right ? "b2" : "b1").value = hand === "big" ? "0" : "1";
  if (right) document.getElementById("two").checked = true;
  document.getElementById("b1").oninput(); ballState(); setHand(null);
});
window.addEventListener("resize", trayLayout);


/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){

  box3(18,24,0,3,22,26,"#141414",{id:"box"});
}
const SC0 = [-66, 0, 16], SCW = 31, SCH = 15.9, SCD = 12;
function scope3d(){
  const [x0, , z0] = SC0, x1 = x0 + SCW, z1 = z0 + SCD;
  box3(x0+3,x1-3,0,SCH-1,z0-8,z0,"#3c4652",{id:"scope"});
  box3(x0,x1,0,SCH,z0,z1,"#e4e6e3",{id:"scope",top:"#eef0ed"});
  tex3(scope, 0, 0, scope.width, scope.height, [x0+0.3, SCH-0.3, z1+0.01], [SCW-0.6,0,0], [0,-(SCH-0.6),0], {id:"scope"});
}
function cables3(){
  const L = (a, b, col, w, sag) => { const pts = []; for (let i = 0; i <= 18; i++){ const t = i / 18;
    pts.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t - Math.sin(Math.PI*t)*(sag||3), a[2]+(b[2]-a[2])*t]); } poly3(pts, col, w); };
  if (linked("box_ch","ch1") || linked("box_ch","ch2")) L([BOX[0]-4.5,3,BOX[2]], [SC0[0]+SCW*(linked("box_ch","ch1")?0.64:0.75), 3.7, SC0[2]+SCD], "#111", 2.2, 1);
  if (linked("photogate","box_gate")) L([S.bench.xGate/10, RAILY+6, 4.8], [BOX[0]-2, 5.5, BOX[2]-7], "#333", 1.6, 4);
  if (linked("adaptor","box_dc")) L([21,2,24], [BOX[0]+4.5,2,BOX[2]], "#141414", 1.8, 0.3);
  if (linked("box_ball","ball1")) L([BOX[0]+1,5.9,BOX[2]+5.5], [-2,PIV,0], "#d35400", 1, 6);
}
function scene3(){
  desk3(); base3(); fans3(); column3(); gate3(); balls3(); holder3(); box3d(); scope3d(); cables3();
}
/* ---- camera and pointer --------------------------------------------- */
function layout3(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv3.parentElement.clientWidth || 900;
  const h = Math.max(440, Math.min(Math.round(w * 0.62), Math.round(window.innerHeight * 0.78)));
  cv3.style.width = w + "px"; cv3.style.height = h + "px"; cv3.width = Math.round(w * dpr); cv3.height = Math.round(h * dpr);
  const first = !CAM0.k; CAM.W = w; CAM.H = h; CAM.dpr = dpr;
  if (first){ CAM.k = w / 125; CAM.tx = -12; CAM.ty = 18; CAM.tz = 6; CAM.yaw = -0.2; CAM.pitch = 0.42; CAM.px = 0; CAM.py = 10; camSave(); }
}
function draw3(){
  if (view3 !== "3d") return;
  const dpr = CAM.dpr; ctx3.setTransform(dpr,0,0,dpr,0,0);
  const g = ctx3.createLinearGradient(0,0,0,CAM.H); g.addColorStop(0,"#2a3038"); g.addColorStop(1,"#1b1f25"); ctx3.fillStyle = g; ctx3.fillRect(0,0,CAM.W,CAM.H);
  begin3(); scene3(); render3(ctx3);
}
function showView(v){
  view3 = v;
  for (const k of ["3d","bench","scope","wire"]){ document.getElementById("v-" + k).hidden = k !== v; document.getElementById("vt" + k).className = k === v ? "on" : ""; }
  document.getElementById("t-cap3").textContent = tr("cap_" + v);
  if (v === "wire") drawWire(); if (v === "bench") drawBench(); if (v === "scope") drawScope();
}
for (const k of ["3d","bench","scope","wire"]) document.getElementById("vt" + k).onclick = () => showView(k);
let down3 = null, m3 = [0,0];
const p3e = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => { e.preventDefault(); if (hand){ setHand(null); return; }
  const p = p3e(e), id = pick3(p[0], p[1]);
  if (id === "ball1" || id === "hang1"){ document.getElementById("two").checked = false; document.getElementById("two").oninput(); ballState(); } });
cv3.addEventListener("pointerdown", e => { if (e.button) return; const p = p3e(e); m3 = p; cv3.setPointerCapture(e.pointerId);
  const id = pick3(p[0], p[1]);
  if (hand){ if (id === "ball0" || id === "hang0" || id === "ball1" || id === "hang1"){ const right = id.endsWith("1");
      document.getElementById(right ? "b2" : "b1").value = hand === "big" ? "0" : "1";
      if (right) document.getElementById("two").checked = true;
      document.getElementById("b1").oninput(); ballState(); setHand(null); }
    return; }
  down3 = {p, id, moved:false, shift:e.shiftKey}; });
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0]-down3.p[0], p[1]-down3.p[1]) > 4) down3.moved = true; if (!down3.moved) return;
  if (down3.id === "gate"){ const q = onPlane(p[0], p[1], RAILY); const g = document.getElementById("gate");
    g.value = Math.max(-60, Math.min(60, Math.round(q[0] * 10))); g.oninput(); return; }
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.45, Math.max(0.1, CAM.pitch + dy * 0.006)); }
  cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", () => { cv3.classList.remove("grabbing");
  if (down3 && !down3.moved){ const id = down3.id;
    if (id === "scope") showView("scope"); else if (id === "box") showView("wire");
    else if (id === "fan" || id === "column" || id === "rail" || (id && id.startsWith("ball")) || (id && id.startsWith("hang"))) showView("bench"); }
  down3 = null; });
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = p3e(e), s = e.deltaY < 0 ? 1 : -1;
  const f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(40, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0]-CAM.W/2) - (p[0]-CAM.W/2-CAM.px) * r; CAM.py = (p[1]-CAM.H/2) - (p[1]-CAM.H/2-CAM.py) * r; CAM.k = nk; }, {passive:false});
for (const id of ["v-bench","v-scope","v-wire"]) document.getElementById(id).addEventListener("contextmenu", e => { if (e.target.id === "wire") return; e.preventDefault(); showView("3d"); });
window.addEventListener("resize", layout3);
(function loop3(){ draw3(); requestAnimationFrame(loop3); })();
applyLang();

</script>
