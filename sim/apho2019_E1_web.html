<meta name="description" content="APhO 2019 실험 1을 브라우저에서 실행합니다. 받침대의 알루미늄 관에 끼운 나사봉 자석 캐리어로 N42·N52 자석을 움직여, 병 속 페로플루이드가 떠오르는 거리, 스파이크가 생기는 거리와 간격, 접시 표면에 비친 램프 상의 길이, 스파이크 개수의 이력현상을 직접 잽니다. 계산은 대신 해주지 않습니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);

  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}

  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

const U=(a,b)=>a+Math.random()*(b-a);

function Rcurv(zmm,k){ const z=Math.max(zmm,0.05)*1e-3, m=msi(k), b=Bz(z,m), b1=dBz(z,m), b2=d2Bz(z,m), gam=Math.abs(0.5*b1*b1-b*b2); if(gam<1e-30) return 1e9; return 2*b*RHO_FF*G/(Mmag(b/MU0)*gam)*1e3; }

/* the magnet on the carrier */
function magKey(){ const m=ST.mags; if(m.length===2) return "STACK"; if(m.length===1) return m[0]==="n42"?"N42":"N52"; return null; }
const bottleMode=()=>isM("tube")&&!ST.rodUp&&isM("bottle");
const dishMode=()=>isM("tube")&&ST.rodUp&&isM("dish");
const blobTop=()=>BLOB_LO+(BLOB_HI-BLOB_LO)*ST.blobA;
const zDish=()=>TRUE.dishBase+TRUE.depth+ST.drop;   /* magnet face → fluid surface [mm] */
function updatePhysics(dt){
  const k=magKey();
  /* bottle: the blob lifts when the magnetic force beats the net buoyancy */
  if(bottleMode()&&k){ if(!ST.blobUp){ if(liftRatio(ST.magY-BLOB_LO,k)>1) ST.blobUp=true; } else if(liftRatio(ST.magY-BLOB_HI,k)<1) ST.blobUp=false; }
  else ST.blobUp=false;
  const tg=ST.blobUp?1:0; ST.blobA+=(tg-ST.blobA)*Math.min(1,dt*5); if(Math.abs(ST.blobA-tg)<0.01) ST.blobA=tg;
  const gap=ST.magY-blobTop();
  if(bottleMode()&&k&&gap<12) ST.contact+=dt; else ST.contact=Math.max(0,ST.contact-dt/3);
  /* dish: the number of spikes, with hysteresis */
  if(dishMode()&&k){ const b=Bz(zDish()*1e-3,msi(k)); let n=ST.nspike; while(n<TRUE.NMAX&&b>=spikeUp(n+1)) n++; while(n>0&&b<spikeDown(n)) n--; ST.nspike=n; } else ST.nspike=0;
}
/* how far the spikes of the bottle have grown, 0…1 */
function bottleSpike(){ const k=magKey(); if(!bottleMode()||!k) return 0; const gap=Math.max(0.2,ST.magY-blobTop()), b=Bz(gap*1e-3,msi(k)), thr=TRUE.BthrBottle*(ST.contact>10?0.9:1); return b<=thr?0:Math.min(1,(b/thr-1)*2.2); }
function hexPositions(n,lam){ const pts=[]; for(let i=-4;i<=4;i++) for(let j=-4;j<=4;j++){ const x=lam*(i+0.5*j), y=lam*Math.sqrt(3)/2*j; pts.push([Math.hypot(x,y),x,y]); } pts.sort((a,b)=>a[0]-b[0]); return pts.slice(0,n).map(p=>[p[1],p[2]]); }

const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;
const FONT="-apple-system,'Segoe UI','Malgun Gothic',sans-serif", MONO="ui-monospace,Consolas,'Courier New',monospace";
function rrect(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function vgrad(y,h,stops){ const g=ctx.createLinearGradient(0,y,0,y+h); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function hgrad(x,w,stops){ const g=ctx.createLinearGradient(x,0,x+w,0); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function ell(x,y,rx,ry,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function shade(hex,f){ if(hex[0]!=="#") return hex; if(hex.length===4) hex="#"+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

function rbox(cx,cy,z0,w,dd,h,a,top,side,edge){
  const u=v2(a), n=[-u[1],u[0]], C=(i,j)=>[cx+u[0]*i*w/2+n[0]*j*dd/2, cy+u[1]*i*w/2+n[1]*j*dd/2];
  const c=[C(-1,-1),C(1,-1),C(1,1),C(-1,1)];
  for(let k=0;k<4;k++){ const p=c[k], q=c[(k+1)%4], N=nrm2([q[1]-p[1],-(q[0]-p[0])]);
    const out=dot2(N,sub2(p,[cx,cy]))>0?N:mul2(N,-1); if(out[1]<=0.02) continue;
    const f=0.80+0.2*out[1]-0.08*out[0];
    poly([P(p[0],p[1],z0),P(q[0],q[1],z0),P(q[0],q[1],z0+h),P(p[0],p[1],z0+h)],shade(side,f-1),edge,0.6); }
  poly(c.map(p=>P(p[0],p[1],z0+h)),top,edge,0.6);
  return c;
}
function vcyl(x,y,z0,z1,r,body,top,edge){
  const b=P(x,y,z0), t=P(x,y,z1), rx=r*SC, ry=r*SC*KY;
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(b[0],b[1],rx,ry,0,0,Math.PI); ctx.lineTo(t[0]-rx,t[1]); ctx.ellipse(t[0],t[1],rx,ry,0,Math.PI,0,true); ctx.closePath(); ctx.fill();
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=0.7; ctx.stroke(); }
  ell(t[0],t[1],rx,ry,top,edge,0.7);
}
function hcyl(p0,p1,z,r,col,hi){
  const a=P(p0[0],p0[1],z), b=P(p1[0],p1[1],z);
  ctx.lineCap="round"; ctx.strokeStyle=col; ctx.lineWidth=2*r*SC; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if(hi){ ctx.strokeStyle=hi; ctx.lineWidth=Math.max(0.8,r*SC*0.5); ctx.beginPath(); ctx.moveTo(a[0],a[1]-r*SC*0.45); ctx.lineTo(b[0],b[1]-r*SC*0.45); ctx.stroke(); }
  ctx.lineCap="butt";
}

/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}
const add2=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub2=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul2=(a,k)=>[a[0]*k,a[1]*k], dot2=(a,b)=>a[0]*b[0]+a[1]*b[1],
      len2=a=>Math.hypot(a[0],a[1]), nrm2=a=>{ const l=len2(a); return l>1e-12?[a[0]/l,a[1]/l]:[1,0]; }, v2=a=>[Math.cos(a),Math.sin(a)];

const LW=1200, LH=470, SC=10, OX=60, OY=250, KY=0.5, KX=0.3;
const P=(x,y,z)=>[OX+SC*(x+KX*y), OY+SC*(KY*y-(z||0))];
const unP=(X,Y,z)=>{ const y=((Y-OY)/SC+(z||0))/KY; return [(X-OX)/SC-KX*y,y]; };
const TBL={x0:0,x1:100,y0:0,y1:40};
function abox(x0,y0,z0,x1,y1,z1,top,front,side,edge){
  poly([P(x0,y0,z0),P(x0,y1,z0),P(x0,y1,z1),P(x0,y0,z1)],side,edge,0.6);
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],front,edge,0.6);
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],top,edge,0.6);
}
const SIZE={stand:[24,18,20],tube:[26,2.4,2.4],n42:[2,2,0.5],n52a:[1.5,1.5,0.4],n52b:[1.5,1.5,0.4],wedge:[12,6,2.6],bottle:[7,3.4,3.4],dish:[16,12,4.5],pole:[30,1.2,1.2],lamp:[6,5,4],camera:[11,6,7],ruler:[31,3.2,0.2],grid:[16,3,0.1]};
const LOOSE=ITEMS;
const onBench=k=>has(k)&&ST.pos[k];
function drawTable(){ ctx.fillStyle="#2a2d33"; ctx.fillRect(0,0,LW,LH); poly([P(TBL.x0,TBL.y0,0),P(TBL.x1,TBL.y0,0),P(TBL.x1,TBL.y1,0),P(TBL.x0,TBL.y1,0)],"#d6d3c8","#a7a394",1); }
function seg3(a,b,col,w){ const p=P(...a), q=P(...b); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); }
const WH="#eeece6", WH2="#dcd9d0", WH3="#c9c5ba", WHE="#a9a49a";
function magnetAt(x,y,z,up){ /* the magnet(s) on the carrier: discs on the rod end */ let zz=z; const list=up?ST.mags:[...ST.mags];
  for(const m of list){ const [a,l]=m==="n42"?[10,5]:[7.1,3.2]; const h=l/10; if(up){ vcyl(x,y,zz,zz+h,a/10,"#a9aeb4","#d5d9dd","#6c7278"); zz+=h; } else { vcyl(x,y,zz-h,zz,a/10,"#a9aeb4","#d5d9dd","#6c7278"); zz-=h; } } }
function drawStand(){ const {x,y}=ST.pos.stand, [w,dp,h]=SIZE.stand, x0=x-w/2, x1=x+w/2, y0=y-dp/2, y1=y+dp/2;

  poly([P(x0,y0,0),P(x1,y0,0),P(x1,y0,h),P(x0,y0,h)],WH2,WHE,0.8);
  poly([P(x0,y0,0),P(x0,y1,0),P(x0,y1,h),P(x0,y0,h)],WH3,WHE,0.8); const hl=P(x0,y,17); ell(hl[0],hl[1],1.4*SC*KY,1.4*SC,"#8d8a82");

    poly([P(x-6,y-3,2.6),P(x+6,y-3,0.5),P(x+6,y+3,0.5),P(x-6,y+3,2.6)],"#2fbf6a","#0f5a2e",0.8); }
  if(isM("bottle")){ hcyl([x-2.8,y],[x+2.2,y],4.1,1.6,"rgba(215,232,240,.75)","rgba(255,255,255,.6)"); hcyl([x+2.2,y],[x+3.6,y],4.1,1.1,"#f3f3f1");
    const bt=blobTop()/10, c=P(x-0.4,y,bt-0.5); ell(c[0],c[1],1.3*SC,0.55*SC,"#141418"); }

  poly([P(x1,y0,0),P(x1,y1,0),P(x1,y1,h),P(x1,y0,h)],WH3,WHE,0.8); const hr=P(x1,y,17); ell(hr[0],hr[1],1.4*SC*KY,1.4*SC,"#8d8a82");
  poly([P(x0,y1,h-3),P(x1,y1,h-3),P(x1,y1,h),P(x0,y1,h)],WH2,WHE,0.8);
  poly([P(x0,y0,h),P(x1,y0,h),P(x1,y1,h),P(x0,y1,h)],WH,WHE,0.8);
  for(let i=0;i<7;i++) for(let j=0;j<5;j++){ if(i===3&&j===2) continue; const q=P(x0+2.5+i*3.2,y0+2+j*3.5,h); ell(q[0],q[1],0.55*SC,0.55*SC*KY,"#b5b1a6"); }

    abox(x-7.6,y-5.6,h+0.8,x+7.6,y+5.6,h+1.2,"#141418","#141418","#141418",null);
    abox(x-8,y-6,h+0.8,x+8,y+6,h+4,"rgba(210,230,240,.18)","rgba(200,222,234,.3)","rgba(190,212,224,.28)","#8fa4b0");
    abox(x-8.3,y-6.3,h+4,x+8.3,y+6.3,h+4.6,"rgba(140,150,160,.85)","#7d8790","#6c757d","#4b535a"); }
  if(isM("pole")){ const px=x1-2, py=y0+2; seg3([px,py,h],[px,py,h+32],"#8f969d",3.5); const wn=P(px,py,h+0.3); fillR(wn[0]-9,wn[1]-3,18,6,2,"#9aa0a6","#555",0.6);
    if(isM("lamp")){ const lz=h+(TRUE.dishBase+TRUE.depth+TRUE.lampH)/10+1.2; seg3([px,py,lz+0.5],[x,y,lz+0.5],"#9aa0a6",2.5); abox(x-3,y-1,lz,x+3,y+1,lz+1,WH,WH2,WH3,WHE);
      if(ST.lampOn){ const c=P(x,y,lz); ctx.fillStyle="rgba(255,244,170,.25)"; ctx.beginPath(); ctx.moveTo(c[0]-30,c[1]); ctx.lineTo(c[0]+30,c[1]); ctx.lineTo(c[0]+60,c[1]+40); ctx.lineTo(c[0]-60,c[1]+40); ctx.fill(); } }
    if(isM("camera")){ const cz=h+24; seg3([px,py,cz],[x+4,y,cz],"#9aa0a6",2.5); abox(x-1,y-2.5,cz-2,x+5,y+2.5,cz+1.5,"#2a2d33","#1c1f24","#15171b","#000"); const l=P(x+1,y,cz-2); ell(l[0],l[1],10,5,"#333","#111"); } }
}

  if(gridOn&&has("grid")){ const gx=m.X(ST.grat.x), gy=m.Y(ST.grat.y), w=60*z, h=16*z; ctx.fillStyle="rgba(220,236,246,.10)"; ctx.fillRect(gx,gy,w,h);
    ctx.strokeStyle="rgba(170,205,225,.55)"; ctx.lineWidth=1; for(let i=0;i<=60;i++){ ctx.lineWidth=i%10===0?1.6:i%5===0?1.1:0.6; ctx.beginPath(); ctx.moveTo(gx+i*z,gy); ctx.lineTo(gx+i*z,gy+h); ctx.stroke(); }
    for(let j=0;j<=16;j++){ ctx.lineWidth=j%5===0?1.1:0.6; ctx.beginPath(); ctx.moveTo(gx,gy+j*z); ctx.lineTo(gx+w,gy+j*z); ctx.stroke(); } text(t.lab.grid,gx+4,gy-8,"#9fb6c4",10,"left","600"); hitAdd("gridcam",gx,gy,w,h); }
}
/* ── 3. the threaded rod and a ruler (C.1) ── */
const TV={z:16,px:0};
function drawThreadView(){
  const t=d(); if(!has("tube")){ text(t.lab.noTube,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  ctx.fillStyle="#e9e6dc"; ctx.fillRect(0,0,CLW,CLH); const k=TV.z, x0=30-TV.px*k, y0=CLH*0.42, span=120, X=v=>x0+v*k;
  ctx.fillStyle="#b9bec4"; ctx.fillRect(Math.max(0,X(0)),y0-26,Math.min(CLW,X(span))-Math.max(0,X(0)),52); ctx.strokeStyle="#7f858c"; ctx.strokeRect(X(0),y0-26,span*k,52);
  for(let v=0;v<=span;v+=TRUE.pitch){ const a=X(v); if(a<-20||a>CLW+20) continue; ctx.strokeStyle="#7f858c"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(a,y0-26); ctx.lineTo(a+TRUE.pitch*0.55*k,y0+26); ctx.stroke(); ctx.strokeStyle="#dfe3e6"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a,y0+26); ctx.lineTo(a+TRUE.pitch*0.55*k,y0-26); ctx.stroke(); }
  if(onBench("ruler")){ const ry=y0+44, rx=X(-2+ST.rulT); ctx.fillStyle="rgba(225,240,248,.9)"; ctx.fillRect(0,ry,CLW,48); ctx.strokeStyle="#7fa8c0"; ctx.strokeRect(0,ry,CLW,48);
    for(let i=0;i<=300;i++){ const xx=rx+i*k; if(xx<-5||xx>CLW+5) continue; const ln=i%10===0?30:i%5===0?20:12; ctx.strokeStyle="#0d2a3a"; ctx.lineWidth=i%10===0?1.2:0.8; ctx.beginPath(); ctx.moveTo(xx,ry); ctx.lineTo(xx,ry+ln); ctx.stroke(); if(i%10===0) text(String(i/10),xx,ry+39,"#0d2a3a",10,"center","600"); }
    hitAdd("rulT",0,ry,CLW,48); }
  else text(d().m.needRuler,CLW/2,y0+70,"#8a8371",11.5,"center");
  hitAdd("rod",0,y0-26,CLW,52);
}
function drawClose(){
  const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CLW,CLH);
  if(tab==="side") drawSideView(); else if(tab==="cam") drawCamView(); else drawThreadView();
  ctx=old;
}
/* ══════════════════════════════════════════════════════════════
   7.  HANDS: the bench and the stand
   ══════════════════════════════════════════════════════════════ */
ST.rulT=0; ST.order=[];
const MOUNT=["tube","n42","n52a","n52b","wedge","bottle","dish","pole","lamp","camera"];
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function mount(k){
  if(!onBench("stand")){ say("needStand"); return false; }
  if(isM(k)){ say("busy"); return false; }
  if(k==="n42"||k==="n52a"||k==="n52b"){ if(!isM("tube")){ say("needTube"); return false; } if(ST.mags.length>=2){ say("full"); return false; }
    if(ST.mags.length===1){ const o=ST.mags[0]; if(o!=="n42"&&k!=="n42"){ say("twoN52"); return false; } if(o==="n42"&&k==="n42"){ say("busy"); return false; } }
    ST.mags.push(k); ST.nspike=0; ST.on.add(k); ST.mounted.add(k); ST.order.push(k); say(ST.mags.length===2?"stack":"mounted",itemName(k)); return true; }
  if(k==="bottle"&&!isM("wedge")){ say("needWedge"); return false; }
  if((k==="lamp"||k==="camera")&&!isM("pole")){ say("needPole"); return false; }
  if(k==="camera"&&!isM("dish")){ say("needDish"); return false; }
  ST.on.add(k); ST.mounted.add(k); ST.order.push(k); say("mounted",itemName(k)); return true;
}
function unmount(k){
  const deps={tube:["n42","n52a","n52b"],wedge:["bottle"],pole:["lamp","camera"],dish:["camera"]};
  for(const j of deps[k]||[]) if(isM(j)) unmount(j);
  if(k==="n42"||k==="n52a"||k==="n52b"){ ST.mags=ST.mags.filter(x=>x!==k); ST.nspike=0; }
  if(k==="lamp") ST.lampOn=false;
  ST.mounted.delete(k); ST.on.delete(k); ST.order=ST.order.filter(x=>x!==k);
}
function returnItem(k){
  if(k==="stand"){ for(const j of [...ST.order].reverse()) unmount(j); }
  if(k==="grid") gridOn=false;
  ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k));
}
function benchClick(p,right){
  if(hand){ if(right){ if(hand.move){ ST.on.add(hand.item); ST.pos[hand.item]=hand.orig; say("placed",itemName(hand.item)); } else say("back",itemName(hand.item)); hand=null; return; }
    const k=hand.item;
    if(MOUNT.includes(k)&&onBench("stand")&&inB(p,bbox("stand"),6)){ if(mount(k)) hand=null; return; }
    const [x,y]=unP(p[0],p[1],0); if(!fits(k,x,y)){ say("noFit"); return; }
    ST.pos[k]={x,y}; ST.on.add(k); say("placed",itemName(k)); hand=null; return; }
  const k=[...LOOSE].reverse().find(o=>onBench(o)&&o!=="stand"&&inB(p,bbox(o),2))||(onBench("stand")&&inB(p,bbox("stand"),2)?"stand":null); if(!k) return;
  if(right){ if(k==="stand"&&ST.order.length){ const j=ST.order[ST.order.length-1]; unmount(j); say("back",itemName(j)); return; } returnItem(k); return; }
  hand={item:k,move:true,orig:{...ST.pos[k]}}; ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k));
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(hand&&hand.move){ ST.on.add(hand.item); ST.pos[hand.item]=hand.orig; } hand=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=hand&&hand.item===k; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* the magnet carrier: dt turns, + raises the magnet */
function turn(dt){ if(!isM("tube")){ say("needTube"); return; } const p=TRUE.pitch; let real;
  if(ST.rodUp){ const nd=Math.max(0,Math.min(DROP_MAX,ST.drop-dt*p)); real=(ST.drop-nd)/p; ST.drop=nd; }
  else { const ny=Math.max(MAGY_MIN,Math.min(MAGY_MAX,ST.magY+dt*p)); real=(ny-ST.magY)/p; ST.magY=ny; }
  ST.turns+=real; if(Math.abs(real)<Math.abs(dt)-1e-9) say("end"); else say("turned",(dt>0?"▲ ":"▼ ")+fmtT(Math.abs(dt))); }
const fmtT=v=>{ const w=Math.floor(v+1e-9), f=Math.round((v-w)*4); return (w?String(w):"")+(f?["","¼","½","¾"][f]:"")||"0"; };
/* the close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  if(h.k==="ruler"){ cdrag={k:"ruler",p,x:ST.rul.x,y:ST.rul.y,z:svMap().z}; }
  else if(h.k==="gridcam"){ cdrag={k:"gridcam",p,x:ST.grat.x,y:ST.grat.y,z:camMap().z}; }
  else if(h.k==="gridmag"){ cdrag={k:"gridmag",p,x:ST.grat.x,y:ST.grat.y,z:CLW*0.32/40}; }
  else if(h.k==="rulT"){ cdrag={k:"rulT",p,x:ST.rulT}; }
  else if(h.k==="rod"){ cdrag={k:"rod",p,x:TV.px}; }
  if(cdrag) closeCv.setPointerCapture(e.pointerId); });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e), dx=p[0]-cdrag.p[0], dy=p[1]-cdrag.p[1];
  if(cdrag.k==="ruler"){ ST.rul.x=cdrag.x+dx/cdrag.z; ST.rul.y=cdrag.y-dy/cdrag.z; }
  else if(cdrag.k==="gridcam"){ ST.grat.x=cdrag.x+dx/cdrag.z; ST.grat.y=cdrag.y-dy/cdrag.z; }
  else if(cdrag.k==="gridmag"){ ST.grat.x=cdrag.x+dx/cdrag.z; ST.grat.y=cdrag.y+dy/cdrag.z; }
  else if(cdrag.k==="rulT") ST.rulT=cdrag.x+dx/TV.z;
  else if(cdrag.k==="rod") TV.px=cdrag.x-dx/TV.z; });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("wheel",e=>{ if(tab==="side"){ e.preventDefault(); turn(e.deltaY<0?0.25:-0.25); } else if(tab==="thread"){ e.preventDefault(); TV.z=Math.min(60,Math.max(4,TV.z*(e.deltaY<0?1.2:1/1.2))); } },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
for(const [id,dt] of [["u5",5],["u1",1],["uq",0.25],["d5",-5],["d1",-1],["dq",-0.25]]) $(id).onclick=()=>turn(dt);
$("zeroBtn").onclick=()=>{ ST.turns=0; };
$("rotBtn").onclick=()=>{ if(!isM("tube")){ say("needTube"); return; } ST.rodUp=!ST.rodUp; ST.drop=18; ST.magY=150; ST.nspike=0; say("rot",ST.rodUp); };
$("lampBtn").onclick=()=>{ if(ST.lampOn){ ST.lampOn=false; say("lampOff"); return; } if(!isM("lamp")){ say("needLamp"); return; } ST.lampOn=true; say("lampOn"); };
$("shakeBtn").onclick=()=>{ ST.contact=0; say("shaken"); };
$("rulBtn").onclick=()=>{ if(!onBench("ruler")){ say("needRuler"); return; } ST.rul.vert=!ST.rul.vert; };
$("gridBtn").onclick=()=>{ if(gridOn){ gridOn=false; return; } if(!has("grid")){ say("needGrid"); return; } gridOn=true; };
$("noteBtn").onclick=()=>{ const n=$("note"), s=d().lab.cnt+": "+$("dTurn").textContent;
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+s+"   "; n.focus(); n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; };
function renderPanel(){ const t=d(), v=ST.turns, a=Math.abs(v); $("dTurn").textContent=(v<-1e-9?"−":v>1e-9?"+":"")+fmtT(a)+" "+t.lab.cnt;
  $("rotBtn").textContent=ST.rodUp?t.rotUp:t.rotDn; $("lampBtn").textContent=ST.lampOn?t.lampOn:t.lampOff; $("rulBtn").textContent=ST.rul.vert?t.rulV:t.rulH; $("gridBtn").textContent=gridOn?t.gridOn:t.gridOff; }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(isM("tube")) L.push([ST.rodUp?t.st.mode.c:t.st.mode.a,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-car").textContent=t.hCar; $("zeroBtn").textContent=t.zero; $("carHint").textContent=t.carHint; $("t-h-lamp").textContent=t.hLamp; $("shakeBtn").textContent=t.shake;
  $("t-h-meas").textContent=t.hMeas; $("measHint").textContent=t.measHint; $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2019 E1 — 자기 활성 유체의 정적 응답 · HaslaLab":"APhO 2019 E1 — Static Response of a Magnetically Active Fluid · HaslaLab";
  renderTabs(); renderPanel(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){
  const now=performance.now(), dt=Math.min(0.1,(now-lastT)/1000); lastT=now; updatePhysics(dt);
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
