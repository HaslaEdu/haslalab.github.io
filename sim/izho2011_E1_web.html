  title: { ko: 'IZhO 2011 실험 — 변형, 이력, 쌍안정', en: 'IZhO 2011 — Deformation, hysteresis, and bistability' },
  subtitle: { ko: '장비: 고무줄, 기둥이 있는 나무 받침, 나무 자, 100 g 추 6 개, 줄자, 실, 핀. 1) 고무줄을 기둥에 핀으로 걸고 추를 0 → 6 개로 늘렸다가 6 → 0 개로 줄이며 길이 L 을 잽니다. 2) 자의 아래 끝을 기둥 아래에, 위 끝을 고무줄(풀린 길이 l₀ — 문제지는 약 8 cm)로 기둥 꼭대기에 매고, 자 위 끝에 추를 걸어 평형에서 고무줄 길이 l 을 잽니다. 3) 자의 아래 끝을 기둥에서 조금 떼면 두 안정 평형이 생길 수 있습니다.',
              en: 'Equipment: a rubber cord, a wooden stand with a column, a wooden ruler, six 100 g weights, a measuring tape, thread and pins. 1) Pin the cord to the column and measure its length L while loading 0 → 6 weights and unloading 6 → 0. 2) Stand the ruler\'s lower edge at the column foot, tie its top to the column top with the cord (unstretched l₀ — the sheet says about 8 cm), hang weights from the ruler top and measure the cord length l at equilibrium. 3) Moving the ruler\'s lower edge a little away from the column can give two stable equilibria.' },
  notes: { ko: [
    '과제: 1.1–1.2 추를 늘리고 줄이며 L, 상대 늘어남 ε 의 이력 고리. 2.1 평형 조건 F(l) = mg·l/a. 2.2–2.3 1 의 자료로 F(l) 과 직선 mg·l/a 여섯 개, 교점으로 평형 길이(늘릴 때/줄일 때). 2.4–2.5 실험. 3.1 F(l) = mg(l − δ)/a 의 직선이 세 번 만나는 그림, 3.2 두 안정 평형이 실제로 생기는 추의 수와 두 길이.',
    '공식 해답: 표 1 — 늘릴 때 L = 20.8, 23.1, 28.1, 37.2, 49.7, 61.3, 71.2 cm, 줄일 때 65.2, 55.3, 42.1, 31.5, 24.6, 20.8 cm. 표 2 (평형 l, 실험) — 늘릴 때 11.6, 11.7, 12.0, 13.1, 14.6, 18.4, 51.0 cm, 줄일 때 48.7, 18.2, 14.6, 13.0, 11.8, 11.6 cm. 쌍안정은 추 5–6 개에서, l ≈ 13–14 cm 과 36–44 cm.',
    '여기서 풀린 길이 l₀ 는 공식 표 2 에 맞춰 약 11.6 cm 입니다. 고무줄 길이는 줄자를 펴서 읽습니다(줄자 클릭). 자를 놓을 때는 손으로 천천히 움직여 평형을 찾으세요 — 자를 끌고 있는 동안 손에 잡고 있습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1–1.2 L while loading and unloading, the hysteresis loop of the relative elongation ε. 2.1 the equilibrium condition F(l) = mg·l/a. 2.2–2.3 from part 1, F(l) and six lines mg·l/a; their intersections give the equilibrium lengths (loading/unloading). 2.4–2.5 the experiment. 3.1 a sketch where F(l) = mg(l − δ)/a cuts three times, 3.2 the number of weights at which two stable equilibria really exist and the two lengths.',
    'Official solution: table 1 — loading L = 20.8, 23.1, 28.1, 37.2, 49.7, 61.3, 71.2 cm, unloading 65.2, 55.3, 42.1, 31.5, 24.6, 20.8 cm. Table 2 (equilibrium l, experiment) — loading 11.6, 11.7, 12.0, 13.1, 14.6, 18.4, 51.0 cm, unloading 48.7, 18.2, 14.6, 13.0, 11.8, 11.6 cm. Bistability at 5–6 weights, l ≈ 13–14 cm and 36–44 cm.',
    'Here the unstretched length l₀ is about 11.6 cm, to match the official table 2. Read the cord length with the measuring tape laid along it (click the tape). Find the equilibrium by moving the ruler slowly by hand — you hold it while dragging. The values differ a little from visit to visit.'] }
};

var LAB = { mode: 1, n: 0, eps: 0, emax: 0, ph: 0.35, w: 0, held: false, del: 0, tape: false };
PROGRAM.lab = {
  intro: { ko: '책상 끝의 나무 받침과 기둥, 고무줄, 나무 자(40 cm), 100 g 추 여섯 개, 줄자. 카드 1·2·3 으로 1(늘이기), 2(평형), 3(쌍안정) 장치를 고릅니다.',
           en: 'At the desk edge: the wooden stand with its column, the rubber cord, the 40 cm wooden ruler, six 100 g weights and the measuring tape. Cards 1, 2, 3 choose setup 1 (stretching), 2 (equilibrium) or 3 (bistability).' },
  howto: { ko: ['추 더미 클릭: 하나 더 걸기 · 걸린 추 클릭: 하나 내리기',
                '2, 3: 자의 위 끝을 끌기 — 손으로 잡고 기울이기, 놓으면 평형으로 · 3: 자의 아래 끝 위에서 휠 — 기둥에서 떨어진 거리 δ (0.5 cm)',
                '줄자 클릭: 고무줄을 따라 펴기/감기 · 카드 1·2·3 클릭: 장치 바꾸기'],
           en: ['Click the weight pile: hang one more · click a hanging weight: take one off',
                '2, 3: drag the ruler\'s top — tilt it by hand; let go and it settles · 3: wheel over the ruler\'s foot — its distance δ from the column (0.5 cm)',
                'Click the tape: lay it along the cord / roll it up · click card 1, 2 or 3: change the setup'] },
  notePlaceholder: { ko: '예) 늘릴 때 N = 0 20.8 cm, 1 23.1 cm … / 평형 l: 11.6, 11.7 … cm', en: 'e.g. loading N = 0 20.8 cm, 1 23.1 cm … / equilibrium l: 11.6, 11.7 … cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var EL = [0, 0.11, 0.35, 0.79, 1.39, 1.95, 2.42], EU = [0, 0.18, 0.51, 1.02, 1.66, 2.13, 2.42], G = 9.81, L0 = 20.8, l0 = 11.6 * (1 + S.sys('l0', 0.02)), A = 40;
    var kf = 0.93 * (1 + S.sys('kf', 0.015));
    function interp(xs, x) { /* force (in weights) at strain x on a branch given as strains at 0…6 weights */
      if (x <= 0) return 0; for (var i = 1; i < xs.length; i++) if (x <= xs[i]) return (i - 1 + (x - xs[i - 1]) / (xs[i] - xs[i - 1]));
      return 6 + (x - xs[6]) / 0.35; }
    function force(e) { /* N per … newtons, with hysteresis */
      var fl = interp(EL, e), fu = interp(EU, e);
      if (e >= LAB.emax - 1e-6) return fl * 0.981 * kf;
      var fm = interp(EL, LAB.emax), fum = interp(EU, LAB.emax), s = LAB.emax > 0 ? Math.pow(e / LAB.emax, 4) : 0;
      return (fu + (fm - fum) * s) * 0.981 * kf; }
    var tape = B3.scaleTex(80, { horiz: true, width: 1.6, bg: '#f3d23a', every: 5 });
    var CX = 0, YB = 0;                                     /* column at x = 0, its foot on the desk */
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, wheelIds: ['foot'],
      home: { yaw: -0.15, pitch: 0.2, k: 6.2, tx: 10, ty: 12, tz: 0 },
      views: {},
      frame: function (b) {
        for (var q = 1; q <= 3; q++) if (b.clicked('c:card' + q)) { LAB.mode = q; LAB.emax = 0; LAB.eps = 0; LAB.ph = 0.3; LAB.w = 0; LAB.n = 0; LAB.del = 0; }
        if (b.clicked('c:pile') && LAB.n < 6) LAB.n++;
        if (b.clicked('c:hung') && LAB.n > 0) LAB.n--;
        if (b.clicked('c:tape')) LAB.tape = !LAB.tape;
        var wf = b.wheel('foot'); if (wf && LAB.mode === 3) LAB.del = Math.max(0, Math.min(6, LAB.del + wf * 0.5));
        B3.desk(-30, 40, -18, 20);
        /* stand and column */
        B3.box3(-6, 16, 0, 1.5, -6, 6, '#b8875a', { top: '#c99a6b' }); B3.boxY(-3, 0, 1.5, A + 1.5, -2, 2, '#a87850', { top: '#b98a60' }, 6);
        var top = [CX, A + 1.5, 0], len, ends;
        if (LAB.mode === 1) {
          /* the cord hangs down the column's side; weights at its end: settle quasi-statically along the branch */
          var target = LAB.n * 0.981, e = LAB.eps, de = 0.002, guard = 0;
          while (guard++ < 4000) { var fN = force(e); if (Math.abs(fN - target) < 0.004) break; e += fN < target ? de : -de; if (e < 0) { e = 0; break; } if (e > LAB.emax) LAB.emax = e; }
          LAB.eps = e; len = L0 * (1 + e); var bot = [CX + 0.6, top[1] - len, 2.2];
          B3.line3([CX + 0.6, top[1], 2.2], bot, '#2b2b2b', 3);
          for (var k = 0; k < LAB.n; k++) B3.cyl3('y', bot[1] - 2.2 - k * 2.3, bot[1] - 0.4 - k * 2.3, bot[0], bot[2], 1.0, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:hung' });
          ends = [[CX + 0.6, top[1], 2.4], bot];
        } else {
          /* ruler pivoted at (δ, 1.5) — torques: weights m g a sinφ, cord F(l)·dl/dφ */
          var P = [CX + LAB.del, YB + 1.5], m = LAB.n * 0.1, J = (m + 0.03 / 3) * A * A / 1e4 + 1e-4;
          var Rp = function (ph) { return [P[0] + A * Math.sin(ph), P[1] + A * Math.cos(ph)]; }, lof = function (ph) { var R = Rp(ph); return Math.hypot(R[0] - top[0], R[1] - top[1]); };
          if (b.dragging('ruler')) { var mv = b.screenMoved('ruler'); LAB.ph = Math.max(0.02, Math.min(1.6, LAB.ph + mv[0] / A - mv[1] / A * 0.3)); LAB.w = 0; LAB.held = true; }
          else LAB.held = false;
          if (!LAB.held && b.dt > 0) { var n = Math.ceil(b.dt / 0.001), h = b.dt / n;
            for (var i = 0; i < n; i++) { var l = lof(LAB.ph), eps = Math.max(0, (l - l0) / l0); if (eps > LAB.emax) LAB.emax = eps;
              var dl = (lof(LAB.ph + 1e-4) - lof(LAB.ph - 1e-4)) / 2e-4 / 100, Q = m * G * A / 100 * Math.sin(LAB.ph) - force(eps) * dl;
              LAB.w += (Q / J - 2.5 * LAB.w) * h; LAB.ph += LAB.w * h; if (LAB.ph < 0.02) { LAB.ph = 0.02; LAB.w = 0; } if (LAB.ph > 1.6) { LAB.ph = 1.6; LAB.w = 0; } } }
          else { var l2 = lof(LAB.ph), e2 = Math.max(0, (l2 - l0) / l0); if (e2 > LAB.emax) LAB.emax = e2; }
          var R = Rp(LAB.ph); len = lof(LAB.ph);
          B3.obox([(P[0] + R[0]) / 2, (P[1] + R[1]) / 2, 0], [Math.sin(LAB.ph), Math.cos(LAB.ph), 0], [0, 0, 1], A / 2, 0.25, 1.5, '#d9c48f', { id: 'm:ruler' });
          B3.box3(P[0] - 0.6, P[0] + 0.6, 1.5, 2.1, -1.8, 1.8, '#5d4630', { id: 'm:foot' });
          B3.line3([top[0], top[1], 1.6], [R[0], R[1], 1.6], '#2b2b2b', 3);
          for (k = 0; k < LAB.n; k++) B3.cyl3('y', R[1] - 6 - k * 2.3, R[1] - 4.2 - k * 2.3, R[0] + 0.4, 0, 1.0, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:hung' });
          if (LAB.n) B3.line3([R[0], R[1], 0], [R[0] + 0.4, R[1] - 4.2, 0], '#e8e8e8', 1.2);
          ends = [[top[0], top[1], 1.8], [R[0], R[1], 1.8]];
        }
        /* the tape laid along the cord */
        if (LAB.tape) { var d0 = ends[0], d1 = ends[1], L = Math.hypot(d1[0] - d0[0], d1[1] - d0[1]), u = [(d1[0] - d0[0]) / L, (d1[1] - d0[1]) / L, 0];
          B3.tex3(tape, 0, 0, tape.width, tape.height, [d0[0] - u[0] - 0.8 * u[1], d0[1] - u[1] + 0.8 * u[0], d0[2] + 0.05], [u[0] * 82, u[1] * 82, 0], [u[1] * 1.6, -u[0] * 1.6, 0], { id: 'c:tape' }); }
        B3.cyl3('z', -1, 1, 26, 3, 3, '#f3d23a', { seg: 20, cap: '#e0c030', id: 'c:tape' });
        for (k = 0; k < 6 - LAB.n; k++) B3.cyl3('y', 0, 1.8, 20 + (k % 3) * 2.4, 12 + Math.floor(k / 3) * 2.4, 1.0, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:pile' });
        [1, 2, 3].forEach(function (q2) { var x = 18 + q2 * 5; B3.box3(x - 2, x + 2, 0, 0.1, -14, -10, q2 === LAB.mode ? '#ffd479' : '#e8e4d8', { id: 'c:card' + q2 });
          B3.text3([x - 0.6, 0.12, -11], [1, 0, 0], [0, 0, -1], String(q2), 1.8, '#333', { weight: '800' }); });
        LAB.state = { mode: LAB.mode, n: LAB.n, len: len, phi: LAB.ph * 180 / Math.PI, emax: LAB.emax, del: LAB.del };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
