<script>
/* NBPhO 2007 problem 8 "Laser" on the 3-D bench.  The strip is coated with tiny glass spheres; each sends the
   light back towards the laser, and since every sphere acts alike the pattern is that of one reflecting disc
   of about the sphere's size — concentric rings around the hole in the paper, the same for any incidence
   angle (slightly elongated along the slant at large angles) and nowhere near the mirror reflection.  The
   rings are an Airy pattern from an effective disc chosen so that the first dark ring is 1.1 cm across at
   80 cm, as in the official solution (which estimates D ≈ λl/d ≈ 50 µm). */
var PROGRAM = {
  title: { ko: 'NBPhO 2007 실험 8 — 레이저', en: 'NBPhO 2007 Problem 8 — Laser' },
  subtitle: { ko: '장비: 레이저(λ = 650 nm), 자, 스탠드, 반사띠, 원형 구멍이 뚫린 종이, 연필. 반사띠에는 같은 지름의 작은 유리알이 빽빽이 붙어 있습니다. 1) 여러 입사각에서 보이는 회절 무늬의 위치와 모양을 기술하세요. 2) 현상을 정성적으로 설명하세요. 3) 유리알의 지름을 어림하세요.',
              en: 'Apparatus: a laser (λ = 650 nm), a ruler, a stand, a strip of reflecting material, a sheet of paper with a circular hole and a pencil. The strip is coated with densely packed tiny glass spheres of equal diameter. 1) Describe the position and geometry of the diffraction pattern for different incidence angles. 2) Explain the phenomenon qualitatively. 3) Estimate the diameter of the spheres.' },
  notes: { ko: [
    '공식 해답: 무늬는 레이저 쪽으로 되돌아온 동심원이라, 레이저 빛을 종이 구멍으로 통과시키고 그 종이를 화면으로 쓰면 보입니다. 입사각을 바꿔도 위치와 크기가 그대로이고(큰 각에서는 기울인 방향으로 조금 길쭉), 거울 반사 방향에는 없습니다.',
    '알 하나가 빛을 되돌려 보내고 모든 알이 같은 방향에 극대·극소를 주므로, 알 크기의 반사 원판 하나의 회절처럼 보입니다.',
    '해답은 l ≈ 80 cm 에서 첫 어두운 고리의 지름 d ≈ 1.1 cm 로 D ≈ λl/d ≈ 50 µm 라고 어림합니다 (원판의 첫 극소 1.22λ/D 를 쓰면 약 2.4 배). 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Official solution: the pattern is concentric rings sent back towards the laser — pass the beam through the hole in the paper and use the paper as the screen. Their position and size do not depend on the incidence angle (somewhat elongated along the slant at large angles), and they are nowhere near the mirror reflection.',
    'Each sphere returns the light, and all spheres put their maxima and minima in the same directions, so it looks like diffraction on one reflecting disc of about the sphere\'s size.',
    'The solution measured the first dark ring d ≈ 1.1 cm across at l ≈ 80 cm and estimated D ≈ λl/d ≈ 50 µm (with a disc\'s first minimum at 1.22λ/D it is about 2.4 times more). The value differs a little from visit to visit.'] }
};

var LAB = { l: 80, th: 0, marks: [] };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드의 레이저, 그 앞에 붙인 구멍 뚫린 종이(아래 가장자리에 자), 받침에 세운 반사띠, 종이에서 시작하는 1 m 줄자.',
           en: 'On the desk: the laser on its stand, the paper with the hole fixed in front of it (a ruler against its lower edge), the reflecting strip upright on a holder, and a 1 m tape starting at the paper.' },
  howto: { ko: ['반사띠 받침 끌기: 레이저와의 거리 l 바꾸기 · 반사띠 좌우로 끌기 또는 휠: 돌려서 입사각 바꾸기',
                '레이저나 종이 클릭: 반사띠 쪽에서 종이 가까이 보기 — 클릭으로 연필 점 찍기, 휠로 확대',
                '줄자 클릭: 받침 위치 가까이 읽기'],
           en: ['Drag the strip\'s holder: change the distance l · drag the strip left/right or roll the wheel: turn it to change the incidence',
                'Click the laser or the paper: look at the paper from the strip\'s side — click to put pencil dots, wheel to zoom',
                'Click the tape: read the holder\'s position closely'] },
  notePlaceholder: { ko: '예) l = 80.0 cm: 첫 어두운 고리 지름 1.1 cm; l = 100 cm: 1.4 cm …; 기울여도 그대로', en: 'e.g. l = 80.0 cm: first dark ring 1.1 cm across; l = 100 cm: 1.4 cm …; unchanged when tilted' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var lam = 6.5e-5, D = 2.44 * lam * 80 / 1.1 * (1 + S.sys('D', 0.06)), BH = 14, PXp = -34, PW = 15;
    var tape = B3.scaleTex(100, { horiz: true, width: 2.6, bg: '#f2d33c', label: 'cm' }), rul = B3.scaleTex(15, { horiz: true, width: 2.4, bg: '#e9eef2', label: 'cm' });
    function J1(x) { var s = 0, N = 48; for (var i = 0; i < N; i++) { var t = (i + 0.5) / N * Math.PI; s += Math.cos(t - x * Math.sin(t)); } return s / N; }
    var NP = 600, pxcm = NP / PW, lut = new Float32Array(1800);
    var speck = new Float32Array(NP * NP); for (var i = 0; i < speck.length; i++) speck[i] = 0.7 + 0.6 * Math.random();
    var pat = document.createElement('canvas'); pat.width = pat.height = NP; var pg = pat.getContext('2d'), key = '';
    function drawPattern(l, th) {
      var k = l.toFixed(2) + ',' + th.toFixed(3); if (k === key) return; key = k;
      for (var q = 0; q < 1800; q++) { var rho = q * 0.25 / pxcm, phi = rho / l, x = Math.PI * D * phi / lam, I = x < 1e-6 ? 1 : Math.pow(2 * J1(x) / x, 2);
        lut[q] = Math.pow(I, 0.3) * Math.exp(-Math.pow(phi / (8 * lam / D), 2)); }
      var A = Math.cos(th), el = 0.85 + 0.15 * Math.cos(th), img = pg.createImageData(NP, NP), d = img.data;
      for (var j = 0; j < NP; j++) for (var ii = 0; ii < NP; ii++) {
        var dz = (ii - NP / 2) * el, dy = j - NP / 2, r = Math.sqrt(dz * dz + dy * dy), q2 = Math.min(1799, Math.round(r * 4)), v = Math.min(1, lut[q2] * A * speck[j * NP + ii] * 1.7), o = (j * NP + ii) * 4;
        d[o] = 250; d[o + 1] = Math.round(248 * (1 - v) + 30 * v); d[o + 2] = Math.round(240 * (1 - v) + 30 * v); d[o + 3] = 255; }
      pg.putImageData(img, 0, 0);
    }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['strip'],
      home: { yaw: -0.35, pitch: 0.5, k: 7, tx: 10, ty: 8, tz: 0 },
      views: {
        paper: { yaw: Math.PI / 2, pitch: 0, k: 38, tx: PXp, ty: BH - 1, tz: 0, title: { ko: '종이 (반사띠 쪽에서)', en: 'The paper (from the strip\'s side)' },
                 hint: { ko: '클릭: 연필 점 · 휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Click: pencil dot · wheel: zoom · drag empty space: pan · Esc: back' } },
        tape: { yaw: 0, pitch: 1.3, k: 30, tx: 0, ty: 0, tz: 7, title: { ko: '줄자', en: 'The tape' } }
      },
      frame: function (b) {
        var mv = b.moved('holder'); if (mv[0]) LAB.l = Math.max(15, Math.min(110, LAB.l + mv[0]));
        var ms = b.screenMoved('strip'), wsd = b.wheel('strip'); if (ms[0] || wsd) LAB.th = Math.max(-1.3, Math.min(1.3, LAB.th + ms[0] * 0.03 + wsd * 0.01));
        var th = LAB.th, xs = PXp + LAB.l, inPaper = b.view === 'paper';
        drawPattern(LAB.l, th);
        B3.desk(-50, 85, -20, 20);
        /* the laser on its stand */
        B3.box3(-46, -38, 0, 1.4, -5, 5, '#3b4048', { id: 'm:paper', top: '#474c55' }); B3.cyl3('y', 1.4, BH - 1.4, -42, 0, 0.6, '#c3c8cd', { seg: 12, id: 'm:paper' });
        B3.cylAB([-46, BH, 0], [PXp - 0.6, BH, 0], 1.3, '#2b2f35', { seg: 18, id: 'm:paper' });
        /* the paper with the hole, the pattern drawn on it, the pencil dots */
        var pan = b.panel('paper', 300, 300, function (ui) { var g = ui.g; g.drawImage(pat, 0, 0, 300, 300);
          g.fillStyle = '#26221e'; g.beginPath(); g.arc(150, 150, 0.2 * 20, 0, 7); g.fill();
          var e = ui.hit('sheet', { x: 0, y: 0, w: 300, h: 300 });
          if (e.click && b.view === 'paper' && e.x !== undefined) { LAB.marks.push([e.x, e.y]); if (LAB.marks.length > 40) LAB.marks.shift(); }
          g.fillStyle = '#333'; LAB.marks.forEach(function (m) { g.beginPath(); g.arc(m[0], m[1], 1.3, 0, 7); g.fill(); }); });
        B3.tex3(pan, 0, 0, pan.width, pan.height, [PXp + 0.02, BH + PW / 2, PW / 2], [0, 0, -PW], [0, -PW, 0], { id: 'p:paper' });
        B3.tex3(pan, 0, 0, 2, 2, [PXp - 0.01, BH + PW / 2, -PW / 2], [0, 0, PW], [0, -PW, 0], { id: 'm:paper' });
        B3.tex3(rul, 0, 0, rul.width, rul.height, [PXp + 0.25, BH - PW / 2 + 2.4, PW / 2 + 0.5], [0, 0, -(PW + 1)], [0, -2.4, 0]);
        /* the tape on the desk, 0 at the paper */
        B3.tex3(tape, 0, 0, tape.width, tape.height, [PXp - 0.5, 0.02, 6], [101, 0, 0], [0, 0, 2.6], { id: 'c:tape' });
        if (b.clicked('c:tape')) b.go('tape');
        /* the strip on its holder */
        if (!inPaper) {
          B3.box3(xs - 3, xs + 3, 0, 1.2, -3, 3, '#3a3f46', { id: 'm:holder', top: '#474c55' });
          B3.cyl3('y', 1.2, BH - 5, xs + 1.2, 0, 0.45, '#9aa0a6', { seg: 10, id: 'm:holder' });
          var t = [Math.sin(th), 0, Math.cos(th)], nn = [-Math.cos(th), 0, Math.sin(th)];
          B3.obox([xs, BH, 0], t, [0, 1, 0], 1.6, 6, 0.15, '#c9ccd0', { id: 'm:strip' });
          /* the beams: in through the hole, the mirror reflection off to the side */
          B3.line3([PXp, BH, 0], [xs, BH, 0], 'rgba(255,40,40,.75)', 1.6);
          if (Math.abs(th) > 0.04) { var rd = [-Math.cos(2 * th), 0, Math.sin(2 * th)]; B3.line3([xs, BH, 0], [xs + rd[0] * 60, BH, rd[2] * 60], 'rgba(255,40,40,.45)', 1.3); }
        }
        b.views.tape.tx = xs;
        LAB.state = { l: LAB.l, th: th, D: D, dark1: 2 * 1.22 * lam * LAB.l / D };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
