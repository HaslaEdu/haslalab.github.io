<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;

  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);

  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (cm unless marked)

const U=(a,b)=>a+Math.random()*(b-a), SGN=()=>Math.random()<0.5?-1:1;

const TRUE={
  u:U(0.085,0.093),                              /* one unit of the arbitrary scale (cm) */
  d1:U(1.85,2.15)*1e-4, d2:U(0.92,1.08)*1e-4,    /* the gratings: by slit A, lines across the slit; by slit B, lines along it */

    if(!best||s<best[0]){ let n=[e[1],-e[0]]; const L=Math.hypot(n[0],n[1]); n=[n[0]/L,n[1]/L]; const cx=P.reduce((t,v)=>t+v[0],0)/P.length, cy=P.reduce((t,v)=>t+v[1],0)/P.length; if((A[0]-cx)*n[0]+(A[1]-cy)*n[1]<0) n=[-n[0],-n[1]]; best=[s,n]; } }

/* trace from the slit that faces the laser; dir: +1 from slit A towards B, −1 the other way.  Returns rays leaving through the far slit. */
function traceBox(p0,k0){ const out=[], segs=[]; let stack=[{p:p0,k:k0,I:1,hits:0}], n=0;

window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
/* the close-ups: the paper (zoom, move, mark), the cube on its turntable (turn it) */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return;
  if(cdrag.k==="paper"){ const dx=cmouse[0]-cdrag.p[0], dy=cmouse[1]-cdrag.p[1]; if(Math.hypot(dx,dy)>3) cdrag.moved=true; VIEW.cx=cdrag.v[0]-dx/VIEW.s; VIEW.cy=cdrag.v[1]+dy/VIEW.s; }
  if(cdrag.k==="box"){ const a=Math.atan2(cmouse[1]-PM.cy,cmouse[0]-PM.cx)*180/Math.PI; let da=a-cdrag.a; if(da>180) da-=360; if(da<-180) da+=360; cdrag.a=a; setPsi(ST.psi+da*(e.shiftKey?0.1:1)); } });
closeCv.addEventListener("pointerup",e=>{ if(cdrag&&cdrag.k==="paper"&&!cdrag.moved&&e.button===0){ if(ST.at.paper!=="screen"){ say("needFor",itemName("paper")); } else { const [u,v]=fromPX(cdrag.p[0],cdrag.p[1]); if(u>=0&&v>=0&&u<=paperW()&&v<=paperH()){ ST.marks.push([u,v]); say("marked",u.toFixed(1),v.toFixed(1)); } } } cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(!h) return;
  if(h.k==="paper"){ if(e.button===2){ let bi=-1, bd=10; ST.marks.forEach(([u,v],i)=>{ const q=PX(u,v), dd=Math.hypot(q[0]-p[0],q[1]-p[1]); if(dd<bd){ bd=dd; bi=i; } }); if(bi>=0){ ST.marks.splice(bi,1); say("unmarked"); } return; }
    cdrag={k:"paper",p,v:[VIEW.cx,VIEW.cy],moved:false}; closeCv.setPointerCapture(e.pointerId); return; }
  if(e.button!==0) return;
  if(h.k==="box"){ cdrag={k:"box",a:Math.atan2(p[1]-PM.cy,p[0]-PM.cx)*180/Math.PI}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="flip") return doFlip(); if(h.k==="zero") return setPsi(0); });
closeCv.addEventListener("wheel",e=>{ if(tab!=="screen"||!VIEW) return; e.preventDefault(); const p=clpos(e), [u,v]=fromPX(p[0],p[1]), f=e.deltaY<0?1.2:1/1.2; VIEW.s=Math.max(0.8,Math.min(40,VIEW.s*f)); const [u2,v2]=fromPX(p[0],p[1]); VIEW.cx+=u-u2; VIEW.cy+=v-v2; },{passive:false});
closeCv.addEventListener("dblclick",()=>{ if(tab==="screen") viewFit(); });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
function setPsi(v){ if(ST.at.box!=="platform"){ say("needFor",itemName("box")); return; } ST.psi=Math.max(-80,Math.min(80,Math.round(v*100)/100)); }
function doFlip(){ if(ST.at.box!=="platform"){ say("needFor",itemName("box")); return; } ST.flip=!ST.flip; say(ST.flip?"flipB":"flipA"); }
function setXp(v){ if(!onRail("platform")){ say("needFor",itemName("platform")); return; } ST.xp=Math.max(XP_MIN,Math.min(XP_MAX,Math.round(v*1000)/1000)); }
for(const [id,dv] of [["xm10",-10],["xm1",-1],["xm01",-0.1],["xp01",0.1],["xp1",1],["xp10",10]]) $(id).onclick=()=>setXp(ST.xp+dv);
for(const [id,dv] of [["am5",-5],["am1",-1],["am02",-0.2],["ap02",0.2],["ap1",1],["ap5",5]]) $(id).onclick=()=>setPsi(ST.psi+dv);
$("lasBtn").onclick=()=>{ if(!onRail("laser")){ say("needFor",itemName("laser")); return; } ST.laserOn=!ST.laserOn; };
$("flipBtn").onclick=doFlip; $("clrBtn").onclick=()=>{ ST.marks=[]; say("cleared"); }; $("fitBtn").onclick=()=>{ setTab("screen"); viewFit(); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  $("lasBtn").textContent=ST.laserOn?t.lasOff:t.lasOn; $("lasBtn").className=ST.laserOn?"on":"";
  $("flipBtn").textContent=t.flip; $("nMarks").textContent=t.nMarks(ST.marks.length); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.laserOn&&onRail("laser")&&!onRail("screen")) L.push([t.st.noScreen,true]);
  if(ST.laserOn&&boxOn()&&!beam().spots.length&&onRail("screen")) L.push([t.st.dark,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-l","hL"],["t-h-x","hX"],["t-h-a","hA"],["t-h-s","hS"],["clrBtn","clr"],["fitBtn","fit"],["xHint","xHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0;
function tick(){ ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); VIEW=null; });
applyLang(); requestAnimationFrame(tick);
</script>
