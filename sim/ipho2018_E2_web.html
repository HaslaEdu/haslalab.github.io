   1.  RANDOM
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2018e2)>>>0);
function gauss(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
const jit=s=>1+s*gauss();

  return SHAPE[k].map(([x,y,w,h])=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([u,v])=>{ const [p,q]=rot(u,v,a); return [pos.x+p,pos.y+q]; })); }

  for(const poly of [A,B]) for(let i=0;i<4;i++){ const p=poly[i], q=poly[(i+1)%4], nx=q[1]-p[1], ny=p[0]-q[0];
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const c of A){ const s=c[0]*nx+c[1]*ny; a0=Math.min(a0,s); a1=Math.max(a1,s); }
    for(const c of B){ const s=c[0]*nx+c[1]*ny; b0=Math.min(b0,s); b1=Math.max(b1,s); }
    if(a1<b0||b1<a0) return false; }

}
const MAY_SHARE=new Set(["stand|scale","scale|stand","stand|laser","laser|stand"]);   /* both sit on the rails */
function fits(k,pos){
  const mine=corners(k,pos);
  for(const poly of mine) for(const c of poly) if(c[0]<0||c[0]>TW||c[1]<0||c[1]>TD) return false;
  for(const o of PLACE){ if(o===k||!ST.on[o]||MAY_SHARE.has(k+"|"+o)) continue;
    for(const A of mine) for(const B of corners(o)) if(polyOverlap(A,B)) return false; }
  return true;
}

  return SHAPE[k].some(([x,y,w,h])=>u>=x-0.5&&u<=x+w+0.5&&v>=y-0.5&&v<=y+h+0.5); }

/* ── the light: trace the beam from the aperture ── */
function segHit(o,dir,a,b){
  const ex=b[0]-a[0], ey=b[1]-a[1], den=dir[0]*ey-dir[1]*ex; if(Math.abs(den)<1e-12) return null;

  const legs=[], spots=[]; let diff=null, D=0, screen=null;
  for(let n=0;n<8;n++){

    for(const t of [(dir[0]>0?(TW-o[0]):-o[0])/dir[0], (dir[1]>0?(TD-o[1]):-o[1])/dir[1]]) if(t>0&&t<best.t) best={t,kind:"edge"};
    if(ST.on.stand){ const s=ST.pos.stand; for(const [a,b] of [[[-1.5,-1.5],[1.5,-1.5]],[[1.5,-1.5],[1.5,1.5]],[[1.5,1.5],[-1.5,1.5]],[[-1.5,1.5],[-1.5,-1.5]]]){
        const h=segHit(o,dir,[s.x+a[0],s.y+a[1]],[s.x+b[0],s.y+b[1]]); if(h&&h.t<best.t) best={t:h.t,kind:"block"}; } }
    if(hungState()&&!diff){ const p=P(), wx=p[0]-o[0], wy=p[1]-o[1], t=wx*dir[0]+wy*dir[1];
      if(t>1e-6&&Math.abs(wx*dir[1]-wy*dir[0])<0.12&&t<best.t) best={t,kind:"thread"}; }

function benchClick(p,right){

    for(const k of ORDER.slice().reverse()) if(inItem(k,c)){
      if(busy(k)){ say("busy"); return; }
      if(k==="scale"&&ST.thread==="lying") ST.thread="none";
      if(k==="laser") ST.laserOn=false;

    return;
  }

    const mv=hand.move; returnHand(); say(mv?"stays":"back",itemName(k)); return; }

  say("rot",tgt.a.toFixed(k==="laser"?2:1)); }

cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p; const c=cm(p);
  if(hand&&hand.move&&PLACE.includes(hand.k)){ ST.pos[hand.k]={...ST.pos[hand.k],x:c[0]-hand.off[0],y:c[1]-hand.off[1]}; }
  else if(hand&&hand.pos){ hand.pos.x=c[0]; hand.pos.y=c[1]; } });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
let trayDrag=false;
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; if(hand.pos){ hand.pos.x=p[0]/PX; hand.pos.y=p[1]/PX; } benchClick(p,false); drawTray(); } trayDrag=false; });
cv.addEventListener("wheel",e=>{ const c=cm(lpos(e)); let k=null;
  if(hand&&["laser","mirror1","mirror2","screen"].includes(hand.k)) k=hand.k;
  else for(const o of ["screen","mirror2","mirror1","laser"]) if(inItem(o,c)){ k=o; break; }
  if(!k) return; e.preventDefault(); rotate(k,e.deltaY>0?1:-1,e.shiftKey); },{passive:false});
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&(hand.k===k||(k==="mirror"&&hand.k.startsWith("mirror")))&&!hand.move;
    if(hand) returnHand(); if(!same) takeFromTray(k); drawTray(); return; }
});
/* close up: the tape in the side view, the ruler and the zoom on the screen */
let rulerDrag=null;
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e);
  for(const [bx,by,z] of ZBTN) if(p[0]>=bx&&p[0]<=bx+44&&p[1]>=by&&p[1]<=by+18){ ST.zoom=z; return; }
  if(p[0]<ELV.x+ELV.w){
    if(hand&&hand.k==="tape"){
      if(e.button===2){ hand.a=null; return; }
      const id=["top","bot"].find(id=>{ const q=elevPx(id); return q&&near(p,q,10); }); if(!id){ say("noSnap"); return; }
      if(!hand.a||hand.view!=="elev"){ hand.a=id; hand.view="elev"; say("tape2"); return; }
      if(id===hand.a) return;
      const s=elevSnaps(); ST.tape={view:"elev",a:hand.a,b:id,txt:tapeRead(s[hand.a],s[id])}; say("tapeRead",ST.tape.txt); hand.a=null; return; }
    if(e.button===0&&!hand){ const q=elevPx("top"); if(q&&near(p,q,12)&&hang()) return;
      const b=elevPx("bot"); if(b&&near(p,b,14)&&ST.thread==="hung"){ ST.thread="detached"; say("unscrew"); } }
    return;
  }
  if(p[0]>=SCR.x&&p[0]<=SCR.x+SCR.w&&ST.ruler&&e.button===0){ rulerDrag={x:p[0],r:ST.rulerX}; closeCv.setPointerCapture(e.pointerId); }
});
closeCv.addEventListener("pointermove",e=>{ if(!rulerDrag) return; const p=clpos(e); ST.rulerX=rulerDrag.r+(p[0]-rulerDrag.x)/(SCR.w/ST.zoom); });
closeCv.addEventListener("pointerup",()=>{ rulerDrag=null; });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL
   ══════════════════════════════════════════════════════════════ */
$("swBtn").onclick=()=>{ ST.swRun=!ST.swRun; renderPanel(); };
$("swLap").onclick=()=>{ ST.laps.unshift({t:fmt(ST.sw),g:SC.text()}); ST.laps=ST.laps.slice(0,60); say("lap",fmt(ST.sw),SC.text()); renderPanel(); };
$("swReset").onclick=()=>{ ST.sw=0; ST.laps=[]; renderPanel(); };
$("scOn").onclick=()=>{ if(!ST.on.scale){ say("picked",itemName("scale")); return; } scaleOnOff(); };
$("scTare").onclick=tare;
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,10,60,300]){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===speed?"on":"";
    b.onclick=()=>{ speed=s; renderSpeeds(); }; box.appendChild(b); } }
function renderPanel(){ const t=d(); $("swBtn").textContent=ST.swRun?t.stop:t.start;
  $("laps").innerHTML=ST.laps.map((s,i)=>"<div>"+(ST.laps.length-i)+". "+s.t+(s.g?" · "+s.g+" g":"")+"</div>").join(""); }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.stand||!ST.on.scale) L.push([t.st.none,false]);
  if(SC.on&&SC.warm<600) L.push([t.st.warm,false]);
  if(ST.thread==="hung") L.push([t.st.hung(fmt(ST.tHung)),false]);
  if(ST.thread==="shortHung") L.push([t.st.shortHung(fmt(ST.tShort)),false]);
  if(ST.laserOn&&ST.on.laser) L.push([t.st.laserOn,true]);
  if(ST.laserOn&&hungState()&&beam&&!beam.diff) L.push([t.st.noHit,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-sw").textContent=t.hSw; $("swLap").textContent=t.lap; $("swReset").textContent=t.reset;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-scale").textContent=t.hScale; $("scOn").textContent=t.on; $("scTare").textContent=t.tare; $("t-sync").textContent=t.sync;
  $("t-scalehint").textContent=t.scaleHint; $("t-h-tape").textContent=t.hTape; $("t-tapehint").textContent=t.tapeHint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2018 E2 — 고분자 실의 점탄성 · HaslaLab":"IPhO 2018 E2 — Viscoelasticity of a Polymer Thread · HaslaLab";
  renderPanel(); renderSpeeds(); renderStatus(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   8.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let tPrev=performance.now()/1000, frame=0, scT=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  const sdt=dt*speed; ST.t+=sdt; if(ST.swRun) ST.sw+=sdt;
  if(ST.thread==="hung") ST.tHung+=sdt; if(ST.thread==="shortHung") ST.tShort+=sdt;
  const target=!ST.on.scale?0: ST.thread==="hung"? TH.mass*1e3-TH.force(ST.tHung) : massOnScale()? TH.mass*1e3 : 0;
  SC.update(target,sdt);
  scT-=dt; if(scT<=0){ $("scaleLbl").textContent=SC.on?SC.text()+" g":"—"; scT=0.3; }
  beam=trace();
  ctx.clearRect(0,0,LW,LH); drawBench();
  $("swLbl").textContent=fmt(ST.sw);
  if(++frame%3===0) drawClose();
  if(frame%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
