var PROGRAM = {
  title: { ko: 'IZhO 2026 실험 — 비틀림: 퍼텐셜 곡선 만들기', en: 'IZhO 2026 — Torsion: construction of the potential curve' },
  subtitle: { ko: '두 개의 수직 실에 매단 금속 막대(길이 a = 25 cm, m₁ = 50.0 g, 너트 m₂ = 6.4 g 두 개)를 반 바퀴 돌려 실이 닿게 한 뒤(2), N 바퀴 더 꼬고(3) 1/4 바퀴 더 돌려 놓습니다. 막대가 다시 (3) 을 지날 때 스톱워치를 켜고 풀리는 바퀴 수 k 마다 시간을 잽니다. 에너지 단위 Ku: E = V² (V 는 초당 바퀴 수). 운동 법칙 t(k) = A·k^α, 에너지 E(k), 단계별 측정, 풀림 시간 T(N) = G·N^γ 로 퍼텐셜 곡선 U(N) = B·N^β 를 구하세요.',
              en: 'A metal rod (length a = 25 cm, m₁ = 50.0 g, two nuts m₂ = 6.4 g) hangs on two vertical threads. Turn it half a turn so the threads touch (2), twist N full turns more (3), add a quarter turn and release. Start the stopwatch when the rod passes (3) again and time each unwound turn k. Energy unit Ku: E = V² (V in turns per second). From the law of motion t(k) = A·k^α, the energy E(k), step-by-step probing and the unwinding time T(N) = G·N^γ, build the potential curve U(N) = B·N^β.' },
  notes: { ko: [
    '과제: 1.1 Ku 를 J 로; 1.2 V(k), E(k) 를 A, α 로; 1.3 γ 를 β 로. 2 N = 30 에서 k = 0…30 을 3 바퀴마다 (랩 메모리), V(k) = 6/(t(k+3) − t(k−3)), E(k), ln t–ln k 로 A, α. 3 구간 (35→25, 30→20, …, 10→0) 마다 k = 1…10 을 한 바퀴씩, k = 5…10 직선으로 A, α, E₅₋₁₀; 이어 붙여 E(k). 4 N = 5, 10, …, 30 의 풀림 시간 T(N), N = 10 에서 5 번 이상 재어 오차, γ.',
    '공식 해답: 1 Ku ≈ 6.35·10⁻³ J (a = 25 cm, h = 15 cm); V = k^(1−α)/(αA), E = V², γ = 1 − β/2. N = 30: t(3) = 9.55 s, t(15) = 28.39 s, t(30) = 46.5 s, α ≈ 0.68, A ≈ 4.5. T(N) = 47.6, 45.3, 42.6, 37.3, 30.8, 21.7 s (N = 30…5), γ ≈ 0.45 → β ≈ 1.1.',
    '모형: 꼬인 실의 퍼텐셜 F₀·N^β 와 공기 저항 dE/dk = −c·E 를 공식 표에 맞췄습니다(몇 % 이내). 실이 닿기 전(|x| < ½)은 두 실 진자 퍼텐셜입니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 Ku in J; 1.2 V(k), E(k) in terms of A, α; 1.3 γ in terms of β. 2 from N = 30, k = 0…30 every three turns (lap memory), V(k) = 6/(t(k+3) − t(k−3)), E(k), A and α from ln t against ln k. 3 for each interval (35→25, 30→20, …, 10→0) k = 1…10 turn by turn, a line through k = 5…10 for A, α, E₅₋₁₀; summed into E(k). 4 the unwinding time T(N) for N = 5, 10, …, 30, at least five runs at N = 10 for the error, γ.',
    'Official solution: 1 Ku ≈ 6.35·10⁻³ J (a = 25 cm, h = 15 cm); V = k^(1−α)/(αA), E = V², γ = 1 − β/2. N = 30: t(3) = 9.55 s, t(15) = 28.39 s, t(30) = 46.5 s, α ≈ 0.68, A ≈ 4.5. T(N) = 47.6, 45.3, 42.6, 37.3, 30.8, 21.7 s (N = 30…5), γ ≈ 0.45 → β ≈ 1.1.',
    'Model: the twisted threads\' potential F₀·N^β and the air drag dE/dk = −c·E are fitted to the official tables (within a few %). Before the threads touch (|x| < ½) it is the bifilar pendulum\'s potential. The values differ a little from visit to visit.'] }
};

var LAB = { x: 0, w: 0, held: true, sw: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 가로대에서 두 실(간격 h = 15 cm)로 매단 막대(한쪽 끝 빨강, 너트 둘), 막대 아래 기준선 카드(빨간 점 = 위치 (2)·(3) 에서 빨간 끝이 오는 곳), 랩 메모리 스톱워치와 기록 창.',
           en: 'On the desk: the rod (one end red, two nuts) hung from the crossbar on two threads h = 15 cm apart, a reference card under it (the red dot = where the red end points at positions (2) and (3)), and a stopwatch with lap memory and its memory window.' },
  howto: { ko: ['막대 위에서 휠: 1/4 바퀴씩 돌리기 (Shift: 잘게) · 막대를 좌우로 끌기: 돌리기 — 돌리는 동안 손에 잡고 있습니다',
                '막대 클릭: 놓기 / 돌고 있으면 잡아 세우기',
                '스톱워치: <b>Space</b> 시작/정지 · <b>L</b> 랩 (메모리에 저장) · 멈춘 뒤 L: 초기화 · 기준선 카드 클릭: 위에서 보기'],
           en: ['Wheel over the rod: turn it by a quarter turn (Shift: finely) · drag the rod left/right: turn it — you hold it while turning',
                'Click the rod: let it go / catch it while it spins',
                'Stopwatch: <b>Space</b> start/stop · <b>L</b> lap (stored in memory) · L when stopped: reset · click the reference card: view from above'] },
  notePlaceholder: { ko: '예) N = 30: k = 3 9.6 s, 6 15.2 s, 9 19.9 s … / T(10) = 30.1, 29.9 … s', en: 'e.g. N = 30: k = 3 9.6 s, 6 15.2 s, 9 19.9 s … / T(10) = 30.1, 29.9 … s' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var F0 = 0.00881 * (1 + S.sys('F0', 0.03)), BETA = 1.521 * (1 + S.sys('b', 0.01)), CD = 0.0858 * (1 + S.sys('c', 0.05));
    var Lth = 40, H2 = 7.5, YT = 60, U2 = (Lth - Math.sqrt(Lth * Lth - 4 * H2 * H2)) * 0.616 / 6.35e-3 / 100;   /* bifilar well, Ku */
    var KU_CM = 6.35e-3 / 0.616 * 100;                                                                    /* 1 Ku lifts the rod by this many cm */
    var sw = LAB.sw = new B3.Stopwatch(0.04, { memory: true });
    function Ub(x) { var s = Math.sin(Math.PI * x); return U2 * (Lth - Math.sqrt(Lth * Lth - 4 * H2 * H2 * s * s)) / (Lth - Math.sqrt(Lth * Lth - 4 * H2 * H2)); }
    function U(x) { var a = Math.abs(x); return a <= 0.5 ? Ub(x) : U2 + F0 * Math.pow(a - 0.5, BETA); }
    function dU(x) { var a = Math.abs(x), sg = x < 0 ? -1 : 1;
      if (a > 0.5) return sg * F0 * BETA * Math.pow(a - 0.5, BETA - 1);
      var s = Math.sin(Math.PI * x), c = Math.cos(Math.PI * x);
      return U2 * 4 * H2 * H2 * Math.PI * s * c / Math.sqrt(Lth * Lth - 4 * H2 * H2 * s * s) / (Lth - Math.sqrt(Lth * Lth - 4 * H2 * H2)); }
    var mem = document.createElement('canvas'); mem.width = 300; mem.height = 460;
    function drawMem() { var g = mem.getContext('2d'), L = sw.laps;
      g.fillStyle = '#20252b'; g.fillRect(0, 0, 300, 460); g.fillStyle = '#b9c4a4'; g.fillRect(10, 10, 280, 440);
      g.fillStyle = '#1d2318'; g.font = '800 20px sans-serif'; g.textAlign = 'left'; g.fillText('MEMORY', 22, 40);
      g.font = '700 15px monospace'; var start = Math.max(0, L.length - 40);
      for (var i = start; i < L.length; i++) { var j = i - start, col = j < 20 ? 0 : 1, row = j % 20;
        g.fillText(String(i + 1).padStart(2, ' ') + ' ' + L[i].toFixed(2).padStart(6, ' '), 22 + col * 138, 70 + row * 19); }
      if (!L.length) { g.font = '600 15px sans-serif'; g.fillText(ctx.lang() === 'en' ? 'no laps yet' : '랩 기록 없음', 22, 70); } }
    var card = (function () { var c = document.createElement('canvas'); c.width = 600; c.height = 160; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#f4f2ea'; g.fillRect(0, 0, 600, 160); g.strokeStyle = '#222'; g.lineWidth = 3; g.beginPath(); g.moveTo(20, 80); g.lineTo(580, 80); g.stroke();
      g.lineWidth = 1.5; for (var i = 0; i < 12; i++) { var a = i * Math.PI / 6; g.beginPath(); g.moveTo(300 + Math.cos(a) * 40, 80 - Math.sin(a) * 40); g.lineTo(300 + Math.cos(a) * 60, 80 - Math.sin(a) * 60); g.stroke(); }
      g.fillStyle = '#c0392b'; g.beginPath(); g.arc(50, 80, 12, 0, 7); g.fill(); g.fillStyle = '#222'; g.font = '700 22px sans-serif'; g.fillText('(2), (3)', 30, 130); return c; })();
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, keys: [' ', 'l', 'L'], speeds: [1, 0.5], wheelIds: ['rod'],
      home: { yaw: -0.25, pitch: 0.34, k: 8, tx: 6, ty: 29, tz: 0 },
      views: { top: { yaw: 0, pitch: 1.42, k: 24, tx: 0, ty: 20, tz: 0, title: { ko: '위에서 본 막대', en: 'The rod from above' }, hint: { ko: '휠: 1/4 바퀴씩 · 클릭: 놓기/잡기 · Space/L: 스톱워치 · Esc: 돌아가기', en: 'Wheel: quarter turns · click: release/catch · Space/L: stopwatch · Esc: back' } },
               sw: { yaw: 0, pitch: 1.25, k: 46, tx: 31, ty: 1.7, tz: 10, title: { ko: '스톱워치와 메모리', en: 'Stopwatch and memory' } } },
      frame: function (b) {
        for (var i = 0; i < b.keys.length; i++) { var kk = b.keys[i]; if (kk === ' ') sw.startStop(b.t); else sw.lapReset(b.t); }
        var wr = b.wheel('rod'), mr = b.screenMoved('rod');
        if (wr || mr[0]) { LAB.x += wr * 0.25 + mr[0] * 0.02; LAB.held = true; LAB.w = 0;
          var N = Math.abs(LAB.x) - 0.5; b.say(N > 0 ? '꼰 바퀴 수 N = ' + N.toFixed(2) : '실이 닿기 전: ' + (Math.abs(LAB.x) * 360).toFixed(0) + '°', N > 0 ? 'Twisted turns N = ' + N.toFixed(2) : 'Threads not yet touching: ' + (Math.abs(LAB.x) * 360).toFixed(0) + '°'); }
        if (b.clicked('m:rod')) { if (LAB.held) LAB.held = false; else { LAB.held = true; LAB.w = 0; } }
        if (b.clicked('c:card')) b.go('top');
        if (!LAB.held && b.dt > 0) { var n = Math.ceil(b.dt / 0.002), h = b.dt / n;
          for (var s = 0; s < n; s++) { var a = -0.5 * dU(LAB.x) - 0.5 * CD * LAB.w * Math.abs(LAB.w) - 0.01 * LAB.w; LAB.w += a * h; LAB.x += LAB.w * h; } }
        var yR = YT - Lth + U(LAB.x) * KU_CM, th = 2 * Math.PI * LAB.x, d = [Math.cos(th), 0, -Math.sin(th)];
        B3.desk(-34, 44, -18, 22);
        /* the frame: two posts, a crossbar */
        B3.box3(-24, 24, 0, 1.5, -6, 6, '#3b4048', { top: '#474c55' });
        B3.boxY(-21, -19, 1.5, YT + 2.5, -1, 1, '#9aa0a6', {}, 6); B3.boxY(19, 21, 1.5, YT + 2.5, -1, 1, '#9aa0a6', {}, 6);
        B3.box3(-21, 21, YT, YT + 2.5, -1.2, 1.2, '#7d848b', { top: '#8e959c' });
        B3.tex3(card, 0, 0, 600, 160, [-15, 1.52, -2], [30, 0, 0], [0, 0, 8], { id: 'c:card' });
        /* threads */
        var Tp = [H2, YT, 0], Tm = [-H2, YT, 0], Rp = [H2 * d[0], yR + 0.4, H2 * d[2]], Rm = [-H2 * d[0], yR + 0.4, -H2 * d[2]];
        if (Math.abs(LAB.x) <= 0.5) { B3.line3(Tp, Rp, '#f0f0f0', 1.3); B3.line3(Tm, Rm, '#f0f0f0', 1.3); }
        else { var Nt = Math.abs(LAB.x) - 0.5, Lt = Math.min(0.8 * (YT - yR), 3 + 1.1 * Nt), ym = (YT + yR) / 2, y1 = ym + Lt / 2, y2 = ym - Lt / 2, r = 0.12;
          [0, Math.PI].forEach(function (ph) { var pts = [ph ? Tm : Tp], M = Math.max(16, Math.round(Math.abs(LAB.x) * 14));
            for (var i = 0; i <= M; i++) { var u = i / M, phi = ph + th * u; pts.push([r * Math.cos(phi), y1 - (y1 - y2) * u, -r * Math.sin(phi)]); }
            pts.push(ph ? Rm : Rp); B3.poly3(pts, '#f0f0f0', 1.3); }); }
        /* the rod, red at one end, the nuts under the threads */
        var C = [0, yR, 0];
        B3.obox(C, d, [0, 1, 0], 12.5, 0.4, 0.4, '#b8bcc2', { id: 'm:rod', top: '#d0d4d8' });
        B3.obox([C[0] + d[0] * 11.8, yR, C[2] + d[2] * 11.8], d, [0, 1, 0], 0.75, 0.43, 0.43, '#c0392b', { id: 'm:rod', top: '#d0493b' });
        [1, -1].forEach(function (sg) { B3.cyl3('y', yR + 0.4, yR + 1.1, sg * H2 * d[0], sg * H2 * d[2], 0.65, '#8d9399', { seg: 6, cap: '#a2a8ae', id: 'm:rod' }); });
        B3.stopwatch(b, 'sw', [27, 10], sw);
        drawMem(); B3.tex3(mem, 0, 0, 300, 460, [32, 0.05, 6], [5.5, 0, 0], [0, 0, 8.4], { id: 'm:sw' });
        if (LAB.held) B3.text3([-14, YT + 4, 0], [1, 0, 0], [0, 1, 0], b.L('손으로 잡고 있음', 'Held by hand'), 1.4, '#ffd479', { weight: '700' });
        LAB.state = { x: LAB.x, N: Math.abs(LAB.x) - 0.5, V: LAB.w, E: LAB.w * LAB.w, held: LAB.held };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
