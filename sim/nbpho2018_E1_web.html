  for (let mm = 0; mm <= 300; mm++){ const x = 20 + mm / 10 * RLX; g.lineWidth = mm % 10 ? 0.8 : 1.6; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, mm % 10 ? (mm % 5 ? 8 : 13) : 18); g.stroke(); if (mm % 10 === 0) g.fillText(String(mm / 10), x, 36); }
  return c; })();
function screen3(){ const x = ST.scrX, z0 = SCR.z0, z1 = z0 + SCR.w;
  box3(x, x + 0.4, 0, SCR.h, z0, z1, "#b48a5a", {id:"screen", top:"#c09766"});
  box3(x + 0.4, x + 6, 0, 0.8, z0 + 2, z0 + 6, "#9c7748", {id:"screen"}); box3(x + 0.4, x + 6, 0, 0.8, z1 - 6, z1 - 2, "#9c7748", {id:"screen"});
  tex3(SCRRULER, 0, 0, SCRRULER.width, SCRRULER.height, [x - 0.02, BEAM_Y - 0.45, z0 + 1.5 - 20 / RLX], [0, 0, (SCRRULER.width) / RLX], [0, -1.6, 0], {id:"screen"});
  const S = spots(); let best = 0; for (const s of S) best = Math.max(best, s.I);
  for (const s of S){ if (s.I < 0.02) continue; const z = z0 + 1.5 + s.x / 10; if (z < z0 || z > z1) continue;
    sphere3([x - 0.05, BEAM_Y, z], 0.12 + 0.3 * Math.sqrt(s.I), s.I > 0.3 ? "#c8ffb8" : "#5fe05a"); }
  if (ST.laser){ const from = ST.mode === "laser" && ST.prismIn ? [HOLD_X, BEAM_Y, 0] : null; line3([-54.4, BEAM_Y, 0], from || [x, BEAM_Y, z0 + 1.5 + R0 / 10], "rgba(90,255,90,0.75)", 1.4);
    if (from) for (const s of S) if (s.I > 0.25) line3(from, [x, BEAM_Y, z0 + 1.5 + s.x / 10], "rgba(90,255,90," + (0.25 + 0.5 * s.I) + ")", 1.2); } }
function scene3(){ desk3(); tape3(); sheet3(); laser3(); stand3(); screen3(); }


/* ==================================================================
   THE CLOSE-UPS (drawn flat)
   ================================================================== */
const VZ = {};
function vz(v){ return VZ[v] || (VZ[v] = {z:1, px:0, py:0}); }
function vmap(v){ const W = CAM.W, H = CAM.H, Z = vz(v); let k, ox, oy;
  if (v === "screen"){ k = W / 345; ox = W / 2 - 150 * k; oy = H * 0.42; }            /* mm on the ruler; y up from the beam */
  else if (v === "look"){ k = W / 135; ox = W / 2; oy = 26 + SHEET.d * 5 * k; }                        /* mm across the sheet; 0 = the prism's edge */
  else { k = (H - 40) / 66; ox = W * 0.55; oy = H - 22; }                               /* side: cm */
  k *= Z.z; ox += Z.px; oy += Z.py;
  return {k, ox, oy, S:(x, y) => [ox + x * k, oy - y * k], M:(sx, sy) => [(sx - ox) / k, (oy - sy) / k]}; }
let HITS2 = [];
const hit2 = p => { for (let i = HITS2.length - 1; i >= 0; i--){ const [id, x, y, w, h] = HITS2[i]; if (p[0] >= x && p[0] <= x + w && p[1] >= y && p[1] <= y + h) return id; } return null; };

/* ---- the screen ------------------------------------------------------------------- */
function drawScreen(c, W, H){ const m = vmap("screen"), k = m.k; HITS2 = [];
  c.fillStyle = "#121316"; c.fillRect(0, 0, W, H);
  const a = m.S(-15, 150), b = m.S(325, -BEAM_Y * 10); c.fillStyle = ST.laser ? "#8f6c45" : "#76593a"; c.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
  /* the ruler, its top edge 4.5 mm below the beam */
  const r0 = m.S(-6, -4.5), r1 = m.S(306, -20.5); c.fillStyle = "#f4f1e6"; c.fillRect(r0[0], r0[1], r1[0] - r0[0], r1[1] - r0[1]);
  c.strokeStyle = "#1e1e1e"; c.fillStyle = "#1e1e1e"; c.textAlign = "center"; c.textBaseline = "top"; c.font = Math.max(9, Math.min(15, 3.4 * k)) + "px " + FONT;
  for (let mm = 0; mm <= 300; mm++){ if (k < 1.6 && mm % 5) continue; const x = m.S(mm, 0)[0]; if (x < -20 || x > W + 20) continue; const L = mm % 10 ? (mm % 5 ? 2.2 : 3.6) : 5.2;
    c.lineWidth = mm % 10 ? 0.8 : 1.4; c.beginPath(); c.moveTo(x, m.S(0, -4.5)[1]); c.lineTo(x, m.S(0, -4.5 - L)[1]); c.stroke();
    if (mm % 10 === 0 && (k > 2.2 || mm % 50 === 0)) c.fillText(String(mm / 10), x, m.S(0, -11)[1]); }
  c.textBaseline = "alphabetic"; c.font = Math.max(8, Math.min(12, 2.4 * k)) + "px " + FONT; c.fillText("cm", m.S(304, 0)[0], m.S(0, -18)[1]);
  /* the light */
  c.save(); c.globalCompositeOperation = "lighter";
  for (const s of spots()){ const [x, y] = m.S(s.x, 0); if (x < -30 || x > W + 30) continue; const R = (0.3 + 0.35 * Math.sqrt(s.I)) * k + 0.9, gr = c.createRadialGradient(x, y, 0, x, y, R * 1.8);
    gr.addColorStop(0, "rgba(220,255,210," + Math.min(1, 0.15 + 1.6 * s.I) + ")"); gr.addColorStop(0.35, "rgba(70,255,60," + Math.min(0.9, 0.12 + 1.4 * s.I) + ")"); gr.addColorStop(1, "rgba(30,180,30,0)");
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, R * 1.8, 0, 7); c.fill(); }
  c.restore(); }

/* ---- looking down through the prism ------------------------------------------------- */
function drawLook(c, W, H){ const m = vmap("look"), k = m.k; HITS2 = [];
  c.fillStyle = "#3a3d42"; c.fillRect(0, 0, W, H);
  const u0 = -SHEET.w * 5, u1 = SHEET.w * 5, v0 = -SHEET.d * 5, v1 = SHEET.d * 5, off = ST.sheetU;
  const a = m.S(u0 - off, v1), b = m.S(u1 - off, v0); c.fillStyle = "#0e0f12"; c.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
  const top = m.S(0, v1 - 14)[1], bot = m.S(0, v0 + 14)[1], edge = m.S(0, 0)[0], over = ST.mode === "look";
  const band = (X, w, rgb, wt, clipL) => { const x0 = m.S(X - w / 2, 0)[0], x1 = m.S(X + w / 2, 0)[0]; let l = Math.min(x0, x1), r = Math.max(x0, x1);
    if (clipL) r = Math.min(r, edge); else l = Math.max(l, over ? edge : -1e9); if (r <= l) return;
    const ww = Math.max(r - l, 1.2); c.fillStyle = "rgba(" + rgb.map(v => Math.round(v * wt)).join(",") + "," + Math.min(1, (r - l) / 1.2) + ")"; c.fillRect(l, top, ww, bot - top); };
  c.save(); c.globalCompositeOperation = "lighter";
  for (const s of STRIPES){ const X = s.x - off;
    for (const [lam, rgb, wt] of INK[s.kind]){ band(X, s.w, rgb, wt, false); if (over) band(X + shiftMM(lam, ST.h), s.w, rgb, wt * 0.92, true); } }
  c.restore();
  /* the labels printed on the sheet */
  c.fillStyle = "#c4c8cc"; c.textAlign = "center"; c.font = Math.max(8, Math.min(14, 3.6 * k)) + "px " + FONT;
  for (const s of STRIPES){ const X = s.x - off; if (s.kind === "white" && s.lab % 4 === 0){ const [x, y] = m.S(X, v1 - 7); if (!over || x > edge) c.fillText(String(s.lab), x, y); }
    if (s.gap){ const [x, y] = m.S(X, v0 + 5); if (!over || x > edge) c.fillText(s.gap.toFixed(1), x, y); } }
  if (over){ c.fillStyle = "rgba(160,205,230,0.10)"; c.fillRect(0, 0, edge, H);
    if (k > 9){ c.strokeStyle = "rgba(200,230,245,0.10)"; c.lineWidth = 1; const p = PRISM.d * 1000; for (let u = Math.floor(m.M(0, 0)[0] / p) * p; u < 0; u += p){ const x = m.S(u, 0)[0]; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } }
    c.strokeStyle = "rgba(210,235,250,0.85)"; c.lineWidth = 2; c.beginPath(); c.moveTo(edge, 0); c.lineTo(edge, H); c.stroke(); }
  else { c.fillStyle = "#e8b45a"; c.font = "13px " + FONT; c.textAlign = "left"; c.fillText(tr("needLook"), 12, 20); } }

/* ---- the stand from the side: the prism's height on a metre stick ------------------------ */
function drawSide(c, W, H){ const m = vmap("side"), k = m.k; HITS2 = [];
  c.fillStyle = "#2a3038"; c.fillRect(0, 0, W, H);
  const d0 = m.S(-40, 0), d1 = m.S(40, -3); c.fillStyle = "#3a3d42"; c.fillRect(d0[0], d0[1], d1[0] - d0[0], d1[1] - d0[1]);
  const s0 = m.S(-28, 0.04), s1 = m.S(2, 0); c.fillStyle = "#0e0f12"; c.fillRect(s0[0], s0[1] - 1, s1[0] - s0[0], Math.max(2, s1[1] - s0[1] + 1));
  /* the rod and its base */
  const b0 = m.S(3, 0.9), b1 = m.S(15, 0); c.fillStyle = "#2a2c30"; c.fillRect(b0[0], b0[1], b1[0] - b0[0], b1[1] - b0[1]);
  const r0 = m.S(8.4, 60), r1 = m.S(9.6, 0.9); c.fillStyle = "#b9bec4"; c.fillRect(r0[0], r0[1], r1[0] - r0[0], r1[1] - r0[1]);
  /* the metre stick */
  const x0 = 16, st0 = m.S(x0, 62), st1 = m.S(x0 + 3, 0); c.fillStyle = "#e8dcae"; c.fillRect(st0[0], st0[1], st1[0] - st0[0], st1[1] - st0[1]);
  c.strokeStyle = "#202020"; c.fillStyle = "#202020"; c.textAlign = "left"; c.textBaseline = "middle"; c.font = Math.max(9, Math.min(15, 0.9 * k)) + "px " + FONT;
  for (let mm = 0; mm <= 620; mm++){ if (k < 12 && mm % 5) continue; if (k < 5 && mm % 10) continue; const y = m.S(0, mm / 10)[1]; if (y < -10 || y > H + 10) continue;
    const L = mm % 10 ? (mm % 5 ? 0.45 : 0.75) : 1.2; c.lineWidth = mm % 10 ? 0.7 : 1.2; c.beginPath(); c.moveTo(st0[0], y); c.lineTo(st0[0] + L * k, y); c.stroke();
    if (mm % 10 === 0 && (k > 6 || mm % 50 === 0)) c.fillText(String(mm / 10), st0[0] + 1.4 * k, y); }
  if (ST.mode !== "look"){ c.fillStyle = "#e8b45a"; c.font = "13px " + FONT; c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillText(tr("needLook"), 12, 20); return; }
  /* the clamp, its arm and the prism sheet (its lower face at h) */
  const h = ST.h, cl0 = m.S(7.6, h + 1.2), cl1 = m.S(10.4, h - 1.2); c.fillStyle = "#3a3c40"; c.fillRect(cl0[0], cl0[1], cl1[0] - cl0[0], cl1[1] - cl0[1]);
  HITS2.push(["clamp", cl0[0] - 6, cl0[1] - 6, cl1[0] - cl0[0] + 12, cl1[1] - cl0[1] + 12]);
  const a0 = m.S(-9.5, h + 0.5), a1 = m.S(8, h + 0.1); c.fillStyle = "#9aa0a6"; c.fillRect(a0[0], a0[1], a1[0] - a0[0], Math.max(2, a1[1] - a0[1]));
  const p0 = m.S(-19, h + 0.06), p1 = m.S(-9, h); c.fillStyle = "rgba(170,215,240,0.85)"; c.fillRect(p0[0], p0[1], p1[0] - p0[0], Math.max(1.5, p1[1] - p0[1]));
  c.strokeStyle = "rgba(170,215,240,0.6)"; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(st0[0], p1[1]); c.stroke(); c.setLineDash([]); }


/* ==================================================================
   VIEWS, HANDS AND THE LOOP
   ================================================================== */
function layout3(){
  const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1.5), 2), w = cv3.parentElement.clientWidth || 900;
  const h = Math.max(440, Math.min(Math.round(w * 0.62), Math.round(window.innerHeight * 0.78)));
  cv3.style.width = w + "px"; cv3.style.height = h + "px"; cv3.width = Math.round(w * dpr); cv3.height = Math.round(h * dpr);
  const first = !CAM0.k; CAM.W = w; CAM.H = h; CAM.dpr = dpr;
  if (first){ Object.assign(CAM, {k:w / 150, tx:2, ty:4, tz:0, yaw:-0.22, pitch:0.62, px:0, py:0}); camSave(); } }
let freeCam = null;
const VIEWS = ["3d", "screen", "look", "side"], FLAT = ["screen", "look", "side"];
function showView(v){
  if (v !== view3 && view3 === "3d") freeCam = {yaw:CAM.yaw, pitch:CAM.pitch, k:CAM.k, tx:CAM.tx, ty:CAM.ty, tz:CAM.tz, px:CAM.px, py:CAM.py};
  if (v === "3d" && view3 !== "3d") Object.assign(CAM, freeCam || CAM0);
  view3 = v; for (const k of VIEWS) document.getElementById("vt" + k).className = k === v ? "on" : "";
  document.getElementById("t-cap3").textContent = tr("cap_" + v); }
for (const k of VIEWS) document.getElementById("vt" + k).onclick = () => showView(k);

/* ---- the pointer ------------------------------------------------------- */
let down3 = null, m3 = [0, 0], FLASH = {msg:"", t:0};
function flash(m){ FLASH = {msg:m, t:performance.now()}; }
const p3e = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv3.addEventListener("contextmenu", e => e.preventDefault());
const setScr = x => { ST.scrX = Math.max(HOLD_X + 12, Math.min(BX1 - 2, x)); };
function click3(id){
  if (id === "laser"){ ST.laser = !ST.laser; return; }
  if (id === "prism"){ if (ST.mode === "laser") ST.prismIn = !ST.prismIn; else showView("look"); return; }
  if (id === "sheet") showView("look"); else if (id === "stick" || id === "clamp") showView("side"); else if (id === "screen") showView("screen"); }
cv3.addEventListener("pointerdown", e => { const p = p3e(e); m3 = p; cv3.setPointerCapture(e.pointerId);
  if (e.button === 1 || e.button === 2){ e.preventDefault(); down3 = {p, moved:false, btn:e.button, flat:FLAT.includes(view3), c0:Object.assign({}, vz(view3))}; return; }
  if (e.button) return;
  if (FLAT.includes(view3)){ const id = hit2(p), m = vmap(view3); down3 = {p, id, moved:false, flat:true, w:m.M(p[0], p[1]), c0:{h:ST.h, u:ST.sheetU, px:vz(view3).px, py:vz(view3).py}}; return; }
  const id = pick3(p[0], p[1]); down3 = {p, id, moved:false, shift:e.shiftKey, x0:ST.scrX, w0:onPlane(p[0], p[1], 0)}; });
cv3.addEventListener("pointermove", e => { const p = p3e(e), dx = p[0] - m3[0], dy = p[1] - m3[1]; m3 = p;
  if (!down3) return; if (Math.hypot(p[0] - down3.p[0], p[1] - down3.p[1]) > 3) down3.moved = true; if (!down3.moved) return;
  if (down3.btn){ if (down3.flat){ const Z = vz(view3); Z.px += dx; Z.py += dy; } else { CAM.px += dx; CAM.py += dy; } return; }
  if (down3.flat){ const m = vmap(view3), w = m.M(p[0], p[1]), c0 = down3.c0;
    if (view3 === "side" && down3.id === "clamp") ST.h = Math.max(2, Math.min(58, c0.h + (w[1] - down3.w[1])));
    else if (view3 === "look"){ ST.sheetU = Math.max(-150, Math.min(150, c0.u - (w[0] - down3.w[0]))); vz("look").py = c0.py + p[1] - down3.p[1]; }
    else { vz(view3).px = c0.px + p[0] - down3.p[0]; vz(view3).py = c0.py + p[1] - down3.p[1]; }
    return; }
  if (down3.id === "screen"){ const w = onPlane(p[0], p[1], 0); setScr(down3.x0 + w[0] - down3.w0[0]); return; }
  if (down3.shift){ CAM.px += dx; CAM.py += dy; } else { CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.02, CAM.pitch + dy * 0.006)); }
  cv3.classList.add("grabbing"); });
cv3.addEventListener("pointerup", e => { cv3.classList.remove("grabbing");
  if (down3 && down3.btn){ const d = down3; down3 = null; if (!d.moved && d.btn === 2 && view3 !== "3d") showView("3d"); return; }
  if (down3 && !down3.moved && !down3.flat) click3(down3.id); down3 = null; });
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = p3e(e), s = e.deltaY < 0 ? 1 : -1;
  if (FLAT.includes(view3)){ const Z = vz(view3), f = s > 0 ? 1.15 : 1 / 1.15, nz = Math.max(0.5, Math.min(view3 === "side" ? 25 : 40, Z.z * f)), r = nz / Z.z, m = vmap(view3), ox = m.ox - Z.px, oy = m.oy - Z.py;
    Z.px = (p[0] - ox) - (p[0] - ox - Z.px) * r; Z.py = (p[1] - oy) - (p[1] - oy - Z.py) * r; Z.z = nz; return; }
  if (pick3(p[0], p[1]) === "screen"){ setScr(ST.scrX + s * (e.shiftKey ? 0.1 : 1)); return; }
  const f = s > 0 ? 1.12 : 1 / 1.12, nk = Math.min(400, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive:false});

/* ---- the panel and the tray ------------------------------------------------------- */
const setMode = md => { ST.mode = md; };
document.getElementById("bModeL").onclick = () => setMode("laser");
document.getElementById("bModeK").onclick = () => setMode("look");
document.getElementById("bLaser").onclick = () => { ST.laser = !ST.laser; };
document.getElementById("bPrism").onclick = () => { if (ST.mode === "laser") ST.prismIn = !ST.prismIn; };
document.getElementById("bFlip").onclick = () => { ST.flip = !ST.flip; };
function panel(){ const L = document.getElementById("bLaser"), P = document.getElementById("bPrism");
  L.textContent = ST.laser ? tr("laserOn") : tr("laserOff"); L.className = ST.laser ? "on" : "";
  P.textContent = ST.prismIn ? tr("prismIn") : tr("prismOut"); P.className = ST.prismIn ? "on" : ""; P.disabled = ST.mode !== "laser";
  document.getElementById("bModeL").className = ST.mode === "laser" ? "on" : ""; document.getElementById("bModeK").className = ST.mode === "look" ? "on" : "";
  const w = []; if (FLASH.msg && performance.now() - FLASH.t < 5000) w.push(FLASH.msg);
  const html = w.map(s => '<div class="w">' + s + "</div>").join(""), el = document.getElementById("wwarn"); if (el._h !== html){ el.innerHTML = html; el._h = html; } }
let lastT = performance.now();
function draw3(){ const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (FLAT.includes(view3)){ const W = CAM.W, H = CAM.H; ctx3.save(); ctx3.beginPath(); ctx3.rect(0, 0, W, H); ctx3.clip();
    ({screen:drawScreen, look:drawLook, side:drawSide})[view3](ctx3, W, H); ctx3.restore(); cv3.style.cursor = view3 === "look" ? "ew-resize" : ""; return; }
  const g = ctx3.createLinearGradient(0, 0, 0, CAM.H); g.addColorStop(0, "#2a3038"); g.addColorStop(1, "#1b1f25"); ctx3.fillStyle = g; ctx3.fillRect(0, 0, CAM.W, CAM.H);
  begin3(); scene3(); render3(ctx3); cv3.style.cursor = ""; }
(function loop(){ try { const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; ST.t += dt; draw3(); panel(); } catch (err) { console.error(err); } requestAnimationFrame(loop); })();
window.addEventListener("resize", layout3);
function applyLang(){ document.documentElement.lang = LANG;
  document.title = LANG === "ko" ? "NBPhO 2018 P4 — 프레넬 프리즘 · HaslaLab" : "NBPhO 2018 P4 — Fresnel Prism · HaslaLab";
  document.getElementById("h1").textContent = tr("title"); document.getElementById("sub").textContent = tr("sub"); document.getElementById("t-tray").textContent = tr("tray");
  for (const k of VIEWS) document.getElementById("vt" + k).textContent = tr("vt" + k); document.getElementById("t-cap3").textContent = tr("cap_" + view3);
  document.getElementById("lgCtl").textContent = tr("lgCtl"); document.getElementById("lgNotes").textContent = tr("lgNotes"); document.getElementById("txNotes").textContent = tr("notes");
  document.getElementById("bModeL").textContent = tr("modeLaser"); document.getElementById("bModeK").textContent = tr("modeLook"); document.getElementById("bFlip").textContent = tr("flip");
  document.getElementById("btn-en").className = LANG === "en" ? "on" : ""; document.getElementById("btn-ko").className = LANG === "ko" ? "on" : ""; }
document.getElementById("btn-ko").addEventListener("click", () => { LANG = "ko"; applyLang(); });
document.getElementById("btn-en").addEventListener("click", () => { LANG = "en"; applyLang(); });
layout3(); applyLang(); showView("3d");

</script>
