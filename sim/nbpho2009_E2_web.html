<meta name="description" content="NBPhO 2009 실험 문제 5 연필을 브라우저에서 해 봅니다. 종이 위에 세운 연필의 끝을 손가락으로 밀며 기울여 미끄러지기 시작하는 각을 찾고, 그림자와 자로 tan α₀ = μ 를 구합니다.">

<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}

       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* NBPhO 2009 problem 5 "Pencil" on the 3-D bench.  As in the official solution: the graphite tip on the
   paper, the other end pushed by a fingertip along the pencil; the force at the tip is along the pencil,
   so it holds while tan α ≤ μ (α from the vertical) and slips as soon as tan α > μ.  Each push slips at
   a slightly different angle (the paper is not the same everywhere).  A lamp straight overhead throws
   the pencil's shadow on the graph paper, so x — the pencil's horizontal projection — can be read,
   and tan α₀ = x/√(l² − x²). */
var PROGRAM = {
  title: { ko: 'NBPhO 2009 실험 5 — 연필', en: 'NBPhO 2009 Problem 5 — Pencil' },
  subtitle: { ko: '연필심과 종이 사이의 마찰 계수를 구하고 불확도를 어림하세요. 장비: 연필, 종이, 자.', en: 'Determine the coefficient of friction of the pencil\'s graphite core against the paper and estimate the uncertainty. Equipment: a pencil, paper and a ruler.' },
  notes: { ko: [
    '공식 해답: 연필심을 종이에 대고 반대쪽 끝을 손끝으로 밀면 연필 속 힘은 축 방향뿐이라, 연직과의 각 α 가 tan α ≤ μ 인 동안만 버팁니다. 미끄러지기 시작하는 α₀ 에서 μ = tan α₀ = x/√(l² − x²).',
    '종이는 곳곳이 조금씩 달라 밀 때마다 미끄러지는 각이 조금 다릅니다 — 여러 번 재세요.',
    '바로 위의 등이 연필 그림자를 모눈종이(1 mm)에 드리워 x 를 읽을 수 있습니다. μ 는 방문할 때마다 조금 다릅니다.'], en: [
    'Official solution: the graphite end on the paper, the other end pushed with a fingertip — the force in the pencil is along it, so it holds only while the angle α from the vertical has tan α ≤ μ. At α₀, where it starts to slip, μ = tan α₀ = x/√(l² − x²).',
    'The paper differs a little from place to place, so each push slips at a slightly different angle — measure several times.',
    'A lamp straight overhead throws the pencil\'s shadow on the graph paper (1 mm) so x can be read. μ differs a little from visit to visit.'] }
};

var LAB = { up: false, a: 0, slipped: false, slipA: 0, tip: [0, 0], tries: 0, thr: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 모눈종이(1 mm), 옆에 놓인 연필과 30 cm 자, 바로 위의 등.', en: 'On the desk: graph paper (1 mm), the pencil and a 30 cm ruler lying beside it, and a lamp straight overhead.' },
  howto: { ko: ['연필 클릭: 종이 위에 세우기 (손끝으로 위를 누름) / 다시 눕히기',
                '세운 연필 끌기(좌우): 누르면서 기울이기 — 미끄러지면 그 자리에서 멈춥니다. 다시 클릭하면 새로 세움',
                '종이 클릭: 위에서 그림자와 모눈 가까이 보기 · 누운 연필은 자 옆에 있어 길이 l 을 잴 수 있습니다'],
           en: ['Click the pencil: stand it on the paper (a fingertip pressing its top) / lay it down again',
                'Drag the standing pencil (left/right): tilt it while pushing — when it slips it stops right there. Click it again to stand it afresh',
                'Click the paper: look down at the shadow and the grid · lying down, the pencil is beside the ruler so its length l can be read'] },
  notePlaceholder: { ko: '예) l = 175 mm; 미끄러질 때 그림자 x = 52 mm, 49 mm, 55 mm …', en: 'e.g. l = 175 mm; shadow at slipping x = 52 mm, 49 mm, 55 mm …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var mu = 0.33 * (1 + S.sys('mu', 0.08)), L = 17.5 * (1 + S.sys('L', 0.01)), R6 = 0.38;
    var paper = (function () { var c = document.createElement('canvas'), k = 12, W = 30, D = 21; c.width = W * 10 * k / 10 * 10; c.height = D * 10 * k / 10 * 10; c._static = true; var g = c.getContext('2d');
      g.fillStyle = '#fbfaf3'; g.fillRect(0, 0, c.width, c.height); var px = c.width / (W * 10);
      for (var i = 0; i <= W * 10; i++) { g.fillStyle = i % 10 === 0 ? 'rgba(60,140,90,.55)' : i % 5 === 0 ? 'rgba(80,150,100,.35)' : 'rgba(110,170,130,.2)'; g.fillRect(i * px, 0, i % 10 === 0 ? 2 : 1, c.height); }
      for (i = 0; i <= D * 10; i++) { g.fillStyle = i % 10 === 0 ? 'rgba(60,140,90,.55)' : i % 5 === 0 ? 'rgba(80,150,100,.35)' : 'rgba(110,170,130,.2)'; g.fillRect(0, i * px, c.width, i % 10 === 0 ? 2 : 1); }
      return c; })();
    var ruler = B3.scaleTex(30, { horiz: true, width: 2.6, bg: '#e9eef2', label: 'cm' });
    function newThr() { LAB.thr = Math.atan(mu * (1 + HL.gauss(0.05))); }
    newThr();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.35, pitch: 0.6, k: 20, tx: 0, ty: 6, tz: 0 },
      views: { paper: { yaw: 0, pitch: 1.5, k: 45, tx: 0, ty: 0, tz: 0, title: { ko: '종이와 그림자 (위에서)', en: 'The paper and the shadow (from above)' },
                        hint: { ko: '휠: 확대 · 빈 곳 끌기: 옮겨 보기 · Esc: 돌아가기', en: 'Wheel: zoom · drag empty space: pan · Esc: back' } } },
      frame: function (b) {
        if (b.clicked('m:pencil')) { if (!LAB.up) { LAB.up = true; LAB.a = 0.02; LAB.slipped = false; LAB.tip = [-2 + HL.gauss(1), HL.gauss(1)]; newThr(); }
          else if (LAB.slipped) { LAB.a = 0.02; LAB.slipped = false; LAB.tip = [-2 + HL.gauss(1), HL.gauss(1)]; newThr(); } else LAB.up = false; }
        if (LAB.up && !LAB.slipped) { var sm = b.screenMoved('pencil'); if (sm[0]) LAB.a = Math.max(0, Math.min(1.2, LAB.a + sm[0] / L));
          if (LAB.a > LAB.thr) { LAB.slipped = true; LAB.slipA = LAB.a; LAB.tip[0] -= 1.2; b.say('미끄러졌습니다!', 'It slipped!'); } }
        B3.desk(-30, 30, -20, 20);
        B3.tex3(paper, 0, 0, paper.width, paper.height, [-15, 0.01, -10.5], [30, 0, 0], [0, 0, 21], { id: 'c:paper' });
        if (b.clicked('c:paper')) b.go('paper');
        B3.tex3(ruler, 0, 0, ruler.width, ruler.height, [-16, 0.03, 12], [32, 0, 0], [0, 0, 2.6]);
        B3.cyl3('y', 60, 61, 0, 0, 6, '#f5f2dc', { seg: 20, cap: '#fffbe0' });                    /* the lamp overhead */
        var hex = []; for (var i = 0; i < 6; i++) { var t = i * Math.PI / 3; hex.push([Math.cos(t) * R6, Math.sin(t) * R6]); }
        if (!LAB.up) {                                                                               /* lying beside the ruler */
          B3.prism3('x', -15, -15 + L - 1.5, hex.map(function (p) { return [R6 + p[0] + 0.0, 11 + p[1]]; }).map(function (p) { return [p[0], p[1]]; }), '#d9a521', { id: 'm:pencil' });
          B3.cylAB([-15 + L - 1.5, R6, 11], [-15 + L, R6, 11], 0.3, '#e7c9a0', { seg: 8, id: 'm:pencil' }); B3.cylAB([-15 + L - 0.15, R6, 11], [-15 + L, R6, 11], 0.08, '#333', { seg: 6 });
        } else {
          var a = LAB.slipped ? LAB.slipA : LAB.a, tip = [LAB.tip[0], 0, LAB.tip[1]], top = [tip[0] + Math.sin(a) * L, Math.cos(a) * L, tip[2]];
          B3.cylAB(tip, [tip[0] + Math.sin(a) * 1.5, Math.cos(a) * 1.5, tip[2]], 0.3, '#e7c9a0', { seg: 8, id: 'm:pencil' });
          B3.cylAB([tip[0] + Math.sin(a) * 1.5, Math.cos(a) * 1.5, tip[2]], top, R6, '#d9a521', { seg: 6, id: 'm:pencil' });
          B3.sphere3([top[0] + Math.sin(a) * 0.9, top[1] + Math.cos(a) * 0.9, top[2]], 0.9, '#e8b9a0');           /* the fingertip */
          B3.line3([tip[0], 0.02, tip[2]], [top[0], 0.02, top[2]], 'rgba(40,40,40,.45)', 4);                    /* the shadow from straight above */
          if (LAB.slipped) B3.line3([tip[0], 0.025, tip[2]], [tip[0] + 1.2, 0.025, tip[2]], 'rgba(60,60,60,.8)', 2);
        }
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
