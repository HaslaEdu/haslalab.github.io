<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --ink:#1b2430; --muted:#5b6b7c;
    --line:#d8e0e8; --accent:#2c6f9b; --accent-soft:#eaf4fb;
    --disp-bg:#101418; --disp-fg:#8fd6ff; --mag:#b9bec4; --rod:#2b2f36;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:16px;display:flex;gap:16px;align-items:flex-start}
  @media(max-width:1080px){.wrap{flex-direction:column}}
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:14px;position:sticky;top:16px}
  @media(max-width:1080px){.panel{position:static;width:100%;flex:1 1 auto}}
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  label.row{display:block;margin:9px 0 3px;color:var(--muted);font-size:12.5px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  button{width:100%;padding:8px 10px;margin:4px 0;cursor:pointer;background:#fff;
    border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
    color:var(--ink);text-align:left;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.primary:hover:not(:disabled){background:#22587c}
  .seg{display:flex;gap:5px;margin:5px 0}
  .seg button{flex:1;text-align:center;padding:6px 4px;margin:0}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .disp{background:var(--disp-bg);border-radius:6px;padding:9px 12px;margin:6px 0;
    text-align:right;color:var(--disp-fg);
    font:700 24px/1.15 ui-monospace,Consolas,monospace;letter-spacing:.04em}
  .disp small{display:block;font:400 10px/1.4 ui-monospace,monospace;

 hMeter:"Teslameter", meterOn:"power on", field:"field",

 rulerLbl:"ruler (mm), zero on the magnet surface", graphite:"graphite",
 dyLbl:"Δy (mm)", refLbl:"reference", headLbl:"screw head", capHead:"screw head (from above)", centre:"centre", cm:"cm",
 magon:"magnet on the rail", zero:"record the zero offset  B0   (A.1)", zeroNone:"B0 not recorded", settling:"settling ...", overRange:"over range",
 hProbe:"Probe and magnet", ruler:"ruler reading from the magnet surface (mm)",

 jognote:"",

}};
let lang = (new URLSearchParams(location.search).get("lang")==="en") ? "en" : "ko";

/* ══════════════════════════════════════════════════════════════
   1.  PHYSICS  —  transcribed from the Python bench
   ══════════════════════════════════════════════════════════════ */
const MU0=1.257e-6, R=3.2e-3, LMAG=25.4e-3, GM=1.5e-3, A_PDL=R+GM/2;
const RHO=1680.0, GRAV=9.8, C1=198.6;
const X_OFFSET=4.0e-3, METER_FS=0.300;
const ROD_D={"HB/0.3":0.38e-3,"HB/0.5":0.56e-3,"HB/0.7":0.70e-3,"HB/0.9":0.90e-3};
const M_TRUE=1.10e6, CHI_TRUE=-1.45e-4;
const Y0_FINITE=1.06, TAU_A=3.15, TAU_B=29.40;
const D_TILT=0.220, S_TRUE=0.80e-3, TILT_EXAG=20.0;

const uni=(a,b)=>a+Math.random()*(b-a);
function norm(mu,sd){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();
  return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* field of a diametrically magnetised cylinder, with the finite-length roll-over */
function bMagnet(x,M){ x=Math.max(x,1e-4);
  return MU0*M*R*R/(2*x*x)*Math.pow(1+Math.pow(x/LMAG,10),-0.1); }
const fY=u=>4*u*(3-u*u)*(1-u*u)/Math.pow(1+u*u,5);

function levitationHeight(M,chi){
  const coef=MU0*M*M*Math.abs(chi)/2*Math.pow(R,4)/Math.pow(A_PDL,5);
  const target=RHO*GRAV/coef;
  let uBest=0.5,best=1e9,top=0,fmax=-1;
  for(let i=0;i<40000;i++){const u=0.02+(0.99-0.02)*i/39999; const f=fY(u);
    if(f>fmax){fmax=f;top=i;}}
  for(let i=top;i<40000;i++){const u=0.02+(0.99-0.02)*i/39999;
    const e=Math.abs(fY(u)-target); if(e<best){best=e;uBest=u;}}
  return uBest*A_PDL;
}
const omegaZ=(chi,M)=>Math.sqrt(-C1*MU0*chi*M*M/RHO);
function tauDamping(d,l){const r=d*1e3/2, L=l*1e3;
  return TAU_A+TAU_B*r*r*Math.log(0.607*L/r);}

/* one bench; its small imperfections are drawn once */
const B={
  M:M_TRUE*(1+norm(0,0.012)),
  chi:CHI_TRUE*(1+norm(0,0.02)),
  B0:norm(0,1.2e-3), drift:norm(0,0.15e-3),
  tauScale:1+norm(0,0.03), S:S_TRUE*(1+norm(0,0.04)), D:D_TILT
};
B.y0 = levitationHeight(B.M,B.chi)*Y0_FINITE*(1+norm(0,0.02));
B.omega = omegaZ(B.chi,B.M);
const benchTau=(d,l)=>tauDamping(d,l)*B.tauScale;
const teslaTrue=(x,phiDeg)=>bMagnet(x,B.M)*Math.cos(2*phiDeg*Math.PI/180)+B.B0+B.drift;

/* ══════════════════════════════════════════════════════════════
   2.  STATE
   ══════════════════════════════════════════════════════════════ */
const S={
  tab:"a1", rulerB:true, zB:0, vzB:0, jit:0, ringing:false, limitMsg:false,
  meterOn:false, magOn:true, shown:0, settling:false, ruler:8.0, phi:25, zeroRec:null, rows:[], reading:0,
  rodKey:"HB/0.5", rodLen:8, placed:false, insRuler:false,
  amp:3.0, oscT0:null, simT:0,
  swRun:false, swT0:0, swVal:0, laps:[],
  turns:0, rowsB:[]
};
const $=id=>document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   3.  CANVAS HELPERS
   ══════════════════════════════════════════════════════════════ */
function fit(cv,ratio){
  const dpr=Math.min(devicePixelRatio||1,2), w=cv.clientWidth||700, h=w*ratio;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  return [c,w,h];
}
function grid(c,w,h){ c.fillStyle="#fbfcfd"; c.fillRect(0,0,w,h); }

/* ── A1 : 자석 축에 수직인 단면.  원본 좌표계 그대로:
       xlim (-9, 47),  ylim (-15.5, 10.5),  등축,  축·눈금 없음
       자 눈금의 0 은 자석 표면 (x = R = 3.2 mm)                     ── */
function drawA1(){
  const cv=$("cvA1"), dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth||760;
  const X0=-9, X1=47, Y0=-15.5, Y1=10.5;
  const sc=w/(X1-X0), h=Math.round((Y1-Y0)*sc);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#fff"; c.fillRect(0,0,w,h);
  const X=v=>(v-X0)*sc, Y=v=>(Y1-v)*sc;


  const Rm=R*1e3, xm=(S.ruler+X_OFFSET*1e3)+Rm;   /* 홀 소자의 x, 자석 중심 기준 */
  const phi=S.phi*Math.PI/180;

  if(S.magOn){
    c.beginPath(); c.arc(X(0),Y(0),Rm*sc,0,7);
    c.fillStyle="#c9ccd1"; c.fill(); c.strokeStyle="#555"; c.lineWidth=1; c.stroke();
    /* 자화 화살표 : 길이 5.6 mm, 각 phi */
    const ax=5.6*Math.cos(phi), ay=5.6*Math.sin(phi);
    c.strokeStyle="#cc0000"; c.lineWidth=2.4; c.beginPath();
    c.moveTo(X(0),Y(0)); c.lineTo(X(ax),Y(ay)); c.stroke();
    c.fillStyle="#cc0000"; c.beginPath();
    const hx=X(ax), hy=Y(ay), ux=Math.cos(phi), uy=-Math.sin(phi);
    c.moveTo(hx,hy); c.lineTo(hx-8*ux+4*uy, hy-8*uy-4*ux);
    c.lineTo(hx-8*ux-4*uy, hy-8*uy+4*ux); c.closePath(); c.fill();
    c.fillStyle="#000"; c.font="8.5px 'DejaVu Sans',sans-serif";
    c.fillText(T[lang].magnet, X(0), Y(-Rm-2.6));
  }
  /* 홀 프로브 : 보드 1.7 x 14, 노란 소자 1.5 x 3.4 */
  c.fillStyle="#2f4f6f"; c.strokeStyle="#222"; c.lineWidth=0.8;
  c.fillRect(X(xm), Y(7.0), 1.7*sc, 14.0*sc); c.strokeRect(X(xm),Y(7.0),1.7*sc,14.0*sc);
  c.fillStyle="#ffcc00";
  c.fillRect(X(xm-1.5), Y(1.7), 1.5*sc, 3.4*sc); c.strokeRect(X(xm-1.5),Y(1.7),1.5*sc,3.4*sc);
  c.fillStyle="#000"; c.textAlign="left"; c.font="8.5px 'DejaVu Sans',sans-serif";
  T[lang].hallLbl.split("\n").forEach((ln,i)=>c.fillText(ln, X(xm+3.2), Y(6.4)+11*i+8));

  /* 자 : 0 이 자석 표면에 오도록 */
  const xs=Rm;
  c.strokeStyle="#444";
  for(let t=0;t<=40;t++){
    const hgt=(t%5)?1.2:2.2; c.lineWidth=0.7;
    c.beginPath(); c.moveTo(X(xs+t),Y(-9.5)); c.lineTo(X(xs+t),Y(-9.5+hgt)); c.stroke();
    if(t%5===0){ c.fillStyle="#000"; c.font="7.5px 'DejaVu Sans',sans-serif";
      c.textAlign="center"; c.fillText(t, X(xs+t), Y(-12.2)+4); }
  }
  c.lineWidth=1; c.beginPath(); c.moveTo(X(xs-2),Y(-9.5)); c.lineTo(X(xs+41),Y(-9.5)); c.stroke();
  const tip=xm-X_OFFSET*1e3;

  c.fillStyle="#555"; c.font="7.5px 'DejaVu Sans',sans-serif"; c.textAlign="center";
  c.fillText(T[lang].rulerLbl, X(24), Y(-14.0)+4);
}

function drawFront(){

  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#fff";c.fillRect(0,0,w,h);
  const X=v=>(v-X0)*sc, Y=v=>(Y1-v)*sc;

  const Rm=R*1e3, Am=A_PDL*1e3, y0=B.y0*1e3, d=ROD_D[S.rodKey]*1e3;
  for(const sx of [-Am,Am]){
    c.beginPath();c.arc(X(sx),Y(0),Rm*sc,0,7);
    c.fillStyle="#c9ccd1";c.fill();c.strokeStyle="#555";c.lineWidth=1;c.stroke();
    c.strokeStyle="#cc0000";c.lineWidth=1.8;
    c.beginPath();c.moveTo(X(sx-0.4),Y(0));c.lineTo(X(sx+2.2),Y(0));c.stroke();
    c.fillStyle="#cc0000";c.beginPath();
    c.moveTo(X(sx+2.2),Y(0));c.lineTo(X(sx+1.4),Y(0)-4);c.lineTo(X(sx+1.4),Y(0)+4);
    c.closePath();c.fill();
  }
  c.fillStyle="#000";c.font="8px 'DejaVu Sans',sans-serif";c.textAlign="center";
  c.fillText(T[lang].magnet,X(-Am),Y(-Rm-1.7)+3);
  if(S.placed){
    c.beginPath();c.arc(X(0),Y(y0),Math.max(d/2*sc,2.2),0,7);
    c.fillStyle="#202020";c.fill();c.strokeStyle="#000";c.lineWidth=0.6;c.stroke();
    c.strokeStyle="#666";c.lineWidth=0.7;
    c.beginPath();c.moveTo(X(0.4),Y(y0+0.25));c.lineTo(X(2.2),Y(6.4));c.stroke();
    c.fillStyle="#000";c.textAlign="left";
    c.fillText(T[lang].graphite,X(2.3),Y(6.4));
  }
  if(S.insRuler){
    const xr=8.8;
    c.strokeStyle="#444";c.lineWidth=1.3;
    c.beginPath();c.moveTo(X(xr),Y(Rm-5.2));c.lineTo(X(xr),Y(Rm+1.6));c.stroke();
    for(let k=-1.0;k<=5.001;k+=0.5){
      const isInt=Math.abs(k-Math.round(k))<1e-6, wdt=isInt?1.7:0.9;
      c.lineWidth=0.7;
      c.beginPath();c.moveTo(X(xr),Y(Rm-k));c.lineTo(X(xr-wdt),Y(Rm-k));c.stroke();
      if(isInt){c.fillStyle="#000";c.font="7px 'DejaVu Sans',sans-serif";
        c.textAlign="left";c.fillText(k.toFixed(0),X(xr+0.35),Y(Rm-k)+2.5);}
    }
    c.font="7px 'DejaVu Sans',sans-serif";c.textAlign="center";
    c.fillText(T[lang].dyLbl,X(xr-0.2),Y(Rm+2.2));
    if(S.placed){
      c.strokeStyle="#c00000";c.setLineDash([2,2]);c.lineWidth=0.9;
      c.beginPath();c.moveTo(X(0.4),Y(y0));c.lineTo(X(xr-1.8),Y(y0));c.stroke();
      c.setLineDash([]);
    }
  }
  c.strokeStyle="#bbb";c.setLineDash([4,3]);c.lineWidth=0.7;
  c.beginPath();c.moveTo(X(-Am-Rm-1),Y(0));c.lineTo(X(Am+Rm+1),Y(0));c.stroke();
  c.setLineDash([]);
}
/* ── 위에서 본 모습 : 원본 xlim (-16, 16), ylim (-8.4, 10.2), 등축 ── */
function zNow(){
  if(!S.placed||S.oscT0===null) return 0;
  const t=S.simT-S.oscT0, tau=benchTau(ROD_D[S.rodKey],S.rodLen*1e-3);
  return S.amp*Math.exp(-t/tau)*Math.cos(B.omega*t);
}

/* ── B : 플랫폼 측면.  원본 py 의 도면을 그대로 옮겼다.
       xlim (-52, D+56), ylim (-40, 116), 등축, TILT_EXAG = 20
       아래판 / 왼쪽 나사에 경첩된 위판 / 두 개의 조절 나사 /
       트랩 프레임 / 중심선 / Δz 화살표 / D 치수선 / 눕힌 자      ── */
function drawTilt(zmm){
  const cv=$("cvTilt"),dpr=Math.min(devicePixelRatio||1,2);
  const Dmm=B.D*1e3;
  const X0=-52, X1=Dmm+56, Y0=-40, Y1=116;
  const w=cv.clientWidth||700, sc=w/(X1-X0), h=Math.round((Y1-Y0)*sc);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+"px";
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#fff";c.fillRect(0,0,w,h);
  const X=v=>(v-X0)*sc, Y=v=>(Y1-v)*sc;
  const P=(p)=>[X(p[0]),Y(p[1])];

  const theta=S.turns*B.S/B.D, ang=theta*TILT_EXAG;
  const ca=Math.cos(ang), sa=Math.sin(ang), PT=5.0, x0=0, x1=Dmm;
  const lift=Dmm*Math.tan(ang);
  const onTop=(px,py)=>[x0+(px-x0)*ca-py*sa, 14.0+(px-x0)*sa+py*ca];
  const poly=(pts,fill,stroke,lw)=>{
    c.beginPath(); pts.forEach((p,i)=>{const q=P(p); i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});
    c.closePath(); if(fill){c.fillStyle=fill;c.fill();}
    if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke();}
  };
  const line=(p,q,col,lw,dash)=>{
    c.strokeStyle=col;c.lineWidth=lw||1; if(dash)c.setLineDash(dash);
    const A=P(p),Bq=P(q); c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(Bq[0],Bq[1]);c.stroke();
    c.setLineDash([]);
  };
  const arrow=(from,to,col,lw)=>{
    const A=P(from),Bq=P(to);
    c.strokeStyle=col;c.lineWidth=lw||1;
    c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(Bq[0],Bq[1]);c.stroke();
    const an=Math.atan2(Bq[1]-A[1],Bq[0]-A[0]);
    c.fillStyle=col;c.beginPath();c.moveTo(Bq[0],Bq[1]);
    c.lineTo(Bq[0]-7*Math.cos(an-0.4),Bq[1]-7*Math.sin(an-0.4));
    c.lineTo(Bq[0]-7*Math.cos(an+0.4),Bq[1]-7*Math.sin(an+0.4));
    c.closePath();c.fill();
  };
  const txt=(p,t,size,align,col)=>{
    c.fillStyle=col||"#000"; c.font=(size||9)+"px 'DejaVu Sans',sans-serif";
    c.textAlign=align||"center"; c.textBaseline="middle";
    const q=P(p); c.fillText(t,q[0],q[1]);
  };

  /* 아래판 */
  poly([[-40,-PT],[Dmm+40,-PT],[Dmm+40,0],[-40,0]],"#d5d8dc","#333",1.0);
  /* 위판 */
  poly([onTop(-34,0),onTop(Dmm+34,0),onTop(Dmm+34,PT),onTop(-34,PT)],"#e9ecef","#333",1.1);
  /* 두 나사 : 몸통, 뾰족한 끝, 머리 */
  for(const [xs,ext] of [[x0,0.0],[x1,lift]]){
    const top=onTop(xs,PT);
    line(top,[xs,0.0],"#5d6369",2.6);
    poly([[xs-1.8,1.6],[xs+1.8,1.6],[xs,-0.4]],"#8d939a","#444",0.7);
    poly([[top[0]-5.0,top[1]+0.6],[top[0]+5.0,top[1]+0.6],
          [top[0]+5.0,top[1]+3.2],[top[0]-5.0,top[1]+3.2]],"#9aa0a6","#444",0.8);
  }
  /* θ : 들린 쪽 끝에 (그림 9) */
  if(Math.abs(lift)>0.6){
    const xe=Dmm+22, pe=onTop(xe,0.0);
    arrow([pe[0],0.0],pe,"#222",0.9); arrow(pe,[pe[0],0.0],"#222",0.9);
    txt([pe[0]-3,(pe[1]+0.0)/2],"\u03b8",12,"right");
  }
  /* 트랩 프레임 */
  const cxp=Dmm/2, HW=30.0, HT=62.0;
  for(const dzf of [-HW, HW-3.0]){
    poly([onTop(cxp+dzf,PT),onTop(cxp+dzf,PT+HT),
          onTop(cxp+dzf+3.0,PT+HT),onTop(cxp+dzf+3.0,PT)],"#e4e7ea","#333",1.1);
  }
  for(const hy of [PT+12.0, PT+52.0]) line(onTop(cxp-HW,hy),onTop(cxp+HW,hy),"#333",1.4);
  const pm=onTop(cxp+14.0,PT+23.0), pml=onTop(cxp+HW+30.0,PT+HT-14.0);
  line(pml,pm,"#333",0.8); txt([pml[0]+2,pml[1]],T[lang].magnet,9,"left");
  /* 중심선과 Δz */
  const pc0=onTop(cxp,PT+4.0), pc1=onTop(cxp,PT+HT+3.0);
  line(pc0,pc1,"#333",0.9,[6,3,2,3]);
  txt([pc1[0],pc1[1]+5.0],T[lang].centre,9);
  const dzmm=(zmm===undefined)?0:zmm;
  const pz0=onTop(cxp,PT+33.0), pz1=onTop(cxp-17.0,PT+33.0);
  arrow(pz0,pz1,"#333",1.0);
  txt(onTop(cxp-8.5,PT+38.0),"\u0394z",10);
  /* 흑연 막대 (옆에서 본 모습) */
  if(S.placed){
    const rl=8.0/2;
    const q0=onTop(cxp+dzmm-rl,PT+22.0), q1=onTop(cxp+dzmm+rl,PT+22.0);
    c.strokeStyle="#303030";c.lineWidth=6;c.lineCap="butt";
    const A=P(q0),Bq=P(q1); c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(Bq[0],Bq[1]);c.stroke();
    const pgl=onTop(cxp-HW-30.0,PT+HT-14.0);
    line(pgl,onTop(cxp-11.0,PT+22.0),"#333",0.8);
    txt([pgl[0]-2,pgl[1]],T[lang].graphite,9,"right");
  }
  /* D 치수선 */
  const pd0=onTop(x0,PT+9.0), pd1=onTop(x1,PT+9.0);
  arrow(pd1,pd0,"#222",1.1); arrow(pd0,pd1,"#222",1.1);
  const pdl=onTop(cxp-HW-26.0,PT+17.0);
  c.fillStyle="#000";c.font="italic 15px 'DejaVu Sans',sans-serif";
  c.textAlign="center";c.textBaseline="alphabetic";
  const dq=P(pdl); c.fillText("D",dq[0],dq[1]);
  c.textBaseline="middle";
  /* 눕힌 자 */
  if(S.rulerB){
    const yr=-16.0;
    line([-14,yr],[Dmm+18,yr],"#444",1.1);
    for(let k=-10;k<=Dmm+17.1;k+=10){
      const big=Math.abs(k%50)<1e-6;
      line([k,yr],[k,yr-(big?4.6:2.4)],"#444",0.8);
      if(big) txt([k,yr-10.5],(k/10).toFixed(0),7.5);
    }
    txt([Dmm/2,yr-18.5],T[lang].cm,8);
    for(const xs of [x0,x1]) line([xs,-PT],[xs,yr],"#888",0.7,[2,2]);
  }
}

/* ── 나사 머리 (위에서 본 모습) : 회전수만큼 지표가 돈다 ── */
function drawHead(){
  const cv=$("cvHead"); if(!cv) return;
  const dpr=Math.min(devicePixelRatio||1,2), w=cv.clientWidth||160;
  const sc=w/3.0, h=Math.round(3.1*sc);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+"px";
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#fff";c.fillRect(0,0,w,h);
  const X=v=>(v+1.5)*sc, Y=v=>(1.6-v)*sc;
  c.beginPath();c.arc(X(0),Y(0),1.0*sc,0,7);
  c.fillStyle="#d8dce0";c.fill();c.strokeStyle="#444";c.lineWidth=1.4;c.stroke();
  c.strokeStyle="#8b9096";c.lineWidth=1;
  for(let k=0;k<24;k++){const b0=2*Math.PI*k/24;
    c.beginPath();c.moveTo(X(0.92*Math.cos(b0)),Y(0.92*Math.sin(b0)));
    c.lineTo(X(1.0*Math.cos(b0)),Y(1.0*Math.sin(b0)));c.stroke();}
  const ph=2*Math.PI*(-S.turns);
  c.strokeStyle="#b03030";c.lineWidth=3;c.lineCap="round";
  c.beginPath();c.moveTo(X(0),Y(0));
  c.lineTo(X(0.78*Math.sin(ph)),Y(0.78*Math.cos(ph)));c.stroke();
  c.beginPath();c.arc(X(0),Y(0),0.12*sc,0,7);c.fillStyle="#444";c.fill();
  c.strokeStyle="#222";c.lineWidth=1.6;
  c.beginPath();c.moveTo(X(0),Y(1.06));c.lineTo(X(0),Y(1.26));c.stroke();
  c.fillStyle="#000";c.font="7.5px 'DejaVu Sans',sans-serif";
  c.fillText(T[lang].refLbl,X(0),Y(1.34));
}

/* 원본 PartA1._tick 그대로 : 바늘이 시정수 0.6 s 로 목표값을 따라간다.
   표시값 = 따라가는 값 + 잡음.  목표와 0.3 mT 넘게 벌어지면 "settling ..." */
function meterTarget(){
  return S.magOn ? teslaTrue((S.ruler+X_OFFSET*1e3)*1e-3, S.phi)
                 : B.B0 + B.drift;
}
function meterStep(dt){
  const target=meterTarget();
  S.shown += (target-S.shown)*(1-Math.exp(-dt/0.6));
  S.reading = S.shown + norm(0,0.15e-3);
  S.settling = Math.abs(target-S.shown) >= 3e-4;
  return S.reading;
}
/* 기록은 지금 바늘이 가리키는 값을 그대로 적는다 (안정 전에 적으면 그 값이 남는다) */
function readNow(){ return S.reading; }
$("btnZero").onclick=()=>{
  if(!S.meterOn) return;
  S.zeroRec = readNow();
  $("zeroRead").textContent = `B₀ = ${(S.zeroRec*1e3).toFixed(3)} mT`;
};
$("btnRec").onclick=()=>{
  if(!S.meterOn || !S.magOn) return;
  S.rows.push({ruler:S.ruler, x:S.ruler+X_OFFSET*1e3, b:readNow()}); renderA1();
};
$("btnDel").onclick=()=>{S.rows.pop(); renderA1();};

$("btnCsv").onclick=()=>{

  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));

/* 조그 슬라이더 : 쓸어 넘기면 그만큼 돌고 손을 떼면 가운데로 돌아온다 (원본과 같음) */
/* 나사의 행정 한계.
   수평일 때 위판은 아래판 위 14 mm 에 떠 있고, 나사를 풀면 내려온다.
   −0.5 바퀴에서 위판 오른끝이 아래판에 닿아 더 내려가지 않고,
   +2.0 바퀴에서 나사가 끝까지 나와 더 올라가지 않는다.
   원본은 조그 슬라이더 한 번 쓸기가 0.75 바퀴라 실제로도 이 근처에서 쓴다.
   이 범위에서 판은 최대 8.3° (20 배 과장) 기울고 Δz 는 +0.7 ~ −2.7 mm 로,
   트랩의 ±10 mm 눈금 안에서 B.4 의 기울기를 넉넉히 잡을 수 있다.        */
const TURN_MIN=-0.5, TURN_MAX=2.0;
function addTurns(d){
  const before=S.turns;
  S.turns=Math.min(TURN_MAX,Math.max(TURN_MIN,S.turns+d));
  const hit = (S.turns!==before+d);
  S.limitMsg = hit;
  if(hit) $("stateB").textContent = (S.turns>=TURN_MAX ? T[lang].endIn : T[lang].endOut);
}
/* 나사 머리 위에서 휠을 굴려도 돌아간다 */
function wheelTurn(e){
  e.preventDefault();
  const step=e.shiftKey?0.005:0.025;       /* Shift 를 누르면 미세 조정 */
  addTurns((e.deltaY>0?-1:1)*step);
}



/* tabs */
function setTab(t){
  S.tab=t;
  $("view-a1").style.display = t==="a1"?"flex":"none";
  $("view-a2").style.display = t==="a2"?"flex":"none";
  $("view-b" ).style.display = t==="b" ?"flex":"none";
  ["a1","a2","b"].forEach(k=>$("tab-"+k).className = k===t?"on":"");
}
$("tab-a1").onclick=()=>setTab("a1");
$("tab-a2").onclick=()=>setTab("a2");
$("tab-b" ).onclick=()=>setTab("b");

$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

/* ══════════════════════════════════════════════════════════════
   7.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  S.simT+=dt;

  if(S.tab==="a1"){
    S.mAcc=(S.mAcc||0)+dt;
    const due = S.mAcc>=0.120;
    if(S.meterOn && due){
      meterStep(S.mAcc); S.mAcc=0;
      const sat = Math.abs(S.reading)>=METER_FS;
      $("dispB").className="disp";
      $("dispB").innerHTML=`<small id="t-field">${T[lang].field}</small>`+
        (sat?"  O L  ":`${(S.reading*1e3).toFixed(1)} mT`);
      $("meterState").textContent = sat ? T[lang].overRange
                                        : (S.settling?T[lang].settling:"");
    }else if(!S.meterOn){
      S.mAcc=0;
      $("dispB").className="disp off";
      $("dispB").innerHTML=`<small id="t-field">${T[lang].field}</small>-- OFF --`;
      $("meterState").textContent=""; S.shown=meterTarget();
    }
    drawA1();
  }

  if(S.tab==="a2"){
    if(S.swRun) S.swVal=S.simT-S.swT0;
    $("swDisp").innerHTML=`<small id="t-sw">${T[lang].sw}</small>${S.swVal.toFixed(2)} s`;
    drawFront(); drawTop("cvTop",zNow(),"cap3");
  }

  if(S.tab==="b"){
    /* 원본 PartB._tick : 감쇠 진동을 실제로 적분한다.
         v' = -w²(z - z_eq) - 2γ v,   γ = 1/τ
       나사를 돌리면 막대가 곧바로 옮겨가지 않고 새 평형으로 흔들리며 수렴한다.  */
    if(S.placed && dt>0){
      const w=B.omega, gam=1.0/benchTau(ROD_D["HB/0.5"],8.0e-3);
      const zeq=-GRAV*Math.sin(S.turns*B.S/B.D)/(w*w);
      const nstep=Math.max(1,Math.floor(dt/0.004)+1), hs=Math.min(dt,0.25)/nstep;
      for(let i=0;i<nstep;i++){
        S.vzB += (-w*w*(S.zB-zeq) - 2*gam*S.vzB)*hs;
        S.zB  += S.vzB*hs;
      }
      S.jit += (-S.jit/2.0)*dt + norm(0,1.2e-5)*Math.sqrt(Math.max(dt,1e-4));
      const wasRinging=S.ringing;
      S.ringing = Math.abs(S.vzB)>3e-5 || Math.abs(S.zB-zeq)>3e-5;
      if(S.ringing) $("stateB").textContent=T[lang].ringing;
      else if(wasRinging && !S.limitMsg) $("stateB").textContent="\u2014";
    }
    const zmm=S.placed?(S.zB+S.jit)*1e3:0;
    drawTilt(zmm); drawHead(); drawTop("cvTopB",zmm,"cap5");
  }
  requestAnimationFrame(loop);
}

/* 나사 머리 위에서 휠 */
(function(){
  const h=$("cvHead");
  if(h) h.addEventListener("wheel",wheelTurn,{passive:false});
})();
addEventListener("resize",()=>{});
setTab("a1"); applyLang(); requestAnimationFrame(loop);
