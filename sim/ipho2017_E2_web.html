<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row button{flex:1;text-align:center;min-width:0}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;

  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);
        border:1px solid var(--line);border-radius:6px;padding:6px 0;color:#e8eef2;letter-spacing:.04em}
  .laps{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa3ab;max-height:130px;overflow:auto;margin-top:4px}
  .lbl{display:block;margin:8px 0 2px;color:var(--muted);font-size:12.5px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .cvwrap{position:relative}
  #cv{background:#1b1f25;cursor:grab;touch-action:none}
  #cv.grabbing{cursor:grabbing}
  .back{position:absolute;left:10px;top:10px;width:auto!important;background:rgba(242,193,78,.92);color:#1c2027;
        border-color:#f2c14e;font-weight:700;padding:6px 12px}
  .back:hover{background:#f2c14e!important;color:#1c2027}
  .panel .row button{font-size:12px;padding:6px 4px}
  textarea{width:100%;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:6px;
           font:12.5px/1.5 ui-monospace,Consolas,monospace;padding:6px 8px;resize:vertical}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="wrap">
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-cap"></h3>
      <div class="cvwrap">
        <canvas id="cv"></canvas>
        <button id="btnBack" class="back" hidden></button>
      </div>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-watch"></h2>
    <div class="disp" id="clock">00:00.00</div>
    <div class="row"><button id="btnSS"></button><button id="btnLap"></button></div>
    <div class="laps" id="laps"></div>
    <h2 id="t-h-rod"></h2>
    <label class="lbl" id="t-len"></label>
    <input type="range" id="rodLen" min="4" max="14" step="1" value="8">
    <p class="hint" id="t-rodhint"></p>
    <h2 id="t-h-view"></h2>
    <div class="row"><button id="vReset"></button><button id="vMeter"></button><button id="vTrap"></button><button id="vTilt"></button></div>
    <h2 id="t-h-note"></h2>
    <textarea id="note" rows="6" spellcheck="false"></textarea>
    <button id="btnSave"></button>
    <p class="hint" id="t-hint"></p>
    <div class="status" id="status"></div>
  </aside>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  const sx=CAM.W/2+CAM.px+xr*CAM.k, sy=CAM.H/2+CAM.py-up*CAM.k;
  if(_REC) _REC.set(sx+","+sy,dep);
  return [sx, sy, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;

}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const _shadeCache=new Map();
function shade(col,f){
  const key=col+"|"+f.toFixed(2); let v=_shadeCache.get(key); if(v) return v;
  let a=1, rgb;
  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));

}
const LIGHT=(()=>{ const v=[-0.45,0.85,0.35], n=Math.hypot(...v); return v.map(a=>a/n); })();
let ITEMS=[], HITS=[], _REC=null;
function begin3(){ ITEMS=[]; }
function _cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }

/* a flat polygon; o = {fill, stroke, lw, id, layer, cull, flat, bias, alpha} */
function face(pts,o){

function quad(a,b,c,d,o){ face([a,b,c,d],o); }

function box3(x0,x1,y0,y1,z0,z1,col,o){

  if(!o.noBot) face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],f);          /* bottom -y */
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f);          /* +z */
  face([[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],f);          /* -z */
  face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],f);          /* +x */
  face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],f);          /* -x */

/* make a polygon face the direction `want` (a world vector) */

/* a prism: polygon pts2 [[u,v]..] in the plane across `axis`, extruded from a0 to a1 */
function prism3(axis,a0,a1,pts2,col,o){
  o=Object.assign({cull:true},o||{}); const f=Object.assign({},o,{fill:col});

  for(let i=0;i<n;i++){ const j=(i+1)%n; const q=[A[i],A[j],B[j],B[i]];

/* tall parts cut into short slices, so each slice is sorted at its own height
   (one long face sorted by its centre is what makes posts jump in front of things) */
function boxY(x0,x1,y0,y1,z0,z1,col,o,step){ const n=Math.max(1,Math.ceil((y1-y0)/(step||1)));
  for(let i=0;i<n;i++) box3(x0,x1,y0+(y1-y0)*i/n,y0+(y1-y0)*(i+1)/n,z0,z1,col,Object.assign({},o,{noTop:i<n-1,noBot:i>0})); }
function cylSeg(axis,a0,a1,u,v,r,col,o,step){ const n=Math.max(1,Math.ceil(Math.abs(a1-a0)/(step||1)));
  for(let i=0;i<n;i++) cyl3(axis,a0+(a1-a0)*i/n,a0+(a1-a0)*(i+1)/n,u,v,r,col,Object.assign({},o,{cap0:i===0&&(o||{}).cap0!==false,cap1:i===n-1&&(o||{}).cap1!==false})); }
function line3(a,b,col,lw,o){ ITEMS.push({t:"l",p:[a,b],o:Object.assign({col,lw:lw||1},o||{})}); }
function poly3(pts,col,lw,o){ ITEMS.push({t:"pl",p:pts,o:Object.assign({col,lw:lw||1},o||{})}); }
/* text lying in the plane spanned by U (right) and V (up), size in cm */
function text3(O,U,V,str,size,col,o){ ITEMS.push({t:"x",p:[O],O,U,V,str,size,o:Object.assign({col},o||{})}); }
/* anything else: draw(ctx) is called in its depth order; ref is a world point */
function custom3(ref,draw,o){ ITEMS.push({t:"c",p:[ref],draw,o:o||{}}); }

function render3_2d(ctx){
  const vis=[];

    const q=it.p.map(p=>P3(p[0],p[1],p[2]));

/* the id of the nearest object under a screen point */
function pick3_2d(x,y){ for(let i=HITS.length-1;i>=0;i--) if(pointIn(HITS[i][1],x,y)) return HITS[i][0]; return null; }
/* a sphere: a shaded disc in its depth order */
function sphere3_2d(c,r,col,o){ o=o||{};

/* ══════════════════════════════════════════════════════════════
   1.  PHYSICS  —  transcribed from the Python bench
   ══════════════════════════════════════════════════════════════ */
const MU0=1.257e-6, R=3.2e-3, LMAG=25.4e-3, GM=1.5e-3, A_PDL=R+GM/2;
const RHO=1680.0, GRAV=9.8, C1=198.6;
const X_OFFSET=4.0e-3, METER_FS=0.300;
const ROD_D={"HB/0.3":0.38e-3,"HB/0.5":0.56e-3,"HB/0.7":0.70e-3,"HB/0.9":0.90e-3};
const M_TRUE=1.10e6, CHI_TRUE=-1.45e-4;
const Y0_FINITE=1.06, TAU_A=3.15, TAU_B=29.40;
const D_TILT=0.220, S_TRUE=0.80e-3, TILT_EXAG=20.0;

const uni=(a,b)=>a+Math.random()*(b-a);
function norm(mu,sd){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();
  return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* field of a diametrically magnetised cylinder, with the finite-length roll-over */
function bMagnet(x,M){ x=Math.max(x,1e-4);
  return MU0*M*R*R/(2*x*x)*Math.pow(1+Math.pow(x/LMAG,10),-0.1); }
const fY=u=>4*u*(3-u*u)*(1-u*u)/Math.pow(1+u*u,5);

function levitationHeight(M,chi){
  const coef=MU0*M*M*Math.abs(chi)/2*Math.pow(R,4)/Math.pow(A_PDL,5);
  const target=RHO*GRAV/coef;
  let uBest=0.5,best=1e9,top=0,fmax=-1;
  for(let i=0;i<40000;i++){const u=0.02+(0.99-0.02)*i/39999; const f=fY(u);
    if(f>fmax){fmax=f;top=i;}}
  for(let i=top;i<40000;i++){const u=0.02+(0.99-0.02)*i/39999;
    const e=Math.abs(fY(u)-target); if(e<best){best=e;uBest=u;}}
  return uBest*A_PDL;
}
const omegaZ=(chi,M)=>Math.sqrt(-C1*MU0*chi*M*M/RHO);
function tauDamping(d,l){const r=d*1e3/2, L=l*1e3;
  return TAU_A+TAU_B*r*r*Math.log(0.607*L/r);}

/* one bench; its small imperfections are drawn once */
const B={
  M:M_TRUE*(1+norm(0,0.012)),
  chi:CHI_TRUE*(1+norm(0,0.02)),
  B0:norm(0,1.2e-3), drift:norm(0,0.15e-3),
  tauScale:1+norm(0,0.03), S:S_TRUE*(1+norm(0,0.04)), D:D_TILT
};
B.y0 = levitationHeight(B.M,B.chi)*Y0_FINITE*(1+norm(0,0.02));
B.omega = omegaZ(B.chi,B.M);
const benchTau=(d,l)=>tauDamping(d,l)*B.tauScale;
const teslaTrue=(x,phiDeg)=>bMagnet(x,B.M)*Math.cos(2*phiDeg*Math.PI/180)+B.B0+B.drift;

const PRY=132, TIP_OUT=46, EL_IN=0.8;                   /* probe axis, tip ahead of the holder, Hall element behind the tip */
const RAIL={x0:4,x1:256,y0:144,y1:170}, HOLD={min:24,max:236};
const FP={mag:[26,22],trap:[44,28],meter:[140,150],watch:[32,34]};   /* the Teslameter box is about 14 cm × 8.5 cm, its 9 V batteries lie behind it */
const ROD_KEY={r03:"HB/0.3",r05:"HB/0.5",r07:"HB/0.7",r09:"HB/0.9"};
const ST={ on:{mag:false,trap:false,meter:false,probe:false,watch:false,ruler:false,sticker:false,ins:false},
  pos:{mag:{x:60,y:80},trap:{x:170,y:60},meter:{x:350,y:80},watch:{x:300,y:200},ruler:{x:120,y:112,rot:0}}, holderX:150,
  plug:null };          /* the probe's USB plug: null, {at:"meter"}, {at:"hand"} or {at:"desk",x,z,dir} (cm) */
const S={
  magAng:uni(0,360), phiOff:uni(0,360), stickRel:0,
  mOn:false, range:800, shown:0, reading:0, settling:false, mAcc:0,
  rod:null, rodLen:8, z:0, vz:0, jit:0, hold:null,
  turns:uni(-0.12,0.12), tl:[uni(-0.15,0.15),uni(-0.15,0.15)],     /* the platform comes a little out of level */
  watch:{run:false,t:0,laps:[]}
};
let hand=null, drag=null, mouse=[0,0], mouseMM=[0,0], overBench=false, msg={key:null,args:[],t:0}, view=null;
function say(key,...args){ msg={key,args,t:performance.now()}; }
const itemName=k=>d().items[k]||k;
const tipX=()=>ST.holderX-TIP_OUT;
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

/* ── what the Hall element sees: a line dipole, the component along the probe axis ── */
function fieldAtProbe(){
  let b=B.B0+B.drift;
  if(ST.on.mag&&ST.on.probe){
    const C=ST.pos.mag, ex=tipX()+EL_IN-C.x, ey=PRY-C.y, r=Math.hypot(ex,ey);
    const rx=ex/r, ry=ey/r, a=(S.magAng+S.phiOff)*Math.PI/180, mx=Math.cos(a), my=Math.sin(a);
    const mr=mx*rx+my*ry;
    b+=bMagnet(r*1e-3,B.M)*(2*mr*rx-mx);
  }
  return b;
}
function meterStep(dt){
  const target=fieldAtProbe();
  S.shown+=(target-S.shown)*(1-Math.exp(-dt/0.6));
  S.reading=S.shown+norm(0,0.15e-3);
  S.settling=Math.abs(target-S.shown)>=3e-4;
}
const plugged=()=>!!(ST.plug&&ST.plug.at==="meter");
function meterText(){
  if(!ST.on.meter||!S.mOn) return "";
  if(!ST.on.probe||!plugged()) return "----";
  const v=S.reading*1e3, fs=S.range;
  if(Math.abs(v)>=fs) return d().lab.ol;
  return (S.range===800?v.toFixed(1):v.toFixed(3))+" mT";
}

let ctx=null;

function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillR(x,y,w,h,r,fill,stroke,lw){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function text(s,x,y,col,size,align,weight,font){ ctx.fillStyle=col; ctx.font=(weight||"")+" "+size+"px "+(font||FONT);
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }
function circ(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,7); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }

/* ══════════════════════════════════════════════════════════════

const BX0=-140, BY0=-150, BX1=520, BY1=360;      /* the desk, in platform mm */
function rectOf(k,x,y){ const [w,h]=FP[k]; return [x-w/2,y-h/2,x+w/2,y+h/2]; }
function rulerRect(x,y,rot){ return rot?[x-12,y-100,x+12,y+100]:[x-100,y-12,x+100,y+12]; }
const inter=(a,b,m)=>a[0]<b[2]+(m||0)&&a[2]>b[0]-(m||0)&&a[1]<b[3]+(m||0)&&a[3]>b[1]-(m||0);
const inR=(p,r)=>p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3];
const PLAT=[0,0,PW,PH], RAILR=[RAIL.x0,RAIL.y0,RAIL.x1,RAIL.y1];
function others(k){ const out=[];
  for(const o of ["mag","trap","meter","watch"]) if(o!==k&&ST.on[o]) out.push(rectOf(o,ST.pos[o].x,ST.pos[o].y));
  if(k!=="ruler"&&ST.on.ruler){ const r=ST.pos.ruler; out.push(rulerRect(r.x,r.y,r.rot)); }
  return out; }
function magHitsProbe(x,y){ if(!ST.on.probe) return false; return Math.abs(y-PRY)<3.5+3.3&&x>tipX()-3.3&&x<ST.holderX+9; }
function fitsBlock(k,x,y){
  const r=rectOf(k,x,y);
  if(r[0]<1||r[1]<1||r[2]>PW-1||r[3]>PH-1) return "noFit";
  if(inter(r,RAILR)) return "noFit";
  if(SCREWS.some(([sx,sy])=>inter(r,[sx-6.5,sy-6.5,sx+6.5,sy+6.5]))) return "noFit";
  if(others(k).some(o=>inter(r,o,1))) return "noFit";
  const o=k==="mag"?"trap":"mag"; if(ST.on[o]&&Math.hypot(ST.pos[o].x-x,ST.pos[o].y-y)<70) return "snap";

  if(k==="trap"&&ST.on.probe&&inter(r,[tipX(),PRY-4,ST.holderX+9,PRY+4])) return "noFit";
  return null; }
function fitsTable(k,x,y){
  const r=rectOf(k,x,y);
  if(r[0]<BX0+1||r[1]<BY0+1||r[2]>BX1-1||r[3]>BY1-1) return false;
  if(inter(r,[-3,-3,PW+4,PH+4])) return false;
  return !others(k).some(o=>inter(r,o,1)); }
function fitsRuler(x,y,rot){
  const r=rulerRect(x,y,rot);
  if(r[0]<BX0||r[1]<BY0||r[2]>BX1||r[3]>BY1) return false;
  if(inter(r,RAILR)) return false;
  return !others("ruler").some(o=>inter(r,o,0.5)); }
function holderOK(hx){
  if(hx<HOLD.min||hx>HOLD.max) return false;
  if(ST.on.mag){ const m=ST.pos.mag; if(Math.abs(m.y-PRY)<3.5+3.3&&m.x<hx+9&&m.x>hx-TIP_OUT-3.3) return false; }
  if(ST.on.trap&&inter(rectOf("trap",ST.pos.trap.x,ST.pos.trap.y),[hx-TIP_OUT,PRY-4,hx+9,PRY+4])) return false;
  return true; }
function moveHolder(hx){
  hx=clamp(hx,HOLD.min,HOLD.max);
  if(holderOK(hx)){ ST.holderX=hx; return; }
  /* slide up to the obstacle */
  const s=Math.sign(hx-ST.holderX); let x=ST.holderX;
  while(Math.abs(hx-x)>0.05&&holderOK(x+s*0.05)) x+=s*0.05;
  if(x!==ST.holderX){ ST.holderX=x; if(ST.on.mag&&Math.abs(tipX()-(ST.pos.mag.x+3.2))<0.2) say("hit"); } }
const onMag=p=>ST.on.mag&&Math.hypot(p[0]-ST.pos.mag.x,p[1]-ST.pos.mag.y)<4.5;
const inBlock=(k,p)=>ST.on[k]&&inR(p,rectOf(k,ST.pos[k].x,ST.pos[k].y));
const screwAt=p=>SCREWS.findIndex(([sx,sy])=>Math.hypot(p[0]-sx,p[1]-sy)<7.5);
const onScrew=p=>screwAt(p)===2;
const onHolder=p=>ST.on.probe&&((p[0]>ST.holderX-9&&p[0]<ST.holderX+9&&p[1]>123&&p[1]<171)||(p[0]>tipX()&&p[0]<ST.holderX&&Math.abs(p[1]-PRY)<4.5));
function onRod(p){ if(!S.rod||!ST.on.trap) return false; const q=ST.pos.trap; return Math.abs(p[0]-(q.x+rodZ()))<S.rod.len/2+2&&Math.abs(p[1]-q.y)<4; }
const onRuler=p=>ST.on.ruler&&inR(p,rulerRect(ST.pos.ruler.x,ST.pos.ruler.y,ST.pos.ruler.rot));

function returnItem(k){
  if(k==="watch"){ S.watch.run=false; S.watch.t=0; S.watch.laps.length=0; }
  if(k==="mag"){ ST.on.sticker=false; }
  if(k==="trap"){ S.rod=null; ST.on.ins=false; S.hold=null; }
  if(k==="meter"){ S.mOn=false; if(plugged()) ST.plug=plugRest(); }
  if(k==="probe"){ ST.plug=null; if(hand&&hand.k==="plug") hand=null; }
  ST.on[k]=false; say("back",itemName(k));
}
function turnLeft(i,dt){ const b=S.tl[i]; S.tl[i]=clamp(b+dt,-1.5,1.5); say(S.tl[i]!==b+dt?(S.tl[i]>0?"endIn":"endOut"):"turnL"); }
function turnAny(i,dt){ if(i===2) turnScrew(dt); else turnLeft(i,dt); }
function turnScrew(dt){
  const before=S.turns; S.turns=clamp(S.turns+dt,TURN_MIN,TURN_MAX);
  if(S.turns!==before+dt) say(S.turns>=TURN_MAX?"endIn":"endOut"); else say("turn");
}
function watchPress(w){
  if(!ST.on.watch){ say("needWatch"); return; }
  if(w==="ss"){ S.watch.run=!S.watch.run; say(S.watch.run?"wsStart":"wsStop"); }
  else if(S.watch.run){ S.watch.laps.push(S.watch.t); say("wsLap"); }
  else { S.watch.t=0; S.watch.laps=[]; say("wsReset"); }
  renderLaps();
}
function meterPress(w){
  if(w==="pw"){ S.mOn=!S.mOn; S.shown=fieldAtProbe(); say("meter",S.mOn?"ON":"OFF"); }
  else { S.range=S.range===800?8:800; say("range",S.range+" mT"); }
}
function putDown(p){
  const k=hand.k, [x,y]=p;
  if(k==="mag"||k==="trap"){ const f=fitsBlock(k,x,y); if(f){ say(f); return; } ST.pos[k]={x,y}; ST.on[k]=true; hand=null; say("placed",itemName(k)); if(k==="trap") return; }
  if(k==="meter"||k==="watch"){ if(!fitsTable(k,x,y)){ say("noFit"); return; } ST.pos[k]={x,y}; ST.on[k]=true; hand=null; say("placed",itemName(k)); if(k==="meter") return; }
  if(k==="ruler"){ const rot=hand.rot||0; if(!fitsRuler(x,y,rot)){ say("noFit"); return; } ST.pos.ruler={x,y,rot}; ST.on.ruler=true; hand=null; say("placed",itemName(k)); return; }
  if(k==="probe"){ if(!(y>RAIL.y0-22&&y<RAIL.y1&&x>RAIL.x0&&x<RAIL.x1)){ say("onRail"); return; }
    if(!holderOK(clamp(x,HOLD.min,HOLD.max))){ say("noFit"); return; }
    ST.holderX=clamp(x,HOLD.min,HOLD.max); ST.on.probe=true; ST.plug=plugRest(); hand=null; say("probePlaced"); return; }
  if(k[0]==="r"&&ROD_KEY[k]){ if(!ST.on.trap){ say("needTrap"); return; } if(!inBlock("trap",p)){ say("noFit"); return; }
    if(S.rod){ say("rodBusy"); return; }
    S.rod={k,len:S.rodLen}; S.z=norm(0,0.25)*1e-3; S.vz=0; hand=null; say("rodIn",ROD_KEY[k],S.rodLen); return; }
  if(k==="ins"){ if(!ST.on.trap){ say("needTrap"); return; } if(!inBlock("trap",p)){ say("noFit"); return; } ST.on.ins=true; hand=null; say("insOn"); return; }
  if(k==="sticker"){ if(!onMag(p)&&!inBlock("mag",p)){ say("needMag"); return; } S.stickRel=-S.magAng; ST.on.sticker=true; hand=null; say("stickOn"); return; }
  if(k==="plug"){ if(inBlock("meter",p)){ ST.plug={at:"meter"}; hand=null; S.shown=fieldAtProbe(); say("plugIn"); return; }
    const c=[p[0]/10,p[1]/10]; if(plugFree(c[0],c[1])){ ST.plug={at:"desk",x:c[0],z:c[1],dir:c[0]>PW/20?1:-1}; hand=null; say("plugDesk"); return; }
    say("noFit"); return; }

}
/* where the USB plug lies on the desk when it is not in the meter (cm) */
function plugFree(x,z){
  if(x>-1.6&&x<PW/10+1.6&&z>-1.6&&z<PH/10+1.6) return false;
  if(x<BX0/10+1||x>BX1/10-1||z<BY0/10+1||z>BY1/10-1) return false;
  if(ST.on.meter){ const m=ST.pos.meter; if(x>m.x/10-8.2&&x<m.x/10+8.2&&z>m.y/10-8.6&&z<m.y/10+5.6) return false; }
  if(ST.on.watch){ const q=ST.pos.watch; if(Math.hypot(x-q.x/10,z-q.y/10)<3.4) return false; }
  return true; }
function plugRest(){
  for(const [x,z,dir] of [[30.5,13.2,1],[30.5,20.5,1],[-4.5,13.2,-1],[12,21.5,1]]) if(plugFree(x,z)) return {at:"desk",x,z,dir};
  return {at:"desk",x:12,z:22,dir:1}; }
function benchDown(p,right){
  if(hand){
    if(right){ if(hand.k==="plug") ST.plug=plugRest(); hand=null; return; }
    putDown(p); return; }
  if(right){
    if(onRod(p)){ S.rod=null; say("rodOut"); return; }
    if(ST.on.ins&&inBlock("trap",p)&&p[0]>ST.pos.trap.x+9){ ST.on.ins=false; say("insOff"); return; }
    if(ST.on.sticker&&onMag(p)){ ST.on.sticker=false; say("stickOff"); return; }
    if(onHolder(p)){ returnItem("probe"); return; }
    for(const k of ["meter","watch","mag","trap"]) if(inBlock(k,p)){ returnItem(k); return; }
    if(onRuler(p)){ returnItem("ruler"); return; }
    return; }
  if(ST.on.meter){ const H=METER_HIT(); if(Math.hypot(p[0]-H.pw[0],p[1]-H.pw[1])<3.5){ meterPress("pw"); return; }
    if(Math.hypot(p[0]-H.rg[0],p[1]-H.rg[1])<4){ meterPress("rg"); return; } }
  if(ST.on.watch){ const W=WATCH_BTN(); if(Math.hypot(p[0]-W.ss[0],p[1]-W.ss[1])<3.5){ watchPress("ss"); return; } if(Math.hypot(p[0]-W.lr[0],p[1]-W.lr[1])<3.5){ watchPress("lr"); return; } }
  { const si=screwAt(p); if(si>=0){ drag={k:"screw",i:si,a:Math.atan2(p[1]-SCREWS[si][1],p[0]-SCREWS[si][0])}; return; } }
  if(onMag(p)){ drag={k:"rot",a:Math.atan2(p[1]-ST.pos.mag.y,p[0]-ST.pos.mag.x)}; return; }
  if(onHolder(p)){ drag={k:"holder",dx:ST.holderX-p[0]}; return; }
  for(const k of ["meter","watch","mag","trap"]) if(inBlock(k,p)){ drag={k,dx:ST.pos[k].x-p[0],dy:ST.pos[k].y-p[1]}; return; }
  if(onRuler(p)){ drag={k:"ruler",dx:ST.pos.ruler.x-p[0],dy:ST.pos.ruler.y-p[1]}; return; }
}
function angDelta(a,b){ let x=b-a; while(x>Math.PI) x-=2*Math.PI; while(x<-Math.PI) x+=2*Math.PI; return x; }
function benchMove(p){

  if(!drag) return; const k=drag.k;
  if(k==="screw"){ const sc=SCREWS[drag.i], a=Math.atan2(p[1]-sc[1],p[0]-sc[0]); turnAny(drag.i,-angDelta(drag.a,a)/(2*Math.PI)*0.5); drag.a=a; return; }
  if(k==="rot"){ const a=Math.atan2(p[1]-ST.pos.mag.y,p[0]-ST.pos.mag.x); S.magAng+=angDelta(drag.a,a)*180/Math.PI; drag.a=a; return; }
  if(k==="holder"){ moveHolder(p[0]+drag.dx); return; }
  const x=p[0]+drag.dx, y=p[1]+drag.dy;
  if(k==="mag"||k==="trap"){ if(!fitsBlock(k,x,y)) ST.pos[k]={x,y}; return; }
  if(k==="meter"||k==="watch"){ if(fitsTable(k,x,y)) ST.pos[k]={x,y}; return; }
  if(k==="ruler"){ if(fitsRuler(x,y,ST.pos.ruler.rot)) ST.pos.ruler={x,y,rot:ST.pos.ruler.rot}; }
}
function releaseHold(){ if(S.hold){ if(S.hold.z!==undefined){ S.z=S.hold.z*1e-3; S.vz=0; } S.hold=null; say("released"); } }
/* ══════════════════════════════════════════════════════════════
   6.  THE ROD  —  the camelback potential is a damped oscillator;
        the tilt of the platform moves its equilibrium (Part B)
   ══════════════════════════════════════════════════════════════ */
const TURN_MIN=-0.5, TURN_MAX=2.0;
const rodZ=()=>S.hold&&S.hold.z!==undefined?S.hold.z:(S.z+S.jit)*1e3;
/* the trap's own motion while it is carried: its acceleration along the magnets pushes the rod the other way */
function trapAccel(dt){
  if(!ST.on.trap||dt<=0){ S.trapPX=null; S.trapV=0; return 0; }
  const x=ST.pos.trap.x;
  if(S.trapPX===null||S.trapPX===undefined){ S.trapPX=x; S.trapV=0; return 0; }
  const v=(x-S.trapPX)/dt, v0=S.trapV||0; S.trapPX=x;
  S.trapV=v0+(v-v0)*Math.min(1,dt/0.05);                       /* smooth the hand's jerks a little */
  return clamp((S.trapV-v0)/dt,-2.5e4,2.5e4)*1e-3;                /* mm/s² → m/s² */
}
function rodStep(dt){
  const aT=trapAccel(dt);
  if(!S.rod||!ST.on.trap) return;
  S.jit+=(-S.jit/2.0)*dt+norm(0,1.2e-5)*Math.sqrt(Math.max(dt,1e-4));
  if(S.hold) return;
  const w=B.omega, gam=1/benchTau(ROD_D[ROD_KEY[S.rod.k]],S.rod.len*1e-3), zeq=-GRAV*Math.sin(tiltRad())/(w*w);
  const n=Math.max(1,Math.ceil(dt/0.002)), h=dt/n;
  for(let i=0;i<n;i++){ S.vz+=(-w*w*(S.z-zeq)-2*gam*S.vz-aT)*h; S.z+=S.vz*h; }
  if(Math.abs(S.z)>9e-3){ S.z=Math.sign(S.z)*9e-3; S.vz=-0.3*S.vz; }
}

/* ══════════════════════════════════════════════════════════════
   7.  THE 3-D SCENE   (after Fig. 4: white platform on three screws,
       glass-rod rail with the probe holder, the two magnet assemblies,
       the black Teslameter box with its two 9 V batteries)
       world units are cm; platform mm (x, y) → world (x/10, z = y/10)
   ══════════════════════════════════════════════════════════════ */
let GA=null, NOID=false;
const _face=face; face=function(p,o){ if(GA!==null) o=Object.assign({},o,{alpha:GA,id:null}); else if(NOID) o=Object.assign({},o,{id:null}); _face(p,o); };
const PB=0.5, PT=2.0;                              /* bottom platform top, top platform top */
const W=(xmm,h,ymm)=>[xmm/10,h,ymm/10];
const MAG_H=2.54, MAG_R=0.32, MB_H=1.2, TB_H=0.9;
const HGT={rod:PT+0.9+0.32+0.22, magnet:PT+MB_H+MAG_H, magblock:PT+MB_H, trap:PT+TB_H, probe:PT+2.5, meter:5.5, watch:1.5, screw:PT+0.6, screwA:PT+0.6, screwB:PT+0.6, platform:PT, desk:0, rail:PT+0.3, ruler:0.2};
/* height (cm) of the top platform's surface above its rest level at platform point (xmm, ymm): the plane
   through the three screw heads */
const tiltY=(xmm,ymm)=>(S.tl[0]+S.tl[1])/2*B.S*100+tiltRad()*(xmm-SCREWS[0][0])/10+tiltZ()*((ymm===undefined?72:ymm)-72)/10;
const platY=(xmm,ymm)=>PT+tiltY(xmm,ymm);

function drawDesk(){
  face([[-15,0,-15],[-15,0,36],[52,0,36],[52,0,-15]],{fill:"#b8926a",layer:-3,flat:true,id:"desk"});
  for(let x=-15;x<=52;x+=6) poly3([[x,0,-15],[x,0,36]],"#a7825b",1,{layer:-2});
  face([[-15,0,-15],[52,0,-15],[52,-2,-15],[-15,-2,-15]],{fill:"#8d6c4a",layer:-3,flat:true});
}
/* a bubble level as in the kit photo: a clear acrylic block holding a fluorescent yellow-green spirit vial
   with two black rings round its middle; (cxmm, czmm) is its centre on the platform, db (cm) the bubble's
   shift along the vial. It sits on the platform and tilts with it. */
function vial(ax,cxmm,czmm,db){
  const X=ax==="x", L=1.3, w=0.42, y0=platY(cxmm,czmm), h=0.62, cx=cxmm/10, cz=czmm/10, yc=y0+0.34, r=0.2, Lv=1.05;
  const G={alpha:0.38,layer:-1,stroke:"rgba(150,175,150,.9)",lw:1};
  if(X) box3(cx-L,cx+L,y0,y0+h,cz-w,cz+w,"#e8f3e4",G); else box3(cx-w,cx+w,y0,y0+h,cz-L,cz+L,"#e8f3e4",G);
  const along=(a,b,rad,col,o)=>X?cyl3("x",cx+a,cx+b,yc,cz,rad,col,o):cyl3("z",cz+a,cz+b,cx,yc,rad,col,o);
  along(-Lv,Lv,r,"#d4ef2c",{seg:14,alpha:0.92,cap:"#e3f76a"});                          /* the fluid */
  for(const m of [-0.34,0.34]) along(m-0.035,m+0.035,r+0.012,"#1b1d1a",{seg:14});         /* the two rings */
  const b=clamp(db,-(Lv-0.3),Lv-0.3);
  along(b-0.26,b+0.26,0.13,"#fbffe8",{seg:10,alpha:0.95,bias:1.2});                      /* the bubble, riding on top */
  if(X) cyl3("x",cx+b-0.26,cx+b+0.26,yc+0.09,cz,0.12,"#fdfff2",{seg:10,bias:1.4}); else cyl3("z",cz+b-0.26,cz+b+0.26,cx,yc+0.09,0.12,"#fdfff2",{seg:10,bias:1.4});
}
function drawPlatform3(){
  const L={layer:-1};
  /* item 4, the bottom platform: a 5 mm clear acrylic sheet with rounded corners and polished edges; the
     kit's small parts came stuck to it, their holes are still there; a little steel cup under each screw */
  const rr2=(x0,z0,x1,z1,r)=>{ const P=[]; for(const [xc,zc,a0] of [[x1-r,z0+r,-Math.PI/2],[x1-r,z1-r,0],[x0+r,z1-r,Math.PI/2],[x0+r,z0+r,Math.PI]])
    for(let i=0;i<=4;i++){ const a=a0+i/4*Math.PI/2; P.push([xc+r*Math.cos(a),zc+r*Math.sin(a)]); } return P; };
  const BP=rr2(-1.2,-1.0,27.2,18.2,1.2);
  prism3("y",0,PB,BP,"#cfe6ea",{id:"platform",alpha:0.36,cull:false});

/* (Fig. 4, item 6) the Hall sensor probe: a flat yellow stick about 10 cm long with the black sensor end,
   a black strain relief at the back and a long clear USB cable to a USB-A plug */
const STICK=10.0, RELIEF=1.4;
function crSpline(P,n){ const out=[]; if(P.length<2) return P.slice();
  for(let i=0;i<P.length-1;i++){ const p0=P[Math.max(0,i-1)], p1=P[i], p2=P[i+1], p3=P[Math.min(P.length-1,i+2)];
    for(let k=0;k<n;k++){ const t=k/n, t2=t*t, t3=t2*t;
      out.push([0,1,2].map(j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3))); } }
  out.push(P[P.length-1]); return out; }
/* the cable's way from the back of the probe to the plug: over the platform edge, along the desk,
   round the Teslameter box (never through it) and up its front to the Probe socket on top */
function cableRoute(){
  const tx=tipX()/10, y=PT+2.5, z=PRY/10, s0=tx+STICK+RELIEF, pl=ST.plug||plugRest();
  const P=[[s0,y,z],[s0+0.9,y-0.1,z]];
  let tail, F;
  if(pl.at==="meter"){ const m=ST.pos.meter, mx=m.x/10, mz=m.y/10, yt=5.5;
    F=[mx,0.2,mz+7.2];
    tail=[[mx,0.2,mz+7.2],[mx,0.5,mz+6.1],[mx,2.4,mz+5.3],[mx,yt+0.4,mz+5.0],[mx,yt+1.8,mz+4.2],[mx,yt+2.5,mz+3.1],[mx,yt+2.25,mz+2.5]]; }
  else { let px,pz,dir;
    if(pl.at==="hand"){ const q=onPlane(mouse[0],mouse[1],0); px=q[0]; pz=q[2]; dir=px>PW/20?1:-1; }
    else { px=pl.x; pz=pl.z; dir=pl.dir; }
    const yp=pl.at==="hand"?1.6:0.33;
    F=[px-dir*2.6,0.2,pz+0.6]; tail=[[px-dir*2.6,0.2,pz+0.6],[px-dir*1.75,yp,pz]]; }
  /* off the platform on the side facing F */
  const X0=-0.8, X1=26.8, Z0=-0.8, Z1=17.8;
  const ox=F[0]>X1?1:F[0]<X0?-1:0, oz=F[2]>Z1?1:F[2]<Z0?-1:0;
  let qx=ox>0?Math.max(X1,s0+1.4):ox<0?X0:Math.min(Math.max(F[0],X0+1),X1-1), qz=oz>0?Z1:oz<0?Z0:Math.min(Math.max(F[2],Z0+1),Z1-1);
  if(!ox&&!oz){ qx=X1; }
  const ux=ox||(!oz?1:0), uz=oz;
  const mid=[(P[1][0]+qx)/2,Math.max(PT+1.7,(P[1][1]+PT+0.9)/2+0.2),(P[1][2]+qz)/2];
  if(Math.hypot(mid[0]-P[1][0],mid[2]-P[1][2])>1.5) P.push(mid);
  P.push([qx-ux*0.2,PT+0.9,qz-uz*0.2],[qx+ux*0.5,PT-0.4,qz+uz*0.5],[qx+ux*1.4,0.6,qz+uz*1.4],[qx+ux*2.4,0.2,qz+uz*2.4]);
  /* round the meter box and its batteries if the straight run would cross them */
  if(ST.on.meter){ const m=ST.pos.meter, mx=m.x/10, mz=m.y/10, R=[mx-7.9,mz-8.4,mx+7.9,mz+5.5], A=P[P.length-1];
    const hits=(a,b)=>{ for(let i=1;i<20;i++){ const t=i/20, x=a[0]+(b[0]-a[0])*t, zz=a[2]+(b[2]-a[2])*t; if(x>R[0]&&x<R[2]&&zz>R[1]&&zz<R[3]) return true; } return false; };
    if(hits(A,F)){ const sx=(A[0]<mx?-1:1), cx=sx<0?R[0]:R[2];
      if(A[2]<R[1]) P.push([cx,0.2,R[1]]);
      if(F[2]>R[3]) P.push([cx,0.2,R[3]]); else P.push([cx,0.2,F[2]]); } }
  return crSpline(P.concat(tail),6); }

  const line=(a,b,col,lw,dash)=>{ const A=P(a), Bq=P(b); ctx.save(); if(dash) ctx.setLineDash(dash); seg(A[0],A[1],Bq[0],Bq[1],col,lw); ctx.restore(); };
  poly([[-40,-PTm],[Dmm+40,-PTm],[Dmm+40,0],[-40,0]],"rgba(200,225,233,.8)","#7d9aa6",1);
  poly([onTop(-34,0),onTop(Dmm+34,0),onTop(Dmm+34,PTm),onTop(-34,PTm)],"#f8f8f5","#555",1.1);

    if(S.rod){ const z=rodZ(), l=S.rod.len, A=P(onTop(cxp+z-l/2,PTm+yc+B.y0*1e3)), Bq=P(onTop(cxp+z+l/2,PTm+yc+B.y0*1e3)); seg(A[0],A[1],Bq[0],Bq[1],"#222",3); } }

}

function heightFor(id){
  if(id==="ruler"){ const r=ST.pos.ruler; return (r.x>0&&r.x<PW&&r.y>0&&r.y<PH)?PT:0; }
  if(id==="watch_ss"||id==="watch_rs") return 1.5;
  return HGT[id]!==undefined?HGT[id]:PT;
}
let down=null;
function pos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
/* 2-D views are drawn at 900 × 400 and scaled to the canvas */
let VS=1, VX=0, VY=0, VZ=1, VPX=0, VPY=0;            /* fit, then the wheel zoom and the drag pan */
const vpos=p=>[(p[0]-VX-VPX)/(VS*VZ),(p[1]-VY-VPY)/(VS*VZ)];
function openView(v){ view=v; VZ=1; VPX=VPY=0; $("btnBack").hidden=false; say("mView"); renderCap(); }
function closeView(){ view=null; $("btnBack").hidden=true; renderCap(); }
$("btnBack").onclick=closeView;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
function plugToggle(){ if(!ST.on.probe){ say("needProbe"); return; }
  if(plugged()){ ST.plug=plugRest(); say("plugOut"); } else { if(hand&&hand.k==="plug") hand=null; ST.plug={at:"meter"}; S.shown=fieldAtProbe(); say("plugIn"); } }
cv.addEventListener("pointerdown",e=>{
  const p=pos(e); mouse=p; cv.setPointerCapture(e.pointerId);
  if(view){
    if(e.button!==0){ down={p,pan:true,right:e.button===2,moved:false}; return; }
    const q=vpos(p);
    if(view==="meter"&&ST.on.meter){ if(Math.hypot(q[0]-MP.pw[0],q[1]-MP.pw[1])<30){ meterPress("pw"); return; } if(Math.hypot(q[0]-MP.rg[0],q[1]-MP.rg[1])<32){ meterPress("rg"); return; }
      if(Math.abs(q[0]-MP.usb[0])<34&&Math.abs(q[1]-MP.usb[1])<20){ plugToggle(); return; } }
    if(view==="trap"&&ST.on.trap&&q[0]>452&&hand&&hand.k==="pick"){ const m=[ST.pos.trap.x+(q[0]-670)/9, ST.pos.trap.y+(q[1]-200)/9]; if(onRod(m)){ S.hold={z:clamp(m[0]-ST.pos.trap.x,-8,8)}; say("pushed"); } else say("noRod"); return; }
    if(view==="tilt"&&Math.hypot(q[0]-HEAD.x,q[1]-HEAD.y)<HEAD.r+10){ down={head:Math.atan2(q[1]-HEAD.y,q[0]-HEAD.x)}; return; }
    down={p,pan:true,moved:false}; return;
  }
  const id=pick3(p[0],p[1]);
  /* the right button: a click returns things, a drag turns the view */
  if(e.button===2){ down={p,id,right:true,moved:false}; return; }
  if(e.button===1){ down={p,id,moved:false,shift:true}; return; }
  if(hand&&hand.k==="plug"){
    if(id==="meter"||id==="plug"){ ST.plug={at:"meter"}; hand=null; S.shown=fieldAtProbe(); say("plugIn"); drawTray(); return; }
    benchDown(mmAt(p[0],p[1],0),false); drawTray(); return; }
  if(!hand&&id==="plug"){ if(plugged()) say("plugOut"); else say("plugTake"); ST.plug={at:"hand"}; hand={k:"plug"}; drawTray(); return; }
  if(hand){
    const k=hand.k, h=(k==="meter"||k==="watch")?0:(k==="ruler"?(id==="desk"?0:PT):(k==="probe"?PT+0.3:k==="pick"?HGT.rod:heightFor(id||"platform")));
    benchDown(mmAt(p[0],p[1],(k==="mag"||k==="trap")?PT:h),false); drawTray(); return; }
  if(id==="watch_ss"){ watchPress("ss"); return; } if(id==="watch_rs"){ watchPress("lr"); return; }
  const mm=mmAt(p[0],p[1],heightFor(id));
  down={p,id,moved:false,shift:e.shiftKey,h:heightFor(id)};
  if(id&&id!=="desk"&&id!=="platform"&&id!=="rail") benchDown(mm,false);
});
cv.addEventListener("pointermove",e=>{
  const p=pos(e), dx=p[0]-mouse[0], dy=p[1]-mouse[1]; mouse=p;
  if(view){ if(down&&down.head!==undefined){ const q=vpos(p), a=Math.atan2(q[1]-HEAD.y,q[0]-HEAD.x); turnScrew(angDelta(down.head,a)/(2*Math.PI)*(e.shiftKey?0.1:0.5)); down.head=a; }
    if(down&&down.pan){ if(Math.hypot(p[0]-down.p[0],p[1]-down.p[1])>4) down.moved=true; if(down.moved){ VPX+=dx; VPY+=dy; clampVP(); cv.classList.add("grabbing"); } }
    if(S.hold&&view==="trap"&&ST.on.trap){ const q=vpos(p); S.hold.z=clamp(ST.pos.trap.x+(q[0]-670)/9-ST.pos.trap.x,-8,8); } return; }
  mouseMM=mmAt(p[0],p[1],PT);
  if(S.hold&&hand&&hand.k==="pick"&&ST.on.trap){ benchMove(mmAt(p[0],p[1],HGT.rod)); return; }
  if(!down) return;
  if(Math.hypot(p[0]-down.p[0],p[1]-down.p[1])>4) down.moved=true;
  if(!down.moved) return;
  if(drag&&!down.right){ const k=drag.k, h=k==="meter"||k==="watch"?0:k==="ruler"?heightFor("ruler"):k==="holder"?HGT.probe:k==="rot"?HGT.magnet:k==="screw"?HGT.screw:PT; benchMove(mmAt(p[0],p[1],h)); return; }
  if(down.shift||e.buttons===4){ CAM.px+=dx; CAM.py+=dy; }
  else { CAM.yaw+=dx*0.008; CAM.pitch=Math.min(1.5,Math.max(0.12,CAM.pitch+dy*0.006)); }
  cv.classList.add("grabbing");
});
const up=()=>{ cv.classList.remove("grabbing");
  if(down&&down.right&&!down.moved){ if(view) closeView();
    else { if(hand){ if(hand.k==="plug") ST.plug=plugRest(); hand=null; } else if(down.id==="plug"){ if(plugged()){ ST.plug=plugRest(); say("plugOut"); } }
      else if(down.id) benchDown(mmAt(down.p[0],down.p[1],heightFor(down.id)),true); drawTray(); }
    down=null; drag=null; releaseHold(); return; }
  if(down&&!down.right&&down.head===undefined&&!down.pan&&!down.moved&&!view){ const id=down.id;
    if(id==="meter") openView("meter"); else if(id==="trap"&&!(hand&&hand.k==="pick")) openView("trap"); else if(id==="screw") openView("tilt"); }
  down=null; drag=null; releaseHold(); };
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=pos(e), s=e.deltaY<0?1:-1;
  if(view){ if(view==="tilt"){ const q=vpos(p); if(Math.hypot(q[0]-HEAD.x,q[1]-HEAD.y)<HEAD.r+10){ turnScrew(s*(e.shiftKey?0.002:0.01)); return; } }
    const nz=Math.min(6,Math.max(1,VZ*(s>0?1.15:1/1.15))), r=nz/VZ, ox=VX+VPX, oy=VY+VPY;
    VPX=p[0]-(p[0]-ox)*r-VX; VPY=p[1]-(p[1]-oy)*r-VY; VZ=nz; clampVP(); return; }
  if(hand&&hand.k==="ruler"){ hand.rot=hand.rot?0:1; return; }
  const id=pick3(p[0],p[1]);
  if(id==="screw"){ turnScrew(s*(e.shiftKey?0.002:0.01)); return; }
  if(id==="screwA"||id==="screwB"){ turnLeft(id==="screwA"?0:1,s*(e.shiftKey?0.002:0.01)); return; }
  if(id==="magnet"||id==="magblock"){ S.magAng+=s*(e.shiftKey?0.5:3); return; }
  const f=s>0?1.12:1/1.12, nk=Math.min(120,Math.max(4,CAM.k*f)), r=nk/CAM.k;
  CAM.px=(p[0]-CAM.W/2)-(p[0]-CAM.W/2-CAM.px)*r; CAM.py=(p[1]-CAM.H/2)-(p[1]-CAM.H/2-CAM.py)*r; CAM.k=nk; },{passive:false});
let trayDrag=false;
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("pointerdown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=hand&&hand.k===k; hand=null;
    if(!same&&trayAvail(k)){ hand={k}; say("picked",itemName(k)); if(view&&k!=="pick") closeView(); } drawTray(); return; } });
window.addEventListener("pointerup",e=>{ if(trayDrag&&hand&&e.target===cv&&!view){ const p=pos(e), id=pick3(p[0],p[1]), k=hand.k;
  benchDown(mmAt(p[0],p[1],(k==="meter"||k==="watch")?0:PT),false); drawTray(); } trayDrag=false; });

/* keep a zoomed 2-D view on the canvas */
function clampVP(){ if(VZ<=1.0001){ VPX=VPY=0; return; }
  const w=CLW*VS*VZ, h=CLH*VS*VZ;
  VPX=Math.min(Math.max(VPX,CAM.W*0.25-w-VX),CAM.W*0.75-VX); VPY=Math.min(Math.max(VPY,CAM.H*0.25-h-VY),CAM.H*0.75-VY); }

function drawGhost(){
  if(!hand||!overBench||view||hand.k==="plug") return;
  const k=hand.k, [x,,z]=onPlane(mouse[0],mouse[1],(k==="meter"||k==="watch")?0:PT);
  const sv={on:Object.assign({},ST.on),pos:JSON.parse(JSON.stringify(ST.pos)),hx:ST.holderX}; GA=0.5;
  if(k==="mag"){ ST.pos.mag={x:x*10,y:z*10}; drawMag3(); }
  else if(k==="trap"){ ST.pos.trap={x:x*10,y:z*10}; drawTrap3(); }
  else if(k==="meter"){ ST.pos.meter={x:x*10,y:z*10}; drawMeter3(); }
  else if(k==="watch"){ ST.pos.watch={x:x*10,y:z*10}; drawWatch3(); }
  else if(k==="ruler"){ ST.pos.ruler={x:x*10,y:z*10,rot:hand.rot||0}; drawRuler3(); }
  else if(k==="probe"){ ST.holderX=clamp(x*10,HOLD.min,HOLD.max); drawProbe3(); }
  GA=null; Object.assign(ST.on,sv.on); ST.pos=sv.pos; ST.holderX=sv.hx;
  if(["r03","r05","r07","r09","sticker","ins","pick"].includes(k)){ const q=P3(x,PT+3,z); ctx.save(); ctx.globalAlpha=0.85; ctx.translate(q[0],q[1]); icon(k,0,0,1.1); ctx.restore(); }
}
function layout(){
  const dpr=Math.min(window.devicePixelRatio||1,2), w=cv.parentElement.clientWidth||900;
  const h=Math.max(440,Math.min(Math.round(w*0.66),Math.round(window.innerHeight*0.8)));
  cv.style.width=w+"px"; cv.style.height=h+"px"; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const first=!CAM0.k; CAM.W=w; CAM.H=h; CAM.dpr=dpr;
  if(first){ CAM.k=w/40; CAM.tx=17; CAM.ty=1; CAM.tz=10; CAM.yaw=-0.3; CAM.pitch=0.78; CAM.px=0; CAM.py=10; camSave(); }
  VS=Math.min(w/CLW,h/CLH); VX=(w-CLW*VS)/2; VY=(h-CLH*VS)/2;
  const tdpr=window.devicePixelRatio||1, tr=trayCv.parentElement.getBoundingClientRect();
  TRW=Math.max(150,Math.floor(tr.width-16)); TRH=TRAY_LIST.length*TROW+50;
  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  drawTray();
}
function renderLaps(){ $("laps").textContent=S.watch.laps.map((t,i)=>"LAP "+String(i+1).padStart(2," ")+"   "+fmtWatch(t)).join("\n"); }
function renderCap(){ const t=d(), i={meter:0,trap:1,tilt:2}[view];
  $("t-cap").textContent=view?t.caps[i]+t.capR:t.cap; $("btnBack").textContent=t.back; }
function renderStatus(){
  const L=[], t=d();
  if(!Object.values(ST.on).some(v=>v)) L.push([t.st.none,false]);
  if(ST.on.meter&&!S.mOn) L.push([t.st.meterOff,false]);
  if(ST.on.probe&&!plugged()) L.push([t.st.noPlug,false]);
  if(ringing()) L.push([t.st.ringing,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),msg.key==="snap"]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
$("rodLen").oninput=e=>{ S.rodLen=+e.target.value; $("t-len").textContent=d().len(S.rodLen); };
$("btnSS").onclick=()=>watchPress("ss"); $("btnLap").onclick=()=>watchPress("lr");
$("btnSave").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([$("note").value],{type:"text/plain"})); a.download="IPhO2017_E2_notebook.txt"; a.click(); say("saved"); };
$("vReset").onclick=()=>{ closeView(); camReset(); };
$("vMeter").onclick=()=>openView("meter"); $("vTrap").onclick=()=>openView("trap"); $("vTilt").onclick=()=>openView("tilt");
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-h-watch").textContent=t.hWatch; $("btnSS").textContent=t.ss; $("btnLap").textContent=t.lapReset;
  $("t-h-rod").textContent=t.hRod; $("t-len").textContent=t.len(S.rodLen); $("t-rodhint").textContent=t.rodHint;
  $("t-h-view").textContent=t.hView; $("vReset").textContent=t.vReset; $("vMeter").textContent=t.vMeter; $("vTrap").textContent=t.vTrap; $("vTilt").textContent=t.vTilt;
  $("t-h-note").textContent=t.hNote; $("note").placeholder=t.notePh; $("btnSave").textContent=t.save; $("t-hint").textContent=t.hint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2017 E2 — 평행 쌍극자선 자기 트랩 · HaslaLab":"IPhO 2017 E2 — Parallel Dipole Line Magnetic Trap · HaslaLab";
  renderCap(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  requestAnimationFrame(tick);
  try{ frame(); tick.bad=0; }catch(err){ if(!tick.warned){ tick.warned=true; console.error(err); }
    if(++tick.bad>30&&GL3.ok===true&&!view){ GL3.ok=false; tick.bad=0; } }
}
function frame(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  S.mAcc+=dt; if(S.mAcc>=0.12){ if(ST.on.meter&&S.mOn) meterStep(S.mAcc); S.mAcc=0; }
  rodStep(dt);
  if(S.watch.run) S.watch.t+=dt;
  $("clock").textContent=ST.on.watch?fmtWatch(S.watch.t):"--:--.--";
  $("clock").style.opacity=ST.on.watch?1:0.4; $("btnSS").disabled=$("btnLap").disabled=!ST.on.watch;
  const dpr=CAM.dpr;
  if(view){ ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CAM.W,CAM.H);
    ctx.setTransform(dpr*VS*VZ,0,0,dpr*VS*VZ,dpr*(VX+VPX),dpr*(VY+VPY));
    if(view==="meter") closeMeter(); else if(view==="trap") closeTrap(); else closeTilt(); }
  else { ctx.setTransform(dpr,0,0,dpr,0,0); const g=ctx.createLinearGradient(0,0,0,CAM.H); g.addColorStop(0,"#2a3038"); g.addColorStop(1,"#1b1f25"); ctx.fillStyle=g; ctx.fillRect(0,0,CAM.W,CAM.H);
    begin3(); drawScene3(); drawGhost(); render3(ctx); }
  if(++frameN%6===0){ renderStatus(); drawTray(); }
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
