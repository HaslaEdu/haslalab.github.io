<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}

const MU0=1.257e-6, R=3.2e-3, LMAG=25.4e-3, GM=1.5e-3, A_PDL=R+GM/2;
const RHO=1680.0, GRAV=9.8, C1=198.6;
const X_OFFSET=4.0e-3, METER_FS=0.300;
const ROD_D={"HB/0.3":0.38e-3,"HB/0.5":0.56e-3,"HB/0.7":0.70e-3,"HB/0.9":0.90e-3};

const Y0_FINITE=1.06, TAU_A=3.15, TAU_B=29.40;
const D_TILT=0.220, S_TRUE=0.80e-3, TILT_EXAG=20.0;

function norm(mu,sd){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();

/* field of a diametrically magnetised cylinder, with the finite-length roll-over */
function bMagnet(x,M){ x=Math.max(x,1e-4);
  return MU0*M*R*R/(2*x*x)*Math.pow(1+Math.pow(x/LMAG,10),-0.1); }
const fY=u=>4*u*(3-u*u)*(1-u*u)/Math.pow(1+u*u,5);

function levitationHeight(M,chi){
  const coef=MU0*M*M*Math.abs(chi)/2*Math.pow(R,4)/Math.pow(A_PDL,5);
  const target=RHO*GRAV/coef;
  let uBest=0.5,best=1e9,top=0,fmax=-1;
  for(let i=0;i<40000;i++){const u=0.02+(0.99-0.02)*i/39999; const f=fY(u);
    if(f>fmax){fmax=f;top=i;}}
  for(let i=top;i<40000;i++){const u=0.02+(0.99-0.02)*i/39999;
    const e=Math.abs(fY(u)-target); if(e<best){best=e;uBest=u;}}
  return uBest*A_PDL;
}
const omegaZ=(chi,M)=>Math.sqrt(-C1*MU0*chi*M*M/RHO);
function tauDamping(d,l){const r=d*1e3/2, L=l*1e3;
  return TAU_A+TAU_B*r*r*Math.log(0.607*L/r);}

/* one bench; its small imperfections are drawn once */
const B={

  chi:CHI_TRUE*(1+norm(0,0.02)),

  tauScale:1+norm(0,0.03), S:S_TRUE*(1+norm(0,0.04)), D:D_TILT
};
B.y0 = levitationHeight(B.M,B.chi)*Y0_FINITE*(1+norm(0,0.02));
B.omega = omegaZ(B.chi,B.M);
const benchTau=(d,l)=>tauDamping(d,l)*B.tauScale;
const teslaTrue=(x,phiDeg)=>bMagnet(x,B.M)*Math.cos(2*phiDeg*Math.PI/180)+B.B0+B.drift;

/* ── what the Hall element sees: a line dipole, the component along the probe axis ── */
function fieldAtProbe(){
  let b=B.B0+B.drift;
  if(ST.on.mag&&ST.on.probe){
    const C=ST.pos.mag, ex=tipX()+EL_IN-C.x, ey=PRY-C.y, r=Math.hypot(ex,ey);
    const rx=ex/r, ry=ey/r, a=(S.magAng+S.phiOff)*Math.PI/180, mx=Math.cos(a), my=Math.sin(a);

function meterStep(dt){
  const target=fieldAtProbe();

  S.settling=Math.abs(target-S.shown)>=3e-4;

  return (S.range===800?v.toFixed(1):v.toFixed(3))+" mT";
}

/* ══════════════════════════════════════════════════════════════
   5.  HANDS ON THE BENCH  (all hit tests in mm)
   ══════════════════════════════════════════════════════════════ */
const BX0=-PX0/PM, BY0=-PY0/PM, BX1=(LW-PX0)/PM, BY1=(LH-PY0)/PM;
function rectOf(k,x,y){ const [w,h]=FP[k]; return [x-w/2,y-h/2,x+w/2,y+h/2]; }
function rulerRect(x,y,rot){ return rot?[x-12,y-100,x+12,y+100]:[x-100,y-12,x+100,y+12]; }
const inter=(a,b,m)=>a[0]<b[2]+(m||0)&&a[2]>b[0]-(m||0)&&a[1]<b[3]+(m||0)&&a[3]>b[1]-(m||0);
const inR=(p,r)=>p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3];
const PLAT=[0,0,PW,PH], RAILR=[RAIL.x0,RAIL.y0,RAIL.x1,RAIL.y1];
function others(k){ const out=[];
  for(const o of ["mag","trap","meter","watch"]) if(o!==k&&ST.on[o]) out.push(rectOf(o,ST.pos[o].x,ST.pos[o].y));
  if(k!=="ruler"&&ST.on.ruler){ const r=ST.pos.ruler; out.push(rulerRect(r.x,r.y,r.rot)); }
  return out; }
function magHitsProbe(x,y){ if(!ST.on.probe) return false; return Math.abs(y-PRY)<3.5+3.3&&x>tipX()-3.3&&x<ST.holderX+9; }
function fitsBlock(k,x,y){
  const r=rectOf(k,x,y);
  if(r[0]<1||r[1]<1||r[2]>PW-1||r[3]>PH-1) return "noFit";
  if(inter(r,RAILR)) return "noFit";
  if(SCREWS.some(([sx,sy])=>inter(r,[sx-6.5,sy-6.5,sx+6.5,sy+6.5]))) return "noFit";
  if(others(k).some(o=>inter(r,o,1))) return "noFit";
  const o=k==="mag"?"trap":"mag"; if(ST.on[o]&&Math.hypot(ST.pos[o].x-x,ST.pos[o].y-y)<70) return "snap";
  if(k==="mag"&&magHitsProbe(x,y)) return "noFit";
  if(k==="trap"&&ST.on.probe&&inter(r,[tipX(),PRY-4,ST.holderX+9,PRY+4])) return "noFit";
  return null; }
function fitsTable(k,x,y){
  const r=rectOf(k,x,y);
  if(r[0]<BX0+1||r[1]<BY0+1||r[2]>BX1-1||r[3]>BY1-1) return false;
  if(inter(r,[-3,-3,PW+4,PH+4])) return false;
  return !others(k).some(o=>inter(r,o,1)); }
function fitsRuler(x,y,rot){
  const r=rulerRect(x,y,rot);
  if(r[0]<BX0||r[1]<BY0||r[2]>BX1||r[3]>BY1) return false;
  if(inter(r,RAILR)) return false;
  return !others("ruler").some(o=>inter(r,o,0.5)); }
function holderOK(hx){
  if(hx<HOLD.min||hx>HOLD.max) return false;
  if(ST.on.mag){ const m=ST.pos.mag; if(Math.abs(m.y-PRY)<3.5+3.3&&m.x<hx+9&&m.x>hx-TIP_OUT-3.3) return false; }
  if(ST.on.trap&&inter(rectOf("trap",ST.pos.trap.x,ST.pos.trap.y),[hx-TIP_OUT,PRY-4,hx+9,PRY+4])) return false;
  return true; }
function moveHolder(hx){
  hx=clamp(hx,HOLD.min,HOLD.max);
  if(holderOK(hx)){ ST.holderX=hx; return; }
  /* slide up to the obstacle */
  const s=Math.sign(hx-ST.holderX); let x=ST.holderX;
  while(Math.abs(hx-x)>0.05&&holderOK(x+s*0.05)) x+=s*0.05;
  if(x!==ST.holderX){ ST.holderX=x; if(ST.on.mag&&Math.abs(tipX()-(ST.pos.mag.x+3.2))<0.2) say("hit"); } }
const onMag=p=>ST.on.mag&&Math.hypot(p[0]-ST.pos.mag.x,p[1]-ST.pos.mag.y)<4.5;
const inBlock=(k,p)=>ST.on[k]&&inR(p,rectOf(k,ST.pos[k].x,ST.pos[k].y));
const onScrew=p=>Math.hypot(p[0]-SCREWS[2][0],p[1]-SCREWS[2][1])<7.5;
const onHolder=p=>ST.on.probe&&((p[0]>ST.holderX-9&&p[0]<ST.holderX+9&&p[1]>123&&p[1]<171)||(p[0]>tipX()&&p[0]<ST.holderX&&Math.abs(p[1]-PRY)<4.5));
function onRod(p){ if(!S.rod||!ST.on.trap) return false; const q=ST.pos.trap; return Math.abs(p[0]-(q.x+rodZ()))<S.rod.len/2+2&&Math.abs(p[1]-q.y)<4; }
const onRuler=p=>ST.on.ruler&&inR(p,rulerRect(ST.pos.ruler.x,ST.pos.ruler.y,ST.pos.ruler.rot));

function returnItem(k){
  if(k==="mag"){ ST.on.sticker=false; }
  if(k==="trap"){ S.rod=null; ST.on.ins=false; S.hold=null; }
  if(k==="meter") S.mOn=false;
  ST.on[k]=false; say("back",itemName(k));
}
function turnScrew(dt){
  const before=S.turns; S.turns=clamp(S.turns+dt,TURN_MIN,TURN_MAX);
  if(S.turns!==before+dt) say(S.turns>=TURN_MAX?"endIn":"endOut"); else say("turn");
}
function watchPress(w){
  if(!ST.on.watch){ say("needWatch"); return; }
  if(w==="ss"){ S.watch.run=!S.watch.run; say(S.watch.run?"wsStart":"wsStop"); }
  else if(S.watch.run){ S.watch.laps.push(S.watch.t); say("wsLap"); }
  else { S.watch.t=0; S.watch.laps=[]; say("wsReset"); }
  renderLaps();
}
function meterPress(w){
  if(w==="pw"){ S.mOn=!S.mOn; S.shown=fieldAtProbe(); say("meter",S.mOn?"ON":"OFF"); }
  else { S.range=S.range===800?8:800; say("range",S.range+" mT"); }
}
function putDown(p){
  const k=hand.k, [x,y]=p;
  if(k==="mag"||k==="trap"){ const f=fitsBlock(k,x,y); if(f){ say(f); return; } ST.pos[k]={x,y}; ST.on[k]=true; hand=null; say("placed",itemName(k)); if(k==="trap") view=1; return; }
  if(k==="meter"||k==="watch"){ if(!fitsTable(k,x,y)){ say("noFit"); return; } ST.pos[k]={x,y}; ST.on[k]=true; hand=null; say("placed",itemName(k)); if(k==="meter") view=0; return; }
  if(k==="ruler"){ const rot=hand.rot||0; if(!fitsRuler(x,y,rot)){ say("noFit"); return; } ST.pos.ruler={x,y,rot}; ST.on.ruler=true; hand=null; say("placed",itemName(k)); return; }
  if(k==="probe"){ if(!(y>RAIL.y0-22&&y<RAIL.y1&&x>RAIL.x0&&x<RAIL.x1)){ say("onRail"); return; }
    if(!holderOK(clamp(x,HOLD.min,HOLD.max))){ say("noFit"); return; }
    ST.holderX=clamp(x,HOLD.min,HOLD.max); ST.on.probe=true; hand=null; say("placed",itemName(k)); view=0; return; }
  if(k[0]==="r"&&ROD_KEY[k]){ if(!ST.on.trap){ say("needTrap"); return; } if(!inBlock("trap",p)){ say("noFit"); return; }
    if(S.rod){ say("rodBusy"); return; }
    S.rod={k,len:S.rodLen}; S.z=norm(0,0.25)*1e-3; S.vz=0; hand=null; view=1; say("rodIn",ROD_KEY[k],S.rodLen); return; }
  if(k==="ins"){ if(!ST.on.trap){ say("needTrap"); return; } if(!inBlock("trap",p)){ say("noFit"); return; } ST.on.ins=true; hand=null; view=1; say("insOn"); return; }
  if(k==="sticker"){ if(!onMag(p)&&!inBlock("mag",p)){ say("needMag"); return; } S.stickRel=-S.magAng; ST.on.sticker=true; hand=null; say("stickOn"); return; }
  if(k==="pick"){ if(onRod(p)){ S.hold={}; say("pushed"); return; } say("noRod"); return; }
}
function benchDown(p,right){
  if(hand){
    if(right){ hand=null; return; }
    if(hand.k==="loupe") return;
    putDown(p); return; }
  if(right){
    if(onRod(p)){ S.rod=null; say("rodOut"); return; }
    if(ST.on.ins&&inBlock("trap",p)&&p[0]>ST.pos.trap.x+9){ ST.on.ins=false; say("insOff"); return; }
    if(ST.on.sticker&&onMag(p)){ ST.on.sticker=false; say("stickOff"); return; }
    if(onHolder(p)){ returnItem("probe"); return; }
    for(const k of ["meter","watch","mag","trap"]) if(inBlock(k,p)){ returnItem(k); return; }
    if(onRuler(p)){ returnItem("ruler"); return; }
    return; }
  if(ST.on.meter){ const H=METER_HIT(); if(Math.hypot(p[0]-H.pw[0],p[1]-H.pw[1])<3.5){ meterPress("pw"); view=0; return; }
    if(Math.hypot(p[0]-H.rg[0],p[1]-H.rg[1])<4){ meterPress("rg"); view=0; return; } }
  if(ST.on.watch){ const W=WATCH_BTN(); if(Math.hypot(p[0]-W.ss[0],p[1]-W.ss[1])<3.5){ watchPress("ss"); return; } if(Math.hypot(p[0]-W.lr[0],p[1]-W.lr[1])<3.5){ watchPress("lr"); return; } }
  if(onScrew(p)){ drag={k:"screw",a:Math.atan2(p[1]-SCREWS[2][1],p[0]-SCREWS[2][0])}; view=2; return; }
  if(onMag(p)){ drag={k:"rot",a:Math.atan2(p[1]-ST.pos.mag.y,p[0]-ST.pos.mag.x)}; view=0; return; }
  if(onHolder(p)){ drag={k:"holder",dx:ST.holderX-p[0]}; view=0; return; }
  for(const k of ["meter","watch","mag","trap"]) if(inBlock(k,p)){ drag={k,dx:ST.pos[k].x-p[0],dy:ST.pos[k].y-p[1]}; return; }
  if(onRuler(p)){ drag={k:"ruler",dx:ST.pos.ruler.x-p[0],dy:ST.pos.ruler.y-p[1]}; return; }
}
function angDelta(a,b){ let x=b-a; while(x>Math.PI) x-=2*Math.PI; while(x<-Math.PI) x+=2*Math.PI; return x; }
function benchMove(p){
  if(S.hold&&hand&&hand.k==="pick"&&ST.on.trap){ S.hold.z=clamp(p[0]-ST.pos.trap.x,-8,8); return; }
  if(!drag) return; const k=drag.k;
  if(k==="screw"){ const a=Math.atan2(p[1]-SCREWS[2][1],p[0]-SCREWS[2][0]); turnScrew(-angDelta(drag.a,a)/(2*Math.PI)); drag.a=a; return; }
  if(k==="rot"){ const a=Math.atan2(p[1]-ST.pos.mag.y,p[0]-ST.pos.mag.x); S.magAng+=angDelta(drag.a,a)*180/Math.PI; drag.a=a; return; }
  if(k==="holder"){ moveHolder(p[0]+drag.dx); return; }
  const x=p[0]+drag.dx, y=p[1]+drag.dy;
  if(k==="mag"||k==="trap"){ if(!fitsBlock(k,x,y)) ST.pos[k]={x,y}; return; }
  if(k==="meter"||k==="watch"){ if(fitsTable(k,x,y)) ST.pos[k]={x,y}; return; }
  if(k==="ruler"){ if(fitsRuler(x,y,ST.pos.ruler.rot)) ST.pos.ruler={x,y,rot:ST.pos.ruler.rot}; }
}
function releaseHold(){ if(S.hold){ if(S.hold.z!==undefined){ S.z=S.hold.z*1e-3; S.vz=0; } S.hold=null; say("released"); } }
function lpos(e){ const r=cv.getBoundingClientRect(); const px=(e.clientX-r.left)/SC, py=(e.clientY-r.top)/SC; mouse=[px,py]; return [(px-PX0)/PM,(py-PY0)/PM]; }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouseMM=lpos(e); benchMove(mouseMM); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouseMM=p; if(e.button!==2) cv.setPointerCapture(e.pointerId); benchDown(p,e.button===2); benchMove(p); drawTray(); });
cv.addEventListener("wheel",e=>{ const p=lpos(e);
  if(hand&&hand.k==="ruler"){ e.preventDefault(); hand.rot=hand.rot?0:1; return; }
  if(onScrew(p)){ e.preventDefault(); turnScrew((e.deltaY>0?-1:1)*(e.shiftKey?0.005:0.025)); view=2; return; }
  if(onMag(p)||inBlock("mag",p)){ e.preventDefault(); S.magAng+=(e.deltaY>0?-1:1)*(e.shiftKey?0.5:3); view=0; return; }
},{passive:false});
const endDrag=()=>{ drag=null; releaseHold(); };
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
window.addEventListener("pointerup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); putDown(p); drawTray(); } trayDrag=false; });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("pointerdown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k; hand=null;
    if(!same&&trayAvail(k)){ hand={k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ══════════════════════════════════════════════════════════════
   6.  THE ROD  —  the camelback potential is a damped oscillator;
        the tilt of the platform moves its equilibrium (Part B)
   ══════════════════════════════════════════════════════════════ */
const TURN_MIN=-0.5, TURN_MAX=2.0;
const rodZ=()=>S.hold&&S.hold.z!==undefined?S.hold.z:(S.z+S.jit)*1e3;
function rodStep(dt){
  if(!S.rod||!ST.on.trap) return;
  S.jit+=(-S.jit/2.0)*dt+norm(0,1.2e-5)*Math.sqrt(Math.max(dt,1e-4));
  if(S.hold) return;
  const w=B.omega, gam=1/benchTau(ROD_D[ROD_KEY[S.rod.k]],S.rod.len*1e-3), zeq=-GRAV*Math.sin(tiltRad())/(w*w);
  const n=Math.max(1,Math.ceil(dt/0.002)), h=dt/n;
  for(let i=0;i<n;i++){ S.vz+=(-w*w*(S.z-zeq)-2*gam*S.vz)*h; S.z+=S.vz*h; }
  if(Math.abs(S.z)>9e-3){ S.z=Math.sign(S.z)*9e-3; S.vz=-0.3*S.vz; }
}
const ringing=()=>S.rod&&!S.hold&&(Math.abs(S.vz)>3e-5);

/* ══════════════════════════════════════════════════════════════
   7.  CLOSE-UP  (900 × 400 logical px, three views)
   ══════════════════════════════════════════════════════════════ */
const closeCv=$("closeCv"), cctx=closeCv.getContext("2d");
const CLW=900, CLH=400; let CS=1;
function msgBox(s,x,w){ text(s,x+w/2,CLH/2,"#69717a",14,"center"); }
function magnify(cx,cy,mx,my,sc,rx,ry,rw,rh){
  ctx.save(); ctx.beginPath(); rrect(rx,ry,rw,rh,8); ctx.clip();
  ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.translate(-mx,-my); drawScene(); ctx.restore();
  fillR(rx,ry,rw,rh,8,null,"#3a4048",1.5);
}
const MP={pw:[86,300],rg:[352,300]};
function closeMeter(){
  if(!ST.on.meter){ msgBox(d().lab.noMeter,0,440); }
  else {
    fillR(20,40,400,320,14,"#141414","#000",2);
    text(d().lab.title,220,72,"#e6e6e6",20,"center","600");
    fillR(52,100,336,96,8,"#2a2f33");
    fillR(62,110,316,76,4,S.mOn?"#2c5d6b":"#0f1c21");
    text(meterText(),364,150,"#d8f6ff",40,"right","700",MONO);
    circ(MP.pw[0],MP.pw[1],20,S.mOn?"#e24a3b":"#7a2a24","#000",2); circ(MP.pw[0]-5,MP.pw[1]-6,6,"rgba(255,255,255,.35)");
    text(d().lab.power,MP.pw[0],MP.pw[1]-36,"#ccc",14,"center","600");
    fillR(MP.rg[0]-12,MP.rg[1]-26,24,52,6,"#2b2b2b","#000",1.5);
    fillR(MP.rg[0]-9,S.range===800?MP.rg[1]-23:MP.rg[1]+1,18,22,4,"#d33");
    text("800mT",MP.rg[0]+20,MP.rg[1]-14,"#ccc",13,"left","600"); text("8mT",MP.rg[0]+20,MP.rg[1]+14,"#ccc",13,"left","600");
    fillR(196,288,48,22,3,"#2a2a2a","#666",1.5); fillR(204,294,32,10,2,"#111");
    text(d().lab.probe,220,276,"#ccc",13,"center","600");
    if(!ST.on.probe) text(d().lab.noProbe,220,334,"#888",12,"center");
  }
  if(ST.on.probe||ST.on.mag){
    const c=ST.on.probe?[tipX()-1,PRY]:[ST.pos.mag.x,ST.pos.mag.y];
    magnify(670,200,c[0],c[1],10,452,20,428,360); text("×10",866,36,"#f2c14e",13,"right","700");
  } else msgBox(d().lab.noTip,450,440);
}
function closeTrap(){
  if(!ST.on.trap){ msgBox(d().lab.noTrap,0,CLW); return; }
  /* left: cross section seen along the magnet axis, after Fig. 7 */
  const ox=20, oy=40, X0=-9, X1=13, Y0=-5.5, Y1=8.2, sc=410/(X1-X0);
  fillR(ox,oy,410,(Y1-Y0)*sc,8,"#eef1f3");
  const X=v=>ox+(v-X0)*sc, Y=v=>oy+(Y1-v)*sc;
  const Rm=R*1e3, Am=A_PDL*1e3, y0=B.y0*1e3;
  for(const sx of [-Am,Am]){ const g=ctx.createRadialGradient(X(sx)-12,Y(0)-12,4,X(sx),Y(0),Rm*sc); g.addColorStop(0,"#f2f3f5"); g.addColorStop(1,"#9aa0a6");
    circ(X(sx),Y(0),Rm*sc,g,"#555",1.2); }
  fillR(X(-Am-Rm-2.2),Y(-Rm),(2*(Am+Rm)+4.4)*sc,(Y0+Rm>-5.5?1.6:1.6)*sc,2,"rgba(170,205,220,.6)");
  if(S.rod){ const dd=ROD_D[ROD_KEY[S.rod.k]]*1e3; circ(X(0),Y(y0),Math.max(dd/2*sc,2.2),"#202020","#000",.6); }
  if(ST.on.ins){
    const xr=8.8; seg(X(xr),Y(Rm-5.2),X(xr),Y(Rm+1.6),"#333",1.6);
    fillR(X(xr),Y(Rm+1.6),1.6*sc,6.8*sc,2,"rgba(255,255,255,.85)","#999",.8);
    for(let k=-1.0;k<=5.001;k+=0.1){ const isInt=Math.abs(k-Math.round(k))<1e-6, half=Math.abs(k*2-Math.round(k*2))<1e-6;
      seg(X(xr),Y(Rm-k),X(xr-(isInt?1.7:half?1.1:.55)),Y(Rm-k),"#333",isInt?1:.6);
      if(isInt) text(String(Math.round(k)+0),X(xr+0.35),Y(Rm-k),"#111",12,"left","",MONO); }
  }
  /* right: the trap from above */
  const p=ST.pos.trap; magnify(670,200,p.x,p.y,9,452,20,428,360); text("×9",866,36,"#f2c14e",13,"right","700");
}
const HEAD={x:760,y:210,r:110};
function closeTilt(){
  /* left: the platform from the side, the tilt drawn TILT_EXAG times */
  const Dmm=B.D*1e3, ox=20, oy=20, X0=-52, X1=Dmm+56, Y0=-40, Y1=116, sc=580/(X1-X0);
  fillR(ox,oy,580,(Y1-Y0)*sc,8,"#eef1f3");
  const P=q=>[ox+(q[0]-X0)*sc, oy+(Y1-q[1])*sc];
  const ang=tiltRad()*TILT_EXAG, ca=Math.cos(ang), sa=Math.sin(ang), PT=5.0, x1=Dmm;
  const onTop=(px,py)=>[px*ca-py*sa, 14.0+px*sa+py*ca];
  const poly=(pts,fill,stroke,lw)=>{ ctx.beginPath(); pts.forEach((q,i)=>{ const v=P(q); i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]); }); ctx.closePath();
    if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } };
  const line=(a,b,col,lw,dash)=>{ const A=P(a), Bq=P(b); ctx.save(); if(dash) ctx.setLineDash(dash); seg(A[0],A[1],Bq[0],Bq[1],col,lw); ctx.restore(); };
  poly([[-40,-PT],[Dmm+40,-PT],[Dmm+40,0],[-40,0]],"#c9cbc6","#555",1);
  poly([onTop(-34,0),onTop(Dmm+34,0),onTop(Dmm+34,PT),onTop(-34,PT)],"#f8f8f5","#555",1.1);
  for(const xs of [0,x1]){ const top=onTop(xs,PT); line(top,[xs,0],"#5d6369",2.6);
    poly([[top[0]-5,top[1]+0.6],[top[0]+5,top[1]+0.6],[top[0]+5,top[1]+3.2],[top[0]-5,top[1]+3.2]],"#9aa0a6","#444",.8); }
  const cxp=Dmm/2, HW=30, HT=62;
  for(const dz of [-HW,HW-3]) poly([onTop(cxp+dz,PT),onTop(cxp+dz,PT+HT),onTop(cxp+dz+3,PT+HT),onTop(cxp+dz+3,PT)],"rgba(214,232,238,.8)","#555",1);
  for(const hy of [PT+12,PT+52]) line(onTop(cxp-HW,hy),onTop(cxp+HW,hy),"#666",1.4);
  line(onTop(cxp,PT+4),onTop(cxp,PT+HT+3),"#777",.9,[6,3,2,3]);
  if(S.rod&&ST.on.trap){ const z=rodZ(), l=S.rod.len, A=P(onTop(cxp+z-l/2,PT+22)), Bq=P(onTop(cxp+z+l/2,PT+22)); seg(A[0],A[1],Bq[0],Bq[1],"#222",6); }
  /* right: the head of the right-hand screw with its reference mark */
  const h=HEAD; circ(h.x,h.y,h.r,"#d8dce0","#444",2);
  for(let k=0;k<24;k++){ const b=2*Math.PI*k/24; seg(h.x+(h.r-9)*Math.cos(b),h.y+(h.r-9)*Math.sin(b),h.x+h.r*Math.cos(b),h.y+h.r*Math.sin(b),"#8b9096",1.2); }
  circ(h.x,h.y,h.r*.32,"#c3c8cd","#777",1);
  const ph=2*Math.PI*(-S.turns); ctx.lineCap="round"; seg(h.x,h.y,h.x+0.78*h.r*Math.sin(ph),h.y-0.78*h.r*Math.cos(ph),"#b03030",4); ctx.lineCap="butt";
  circ(h.x,h.y,5,"#444"); seg(h.x,h.y-h.r-4,h.x,h.y-h.r-20,"#222",2.4); text(d().lab.ref,h.x,h.y-h.r-30,"#ccc",12,"center","600");
}

const trapMM=q=>[ST.pos.trap.x+(q[0]-670)/9, ST.pos.trap.y+(q[1]-200)/9];
let cdrag=null;

  if(view===1&&ST.on.trap&&q[0]>452&&hand&&hand.k==="pick"){ const p=trapMM(q); if(onRod(p)){ S.hold={}; S.hold.z=clamp(p[0]-ST.pos.trap.x,-8,8); say("pushed"); } else say("noRod"); }
  if(view===2&&Math.hypot(q[0]-HEAD.x,q[1]-HEAD.y)<HEAD.r+10){ cdrag={a:Math.atan2(q[1]-HEAD.y,q[0]-HEAD.x)}; }
});

  if(S.hold&&view===1&&ST.on.trap){ S.hold.z=clamp(trapMM(q)[0]-ST.pos.trap.x,-8,8); }
  if(cdrag){ const a=Math.atan2(q[1]-HEAD.y,q[0]-HEAD.x); turnScrew(angDelta(cdrag.a,a)/(2*Math.PI)*(e.shiftKey?0.2:1)); cdrag.a=a; } });
const cEnd=()=>{ cdrag=null; releaseHold(); };
closeCv.addEventListener("pointerup",cEnd); closeCv.addEventListener("pointercancel",cEnd);
closeCv.addEventListener("wheel",e=>{ if(view!==2) return; const q=cpos(e); if(Math.hypot(q[0]-HEAD.x,q[1]-HEAD.y)>HEAD.r+10) return;
  e.preventDefault(); turnScrew((e.deltaY>0?-1:1)*(e.shiftKey?0.005:0.025)); },{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL, LAYOUT AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
function layout(){
  const w=cv.clientWidth||1000, dpr=Math.min(window.devicePixelRatio||1,2);
  SC=w/LW; cv.width=Math.round(w*dpr); cv.height=Math.round(LH*SC*dpr); cv.style.height=(LH*SC)+"px";
  const cw=closeCv.clientWidth||w; CS=cw/CLW; closeCv.width=Math.round(cw*dpr); closeCv.height=Math.round(CLH*CS*dpr); closeCv.style.height=(CLH*CS)+"px";
  const tdpr=window.devicePixelRatio||1, tr=trayCv.parentElement.getBoundingClientRect();
  TRW=Math.max(150,Math.floor(tr.width-16)); TRH=TRAY_LIST.length*TROW+50;
  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  drawTray();
}
function renderLaps(){ $("laps").textContent=S.watch.laps.map((t,i)=>"LAP "+String(i+1).padStart(2," ")+"   "+fmtWatch(t)).join("\n"); }
function renderTabs(){ const t=d(); for(let i=0;i<3;i++){ const b=$("ct"+i); b.textContent=t.tabs[i]; b.className=i===view?"on":""; } $("t-closecap").textContent=t.caps[view]; }
for(let i=0;i<3;i++) $("ct"+i).onclick=()=>{ view=i; renderTabs(); };
function renderStatus(){
  const L=[], t=d();
  if(!Object.values(ST.on).some(v=>v)) L.push([t.st.none,false]);
  if(ST.on.meter&&!S.mOn) L.push([t.st.meterOff,false]);
  if(ringing()) L.push([t.st.ringing,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),msg.key==="snap"]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
$("rodLen").oninput=e=>{ S.rodLen=+e.target.value; $("t-len").textContent=d().len(S.rodLen); };
$("btnSS").onclick=()=>watchPress("ss");
$("btnLap").onclick=()=>watchPress("lr");
$("btnSave").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([$("note").value],{type:"text/plain"})); a.download="IPhO2017_E2_notebook.txt"; a.click(); say("saved"); };
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle; $("t-cap").textContent=t.cap;
  $("t-h-watch").textContent=t.hWatch; $("btnSS").textContent=t.ss; $("btnLap").textContent=t.lapReset;
  $("t-h-rod").textContent=t.hRod; $("t-len").textContent=t.len(S.rodLen); $("t-rodhint").textContent=t.rodHint;
  $("t-h-note").textContent=t.hNote; $("note").placeholder=t.notePh; $("btnSave").textContent=t.save; $("t-hint").textContent=t.hint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2017 E2 — 평행 쌍극자선 자기 트랩 · HaslaLab":"IPhO 2017 E2 — Parallel Dipole Line Magnetic Trap · HaslaLab";
  renderTabs(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0, lastView=-1;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  S.mAcc+=dt; if(S.mAcc>=0.12){ if(ST.on.meter&&S.mOn) meterStep(S.mAcc); S.mAcc=0; }
  rodStep(dt);
  if(S.watch.run) S.watch.t+=dt;
  $("clock").textContent=fmtWatch(S.watch.t);
  if(view!==lastView){ renderTabs(); lastView=view; }
  drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
