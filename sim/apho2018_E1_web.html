<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  if(hand){ if(right){ if(hand.move){ Object.assign(ST.it[hand.item],hand.orig); say("stays"); } else say("back",itemName(hand.item)); hand=null; return; } if(place(hand.item,p)) hand=null; return; }
  if(ST.pend){ if(right){ ST.pend=null; return; } const t=termNear(p); if(!t) return; if(t===ST.pend){ say("same"); return; } ST.wires.push([ST.pend,t]); say("wired",termLabel(ST.pend),termLabel(t)); ST.pend=null; return; }
  if(right){ for(let i=ST.wires.length-1;i>=0;i--) for(const t of ST.wires[i]){ const q=P(...termW(t)); if(Math.hypot(p[0]-q[0],p[1]-q[1]-6)<10){ ST.wires.splice(i,1); say("unplug"); return; } }
    const k=itemAt(p); if(k) returnItem(k); return; }
  const t=termNear(p); if(t){ ST.pend=t; return; }
  const k=itemAt(p); if(!k) return;
  if(["table","sensor"].includes(k)){ setTab("sensor"); return; } if(PCBS.includes(k)||k==="rotplate"){ setTab("pcb"); return; }
  if(/^dmm|batt|dcsrc|rheo/.test(k)) setTab("meters");
  if(!DIM[k]) return; hand={item:k,move:true,orig:{...ST.it[k]}}; ST.it[k].on=false; say("moveIt",itemName(k));
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; }); cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); drawTray(); });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(hand&&hand.move) Object.assign(ST.it[hand.item],hand.orig); hand=null; ST.pend=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ if(hand.move) Object.assign(ST.it[hand.item],hand.orig); hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k)&&!hand.move; if(hand&&hand.move) Object.assign(ST.it[hand.item],hand.orig); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
/* close ups */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const loc=(o,p)=>[(p[0]-o.x)/o.s,(p[1]-o.y)/o.s];
function meterHit(p){
  for(let i=0;i<3;i++){ const o=CL[DMMS[i]]; if(!o) continue; const u=loc(o,p); if(u[0]>=0&&u[0]<=90&&u[1]>=60&&u[1]<=140) return {dmm:i}; }
  if(CL.dcsrc){ const u=loc(CL.dcsrc,p); if(Math.hypot(u[0]-80,u[1]-44)<24) return {src:"knob"}; if(u[0]>=118&&u[0]<=148&&u[1]>=16&&u[1]<=36) return {src:"rev"}; }
  if(CL.batt){ const u=loc(CL.batt,p); if(Math.hypot(u[0]-70,u[1]-66)<12) return {batt:1}; }
  if(CL.rheo){ const u=loc(CL.rheo,p); if(Math.hypot(u[0]-55,u[1]-38)<18) return {rheo:1}; }
  return null; }
let cDrag=null;
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2;
  if(tab==="meters"){ const h=meterHit(p); if(!h) return;
    if(h.dmm!==undefined){ const i=h.dmm, n=MODES.length; ST.mode[i]=MODES[(MODES.indexOf(ST.mode[i])+(right?-1:1)+n)%n]; ST.dt=0; say("mode",i+1,DLAB[ST.mode[i]]); }
    if(h.src==="rev"){ ST.srcRev=!ST.srcRev; say("rev"); } if(h.batt){ ST.battOn=!ST.battOn; say("batt",ST.battOn); } return; }
  if(tab==="sensor"&&SV.cx){ if(SV.coil){ const [x,y,w,h]=SV.coil; if(p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h){ cDrag={coil:true}; return; } }
    if(Math.hypot(p[0]-SV.cx,p[1]-SV.cy)<SV.R) cDrag={rot:Math.atan2(p[1]-SV.cy,p[0]-SV.cx),a:ST.alpha}; return; }
  if(tab==="pcb"&&CL.pcbHit){ const [cx,cy,r]=CL.pcbHit; if(Math.hypot(p[0]-cx,p[1]-cy)<r) cDrag={pcb:[p[0],p[1],ST.pcbX,ST.pcbY]}; }
});
closeCv.addEventListener("pointermove",e=>{ if(!cDrag) return; const p=clpos(e);
  if(cDrag.coil){ ST.coilPos=Math.max(0,Math.min(200,Math.round((p[0]-SV.cx)/SV.k+100))); }
  else if(cDrag.rot!==undefined){ const a=Math.atan2(p[1]-SV.cy,p[0]-SV.cx); ST.alpha=((cDrag.a-(a-cDrag.rot)*180/Math.PI)%360+360)%360; ST.alpha=Math.round(ST.alpha*2)/2; }
  else if(cDrag.pcb){ const k=CL.pcb.k, [x0,y0,X0,Y0]=cDrag.pcb; ST.pcbX=Math.max(0,Math.min(40,+(X0+(p[0]-x0)/k).toFixed(1))); ST.pcbY=Math.max(0,Math.min(40,+(Y0-(p[1]-y0)/k).toFixed(1))); } });
window.addEventListener("pointerup",()=>{ cDrag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), dir=e.deltaY<0?1:-1, fine=e.shiftKey; e.preventDefault();
  if(tab==="meters"){ const h=meterHit(p); if(!h) return;
    if(h.dmm!==undefined){ const i=h.dmm; ST.mode[i]=MODES[Math.max(0,Math.min(MODES.length-1,MODES.indexOf(ST.mode[i])+dir))]; ST.dt=0; }
    if(h.src==="knob") ST.srcKnob=Math.max(0,Math.min(1,+(ST.srcKnob+dir*(fine?0.002:0.02)).toFixed(4)));
    if(h.rheo) ST.rheoKnob=Math.max(0,Math.min(1,+(ST.rheoKnob+dir*(fine?0.002:0.02)).toFixed(4))); return; }
  if(tab==="sensor"&&SV.cx){
    if(SV.mag&&Math.hypot(p[0]-SV.mag[0],p[1]-SV.mag[1])<18){ ST.magDist=Math.max(2,Math.min(40,+(ST.magDist-dir*(fine?0.1:0.5)).toFixed(2))); return; }
    if(has("sheets")&&Math.hypot(p[0]-SV.cx,p[1]-SV.cy)<SV.k*(ST.L1/2+28)&&Math.hypot(p[0]-SV.cx,p[1]-SV.cy)>SV.k*(ST.L1/2-2)&&!e.altKey&&Math.abs(Math.sin(Math.atan2(p[1]-SV.cy,p[0]-SV.cx)+ST.alpha*Math.PI/180))<0.35){ ST.L1=Math.max(4,Math.min(30,+(ST.L1+dir*(fine?0.1:0.5)).toFixed(2))); return; }
    if(Math.hypot(p[0]-SV.cx,p[1]-SV.cy)<SV.R) ST.alpha=(((ST.alpha+dir*(fine?0.5:1))%360)+360)%360; return; }
  if(tab==="pcb"&&CL.pcbHit){ ST.pcbRot=(((ST.pcbRot+dir*(fine?1:5))%360)+360)%360; }
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("wClear").onclick=()=>{ ST.wires=[]; ST.pend=null; say("cleared"); };
$("tPlat").onclick=()=>{ if(!has("table")) return; if(!has("platform")){ say("needs",itemName("platform")); return; } ST.tableAt="plat"; say("table","plat"); };
$("tPost").onclick=()=>{ if(!has("table")) return; if(!has("post")){ say("noPost"); return; } ST.tableAt="post"; say("table","post"); };
$("noteBtn").onclick=()=>{ const parts=[]; for(let i=0;i<3;i++) if(has(DMMS[i])&&ST.mode[i]!=="OFF") parts.push("#"+(i+1)+" "+DLAB[ST.mode[i]]+": "+(ST.disp[i]||""));
  if(ST.tableAt) parts.push("α "+ST.alpha.toFixed(1)+"°"); if(has("coil")) parts.push((lang==="ko"?"코일 ":"coil ")+ST.coilPos+" mm"); if(has("sheets")) parts.push("L1 "+ST.L1.toFixed(1)+" mm"); if(has("magnet")) parts.push((lang==="ko"?"자석 ":"magnet ")+ST.magDist.toFixed(1)+" mm");
  if(pcbOn()) parts.push("pcb x "+ST.pcbX.toFixed(1)+" y "+ST.pcbY.toFixed(1)+" "+ST.pcbRot+"°");
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; } box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){ const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]); if(hand) L.push([t.st.hand(itemName(hand.item)),false]); if(ST.pend) L.push([t.st.pend(termLabel(ST.pend)),false]);
  if(ST.battOn&&has("batt")) L.push([t.st.batt,false]);
  if(srcLive()&&SOL){ const {nt,V}=SOL; if(Math.abs((V[nt["C+"]]||0)-(V[nt["C-"]]||0))>=TR.Vcomp*0.999) L.push([t.st.comp,true]); }
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML=""; for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
  $("tPlat").className=ST.tableAt==="plat"?"on":""; $("tPost").className=ST.tableAt==="post"?"on":""; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle; $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-wire").textContent=t.hWire; $("wClear").textContent=t.clear; $("t-wirehint").textContent=t.wireHint; $("t-h-table").textContent=t.hTable; $("tPlat").textContent=t.tPlat; $("tPost").textContent=t.tPost; $("t-tablehint").textContent=t.tableHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2018 — 거대 자기저항 (GMR) · HaslaLab":"APhO 2018 — Giant Magnetoresistance (GMR) · HaslaLab"; renderTabs(); renderNotes(); renderStatus(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); }; $("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0, solveT=0;
function tick(){ const now=performance.now()/1000, dt=Math.min(0.25,Math.max(0,now-tPrev)); tPrev=now;
  solveT-=dt; if(solveT<=0){ update(); solveT=0.12; }
  ST.dt-=dt; if(ST.dt<=0){ for(let i=0;i<3;i++) ST.disp[i]=formatReading(readMeter(i)); ST.dt=0.5; }
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose(); if(frameN%6===0){ renderStatus(); drawTray(); } requestAnimationFrame(tick); }
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
