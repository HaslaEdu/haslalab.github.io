<meta name="description" content="NBPhO 2023 실험 문제 9 표면장력을 브라우저에서 실행합니다. 유리판 위 작은 물방울을 평볼록 렌즈로 써서 천장 조명의 상이 맺히는 높이로 초점거리를 재고, 곡률반경과 접촉각을 구한 뒤, 판을 넓게 덮은 물의 두께로 물의 표면장력을 구합니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);

    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";

/* world → [screen x, screen y, depth]; larger depth is nearer the eye */

/* screen point → world point on the horizontal plane y = h */

let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(80,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return;
    const same=inHand(k); hand=null; if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
/* the top view: wheel zooms about the cursor, dragging moves the paper */
let cdrag=null;
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
closeCv.addEventListener("wheel",e=>{ if(tab!=="top") return; e.preventDefault(); const p=clpos(e), v=ST.view, s=Math.min(CLW,CLH)/70*v.z;
  const mu=v.cx+(p[0]-CLW/2)/s, mw=v.cy+(p[1]-CLH/2)/s; v.z=Math.max(1,Math.min(14,v.z*(e.deltaY<0?1.2:1/1.2))); const s2=Math.min(CLW,CLH)/70*v.z;
  v.cx=mu-(p[0]-CLW/2)/s2; v.cy=mw-(p[1]-CLH/2)/s2; },{passive:false});
closeCv.addEventListener("pointerdown",e=>{ if(tab!=="top"||e.button!==0) return; closeCv.setPointerCapture(e.pointerId); cdrag={p:clpos(e),c:[ST.view.cx,ST.view.cy]}; });
closeCv.addEventListener("pointermove",e=>{ if(!cdrag) return; const p=clpos(e), s=Math.min(CLW,CLH)/70*ST.view.z; ST.view.cx=cdrag.c[0]-(p[0]-cdrag.p[0])/s; ST.view.cy=cdrag.c[1]-(p[1]-cdrag.p[1])/s; });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("dblclick",()=>{ if(tab==="top") ST.view={z:1,cx:0,cy:0}; });
/* ══════════════════════════════════════════════════════════════
   6.  WHAT THE HANDS DO
   ══════════════════════════════════════════════════════════════ */
const need=(...ks)=>{ for(const k of ks) if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function nut(dp){ if(!need("holder")) return; const h=ST.hold, p=Math.round((h.p+dp)*100)/100; if(p<0||p>TRUE.tn){ say("nutEnd"); return; } h.p=p; setTab("side"); }
function spare(dk){ if(!need("holder")) return; if(ST.plateAt==="holder"){ say("plateOnHolder"); return; } const k=ST.hold.k+dk; if(k<0||k>3){ say(k<0?"noSpare":"noMoreNuts"); return; } ST.hold.k=k; setTab("side"); }
function capT(){ if(!need("holder")) return; if(ST.plateAt==="holder"){ say("plateOnHolder"); return; } ST.hold.cap=!ST.hold.cap; say(ST.hold.cap?"capIn":"capOut"); setTab("side"); }
function plateTo(w){ if(!need("plate")) return; if(w==="holder"&&!need("holder")) return; if(w==="paper"&&!need("paper")) return;
  if(ST.plateAt==="holder"&&w!=="holder"&&ST.water>=0.05){ say("spill"); }
  ST.plateAt=w; say("plate_"+w); setTab(w==="paper"?"top":"side"); }
function suck(dv){ if(!need("syringe","cup")) return; const v=Math.round((ST.syr+dv)*100)/100; if(v>3){ say("syrFull"); return; } ST.syr=v; }
function expel(dv){ if(!need("syringe","plate")) return; const v=Math.round(Math.max(0,ST.syr-dv)*100)/100, out=ST.syr-v; if(out<=0){ say("syrEmpty"); return; }
  ST.syr=v; ST.water=Math.round((ST.water+out)*10000)/10000; say("expelled"); }
function oneDrop(){ if(!need("syringe","plate")) return; if(ST.syr<0.02){ say("syrEmpty"); return; } const v=U(7,13)/1000; ST.syr=Math.max(0,Math.round((ST.syr-v)*1000)/1000); ST.water+=v; say(isDrop()?"dropped":"expelled"); }
function wipe(){ if(!need("plate")) return; ST.water=0; say("wiped"); }
function calOn(k){ if(!need("caliper")) return; if(k==="plate"&&!need("plate")) return; if((k==="pipe"||k==="nut"||k==="seat"||k==="above")&&!need("holder")) return;
  if(k==="drop"&&!isDrop()){ say("noDrop"); return; } measureCal(k); setTab("side"); }
/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
for(const [id,dv] of [["pm1",-1],["pm01",-0.1],["pp01",0.1],["pp1",1]]) $(id).onclick=()=>nut(dv);
$("km").onclick=()=>spare(-1); $("kp").onclick=()=>spare(1); $("capBtn").onclick=capT;
for(const w of ["holder","paper","table"]) $("pl_"+w).onclick=()=>plateTo(w);
for(const [id,dv] of [["dr05",0.5],["dr01",0.1]]) $(id).onclick=()=>suck(dv);
for(const [id,dv] of [["ex01",0.1],["ex05",0.5]]) $(id).onclick=()=>expel(dv);
$("dropBtn").onclick=oneDrop; $("wipeBtn").onclick=wipe;
for(const k of ["plate","pipe","nut","seat","above","drop"]) $("cl_"+k).onclick=()=>calOn(k);
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), c=$("cfg").value.trim(); if(!c){ say("typeFirst"); rows--; return; }
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+rows+")  "+c; n.scrollTop=n.scrollHeight; $("cfg").value=""; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function saveText(name,txt){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved"); }
$("noteSave").onclick=()=>{ saveText("NBPhO2023_P9_notebook.txt",$("note").value); };
function renderPanel(){ const t=d(), h=ST.hold;
  $("kVal").textContent=t.spareN(h.k); $("capBtn").textContent=h.cap?t.capOutB:t.capInB; $("capBtn").className=h.cap?"on":"";
  for(const w of ["holder","paper","table"]) $("pl_"+w).className=has("plate")&&ST.plateAt===w?"on":"";
  for(const k of ["plate","pipe","nut","seat","above","drop"]) $("cl_"+k).className=ST.cal===k?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  const P=pool(); if(P&&P.full) L.push([t.st.full,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-hold","hHold"],["lbNut","nutL"],["lbK","spareL"],["hHint","hHint"],
    ["t-h-plate","hPlate"],["pl_holder","onHolder"],["pl_paper","onPaper"],["pl_table","onTable"],["t-h-syr","hSyr"],["lbDraw","drawL"],["lbEx","exL"],["dropBtn","dropB"],["wipeBtn","wipeB"],["sHint","sHint"],
    ["t-h-cal","hCal"],["cHint","cHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"]]) $(id).textContent=t[k];
  for(const k of ["plate","pipe","nut","seat","above","drop"]) $("cl_"+k).textContent=t.cal[k];
  $("cfg").placeholder=t.cfgPh;
  $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose(); ++frameN;
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
  <script src="simfull.js"></script>
