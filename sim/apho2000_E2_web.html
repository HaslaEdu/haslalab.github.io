<style>
  :root{

/* screen point → world point on the horizontal plane y = h */

function pick3(x,y){

  for(const [id,q] of HITS){ if(!pointIn(q,x,y)) continue;

    for(let i=1;i+1<q.length;i++){ const a=q[0], b=q[i], c=q[i+1], den=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]); if(Math.abs(den)<1e-9) continue;

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ let id=pick3(p[0],p[1]); if(id==="heater"&&cylOn()&&inB(p,bbox("cyl"),0.5)) id="cyl"; if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),1))||null; }
const wired=k=>ST.leads.some(([a,b])=>[a,b].some(t=>termOwner(t)===k));
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.parent){ ST.on.add(k); ST.at[k]=hand.parent; say("placed",itemName(k)); } else if(hand.move&&hand.orig) drop(k,hand.orig.x,hand.orig.y); else say("back",itemName(k)); hand=null; }
function takeUp(k){ if(wired(k)){ say("unplugFirst"); return false; } if(k==="leads"&&ST.leads.length){ say("unplugAll"); return false; }
  if(k==="cyl"&&ST.Tc>323){ say("tooHot"); return false; } if(k==="heater"&&cylOn()){ say("cylFirst"); return false; } if(k==="heater"&&ST.Th>323){ say("tooHot"); return false; }
  const b=baseOf(k), par=ST.at[k]; if(par) delete ST.at[k]; hand={item:k,move:true,orig:{x:b.x,y:b.y},parent:par}; ST.on.delete(k); delete ST.pos[k]; say("picked",itemName(k)); return true; }
function drop(k,x,y){ ST.pos[k]={x,y}; ST.on.add(k); delete ST.at[k]; say("placed",itemName(k)); }
/* the cylinder goes over the heater, or is held in the candle flame to take a coat of soot */
function put(k,t){ if(k==="cyl"&&t==="heater"){ ST.at.cyl="heater"; ST.on.add("cyl"); say("onHeater"); return true; }
  if(k==="cyl"&&t==="candle"){ if(!ST.lit){ say("lightFirst"); return false; } ST.soot=Math.min(1,ST.soot+(1-ST.soot)*0.35); ST.Tc+=6; say("sooted",Math.round(ST.soot*100)); return false; }
  return false; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const t=targetAt(k,p); if(t){ if(put(k,t)) hand=null; return; }
    const [x,y]=unP(p[0],p[1],2.5); if(!fits(k,x,y)){ say("noFit"); return; }
    drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(wired(k)||(k==="leads"&&ST.leads.length)){ say("unplugFirst"); return; } if((k==="cyl"||k==="heater")&&(ST.Tc>323||ST.Th>323)){ say("tooHot"); return; } if(k==="heater"&&cylOn()){ say("cylFirst"); return; }
    if(k==="ps") ST.out=false; if(k==="candle") ST.lit=false; delete ST.at[k]; ST.on.delete(k); delete ST.pos[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the wiring close-up: click a terminal, then another, to join them with a lead; click a lead's handle to unplug it */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button===2){ ST.pick=null; return; } if(e.button!==0) return;
  if(!h){ ST.pick=null; return; }
  if(h.k==="out"){ toggleOut(); return; }
  if(h.k==="knob"){ const dv=(p[0]<h.x+h.w/2?-1:1)*(e.shiftKey?1:0.1); setV(dv); return; }
  if(h.k==="junc"){ toggleJunc(); return; }
  if(h.k.startsWith("cal:")){ ST.cal.what=h.k.slice(4); ST.cal.e=U(-0.03,0.03); return; }
  if(h.k.startsWith("l:")){ const i=+h.k.slice(2); ST.leads.splice(i,1); say("unplugged"); return; }
  if(h.k.startsWith("t:")){ const t=h.k.slice(2);
    if(!has("leads")){ say("needFor",itemName("leads")); ST.pick=null; return; }
    if(!ST.pick){ ST.pick=t; return; } if(ST.pick===t){ ST.pick=null; return; }
    if(ST.leads.length>=12){ say("noLeads"); ST.pick=null; return; } if(ST.leads.some(([a,b])=>(a===ST.pick&&b===t)||(a===t&&b===ST.pick))){ ST.pick=null; return; }
    ST.leads.push([ST.pick,t]); say("joined",ST.pick,t); ST.pick=null; } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
ST.cal.e=U(-0.03,0.03);
function toggleOut(){ if(!has("ps")){ say("needFor",itemName("ps")); return; } ST.out=!ST.out; say(ST.out?"outOn":"outOff"); }
function setV(dv){ if(!has("ps")){ say("needFor",itemName("ps")); return; } ST.vset=Math.max(0,Math.min(15,Math.round((ST.vset+dv)*10)/10)); }
function toggleJunc(){ if(!has("ice")||!has("cyl")){ say("needFor",itemName(!has("ice")?"ice":"cyl")); return; } ST.junc=!ST.junc; say(ST.junc?"juncIn":"juncOut"); }
$("outBtn").onclick=toggleOut; for(const [id,dv] of [["vm1",-1],["vm01",-0.1],["vp01",0.1],["vp1",1]]) $(id).onclick=()=>setV(dv);
$("juncBtn").onclick=toggleJunc;
$("litBtn").onclick=()=>{ if(!has("candle")){ say("needFor",itemName("candle")); return; } ST.lit=!ST.lit; say(ST.lit?"lit":"blown"); };
for(const s of [1,10,30,60]) $("sp"+s).onclick=()=>{ ST.speed=s; };
/* each meter settles twice a second, with a count of jitter */
function updDisp(dt){ ST.disp.t-=dt; if(ST.disp.t>0) return; ST.disp.t=0.5; const r=readings();
  ST.disp.v=r.v===null?null:r.v+(Math.random()-0.5)*0.016; ST.disp.a=r.a===null?null:r.a+(Math.random()-0.5)*0.016; ST.disp.m=r.m===null?null:r.m+(Math.random()-0.5)*0.016; }
function meterShow(k){ if(!has(k)) return null; const v=ST.disp[k==="vm"?"v":k==="am"?"a":"m"]; if(v===null||v===undefined) return null;
  const lim=k==="mv"?199.99:19.99; if(Math.abs(v)>lim) return "1   "; const s=Math.abs(v).toFixed(2); return (v<-0.005?"-":"")+s; }
const fmtT=v=>{ const h=Math.floor(v/3600), m=Math.floor(v%3600/60), s=Math.floor(v%60); return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), f=k=>{ const s=meterShow(k); return s===null?"—":s.replace("1   ","OL"); };
  const line=rows+")  t "+fmtT(simT)+"   V "+f("vm")+"   A "+f("am")+"   mV "+f("mv")+($("cfg").value.trim()?"   "+$("cfg").value.trim():"");
  n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(); for(const k of ["vm","am","mv"]){ const s=meterShow(k); $("d_"+k).textContent=s===null?"—":s.replace("1   ","1 .  ").trim()+" "+{vm:"V",am:"A",mv:"mV"}[k]; }
  $("dSet").textContent=ST.vset.toFixed(1)+" V"; $("outBtn").textContent=ST.out?t.outOff:t.outOn; $("outBtn").className=ST.out?"on":"";
  $("juncBtn").textContent=ST.junc?t.juncOut:t.juncIn; $("litBtn").textContent=ST.lit?t.blow:t.light; $("clk").textContent=fmtT(simT);
  for(const s of [1,10,30,60]) $("sp"+s).className=ST.speed===s?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pick) L.push([t.st.pick(ST.pick),false]);
  if(ST.over>0.3) L.push([t.st.over,true]);
  if(has("cyl")&&has("ice")&&!ST.junc) L.push([t.st.junc,true]);
  if(ST.Th>320&&!cylOn()&&has("heater")) L.push([t.st.bare,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-m","hM"],["t-h-ps","hPs"],["psHint","psHint"],["t-h-tc","hTc"],["t-h-time","hTime"],["timeHint","timeHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000)*ST.speed; lastT=now; simT+=dt;
  const n=Math.max(1,Math.ceil(dt/0.05)); for(let i=0;i<n;i++) stepPhys(dt/n); updDisp(dt/ST.speed);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
