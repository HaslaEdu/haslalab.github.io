<title>답안 스캔 · Answer scan · HaslaLab</title>
<!-- The phone side of exam mode.  Opened from the QR code on the exam screen: the address after # carries the
     one scan code (c=: the time in base 36 and 128 random bits in base 62, unique to this sitting and destroyed by the
     server when scanning ends), so nothing secret reaches a server log and no sign-in is needed.
     Each photo is straightened to an A4 page in the browser (labscan/scanner.js, the 하슬라논술 scan engine:
     page corners → perspective → shadow removal), shown for a check, then sent to the community Worker, which
     reads it with OCR.  The text is checked on the computer. -->
<style>
  :root{--bg:#1c2027;--panel:#22262d;--ink:#e8eef2;--muted:#9aa3ab;--line:#33373e;--accent:#f2c14e;--deep:#12161b}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px max(28px,env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  header b{color:var(--accent);font-size:16px}

  .clock{font:700 20px/1 ui-monospace,Consolas,monospace;background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .clock.warn{color:#ffb4a9;border-color:#b3372f}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{flex:1;min-width:0}
  button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#2b2f36;color:var(--ink);padding:11px 12px}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:700}
  button.pri{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:700}
  button:disabled{opacity:.45}
  .shoot{display:flex;gap:8px;margin-top:12px}
  .shoot label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 10px;border-radius:11px;font-weight:700;cursor:pointer}
  .shoot .cam{background:var(--accent);color:#1c2027;font-size:17px}
  .shoot .gal{flex:.6;background:#2b2f36;border:1px solid var(--line);font-size:13.5px}
  .shoot input{display:none}
  .note{background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;margin-top:12px}
  .note.w{border-color:#6b3b37;color:#ffcfc9}
  .prev{margin-top:12px}
  .prev img{width:100%;border-radius:8px;background:#fff;display:block}
  .image-check{position:fixed;inset:0;z-index:45;background:#111;overflow:auto;touch-action:pan-x pan-y}
  .image-check button{position:sticky;top:10px;left:10px;z-index:1;display:block;margin:10px}
  .image-check img{display:block;max-width:none;margin:10px;min-width:100%}
  .bar{height:6px;background:#0b0e12;border-radius:4px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row button{flex:1}
  .sent{list-style:none;margin:0;padding:0}
  .sent li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .sent li:last-child{border-bottom:0}
  .sent b{font:700 12px/1 ui-monospace,monospace;background:#0b0e12;color:var(--accent);border-radius:5px;padding:4px 6px}
  .sent .s{margin-left:auto;color:var(--muted);font-size:12.5px}
  .sent .s.partial{color:#f2c14e}.sent .s.poor{color:#ffb4a9;font-weight:700}.sent .s.good{color:#8fd19e}
  .sent .x{padding:5px 9px;font-size:12px}
  /* corner editor */
  .ce{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
  .ce .top{padding:10px 14px;color:#ddd;font-size:13.5px}
  .ce canvas{flex:1;width:100%;min-height:0;touch-action:none}
  .ce .row{padding:10px 14px max(14px,env(safe-area-inset-bottom));margin:0}
  /* live camera: the page found in the picture is outlined as you aim; held still, it is taken by itself */
  .lv{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
  .lv .vw{position:relative;flex:1;min-height:0}
  .lv video,.lv canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .lv .msg{padding:10px 14px;color:#eee;font-size:14px;text-align:center;min-height:44px}
  .lv .msg.ok{color:#8fd19e;font-weight:700}
  .lv .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px max(18px,env(safe-area-inset-bottom))}
  .lv .sh{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);padding:0}

  .shoot .live{background:var(--accent);color:#1c2027;font-size:17px;border:0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b0e12;border:1px solid var(--accent);padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;max-width:92vw}

  html.monthly-scan{background:#111017;color-scheme:dark}
  body.monthly-scan{--bg:#111017;--panel:#1c1825;--ink:#ede7f6;--muted:#b0a3c1;--line:#3b334a;--accent:#c5a3f5;--deep:#17131e;font-size:14px;line-height:1.65}
  body.monthly-scan .wrap{max-width:600px;padding:20px 18px max(32px,env(safe-area-inset-bottom))}
  body.monthly-scan header{flex-wrap:wrap;align-items:flex-start;gap:13px;margin-bottom:18px}
  body.monthly-scan header::before{content:"HaslaLab";width:100%;color:var(--accent);font:700 25px/1.2 Georgia,serif;letter-spacing:-.04em;margin-bottom:6px}
  body.monthly-scan header>b{flex:1;min-width:0;color:var(--ink);font-size:18px;line-height:1.5;overflow-wrap:anywhere}
  body.monthly-scan header .sp{display:none}
  body.monthly-scan .clock{flex:none;max-width:100%;padding:8px 10px;background:#17131e;font-size:16px;color:var(--accent)}
  body.monthly-scan .card{padding:17px;border-radius:12px;margin-top:15px}
  body.monthly-scan .card h2{font-size:13px;color:var(--muted);margin-bottom:10px}
  body.monthly-scan button{min-height:44px;background:#292232}
  body.monthly-scan button:is(.pri,.on),body.monthly-scan .shoot :is(.live,.cam){background:var(--accent);color:#20142d;border-color:var(--accent)}

  body.monthly-scan .chips{gap:7px;flex-wrap:wrap}
  body.monthly-scan .chips button{min-width:50px;font-size:13px;padding:9px 12px}
  body.monthly-scan .shoot{flex-wrap:wrap}
  body.monthly-scan .shoot .live{flex:1 0 100%;font-size:16px;padding:15px}
  body.monthly-scan .shoot .gal{background:#292232;font-size:13px}
  body.monthly-scan .note{background:#17131e;font-size:13px}
  body.monthly-scan .note.w{border-color:#77515e;color:#f2c4d1}
  body.monthly-scan .sent .s.partial{color:var(--accent)}
  body.monthly-scan .sent .s.poor{color:#f2a8b4}
  body.monthly-scan .sent .s.good{color:#b5dec6}
  body.monthly-scan .ce,body.monthly-scan .lv{background:#08070b}
  body.monthly-scan .lv .sh{border-color:var(--accent);background:#c5a3f540}
  body.monthly-scan .lv .msg.ok{color:#b5dec6}
  body.monthly-scan .toast{background:#201a2a;box-shadow:0 10px 35px #0007;font-size:13px;bottom:max(24px,env(safe-area-inset-bottom))}

      sg.drawImage(v, 0, 0, w, h);
      const pixels = sg.getImageData(0, 0, w, h).data, gray = toGray(pixels, w, h);
      const candidate = detectDocumentQuadGray(gray, w, h);
      const d = candidate?.corners && (candidate.method === "marker" && candidate.score >= 0.5 || candidate.method === "page" && candidate.score > 0.45) ? candidate : null;
      const how = d?.method;
      /* the overlay, where the video is drawn (object-fit: contain) */
      const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
      g.clearRect(0, 0, cv.width, cv.height);
      if (d) {
        const s = Math.min(cv.width / w, cv.height / h), ox = (cv.width - w * s) / 2, oy = (cv.height - h * s) / 2;
        const q = [0, 1, 3, 2].map(i => ({ x: ox + d.corners[i].x * s, y: oy + d.corners[i].y * s }));
        g.fillStyle = how === "marker" ? "rgba(87,171,90,.22)" : MONTHLY ? "rgba(197,163,245,.18)" : "rgba(242,193,78,.18)"; g.strokeStyle = how === "marker" ? "#57ab5a" : SCAN_ACCENT; g.lineWidth = 3 * dpr;
        g.beginPath(); q.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); g.fill(); g.stroke();
      }
      /* Paper edges need a longer, tighter hold than printed markers. Geometry alone never enables capture. */
      const focused = inspectDocumentPixels(pixels, w, h).focus >= 22;
      if (d?.autoCaptureEligible === true && focused) {
        if (last !== how) hist = []; last = how;
        const count = how === "page" ? 8 : 6, tolerance = how === "page" ? 0.008 : 0.012;
        hist.push(d.corners.map(p => ({...p}))); if (hist.length > count) hist.shift();
        const span = Math.max(w, h), still = hist.length === count && hist.every(c => c.every((p, i) => Math.hypot(p.x - d.corners[i].x, p.y - d.corners[i].y) < span * tolerance));
        say(t().lvHold, true);
        if (still && AUTO) return capture();
      } else { hist = []; last = null; say(!focused && d ? t().blurry : d ? t().lvPage : t().lvAim); }
    }
    timer = setTimeout(frame, 140);
  }
  ov.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.x === "close") close();
    else if (b.dataset.x === "shoot") capture();
    else if (b.dataset.x === "auto") { AUTO = !AUTO; b.classList.toggle("on", AUTO); hist = []; try { localStorage.setItem("hlScanAuto", AUTO ? "1" : "0"); } catch (e) {} } };
  frame();
}

/* the deadline, on the server's clock */
setInterval(() => {
  if (!INFO) return;
  const c = $("clock");
  if (INFO.review_only) { c.textContent = lang === "ko" ? "시간 제한 없음" : "No time limit"; c.classList.remove("warn"); return; }
  if (INFO.status === "running") { c.textContent = "--:--"; return; }
  const left = INFO.scan_until - srvNow(); c.textContent = ms(left); c.classList.toggle("warn", left <= 300);
  if (left <= -2 && INFO.open) { INFO.open = false; paint(); }
}, 500);
if (!KEY) $("app").innerHTML = `<div class="note w">${t().badLink}</div>`; else refresh().finally(()=>phonePoll.start());
</script>
</body>
