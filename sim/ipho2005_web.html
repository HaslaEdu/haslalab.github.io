<meta name="description" content="IPhO 2005 실험을 브라우저에서 실행합니다. 전위차계로 전구 전압을 바꾸며 필라멘트 저항으로 온도를 정하고, 액체 필터를 지난 빛을 광저항으로 재어 ln R과 R_B^−0.83의 기울기에서 플랑크 상수 h를 구합니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}

    background:var(--bg); color:var(--ink);

  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

const U=(a,b)=>a+Math.random()*(b-a);

  RB0:U(10.8,12.2),                              /* the filament's resistance at the room's temperature, Ω */
  kr:U(5.2e-14,6.0e-14), kc:U(4e-6,8e-6),     /* its radiation (W/K⁴) and its loss through the leads (W/K) */
  gam:U(0.66,0.74),                              /* the LDR's exponent: R = b E^−γ */
  R115:U(4.6,5.6)*1e3,                           /* the LDR's resistance with the lamp at its brightest (sets b) */
  rEnd:U(0.6,1.0), rBat:U(0.3,0.8), eBat:U(12.3,12.8),   /* the potentiometer's end contact, the battery */
  Rpot:1000*U(0.98,1.02), grey:0.512 };

TRUE.a=TRUE.T0/Math.pow(TRUE.RB0,0.83);
const Tof=R=>TRUE.a*Math.pow(R,0.83), Rof=T=>Math.pow(T/TRUE.a,1/0.83);

function filtered(T){ if(T<700) return 0; let s=0; for(let l=440;l<=760;l+=4){ const L=l*1e-9; s+=FILT(l)*0.45/(Math.pow(L,5)*(Math.exp(C2/(L*T))-1)); } return s*4e-9; }
function unfiltered(T){ if(T<700) return 0; let s=0; for(let l=400;l<=1100;l+=10){ const L=l*1e-9; s+=0.45/(Math.pow(L,5)*(Math.exp(C2/(L*T))-1)); } return s*10e-9*0.12; }
/* b so that the LDR reads R115 at about 2100 K behind the filter */
TRUE.b=TRUE.R115*Math.pow(filtered(2100),TRUE.gam);

cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;

window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); ST.watch.run=!ST.watch.run; } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
/* the close-ups: turn the tube's support by dragging; slide the LDR; turn the potentiometer's knob by dragging */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return;
  if(cdrag.k==="sup"){ const a=Math.atan2(-(cmouse[1]-PM.cy),cmouse[0]-PM.cx)/Math.PI*180; ST.sup=Math.round((((a-cdrag.a0+cdrag.v)%360)+360)%360*10)/10; }
  if(cdrag.k==="knob"){ const a=Math.atan2(cmouse[1]-PM.pcy,cmouse[0]-PM.pcx); let da=a-cdrag.a; if(da>Math.PI) da-=2*Math.PI; if(da<-Math.PI) da+=2*Math.PI; cdrag.a=a; setTurns(ST.turns+da/(2*Math.PI)*(e.shiftKey?0.1:1)); } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  if(h.k==="sup"){ if(ST.tubeIn){ say("tubeBlocks"); return; } cdrag={k:"sup",a0:Math.atan2(-(p[1]-PM.cy),p[0]-PM.cx)/Math.PI*180,v:ST.sup}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="knob"){ cdrag={k:"knob",a:Math.atan2(p[1]-PM.pcy,p[0]-PM.pcx)}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="ldr"||h.k==="ldrBtn"){ ST.ldrTouch=!ST.ldrTouch; say(ST.ldrTouch?"ldrIn":"ldrOut"); return; }
  if(h.k==="tubeBtn"){ if(!has("tube")&&!ST.tubeIn){ say("needFor",itemName("tube")); return; } if(ST.tubeIn){ ST.at.tube=undefined; delete ST.at.tube; const r=ST.pos.rack; ST.pos.tube=r?{x:r.x,y:r.y}:{x:60,y:36}; } else { ST.at.tube="platform"; } syncAt(); say(ST.tubeIn?"mounted":"placed",itemName("tube")); return; }
  if(h.k==="greyBtn"){ if(!has("grey")){ say("needFor",itemName("grey")); return; } if(ST.greyIn){ delete ST.at.grey; ST.pos.grey={x:70,y:36}; } else ST.at.grey="platform"; syncAt(); say(ST.greyIn?"mounted":"placed",itemName("grey")); } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
function setTurns(v){ if(!has("pot")){ say("needFor",itemName("pot")); return; } ST.turns=Math.max(0,Math.min(10,Math.round(v*10000)/10000)); ST.dispT=0; }
for(const [id,dv] of [["pm1",-1],["pm01",-0.1],["pm001",-0.01],["pm0001",-0.001],["pp0001",0.001],["pp001",0.01],["pp01",0.1],["pp1",1]]) $(id).onclick=()=>setTurns(ST.turns+dv);
$("batBtn").onclick=()=>{ if(!has("battery")||!has("pot")||!has("leads")){ say("needFor",itemName(!has("battery")?"battery":!has("pot")?"pot":"leads")); return; } ST.batOn=!ST.batOn; say(ST.batOn?"batIn":"batOut"); };
$("covBtn").onclick=()=>{ if(!has("platform")){ say("needFor",itemName("platform")); return; } if(!has("cover")&&ST.at.cover!=="platform"){ say("needFor",itemName("cover")); return; }
  if(ST.coverOn){ delete ST.at.cover; const p=ST.pos.platform; ST.pos.cover={x:Math.min(TBL.x1-9,p.x+20),y:p.y-2}; } else { ST.at.cover="platform"; ST.on.add("cover"); } syncAt(); say(ST.coverOn?"covered":"uncovered"); };
for(const k of ["dmmO","dmmV","dmmA"]){ const sel=$("m_"+k); for(const m of MKEYS){ const o=document.createElement("option"); o.value=m; o.textContent=m==="off"?"OFF":m==="temp"?"°C":m.replace("Ω","Ω ").replace(/^V/,"V ").replace(/^A/,"A "); sel.appendChild(o); }
  sel.onchange=()=>{ if(!has(k)){ say("needFor",itemName(k)); sel.value="off"; return; } ST.mode[k]=sel.value; ST.dispT=0; }; }
for(const s of [1,10,30]) $("sp"+s).onclick=()=>{ ST.speed=s; };
$("wBtn").onclick=()=>{ ST.watch.run=!ST.watch.run; }; $("wRst").onclick=()=>{ ST.watch.t=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  for(const k of ["dmmO","dmmV","dmmA"]){ const s=meterShow(k); $("d_"+k).textContent=s===null?"—":s===""?"OFF":(s==="1"?"1 .  ":s)+" "+meterUnit(k); if($("m_"+k).value!==ST.mode[k]) $("m_"+k).value=ST.mode[k]; }
  $("batBtn").textContent=ST.batOn?t.batOut:t.batIn; $("batBtn").className=ST.batOn?"on":""; $("covBtn").textContent=ST.coverOn?t.covOff:t.covOn;
  $("turns").textContent=has("pot")?ST.turns.toFixed(3)+" "+t.turnsU:"—";
  for(const s of [1,10,30]) $("sp"+s).className=ST.speed===s?"on":""; $("watch").textContent=ST.watch.t.toFixed(1)+" s"; $("wBtn").textContent=ST.watch.run?t.wStop:t.wGo; $("clock").textContent=t.clock(ST.simT); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(has("platform")&&!ST.coverOn&&ST.mode.dmmO!=="off") L.push([t.st.light,true]);
  if(ST.T>2500) L.push([t.st.hot,true]);
  for(const k of ["dmmO","dmmV","dmmA"]) if(meterShow(k)==="1"&&MODES[ST.mode[k]]&&MODES[ST.mode[k]].f!=="T") L.push([t.st.over(itemName(k)),true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-v","hV"],["t-h-p","hP"],["pHint","pHint"],["t-h-c","hC"],["t-h-t","hT"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["wRst","wRst"],["l_dmmO","lO"],["l_dmmV","lV"],["l_dmmA","lA"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function advance(dt){ let T=dt*ST.speed; while(T>0){ const h=Math.min(0.5,T); stepPhys(h); T-=h; } updDisp(dt); }
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; advance(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
<script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
