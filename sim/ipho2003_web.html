<meta name="description" content="IPhO 2003 실험을 브라우저에서 실행합니다. 레이저 다이오드의 문턱 전류를 J–I 곡선으로 찾고, 편광판 사이의 90° TN 액정과 평행 배향 액정에 사각파 전압을 걸어 전기광학 스위칭 곡선, 임계 전압, 위상 지연과 Vπ를 잽니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }

   1.  THE HIDDEN TRUTH OF THIS SESSION
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const RAD=Math.PI/180;
const TRUE={
  Ith:U(21.5,25.5), slope:U(0.95,1.12),          /* the laser's threshold (mA) and its slope (detector volts per mA, aligned) */
  roll:U(36,42),                                 /* where the laser's own output starts to bend over (mA) */
  pol:U(0.86,0.94), psiL:U(-25,25),              /* the laser's degree of polarization and the axis's tilt from vertical (deg) */
  Vc:U(1.25,1.45), w10:U(0.17,0.21),             /* the TN cell: critical voltage, and the width of its rise */
  tTN:U(0.33,0.38), tPA:U(0.40,0.44),            /* the cells' own transmissions */
  dn0:U(0.219,0.232), Vth:U(0.80,0.90), pa:U(1.0,1.12), pp:U(1.35,1.5),   /* the parallel cell: Δn at 0 V and how it falls with V */
  d:7.7e-6, lam:650e-9,
  dirTN:U(-40,40), dirPA:U(-40,40),              /* where each cell's front director points on its mount's scale (deg) */
  pdOff:[U(-0.25,0.25),U(-0.25,0.25)],           /* the photodetector's hole from the beam at the start (cm) */
  rBat:U(0.5,1.0), eBat:U(2.95,3.15) };
/* the laser diode's voltage at current I (A) */
const vLD=I=>1.75+0.045*Math.log(1+I/2e-4)+4.5*I;
/* the variable resistor (0–100 Ω, 270° knob) in series with the battery and the ammeter */
function ldCurrent(knob,rA){ const R=100*(1-knob)+21+rA+TRUE.rBat; let a=0,b=0.08; for(let i=0;i<50;i++){ const I=(a+b)/2; if(TRUE.eBat-vLD(I)-I*R>0) a=I; else b=I; } return (a+b)/2; }
/* the laser's light (in detector volts when perfectly aligned, before saturation) */
function ldLight(ImA){ const lin=ImA<=TRUE.Ith?0.012*Math.exp((ImA-TRUE.Ith)/4)*Math.max(0,ImA)/TRUE.Ith:TRUE.slope*(ImA-TRUE.Ith)*(1-Math.pow(Math.max(0,ImA-TRUE.Ith)/(TRUE.roll*1.6),3))+0.012;
  return Math.max(0,lin); }
const satPD=v=>v<7?v:8.28-(8.28-7)*Math.exp(-(v-7)/1.28);
/* the TN cell's twist at Vrms: 90° below Vc, unwinding above; a little "bounce" just before */
function tnTwist(V){ const x=(V-TRUE.Vc)/TRUE.w10, S=V<TRUE.Vc?0:1/(1+Math.exp(-(x-2.2)*1.35))-1/(1+Math.exp(2.2*1.35)); return 90*(1-Math.min(1,S/0.95)); }
const tnBounce=V=>0.035*Math.exp(-Math.pow((V-(TRUE.Vc-0.13))/0.09,2));

window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const R=Math.min(CLW*0.14,CLH*0.28); rot(-(cmouse[0]-cdrag.x)/(R/8)*(e.shiftKey?0.1:1)+cdrag.v-ST.ang[ST.sel]); });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  if(h.k.startsWith("sel:")){ ST.sel=h.k.slice(4); return; }
  if(h.k==="dial"){ cdrag={x:p[0],v:ST.ang[ST.sel]}; closeCv.setPointerCapture(e.pointerId); } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
function rot(da){ const k=ST.sel; if(!onRail(k)){ say("needFor",itemName(k)); return; } ST.ang[k]=Math.round((((ST.ang[k]+da)%360)+360)%360*100)/100; ST.dispT=0; }
function tilt(da){ const k=ST.sel; if(k!=="p1"&&k!=="p2"){ say("noTilt"); return; } if(!onRail(k)) return; ST.tilt[k]=Math.round((ST.tilt[k]+da)*100)/100; }
function knob(dk){ if(!need("rvar")) return; ST.knob=Math.max(0,Math.min(1,Math.round((ST.knob+dk)*10000)/10000)); ST.dispT=0; }
function pdMove(i,dv){ if(!onRail("pd")){ say("needFor",itemName("pd")); return; } ST.pdXY[i]=Math.round((ST.pdXY[i]+dv)*1000)/1000; ST.dispT=0; }
function amp(da){ if(!need("fg")) return; ST.fg.amp=Math.max(0,Math.min(20,Math.round((ST.fg.amp+da)*1000)/1000)); ST.dispT=0; }
function freq(f){ if(!need("fg")) return; ST.fg.f=Math.max(1,Math.min(10000,Math.round(ST.fg.f*f*10)/10)); }
for(const [id,f,v] of [["km10",knob,-0.1],["km1",knob,-0.01],["km01",knob,-0.001],["kp01",knob,0.001],["kp1",knob,0.01],["kp10",knob,0.1],
  ["rm10",rot,-10],["rm1",rot,-1],["rm02",rot,-0.2],["rp02",rot,0.2],["rp1",rot,1],["rp10",rot,10],["tm",tilt,-0.5],["tp",tilt,0.5],
  ["am1",amp,-1],["am01",amp,-0.1],["am002",amp,-0.02],["ap002",amp,0.02],["ap01",amp,0.1],["ap1",amp,1],["fm",freq,1/1.1],["fp",freq,1.1],["fmm",freq,0.5],["fpp",freq,2]]) $(id).onclick=()=>f(v);
for(const [id,i,v] of [["xm",0,-0.02],["xp",0,0.02],["ym",1,-0.02],["yp",1,0.02]]) $(id).onclick=()=>pdMove(i,v);
$("batBtn").onclick=()=>{ if(!need("bat")) return; ST.batOn=!ST.batOn; ST.dispT=0; };
$("gainBtn").onclick=()=>{ if(!need("pd")) return; ST.gainHi=!ST.gainHi; ST.dispT=0; };
$("fgBtn").onclick=()=>{ if(!need("fg")) return; ST.fg.on=!ST.fg.on; };
for(const w of ["sq","sin","tri"]) $("w_"+w).onclick=()=>{ if(!need("fg")) return; ST.fg.wave=w; };
for(const k of ["p1","tn","pa","p2"]) $("s_"+k).onclick=()=>{ ST.sel=k; };
for(const k of ["dmm1","dmm2"]){ const sel=$("m_"+k), cs=$("c_"+k); for(const m of MKEYS){ const o=document.createElement("option"); o.value=m; o.textContent=m==="off"?"OFF":m.replace("DCV","DC V ").replace("ACV","AC V ").replace("mA","mA "); sel.appendChild(o); }
  for(const c of CONN){ const o=document.createElement("option"); o.value=c; o.dataset.c=c; cs.appendChild(o); }
  sel.onchange=()=>{ if(!has(k)){ say("needFor",itemName(k)); sel.value="off"; return; } ST.mode[k]=sel.value; ST.dispT=0; };
  cs.onchange=()=>{ if(!has(k)){ say("needFor",itemName(k)); cs.value="none"; return; } ST.conn[k]=cs.value; ST.dispT=0; }; }
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  for(const k of ["dmm1","dmm2"]){ const s=meterShow(k), m=MODES[ST.mode[k]]; $("d_"+k).textContent=s===null?"—":s===""?"OFF":(s==="1"?"1 .  ":s)+" "+(m?m.u:""); if($("m_"+k).value!==ST.mode[k]) $("m_"+k).value=ST.mode[k]; if($("c_"+k).value!==ST.conn[k]) $("c_"+k).value=ST.conn[k]; }
  $("batBtn").className=ST.batOn?"on":""; $("batBtn").textContent=ST.batOn?t.batOff:t.batOn; $("gainBtn").textContent=ST.gainHi?"HI":"LO"; $("gainBtn").className=ST.gainHi?"on":"";
  $("knobTxt").textContent=has("rvar")?t.knobTxt(ST.knob):"—"; $("fgBtn").className=ST.fg.on?"on":""; for(const w of ["sq","sin","tri"]) $("w_"+w).className=ST.fg.wave===w?"on":"";
  $("fgTxt").textContent=has("fg")?(ST.fg.on?ST.fg.f.toFixed(1)+" Hz · "+t.ampTxt(ST.fg.amp):"OFF"):"—";
  for(const k of ["p1","tn","pa","p2"]) $("s_"+k).className=ST.sel===k?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ldI()*1000>45) L.push([t.st.hot,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-v","hV"],["l_dmm1","l1"],["l_dmm2","l2"],["t-h-l","hL"],["t-h-d","hD"],["t-h-f","hF"],["t-h-o","hO"],["oHint","oHint"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["fgBtn","fgPwr"]]) $(id).textContent=t[k];
  for(const k of ["dmm1","dmm2"]) for(const o of $("c_"+k).options) o.textContent=t.conn[o.value];
  for(const k of ["p1","tn","pa","p2"]) $("s_"+k).textContent=t.short[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
