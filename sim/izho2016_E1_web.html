<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IZhO 2016 실험 — 활성탄 정제 · Coal Tablet · HaslaLab</title>
<meta name="description" content="IZhO 2016 실험 문제를 브라우저에서 해 봅니다. 두 나무 자 사이에 끼운 활성탄 정제에 지렛대로 추의 무게를 실어, 옴의 법칙이 성립하는지와 하중에 따른 저항(올리고 내릴 때)을 재고, 정제를 쓰는 전자저울 회로를 꾸밉니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IZhO 2016 실험 — 활성탄 정제 · Coal Tablet · HaslaLab">
<meta property="og:description" content="IZhO 2016 실험: 눌린 활성탄 정제의 저항과 전자저울.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* IZhO 2016 on the 3-D bench.  The tablet's conductance grows nearly linearly with the load on it (official table 2:
   R = 76, 56, 44, 36, 32, 30 Ω for 100 … 600 g → 1/R ≈ 0.0092 + 4.0·10⁻⁵·m), and stays a little higher on the way
   back down (hysteresis).  The load comes through a lever: the upper ruler pivots at its end, the tablet sits
   10 cm from the pivot, weights hang on hooks at 5 … 35 cm, so the load is Σ mᵢxᵢ/10 cm.  Ohm's law holds. */
var PROGRAM = {
  title: { ko: 'IZhO 2016 실험 — 활성탄 정제', en: 'IZhO 2016 — Coal tablet' },
  subtitle: { ko: '활성탄 정제의 전기 저항이 기계적 압력에 따라 어떻게 변하는지 조사합니다. 장비: 활성탄 정제, 전기 접점이 달린 나무 자 둘(하나는 고정, 다른 하나에 추를 겁니다), 고리 달린 추 6 × 100 g, 멀티미터, 최대 100 Ω 가변 저항, 1.0 Ω 고정 저항, 9.0 V 직류 전원, 도선. 회로는 직접 꾸미세요.',
              en: 'Investigate how the electric resistance of an activated-coal tablet depends on mechanical stress. Equipment: the tablet, two wooden rulers with electric contacts (one fixed, weights hang on the other), 6 × 100 g weights with hangers, a multimeter, a 100 Ω variable resistor, a 1.0 Ω resistor, a 9.0 V DC source and wires. Design the circuit yourself.' },
  notes: { ko: [
    '과제: 1.1 하중 200 g, 400 g 에서 전류–전압(멀티미터는 전압계로만 — 1.0 Ω 양단 전압이 곧 전류), 옴의 법칙, 저항과 오차, 회로도. 2.1–2.3 하중에 따른 저항(올리며, 내리며), 그래프와 가장 간단한 직선화. 3 정제를 쓴 전자저울 — 전압이 무게에 거의 비례하는 회로와 눈금 그래프.',
    '공식 해답: 200 g — U = 6.43 V, I = 120 mA … 2.41 V, 37 mA → R₂₀₀ = 47 ± 5 Ω; 400 g → R₄₀₀ = 40 ± 3 Ω. R = 76, 56, 44, 36, 32, 30 Ω (100 … 600 g), 1/R 가 질량에 거의 비례. 저울: 1 Ω 양단 전압 140, 155, 168, 180, 195, 210 mV (100 … 600 g).',
    '하중은 지렛대 규칙으로: 위 자의 회전축에서 정제까지 10 cm, 고리까지 x 이면 정제에 걸리는 하중은 m·x/10 cm 입니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 current against voltage at loads of 200 g and 400 g (the multimeter only as a voltmeter — the voltage on 1.0 Ω is the current), Ohm\'s law, the resistances with errors, the circuit. 2.1–2.3 resistance against load, increasing and decreasing, graphs and the simplest linearization. 3 electronic scales built on the tablet — a circuit whose voltage is about proportional to the weight, and its calibration graph.',
    'Official solution: 200 g — U = 6.43 V, I = 120 mA … 2.41 V, 37 mA → R₂₀₀ = 47 ± 5 Ω; 400 g → R₄₀₀ = 40 ± 3 Ω. R = 76, 56, 44, 36, 32, 30 Ω (100 … 600 g), 1/R about proportional to the mass. Scales: 140, 155, 168, 180, 195, 210 mV on 1 Ω (100 … 600 g).',
    'The load follows the lever rule: the tablet is 10 cm from the upper ruler\'s pivot; a weight m on a hook at x loads it with m·x/10 cm. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, c: null, x: 1, hooks: [0, 0, 0, 0, 0, 0, 0], mmax: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 받침의 고정 자와 그 위에서 끝이 축에 걸린 자(사이에 활성탄 정제, 접점 단자 둘), 위 자 아래의 고리(5, 10 … 35 cm), 100 g 추 여섯 개, 9 V 전원, 100 Ω 가변 저항, 1.0 Ω 저항, 멀티미터, 도선.',
           en: 'On the desk: the fixed ruler on its stand and above it the ruler pivoted at one end (the tablet between them, two contact terminals), hooks under the upper ruler (5, 10 … 35 cm), six 100 g weights, the 9 V source, the 100 Ω variable resistor, the 1.0 Ω resistor, the multimeter and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '고리 클릭: 추 하나 걸기 · 걸린 추 클릭: 하나 내리기 (자의 눈금이 축에서의 거리)',
                '가변 저항 손잡이 휠/끌기: 저항 · 멀티미터: 클릭해서 가까이 본 뒤 다이얼'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Click a hook: hang one weight · click a hanging weight: take one off (the ruler\'s scale is the distance from the pivot)',
                'Variable resistor knob, wheel/drag: resistance · multimeter: click to look closer, then the dial'] },
  notePlaceholder: { ko: '예) 하중 200 g: U = 6.43 V, U₀ = 120 mV … / 100 g 76 Ω, 200 g 56 Ω …', en: 'e.g. load 200 g: U = 6.43 V, U₀ = 120 mV … / 100 g 76 Ω, 200 g 56 Ω …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var G0 = 0.0092 * (1 + S.sys('g0', 0.05)), G1 = 4.0e-5 * (1 + S.sys('g1', 0.04)), HY = 0.08, R0 = 1.0 * (1 + S.sys('R0', 0.01)), RP = 100 * (1 + S.sys('RP', 0.03)), E = 9.0 * (1 + S.sys('E', 0.01));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: 0, R: S.sys('mR', 0.004) };
    var leads = LAB.leads = new B3.Leads({ max: 10 }), c = LAB.c = new B3.Circuit(), sc = B3.scaleTex(38, { horiz: true, width: 1.6, bg: '#e8d4a0' });
    var RANGES = [['OFF'], ['V', 0.2], ['V', 2], ['V', 20], ['Ω', 200], ['Ω', 2000]];
    var PX = -30, TX = PX + 10, YR = 8;
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['pot'],
      home: { yaw: -0.25, pitch: 0.65, k: 11.5, tx: 2, ty: 3, tz: 1 },
      views: { dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 22, ty: 3.4, tz: 4, title: { ko: '멀티미터', en: 'Multimeter' } },
               lev: { yaw: 0, pitch: 0.25, k: 22, tx: PX + 18, ty: YR, tz: 0, title: { ko: '지렛대와 추', en: 'The lever and weights' } } },
      frame: function (b) {
        var mp = b.screenMoved('pot'), wp = b.wheel('pot'); if (mp[0] || wp) LAB.x = Math.max(0, Math.min(1, LAB.x + mp[0] * 0.004 + wp * 0.005));
        var used = LAB.hooks.reduce(function (a, v) { return a + v; }, 0);
        for (var i = 0; i < 7; i++) { if (b.clicked('c:hook' + i)) { if (used >= 6) b.say('추가 더 없습니다', 'No weights left'); else { LAB.hooks[i]++; used++; } }
          if (b.clicked('c:w' + i) && LAB.hooks[i] > 0) { LAB.hooks[i]--; used--; } }
        if (b.clicked('c:lever')) b.go('lev');
        var load = 0; for (i = 0; i < 7; i++) load += LAB.hooks[i] * 100 * (5 + 5 * i) / 10;
        LAB.mmax = load > LAB.mmax ? load : LAB.mmax - (LAB.mmax - load) * Math.min(1, b.dt / 600);
        var Gt = G0 + G1 * load + HY * G1 * (LAB.mmax - load), Rt = 1 / Gt;
        B3.desk(-40, 40, -18, 20);
        /* the lever: stand, fixed lower ruler, pivoted upper ruler, the tablet and hooks */
        B3.box3(PX - 2, PX + 40, 0, 1.2, -4, 4, '#3b4048', { top: '#474c55' });
        B3.box3(PX - 2, PX + 1, 1.2, YR + 1.6, -1.5, 1.5, '#5b6168');
        B3.box3(PX, PX + 40, YR - 1.4, YR - 0.6, -1.8, 1.8, '#c8a26a', { top: '#d8b27a' });
        B3.box3(PX + 25, PX + 27, 1.2, YR - 1.4, -1.2, 1.2, '#5b6168');
        B3.cyl3('y', YR - 0.6, YR + 0.2, TX, 0, 0.9, '#1b1b1b', { seg: 18, cap: '#2a2a2a' });
        B3.box3(PX, PX + 40, YR + 0.2, YR + 1.0, -1.8, 1.8, '#c8a26a', { top: '#d8b27a', id: 'c:lever' });
        B3.tex3(sc, 0, 0, sc.width, sc.height, [PX - 1, YR + 1.01, -1.6], [40, 0, 0], [0, 0, 1.6], { id: 'c:lever' });
        B3.cyl3('z', -2.2, 2.2, PX, YR + 0.6, 0.35, '#9aa0a6', { seg: 10 });
        for (i = 0; i < 7; i++) { var hx = PX + 5 + 5 * i; B3.cylAB([hx, YR + 0.2, 0], [hx, YR - 0.8, 2.6], 0.12, '#9aa0a6', { seg: 6 });
          B3.box3(hx - 0.6, hx + 0.6, YR - 1.2, YR - 0.6, 2.2, 3.2, '#9aa0a6', { id: 'c:hook' + i });
          for (var k = 0; k < LAB.hooks[i]; k++) { var yb = YR - 3.4 - k * 2.4; B3.line3([hx, YR - 0.9, 2.7], [hx, yb + 1.9, 2.7], '#c8ced6', 1);
            B3.cyl3('y', yb, yb + 1.8, hx, 2.7, 0.9, '#8d6e3a', { seg: 14, cap: '#a1824a', id: 'c:w' + i }); } }
        leads.term(b, 'tab.a', [TX - 3, YR + 1.0, -1.0], { col: '#b8b8b8', label: 'A', lc: '#333', ls: 0.6 });
        leads.term(b, 'tab.b', [TX + 3, YR - 0.6, -1.9], { col: '#b8b8b8', label: 'B', lc: '#333', ls: 0.6 });
        /* weights still free */
        for (k = 0; k < 6 - used; k++) B3.cyl3('y', 0, 1.8, -34 + k * 2.4, 13, 0.9, '#8d6e3a', { seg: 14, cap: '#a1824a' });
        /* source, rheostat, 1 Ω */
        var src = B3.cells(b, leads, 'src', [-14, 14], { n: 1, e: E, r: 0.5, cellCol: '#2a3a6a' });
        B3.text3([-16.5, 1.02, 17.5], [1, 0, 0], [0, 0, -1], '9 V', 0.8, '#333', { weight: '800' });
        B3.box3(-4, 6, 0, 2, 9, 15, '#3a3f46', { top: '#474c55' }); B3.cyl3('y', 2, 3.6, 1, 12.5, 1.5, '#2b2f35', { seg: 20, cap: '#3a3f46', id: 'm:pot' });
        var pa = (LAB.x - 0.5) * 4.5; B3.line3([1, 3.62, 12.5], [1 + Math.sin(pa) * 1.4, 3.62, 12.5 - Math.cos(pa) * 1.4], '#f2f2f2', 2.5);
        ['A', 'W', 'B'].forEach(function (t, j) { leads.term(b, 'pot.' + t, [-2 + j * 3, 2, 10], { col: '#b8b8b8', label: t, lc: '#e8e8e8', ls: 0.6 }); });
        B3.text3([-3.5, 2.02, 14.5], [1, 0, 0], [0, 0, -1], '100 Ω', 0.6, '#ddd', { weight: '700' });
        B3.box3(8, 14, 0, 0.8, 10, 15, '#2e6b4a', { top: '#357a55' }); B3.cylAB([9.8, 1.3, 12.5], [12.2, 1.3, 12.5], 0.4, '#c8b48a', { seg: 10 });
        leads.term(b, 'r0.a', [8.8, 0.8, 12.5], { col: '#d8d8d8' }); leads.term(b, 'r0.b', [13.2, 0.8, 12.5], { col: '#d8d8d8' });
        B3.text3([8.5, 0.82, 14.6], [1, 0, 0], [0, 0, -1], '1.0 Ω', 0.6, '#fff', { weight: '700' });
        var m = B3.dmm(b, 'dmm', [22, 4], dm, leads, { ranges: RANGES });
        c.reset();
        c.R('tab.a', 'tab.b', Rt); src.stamp(c);
        c.R('pot.A', 'pot.W', Math.max(0.05, LAB.x * RP)); c.R('pot.W', 'pot.B', Math.max(0.05, (1 - LAB.x) * RP)); c.R('r0.a', 'r0.b', R0);
        m.stamp(c); leads.wire(c); c.solve(0.05); m.read(c);
        leads.draw(b);
        LAB.state = { load: load, Rt: Rt, read: dm.now };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
</html>
