<title>EuPhO 2017 실험 — 발광 다이오드 · Light-Emitting Diode · HaslaLab</title>
<meta name="description" content="EuPhO 2017 실험을 브라우저에서 실행합니다. LED·가열 저항·서미스터가 붙은 회로 기판 두 장, 마개를 닫은 병과 물 U자관 압력계, 멀티미터 세 대, 가변저항과 전원 장치로 LED의 VG0·n·A·Rs, 효율, 광전류를 직접 측정합니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}

    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>

/* put the thing in the hand where the pointer is */
function place(k,hit){
  for(const n of NEEDS[k]||[]) if(!has(n)){ say("needFor",itemName(n)); return false; }
  if(k==="board1"||k==="board2"){
    if(hit==="bottle1"||hit==="bottle2"||hit==="cap1"||hit==="cap2"){ const i=+hit.slice(-1); if(ST.capOn[i-1]){ say("capFirst"); return false; }
      if(boardIn(3-+k.slice(-1))==="bottle"+i){ say("needFor",itemName("bottle"+(3-i))); return false; } ST.at[k]="bottle"+i; ST.on.add(k); say("inBottle",i); return true; }
    if(hit==="face"||hit==="board"+(3-+k.slice(-1))&&(boardIn(3-+k.slice(-1))||"").startsWith("mount")){ const other=boardIn(3-+k.slice(-1)); ST.at[k]=other==="mountA"?"mountB":"mountA"; ST.on.add(k); say("mount"); return true; }
    ST.at[k]="bench"; ST.on.add(k); say("onBench"); return true; }
  if(k==="cap1"||k==="cap2"){ const i=+k.slice(-1); ST.on.add(k); if(hit==="bottle"+i){ ST.capOn[i-1]=true; seal(i-1); say("capOn",i); } else say("placed",itemName(k)); return true; }
  if(k==="tube1"||k==="tube2"){ const i=+k.slice(-1); if(!ST.capOn[i-1]){ say("needFor",itemName("cap"+i)); return false; } ST.on.add(k); ST.tubeOn[i-1]=true; say("tubeOn",i); return true; }
  ST.on.add(k); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  const k0=hitItem(p);
  if(hand){ const k=hand.item; if(right){ if(hand.move){ hand=null; return; } say("back",itemName(k)); hand=null; return; } if(place(k,k0)) hand=null; return; }
  const k=k0;
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(k!=="face"&&clearK(k)) say("back",itemName(k)); return; }
  if(k==="board1"||k==="board2"){ const sl=boardIn(+k.slice(-1)); if(sl&&sl.startsWith("bottle")&&ST.capOn[+sl.slice(-1)-1]){ say("capFirst"); return; } hand={item:k,move:true}; say("picked",itemName(k)); return; }
  if((k==="cap1"||k==="cap2")&&ST.capOn[+k.slice(-1)-1]){ const i=+k.slice(-1); if(ST.tubeOn[i-1]){ say("tubeFirst"); return; } ST.capOn[i-1]=false; ST.sealed[i-1]=null; say("capOff",i); return; }
  if((k==="cap1"||k==="cap2")){ hand={item:k,move:true}; return; }
  if(k.startsWith("m")&&k.length===2) setTab("meters"); else if(k==="stand"||k==="utube"||k==="scale"||k.startsWith("tube")) setTab("mano"); else if(k==="face") setTab("face"); else setTab("wire"); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(120,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ hand=null; WSEL=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
function setMode(k,md){ const m=ST.meters[k-1]; if(!m.modes().includes(md)){ say("vonly"); return; } m.mode=md; m.range="AUTO"; m.shown=""; step(0); m.shown=m.display(); }
function cycleRange(k){ const m=ST.meters[k-1], rn=m.rangeNames(); if(!rn.length) return; m.range=rn[(rn.indexOf(m.range)+1)%rn.length]; step(0); m.shown=m.display(); }
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const up=e.deltaY<0;
  if(tab==="mano"){ MV.z=Math.max(0.6,Math.min(30,MV.z*(up?1.15:1/1.15))); return; }
  if(tab==="face"){ FV.z=Math.max(2,Math.min(60,FV.z*(up?1.15:1/1.15))); } },{passive:false});
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; if(cdrag.k==="mano"){ MV.c=Math.max(0,Math.min(300,cdrag.c+(cmouse[1]-cdrag.y)/MV.z)); } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2; closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="wire"){
    if(right){ let bi=-1, bd=16; ST.wires.forEach((w,i)=>{ const m=wMid(i); if(!m) return; const dd=Math.hypot(m[0]-p[0],m[1]-p[1]); if(dd<bd){ bd=dd; bi=i; } });
      if(bi<0&&h&&h.k.startsWith("t:")){ const n=h.k.slice(2); for(let i=ST.wires.length-1;i>=0;i--) if(ST.wires[i].includes(n)){ bi=i; break; } }
      if(bi>=0){ ST.wires.splice(bi,1); say("unwired"); } WSEL=null; return; }
    if(!h||!h.k.startsWith("t:")){ WSEL=null; return; } const n=h.k.slice(2);
    if(!has("wires")){ say("needFor",itemName("wires")); return; }
    if(!WSEL){ WSEL=n; say("sel",tName(n)); return; } if(WSEL===n){ say("same"); WSEL=null; return; }
    ST.wires.push([WSEL,n]); say("wired",tName(WSEL),tName(n)); WSEL=null; return; }
  if(tab==="meters"&&h){ const [kind,kk,md]=h.k.split(":"), k=+kk;
    if(kind==="d") setMode(k,md); else if(kind==="dial"){ const ms=ST.meters[k-1].modes(), i=ms.indexOf(ST.meters[k-1].mode); setMode(k,ms[(i+(right?-1:1)+ms.length)%ms.length]); } else if(kind==="r") cycleRange(k); return; }
  if(tab==="mano"){ cdrag={k:"mano",y:p[1],c:MV.c}; } });

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
$("psuBtn").onclick=()=>{ if(!need("psu")) return; ST.psuOn=!ST.psuOn; };
for(const [id,dv] of [["vm5",-0.5],["vm01",-0.1],["vm001",-0.01],["vp001",0.01],["vp01",0.1],["vp5",0.5]]) $(id).onclick=()=>{ if(!need("psu")) return; ST.psuV=Math.max(0,Math.min(6,Math.round((ST.psuV+dv)*100)/100)); };
document.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.p; if(!need("pot"+(j+1))) return; ST.pot[j]=Math.max(0,Math.min(1,Math.round(ST.pot[j]*1000+(+b.dataset.d))/1000)); });
$("fuseBtn").onclick=()=>{ const m=ST.meters.find((m,i)=>has("m"+(i+1))&&!m.fuse); if(!m) return; if(ST.fuses<=0){ say("noFuse"); return; } m.fuse=true; ST.fuses--; say("fuseNew"); };
for(const [id,dv] of [["dm1",-1],["dm01",-0.1],["dp01",0.1],["dp1",1]]) $(id).onclick=()=>{ if(!facing()){ say("needFor",d().tabs.face); return; } ST.dist=Math.max(5,Math.min(200,Math.round((ST.dist+dv)*10)/10)); };
for(const [id,dv] of [["wm5",-0.5],["wm1",-0.1],["wp1",0.1],["wp5",0.5]]) $(id).onclick=()=>{ if(!need("syringe")||!need("utube")) return; ST.water=Math.max(0,Math.min(2,Math.round((ST.water+dv)*10)/10)); ST.spilled=false; say("water"); };
for(const [id,s] of [["sp1",1],["sp10",10],["sp60",60],["sp300",300]]) $(id).onclick=()=>{ ST.speed=s; };
$("swGo").onclick=()=>{ ST.sw.run=!ST.sw.run; }; $("swRst").onclick=()=>{ ST.sw.run=false; ST.sw.t=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function buildMeterRows(){ const t=d(), box=$("mRows"); box.innerHTML="";
  for(const k of [1,2,3]){ const m=ST.meters[k-1], row=document.createElement("div"); row.className="row";
    const lab=document.createElement("span"); lab.className="hint"; lab.style.cssText="align-self:center;min-width:34px"; lab.textContent="M"+k; row.appendChild(lab);
    const sm=document.createElement("select"), sr=document.createElement("select"); for(const s of [sm,sr]) s.style.cssText="flex:1;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;padding:4px";
    for(const md of m.modes()){ const o=document.createElement("option"); o.value=md; o.textContent=t.modeL[md]; sm.appendChild(o); }
    sm.value=m.mode; sm.onchange=()=>{ if(!need("m"+k)){ sm.value=m.mode; return; } setMode(k,sm.value); fillR2(); };
    const fillR2=()=>{ sr.innerHTML=""; for(const r of (m.rangeNames().length?m.rangeNames():["—"])){ const o=document.createElement("option"); o.value=r; o.textContent=r; sr.appendChild(o); } sr.value=m.rangeNames().length?m.range:"—"; };
    fillR2(); sr.onchange=()=>{ if(sr.value!=="—"){ m.range=sr.value; step(0); m.shown=m.display(); } };
    row.appendChild(sm); row.appendChild(sr); box.appendChild(row); m._sel=[sm,sr,fillR2]; } }
function renderPanel(){ const t=d();
  $("psuV").textContent=!has("psu")?"—":ST.psuOn?ST.psuV.toFixed(2)+" V"+(ST.psuCC?"  CC":""):"OFF ("+ST.psuV.toFixed(2)+" V)";
  $("psuBtn").textContent=ST.psuOn?t.psuOn:t.psuOff; $("psuBtn").className=ST.psuOn?"on":"";
  $("pot1V").textContent=t.potV(1,Math.round(ST.pot[0]*1000)); $("pot2V").textContent=t.potV(2,Math.round(ST.pot[1]*1000));
  ST.meters.forEach(m=>{ if(m._sel){ const [sm,sr,fr]=m._sel; if(sm.value!==m.mode){ sm.value=m.mode; fr(); } else if(m.rangeNames().length&&sr.value!==m.range){ fr(); } } });
  $("fuseBtn").textContent=t.fuseBtn(ST.fuses); $("wV").textContent=t.wV(ST.water.toFixed(1));
  for(const [id,s] of [["sp1",1],["sp10",10],["sp60",60],["sp300",300]]) $(id).className=ST.speed===s?"on":"";
  const st=Math.floor(ST.sw.t); $("swV").textContent=Math.floor(st/60)+":"+String(st%60).padStart(2,"0"); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.psuOn&&ST.psuCC) L.push([t.st.cc,true]);
  if(ST.spilled) L.push([t.st.spill,true]);
  if(ST.Iled.some(i=>Math.abs(i)>1)) L.push([t.st.hot,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-psu","hPsu"],["t-h-pot","hPot"],["t-h-m","hM"],["t-h-d","hD"],["t-h-w","hW"],["t-h-sp","hSp"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; buildMeterRows(); renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now(), dispT=0;
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let rem=dt*ST.speed; while(rem>1e-9){ const h=Math.min(2,rem); step(h); rem-=h; }
  dispT-=dt; if(dispT<=0){ dispT=0.4; for(const m of ST.meters) m.shown=m.display(); }
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
