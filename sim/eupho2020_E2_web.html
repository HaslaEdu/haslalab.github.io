<style>

       padding:5px 12px;font:12.5px inherit;cursor:pointer}

<body>
<script>
/* EuPhO 2020 Experiment 2 "Black Box" — browser build of the official console
   program (Exp2-WIN.exe / Exp2-Linux / Exp2-OSX).

   Ported line by line from the published C++ source, sources.zip ->
   Experiment_2/ (constants.h, simulation.cpp, input.cpp, output.cpp) by
   Richard Luhtaru: the hidden masses and springs, the non-linear springs, both
   damping laws, the modified-Euler integrator at dt = 0.1 ms, the 5 mN force
   noise, the command grammar, the abort conditions and the output layout. */

var G = 9.81, Y1_INIT = 1.8, Y_CEIL = 3.0, Y_FLOOR = 0.0, BOX = 0.6;
var M1 = 0.857, M2 = 0.236, M3 = 0.413;
var K1L = 32.06, K1S = 20.0, K2L = 16.37, K2S = 15.0;
var BD1 = 0.22, BD2 = 0.08, BD3 = 0.08;
var DT = 0.0001, FORCE_ERR = 0.005;
var MAX_REPEAT = 1000, MIN_SAMPLING = 10, MAX_SAMPLING = 1000000;
var MIN_DURATION = 10, MAX_DURATION = 10000000, MAX_ACCEL = 30;
var OUTPUT_RES = 50;
var HEADER = '| Time (s) | Force (N) | Accel (m/s^2) |';

var STATUS = ['Experiment ended successfully.',
              'The box hit the ceiling. Experiment ended.',
              'The box hit the floor. Experiment ended.',
              'Masses and/or the box collided. Experiment ended.'];

function gauss(s) {
  var u = 1 - Math.random(), v = Math.random();
  return s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function k1of(x) { return K1L + K1S * x; }
function k2of(x) { return K2L + K2S * x; }

function makeSim() {
  var f1 = (M2 + M3) * G, f2 = M3 * G, y2 = Y1_INIT, y3, i;
  for (i = 0; i < 20; i++) y2 = Y1_INIT - f1 / k1of(Y1_INIT - y2);
  y3 = y2;
  for (i = 0; i < 20; i++) y3 = y2 - f2 / k2of(y2 - y3);
  return { y1: Y1_INIT, v1: 0, y2: y2, v2: 0, y3: y3, v3: 0, a1: 0 };
}

function force(s) {
  return M1 * s.a1 + BD1 * s.v1 * Math.abs(s.v1) +
         k1of(s.y1 - s.y2) * (s.y1 - s.y2) + M1 * G + gauss(FORCE_ERR);
}

function step(s, dt) {
  var v1 = s.v1, y1 = s.y1, v2 = s.v2, y2 = s.y2, v3 = s.v3, y3 = s.y3;
  var v1n = v1 + s.a1 * dt, y1n = y1 + 0.5 * (v1 + v1n) * dt;
  var k1 = k1of(y1 - y2), k2 = k2of(y2 - y3);
  var v2d0 = -BD2 / M2 * (v2 - v1) + k1 / M2 * (y1 - y2) - k2 / M2 * (y2 - y3) - G;
  var v3d0 = -BD3 / M3 * (v3 - v1) + k2 / M3 * (y2 - y3) - G;
  var v2g = v2 + v2d0 * dt, y2g = y2 + v2 * dt;
  var v3g = v3 + v3d0 * dt, y3g = y3 + v3 * dt;
  k1 = k1of(y1n - y2g); k2 = k2of(y2g - y3g);
  var v2d1 = -BD2 / M2 * (v2g - v1n) + k1 / M2 * (y1n - y2g) - k2 / M2 * (y2g - y3g) - G;
  var v3d1 = -BD3 / M3 * (v3g - v1n) + k2 / M3 * (y2g - y3g) - G;
  s.v1 = v1n; s.y1 = y1n;
  s.v2 = v2 + 0.5 * (v2d0 + v2d1) * dt; s.y2 = y2 + 0.5 * (v2 + v2g) * dt;
  s.v3 = v3 + 0.5 * (v3d0 + v3d1) * dt; s.y3 = y3 + 0.5 * (v3 + v3g) * dt;
  if (s.y1 > Y_CEIL) return 1;
  if (s.y1 - BOX < Y_FLOOR) return 2;
  if (s.y2 > s.y1 || s.y3 > s.y2 || s.y3 < s.y1 - BOX) return 3;
  return 0;
}

function fmt(t, f, a) {
  function w(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }
  var acc = (a >= 0 ? '+' : '') + a.toFixed(2);
  return '| ' + w(t.toFixed(2), 8) + ' | ' + w(f.toFixed(2), 9) + ' | ' + w(acc, 13) + ' |';
}

var PROGRAM = {
  title: 'EuPhO 2020 Experiment 2 — Black Box',
  subtitle: { ko: '주최측이 배포한 것은 콘솔 실행 파일입니다. CMD 모드는 공개된 C++ 원본 소스를 그대로 옮긴 프로그램이고, 실험 모드는 같은 계산을 3D 실험대의 실제 장비(리니어 구동기, 로드셀, 함수 발생기, 오실로스코프)로 해 봅니다.',
              en: 'The organisers handed out a console executable. CMD mode is a line-by-line port of the published C++ source; experiment mode runs the same calculation behind real apparatus on a 3-D bench (a linear drive, a load cell, a function generator, an oscilloscope).' },
  notes: { ko: [
    '공식 바이너리는 <code>EuPhO-2020/official/official_binaries/</code>에 Windows·Linux·macOS 빌드로 있습니다.',
    'EuPhO는 <b>C++ 전체 소스도 공개했습니다</b> (<code>official/official_sources/Experiment_2/</code>). 숨은 질량·용수철 상수, 비선형 용수철, 두 가지 감쇠, dt = 0.1 ms 적분기, 5 mN 힘 오차, 명령 문법, 중단 조건, 출력 형식이 모두 원본과 같습니다.',
    '명령: <code>지속시간 가속도</code> 쌍(예 <code>1.5 -0.4</code>), <code>repeat N</code> … <code>endrepeat</code>, <code>sample t</code>, <code>begin</code>, <code>quit</code>. 한 줄에 여러 개를 써도 됩니다.',
    '|a| &le; 30 m/s&sup2;, 지속시간과 샘플링은 0.01 s의 배수. 상자는 높이 0.6 m이고 3 m 방 한가운데서 시작하며, 상자나 내부 질량이 부딪히면 실험이 끝납니다.',
    '과제: m&#8321;, m&#8322;, m&#8323;, k&#8321;, k&#8322;를 모두 구하세요.'], en: [
    'The official binaries are in <code>EuPhO-2020/official/official_binaries/</code> for Windows, Linux and macOS.',
    'EuPhO also <b>published the full C++ source</b> (<code>official/official_sources/Experiment_2/</code>). The hidden masses and spring constants, the non-linear springs, the two kinds of damping, the 0.1 ms integrator, the 5 mN force error, the command syntax, the stop conditions and the output format are all the original ones.',
    'Commands: <code>duration acceleration</code> pairs (e.g. <code>1.5 -0.4</code>), <code>repeat N</code> … <code>endrepeat</code>, <code>sample t</code>, <code>begin</code>, <code>quit</code>; several on one line are fine.',
    '|a| &le; 30 m/s&sup2;; durations and sampling are multiples of 0.01 s. The box is 0.6 m high and starts in the middle of a 3 m room; the experiment ends if the box or a mass inside it hits something.',
    'Task: find all of m&#8321;, m&#8322;, m&#8323;, k&#8321;, k&#8322;.'] },
  run: async function (term) {
    term.writeln('EuPhO 2020 - Experiment 2');
    term.writeln('');

    for (;;) {
      var sim = makeSim();
      var seq = [], inrep = false, filename = null;

      /* ---- input phase, exactly the original get_input() ---- */
      for (;;) {
        if (seq.length) {
          term.writeln(describe(seq, true));
        }
        term.writeln('Enter "(duration in s) (acceleration in m/s^2)" (e.g. "1.5 -0.4") to add to sequence. (Max acceleration: 30 m/s^2)');
        term.writeln('Enter "repeat (number of times)" (e.g. "repeat 10") to repeat actions.');
        term.writeln('Enter "endrepeat" to end repeating actions.');
        term.writeln('Enter "sample (time in s)" (e.g. "sample 0.4") to change sampling time for the output file. (Default: 0.01 s)');
        term.writeln('Enter "begin" to start the experiment.');
        term.writeln('Enter "quit" to exit the program.');
        term.writeln('You can write multiple instructions on the same line (e.g. "1.5 -0.4 repeat 10 1.5 0.4 endrepeat").');

        var line = await term.ask('');
        term.writeln('');
        var st;
        try {
          st = parseLine(seq, line, function (v) { inrep = v; }, function () { return inrep; });
        } catch (err) {
          term.writeln('\n******* ' + err.message + ' *******\n');
          continue;
        }
        if (st === 'ok') { term.writeln('\n********************************'); }
        else if (st === 'quit') { return; }
        else {
          term.writeln('Enter name for output file (e.g. "results"). You should use Latin letters and numbers because some special characters are not allowed.');
          filename = (await term.ask('')).trim() || 'results';
          term.writeln('\n******* Begin experiment. *******\n');
          break;
        }
      }

      /* ---- run ---- */
      var flat = unpack(seq);
      var rows = [], timeMs = 0, lastSample = -1e9, sampling = 10, status = 0;
      var substeps = Math.round(1 / (1000 * DT));
      var headerWritten = false, first = true;

      outer:
      for (var q = 0; q < flat.length; q++) {
        if (flat[q][0] === 'sam') { sampling = flat[q][1]; continue; }
        var a = flat[q][1][0], dur = flat[q][1][1], t0 = timeMs;
        sim.a1 = a;
        while (timeMs - t0 < dur) {
          if (timeMs - lastSample >= sampling) {
            if (!headerWritten) {
              headerWritten = true;
              rows.push('EuPhO 2020 - Experiment 2', '', describe(seq, false), HEADER);
            }
            rows.push(fmt(timeMs / 1000, force(sim), sim.a1));
            lastSample = timeMs;
          }
          if (timeMs % OUTPUT_RES === 0) {
            if (first) { term.writeln(HEADER); first = false; }
            term.writeln(fmt(timeMs / 1000, force(sim), sim.a1));
            if (timeMs % 500 === 0) await term.yieldFrame();
          }
          for (var k = 0; k < substeps; k++) {
            status = step(sim, 1 / 1000 / substeps);
            if (status !== 0) break;
          }
          if (status !== 0) break outer;
          timeMs++;
        }
      }
      var text = STATUS[status];
      rows.push('', text);
      term.writeln('');
      term.writeln('');
      term.writeln(text);
      term.writeln('');
      term.writeln('readings for "' + filename + '.txt":');
      term.writeln(rows.join('\n'));
      term.writeln('');
      term.writeln('********************************');
      term.writeln('');
    }
  }
};

function parseLine(seq, text, setRep, getRep) {
  var toks = text.split(/\s+/).filter(Boolean), i = 0;
  while (i < toks.length) {
    var t = toks[i];
    if (t === 'repeat') {
      if (getRep()) throw new Error('Cannot repeat actions inside another repeat. Please try again.');
      var n = parseInt(toks[i + 1], 10);
      if (!(n >= 1 && n <= MAX_REPEAT)) throw new Error('Number of repeat times is out of range. Please try again.');
      seq.push(['rep', n]); setRep(true); i += 2;
    } else if (t === 'sample') {
      var s = parseFloat(toks[i + 1]);
      if (isNaN(s) || s * 1000 > MAX_SAMPLING) throw new Error('Sampling time is out of range. Please try again.');
      var ms = Math.round(s * 1000 / MIN_SAMPLING) * MIN_SAMPLING;
      seq.push(['sam', ms <= 0 ? MIN_SAMPLING : ms]); i += 2;
    } else if (t === 'endrepeat') {
      if (!getRep()) throw new Error('Cannot end repeat outside repeat. Please try again.');
      setRep(false); seq.push(['end', 0]); i++;
    } else if (t === 'begin') { return 'begin'; }
    else if (t === 'quit') { return 'quit'; }
    else {
      var d = parseFloat(t);
      if (isNaN(d)) throw new Error('Invalid entry. Please try again.');
      if (d * 1000 > MAX_DURATION || d < 0) throw new Error('Duration is out of range. Please try again.');
      if (i + 1 >= toks.length) throw new Error('Invalid entry. Please try again.');
      var a = parseFloat(toks[i + 1]);
      if (isNaN(a)) throw new Error('Invalid entry. Please try again.');
      if (a < -MAX_ACCEL || a > MAX_ACCEL) throw new Error('Acceleration is out of range. Please try again.');
      seq.push(['acc', [a, Math.round(d * 1000 / MIN_DURATION) * MIN_DURATION]]); i += 2;
    }
  }
  return 'ok';
}

function unpack(seq) {
  var flat = [], i = 0;
  while (i < seq.length) {
    if (seq[i][0] === 'rep') {
      var n = seq[i][1], block = []; i++;
      while (i < seq.length && seq[i][0] !== 'end') { block.push(seq[i]); i++; }
      i++;
      for (var j = 0; j < n; j++) flat = flat.concat(block);
    } else if (seq[i][0] === 'end') { i++; }
    else { flat.push(seq[i]); i++; }
  }
  return flat;
}

function describe(seq, current) {
  var out = [current ? 'Current experiment sequence:' : 'Experiment sequence:'];
  var inrep = false;
  seq.forEach(function (a) {
    var pad = inrep ? '    ' : '  ';
    if (a[0] === 'acc') {
      out.push(pad + 'Accelerate the box with a = ' + (a[1][0] >= 0 ? '+' : '') +
               a[1][0].toFixed(2) + ' m/s^2 for ' + (a[1][1] / 1000).toFixed(2) + ' seconds.');
    } else if (a[0] === 'sam') {
      out.push(pad + 'Change sampling time to every ' + (a[1] / 1000).toFixed(2) + ' seconds.');
    } else if (a[0] === 'rep') { out.push('  Repeat ' + a[1] + ' times:'); inrep = true; }
    else if (a[0] === 'end') { inrep = false; }
  });
  return out.join('\n');
}


/* Experiment mode, on the 3-D bench.  The box hangs from an S-beam load cell on the carriage of a 3 m
   vertical linear motor.  The motor's servo drive moves it with the acceleration its analogue input asks
   for (1 m/s² per volt); that input comes from a Siglent SDG1032X making square-wave bursts.  The load
   cell's indicator shows the force and gives it out at 0.2 V/N to a Siglent SDS1202X-E, whose second
   channel watches the generator.  The same masses, springs, damping, force noise, 0.1 ms integrator and
   stop conditions as the program.  The session's errors: the indicator's zero and the analogue output's
   gain are a little off. */
var BX = { sim: null, status: 0, hold: false, ind: 0, indT: -1, sc: null, fg: null, acc: 0 };
function bxReset() { BX.sim = makeSim(); BX.status = 0; BX.hold = false; }
PROGRAM.lab = {
  intro: { ko: '왼쪽에 높이 3 m의 수직 리니어 모터가 서 있고, 그 캐리지에 S형 로드셀을 거쳐 검은 상자(0.6 m)가 매달려 있습니다. 서보 드라이브는 입력 전압 1 V마다 1 m/s²의 가속도로 캐리지를 움직이고, 그 입력은 함수 발생기 SDG1032X의 사각파 버스트입니다. ' +
               '로드셀 표시기는 힘을 보여 주고 0.2 V/N으로 오실로스코프 SDS1202X-E의 CH1에 보내며, CH2는 발생기 출력을 봅니다. 화면에서 커서로 주기·진폭을 읽으세요. 상자나 안의 추가 부딪히면 드라이브가 멈춥니다(HOME으로 다시 매달기).',
           en: 'On the left stands a 3 m vertical linear motor; the black box (0.6 m) hangs from its carriage through an S-beam load cell. The servo drive moves the carriage with 1 m/s² of acceleration per volt at its input, and that input is a square-wave burst from an SDG1032X function generator. ' +
               'The load-cell indicator shows the force and sends it at 0.2 V/N to CH1 of an SDS1202X-E oscilloscope; CH2 watches the generator. Read periods and amplitudes off the screen with the cursors. If the box or a mass inside it hits something the drive stops (HOME hangs it up again).' },
  howto: { ko: ['장비를 클릭하면 가까이 보기, 빈 곳을 끌면 책상 돌려 보기 (Esc: 돌아가기)',
                '발생기: <b>Freq</b>(τ = 1/(2f)), <b>Ampl</b>(Vpp, 가속도 = Vpp/2 × 1 m/s²/V), <b>Phase</b>(0° = 위로 먼저, 180° = 아래로 먼저), <b>N Cycle</b>을 골라 손잡이로 바꾸기, ◀▶ 자릿수 → <b>CH1</b> 출력 켜기 → <b>Trigger</b>로 버스트 한 번',
                '오실로스코프: Volts/div·S/div 손잡이, <b>Run/Stop</b>, <b>Single</b>, <b>Cursors</b>(X/Y, Adjust 손잡이로 이동), <b>Measure</b>',
                '드라이브: <b>HOLD</b>는 제자리 유지, <b>HOME</b>은 상자를 방 가운데에 다시 매달기',
                '느린 재생(×0.25, ×0.1)으로 움직임을 볼 수 있습니다'],
           en: ['Click an instrument to look closely, drag empty space to turn the desk (Esc: back)',
                'Generator: pick <b>Freq</b> (τ = 1/(2f)), <b>Ampl</b> (Vpp; acceleration = Vpp/2 × 1 m/s² per V), <b>Phase</b> (0° = up first, 180° = down first), <b>N Cycle</b> and turn the knob, ◀▶ for the digit → switch <b>CH1</b> on → <b>Trigger</b> fires one burst',
                'Oscilloscope: the Volts/div and S/div knobs, <b>Run/Stop</b>, <b>Single</b>, <b>Cursors</b> (X/Y, moved with the Adjust knob), <b>Measure</b>',
                'Drive: <b>HOLD</b> keeps the carriage where it is, <b>HOME</b> hangs the box in the middle of the room again',
                'Slow motion (×0.25, ×0.1) lets you watch the movement'] },
  notePlaceholder: { ko: '예) 정지 상태 F = 14.97 N → 전체 질량 …\n버스트 2 Vpp, 1.667 Hz, 3 cycle: 이후 진동 주기 … s (커서)', en: 'e.g. at rest F = 14.97 N → total mass …\nburst 2 Vpp, 1.667 Hz, 3 cycles: then period … s (cursors)' },
  mount: function (host, ctx) {
    var S = ctx.S;
    BX.fz = S.sys('fZero', 0.03); BX.sg = S.sys('outGain', 0.01);
    bxReset(); BX.sc = new B3.Scope(); BX.fg = new B3.Sdg();
    BX.sc.ch[0].vi = 9; BX.sc.ch[0].pos = -3; BX.sc.ch[1].on = true; BX.sc.ch[1].vi = 9; BX.sc.ch[1].pos = 2; BX.sc.ti = 8; BX.sc.trig.src = 1; BX.sc.trig.level = 0.5;
    var RX = -55, RZ = -12, FLOOR = -76, simT = 0, nextPush = 0;
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, speeds: [1, 0.25, 0.1],
      home: { yaw: -0.35, pitch: 0.3, k: 3.6, tx: 15, ty: 40, tz: 0 },
      views: {
        rig: { yaw: -0.2, pitch: 0.12, k: 2.6, tx: RX, ty: 75, tz: RZ, title: { ko: '리니어 모터와 상자 (방 높이 3 m)', en: 'The linear motor and the box (room 3 m high)' } },
        sc: { yaw: 0, pitch: 0.12, k: 30, tx: 78, ty: 8, tz: 0, title: { ko: 'SIGLENT SDS1202X-E 오실로스코프', en: 'SIGLENT SDS1202X-E oscilloscope' } },
        fg: { yaw: 0, pitch: 0.12, k: 34, tx: 30, ty: 5.6, tz: 6, title: { ko: 'SIGLENT SDG1032X 함수 발생기', en: 'SIGLENT SDG1032X function generator' } },
        drive: { yaw: 0, pitch: 0.12, k: 40, tx: 112, ty: 6, tz: 2, title: { ko: '서보 드라이브 · 로드셀 표시기', en: 'Servo drive · load-cell indicator' } }
      },
      frame: function (b) {
        var dt = b.dt, s = BX.sim;
        /* the physics: 0.1 ms steps; the scope sees CH1 and CH2 once a millisecond */
        var n = Math.round(dt / 1e-4);
        for (var i = 0; i < n; i++) {
          simT += 1e-4;
          var a = BX.status ? 0 : BX.hold ? Math.max(-MAX_ACCEL, Math.min(MAX_ACCEL, -8 * s.v1 - 4 * (s.y1 - Y1_INIT))) : Math.max(-MAX_ACCEL, Math.min(MAX_ACCEL, BX.fg.value(b.t - dt + i * 1e-4) * 1.0));
          if (!BX.status) { s.a1 = a; BX.status = step(s, 1e-4); if (BX.status) { s.a1 = 0; s.v1 = 0; b.say('충돌: ' + STATUS[BX.status], 'Stopped: ' + STATUS[BX.status]); } }
          if (simT >= nextPush) { nextPush = simT + 1e-3; var F = force(s) + BX.fz;
            BX.sc.push(b.t - dt + i * 1e-4, F * 0.2 * (1 + BX.sg), BX.fg.value(b.t - dt + i * 1e-4)); BX.lastF = F; }
        }
        if (Math.floor(b.t * 4) !== BX.indT) { BX.indT = Math.floor(b.t * 4); BX.ind = BX.lastF || (force(s) + BX.fz); }
        B3.desk(-10, 135, -40, 32);
        /* the floor and the rig standing on it beside the desk */
        B3.box3(-110, 0, FLOOR - 1, FLOOR, -60, 40, '#8b939b', { top: '#9aa2a9' });
        B3.boxY(RX - 4, RX + 4, FLOOR, FLOOR + 300, RZ - 22, RZ - 14, '#b7bdc2', {}, 25);
        B3.box3(RX - 20, RX + 20, FLOOR, FLOOR + 3, RZ - 30, RZ + 10, '#5b6168');
        B3.box3(RX - 4, RX + 4, FLOOR + 300, FLOOR + 304, RZ - 24, RZ - 12, '#5b6168');
        for (var mk = 0; mk <= 300; mk += 50) B3.text3([RX + 4.05, FLOOR + mk, RZ - 15], [0, 0, 1], [0, 1, 0], '— ' + (mk / 100).toFixed(1) + ' m', 3, '#22272c', { weight: '800' });
        var yTop = FLOOR + s.y1 * 100, ybot = yTop - BOX * 100;
        /* the carriage on the rail, its arm, the load cell, the box */
        B3.box3(RX - 6, RX + 6, yTop + 10, yTop + 26, RZ - 14, RZ - 8, '#3e5f86', { id: 'm:rig' });
        B3.box3(RX - 2, RX + 2, yTop + 14, yTop + 18, RZ - 8, RZ + 4, '#7b848c', { id: 'm:rig' });
        B3.box3(RX - 2.5, RX + 2.5, yTop + 2, yTop + 14, RZ + 1, RZ + 7, '#2f6fb3', { id: 'm:rig' });
        B3.text3([RX - 2.4, yTop + 9, RZ + 7.05], [1, 0, 0], [0, 1, 0], 'S-BEAM', 1.1, '#e8eef3', { weight: '800' });
        B3.box3(RX - 30, RX + 30, ybot, yTop, RZ - 26, RZ + 34, '#15171a', { id: 'm:rig', top: '#1e2125' });
        B3.text3([RX - 28, yTop - 6, RZ + 34.1], [1, 0, 0], [0, 1, 0], 'BLACK BOX', 4, '#5a6068', { weight: '800' });
        /* the instruments */
        var gen = B3.sdg(b, 'fg', [30, -6], BX.fg);
        var sc = B3.scope(b, 'sc', [78, -6], BX.sc);
        /* the servo drive and the load-cell indicator, stacked */
        var dx = 112, dz = -4;
        B3.box3(dx - 11, dx + 11, 0, 7, dz - 10, dz + 9.6, '#2b2f34', { id: 'm:drive', top: '#363b41' });
        B3.box3(dx - 9, dx + 9, 7, 13, dz - 8, dz + 7.6, '#d9dcdf', { id: 'm:drive', top: '#e4e7e9' });
        var dcv = b.panel('drive', 440, 320, function (ui) {
          var g = ui.g;
          /* the indicator (top) */
          HL.rr(g, 40, 6, 360, 136, 8, '#d9dcdf'); HL.text(g, 'LOAD CELL INDICATOR', 60, 24, '#333', 11, 'left', '800'); HL.text(g, 'ANALOG OUT 0.2 V/N', 380, 24, '#555', 9, 'right', '700');
          HL.lcd(g, 60, 36, 250, 70, (BX.ind >= 0 ? ' ' : '−') + Math.abs(BX.ind).toFixed(2), { col: '#ff5a3c', glow: 'rgba(255,80,50,.4)', bg: '#140b09', frame: '#333' });
          HL.text(g, 'N', 330, 72, '#333', 20, 'left', '800'); HL.circle(g, 360, 120, 8, '#c8b26a', '#555', 1); HL.text(g, 'OUT', 340, 120, '#333', 8.5, 'right', '700');
          /* the servo drive (bottom) */
          HL.rr(g, 0, 160, 440, 160, 6, '#2b2f34'); HL.text(g, 'LINEAR SERVO DRIVE', 16, 180, '#e8eef3', 12, 'left', '800'); HL.text(g, 'ACC CMD  1 (m/s²)/V   ±30 m/s²', 16, 198, '#9aa3ab', 9.5, 'left', '700');
          var lamp = function (xx, lab, on, col) { HL.circle(g, xx, 230, 7, on ? col : '#3a3030', '#000', 1); HL.text(g, lab, xx, 248, '#c8ced6', 9, 'center', '700'); };
          lamp(40, 'READY', !BX.status, '#4cff6a'); lamp(90, 'HOLD', BX.hold, '#ffcf3a'); lamp(140, 'FAULT', !!BX.status, '#ff4a3c');
          var h = HL.button(ui, 'hold', 190, 214, 90, 38, { col: BX.hold ? '#8a6a1a' : '#4a4e54', label: 'HOLD', size: 13 });
          if (h.click && !BX.status) BX.hold = !BX.hold;
          var hm = HL.button(ui, 'home', 296, 214, 90, 38, { col: '#4a4e54', label: 'HOME', size: 13 });
          if (hm.click) { bxReset(); b.say('상자를 방 가운데에 다시 매달았습니다.', 'The box hangs in the middle of the room again.'); }
          HL.circle(g, 410, 290, 10, '#c8b26a', '#555', 1); HL.text(g, 'CMD IN', 380, 290, '#c8ced6', 8.5, 'right', '700');
          if (BX.status) HL.text(g, STATUS[BX.status], 16, 296, '#ff8a7a', 10, 'left', '700');
        });
        B3.tex3(dcv, 0, 0, dcv.width, dcv.height, [dx - 11, 13, dz + 9.62], [22, 0, 0], [0, -13, 0], { id: 'p:drive' });
        /* the cables: generator → drive and scope CH2; indicator → scope CH1; drive → motor */
        B3.cableDesk(gen.ch1, [dx + 9.6, 1, dz + 9.8], '#1b1b1b', 1.8); B3.cableDesk(gen.ch1, sc.ch2, '#1b1b1b', 1.8);
        B3.cableDesk([dx + 5.5, 9.2, dz + 9.8], sc.ch1, '#1b1b1b', 1.8);
        B3.cable([dx - 10, 3, dz - 9], [RX, FLOOR + 40, RZ - 18], '#e08a1c', 30, 2.6);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
