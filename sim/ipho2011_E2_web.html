<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .tabs button.on:hover{background:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ul{margin:4px 0 4px 20px;padding:0}

    mTakenOff:"Cylinder taken off.",
    mLoopRemoved:"Thread loop removed.",
    mCaught:"Caught it with your finger.",
    mHolding:"Holding the cylinder steady.",
    mLetGo:"Let go.",
    mInHand:"Cylinder in hand. Bring it to the loop and click.",
    mBackInLoop:"Cylinder back in the loop.",
    mHangFirst:"Hang the cylinder on the pin first.",
    mClickLoop:"Click at the hanging loop.",
    sSetup:"Setting up",
    sBpick:"Part B - click a pivot hole in the cylinder.",
    sBsel:"Part B - hole #%d selected. Click the pin.",
    sBal:"Balance - ", sSlip:"  (slipping!)",
    vLevel:"level", vBottom:"far end down", vTop:"near end down",
    vCarried:"in hand", vHeld:"supported by hand - left click to let go",
    vFallen:"slipped out - click it to pick it up",
    sPend:"Pendulum - hole #%d, angle %s deg",

  }

/* ==== PHYSICS START ==== the apparatus and the rig, as in the 2-D version */
const L_ = () => T[lang];
const fmt = (s, ...a)=>{ let i=0; return s.replace(/%d|%s/g, ()=>a[i++]); };
const copysign = (x,s)=> (s<0 ? -Math.abs(x) : Math.abs(x));
/* write to the DOM only when the text really changed */
const _dom = {};
function setTxt(id, s){ if(_dom[id]!==s){ _dom[id]=s; $(id).textContent = s; } }

/* ══════════════════════════════════════════════════════════════
   1.  random helpers  (a seeded stream, as random.Random in Python)
   ══════════════════════════════════════════════════════════════ */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function stream(seed){
  const r = mulberry32(seed>>>0);
  return {
    random:r,
    uniform:(a,b)=>a+r()*(b-a),
    gauss:(mu,sd)=>{
      let u=0,v=0; while(u===0)u=r(); while(v===0)v=r();
      return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
    }
  };
}

/* reproduces the apparatus of the official 2011 solution sheet */
const OFFICIAL_SEED = 20110714;

/* ══════════════════════════════════════════════════════════════
   2.  HIDDEN TRUTH
        Hidden physical parameters of one apparatus.
        Never exposed to the user.
   ══════════════════════════════════════════════════════════════ */
function makeTruth(seed){
  const rng = stream(seed ^ 0x1234);
  const official = (seed === OFFICIAL_SEED);
  let L,hole0,pitch,nHoles,ratio,z,g,dOut;
  let m,M,xcm,Icm,r,Rmin,holes;

  for(let attempt=0; attempt<2000; attempt++){
    if(official){
      L=0.3000; hole0=0.0110; pitch=0.0100; nHoles=16;
      ratio=2.66744; z=0.252688; g=9.7830; dOut=0.0220;   /* g of Bangkok */
    }else{
      L=rng.uniform(0.280,0.320);
      hole0=rng.uniform(0.0090,0.0140);
      pitch=0.0100; nHoles=null;
      ratio=rng.uniform(2.20,3.40);
      z=rng.uniform(0.78*L, 0.90*L);
      g=rng.uniform(9.780,9.830);
      dOut=rng.uniform(0.0205,0.0235);
    }
    m = 0.02500;
    M = ratio*m;
    xcm = (m*z + M*L/2.0)/(M+m);
    Icm = M*L*L/12.0 + M*(xcm-L/2.0)**2 + m*(z-xcm)**2;
    r = Icm/(M+m);
    Rmin = Math.sqrt(r);

    if(nHoles===null) nHoles = Math.floor((xcm - 0.016 - hole0)/pitch) + 1;
    holes = [];
    for(let i=0;i<nHoles;i++) holes.push(hole0 + i*pitch);
    const Rl = holes.map(h=>xcm-h);
    const Rlo = Math.min(...Rl), Rhi = Math.max(...Rl);

    if(nHoles < 12) continue;
    if(Rlo < 0.0140) continue;
    if(!(Rlo + 0.008 < Rmin && Rmin < Rhi - 0.020)) continue;
    if(z > L - 0.012) continue;
    break;
  }
  return {
    seed, L, d_out:dOut, d_in:dOut-0.0030, m, M, z, g,
    holes, x_cm:xcm, I_cm:Icm, r, R_min:Rmin, d_ball:0.0130,
    /* height of the bench top below the pin: clear of the longest swing */
    bench_y: Math.max(0.300, L - holes[0] + 0.012)
  };
}

/* ══════════════════════════════════════════════════════════════
   3.  THE RIG
        Nothing here returns a derived physical quantity: only
        instrument readings and what is visible on the bench.
   ══════════════════════════════════════════════════════════════ */
const LOOP_LEVER    = 0.0250;   /* effective contact half-height   [m] */
const LOOP_DEADBAND = 0.00030;  /* loop band half-width            [m] */
const LOOP_MU_S     = 0.78;     /* tightly tied loop on aluminium      */
const LOOP_MU_K     = 0.68;
const EYE_LEVEL_DEG = 0.55;     /* below this the eye calls it level   */
const LOOP_DROP     = 0.115;    /* thread from the pin to the loop [m] */
const RULER_LEN     = 0.350;
const RULER_H       = 0.030;
const RULER_REACH   = 0.038;
const PENCIL_LEN    = 0.110;
const PENCIL_U = 0.80, PENCIL_V = 0.60;
const ERASER_W = 0.042, ERASER_H = 0.019;

function makeRig(truth){
  const R = { truth, rng: stream((truth.seed ^ 0x5EED)>>>0), t:0.0 };

  R.resetAll = function(){
    R.loop_present = true;      /* thread loop hanging on the pin */
    R.mode = null;              /* null | "balance" | "pendulum" | "free" */
    R.thread_x = null;          /* loop position from the cylinder top [m] */
    R.hole_index = null;
    R.sel_hole = null;
    R.tilt = 0.0;               /* rad, +: bottom end (right) low */
    R.tilt_v = 0.0;
    R.slipping = false;
    R.fallen = false;
    R.theta = 0.0;              /* pendulum angle [rad] */
    R.omega = 0.0;
    R.released = false;
    R.marks = [];               /* pencil marks, m from the top */
    R.carried = false;
    R.held = false;
    R.sw_running = false;
    R.sw_t0 = 0.0;
    R.sw_value = 0.0;
    R._fall_v = 0.0; R._fall_drop = 0.0; R._slide_v = 0.0;
    R.ruler_pos = [-truth.L*0.60, truth.bench_y + 0.022];
    R.ruler_angle = 0.0;
    R.pencil_pos = [0.075, truth.bench_y + 0.030];
    R.eraser_pos = [0.150, truth.bench_y + 0.030];
    R.free_pos = [0.0, truth.bench_y - truth.d_out*0.5];
    R.carry_pos = null;
  };
  const no = s => [false, s];

  /* ---------------- assembly ---------------------------------------- */
  R.mount_on_loop = function(x){
    if(!R.loop_present) return no(L_().mLoopFirst);
    if(R.mode==="pendulum") return no(L_().mAlreadyPin);
    R.mode = "balance";
    R.thread_x = (x===undefined||x===null) ? truth.L*0.5 : x;
    R.tilt = 0.0; R.tilt_v = 0.0;
    R.slipping = false; R.fallen = false;
    R.carried = false; R.held = false;
    R._fall_v = 0.0; R._fall_drop = 0.0;
    return [true, L_().mInLoop];
  };
  R.mount_on_pin = function(i){
    if(R.mode==="balance") return no(L_().mThreadOff);
    if(!(i>=0 && i<truth.holes.length)) return no(L_().mNoHole);
    R.mode = "pendulum";
    R.hole_index = i;
    R.theta = 0.0; R.omega = 0.0;
    R.released = false; R.fallen = false;
    return [true, L_().mOnPin];
  };
  R.enter_part_a = function(){
    if(R.mode==="balance") return [true,""];
    const x = (R.thread_x!==null) ? R.thread_x : truth.L*0.5;
    R.mode = null; R.hole_index = null; R.sel_hole = null;
    R.loop_present = true;
    const out = R.mount_on_loop(x);
    R.hold(true);
    return out;
  };
  R.enter_part_b = function(){
    if(R.mode==="pendulum" || R.mode==="free") return [true,""];
    R.mode = "free";
    R.loop_present = false;
    R.free_pos = [0.0, truth.bench_y - truth.d_out*0.5];
    R.theta = R.omega = 0.0;
    R.released = false; R.fallen = false;
    R.sel_hole = null; R.hole_index = null;
    return [true, L_().mOnBench];
  };
  R.select_hole = function(i){
    if(!(i>=0 && i<truth.holes.length)) return [false,""];
    R.sel_hole = i;
    return [true, fmt(L_().mHoleSel, i+1)];
  };
  R.connect_selected_to_pin = function(){
    if(R.sel_hole===null) return no(L_().mClickHole);
    return R.mount_on_pin(R.sel_hole);
  };
  R.unmount_from_pin = function(){
    if(R.mode!=="pendulum") return [false,""];
    R.mode = "free"; R.hole_index = null;
    R.theta = R.omega = 0.0; R.released = false;
    return [true, L_().mOffPin];
  };
  R.take_cylinder_off = function(){
    R.mode = null; R.hole_index = null; R.thread_x = null;
    R.theta = R.omega = 0.0; R.tilt = R.tilt_v = 0.0;
    R.released = false; R.slipping = false; R.fallen = false;
    R.carried = false;
    return [true, L_().mTakenOff];
  };
  R.take_thread_off = function(){
    if(R.mode==="balance") R.take_cylinder_off();
    R.loop_present = false;
    return [true, L_().mLoopRemoved];
  };

  /* ---------------- bench actions ------------------------------------ */
  R.drag_loop_to = function(x){
    if(R.mode!=="balance" || R.fallen) return [false,""];
    R.thread_x = Math.max(0.004, Math.min(truth.L-0.004, x));
    return [true,""];
  };
  R.catch_ = function(){
    if(R.mode!=="balance") return [false,""];
    if(R.fallen) return R.pick_up_cylinder();
    R.hold(true);
    return [true, L_().mCaught];
  };
  R.hold = function(on){
    if(R.mode!=="balance") return [false,""];
    R.held = !!on;
    if(R.held){ R.slipping = false; R._slide_v = 0.0; }
    return [true, R.held ? L_().mHolding : L_().mLetGo];
  };
  R.nudge_loop = function(delta){
    if(R.mode!=="balance" || R.fallen || R.thread_x===null) return [false,""];
    return R.drag_loop_to(R.thread_x + delta);
  };
  R.pick_up_cylinder = function(){
    if(R.mode!=="balance" || !R.fallen) return [false,""];
    R.carried = true;
    return [true, L_().mInHand];
  };
  R.insert_into_loop = function(){
    if(!R.carried) return [false,""];
    const x = (R.thread_x!==null) ? R.thread_x : truth.L*0.5;
    R.carried = false; R.mode = null; R.loop_present = true;
    const out = R.mount_on_loop(Math.min(Math.max(x,0.006), truth.L-0.006));
    R.hold(true);
    return [out[0], L_().mBackInLoop];
  };
  R.pull_aside = function(deg){
    if(R.mode!=="pendulum" || R.fallen) return [false,""];
    R.theta = deg*Math.PI/180; R.omega = 0.0; R.released = false;
    return [true,""];
  };
  R.release = function(){
    if(R.mode!=="pendulum") return no(L_().mHangFirst);
    R.released = true;
    return [true,""];
  };
  R.stop_swing = function(){
    R.released = false; R.theta = 0.0; R.omega = 0.0;
    return [true,""];
  };

  /* ---------------- world geometry ----------------------------------- */
  R.fall_drop = ()=> R._fall_drop || 0.0;
  R.cyl_world = function(){
    if(R.mode==="balance"){
      if(R.carried && R.carry_pos)
        return [R.carry_pos[0]-truth.L*0.5, R.carry_pos[1], 1.0, 0.0];
      const cx=0.0, cy=LOOP_DROP + R.fall_drop();
      const ux=Math.cos(R.tilt), uy=Math.sin(R.tilt);
      const grip = R.fallen ? truth.L*0.5 : R.thread_x;
      return [cx-ux*grip, cy-uy*grip, ux, uy];
    }
    if(R.mode==="pendulum"){
      const ux=Math.sin(R.theta), uy=Math.cos(R.theta);
      const s = truth.holes[R.hole_index];
      return [-ux*s, -uy*s, ux, uy];
    }
    if(R.mode==="free")
      return [R.free_pos[0]-truth.L*0.5, R.free_pos[1], 1.0, 0.0];
    return [0.0,0.0,0.0,1.0];
  };
  R.axial_of = function(x,y){
    const [ox,oy,ux,uy]=R.cyl_world();
    return [(x-ox)*ux + (y-oy)*uy, -(x-ox)*uy + (y-oy)*ux];
  };
  R.on_cylinder = function(x,y,pad){
    pad = pad||0.0;
    const [s,t]=R.axial_of(x,y);
    return -pad<=s && s<=truth.L+pad && Math.abs(t)<=truth.d_out*0.5+pad;
  };
  R.feature_position = function(feat){
    const kind = feat[0];
    if(kind==="top") return 0.0;
    if(kind==="bottom") return truth.L;
    if(kind==="hole") return truth.holes[feat[1]];
    if(kind==="loop") return R.thread_x;
    if(kind==="mark") return R.marks.length ? R.marks[feat[1]] : null;
    if(kind==="axial") return feat[1];
    return null;
  };
  R.feature_world = function(feat){
    const s = R.feature_position(feat);
    if(s===null || s===undefined) return null;
    const [ox,oy,ux,uy]=R.cyl_world();
    return [ox+ux*s, oy+uy*s];
  };

  /* ---------------- hand tools ---------------------------------------- */
  R.move_ruler = (x,y)=>{ R.ruler_pos=[x,y]; };
  R.rotate_ruler = function(dr, px, py){
    if(px!==undefined && px!==null){
      const dx=R.ruler_pos[0]-px, dy=R.ruler_pos[1]-py;
      const c=Math.cos(dr), sn=Math.sin(dr);
      R.ruler_pos = [px+dx*c-dy*sn, py+dx*sn+dy*c];
    }
    R.ruler_angle = (R.ruler_angle + dr) % (2*Math.PI);
    if(R.ruler_angle<0) R.ruler_angle += 2*Math.PI;
  };
  R.ruler_frame = function(x,y){
    const dx=x-R.ruler_pos[0], dy=y-R.ruler_pos[1];
    const c=Math.cos(R.ruler_angle), sn=Math.sin(R.ruler_angle);
    return [dx*c+dy*sn, -dx*sn+dy*c];
  };
  R.on_ruler = function(x,y){
    const [s,t]=R.ruler_frame(x,y);
    return -0.010<=s && s<=RULER_LEN+0.010 && Math.abs(t)<=RULER_H*0.5;
  };
  R.pencil_to = function(x,y,drawing){
    R.pencil_pos=[x,y];
    if(!drawing) return [false,""];
    const [s,t]=R.axial_of(x,y);
    if(0.0<=s && s<=truth.L && Math.abs(t)<=truth.d_out*0.5){
      if(R.marks.every(mk=>Math.abs(s-mk)>0.0008)){ R.marks.push(s); return [true,""]; }
    }
    return [false,""];
  };
  R.on_eraser = function(x,y){
    const [ex,ey]=R.eraser_pos;
    return Math.abs(x-ex)<=ERASER_W*0.5+0.004 && Math.abs(y-ey)<=ERASER_H*0.5+0.004;
  };
  R.eraser_to = function(x,y,rubbing){
    R.eraser_pos=[x,y];
    if(!rubbing) return [false,""];
    const [s,t]=R.axial_of(x,y);
    if(Math.abs(t)<=truth.d_out*0.5+ERASER_H*0.5){
      const keep = R.marks.filter(mk=>Math.abs(mk-s)>ERASER_W*0.5);
      if(keep.length!==R.marks.length){ R.marks=keep; return [true,""]; }
    }
    return [false,""];
  };
  R.on_pencil = function(x,y){
    const [px,py]=R.pencil_pos;
    const s = (x-px)*PENCIL_U + (y-py)*PENCIL_V;
    const t = -(x-px)*PENCIL_V + (y-py)*PENCIL_U;
    return -0.006<=s && s<=PENCIL_LEN+0.005 && Math.abs(t)<=0.011;
  };

  /* ---------------- instruments ---------------------------------------- */
  R.stopwatch_start = function(){
    if(R.sw_running) return [false,""];
    R.sw_running = true;
    R.sw_t0 = R.t + R.rng.gauss(0.0,0.070);   /* human reaction on the button */
    return [true,""];
  };
  R.stopwatch_stop = function(){
    if(!R.sw_running) return [false,""];
    R.sw_running = false;
    R.sw_value = Math.max(0.0, (R.t + R.rng.gauss(0.0,0.070)) - R.sw_t0);
    return [true,""];
  };
  R.stopwatch_reset = function(){
    R.sw_running = false; R.sw_value = 0.0;
    return [true,""];
  };
  R.stopwatch_display = function(){
    let v = R.sw_running ? (R.t - R.sw_t0) : R.sw_value;
    v = Math.max(0.0, v);
    return String(Math.floor(v/60)).padStart(2,"0") + ":" +
           (v%60).toFixed(2).padStart(5,"0");
  };

  /* ---------------- what the eye sees ----------------------------------- */
  R.bench_readout = function(){
    const out = {mode:R.mode, fallen:R.fallen};
    if(R.mode==="balance"){
      const deg = R.tilt*180/Math.PI;
      let view;
      if(R.carried) view="carried";
      else if(R.held) view="held";
      else if(R.fallen) view="fallen";
      else if(Math.abs(deg)<EYE_LEVEL_DEG) view="level";
      else if(deg>0) view="bottom_down";
      else view="top_down";
      out.tilt_view = view;
      out.sliding = R.slipping;
    }else if(R.mode==="free"){
      out.selected_hole = R.sel_hole;
    }else if(R.mode==="pendulum"){
      out.angle_deg = Math.round(R.theta*180/Math.PI*2.0)/2.0;
      out.swinging = R.released;
      out.hole = R.hole_index;
    }
    out.stopwatch = R.stopwatch_display();
    return out;
  };
  R.status_line = function(){
    const d = L_(), r = R.bench_readout();
    if(r.mode===null) return d.sSetup;
    if(r.mode==="free")
      return (R.sel_hole===null) ? d.sBpick : fmt(d.sBsel, R.sel_hole+1);
    if(r.mode==="balance"){
      const map = {level:d.vLevel, bottom_down:d.vBottom, top_down:d.vTop,
                   carried:d.vCarried, held:d.vHeld, fallen:d.vFallen};
      let s = d.sBal + map[r.tilt_view];
      if(r.sliding) s += d.sSlip;
      return s;
    }
    return fmt(d.sPend, r.hole+1, r.angle_deg.toFixed(1));
  };

  /* ---------------- time stepping ---------------------------------------- */
  R.step = function(dt){
    R.t += dt;
    if(R.mode==="free") return;
    if(R.mode==="balance"){
      if(R.carried) return;
      if(R.fallen) stepFall(dt); else stepBalance(dt);
    }else if(R.mode==="pendulum" && !R.fallen){
      stepPendulum(dt);
    }
  };
  function stepFall(dt){
    let v = R._fall_v + truth.g*dt;
    let d = R.fall_drop() + v*dt;
    const limit = truth.bench_y - LOOP_DROP - truth.d_out*0.5;
    if(d >= limit){ d = limit; v = 0.0; R.tilt = 0.0; R.tilt_v = 0.0; }
    R._fall_v = v; R._fall_drop = d;
  }
  function stepBalance(dt){
    if(R.held){
      R.tilt += (0.0 - R.tilt)*Math.min(1.0, 14.0*dt);
      R.tilt_v = 0.0; R.slipping = false; R._slide_v = 0.0;
      return;
    }
    const d = truth.x_cm - R.thread_x;
    const d_eff = (Math.abs(d)<=LOOP_DEADBAND) ? 0.0
                : d - copysign(LOOP_DEADBAND, d);
    const target = Math.atan2(d_eff, LOOP_LEVER);

    /* settle towards the equilibrium tilt (damped 2nd order) */
    const w0=11.0, zeta=0.42;
    const acc = w0*w0*(target - R.tilt) - 2.0*zeta*w0*R.tilt_v;
    R.tilt_v += acc*dt;
    R.tilt   += R.tilt_v*dt;

    const limit = Math.atan(LOOP_MU_S);
    if(Math.abs(R.tilt) > limit) R.slipping = true;
    if(R.slipping){
      const mu = LOOP_MU_K;
      const a = truth.g*(Math.abs(Math.sin(R.tilt)) - mu*Math.cos(R.tilt));
      if(a <= 0.0){ R.slipping = false; R._slide_v = 0.0; }
      else{
        R._slide_v += a*dt;
        /* the cylinder runs down-slope: the contact point moves up-slope */
        R.thread_x -= copysign(R._slide_v*dt, d);
        if(R.thread_x < 0.0 || R.thread_x > truth.L){
          R.fallen = true; R.slipping = false;
          R._fall_v = 0.0; R._fall_drop = 0.0;
        }
      }
    }else{
      R._slide_v = 0.0;
    }
  }
  function stepPendulum(dt){
    if(!R.released) return;
    const Rr = truth.x_cm - truth.holes[R.hole_index];
    const Ip = truth.I_cm + (truth.M+truth.m)*Rr*Rr;
    const Wg = (truth.M+truth.m)*truth.g*Rr;
    const b  = 2.0*Ip/78.0;                    /* light air/pivot damping */
    const acc = (th,om)=>(-Wg*Math.sin(th) - b*om)/Ip;
    /* RK4 */
    const k1v = acc(R.theta, R.omega),                     k1x = R.omega;
    const k2v = acc(R.theta+0.5*dt*k1x, R.omega+0.5*dt*k1v), k2x = R.omega+0.5*dt*k1v;
    const k3v = acc(R.theta+0.5*dt*k2x, R.omega+0.5*dt*k2v), k3x = R.omega+0.5*dt*k2v;
    const k4v = acc(R.theta+dt*k3x, R.omega+dt*k3v),         k4x = R.omega+dt*k3v;
    R.theta += dt/6.0*(k1x+2*k2x+2*k3x+k4x);
    R.omega += dt/6.0*(k1v+2*k2v+2*k3v+k4v);
    if(R.theta >  Math.PI) R.theta -= 2*Math.PI;   /* a full rotation is allowed */

/* ---- parts ---- */
function tube(){

  const disc = (s, rad, col, id) => { const C = W(ox + ux * s, oy + uy * s, front), pts = [];
    for (let i = 0; i < 12; i++){ const a = i / 12 * 2 * Math.PI; pts.push([C[0] + rad * Math.cos(a), C[1] + rad * Math.sin(a), C[2]]); }
    face(pts, {fill: col, id, flat: true}); };

}
function thread(){

    const pts = []; for (let i = 0; i <= 20; i++){ const a = i / 20 * 2 * Math.PI; pts.push([c[0], c[1] + r * Math.cos(a), c[2] + r * Math.sin(a)]); } poly3(pts, "#f4f2ec", 1.3); return; }

/* screen point -> the vertical plane z = z0 */
function onPlaneZ(px, py, z0){
  const c = Math.cos(CAM.yaw), s = Math.sin(CAM.yaw), cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);

/* ---- the hands: the 2-D press / motion / release, on the plane of the tube ---- */
let dragMode = null, pendingHole = null, pressXY = [0, 0], grab = [0, 0], down = null, mPrev = [0, 0];
function holeAt(wx, wy){

  truth.holes.forEach((h, i) => { const d = Math.hypot(ox + ux * h - wx, oy + uy * h - wy); if (d < bd){ best = i; bd = d; } });
  return bd < Math.max(0.0035, 8.0 / ppm()) ? best : null; }

const front = () => truth.d_out * 50;
function onPress(p){

    if (rig.slipping || (rig.fallen && rig.on_cylinder(wx, wy, 0.010))){ const m = rig.catch_()[1]; rig.carry_pos = [wx, wy]; status(m); return; }

    if (i !== null){ dragMode = "hole"; pendingHole = i; pressXY = p.slice(); grab = [wx - rig.free_pos[0], wy - rig.free_pos[1]]; return; }
    if (rig.on_cylinder(wx, wy, truth.d_out * 0.4)){

      if (rig.mode === "free"){ dragMode = "move"; grab = [wx - rig.free_pos[0], wy - rig.free_pos[1]]; return; } }
  }

  if (TOOLS.ruler && rig.on_ruler(rx, ry)){ dragMode = "ruler"; grab = [rx - rig.ruler_pos[0], ry - rig.ruler_pos[1]]; return; }

cv3.addEventListener("contextmenu", e => e.preventDefault());

  onRelease(); });
cv3.addEventListener("dblclick", e => { const p = pe(e), id = pick3(p[0], p[1]); if (id && id !== "room" && id !== "shelf") return; Object.assign(CAM, CAM0); });
cv3.addEventListener("wheel", e => { e.preventDefault();
  const p = pe(e), d = e.deltaY < 0 ? 1 : -1, fine = e.shiftKey, [wx, wy] = s2w(p);
  if (!(e.ctrlKey || e.metaKey)){
    if (part === "A" && rig.mode === "balance" && !(rig.fallen || rig.carried) && rig.on_cylinder(wx, wy, truth.d_out)){
      const step = fine ? 0.0002 : 0.0020; rig.hold(true); rig.nudge_loop(d > 0 ? -step : step); return; }
    const [rx, ry] = s2w(p, front() + 0.5);
    if (TOOLS.ruler && rig.on_ruler(rx, ry)){ const step = (fine ? 0.5 : 2.5) * Math.PI / 180; rig.rotate_ruler(d > 0 ? step : -step, rx, ry); return; } }
  const f = d > 0 ? 1.12 : 1 / 1.12, nk = Math.min(400, Math.max(3, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive: false});

/* ---- language ---- */
function applyLang(){
  lang = LANG; const d = T[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.getAttribute("data-i18n")); });
  $("btn-en").className = LANG === "en" ? "on" : ""; $("btn-ko").className = LANG === "ko" ? "on" : "";
  document.documentElement.lang = LANG; $("info").innerHTML = tr("info");
  document.title = LANG === "ko" ? "IPhO 2011 E2 — 역학 블랙박스 · HaslaLab" : "IPhO 2011 E2 — Mechanical Blackbox · HaslaLab";
  $("partA").textContent = tr("partA"); $("partB").textContent = tr("partB");
  $("swStart").textContent = d.start; $("swStop").textContent = d.stop; $("swReset").textContent = d.reset; $("swHint").textContent = tr("swHint");
  $("newExp").textContent = tr("newExp");
  for (const k in _dom) delete _dom[k];
  trayLayout(); syncTabs(); syncPanel(); }
function setLang(l){ LANG = l; const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u); applyLang(); }
$("btn-en").onclick = () => setLang("en"); $("btn-ko").onclick = () => setLang("ko");

/* ---- the clock ---- */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.06, (now - lastT) / 1000); lastT = now;
  const n = Math.max(1, Math.floor(dt / 0.004) + 1); for (let i = 0; i < n; i++) rig.step(dt / n);
  draw3(); syncPanel(); requestAnimationFrame(loop); }
document.addEventListener("visibilitychange", () => { lastT = performance.now(); });
layout3(); setPart("A"); applyLang(); requestAnimationFrame(loop);

</script>
