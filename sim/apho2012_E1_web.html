<meta name="description" content="APhO 2012 실험 1번을 브라우저에서 실행합니다. 강철 파이프 조립대에 코드를 걸고 한쪽에 추를, 다른 쪽에 접시를 매단 뒤 분동을 올려 가며 눈금판과 확대경으로 코드가 미끄러지는지 봅니다. 감은 각도를 바꿔 하중·힘·각도의 관계와 마찰 계수, 미지 질량을 직접 구합니다. 계산은 대신 해주지 않습니다.">

<meta property="og:description" content="APhO 2012 실험 1번을 브라우저에서 실행합니다. 코드를 파이프와 기둥에 감고, 접시에 분동을 올리며 코드가 미끄러지는 순간을 찾습니다.">
<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}

   1.  RANDOM AND PHYSICS  (capstan friction, as in the Python edition)

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry32((Date.now()^0x2012e1)>>>0);

function regime(cord,Mw,Mp,theta){

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
const FOOTR={box:[260,180],cloth:[180,140],mag:[150,80]};
function rectOf(k,x,y){ const [w,dd]=k==="plat"?[300,300]:FOOTR[k]; return [x-w/2,y-dd/2,x+w/2,y+dd/2]; }
const overl=(a,b,m)=>a[0]<b[2]+m&&a[2]>b[0]-m&&a[1]<b[3]+m&&a[3]>b[1]-m;
function onTable(k){ return k==="plat"?ST.on.plat:k==="mag"?ST.on.mag&&!ST.magMount:ST.on[k]; }
function fitsAt(k,x,y){
  const r=rectOf(k,x,y); if(r[0]<DESK.x0+5||r[2]>DESK.x1-5||r[1]<DESK.y0+5||r[3]>DESK.y1+(k==="plat"?1:-5)) return false;
  for(const o of ["plat","box","cloth","mag"]){ if(o===k||!onTable(o)) continue; const oy=o==="plat"?PY:ST.y[o], ox=o==="plat"?px():ST.x[o];
    if(overl(r,rectOf(o,ox,oy),8)) return false; }

}
const platFits=x=>fitsAt("plat",x,PY);
function platRect(){ const a=P(px()-170,PY-150,POST.top+20), b=P(px()+170,DESK.y1+40,FLOOR); return [a[0],a[1],b[0],b[1]]; }
const inR=(p,r)=>p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3];
function scrRect(x0,y0,z0,x1,y1,z1){ const a=P(x0,y0,z1), b=P(x1,y1,z0); return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])]; }
/* what is under the mouse on the bench */
function partAt(p){

    if(ST.on.mag&&ST.magMount){ const c=P(loadX(),HANG_Y+70,178); if(Math.hypot(p[0]-c[0],p[1]-c[1])<34*SC+6) return "mag"; }

    if(ST.load&&inR(p,scrRect(loadX()-26,HANG_Y,loadBottom()-4,loadX()+26,HANG_Y,loadKnot()+6))) return ST.load;
    if(ST.on.pan&&inR(p,scrRect(panX()-50,HANG_Y,panKnot()-120,panX()+50,HANG_Y,panKnot()+6))) return "pan";
    if(ST.cord){ for(const q of cordPts()){ const s=P(...q); if(Math.hypot(p[0]-s[0],p[1]-s[1])<5) return ST.cord; } }

function returnPart(k){
  const t=d();

  else if(k==="dial"||k==="pink"){ if(ST.load||ST.on.pan){ say("detachFirst"); return; } ST.cord=null; ST.wraps=0; }
  else if(k==="hanger"||k==="unknown"){ ST.load=null; ST.slots=NSLOT; ST.xi=0; ST.held=true; }
  else if(k==="pan"){ ST.on.pan=false; ST.inPan=ST.inPan.map(()=>false); ST.xi=0; ST.held=true; }

function place(k,p){

  if(["plate","dial","pink","hanger","unknown","pan"].includes(k)){
    if(!ST.on.plat){ say("platFirst"); return false; } if(!nearPlat){ say("noFit"); return false; }
    if(k==="plate"){ ST.on.plate=true; say("mounted",itemName(k)); return true; }
    if(k==="dial"||k==="pink"){ if(ST.cord){ say("otherCord"); return false; } ST.cord=k; ST.wraps=0; ST.xi=0; say("cordOn",itemName(k)); return true; }

function returnHand(){ if(!hand) return; if(hand.move){ const o=hand.orig; if(hand.item==="plat"){ ST.x.plat=o.x; ST.on.plat=true; } else { ST.x[hand.item]=o.x; ST.y[hand.item]=o.y; ST.on[hand.item]=true; if(hand.item==="mag") ST.magMount=o.mount; } say("stays"); } hand=null; }

  ST.notes.push(t.noteRow(c,l,pn,t.lab.quarter(ST.wraps))); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderPanel(){ const t=d(); $("holdBtn").textContent=ST.held?t.release:t.hold; $("holdBtn").className=ST.held?"on":""; }
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
let stopAt=null;
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.plat) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ready()&&ST.held) L.push([t.st.held,false]);
  if(stopAt==="floor") L.push([t.st.floor,true]); if(stopAt==="top") L.push([t.st.top,true]);
  if(MODEL.grease>0) L.push([t.st.greasy,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-wrap").textContent=t.hWrap; $("wrapDn").textContent=t.wrapDn; $("wrapUp").textContent=t.wrapUp; $("t-wraphint").textContent=t.wrapHint;
  $("t-h-hold").textContent=t.hHold; $("resetBtn").textContent=t.reset; $("t-holdhint").textContent=t.holdHint;
  $("t-h-pipe").textContent=t.hPipe; $("touchBtn").textContent=t.touch; $("wipeBtn").textContent=t.wipe;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2012 E1 — 마찰 · HaslaLab":"APhO 2012 E1 — Friction · HaslaLab";
  renderTabs(); renderPanel(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function step(dt){
  stopAt=null;
  if(!ready()||ST.held) return;
  const [rg,x]=regime(ST.cord,Mw(),Mp(),theta());
  const v=rg==="down"?40+260*Math.sqrt(x):rg==="up"?-(40+260*Math.sqrt(x)):rg==="creep_down"?0.12:rg==="creep_up"?-0.12:0;
  const [lo,hi]=limits(); ST.xi+=v*dt;
  if(ST.xi>=hi){ ST.xi=hi; stopAt=hLoad()&&LOAD_Z0-hLoad()-FLOOR<=PIPE.zHi-40-PAN_Z0?"floor":"top"; }
  if(ST.xi<=lo){ ST.xi=lo; stopAt=lo===FLOOR+90-PAN_Z0?"floor":"top"; }
}
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  step(dt);
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
