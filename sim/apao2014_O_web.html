<script>
"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* Listvyanka, the Baikal shore by the source of the Angara: the lake opens to the south-east and south, steep taiga
   hills stand behind the village; the evening of 27 November 2014 (UT+8), under a closed cloud deck. */
const SITE = {lat: 51 + 51 / 60, lon: 104 + 53 / 60, tz: 8, name: "Listvyanka"}, START = 21;
const PHI = SITE.lat, BELT_DEC = -1.20, BELT_RA = 84.05;               /* Alnilam, the middle of the belt */
const ALT9 = 90 - PHI + BELT_DEC, R10 = 90 - PHI;                      /* where the belt culminates; the zenith star's polar distance */
const HILLS = (() => { let s = 2014; const r = () => (s = (s * 16807) % 2147483647) / 2147483647, L = []; for (let i = 0; i < 9; i++) L.push([r() * 360, 2 + r() * 5, 6 + r() * 14]); return L; })();
function skyline(az) { az = A.norm360(az); const lake = az > 105 && az < 235; if (lake) return -0.2;
  const edge = Math.min(Math.abs(((az - 105 + 540) % 360) - 180), Math.abs(((az - 235 + 540) % 360) - 180)), ramp = Math.min(1, edge / 14);
  let h = 3.2 + 1.2 * Math.sin(az * 0.05) + 0.4 * Math.sin(az * 0.31); for (const [a, ht, w] of HILLS) { const d = Math.abs(((az - a + 540) % 360) - 180); h += ht * Math.exp(-((d / w) ** 2)); }
  return h * ramp + 0.25 * Math.sin(az * 2.7) * ramp; }
const ZEN = [0, 0, 1], POLE = A.hvec(PHI, 0), T9 = A.hvec(ALT9 + A.refr(ALT9), 180);
let SKY = null, solOn = false, pts = [], traces = [], LANGF = () => "ko";
const K9 = "hl-apao2014-o-point", K10 = "hl-apao2014-o-trace";
try { pts = JSON.parse(localStorage.getItem(K9) || "[]"); traces = JSON.parse(localStorage.getItem(K10) || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem(K9, JSON.stringify(pts)); localStorage.setItem(K10, JSON.stringify(traces)); } catch (e) {} };
/* hour angle of a direction in the local sky (degrees, growing westwards) */
function hourAngle(h) { const [alt, az] = A.altaz(h), a = alt * DEG, Z = az * DEG, p = PHI * DEG;
  return Math.atan2(-Math.sin(Z) * Math.cos(a), Math.sin(a) * Math.cos(p) - Math.cos(a) * Math.sin(p) * Math.cos(Z)) / DEG; }
/* how a swept path compares with the diurnal circle through the zenith */
function judge10(pts) {
  if (!pts || pts.length < 3) return null;
  const err = pts.reduce((s, h) => s + Math.abs(A.sep(h, POLE) - R10), 0) / pts.length, zen = Math.min(...pts.map((h) => A.sep(h, ZEN)));
  let span = 0, prev = hourAngle(pts[0]); for (const h of pts.slice(1)) { const H = hourAngle(h); span += ((H - prev + 540) % 360) - 180; prev = H; }
  const shape = err <= 3 ? 40 : err <= 6 ? 25 : err <= 10 ? 10 : 0, zp = zen <= 4 ? 20 : zen <= 8 ? 10 : 0, dir = span > 20 ? 20 : 0, ext = Math.abs(span) >= 300 ? 20 : Math.abs(span) >= 180 ? 12 : Math.abs(span) >= 90 ? 5 : 0;
  return {err, zen, span, score: shape + zp + dir + ext}; }
const UIX = {ko: {start: "시험 시작 (14분)", left: "남은 시간", over: "시간이 끝났습니다", clear9: "가리킨 것 지우기", clear10: "그린 길 지우기",
                  p9: "9번 — 가리킨 곳", t10: "10번 — 손으로 그린 길", none9: "‘가리키기’로 하늘을 한 번 클릭하세요.", none10: "‘손으로 그리기’로 하늘에 끌어서 그리세요. 움직이는 방향대로 그리세요."},
             en: {start: "Start (14 min)", left: "Time left", over: "Time is up", clear9: "Clear pointing", clear10: "Clear the path",
                  p9: "Question 9 — where you pointed", t10: "Question 10 — the path you swept", none9: "Click the sky once with ‘Point’.", none10: "Drag across the sky with ‘Trace by hand’, in the direction the star moves."}};
function fmtAA(h) { const [a, z] = A.altaz(h); return (LANGF() === "ko" ? "방위각 " : "azimuth ") + z.toFixed(0) + "°, " + (LANGF() === "ko" ? "고도 " : "altitude ") + a.toFixed(0) + "°"; }
function skySheet(host, lang) { LANGF = lang;
  const box = document.createElement("div"); host.appendChild(box);
  SKY = NightSky.create({el: box, site: SITE, start: [2014, 11, 27, START], look: {az: 150, alt: 25, fov: 110}, lang, skyline, overcast: true,
    tools: ["look", "point", "trace", "hand"],
    ground: {sea: [105, 235], lights: [[250, 12], [262, 7], [95, 9], [80, 5], [170, 3], [150, 2]], domes: [[300, 0.7, 10], [255, 0.5, 6], [90, 0.4, 6]]},
    onPoint(p) { pts = [{h: p.h}]; save(); sync(); },
    onTrace(list) { traces = [list]; save(); sync(); },
    drawOver: overlay});
  const ctl = document.createElement("div"); ctl.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px";
  const b1 = document.createElement("button"), b2 = document.createElement("button"), b3 = document.createElement("button"), tm = document.createElement("span");
  for (const b of [b1, b2, b3]) b.className = "cr-btn", b.style.cssText = "width:auto;margin:0;padding:6px 12px";
  tm.style.cssText = "font:600 13px ui-monospace,Consolas,monospace;color:#f3d58a;margin-left:6px";
  const info = document.createElement("div"); info.style.cssText = "margin-top:8px;font-size:12.8px;color:#c3cbd2;line-height:1.7";
  ctl.append(b1, b2, b3, tm); host.append(ctl, info);
  let tEnd = 0;
  b1.onclick = () => { SKY.setTime(START); tEnd = performance.now() + 14 * 60000; };
  b2.onclick = () => { pts = []; save(); sync(); }; b3.onclick = () => { traces = []; save(); sync(); };
  setInterval(() => { const u = UIX[lang()]; if (!tEnd) return; const s = Math.max(0, Math.round((tEnd - performance.now()) / 1000));
    tm.textContent = s ? u.left + " " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : u.over; tm.style.color = s < 60 ? "#ff8a70" : "#f3d58a"; }, 250);
  function sync() { const u = UIX[lang()];
    SKY.setPoints(pts.map((p) => ({h: p.h, n: "9"}))); SKY.setTraces(traces.map((t) => ({pts: t, label: "10"})));
    info.innerHTML = "<b style='color:#f3d58a'>" + u.p9 + "</b>: " + (pts.length ? fmtAA(pts[0].h) : u.none9) + "<br><b style='color:#f3d58a'>" + u.t10 + "</b>: " +
      (traces.length ? (lang() === "ko" ? "점 " : "") + traces[0].length + (lang() === "ko" ? "개로 그렸습니다." : " points drawn.") : u.none10); }
  function build() { const u = UIX[lang()]; b1.textContent = u.start; b2.textContent = u.clear9; b3.textContent = u.clear10; SKY.lang(); sync(); }
  build();
  return {lang: build, show: SKY.show}; }
/* the solution on the sky: the belt's culmination point, and the diurnal circle through the zenith */
function overlay(g, V) { if (!solOn) return; const L = LANGF();
  const circ = []; for (let H = 0; H <= 360; H += 3) { const d = PHI * DEG, h = H * DEG, p = PHI * DEG;
    const alt = Math.asin(Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(h)), az = Math.atan2(-Math.cos(d) * Math.sin(h), Math.sin(d) * Math.cos(p) - Math.cos(d) * Math.sin(p) * Math.cos(h));
    circ.push(V.proj(A.hvec(alt / DEG, az / DEG))); }
  g.strokeStyle = "rgba(255,210,90,0.9)"; g.lineWidth = 2; g.setLineDash([7, 5]); g.beginPath(); let on = false;
  for (const p of circ) { if (!p) { on = false; continue; } on ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); on = true; } g.stroke(); g.setLineDash([]);
  /* arrows: westward through the zenith */
  for (let k = 0; k < circ.length - 1; k += 10) { const a = circ[k], b = circ[k + 1]; if (!a || !b) continue; const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / l, uy = (b[1] - a[1]) / l;
    g.fillStyle = "rgba(255,210,90,0.95)"; g.beginPath(); g.moveTo(b[0] + ux * 7, b[1] + uy * 7); g.lineTo(b[0] - ux * 6 - uy * 6, b[1] - uy * 6 + ux * 6); g.lineTo(b[0] - ux * 6 + uy * 6, b[1] - uy * 6 - ux * 6); g.fill(); }
  const lab = (h, t, c) => { const p = V.proj(h); if (!p) return; g.fillStyle = c; g.beginPath(); g.arc(p[0], p[1], 5, 0, 7); g.fill(); g.font = "bold 13px 'Segoe UI',sans-serif"; g.fillText(t, p[0] + 9, p[1] - 8); };
  lab(T9, (L === "ko" ? "9: 오리온 벨트 남중 (정남, 고도 " : "9: belt culminates (due south, altitude ") + ALT9.toFixed(0) + "°)", "#ff8a70");
  lab(POLE, L === "ko" ? "천구 북극 (고도 51.9°)" : "north celestial pole (altitude 51.9°)", "#9fd0ff");
  lab(ZEN, L === "ko" ? "천정" : "zenith", "#ffd25a");
  lab(A.hvec(PHI - R10, 0), (L === "ko" ? "10: 아래 남중 (정북, 고도 " : "10: lower culmination (due north, altitude ") + (PHI - R10).toFixed(1) + "°)", "#ffd25a"); }

/* when the belt actually culminates that night */
function beltTransit() { let J = A.jdUT(2014, 11, 27, 12 - SITE.tz);
  for (let i = 0; i < 3; i++) { const lst = A.norm360(A.gmstDeg(J) + SITE.lon), d = ((BELT_RA - lst + 540) % 360) - 180; J += d / 360.9856 ; }
  const h = ((J + 0.5 + SITE.tz / 24) % 1) * 24; return Math.floor(h) + ":" + String(Math.round((h % 1) * 60)).padStart(2, "0"); }
const TRANSIT = beltTransit();
function grade(L) { const ko = L === "ko", out = [];
  if (pts.length) { const d = A.sep(pts[0].h, T9); out.push((ko ? "9번: 정답에서 " : "Question 9: ") + d.toFixed(1) + (ko ? "° 떨어짐 " : "° from the answer ") + (d <= 4 ? "✓" : d <= 8 ? "△" : "✗")); }
  else out.push(ko ? "9번: 가리킨 것이 없습니다." : "Question 9: nothing pointed at.");
  const j = judge10(traces[0]);
  if (j) out.push((ko ? "10번: 원과의 평균 차 " : "Question 10: mean distance from the circle ") + j.err.toFixed(1) + "°, " + (ko ? "천정에서 " : "closest to the zenith ") + j.zen.toFixed(1) + "°, " +
    (j.span > 20 ? (ko ? "방향 맞음(서쪽으로)" : "direction right (westwards)") : (ko ? "방향 틀림 또는 너무 짧음" : "direction wrong or too short")) + ", " + (ko ? "그린 범위 " : "extent ") + Math.abs(j.span).toFixed(0) + "° → " +
    (ko ? "HaslaLab 자체 점검 " : "HaslaLab self-check ") + j.score + "/100");
  else out.push(ko ? "10번: 그린 길이 없습니다." : "Question 10: no path drawn.");
  return out.join("<br>"); }

ChartRound.page({
  key: "hl-apao2014-o", assets: "",
  title: {ko: "APAO 2014 관측 라운드 — 흐린 하늘 (9–10번)", en: "APAO 2014 observational round — cloudy sky (9–10)"},
  sub: {ko: "제10회 아시아·태평양 천문 올림피아드 · 러시아 이르쿠츠크–리스트뱐카 · 2014년 11월 27일 밤, 바이칼 호숫가 · 구름 낀 하늘 · 맨눈과 손으로만 · 전체 14분",
        en: "X Asian-Pacific Astronomy Olympiad · Irkutsk–Listvyanka, Russia · the night of 27 November 2014, on the Baikal shore · overcast · eyes and hands only · 14 minutes for all"},
  docTitle: {ko: "APAO 2014 관측 라운드 — 흐린 하늘 · HaslaLab", en: "APAO 2014 observational round — cloudy sky · HaslaLab"},
  solTitle: {ko: "HaslaLab 해답 (공식 해답은 공개되지 않음)", en: "HaslaLab's solution (no official solution was published)"},
  about: {ko: "리스트뱐카(북위 51°51′, 동경 104°53′)의 바이칼 호숫가, 2014년 11월 27일 21:00(UT+8)의 하늘을 계산해 두고 그 위를 구름이 덮었습니다. 별은 보이지 않으니 하늘의 좌표를 머릿속에서 그려 손으로 보여 주어야 합니다. 시험의 11번(호숫가 불빛 사진)과 12번(망원경으로 건물 창문의 숫자 읽기)은 그 자리의 풍경과 시설이 있어야 하는 문제라 싣지 않았습니다. 공식 해답이 공개되지 않아 해답과 점검 점수는 HaslaLab이 정했습니다.",
          en: "The sky over the Baikal shore at Listvyanka (51°51′ N, 104°53′ E) at 21:00 (UT+8) on 27 November 2014 is computed and then covered with cloud. No star shows, so you must picture the coordinates of the sky and show them with your hand. Questions 11 (a photo of the lights on the embankment) and 12 (reading numbers in a window through a telescope) need the place itself and are left out. No official solution was published; the solution and the self-check scores are HaslaLab's."},
  maps: {sky: {name: {ko: "하늘", en: "Sky"}, custom: skySheet}},
  tasks: [{
    id: "9–10", name: {ko: "흐린 하늘 — 맨눈 관측", en: "Cloudy sky — naked eye"},
    lead: {ko: "하늘은 구름으로 덮여 있습니다. 손으로만 답합니다.", en: "The sky is overcast. Answer with your hand only."},
    maps: ["sky"],
    parts: [
      {id: "9", ko: "<b>오리온.</b> 오리온 벨트가 남중하는 하늘의 방향을 손으로 가리키세요(‘가리키기’로 한 번 클릭).", en: "<b>Orion.</b> By hand, point the direction to the sky where Orion's Belt culminates (one click with ‘Point’)."},
      {id: "10", ko: "<b>일주 운동.</b> 천정을 지날 수 있는 별의 일주 경로를 손으로 보여 주세요(‘손으로 그리기’로 별이 움직이는 방향대로 끌어서 그리기).", en: "<b>Diurnal motion.</b> Show by your hand the diurnal way of a star that may pass through the zenith (drag with ‘Trace by hand’, in the direction the star moves)."}],
    fields: [["note", {ko: "메모 (시험관에게 할 설명)", en: "Notes (what you would tell the examiner)"}]],
    solNote: {ko: "공식 해답이 공개되지 않은 문제입니다. 해답을 여는 동안 하늘에 답이 겹쳐 그려지고, 아래 점검 점수는 HaslaLab이 정한 기준입니다.", en: "No official solution was published. While the solution is open the answers are drawn on the sky; the self-check scores below use HaslaLab's own scheme."},
    key: [
      ["9", {ko: "정남(방위각 180°), 고도 ≈ " + ALT9.toFixed(0) + "°. 남중 고도 = 90° − φ + δ = 90° − 51.9° + (−1.2°). 벨트는 천구 적도 위에 있으므로 천구 적도가 자오선과 만나는 점을 가리키면 됩니다. 이날 실제 남중은 자정을 넘긴 현지 시각 " + TRANSIT + "쯤입니다(질문은 시각과 상관없이 방향을 묻습니다).",
              en: "Due south (azimuth 180°), altitude ≈ " + ALT9.toFixed(0) + "°: culmination altitude = 90° − φ + δ = 90° − 51.9° + (−1.2°). The belt lies on the celestial equator, so point where the equator crosses the meridian. That night it actually culminated after midnight, at about " + TRANSIT + " local time (the question asks only for the direction)."}],
      ["10", {ko: "적위 δ = φ = +51.9°인 별입니다. 천구 북극(정북, 고도 51.9°)을 중심으로 각반지름 90° − φ = 38.1°인 원을 그립니다. 위쪽 남중은 천정, 아래쪽 남중은 정북 고도 13.7°이므로 지지 않는 주극성입니다. 북쪽을 보고 서면 시계 반대 방향으로 돌고, 천정에서는 동쪽에서 서쪽으로 지나갑니다.",
               en: "A star of declination δ = φ = +51.9°. Draw a circle of angular radius 90° − φ = 38.1° around the north celestial pole (due north, altitude 51.9°). Its upper culmination is the zenith and its lower culmination is 13.7° above the north point, so it never sets. Facing north it turns anticlockwise, crossing the zenith from east to west."}],
      ["점검 · check", (L) => grade(L)]],
    sol: []
  }],
  onSol(v) { solOn = v; if (SKY) SKY.solve(v); }
});
</script>
