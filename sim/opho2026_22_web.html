  /* the look of opho.physoly.org (2026): near-black ground, lime accent, Helvetica + Roboto Mono */
  :root{--bg:#161512;--surface:#1c1717;--card:#1f1b1a;--line:rgba(255,255,255,.12);--fg:#fff;--dim:rgba(255,255,255,.62);

  body{font:400 14px/1.55 var(--sans);

       padding:10px 18px;font:500 14px var(--sans);cursor:pointer;width:100%;margin-top:10px}

  .row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{width:auto;flex:1}
  .hint{color:var(--faint);font-size:12px;line-height:1.55;margin:10px 0 0}
  .out{width:100%;min-height:220px;max-height:460px;overflow:auto;background:#100d0c;border:1px solid var(--line);border-radius:6px;
       color:#e9f5dc;font:400 12.5px/1.55 var(--mono);padding:10px 12px;white-space:pre;margin:0}

<body>
<div class="glow"></div>
<div class="wrap">
  <div class="top">
    <div><span class="eyebrow" data-t="eb"></span><h1 data-t="h1"></h1><p class="lead" data-t="lead"></p></div>
    <div class="lang"><button id="lang-ko" class="on">한국어</button><button id="lang-en">English</button></div>
  </div>

  <div class="grid">
    <div class="card hi">
      <span class="tag">Input</span><h2 data-t="inT"></h2>
      <div class="seg"><button id="m0" data-t="m0"></button><button id="m1" data-t="m1"></button></div>
      <div id="nbox">
        <div class="fld"><label data-t="nb"></label><input id="nb" value="1.70"></div>
        <div class="fld"><label data-t="nu"></label><input id="nu" value="1.60"></div>
      </div>

      <canvas id="plot"></canvas>
    </div>
  </div>
  <p class="foot" data-t="foot"></p>

<script>
"use strict";
/* a small dark plot, in the colours of the OPhO site */
function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(r))), m=r/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function fmtTick(v,st){ const d=Math.max(0,-Math.floor(Math.log10(st)+1e-9)); return (Math.abs(v)<st/1e6?0:v).toFixed(Math.min(6,d)); }
function plotXY(cv,series,o){
  o=o||{}; const dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth||800, H=Math.round(W*(o.aspect||0.5));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#100d0c"; c.fillRect(0,0,W,H);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const s of series) for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)) continue;
    x0=Math.min(x0,s.x[i]); x1=Math.max(x1,s.x[i]); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  if(!isFinite(x0)){x0=0;x1=1;y0=0;y1=1;}
  if(o.xlim){x0=o.xlim[0];x1=o.xlim[1];} if(o.ylim){y0=o.ylim[0];y1=o.ylim[1];}
  if(x1<=x0){x1=x0+1;} if(y1<=y0){y0-=0.5;y1+=0.5;}
  if(!o.ylim){ const p=(y1-y0)*0.06; y0-=p; y1+=p; }
  const L=58,R=14,T=14,B=38, pw=W-L-R, ph=H-T-B;
  if(o.equal){ const sx=(x1-x0)/pw, sy=(y1-y0)/ph, s=Math.max(sx,sy); x1=x0+s*pw; y1=y0+s*ph; }
  const X=v=>L+pw*(v-x0)/(x1-x0), Y=v=>T+ph*(1-(v-y0)/(y1-y0));
  c.font="11px 'Roboto Mono',monospace"; c.lineWidth=1;
  const sx=niceStep((x1-x0)/8), sy=niceStep((y1-y0)/6);
  c.strokeStyle="rgba(255,255,255,.08)"; c.fillStyle="rgba(255,255,255,.6)";
  c.textAlign="center"; c.textBaseline="top";
  for(let v=Math.ceil(x0/sx)*sx;v<=x1+1e-12;v+=sx){ c.beginPath(); c.moveTo(X(v),T); c.lineTo(X(v),T+ph); c.stroke(); c.fillText(fmtTick(v,sx),X(v),T+ph+5); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=Math.ceil(y0/sy)*sy;v<=y1+1e-12;v+=sy){ c.beginPath(); c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); c.stroke(); c.fillText(o.logy?"1e"+fmtTick(v,sy):fmtTick(v,sy),L-6,Y(v)); }
  c.strokeStyle="rgba(255,255,255,.28)"; c.strokeRect(L,T,pw,ph);
  c.fillStyle="rgba(255,255,255,.75)"; c.textAlign="center"; c.textBaseline="alphabetic"; c.fillText(o.xl||"",L+pw/2,H-6);
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.fillText(o.yl||"",0,0); c.restore();
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  for(const s of series){ c.strokeStyle=c.fillStyle=s.color||"#a7e26e"; c.lineWidth=s.lw||1.4;
    if(s.mode==="dot"){ for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(s.y[i]):s.y[i]; c.beginPath(); c.arc(X(s.x[i]),Y(y),s.r||2.4,0,7); c.fill(); } }
    else{ c.beginPath(); let st=false; for(let i=0;i<s.x.length;i++){ const y=o.logy?Math.log10(Math.max(1e-300,s.y[i])):s.y[i]; if(!isFinite(y)){st=false;continue;} const px=X(s.x[i]),py=Y(y); st?c.lineTo(px,py):c.moveTo(px,py); st=true; } c.stroke(); } }
  c.restore();
  let ly=T+14; c.textAlign="left"; c.textBaseline="alphabetic";
  for(const s of series) if(s.label){ c.fillStyle=s.color||"#a7e26e"; c.fillRect(L+10,ly-8,10,3); c.fillStyle="rgba(255,255,255,.8)"; c.fillText(s.label,L+26,ly-3); ly+=15; }
  return {X,Y,L,T,pw,ph,x0,x1,y0,y1};
}
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download=name; a.click(); }

const T={
 ko:{eb:"OPhO 2026 · 이론 · 문제 22",h1:"아인슈타인 고리",
   lead:"작은 반구 홈이 파인 투명한 단위 구를 형광 염료로 물들이고, 홈에 ẑ 방향에서 자외선을 비춥니다. 굴절률 n_b(파란빛), n_u(자외선)를 넣으면 멀리 ẑ에 있는 카메라가 찍은 사진과, 중심에서의 거리 b에 따른 밝기 I(b)가 숫자로 나옵니다.",
   inT:"구와 카메라",m0:"문제의 구",m1:"n 직접 넣기",nb:"n_b (파란빛)",nu:"n_u (자외선)",exp:"노출 (상대)",db:"표의 b 간격",

   run:"사진 찍기 ↗",marks:"중심·경계 표시",

   outT:"카메라 사진",copy:"표 복사",csv:"CSV 내려받기",png:"사진 내려받기",

 en:{eb:"OPhO 2026 · Theory · Problem 22",h1:"Einstein Ring",
   lead:"A transparent unit sphere with a small hemispherical indent at ẑ is doped with fluorescent dye, and UV light shines on the indent from ẑ. Enter the indices n_b (blue) and n_u (UV); a camera far away along ẑ returns its picture and the brightness I(b) against the distance b from the centre, as numbers.",
   inT:"Sphere and camera",m0:"Problem's sphere",m1:"Set n yourself",nb:"n_b (blue)",nu:"n_u (UV)",exp:"exposure (rel.)",db:"table step in b",
   hidden:"The problem's sphere has hidden n_b and n_u; its picture is the one in the problem.",
   run:"Take the picture ↗",marks:"mark centre and boundary",
   help:"Hover over the picture to read b (sphere radius = 1) and the brightness there. I(b) in the table is the azimuthally averaged brightness, camera noise included. 1.01 ≤ n ≤ 3.",
   outT:"Camera picture",copy:"Copy table",csv:"Download CSV",png:"Download picture",
   ring:"ring (theory): b = ",noring:"no ring forms for these n",
   foot:"<b>Model</b> — UV enters through the indent and is bent by θ₀; only photons with sin θ₀ &gt; 1/n_u are trapped by total internal reflection, travel a long way and are absorbed (the absorption density P(r) ∝ g(r)/(r² sin θ) of the official solution). Blue light is emitted isotropically and only what leaves the sphere directly reaches the camera. Each pixel integrates P along the refracted ray traced back from the camera; the indent size (ε = 10⁻⁶) cuts off the divergence on the axis. The problem's picture corresponds to the official n_b = 1.900, n_u = 1.45. The organisers published no simulator for this problem, so HaslaLab built one."}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=i=>document.getElementById(i);
function applyLang(){ const d=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{ const k=e.dataset.t; if(d[k]!==undefined) e.innerHTML=d[k]; });
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":"";
  if(typeof onLang==="function") onLang(); }
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};

const S={mode:0,hid:{nb:1.900,nu:1.45},img:null,rows:[],I:null};
const EPS=1e-6, NR=600, W=480;
function gauss(){ let s=0; for(let i=0;i<6;i++) s+=Math.random(); return (s-3)/Math.sqrt(0.5); }
/* g(r): radial density of the trapped UV absorption points, from the indent's entry angles */
function gTable(nu){
  const g=new Float64Array(NR), dr=1/NR, NB=6000;
  for(let i=0;i<NB;i++){
    const bp=(i+0.5)/NB, w=2*bp/NB, th0=Math.asin(bp)-Math.asin(bp/nu), s0=Math.sin(th0);
    if(s0<=1/nu) continue;
    const c0=Math.cos(th0);
    for(let k=Math.floor(s0/dr);k<NR;k++){
      const ra=Math.max(k*dr,s0), rb=(k+1)*dr; if(rb<=s0) continue;
      g[k]+=w*(Math.sqrt(rb*rb-s0*s0)-Math.sqrt(ra*ra-s0*s0))/c0/dr;
    }
  }
  return g;
}
/* the refracted segment for image radius b, in the (u,z) plane */
function chord(b,nb){
  const z1=Math.sqrt(1-b*b), e=1/nb, k=1-e*e*(1-z1*z1), f=e*z1-Math.sqrt(k), d=[f*b, -e+f*z1];
  return {p:[b,z1],d,L:-2*(b*d[0]+z1*d[1])};
}
function profile(nb,nu){
  const g=gTable(nu), N=420, I=new Float64Array(N);
  for(let i=0;i<N;i++){
    const b=(i+0.5)/N; if(b>=0.999) continue;
    const c=chord(b,nb), M=1200, dl=c.L/M; let s=0;
    for(let j=0;j<M;j++){
      const ta=j*dl, tb=ta+dl, tm=ta+dl/2;
      const ua=c.p[0]+c.d[0]*ta, ub=c.p[0]+c.d[0]*tb, um=c.p[0]+c.d[0]*tm, zm=c.p[1]+c.d[1]*tm, r=Math.hypot(um,zm);
      if(r<1e-6) continue;
      const k=Math.min(NR-1,Math.floor(r*NR)); if(g[k]===0) continue;
      /* ∫ dl / max(|u|, ε) over the step, done exactly: the 1/|u| of P is only log-integrable across the axis */
      const A=Math.abs(ua), B=Math.abs(ub); let J;
      if(ua*ub<0) J=dl/Math.abs(ub-ua)*(Math.log(Math.max(A,EPS)/EPS)+Math.log(Math.max(B,EPS)/EPS)+2);
      else { const a=Math.max(A,EPS), bb=Math.max(B,EPS); J=Math.abs(bb-a)<1e-12?dl/a:dl*Math.log(bb/a)/(bb-a); }
      s+=g[k]/r*J;
    }
    I[i]=s;
  }
  return I;
}
function axisCross(b,nb){ return 1/(Math.sqrt(nb*nb-b*b)-Math.sqrt(1-b*b)); }
function ringEdges(nb,nu){   /* axisCross falls with b; the ring is where it lies in (1/n_u, 1) */
  const top=0.999999, solve=t=>{ let lo=0,hi=top; for(let k=0;k<60;k++){ const m=(lo+hi)/2; axisCross(m,nb)>t?lo=m:hi=m; } return (lo+hi)/2; };
  if(nu<=Math.SQRT2||axisCross(top,nb)>=1) return null;
  return [axisCross(0,nb)<=1?0:solve(1), axisCross(top,nb)>=1/nu?1:solve(1/nu)];
}
let REF=null;
function shoot(){
  const p=S.mode===0?S.hid:{nb:clamp($("nb")), nu:clamp($("nu"))};
  const expo=Math.max(0.1,Math.min(10,parseFloat($("expo").value)||1)), I=profile(p.nb,p.nu);
  /* exposure: the problem's sphere as in its photo; any other sphere is auto-exposed on its brightest part */
  const pc=J=>{ const a=[...J].filter((v,i)=>i>0.02*J.length&&i<0.99*J.length).sort((a,b)=>a-b); return a[Math.floor(0.99*(a.length-1))]; };
  const Iref=REF||(REF=profile(1.9,1.45)), band=[...Iref].filter((v,i)=>i>0.65*Iref.length&&i<0.95*Iref.length).sort((a,b)=>a-b);
  const ref=band[band.length>>1]/0.75*(S.mode===0?1:pc(I)/pc(Iref));
  const R=W*0.42, c=W/2, im=new ImageData(W,W), NB=150, sum=new Float64Array(NB), cnt=new Float64Array(NB);
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const b=Math.hypot(x+0.5-c,y+0.5-c)/R; let v=0;
    if(b<1){ const f=b*I.length, i0=Math.min(I.length-2,Math.floor(f)); v=(I[i0]+(I[i0+1]-I[i0])*(f-i0))/ref*expo; }
    v=Math.max(0,Math.min(1.2,v*(1+0.12*gauss())+0.025*Math.abs(gauss())));   /* shot noise and dark noise */
    const k=4*(y*W+x), q=Math.pow(Math.min(1,v),1.6);
    im.data[k]=Math.round(40*q); im.data[k+1]=Math.round(120*q); im.data[k+2]=Math.round(255*q); im.data[k+3]=255;
    const j=Math.floor(b*100); if(j<NB){sum[j]+=v;cnt[j]++;}
  }
  S.img=im; S.p=p; S.prof={b:[...sum].map((_,j)=>(j+0.5)/100),v:[...sum].map((s,j)=>cnt[j]?s/cnt[j]:0)};
  /* the table at the step asked for, from the same picture */
  const db=Math.max(0.002,Math.min(0.1,parseFloat($("db").value)||0.01)), bins={};
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){ const b=Math.hypot(x+0.5-c,y+0.5-c)/R; if(b>1.2) continue; const j=Math.floor(b/db), k=4*(y*W+x);
    const v=Math.pow(im.data[k+2]/255,1/1.6); (bins[j]=bins[j]||[0,0])[0]+=v; bins[j][1]++; }
  S.rows=Object.keys(bins).map(Number).sort((a,b)=>a-b).map(j=>[(j+0.5)*db,bins[j][0]/bins[j][1]]);
  $("out").textContent=text();
  if(S.mode===1){ const e=ringEdges(p.nb,p.nu); $("stat").textContent=e?T[lang].ring+e[0].toFixed(3)+" – "+e[1].toFixed(3):T[lang].noring; } else $("stat").textContent="";
  drawCam(); drawPlot();
}
const clamp=el=>{ const v=Math.max(1.01,Math.min(3,parseFloat(el.value)||1.5)); el.value=v; return v; };
const text=()=>"b, I\n"+S.rows.map(r=>r[0].toFixed(4)+", "+r[1].toFixed(4)).join("\n");
function drawCam(){
  const cv=$("cam"), ctx=cv.getContext("2d"), R=W*0.42, c=W/2; cv.width=W; cv.height=W;
  if(S.img) ctx.putImageData(S.img,0,0);
  $("out").style.maxHeight=Math.max(220,cv.clientHeight)+"px";
  if($("marks").checked){ ctx.strokeStyle="#e33"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(c,c,R,0,2*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c-7,c); ctx.lineTo(c+7,c); ctx.moveTo(c,c-7); ctx.lineTo(c,c+7); ctx.stroke(); }
}
function drawPlot(){ if(!S.prof) return; const k=S.prof.b.findIndex(b=>b>1.3);
  plotXY($("plot"),[{x:S.prof.b.slice(0,k),y:S.prof.v.slice(0,k),color:"#6ea8ff",label:"I(b)",lw:1.5}],{xl:"b",yl:"I",aspect:0.38,xlim:[0,1.3]}); }
function setMode(m){ S.mode=m; $("m0").className=m===0?"on":""; $("m1").className=m===1?"on":"";
  $("nbox").style.display=m===1?"":"none"; $("hid").style.display=m===0?"":"none"; }
$("m0").onclick=()=>{setMode(0);shoot();}; $("m1").onclick=()=>{setMode(1);shoot();};
$("run").onclick=shoot; $("marks").onchange=drawCam;
$("cam").addEventListener("mousemove",e=>{ const cv=$("cam"), r=cv.getBoundingClientRect();
  const b=Math.hypot((e.clientX-r.left)/r.width-0.5,(e.clientY-r.top)/r.height-0.5)/0.42;
  let v="—"; if(S.prof){ const j=Math.min(S.prof.v.length-1,Math.floor(b*100)); v=S.prof.v[j].toFixed(3); }
  $("hov").textContent="b = "+b.toFixed(3)+"   I ≈ "+v; });
$("copy").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(text());
$("csv").onclick=()=>S.rows.length&&download("einstein_ring_profile.csv",text(),"text/csv");
$("png").onclick=()=>{ const a=document.createElement("a"); a.href=$("cam").toDataURL("image/png"); a.download="einstein_ring.png"; a.click(); };
function onLang(){ if(S.mode===1&&S.p){ const e=ringEdges(S.p.nb,S.p.nu); $("stat").textContent=e?T[lang].ring+e[0].toFixed(3)+" – "+e[1].toFixed(3):T[lang].noring; } }
addEventListener("resize",drawPlot);
setMode(0); applyLang(); shoot();
</script>
  <script src="adfit.js"></script>
</body>
