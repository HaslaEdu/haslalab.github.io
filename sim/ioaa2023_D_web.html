"use strict";
/* IOAA 2023, Chorzów (Poland), data analysis: D1 the distance to the LMC from three detached eclipsing binaries and
   the surface brightness–colour relation, D2 the isolated black hole of OGLE-2011-BLG-0462 from HST astrometry.
   The sheet's own figures are the S_V – (V − K) plot, the lens geometry and the OGLE light curve; graph paper for
   the rest.  Answers are checked against the official solution and marking scheme. */
const EB = [["OGLE LMC-ECL-03160", 17.03, 37.42, 16.73, 14.10, 2.80, 4.23], ["OGLE LMC-ECL-10567", 24.60, 36.64, 16.15, 13.83, 1.41, 1.99],
            ["OGLE LMC-ECL-18365", 37.30, 15.94, 16.27, 14.01, 0.206, 0.188]];
const HST = [["2455765.2", "2.58 ± 0.13", "7.29 ± 0.16"], ["2455865.7", "2.32 ± 0.12", "5.44 ± 0.24"], ["2456179.7", "0.46 ± 0.14", "1.62 ± 0.08"],
             ["2456195.8", "0.88 ± 0.36", "1.56 ± 0.77"], ["2456426.2", "−1.02 ± 0.21", "−0.94 ± 0.12"], ["2456587.7", "−2.04 ± 0.07", "−1.88 ± 0.40"],
             ["2456956.6", "−4.54 ± 0.25", "−5.16 ± 0.29"], ["2457995.2", "−11.14 ± 0.12", "−15.14 ± 0.17"]];
const tabEB = [["source ID", "R₁ [R⊙]", "R₂ [R⊙]", "V₁₊₂ [mag]", "K₁₊₂ [mag]", "L₂/L₁ (V)", "L₂/L₁ (K)"]].concat(EB.map((r) => r.map(String)));
const tabHST = [["HJD", "E position (mas)", "N position (mas)"]].concat(HST);
/* checking typed answers */
const num = (s) => { const v = parseFloat(String(s ?? "").replace(",", ".").replace("−", "-")); return isFinite(v) ? v : null; };
const inR = (v, lo, hi, lo2, hi2) => v == null ? "" : (v >= lo && v <= hi ? " ✓" : lo2 != null && v >= lo2 && v <= hi2 ? " △" : " ✗");
const mine = (L) => L === "ko" ? " · 당신의 답 " : " · yours ";
const show = (A, k, L) => A[k] ? mine(L) + A[k] : "";

ChartRound.page({
  key: "hl-ioaa2023-d", assets: "ioaa2023_D/", calc: true,
  title: {ko: "IOAA 2023 자료 분석 — 대마젤란은하까지의 거리 (D1) · 고립된 블랙홀 (D2)", en: "IOAA 2023 data analysis — distance to the LMC (D1) · isolated black hole (D2)"},
  sub: {ko: "제16회 국제 천문·천체물리 올림피아드 · 폴란드 호주프 · 3시간 125점 · 시험지 그림, 밀리미터 모눈종이, 계산기, 작업표",
        en: "16th International Olympiad on Astronomy and Astrophysics · Chorzów, Poland · 3 hours, 125 points · the sheet's figures, millimetre graph paper, calculator, worksheet"},
  docTitle: {ko: "IOAA 2023 자료 분석 · HaslaLab", en: "IOAA 2023 data analysis · HaslaLab"},
  solTitle: {ko: "공식 해답", en: "Official solution"},
  about: {ko: "시험장 책상에 있던 것만 둡니다: 문제지의 표와 그림(S_V–(V−K) 그래프, 렌즈 기하, OGLE 광도 곡선), 밀리미터 모눈종이, 공학용 계산기, 작업표. S_V 그래프에는 자로 직접 선을 긋고, 모눈종이의 축 눈금도 직접 정합니다. 맞춤이나 계산은 해 주지 않습니다. 답의 ✓ 범위는 공식 채점 기준(μ의 3σ·5σ)에서 가져왔고, 기준이 없는 값(거리, 오차, θ_E, 질량)은 공식 답의 오차 범위를 HaslaLab이 ✓ 범위로 썼습니다.",
          en: "Only what was on the examination desk: the sheet's tables and figures (the S_V – (V − K) plot, the lens geometry, the OGLE light curve), millimetre graph paper, a scientific calculator and a worksheet. Rule your own line on the S_V plot and choose your own scales on the paper; nothing is fitted or computed for you. The ✓ ranges follow the official marking scheme (3σ and 5σ for μ); where it gives none (distance, errors, θ_E, mass), HaslaLab uses the official answer's quoted uncertainty."},
  maps: {sv: {w: 990, h: 760, img: "sv.png", name: {ko: "S_V – (V−K) 그래프", en: "S_V – (V − K) plot"}, note: {ko: "문제지 그림: 자로 가장 잘 맞는 직선을 그으세요", en: "The sheet's figure: rule the best-fit line"}},
         g1: {name: {ko: "모눈종이 (D1)", en: "Graph paper (D1)"}, paper: {w_mm: 180, h_mm: 200, title: "IOAA 2023 · D1"}},
         lc: {w: 900, h: 519, img: "lc.png", name: {ko: "OGLE 광도 곡선", en: "OGLE light curve"}},
         pd: {name: {ko: "(d) 위치–시간", en: "(d) Position vs time"}, paper: {w_mm: 180, h_mm: 250, title: "IOAA 2023 · D2 (d)"}},
         pf: {name: {ko: "(f) 휨–u", en: "(f) Deflection vs u"}, paper: {w_mm: 180, h_mm: 150, title: "IOAA 2023 · D2 (f)"}},
         pg: {name: {ko: "(g) 휨–u/(u²+2)", en: "(g) Deflection vs u/(u²+2)"}, paper: {w_mm: 180, h_mm: 150, title: "IOAA 2023 · D2 (g)"}}},
  tasks: [{
    id: "D1", marks: 50, name: {ko: "대마젤란은하까지의 거리", en: "Distance to the Large Magellanic Cloud"},
    lead: {ko: "2019년 폴란드 천문학자들이 이끈 국제 공동 연구는 대마젤란은하(LMC)의 식쌍성 20개까지의 거리로 LMC까지의 거리를 매우 정밀하게 쟀습니다. 별의 표면 밝기 S_V = m_V + 5 log₁₀ θ(θ는 각지름, mas)는 각지름 1 mas인 별의 등급으로, G·K형 거성에서는 색지수 (m_V − m_K)와 경험적 관계가 있습니다(그래프). 측광·분광으로 얻은 반지름을 이 관계가 주는 각지름과 비교하면 식쌍성까지의 거리가 나옵니다. R₁, R₂는 두 별의 반지름, V₁₊₂, K₁₊₂는 쌍성 전체의 등급, L₂/L₁은 두 밴드에서의 광도비입니다.",
           en: "In 2019 an international collaboration led by Polish astronomers measured the distance to the Large Magellanic Cloud with very high precision from 20 eclipsing binaries in it. The surface brightness S_V = m_V + 5 log₁₀ θ (θ the angular diameter in mas) is the magnitude of a star 1 mas across; for G and K giants it follows an empirical relation with the colour (m_V − m_K), shown in the plot. Comparing the radii from photometry and spectroscopy with the angular diameters from this relation gives the distance to an eclipsing binary. R₁ and R₂ are the radii of the components, V₁₊₂ and K₁₊₂ the total magnitudes of the binary, L₂/L₁ the luminosity ratio in each band."},
    maps: ["sv", "g1"],
    parts: [{h: {ko: "식쌍성 세 개", en: "Three detached eclipsing binaries"}, table: tabEB},
      {id: "1", mk: "50", ko: "위 방법을 세 식쌍성에 적용해 LMC까지의 거리를 킬로파섹으로 구하고 전체 오차를 어림하세요. S_V–(m_V − m_K) 관계의 맞춤은 모든 측정에 한꺼번에 최대 0.8%의 치우침을 줍니다. 계산에서 유효 숫자 셋 이상, 소수점 아래 둘째 자리까지 남기고, 성간 소광은 무시하며 LMC의 각크기는 작다고 둡니다.",
       en: "Apply the method to the three binaries and calculate the distance to the LMC in kiloparsecs. Estimate the total error. The fit of the S_V – (m_V − m_K) relation contributes a bias of up to 0.8% to all measurements simultaneously. Keep at least three significant figures and two decimal places; neglect interstellar extinction and assume the angular size of the LMC is small."}],
    table: {title: {ko: "작업표 (별마다)", en: "Worksheet (per component)"}, head: ["component", "R (R⊙)", "m_V", "m_K", "m_V − m_K", "S_V", "θ (mas)", "D (kpc)"],
            init: EB.flatMap((r) => [[r[0].slice(5) + " 1", String(r[1])], [r[0].slice(5) + " 2", String(r[2])]])},
    fields: [["D", {ko: "LMC까지 거리 D (kpc)", en: "Distance D (kpc)"}], ["st", {ko: "통계 오차 (kpc)", en: "Statistical error (kpc)"}], ["sy", {ko: "계통 오차 (kpc)", en: "Systematic error (kpc)"}]],
    solNote: {ko: "공식 해답과 채점 기준입니다.", en: "From the official solution and marking scheme."},
    key: [["m", {ko: "m₁ = m₁₊₂ + 2.5 log(1 + L₂/L₁), m₂ = m₁₊₂ + 2.5 log(1 + L₁/L₂). 18365의 예: V₁ = 16.47, K₁ = 14.20, V₂ = 18.19, K₂ = 16.01 (색 2.27, 2.18).",
                 en: "m₁ = m₁₊₂ + 2.5 log(1 + L₂/L₁), m₂ = m₁₊₂ + 2.5 log(1 + L₁/L₂). For 18365: V₁ = 16.47, K₁ = 14.20, V₂ = 18.19, K₂ = 16.01 (colours 2.27, 2.18)."}],
          ["S_V", {ko: "최소제곱 맞춤 S_V = 1.346 (V − K) + 2.629 (기울기 ±0.017, 절편 ±0.04). 자로 그은 선이나 멀리 떨어진 두 점 (2.07, 5.41), (2.71, 6.28)로도 0.01등급 안에서 같습니다(기울기 1.36, 절편 2.60).",
                   en: "Least-squares fit S_V = 1.346 (V − K) + 2.629 (slope ±0.017, intercept ±0.04). A ruled line, or two far-apart points (2.07, 5.41) and (2.71, 6.28) (slope 1.36, intercept 2.60), agree to 0.01 mag."}],
          ["D", (L, A) => (L === "ko" ? "θ = 10^(0.2 (S_V − m_V)) mas, D = 9.30×10⁻³ R/θ kpc (R in R⊙). 여섯 별: 49.56, 49.30 (03160), 49.33, 49.07 (10567), 49.70, 49.75 (18365) kpc → 평균 49.45 kpc"
                                 : "θ = 10^(0.2 (S_V − m_V)) mas, D = 9.30×10⁻³ R/θ kpc (R in R⊙). Six components: 49.56, 49.30 (03160), 49.33, 49.07 (10567), 49.70, 49.75 (18365) kpc → mean 49.45 kpc")
            + show(A, "D1.D", L) + inR(num(A["D1.D"]), 49.0, 49.9)],
          ["±", (L, A) => (L === "ko" ? "통계: s = 0.24 kpc, s/√6 = 0.09 kpc (쌍성 세 개의 평균으로 s/√3 = 0.13 kpc도 인정). 계통: 0.008 × 49.45 = 0.40 kpc. 답: 49.45 ± 0.09 ± 0.40 kpc — 오차는 S_V 관계의 정밀도가 좌우합니다."
                                 : "Statistical: s = 0.24 kpc, s/√6 = 0.09 kpc (or, from the three binaries' means, s/√3 = 0.13 kpc). Systematic: 0.008 × 49.45 = 0.40 kpc. Result: 49.45 ± 0.09 ± 0.40 kpc, dominated by the precision of the S_V relation.")
            + show(A, "D1.st", L) + inR(num(A["D1.st"]), 0.07, 0.15) + show(A, "D1.sy", L) + inR(num(A["D1.sy"]), 0.37, 0.43)],
          ["∑", {ko: "등급 식 4, 여섯 별의 V·K 6, S_V 추세선 7, S_V 6, 각지름 식 2, 각지름 6, 거리 식 4, 거리 6, 최종 거리 3, 통계 오차 3, 계통 오차 3 (50점).",
                   en: "Magnitude formulas 4, V and K of six components 6, the S_V trend line 7, S_V for six 6, angular-diameter formula 2, six diameters 6, distance formula 4, six distances 6, final distance 3, statistical error 3, systematic error 3 (50 points)."}]],
    sol: []
  }, {
    id: "D2", marks: 75, name: {ko: "고립된 블랙홀", en: "Isolated black hole"},
    lead: {ko: "2022년 두 연구진이 미시중력렌즈 사건 OGLE-2011-BLG-0462에서 고립된 블랙홀을 찾았다고 발표했습니다. 허블 우주 망원경 자료로 그 결과를 다시 얻어 봅니다. 아인슈타인 반지름 θ_E = √(4GM/c² · (D_s − D_ℓ)/(D_s D_ℓ)), D_s ≈ 8 kpc. 렌즈와 광원이 θ = u θ_E만큼 떨어져 있으면 두 상이 렌즈에서 θ± = ½(u ± √(u² + 4)) θ_E에 생기고, 밝기 배율은 A± = ½((u² + 2)/(u√(u² + 4)) ± 1)입니다.",
           en: "In 2022 two groups reported an isolated black hole from the microlensing event OGLE-2011-BLG-0462. Reproduce their result from Hubble Space Telescope data. The angular Einstein radius is θ_E = √(4GM/c² · (D_s − D_ℓ)/(D_s D_ℓ)) with D_s ≈ 8 kpc. With lens and source θ = u θ_E apart, two images form at θ± = ½(u ± √(u² + 4)) θ_E from the lens, magnified by A± = ½((u² + 2)/(u√(u² + 4)) ± 1)."},
    maps: ["pd", "pf", "pg", "lc"],
    parts: [{h: {ko: "사건의 기하 (L 렌즈, S 광원, A± 두 상, 점선 원 = 아인슈타인 반지름)", en: "Geometry (L lens, S source, A± images, dashed circle = one Einstein radius)"}, img: "lens.png"},
      {id: "a", mk: "2", ko: "질량 1 M⊙, 거리 1 kpc인 렌즈의 아인슈타인 반지름을 mas로 구하세요.", en: "Calculate the angular Einstein radius in mas for a lens of 1 M⊙ at 1 kpc."},
      {id: "b", mk: "8", ko: "두 상은 분해되지 않고 밝기로 가중한 중심(centroid)만 잴 수 있습니다. 렌즈에 대한 중심의 각거리 θ_c를 u와 θ_E로 나타내세요.", en: "Only the brightness-weighted centroid of the two images is measured. Derive the angular separation θ_c of the centroid from the lens as a function of u and θ_E."},
      {id: "c", mk: "4", ko: "광원의 휨 Δθ(중심과 렌즈가 없을 때 광원 위치의 차)를 u와 θ_E로 나타내세요. u ≈ 0이면 휨은 얼마입니까?", en: "Derive the source deflection Δθ (centroid minus unlensed source position) as a function of u and θ_E. What is it when u ≈ 0?"},
      {h: {ko: "광도 곡선과 허블 위치 측정", en: "Light curve and HST astrometry"}, ko: "아인슈타인 시간 t_E = 247일, 극대 2011년 7월 21일(HJD 2455763), u₀ ≈ 0. 광도 곡선은 ‘OGLE 광도 곡선’ 탭에 있습니다. 아래 표는 배경 천체에 대한 광원의 동·북 위치입니다.",
       en: "Einstein timescale t_E = 247 days, peak on 21 July 2011 (HJD 2455763), u₀ ≈ 0. The light curve is in the ‘OGLE light curve’ tab. The table gives the source position against background objects, East and North.", table: tabHST},
      {id: "d", mk: "10", ko: "동쪽과 북쪽 위치를 시간에 대해 그리세요.", en: "Plot the East and North positions against time."},
      {id: "e", mk: "8", ko: "관측된 움직임은 광원의 직선 고유 운동과 휨의 합입니다. 광원의 고유 운동(mas/년)과 그 오차를 동·북 방향으로 구하세요.", en: "The observed motion is the source's rectilinear proper motion plus the astrometric deflection. Calculate the proper motion (mas/yr) and its uncertainty, East and North."},
      {id: "f", mk: "20", ko: "고유 운동을 빼고 전체 휨을 u에 대해 계산해 그리세요(고유 운동의 오차는 무시).", en: "Subtract the proper motion, then calculate and plot the total deflection against u (neglect the uncertainty of the proper motion)."},
      {id: "g", mk: "16", ko: "자료로 θ_E와 그 오차를 구하세요(Δθ 식을 선형화하면 도움이 됩니다).", en: "Determine θ_E and its uncertainty from the data (linearising Δθ may help)."},
      {id: "h", mk: "7", ko: "미시중력렌즈 시차 π_E = (π_ℓ − π_s)/θ_E = 0.095 ± 0.009입니다. 렌즈의 질량(M⊙)과 오차를 구하세요.", en: "The microlensing parallax is π_E = (π_ℓ − π_s)/θ_E = 0.095 ± 0.009. Calculate the lens mass in M⊙ and its uncertainty."}],
    table: {title: {ko: "작업표 (관측 시기마다)", en: "Worksheet (per epoch)"}, head: ["HJD", "E", "σE", "N", "σN", "u", "Δθ_E", "Δθ_N", "Δθ", "σΔθ"],
            init: HST.map((r) => [r[0], r[1].split(" ± ")[0], r[1].split(" ± ")[1], r[2].split(" ± ")[0], r[2].split(" ± ")[1]])},
    fields: [["a", {ko: "(a) θ_E (mas)", en: "(a) θ_E (mas)"}], ["muE", "(e) μ_E (mas/yr)"], ["muN", "(e) μ_N (mas/yr)"], ["th", {ko: "(g) θ_E (mas)", en: "(g) θ_E (mas)"}], ["dth", {ko: "(g) θ_E 오차", en: "(g) θ_E error"}], ["M", "(h) M (M⊙)"]],
    solNote: {ko: "공식 해답과 채점 기준입니다.", en: "From the official solution and marking scheme."},
    key: [["a", (L, A) => "θ_E = √(4GM/(c² au) · (au/D_ℓ − au/D_s)) = 2.7 mas" + (L === "ko" ? " (10 m 망원경의 분해능 ≈ 14 mas보다 훨씬 작아 두 상은 분해되지 않음)" : " (far below the ≈ 14 mas resolution of a 10 m telescope, so the images are not resolved)") + show(A, "D2.a", L) + inR(num(A["D2.a"]), 2.6, 2.8)],
