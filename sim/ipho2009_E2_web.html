<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }

const $=id=>document.getElementById(id);
const d=()=>T[lang];
/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (bench cm unless marked)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const RAD=Math.PI/180, H0=5.0;
const lam=U(645,672)*1e-9;
const TRUE={

  L:Math.round(Math.random()<0.5?U(58,76):U(88,108)),   /* the mica's thickness written on its cylinder (µm) */
  dn:lam/(2*82e-6)*U(0.985,1.015),              /* the birefringence |n1 − n2|: what the problem is after */
  th0:U(-1.7,1.7),                              /* axis 1 of the mica from the nearest line of the cylinder's scale (deg) */
  t1:U(0.86,0.90), t2:U(0.80,0.85),             /* the mica absorbs the two axes a little differently */
  psiL:U(0,180), pol:U(0.55,0.8),               /* the laser: partially polarized, at an unknown angle */
  tp:0.80, leak:0.0012,                         /* a polarizer: along its (+) axis, across it */

/* ══════════════════════════════════════════════════════════════

const PARTS=["laser","mirror","pol1","mica","pol2","det","dmm","stickers"];

  laserOn:false, mh:TRUE.mh, mv:TRUE.mv,
  pv:{pol1:"+",pol2:"+"},                        /* which axis of each polarizer stands vertical */

  sticker:null,                                  /* the line you marked with a sticker, as a cylinder angle */
  range:"200m", disp:0, dispT:0 };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
const v3={ add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],

const rightOf=a=>[a[1],-a[0],0];
const centre=k=>[ST.pos[k].x,ST.pos[k].y,H0];
const APER={pol1:1.4,pol2:1.4,mica:0.6,det:0.3};

  const q=v3.add(p,v3.mul(d,t)), r=v3.sub(q,c0); return {t,q,h:v3.dot(r,rightOf(a)),v:r[2]}; }
/* the beam: from the laser, off the mirror, through whatever stands in its way */
function trace(){ const out={segs:[],chain:[],det:false,end:null};
  if(!has("laser")||!ST.laserOn) return out;
  const L=ST.pos.laser; let p=[L.x+6.5,L.y,H0], d=[1,0,0];
  if(has("mirror")){ const m=ST.pos.mirror, n=[Math.cos(ST.mh*RAD)*Math.cos(ST.mv*RAD),Math.sin(ST.mh*RAD)*Math.cos(ST.mv*RAD),Math.sin(ST.mv*RAD)], c=[m.x,m.y,H0], den=v3.dot(d,n);
    if(Math.abs(den)>1e-6){ const t=v3.dot(v3.sub(c,p),n)/den, q=v3.add(p,v3.mul(d,t)); if(t>0&&Math.hypot(...v3.sub(q,c))<1.25){ out.segs.push([p,q]); p=q; d=v3.sub(d,v3.mul(n,2*den)); } } }
  const hits=[]; for(const k of ONBEAM) if(has(k)&&ST.ax[k]!==undefined){ const h=cross(k,p,d); if(h&&Math.hypot(h.h,h.v)<APER[k]+(k==="det"?0:0.4)) hits.push([k,h]); }
  hits.sort((a,b)=>a[1].t-b[1].t);
  for(const [k,h] of hits){ if(k==="det"){ out.det=Math.hypot(h.h,h.v)<APER.det; out.segs.push([p,h.q]); return out; }

  out.end=v3.add(p,v3.mul(d,120)); out.segs.push([p,out.end]); return out; }

const C=(r,i)=>[r,i||0], cm=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]], ca=(a,b)=>[a[0]+b[0],a[1]+b[1]], cabs2=a=>a[0]*a[0]+a[1]*a[1];
function polJ(e,ang){ const c=Math.cos(ang*RAD), s=Math.sin(ang*RAD), ta=Math.sqrt(TRUE.tp), tl=Math.sqrt(TRUE.leak);

  const keep=ST.pos[k], kax=ST.ax[k]; ST.pos[k]={x:px,y:py}; if(sn) ST.ax[k]=sn.az; XF=v=>[v[0],v[1],(v[2]||0)+lift]; try{ drawLoose(k,null); } finally{ XF=null; if(keep) ST.pos[k]=keep; else delete ST.pos[k]; if(kax===undefined) delete ST.ax[k]; else ST.ax[k]=kax; } }
function drawRoom(){
  F([[-120,-0.6,-80],[220,-0.6,-80],[220,-0.6,120],[-120,-0.6,120]],"#2f353e",{n:[0,1,0],flat:true});
  obox([50,20,-1.5],[52,0,0],[0,21,0],[0,0,1.5],"#b98a55",{faceCol:n=>n[2]>0.5?"#c99a62":null});
  for(let x=5;x<100;x+=5) for(let y=5;y<40;y+=5) ocyl([x,y,0],Z3,0.01,0.18,"#7a5530",{seg:6});
  for(const [x,y] of [[2,3],[98,3],[2,38],[98,38]]) obox([x,y,-39],[1.5,0,0],[0,1.5,0],[0,0,36],"#8a8f96");
  F([[-120,-0.5,-75],[220,-0.5,-75],[220,80,-75],[-120,80,-75]],"#3a3f47",{n:Z3,flat:true}); }
let TR=null;
function drawBench(){ CAM.dpr=Math.min(window.devicePixelRatio||1,2)*S; begin3(); TR=trace();
  drawRoom(); for(const k of LOOSE) if(has(k)) drawLoose(k,k); drawBeam(TR); drawHand();
  ctx.fillStyle="#2a2d33"; ctx.fillRect(0,0,LW,LH); render3(ctx); }
/* ══════════════════════════════════════════════════════════════
   4.  PARTS BOX, LAYOUT, CLOSE-UPS
   ══════════════════════════════════════════════════════════════ */
const trayCv=$("tray"), trayCtx=trayCv.getContext("2d"), closeCv=$("closeCv"), closeCtx=closeCv.getContext("2d"), benchCtx=ctx;
const TRAY_LIST=PARTS, TROW=36;
let TRW=190, TRH=400, CLW=900, CLH=420, trayCells=[], tab="top", HIT=[];
const inHand=k=>hand&&hand.item===k;
const trayAvail=k=>!has(k)&&!inHand(k);
function icon(c,k){ const old=ctx; ctx=c; ctx.save(); ctx.scale(0.75,0.75);
  if(k==="laser"){ fillR(-17,-4,28,8,2,"#2a2d33"); fillR(11,-2,4,4,1,"#c9ced3"); circ(-12,0,1.5,"#e04b3c"); }
  else if(k==="mirror"){ fillR(-9,-11,18,18,2,"#2a2d33"); fillR(-7,-9,14,14,1,"#c9d6de"); fillR(-1.5,7,3,6,0,"#9aa1a8"); }
  else if(k==="pol1"||k==="pol2"){ fillR(-9,-12,18,20,1,"#f2f2ee","#999"); fillR(-6,-9,12,12,0,"rgba(60,60,70,.75)"); text(k==="pol1"?"1":"2",0,13,"#e8eef2",8,"center","700"); }
  else if(k==="mica"){ circ(0,-2,10,"#1b1d20"); circ(0,-2,6,"rgba(230,215,170,.8)"); fillR(-8,8,16,4,1,"rgba(200,225,235,.8)"); }
  else if(k==="det"){ fillR(-10,-8,20,16,2,"#2a2d33","#555"); circ(0,0,2.5,"#0d0e10","#888"); }
  else if(k==="dmm"){ fillR(-8,-13,16,26,2,"#e3b72d","#555"); fillR(-6,-10,12,6,1,"#9fae8f"); circ(0,4,4,"#1b1d20"); }
  else if(k==="stickers"){ fillR(-12,-8,24,16,1,"#f4f4f0","#999"); circ(-6,0,3,"#c0392b"); circ(0,0,3,"#2f8f4e"); circ(6,0,3,"#2b6cb0"); }
  ctx.restore(); ctx=old; }
function layout(){
  const w=cv.clientWidth||1000, dpr=Math.min(window.devicePixelRatio||1,2);
  S=w/LW; cv.width=Math.round(w*dpr); cv.height=Math.round(LH*S*dpr); cv.style.height=(LH*S)+"px"; benchCtx.setTransform(dpr*S,0,0,dpr*S,0,0);
  const tdpr=window.devicePixelRatio||1, tr=trayCv.parentElement.getBoundingClientRect();
  TRW=Math.max(150,Math.floor(tr.width-16)); TRH=TRAY_LIST.length*TROW+24+14*d().trayHelp.split("\n").length;
  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  CLW=Math.max(300,Math.floor(closeCv.parentElement.getBoundingClientRect().width-20)); CLH=Math.round(Math.max(400,CLW*0.52));
  closeCv.style.height=CLH+"px"; closeCv.width=Math.round(CLW*tdpr); closeCv.height=Math.round(CLH*tdpr); drawTray(); }
function drawTray(){ const dpr=window.devicePixelRatio||1, c=trayCtx, t=d();
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[]; let y=6; const wd=TRW-12;
  for(const k of TRAY_LIST){ const av=trayAvail(k), sel=inHand(k);
    c.fillStyle=av?"#1f242b":"#171a1e"; c.fillRect(6,y,wd,TROW-3); c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TROW-4);
    c.save(); c.globalAlpha=av?1:0.35; c.translate(24,y+(TROW-3)/2); icon(c,k); c.restore();
    c.font='11px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle"; c.fillStyle=av?"#e8eef2":"#868e96";
    c.fillText(itemName(k),44,y+12); c.font='9px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a"; c.fillText(av?t.trayTake:t.trayOut,44,y+25);
    trayCells.push([k,y,y+TROW-3]); y+=TROW; }
  c.font='10.5px "Malgun Gothic",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a"; t.trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14)); }
function setTab(k){ tab=k; renderTabs(); $("t-closecap").textContent=d().closeCap[tab]; }
function renderTabs(){ const box=$("tabs"); box.innerHTML=""; for(const k of ["top","mica"]){ const b=document.createElement("button"); b.textContent=d().tabs[k]; b.className=k===tab?"on":""; b.onclick=()=>setTab(k); box.appendChild(b); } }
const hitAdd=(k,x,y,w,h)=>HIT.push({k,x,y,w,h});
/* ── 1. the table from above ── */
function drawTop(){ const t=d(); ctx.fillStyle="#b98a55"; ctx.fillRect(0,0,CLW,CLH);
  const z=Math.min((CLW-20)/100,(CLH-20)/40), X=x=>10+x*z, Y=y=>10+y*z;
  ctx.fillStyle="#7a5530"; for(let x=5;x<100;x+=5) for(let y=5;y<40;y+=5){ ctx.beginPath(); ctx.arc(X(x),Y(y),1.2,0,7); ctx.fill(); }
  const tr=TR||trace(); ctx.strokeStyle="rgba(255,40,30,.9)"; ctx.lineWidth=1.6; for(const [p,q] of tr.segs){ ctx.beginPath(); ctx.moveTo(X(p[0]),Y(p[1])); ctx.lineTo(X(q[0]),Y(q[1])); ctx.stroke(); } ctx.lineWidth=1;
  for(const k of PARTS){ if(!has(k)) continue; const b=ST.pos[k], s=SIZE[k], on=ONBEAM.includes(k), ang=(k==="mirror"?ST.mh-90:ST.ax[k]!==undefined?ST.ax[k]:0)*RAD;
    ctx.save(); ctx.translate(X(b.x),Y(b.y)); ctx.rotate(ang); const col={laser:"#2a2d33",mirror:"#2a2d33",pol1:"#4a4d55",pol2:"#4a4d55",mica:"#1b1d20",det:"#2a2d33",dmm:"#e3b72d",stickers:"#f4f4f0"}[k];
    const w=k==="laser"?13*z:on?1*z:s[0]*z, h=k==="laser"?2.4*z:on?(k==="det"?4:4.4)*z:s[1]*z; fillR(-w/2,-h/2,w,h,2,col,"#333"); ctx.restore();
    let lab=t.items[k].split(" ")[0]; if(k==="pol1"||k==="pol2") lab+=" "+(ST.pv[k]==="+"?"(+)↕":"(−)↕"); text(lab,X(b.x),Y(b.y)-14,"#1b1d20",10,"center","700"); }
  text(tr.det?t.lab.detHit:t.lab.detMiss,CLW-10,CLH-10,tr.det?"#1b4d1b":"#7a1b1b",11,"right","700");
  text(t.lab.topHint,10,CLH-10,"#2a1d10",11,"left"); }
/* ── 2. the mica's cylinder from the side: 100 unnumbered lines, a fixed index, your sticker ── */
let MG={};
function drawMicaView(){ const t=d(); ctx.fillStyle="#e9e7e0"; ctx.fillRect(0,0,CLW,CLH);
  if(!has("mica")){ text(t.lab.noMica,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  /* the cylinder unrolled around the index: 40 lines either side */
  const cx=CLW/2, y0=CLH*0.30, h=CLH*0.36; const ppd=(CLW-40)/150;   /* pixels per degree */

  const grad=ctx.createLinearGradient(0,y0,0,y0+h); grad.addColorStop(0,"#3a3d42"); grad.addColorStop(0.5,"#1b1d20"); grad.addColorStop(1,"#3a3d42"); ctx.fillStyle=grad; ctx.fillRect(20,y0,CLW-40,h);
  for(let i=-60;i<160;i++){ const ang=i*3.6+ST.rot, k=((ang%360)+360)%360; let dd=((k-0+540)%360)-180; if(Math.abs(dd)>75) continue; const X=cx+dd*ppd;
    ctx.strokeStyle="#e8eef2"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(X,y0+h*0.12); ctx.lineTo(X,y0+h*0.55); ctx.stroke(); }
  if(ST.sticker!==null){ const k=(((ST.sticker+ST.rot)%360)+360)%360, dd=((k+540)%360)-180; if(Math.abs(dd)<75){ const X=cx+dd*ppd; circ(X,y0+h*0.72,7,"#c0392b","#7a1b1b"); } }
  ctx.fillStyle="#f2c14e"; ctx.beginPath(); ctx.moveTo(cx,y0-2); ctx.lineTo(cx-8,y0-16); ctx.lineTo(cx+8,y0-16); ctx.closePath(); ctx.fill(); ctx.strokeStyle="#f2c14e"; ctx.beginPath(); ctx.moveTo(cx,y0-2); ctx.lineTo(cx,y0+h+6); ctx.stroke();
  text(TRUE.L+" µm",28,y0+h-10,"#f2c14e",13,"left","700"); text(t.lab.index,cx,y0-24,"#555",11,"center");
  hitAdd("cyl",20,y0,CLW-40,h);
  /* sticker button */
  if(has("stickers")){ const bx=CLW-170, by=y0+h+18; fillR(bx,by,150,26,4,"#3a3d42","#111"); text(t.lab.stick,bx+75,by+13.5,"#e8eef2",11,"center","700"); hitAdd("stick",bx,by,150,26); }
  text(t.lab.micaHint,10,CLH-10,"#555",11,"left"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="mica") drawMicaView(); else drawTop(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   5.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ let id=pick3(p[0],p[1]); if(id&&LOOSE.includes(id)&&has(id)) return id;
  return [...LOOSE].reverse().find(o=>has(o)&&baseOf(o)&&inB(p,bbox(o),0.3))||null; }
let drag=null;
function cancelHand(){ const k=hand.item; if(hand.move&&hand.orig){ ST.pos[k]=hand.orig; if(hand.ax!==undefined) ST.ax[k]=hand.ax; ST.on.add(k); say("placed",itemName(k)); } else say("back",itemName(k)); hand=null; }
function takeUp(k){ const b=ST.pos[k]; hand={item:k,move:true,orig:{x:b.x,y:b.y},ax:ST.ax[k]}; ST.on.delete(k); delete ST.pos[k]; delete ST.ax[k]; if(k==="laser") ST.laserOn=false; say("picked",itemName(k)); return true; }
function drop(k,x,y,az){ ST.pos[k]={x,y}; if(az!==undefined) ST.ax[k]=az; else delete ST.ax[k]; ST.on.add(k); say(az!==undefined?"onBeam":"placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item;
    if(right){ cancelHand(); return; }
    const [x,y]=unP(p[0],p[1],1.5), sn=ONBEAM.includes(k)?snapBeam(x,y):null;
    if(sn){ drop(k,sn.x,sn.y,sn.az); hand=null; return; }
    if(!fits(k,x,y)){ say("noFit"); return; } drop(k,x,y); hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ if(k==="laser") ST.laserOn=false; ST.on.delete(k); delete ST.pos[k]; delete ST.ax[k]; say("back",itemName(k)); return; }
  takeUp(k); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.35,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }

cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(60,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&!hand.move&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ cancelHand(); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; if(hand&&hand.move) return; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });
closeCv.addEventListener("contextmenu",e=>e.preventDefault());

/* the close-ups: drag the mica's cylinder round; stick a sticker on the line at the index */
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const dx=cmouse[0]-cdrag.x; ST.rot=Math.round((cdrag.v-dx/MG.ppd*(e.shiftKey?0.2:1))*100)/100; });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), h=hitAt(p); if(e.button!==0||!h) return;
  if(h.k==="cyl"){ cdrag={x:p[0],v:ST.rot}; closeCv.setPointerCapture(e.pointerId); return; }
  if(h.k==="stick"){ ST.sticker=Math.round(-ST.rot/3.6)*3.6; say("stuck"); } });

/* ══════════════════════════════════════════════════════════════
   6.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let simT=0, rows=0;
function knob(dh,dv){ if(!has("mirror")){ say("needFor",itemName("mirror")); return; } ST.mh=Math.round((ST.mh+dh)*1000)/1000; ST.mv=Math.round((ST.mv+dv)*1000)/1000; }
function flip(k){ if(!has(k)){ say("needFor",itemName(k)); return; } ST.pv[k]=ST.pv[k]==="+"?"-":"+"; ST.dispT=0; say("flipped",itemName(k),ST.pv[k]==="+"?"(+)":"(−)"); }
function turnMica(da){ if(!has("mica")){ say("needFor",itemName("mica")); return; } ST.rot=Math.round((ST.rot+da)*100)/100; ST.dispT=0; }
$("lasBtn").onclick=()=>{ if(!has("laser")){ say("needFor",itemName("laser")); return; } ST.laserOn=!ST.laserOn; ST.dispT=0; say(ST.laserOn?"laserOn":"laserOff"); };
for(const [id,dh,dv] of [["mhm5",-0.5,0],["mhm05",-0.05,0],["mhp05",0.05,0],["mhp5",0.5,0],["mvm5",0,-0.5],["mvm05",0,-0.05],["mvp05",0,0.05],["mvp5",0,0.5]]) $(id).onclick=()=>knob(dh,dv);
$("p1Btn").onclick=()=>flip("pol1"); $("p2Btn").onclick=()=>flip("pol2");
for(const [id,da] of [["rm36",-3.6],["rm09",-0.9],["rm018",-0.18],["rp018",0.18],["rp09",0.9],["rp36",3.6]]) $(id).onclick=()=>turnMica(da);
for(const r of ["off","200m","2000m"]) $("r_"+r).onclick=()=>{ if(!has("dmm")){ say("needFor",itemName("dmm")); return; } ST.range=r; ST.dispT=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d(); $("lasBtn").textContent=ST.laserOn?t.lasOff:t.lasOn; $("lasBtn").className=ST.laserOn?"on":"";
  for(const k of ["pol1","pol2"]) $(k==="pol1"?"p1Btn":"p2Btn").textContent=t.polBtn(k==="pol1"?1:2,ST.pv[k]==="+"?"(+)":"(−)");
  const s=meterShow(); $("dV").textContent=s===null?"—":s.replace("1   ","1 .  ").trim()+" mV"; for(const r of ["off","200m","2000m"]) $("r_"+r).className=ST.range===r?"on":""; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  const tr=TR; if(ST.laserOn&&tr){ if(has("mirror")&&tr.segs.length<2) L.push([t.st.missMirror,true]); else if(has("det")&&!tr.det&&tr.segs.length>1) L.push([t.st.missDet,true]); }
  if(meterShow()==="1   ") L.push([t.st.over,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-l","hL"],["t-h-m","hM"],["mHint","mHint"],["t-h-p","hP"],["pHint","pHint"],["t-h-k","hK"],["kHint","kHint"],["t-h-v","hV"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; simT+=dt; stepPhys(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
