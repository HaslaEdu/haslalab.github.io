"use strict";
const A = NightSky.astro, DEG = Math.PI / 180;
/* The planetarium of Kazan Federal University.  The sheet only says what was shown and for how long; the animations
   themselves were not published, so the scenes here are computed afresh in the same form: the Moon over Kazan at the
   same hour on successive evenings (question 8), and the Sun and the planets among the stars with the daily motion
   turned off (question 9).  The default scenes are from 2015 (question 8 in December, question 9 from August to October); ‘New scene’ draws another for practice. */
const SITE = {lat: 55.79, lon: 49.12, tz: 3};
/* ---------------------------------------------------------------- the stars, constellations */
const STARS = (() => { const D = SKY_DATA.stars, bin = atob(D.b64), out = [];
  for (let i = 0; i < D.n; i++) { const o = i * 7, b = (j) => bin.charCodeAt(o + j), m = ((b(4) | b(5) << 8) << 16 >> 16) / 100; if (m > 5.6) break;
    out.push([A.vec((b(0) | b(1) << 8) / 180, ((b(2) | b(3) << 8) << 16 >> 16) / 360), m, b(6) / 80 - 0.5]); }
  return out; })();
function inRing(r, ra, de) { const X = [r[0][0]]; for (let i = 1; i < r.length; i++) X.push(X[i - 1] + (((r[i][0] - r[i - 1][0]) + 540) % 360) - 180);
  const lo = Math.min(...X), hi = Math.max(...X);
  for (const k of [-360, 0, 360]) { const x0 = ra + k; if (x0 < lo || x0 > hi) continue; let c = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const yi = r[i][1], yj = r[j][1]; if ((yi > de) !== (yj > de)) { const x = X[i] + (de - yi) / (yj - yi) * (X[j] - X[i]); if (x > x0) c = !c; } }
    if (c) return true; } return false; }
function constOf(v) { const [ra, de] = A.radec(v); for (const c in SKY_DATA.bounds) for (const r of SKY_DATA.bounds[c]) if (inRing(r, ra, de)) return c; return "?"; }
