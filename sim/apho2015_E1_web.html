/* seven-segment digits, for the meters and the scale */
const SEG={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","-":"g","o":"cdeg","L":"fed","d":"bcdeg","E":"afged","r":"eg"," ":""};
function seg7(str,x,y,h,on,off){
  const w=h*0.52, th=Math.max(1.2,h*0.11), sk=h*0.08; let cx=x;
  const L=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  ctx.lineCap="round"; ctx.lineWidth=th;
  for(let i=0;i<str.length;i++){ const ch=str[i];
    if(ch==="."){ ctx.fillStyle=on; ctx.beginPath(); ctx.arc(cx-w*0.22,y+h,th*0.7,0,7); ctx.fill(); continue; }
    const set=SEG[ch]||"";
    for(const sgm of "abcdefg"){ const lit=set.includes(sgm); if(!lit&&!off) continue; ctx.strokeStyle=lit?on:off;
      const top=y, mid=y+h/2, bot=y+h, k=t=>sk*(1-t/h);
      if(sgm==="a") L(cx+th+k(0),top,cx+w-th+k(0),top);
      if(sgm==="b") L(cx+w+k(0),top+th,cx+w+k(h/2),mid-th);
      if(sgm==="c") L(cx+w+k(h/2),mid+th,cx+w,bot-th);
      if(sgm==="d") L(cx+th,bot,cx+w-th,bot);
      if(sgm==="e") L(cx+k(h/2),mid+th,cx,bot-th);
      if(sgm==="f") L(cx+k(0),top+th,cx+k(h/2),mid-th);
      if(sgm==="g") L(cx+th+k(h/2),mid,cx+w-th+k(h/2),mid); }
    cx+=w*1.42;
  }
  ctx.lineCap="butt";
}
/* the strings the meters show, right-aligned on 3½ digits */
function lcd(str,x,y,w,h,col,ghost){
  if(!str) return;
  if(str.startsWith("1   ")){ seg7("1",x+w*0.06,y,h,col,ghost); return; }
  const neg=str[0]==="-"; let s=neg?str.slice(1):str; const digits=s.replace(".","").length, cw=h*0.52*1.42;
  const x0=x+w-digits*cw-h*0.1; if(neg){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,h*0.11); ctx.beginPath(); ctx.moveTo(x0-cw*0.9,y+h/2); ctx.lineTo(x0-cw*0.3,y+h/2); ctx.stroke(); }
  seg7(s,x0,y,h,col,ghost);
}

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function inB(b,p){ return b&&p[0]>=b[0]&&p[0]<=b[2]&&p[1]>=b[1]&&p[1]<=b[3]; }
function itemAt(p){
  const order=[...CLAMPS,...PZT,"pebble","bag","eraser","spring","rod","dmm","scale","siggen","bath","clearbox","blackbox"];
  for(const k of order) if(inB(bbox(k),p)) return k; return null;
}
function termNear(p){ let best=null, bd=10; for(const t of availTerms()){ const q=P(...termW(t)), dd=Math.hypot(p[0]-q[0],p[1]-q[1]); if(dd<bd){ bd=dd; best=t; } } return best; }
function wireNear(p){ for(let i=ST.wires.length-1;i>=0;i--) for(const t of ST.wires[i]){ const q=P(...termW(t)); if(Math.hypot(p[0]-q[0],p[1]-q[1]-6)<10) return i; } return null; }
function dropWiresOf(ts){ ST.wires=ST.wires.filter(([a,b])=>!ts.includes(a)&&!ts.includes(b)); if(ST.pend&&ts.includes(ST.pend)) ST.pend=null; }
function unclampPlate(k){ for(const c of [...CLAMPS,"sgcable"]) if(ST.clamp[c].plate===k) ST.clamp[c].plate=null; }
function returnItem(k){
  if(PZT.includes(k)){ unclampPlate(k); ST.plate[k].where="desk"; if(ST.cal.plate===k) ST.cal.plate=null; }
  if(CLAMPS.includes(k)){ ST.clamp[k].plate=null; dropWiresOf(CLAMP_T[k]); }
  if(k==="dmm"){ dropWiresOf(DMM_T); ST.dmm.func="OFF"; }
  if(k==="siggen"){ dropWiresOf(["SG+","SG-"]); ST.clamp.sgcable.plate=null; ST.sg.on=false; }
  if(k==="scale"){ for(const q of PZT) if(ST.plate[q].where==="scale") returnItem(q); ST.scale.on=false; }
  if(k==="bath"){ for(const q of PZT) if(ST.plate[q].where==="bath") returnItem(q); for(const q of ["bag","pebble"]) if(ST.it[q].on) returnItem(q); ST.water=false; ST.bath.on=false; }
  if(k==="clearbox"||k==="blackbox"){ for(const q of PZT) if(ST.plate[q].where[0]===k[0]&&ST.plate[q].where.length===3) returnItem(q); if(k==="clearbox"){ if(ST.rodIn) returnItem("rod"); if(ST.springIn) returnItem("spring"); } if(ST.eraserIn===k) returnItem("eraser"); }
  if(k==="rod"){ ST.rodIn=false; ST.tape.on=false; if(ST.springIn) returnItem("spring"); } if(k==="spring") ST.springIn=false; if(k==="eraser") ST.eraserIn=null;
  if(k==="bag"){ for(const q of PZT) if(ST.plate[q].where==="bath") returnItem(q); ST.bagIn=false; if(ST.pebbleIn) returnItem("pebble"); } if(k==="pebble") ST.pebbleIn=false;
  ST.it[k].on=false; say("back",itemName(k));
}
/* along-the-plate offset of a click, -1 (one end) … 0 (middle) … 1 (other end) */
function plateS(k,p){ const [x,y,z]=platePos(k), [ux]=unP(p[0],p[1],z), L=plateOf(k).l0; return Math.max(-1,Math.min(1,(ux-x)/(L/2))); }
function place(k,p){
  const it=ST.it[k], mv=hand&&hand.move, over=itemAt(p);
  if(CLAMPS.includes(k)){
    if(over&&PZT.includes(over)){ if(k==="kelvin"&&ST.plate[over].where==="bath"){ say("kelvinHot"); return false; }
      for(const c of CLAMPS) if(c!==k&&ST.clamp[c].plate===over&&c==="kelvin") ST.clamp[c].plate=null;
      ST.clamp[k].plate=over; ST.clamp[k].s=plateS(over,p); it.on=true; ST.focus=over; say("clamped",itemName(k),itemName(over)); return true; }
    ST.clamp[k].plate=null; const [x,y]=unP(p[0],p[1],0); if(x<10||x>DESK.x1-10||y<10||y>DESK.y1-10){ say("noFit"); return false; } it.x=x; it.y=y; it.on=true; say("placed",itemName(k)); return true; }
  if(PZT.includes(k)){
    if(over==="scale"){ ST.plate[k].where="scale"; it.on=true; say("onPan",itemName(k)); return true; }
    if(over==="bath"){ if(!ST.water){ say("needWater"); return false; } if(!ST.bagIn){ say("needBag"); return false; }
      if(ST.clamp.kelvin.plate===k){ say("kelvinHot"); return false; } ST.plate[k].where="bath"; it.on=true; say(ST.pebbleIn?"inBath":"needPebble",itemName(k)); return true; }
    if(over==="clearbox"||over==="blackbox"){ setTab("box"); say("toBox"); return false; }
    const [x,y]=unP(p[0],p[1],0); if(x<30||x>DESK.x1-30||y<10||y>DESK.y1-10){ say("noFit"); return false; }
    ST.plate[k].where="desk"; it.x=x; it.y=y; it.on=true; say("placed",itemName(k)); return true; }
  if(k==="rod"&&over==="clearbox"){ ST.rodIn=true; it.on=true; say("rodIn"); return true; }
  if(k==="spring"&&over==="clearbox"){ if(!ST.rodIn){ say("needRod"); return false; } ST.springIn=true; it.on=true; say("placed",itemName(k)); return true; }
  if(k==="eraser"&&(over==="clearbox"||over==="blackbox")){ ST.eraserIn=over; it.on=true; say("placed",itemName(k)); return true; }
  if(k==="bag"&&over==="bath"){ if(!ST.water){ say("needWater"); return false; } ST.bagIn=true; it.on=true; say("placed",itemName(k)); return true; }
  if(k==="pebble"&&over==="bath"){ if(!ST.bagIn){ say("needBag"); return false; } ST.pebbleIn=true; it.on=true; say("placed",itemName(k)); return true; }
  const [x,y]=unP(p[0],p[1],0);

  else if(x<30||x>DESK.x1-30||y<10||y>DESK.y1-10){ say("noFit"); return false; }
  if(k==="rod") ST.rodIn=false; if(k==="spring") ST.springIn=false; if(k==="eraser") ST.eraserIn=null; if(k==="bag") ST.bagIn=false; if(k==="pebble") ST.pebbleIn=false;

}
function benchClick(p,right){
  if(hand&&hand.item==="caliper"){ if(right){ hand=null; return; } const k=itemAt(p); if(k&&PZT.includes(k)){ Object.assign(ST.cal,{plate:k,state:2,pan:0}); hand=null; setTab("caliper"); say("calOn",itemName(k)); } return; }
  if(hand&&hand.item==="tape"){ if(right){ hand=null; return; } const k=itemAt(p); if(k==="rod"||(k==="clearbox"&&ST.rodIn)){ ST.tape.on=true; ST.tape.off=gauss(0.35); hand=null; setTab("tape"); say("tapeOn"); } return; }
  if(hand){ if(right){ if(hand.move){ restoreMove(); say("stays"); } else say("back",itemName(hand.item)); hand=null; return; }
    if(place(hand.item,p)) hand=null; return; }
  if(ST.pend){ if(right){ ST.pend=null; return; }
    if(ST.pend==="SG+"||ST.pend==="SG-"){ const k=itemAt(p); if(k&&PZT.includes(k)){ ST.clamp.sgcable.plate=k; ST.clamp.sgcable.s=plateS(k,p); dropWiresOf(["SG+","SG-"]); ST.pend=null; ST.focus=k; say("clamped",itemName("sgcable"),itemName(k)); return; } }

  if(right){ const w=wireNear(p); if(w!==null){ ST.wires.splice(w,1); say("unplug"); return; }
    if(ST.clamp.sgcable.plate){ const h=P(...clampHome("sgcable")); if(Math.hypot(p[0]-h[0],p[1]-h[1])<12){ ST.clamp.sgcable.plate=null; say("unplug"); return; } }
    const k=itemAt(p); if(k) returnItem(k); return; }
  const t=termNear(p); if(t){ ST.pend=t; return; }
  if(ST.clamp.sgcable.plate){ const h=P(...clampHome("sgcable")); if(Math.hypot(p[0]-h[0],p[1]-h[1])<10){ ST.clamp.sgcable.plate=null; ST.pend="SG+"; return; } }
  const k=itemAt(p); if(!k) return; if(PZT.includes(k)) ST.focus=k;
  hand={item:k,move:true,orig:snapshot(k)}; liftForMove(k); say("moveIt",itemName(k));
}
/* moving a part: it leaves its place while in hand; R-click puts it back */
function snapshot(k){ return JSON.stringify({it:ST.it[k],plate:ST.plate[k],clamp:ST.clamp[k],rodIn:ST.rodIn,springIn:ST.springIn,eraserIn:ST.eraserIn,bagIn:ST.bagIn,pebbleIn:ST.pebbleIn}); }

  if(k==="rod"){ ST.rodIn=false; } if(k==="spring") ST.springIn=false; if(k==="eraser") ST.eraserIn=null; if(k==="bag") ST.bagIn=false; if(k==="pebble") ST.pebbleIn=false; ST.it[k].on=false; }
function restoreMove(){ const k=hand.item, o=JSON.parse(hand.orig); Object.assign(ST.it[k],o.it); if(ST.plate[k]) Object.assign(ST.plate[k],o.plate); if(ST.clamp[k]) Object.assign(ST.clamp[k],o.clamp);

    if(h==="sg.offs") sg.dc=Math.max(-1.5,Math.min(1.5,+(sg.dc+dir*(e.shiftKey?0.005:0.05)).toFixed(3)));
    if(h==="dmm.dial"){ const i=DMM_FUNCS.indexOf(ST.dmm.func); ST.dmm.func=DMM_FUNCS[Math.max(0,Math.min(DMM_FUNCS.length-1,i-dir))]; ST.dmm.dt=0; }
    if(h==="bath.up"||h==="bath.down"){ const b=ST.bath; if(b.on&&b.setmode) b.sp=Math.max(25,Math.min(90,b.sp+dir)); }
    return; }
  if(tab==="caliper"&&CL.calZoom&&inR(p,CL.calZoom)){ ST.cal.pan=Math.min(140,Math.max(-2,ST.cal.pan-dir*(e.shiftKey?0.2:1))); return; }
  if(tab==="tape"&&ST.tape.on){ ST.tape.off=gauss(0.35); ST.tape.n++; }
},{passive:false});

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
$("wClear").onclick=()=>{ ST.wires=[]; ST.pend=null; say("cleared"); };
$("pourBtn").onclick=()=>{ if(!ST.it.bath.on){ say("noBath"); return; } if(ST.bottle<=0){ say("noBottle"); return; } ST.bottle=0; ST.water=true; say("poured"); };
$("noteBtn").onclick=()=>{ const parts=[];
  if(ST.it.siggen.on&&ST.sg.on) parts.push("SG "+(ST.sg.f/1000).toFixed(3)+" kHz");
  if(ST.it.dmm.on&&ST.dmm.func!=="OFF") parts.push("DMM "+DMM_LAB[ST.dmm.func]+" "+(ST.dmm.disp||"")+" "+(ST.dmm.unit||"")+" "+(ST.dmm.acdc||""));
  if(ST.it.bath.on&&ST.bath.on&&ST.water) parts.push("bath "+ST.bath.tw.toFixed(1)+" °C");
  const s=scaleText(); if(s) parts.push("scale "+s);
  ST.notes.push(parts.join(" | ")||"—"); renderNotes(); say("noted"); };
$("noteClr").onclick=()=>{ ST.notes=[]; renderNotes(); };
function renderNotes(){ const box=$("notes"); if(!ST.notes.length){ box.textContent=d().noteEmpty; return; }
  box.innerHTML=ST.notes.map((s,i)=>"<div>"+String(i+1).padStart(2,"0")+". "+s+"</div>").join(""); box.scrollTop=box.scrollHeight; }
function renderStatus(){
  const L=[], t=d();
  if(!ITEMS.some(k=>ST.it[k].on)) L.push([t.st.none,false]);
  if(hand&&hand.item==="caliper") L.push([t.st.cal,false]); else if(hand&&hand.item==="tape") L.push([t.st.tape,false]); else if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(ST.pend) L.push([t.st.pend(termLabel(ST.pend)),false]);
  if(ST.sg.on&&sgWave().clip) L.push([t.st.clip,true]);
  if(ST.bath.on&&ST.bath.tw>50) L.push([t.st.hot,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap[tab];
  $("t-h-wire").textContent=t.hWire; $("wClear").textContent=t.clear; $("t-wirehint").textContent=t.wireHint;
  $("t-h-bath").textContent=t.hBath; $("pourBtn").textContent=t.pour; $("t-bathhint").textContent=t.bathHint;
  $("t-h-note").textContent=t.hNote; $("noteBtn").textContent=t.note; $("noteClr").textContent=t.noteClr;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"APhO 2015 — 압전 효과와 그 응용 · HaslaLab":"APhO 2015 — The Piezoelectric Effect and Its Applications · HaslaLab";
  renderTabs(); renderNotes(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0, solveT=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.25,Math.max(0,now-tPrev)); tPrev=now;
  stepPhysics(dt*SIM_SPEED);
  solveT-=dt; if(solveT<=0){ solveAll(); solveT=0.15; }
  const D=ST.dmm; D.dt-=dt; if(D.dt<=0){ const [v,u,a]=dmmRead(); D.disp=v; D.unit=u; D.acdc=a; D.dt=0.45; }
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
