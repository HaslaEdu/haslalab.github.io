  #cards{display:block;width:100%;height:auto;background:var(--deep);border-radius:6px}
  .benchwrap{position:relative}
  .viewback{position:absolute;left:10px;top:10px;z-index:5;padding:6px 12px;border-radius:7px;border:1px solid #3a414a;background:rgba(20,24,29,.86);color:#e8eef2;font:600 12.5px inherit;cursor:pointer}

  .zbar button{margin:0;padding:3px 10px}
  #zcv{display:block;border-radius:6px;cursor:pointer}
  #scrub{width:100%;margin:6px 0 2px;accent-color:var(--accent)}
  .views{display:flex;flex-wrap:wrap;gap:5px}
  .views button{flex:1 1 30%;margin:0;padding:6px 4px;font-size:12px}
  #rewind button{font-size:12px;padding:6px 4px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:10px;min-height:110px}
  .status div + div{margin-top:9px}
  .status .warn{color:#ff8b6a}
  header{max-width:1720px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="wrap">
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-benchcap"></h3>
      <div class="benchwrap"><canvas id="bench"></canvas><button id="viewBack" class="viewback" hidden></button>
        <div class="zoom" id="zoom" hidden><div class="zbox"><div class="zbar"><span id="zcap"></span><button id="zx">✕</button></div><canvas id="zcv"></canvas></div></div></div>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-time"></h2>
    <div class="clock" id="clock">00:00:00</div>
    <div class="row" id="speeds"></div>
    <div class="row" id="rewind"></div>
    <input type="range" id="scrub" min="0" max="1" step="1" value="1">
    <div class="hint" id="t-timehint"></div>

    <h2 id="t-h-how"></h2>
    <div class="hint" id="t-howto"></div>

    <div class="status" id="status"></div>
    <div class="hint" id="session" style="text-align:right;margin-top:6px"></div>
  </aside>
</div>

   1.  CONSTANTS AND PHYSICS  —  line for line the original program
   ══════════════════════════════════════════════════════════════ */
const C0=4.184e3, RHO0=1000.0, R_GAS=8.314, T0K=273.15, RHO_AIR=1.12, RHO_PG=1036.0, G_ACC=9.81;
const GAMMA_W20=0.0728, DGAMMA_W=-1.5e-4, GAMMA_PG=0.0360, THETA_W=70*Math.PI/180, THETA_PG=30*Math.PI/180;
const D_IC_IN=33.7e-3, WALL=3.4e-3, D_OC_OUT=74.8e-3;
const R1=D_IC_IN/2, R2=R1+WALL, R_OC_IN=D_OC_OUT/2-WALL;
const L_IC=0.140, L_OC=0.180;
const PV_T0=250.0, PV_N=3400;

/* mulberry32 with its state kept on the object, so a snapshot of the lab can be taken and put back */
class RNG{ constructor(s){ this.s=s>>>0; }
  r(){ let a=this.s=(this.s+0x6D2B79F5)|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
  uniform(a,b){ return a+this.r()*(b-a); }
  gauss(mu,sd){ let u=0,v=0; while(!u)u=this.r(); while(!v)v=this.r(); return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); } }
const WARN=new Set(["noMains","heaterWet","indicatorRed","nothingPour","mixedSyr","openE","hoseDOut","valveDClosed","openEtoo","spilt","mixedIC",
  "connectFirst","hoseSlipped","hoseNot","valvesAC","hosePortOut","ocFull","keepLevel","heaterOff","barrelOver","barrelEmpty","hoseFirst","syrNotHome"]);

class Container{
  constructor(key,vol,T,kind,cap){ this.key=key; this.vol=vol; this.T=T; this.kind=kind; this.cap=cap; }
  take(mL){ mL=Math.min(mL,this.vol); this.vol-=mL; return mL; }
  give(mL,T,kind){
    if(this.vol<1e-9) this.kind=kind; else if(kind!==this.kind&&this.kind!=="waste") this.kind="mixed";
    const tot=this.vol+mL; if(tot>0) this.T=(this.T*this.vol+T*mL)/tot; this.vol=Math.min(this.cap,tot);
  }
}
class Syringe{ constructor(key){ this.key=key; this.cap=100; this.vol=0; this.plunger=0; this.kind=null; this.T=24;
  this.hasPlunger=true; this.attached=null; this.placed=null; this.x=0; this.y=0; } }

/* ══════════════════════════════════════════════════════════════
   2.  THE APPARATUS  —  step(dt) advances the physics
   ══════════════════════════════════════════════════════════════ */
class Lab{
  constructor(seed){
    if(seed===undefined) seed=1+Math.floor(Math.random()*999998);
    this.seed=seed; const g=new RNG(seed); this.rng=new RNG(seed*7919+13);
    /* hidden physical truths (never shown) */
    this.lam=g.uniform(0.235,0.265);
    this.ccS=g.uniform(4600,4800);
    const pv339=g.uniform(17.6,19.6);
    this.ccC=Math.log(pv339)+this.ccS/339;
    this.pvTab=new Float64Array(PV_N+1);
    for(let i=0;i<=PV_N;i++) this.pvTab[i]=1e3*Math.exp(this.ccC-this.ccS/(PV_T0+i*0.05));
    this.P_atm0=g.uniform(94.4e3,96.0e3); this.P_atm=this.P_atm0; this.drift=0;
    this.T_amb=g.uniform(22,26); this.P_heat=g.uniform(180,220);
    this.Renv_oc=g.uniform(2.05,2.75); this.Renv_ic=g.uniform(100,200);
    this.r1=R1+g.uniform(-1e-4,1e-4); this.r2=R2+g.uniform(-1e-4,1e-4);
    this.A_ic=Math.PI*this.r1**2;
    this.A_oc=Math.PI*((R_OC_IN+g.uniform(-1e-4,1e-4))**2-this.r2**2);
    this.p_gain=g.uniform(1.004,1.034); this.p_off=g.uniform(-3.0e3,0.5e3);
    this.ti_gain=g.uniform(0.9965,1.0035); this.ti_off=g.uniform(-0.4,0.4);
    this.te_gain=g.uniform(0.9965,1.0035); this.te_off=g.uniform(-0.4,0.4);
    this.tau_probe=g.uniform(5,9); this.tau_press=1.2;
    this.t=0; this.power=false; this.sw=false; this.mains=false; this.pump=false; this.heater=false; this.heaterHot=false;
    this.gh=[]; this.ghT=-1e9;      /* what the Graph display plots: one sample every 2 s */
    this.timer=0; this.timerRun=false; this.graphMode=false;
    this.valve={A:false,B:false,C:false,D:false,E:false};
    this.h_oc=0; this.T_oc=this.T_amb; this.strat=0;
    this.icKind=null; this.h_ic=0; this.T_ic=this.T_amb;
    this.n_air=this.P_atm*this.A_ic*L_IC/(R_GAS*(this.T_amb+T0K));
    this.hoseAin=null; this.hoseCin=null; this.clip={A:false,C:false}; this.hconn={A:true,C:true,D:true};
    this.primed=false; this.purging=false; this.slip=0;
    this.containers={pg:new Container("pg",100,this.T_amb,"pg",120), cold:new Container("cold",500,g.uniform(3,7),"water",600),
      room:new Container("room",1500,this.T_amb,"water",1500), pour:new Container("pour",0,this.T_amb,"water",1200),
      jug:new Container("jug",0,this.T_amb,"waste",3000)};
    this.syr={w:new Syringe("w"),p:new Syringe("p")};
    this.s_tint=this.T_ic; this.s_text=this.T_oc; this.s_press=this.P_atm;
    this.msg=null; this.msgT=-99;
  }
  say(k,...a){ this.msg={k,a}; this.msgT=this.t+1e-9*(++this.msgN||(this.msgN=1)); }
  pv(T){ const u=(T-PV_T0)*20, i=Math.floor(u);
    if(i<0) return this.pvTab[0]; if(i>=PV_N) return 1e3*Math.exp(this.ccC-this.ccS/T);
    const a=this.pvTab[i]; return a+(this.pvTab[i+1]-a)*(u-i); }
  /* the bore is far wider than the capillary length: flat in the middle, a ring of
     order lambda_c at the wall climbs lambda_c*sqrt(2(1-sin theta)) */
  meniscus(){
    if(this.icKind===null||this.h_ic<=1e-6) return [0,0,0];
    let g,rho,th;
    if(this.icKind==="pg"){ g=GAMMA_PG; rho=RHO_PG; th=THETA_PG; }
    else { g=Math.max(0.02,GAMMA_W20+DGAMMA_W*(this.T_ic-20)); rho=RHO0; th=THETA_W; if(this.icKind==="mixed") g*=0.75; }
    const lam=Math.sqrt(g/(rho*G_ACC)), rise=lam*Math.sqrt(Math.max(0,2*(1-Math.sin(th)))), width=1.6*lam;
    const vol=Math.PI*(this.r1**2-Math.max(0,this.r1-width)**2)*rise*0.5;
    return [rise,width,vol];
  }
  get vMen(){ return this.meniscus()[2]; }
  get H(){ return Math.max(0,L_IC-this.h_ic); }
  get V_air(){ return Math.max(1e-9,this.A_ic*this.H-this.vMen); }
  get R_wall(){ const h=Math.max(Math.min(this.h_ic,this.h_oc),0.005); return Math.log(this.r2/this.r1)/(2*Math.PI*this.lam*h); }
  get openColumn(){ const s=this.syr.w; if(s.hasPlunger) return false; if(s.attached==="Dh") return true;
    return s.attached==="D"&&this.valve.D&&this.hconn.D; }
  icVented(){
    if(this.valve.E) return true;
    const free=Object.values(this.syr).filter(s=>s.attached==="D"||s.attached==="Dh");
    if(!this.hconn.D) return !free.some(s=>s.attached==="Dh");
    if(this.valve.D) return !free.some(s=>s.attached==="D");
    return false;
  }
  reseal(){ const T=this.T_ic+T0K, p=this.P_atm-((this.icKind==="water"||this.icKind==="mixed")?this.pv(T):0);
    this.n_air=p*this.V_air/(R_GAS*T); }
  truePressure(){
    const T=this.T_ic+T0K;
    if(this.icVented()&&!this.openColumn) return this.P_atm;
    let p=this.n_air*R_GAS*T/Math.max(this.V_air,1e-9);
    if(this.icKind==="water"||this.icKind==="mixed") p+=this.pv(T);
    return p;
  }
  rPint(){ return this.power?Math.round((this.p_gain*this.s_press+this.p_off+this.rng.gauss(0,40))/100)/10:null; }
  rPatm(){ return this.power?Math.round((this.P_atm/1000+this.rng.gauss(0,0.03))*10)/10:null; }
  rTint(){ return this.power?Math.round((this.ti_gain*this.s_tint+this.ti_off+this.rng.gauss(0,0.05))*10)/10:null; }
  rText(){ return this.power?Math.round((this.te_gain*this.s_text+this.te_off+this.rng.gauss(0,0.05))*10)/10:null; }
  /* the module runs when its mains cord is in and its POWER rocker is on; losing power clears it */
  setPower(){ const p=this.sw&&this.mains; if(p===this.power) return false; this.power=p;
    if(!p){ this.heater=false; this.pump=false; this.timerRun=false; this.timer=0; this.graphMode=false; this.gh=[]; } return true; }
  pressPower(){ this.sw=!this.sw; if(this.setPower()) this.say(this.power?"powerOn":"powerOff"); else if(this.sw&&!this.mains) this.say("noMains"); }
  plugMains(){ this.mains=!this.mains; this.say(this.mains?"mainsIn":"mainsOut"); if(this.setPower()&&this.power) this.say("powerOn"); }
  pressButton(n){
    if(!this.power){ this.say("noPower"); return; }
    if(n===1) this.timerRun=!this.timerRun;
    else if(n===2) this.timer=0;
    else if(n===3) this.graphMode=!this.graphMode;
    else if(n===4){
      if(this.h_oc<0.04){ this.say("heaterWet"); return; }
      if(this.heaterHot&&!this.heater){ this.say("indicatorRed"); return; }
      this.heater=!this.heater;
    }
  }
  pressPump(){ if(!this.power){ this.say("noPower"); return; } this.pump=!this.pump; }
  toggleValve(v){
    this.valve[v]=!this.valve[v];
    if(v==="B"){
      if(this.valve.B&&this.pump) this.purging=true;
      else if(!this.valve.B&&this.purging){ this.purging=false; this.primed=true; this.say("primed"); }
    }
    if("DE".includes(v)&&!this.icVented()) this.reseal();
  }
  toggleHose(k){ this.hconn[k]=!this.hconn[k]; this.say(this.hconn[k]?"hoseIn":"hoseOut",k); }
  toggleClip(k){ this.clip[k]=!this.clip[k]; this.say("clip",k,this.clip[k]); }
  pour(src,dst,mL){
    mL=mL||150; const a=this.containers[src], b=this.containers[dst];
    const got=a.take(Math.min(mL,Math.max(0,b.cap-b.vol)));
    if(got<=0){ this.say("nothingPour"); return; }
    b.give(got,a.T,a.kind); this.say("poured",got,src,dst);
  }
  syringePull(key,dmL){
    const s=this.syr[key];
    if(!s.hasPlunger){ this.say("plungerOut"); return; }
    const nw=Math.min(s.cap,Math.max(0,s.plunger+dmL)), dd=nw-s.plunger;
    if(Math.abs(dd)<1e-9) return;
    s.plunger=nw;
    if(this.containers[s.attached]){
      const c=this.containers[s.attached];
      if(dd>0){ const got=c.take(dd);
        if(got>0){ if(s.kind&&s.kind!==c.kind){ s.kind="mixed"; this.say("mixedSyr"); } else s.kind=c.kind; s.T=c.T; s.vol+=got; } }
      else { const give=Math.min(s.vol,-dd); if(give>0){ c.give(give,s.T,s.kind||"water"); s.vol-=give; } }
      return;
    }
    if(s.attached==="Dh"){
      if(!this.valve.E){ this.say("openE"); s.plunger-=dd; return; }
      if(dd<0){ const give=Math.min(s.vol,-dd,(L_IC-this.h_ic)*this.A_ic*1e6); if(give>0){ this.addToIC(give,s.kind,s.T); s.vol-=give; } }
      else { const take=Math.min(dd,this.h_ic*this.A_ic*1e6);
        if(take>0){ this.h_ic-=take*1e-6/this.A_ic; s.kind=s.kind||this.icKind; s.vol+=take;
          if(this.h_ic<1e-4){ this.h_ic=0; this.icKind=null; } this.reseal(); } }
      return;
    }
    if(s.attached==="D"){
      if(!this.hconn.D){ this.say("hoseDOut"); s.plunger-=dd; return; }
      if(!this.valve.D){ this.say("valveDClosed"); s.plunger-=dd; return; }
      if(!this.valve.E){ this.say("openEtoo"); s.plunger-=dd; return; }
      if(dd<0){ const give=Math.min(s.vol,-dd,(L_IC-this.h_ic)*this.A_ic*1e6); if(give<=0) return;
        this.addToIC(give,s.kind,s.T); s.vol-=give; }
      else { const take=Math.min(dd,this.h_ic*this.A_ic*1e6); if(take<=0) return;
        this.h_ic-=take*1e-6/this.A_ic;
        s.kind=(s.kind&&this.icKind&&s.kind!==this.icKind)?"mixed":this.icKind;
        s.vol+=take; if(this.h_ic<1e-4){ this.h_ic=0; this.icKind=null; } this.reseal(); }
      return;
    }
    if(dd<0&&s.vol>0){ const spill=Math.min(s.vol,-dd); s.vol-=spill; this.say("spilt",spill); }
  }
  addToIC(mL,kind,T){
    if(kind===null) return;
    const first=this.h_ic<=1e-6;
    if(this.icKind&&kind!==this.icKind){ this.icKind="mixed"; this.say("mixedIC"); } else this.icKind=kind;
    const mOld=RHO0*this.A_ic*this.h_ic*1000, mNew=mL*1e-3;
    if(mOld+mNew>0) this.T_ic=(this.T_ic*mOld+T*mNew)/(mOld+mNew);
    let dv=mL*1e-6; if(first) dv-=this.vMen;
    this.h_ic=Math.min(L_IC-0.002,this.h_ic+Math.max(0,dv)/this.A_ic);
    this.reseal();
  }
  removePlunger(key){
    const s=this.syr[key];
    if(s.hasPlunger){ if(s.attached===null){ this.say("connectFirst"); return; } s.hasPlunger=false; this.say("plungerRemoved"); }
    else { s.hasPlunger=true; s.plunger=s.vol; this.say("plungerBack"); }
  }
  step(dt){
    this.t+=dt;
    const f=1-Math.exp(-dt/this.tau_probe);
    this.s_tint+=(this.T_ic-this.s_tint)*f;
    this.s_text+=(this.T_oc+this.strat-this.s_text)*f;
    this.s_press+=(this.truePressure()-this.s_press)*(1-Math.exp(-dt/this.tau_press));
    this.drift+=-this.drift*dt/900+this.rng.gauss(0,6)*Math.sqrt(dt);
    this.P_atm=this.P_atm0+this.drift;
    if(this.timerRun) this.timer+=dt;
    if(this.power&&this.t-this.ghT>=2){ this.ghT=this.t; this.gh.push([this.t,this.p_gain*this.s_press+this.p_off,this.ti_gain*this.s_tint+this.ti_off,this.te_gain*this.s_text+this.te_off]); if(this.gh.length>900) this.gh.shift(); }
    /* pump */
    const rate=22*dt*(this.primed?1:0.05);
    if(this.pump&&this.power){
      const fill=this.valve.A&&!this.valve.B&&!this.valve.C;
      const drain=this.valve.C&&this.valve.B&&!this.valve.A;
      for(const [k,key] of [["A","hoseAin"],["C","hoseCin"]]){
        if(this[key]&&!this.clip[k]){ this.slip+=dt;
          if(this.slip>40){ this.slip=0; this[key]=null; this.say("hoseSlipped",k); } }
      }
      if(fill&&this.hconn.A&&!this.hoseAin) this.say("hoseNot","A");
      else if(drain&&this.hconn.C&&!this.hoseCin) this.say("hoseNot","C");
      else if(this.valve.A&&this.valve.C) this.say("valvesAC");
      if(fill&&!this.hconn.A) this.say("hosePortOut","A");
      else if(drain&&!this.hconn.C) this.say("hosePortOut","C");
      if(fill&&this.hoseAin&&this.hconn.A){
        const c=this.containers[this.hoseAin];
        if(this.h_oc>=L_OC-1e-4) this.say("ocFull");
        const got=c.take(Math.min(rate,Math.max(0,(L_OC-this.h_oc)*this.A_oc*1e6)));
        if(got>0){ const mOld=RHO0*this.A_oc*this.h_oc, mNew=got*1e-6*RHO0;
          this.T_oc=(this.T_oc*mOld+c.T*mNew)/Math.max(mOld+mNew,1e-9);
          this.h_oc+=got*1e-6/this.A_oc; this.strat*=0.5;
          if(this.h_oc>0.170) this.say("keepLevel"); }
      } else if(drain&&this.hoseCin&&this.hconn.C){
        const out=Math.min(rate,this.h_oc*this.A_oc*1e6);
        if(out>0){ this.containers[this.hoseCin].give(out,this.T_oc,"water"); this.h_oc-=out*1e-6/this.A_oc; }
      }
    }
    /* heater, with its 65 C cut-out */
    let Q=0;
    if(this.heater&&this.power&&this.h_oc>0.04){
      if(this.T_oc>=65){ this.heater=false; this.heaterHot=true; } else Q=this.P_heat;
    } else if(this.heater&&this.h_oc<=0.04){ this.heater=false; this.say("heaterOff"); }
    if(this.heaterHot&&this.T_oc<60) this.heaterHot=false;
    /* stratification */
    const recirc=this.pump&&this.power&&this.valve.B&&!this.valve.A&&!this.valve.C;
    if(recirc) this.strat*=Math.exp(-dt/8);
    else { const tgt=Q>0?2.5:0; this.strat+=(tgt-this.strat)*(1-Math.exp(-dt/90)); }
    /* thermal network */
    const Cic=Math.max(C0*RHO0*this.A_ic*this.h_ic+1005*RHO_AIR*this.V_air,2);
    const Coc=Math.max(C0*RHO0*this.A_oc*this.h_oc+40,40);
    const q=(this.h_oc>0.005&&this.h_ic>0.005)?(this.T_oc-this.T_ic)/this.R_wall:(this.T_oc-this.T_ic)/60;
    this.T_ic+=(q-(this.T_ic-this.T_amb)/this.Renv_ic)/Cic*dt;
    this.T_oc+=(Q-q-(this.T_oc-this.T_amb)/this.Renv_oc)/Coc*dt;
    /* open water column (Part B) */
    if(this.openColumn&&(this.icKind==="water"||this.icKind==="mixed")){
      const s=this.syr.w, T=this.T_ic+T0K, pDry=Math.max(this.P_atm-this.pv(T),1);
      let Hn=this.n_air*R_GAS*T/(this.A_ic*pDry); Hn=Math.min(Math.max(Hn,0.004),L_IC-0.002);
      let dV=this.A_ic*(Hn-this.H)*1e6;
      if(dV>0){ dV=Math.min(dV,s.cap-s.vol); if(s.vol>=s.cap-1e-6) this.say("barrelOver"); }
      else { dV=-Math.min(-dV,s.vol); if(s.vol<=1e-6){ this.say("barrelEmpty"); this.reseal(); } }
      s.vol+=dV; this.h_ic=L_IC-(this.H+dV*1e-6/this.A_ic);
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   3.  CANVASES AND 2-D HELPERS
   ══════════════════════════════════════════════════════════════ */
const cv=$("bench"), ctxM=cv.getContext("2d");
let ctx=ctxM;                       /* the little 2-D helpers draw on whatever ctx is */
const trayCv=$("tray"), trayCtx=trayCv.getContext("2d");
const zcv=$("zcv"), zctx=zcv.getContext("2d");
const ACRYL="#8095a8", INK="#dfe7ee", DIM="#7f8a95";
let CW=0, CH=0, DPR=1, TRW=180, TRH=420, ZOOM=null;
const TRAY_ORDER=["syrW","syrP","pg","cold","room","pour","jug"];
const TRAY_ROW=48;
const FONT="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif", MONO="ui-monospace,Consolas,monospace";
function lerp(c1,c2,f){ f=Math.max(0,Math.min(1,f)); const a=[1,3,5].map(i=>parseInt(c1.substr(i,2),16)), b=[1,3,5].map(i=>parseInt(c2.substr(i,2),16));
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*f).toString(16).padStart(2,"0")).join(""); }
function R(x0,y0,x1,y1,fill,stroke,lw){ if(fill){ctx.fillStyle=fill;ctx.fillRect(x0,y0,x1-x0,y1-y0);}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.strokeRect(x0,y0,x1-x0,y1-y0);} }
function O(x0,y0,x1,y1,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function L(pts,col,w){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.strokeStyle=col; ctx.lineWidth=w||1; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke(); }
function P(pts,fill,stroke,lw){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function X(s,x,y,col,size,anchor,bold,font){
  ctx.fillStyle=col; ctx.font=(bold?"700 ":"")+size+"px "+(font||FONT);
  ctx.textAlign=anchor==="w"?"left":anchor==="e"?"right":"center"; ctx.textBaseline="middle";

LOGO.onload=()=>{ paint(TOPC,paintTop); TOPC._ver=(TOPC._ver||0)+1; };
function paintStatic(){
  paint(WOOD,(w,h)=>{
    const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,"#8a6544"); g.addColorStop(1,"#9b7450"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    const rnd=mulberry(7);
    for(let i=0;i<150;i++){ const y=rnd()*h, a=8+rnd()*20, f=0.004+rnd()*0.01, ph=rnd()*6;
      ctx.beginPath(); for(let x=0;x<=w;x+=16){ const yy=y+Math.sin(x*f+ph)*a*0.3; if(x) ctx.lineTo(x,yy); else ctx.moveTo(x,yy); }
      ctx.strokeStyle=`rgba(${rnd()<0.5?"70,45,25":"175,135,95"},${0.10+rnd()*0.16})`; ctx.lineWidth=0.6+rnd()*2; ctx.stroke(); }
    for(let i=1;i<4;i++){ ctx.fillStyle="rgba(50,32,18,0.35)"; ctx.fillRect(0,i*h/4-1,w,2); }
  });
  paint(TOPC,paintTop);
}
function paintTop(w,h){ {
    const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,"#16191c"); g.addColorStop(0.45,"#0b0d0f"); g.addColorStop(0.55,"#121518"); g.addColorStop(1,"#08090b");
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    /* the IPhO 2026 mark as it is printed on the lid (white on the black acrylic, Fig. 1b) */
    if(LOGO.complete&&LOGO.naturalWidth){ const lh=440, lw=lh*LOGO.naturalWidth/LOGO.naturalHeight; ctx.drawImage(LOGO,250-lw/2,300-lh/2,lw,lh); }
    ctx.strokeStyle="rgba(255,255,255,0.06)"; ctx.lineWidth=40; ctx.beginPath(); ctx.moveTo(-50,h*0.85); ctx.lineTo(w*0.9,-50); ctx.stroke();
  } }

/* ══════════════════════════════════════════════════════════════
   8.  HISTORY  —  a snapshot every few simulated seconds, and one
       before each action, so time can be wound back
   ══════════════════════════════════════════════════════════════ */
let HIST=[], UNDO=[], recAt=-1e9;
function snapshot(kind){
  const o={}; for(const k in lab){ if(k!=="pvTab") o[k]=lab[k]; }
  return {t:lab.t, kind, at:performance.now(), lab:structuredClone(o),
          B:structuredClone({contOn:B.contOn,syrOn:B.syrOn,hose:B.hose,pos:B.pos,sp:B.sp})};
}
function restoreInto(dst,src){
  for(const k in src){ const v=src[k], cur=dst[k];
    if(v&&typeof v==="object"&&!Array.isArray(v)&&!ArrayBuffer.isView(v)&&cur&&typeof cur==="object"&&!Array.isArray(cur)) restoreInto(cur,v);
    else dst[k]=(v&&typeof v==="object")?structuredClone(v):v; }
  for(const k in dst) if(!(k in src)&&dst===B.pos) delete dst[k];
}
function restore(sn){
  restoreInto(lab,sn.lab);
  for(const k of ["contOn","syrOn","hose"]) restoreInto(B[k],sn.B[k]);
  B.pos=structuredClone(sn.B.pos); B.sp=structuredClone(sn.B.sp);
  B.carry=null; B.down=null; B.plDrag=null; acc=0; LRt=-1e9; scrSig="";
  HIST=HIST.filter(h=>h.t<=sn.t+1e-9); UNDO=UNDO.filter(h=>h.t<=sn.t+1e-9);
  recAt=sn.t; drawTray(); renderStatus(); syncScrub();
}
function record(){
  if(lab.t-recAt<5&&HIST.length) return;
  recAt=lab.t; HIST.push(snapshot("t"));
  if(HIST.length>1600){ const keep=[]; HIST.forEach((h,i)=>{ if(i>=800||i%2===0) keep.push(h); }); HIST=keep; }
}
/* call before anything the student does; a burst of plunger steps counts once */
function act(kind){
  const now=performance.now(), last=UNDO[UNDO.length-1];
  if(last&&last.kind===kind&&(kind==="pull")&&now-last.at<1500){ last.at=now; return; }
  UNDO.push(snapshot(kind)); if(UNDO.length>80) UNDO.shift();
}
const fmtT=t=>[Math.floor(t/3600),Math.floor(t%3600/60),Math.floor(t%60)].map(v=>String(v).padStart(2,"0")).join(":");
function rewind(sec){
  const target=lab.t-sec; let sn=null;
  for(let i=HIST.length-1;i>=0;i--) if(HIST[i].t<=target+1e-9){ sn=HIST[i]; break; }
  if(!sn) sn=HIST[0];
  if(!sn){ say(d().noHist,true); return; }
  restore(sn); say(d().rewound(fmtT(sn.t)));
}
function undo(){
  const sn=UNDO.pop(); if(!sn){ say(d().noHist,true); return; }
  restore(sn); say(d().undone);
}
let scrubbing=false;
function syncScrub(){ if(scrubbing) return; const s=$("scrub"); s.max=Math.max(1,HIST.length); s.value=HIST.length; }
$("scrub").addEventListener("input",e=>{ scrubbing=true; const i=Math.min(HIST.length-1,+e.target.value);
  const h=HIST[i]; if(h) $("clock").textContent="⟲ "+fmtT(h.t); });
$("scrub").addEventListener("change",e=>{ scrubbing=false; const i=+e.target.value;
  if(i<HIST.length){ const sn=HIST[i]; restore(sn); say(d().rewound(fmtT(sn.t))); } syncScrub(); });

function say(s,warn){ B.note={s,warn:!!warn,t:performance.now(),lt:lab.msg?lab.msgT:-1}; renderStatus(); }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const LIVE=/^(btn\d|power|pump|port[ACD]|valve[A-E]|syr_|plg_|cont_|hose[AC]|rack|sport|dend|scr|cyl|mains|inlet|mod[TFBS]|module|board)/;
/* the container whose footprint holds a desk point */
function contAt(w,except){
  for(const k of CONT_ORDER){ if(!B.contOn[k]||k===except) continue; const [x,z]=B.pos[k], f=FOOT[k];
    if(Array.isArray(f)){ if(Math.abs(w[0]-x)<=f[0]+1&&Math.abs(w[2]-z)<=f[1]+1) return k; }
    else if(Math.hypot(w[0]-x,w[2]-z)<=f+1.2) return k; }
  return null;
}
/* the blocks a container cannot stand on */
const BLOCKS=[[MX0-1,MZ0-1,MX1+1,MZ1+1],[BX0-1.5,BZ0-1.5,BX1+1.5,BZ1+1.5],[RACK.x-7.5,RACK.z-4.5,RACK.x+7.5,RACK.z+3.5]];
function hitsBlock(x,z,f){ const hx=Array.isArray(f)?f[0]:f, hz=Array.isArray(f)?f[1]:f;
  for(const [a,b,c,e] of BLOCKS) if(x+hx>a&&x-hx<c&&z+hz>b&&z-hz<e) return true;
  if(Math.hypot(x-CXW,z-CZW)<R_BASE+Math.max(hx,hz)*0.9+0.5) return true;
  if(Math.hypot(x-SYR_PORT[0],z-SYR_PORT[2])<Math.max(hx,hz)+1.5) return true;
  return false; }
function contSpot(k,w){
  const f=FOOT[k], hx=Array.isArray(f)?f[0]:f, hz=Array.isArray(f)?f[1]:f;
  const x=Math.max(DESK[0]+hx+1,Math.min(DESK[1]-hx-1,w[0])), z=Math.max(DESK[2]+hz+1,Math.min(DESK[3]-hz-1,w[2]));
  if(hitsBlock(x,z,f)) return null;
  for(const o of CONT_ORDER){ if(o===k||!B.contOn[o]) continue; const g=FOOT[o], [ox,oz]=B.pos[o];
    const gx=Array.isArray(g)?g[0]:g, gz=Array.isArray(g)?g[1]:g;
    if(Math.abs(x-ox)<hx+gx+0.6&&Math.abs(z-oz)<hz+gz+0.6) return null; }
  return [x,z];
}
function startCarry(t,drag){
  act("pick");
  if(t.startsWith("syr_")){ const k=t.slice(4), s=lab.syr[k]; s.attached=null; s.placed=null; B.carry={k:"syr",key:k,drag}; say(d().m.syrTake(d().syr[k])); }
  else if(t.startsWith("cont_")){ const k=t.slice(5);
    B.carry={k:"cont",key:k,drag}; say(d().m.contTake(d().contName[k])); }
  else if(t.startsWith("hose")){ const k=t[4]; B.carry={k:"hose",key:k,drag};
    if(k==="A") lab.hoseAin=null; else lab.hoseCin=null; lab.clip[k]=false; say(d().m.hoseTake(k)); }
  drawTray();
}
function placeCarry(p){
  const cr=B.carry, t=d().m, id=pick3(p[0],p[1])||"", w=deskPt(p);
  const idCont=id.startsWith("cont_")?id.slice(5):null;
  if(cr.k==="new"){
    const r=contSpot(cr.id,w);
    if(r){ act("place"); B.pos[cr.id]=r; B.contOn[cr.id]=true; B.carry=null; say(t.placed(d().trayItems[cr.id])); drawTray(); }
    else say(t.noFit,true);
    return;
  }
  if(cr.k==="cont"){
    const tgt=(idCont&&idCont!==cr.key)?idCont:contAt(w,cr.key);
    if(tgt){ B.carry=null; act("pour"); lab.pour(cr.key,tgt); return; }
    const old=B.pos[cr.key]; B.pos[cr.key]=[1e4,1e4]; const r=contSpot(cr.key,w); B.pos[cr.key]=old;
    if(!r){ if(cr.drag) B.carry=null; else say(t.noFit,true); return; }
    /* a hose in it has to reach the new spot */
    for(const hk of ["A","C"]) if((hk==="A"?lab.hoseAin:lab.hoseCin)===cr.key&&!hoseReach(hk,r[0],r[1])[2]){ if(cr.drag) B.carry=null; say(t.hoseShort(hk),true); return; }
    B.pos[cr.key]=r; B.carry=null; say(t.placed(d().contName[cr.key]));
    return;
  }
  if(cr.k==="hose"){
    const found=idCont||contAt(w,null), k=cr.key;
    if(found&&!hoseReach(k,B.pos[found][0],B.pos[found][1])[2]){ say(t.hoseShort(k),true); return; }
    if(!found){ const q=hoseReach(k,w[0],w[2]); w[0]=q[0]; w[2]=q[1]; }
    if(k==="A") lab.hoseAin=found; else lab.hoseCin=found;
    lab.clip[k]=false; B.hose[k]=[w[0],w[2]]; B.carry=null;
    if(found) lab.say("hoseTo",k,found,true); else say(t.hoseDown(k));
    return;
  }
  if(cr.k==="syr"){
    const k=cr.key, s=lab.syr[k];
    const put=(att,placed)=>{ s.attached=att; s.placed=placed; B.syrOn[k]=true; B.carry=null; drawTray(); };
    const dPort=Math.hypot(w[0]-SYR_PORT[0],w[2]-SYR_PORT[2]), dEnd=Math.hypot(w[0]-HOSE_D_END[0],w[2]-HOSE_D_END[2]);
    const busy=where=>["w","p"].some(o=>o!==k&&B.syrOn[o]&&lab.syr[o].attached===where);
    if(id==="dend"||(!lab.hconn.D&&dEnd<2.6)){ if(busy("Dh")){ say(t.noFit,true); return; } put("Dh","D"); lab.say("syrDirect"); return; }
    if(id==="sport"||dPort<2.6){ if(busy("D")){ say(t.noFit,true); return; } put("D","D"); lab.say("syrD"); return; }
    if(dPort<7||(!lab.hconn.D&&dEnd<7)){ lab.say("syrNotHome"); return; }
    const near=["w","p"].map(h=>[h,Math.hypot(w[0]-RACK.holes[h],w[2]-RACK.z)]).sort((a,b)=>a[1]-b[1]);
    if(id==="rack"||near[0][1]<4){
      const free=near.find(([h])=>!["w","p"].some(o=>o!==k&&B.syrOn[o]&&lab.syr[o].placed==="rack"&&B.sp[o]&&B.sp[o].hole===h));
      if(!free){ say(t.noFit,true); return; }
      act("syr"); B.sp[k]=Object.assign(B.sp[k]||{},{hole:free[0]}); put(null,"rack"); say(t.syrRack(d().syr[k])); return;
    }
    const c=idCont||contAt(w,null);
    if(c){ act("syr"); put(c,c); lab.say("nozzleIn","__syr"+k,c); return; }
    say(t.noFit,true);
  }
}
function cancelCarry(silent){
  const cr=B.carry; if(!cr) return;
  B.carry=null;
  if(cr.k==="syr"){ const s=lab.syr[cr.key]; B.syrOn[cr.key]=false; s.attached=null; s.placed=null;
    if(!cr.fromTray&&!silent) say(d().m.returned(d().syr[cr.key])); }
  else if(cr.k==="hose"){ B.hose[cr.key]=HOSE_HOME[cr.key].slice(); if(!silent) say(d().m.hoseDown(cr.key)); }
  drawTray();
}
function returnToTray(t){
  act("tray");
  if(t.startsWith("syr_")||t.startsWith("plg")){ const k=t.split("_")[1], s=lab.syr[k];
    s.attached=null; s.placed=null; B.syrOn[k]=false; say(d().m.returned(d().syr[k])); }
  else if(t.startsWith("cont_")){ const k=t.slice(5);
    if(lab.hoseAin===k){ lab.hoseAin=null; lab.clip.A=false; B.hose.A=HOSE_HOME.A.slice(); }
    if(lab.hoseCin===k){ lab.hoseCin=null; lab.clip.C=false; B.hose.C=HOSE_HOME.C.slice(); }
    for(const sk of ["w","p"]) if(lab.syr[sk].attached===k){ lab.syr[sk].attached=null; lab.syr[sk].placed=null; B.syrOn[sk]=false; }
    B.contOn[k]=false; say(d().m.returned(d().trayItems[k])); }
  else if(t.startsWith("hose")){ const k=t[4]; if(k==="A") lab.hoseAin=null; else lab.hoseCin=null; lab.clip[k]=false;
    B.hose[k]=HOSE_HOME[k].slice(); say(d().m.hoseDown(k)); }
  drawTray();
}
function clickAction(t){
  B.note=null;
  if(t.startsWith("btn")){ act("btn"); lab.pressButton(+t[3]); }
  else if(t==="power"){ act("power"); lab.pressPower(); }
  else if(t==="pump"){ act("pump"); lab.pressPump(); }
  else if(t.startsWith("port")){ act("port"); lab.toggleHose(t[4]); }
  else if(t.startsWith("valve")){ act("valve"); lab.toggleValve(t[5]); }
  else if(t.startsWith("plgtoggle_")){ act("plunger"); lab.removePlunger(t[10]); }
  else if(t==="mains"||t==="inlet"){ act("mains"); lab.plugMains(); }
  else if(t==="scr"||t==="modT") return goTo("screen");
  else if(t==="modF"||t==="module") return goTo("front");
  else if(t==="modB") return goTo("back");
  else if(t==="modS") return goTo("side");
  else if(t==="board") return goTo("board");
  else if(t==="cyl") return goTo("cyl");
  else if(t==="cyltop") return goTo("cyltop");
  else return false;
  scrSig=""; renderStatus(); return true;
}
function hudAt(p){ for(const [id,a,b,c,e] of B.hud) if(p[0]>=a&&p[0]<=c&&p[1]>=b&&p[1]<=e) return id; return null; }
/* a carried part is picked from under it, not from itself */
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  const p=mousePos(e); B.mouse=p; B.mouseW=deskPt(p);

  if(e.button===1||e.button===2){ B.down={p0:p,last:p,pan:true,btn:e.button,moved:false}; return; }

  const h=hudAt(p); if(h){ clickAction(h); return; }
  const t=pick3(p[0],p[1]);
  if(t&&clickAction(t)) return;
  if(t&&t.startsWith("plg_")){ act("pull"); B.plDrag=[t.slice(4),p[1]]; return; }
  if(t&&(t.startsWith("syr_")||t.startsWith("cont_")||t.startsWith("hose"))){ B.down={t,p0:p,last:p,moved:false}; return; }

cv.addEventListener("pointermove",e=>{
  const p=mousePos(e), dn=B.down; B.mouse=p; B.mouseW=deskPt(p);
  if(B.plDrag){ const [k,y0]=B.plDrag, dy=(y0-p[1])/(CAM.k*Math.max(0.25,Math.cos(CAM.pitch))), dd=dy*100/SY.len;
    if(Math.abs(dd)>=0.5){ act("pull"); lab.syringePull(k,Math.round(dd)); B.plDrag=[k,p[1]]; } return; }
  if(!dn){ const t=B.carry?null:pick3(p[0],p[1]); cv.classList.toggle("hand",!!(t&&LIVE.test(t))||!!hudAt(p)); return; }
  if(Math.hypot(p[0]-dn.p0[0],p[1]-dn.p0[1])>5) dn.moved=true;
  if(!dn.moved) return;
  if(dn.t){ startCarry(dn.t,true); B.down=null; return; }
  const dx=p[0]-dn.last[0], dy=p[1]-dn.last[1]; dn.last=p;
  CAM.touched=true; CAMTW=null;
  if(dn.pan){ CAM.px+=dx; CAM.py+=dy; } else { CAM.yaw+=dx*0.008; CAM.pitch=Math.min(1.45,Math.max(0.08,CAM.pitch+dy*0.006)); }

  if(dn&&dn.t&&!dn.moved){ const t=dn.t;
    if(t.startsWith("hose")){ const k=t[4], inside=k==="A"?lab.hoseAin:lab.hoseCin;

  KEYS.forEach(([kx,ky],i)=>{ if(Math.abs(u-kx)<=KEYW/2+6&&Math.abs(v-ky)<=KEYW/2+6){ ZKEY=i; clickAction("btn"+(i+1)); drawZoom(); } }); });
addEventListener("pointerup",()=>{ if(ZKEY>=0){ ZKEY=-1; drawZoom(); } });
$("zoom").addEventListener("pointerdown",e=>{ if(e.target===$("zoom")) closeZoom(); });
$("zx").onclick=closeZoom;
addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(ZOOM) closeZoom(); else if(VIEW!=="all"&&!B.carry) goTo("all"); } });
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.code==="KeyZ"){ e.preventDefault(); undo(); return; }
  if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON"){ e.preventDefault(); running=!running; renderSpeeds(); } });

/* message arguments that name things are translated when shown */
const baseM={ko:{...T.ko.m},en:{...T.en.m}};
for(const l of ["ko","en"]){
  T[l].m.hoseTo=(k,dst,found)=>baseM[l].hoseTo(k,dst==="__bench"?T[l].bench:T[l].contName[dst]||dst,found);
  T[l].m.nozzleIn=(s,c)=>baseM[l].nozzleIn(T[l].syr[s.replace("__syr","")],T[l].contName[c]);
  T[l].m.poured=(v,a,b)=>baseM[l].poured(v,T[l].contName[a],T[l].contName[b]);
}
function renderStatus(){
  const L_=[], t=d();
  if(!Object.values(B.contOn).some(Boolean)&&!B.syrOn.w&&!B.syrOn.p) L_.push([t.st.nothing,false]);
  if(!lab.power) L_.push([t.st.off,false]);
  if(!running) L_.push([t.st.paused,true]);
  const fresh=lab.msg&&(lab.t-lab.msgT)<12*Math.max(1,speed/4);
  const labNote=fresh?{s:(()=>{ const f=t.m[lab.msg.k]; return typeof f==="function"?f(...lab.msg.a):f; })(),warn:WARN.has(lab.msg.k),t:lab.msgT}:null;
  const own=B.note&&performance.now()-B.note.t<9000&&!(lab.msg&&lab.msgT>B.note.lt)?B.note:null;
  for(const n of [own,labNote]) if(n&&n.s) L_.push(["• "+n.s,n.warn]);
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L_){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
function renderSpeeds(){
  const box=$("speeds"); box.innerHTML="";
  for(const sp of [1,10,60,300]){ const b=document.createElement("button"); b.textContent="×"+sp; if(sp===speed) b.className="on";
    b.onclick=()=>{ speed=sp; renderSpeeds(); }; box.appendChild(b); }
  const p=document.createElement("button"); p.textContent=running?"❚❚":"▶"; p.title=running?d().pause:d().run;
  if(!running) p.className="on"; p.onclick=()=>{ running=!running; renderSpeeds(); }; box.appendChild(p);
}
function renderRewind(){
  const box=$("rewind"); box.innerHTML="";
  for(const [lbl,sec] of d().rw){ const b=document.createElement("button"); b.textContent=lbl; b.onclick=()=>rewind(sec); box.appendChild(b); }
  const u=document.createElement("button"); u.textContent=d().undo; u.onclick=undo; u.style.flex="1.6"; box.appendChild(u);
}


/* ══════════════════════════════════════════════════════════════
   11.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("t-benchcap").textContent=t.benchcap; $("t-tray").textContent=t.tray;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint; $("t-h-how").textContent=t.hHow;
  $("t-howto").textContent=t.howto; $("session").textContent=t.session(lab.seed);
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2026 E — 이상 기체, 증기압, 열전도 · HaslaLab":"IPhO 2026 E — Ideal Gas, Vapor Pressure and Heat Conduction · HaslaLab";
  drawTray(); renderSpeeds(); renderRewind(); renderStatus(); renderViewBtn(); if(ZOOM) openZoom(ZOOM);
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   12.  MAIN LOOP  —  1 s physics steps, at most 20 ms of work a frame
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), acc=0, ui=0;
function tick(){
  const now=performance.now(); let real=(now-last)/1000; last=now; if(real>0.25) real=0.25;
  if(running){
    acc+=real*speed; const budget=performance.now()+20;
    while(acc>0){ const dt=acc>1?1:acc; lab.step(dt); acc-=dt; record(); if(performance.now()>budget){ acc=0; break; } }
  }
  if(CW>10) draw();
  if(!scrubbing) $("clock").textContent=fmtT(lab.t);
  if(++ui%8===0){ renderStatus(); syncScrub(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
paintStatic(); paintStatic2(); layout(); applyLang(); record(); requestAnimationFrame(tick);
</script>
