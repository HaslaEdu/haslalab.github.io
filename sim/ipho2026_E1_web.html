function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
class RNG{ constructor(s){ this.r=mulberry32(s>>>0); }

  gauss(mu,sd){ let u=0,v=0; while(!u)u=this.r(); while(!v)v=this.r(); return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); } }
const WARN=new Set(["heaterWet","indicatorRed","nothingPour","mixedSyr","openE","hoseDOut","valveDClosed","openEtoo","spilt","mixedIC",
  "connectFirst","hoseSlipped","hoseNot","valvesAC","hosePortOut","ocFull","keepLevel","heaterOff","barrelOver","barrelEmpty","hoseFirst","syrNotHome"]);

class Container{
  constructor(key,vol,T,kind,cap){ this.key=key; this.vol=vol; this.T=T; this.kind=kind; this.cap=cap; }
  take(mL){ mL=Math.min(mL,this.vol); this.vol-=mL; return mL; }
  give(mL,T,kind){
    if(this.vol<1e-9) this.kind=kind; else if(kind!==this.kind&&this.kind!=="waste") this.kind="mixed";
    const tot=this.vol+mL; if(tot>0) this.T=(this.T*this.vol+T*mL)/tot; this.vol=Math.min(this.cap,tot);

}
class Syringe{ constructor(key){ this.key=key; this.cap=100; this.vol=0; this.plunger=0; this.kind=null; this.T=24;
  this.hasPlunger=true; this.attached=null; this.placed=null; this.x=0; this.y=0; } }

/* ══════════════════════════════════════════════════════════════
   2.  THE APPARATUS  —  step(dt) advances the physics
   ══════════════════════════════════════════════════════════════ */
class Lab{
  constructor(seed){
    if(seed===undefined) seed=1+Math.floor(Math.random()*999998);
    this.seed=seed; const g=new RNG(seed); this.rng=new RNG(seed*7919+13);
    /* hidden physical truths (never shown) */
    this.lam=g.uniform(0.235,0.265);
    this.ccS=g.uniform(4600,4800);
    const pv339=g.uniform(17.6,19.6);
    this.ccC=Math.log(pv339)+this.ccS/339;
    this.pvTab=new Float64Array(PV_N+1);
    for(let i=0;i<=PV_N;i++) this.pvTab[i]=1e3*Math.exp(this.ccC-this.ccS/(PV_T0+i*0.05));
    this.P_atm0=g.uniform(94.4e3,96.0e3); this.P_atm=this.P_atm0; this.drift=0;
    this.T_amb=g.uniform(22,26); this.P_heat=g.uniform(180,220);
    this.Renv_oc=g.uniform(2.05,2.75); this.Renv_ic=g.uniform(100,200);
    this.r1=R1+g.uniform(-1e-4,1e-4); this.r2=R2+g.uniform(-1e-4,1e-4);
    this.A_ic=Math.PI*this.r1**2;
    this.A_oc=Math.PI*((R_OC_IN+g.uniform(-1e-4,1e-4))**2-this.r2**2);
    this.p_gain=g.uniform(1.004,1.034); this.p_off=g.uniform(-3.0e3,0.5e3);
    this.ti_gain=g.uniform(0.9965,1.0035); this.ti_off=g.uniform(-0.4,0.4);
    this.te_gain=g.uniform(0.9965,1.0035); this.te_off=g.uniform(-0.4,0.4);
    this.tau_probe=g.uniform(5,9); this.tau_press=1.2;
    this.t=0; this.power=false; this.pump=false; this.heater=false; this.heaterHot=false;
    this.timer=0; this.timerRun=false; this.graphMode=false;
    this.valve={A:false,B:false,C:false,D:false,E:false};
    this.h_oc=0; this.T_oc=this.T_amb; this.strat=0;
    this.icKind=null; this.h_ic=0; this.T_ic=this.T_amb;
    this.n_air=this.P_atm*this.A_ic*L_IC/(R_GAS*(this.T_amb+T0K));
    this.hoseAin=null; this.hoseCin=null; this.clip={A:false,C:false}; this.hconn={A:true,C:true,D:true};
    this.primed=false; this.purging=false; this.slip=0;
    this.containers={pg:new Container("pg",100,this.T_amb,"pg",120), cold:new Container("cold",500,g.uniform(3,7),"water",600),
      room:new Container("room",1500,this.T_amb,"water",1500), pour:new Container("pour",0,this.T_amb,"water",1200),
      jug:new Container("jug",0,this.T_amb,"waste",3000)};
    this.syr={w:new Syringe("w"),p:new Syringe("p")};
    this.s_tint=this.T_ic; this.s_text=this.T_oc; this.s_press=this.P_atm;
    this.msg=null; this.msgT=-99;
  }
  say(k,...a){ this.msg={k,a}; this.msgT=this.t+1e-9*(++this.msgN||(this.msgN=1)); }
  pv(T){ const u=(T-PV_T0)*20, i=Math.floor(u);
    if(i<0) return this.pvTab[0]; if(i>=PV_N) return 1e3*Math.exp(this.ccC-this.ccS/T);
    const a=this.pvTab[i]; return a+(this.pvTab[i+1]-a)*(u-i); }
  /* the bore is far wider than the capillary length: flat in the middle, a ring of

  meniscus(){

    let g,rho,th;
    if(this.icKind==="pg"){ g=GAMMA_PG; rho=RHO_PG; th=THETA_PG; }
    else { g=Math.max(0.02,GAMMA_W20+DGAMMA_W*(this.T_ic-20)); rho=RHO0; th=THETA_W; if(this.icKind==="mixed") g*=0.75; }

  get H(){ return Math.max(0,L_IC-this.h_ic); }
  get V_air(){ return Math.max(1e-9,this.A_ic*this.H-this.vMen); }
  get R_wall(){ const h=Math.max(Math.min(this.h_ic,this.h_oc),0.005); return Math.log(this.r2/this.r1)/(2*Math.PI*this.lam*h); }

  icVented(){

  rPatm(){ return this.power?Math.round((this.P_atm/1000+this.rng.gauss(0,0.03))*10)/10:null; }
  rTint(){ return this.power?Math.round((this.ti_gain*this.s_tint+this.ti_off+this.rng.gauss(0,0.05))*10)/10:null; }
  rText(){ return this.power?Math.round((this.te_gain*this.s_text+this.te_off+this.rng.gauss(0,0.05))*10)/10:null; }

  pressButton(n){

    else if(n===2) this.timer=0;
    else if(n===3){ this.graphMode=!this.graphMode; this.say("graph"); }
    else if(n===4){
      if(this.h_oc<0.04){ this.say("heaterWet"); return; }

  pressPump(){ if(!this.power){ this.say("noPower"); return; } this.pump=!this.pump; }

  }
  toggleHose(k){ this.hconn[k]=!this.hconn[k]; this.say(this.hconn[k]?"hoseIn":"hoseOut",k); }
  toggleClip(k){ this.clip[k]=!this.clip[k]; this.say("clip",k,this.clip[k]); }
  pour(src,dst,mL){

    const got=a.take(Math.min(mL,Math.max(0,b.cap-b.vol)));

  }
  syringePull(key,dmL){
    const s=this.syr[key];

    const nw=Math.min(s.cap,Math.max(0,s.plunger+dmL)), dd=nw-s.plunger;
    if(Math.abs(dd)<1e-9) return;

      else { const give=Math.min(s.vol,-dd); if(give>0){ c.give(give,s.T,s.kind||"water"); s.vol-=give; } }

    }
    if(s.attached==="Dh"){
      if(!this.valve.E){ this.say("openE"); s.plunger-=dd; return; }
      if(dd<0){ const give=Math.min(s.vol,-dd,(L_IC-this.h_ic)*this.A_ic*1e6); if(give>0){ this.addToIC(give,s.kind,s.T); s.vol-=give; } }
      else { const take=Math.min(dd,this.h_ic*this.A_ic*1e6);

    }
    if(s.attached==="D"){

      if(!this.valve.D){ this.say("valveDClosed"); s.plunger-=dd; return; }
      if(!this.valve.E){ this.say("openEtoo"); s.plunger-=dd; return; }
      if(dd<0){ const give=Math.min(s.vol,-dd,(L_IC-this.h_ic)*this.A_ic*1e6); if(give<=0) return;

      else { const take=Math.min(dd,this.h_ic*this.A_ic*1e6); if(take<=0) return;
        this.h_ic-=take*1e-6/this.A_ic;

        s.vol+=take; if(this.h_ic<1e-4){ this.h_ic=0; this.icKind=null; } this.reseal(); }

  }
  addToIC(mL,kind,T){

  }
  removePlunger(key){

      else if(drain&&this.hconn.C&&!this.hoseCin) this.say("hoseNot","C");

      if(fill&&!this.hconn.A) this.say("hosePortOut","A");
      else if(drain&&!this.hconn.C) this.say("hosePortOut","C");

        const got=c.take(Math.min(rate,Math.max(0,(L_OC-this.h_oc)*this.A_oc*1e6)));

        if(out>0){ this.containers[this.hoseCin].give(out,this.T_oc,"water"); this.h_oc-=out*1e-6/this.A_oc; }
      }

    let Q=0;
    if(this.heater&&this.power&&this.h_oc>0.04){

    } else if(this.heater&&this.h_oc<=0.04){ this.heater=false; this.say("heaterOff"); }

    const Coc=Math.max(C0*RHO0*this.A_oc*this.h_oc+40,40);

    }
  }
}

  if(SYR_KEY[name]){ R2(x-15,y-4,x+11,y+4,"#dfe8ef","#9aa6b0"); R2(x+11,y-1,x+16,y+1,"#4f9ad0"); R2(x-19,y-6,x-15,y+6,"#dfe8ef");
    if(name==="syrP") R2(x-8,y-2,x+4,y+2,"#c8bd72"); else R2(x-8,y-2,x+4,y+2,"#2f8fc4"); }
  else if(name==="pg"){ R2(x-6,y-8,x+6,y+12,"#e9edf0","#9aa6b0"); R2(x-3,y-12,x+3,y-8,"#ddd"); R2(x-5,y+2,x+5,y+11,"#c8bd72"); }
  else if(name==="cold"){ R2(x-7,y-12,x+7,y+12,"#8a9aa8","#5b6873"); R2(x-4,y-15,x+4,y-12,"#394650"); }
  else if(name==="room"){ R2(x-8,y-9,x+8,y+13,"#e9edf0","#9aa6b0"); R2(x-7,y-2,x+7,y+12,"#2f8fc4"); R2(x-3,y-14,x+3,y-9,"#2f7fbf"); }
  else if(name==="pour"){ R2(x-9,y-9,x+7,y+12,"#e9edf0","#9aa6b0"); c.strokeStyle=g||"#9aa6b0"; c.lineWidth=2; c.beginPath(); c.arc(x+8,y+1,6,-1.3,1.3); c.stroke(); }
  else if(name==="jug"){ R2(x-15,y-5,x+15,y+9,"#e9edf0","#9aa6b0"); }
}
function drawTray(){
  const c=trayCtx;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,TRW,TRH); c.fillStyle="#15181d"; c.fillRect(0,0,TRW,TRH);
  trayCells=[];
  let y=6; const wd=TRW-12;
  for(const name of TRAY_ORDER){
    const out=trayOut(name), cr=B.carry;
    const sel=cr&&((cr.k==="new"&&cr.id===name)||(cr.k==="syr"&&SYR_KEY[name]===cr.key&&cr.fromTray));
    c.fillStyle=out?"#171a1e":"#1f242b"; c.fillRect(6,y,wd,TRAY_ROW-4);
    c.strokeStyle=sel?"#f2c14e":"#353b43"; c.lineWidth=1; c.strokeRect(6.5,y+0.5,wd-1,TRAY_ROW-5);
    trayIcon(c,name,28,y+(TRAY_ROW-4)/2,out);
    c.font='12px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="left"; c.textBaseline="middle";
    c.fillStyle=out?"#868e96":"#e8eef2"; c.fillText(d().trayItems[name],52,y+15);
    c.font='9.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.fillStyle="#69717a";
    c.fillText(out?d().trayOut:d().trayTake,52,y+31);
    trayCells.push([name,y,y+TRAY_ROW-4]); y+=TRAY_ROW;
  }
  c.font='10.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign="center"; c.textBaseline="top"; c.fillStyle="#69717a";
  d().trayHelp.split("\n").forEach((ln,i)=>c.fillText(ln,TRW/2,y+6+i*14));
}
trayCv.addEventListener("click",e=>{
  const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top;
  for(const [name,y0,y1] of trayCells){
    if(y<y0||y>y1) continue;
    cancelCarry(true);
    if(trayOut(name)){ say(d().trayOut); return; }
    if(SYR_KEY[name]){ B.carry={k:"syr",key:SYR_KEY[name],fromTray:true}; say(d().m.syrTake(d().syr[SYR_KEY[name]])); }
    else { B.carry={k:"new",id:name}; say(d().m.placeIt(d().trayItems[name])); }
    drawTray(); return;
  }
});
function drawCards(){
  const c=cardCtx, W=CRW, H=CRH, s=W/270;
  c.setTransform(DPR*s,0,0,DPR*s,0,0);
  c.fillStyle="#12161b"; c.fillRect(0,0,270,H/s);
  const txt=(t,x,y,col,sz,al,font)=>{ c.font=sz+"px "+(font||'"Malgun Gothic",sans-serif'); c.fillStyle=col; c.textAlign=al||"left"; c.textBaseline="middle"; c.fillText(t,x,y); };
  /* Fig. 18 */
  txt("Fig. 18",10,14,"#6b757f",11);
  c.strokeStyle=ACRYL; c.lineWidth=1.5; c.strokeRect(24,26,40,84);
  c.fillStyle="#2f8fc4"; c.fillRect(25,72,38,37);
  c.strokeStyle=INK; c.lineWidth=1; c.beginPath(); c.moveTo(74,27); c.lineTo(74,71); c.moveTo(74,73); c.lineTo(74,109); c.stroke();
  txt("H",82,49,INK,14); txt("h",82,91,INK,14);
  /* Fig. 15 */
  txt("Fig. 15",140,14,"#6b757f",11);
  const valve=(vx,vy,open)=>{ c.fillStyle="#c6ced6"; c.fillRect(vx-18,vy-7,36,14); c.beginPath(); c.arc(vx,vy,10,0,7); c.fillStyle="#7d868f"; c.fill();
    c.fillStyle=open?"#4ad07a":"#d95c4a"; if(open) c.fillRect(vx-3,vy-26,6,18); else c.fillRect(vx+8,vy-3,18,6); };
  valve(160,52,true); txt(d().vOpen,190,52,DIM,12);
  valve(160,98,false); txt(d().vShut,190,98,DIM,12);
  /* Fig. 17 */
  txt("Fig. 17",10,138,"#6b757f",11);
  const cx=62, cy=190, r=44;
  for(const f of [1,0.91,0.545,0.455]){ c.beginPath(); c.arc(cx,cy,r*f,0,7); c.strokeStyle=ACRYL; c.lineWidth=1.3; c.stroke(); }
  d().fig17.forEach((t,i)=>txt(t,114,168+i*20,"#9fb0bf",10.5,"left",'ui-monospace,Consolas,monospace'));
}

/* ══════════════════════════════════════════════════════════════
   7.  INTERACTION
   ══════════════════════════════════════════════════════════════ */
function say(s,warn){ B.note={s,warn:!!warn,t:performance.now(),lt:lab.msg?lab.msgT:-1}; renderStatus(); }
function mousePos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function contAt(x,y,except){
  for(const k of CONT_ORDER){ if(!B.contOn[k]||k===except) continue; const [a,b,dd,e]=CONT[k];
    if(x>=a-12&&x<=dd+12&&y>=b-12&&y<=e+12) return k; }
  return null;
}
function startCarry(t,drag){
  if(t.startsWith("syr_")){ const k=t.slice(4), s=lab.syr[k]; s.attached=null; s.placed=null; B.carry={k:"syr",key:k,drag}; say(d().m.syrTake(d().syr[k])); }
  else if(t.startsWith("cont_")){ B.carry={k:"cont",key:t.slice(5),drag}; say(d().m.contTake(d().contName[t.slice(5)])); }
  else if(t.startsWith("hose")){ const k=t[4]; B.carry={k:"hose",key:k,drag};
    if(k==="A") lab.hoseAin=null; else lab.hoseCin=null; lab.clip[k]=false; say(d().m.hoseTake(k)); }
}
function placeCarry(p){
  const cr=B.carry, [x,y]=p, t=d().m;
  if(cr.k==="new"){
    const [a,b,dd,e]=CONT[cr.id];
    if(x>=a-14&&x<=dd+14&&y>=b-40&&y<=e+14){ B.contOn[cr.id]=true; B.carry=null; say(t.placed(d().trayItems[cr.id])); drawTray(); }
    else say(t.noFit,true);
    return;
  }
  if(cr.k==="cont"){
    const tgt=contAt(x,y,cr.key);
    B.carry=null;
    if(tgt) lab.pour(cr.key,tgt);
    return;
  }
  if(cr.k==="hose"){
    const found=contAt(x,y,null), k=cr.key;
    if(k==="A") lab.hoseAin=found; else lab.hoseCin=found;
    lab.clip[k]=false; B.hose[k]=[x,y]; B.carry=null;
    if(found) lab.say("hoseTo",k,found,true); else say(t.hoseDown(k));
    return;
  }
  if(cr.k==="syr"){
    const k=cr.key, s=lab.syr[k], [hx,hy]=HOSE_D_END;
    const nx=x, ny=y;
    const put=(ax,ay)=>{ s.x=ax-SW/2; s.y=ay-SH-20; B.syrOn[k]=true; B.carry=null; drawTray(); };
    if(Math.hypot(nx-hx,ny-hy)<20){ put(hx,hy); s.attached="Dh"; s.placed="D"; lab.say("syrDirect"); return; }
    const dPort=Math.hypot(nx-SYR_PORT[0],ny-SYR_PORT[1]);
    if(dPort<22){ put(SYR_PORT[0],SYR_PORT[1]); s.attached="D"; s.placed="D"; lab.say("syrD"); return; }
    if(dPort<70||Math.hypot(nx-hx,ny-hy)<70){ lab.say("syrNotHome"); return; }
    const hole=RACK.holes[k];
    if(Math.hypot(nx-hole,ny-RACK.y)<26){ put(hole,RACK.y+6); s.attached=null; s.placed="rack"; say(t.syrRack(d().syr[k])); return; }
    const c=contAt(nx,ny,null);
    if(c){ const [a,b,dd,e]=CONT[c]; const yy=Math.max(ny,b+10); put(nx,yy); s.attached=c; s.placed=c; lab.say("nozzleIn","__syr"+k,c); return; }
    say(t.noFit,true);
  }
}
function cancelCarry(silent){
  const cr=B.carry; if(!cr) return;
  B.carry=null;
  if(cr.k==="syr"){ const s=lab.syr[cr.key];
    if(cr.fromTray){ B.syrOn[cr.key]=false; }
    else { B.syrOn[cr.key]=false; s.attached=null; s.placed=null; if(!silent) say(d().m.returned(d().syr[cr.key])); } }
  else if(cr.k==="hose"){ B.hose[cr.key]=HOSE_HOME[cr.key].slice(); if(!silent) say(d().m.hoseDown(cr.key)); }
  drawTray();
}
function returnToTray(t){
  if(t.startsWith("syr_")||t.startsWith("plg")){ const k=t.split("_")[1], s=lab.syr[k];
    s.attached=null; s.placed=null; B.syrOn[k]=false; say(d().m.returned(d().syr[k])); }
  else if(t.startsWith("cont_")){ const k=t.slice(5);
    if(lab.hoseAin===k){ lab.hoseAin=null; lab.clip.A=false; B.hose.A=HOSE_HOME.A.slice(); }
    if(lab.hoseCin===k){ lab.hoseCin=null; lab.clip.C=false; B.hose.C=HOSE_HOME.C.slice(); }
    for(const sk of ["w","p"]) if(lab.syr[sk].attached===k){ lab.syr[sk].attached=null; lab.syr[sk].placed=null; B.syrOn[sk]=false; }
    B.contOn[k]=false; say(d().m.returned(d().trayItems[k])); }
  else if(t.startsWith("hose")){ const k=t[4]; if(k==="A") lab.hoseAin=null; else lab.hoseCin=null; lab.clip[k]=false;
    B.hose[k]=HOSE_HOME[k].slice(); say(d().m.hoseDown(k)); }
  drawTray();
}
function clickAction(t){
  B.note=null;
  if(t.startsWith("btn")) lab.pressButton(+t[3]);
  else if(t==="power") lab.pressPower();
  else if(t==="pump") lab.pressPump();
  else if(t.startsWith("port")) lab.toggleHose(t[4]);
  else if(t.startsWith("valve")) lab.toggleValve(t[5]);
  else if(t.startsWith("plgtoggle_")) lab.removePlunger(t[10]);
  else return false;
  return true;
}
function onDown(p){
  const L_=toLog(...p); B.mouse=p; B.mouseL=L_;
  if(B.carry&&!B.carry.drag){ placeCarry(L_); return; }
  const t=hit(...L_);
  if(t&&clickAction(t)) return;
  if(t&&t.startsWith("plg_")){ B.plDrag=[t.slice(4),L_[1]]; return; }
  if(t&&(t.startsWith("syr_")||t.startsWith("cont_")||t.startsWith("hose"))){ B.down={t,p0:p}; return; }
  B.pan0=[p[0],p[1],CAM.pan[0],CAM.pan[1]]; cv.classList.add("dragging");
}
function onMove(p){
  B.mouse=p; B.mouseL=toLog(...p);
  if(B.plDrag){ const [k,y0]=B.plDrag, y=B.mouseL[1], dd=(y0-y)*(100/SH);
    if(Math.abs(dd)>=0.5){ lab.syringePull(k,dd); B.plDrag=[k,y]; } return; }
  if(B.down&&Math.hypot(p[0]-B.down.p0[0],p[1]-B.down.p0[1])>6){ startCarry(B.down.t,true); B.down=null; return; }
  if(B.pan0){ CAM.touched=true; CAM.pan=[B.pan0[2]+p[0]-B.pan0[0],B.pan0[3]+p[1]-B.pan0[1]]; }
}
function onUp(p){
  const L_=toLog(...p);
  if(B.down){ const t=B.down.t; B.down=null;
    if(t.startsWith("hose")){ const k=t[4], inside=k==="A"?lab.hoseAin:lab.hoseCin;
      if(inside){ lab.toggleClip(k); return; } }
    startCarry(t,false); return; }
  if(B.carry&&B.carry.drag){ B.carry.drag=false; placeCarry(L_); if(B.carry&&B.carry.k==="syr"){ /* nowhere to go: keep holding */ } }
  B.plDrag=null; B.pan0=null; cv.classList.remove("dragging");
}
cv.addEventListener("mousedown",e=>{ if(e.button===0) onDown(mousePos(e)); });
window.addEventListener("mousemove",e=>{ if(e.target===cv||B.down||B.plDrag||B.pan0||(B.carry&&B.carry.drag)) onMove(mousePos(e)); });
window.addEventListener("mouseup",e=>{ if(e.button===0) onUp(mousePos(e)); });
cv.addEventListener("contextmenu",e=>{ e.preventDefault();
  if(B.carry){ const cr=B.carry;
    if(cr.k==="cont"){ B.carry=null; return; }
    cancelCarry(false); return; }
  const t=hit(...toLog(...mousePos(e)));
  if(t&&(t.startsWith("syr_")||t.startsWith("plg")||t.startsWith("cont_")||t.startsWith("hose"))) returnToTray(t);
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=mousePos(e), L_=toLog(...p), t=hit(...L_), dir=e.deltaY<0?1:-1;
  if(t&&(t.startsWith("syr_")||t.startsWith("plg_"))){ lab.syringePull(t.split("_")[1],dir*(e.shiftKey?5:1)); return; }
  if(t&&t.startsWith("valve")){ const v=t[5]; if(lab.valve[v]!==(dir>0)) lab.toggleValve(v); return; }
  CAM.z=Math.max(0.7,Math.min(6,CAM.z*(dir>0?1.15:1/1.15))); CAM.touched=true;
  const k=kk(); CAM.pan=[p[0]-L_[0]*k,p[1]-L_[1]*k];
},{passive:false});
cv.addEventListener("touchstart",e=>{ if(e.touches.length!==1) return; e.preventDefault();
  const r=cv.getBoundingClientRect(); onDown([e.touches[0].clientX-r.left,e.touches[0].clientY-r.top]); },{passive:false});
cv.addEventListener("touchmove",e=>{ if(e.touches.length!==1) return; e.preventDefault();
  const r=cv.getBoundingClientRect(); onMove([e.touches[0].clientX-r.left,e.touches[0].clientY-r.top]); },{passive:false});
cv.addEventListener("touchend",()=>onUp(B.mouse),{passive:true});
document.addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON"){ e.preventDefault(); running=!running; renderSpeeds(); } });
$("fitBtn").onclick=()=>{ CAM.z=1; CAM.touched=false; fit(); };

/* message arguments that name things are translated when shown */
const baseM={ko:{...T.ko.m},en:{...T.en.m}};
for(const l of ["ko","en"]){
  T[l].m.hoseTo=(k,dst,found)=>baseM[l].hoseTo(k,dst==="__bench"?T[l].bench:T[l].contName[dst]||dst,found);
  T[l].m.nozzleIn=(s,c)=>baseM[l].nozzleIn(T[l].syr[s.replace("__syr","")],T[l].contName[c]);
  T[l].m.poured=(v,a,b)=>baseM[l].poured(v,T[l].contName[a],T[l].contName[b]);
}
let lastLabMsg=null;
function renderStatus(){
  const L_=[], t=d();
  if(!Object.values(B.contOn).some(Boolean)&&!B.syrOn.w&&!B.syrOn.p) L_.push([t.st.nothing,false]);
  if(!lab.power) L_.push([t.st.off,false]);
  if(!running) L_.push([t.st.paused,true]);
  const fresh=lab.msg&&(lab.t-lab.msgT)<12*Math.max(1,speed/4);
  const labNote=fresh?{s:(()=>{ const f=t.m[lab.msg.k]; return typeof f==="function"?f(...lab.msg.a):f; })(),warn:WARN.has(lab.msg.k),t:lab.msgT}:null;
  const own=B.note&&performance.now()-B.note.t<9000&&!(lab.msg&&lab.msgT>B.note.lt)?B.note:null;
  for(const n of [own,labNote]) if(n&&n.s) L_.push(["• "+n.s,n.warn]);
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L_){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="warn"; box.appendChild(el); }
}
function renderSpeeds(){
  const box=$("speeds"); box.innerHTML="";
  for(const sp of [1,10,60,300]){ const b=document.createElement("button"); b.textContent="×"+sp; if(sp===speed) b.className="on";
    b.onclick=()=>{ speed=sp; renderSpeeds(); }; box.appendChild(b); }
  const p=document.createElement("button"); p.textContent=running?"❚❚":"▶"; p.title=running?d().pause:d().run;
  if(!running) p.className="on"; p.onclick=()=>{ running=!running; renderSpeeds(); }; box.appendChild(p);
}

/* ══════════════════════════════════════════════════════════════
   8.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub;
  $("t-benchcap").textContent=t.benchcap; $("t-tray").textContent=t.tray;
  $("t-h-time").textContent=t.hTime; $("t-timehint").textContent=t.timeHint;
  $("t-h-cards").textContent=t.hCards; $("t-h-view").textContent=t.hView; $("fitBtn").textContent=t.fitBtn;
  $("t-howto").textContent=t.howto; $("session").textContent=t.session(lab.seed);
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2026 E — 이상 기체, 증기압, 열전도 · HaslaLab":"IPhO 2026 E — Ideal Gas, Vapor Pressure and Heat Conduction · HaslaLab";
  drawTray(); drawCards(); renderSpeeds(); renderStatus();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   9.  MAIN LOOP  —  1 s physics steps, at most 20 ms of work a frame
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), acc=0, ui=0;
function tick(){
  const now=performance.now(); let real=(now-last)/1000; last=now; if(real>0.25) real=0.25;
  if(running){
    acc+=real*speed; const budget=performance.now()+20;
    while(acc>0){ const dt=acc>1?1:acc; lab.step(dt); acc-=dt; if(performance.now()>budget){ acc=0; break; } }
  }
  if(CW>10) draw();
  const tt=lab.t; $("clock").textContent=[Math.floor(tt/3600),Math.floor(tt%3600/60),Math.floor(tt%60)].map(v=>String(v).padStart(2,"0")).join(":");
  if(++ui%8===0) renderStatus();
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
layout(); applyLang(); requestAnimationFrame(tick);
