en:`<h4>Apparatus</h4>
<ul>
<li>Outer cylinder (OC) and inner cylinder (IC) — acrylic, cross-section in Fig. 17 (outer 74.8 mm, inner 33.7 mm, walls 3.4 mm).</li>
<li>The OC holds the heater and the external temperature probe; the IC head carries the internal temperature and pressure lines.</li>
<li>Electronic module: INT./ATM. pressure [kPa], INT./EXT. temperature [C] and a timer on the screen. Buttons 1 start/stop · 2 reset · 3 graphics · 4 heat. The power switch is at the rear.</li>
<li>Hydraulic board: valves A (water in), B (water purge), C (water out), D (syringe line), plus valve E on top of the cylinders. Handle along the pipe (I) is open, across it (II) is closed.</li>
<li>Pump, hoses A · C (clip them to a container), hose D (syringe).</li>
<li>Two 100 mL syringes (water / PG), PG 100 mL, cold water 500 mL, room-temperature water, pouring jug, waste jug.</li>
</ul>
<h4>Operating it</h4>
<ul>
<li>Press the POWER switch at the rear to turn the electronic module on.</li>
<li>Filling the OC: drag the end of hose A into a container of water (click it again to clip it) and run the pump. Prime it first with only valve B open, then close B and open A.</li>
<li>Emptying the OC: put hose C in the waste jug and run the pump with B and C open. With B alone the water recirculates and the temperature evens out.</li>
<li>Filling the IC: drag a syringe to a bottle, pull the plunger up (or roll the wheel) to draw liquid, plug it into the hose D socket and push with valves D and E open.</li>
<li>With the plunger removed the syringe barrel becomes an open water column.</li>
<li>Read h and H off the IC scale yourself — the flat middle of the surface, not the meniscus at the wall.</li>
</ul>
<h4>Precautions</h4>
<ul>
<li>The heater runs only fully under water. It cuts out at 65 C; while the indicator is red it cannot be restarted until the water is below 60 C.</li>
<li>Keep the OC level at least 1 cm below the cover.</li>
<li>The sensors may be decalibrated, as the problem sheet warns.</li>
</ul>
<h4>About this simulator</h4>
<ul>
<li>Nothing is filled, measured, tabulated, fitted or plotted for you.</li>
<li>The acrylic's conductivity, the vapour-pressure curve, the atmosphere and the sensor calibration differ slightly from session to session.</li>
</ul>`};

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
class RNG{ constructor(s){ this.r=mulberry32(s>>>0); }

const WARN=new Set(["heaterWet","indicatorRed","nothingPour","mixedSyr","openE","hoseDOut","valveDClosed","openEtoo","spilt","mixedIC",

class Container{

class Syringe{ constructor(key){ this.key=key; this.cap=100; this.vol=0; this.plunger=0; this.kind=null; this.T=24;

/* ══════════════════════════════════════════════════════════════
   2.  THE APPARATUS  —  step(dt) advances the physics
   ══════════════════════════════════════════════════════════════ */
class Lab{
  constructor(seed){
    if(seed===undefined) seed=1+Math.floor(Math.random()*999998);
    this.seed=seed; const g=new RNG(seed); this.rng=new RNG(seed*7919+13);
    /* hidden physical truths (never shown) */
    this.lam=g.uniform(0.235,0.265);
    this.ccS=g.uniform(4600,4800);
    const pv339=g.uniform(17.6,19.6);
    this.ccC=Math.log(pv339)+this.ccS/339;
    this.pvTab=new Float64Array(PV_N+1);
    for(let i=0;i<=PV_N;i++) this.pvTab[i]=1e3*Math.exp(this.ccC-this.ccS/(PV_T0+i*0.05));
    this.P_atm0=g.uniform(94.4e3,96.0e3); this.P_atm=this.P_atm0; this.drift=0;
    this.T_amb=g.uniform(22,26); this.P_heat=g.uniform(180,220);

    this.p_gain=g.uniform(1.004,1.034); this.p_off=g.uniform(-3.0e3,0.5e3);
    this.ti_gain=g.uniform(0.9965,1.0035); this.ti_off=g.uniform(-0.4,0.4);
    this.te_gain=g.uniform(0.9965,1.0035); this.te_off=g.uniform(-0.4,0.4);

    this.timer=0; this.timerRun=false; this.graphMode=false;
    this.valve={A:false,B:false,C:false,D:false,E:false};
    this.h_oc=0; this.T_oc=this.T_amb; this.strat=0;
    this.icKind=null; this.h_ic=0; this.T_ic=this.T_amb;

      jug:new Container("jug",0,this.T_amb,"waste",3000)};

  say(k,...a){ this.msg={k,a}; this.msgT=this.t; }
  pv(T){ const u=(T-PV_T0)*20, i=Math.floor(u);
    if(i<0) return this.pvTab[0]; if(i>=PV_N) return 1e3*Math.exp(this.ccC-this.ccS/T);

  toggleHose(k){ this.hconn[k]=!this.hconn[k]; this.say(this.hconn[k]?"hoseIn":"hoseOut",k); }

  }
  syringePull(key,dmL){

      if(!this.valve.E){ this.say("openEtoo"); s.plunger-=dd; return; }
      if(dd<0){ const give=Math.min(s.vol,-dd,(L_IC-this.h_ic)*this.A_ic*1e6); if(give<=0) return;

}

/* ---- layout (design px) ---- */

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  const [x,y]=lpos(e), t=hit(x,y); if(!t) return;
  cv.setPointerCapture(e.pointerId);
  if(t.startsWith("btn")) lab.pressButton(+t[3]);
  else if(t==="power") lab.pressPower();
  else if(t==="pump") lab.pressPump();
  else if(t.startsWith("port")) lab.toggleHose(t[4]);
  else if(t.startsWith("valve")) lab.toggleValve(t[5]);
  else if(t.startsWith("spd")) speed=+t.slice(3);
  else if(t==="runpause") running=!running;
  else if(t.startsWith("plgtoggle_")) lab.removePlunger(t[10]);
  else if(t.startsWith("plg_")) dragging=["plunger",t[4],y];
  else if(t.startsWith("syr_")){ const k=t.slice(4); dragging=["syringe",k,[x-lab.syr[k].x,y-lab.syr[k].y]]; }
  else if(t.startsWith("hose")) dragging=["hose",t[4],[x,y]];
  else if(t.startsWith("cont_")){ const k=t.slice(5); coff[k]=[0,0]; dragging=["cont",k,[x,y]]; }
});
cv.addEventListener("pointermove",e=>{
  if(!dragging) return; const [x,y]=lpos(e), [kind,key,ref]=dragging;
  if(kind==="hose") hose[key]=[x,y];
  else if(kind==="syringe"){ lab.syr[key].x=x-ref[0]; lab.syr[key].y=y-ref[1]; }
  else if(kind==="plunger"){ const dd=(ref-y)*(100/SH); if(Math.abs(dd)>=0.5){ lab.syringePull(key,dd); dragging=[kind,key,y]; } }
  else if(kind==="cont") coff[key]=[x-ref[0],y-ref[1]];
});
cv.addEventListener("pointerup",e=>{
  if(!dragging) return; const [x,y]=lpos(e), [kind,key,ref]=dragging; dragging=null;
  if(kind==="syringe") snap(key);
  else if(kind==="hose"){
    const [hx,hy]=hose[key];
    if(Math.abs(x-ref[0])<5&&Math.abs(y-ref[1])<5){
      const inside=key==="A"?lab.hoseAin:lab.hoseCin;
      if(inside) lab.toggleClip(key); else lab.say("hoseFirst");
      return;
    }
    let found=null;
    for(const ck in CONT){ const [a,b,dd,f]=CONT[ck]; if(hx>=a-6&&hx<=dd+6&&hy>=b-6&&hy<=f+6) found=ck; }
    if(key==="A") lab.hoseAin=found; else lab.hoseCin=found;
    lab.clip[key]=false;
    if(found){ const [a,b,dd,f]=CONT[found]; hose[key]=[(a+dd)/2,b+(f-b)*0.3]; }
    lab.say("hoseTo",key,found||"__bench",!!found);
  } else if(kind==="cont"){
    let tgt=null;
    for(const ck in CONT){ const [a,b,dd,f]=CONT[ck]; if(ck!==key&&x>=a&&x<=dd&&y>=b&&y<=f) tgt=ck; }
    coff[key]=[0,0];
    if(tgt) lab.pour(key,tgt);
  }
});
function snap(key){
  const s=lab.syr[key], nx=s.x+SW/2, ny=s.y+SH+20, [hx,hy]=HOSE_D_END;
  if(Math.hypot(nx-hx,ny-hy)<20){ s.attached="Dh"; s.placed="D"; s.x=hx-SW/2; s.y=hy-SH-20; lab.say("syrDirect"); return; }
  const dPort=Math.hypot(nx-SYR_PORT[0],ny-SYR_PORT[1]), dHose=Math.hypot(nx-hx,ny-hy);
  if(dPort<20){ s.attached="D"; s.placed="D"; s.x=SYR_PORT[0]-SW/2; s.y=SYR_PORT[1]-SH-20; lab.say("syrD"); return; }
  s.placed=null;
  if(Math.min(dPort,dHose)<70){ lab.say("syrNotHome"); s.attached=null; return; }
  for(const ck in CONT){ const [a,b,dd,e]=CONT[ck];
    if(nx>=a-12&&nx<=dd+12&&ny>=b-12&&ny<=e+12){ s.attached=ck; lab.say("nozzleIn","__syr"+key,ck); return; } }
  s.attached=null;
}
cv.addEventListener("wheel",e=>{
  const [x,y]=lpos(e), t=hit(x,y); if(!t) return;
  const dir=e.deltaY<0?1:-1;
  if(t.startsWith("syr_")||t.startsWith("plg")){ e.preventDefault(); lab.syringePull(t.split("_")[1],dir*(e.shiftKey?5:1)); }
  else if(t.startsWith("valve")){ e.preventDefault(); const v=t[5]; if(lab.valve[v]!==(dir>0)) lab.toggleValve(v); }
  else if(t.startsWith("spd")||t==="runpause"){ e.preventDefault(); const sp=[1,10,60,300]; let i=sp.indexOf(speed); if(i<0) i=0; speed=sp[Math.max(0,Math.min(3,i+dir))]; }
},{passive:false});
document.addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"){ e.preventDefault(); running=!running; } });

/* ══════════════════════════════════════════════════════════════
   7.  MAIN LOOP  —  1 s physics steps, at most 20 ms of work a frame
   ══════════════════════════════════════════════════════════════ */
let last=performance.now(), acc=0;
function tick(){
  const now=performance.now(); let real=(now-last)/1000; last=now; if(real>0.25) real=0.25;
  if(running){
    acc+=real*speed; const budget=performance.now()+20;
    while(acc>0){ const dt=acc>1?1:acc; lab.step(dt); acc-=dt; if(performance.now()>budget){ acc=0; break; } }
  }
  if(!$("cv").hidden) draw();
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layoutCanvas);
applyLang(); layoutCanvas(); requestAnimationFrame(tick);
