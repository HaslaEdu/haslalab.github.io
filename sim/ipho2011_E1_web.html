<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}

  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);

  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}

  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

  .tabs button.on:hover{background:var(--accent);color:#1c2027}

  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ul{margin:4px 0 4px 20px;padding:0}

  st_ready: ["Connect the battery snap to the 9 V input of the oscillator, the meter probes to its red and black output, switch on and set the dial to Hz.",

  st_capOn: ["Capacitor %s is on the desk. Drag a crocodile clip onto each of its leads.", "축전기 %s를 책상에 놓았습니다. 악어클립을 각 다리에 하나씩 물리세요."],

  st_free: ["Left on the desk.", "책상 위에 내려놓았습니다."],
  t_BINP: ["9 V input +", "9 V 입력 +"], t_BINN: ["9 V input −", "9 V 입력 −"],
  t_JR: ["output (red)", "출력 (빨강)"], t_JB: ["output (black)", "출력 (검정)"],
  t_BATP: ["battery snap +", "건전지 스냅 +"], t_BATN: ["battery snap −", "건전지 스냅 −"],
  t_BBL: ["blackbox: lower plate", "블랙박스: 아래 극판"], t_BBU: ["blackbox: upper plate", "블랙박스: 위 극판"],
  t_lead: ["a lead of %s", "%s의 다리"],
  info: [`<h4>The apparatus (Figures 1–3 of the paper)</h4><ul>
<li>On the dark wooden base: the 9 V battery, the white relaxation oscillator with its switch at the front, and its red and black frequency output on top.</li>
<li>The wooden blackbox is a parallel-plate capacitor: two plates of small teeth with a dielectric sheet (K = 1.5, d = 0.20 mm) between them. Its two screws are the connectors to the plates; the crocodile clips of the oscillator sit on them.</li>
<li>The upper plate slides in and out on the right. Its edge reads against the white millimetre scale.</li>
<li>The MASTECH multimeter on the desk measures the frequency on the Hz setting (Figure 3), and d.c. volts on the V settings.</li>
<li>The parts box holds the capacitors 33J, 68, 82J and 151 (Table 1) and a box of 9 V batteries, new and old mixed.</li></ul>
<h4>Handling</h4><ul>
<li>Drag any lead end (the battery snap, the meter probes, the crocodile clips) onto a terminal: it snaps on when it is close. Dropped elsewhere it lies on the desk.</li>
<li>Click the switch on the base to turn the oscillator on; its lamp shows that it runs.</li>
<li>Check the battery: put the probes on the snap ends and turn the dial to 20 V. Below 9 V, take a new one from the box and click the battery on the base.</li>
<li>Take a capacitor out of the box and clip both crocodile clips to its two leads: it then replaces the blackbox. Drag one capacitor onto another to twist their leads together (in parallel); drag it off again to separate them.</li>
<li>Click the meter, the scale or the oscillator for a close-up. Right-click goes back, or puts a part back in the box.</li></ul>
<h4>Measuring</h4><ul>
<li>The simulator computes nothing for you. Read the frequency on the meter and the position of the plate edge on the 1 mm scale yourself.</li>
<li>The last digit of the meter flickers, as on the real one, and a tired battery makes the oscillator slow and finally stop.</li></ul>`,
`<h4>장비 (문제지 그림 1–3)</h4><ul>
<li>짙은 나무 밑판 위에 9 V 건전지, 앞쪽에 스위치가 달린 흰 이완 발진기가 있고, 발진기 윗면에 빨강·검정 진동수 출력 단자가 있습니다.</li>
<li>나무 블랙박스는 평행판 축전기입니다. 작은 이빨이 줄지은 두 극판 사이에 유전체 판(K = 1.5, d = 0.20 mm)이 있습니다. 상자의 나사 두 개가 극판에 연결된 단자이고, 발진기의 악어클립이 여기에 물려 있습니다.</li>
<li>오른쪽의 위 극판은 밀어 넣고 빼낼 수 있으며, 그 끝이 흰 mm 눈금을 가리킵니다.</li>
<li>책상 위 MASTECH 멀티미터는 Hz 위치에서 진동수를(그림 3), V 위치에서 직류 전압을 잽니다.</li>

<li>밑판 앞의 스위치를 클릭하면 발진기가 켜지고, 램프로 작동 여부를 알 수 있습니다.</li>
<li>건전지 확인: 리드를 스냅 끝에 대고 다이얼을 20 V에 두세요. 9 V보다 낮으면 부품함에서 새 건전지를 받아 밑판의 건전지를 클릭합니다.</li>

<li>시뮬레이터는 아무것도 계산해 주지 않습니다. 멀티미터의 진동수와 1 mm 눈금 위 극판 끝의 위치를 직접 읽으세요.</li>

};
function tr(k){ const e = I18N[k]; return e ? (LANG === "ko" ? e[1] : e[0]) : k; }

/* ==== PHYSICS START ====================================================
   What the instruments read.  Nothing here hands the student a derived
   quantity: the meter shows a frequency or a voltage, the scale shows
   where the edge of the upper plate is, and that is all.

   The oscillator:   f = alpha / (C + C_s)
       alpha = 714 nF/s,  C_s = 17.9 pF                 (official Part 1)
   The capacitors of Table 1 have their own true values, close to the
   marking.

   The blackbox is Pattern I: two combs of rectangular teeth, pitch 1.0 cm,
   the upper one sliding into the lower one over a 0.20 mm sheet of K = 1.5.
       C(s) = C_par + K eps0 b / d * (overlap of the teeth, in length)
   As the plate goes in, one more tooth engages every pitch, so the peaks
   of C climb by K eps0 w b / d = 19.9 pF per period (the official C_max
   against node), and the troughs climb too: the teeth of the kit are a
   little wider than the gaps (6.6 mm on a 10 mm pitch), so they never
   quite clear one another.  The flat bottoms and the climbing troughs of
   the official C-x table come from that.  C_par, the engagement at s = 0
   and the phase are fitted to the 59 rows of the official table (rms 5.7 pF,
   about the scatter of reading a slider by hand).
   ==================================================================== */
const EPS0 = 8.85e-12, K_DIEL = 1.5, D_GAP = 0.20e-3;
const ALPHA0 = 714e-9, C_STRAY = 17.9e-12;
const CAPS = [["33J", 34, 33.6e-12], ["68", 68, 67.4e-12], ["82J", 84, 83.8e-12], ["151", 150, 149.2e-12]];
const PITCH_MM = 10.0, TOOTH_MM = 6.60, B_TOOTH = 49.1e-3;
const KAPPA = K_DIEL * EPS0 * B_TOOTH / D_GAP * 1e-3;     /* farad per mm of overlap */
const C_PAR = 44.35e-12, LEAD0_MM = 16.64, PHASE_MM = -1.48;
const TRAVEL_MM = 60.0;
const DMM_HZ_FS = 19.99;
const BATT_GOOD = [9.05, 9.55], BATT_WEAK = [6.60, 8.85], BATT_DRAIN = 0.0008;
const V_OSC_MIN = 7.60, V_OSC_OK = 8.60;

/* length of tooth overlap with the upper plate pushed in by s mm */
function overlapMM(s){
  const lead = LEAD0_MM + s; let sum = 0;
  for (let k = 0; k < 40; k++){
    const u1 = lead - k * PITCH_MM, u0 = u1 - TOOTH_MM; if (u1 <= 0) break;
    for (let j = -1; j < 40; j++){
      const l0 = PHASE_MM + j * PITCH_MM, l1 = l0 + TOOTH_MM;
      const lo = Math.max(u0, l0, 0), hi = Math.min(u1, l1);
      if (hi > lo) sum += hi - lo;
    }
  }
  return sum;
}
function C_blackbox(s){ return C_PAR + KAPPA * overlapMM(Math.min(Math.max(s, 0), TRAVEL_MM)); }

function newBattery(rng, pWeak){
  const [lo, hi] = rng() < (pWeak === undefined ? 0.30 : pWeak) ? BATT_WEAK : BATT_GOOD;
  return Math.round((lo + rng() * (hi - lo)) * 100) / 100;
}
function oscState(battV, connected){
  if (!connected || battV < V_OSC_MIN) return 0;
  return battV >= V_OSC_OK ? 2 : 1;
}
/* a tired battery slows the oscillator down: the threshold of its comparator moves */
function frequency(Ctot, battV){
  if (!(Ctot > 0)) return null;
  let a = ALPHA0;
  if (battV < V_OSC_OK) a *= 1.0 - 0.16 * (V_OSC_OK - battV);
  return a / Ctot;
}

/* the dial of the MASTECH meter, clockwise from OFF (angle on the face, 0 = right, + clockwise on screen) */
const DIAL = [["off", -90, "OFF"], ["v1000", -52, "1000"], ["v200", -30, "200"], ["v20", -8, "20"],
              ["v2", 14, "2"], ["a20m", 36, "20m"], ["a200m", 58, "200m"], ["hz", 82, "Hz"], ["temp", 104, "°C"],
              ["c20u", 126, "20µ"], ["c200n", 148, "200n"], ["r200k", 170, "200k"], ["r20k", 192, "20k"],
              ["r2k", 214, "2k"], ["r200", 236, "200"]];
const DIAL_ORDER = DIAL.map(d => d[0]);

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---- the kit on the bench ----
   Every connection is a place a conductor end sits:
     the battery snap leads  snap.p / snap.n : "BINP", "BINN" or a point on the desk
     the meter probes        probe.r / probe.b : "JR", "JB" (the oscillator output),
                             "BATP", "BATN" (the snap ends), or a point
     the crocodile clips     clip.r / clip.b : "BBL", "BBU" (the blackbox screws),
                             "A3", "B0" ... (a lead of capacitor 3, 0), or a point  */
class Kit {
  constructor(seed){
    this.rng = mulberry(seed || (Date.now() & 0x7fffffff));
    this.reset();
  }
  reset(){

const OSC = {x0: 2, x1: 16, z0: -4.6, z1: 5.2, h: 6.4};
const BB = {x0: 20, x1: 44, z0: -9, z1: 9, h: 4.8};

/* ---- fixed points ---- */
const TERM = {
  JR: [13.6, OSC.h, -0.6], JB: [13.6, OSC.h, 2.6],

const HOME = {snap_p: [7.0, BASE_H, 7.4], snap_n: [9.6, BASE_H, 7.4],
              pr_r: [37.5, 0.45, 26.5], pr_b: [37.5, 0.45, 29.5],
              clip_r: [19.0, BASE_H, -6.5], clip_b: [19.0, BASE_H, 6.5]};

/* where a capacitor's lead ends are (the root of a twisted stack carries them) */
function leadEnd(i, side){ const r = kit.root(i), p = kit.caps[r]; if (!p) return null; return [p[0] + (side === "A" ? -0.62 : 0.62), 0.12, p[1] - 4.4]; }
/* the world point of a target name */
function target(n){
  if (TERM[n]) return TERM[n];
  if (n === "BATP") return endPos("snap_p"); if (n === "BATN") return endPos("snap_n");

/* the targets each kind of end can go on */
function targetsFor(key){

}
const STATE = key => key.startsWith("snap") ? [kit.snap, key.slice(5)] : key.startsWith("pr") ? [kit.probe, key.slice(3)] : [kit.clip, key.slice(5)];
/* the tip of a lead end, in the world */

  if (UI.drag && UI.drag.kind === "end" && UI.drag.key === key) return UI.drag.at;
  const [o, k] = STATE(key), v = o[k];
  if (Array.isArray(v)) return v;

  return HOME[key];

/* ---- textures ---- */

  g.fillStyle = "#f4f4ef"; g.fillRect(0, 0, c.width, c.height);

  for (let mm = 0; mm <= 84; mm++){ const u = (8.6 - mm / 10) * R; if (u < 2) break;
    const L = mm % 10 === 0 ? 0.85 : mm % 5 === 0 ? 0.6 : 0.38; g.lineWidth = mm % 10 === 0 ? 2.2 : 1.4;
    g.beginPath(); g.moveTo(u, 0); g.lineTo(u, L * R); g.stroke();
    if (mm % 10 === 0){ g.font = "600 " + Math.round(0.62 * R) + "px Arial,sans-serif"; g.fillText(String(mm), u, 0.95 * R); } }
  g.font = "600 " + Math.round(0.4 * R) + "px Arial,sans-serif"; g.textAlign = "right"; g.fillText("mm", c.width - 4, 1.62 * R);
  c._static = true; return c; }

  g.fillStyle = "#283a8c"; g.font = "700 46px Georgia,serif"; g.fillText("IPhO", 92, 82); g.fillStyle = "#e0337a"; g.font = "700 22px Arial"; g.fillText("42", 196, 56);
  g.fillStyle = "#555"; g.font = "15px Arial"; g.fillText("Bangkok, Thailand 2011", 92, 112); c._static = true; return c; }
function battTex(){ const c = mk(480, 260), g = c.getContext("2d"); g.fillStyle = "#1e2024"; g.fillRect(0, 0, 480, 260);
  g.fillStyle = "#2c5fb4"; g.fillRect(0, 60, 480, 140); g.fillStyle = "#f2f2f2"; g.font = "800 92px Arial"; g.fillText("9V", 40, 162);

const SCALE_TEX = scaleTex(), STICKER = stickerTex(), BATT_TEX = battTex();
/* the face of the meter: redrawn when what it shows changes */
const DMM_TEX = mk(Math.round(DMMF.w * 50), Math.round(DMMF.l * 50)); DMM_TEX._ver = 0; let DMM_KEY = "";

  g.fillStyle = "#b9c4ad"; g.fillRect(1.05 * R, 1.15 * R, 6.2 * R, 3.3 * R);
  g.fillStyle = "#1c2118"; g.textAlign = "right"; g.textBaseline = "middle";
  g.font = "700 " + Math.round(2.2 * R) + "px 'DSEG7 Classic','Courier New',monospace"; g.fillText(disp, 6.6 * R, 2.85 * R);
  g.font = "700 " + Math.round(0.55 * R) + "px Arial"; g.fillText(kit.unit(), 7.1 * R, 4.15 * R);

  g.fillStyle = "#c8302c"; g.fillRect(0.9 * R, 5.2 * R, 1.3 * R, 0.6 * R); g.fillStyle = "#ddd"; g.font = Math.round(0.32 * R) + "px Arial"; g.textAlign = "left"; g.fillText("POWER", 2.4 * R, 5.5 * R);
  /* the dial */

  g.fillStyle = "#1b1c1e"; g.beginPath(); g.arc(cx, cy, (DIAL_R + 1.25) * R, 0, 7); g.fill();
  g.textAlign = "center"; g.textBaseline = "middle";
  for (const [nm, deg, lbl] of DIAL){ const a = deg * Math.PI / 180, on = nm === kit.dial;
    g.fillStyle = on ? "#ffd84a" : "#e8e8e8"; g.font = (on ? "700 " : "") + Math.round(0.36 * R) + "px Arial";
    g.fillText(lbl, cx + Math.cos(a) * (DIAL_R + 0.78) * R, cy + Math.sin(a) * (DIAL_R + 0.78) * R);
    g.beginPath(); g.arc(cx + Math.cos(a) * (DIAL_R + 0.25) * R, cy + Math.sin(a) * (DIAL_R + 0.25) * R, 0.06 * R, 0, 7); g.fill(); }
  g.fillStyle = "#151617"; g.beginPath(); g.arc(cx, cy, DIAL_R * R, 0, 7); g.fill();
  const a = DIAL[DIAL_ORDER.indexOf(kit.dial)][1] * Math.PI / 180;

/* ---- parts ---- */
function wire(a, b, col, sag, lw, id){
  const pts = [], n = 26, d = Math.hypot(b[0] - a[0], b[2] - a[2]);
  for (let i = 0; i <= n; i++){ const t = i / n;
    let x = a[0] + (b[0] - a[0]) * t, z = a[2] + (b[2] - a[2]) * t, y = a[1] + (b[1] - a[1]) * t + (sag || 0) * Math.sin(Math.PI * t) * Math.min(1, d / 25);
    const floor = x > -0.2 && x < 64.2 && z > -9.2 && z < 9.2 ? (x > OSC.x0 - 0.2 && x < OSC.x1 + 0.2 && z > OSC.z0 - 0.2 && z < OSC.z1 + 0.2 ? OSC.h + 0.15 : x > BB.x0 && x < BB.x1 ? BB.h + 0.15 : BASE_H + 0.15) : 0.15;
    if (i > 1 && i < n - 1) y = Math.max(y, floor);
    pts.push([x, y, z]); }
  poly3(pts, col, lw || 2.2, id ? {id} : undefined);
}
function knob(c, r, col, id){ cyl3("y", c[1] - 0.05, c[1] + 0.45, c[0], c[2], r, col, {seg: 16, id, cap: shade(col, 1.15)}); }
function crocClip(J, dir, y, col, id){             /* jaw at J, the body along dir (unit, on the desk) */
  const B = [J[0] + dir[0] * 2.6, y, J[2] + dir[1] * 2.6], M = [J[0] + dir[0] * 0.9, y, J[2] + dir[1] * 0.9];
  cylAB([J[0], y, J[2]], M, 0.22, "#b9bec4", {seg: 8, id});
  cylAB(M, B, 0.42, col, {seg: 10, id});
  return B;
}
function probe(key, col){
  const tip = endPos(key), on = typeof STATE(key)[0][STATE(key)[1]] === "string", drag = UI.drag && UI.drag.key === key;
  let back;
  if (on || drag){ back = [tip[0] + 0.3, tip[1] + 8.5, tip[2] + 3.2]; cylAB(tip, [tip[0] + 0.03, tip[1] + 1.2, tip[2] + 0.45], 0.06, "#c9ced3", {seg: 6, id: key}); cylAB([tip[0] + 0.03, tip[1] + 1.2, tip[2] + 0.45], back, 0.38, col, {seg: 12, id: key}); }
  else { back = [tip[0] + 11, tip[1], tip[2]]; cylAB(tip, [tip[0] + 1.2, tip[1], tip[2]], 0.06, "#c9ced3", {seg: 6, id: key}); cylAB([tip[0] + 1.2, tip[1], tip[2]], back, 0.4, col, {seg: 12, id: key}); }
  wire(JACK_W(key === "pr_r" ? "VHz" : "COM"), back, col, 3, 2.4);
}
function capacitor(i){
  const r = kit.root(i), mates = Object.keys(kit.caps).map(Number).filter(j => j !== r && kit.root(j) === r).sort((a, b) => a - b);
  const lvl = i === r ? 0 : mates.indexOf(i) + 1, p = kit.caps[r], y0 = lvl * 0.4, x = p[0] + lvl * 0.25, z = p[1] - lvl * 0.15, id = "cap" + i;
  box3(x - 1.8, x + 1.8, y0, y0 + 0.08, z - 2.3, z + 2.3, "#9fe0c4", {id});
  text3([x - 1.4, y0 + 0.09, z + 2.2], [1, 0, 0], [0, 0, -1], CAPS[i][0], 0.8, "#1d3b6a", {id});
  cyl3("y", y0 + 0.08, y0 + 0.32, x, z - 0.6, 0.62, "#c96c2a", {seg: 18, id});
  text3([x - 0.35, y0 + 0.33, z - 0.45], [1, 0, 0], [0, 0, -1], CAPS[i][1] === 150 ? "151" : String(CAPS[i][1]), 0.32, "#3a1d08", {id});
  /* the two leads, out over the far edge of the card (to the root's ends when twisted) */
  for (const s of ["A", "B"]){ const e = leadEnd(i, s), a = [x + (s === "A" ? -0.32 : 0.32), y0 + 0.2, z - 1.15];
    line3(a, [e[0], Math.max(0.12, y0 * 0.4) + 0.06, e[2] + 1.4], "#cfd3d6", 1.6, {id: "lead" + s + i}); line3([e[0], Math.max(0.12, y0 * 0.4) + 0.06, e[2] + 1.4], e, "#cfd3d6", 1.6, {id: "lead" + s + i}); }
}

    if (window.HLzoom) HLzoom(cv3, {out: v === "3d"});
    if (view3 === "3d") freeCam = {yaw: CAM.yaw, pitch: CAM.pitch, k: CAM.k, tx: CAM.tx, ty: CAM.ty, tz: CAM.tz, px: CAM.px, py: CAM.py};
    Object.assign(CAM, viewCam(v));
  }
  view3 = v; syncTabs();
}
function syncTabs(){ $("t-cap3").textContent = tr("cap_" + view3); $("back").hidden = view3 === "3d"; $("back").textContent = tr("back"); }
$("back").onclick = () => showView("3d");

function draw3(){
  const dpr = CAM.dpr; ctx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx3.createLinearGradient(0, 0, 0, CAM.H); g.addColorStop(0, "#2a3038"); g.addColorStop(1, "#1b1f25");
  ctx3.fillStyle = g; ctx3.fillRect(0, 0, CAM.W, CAM.H);
  begin3(); scene3(); render3(ctx3);
}

/* ---- the tray ---- */
const trayCv = $("tray"), tctx = trayCv.getContext("2d"), TROW = 50, TRAY_UI = [0, 1, 2, 3, "batt"];
let TRW = 190, trayCells = [];
function trayLayout(){
  const dpr = window.devicePixelRatio || 1; TRW = Math.max(150, trayCv.parentElement.clientWidth - 18 || 190);
  const h = TRAY_UI.length * TROW + 52; trayCv.style.width = TRW + "px"; trayCv.style.height = h + "px";
  trayCv.width = Math.round(TRW * dpr); trayCv.height = Math.round(h * dpr); drawTray(); }
function trayIcon(c, k, x, y){
  c.save(); c.translate(x, y);
  if (k === "batt"){ c.fillStyle = "#1d1e22"; c.fillRect(-15, -9, 26, 18); c.fillStyle = "#2c5fb4"; c.fillRect(-15, -4, 26, 9); c.fillStyle = "#fff"; c.font = "800 8px Arial"; c.fillText("9V", -12, 3);
    c.fillStyle = "#111"; c.fillRect(11, -6, 5, 12); }
  else { c.fillStyle = "#9fe0c4"; c.fillRect(-14, -12, 28, 24); c.fillStyle = "#c96c2a"; c.beginPath(); c.arc(0, -2, 6.5, 0, 7); c.fill();
    c.strokeStyle = "#cfd3d6"; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-3, 3); c.lineTo(-4, 15); c.moveTo(3, 3); c.lineTo(4, 15); c.stroke();
    c.fillStyle = "#1d3b6a"; c.font = "700 8px Arial"; c.textAlign = "center"; c.fillText(CAPS[k][0], 0, -6 + 16); }
  c.restore(); }
function drawTray(){
  const dpr = window.devicePixelRatio || 1, c = tctx, h = TRAY_UI.length * TROW + 52;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = "#15181d"; c.fillRect(0, 0, TRW, h);
  trayCells = []; let y = 6; const wd = TRW - 12;
  for (const k of TRAY_UI){
    const on = k !== "batt" && kit.caps[k] !== undefined, inHand = UI.hand === k;
    c.fillStyle = on ? "#1a1d22" : "#1f242b"; c.fillRect(6, y, wd, TROW - 4);
    c.strokeStyle = inHand ? "#f2c14e" : on ? "#3f4650" : "#353b43"; c.lineWidth = 1; c.strokeRect(6.5, y + 0.5, wd - 1, TROW - 5);
    c.globalAlpha = on ? 0.45 : 1; trayIcon(c, k, 28, y + (TROW - 4) / 2); c.globalAlpha = 1;
    c.font = '11.5px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign = "left"; c.textBaseline = "middle";
    c.fillStyle = on ? "#8b939b" : "#e8eef2"; let nm = k === "batt" ? tr("it_batt") : tr("it_cap").replace("%s", CAPS[k][0]);
    while (c.measureText(nm).width > wd - 56 && nm.length > 4) nm = nm.slice(0, -2) + "…";
    c.fillText(nm, 52, y + 15);
    c.font = '9.5px "Malgun Gothic",sans-serif'; c.fillStyle = on || inHand ? "#f2c14e" : "#69717a";
    c.fillText(tr(inHand ? "trayHand" : k === "batt" ? "trayBatt" : on ? "trayBack" : "trayTake"), 52, y + 32);
    trayCells.push([k, y, y + TROW - 4]); y += TROW; }
  c.font = '10.5px "Malgun Gothic",sans-serif'; c.textAlign = "center"; c.textBaseline = "top"; c.fillStyle = "#69717a";
  tr("trayHelp").split("\n").forEach((ln, i) => c.fillText(ln, TRW / 2, y + 6 + i * 14)); }
function freeSlot(i){ let [x, z] = SLOT(i);
  for (let t = 0; t < 8; t++){ if (!Object.values(kit.caps).some(p => Math.hypot(p[0] - x, p[1] - z) < 3)) break; x += 1.5; z += 2.2; }
  return [x, z]; }
function capOut(i){ kit.caps[i] = freeSlot(i); note(tr("st_capOn").replace("%s", CAPS[i][0])); }
function capBack(i){
  const r = kit.root(i), mates = Object.keys(kit.caps).map(Number).filter(j => j !== i && kit.root(j) === r);
  /* the clips on this capacitor's leads drop on the desk */
  if (r === i && !mates.length) for (const k of ["r", "b"]){ const v = kit.clip[k];
    if (typeof v === "string" && /^[AB]\d$/.test(v) && +v[1] === i){ const e = leadEnd(i, v[0]); kit.clip[k] = [e[0], 0.45, e[2] - 0.8]; } }
  if (r === i && mates.length){ const nr = Math.min(...mates); kit.caps[nr] = kit.caps[i]; delete kit.stack[nr];
    for (const j of mates) if (j !== nr) kit.stack[j] = nr;
    for (const k of ["r", "b"]){ const v = kit.clip[k]; if (typeof v === "string" && /^[AB]\d$/.test(v) && +v[1] === i) kit.clip[k] = v[0] + nr; } }
  delete kit.caps[i]; delete kit.stack[i];
  note(tr("st_capBack").replace("%s", CAPS[i][0])); }
trayCv.addEventListener("contextmenu", e => { e.preventDefault(); UI.hand = null; drawTray(); });
trayCv.addEventListener("mousedown", e => {
  if (e.button) return; const y = e.clientY - trayCv.getBoundingClientRect().top;
  for (const [k, y0, y1] of trayCells) if (y >= y0 && y <= y1){
    if (k === "batt"){ UI.hand = UI.hand === "batt" ? null : "batt"; note(UI.hand ? tr("st_needBatt") : ""); refresh(); return; }
    if (kit.caps[k] === undefined) capOut(k); else capBack(k);
    refresh(); return; } });
window.addEventListener("resize", () => { trayLayout(); layout3(); });

/* ---- the panel ---- */
function note(s){ $("status").textContent = s || ""; }
function refresh(){
  $("sw").textContent = tr(kit.sw ? "swOn" : "swOff"); $("sw").className = kit.sw ? "on" : "";
  const ok = b => b ? "✓ " : "· ";
  const pr = [kit.probe.r, kit.probe.b], onOut = pr.includes("JR") && pr.includes("JB");
  const cr = kit.node(kit.clip.r), cb = kit.node(kit.clip.b);
  let clipTxt;
  if ((cr === "BBL" && cb === "BBU") || (cr === "BBU" && cb === "BBL")) clipTxt = tr("w_bb");
  else if (cr && cb && cr[0] !== "B" && cb[0] !== "B" && cr.slice(1) === cb.slice(1) && cr !== cb){
    const r = +cr.slice(1), all = Object.keys(kit.caps).map(Number).filter(j => kit.root(j) === r).map(j => CAPS[j][0]);
    clipTxt = tr("w_caps").replace("%s", all.join(" + ")); }
  else clipTxt = tr("w_open");
  $("wires").textContent = ok(kit.battIn()) + tr("w_snap") + "\n" + ok(onOut) + tr("w_probe") + "\n" + ok(clipTxt !== tr("w_open")) + tr("w_clip") + clipTxt;
  $("t1").textContent = tr("t1"); $("newExp").textContent = tr("newExp");
  drawTray(); syncTabs(); }
$("sw").onclick = () => { kit.sw = !kit.sw; refresh(); };
$("newExp").onclick = () => { $("resetQ").textContent = tr("resetQ"); $("resetNo").textContent = tr("no"); $("resetYes").textContent = tr("yes"); $("resetDlg").showModal(); };
$("resetNo").onclick = () => $("resetDlg").close();
$("resetYes").onclick = () => { $("resetDlg").close(); kit.reset(); UI.hand = null; UI.drag = null; showView("3d"); note(tr("st_ready")); refresh(); };

/* ---- the hands ---- */
let down = null, mPrev = [0, 0];
const pe = e => { const r = cv3.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
/* a point on the desk, the base or the top of the oscillator under the pointer */
function surfaceAt(p){
  let q = onPlane(p[0], p[1], OSC.h); if (q[0] > OSC.x0 && q[0] < OSC.x1 && q[2] > OSC.z0 && q[2] < OSC.z1) return q;
  q = onPlane(p[0], p[1], BB.h); if (q[0] > BB.x0 && q[0] < BB.x1 && q[2] > BB.z0 && q[2] < BB.z1) return q;
  q = onPlane(p[0], p[1], BASE_H); if (q[0] > 0 && q[0] < 64 && q[2] > -9 && q[2] < 9) return q;
  return onPlane(p[0], p[1], 0.45); }
/* the terminal nearest the pointer on the screen, if it is close */
function nearTarget(key, p){
  let best = null, bd = 26;
  for (const n of targetsFor(key)){ const t = target(n); if (!t) continue; const s = P3(...t), d = Math.hypot(s[0] - p[0], s[1] - p[1]); if (d < bd){ bd = d; best = n; } }
  return best; }
/* the point on the face of the meter under the pointer, in face cm */
function faceAt(p){
  const a = P3(DMMF.x, DMMF.h, DMMF.z), b = P3(DMMF.x + DMMF.w, DMMF.h, DMMF.z), c = P3(DMMF.x, DMMF.h, DMMF.z + DMMF.l);
  const ux = b[0] - a[0], uy = b[1] - a[1], vx = c[0] - a[0], vy = c[1] - a[1], det = ux * vy - uy * vx; if (Math.abs(det) < 1e-9) return null;
  const dx = p[0] - a[0], dy = p[1] - a[1]; return [(dx * vy - dy * vx) / det * DMMF.w, (ux * dy - uy * dx) / det * DMMF.l]; }
function dialAt(p){ const f = faceAt(p); if (!f) return null; const dx = f[0] - DIAL_C[0], dy = f[1] - DIAL_C[1], r = Math.hypot(dx, dy);
  if (r > DIAL_R + 1.25) return null; if (r < 0.6) return "centre";
  const ang = Math.atan2(dy, dx) * 180 / Math.PI; let best = null, bd = 1e9;
  for (const [nm, deg] of DIAL){ const d = Math.abs(((ang - deg) % 360 + 540) % 360 - 180); if (d < bd){ bd = d; best = nm; } }
  return best; }
function stepDial(s){ let i = DIAL_ORDER.indexOf(kit.dial); i = (i + s + DIAL_ORDER.length) % DIAL_ORDER.length; kit.dial = DIAL_ORDER[i]; }
const isEnd = id => id && /^(pr_[rb]|snap_[pn]|clip_[rb])$/.test(id);
cv3.addEventListener("contextmenu", e => e.preventDefault());
cv3.addEventListener("pointerdown", e => {
  const p = pe(e); mPrev = p; cv3.setPointerCapture(e.pointerId);
  let id = pick3(p[0], p[1]);
  if (e.button === 1 || e.button === 2){ e.preventDefault(); down = {p, kind: "pan", btn: e.button, moved: false, id}; return; }
  if (e.button) return;
  if (UI.hand === "batt"){ if (id === "batt"){ kit.battV = newBattery(kit.rng); UI.hand = null; note(tr("st_batt")); } else note(tr("st_needBatt")); refresh(); return; }
  /* a terminal with a lead end on it: you grab the end, not the terminal */
  if (id && !isEnd(id)){ const lead = /^lead([AB])(\d)$/.exec(id), t = lead ? lead[1] + kit.root(+lead[2]) : id;
    for (const k of ["clip_r", "clip_b", "pr_r", "pr_b", "snap_p", "snap_n"]){ const [o, c] = STATE(k); if (o[c] === t){ id = k; break; } } }
  if (isEnd(id)){ const [o, k] = STATE(id); UI.drag = {kind: "end", key: id, at: endPos(id).slice(), was: o[k]}; down = {p, kind: "end", key: id, moved: false}; return; }
  if (id && id.startsWith("cap")){ const i = +id.slice(3), q = onPlane(p[0], p[1], 0), c = kit.caps[kit.root(i)];
    down = {p, kind: "cap", i, off: [q[0] - c[0], q[2] - c[1]], moved: false}; return; }
  if (id === "plate"){ down = {p, kind: "plate", x0: onPlane(p[0], p[1], BASE_H + 0.9)[0], s0: kit.slide, moved: false}; return; }
  if (id === "dmm"){ const d = dialAt(p); if (d && d !== "centre"){ down = {p, kind: "dial", d, moved: false}; return; } }
  down = {p, kind: view3 === "3d" ? "orbit" : "pan", id, moved: false}; });
cv3.addEventListener("pointermove", e => {
  const p = pe(e), dx = p[0] - mPrev[0], dy = p[1] - mPrev[1]; mPrev = p;
  if (!down){ const id = pick3(p[0], p[1]); cv3.className = UI.hand ? "copy" : id && id !== "room" && id !== "base" ? "pointer" : ""; return; }
  if (Math.hypot(p[0] - down.p[0], p[1] - down.p[1]) > 4) down.moved = true; if (!down.moved) return;
  const k = down.kind;
  if (k === "orbit"){ CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.12, CAM.pitch + dy * 0.006)); cv3.classList.add("grabbing"); }
  else if (k === "pan"){ CAM.px += dx; CAM.py += dy; cv3.classList.add("grabbing"); }
  else if (k === "end"){ const hot = nearTarget(down.key, p); UI.hot = hot; UI.drag.at = hot ? target(hot).slice() : surfaceAt(p); }
  else if (k === "cap"){ const q = onPlane(p[0], p[1], 0), r = kit.root(down.i);
    if (r !== down.i){ kit.caps[down.i] = kit.caps[r].slice(); delete kit.stack[down.i]; note(tr("st_unstack")); }
    kit.caps[down.i] = [Math.max(-35, Math.min(110, q[0] - down.off[0])), Math.max(11.5, Math.min(58, q[2] - down.off[1]))];
    /* its mates come with it */
    for (const j of Object.keys(kit.stack)) if (kit.root(+j) === down.i) kit.caps[+j] = kit.caps[down.i].slice(); }
  else if (k === "plate"){ const x = onPlane(p[0], p[1], BASE_H + 0.9)[0]; kit.slide = Math.max(0, Math.min(TRAVEL_MM, down.s0 - (x - down.x0) * 10)); }
});
cv3.addEventListener("pointerup", e => {
  cv3.classList.remove("grabbing"); const d = down; down = null; if (!d) return;
  if (d.kind === "pan" && !d.moved && d.btn === 2){ if (UI.hand){ UI.hand = null; note(""); } else if (!putBack(d.id) && view3 !== "3d") showView("3d"); refresh(); return; }
  if (d.kind === "end"){ const key = d.key, [o, k] = STATE(key), hot = UI.hot; UI.hot = null;
    if (!d.moved){ UI.drag = null; refresh(); return; }
    if (hot){ const other = {r: "b", b: "r", p: "n", n: "p"}[k]; if (o[other] === hot) o[other] = HOME[key.slice(0, -1) + other].slice();
      o[k] = hot; note(tr("st_on").replace("%s", termName(hot))); }
    else { o[k] = UI.drag.at.slice(); note(tr("st_free")); }
    UI.drag = null; refresh(); return; }
  if (d.kind === "cap"){
    if (d.moved){ const i = d.i, p = kit.caps[i];
      for (const j of Object.keys(kit.caps).map(Number)) if (j !== i && kit.root(j) === j && Math.hypot(kit.caps[j][0] - p[0], kit.caps[j][1] - p[1]) < 2.6){
        kit.stack[i] = j; for (const m of Object.keys(kit.stack)) if (kit.stack[m] === i) kit.stack[m] = j;
        for (const c of ["r", "b"]){ const v = kit.clip[c]; if (typeof v === "string" && /^[AB]\d$/.test(v) && +v[1] === i) kit.clip[c] = v[0] + j; }
        note(tr("st_stack")); break; } }
    refresh(); return; }
  if (d.kind === "dial"){ kit.dial = d.d; refresh(); return; }
  if (!d.moved && view3 === "3d"){
    if (d.id === "switch"){ kit.sw = !kit.sw; refresh(); return; }
    if (d.id === "dmm"){ showView("dmm"); return; } if (d.id === "scale" || d.id === "plate" || d.id === "stop"){ showView("scale"); return; }
    if (d.id === "osc" || d.id === "batt" || ["JR", "JB", "BINP", "BINN"].includes(d.id)){ showView("osc"); return; } }
  if (!d.moved && d.id === "switch"){ kit.sw = !kit.sw; refresh(); return; }
  refresh(); });
function termName(n){ if (/^[AB]\d$/.test(n)) return tr("t_lead").replace("%s", CAPS[+n[1]][0]); return tr("t_" + n); }
cv3.addEventListener("dblclick", e => { const p = pe(e), id = pick3(p[0], p[1]);
  if (id && id !== "room" && id !== "base") return;
  freeCam = null; if (view3 !== "3d") showView("3d"); Object.assign(CAM, CAM0); });
/* a right click on a part puts it back: a capacitor into the box, a lead end to where it lies at the start */
function putBack(id){
  if (!id) return false;
  if (id.startsWith("cap")){ capBack(+id.slice(3)); return true; }
  if (isEnd(id)){ const [o, k] = STATE(id); o[k] = id.startsWith("clip") ? (k === "r" ? "BBU" : "BBL") : null; note(""); return true; }
  return false; }
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = pe(e), up = e.deltaY < 0, id = pick3(p[0], p[1]);
  if (id === "dmm" && dialAt(p)){ stepDial(up ? -1 : 1); refresh(); return; }
  if (id === "plate" && view3 === "scale"){ kit.slide = Math.max(0, Math.min(TRAVEL_MM, kit.slide + (up ? 0.5 : -0.5) * (e.shiftKey ? 0.2 : 1))); return; }
  const f = up ? 1.12 : 1 / 1.12, nk = Math.min(240, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive: false});

/* ---- language ---- */
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.getAttribute("data-i18n")); });
  $("btn-en").className = LANG === "en" ? "on" : ""; $("btn-ko").className = LANG === "ko" ? "on" : "";
  document.documentElement.lang = LANG; $("info").innerHTML = tr("info");
  document.title = LANG === "ko" ? "IPhO 2011 E1 — 전기 블랙박스 · HaslaLab" : "IPhO 2011 E1 — Electrical Blackbox · HaslaLab";
  trayLayout(); refresh(); if (!$("status").textContent) note(tr("st_ready")); }
function setLang(l){ LANG = l; const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u); note(""); applyLang(); }
$("btn-en").onclick = () => setLang("en"); $("btn-ko").onclick = () => setLang("ko");

/* ---- the clock ---- */
setInterval(() => kit.tick(), 220);
function loop(){ draw3(); requestAnimationFrame(loop); }
layout3(); applyLang(); requestAnimationFrame(loop);

</script>
