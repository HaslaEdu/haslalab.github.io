<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;

  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}

  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);

  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}

  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}

  .tabs button.on:hover{background:var(--accent);color:#1c2027}

  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ul{margin:4px 0 4px 20px;padding:0}

  t_lead: ["a lead of %s", "%s의 다리"],
  info: [`<h4>The apparatus (Figures 1–3 of the paper)</h4><ul>
<li>On the dark wooden base: the 9 V battery with its snap, the grey relaxation oscillator with its lamp, its toggle switch at the front, and its red and black frequency output posts.</li>
<li>The wooden blackbox is a parallel-plate capacitor: two plates of small teeth with a dielectric sheet (K = 1.5, d = 0.20 mm) between them. Its two screws are the connectors to the plates; the crocodile clips of the oscillator sit on them.</li>

<li>The MASTECH multimeter on the desk measures the frequency on the Hz setting (Figure 3), and d.c. volts on the V settings.</li>
<li>The parts box holds the capacitors 33J, 68, 82J and 151 (Table 1) and a box of 9 V batteries, new and old mixed.</li></ul>
<h4>Handling</h4><ul>
<li>Take a lead end (a meter probe, a crocodile clip): drag it onto a terminal, or click it and click the terminal. It follows the pointer as far as its cable reaches and snaps on when it is close; elsewhere it is put down. Right-click or Esc puts it back where it was.</li>
<li>Click the switch on the base to turn the oscillator on; its lamp shows that it runs. Click the battery snap to pull it off or press it on.</li>
<li>The meter: press its red ON/OFF button, and turn the dial by clicking a range or rolling the wheel over it (the frequency range is 20k Hz at the bottom).</li>
<li>Check the battery: put the probes on its terminals and turn the dial to 20 V. Below 9 V, drag a new one from the box onto it.</li>
<li>Drag a capacitor out of the box onto the desk and clip both crocodile clips to its two leads: it then replaces the blackbox. Put one capacitor on another to twist their leads together (in parallel); take it off again to separate them.</li>
<li>Click the meter, the scale or the oscillator for a close-up. Right-click goes back, or puts a part back in the box.</li></ul>
<h4>Measuring</h4><ul>
<li>The simulator computes nothing for you. Read the frequency on the meter and the position of the plate edge on the 1 mm scale yourself.</li>
<li>The last digit of the meter flickers, as on the real one, and a tired battery makes the oscillator slow and finally stop.</li></ul>`,
`<h4>장비 (문제지 그림 1–3)</h4><ul>

/* ==== PHYSICS START ====================================================
   What the instruments read.  Nothing here hands the student a derived
   quantity: the meter shows a frequency or a voltage, the scale shows
   where the edge of the upper plate is, and that is all.

   The oscillator:   f = alpha / (C + C_s)
       alpha = 714 nF/s,  C_s = 17.9 pF                 (official Part 1)
   The capacitors of Table 1 have their own true values, close to the
   marking.

   The blackbox is Pattern I: two combs of rectangular teeth, pitch 1.0 cm,
   the upper one sliding into the lower one over a 0.20 mm sheet of K = 1.5.
       C(s) = C_par + K eps0 b / d * (overlap of the teeth, in length)
   As the plate goes in, one more tooth engages every pitch, so the peaks
   of C climb by K eps0 w b / d = 19.9 pF per period (the official C_max
   against node), and the troughs climb too: the teeth of the kit are a
   little wider than the gaps (6.6 mm on a 10 mm pitch), so they never
   quite clear one another.  The flat bottoms and the climbing troughs of
   the official C-x table come from that.  C_par, the engagement at s = 0
   and the phase are fitted to the 59 rows of the official table (rms 5.7 pF,
   about the scatter of reading a slider by hand).
   ==================================================================== */
const EPS0 = 8.85e-12, K_DIEL = 1.5, D_GAP = 0.20e-3;
const ALPHA0 = 714e-9, C_STRAY = 17.9e-12;
const CAPS = [["33J", 34, 33.6e-12], ["68", 68, 67.4e-12], ["82J", 84, 83.8e-12], ["151", 150, 149.2e-12]];
const PITCH_MM = 10.0, TOOTH_MM = 6.60, B_TOOTH = 49.1e-3;
const KAPPA = K_DIEL * EPS0 * B_TOOTH / D_GAP * 1e-3;     /* farad per mm of overlap */
const C_PAR = 44.35e-12, LEAD0_MM = 16.64, PHASE_MM = -1.48;
const TRAVEL_MM = 60.0;
const DMM_HZ_FS = 19.99;
const BATT_GOOD = [9.05, 9.55], BATT_WEAK = [6.60, 8.85], BATT_DRAIN = 0.0008;
const V_OSC_MIN = 7.60, V_OSC_OK = 8.60;

/* length of tooth overlap with the upper plate pushed in by s mm */
function overlapMM(s){
  const lead = LEAD0_MM + s; let sum = 0;
  for (let k = 0; k < 40; k++){
    const u1 = lead - k * PITCH_MM, u0 = u1 - TOOTH_MM; if (u1 <= 0) break;
    for (let j = -1; j < 40; j++){
      const l0 = PHASE_MM + j * PITCH_MM, l1 = l0 + TOOTH_MM;
      const lo = Math.max(u0, l0, 0), hi = Math.min(u1, l1);
      if (hi > lo) sum += hi - lo;
    }
  }

  if (e.button) return;
  if (UI.carry){ down = {p, kind: "put", moved: false}; return; }
  /* a terminal with a lead end on it: you take the end, not the terminal */
  if (id && !isEnd(id)){ const lead = /^lead([AB])(\d)$/.exec(id), t = lead ? lead[1] + kit.root(+lead[2]) : id;
    for (const k of ["clip_r", "clip_b", "pr_r", "pr_b"]){ const [o, c] = STATE(k); if (o[c] === t){ id = k; break; } } }
  if (isEnd(id)){ pickEnd(id); down = {p, kind: "carry", moved: false}; return; }
  if (id && (id.startsWith("cap") || id.startsWith("lead"))){ const i = id.startsWith("cap") ? +id.slice(3) : +id.slice(-1);
    if (kit.root(i) !== i){ kit.caps[i] = kit.caps[kit.root(i)].slice(); delete kit.stack[i]; note(tr("st_unstack")); }
    UI.carry = {kind: "cap", i, at: capAt(p), fresh: false}; down = {p, kind: "carry", moved: false}; return; }
  if (id === "plate"){ down = {p, kind: "plate", x0: onPlane(p[0], p[1], PLATE.y1)[0], s0: kit.slide, moved: false}; return; }
  if (id === "dmm"){ const h = faceHit(p); if (h){ down = {p, kind: "face", h, moved: false}; return; } }
  down = {p, kind: view3 === "3d" ? "orbit" : "pan", id, moved: false}; });
cv3.addEventListener("pointermove", e => {
  const p = pe(e), dx = p[0] - mPrev[0], dy = p[1] - mPrev[1]; mPrev = p; UI.mouse = p;
  if (UI.carry){ if (UI.carry.kind === "end") UI.hot = nearTarget(UI.carry.key, p); if (UI.carry.kind === "cap") UI.carry.at = capAt(p); }
  if (!down){ const id = pick3(p[0], p[1]); cv3.className = UI.carry ? "copy" : id && id !== "room" && id !== "base" ? "pointer" : ""; return; }
  if (Math.hypot(p[0] - down.p[0], p[1] - down.p[1]) > 4) down.moved = true; if (!down.moved) return;
  const k = down.kind;
  if (k === "orbit"){ CAM.yaw += dx * 0.008; CAM.pitch = Math.min(1.5, Math.max(0.12, CAM.pitch + dy * 0.006)); cv3.classList.add("grabbing"); }
  else if (k === "pan"){ CAM.px += dx; CAM.py += dy; cv3.classList.add("grabbing"); }
  else if (k === "plate"){ const x = onPlane(p[0], p[1], PLATE.y1)[0]; kit.slide = Math.max(0, Math.min(TRAVEL_MM, down.s0 - (x - down.x0) * 10)); }
});
cv3.addEventListener("pointerup", e => {
  cv3.classList.remove("grabbing"); const d = down; down = null; if (!d) return; const p = pe(e);
  if (d.kind === "pan" && !d.moved && d.btn === 2){ if (cancelCarry()) return; if (!putBack(d.id) && view3 !== "3d") showView("3d"); refresh(); return; }
  /* pressed and dragged: put down where it is let go; just clicked: it stays in the hand until the next click */
  if (d.kind === "carry"){ if (d.moved) putDown(p); else refresh(); return; }
  if (d.kind === "put"){ putDown(p); return; }
  if (d.kind === "face" && !d.moved){ if (d.h === "power") kit.dmmOn = !kit.dmmOn; else kit.dial = d.h.slice(5); refresh(); return; }
  if (!d.moved){
    if (d.id === "switch"){ kit.sw = !kit.sw; refresh(); return; }
    if (d.id === "snap"){ kit.snapped = !kit.snapped; note(tr(kit.snapped ? "st_snapOn" : "st_snapOff")); refresh(); return; }
    if (view3 === "3d"){ if (d.id === "dmm"){ showView("dmm"); return; } if (d.id === "scale" || d.id === "plate" || d.id === "stop"){ showView("scale"); return; }
      if (d.id === "osc" || d.id === "batt" || d.id === "JR" || d.id === "JB"){ showView("osc"); return; } } }
  refresh(); });
cv3.addEventListener("dblclick", e => { const p = pe(e), id = pick3(p[0], p[1]);
  if (UI.carry || (id && id !== "room" && id !== "base")) return;
  freeCam = null; if (view3 !== "3d") showView("3d"); Object.assign(CAM, CAM0); });
/* a right click on a part puts it back: a capacitor into the box, a lead end to where it lies at the start */
function putBack(id){
  if (!id) return false;
  if (id.startsWith("cap")){ capBack(+id.slice(3)); return true; }
  if (isEnd(id)){ const [o, k] = STATE(id); o[k] = id.startsWith("clip") ? (k === "r" ? "BBU" : "BBL") : null; note(""); return true; }
  return false; }
cv3.addEventListener("wheel", e => { e.preventDefault(); const p = pe(e), up = e.deltaY < 0, id = pick3(p[0], p[1]);
  if (id === "dmm"){ const h = faceHit(p); if (h && h.startsWith("dial")){ stepDial(up ? -1 : 1); refresh(); return; } }
  if (id === "plate" && view3 === "scale"){ kit.slide = Math.max(0, Math.min(TRAVEL_MM, kit.slide + (up ? 0.5 : -0.5) * (e.shiftKey ? 0.2 : 1))); return; }
  const f = up ? 1.12 : 1 / 1.12, nk = Math.min(240, Math.max(2, CAM.k * f)), r = nk / CAM.k;
  CAM.px = (p[0] - CAM.W / 2) - (p[0] - CAM.W / 2 - CAM.px) * r; CAM.py = (p[1] - CAM.H / 2) - (p[1] - CAM.H / 2 - CAM.py) * r; CAM.k = nk; }, {passive: false});
window.addEventListener("keydown", e => { if (e.key === "Escape") cancelCarry(); });

/* ---- language ---- */
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.getAttribute("data-i18n")); });
  $("btn-en").className = LANG === "en" ? "on" : ""; $("btn-ko").className = LANG === "ko" ? "on" : "";
  document.documentElement.lang = LANG; $("info").innerHTML = tr("info");
  document.title = LANG === "ko" ? "IPhO 2011 E1 — 전기 블랙박스 · HaslaLab" : "IPhO 2011 E1 — Electrical Blackbox · HaslaLab";
  trayLayout(); refresh(); if (!$("status").textContent) note(tr("st_ready")); }
function setLang(l){ LANG = l; const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u); note(""); applyLang(); }
$("btn-en").onclick = () => setLang("en"); $("btn-ko").onclick = () => setLang("ko");

/* ---- the clock ---- */
setInterval(() => kit.tick(), 220);
let tauntShown = false;
function loop(){ draw3();
  if (UI.carry && UI.carry.kind === "end"){ if (UI.msgTaut && !tauntShown){ note(tr("st_taut")); tauntShown = true; } else if (!UI.msgTaut && tauntShown){ note(tr("st_inHand")); tauntShown = false; } }
  requestAnimationFrame(loop); }
layout3(); applyLang(); requestAnimationFrame(loop);

</script>
