<body>
<script>
/* NBPhO 2010 problem 5 "Elastic thread" on the 3-D bench.  As in the official solution, the thread is taped
   to the wooden rod at A and pressed at B; the known weight hangs in the middle, C, and the thread makes
   a V; the tension is T = ½mg·AC/CD (D the middle of AB).  Moving B along the rod and choosing how much
   thread lies between A and B (its unstretched length l0, by the marker's 1 cm marks) covers ε from about
   0.1 to 4.  The rubber follows a Mooney-type law that is neo-Hookean at moderate strain and stiffens as
   it nears ε ≈ 4, F = G S0[(λ − λ⁻²) + κ(λ − 1)³]; G S0 and κ differ a little from visit to visit. */
var PROGRAM = {
  title: { ko: 'NBPhO 2010 실험 5 — 고무실', en: 'NBPhO 2010 Problem 5 — Elastic thread' },
  subtitle: { ko: '큰 상대 변형 ε = (l − l₀)/l₀ 에서 고무실의 탄성을 조사합니다. (i) ε ≈ 4 까지 F/ε 를 ε 의 함수로 그리고 불확도를 표시하세요. (ii) 영률 E = F/(Sε) 가 일정하다고 가정하고 실의 부피가 ε 에 따라 어떻게 변하는지 그리세요.',
              en: 'Study the thread\'s elasticity at large relative deformations ε = (l − l₀)/l₀. (i) Plot F/ε as a function of ε up to ε ≈ 4 with uncertainties. (ii) Assuming the Young modulus E = F/(Sε) stays constant, plot how the thread\'s volume depends on ε.' },
  notes: { ko: [
    '장비: 자, 테이프, 고무실, 나무 막대, 마커, 질량을 아는 추 (문제지 그대로). 추는 100 g 입니다.',
    '공식 해답처럼: A 에 테이프로 붙이고 B 에서 누른 뒤 가운데 C 에 추를 걸면 V 자가 됩니다. T = ½mg·AC/CD (D 는 AB 의 가운데).',
    '실에는 마커로 1 cm 마다 표시가 있어 A–B 사이 실의 원래 길이 l₀ 를 셀 수 있습니다. 막대에는 cm 눈금이, 책상에는 세운 자가 있습니다.',
    '고무는 중간 변형까지 neo-Hooke 처럼, ε ≈ 4 가까이에서는 단단해지도록 계산합니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Equipment: a ruler, tape, the elastic thread, a wooden rod, a marker and a known weight (as on the sheet). The weight is 100 g.',
    'As in the official solution: tape the thread at A, press it at B, hang the weight in the middle C and the thread makes a V. T = ½mg·AC/CD (D the middle of AB).',
    'The thread carries marker dots every 1 cm, so the unstretched length l₀ between A and B can be counted. The rod has a cm scale and a stick stands on the desk.',
    'The rubber is computed neo-Hookean at moderate strain and stiffening near ε ≈ 4. The values differ a little from visit to visit.'] }
};

var LAB = { B: 30, l0: 20, stick: 15 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 스탠드 두 개에 가로로 걸친 나무 막대(cm 눈금, 0 이 A), A 에 테이프로 붙인 고무실(1 cm 마다 마커 점), 실 가운데의 100 g 추, 세워 둔 1 m 자.',
           en: 'On the desk: the wooden rod across two stands (cm scale, 0 at A), the thread taped at A (marker dots every 1 cm), the 100 g weight in its middle, and a standing 1 m stick.' },
  howto: { ko: ['B 를 누른 손가락(집게): 막대를 따라 끌어 AB 바꾸기 · 휠로 A–B 사이에 넣는 실의 길이 l₀ 바꾸기 (1 cm 표시 단위)',
                '세운 자: 끌어서 추 옆으로 옮기기 · 클릭: 옆에서 가까이 보기',
                '막대 클릭: 눈금 가까이 보기'],
           en: ['The finger (clip) pressing B: drag it along the rod to change AB · roll the wheel to change the thread length l₀ between A and B (in 1 cm marks)',
                'Standing stick: drag it next to the weight · click: look across at it closely',
                'Click the rod: look at its scale closely'] },
  notePlaceholder: { ko: '예) l₀ = 20 표시, AB = 30.0 cm, C 높이 41.2 cm, 막대 높이 60.0 cm → CD, AC, T, ε', en: 'e.g. l₀ = 20 marks, AB = 30.0 cm, C at 41.2 cm, rod at 60.0 cm → CD, AC, T, ε' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var GS = 0.62 * (1 + S.sys('GS', 0.06)), kap = 0.02 * (1 + S.sys('kap', 0.2)), m = 0.100, g = 9.81, RY = 60, AX = -20;
    var F = function (lam) { return GS * ((lam - 1 / (lam * lam)) + kap * Math.pow(lam - 1, 3)); };
    function sag(AB, l0) {                                                           /* solve the V: CD with T(CD) = F(λ) */
      var lo = 1e-4, hi = 60;
      for (var i = 0; i < 80; i++) { var cd = (lo + hi) / 2, ac = Math.hypot(AB / 2, cd), lam = 2 * ac / l0, T = 0.5 * m * g * ac / cd;
        if (lam < 1 || F(lam) < T) lo = cd; else hi = cd; }
      var cd2 = (lo + hi) / 2; return { cd: cd2, lam: 2 * Math.hypot(AB / 2, cd2) / l0 };
    }
    var rodTex = B3.scaleTex(80, { horiz: true, width: 2.4, bg: '#d9b98a', label: 'cm' });
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, wheelIds: ['B'],
      home: { yaw: -0.2, pitch: 0.25, k: 7, tx: 5, ty: 40, tz: 0 },
      views: {
        stick: { yaw: 0, pitch: 0.02, k: 26, tx: 10, ty: 45, tz: 0, title: { ko: '세운 자 (옆에서)', en: 'The standing stick (from the side)' } },
        rod: { yaw: 0, pitch: 0.5, k: 22, tx: 0, ty: RY, tz: 0, title: { ko: '막대의 눈금', en: 'The rod\'s scale' } }
      },
      frame: function (b) {
        var mb = b.moved('B'); if (mb[0]) LAB.B = Math.max(4, Math.min(76, LAB.B + mb[0]));
        var wb = b.wheel('B'); if (wb) LAB.l0 = Math.max(4, Math.min(60, LAB.l0 + Math.sign(wb)));
        var ms = b.moved('stick'); if (ms[0] || ms[1]) LAB.stick = Math.max(-25, Math.min(70, LAB.stick + ms[0]));
        var AB = LAB.B, sol = sag(AB, LAB.l0), cd = sol.cd;
        if (RY - cd < 6) cd = RY - 6;                                                   /* the weight rests on the desk */
        var A = [AX, RY, 0], Bp = [AX + AB, RY, 0], C = [AX + AB / 2, RY - cd, 0];
        B3.desk(-40, 80, -20, 20);
        /* the rod on two stands */
        B3.stand(-30, -8, RY + 6, { bw: 6, bd: 6 }); B3.stand(68, -8, RY + 6, { bw: 6, bd: 6 });
        B3.box3(-31, 69, RY + 0.6, RY + 2.4, -8.6, 1.0, '#a07a4a', { id: 'm:rod', top: '#b48a58' });
        B3.tex3(rodTex, 0, 0, rodTex.width, rodTex.height, [AX - 1, RY + 2.41, -1.6], [82, 0, 0], [0, 0, 2.4], { id: 'm:rod' });
        /* the thread: A–C–B, its marker dots, the spare thread beyond B */
        B3.line3(A, C, '#2a1e1a', 2.2); B3.line3(C, Bp, '#2a1e1a', 2.2);
        for (var k = 1; k < LAB.l0; k++) { var s = k / LAB.l0, p = s < 0.5 ? [A[0] + (C[0] - A[0]) * s * 2, A[1] + (C[1] - A[1]) * s * 2] : [C[0] + (Bp[0] - C[0]) * (s - 0.5) * 2, C[1] + (Bp[1] - C[1]) * (s - 0.5) * 2];
          B3.sphere3([p[0], p[1], 0.08], 0.14, '#1d4fa0'); }
        B3.line3(Bp, [Bp[0] + 6, RY + 0.6, 2], '#2a1e1a', 2.2);
        B3.box3(AX - 1.2, AX + 1.2, RY + 0.2, RY + 2.5, -0.9, 0.9, 'rgba(235,225,180,.85)');           /* the tape at A */
        B3.box3(Bp[0] - 0.8, Bp[0] + 0.8, RY + 0.4, RY + 3.4, -0.9, 0.9, '#d9a07a', { id: 'm:B' });  /* the finger / clip at B */
        /* the weight */
        B3.cyl3('y', C[1] - 6, C[1] - 1, C[0], 0, 1.6, '#7c7f84', { seg: 18, cap: '#8e9196' }); B3.line3(C, [C[0], C[1] - 1, 0], '#555', 1.5);
        B3.text3([C[0] - 1.2, C[1] - 3, 1.62], [1, 0, 0], [0, -1, 0], '100 g', 0.6, '#f2f2f2', { weight: '700' });
        /* the standing stick */
        B3.meterStick(LAB.stick, 4, 100, 'm:stick');
        var V = b.views; V.stick.tx = (LAB.stick + C[0]) / 2; V.stick.ty = (RY + C[1]) / 2; V.rod.tx = AX + AB / 2;
        LAB.state = { AB: AB, l0: LAB.l0, cd: cd, lam: sol.lam };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
