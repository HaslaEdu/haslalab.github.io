<style>
  /* the ISPhO 2026 look: a light page, the lab in a Windows 10 window with Tk-style group boxes */
  :root{
    --bg:#e8ebee; --panel:#f0f0f0; --ink:#000; --muted:#5b6b7c;
    --line:#dcdcdc; --accent:#2c6f9b; --accent-soft:#e1e1e1; --deep:#fff;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{color:#000;font:13px/1.45 "Segoe UI",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:14px 16px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:650;color:#000}
  header p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:1200px}
  .lang{display:flex;border:1px solid #c3ccd4;border-radius:6px;overflow:hidden;background:#fff}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:6px 13px;font:600 12px inherit;
               color:var(--muted);background:#fff;cursor:pointer;text-align:center}
  .lang button:hover:not(.on){background:#f3f6f8;border:0}
  .lang button.on{background:#2c6f9b;color:#fff}
  .lang button{height:auto;line-height:18px}
  /* in line with the window's right edge and the title, as on the ISPhO 2026 page */
  body > header > .lang{top:10px;right:16px}

  /* ── the window ── */
  .winwrap{max-width:1680px;margin:12px auto 26px;padding:0 16px}
  .win{background:#f0f0f0;border:1px solid #8f8f8f;box-shadow:0 8px 28px -12px rgba(0,0,0,.45);

  .cap{height:30px;background:#fff;display:flex;align-items:center;font-size:12px;user-select:none}
  .cap svg{margin:0 8px 0 9px}
  .cap .tt{flex:1}
  .cap .wb{width:46px;height:30px;display:flex;align-items:center;justify-content:center}
  .cap .wb:hover{background:#e5e5e5}
  .cap .wb.x:hover{background:#e81123}
  .cap .wb.x:hover svg path{stroke:#fff}
  .wrap{padding:10px;display:flex;gap:10px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }

  /* group boxes: a thin border with the caption cut into its top edge */
  .tray,.card,.panel{background:#f0f0f0;border:1px solid #dcdcdc;border-radius:0;position:relative}

const cuvVol=c=>c.V.w+c.V.naoh+c.V.nacl+c.V.gl+c.icV+c.inV;          /* ml */

const STOCK={water:()=>1,nacl:()=>0.30,gl:()=>0.50};
const cuvMax=4.5;
function emptyCuv(i){ const c=ST.cuv[i], lab=c.label; ST.cuv[i]=newCuv(i); ST.cuv[i].label=lab; ST.wasted++; say("emptied",i); }
function ensureTr(c){ const q=conc(c); if(!c.tr&&c.icV>0&&q.OH>1e-3&&q.Gl>1e-3) c.tr={n:1,i:0,f:0,O:1}; }
/* pour v ml of reagent s into cuvette c */
function addTo(c,s,v){ if(!(v>0)) return false; if(c.cap){ say("capFirst"); return false; }
  if(s==="water") c.V.w+=v; else if(s==="nacl") c.V.nacl+=v; else if(s==="gl") c.V.gl+=v;
  else if(s==="naoh"){ const cs=ST.naohSol.c; c.cNaOH=(c.cNaOH*c.V.naoh+cs*v)/(c.V.naoh+v); c.V.naoh+=v; }
  else if(s==="ic") c.icV+=v; else if(s==="ind"){ c.inV+=v; c.ph.h+=v/0.005; }
  const V=cuvVol(c); if(V>cuvMax){ const f=cuvMax/V; for(const q in c.V) c.V[q]*=f; c.icV*=f; c.inV*=f; c.ph.h*=f; c.ph.n*=f; c.ph.b*=f; say("full"); } else say("inj",c.i);

function insDrop(toCuv){ const s=ST.ins[ST.insK]; if(!(s.V>0)){ say("insEmpty"); return; }
  const v=Math.min(s.V,TRUE.Vd[ST.insK]*1e6*(1+gauss(0,0.03))); s.V=Math.max(0,s.V-v); s.drop=0;
  if(toCuv){ const c=selCuv(); if(!c){ say("needFor",itemName("cuvettes")); s.V+=v; return; } if(!addTo(c,s.src,v)){ s.V+=v; return; } }
  say("drop"); }
function chem(cmd){ const [_,a,b]=cmd.split(":"), L=d().lab;
  if(a==="insk"){ ST.insK=+b; return; }
  if(a==="insfill"){ const s=ST.ins[ST.insK]; if(s.src&&s.src!==b&&s.V>0){ say("syrMix"); return; } s.src=b; s.V=0.5; say("insFill",ST.insK,L[b]); return; }
  if(a==="drop") return insDrop(true); if(a==="dropW") return insDrop(false);
  if(a==="push"){ const s=ST.ins[ST.insK], c=selCuv(); if(!c){ say("needFor",itemName("cuvettes")); return; } const v=Math.min(s.V,+b); if(!(v>0)){ say("insEmpty"); return; }
    if(addTo(c,s.src,v*(1+gauss(0,0.01)))) s.V=Math.max(0,s.V-v); return; }
  if(a==="insEmpty"){ ST.ins[ST.insK].V=0; return; }
  const s3=ST.syr3;
  if(a==="s3src"){ if(s3.V>0&&s3.src!==b){ say("syrMix"); return; } if(b==="naoh"&&!ST.gloves){ say("noGloves"); return; } s3.src=b; return; }
  if(a==="s3"){ const dv=+b; if(s3.src==="naoh"&&!ST.gloves){ say("noGloves"); return; }
    if(dv>0){ if(s3.V>=3-1e-9){ say("syrFull"); return; } let v=Math.min(3-s3.V,dv+gauss(0,0.006)); if(s3.src==="naoh"){ if(!ST.naohSol){ say("noStock"); return; } v=Math.min(v,ST.naohSol.V); ST.naohSol.V-=v; } s3.V+=v; say("drew",s3.V,L[s3.src]); }

  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-psu","hPsu"],["t-h-rgb","hRgb"],["t-h-opt","hOpt"],["t-h-sp","hSp"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"],["vzero","vzero"],["cfgHint","cfgHint"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let rem=dt*ST.speed; while(rem>1e-9){ const h=Math.min(0.25,rem); step(h); rem-=h; }
  for(const s of ST.ins) if(s.drop!==undefined) s.drop=Math.min(1,s.drop+dt*2);
  if(SPEC.live&&has("sensor")&&frameN%3===0) specFrame();
  if(frameN%4===0) drawLaptopScreen();
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
