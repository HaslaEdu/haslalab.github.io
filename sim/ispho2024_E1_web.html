<meta name="description" content="ISPhO 2024 실험 문제 흡수 분광과 화학 반응 속도를 브라우저에서 실행합니다. 렌즈·회절격자·CCD로 분광기를 맞추고 RGB LED로 보정한 다음, 인디고 카민의 흡수 단면적(비어-람베르트 법칙), 페놀프탈레인 탈색 반응의 차수 p, 화학 신호등의 색 변화를 큐벳과 주사기로 직접 측정합니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  .row button{flex:1;text-align:center;min-width:0}
  button{padding:7px 9px;margin:3px 0;cursor:pointer;background:var(--accent-soft);
         border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
         color:var(--ink);text-align:center;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#343941;border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1c2027;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  #redBtn{width:100%;background:#8a2a24;border-color:#b3372f;color:#fff;font-weight:600;user-select:none}
  #redBtn:hover{background:#a3322b}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .hint{font-size:11.5px;color:#9aa3ab;line-height:1.6;margin:4px 0 2px;white-space:pre-line}
  .status{font:12.5px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--accent);
          background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 9px;
          margin-top:12px;min-height:120px}
  .status div + div{margin-top:8px}
  .status .w{color:#f0a79f}

  /* ── header ── */
  header{max-width:1680px;margin:0 auto;padding:16px 12px 0;
         display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:650;color:var(--accent)}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
  .lang button{width:auto;margin:0;border:0;border-radius:0;padding:7px 15px;font-size:13px;
               font-weight:600;color:var(--muted);text-align:center;background:transparent}
  .lang button.on{background:var(--accent);color:#1c2027}
  .disp{font:600 26px/1.2 ui-monospace,Consolas,monospace;text-align:center;background:var(--deep);
        border:1px solid var(--line);border-radius:6px;padding:6px 0;color:#e8eef2;letter-spacing:.04em}
  .laps{font:12px/1.6 ui-monospace,Consolas,monospace;color:#9aa3ab;max-height:130px;overflow:auto;margin-top:4px}
  #closeCv{touch-action:none}
  .instr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .instr3 canvas{display:block;width:100%;background:var(--deep);border-radius:6px}
  .ilbl{font-size:12px;color:#f2c14e;font-weight:700;margin:0 0 4px}
  @media(max-width:900px){.instr3{grid-template-columns:1fr}}
  .chklist{font-size:12px;line-height:1.7}
  .chklist div{display:flex;justify-content:space-between;gap:8px;color:#9aa3ab}
  .chklist b{font-weight:600}.chklist .ok{color:#7fd39a}.chklist .no{color:#f0b35a}.chklist .na{color:#5c646d}
button.on{background:#3a3220;border-color:#f2c14e;color:#ffd77a}
  .row button.on{background:#f2c14e;color:#1b1d20;border-color:#f2c14e}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="lang">
    <button id="btn-ko" class="on">한국어</button>
    <button id="btn-en">English</button>
  </div>
</header>

<div class="wrap">
  <aside class="tray">
    <h3 id="t-tray"></h3>
    <canvas id="tray"></canvas>
  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-cap"></h3>
      <canvas id="cv"></canvas>
    </div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <h3 id="t-closecap"></h3>
      <canvas id="closeCv"></canvas>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-psu"></h2>
    <div class="disp" id="psuV"></div>
    <div class="row"><button id="psuBtn"></button><button id="adBtn"></button></div>
    <div class="row"><button id="vm1">−1</button><button id="vm01">−0.1</button><button id="vp01">+0.1</button><button id="vp1">+1</button></div>
    <div class="row"><button id="vzero"></button></div>

    <h2 id="t-h-rgb"></h2>
    <div class="row"><button id="rgbR">R</button><button id="rgbG">G</button><button id="rgbB">B</button></div>

    <h2 id="t-h-opt"></h2>
    <div class="hint" id="optSel"></div>
    <div class="row"><button id="om1">−1 cm</button><button id="om01">−1 mm</button><button id="op01">+1 mm</button><button id="op1">+1 cm</button></div>

    <h2 id="t-h-sp"></h2>
    <div class="row"><button id="sp1">×1</button><button id="sp5">×5</button><button id="sp20">×20</button><button id="sp60">×60</button></div>
    <div class="disp" id="swV">0:00.0</div>
    <div class="row"><button id="swGo"></button><button id="swRst"></button></div>

    <h2 id="t-h-note"></h2>
    <div class="row"><input id="cfg" style="flex:1;min-width:0;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:12px ui-monospace,Consolas,monospace"></div>
    <div class="hint" id="cfgHint"></div>
    <div class="row"><button id="noteBtn"></button><button id="noteClr"></button><button id="noteSave"></button></div>
    <textarea id="note" rows="8" style="width:100%;resize:vertical;background:var(--deep);color:#e8eef2;border:1px solid var(--line);border-radius:6px;font:12px/1.5 ui-monospace,Consolas,monospace;padding:6px"></textarea>

    <div class="status" id="status"></div>
  </aside>
</div>

const U=(a,b)=>a+Math.random()*(b-a);

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
const cuvVol=c=>c.V.w+c.V.naoh+c.V.nacl+c.V.gl+c.icV+c.inV;          /* ml */
function conc(c){ const V=Math.max(1e-6,cuvVol(c)); return {OH:c.cNaOH*c.V.naoh/V, Na:(c.cNaOH*c.V.naoh+0.30*c.V.nacl)/V, Cl:0.30*c.V.nacl/V, Gl:0.50*c.V.gl/V}; }
const ionJ=c=>{ const q=conc(c); return 0.5*(q.Na+q.OH+q.Cl); };                 /* mol/l */
/* molecules of IC per m^3 of the cuvette's solution */
function nIC(c){ const V=cuvVol(c)*1e-6; if(V<=0) return 0; const m=(0.70*(c.icV*1e-6))*1e3; return m/MU.IC*NA/V; }
/* the absorbance ln(I0/I) the cuvette's contents give at wavelength l (nm) along the beam */
function absorb(c,l){ let A=0; const icN=nIC(c);

/* ══════════════════════════════════════════════════════════════
   4.  THE SPECTROMETER
   ══════════════════════════════════════════════════════════════ */
function optics(){ const x=ST.x; if(!has("table")||!has("holder")||!has("L1")||!has("L2")||!has("screen")) return null;

/* the emission of what is in the holder (relative units per nm) */

/* the room's light reaching the sensor, without the sunshield */
const roomLight=l=>(has("sunshield")?0.06:1)*TRUE.room*(0.55*G(l,546,6)+0.4*G(l,612,8)+0.35*G(l,436,5)+0.25*G(l,560,60));

function cuvTrans(l){ if(!has("cuvhold")||ST.inHolder===null) return 1; const c=ST.cuv[ST.inHolder], V=cuvVol(c);

function cuvColor(c,alpha){ if(cuvVol(c)<0.05) return "rgba(225,238,245,"+(alpha||0.3)+")"; const ch=[[600,40],[545,35],[450,30]].map(([l0,w])=>{ let s=0,n=0; for(let l=400;l<=700;l+=10){ const g=G(l,l0,w); s+=g*Math.exp(-absorb(c,l)*0.9); n+=g; } return s/n; });

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }

function clearK(k){
  if(OPT.includes(k)){ ST.x[k]=null; if(k==="holder") ST.src=null; if(k==="cuvhold") ST.inHolder=null; if(k==="screen") stopSpec(); }
  if(k==="table"){ for(const q of OPT){ ST.x[q]=null; ST.on.delete(q); } ST.src=null; ST.inHolder=null; stopSpec(); }

  if(k==="con4"||k==="con2") ST.plug[k]=null;

cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(160,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&hand){ benchClick(mouse,true); drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand&&!hand.move&&!hand.fromHolder&&!hand.fromBench&&hand.item!=="cuv"){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); if(hand&&(hand.move||hand.fromHolder||hand.fromBench||hand.item==="cuv")) return; hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the chemistry ── */
const STOCK={water:()=>1,nacl:()=>0.30,gl:()=>0.50};
const cuvMax=4.5;
function emptyCuv(i){ const c=ST.cuv[i], lab=c.label; ST.cuv[i]=newCuv(i); ST.cuv[i].label=lab; ST.wasted++; say("emptied",i); }
function ensureTr(c){ const q=conc(c); if(!c.tr&&c.icV>0&&q.OH>1e-3&&q.Gl>1e-3) c.tr={n:1,i:0,f:0,O:1}; }
/* pour v ml of reagent s into cuvette c */
function addTo(c,s,v){ if(!(v>0)) return false; if(c.cap){ say("capFirst"); return false; }
  if(s==="water") c.V.w+=v; else if(s==="nacl") c.V.nacl+=v; else if(s==="gl") c.V.gl+=v;
  else if(s==="naoh"){ const cs=ST.naohSol.c; c.cNaOH=(c.cNaOH*c.V.naoh+cs*v)/(c.V.naoh+v); c.V.naoh+=v; }
  else if(s==="ic") c.icV+=v; else if(s==="ind"){ c.inV+=v; c.ph.h+=v/0.005; }
  const V=cuvVol(c); if(V>cuvMax){ const f=cuvMax/V; for(const q in c.V) c.V[q]*=f; c.icV*=f; c.inV*=f; c.ph.h*=f; c.ph.n*=f; c.ph.b*=f; say("full"); } else say("inj",c.i);
  c.mixed=false; c.unmix=U(0.35,1.9); ensureTr(c); return true; }
const selCuv=()=>has("cuvettes")?ST.cuv[ST.sel]:null;
function insDrop(toCuv){ const s=ST.ins[ST.insK]; if(!(s.V>0)){ say("insEmpty"); return; }
  const v=Math.min(s.V,TRUE.Vd[ST.insK]*1e6*(1+gauss(0,0.03))); s.V=Math.max(0,s.V-v); s.drop=0;
  if(toCuv){ const c=selCuv(); if(!c){ say("needFor",itemName("cuvettes")); s.V+=v; return; } if(!addTo(c,s.src,v)){ s.V+=v; return; } }
  say("drop"); }
function chem(cmd){ const [_,a,b]=cmd.split(":"), L=d().lab;
  if(a==="insk"){ ST.insK=+b; return; }
  if(a==="insfill"){ const s=ST.ins[ST.insK]; if(s.src&&s.src!==b&&s.V>0){ say("syrMix"); return; } s.src=b; s.V=0.5; say("insFill",ST.insK,L[b]); return; }
  if(a==="drop") return insDrop(true); if(a==="dropW") return insDrop(false);
  if(a==="push"){ const s=ST.ins[ST.insK], c=selCuv(); if(!c){ say("needFor",itemName("cuvettes")); return; } const v=Math.min(s.V,+b); if(!(v>0)){ say("insEmpty"); return; }
    if(addTo(c,s.src,v*(1+gauss(0,0.01)))) s.V=Math.max(0,s.V-v); return; }
  if(a==="insEmpty"){ ST.ins[ST.insK].V=0; return; }
  const s3=ST.syr3;
  if(a==="s3src"){ if(s3.V>0&&s3.src!==b){ say("syrMix"); return; } if(b==="naoh"&&!ST.gloves){ say("noGloves"); return; } s3.src=b; return; }
  if(a==="s3"){ const dv=+b; if(s3.src==="naoh"&&!ST.gloves){ say("noGloves"); return; }
    if(dv>0){ if(s3.V>=3-1e-9){ say("syrFull"); return; } let v=Math.min(3-s3.V,dv+gauss(0,0.006)); if(s3.src==="naoh"){ if(!ST.naohSol){ say("noStock"); return; } v=Math.min(v,ST.naohSol.V); ST.naohSol.V-=v; } s3.V+=v; say("drew",s3.V,L[s3.src]); }
    else { const v=Math.min(s3.V,-dv+gauss(0,0.006)); s3.V=Math.max(0,s3.V-v); if(s3.src==="naoh"&&ST.naohSol) ST.naohSol.V+=v; if(s3.V<0.003) s3.V=0; }
    return; }
  if(a==="s3inj"){ const c=selCuv(); if(!c){ say("needFor",itemName("cuvettes")); return; } if(s3.src==="naoh"&&!ST.gloves){ say("noGloves"); return; } if(addTo(c,s3.src,s3.V)) s3.V=0; return; }
  if(a==="s3waste"){ s3.V=0; return; }
  if(a==="st"){ ST.stockSet=Math.max(1,Math.min(100,Math.round((ST.stockSet+ +b)*10)/10)); return; }
  if(a==="dissolve"){ if(!has("naoh")){ say("needFor",itemName("naoh")); return; } if(!ST.gloves){ say("noGloves"); return; }
    const V=ST.stockSet*(1+gauss(0,0.004)); ST.naohSol={V:ST.stockSet,c:TRUE.mNaOH/MU.NaOH/(V*1e-3)}; say("stock",ST.stockSet,TRUE.mNaOH); return; }
  if(a==="gloves"){ ST.gloves=!ST.gloves; say(ST.gloves?"gloves":"glovesOff"); return; }
  if(a==="sel"){ ST.sel=+b; return; }
  const c=selCuv(); if(!c) return;
  if(a==="cap"){ c.cap=!c.cap; say(c.cap?"capped":"uncapped"); }
  else if(a==="shake"){ if(!c.cap){ say("needCap"); return; } c.mixed=true; c.bubbles=cuvVol(c)>0.1?U(0.5,1.3):0; if(c.tr) c.tr.O=1; say("shaken"); }
  else if(a==="tap"){ c.bubbles=0; say("tapped"); }
  else if(a==="rot"){ c.rot=!c.rot; say("rot"); }
  else if(a==="label"){ const s=$("cfg").value.trim()||String(ST.sel+1); c.label=s.slice(0,12); say("labeled",c.label); }
  else if(a==="emptyC") emptyCuv(ST.sel);
  else if(a==="holder"){ if(ST.inHolder===ST.sel){ ST.inHolder=null; say("cuvOut",ST.sel); } else { if(ST.inHolder!==null){ say("cuvBusy"); return; } if(hand&&hand.item==="cuv"&&hand.i===ST.sel) hand=null; ST.inHolder=ST.sel; say("cuvIn",ST.sel); } } }

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
const fname=def=>{ const s=$("cfg").value.trim(); return /\.csv$/i.test(s)?s.replace(/[\\/:*?"<>|]/g,"_"):def; };
function saveText(name,txt,mime){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:mime||"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); say("saved",name); }
const DTS=[0.5,1,2,5,10];
function progBtn(k){
  if(!has("sensor")){ say("sensorNo"); return; }
  if(k==="launch"){ SPEC.live=true; }
  else if(k==="pause"){ stopSpec(); }
  else if(k==="single"){ specFrame(); SPEC.hold=Float32Array.from(SPEC.frame); }
  else if(k==="saveS"){ const dt=SPEC.live?SPEC.frame:SPEC.hold; if(!dt){ say("noSingle"); return; } let s="N,I\n"; for(let n=0;n<NPIX;n++) s+=n+","+Math.round(dt[n])+"\n"; saveText(fname("spectrum.csv"),s); }
  else if(k==="ts"){ if(SPEC.ts){ SPEC.tsDone=SPEC.ts; SPEC.ts=null; return; } if(!SPEC.live){ say("noLaunch"); return; } SPEC.ts=[]; SPEC.t0=ST.t; SPEC.next=ST.t; }
  else if(k==="saveTS"){ const ts=SPEC.ts||SPEC.tsDone; if(!ts||!ts.length){ say("noTS"); return; } const rows=["t_s,"+Array.from({length:NPIX},(_,n)=>"N"+n).join(",")];
    for(const [t,f] of ts) rows.push(t.toFixed(2)+","+Array.prototype.join.call(f,",")); saveText(fname("time_series.csv"),rows.join("\n")+"\n"); }
  else if(k==="dm"||k==="dp"){ const i=DTS.indexOf(ST.tsDt); ST.tsDt=DTS[Math.max(0,Math.min(DTS.length-1,(i<0?2:i)+(k==="dp"?1:-1)))]; }
  else if(k==="sm") ST.sens=Math.max(1,ST.sens-1); else if(k==="sp") ST.sens=Math.min(8,ST.sens+1); }
closeCv.addEventListener("wheel",e=>{ if(tab!=="prog"||!PROG_AREA) return; e.preventDefault(); const p=clpos(e), [x0,,w]=PROG_AREA, f=(p[0]-x0)/w, c=PV.n0+f*(PV.n1-PV.n0), span=Math.max(20,Math.min(NPIX,(PV.n1-PV.n0)*(e.deltaY<0?1/1.25:1.25)));
  PV.n0=c-f*span; PV.n1=PV.n0+span; if(PV.n0<0){ PV.n1-=PV.n0; PV.n0=0; } if(PV.n1>NPIX){ PV.n0-=PV.n1-NPIX; PV.n1=NPIX; } PV.n0=Math.max(0,PV.n0); },{passive:false});
closeCv.addEventListener("dblclick",()=>{ if(tab==="prog"){ PV.n0=0; PV.n1=NPIX; } });
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return;
  if(cdrag.k==="opt"){ const {sc}=OXY(); const t=Math.max(1,Math.min(TBL_L-1,Math.round((cdrag.t0+(cmouse[0]-cdrag.x)/sc)*10)/10)); ST.x[cdrag.item]=t; cdrag.moved=true; }
  else if(cdrag.k==="pan"&&PROG_AREA){ const span=PV.n1-PV.n0, dn=-(cmouse[0]-cdrag.x)/PROG_AREA[2]*span; PV.n0=Math.max(0,Math.min(NPIX-span,cdrag.n0+dn)); PV.n1=PV.n0+span; } });
closeCv.addEventListener("pointerup",()=>{ if(cdrag&&cdrag.k==="opt"&&cdrag.moved&&(cdrag.item==="holder"||cdrag.item==="cuvhold")) nudge(0.5); cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e); closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="prog"){ if(h&&h.k.startsWith("p:")){ progBtn(h.k.slice(2)); return; } if(PROG_AREA) cdrag={k:"pan",x:p[0],n0:PV.n0}; return; }
  if(tab==="opt"){ if(h&&h.k.startsWith("o:")){ OSEL=h.k.slice(2); cdrag={k:"opt",item:OSEL,x:p[0],t0:ST.x[OSEL],moved:false}; } return; }
  if(tab==="chem"&&h&&h.k.startsWith("c:")) chem(h.k); });

/* ══════════════════════════════════════════════════════════════
   8.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
$("psuBtn").onclick=()=>{ if(!need("psu")) return; ST.psuOn=!ST.psuOn; };
$("adBtn").onclick=()=>{ if(!need("adapter")) return; ST.adSw=!ST.adSw; };
for(const [id,dv] of [["vm1",-1],["vm01",-0.1],["vp01",0.1],["vp1",1]]) $(id).onclick=()=>{ if(!need("psu")) return; ST.psuV=Math.max(0,Math.min(PSU_MAX,Math.round((ST.psuV+dv)*10)/10)); };
$("vzero").onclick=()=>{ if(!need("psu")) return; ST.psuV=0; };
for(const [id,s] of [["rgbR","R"],["rgbG","G"],["rgbB","B"]]) $(id).onclick=()=>{ if(!need("con4")) return; ST.pin=s; };
for(const [id,dv] of [["om1",-1],["om01",-0.1],["op01",0.1],["op1",1]]) $(id).onclick=()=>{ if(!OSEL||ST.x[OSEL]===null){ say("needFor",d().tabs.opt); return; } ST.x[OSEL]=Math.max(1,Math.min(TBL_L-1,Math.round((ST.x[OSEL]+dv)*10)/10)); if(OSEL==="holder"||OSEL==="cuvhold") nudge(0.3); };
for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20],["sp60",60]]) $(id).onclick=()=>{ ST.speed=s; };
$("swGo").onclick=()=>{ ST.sw.run=!ST.sw.run; }; $("swRst").onclick=()=>{ ST.sw.run=false; ST.sw.t=0; };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
$("noteSave").onclick=()=>{ saveText("ISPhO2024_E1_notebook.txt",$("note").value,"text/plain"); };
function renderPanel(){ const t=d();
  $("psuV").textContent=!has("psu")?"—":t.knob(ST.psuV,ST.psuOn);
  $("psuBtn").textContent=ST.psuOn?t.psuOn:t.psuOff; $("psuBtn").className=ST.psuOn?"on":"";
  $("adBtn").textContent=ST.adSw?t.adOn:t.adOff; $("adBtn").className=ST.adSw?"on":"";
  for(const [id,s] of [["rgbR","R"],["rgbG","G"],["rgbB","B"]]) $(id).className=ST.pin===s?"on":"";
  $("optSel").textContent=t.optSel(OSEL&&ST.x[OSEL]!==null?itemName(OSEL):null);
  for(const [id,s] of [["sp1",1],["sp5",5],["sp20",20],["sp60",60]]) $(id).className=ST.speed===s?"on":"";
  const st=ST.sw.t; $("swV").textContent=Math.floor(st/60)+":"+(st%60).toFixed(1).padStart(4,"0"); }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(handName()),false]);
  const f=progData(); if(f&&has("sensor")){ let o=false; for(let n=0;n<NPIX;n+=7) if(f[n]>=OVERFLOW){ o=true; break; } if(o) L.push([t.st.over,true]); }
  if(SPEC.live&&!has("sunshield")) L.push([t.st.room,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const g=t.m[msg.key]; if(g!==undefined) L.push(["• "+(typeof g==="function"?g(...msg.args):g),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-psu","hPsu"],["t-h-rgb","hRgb"],["t-h-opt","hOpt"],["t-h-sp","hSp"],["swGo","swGo"],["swRst","swRst"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"],["noteSave","noteSave"],["vzero","vzero"],["cfgHint","cfgHint"]]) $(id).textContent=t[k];
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let rem=dt*ST.speed; while(rem>1e-9){ const h=Math.min(0.25,rem); step(h); rem-=h; }
  for(const s of ST.ins) if(s.drop!==undefined) s.drop=Math.min(1,s.drop+dt*2);
  if(SPEC.live&&has("sensor")&&frameN%3===0) specFrame();
  if(frameN%4===0) drawLaptopScreen();
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
