<body>
<script>
/* NBPhO 2006 problem 4 "Electric experiment" on the 3-D bench.  As in the official solution: charge the capacitor
   from the battery, then discharge it through R (R1 = 1.5 kΩ or R2 = 6.2 kΩ) in series with the LED, which has
   the unknown resistor r across it.  The LED holds about Uc while it glows, so U − Uc decays with RC, and it
   goes dark when (U − Uc)/R falls to Uc/r; two runs give C = (τ2/R2 − τ1/R1)/ln(R1/R2).  The solution's
   times, τ1 ≈ 37 s and τ2 ≈ 32.4 s, give C ≈ 13.7 mF (its text prints "13 µF"); E ≈ 4.5 V, Uc ≈ 1.8 V and
   r ≈ 6 kΩ fit them.  The LED is given a sharp knee, as the sheet allows (an ideal diode); it dims only just before it goes out. */
var PROGRAM = {
  title: { ko: 'NBPhO 2006 실험 4 — 전기 실험', en: 'NBPhO 2006 Problem 4 — Electric experiment' },
  subtitle: { ko: '미지 축전기의 전기 용량을 구하고 실험 불확도를 어림하세요. 장비: 빨간 LED, 저항 셋(R₁ = 1.5 kΩ, R₂ = 6.2 kΩ, 미지 저항 하나), 기전력을 모르는 전지(내부 저항 500 Ω 미만), 도선, 타이머, 미지 축전기.',
              en: 'Find the capacitance of the unknown capacitor and estimate the experimental uncertainty. Equipment: a red LED, three resistors (R₁ = 1.5 kΩ, R₂ = 6.2 kΩ and an unknown one), a battery of unknown emf (internal resistance below 500 Ω), wires, a timer and the unknown capacitor.' },
  notes: { ko: [
    '문제지: LED 의 V–I 곡선은 열림 전압 Uc(모름)의 이상적 다이오드로 근사할 수 있고, 전류가 흐르면 빛납니다. 축전기와 저항 R 을 기전력에 이으면 U = E ± U₀e^(−t/RC).',
    '공식 해답: 축전기를 충분히 충전한 뒤 R 과 (LED ∥ 미지 저항 r) 를 거쳐 방전시킵니다. LED 가 꺼지는 때 r(E − Uc)e^(−τ/RC) = R·Uc; R₁, R₂ 두 번의 실험에서 C = (τ₂/R₂ − τ₁/R₁)/ln(R₁/R₂).',
    '해답의 측정 τ₁ ≈ 37 s, τ₂ ≈ 32.4 s 는 C ≈ 13.7 mF 를 줍니다(해답 본문의 "13 µF" 는 mF). 여기 LED 는 문제지 말대로 이상적 다이오드에 가까워 꺼지기 직전에만 잠깐 어두워집니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'The sheet: the LED\'s V–I curve can be taken as an ideal diode with an unknown opening voltage Uc; it glows while current flows. With a capacitor and a resistor R on an emf, U = E ± U₀e^(−t/RC).',
    'Official solution: charge the capacitor fully, then discharge it through R and (the LED ∥ the unknown r). The LED goes dark when r(E − Uc)e^(−τ/RC) = R·Uc; with R₁ and R₂, C = (τ₂/R₂ − τ₁/R₁)/ln(R₁/R₂).',
    'The solution\'s τ₁ ≈ 37 s and τ₂ ≈ 32.4 s give C ≈ 13.7 mF (its text prints "13 µF"). The LED here is close to the sheet\'s ideal diode and dims only just before it goes out. The values differ a little from visit to visit.'] }
};

var LAB = { leads: null, sw: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 빨간 LED, 저항 R₁ = 1.5 kΩ, R₂ = 6.2 kΩ, 미지 저항(?), 미지 축전기 — 각각 단자 둘의 받침에 — 전지 세 개짜리 전지함, 타이머, 도선.',
           en: 'On the desk: the red LED, R₁ = 1.5 kΩ, R₂ = 6.2 kΩ, the unknown resistor (?) and the unknown capacitor — each on a base with two terminals — a holder of three cells, a timer and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '축전기: 전지에 바로 이어 충전 → 전지를 떼고 R 과 (LED ∥ ?) 로 방전 · LED 는 클릭해서 가까이 보기',
                '타이머: <b>Space</b> = START/STOP'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Capacitor: charge it straight from the battery → take the battery off and discharge through R and (LED ∥ ?) · click the LED to look closer',
                'Timer: <b>Space</b> = START/STOP'] },
  notePlaceholder: { ko: '예) R₁: 꺼질 때까지 36.5, 37.8, 37.1 s; R₂: 32.0, 33.1 s', en: 'e.g. R₁: dark after 36.5, 37.8, 37.1 s; R₂: 32.0, 33.1 s' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var Cap = 13.7e-3 * (1 + S.sys('C', 0.08)), E = 1.5 * (1 + S.sys('E', 0.02)), rx = 6.0e3 * (1 + S.sys('r', 0.05)), R1 = 1500 * (1 + S.sys('R1', 0.01)), R2 = 6200 * (1 + S.sys('R2', 0.01));
    var nv = 0.4 * 0.02585, Vf = 1.80 * (1 + S.sys('Uc', 0.01)), led = { Is: 1e-3 / Math.exp(Vf / nv), n: 0.4, Gl: 1e-10, Rs: 5 };   /* a sharp knee: the sheet's ideal diode */
    var leads = LAB.leads = new B3.Leads({ max: 8 }), sw = LAB.sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '],
      home: { yaw: -0.25, pitch: 0.9, k: 13, tx: 2, ty: 0, tz: 3 },
      views: { led: { yaw: 0, pitch: 0.9, k: 60, tx: -24, ty: 1.5, tz: -8, title: { ko: 'LED', en: 'The LED' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 24, ty: 1.7, tz: 12, title: { ko: '타이머', en: 'Timer' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-36, 38, -20, 22);
        c.reset();
        var parts = [['led', 'LED', -24], ['r1', '1.5 kΩ', -12], ['r2', '6.2 kΩ', 0], ['rx', '?', 12], ['cap', '? F', 25]];
        parts.forEach(function (p) {
          var x = p[2], z = -8, id = p[0], w = id === 'cap' ? 6 : 4.5;
          B3.box3(x - w, x + w, 0, 0.6, z - 3.5, z + 3.5, '#1f5a3a', { id: id === 'led' ? 'm:led' : undefined, top: '#246b44' });
          B3.text3([x - w + 0.5, 0.62, z - 1.6], [1, 0, 0], [0, 0, -1], p[1], 1.0, '#f2f2f2', { weight: '800' });
          var pa = id === 'cap' ? '+' : id === 'led' ? '+' : '', pk = id === 'cap' ? '−' : id === 'led' ? '−' : '';
          leads.term(b, id + '.a', [x - w + 1.4, 0.6, z + 2.2], { col: '#c0392b', label: pa, lc: '#e8e8e8' });
          leads.term(b, id + '.b', [x + w - 1.4, 0.6, z + 2.2], { col: '#1b1b1b', label: pk, lc: '#e8e8e8' });
          if (id === 'r1' || id === 'r2' || id === 'rx') { B3.cyl3('x', x - 1.6, x + 1.6, 1.0, z, 0.4, '#c8a878', { seg: 12, cap: '#b89868' });
            [-0.8, -0.3, 0.2].forEach(function (o, k) { B3.cyl3('x', x + o, x + o + 0.18, 1.0, z, 0.42, ['#8a5a2a', '#c0392b', '#2b2b2b'][k], { seg: 12 }); }); }
        });
        B3.cyl3('y', 0.6, 6.0, 25, -8.5, 2.0, '#2a3f8a', { seg: 24, cap: '#c8ccd2' });             /* the electrolytic capacitor */
        B3.box3(25 + 1.62, 25 + 2.03, 0.7, 5.9, -8.5 - 0.7, -8.5 + 0.7, '#d8dbe0', { noObst: true });
        c.R('r1.a', 'r1.b', R1); c.R('r2.a', 'r2.b', R2); c.R('rx.a', 'rx.b', rx);
        var dled = c.D('led.a', 'led.b', led);
        c.C('cap.a', 'cap.b', Cap, 'cap'); c.R('cap.a', 'cap.b', 2e6);                             /* a little leakage */
        var cell = B3.cells(b, leads, 'bat', [-10, 13], { n: 3, e: E, r: 0.4 });
        B3.stopwatch(b, 'sw', [24, 12], sw);
        cell.stamp(c); leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.02)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-5);
        var I = c.cur(dled), on = I > 5e-6;
        B3.cyl3('y', 0.6, 1.6, -24, -8, 0.6, on ? '#ff2a1a' : 'rgba(225,200,200,.75)', { seg: 14, cap: on ? '#ffffff' : 'rgba(235,220,220,.8)', id: 'm:led' });
        B3.sphere3([-24, 1.6, -8], 0.6, on ? '#ff2a1a' : 'rgba(225,200,200,.75)', { id: 'm:led' });
        if (on) { var a = Math.min(0.55, Math.sqrt(I) * 9); B3.sphere3([-24, 1.8, -8], 1.0 + Math.sqrt(I) * 40, 'rgba(255,42,26,' + a.toFixed(2) + ')'); }
        leads.draw(b);
        LAB.state = { U: c.V_('cap.a') - c.V_('cap.b'), I: I, C: Cap, rx: rx, E: 3 * E };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
