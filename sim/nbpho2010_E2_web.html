<style>

     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}

#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}

    white-space:pre;flex:none}

     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}

<body>
<script>
/* NBPhO 2010 problem 11 "Black box" on the 3-D bench.  Two terminals; inside, three components: a
   capacitor C with a resistor R1 across it, in series with R2 (the official solution's scheme (a); it
   shows that scheme (b) gives the same measurements).  Values after the solution: E ≈ 3.2 V gives
   Ic0 ≈ 1.3 mA at first and Ic∞ ≈ 0.35 mA at the end; left alone the box's voltage starts at ≈ 2.35 V
   and halves in ≈ 25 s.  The capacitor leaks only through R1; the meter loads the box as a real one. */
var PROGRAM = {
  title: { ko: 'NBPhO 2010 실험 11 — 블랙박스', en: 'NBPhO 2010 Problem 11 — Black box' },
  subtitle: { ko: '블랙박스 속 전기 회로를 알아내고 모든 저항의 값을 구하세요. 다른 부품의 특성도 어림하세요. 도선 말고 부품은 모두 세 개입니다. 장비: 블랙박스, 멀티미터, 전지, 타이머.',
              en: 'Determine the electrical scheme inside the black box and the values of all the resistors; estimate the characteristics of the other components. Apart from the wires there are three components. Equipment: the black box, a multimeter, a battery and a timer.' },
  notes: { ko: [
    '공식 해답의 측정: 전지 E ≈ 3.2 V; 전지를 이으면 처음 전류 ≈ 1.3 mA, 약 12 초마다 반으로 줄어 ≈ 0.35 mA 로; 전지를 떼면 상자 전압 ≈ 2.35 V 가 약 25 초마다 반으로.',
    '상자 속은 축전기와 그에 나란한 R₁, 그리고 직렬의 R₂ 입니다(해답의 (a)). 해답은 (b) 연결도 같은 측정값을 준다는 것을 보입니다.',
    '멀티미터(전압계 10 MΩ, 전류계 분류 저항)도 회로와 함께 풉니다. 값은 방문할 때마다 조금씩 다릅니다.'], en: [
    'The official solution measured: battery E ≈ 3.2 V; connected, the current starts at ≈ 1.3 mA and halves about every 12 s down to ≈ 0.35 mA; disconnected, the box\'s voltage starts at ≈ 2.35 V and halves about every 25 s.',
    'Inside: a capacitor with R₁ across it, and R₂ in series (the solution\'s (a)); the solution shows that (b) gives the same measurements.',
    'The multimeter (10 MΩ voltmeter, shunted ammeter) is solved with the circuit. The values differ a little from visit to visit.'] }
};

var LAB = { dmm: {}, leads: null, sw: null, c: null };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 둘의 블랙박스, 전지 두 개짜리 전지함, 멀티미터, 타이머(스톱워치), 도선.',
           en: 'On the desk: the black box with two terminals, a holder of two cells, a multimeter, a timer (stopwatch) and wires.' },
  howto: { ko: ['도선: 단자를 클릭하면 도선이 들리고, 다른 단자를 클릭하면 이어집니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '멀티미터: 클릭해서 가까이 본 뒤 다이얼 (V⎓ · A⎓ · Ω). 전류는 mA 와 COM 잭',
                '타이머: <b>Space</b> = START/STOP'],
           en: ['Wires: click a terminal to take up a wire, click another to plug it in. Click a plugged end to pull it out; click the desk to put it down',
                'Multimeter: click it to look closer, then the dial (V⎓ · A⎓ · Ω). Current through the mA and COM jacks',
                'Timer: <b>Space</b> = START/STOP'] },
  notePlaceholder: { ko: '예) 전지+전류계: t = 0 s 1.31 mA, 5 s …, 오래 뒤 0.35 mA', en: 'e.g. battery + ammeter: t = 0 s 1.31 mA, 5 s …, long after 0.35 mA' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R1 = 6.7e3 * (1 + S.sys('R1', 0.05)), R2 = 2.45e3 * (1 + S.sys('R2', 0.05)), Cap = 5.4e-3 * (1 + S.sys('C', 0.1)), E = 1.6 * (1 + S.sys('E', 0.02));
    var dm = LAB.dmm; dm.err = { V: S.sys('mV', 0.003), A: S.sys('mA', 0.006), R: S.sys('mR', 0.005) };
    var leads = LAB.leads = new B3.Leads({ max: 6 }), sw = LAB.sw = new B3.Stopwatch(0.04), c = LAB.c = new B3.Circuit();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '], speeds: [1, 10],
      home: { yaw: -0.3, pitch: 0.85, k: 14, tx: 4, ty: 0, tz: 2 },
      views: {
        dmm: { yaw: 0, pitch: 1.35, k: 50, tx: 10, ty: 3.4, tz: 2, title: { ko: '멀티미터', en: 'Multimeter' } },
        sw: { yaw: 0, pitch: 1.25, k: 62, tx: 28, ty: 1.7, tz: 8, title: { ko: '타이머', en: 'Timer' } }
      },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        B3.desk(-32, 40, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [-16, 2], [{ name: 'X', col: '#c0392b', label: '' }, { name: 'Y', col: '#1b1b1b', label: '' }], { label: 'NBPhO 2010 · 11', w: 12, d: 9 });
        var cell = B3.cells(b, leads, 'bat', [-4, 13], { n: 2, e: E, r: 0.3 });
        var m = B3.dmm(b, 'dmm', [10, 2], dm, leads);
        B3.stopwatch(b, 'sw', [28, 8], sw);
        c.reset();
        c.R(T.X, 'box.m', R2); c.C('box.m', T.Y, Cap, 'cap'); c.R('box.m', T.Y, R1);
        cell.stamp(c); m.stamp(c); leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.05)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-5);
        m.read(c);
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
