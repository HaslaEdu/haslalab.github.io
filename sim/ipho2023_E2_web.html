function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);

/* ══════════════════════════════════════════════════════════════

const cv=$("cv"); let ctx=cv.getContext("2d"); let S=1;

  if(k==="cyl"){ if(!atPd){ say("noUse"); return; } ST.cyl=!ST.cyl; say("cyl",ST.cyl); return; }

  if(k==="black"){ if(!atLed){ say("noUse"); return; } ST.black=!ST.black; say("black",ST.black); return; }
  if(k==="sheet"){ const r=onRailBody(c); if(!r){ say("noUse"); return; } ST.sheet[r]=true; say("sheet"); return; }
}
function setRailFrom(r,c){ const o=SC(), dx=c[0]-o[0], dy=c[1]-o[1]; let a=Math.atan2(-dy,-dx)*180/Math.PI; a=((a%360)+360)%360;
  if(r==="srail"&&a>180) a-=360; a=Math.round(a*2)/2;
  if(r==="srail") ST.railAng.srail=Math.max(-25,Math.min(25,a)); else ST.railAng.lrail=Math.max(120,Math.min(240,a)); say("rot"); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); if(rot) setRailFrom(rot.r,cm(mouse)); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; benchClick(p,e.button===2); if(rot) cv.setPointerCapture(e.pointerId); drawTray(); });
cv.addEventListener("pointerup",()=>{ rot=null; });
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
cv.addEventListener("wheel",e=>{ const c=cm(lpos(e)), s=e.deltaY<0?1:-1, r=onRailBody(c);
  if(r){ e.preventDefault(); if(ST.sheet[r]){ say("fixedRail"); return; } const st=e.shiftKey?0.1:0.5;
    if(r==="srail") ST.railAng.srail=Math.max(-25,Math.min(25,Math.round((ST.railAng.srail+s*st)*10)/10)); else ST.railAng.lrail=Math.max(120,Math.min(240,Math.round((ST.railAng.lrail+s*st)*10)/10)); say("rot"); } },{passive:false});
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ returnHand(); drawTray(); } });
trayCv.addEventListener("mousedown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k&&!hand.move; if(hand) returnHand();
    if(!same&&trayAvail(k)){ hand={k}; say(TOOLS.includes(k)?"tool":"picked",itemName(k)); } drawTray(); return; } });
/* the close up */
let drag=null;
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const inP=(P,p)=>p[0]>=P.x&&p[0]<=P.x+P.w&&p[1]>=P.y&&p[1]<=P.y+P.h;
function sideItemAt(p){ if(!SVP.xs) return null; let best=null, bd=14; for(const k of RAILED){ if(!ST.rail[k]) continue; const dd=Math.abs(SVP.xs(X(k))-p[0]); if(dd<bd){ bd=dd; best=k; } } return best; }
const sRange=k=>ST.rail[k]==="s"?[SR0,SR1]:[LR0,LR1];
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
closeCv.addEventListener("pointerdown",e=>{ if(e.button!==0) return; const p=clpos(e);
  if(inP(P1,p)){ const k=sideItemAt(p); if(k){ drag={kind:"side",k,x0:p[0],y0:p[1],s0:X(k),h0:k==="led"?ST.slitOff:Hh(k),moved:false}; closeCv.setPointerCapture(e.pointerId); } return; }
  if(P2.R&&inP(P2,p)&&near(p,[P2.cx,P2.cy],P2.R)){ drag={kind:"stage",a0:Math.atan2(p[1]-P2.cy,p[0]-P2.cx),st0:ST.stageAng}; closeCv.setPointerCapture(e.pointerId); return; }
  if(inP(P3,p)&&ST.on.P2&&near(p,[P3.dcx,P3.dcy],P3.dr)){ drag={kind:"phi",a0:Math.atan2(p[1]-P3.dcy,p[0]-P3.dcx),p0:ST.phi}; closeCv.setPointerCapture(e.pointerId); return; }
  if(inP(P3,p)&&ST.on.dmm&&P3.ddr&&near(p,[P3.ddx,P3.ddy],P3.ddr*1.6)){ ST.dial=ST.dial==="DCV"?"OFF":"DCV"; say("dial",ST.dial); } });
closeCv.addEventListener("pointermove",e=>{ const p=clpos(e);
  if(!drag){ closeCv.style.cursor=(inP(P1,p)&&sideItemAt(p))||(P2.R&&near(p,[P2.cx,P2.cy],P2.R))||(ST.on.P2&&near(p,[P3.dcx,P3.dcy],P3.dr||0))?"grab":"default"; return; }
  if(drag.kind==="side"){ const k=drag.k, dx=p[0]-drag.x0, dy=p[1]-drag.y0; if(Math.hypot(dx,dy)>3) drag.moved=true;
    if(Math.abs(dx)>Math.abs(dy)){ const [a,b]=sRange(k), ns=Math.round(Math.max(a,Math.min(b,drag.s0+dx*840/(P1.w-24)))); if(!railBusy(ST.rail[k],ns,k)) ST.s[k]=ns; }
    else if(k==="L1"||k==="L2"){ ST.h[k]=Math.max(30,Math.min(95,Math.round((drag.h0-dy/SVP.kh)*2)/2)); say("height"); }
    else if(k==="led"){ ST.slitOff=Math.max(-10,Math.min(10,Math.round((drag.h0-dy/SVP.kh)*4)/4)); say("height"); } return; }
  if(drag.kind==="stage"){ const a=Math.atan2(p[1]-P2.cy,p[0]-P2.cx); ST.stageAng=Math.max(-40,Math.min(40,Math.round((drag.st0+(a-drag.a0)*180/Math.PI)*10)/10)); return; }
  if(drag.kind==="phi"){ const a=Math.atan2(p[1]-P3.dcy,p[0]-P3.dcx); ST.phi=((Math.round(drag.p0+(a-drag.a0)*180/Math.PI))%360+360)%360; return; } });
closeCv.addEventListener("pointerup",()=>{ if(drag&&drag.kind==="side"&&!drag.moved&&drag.k==="led"){ if(ST.batt<2) say("ledNeed"); else { ST.ledOn=!ST.ledOn; say("ledOn",ST.ledOn); } } drag=null; });
closeCv.addEventListener("wheel",e=>{ const p=clpos(e), s=e.deltaY<0?1:-1;
  if(inP(P1,p)){ const k=sideItemAt(p); if(k==="L1"||k==="L2"){ e.preventDefault(); ST.h[k]=Math.max(30,Math.min(95,Math.round((ST.h[k]+s*(e.shiftKey?0.1:0.5))*10)/10)); say("height"); }
    else if(k==="led"){ e.preventDefault(); ST.slitOff=Math.max(-10,Math.min(10,ST.slitOff+s*(e.shiftKey?0.05:0.25))); say("height"); } return; }
  if(P2.R&&inP(P2,p)){ e.preventDefault(); ST.stageAng=Math.max(-40,Math.min(40,Math.round((ST.stageAng+s*(e.shiftKey?0.1:0.5))*10)/10)); return; }
  if(inP(P3,p)&&ST.on.P2){ e.preventDefault(); ST.phi=((ST.phi+s)%360+360)%360; } },{passive:false});

function renderStatus(){
  const L=[], t=d();
  if(!PLACE.some(k=>ST.on[k])) L.push([t.st.none,false]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-setup").textContent=t.hSetup; $("t-setuphint").textContent=t.setupHint; $("t-h-meas").textContent=t.hMeas; $("t-meashint").textContent=t.measHint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2023 E2 — 복굴절로 재는 두께 · HaslaLab":"IPhO 2023 E2 — Birefringence · HaslaLab";
  layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0;
function tick(){
  ctx.clearRect(0,0,LW,LH); drawBench();
  if(++frameN%2===0) drawClose();
  if(frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
