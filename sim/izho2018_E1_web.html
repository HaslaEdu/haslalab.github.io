<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../favicon-light.svg"><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">

<title>IZhO 2018 실험 — 아르키메데스의 법칙 · The Law of Archimedes · HaslaLab</title>
<meta name="description" content="IZhO 2018 실험 문제를 브라우저에서 해 봅니다. 너트를 넣은 시험관이 물에 잠기는 깊이로 너트와 시험관의 질량을 구하고, 비커와 넓은 그릇에서 떠 있는 시험관의 상하 진동 주기를 T = 2π√(h₀/g) 와 견줍니다.">
<meta property="og:site_name" content="HaslaLab">
<meta property="og:type" content="article">
<meta property="og:title" content="IZhO 2018 실험 — 아르키메데스의 법칙 · The Law of Archimedes · HaslaLab">
<meta property="og:description" content="IZhO 2018 실험: 떠 있는 시험관의 잠김 깊이와 진동 주기.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* IZhO 2018 on the 3-D bench.  Official values: D = 20.4 mm, L = 175 mm, M = 26.7 g, a nut 4.58 g, so the
   immersion h = (M + n·m)/(ρS) = 81.8 + 14.1·n mm.  The tube bobs with T = κ·2π√(h/g): the official periods
   (tables 3) match the formula in the beaker (κ ≈ 1.00) and come out a little short in the wide vessel (κ ≈ 0.98 —
   the pressure under a moving tube is not hydrostatic).  With fewer than four nuts it will not bob straight. */
var PROGRAM = {
  title: { ko: 'IZhO 2018 실험 — 아르키메데스의 법칙', en: 'IZhO 2018 — The law of Archimedes' },
  subtitle: { ko: '이론 문제에서 얻은 물에 뜬 시험관의 상하 진동 주기 T = 2π√(h₀/g) (h₀ 는 평형에서 잠긴 깊이)를 실험으로 확인합니다. 장비: 스톱워치, 시험관, 비커, 넓은 그릇, 너트 6 개, 플라스틱 자, 모눈종이 띠, 솜, 필름 조각. g = 9.81 m/s², ρ = 1000 kg/m³. 너트는 시험관에 솜이 있을 때만 넣으세요.',
              en: 'Verify the period of vertical oscillations of a floating test-tube T = 2π√(h₀/g) (h₀ the depth of immersion at equilibrium) from the theoretical round. Equipment: a stopwatch, the test-tube, a beaker, a wide vessel, six nuts, a plastic ruler, a strip of millimetre paper, cotton wool and a piece of film. g = 9.81 m/s², ρ = 1000 kg/m³. Put nuts in only with the cotton wool inside.' },
  notes: { ko: [
    '과제: 1.1 모눈종이 띠로 바깥 지름과 오차. 1.2 길이. 1.3 너트 수에 따른 잠김 깊이 h(n), 직선의 매개변수, 너트 하나와 빈 시험관의 질량. 2.1 이론 T²(n) 직선. 2.2–2.3 너트 4, 5, 6 개에서 비커와 넓은 그릇의 주기(3–5 번 진동, 5–10 번 반복). 2.4 어긋남의 까닭(측정 오차, 감쇠, 끌려가는 물, 움직일 때 바닥 압력, 표면 장력).',
    '공식 해답: 띠 1–4 바퀴 63, 127, 191, 255 mm → D = 20.4 ± 0.1 mm; L = 175 ± 1 mm; h = 95, 110, 125, 138, 153, 165 mm (n = 1…6) → a = 14.1 mm, b = 81.8 mm, m = 4.58 ± 0.16 g, M = 26.7 ± 0.6 g. 측정 주기 (n = 4, 5, 6): 넓은 그릇 0.744, 0.770, 0.789 s, 비커 0.742, 0.789, 0.818 s. 까닭: 측정 오차와 바닥 압력의 변화 “예”, 나머지 “아니오”.',
    '자는 0 을 물 표면에 대고 시험관 옆에 세웁니다(물 위로 나온 길이 x 를 읽고 h = L − x). 너트 6 개일 때는 필름으로 막지 않으면 크게 흔들 때 물이 들어갑니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1.1 the outer diameter with the millimetre strip, and its error. 1.2 the length. 1.3 the immersion depth h(n) against the number of nuts, the line\'s parameters, the masses of a nut and of the empty tube. 2.1 the theoretical straight line T²(n). 2.2–2.3 periods with 4, 5, 6 nuts in the beaker and in the wide vessel (3–5 oscillations, 5–10 repeats). 2.4 the reasons for the deviation (errors, damping, entrained water, the pressure under a moving tube, surface tension).',
    'Official solution: strip 63, 127, 191, 255 mm for 1–4 turns → D = 20.4 ± 0.1 mm; L = 175 ± 1 mm; h = 95, 110, 125, 138, 153, 165 mm (n = 1…6) → a = 14.1 mm, b = 81.8 mm, m = 4.58 ± 0.16 g, M = 26.7 ± 0.6 g. Measured periods (n = 4, 5, 6): wide vessel 0.744, 0.770, 0.789 s, beaker 0.742, 0.789, 0.818 s. Reasons: errors and the pressure change "yes", the rest "no".',
    'The ruler stands beside the tube with its 0 on the water surface (read the length x above water, h = L − x). With six nuts, cover the tube with the film or water gets in at large swings. The values differ a little from visit to visit.'] }
};

var LAB = { n: 0, ves: 'wide', y: 0, v: 0, held: false, film: false, strip: false, wet: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 넓은 그릇과 비커(물), 솜이 든 시험관, 너트 6 개, 플라스틱 자, 모눈종이 띠, 필름 조각, 스톱워치.',
           en: 'On the desk: the wide vessel and the beaker (water), the test-tube with cotton wool, six nuts, the plastic ruler, the millimetre strip, a piece of film and a stopwatch.' },
  howto: { ko: ['너트 더미 클릭: 너트 하나 넣기 · 시험관 클릭: 너트 하나 꺼내기 · 다른 그릇 클릭: 시험관 옮기기 · 필름 클릭: 덮기/벗기기',
                '시험관을 위아래로 끌기: 눌렀다(들었다) 놓으면 진동 · 자 클릭: 가까이 보기',
                '모눈종이 띠 클릭: 시험관에 감았다 풀어 연필 자국 보기 · 스톱워치 <b>Space</b>'],
           en: ['Click the nut pile: one nut in · click the tube: one nut out · click the other vessel: move the tube there · click the film: cover/uncover',
                'Drag the tube up or down: press (lift) and let go to set it bobbing · click the ruler: close up',
                'Click the millimetre strip: wind it on the tube and unroll it to see the pencil marks · stopwatch <b>Space</b>'] },
  notePlaceholder: { ko: '예) x = 80 mm (n = 1) … / 넓은 그릇 n = 4: 5T = 3.74, 3.64 … s', en: 'e.g. x = 80 mm (n = 1) … / wide vessel n = 4: 5T = 3.74, 3.64 … s' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var D = 2.04 * (1 + S.sys('D', 0.005)), L = 17.5 * (1 + S.sys('L', 0.004)), M = 26.7 * (1 + S.sys('M', 0.02)), m = 4.58 * (1 + S.sys('m', 0.02));
    var Sa = Math.PI * D * D / 4, K = { wide: 0.98 * (1 + S.sys('kw', 0.01)), beaker: 1.0 * (1 + S.sys('kb', 0.01)) }, G = 981;
    var VES = { wide: { x: -10, r: 12, h: 22, w: 19 }, beaker: { x: 14, r: 4.5, h: 22, w: 19 } };
    var sw = new B3.Stopwatch(0.04), rul = B3.scaleTex(15, { width: 2.4, bg: 'rgba(235,245,250,0.92)' });
    var stripCv = document.createElement('canvas'); stripCv.width = 1200; stripCv.height = 80;
    (function () { var g = stripCv.getContext('2d'); g.fillStyle = '#f6f3e8'; g.fillRect(0, 0, 1200, 80); var k = 1200 / 300;
      for (var i = 0; i <= 300; i++) { g.strokeStyle = i % 10 === 0 ? '#c86a3a' : i % 5 === 0 ? '#e09a7a' : '#efc6b0'; g.lineWidth = i % 10 === 0 ? 1.6 : 0.8; g.beginPath(); g.moveTo(i * k, 0); g.lineTo(i * k, 80); g.stroke(); }
      for (var j = 0; j <= 8; j++) { g.strokeStyle = j % 5 === 0 ? '#c86a3a' : '#efc6b0'; g.beginPath(); g.moveTo(0, j * 10); g.lineTo(1200, j * 10); g.stroke(); }
      g.fillStyle = '#c86a3a'; g.font = '700 14px sans-serif'; for (i = 0; i <= 300; i += 50) g.fillText(String(i), i * k + 3, 76);
      g.strokeStyle = '#222'; g.lineWidth = 2.2; for (var t = 0; t <= 4; t++) { var x = (t * Math.PI * D * 10 + (t ? HL.gauss(0.4) : 0) + 5) * k; g.beginPath(); g.moveTo(x, 4); g.lineTo(x, 40); g.stroke(); } })();
    function h0() { return (M + m * LAB.n) / Sa; }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, keys: [' '],
      home: { yaw: -0.25, pitch: 0.55, k: 12, tx: 4, ty: 10, tz: 0 },
      views: { tube: { yaw: 0, pitch: 0.12, k: 40, tx: 0, ty: 19, tz: 0, title: { ko: '시험관 윗부분과 자', en: 'The tube\'s top and the ruler' } },
               strip: { yaw: 0, pitch: 1.5, k: 24, tx: 0, ty: 0.2, tz: 14, title: { ko: '풀어 놓은 모눈종이 띠', en: 'The unrolled millimetre strip' } },
               sw: { yaw: 0, pitch: 1.25, k: 62, tx: 32, ty: 1.7, tz: 10, title: { ko: '스톱워치', en: 'Stopwatch' } } },
      frame: function (b) {
        if (b.keys.indexOf(' ') >= 0) sw.startStop(b.t);
        var V = VES[LAB.ves], other = LAB.ves === 'wide' ? 'beaker' : 'wide';
        if (b.clicked('c:nuts')) { if (LAB.n >= 6) b.say('너트를 모두 넣었습니다', 'All nuts are in'); else { LAB.n++; LAB.y = 0; LAB.v = 0; } }
        if (b.clicked('m:tube') && !LAB.dragged) { if (LAB.n > 0) { LAB.n--; LAB.y = 0; LAB.v = 0; } }
        if (b.clicked('c:ves_' + other)) { LAB.ves = other; LAB.y = 0; LAB.v = 0; V = VES[LAB.ves]; }
        if (b.clicked('c:film')) LAB.film = !LAB.film;
        if (b.clicked('c:strip')) { LAB.strip = true; b.go('strip'); }
        if (b.clicked('c:rul')) b.go('tube');
        var dr = b.dragging('tube'); if (dr) { LAB.y = Math.max(-2, Math.min(2, LAB.y - b.screenMoved('tube')[1])); LAB.v = 0; LAB.dragged = true; }
        else if (LAB.dragged && !dr) { LAB.dragged = false; }
        var h = h0(), stable = LAB.n >= 4;
        if (!dr && b.dt > 0) { var w2 = G / (h * K[LAB.ves] * K[LAB.ves]), n = Math.ceil(b.dt / 0.002), hh = b.dt / n;
          for (var i = 0; i < n; i++) { LAB.v += (-w2 * LAB.y - 0.12 * LAB.v) * hh; LAB.y += LAB.v * hh; } }
        if (LAB.n === 6 && !LAB.film && LAB.y > L - h - 0.2) { LAB.n = 6; LAB.y = 0; LAB.v = 0; b.say('물이 시험관에 들어갔습니다 — 솜을 갈아야 합니다', 'Water got into the tube — the cotton wool must be replaced'); LAB.n = 0; }
        B3.desk(-36, 40, -18, 20);
        /* vessels with water */
        ['wide', 'beaker'].forEach(function (k) { var v = VES[k];
          B3.cyl3('y', 0, 0.5, v.x, 0, v.r, 'rgba(200,225,235,.5)', { seg: 36, cap: 'rgba(210,235,245,.35)', id: 'c:ves_' + k });
          B3.cyl3('y', 0.5, v.w, v.x, 0, v.r - 0.25, 'rgba(110,170,220,.35)', { seg: 36, cap: 'rgba(140,195,235,.42)', noObst: true, id: 'c:ves_' + k });
          B3.cyl3('y', 0.5, v.h, v.x, 0, v.r, 'rgba(205,228,238,.16)', { seg: 36, caps: false, noObst: true, id: 'c:ves_' + k }); });
        /* the floating tube: the waterline at h from its bottom; tilted if it cannot float upright */
        var yb = V.w - h + LAB.y, tilt = stable ? 0 : 0.35, tx = V.x, r = D / 2;
        var top = [tx + Math.sin(tilt) * L, yb + Math.cos(tilt) * L, 0];
        B3.cylAB([tx, yb, 0], top, r, 'rgba(225,240,248,.45)', { seg: 18, id: 'm:tube', cap: 'rgba(230,240,248,.4)' });
        B3.cylAB([tx, yb + 0.1, 0], [tx + Math.sin(tilt) * 1.5 * LAB.n, yb + 0.1 + Math.cos(tilt) * 1.5 * Math.max(1, LAB.n), 0], r * 0.8, '#9aa0a6', { seg: 10, id: 'm:tube' });
        B3.cylAB([tx + Math.sin(tilt) * (1.5 * LAB.n + 0.2), yb + Math.cos(tilt) * (1.5 * LAB.n + 0.2), 0], [tx + Math.sin(tilt) * (1.5 * LAB.n + 2.2), yb + Math.cos(tilt) * (1.5 * LAB.n + 2.2), 0], r * 0.85, '#f4f4f4', { seg: 10 });
        if (LAB.film) B3.cyl3('y', top[1], top[1] + 0.15, top[0], 0, r + 0.15, 'rgba(240,240,255,.7)', { seg: 18 });
        /* the ruler beside the tube, 0 on the water */
        B3.box3(V.x + r + 0.3, V.x + r + 2.7, V.w, V.w + 15, -0.15, 0.15, 'rgba(235,245,250,.75)', { id: 'c:rul' });
        B3.tex3(rul, 0, 0, rul.width, rul.height, [V.x + r + 0.3, V.w + 16, 0.16], [2.4, 0, 0], [0, -17, 0], { id: 'c:rul' });
        /* nuts, film, strip */
        for (var k2 = 0; k2 < 6 - LAB.n; k2++) B3.cyl3('y', 0, 0.6, 26 + (k2 % 3) * 1.8, -8 + Math.floor(k2 / 3) * 1.8, 0.7, '#8d9399', { seg: 6, cap: '#a2a8ae', id: 'c:nuts' });
        if (!LAB.film) B3.box3(24, 28, 0, 0.05, -2, 1, 'rgba(240,240,255,.7)', { id: 'c:film' }); else B3.box3(24, 28, 0, 0.02, -2, 1, 'rgba(0,0,0,0)', { id: 'c:film' });
        B3.tex3(stripCv, 0, 0, 1200, 80, [-15, 0.03, 13], [30, 0, 0], [0, 0, 2], { id: 'c:strip' });
        B3.stopwatch(b, 'sw', [32, 10], sw);
        LAB.state = { n: LAB.n, h: h, x: L - h, T: K[LAB.ves] * 2 * Math.PI * Math.sqrt(h / G), ves: LAB.ves, y: LAB.y };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
  <script src="adfit.js"></script>
  <script src="simfull.js"></script>
</body>
