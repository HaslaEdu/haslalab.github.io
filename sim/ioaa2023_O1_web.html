"use strict";
/* IOAA 2023, Chorzów, observation round, questions 1–4.  Inside a crashed flying saucer five screens high up in the hold
   show simulated targets, and the students watch them through telescopes on the deck: the centre screen plays one video,
   once (the clock for the first three minutes, the occultation of HD 163390, a train of Starlink satellites), the two
   screens either side of it the same still of Saturn and its moons, the two outer ones the same still of M81 with a
   supernova.  The video is not published; HaslaLab rebuilt it so that a careful observer gets the official answers:
   the star field is Map 1 itself (every star of the sheet's chart, put back on the sky by the chart's own gnomonic
   projection), the star vanishes from 23:03:31 to 23:03:48 UT, and the satellites cross the meridian 17h59m going
   north at 8.5′/s, 2 s apart.  Saturn's still is laid out from the official solution, the M81 still is the
   official image. */
