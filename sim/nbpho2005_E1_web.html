<meta property="og:description" content="NBPhO 2005 실험: 저울·밧줄·용수철저울로 뜨는 풍선의 질량 재기.">
<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>

<body>
<script>
/* NBPhO 2005 problem 8 "Balloon" on the 3-D bench.  As in the official solution: with the 100 g weight tied on,
   the scales read m + M − ρV.  A rope tightened round the waist with tension T makes the overpressure
   Δp = T tan α / R² (the sheet's formula: R the loop's radius, 2α the angle between the envelope's tangents
   at the rope), the volume drops by ΔV = VΔp/p0 and the reading rises by ρΔV (plus the rope's own mass).
   So V = p0ΔV/Δp and m = ρV − (M − reading).  The loop's radius and the angle follow T smoothly; the
   fasteners hold at most about 30 N.  Official: V ≈ 33 l, m ≈ 12 g. */
var PROGRAM = {
  title: { ko: 'NBPhO 2005 실험 8 — 풍선', en: 'NBPhO 2005 Problem 8 — Balloon' },
  subtitle: { ko: '풍선(속의 기체 포함)의 질량을 구하세요. 장비: 공기 중에 뜨는 풍선, 디지털 저울, 밧줄, 줄자, 밧줄 고정 장치, 용수철저울, 각도를 대충 재기 위해 접을 종이, 100 g 추, 실.',
              en: 'Find the mass of the balloon (including the gas inside it). Equipment: a balloon (floats in air), digital scales, a rope, a measuring tape, rope fasteners, a dynamometer, paper sheets for folding and rough angle measurements, a 100 g weight and thread.' },
  notes: { ko: [
    '문제지: 장력 T 의 밧줄을 풍선에 두르면 풍선 속 초과 압력은 Δp = T tan α / R² (R 은 밧줄 고리의 반지름, 2α 는 밧줄 근처 풍선 껍질의 두 접선 사이 각). 기체 상수 8.31 J/(K·mol), 공기의 몰질량 29 g/mol. 여기서는 p₀ = 1013 hPa, 20 °C.',
    '공식 해답: 추를 단 채 저울에 올려 m + M − ρV 를 읽고, 밧줄을 고정 장치가 버티는 만큼 세게 조여 다시 잽니다(밧줄 무게는 따로). 부피 감소 ΔV 와 Δp/p₀ = ΔV/V 로 V ≈ 33 l, m ≈ 12 g.',
    '고정 장치가 버티는 최대 장력(≈ 30 N)은 용수철저울로 당겨 봐서 알 수 있습니다. 고리의 둘레는 줄자로, 각 2α 는 접은 종이로 대충 잽니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'The sheet: with a rope of tension T round the balloon, the overpressure is Δp = T tan α / R² (R the loop\'s radius, 2α the angle between the envelope\'s tangents near the rope). R = 8.31 J/(K·mol), air 29 g/mol. Here p₀ = 1013 hPa and 20 °C.',
    'Official solution: with the weight tied on, the scales read m + M − ρV; tighten the rope as hard as the fasteners hold and weigh again (the rope separately). From ΔV and Δp/p₀ = ΔV/V, V ≈ 33 l and m ≈ 12 g.',
    'The largest tension the fasteners hold (≈ 30 N) is found by pulling with the dynamometer. Measure the loop\'s perimeter with the tape and the angle 2α roughly with folded paper. The values differ a little from visit to visit.'] }
};

var LAB = { wOn: false, rope: 'desk', T: 0, Tpull: 0, phi: 50 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 디지털 저울, 실로 풍선을 매단 100 g 추, 감아 둔 밧줄(고정 장치 달림), 용수철저울(0–50 N), 줄자, 접은 종이.',
           en: 'On the desk: digital scales, the 100 g weight with the balloon tied to it by a thread, the coiled rope (with fasteners), a dynamometer (0–50 N), a tape and a folded paper.' },
  howto: { ko: ['추 클릭: 저울에 올리기 / 내리기 (풍선이 함께) · 저울 클릭: 눈금 가까이',
                '밧줄 클릭: 책상 → 저울 위 → 풍선 허리에 두르기 → 책상',
                '밧줄을 두른 뒤 용수철저울 오른쪽으로 끌기: 조이기 (고정 장치가 버티는 데까지) · 왼쪽: 풀기 · 클릭: 눈금 가까이',
                '풍선 클릭: 옆에서 허리 보기 — 접은 종이 위에서 휠: 종이 각 맞추기 · 줄자 클릭: 고리 둘레 재기'],
           en: ['Click the weight: onto the scales / off (the balloon comes along) · click the scales: read closely',
                'Click the rope: desk → on the scales → round the balloon\'s waist → desk',
                'With the rope on, drag the dynamometer right: tighten (as far as the fasteners hold) · left: loosen · click: read closely',
                'Click the balloon: look at the waist from the side — wheel over the folded paper: match its angle · click the tape: measure the loop\'s perimeter'] },
  notePlaceholder: { ko: '예) 추+풍선 72.4 g; 밧줄 19.1 g; 조인 뒤 92.2 g; T = 30 N; 둘레 94.6 cm; 2α ≈ 110°', en: 'e.g. weight+balloon 72.4 g; rope 19.1 g; tightened 92.2 g; T = 30 N; perimeter 94.6 cm; 2α ≈ 110°' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var V = 33 * (1 + S.sys('V', 0.08)), mb = 12 * (1 + S.sys('mb', 0.1)), mr = 19.1 * (1 + S.sys('mr', 0.03)), Mw = 100 * (1 + S.sys('Mw', 0.002)), Tmax = 30 * (1 + S.sys('Tmax', 0.06));
    var rho = 1.204, p0 = 101300, Rb = Math.cbrt(3 * V * 1000 / (4 * Math.PI)), R30 = Rb * 0.76;
    function loop(T) { var q = Math.min(1, T / 30); return { R: Rb - (Rb - R30) * Math.sqrt(q), ta: 1.4 * (1 + 0.12 * (1 - q)) * (1 + S.sys('ta', 0.05)) }; }
    function dV(T) { if (T <= 0.05) return 0; var L = loop(T), dp = T * L.ta / Math.pow(L.R / 100, 2); return V * dp / p0; }
    var lcd = document.createElement('canvas'); lcd.width = 200; lcd.height = 60; var lg = lcd.getContext('2d');
    var dynTex = B3.scaleTex(50, { horiz: true, width: 1.6, bg: '#f4f1e6', label: 'N', step: 0.5 }), tapeTex = B3.scaleTex(150, { horiz: true, width: 2.6, bg: '#f2d33c', label: 'cm', step: 0.1 });
    var reading = 0, rdT = 0;
    function lathe(cx, cy, cz, prof, col, id) {
      var N = 28;
      for (var k = 0; k < prof.length - 1; k++) for (var j = 0; j < N; j++) {
        var t0 = j / N * 2 * Math.PI, t1 = (j + 1) / N * 2 * Math.PI, a = prof[k], c = prof[k + 1];
        var P = function (p, t) { return [cx + p[0] * Math.cos(t), cy + p[1], cz + p[0] * Math.sin(t)]; };
        B3.face([P(a, t0), P(a, t1), P(c, t1), P(c, t0)], { fill: col, cull: true, id: id });
      }
    }
    var bench = B3.bench(host, {
      aspect: 0.62, lang: ctx.lang, wheelIds: ['paper'],
      home: { yaw: -0.3, pitch: 0.3, k: 5.2, tx: 0, ty: 38, tz: 0 },
      views: {
        balloon: { yaw: 0, pitch: 0.02, k: 14, tx: -14, ty: 62, tz: 0, title: { ko: '풍선의 허리 (옆에서)', en: 'The balloon\'s waist (from the side)' },
                   hint: { ko: '종이 위에서 휠: 종이 각 · Esc: 돌아가기', en: 'Wheel over the paper: its angle · Esc: back' } },
        scales: { yaw: 0, pitch: 0.9, k: 40, tx: -10, ty: 2, tz: 6, title: { ko: '저울', en: 'The scales' } },
        dyn: { yaw: 0, pitch: 1.2, k: 30, tx: 24, ty: 1, tz: 10, title: { ko: '용수철저울', en: 'The dynamometer' } },
        tape: { yaw: 0, pitch: 0.02, k: 40, tx: 80, ty: 62, tz: 0, title: { ko: '고리에 두른 줄자', en: 'The tape round the loop' } }
      },
      frame: function (b) {
        if (b.clicked('m:weight')) LAB.wOn = !LAB.wOn;
        if (b.clicked('c:scales')) b.go('scales');
        if (b.clicked('m:rope')) { LAB.rope = LAB.rope === 'desk' ? 'scale' : LAB.rope === 'scale' ? 'balloon' : 'desk'; LAB.T = 0; LAB.Tpull = 0;
          b.say(LAB.rope === 'scale' ? '밧줄을 저울에 올렸습니다.' : LAB.rope === 'balloon' ? '밧줄을 풍선 허리에 둘렀습니다 (느슨함).' : '밧줄을 책상에 내려놓았습니다.',
                LAB.rope === 'scale' ? 'The rope is on the scales.' : LAB.rope === 'balloon' ? 'The rope is round the waist (loose).' : 'The rope is back on the desk.'); }
        var md = b.screenMoved('dyn');
        if (md[0] && LAB.rope === 'balloon') { LAB.Tpull = Math.max(0, Math.min(50, LAB.Tpull + md[0] * 1.2));
          if (LAB.Tpull > Tmax) { if (LAB.T < Tmax - 0.01) b.say('고정 장치가 미끄러집니다.', 'The fasteners slip.'); LAB.Tpull = Tmax; }
          LAB.T = LAB.Tpull; }
        if (md[0] && LAB.rope !== 'balloon') b.say('먼저 밧줄을 풍선에 두르세요.', 'Put the rope round the balloon first.');
        var wp = b.wheel('paper'); if (wp) LAB.phi = Math.max(20, Math.min(89, LAB.phi + wp));
        if (b.clicked('m:tape')) { if (LAB.rope === 'balloon') b.go('tape'); else b.say('밧줄이 풍선에 둘러 있지 않습니다.', 'The rope is not round the balloon.'); }
        var T = LAB.rope === 'balloon' ? LAB.T : 0, L = loop(T), ropeOn = LAB.rope === 'balloon' && T > 0.3;
        /* the scales' reading, settling with a little noise */
        var tgt = (LAB.wOn ? Mw + mb - rho * (V - dV(T)) + (LAB.rope === 'balloon' ? mr : 0) : 0) + (LAB.rope === 'scale' ? mr : 0);
        reading += (tgt - reading) * Math.min(1, b.dt * 3); rdT -= b.dt;
        if (rdT <= 0) { rdT = 0.4; lg.fillStyle = '#9fb59a'; lg.fillRect(0, 0, 200, 60); lg.fillStyle = '#18200f'; lg.font = '700 40px monospace'; lg.textAlign = 'right'; lg.fillText((reading + HL.gauss(0.04)).toFixed(1) + ' g', 190, 46); }
        B3.desk(-40, 45, -20, 20);
        /* the scales */
        B3.box3(-16, -4, 0, 1.6, -4, 8, '#2b2f35', { id: 'c:scales', top: '#33373e' }); B3.cyl3('y', 1.6, 1.9, -10, 1, 3.6, '#c3c8cd', { seg: 28, cap: '#d6dade', id: 'c:scales' });
        B3.tex3(lcd, 0, 0, 200, 60, [-14, 1.61, 5.2], [8, 0, 0], [0, 0, 2.2], { id: 'c:scales' });
        /* the weight and the balloon tied to it */
        var wx = LAB.wOn ? -10 : -24, wy = LAB.wOn ? 1.9 : 0, wz = LAB.wOn ? 1 : 4;
        B3.cyl3('y', wy, wy + 3.6, wx, wz, 1.6, '#8e9196', { seg: 18, cap: '#a3a6ab', id: 'm:weight' });
        B3.text3([wx - 1.1, wy + 2.4, wz + 1.62], [1, 0, 0], [0, -1, 0], '100 g', 0.55, '#f2f2f2', { weight: '700' });
        var bx = -14, by = 62;
        B3.line3([wx, wy + 3.6, wz], [bx, by - Rb - 2, 0], '#e8e8e8', 1);
        B3.cyl3('y', by - Rb - 2, by - Rb + 0.5, bx, 0, 0.6, '#c0392b', { seg: 10 });
        var prof = [], i;
        if (!ropeOn) { for (i = 0; i <= 16; i++) { var th = i / 16 * Math.PI; prof.push([Rb * Math.sin(th) + 1e-3, Rb * Math.cos(th)]); } }
        else { var al = Math.atan(L.ta), rho2 = L.R / Math.sin(al), c = L.R / Math.tan(al), top = c + rho2, ang0 = Math.PI - al;
          for (i = 0; i <= 10; i++) { var t = i / 10 * ang0; prof.push([rho2 * Math.sin(t) + 1e-3, c + rho2 * Math.cos(t) - c * 0]); }
          for (i = 10; i >= 0; i--) { t = i / 10 * ang0; prof.push([rho2 * Math.sin(t) + 1e-3, -(c + rho2 * Math.cos(t))]); }
          prof = prof.map(function (p) { return [p[0], p[1] - 0]; }); }
        lathe(bx, by, 0, prof, '#d9473a', 'm:balloon');
        /* the rope: round the waist with a tail down to the dynamometer, or coiled */
        var dx = 24, dz = 10;
        if (LAB.rope === 'balloon') { var Rr = ropeOn ? L.R : Rb, pts = []; for (i = 0; i <= 36; i++) { var q2 = i / 36 * 2 * Math.PI; pts.push([bx + Math.cos(q2) * (Rr + 0.3), by, Math.sin(q2) * (Rr + 0.3)]); }
          B3.poly3(pts, '#e0c070', 2.5, { id: 'm:rope' }); B3.box3(bx + Rr - 0.3, bx + Rr + 1.5, by - 0.8, by + 0.8, -0.8, 0.8, '#555b63', { id: 'm:rope' });
          B3.line3([bx + Rr + 1.5, by, 0], [dx - 6.5, 1.2, dz], '#e0c070', 2); }
        else { var rx = LAB.rope === 'scale' ? -10 : 8, ry = LAB.rope === 'scale' ? 1.9 : 0, rz = LAB.rope === 'scale' ? 1 : 12;
          for (i = 0; i < 4; i++) B3.cyl3('y', ry + i * 0.5, ry + i * 0.5 + 0.45, rx, rz, 2.6 - i * 0.15, '#e0c070', { seg: 18, cap: '#c9ab5c', id: 'm:rope' }); }
        /* the dynamometer, lying on the desk, hook to the left */
        B3.cylAB([dx - 6, 1.0, dz], [dx + 6, 1.0, dz], 1.0, '#c9ccd0', { seg: 16, id: 'm:dyn' });
        var ext = 11 * (1 + (LAB.rope === 'balloon' ? LAB.T : 0)) / 52;
        B3.tex3(dynTex, 0, 0, dynTex.width, dynTex.height, [dx - 5.5, 2.01, dz - 0.8], [11, 0, 0], [0, 0, 1.6], { id: 'm:dyn' });
        B3.box3(dx - 5.5 + ext - 0.06, dx - 5.5 + ext + 0.06, 2.0, 2.3, dz - 0.9, dz + 0.9, '#c0392b', { id: 'm:dyn' });
        /* the tape and the folded paper */
        B3.cyl3('y', 0, 1.6, -30, -10, 3.2, '#f2d33c', { seg: 22, cap: '#e4c42c', id: 'm:tape' });
        var pc = [bx - (ropeOn ? L.R : Rb) - 0.4, by, 0], ph = LAB.phi * Math.PI / 180;
        B3.face([pc, [pc[0] - 9 * Math.cos(ph), by + 9 * Math.sin(ph), 0.2], [pc[0] - 9 * Math.cos(ph), by - 9 * Math.sin(ph), 0.2]], { fill: 'rgba(250,250,240,.9)', id: 'm:paper', flat: true });
        B3.text3([pc[0] - 8, by - 0.5, 0.3], [1, 0, 0], [0, -1, 0], '≈' + (Math.round(2 * LAB.phi / 5) * 5) + '°', 0.9, '#333', { weight: '700' });
        /* the tape view: a tape wrapped round the loop, its zero end over the reading */
        if (b.view === 'tape' && ropeOn) { var C = 2 * Math.PI * L.R, TX = 80;
          B3.tex3(tapeTex, 40 + 40 * (C - 6), 0, 480, tapeTex.height, [TX - 6, 62 + 1.3, 1], [12, 0, 0], [0, -2.6, 0]);
          B3.box3(TX - 0.06, TX + 6, 62 - 1.6, 62 + 1.6, 1.05, 1.1, '#f2d33c', { noObst: true }); B3.line3([TX, 62 - 1.6, 1.12], [TX, 62 + 1.6, 1.12], '#111', 2);
          B3.text3([TX + 0.6, 62 + 0.4, 1.13], [1, 0, 0], [0, -1, 0], '0 ▸', 0.8, '#111', { weight: '800' }); }
        LAB.state = { T: T, R: L.R, ta: L.ta, dV: dV(T), reading: reading, V: V, mb: mb };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>

<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
<script src="consolesim.js"></script>
