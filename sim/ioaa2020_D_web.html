"use strict";
/* IOAA 2020, held online by Estonia as the Global e-Competition on Astronomy and Astrophysics (GeCAA), data analysis:
   D1 reverberation mapping of an AGN (continuum and Hβ light curves, the broad Hβ profile), D2 the heliocentric orbit
   of a minor planet from geocentric longitudes and parallaxes, D3 the hypervelocity star HVS1 (spectral type, distance,
   space velocity, escape speed).  The sheet's own figures are the BLR sketch, the two light curves, the Hβ profile
   and the HVS1 spectrum; polar paper and graph paper for the orbit.  The printed figures carry a ruler readout. */
const ruler = (k, H, wcm, hcm) => (x, y, L) => { const X = x / k, Y = (H - y) / k; return X < -0.2 || Y < -0.2 || X > wcm + 0.2 || Y > hcm + 0.2 ? "" : (L === "ko" ? "자: 그림 왼쪽 아래 모서리에서 " : "Ruler, from the figure's bottom-left corner: ") + "x = " + X.toFixed(2) + " cm, y = " + Y.toFixed(2) + " cm"; };
const polarRead = (x, y, L) => { const u = (x - 340) / 58, v = (340 - y) / 58, r = Math.hypot(u, v); if (r > 5.3) return ""; const a = (Math.atan2(v, u) * 180 / Math.PI + 360) % 360;
  return (L === "ko" ? "자와 각도기: " : "Ruler and protractor: ") + "r = " + r.toFixed(2) + " au, ψ = " + a.toFixed(1) + "°  (x = " + u.toFixed(2) + ", y = " + v.toFixed(2) + " au)"; };
const MP = [[2012.3, 336.73, 40.95, 3.82], [2012.6, 3.44, 134.83, 7.24], [2012.9, 50.71, 242.08, 7.09], [2013.4, 94.52, 64.84, 2.40], [2013.6, 121.40, 134.59, 2.16], [2013.9, 154.31, 241.82, 2.75],

    solNote: {ko: "공식 해답과 채점 기준입니다. HaslaLab이 다시 계산해 보니 두 군데가 다릅니다. ① 공식 해답은 r = R⊕/p(지구 반지름을 기선으로 하는 지평 시차)를 씁니다. 문제의 ‘기선은 지름’을 따르면 거리가 모두 두 배가 되어 궤도가 맞지 않으므로 공식 해답의 약속을 따릅니다. ② 2015.0 줄에서 공식 해답은 sin θ_h = −0.9738의 잘못된 가지를 골랐습니다. 태양에서의 각은 코사인 법칙 cos θ = (1 + r_h² − r²)/(2r_h) = −0.226으로 둔각(103°)이어서 ψ_P = 252.4°, (x, y) = (−1.21, −3.80) au입니다. 그러면 2015.0의 소행성은 2015.3보다 앞서 있어 거꾸로 움직인 셈이 되므로, 2014.2와 함께 2015.0도 잘못된 관측으로 버리는 것이 옳습니다. 남은 아홉 점에 태양을 초점으로 하는 원뿔 곡선 1/r = A + B cos ψ + C sin ψ를 최소제곱으로 맞추면 a = 2.94 ± 0.06 au, e = 0.334 ± 0.015, P = 5.03 ± 0.15년(잭나이프 오차)이며, 공식 해답의 방법(가장 가깝고 먼 점 2012.6, 2015.3 사이의 현)으로는 a = 2.90 au, e = 0.33입니다. 공식 값 2.98 au, 0.33, 5.15년과 1.5% 안에서 맞으므로 ✓ 범위는 두 풀이를 모두 담습니다. 잘못된 관측은 2014.2를 고르면 ✓이고 2015.0을 더해도 ✓입니다.",
              en: "From the official solution and marking scheme. HaslaLab recomputed it and two things differ. (1) The official solution uses r = R⊕/p (the horizontal parallax, with the Earth's radius as the baseline). Taken literally, ‘the baseline is the diameter’ doubles every distance and no orbit fits, so the official convention is kept. (2) In the 2015.0 row the official solution takes the wrong branch of sin θ_h = −0.9738: the angle at the Sun from the cosine rule, cos θ = (1 + r_h² − r²)/(2r_h) = −0.226, is obtuse (103°), so ψ_P = 252.4° and (x, y) = (−1.21, −3.80) au. The planet would then be ahead of its 2015.3 position and moving backwards, so 2015.0 is an erroneous observation as well as 2014.2. A least-squares conic with the Sun at a focus, 1/r = A + B cos ψ + C sin ψ, through the nine remaining points gives a = 2.94 ± 0.06 au, e = 0.334 ± 0.015, P = 5.03 ± 0.15 yr (jackknife errors); the official chord between the nearest and farthest points (now 2012.6 and 2015.3) gives a = 2.90 au, e = 0.33. Both agree with the official 2.98 au, 0.33 and 5.15 yr within 1.5%, and the ✓ ranges cover both. For the erroneous observations, 2014.2 is ✓ with or without 2015.0."},
    key: [["a", (L, A) => (L === "ko" ? "삼각형 지구–태양–소행성: Δλ = |λ − λ⊙|, r(au) = 206 265 R⊕/(p a⊕); r_h² = a⊕² + r² − 2a⊕r cos Δλ; sin θ_h = r sin Δλ/r_h; ψ_P = ψ_E − θ_h, 이웃한 두 관측 사이 Δψ_E = Δλ⊙ (시간보다 정확). 예: 2012.9 → r = 1.240 au, r_h = 2.229 au, ψ_P = 104.83°. 11줄 × 2점 = 22점, 2014.2(p = 3.16″)는 명백히 벗어남(1점), 그림 4점, 장축 4점."
                                   : "Triangle Earth–Sun–planet: Δλ = |λ − λ⊙|, r (au) = 206 265 R⊕/(p a⊕); r_h² = a⊕² + r² − 2a⊕r cos Δλ; sin θ_h = r sin Δλ/r_h; ψ_P = ψ_E − θ_h, with Δψ_E = Δλ⊙ between neighbouring observations (more accurate than the times). E.g. 2012.9 → r = 1.240 au, r_h = 2.229 au, ψ_P = 104.83°. 11 rows × 2 = 22 points, 2014.2 (p = 3.16″) is an obvious outlier (1), the plot 4, the major axis 4.")
            + chk(A, "D2.r", L, 1.22, 1.26) + chk(A, "D2.rh", L, 2.20, 2.26) + chk(A, "D2.psi", L, 103.5, 106.2) + bad(A, L)],
          ["b", (L, A) => (L === "ko" ? "근일점·원일점에 가까운 두 점 (30.69°, 2.020 au)과 (226.09°, 3.994 au) 사이: 2a ≈ √(r₁² + r₂² − 2r₁r₂ cos 195.40°) = 5.965 au → a_p ≈ 2.98 au (3점); e = (r_a − r_p)/(r_a + r_p) ≈ 0.33 (2점); P = √(a³) = 5.15년 (1점). (HaslaLab: 2.94 au, 0.334, 5.03년)"
                                   : "Between the two points nearest perihelion and aphelion, (30.69°, 2.020 au) and (226.09°, 3.994 au): 2a ≈ √(r₁² + r₂² − 2r₁r₂ cos 195.40°) = 5.965 au → a_p ≈ 2.98 au (3 points); e = (r_a − r_p)/(r_a + r_p) ≈ 0.33 (2); P = √(a³) = 5.15 yr (1). (HaslaLab: 2.94 au, 0.334, 5.03 yr)")
            + chk(A, "D2.a", L, 2.85, 3.06) + chk(A, "D2.e", L, 0.30, 0.37) + chk(A, "D2.P", L, 4.8, 5.4)],
          ["c", (L, A) => (L === "ko" ? "r ∝ 1/p라 Δr/r = Δp/p → Δr₁ = 0.010, Δr₂ = 0.020 au; 장축 방향의 불확도 Δ(Δψ) ≈ 15°/180° × π ≈ 0.26 rad를 함께 전파하면 Δa_p = 0.04 au (3점), ΔP/P = 1.5 Δa/a → P = (5.2 ± 0.1)년 (1점), Δe ≈ 0.01 (2점). ✓ 범위는 잭나이프 값까지 담습니다."
                                   : "r ∝ 1/p, so Δr/r = Δp/p → Δr₁ = 0.010 and Δr₂ = 0.020 au; propagating also the uncertainty of the apse direction, Δ(Δψ) ≈ 15°/180° × π ≈ 0.26 rad, gives Δa_p = 0.04 au (3 points), ΔP/P = 1.5 Δa/a → P = (5.2 ± 0.1) yr (1), Δe ≈ 0.01 (2). The ✓ ranges include the jackknife values.")
            + chk(A, "D2.da", L, 0.02, 0.12) + chk(A, "D2.de", L, 0.005, 0.03) + chk(A, "D2.dP", L, 0.05, 0.3)]],
    sol: [["sol_orbit.png", {ko: "공식 해답의 그림 (2015.0은 잘못된 가지의 값으로 찍혀 있음)", en: "The official plot (2015.0 is plotted on the wrong branch)"}],
          {w: 470, h: 470, draw: drawOrbit, cap: {ko: "HaslaLab이 다시 그린 일심 궤도", en: "The heliocentric orbit as redrawn by HaslaLab"}}]
  }, {
    id: "D3", marks: 55, name: {ko: "초고속 별", en: "Hypervelocity stars"},
    lead: {ko: "최근 새로 생긴 연구 분야가 초고속 별(HVS)입니다. 우리은하(대부분 바깥쪽)에서 지나치게 빨리 움직여 은하를 탈출할 수도 있는 별들입니다. 분광과 위치 측정 자료로 ‘HVS1’이라는 별의 속도를 구하고, 어디서 왔는지, 은하를 벗어날지 생각해 봅니다. 그림 1은 HVS1의 청색–자외선 스펙트럼으로, 별의 정지 좌표계로 옮겨 놓았습니다(시선 방향 운동에 의한 도플러 이동이 없음).",
           en: "A new field of research in recent years is that of Hypervelocity Stars (HVS): stars in our Galaxy, mostly at its outskirts, moving with excessive velocities and possibly escaping from the Milky Way. With spectroscopic and astrometric measurements you will calculate the velocity of one such star, ‘HVS1’, consider its origin and whether it may escape the Galaxy. Figure 1 is the blue-to-UV spectrum of HVS1, shifted to the rest frame of the star (no Doppler shift from its motion along the line of sight)."},
    maps: ["hvs", "g3"],
    parts: [{id: "a", mk: "7", ko: "부록 3의 표준 스펙트럼과 HVS1 스펙트럼에 표시된 흡수선으로 별의 분광형을 정하세요. (스펙트럼에는 별의 흡수선과 성간 흡수선이 함께 있습니다.)", en: "Determine the spectral type of the star using the standard spectra of Appendix 3 and the absorption lines identified on the spectrum. (The spectrum contains both stellar and interstellar absorption lines.)"},
      {h: {ko: "부록 (발췌)", en: "Appendices (excerpt)"}, ko: "남아 있는 문제지에는 부록 1(분광형·광도 계급별 절대 등급)과 부록 3(표준 스펙트럼)이 빠져 있습니다. 공식 해답이 쓴 값만 싣습니다. 정성적 기준: B형에서는 He I 4026·4144가 보이다가 A0 무렵 사라지고, Ca II K(3934)는 늦은 B형에서 A형으로 가며 빠르게 세지며, 수소 발머선은 A0–A2에서 가장 셉니다.",
       en: "Appendix 1 (absolute magnitudes by spectral type and luminosity class) and Appendix 3 (standard spectra) are missing from the surviving sheet; only the values the official solution uses are given. Qualitatively: He I 4026 and 4144 are seen in B stars and fade out near A0, Ca II K (3934) grows quickly from late B into the A types, and the Balmer lines peak at A0–A2."},
      {h: {ko: "부록 1 (발췌): M_V", en: "Appendix 1 (excerpt): M_V"}, table: tabA1},
      {h: {ko: "부록 3 대신: 표준 스펙트럼의 선 깊이 비", en: "In place of Appendix 3: line-depth ratio in the standard spectra"}, table: tabA3},
      {id: "b", mk: "18", ko: "선 모양을 자세히 모형화하면 이 별은 광도 계급 V(주계열)와 IV(준거성) 사이에 놓입니다. (i) 안시 겉보기 등급 m_V = 19.84일 때 두 광도 계급 각각의 절대 등급 M_V를 부록 1로 구하세요(m_V의 불확도는 무시). (ii) 성간 흡수를 무시하고 두 경우의 거리를 구하세요. (iii) 은하 좌표는 l = 227.33537267°, b = 31.33199386°입니다. 성간 흡수를 무시해도 되나요? YES/NO. (iv) Gaia는 0.04–0.1 mas 정확도로 시차를 잽니다. HVS1이 (A) 주계열성이라면, (B) 준거성이라면 Gaia가 시차를 잴 수 있었을까요? 이후로는 둘 중 큰 거리를 씁니다. (v) 태양–은하 중심 거리를 8.0 kpc로 두고 HVS1, 태양, 은하 중심의 상대 위치를 대강 그린 뒤 은하 중심에서 HVS1까지의 거리 r을 구하세요.",
       en: "Detailed modelling places the star between luminosity classes V (main sequence) and IV (subgiant). (i) With the visual apparent magnitude m_V = 19.84, find M_V for both classes from Appendix 1 (ignore the uncertainty of m_V). (ii) For both, calculate the distance from the Sun ignoring interstellar absorption. (iii) The galactic coordinates are l = 227.33537267°, b = 31.33199386°. Is ignoring interstellar absorption justified? YES or NO. (iv) Gaia measures parallaxes to 0.04–0.1 mas. Could it have measured the parallax of HVS1 (A) if it is a main-sequence star, (B) if it is a subgiant? From here on adopt the larger distance. (v) With the Sun 8.0 kpc from the Galactic centre, sketch HVS1, the Sun and the Galactic centre and calculate the distance r of HVS1 from the Galactic centre."},
      {id: "c", mk: "17", ko: "(i) 그림 1에는 Ca II 흡수선이 두 개 있습니다(빨간 화살표). 하나는 별의 대기, 하나는 성간 물질 때문이며, 그 차이는 성간 물질에 대한 별의 운동 때문입니다. 이 도플러 이동을 재서 태양에 대한 시선 속도를 구하세요. (ii) 은하 정지 좌표계의 시선 속도: v_rf = v_r,HC + 11.1 cos l cos b + 247.24 sin l cos b + 7.25 sin b (km s⁻¹). v_rf를 구하세요. (iii) 고유 운동 (μ_α, μ_δ) = (+0.08 ± 0.26, −0.12 ± 0.22) mas/yr로 접선 속도(km s⁻¹)를 구하세요(별이 천구 적도 가까이 있어 적위 보정은 무시). (iv) 은하 중심에 대한 속도 v_T의 크기와 은하 중심 방향과 이루는 각을 구하세요. (v) 은하 원반에서 태어났다면 (A) 은하 중심 가까이, (B) 원반 바깥쪽 중 어디서 왔을 가능성이 큰가요?",
       en: "(i) Figure 1 shows two Ca II absorption lines (red arrows), one from the star's atmosphere and one from the interstellar medium; the shift is due to the star's motion relative to the medium. Measure it and calculate the radial velocity of HVS1 relative to the Sun. (ii) The radial velocity in the Galactic rest frame is v_rf = v_r,HC + 11.1 cos l cos b + 247.24 sin l cos b + 7.25 sin b (km s⁻¹). Find v_rf. (iii) With the proper motion (μ_α, μ_δ) = (+0.08 ± 0.26, −0.12 ± 0.22) mas/yr calculate the tangential velocity in km s⁻¹ (ignore the declination correction; the star is near the celestial equator). (iv) Calculate the velocity v_T relative to the Galactic centre, its magnitude and its angle to the direction of the Galactic centre. (v) If it was born in the Galactic disc, did it more likely come from (A) near the Galactic centre or (B) further out in the disc?"},
      {id: "d", mk: "6", ko: "(i) 은하 중심에서의 거리와 그 안의 질량으로 탈출 속도 v_esc를 쓰세요. (ii) HVS1 거리 안의 은하 질량 M_r = 4πρ₀r_c²[r − r_c tan⁻¹(r/r_c)]을 태양 질량으로 구하세요(r_c ≈ 8 pc, ρ₀ = 1.396×10⁴ M⊙ pc⁻³). (iii) HVS1 거리에서의 탈출 속도를 구하세요. (iv) 이 별은 은하를 탈출하는 별인가요? YES/NO.", en: "(i) Write the escape speed v_esc as a function of the distance from the Galactic centre and the enclosed mass. (ii) Calculate the mass within the distance of HVS1, M_r = 4πρ₀r_c²[r − r_c tan⁻¹(r/r_c)], in solar masses (r_c ≈ 8 pc, ρ₀ = 1.396×10⁴ M⊙ pc⁻³). (iii) Calculate the escape speed at HVS1. (iv) Is this a runaway star? YES or NO."},
      {id: "e", mk: "2", ko: "HVS1이 지금 자리까지 오는 데 얼마나 걸렸나요?", en: "How long has it taken HVS1 to reach this position?"},
      {id: "f", mk: "3", ko: "분광형과 광도 계급으로 HVS1의 나이를 어림해 (e)와 비교하세요. 옳은 것은? (A) 태어날 때나 그 직후 방출되었다. (B) 주계열 생애의 중간쯤 방출되었다. (C) 주계열 생애 끝 무렵 방출되었다.", en: "From the spectral type and luminosity class estimate the age of HVS1 and compare it with (e). Which is true: (A) ejected when or shortly after it formed; (B) ejected mid-way through its main-sequence life; (C) ejected towards the end of its main-sequence life?"},
      {id: "g", mk: "2", ko: "HVS를 찾는 천문학자는 먼저 헤일로에서 HVS1과 분광형이 비슷한 별들을 고릅니다. 그 까닭은? (A) 이 분광형은 젊어서 헤일로 토박이 종족이다. (B) 늙어서 토박이 종족이다. (C) 젊어서 헤일로 토박이가 아니다. (D) 늙어서 토박이가 아니다.", en: "Astronomers looking for HVSs start with halo stars of a spectral type similar to HVS1. Why: (A) stars of this type are young and so native to the halo; (B) old and so native; (C) young and so not native to the halo; (D) old and so not native?"}],

             ["m5", {ko: "(b-i) M_V (V)", en: "(b-i) M_V (V)"}], ["m4", {ko: "(b-i) M_V (IV)", en: "(b-i) M_V (IV)"}], ["d5", {ko: "(b-ii) d, V (kpc)", en: "(b-ii) d, V (kpc)"}], ["d4", {ko: "(b-ii) d, IV (kpc)", en: "(b-ii) d, IV (kpc)"}],

             ["org", {ko: "(c-v) 출생지", en: "(c-v) Birthplace"}, ["A", "B"]], ["Mr", {ko: "(d-ii) M_r (M⊙)", en: "(d-ii) M_r (M⊙)"}], ["ve", {ko: "(d-iii) v_esc (km/s)", en: "(d-iii) v_esc (km/s)"}],
             ["run", {ko: "(d-iv) 탈출하는 별?", en: "(d-iv) Runaway?"}, ["YES", "NO"]], ["t", {ko: "(e) 이동 시간 (년)", en: "(e) Travel time (yr)"}],
             ["f", "(f)", ["A", "B", "C"]], ["g", "(g)", ["A", "B", "C", "D"]]],
    solNote: {ko: "공식 해답과 채점 기준입니다. HaslaLab이 모든 값을 다시 계산해 일치를 확인했습니다(r = 110.5 kpc, v_rf = 682, M_r = 1.23×10¹² M⊙, v_esc = 310 km/s). 한 군데는 느슨합니다: (f)에서 공식 해답은 주계열 수명을 t ∼ 10⁸년으로 두지만, M_V ≈ −0.3인 B9 준거성은 L ≈ 110 L⊙이고 t ≈ 10¹⁰ (L/L⊙)^(−5/7)년 ≈ 3×10⁸년이어서 이동 시간 1.6×10⁸년이 생애의 절반쯤입니다. 공식 답 A를 ✓로, B를 △로 둡니다. 부록 1·3은 남은 문제지에 없어 공식 해답이 쓴 값만 실었습니다.",
              en: "From the official solution and marking scheme; HaslaLab recomputed every value and they agree (r = 110.5 kpc, v_rf = 682, M_r = 1.23×10¹² M⊙, v_esc = 310 km/s). One step is loose: in (f) the official solution takes the main-sequence life as t ∼ 10⁸ yr, but a B9 subgiant with M_V ≈ −0.3 has L ≈ 110 L⊙ and t ≈ 10¹⁰ (L/L⊙)^(−5/7) yr ≈ 3×10⁸ yr, so the 1.6×10⁸ yr journey is about half of it. The official answer A is marked ✓ and B △. Appendices 1 and 3 are missing from the surviving sheet, so only the values the official solution uses are given."},
    key: [["a", (L, A) => (L === "ko" ? "수소선이 가장 두드러지고, He I 4144는 겨우 보이며, Ca I 4230은 없음 → B5–A5 (2점). Ca II K/Hε ∼ 1/4 (2점)인데 표준은 B8 ∼ 1/5, A0 ∼ 1/3 (2점) → B8과 A0 사이, 예컨대 B9 (1점)."
