<meta name="description" content="EuPhO 2025 실험 1을 브라우저에서 실행합니다. 두 입력 전압을 받아 시그모이드로 출력하는 전자 '뉴런' 상자를 바나나 전선과 멀티미터로 직접 배선하고, 가중치와 편향, 출력 저항을 찾아 원하는 함수를 흉내 내도록 '학습'시킵니다.">

<style>
  :root{
    --bg:#1c2027; --panel:#22262d; --ink:#e8eef2; --muted:#9aa3ab;
    --line:#33373e; --accent:#f2c14e; --accent-soft:#2b2f36; --deep:#12161b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:12px;display:flex;gap:12px;align-items:flex-start}
  @media (max-width:1180px){ .wrap{flex-wrap:wrap} }
  .tray{flex:0 0 206px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;position:sticky;top:12px}
  .tray h3{margin:2px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
           color:var(--accent);text-align:center}
  #tray{display:block;width:100%;height:auto;background:#15181d;border-radius:6px;cursor:pointer}
  #closeCv{display:block;width:100%;height:auto;border-radius:6px;background:#15181d}
  @media (max-width:1180px){ .tray{position:static} .stage{flex:1 1 100%;order:-1} }
  @media (max-width:760px){ .tray{flex:1 1 100%} }

  /* ── stage ── */
  .stage{flex:1 1 auto;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card h3{margin:6px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
  #cv{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;cursor:default;background:#c8b08c}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{width:auto;margin:0;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#1c2027}
  .info{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px 18px;
        font-size:13.5px;line-height:1.7;color:#d6dde2}
  .info h4{margin:14px 0 4px;color:var(--accent);font-size:13px;letter-spacing:.03em}
  .info h4:first-child{margin-top:0}
  .info ol,.info ul{margin:4px 0 4px 20px;padding:0}
  .info .warn{color:#f0a79f;font-weight:600}

  /* ── control panel ── */
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px;position:sticky;top:12px}
  @media (max-width:1180px){ .panel{position:static} }
  @media (max-width:760px){ .panel{flex:1 1 100%} }
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
            margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}

    sub:"가상 실험실 · 상자 안의 전자 회로가 '뉴런' 하나를 흉내 냅니다. 입력 전압 x₁, x₂(단자 X1, X2)로 z = w₁x₁ + w₂x₂ + b를 만들고, 출력 Y는 전압 y = Aσ(z)인 이상 전원에 직렬 출력 저항 R_out이 붙은 것처럼 동작합니다. σ(z) = 1/(1 + e⁻ᶻ). GND 둘은 상자 안에서 이어져 있고 +V, x₁, x₂, y 모두의 공통 음극입니다. X1이나 X2에 입력이 없으면 출력이 제멋대로 움직입니다. A1·A2·A3에는 가변 저항 R_P와 부하 저항 R_L이 들어 있고, B1·B2·B3도 같은 방식입니다(제조 공차 안에서 같은 값). T는 이 과제에서 쓰지 않습니다. 바나나 전선은 단자 하나에 여러 개를 겹쳐 꽂을 수 있습니다. 계산은 대신 해주지 않습니다.",

    hA:"A 손잡이", hB:"B 손잡이",
    hW:"전선", clrW:"전선 모두 빼기", undoW:"마지막 전선 빼기", wList:w=>w.length?w.map(([a,b],i)=>(i+1)+". "+a+" — "+b).join("\n"):"(전선 없음)",
    hNote:"실험 노트", note:"적기", noteClr:"지우기", cfgPh:"예: x1 = 0.00 V, x2 = 3.15 V, y = 2.73 V",
    st:{none:"부품함에서 상자, 멀티미터, 전선을 꺼내 놓으세요.", hand:n=>"손에 든 것: "+n, ohmLive:"전류가 흐르는 회로에서 저항을 재고 있습니다 — 값을 믿을 수 없습니다.", short:"+V와 GND가 전선으로 바로 이어져 있습니다!", amps:"전류 범위로 전압원을 재면 퓨즈가 끊어질 수 있습니다."},
    m:{picked:n=>n+" — 실험대를 클릭하세요. (우클릭: 되돌리기)", placed:n=>n+"을(를) 놓았습니다.", back:n=>n+"을(를) 부품함에 넣었습니다.", fixed:n=>n+"은(는) 제자리에 있습니다 (우클릭: 부품함으로).", needFor:n=>"먼저 "+n+"을(를) 놓으세요.",
       wired:(a,b)=>a+" — "+b+" 전선을 이었습니다.", unwired:"전선을 뺐습니다.", same:"같은 단자입니다.", sel:n=>n+" — 이을 단자를 클릭하세요.", probeSel:n=>n+" 탐침을 들었습니다 — 댈 단자를 클릭하세요.", probeOn:(p,t)=>p+" 탐침을 "+t+"에 댔습니다.", probeOff:"탐침을 뗐습니다.", noted:"노트에 적었습니다.", clip:"악어 집게로 탐침을 고정했습니다.", unclip:"악어 집게를 풀었습니다."}
  },
  en:{
    title:"EuPhO 2025 Experiment 1 — Deep Learning",
    sub:"Virtual lab · the circuit in the box models one 'neuron'. From the input voltages x₁ and x₂ (terminals X1, X2) it forms z = w₁x₁ + w₂x₂ + b, and its output Y behaves like an ideal source of voltage y = Aσ(z) in series with an output resistor R_out; σ(z) = 1/(1 + e⁻ᶻ). The two GND terminals are joined inside and are the common negative of +V, x₁, x₂ and y. If X1 or X2 has no input voltage, the output behaves unpredictably. A1, A2, A3 hold the potentiometer R_P and a load resistor R_L; B1, B2, B3 are wired the same way with the same values within tolerances. T is not used in this task. Several banana plugs can be stacked on one terminal. No calculation is done for you.",
    docTitle:"EuPhO 2025 Experiment 1 — Deep Learning · HaslaLab",
    trayTitle:"Parts box", trayTake:"click to take", trayOut:"in use",
    trayHelp:"L-click take / put\nR-click return\nterminal → terminal: wire\nprobe → terminal: measure",
    items:{box:"(i) Neuron box",meter:"(ii) Multimeter and probes",wires:"(iii) Banana wires",clip:"Alligator clip",paper:"(iv) Graph paper"},
    cap:"The bench (3D) — L-click take / put, R-click back to the box · drag empty space: turn the view, Shift+drag: pan, wheel: zoom, double-click: reset view",
    tabs:{box:"Box (wiring)",meter:"Multimeter"},
    closeCap:{box:"The top of the box — click a terminal and then another to join them with a banana wire (plugs can be stacked). Right-click the middle of a wire to unplug it. Drag a knob to turn it. Click a probe tip on the right (black COM, red V) and then a terminal to touch it there.",
              meter:"The multimeter — click the dial to turn it (right-click: backwards). Measure resistance only where no current flows."},
    lab:{noBox:"put the box out", noMeter:"put the multimeter out", pot:"potentiometer", com:"COM", vprobe:"V Ω mA", probes:"probes", attached:"→ ", none:"(free)", unstable:"unstable contact"},
    hM:"Multimeter", dialL:{OFF:"OFF","V20":"V⎓ 20","V2":"V⎓ 2","OHM20k":"Ω 20k","OHM2k":"Ω 2k","mA200":"mA 200"}, prV:(c,v)=>"COM → "+(c||"—")+" · V → "+(v||"—"), clipOn:"Probe held by the alligator clip: on", clipOff:"Hold the probe with the alligator clip",
    hA:"Knob A", hB:"Knob B",
    hW:"Wires", clrW:"Unplug all wires", undoW:"Unplug the last wire", wList:w=>w.length?w.map(([a,b],i)=>(i+1)+". "+a+" — "+b).join("\n"):"(no wires)",
    hNote:"Notebook", note:"Write", noteClr:"Clear", cfgPh:"e.g. x1 = 0.00 V, x2 = 3.15 V, y = 2.73 V",
    st:{none:"Take out the box, the multimeter and the wires.", hand:n=>"In hand: "+n, ohmLive:"You are measuring resistance in a live circuit: the value cannot be trusted.", short:"+V is wired straight to GND!", amps:"Measuring a source on the current range may blow the fuse."},
    m:{picked:n=>n+" — click the bench. (R-click: return)", placed:n=>n+" put out.", back:n=>n+" put back in the box.", fixed:n=>n+" stays in its place (R-click: back to the box).", needFor:n=>"Put the "+n+" out first.",
       wired:(a,b)=>a+" — "+b+" joined.", unwired:"Wire unplugged.", same:"That is the same terminal.", sel:n=>n+": click the terminal to join it to.", probeSel:n=>"Holding the "+n+" probe: click the terminal to touch.", probeOn:(p,t)=>p+" probe on "+t+".", probeOff:"Probe lifted.", noted:"Written in the notebook.", clip:"Probe clipped on.", unclip:"Clip taken off."}
  }
};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);
const d=()=>T[lang];
/* ══════════════════════════════════════════════════════════════
   1.  THE HIDDEN TRUTH OF THIS SESSION  (V, Ω)
   ══════════════════════════════════════════════════════════════ */
const U=(a,b)=>a+Math.random()*(b-a);
const gauss=(m,s)=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const sig=z=>1/(1+Math.exp(-z));
const TRUE=(()=>{ const t={};
  t.A=U(2.65,2.85); t.w1=(Math.random()<0.5?-1:1)*U(0.45,0.80); t.w2=(Math.random()<0.5?-1:1)*U(0.75,1.10); t.b=U(0.6,1.9)*(Math.random()<0.2?-1:1);
  t.Rout=U(255,315); t.Vs=U(3.20,3.30); t.Rs=U(10,16); t.Rin=1.0e6;
  t.RP={A:U(960,1060),B:0}; t.RP.B=t.RP.A*(1+gauss(0,0.01)); t.RL={A:U(212,232),B:0}; t.RL.B=t.RL.A*(1+gauss(0,0.01));
  t.taper={A:U(0.04,0.08),B:U(0.04,0.08)};                     /* the pots' tracks are not quite linear */
  t.mGain=1+gauss(0,0.002);
  return t; })();
/* the knob (0..1 of its 300° travel) → the fraction of the track between end 1 and the slider */
const potFrac=k=>{ const th=ST.knob[k]; return Math.max(0,Math.min(1,th+TRUE.taper[k]*Math.sin(2*Math.PI*th))); };

/* ══════════════════════════════════════════════════════════════
   2.  THE BENCH STATE AND THE CIRCUIT
   ══════════════════════════════════════════════════════════════ */
const PARTS=["box","meter","wires","clip","paper"];
const TERMS=["GND1","GND2","+V","X1","X2","Y","A1","A2","A3","B1","B2","B3","T"];
const ST={ on:new Set(), wires:[], knob:{A:U(0.2,0.8),B:U(0.2,0.8)}, dial:"OFF", probe:{com:null,v:null}, clip:false, drift:{X1:U(0,3),X2:U(0,3)}, t:0, disp:"", dispT:0 };
let hand=null, mouse=[0,0], overBench=false, msg={key:null,args:[],t:0};
function say(key,...args){ msg={key,args,t:performance.now()}; }
const has=k=>ST.on.has(k);
const itemName=k=>d().items[k]||k;
const DIAL=["OFF","V20","V2","OHM20k","OHM2k","mA200"];
function gsolve(A,b,n){ const M=A.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r; if(Math.abs(M[p][c])<1e-30){ M[c][c]+=1e-18; p=c; } [M[c],M[p]]=[M[p],M[c]];
    const pv=M[c][c]; for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/pv; if(f===0) continue; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }
  return M.map((r,i)=>r[n]/r[i]); }
/* group the terminals joined by wires (GND1 and GND2 are joined inside the box) */
function groups(){ const par={}; for(const t of TERMS) par[t]=t; const f=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; }, un=(a,b)=>{ const ra=f(a), rb=f(b); if(ra!==rb) par[ra]=rb; };
  un("GND1","GND2"); for(const [a,b] of ST.wires) un(a,b); return f; }
/* solve the box with the meter on its probes; returns node voltages and the meter's reading in SI */
function solve(){ const f=groups(), roots=[...new Set(TERMS.map(f))], idx={}; roots.forEach((r,i)=>idx[r]=i);
  const N=roots.length+3, WA=roots.length, WB=roots.length+1, YI=roots.length+2, G0=idx[f("GND1")];
  const n=t=>idx[f(t)], t=TRUE, meterOn=has("meter")&&ST.probe.com&&ST.probe.v&&ST.dial!=="OFF";
  const pcom=meterOn?n(ST.probe.com):-1, pv=meterOn?n(ST.probe.v):-1;
  const floating=k=>!ST.wires.some(([a,b])=>a===k||b===k)&&!(meterOn&&(ST.probe.com===k||ST.probe.v===k));
  const run=(ySrc,live,itest)=>{ const G=Array.from({length:N},()=>new Array(N).fill(0)), I=new Array(N).fill(0);
    const sG=(a,b,g)=>{ G[a][a]+=g; G[b][b]+=g; G[a][b]-=g; G[b][a]-=g; };
    for(let i=0;i<N;i++) G[i][i]+=1e-12;
    G[G0][G0]+=1e6;                                                  /* ground */
    sG(n("+V"),G0,1/t.Rs); if(live){ I[n("+V")]+=t.Vs/t.Rs; }
    for(const [k,W] of [["A",WA],["B",WB]]){ const fr=potFrac(k); sG(n(k+"1"),W,1/(fr*t.RP[k]+0.3)); sG(W,n(k+"2"),1/((1-fr)*t.RP[k]+0.3)); sG(W,n(k+"3"),1/t.RL[k]); }
    sG(n("X1"),G0,1/t.Rin); sG(n("X2"),G0,1/t.Rin);
    sG(YI,n("Y"),1/t.Rout); sG(YI,G0,1e3); if(live) I[YI]+=ySrc*1e3;   /* the ideal source y behind Rout */
    if(meterOn){ if(ST.dial.startsWith("V")) sG(pcom,pv,1/10e6); else if(ST.dial.startsWith("mA")) sG(pcom,pv,1/1.0); else if(itest){ I[pv]+=itest; I[pcom]-=itest; } }
    const v=gsolve(G,I,N); v.vn=k=>v[n(k)]; return v; };
  let y=t.A/2, v=null;
  for(let k=0;k<40;k++){ v=run(y,true,ST.dial.startsWith("OHM")?1e-3:0); let x1=v.vn("X1"), x2=v.vn("X2");
    if(floating("X1")) x1=ST.drift.X1; if(floating("X2")) x2=ST.drift.X2;
    const yn=t.A*sig(t.w1*x1+t.w2*x2+t.b); if(Math.abs(yn-y)<1e-7){ y=yn; break; } y=0.5*y+0.5*yn; }
  let read=null;
  if(meterOn){ const dv=v[pv]-v[pcom];
    if(ST.dial.startsWith("V")) read=dv; else if(ST.dial.startsWith("mA")) read=dv/1.0; else read=dv/1e-3; }
  return {v,y,read}; }
function meterShow(){ if(!has("meter")||ST.dial==="OFF") return ""; const s=solve(); if(s.read===null) return ST.dial.startsWith("OHM")?"1   .":"0.00";
  const r=s.read*TRUE.mGain;
  if(ST.dial==="V20"){ const q=r+gauss(0,0.004); return Math.abs(q)>19.99?"1   .":q.toFixed(2); }

function drawBoxTop(){ const t=d(); ctx.fillStyle="#e9e7e0"; ctx.fillRect(0,0,CLW,CLH);
  if(!has("box")){ text(t.lab.noBox,CLW/2,CLH/2,"#69717a",12.5,"center"); return; }
  const g=boxGeom(), k=g.k; BV=g;
  fillR(g.X(-BHW),g.Y(-BHD),2*BHW*k,2*BHD*k,10,"#a4aab1","#6f757c",2);
  text("NEURON",g.X(0),g.Y(1.2),"#1b1d20",Math.max(12,0.85*k),"center","800"); text("EuPhO 2025",g.X(0),g.Y(2.6),"#33373c",Math.max(10,0.55*k),"center","700");
  /* the potentiometers: knob, a printed scale, and their three terminals */
  for(const kk of ["A","B"]){ const q=KPOS[kk], cx=g.X(q[0]), cy=g.Y(q[1]), R=1.6*k;
    ctx.strokeStyle="#333"; ctx.lineWidth=1; for(let i=0;i<=30;i++){ const a=(-150+10*i-90)*Math.PI/180, r1=R*1.18, r2=R*(i%5?1.3:1.42); ctx.beginPath(); ctx.moveTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a)); ctx.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a)); ctx.stroke();
      if(i%5===0) text(String(i*10),cx+R*1.62*Math.cos(a),cy+R*1.62*Math.sin(a),"#333",Math.max(8,0.42*k),"center"); }
    const a=(-150+300*ST.knob[kk]-90)*Math.PI/180; circ(cx,cy,R,"#2a2c30","#111",1.5); ctx.strokeStyle="#f2f2f0"; ctx.lineWidth=Math.max(2,0.18*k); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*0.92*Math.cos(a),cy+R*0.92*Math.sin(a)); ctx.stroke();
    text(kk,cx-R*2.3,cy-R*1.3,"#111",Math.max(12,0.9*k),"center","800"); hitAdd("knob"+kk,cx-R,cy-R,2*R,2*R,{cx,cy});
    ctx.strokeStyle="#555"; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(g.X(q[0]-3),g.Y(5.2)); ctx.lineTo(g.X(q[0]+3),g.Y(5.2)); ctx.stroke(); ctx.setLineDash([]); }
  for(const n of TERMS){ const [x,y]=tPx(n), r=0.62*k; circ(x,y,r,TCOL(n),"#000",1.2); circ(x,y,r*0.38,"#111"); hitAdd("t:"+n,x-r-4,y-r-4,2*r+8,2*r+8); }
  /* the wires, drawn as arcs from plug to plug */
  ST.wires.forEach(([a,b],i)=>{ const {pa,pb,m}=wirePath(i), col=WCOL[i%WCOL.length]; ctx.strokeStyle=col; ctx.lineWidth=Math.max(3,0.22*k); ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.quadraticCurveTo(2*m[0]-(pa[0]+pb[0])/2,2*m[1]-(pa[1]+pb[1])/2,pb[0],pb[1]); ctx.stroke(); ctx.lineCap="butt"; circ(m[0],m[1],3,col,"#fff",1); circ(pa[0],pa[1],0.3*k,col,"#000",1); circ(pb[0],pb[1],0.3*k,col,"#000",1); });
  for(const n of TERMS){ const [x,y]=tPx(n), r=0.62*k; if(WSEL===n) circ(x,y,r+5,null,"#ff7a2a",3); text(n,x,y+r+Math.max(10,0.55*k),"#111",Math.max(10,0.5*k),"center","700"); }
  /* the probe holders on the right, and the probes where they touch */
  const hx=CLW-120;
  fillR(hx,20,108,CLH-40,8,"#d8d6cf","#9a978e",1); text(t.lab.probes,hx+54,36,"#333",12,"center","700");
  for(const [w,col,lab,y] of [["com","#1b1d20",t.lab.com,90],["v","#c0392b",t.lab.vprobe,200]]){ const at=ST.probe[w];
    fillR(hx+20,y,68,18,8,col,PSEL===w?"#ff7a2a":"#000",PSEL===w?3:1); fillR(hx+80,y+6,22,6,2,"#c8ccd0"); text(lab,hx+54,y+34,"#222",11,"center","700");
    text(at?t.lab.attached+at:t.lab.none,hx+54,y+50,at?"#1a5":"#777",11,"center"); hitAdd("p:"+w,hx+14,y-8,84,36);
    if(at){ const [x,yy]=tPx(at); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+(w==="com"?-1:1)*18,yy-30); ctx.stroke(); ctx.setLineDash([]); circ(x,yy,5,col,"#fff",1.5); } }
  const unst=probeUnstable(); if(unst) text(t.lab.unstable,hx+54,CLH-34,"#b3261e",11,"center","700");
  text(d().wList(ST.wires).split("\n").slice(-1)[0],12,CLH-12,"#555",10.5,"left"); }

/* ── 2. the multimeter, face on ── */
let MV={};
const DIALA=i=>(-150+i*60)*Math.PI/180;
function drawMeterFace(){ const t=d(); ctx.fillStyle="#2a2d33"; ctx.fillRect(0,0,CLW,CLH);
  if(!has("meter")){ text(t.lab.noMeter,CLW/2,CLH/2,"#c9ced3",12.5,"center"); return; }
  const H=CLH-30, W=H*0.56, x0=CLW/2-W/2, y0=15, u=H/420;
  fillR(x0,y0,W,H,18*u,"#e0b62a","#7a6316",2); fillR(x0+14*u,y0+14*u,W-28*u,H-28*u,12*u,"#2a2c30");
  fillR(x0+30*u,y0+30*u,W-60*u,90*u,6*u,"#b9c4a3","#555",1.5);
  lcd(ST.disp||"",x0+40*u,y0+42*u,W-80*u,66*u,"#1b1d20","rgba(27,29,32,0.08)");
  if(ST.dial!=="OFF") text(UNIT[ST.dial]||"",x0+W-38*u,y0+112*u,"#333",13*Math.max(1,u),"right","700");
  const cx=x0+W/2, cy=y0+230*u, R=62*u; circ(cx,cy,R,"#1b1d20","#555",2); MV={cx,cy,R};
  DIAL.forEach((k,i)=>{ const a=DIALA(i)-Math.PI/2, x=cx+(R+38*u)*Math.cos(a), y=cy+(R+38*u)*Math.sin(a), on=ST.dial===k;
    ctx.strokeStyle="#ccc"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cx+(R+4)*Math.cos(a),cy+(R+4)*Math.sin(a)); ctx.lineTo(cx+(R+14*u)*Math.cos(a),cy+(R+14*u)*Math.sin(a)); ctx.stroke();
    text(t.dialL[k],x,y,on?"#ffd77a":"#e8eef2",12*Math.max(1,u),"center",on?"800":"600"); hitAdd("d:"+k,x-34*u,y-12*u,68*u,24*u); });
  const a=DIALA(DIAL.indexOf(ST.dial))-Math.PI/2; ctx.strokeStyle="#f2f2f0"; ctx.lineWidth=8*u; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(cx-R*0.6*Math.cos(a),cy-R*0.6*Math.sin(a)); ctx.lineTo(cx+R*0.85*Math.cos(a),cy+R*0.85*Math.sin(a)); ctx.stroke(); ctx.lineCap="butt";
  hitAdd("dial",cx-R,cy-R,2*R,2*R);
  for(const [w,dx,col,lab] of [["com",-0.25,"#1b1d20","COM"],["v",0.25,"#d0352b","VΩmA"]]){ const x=cx+dx*W, y=y0+H-55*u; circ(x,y,14*u,col,"#000",2); circ(x,y,6*u,"#111"); text(lab,x,y+26*u,"#ddd",11*Math.max(1,u),"center","700"); }
  text(t.prV(ST.probe.com,ST.probe.v),CLW/2,CLH-6,"#c9ced3",11,"center"); }
let cmouse=[0,0];
function drawClose(){ const dpr=window.devicePixelRatio||1, old=ctx; ctx=closeCtx; ctx.setTransform(dpr,0,0,dpr,0,0); HIT=[];
  try{ if(tab==="meter") drawMeterFace(); else drawBoxTop(); } finally{ ctx=old; } }
/* ══════════════════════════════════════════════════════════════
   6.  HANDS: the bench and the close-ups
   ══════════════════════════════════════════════════════════════ */
function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/S,(e.clientY-r.top)/S]; }
function hitItem(p){ return pick3(p[0],p[1])||null; }
let drag=null;
function clearK(k){ ST.on.delete(k);
  if(k==="box"||k==="wires"){ ST.wires=[]; WSEL=null; }
  if(k==="box"||k==="meter"){ ST.probe.com=ST.probe.v=null; PSEL=null; }
  if(k==="clip") ST.clip=false; }
function place(k){ ST.on.add(k); say("placed",itemName(k)); return true; }
function benchClick(p,right,e){
  if(hand){ const k=hand.item; if(right){ say("back",itemName(k)); hand=null; return; } if(place(k)) hand=null; return; }
  const k=hitItem(p);
  if(!k){ if(!right) drag=e&&e.shiftKey?{k:"pan",p,v:[CAM.px,CAM.py]}:{k:"orbit",p,v:[CAM.yaw,CAM.pitch]}; return; }
  if(right){ clearK(k); say("back",itemName(k)); return; }
  if(k==="meter") setTab("meter"); else if(k==="box"||k==="wires"||k==="clip") setTab("box"); }
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ const p=lpos(e); mouse=p;
  if(drag){ if(drag.k==="pan"){ CAM.px=drag.v[0]+p[0]-drag.p[0]; CAM.py=drag.v[1]+p[1]-drag.p[1]; } else { CAM.yaw=Math.max(-1.4,Math.min(1.4,drag.v[0]+(p[0]-drag.p[0])*0.006)); CAM.pitch=Math.max(0.05,Math.min(1.45,drag.v[1]+(p[1]-drag.p[1])*0.004)); } cv.style.cursor="grabbing"; return; }
  cv.style.cursor=hand?"crosshair":hitItem(p)?"pointer":"grab"; });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; cv.setPointerCapture(e.pointerId); benchClick(p,e.button===2,e); drawTray(); });
cv.addEventListener("pointerup",()=>{ drag=null; });
cv.addEventListener("dblclick",e=>{ if(!hand&&!hitItem(lpos(e))) camReset(); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=lpos(e), up=e.deltaY<0, nk=Math.max(3,Math.min(120,CAM.k*(up?1.12:1/1.12))), f=nk/CAM.k;
  CAM.px=p[0]-LW/2-(p[0]-LW/2-CAM.px)*f; CAM.py=p[1]-LH/2-(p[1]-LH/2-CAM.py)*f; CAM.k=nk; },{passive:false});
window.addEventListener("mouseup",e=>{ if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; benchClick(p,false); drawTray(); } trayDrag=false; });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ hand=null; WSEL=null; PSEL=null; drawTray(); } });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("mousedown",e=>{ if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue; const same=inHand(k); hand=null;
    if(!same&&trayAvail(k)){ hand={item:k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ── the close-ups ── */
closeCv.addEventListener("contextmenu",e=>e.preventDefault());
function clpos(e){ const r=closeCv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
const hitAt=p=>{ for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(p[0]>=h.x&&p[0]<=h.x+h.w&&p[1]>=h.y&&p[1]<=h.y+h.h) return h; } return null; };
let cdrag=null;
const knobAng=(h,p)=>Math.atan2(p[0]-h.cx,-(p[1]-h.cy))*180/Math.PI;
function turn(k,deg){ ST.knob[k]=Math.max(0,Math.min(1,ST.knob[k]+deg/300)); }
function addWire(a,b){ if(!has("wires")){ say("needFor",itemName("wires")); return; } if(a===b){ say("same"); return; } ST.wires.push([a,b]); say("wired",a,b); }
function termClick(n){
  if(PSEL){ if(!has("meter")){ PSEL=null; return; } ST.probe[PSEL]=n; say("probeOn",PSEL==="com"?"COM":"V",n); PSEL=null; return; }
  if(!WSEL){ if(!has("wires")){ say("needFor",itemName("wires")); return; } WSEL=n; say("sel",n); return; }
  const a=WSEL; WSEL=null; addWire(a,n); }
function unplugNear(p,h){
  let best=-1, bd=16; ST.wires.forEach((w,i)=>{ const {m}=wirePath(i), dd=Math.hypot(m[0]-p[0],m[1]-p[1]); if(dd<bd){ bd=dd; best=i; } });
  if(best>=0){ ST.wires.splice(best,1); say("unwired"); return; }
  if(h&&h.k.startsWith("t:")){ const n=h.k.slice(2);
    for(const w of ["v","com"]) if(ST.probe[w]===n){ ST.probe[w]=null; say("probeOff"); return; }
    for(let i=ST.wires.length-1;i>=0;i--) if(ST.wires[i].includes(n)){ ST.wires.splice(i,1); say("unwired"); return; } } }
closeCv.addEventListener("wheel",e=>{ e.preventDefault(); const h=hitAt(clpos(e)); if(!h) return;
  if(h.k==="knobA"||h.k==="knobB") turn(h.k.slice(4),(e.deltaY<0?1:-1)*(e.shiftKey?0.2:1));
  else if(h.k==="dial") dialStep(e.deltaY<0?1:-1); },{passive:false});
closeCv.addEventListener("pointermove",e=>{ cmouse=clpos(e); if(!cdrag) return; const p=cmouse;
  if(cdrag.k==="knob"){ const a=knobAng(cdrag.h,p); let da=a-cdrag.a; if(da>180) da-=360; if(da<-180) da+=360; cdrag.a=a; turn(cdrag.n,da); } });
closeCv.addEventListener("pointerup",()=>{ cdrag=null; });
closeCv.addEventListener("pointerdown",e=>{ const p=clpos(e), right=e.button===2; closeCv.setPointerCapture(e.pointerId); drawClose(); const h=hitAt(p);
  if(tab==="box"){ if(!has("box")) return;
    if(right){ if(h&&h.k.startsWith("p:")){ const w=h.k.slice(2); if(ST.probe[w]){ ST.probe[w]=null; say("probeOff"); } PSEL=null; return; } WSEL=null; unplugNear(p,h); return; }
    if(!h){ WSEL=null; PSEL=null; return; }
    if(h.k==="knobA"||h.k==="knobB"){ cdrag={k:"knob",n:h.k.slice(4),h,a:knobAng(h,p)}; return; }
    if(h.k.startsWith("p:")){ if(!need("meter")) return; const w=h.k.slice(2); WSEL=null; PSEL=PSEL===w?null:w; if(PSEL) say("probeSel",w==="com"?"COM":"V"); return; }
    if(h.k.startsWith("t:")) termClick(h.k.slice(2)); return; }
  if(tab==="meter"&&h&&has("meter")){ if(h.k.startsWith("d:")){ ST.dial=h.k.slice(2); ST.dispT=0; return; } if(h.k==="dial") dialStep(right?-1:1); } });
function dialStep(s){ if(!need("meter")) return; ST.dial=DIAL[(DIAL.indexOf(ST.dial)+s+DIAL.length)%DIAL.length]; ST.dispT=0; }

/* ══════════════════════════════════════════════════════════════
   7.  PANEL AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let rows=0;
const need=k=>{ if(!has(k)){ say("needFor",itemName(k)); return false; } return true; };
/* a probe pressed into a terminal that already carries two plugs slips unless the clip holds it */
function probeUnstable(){ if(ST.clip) return false; return ["com","v"].some(w=>{ const n=ST.probe[w]; return n&&ST.wires.filter(x=>x.includes(n)).length>=2; }); }
function updateDisp(){ if(probeUnstable()&&Math.random()<0.35){ const keep={...ST.probe}; ST.probe.v=null; ST.disp=meterShow(); ST.probe=keep; return; } ST.disp=meterShow(); }
function liveOhm(){ if(!ST.dial.startsWith("OHM")||!ST.probe.com||!ST.probe.v) return false; const dd=ST.dial; ST.dial="V20"; const r=solve().read; ST.dial=dd; return r!==null&&Math.abs(r)>2e-3; }
function shorted(){ const f=groups(); return f("+V")===f("GND1"); }
function overAmps(){ if(ST.dial!=="mA200") return false; const r=solve().read; return r!==null&&Math.abs(r)>0.2; }
function step(dt){ ST.t+=dt;
  for(const k of ["X1","X2"]) ST.drift[k]=Math.max(0,Math.min(3.3,ST.drift[k]+gauss(0,0.9)*Math.sqrt(dt)));
  ST.dispT-=dt; if(ST.dispT<=0){ ST.dispT=0.4; updateDisp(); } }
for(const [id,k,dv] of [["am10","A",-10],["am1","A",-1],["ap1","A",1],["ap10","A",10],["bm10","B",-10],["bm1","B",-1],["bp1","B",1],["bp10","B",10]]) $(id).onclick=()=>{ if(!need("box")) return; turn(k,dv); };
const dialSel=$("dial"); dialSel.onchange=()=>{ if(!need("meter")){ dialSel.value=ST.dial; return; } ST.dial=dialSel.value; ST.dispT=0; };
$("clipBtn").onclick=()=>{ if(!need("clip")) return; ST.clip=!ST.clip; say(ST.clip?"clip":"unclip"); };
$("clrW").onclick=()=>{ ST.wires=[]; WSEL=null; say("unwired"); }; $("undoW").onclick=()=>{ if(ST.wires.length){ ST.wires.pop(); say("unwired"); } };
$("noteBtn").onclick=()=>{ rows++; const n=$("note"), line=rows+")  "+$("cfg").value.trim(); n.value+=(n.value&&!n.value.endsWith("\n")?"\n":"")+line; n.scrollTop=n.scrollHeight; say("noted"); };
$("noteClr").onclick=()=>{ $("note").value=""; rows=0; };
function renderPanel(){ const t=d();
  $("mV").textContent=!has("meter")?"—":ST.dial==="OFF"?"OFF":(ST.disp||"")+" "+(UNIT[ST.dial]||"");
  if(dialSel.value!==ST.dial) dialSel.value=ST.dial; $("prV").textContent=t.prV(ST.probe.com,ST.probe.v);
  $("clipBtn").textContent=ST.clip?t.clipOn:t.clipOff; $("clipBtn").className=ST.clip?"on":"";
  $("t-h-a").textContent=t.hA+" · "+(300*ST.knob.A).toFixed(0)+"°"; $("t-h-b").textContent=t.hB+" · "+(300*ST.knob.B).toFixed(0)+"°";
  const wl=t.wList(ST.wires); if($("wV").textContent!==wl) $("wV").textContent=wl; }
function renderStatus(){ const L=[], t=d();
  if(!ST.on.size) L.push([t.st.none,false]);
  if(hand) L.push([t.st.hand(itemName(hand.item)),false]);
  if(has("box")&&shorted()) L.push([t.st.short,true]);
  if(has("meter")&&has("box")&&liveOhm()) L.push([t.st.ohmLive,true]);
  if(has("meter")&&has("box")&&overAmps()) L.push([t.st.amps,true]);
  if(probeUnstable()) L.push([t.lab.unstable,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"), html=L.map(([s,w])=>"<div"+(w?" class='w'":"")+">"+s.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>").join(""); if(box.innerHTML!==html) box.innerHTML=html; }
function applyLang(){ const t=d(); document.documentElement.lang=lang;
  for(const [id,k] of [["t-title","title"],["t-sub","sub"],["t-tray","trayTitle"],["t-cap","cap"],["t-h-m","hM"],["t-h-w","hW"],["clrW","clrW"],["undoW","undoW"],["t-h-note","hNote"],["noteBtn","note"],["noteClr","noteClr"]]) $(id).textContent=t[k];
  dialSel.innerHTML=""; for(const k of DIAL){ const o=document.createElement("option"); o.value=k; o.textContent=t.dialL[k]; dialSel.appendChild(o); }
  $("cfg").placeholder=t.cfgPh; $("t-closecap").textContent=t.closeCap[tab]; $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=t.docTitle; renderTabs(); renderPanel(); layout(); }
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let frameN=0, lastT=performance.now();
function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now; step(dt);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); renderPanel(); drawTray(); }
  requestAnimationFrame(tick); }
window.addEventListener("resize",()=>{ layout(); });
applyLang(); requestAnimationFrame(tick);
</script>
