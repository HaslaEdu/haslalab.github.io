<!DOCTYPE html>

<meta name="description" content="NBPhO 2003 실험 문제 8 을 브라우저에서 해 봅니다. 철판과 영구 자석 사이의 인력을 거리(종이띠 수)의 함수로, 용수철저울과 마찰로 또는 경사면을 미끄러진 벽돌로 친 미끄럼 거리로 구합니다.">

<style>
:root{--bg:#0c0c0c;--fg:#cccccc;--dim:#7d7d7d;--accent:#4ec9b0;--line:#2a2a2a;--panel:#141414}
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 0 3px;font-size:15px;color:#e8e8e8}
header p{margin:0;color:var(--dim);font-size:12.5px}
header details{margin-top:7px}
header summary{cursor:pointer;color:var(--accent);font-size:12.5px}
header ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12.5px}
header li{margin:2px 0}
#screen{flex:1;overflow-y:auto;background:var(--bg);padding:12px 16px;
        font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;white-space:pre-wrap;
        word-break:break-word}
#screen .in{color:#9cdcfe}
#bar{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line);
     padding:6px 16px 10px}
#ps{color:var(--fg);font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;
    white-space:pre;flex:none}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#9cdcfe;
     font:13px/1.45 ui-monospace,Consolas,"Courier New",monospace;padding:0}
#tools{display:flex;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
button{background:#2d2d2d;color:var(--fg);border:1px solid var(--line);border-radius:4px;
       padding:5px 12px;font:12.5px inherit;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}

</style>
</head>
<body>
<script>
/* NBPhO 2003 problem 8 "Experiment" on the 3-D bench.  As in the official solution: 1) the paper stripe on the
   tilted iron plate gives μs (it starts sliding) and μk (pushed, it keeps a steady speed); 2) the magnet on n
   stripes (0.2 mm each) is pulled sideways by a cord and the dynamometer, F ≈ Fd/μ − Fp; 3) on a steep plate
   the brick, let go from a mark, hits the magnet and the path it slides is ∝ 1/N; 4) two magnets bridged by
   iron, many hits.  The force follows F = F0/(1 + d/d0)^2.2 (≈ 20 N at 0.2 mm, the graph's range) and the
   bridged pair ≈ 270 N at 0.2 mm, as in the solution. */
var PROGRAM = {
  title: { ko: 'NBPhO 2003 실험 8 — 자석과 철판', en: 'NBPhO 2003 Problem 8 — Magnet and iron plate' },
  subtitle: { ko: '철판과 영구 자석 사이의 인력을 거리의 함수로 구하세요. 도구: 철판, 나무 벽돌, 자, 용수철저울, 종이띠. 1) 철판과 종이띠 사이의 정지·운동 마찰 계수. 2) 용수철저울을 직접 쓸 수 있는 거리에서 인력. 3) 더 작은 거리에서 — 경사면을 미끄러진 벽돌로 자석을 쳐서. 4) 쇠 다리로 이은 자석 둘과 철판 사이의 인력.',
              en: 'Find the attraction force between the iron plate and a permanent magnet as a function of distance. Tools: an iron plate, a wooden brick, a ruler, a dynamometer and paper stripes. 1) The static and kinetic coefficients of friction between the plate and a paper stripe. 2) The force at distances where the dynamometer can be used directly. 3) At smaller distances — using the brick sliding down the inclined plate and hitting the magnet. 4) The force between the plate and two magnets joined by an iron bridge.' },
  notes: { ko: [
    '공식 해답: 1) 판을 기울여 종이띠가 미끄러지기 시작하면 μs = tan θ, 살짝 밀어 일정한 속도로 내려가면 μk = tan θ (≈ 0.37, 0.29).',
    '2) 종이띠 여러 장 위의 자석을 끈 고리와 용수철저울로 옆으로 당기면 F ≈ Fd/μ − Fp (거리는 종이띠 수 × 0.2 mm). 3) 가파른 판에서 같은 자리에서 놓은 벽돌이 자석을 치면, 미끄러진 거리가 N 에 반비례 — 2) 의 결과로 비례 상수를 맞춥니다. 거리가 너무 짧으면 여러 번 칩니다.',
    '4) 쇠 다리로 이은 자석 둘은 자기 회로가 닫혀 0.2 mm 에서 ≈ 270 N (자석 하나의 두 배보다 훨씬 큼). 판은 왼쪽 끝이 책상에, 28 cm 떨어진 스탠드 팔에 얹혀 tan θ = h/28. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Official solution: 1) tilt the plate: when the stripe starts sliding μs = tan θ; pushed slightly, when it slides at a steady speed μk = tan θ (≈ 0.37, 0.29).',
    '2) Pull the magnet on several stripes sideways with a cord loop and the dynamometer: F ≈ Fd/μ − Fp (distance = stripes × 0.2 mm). 3) On a steep plate the brick, let go from the same mark, hits the magnet; the path slid is ∝ 1/N — fix the constant from 2). If the path is too short, use several hits.',
    '4) Two magnets bridged by iron close the magnetic loop: ≈ 270 N at 0.2 mm (far more than twice one magnet). The plate\'s left end rests on the desk and it lies on a stand\'s arm 28 cm away, so tan θ = h/28. The values differ a little from visit to visit.'] }
};

var LAB = { h: 2, obj: 'strip', n: 5, sp: 18, v: 0, moving: false, mz: 0, Fd: 0, sliding: false, brick: -1, hits: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 왼쪽 끝을 책상에 대고 스탠드 팔에 얹은 철판(옆에 mm 자, 위쪽에 벽돌 출발 표시), 판 위의 종이띠, 종이띠 묶음 위의 자석, 쇠 다리로 이은 자석 둘, 나무 벽돌, 용수철저울(0–10 N).',
           en: 'On the desk: the iron plate with its left end on the desk, lying on a stand\'s arm (a mm scale along it, the brick\'s start mark near the top), a paper stripe on it, a magnet on a stack of stripes, two magnets joined by an iron bridge, the wooden brick and a dynamometer (0–10 N).' },
  howto: { ko: ['스탠드 팔(집게) 위아래로 끌기: 판 기울이기 · 휠: 미세 · 막대 클릭: 눈금 가까이',
                '종이띠·자석·쇠 다리 자석 클릭: 그것을 판 위에 올리기 (다시 클릭: 종이띠는 살짝 밀기) · 자석 위에서 휠: 밑에 까는 종이띠 수',
                '용수철저울 오른쪽으로 끌기: 자석을 옆으로 당기기 (놓으면 0) · 클릭: 눈금 가까이',
                '벽돌 클릭: 출발 표시에서 놓기 — 자석을 칩니다 · 판의 자 클릭: 자석 위치 가까이 읽기'],
           en: ['Drag the stand\'s arm (clamp) up or down: tilt the plate · wheel: fine · click the rod: its scale closely',
                'Click the stripe, the magnet or the bridged pair: put it on the plate (click again: give the stripe a slight push) · wheel over the magnet: the number of stripes under it',
                'Drag the dynamometer right: pull the magnet sideways (let go: 0) · click: read it closely',
                'Click the brick: let it go from the start mark — it hits the magnet · click the plate\'s scale: read the magnet\'s position closely'] },
  notePlaceholder: { ko: '예) 종이띠: 미끄러짐 h = 10.3 cm; 일정 속도 h = 8.1 cm. 자석 5장: Fd 최대 2.9 N … 벽돌 1회: 12.5 → 14.1 cm', en: 'e.g. stripe: slips at h = 10.3 cm; steady at h = 8.1 cm. Magnet on 5: Fd max 2.9 N … brick 1 hit: 12.5 → 14.1 cm' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var mus = 0.37 * (1 + S.sys('mus', 0.06)), muk = 0.29 * (1 + S.sys('muk', 0.06)), F0 = 30 * (1 + S.sys('F0', 0.08)), d0 = 1.0 * (1 + S.sys('d0', 0.05)), Fb0 = 270 * (1 + S.sys('Fb', 0.08));
    var g = 9.81, mM = 0.012, mB = 0.045, HX = -16, D = 28, Lp = 42, TH = 0.5, W = 12, brickM = 0.05, brickMu = 0.35, Lfall = 12;
    var Fm = function (n) { var d = 0.2 * n; return F0 / Math.pow(1 + d / d0, 2.2); };
    var Fbr = function (n) { var d = 0.2 * n; return Fb0 * Math.pow((1 + 0.2 / 0.3) / (1 + d / 0.3), 2); };
    var rodScale = B3.scaleTex(30, { width: 1.2, bg: '#f2f2ee', step: 0.1 }), pscale = B3.scaleTex(40, { horiz: true, width: 1.6, bg: '#e9eef2', label: 'cm' }), dynTex = B3.scaleTex(10, { horiz: true, width: 1.6, bg: '#f4f1e6', label: 'N' });
    var musI = mus, mukI = muk;
    function newI() { musI = mus * (1 + HL.gauss(0.03)); mukI = muk * (1 + HL.gauss(0.02)); }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['clamp', 'magnet'],
      home: { yaw: -0.3, pitch: 0.55, k: 13, tx: 2, ty: 4, tz: 2 },
      views: { rod: { yaw: 0, pitch: 0.05, k: 45, tx: HX + D, ty: 6, tz: -8, title: { ko: '스탠드 막대의 눈금', en: 'The rod\'s scale' } },
               pscale: { yaw: 0, pitch: 0.9, k: 45, tx: 0, ty: 3, tz: 6, title: { ko: '판의 자', en: 'The plate\'s scale' } },
               dyn: { yaw: 0, pitch: 1.2, k: 40, tx: 20, ty: 1, tz: 14, title: { ko: '용수철저울', en: 'The dynamometer' } } },
      frame: function (b) {
        var dc = b.screenMoved('clamp'), wc = b.wheel('clamp');
        if (dc[1] || wc) LAB.h = Math.max(0, Math.min(28, LAB.h - dc[1] / Math.max(0.3, Math.cos(B3.CAM.pitch)) + wc * 0.05));
        var th = Math.atan2(LAB.h, D), sn = Math.sin(th), cs = Math.cos(th);
        var put = function (o) { LAB.obj = o; LAB.sp = o === 'strip' ? 24 : 18; LAB.v = 0; LAB.moving = false; LAB.mz = 0; LAB.hits = 0; LAB.brick = -1; newI(); };
        if (b.clicked('m:strip')) { if (LAB.obj !== 'strip') put('strip'); else if (!LAB.moving) { LAB.moving = true; LAB.v = 6; } }
        if (b.clicked('m:magnet')) put('magnet');
        if (b.clicked('m:bridge')) put('bridge');
        var wm = b.wheel('magnet'); if (wm) { LAB.n = Math.max(1, Math.min(30, LAB.n + Math.sign(wm))); if (LAB.obj === 'magnet' || LAB.obj === 'bridge') { LAB.mz = 0; LAB.hits = 0; } }
        if (b.clicked('c:pscale')) b.go('pscale');
        var onPlate = LAB.obj, N = onPlate === 'magnet' ? Fm(LAB.n) : onPlate === 'bridge' ? Fbr(LAB.n) : 0, mass = onPlate === 'bridge' ? mB : mM;
        /* 1) the stripe: static slip, then g(sin − μk cos) */
        if (onPlate === 'strip') {
          if (!LAB.moving && Math.tan(th) > musI) { LAB.moving = true; LAB.v = 0.5; b.say('종이띠가 미끄러지기 시작합니다.', 'The stripe starts sliding.'); }
          if (LAB.moving) { LAB.v += 981 * (sn - mukI * cs) * b.dt; LAB.sp -= LAB.v * b.dt;
            if (LAB.v <= 0) { LAB.v = 0; LAB.moving = false; newI(); }
            if (LAB.sp < 3) { LAB.sp = 3; LAB.v = 0; LAB.moving = false; } }
        } else {
          /* the magnet slips down by itself if the plate is too steep for it */
          if (!LAB.moving && musI * (N + mass * g * cs) < mass * g * sn) { LAB.moving = true; LAB.v = 0; b.say('자석이 저절로 미끄러져 내려갑니다.', 'The magnet slides down by itself.'); }
          if (LAB.moving) { LAB.v += 100 * (mass * g * sn - mukI * (N + mass * g * cs)) / mass * b.dt; LAB.sp -= Math.max(0, LAB.v) * b.dt;
            if (LAB.v <= 0) { LAB.v = 0; LAB.moving = false; } if (LAB.sp < 3) { LAB.sp = 3; LAB.moving = false; } }
          /* 2) the dynamometer, pulling sideways */
          var md = b.screenMoved('dyn');
          if (md[0] || (b.dragging && LAB.Fd > 0)) { var lim = musI * (N + mass * g * cs);
            LAB.Fd = Math.max(0, LAB.Fd + md[0] * 0.25);
            if (LAB.Fd > lim || LAB.sliding) { LAB.sliding = LAB.Fd > mukI * (N + mass * g * cs) * 0.98; if (LAB.sliding) { LAB.Fd = mukI * (N + mass * g * cs) * (1 + HL.gauss(0.015)); LAB.mz = Math.min(4, LAB.mz + Math.max(0, md[0]) * 0.1); } } }
          if (!b.dragging) { LAB.Fd = 0; LAB.sliding = false; }
        }
        /* 3) the brick */
        if (b.clicked('m:brick')) {
          if (Math.tan(th) <= brickMu) b.say('벽돌이 미끄러지지 않습니다 — 판을 더 기울이세요.', 'The brick does not slide — tilt the plate more.');
          else if (onPlate === 'strip') b.say('먼저 자석을 판에 올리세요.', 'Put a magnet on the plate first.');
          else LAB.brick = Lp - 3;
        }
        if (LAB.brick >= 0) { LAB.brick -= 60 * b.dt;
          if (LAB.brick <= LAB.sp + 2.2) { LAB.brick = -1; LAB.hits++;
            var E0 = 0.5 * brickM * g * (sn - brickMu * cs) * Lfall / 100 * (1 + HL.gauss(0.03)), den = mukI * (N + mass * g * cs) - mass * g * sn;
            LAB.sp = den > 0 ? Math.max(3, LAB.sp - E0 / den * 100) : 3; } }
        var u = [Math.cos(th), Math.sin(th), 0], nn = [-Math.sin(th), Math.cos(th), 0];
        var at = function (s, up, z) { return [HX + u[0] * s + nn[0] * up, u[1] * s + nn[1] * up, z || 0]; };
        B3.desk(-36, 36, -18, 22);
        /* the plate, its scale, the start mark */
        B3.obox(at(Lp / 2, TH / 2), u, nn, Lp / 2, TH / 2, W / 2, '#6f747a', { top: '#858a90' });
        B3.tex3(pscale, 0, 0, pscale.width, pscale.height, at(0.5, TH + 0.01, W / 2 - 1.7), [u[0] * 41, u[1] * 41, 0], [0, 0, 1.6], { id: 'c:pscale' });
        B3.line3(at(Lp - 3, TH + 0.02, -W / 2), at(Lp - 3, TH + 0.02, W / 2 - 1.8), '#c0392b', 2);
        /* the stand */
        B3.box3(HX + D - 5, HX + D + 5, 0, 1.4, -18, -8, '#3b4048', { top: '#474c55' });
        B3.cyl3('y', 1.4, 30, HX + D, -11, 0.6, '#c3c8cd', { id: 'm:rod', seg: 14, cap: '#dde1e4' });
        B3.tex3(rodScale, 0, 0, rodScale.width, rodScale.height, [HX + D - 0.6, 31, -11 + 0.62], [1.2, 0, 0], [0, -32, 0], { id: 'm:rod' });
        B3.box3(HX + D - 1.2, HX + D + 1.2, LAB.h - 2.0, LAB.h + 0.4, -12.2, -9.8, '#3a3f46', { id: 'm:clamp', top: '#474c55' });
        B3.cyl3('z', -9.8, 7, HX + D, LAB.h - 0.4, 0.4, '#c3c8cd', { id: 'm:clamp', seg: 12, cap: '#dde1e4' });
        /* what lies on the plate, and the others on the desk */
        var stack = 0.02 * LAB.n;
        if (onPlate === 'strip') B3.obox(at(LAB.sp, TH + 0.02), u, nn, 4, 0.02, 1.5, '#fbfbf6', { id: 'm:strip' });
        else B3.box3(-30, -22, 0, 0.04, 10, 13, '#fbfbf6', { id: 'm:strip' });
        if (onPlate === 'magnet') { B3.obox(at(LAB.sp, TH + stack / 2, LAB.mz), u, nn, 1.6, stack / 2 + 0.01, 1.6, '#f4f4ee');
          B3.cylAB(at(LAB.sp, TH + stack, LAB.mz), at(LAB.sp, TH + stack + 1.0, LAB.mz), 1.25, '#9aa0a6', { seg: 22, id: 'm:magnet', cap: '#b4b9be' });
          B3.line3(at(LAB.sp, TH + 0.03, W / 2 - 1.7), at(LAB.sp, TH + 0.03, W / 2 - 0.1), '#c0392b', 2); }
        else { B3.box3(-24.5, -21.5, 0, 0.02 * LAB.n + 0.02, 15, 18, '#f4f4ee'); B3.cyl3('y', 0.02 * LAB.n + 0.02, 0.02 * LAB.n + 1.02, -23, 16.5, 1.25, '#9aa0a6', { seg: 22, id: 'm:magnet', cap: '#b4b9be' }); }
        if (onPlate === 'bridge') { var bz = LAB.mz;
          B3.obox(at(LAB.sp, TH + stack / 2, bz), u, nn, 3.4, stack / 2 + 0.01, 1.6, '#f4f4ee');
          [-1.6, 1.6].forEach(function (o) { B3.cylAB(at(LAB.sp + o, TH + stack, bz), at(LAB.sp + o, TH + stack + 1.0, bz), 1.25, '#9aa0a6', { seg: 22, id: 'm:bridge', cap: '#b4b9be' }); });
          B3.obox(at(LAB.sp, TH + stack + 1.4, bz), u, nn, 3.1, 0.4, 1.2, '#4a4f55', { id: 'm:bridge', top: '#5a5f65' });
          B3.line3(at(LAB.sp, TH + 0.03, W / 2 - 1.7), at(LAB.sp, TH + 0.03, W / 2 - 0.1), '#c0392b', 2); }
        else { [-1.6, 1.6].forEach(function (o) { B3.cyl3('y', 0, 1.0, -12 + o, 16.5, 1.25, '#9aa0a6', { seg: 22, id: 'm:bridge', cap: '#b4b9be' }); });
          B3.box3(-15.1, -8.9, 1.0, 1.8, 15.3, 17.7, '#4a4f55', { id: 'm:bridge', top: '#5a5f65' }); }
        /* the brick */
        if (LAB.brick >= 0) B3.obox(at(LAB.brick, TH + 1.5, -1), u, nn, 2.2, 1.5, 2, '#a8743c', { top: '#b8844a' });
        B3.box3(2, 8.4, 0, 3, 12, 16, '#a8743c', { id: 'm:brick', top: '#b8844a' });
        /* the dynamometer and its cord to the magnet */
        var dx = 20, dz = 14, ext = 11 * (1 + Math.min(10.5, LAB.Fd)) / 12;
        B3.cylAB([dx - 6, 1.0, dz], [dx + 6, 1.0, dz], 1.0, '#c9ccd0', { seg: 16, id: 'm:dyn' });
        B3.tex3(dynTex, 0, 0, dynTex.width, dynTex.height, [dx - 5.5, 2.01, dz - 0.8], [11, 0, 0], [0, 0, 1.6], { id: 'm:dyn' });
        B3.box3(dx - 5.5 + ext - 0.06, dx - 5.5 + ext + 0.06, 2.0, 2.3, dz - 0.9, dz + 0.9, '#c0392b', { id: 'm:dyn' });
        if (onPlate === 'magnet' || onPlate === 'bridge') B3.line3(at(LAB.sp, TH + stack + 0.5, LAB.mz + 1.3), [dx - 6.2, 1.0, dz], '#555', 1.5);
        b.views.rod.ty = LAB.h; b.views.pscale.tx = at(LAB.sp, 0)[0]; b.views.pscale.ty = at(LAB.sp, 0)[1];
        LAB.state = { tan: Math.tan(th), obj: onPlate, n: LAB.n, N: N, sp: LAB.sp, Fd: LAB.Fd, hits: LAB.hits, moving: LAB.moving, v: LAB.v };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
