<body>

<header>
  <div>
    <h1 id="t-title"></h1>

  </div>

  </aside>

  <div class="stage">
    <div class="card">
      <h3 id="t-cap"></h3>
      <div class="cvwrap">
        <canvas id="cv"></canvas>
        <button id="btnBack" class="back" hidden></button>
      </div>
    </div>
  </div>

  <aside class="panel">
    <h2 id="t-h-time"></h2>

    <h2 id="t-h-laser"></h2>

    <input type="range" id="focus" min="0" max="1" step="0.01" value="0.35">
    <label class="lbl" id="t-theta"></label>
    <input type="range" id="theta" min="25" max="75" step="0.5" value="45">
    <h2 id="t-h-watch"></h2>
    <div class="disp" id="clock">00:00.00</div>
    <div class="row"><button id="btnSS"></button><button id="btnRst"></button></div>
    <h2 id="t-h-paper"></h2>
    <button id="btnTrace"></button>
    <div class="row"><button id="btnFresh"></button><button id="btnPng"></button></div>
    <h2 id="t-h-view"></h2>
    <div class="row"><button id="vReset"></button><button id="vScreen"></button><button id="vCell"></button><button id="vRail"></button></div>
    <p class="hint" id="t-hint"></p>
    <div class="status" id="status"></div>
  </aside>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  return [CAM.W/2+CAM.px+xr*CAM.k, CAM.H/2+CAM.py-up*CAM.k, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;
  const dz=(dx*c-xr)/s, dy=(up+(dx*s+dz*c)*sp)/cp;
  return [x0, CAM.ty+dy, CAM.tz+dz];
}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const _shadeCache=new Map();
function shade(col,f){
  const key=col+"|"+f.toFixed(2); let v=_shadeCache.get(key); if(v) return v;
  let a=1, rgb;
  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));
  v=a<1?`rgba(${r[0]},${r[1]},${r[2]},${a})`:`rgb(${r[0]},${r[1]},${r[2]})`;
  _shadeCache.set(key,v); return v;
}
const LIGHT=(()=>{ const v=[-0.45,0.85,0.35], n=Math.hypot(...v); return v.map(a=>a/n); })();
let ITEMS=[], HITS=[];
function begin3(){ ITEMS=[]; }
function _cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
function _sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
/* a flat polygon; o = {fill, stroke, lw, id, layer, cull, flat, bias, alpha} */
function face(pts,o){
  o=o||{};
  const n=_cross(_sub(pts[1],pts[0]),_sub(pts[2],pts[0])), nl=Math.hypot(...n)||1;
  const nn=n.map(a=>a/nl);
  const lum=o.flat?1:0.62+0.48*Math.max(0,nn[0]*LIGHT[0]+nn[1]*LIGHT[1]+nn[2]*LIGHT[2]);
  ITEMS.push({t:"f",p:pts,o,lum,n:nn});
}
function quad(a,b,c,d,o){ face([a,b,c,d],o); }
/* axis-aligned box, outward faces culled when they point away */
function box3(x0,x1,y0,y1,z0,z1,col,o){
  o=Object.assign({cull:true},o||{}); const f=Object.assign({},o,{fill:col});
  const t=o.top?Object.assign({},f,{fill:o.top}):f;
  face([[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],t);          /* top    +y */
  face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],f);          /* bottom -y */
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f);          /* +z */
  face([[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],f);          /* -z */
  face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],f);          /* +x */
  face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],f);          /* -x */
}
/* make a polygon face the direction `want` (a world vector) */
function orient(pts,want){
  const n=_cross(_sub(pts[1],pts[0]),_sub(pts[2],pts[0]));
  return (n[0]*want[0]+n[1]*want[1]+n[2]*want[2])<0?pts.slice().reverse():pts;
}
/* cylinder (or cone, with o.r1) along an axis ("x","y","z") from a0 to a1, centre (u,v) across it */
function cyl3(axis,a0,a1,u,v,r,col,o){
  o=Object.assign({cull:true,seg:18},o||{}); const N=o.seg, f=Object.assign({},o,{fill:col});
  const r1=o.r1===undefined?r:o.r1;
  const W=(a,cu,cv)=>axis==="x"?[a,cu,cv]:axis==="y"?[cu,a,cv]:[cu,cv,a];
  const pt=(a,rr,ang)=>W(a,u+rr*Math.cos(ang),v+rr*Math.sin(ang));
  const ax=W(1,0,0).map((c,i)=>c-W(0,0,0)[i]), sg=a1>=a0?1:-1;
  for(let i=0;i<N;i++){
    const t0=i/N*2*Math.PI, t1=(i+1)/N*2*Math.PI, tm=(t0+t1)/2;
    const q=[pt(a0,r,t0),pt(a0,r,t1),pt(a1,r1,t1),pt(a1,r1,t0)];
    const rad=_sub(pt(a0,1,tm),pt(a0,0,tm));
    face(orient(q,rad),Object.assign({},f,{smooth:true}));
  }
  if(o.caps!==false){
    const c0=[],c1=[]; for(let i=0;i<N;i++){ const t=i/N*2*Math.PI; c0.push(pt(a0,r,t)); c1.push(pt(a1,r1,t)); }
    const cf=Object.assign({},f,o.cap?{fill:o.cap}:{},{stroke:o.capStroke});
    if(r>0.001) face(orient(c0,ax.map(c=>-c*sg)),cf);
    if(r1>0.001) face(orient(c1,ax.map(c=>c*sg)),cf);
  }
}
/* a prism: polygon pts2 [[u,v]..] in the plane across `axis`, extruded from a0 to a1 */
function prism3(axis,a0,a1,pts2,col,o){
  o=Object.assign({cull:true},o||{}); const f=Object.assign({},o,{fill:col});
  const P=(a,[u,v])=>axis==="x"?[a,u,v]:axis==="y"?[u,a,v]:[u,v,a];
  const n=pts2.length, A=pts2.map(p=>P(a0,p)), B=pts2.map(p=>P(a1,p));
  const ax=_sub(P(1,[0,0]),P(0,[0,0])), sg=a1>=a0?1:-1;
  let cu=0,cvv=0; for(const [x,y] of pts2){ cu+=x; cvv+=y; } cu/=n; cvv/=n;
  face(orient(A,ax.map(c=>-c*sg)),f); face(orient(B,ax.map(c=>c*sg)),f);
  for(let i=0;i<n;i++){ const j=(i+1)%n; const q=[A[i],A[j],B[j],B[i]];
    const mid=[(pts2[i][0]+pts2[j][0])/2-cu,(pts2[i][1]+pts2[j][1])/2-cvv];
    face(orient(q,_sub(P(0,mid),P(0,[0,0]))),f); }
}
function line3(a,b,col,lw,o){ ITEMS.push({t:"l",p:[a,b],o:Object.assign({col,lw:lw||1},o||{})}); }
function poly3(pts,col,lw,o){ ITEMS.push({t:"pl",p:pts,o:Object.assign({col,lw:lw||1},o||{})}); }
/* text lying in the plane spanned by U (right) and V (up), size in cm */
function text3(O,U,V,str,size,col,o){ ITEMS.push({t:"x",p:[O],O,U,V,str,size,o:Object.assign({col},o||{})}); }
/* anything else: draw(ctx) is called in its depth order; ref is a world point */
function custom3(ref,draw,o){ ITEMS.push({t:"c",p:[ref],draw,o:o||{}}); }

function render3(ctx){
  const vis=[];
  for(const it of ITEMS){
    const q=it.p.map(p=>P3(p[0],p[1],p[2]));
    let dep=0; for(const v of q) dep+=v[2]; dep/=q.length;
    if(it.t==="f"&&it.o.cull){
      let a=0; for(let i=0;i<q.length;i++){ const j=(i+1)%q.length; a+=q[i][0]*q[j][1]-q[j][0]*q[i][1]; }
      if(a>=0) continue;                                  /* facing away */
    }
    vis.push({it,q,dep:dep+(it.o.bias||0),layer:it.o.layer||0});
  }
  vis.sort((a,b)=>a.layer-b.layer||a.dep-b.dep);
  HITS=[];
  for(const v of vis){
    const it=v.it, o=it.o, q=v.q;
    if(it.t==="f"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]); ctx.closePath();
      if(o.fill){ if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.fillStyle=o.flat?o.fill:shade(o.fill,it.lum); ctx.fill(); ctx.globalAlpha=1; }
      if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=o.lw||0.8; ctx.lineJoin="round"; ctx.stroke(); }
      else if(o.fill&&o.alpha===undefined){ ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=0.6; ctx.stroke(); }
      if(o.id) HITS.push([o.id,q]);
    }else if(it.t==="l"||it.t==="pl"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]);
      ctx.strokeStyle=o.col; ctx.lineWidth=o.lw; ctx.lineCap=o.cap||"round"; ctx.lineJoin="round";
      if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.stroke(); ctx.globalAlpha=1;
    }else if(it.t==="x"){
      const O=q[0], pu=P3(it.O[0]+it.U[0],it.O[1]+it.U[1],it.O[2]+it.U[2]), pv=P3(it.O[0]+it.V[0],it.O[1]+it.V[1],it.O[2]+it.V[2]);
      const a=[pu[0]-O[0],pu[1]-O[1]], b=[pv[0]-O[0],pv[1]-O[1]];
      if(a[0]*b[1]-a[1]*b[0]>=0) continue;                 /* seen from behind */
      if(Math.hypot(...a)*it.size<2.2) continue;           /* too small to read */
      ctx.save(); ctx.transform(a[0],a[1],-b[0],-b[1],O[0],O[1]);
      ctx.font=(o.weight||"600")+" "+it.size+"px "+(o.font||"-apple-system,'Segoe UI','Malgun Gothic',sans-serif");
      ctx.textAlign=o.align||"left"; ctx.textBaseline=o.base||"middle"; ctx.fillStyle=o.col; ctx.fillText(it.str,0,0); ctx.restore();
    }else if(it.t==="c"){ ctx.save(); it.draw(ctx); ctx.restore(); }
  }
}
function pointIn(q,x,y){ let c=false; for(let i=0,j=q.length-1;i<q.length;j=i++){
  const xi=q[i][0], yi=q[i][1], xj=q[j][0], yj=q[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
/* the id of the nearest object under a screen point */
function pick3(x,y){ for(let i=HITS.length-1;i>=0;i--) if(pointIn(HITS[i][1],x,y)) return HITS[i][0]; return null; }

/* ══════════════════════════════════════════════════════════════
   0.  i18n
   ══════════════════════════════════════════════════════════════ */
const T={
  ko:{

    sub:"가상 실험실 · 책상 위의 장비를 3D로 봅니다. 레이저 모듈·확산 셀·스크린을 레일에 놓고, 소금물 병과 증류수·피펫을 책상에 꺼내 쓰세요. 스크린·셀·레일을 클릭하면 2D로 자세히 볼 수 있습니다. 프로그램은 아무것도 계산해 주지 않습니다.",
    trayTitle:"부품함", trayTake:"클릭해서 집기", trayOut:"책상 위", trayHelp:"좌클릭 집기·놓기 / 우클릭 되돌리기\n끌어다 놓기도 됩니다",

    back:"◀ 3D로 돌아가기",
    hTime:"시간 배속", jump:"확산 30분 지점으로 건너뛰기",
    hLaser:"1. 선 레이저 모듈", focus:"초점 (레이저 뒤쪽 링을 돌림)", theta:"레이저 회전 (선의 기울기)",
    hWatch:"7. 스톱워치", ss:"시작 / 정지", rst:"리셋",

/* ══════════════════════════════════════════════════════════════
   1.  APPARATUS  —  identical to the Python constants
   ══════════════════════════════════════════════════════════════ */
const RAIL_LEN=85.0, SCREEN_SIZE=30.0, CELL_D=0.8, CELL_W=6.5, CELL_H=9.5;
const CELL_FOOT=1.0, FILL_LINE=5.0, BENCH_TOP=33.0;
const LASER_X=0.0, LASER_Y0=4.5, CELL_X0=10.4, SCREEN_X0=64.6, SCREEN_Y0=17.0;
const LASER_Y_RANGE=[2.5,8.0], SCREEN_Y_RANGE=[16.8,26.0], CELL_X_RANGE=[3.0,40.0];

/* ── physics constants (calibrated to the official marking scheme) ── */
const D_A=2.29e-5, D_B=-5.25e-5;        // D(C0)      [cm^2/s]
const DNDC_A=0.2036, DNDC_B=-0.420;     // dn/dC(C0)  [mL/g]
const SIG_MASS=0.25, SIG_VOLUME=1.0, SIG_D_REL=0.025, SIG_H=0.06;
const SIG_STOP=2.0, SIG_ROUGH=0.006;
const HAND_OFFSET=0.010, HAND_WANDER=0.011;
/* the pipette: the diffusion starts with the first drop, not with the stopwatch */
const WDROP_RISE=0.075, WDROPS_DEFAULT=40, WDROP_RATE=6.0;
const N_POINTS=2200, PRESET_CONC=[23.0,28.0,33.0];

/* ── random helpers (replaces numpy.random.default_rng) ── */
const uni=(a,b)=>a+Math.random()*(b-a);
function norm(mu,sd){                       // Box–Muller
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

/* ══════════════════════════════════════════════════════════════
   2.  Pour  —  one filling of the cell; all errors drawn once
        (direct transcription of the Python class)
   ══════════════════════════════════════════════════════════════ */
class Pour{
  constructor(grams, volume=150.0){
    this.grams = grams;
    const mass = grams + norm(0,SIG_MASS);
    const vol  = volume + norm(0,SIG_VOLUME);
    this.C0    = Math.max(mass,0.1)/Math.max(vol,1.0);            // g/mL
    this.D     = Math.max((D_A+D_B*this.C0)*(1+norm(0,SIG_D_REL)), 1e-6);
    this.dndC  = DNDC_A + DNDC_B*this.C0;                          // mL/g
    this.dh    = norm(0,SIG_H);                                    // cm
    this.t_off = norm(0,SIG_STOP);
    this._k=[], this._p=[], this._a=[];
    for(let i=0;i<6;i++){
      this._k.push(uni(0.3,1.8));
      this._p.push(uni(0,2*Math.PI));
      this._a.push(norm(0,SIG_ROUGH));
    }
  }
  tEff(tDiff){ return Math.max(tDiff, 1.0); }
  rough(xi){
    let s=0;
    for(let i=0;i<6;i++) s += this._a[i]*Math.sin(this._k[i]*xi + this._p[i]);
    return s;
  }
}

/* ══════════════════════════════════════════════════════════════
   3.  STATE  —  rail readings in cm; heights above the rail top
   ══════════════════════════════════════════════════════════════ */
const RT=2.6;                                     /* rail top above the desk */
const S={
  laserX:2.0, laserY:LASER_Y0, cellX:CELL_X0, screenX:SCREEN_X0, screenY:SCREEN_Y0,
  sw:false, focus:0.35, theta:45.0,
  pour:null, filled:false, conc:23, wlevel:0.0, dripping:false, dropCredit:0, drops:0, pip:0,
  tFirst:false, tDiff:0.0, watch:{run:false,t:0}, pencil:[]
};
const ST={ on:{laser:false,cell:false,screen:false,paper:false,batt:false,watch:false,s23:false,s28:false,s33:false,water:false,pipette:false,bucket:false},
  pos:{} };
const DESK_ITEMS=["batt","watch","s23","s28","s33","water","pipette","bucket"];
const RAD={batt:5,watch:5,s23:3.8,s28:3.8,s33:3.8,water:3.8,pipette:6,bucket:10.5};
const beamOn=()=>ST.on.laser&&ST.on.batt&&S.sw;
const onScreen=()=>beamOn()&&ST.on.screen&&S.screenX>S.laserX+3;
const cellInPath=()=>ST.on.cell&&S.cellX>S.laserX+0.5&&S.cellX+CELL_D<S.screenX;
const Z0  = ()=> S.cellX - S.laserX;
const Zd  = ()=> S.screenX - S.cellX - CELL_D;
const mag = ()=> (Z0() + CELL_D + Zd())/Math.max(Z0(),1e-3);
const hInt= ()=> CELL_FOOT + FILL_LINE - S.laserY + (S.pour ? S.pour.dh : 0);
const xiMid=()=> S.screenY - S.laserY;

/* ══════════════════════════════════════════════════════════════
   4.  THE PHYSICS  —  trace_xy()
        xi     = Y (Z0 + d + Z)/Z0
        delta  = Z d (dn/dY)
        dn/dY  = (dn/dC) C0 /(2 sqrt(pi D t)) exp(-(h-Y)^2/(4 D t))
   ══════════════════════════════════════════════════════════════ */
function traceXY(){
  const half = SCREEN_SIZE/2;
  const cot  = 1/Math.tan(S.theta*Math.PI/180);
  const m    = mag(), h = hInt(), Z = Zd(), c = xiMid();
  const live = S.tFirst && S.pour && cellInPath();
  let t=0,s=0,pre=0;
  if(live){
    t = S.pour.tEff(S.tDiff);
    s = 2*Math.sqrt(S.pour.D*t);
    pre = S.pour.C0/(s*Math.sqrt(Math.PI));
  }
  const xs=[], ys=[];
  for(let i=0;i<N_POINTS;i++){
    const xi = c - half + (2*half)*i/(N_POINTS-1);
    const x  = half + (xi - c)*cot;
    if(x < -1 || x > SCREEN_SIZE+1) continue;
    let y = half + (xi - c);
    if(live){
      const Y = xi/m;
      const dCdY = pre*Math.exp(-Math.pow((h-Y)/s,2));
      y = y - Z*CELL_D*S.pour.dndC*dCdY + S.pour.rough(xi);
    }
    xs.push(x); ys.push(y);
  }
  return [xs,ys];
}

/* ── hand-drawn pencil deviation ── */
function handWander(arc){
  const span = Math.max(arc[arc.length-1]-arc[0],1e-6);
  const base = norm(0,HAND_OFFSET);
  const out = arc.map(()=>base);
  for(let k=0;k<4;k++){
    const period = uni(0.25,1.0)*span, amp = norm(0,HAND_WANDER), ph = uni(0,2*Math.PI);
    for(let i=0;i<arc.length;i++) out[i] += amp*Math.sin(2*Math.PI*arc[i]/period + ph);
  }
  return out;
}

function drawLaser(){

  box3(c-0.9,c+0.9,yb-0.9,yb+0.9,-3.4,-0.7,BLACK2,{id:"laser"});          /* clamp arm */
  cyl3("y",yb-0.15,yb+0.15,c,-3.6,0.35,"#8b9095",{seg:8});               /* lock screw */
  cyl3("x",x-6.4,x-5.6,yb,0,1.05,"#333538",{id:"laser",seg:16});          /* focus ring */

      if(k==="laser") drawLaser(); else if(k==="cell") drawCell(); else drawScreen(); GA=null; setRef(k,sv); ST.on[k]=so; } }
  if(carry){ const k=carry.k; NOID=true;
    if(k==="pipette"&&S.dripping&&ST.on.cell){ const [x0,x1,,y1]=cellBox(); drawPipette([(x0+x1)/2,y1+1.5,0],true); }
    else { const p=onPlane(mouse[0],mouse[1],6); drawDeskItem(k,k==="pipette"?p:[p[0],6,p[2]],{vertical:k==="pipette"}); } NOID=false; }
}
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  if(S.dripping&&S.filled&&carry&&carry.k==="pipette"&&S.pip>0){
    S.dropCredit+=dt*WDROP_RATE; const landed=Math.min(Math.floor(S.dropCredit),S.pip);
    if(landed>0){ S.dropCredit-=landed;
      if(S.wlevel<CELL_H-FILL_LINE-0.2){ if(!S.tFirst){ S.tFirst=true; S.tDiff=0; } S.drops+=landed; S.pip-=landed; S.wlevel=Math.min(S.wlevel+landed*WDROP_RISE,CELL_H-FILL_LINE-0.2); } }
    if(S.pip<=0){ S.dripping=false; say("pipEmpty"); }
  } else S.dropCredit=0;
  if(S.tFirst) S.tDiff+=dt*speed;
  if(S.watch.run) S.watch.t+=dt*speed;
  $("clock").textContent=fmtWatch(S.watch.t);
  const dpr=CAM.dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  if(view==="screen") view2Screen(CAM.W,CAM.H);
  else if(view==="cell") view2Cell(CAM.W,CAM.H);
  else if(view==="rail") view2Rail(CAM.W,CAM.H);
  else { const g=ctx.createLinearGradient(0,0,0,CAM.H); g.addColorStop(0,"#2a3038"); g.addColorStop(1,"#1b1f25"); ctx.fillStyle=g; ctx.fillRect(0,0,CAM.W,CAM.H);
    begin3(); drawScene3(); drawGhost(); render3(ctx); }
  if(++frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
