<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   LAB3D — a small orthographic 3-D bench renderer for canvas
   (the APhO 2026 bench style: a wooden desk seen from above at an
   angle; drag to turn it round, wheel to zoom, shift-drag to pan)

   World units are centimetres: x and z lie on the desk, y is up.
   Every frame the scene is described again as a list of faces, lines,
   texts and custom items; they are sorted far-to-near and painted.
   ══════════════════════════════════════════════════════════════ */
const CAM={yaw:-0.62, pitch:0.62, k:6, tx:40, ty:8, tz:0, px:0, py:0, W:1000, H:600, dpr:1};
const CAM0={};
function camSave(){ Object.assign(CAM0,{yaw:CAM.yaw,pitch:CAM.pitch,k:CAM.k,tx:CAM.tx,ty:CAM.ty,tz:CAM.tz,px:CAM.px,py:CAM.py}); }
function camReset(){ Object.assign(CAM,CAM0); }
/* world → [screen x, screen y, depth]; larger depth is nearer the eye */
function P3(x,y,z){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const dx=x-CAM.tx, dy=y-CAM.ty, dz=z-CAM.tz;
  const xr=dx*c-dz*s, zr=dx*s+dz*c;
  const up=dy*cp-zr*sp, dep=dy*sp+zr*cp;
  const sx=CAM.W/2+CAM.px+xr*CAM.k, sy=CAM.H/2+CAM.py-up*CAM.k;
  if(_REC) _REC.set(sx+","+sy,dep);
  return [sx, sy, dep];
}
/* screen point → world point on the horizontal plane y = h */
function onPlane(px,py,h){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  const zr=((h-CAM.ty)*cp-up)/sp;
  return [CAM.tx+xr*c+zr*s, h, CAM.tz-xr*s+zr*c];
}
/* screen point → world point on the vertical plane x = x0 (for things mounted on a rail) */
function onPlaneX(px,py,x0){
  const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw), cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const xr=(px-CAM.W/2-CAM.px)/CAM.k, up=-(py-CAM.H/2-CAM.py)/CAM.k;
  /* unknowns dz, dy with dx fixed: xr = dx c - dz s ; up = dy cp - (dx s + dz c) sp */
  const dx=x0-CAM.tx; if(Math.abs(s)<1e-4) return null;
  const dz=(dx*c-xr)/s, dy=(up+(dx*s+dz*c)*sp)/cp;
  return [x0, CAM.ty+dy, CAM.tz+dz];
}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const _shadeCache=new Map();
function shade(col,f){
  const key=col+"|"+f.toFixed(2); let v=_shadeCache.get(key); if(v) return v;
  let a=1, rgb;
  if(col.startsWith("rgba")){ const m=col.match(/[\d.]+/g).map(Number); rgb=m.slice(0,3); a=m[3]; } else rgb=hex2rgb(col);
  const r=rgb.map(c=>Math.max(0,Math.min(255,Math.round(c*f))));
  v=a<1?`rgba(${r[0]},${r[1]},${r[2]},${a})`:`rgb(${r[0]},${r[1]},${r[2]})`;
  _shadeCache.set(key,v); return v;
}
const LIGHT=(()=>{ const v=[-0.45,0.85,0.35], n=Math.hypot(...v); return v.map(a=>a/n); })();
let ITEMS=[], HITS=[], _REC=null;
function begin3(){ ITEMS=[]; }
function _cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
function _sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
/* a flat polygon; o = {fill, stroke, lw, id, layer, cull, flat, bias, alpha} */
function face(pts,o){
  o=o||{};
  const n=_cross(_sub(pts[1],pts[0]),_sub(pts[2],pts[0])), nl=Math.hypot(...n)||1;
  const nn=n.map(a=>a/nl);
  const lum=o.flat?1:0.62+0.48*Math.max(0,nn[0]*LIGHT[0]+nn[1]*LIGHT[1]+nn[2]*LIGHT[2]);
  ITEMS.push({t:"f",p:pts,o,lum,n:nn});
}
function quad(a,b,c,d,o){ face([a,b,c,d],o); }
/* axis-aligned box, outward faces culled when they point away */
function box3(x0,x1,y0,y1,z0,z1,col,o){
  o=Object.assign({cull:true},o||{}); const f=Object.assign({},o,{fill:col});
  const t=o.top?Object.assign({},f,{fill:o.top}):f;
  if(!o.noTop) face([[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],t);          /* top    +y */
  if(!o.noBot) face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],f);          /* bottom -y */
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f);          /* +z */
  face([[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],f);          /* -z */
  face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],f);          /* +x */
  face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],f);          /* -x */
}
/* make a polygon face the direction `want` (a world vector) */
function orient(pts,want){
  const n=_cross(_sub(pts[1],pts[0]),_sub(pts[2],pts[0]));
  return (n[0]*want[0]+n[1]*want[1]+n[2]*want[2])<0?pts.slice().reverse():pts;
}
/* cylinder (or cone, with o.r1) along an axis ("x","y","z") from a0 to a1, centre (u,v) across it */
function cyl3(axis,a0,a1,u,v,r,col,o){
  o=Object.assign({cull:true,seg:18},o||{}); const N=o.seg, f=Object.assign({},o,{fill:col});
  const r1=o.r1===undefined?r:o.r1;
  const W=(a,cu,cv)=>axis==="x"?[a,cu,cv]:axis==="y"?[cu,a,cv]:[cu,cv,a];
  const pt=(a,rr,ang)=>W(a,u+rr*Math.cos(ang),v+rr*Math.sin(ang));
  const ax=W(1,0,0).map((c,i)=>c-W(0,0,0)[i]), sg=a1>=a0?1:-1;
  for(let i=0;i<N;i++){
    const t0=i/N*2*Math.PI, t1=(i+1)/N*2*Math.PI, tm=(t0+t1)/2;
    const q=[pt(a0,r,t0),pt(a0,r,t1),pt(a1,r1,t1),pt(a1,r1,t0)];
    const rad=_sub(pt(a0,1,tm),pt(a0,0,tm));
    face(orient(q,rad),Object.assign({},f,{smooth:true}));
  }
  if(o.caps!==false){
    const c0=[],c1=[]; for(let i=0;i<N;i++){ const t=i/N*2*Math.PI; c0.push(pt(a0,r,t)); c1.push(pt(a1,r1,t)); }
    const cf=Object.assign({},f,o.cap?{fill:o.cap}:{},{stroke:o.capStroke});
    if(r>0.001&&o.cap0!==false) face(orient(c0,ax.map(c=>-c*sg)),cf);
    if(r1>0.001&&o.cap1!==false) face(orient(c1,ax.map(c=>c*sg)),cf);
  }
}
/* a prism: polygon pts2 [[u,v]..] in the plane across `axis`, extruded from a0 to a1 */
function prism3(axis,a0,a1,pts2,col,o){
  o=Object.assign({cull:true},o||{}); const f=Object.assign({},o,{fill:col});
  const P=(a,[u,v])=>axis==="x"?[a,u,v]:axis==="y"?[u,a,v]:[u,v,a];
  const n=pts2.length, A=pts2.map(p=>P(a0,p)), B=pts2.map(p=>P(a1,p));
  const ax=_sub(P(1,[0,0]),P(0,[0,0])), sg=a1>=a0?1:-1;
  let cu=0,cvv=0; for(const [x,y] of pts2){ cu+=x; cvv+=y; } cu/=n; cvv/=n;
  face(orient(A,ax.map(c=>-c*sg)),f); face(orient(B,ax.map(c=>c*sg)),f);
  for(let i=0;i<n;i++){ const j=(i+1)%n; const q=[A[i],A[j],B[j],B[i]];
    const mid=[(pts2[i][0]+pts2[j][0])/2-cu,(pts2[i][1]+pts2[j][1])/2-cvv];
    face(orient(q,_sub(P(0,mid),P(0,[0,0]))),f); }
}
/* tall parts cut into short slices, so each slice is sorted at its own height
   (one long face sorted by its centre is what makes posts jump in front of things) */
function boxY(x0,x1,y0,y1,z0,z1,col,o,step){ const n=Math.max(1,Math.ceil((y1-y0)/(step||1)));
  for(let i=0;i<n;i++) box3(x0,x1,y0+(y1-y0)*i/n,y0+(y1-y0)*(i+1)/n,z0,z1,col,Object.assign({},o,{noTop:i<n-1,noBot:i>0})); }
function cylSeg(axis,a0,a1,u,v,r,col,o,step){ const n=Math.max(1,Math.ceil(Math.abs(a1-a0)/(step||1)));
  for(let i=0;i<n;i++) cyl3(axis,a0+(a1-a0)*i/n,a0+(a1-a0)*(i+1)/n,u,v,r,col,Object.assign({},o,{cap0:i===0&&(o||{}).cap0!==false,cap1:i===n-1&&(o||{}).cap1!==false})); }
function line3(a,b,col,lw,o){ ITEMS.push({t:"l",p:[a,b],o:Object.assign({col,lw:lw||1},o||{})}); }
function poly3(pts,col,lw,o){ ITEMS.push({t:"pl",p:pts,o:Object.assign({col,lw:lw||1},o||{})}); }
/* text lying in the plane spanned by U (right) and V (up), size in cm */
function text3(O,U,V,str,size,col,o){ ITEMS.push({t:"x",p:[O],O,U,V,str,size,o:Object.assign({col},o||{})}); }
/* anything else: draw(ctx) is called in its depth order; ref is a world point */
function custom3(ref,draw,o){ ITEMS.push({t:"c",p:[ref],draw,o:o||{}}); }

function render3_2d(ctx){
  const vis=[];
  for(const it of ITEMS){
    const q=it.p.map(p=>P3(p[0],p[1],p[2]));
    let dep=0; for(const v of q) dep+=v[2]; dep/=q.length;
    if(it.t==="f"&&it.o.cull){
      let a=0; for(let i=0;i<q.length;i++){ const j=(i+1)%q.length; a+=q[i][0]*q[j][1]-q[j][0]*q[i][1]; }
      if(a>=0) continue;                                  /* facing away */
    }
    vis.push({it,q,dep:dep+(it.o.bias||0),layer:it.o.layer||0});
  }
  vis.sort((a,b)=>a.layer-b.layer||a.dep-b.dep);
  HITS=[];
  for(const v of vis){
    const it=v.it, o=it.o, q=v.q;
    if(it.t==="f"){
      ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]); ctx.closePath();
      if(o.fill){ if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.fillStyle=o.flat?o.fill:shade(o.fill,it.lum); ctx.fill(); ctx.globalAlpha=1; }
      if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=o.lw||0.8; ctx.lineJoin="round"; ctx.stroke(); }
      else if(o.fill&&o.alpha===undefined){ ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=0.6; ctx.stroke(); }
      if(o.id) HITS.push([o.id,q]);

function pick3(x,y){

/* ══════════════════════════════════════════════════════════════
   1.  APPARATUS  —  identical to the Python constants
   ══════════════════════════════════════════════════════════════ */
const RAIL_LEN=85.0, SCREEN_SIZE=30.0, CELL_D=0.8, CELL_W=6.5, CELL_H=9.5;
const CELL_FOOT=1.8, FILL_LINE=5.0, BENCH_TOP=33.0;     /* the glass bottom sits 1.8 cm above the rail (frame + mounting plate) */
const LASER_X=0.0, LASER_Y0=5.3, CELL_X0=10.4, SCREEN_X0=64.6, SCREEN_Y0=17.8;
const LASER_Y_RANGE=[3.6,8.8], SCREEN_Y_RANGE=[16.8,26.0], CELL_X_RANGE=[3.0,40.0];

/* ── physics constants (calibrated to the official marking scheme) ── */
const D_A=2.29e-5, D_B=-5.25e-5;        // D(C0)      [cm^2/s]
const DNDC_A=0.2036, DNDC_B=-0.420;     // dn/dC(C0)  [mL/g]
const SIG_MASS=0.25, SIG_VOLUME=1.0, SIG_D_REL=0.025, SIG_H=0.06;
const SIG_STOP=2.0, SIG_ROUGH=0.006;
const HAND_OFFSET=0.010, HAND_WANDER=0.011;
/* the pipette: the diffusion starts with the first drop, not with the stopwatch */
/* a drop from the plastic pipette is about 0.045 mL; the problem asks for about 40 of them down the side channel,
   slowly: one drop per click, or one every 0.45 s while the bulb is held pressed */
const WDROP_ML=0.045, WDROPS_DEFAULT=40, DRIP_GAP=0.45, PIP_MAX=60, DROP_FALL_G=600, PIP_DY=1.4, PLUNGE_T=900;
const N_POINTS=2200, PRESET_CONC=[23.0,28.0,33.0];
/* pouring and the cell's inside: 3.4 mL per cm of height, liquid floor 0.15 cm above the glass bottom */
const HOLD_MS=250;                    /* with a bottle or the pipette: a click on the cell opens its close-up, a longer press pours or drips */
const A_IN=3.4, LIQ0=0.15, POUR_Q=7.0, TILT_MAX=2.2, TILT_FLOW=1.5, HAZE_T=25, CABLE=32, TERM_Y=1.75;
const HZ={t:0};

/* ── random helpers (replaces numpy.random.default_rng) ── */
const uni=(a,b)=>a+Math.random()*(b-a);
function norm(mu,sd){                       // Box–Muller
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

/* ══════════════════════════════════════════════════════════════
   2.  Pour  —  one filling of the cell; all errors drawn once
        (direct transcription of the Python class)
   ══════════════════════════════════════════════════════════════ */
/* each bottle was made up once: its own weighing and volume errors stay with it */
const BOTTLE={};
function bottleC(g){ if(BOTTLE[g]===undefined){ const mass=g+norm(0,SIG_MASS), vol=150+norm(0,SIG_VOLUME); BOTTLE[g]=Math.max(mass,0.1)/Math.max(vol,1.0); } return BOTTLE[g]; }
class Pour{
  constructor(grams){
    this.grams = grams;
    this.Cb    = bottleC(grams);                                   // g/mL in the bottle
    this.dRel  = norm(0,SIG_D_REL);
    this.setC0(this.Cb);
    this.dh    = norm(0,SIG_H);                                    // cm
    this.t_off = norm(0,SIG_STOP);
    this._k=[], this._p=[], this._a=[];
    for(let i=0;i<6;i++){
      this._k.push(uni(0.3,1.8));
      this._p.push(uni(0,2*Math.PI));
      this._a.push(norm(0,SIG_ROUGH));
    }
  }
  /* the salt layer's concentration once it is mixed with what was in the cell */
  setC0(c){ this.C0=c; this.D=Math.max((D_A+D_B*c)*(1+this.dRel),1e-6); this.dndC=DNDC_A+DNDC_B*c; }
  tEff(tDiff){ return Math.max(tDiff, 1.0); }
  rough(xi){
    let s=0;
    for(let i=0;i<6;i++) s += this._a[i]*Math.sin(this._k[i]*xi + this._p[i]);
    return s;
  }
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */

const RAD={batt:5,watch:5,s23:3.8,s28:3.8,s33:3.8,water:3.8,pipette:6,bucket:10.5,tissue:5.6,knife:9};
const beamOn=()=>ST.on.laser&&ST.on.batt&&S.conn&&S.sw;
const onScreen=()=>beamOn()&&ST.on.screen&&S.screenX>S.laserX+3;
const cellInPath=()=>ST.on.cell&&!S.cellOut&&S.cellX>S.laserX+0.5&&S.cellX+CELL_D<S.screenX;
const Z0  = ()=> S.cellX - S.laserX;
const Zd  = ()=> S.screenX - S.cellX - CELL_D;
const mag = ()=> (Z0() + CELL_D + Zd())/Math.max(Z0(),1e-3);
const hInt= ()=> CELL_FOOT + S.saltLv - S.laserY + (S.pour ? S.pour.dh : 0);
const xiMid=()=> S.screenY - S.laserY;

/* ══════════════════════════════════════════════════════════════
   4.  THE PHYSICS  —  trace_xy()
        xi     = Y (Z0 + d + Z)/Z0
        delta  = Z d (dn/dY)
        dn/dY  = (dn/dC) C0 /(2 sqrt(pi D t)) exp(-(h-Y)^2/(4 D t))
   ══════════════════════════════════════════════════════════════ */
function traceXY(){
  const half = SCREEN_SIZE/2;
  const cot  = 1/Math.tan(S.theta*Math.PI/180);
  const m    = mag(), h = hInt(), Z = Zd(), c = xiMid();
  const live = S.tFirst && S.pour && cellInPath();
  let t=0,s=0,pre=0;
  if(live){
    t = S.pour.tEff(S.tDiff+S.mixT);
    s = 2*Math.sqrt(S.pour.D*t);
    pre = S.pour.C0/(s*Math.sqrt(Math.PI));
  }
  const xs=[], ys=[];
  for(let i=0;i<N_POINTS;i++){
    const xi = c - half + (2*half)*i/(N_POINTS-1);
    const x  = half + (xi - c)*cot;
    if(x < -1 || x > SCREEN_SIZE+1) continue;
    let y = half + (xi - c);
    if(live){
      const Y = xi/m;
      const dCdY = pre*Math.exp(-Math.pow((h-Y)/s,2));
      y = y - Z*CELL_D*S.pour.dndC*dCdY + S.pour.rough(xi);
      if(S.haze>0.004) y += S.haze*0.28*Math.exp(-Math.pow((h-Y)/(s+0.25),2))*(Math.sin(2.1*xi+HZ.t*7.3)+0.6*Math.sin(5.3*xi-HZ.t*11.1+1.3));   /* schlieren while the new water settles */
    }
    xs.push(x); ys.push(y);
  }
  return [xs,ys];
}

/* ── hand-drawn pencil deviation ── */
function handWander(arc){
  const span = Math.max(arc[arc.length-1]-arc[0],1e-6);
  const base = norm(0,HAND_OFFSET);
  const out = arc.map(()=>base);
  for(let k=0;k<4;k++){
    const period = uni(0.25,1.0)*span, amp = norm(0,HAND_WANDER), ph = uni(0,2*Math.PI);
    for(let i=0;i<arc.length;i++) out[i] += amp*Math.sin(2*Math.PI*arc[i]/period + ph);
  }
  return out;
}

function erfc(x){ const z=Math.abs(x), t=1/(1+0.5*z);

/* the close-ups of the cell and of the rail are the 3-D bench itself, looked at square from the side and

  const [x0,,y0]=cellBox();

/* the laser's light sheet where it meets the cell's near glass face: a red line tilted by θ */

/* where a drop from the pipette lands: the side channel (correct), the open top over the salt (ruins the

const INLET_HW=0.42; let VCAM=null;

function dropSpot(z){ const z1=CELL_W/2, lz0=-CELL_W/2+0.15, lz1=z1-0.15;

function releaseDrop(){ if(S.pip<1) return; S.pip-=1; const [,,,y1]=cellBox(); S.fall.push({z:S.pipZ,y:y1+PIP_DY-0.1,vy:0}); }
function updDrops(dt){ if(!S.fall.length) return; const [,,y0,y1]=cellBox();

    const floor=spot==="open"?y0+(S.filled?S.saltLv+S.wlevel:LIQ0):y1;

const RAIL_ITEMS=new Set(["laser","cell","screen"]);
function deskFree(k,x,z){
  const r=RAD[k]; if(x-r<-40||x+r>135||z-r<-35||z+r>55) return false;
  if(Math.abs(z)<3.4+r+3&&x+r>-6&&x-r<97) return false;             /* the rail and its feet */
  if(x+r>80&&x-r<99&&Math.abs(z)<11+r) return false;
  for(const o of DESK_ITEMS){ if(o===k||!ST.on[o]||(carry&&carry.k===o)) continue; const q=ST.pos[o]; if(Math.hypot(q[0]-x,q[2]-z)<RAD[o]+r+0.6) return false; }
  return true; }
function railPoint(px,py){ const p=onPlane(px,py,RT); return Math.abs(p[2])<6?p:null; }
function placeFromHand(px,py,id){
  const k=hand.k;
  if(RAIL_ITEMS.has(k)){ const p=railPoint(px,py); if(!p){ say("noFitRail"); return; }
    const x=Math.round((p[0]-BASE_OFF[k])*10)/10; if(!railFits(k,x)){ say("noFitRail"); return; }
    setRef(k,x); ST.on[k]=true; hand=null; updConn(); say("placed",itemName(k)); return; }
  if(k==="paper"){ if(id!=="screen"){ say("needScreen"); return; } ST.on.paper=true; hand=null; say("paperOn"); return; }
  const p=onPlane(px,py,0); if(!deskFree(k,p[0],p[2])){ say("noFitDesk"); return; }
  ST.pos[k]=[p[0],0,p[2]]; ST.on[k]=true; hand=null; say("placed",itemName(k));
}
/* put down whatever is in the hand: the cell goes back to its holder, a tissue is thrown away */
function dropCarry(){
  if(!carry) return;
  if(carry.k==="cell"){ S.cellOut=false; say("cellBack"); }
  else if(carry.k==="sheet") say("sheetDrop");
  carry=null; S.dripping=false; S.wiping=false; S.pourB=null; S.suck=null;
}
function liftCell(){
  if(!ST.on.cell||S.cellOut) return;
  S.cellOut=true; carry={k:"cell"}; const sl=S.slosh; sl.th=sl.om=sl.thx=sl.omx=0; sl.v=[0,0]; sl.p=null; sl.warn=0; sl.mixed=false;
  S.dripping=false; say("cellLift");
}
const PL_R=q=>Math.sqrt(q.vol)*1.25+0.4;
function addPuddle(x,z,vol){
  for(const q of S.puddles) if(Math.hypot(q.x-x,q.z-z)<PL_R(q)+1){ q.vol+=vol; return; }
  S.puddles.push({x,z,vol,ph:Math.random()*6.28});
}
const isSalt=k=>k&&k[0]==="s"&&k.length===3;
/* the mean concentration of everything in the cell (what is left behind when it is emptied) */
function mixC(){ if(!S.pour) return S.res.C; const Vs=Math.max(0,S.saltLv-LIQ0)*A_IN, Vw=S.wlevel*A_IN; return Vs+Vw>0.05?S.pour.C0*Vs/(Vs+Vw):S.pour.C0; }
function leaveResidue(){ const C=mixC(); S.res={vol:uni(0.25,0.9),C}; S.cellWet=true; }
/* salt solution running in: mixes with what is already in the cell (an old, unwiped residue included) */
function addSalt(k,dV){
  const g=+k.slice(1), Cb=bottleC(g);
  if(!S.filled){ S.pour=new Pour(g); S.conc=g; S.filled=true; S.saltLv=LIQ0+S.res.vol/A_IN; S.pour.setC0(S.res.vol>0?S.res.C:Cb);
    S.wlevel=0; S.drops=0; S.tFirst=false; S.tDiff=0; S.mixT=0; S.haze=0; S.res={vol:0,C:0}; S.cellWet=false; }
  const Vs=Math.max(0,S.saltLv-LIQ0)*A_IN; S.pour.setC0((S.pour.C0*Vs+Cb*dV)/(Vs+dV)); S.saltLv+=dV/A_IN;
  const top=CELL_H-0.12; if(S.saltLv>top){ addPuddle(S.cellX+0.4,BASE_D/2+1.4,(S.saltLv-top)*A_IN); S.saltLv=top;
    if(!S.pourB.spilt){ S.pourB.spilt=true; say("overflow"); } }
}
function startPour(k){
  if(!ST.on.cell||S.cellOut){ say(ST.on.cell?"cellOutNow":"needCell"); return; }
  if(S.tFirst||S.wlevel>0.01){ say("hasWater"); return; }
  S.pourB={k,tilt:S.pourB?S.pourB.tilt:0,on:true,flow:0,t:0,vol:0,spilt:false};
}
function endPour(){ const pb=S.pourB; if(!pb||!pb.on) return; pb.on=false;
  if(pb.vol>0.3) say(S.saltLv>FILL_LINE+0.25?"overLine":"poured",+pb.k.slice(1)); }
function updPour(dt){ const pb=S.pourB; if(!pb) return;
  pb.t+=dt; pb.tilt=Math.max(0,Math.min(TILT_MAX,pb.tilt+(pb.on?3.2:-4)*dt));
  const glug=0.78+0.26*Math.sin(2*Math.PI*4.2*pb.t)+0.08*Math.sin(2*Math.PI*9.7*pb.t);       /* air gulping back in: 콸콸 */
  pb.flow=pb.tilt>TILT_FLOW?POUR_Q*glug*Math.min(1,(pb.tilt-TILT_FLOW)/(TILT_MAX-TILT_FLOW)):0;
  if(pb.flow>0&&!pb.said){ pb.said=true; const g=+pb.k.slice(1); say(S.filled?"pourMore":S.cellWet?"wetPour":"pourStart",g); }
  if(pb.flow>0){ const dV=pb.flow*dt; pb.vol+=dV; addSalt(pb.k,dV); S.turb=1;
    const lv=S.saltLv; let n=pb.flow*6*dt; while(n>0&&S.bub.length<70){ if(Math.random()<n) S.bub.push({dx:uni(-0.18,0.18),z:uni(-1.4,0.9),y:uni(LIQ0+0.1,Math.max(LIQ0+0.2,lv-0.1)),r:uni(0.025,0.075),vy:uni(1.2,3.5)}); n-=1; } }
  if(!pb.on&&pb.tilt<=0) S.pourB=null;
}
function startSuck(){
  if(!S.capOpen){ S.capOpen=true; say("capOpenP"); return; }
  S.suck={on:true,sq:1,p0:Math.min(S.pip,PIP_MAX)}; say("suck");
}
function endSuck(){ if(!S.suck||!S.suck.on) return; S.suck=null; say(S.pip>=PIP_MAX-0.5?"filled":"sucked",Math.floor(S.pip)); }
function dumpCell(){ leaveResidue(); S.filled=false; S.pour=null; S.wlevel=0; S.saltLv=FILL_LINE; S.tFirst=false; S.tDiff=0; S.mixT=0; S.drops=0; S.haze=0; S.bub.length=0; }
function returnItem(k){
  if(k==="batt") for(const key of ["r","b"]) if(S.clip[key].at){ const E=termPos(S.clip[key].at); looseAt(key,[E[0],0.05,E[2]]); }
  if(k==="laser") for(const key of ["r","b"]) S.clip[key]={at:null,rel:null,drag:null};
  if(k==="water") S.capOpen=false;
  if(k==="watch"){ S.watch.run=false; S.watch.t=0; }
  if(k==="cell"&&S.cellOut){ say("cellOutNow"); return; }
  if(k==="cell"&&S.filled){ say("cellFirst"); return; }
  if(k==="screen") ST.on.paper=false;
  ST.on[k]=false; updConn(); say("back",itemName(k));
}
function watchPress(w){ if(!ST.on.watch){ say("needWatch"); return; }
  if(w==="ss"){ S.watch.run=!S.watch.run; say(S.watch.run?"wsStart":"wsStop"); } else if(!S.watch.run){ S.watch.t=0; say("wsReset"); } }
function useCarried(px,py,id){
  const k=carry.k;
  if(isSalt(k)&&id==="cell"){ startPour(k); return; }
  if(k==="pipette"){

  const sx=p[0]+Math.sign(sl.thx)*0.6, sz=p[2]+Math.sign(sl.th)*3.6, b=ST.on.bucket&&ST.pos.bucket;
  if(b&&Math.hypot(b[0]-sx,b[2]-sz)<9.5){ if(performance.now()-(sl.warn||0)>1500){ say("spillBucket"); sl.warn=performance.now(); } return; }
  addPuddle(sx,sz,vol); if(performance.now()-(sl.warn||0)>1500){ say("spill"); sl.warn=performance.now(); }
}
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  requestAnimationFrame(tick);
  try{ frame(); tick.bad=0; }catch(err){ if(!tick.warned){ tick.warned=true; console.error(err); }
    if(++tick.bad>30&&GL3.ok===true&&!view){ GL3.ok=false; tick.bad=0; } }
}
function frame(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now; HZ.t+=dt;
  if(carry&&isSalt(carry.k)) updPour(dt); else S.pourB=null;
  if(S.suck){ if(!(carry&&carry.k==="pipette")) S.suck=null; else { S.suck.sq=Math.max(0,S.suck.sq-dt*0.55); S.pip=S.suck.p0+(PIP_MAX-S.suck.p0)*(1-S.suck.sq); S.bulb=S.suck.sq;
    if(S.suck.sq<=0) endSuck(); } }
  else if(S.dripping&&carry&&carry.k==="pipette") S.bulb+=((0.25+0.7*(1-S.pip/PIP_MAX))-S.bulb)*Math.min(1,dt*6);
  else S.bulb=Math.max(0,S.bulb-dt*2.5);
  S.turb=Math.max(0,S.turb-dt*1.2);
  if(S.haze>0) S.haze*=Math.exp(-dt*speed/HAZE_T);
  if(S.bub.length){ const lv=S.filled?S.saltLv+S.wlevel:0; for(const b of S.bub){ b.y+=b.vy*dt; b.z+=Math.sin(HZ.t*5+b.vy*7)*dt*0.3; }
    S.bub=S.bub.filter(b=>b.y<lv-0.04); }
  for(const key of ["r","b"]){ const c=S.clip[key]; if(c.at&&ST.on.batt&&!c.drag){ const A=leadStart(key), E=termPos(c.at);   /* pulled off when the holder goes too far */
    if(Math.hypot(E[0]-A[0],E[2]-A[2])>CABLE+2){ looseAt(key,[A[0]+(E[0]-A[0])*0.9,0.05,A[2]+(E[2]-A[2])*0.9]); updConn(); say("pulled"); } } }
  if(S.dripping&&carry&&carry.k==="pipette"&&view==="cell"){
    if(S.pip>=1&&HZ.t>=S.dripNext){ releaseDrop(); S.dripNext+=DRIP_GAP; if(S.dripNext<HZ.t) S.dripNext=HZ.t+DRIP_GAP; }
    if(S.pip<1){ S.dripping=false; say("pipEmpty"); } }
  else S.dripping=false;
  updDrops(dt);
  if(carry&&carry.k==="cell") slosh(dt);
  if(S.tFirst) S.tDiff+=dt*speed;
  if(S.watch.run) S.watch.t+=dt*speed;
  $("clock").textContent=ST.on.watch?fmtWatch(S.watch.t):"--:--.--";
  $("clock").style.opacity=ST.on.watch?1:0.4; $("btnSS").disabled=$("btnRst").disabled=!ST.on.watch;
  const dpr=CAM.dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  if(view==="screen"){ ctx.fillStyle="#15181d"; ctx.fillRect(0,0,CAM.W,CAM.H); ctx.setTransform(dpr*V2.k,0,0,dpr*V2.k,dpr*V2.px,dpr*V2.py); view2Screen(CAM.W,CAM.H); }
  else if(view) view3Side(view,CAM.W,CAM.H);
  else { const g=ctx.createLinearGradient(0,0,0,CAM.H); g.addColorStop(0,"#2a3038"); g.addColorStop(1,"#1b1f25"); ctx.fillStyle=g; ctx.fillRect(0,0,CAM.W,CAM.H);
    begin3(); drawScene3(); drawGhost(); render3(ctx); }
  if(++frameN%6===0){ renderStatus(); drawTray(); }
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
