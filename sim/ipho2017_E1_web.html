    st:{none:"부품함에서 레이저 모듈, 확산 셀, 스크린을 꺼내 레일 위에 놓으세요.", noBatt:"레이저에 배터리를 연결하세요 (부품함 12).",
        off:"배터리 스위치가 꺼져 있습니다.", drops:n=>"떨어뜨린 증류수: "+n+" 방울", full:"셀이 가득 찼습니다."},
    m:{picked:n=>n+" 을(를) 집었습니다 — 놓을 곳을 클릭하세요. (우클릭: 되돌리기)", placed:n=>n+" 을(를) 놓았습니다.",
       back:n=>n+" 을(를) 부품함에 넣었습니다.", noFit:"그곳에는 놓을 수 없습니다 — 레일 위의 빈 자리를 고르세요.",
       noFitT:"그곳에는 놓을 수 없습니다 — 레일 앞 책상 위의 빈 자리를 고르세요.",
       paperOn:"모눈종이를 스크린에 붙였습니다.", paperOff:"모눈종이를 떼어 냈습니다.", needScreen:"먼저 스크린을 레일에 놓으세요.",
       needCell:"먼저 확산 셀을 레일에 놓으세요.", poured:g=>"셀에 소금물 ("+g+" g / 150 mL)을 흰 선까지 부었습니다.",
       notEmpty:"셀이 비어 있지 않습니다 — 우클릭으로 비우고 헹구세요.", needFill:"셀에 소금물이 없습니다.",
       emptied:"셀을 비우고 헹궜습니다.", sw:s=>"레이저 스위치: "+s, noPaperT:"스크린에 모눈종이가 없습니다.",
       noLine:"스크린에 레이저 선이 보이지 않습니다.", traced:"레이저 선을 연필로 따라 그렸습니다.", fresh:"새 모눈종이로 바꿨습니다.",
       wsStart:"스톱워치 시작", wsStop:"스톱워치 정지", wsReset:"스톱워치 리셋", needWatch:"먼저 스톱워치를 책상에 놓으세요.",
       jumped:"확산이 30분 지점까지 진행되었습니다.", noDiff:"아직 확산이 시작되지 않았습니다 (증류수를 떨어뜨리세요).",
       moveRail:n=>n+" — 레일을 따라 옮기는 중", moveH:n=>n+" — 높이를 바꾸는 중", cellFilled:"소금물이 든 셀은 그대로 우클릭하면 먼저 비웁니다."}
  },
  en:{
    title:"IPhO 2017 Experiment 1 — Refractive index gradient and diffusion coefficient of salt solution from laser deflection",
    sub:"Virtual laboratory · take the line laser module, the diffusion cell and the screen out of the parts box and put them on the optical rail, pour a salt solution, drip distilled water on top and trace the bent laser line on the millimetre paper. Nothing is computed for you.",
    trayTitle:"Parts box", trayTake:"click to pick up", trayOut:"in use", trayAlways:"click to pick up (reusable)",
    trayHelp:"L-click pick/place, R-click return\ndrag and drop works too",
    cap:"the optical rail (side view) — drag a base to slide along the rail, drag the body to change the height / R-click return",
    closeCap:"the screen, face on — millimetre block paper (30 × 30 cm, fine 1 mm · bold 1 cm) · a loupe magnifies around the cursor",

    timeHint:"Diffusion really takes tens of minutes. Keep 1× while you drip the water and press the stopwatch.",
    hLaser:"1. Line laser module", focus:"focus (rotate the back of the laser)", theta:"rotation of the laser (angle of the line)",
    hWatch:"7. Stopwatch", ss:"start / stop", rst:"reset",
    hPaper:"8. Millimetre block paper", trace:"trace the laser line with a pencil", fresh:"fresh sheet", png:"save the sheet as PNG",

    st:{none:"Take the line laser module, the diffusion cell and the screen out of the box and put them on the rail.", noBatt:"Connect the battery to the laser (box item 12).",

       noLine:"There is no laser line on the screen.", traced:"The laser line traced with a pencil.", fresh:"Fresh sheet of paper.",

let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";
const $=id=>document.getElementById(id);
const d=()=>T[lang];
/* ══════════════════════════════════════════════════════════════
   1.  APPARATUS  —  identical to the Python constants
   ══════════════════════════════════════════════════════════════ */
const RAIL_LEN=85.0, SCREEN_SIZE=30.0, CELL_D=0.8, CELL_W=6.5, CELL_H=9.5;
const CELL_FOOT=1.0, FILL_LINE=5.0, BENCH_TOP=33.0;
const LASER_X=0.0, LASER_Y0=4.5, CELL_X0=10.4, SCREEN_X0=64.6, SCREEN_Y0=15.0;
const LASER_Y_RANGE=[2.5,8.0], SCREEN_Y_RANGE=[9.0,24.0], CELL_X_RANGE=[3.0,40.0];

/* ── physics constants (calibrated to the official marking scheme) ── */
const D_A=2.29e-5, D_B=-5.25e-5;        // D(C0)      [cm^2/s]
const DNDC_A=0.2036, DNDC_B=-0.420;     // dn/dC(C0)  [mL/g]
const SIG_MASS=0.25, SIG_VOLUME=1.0, SIG_D_REL=0.025, SIG_H=0.06;
const SIG_STOP=2.0, SIG_ROUGH=0.006;
const HAND_OFFSET=0.010, HAND_WANDER=0.011;
/* the pipette: the diffusion starts with the first drop, not with the stopwatch */
const WDROP_RISE=0.075, WDROPS_DEFAULT=40, WDROP_RATE=6.0;
const N_POINTS=2200, PRESET_CONC=[23.0,28.0,33.0];

/* ── random helpers (replaces numpy.random.default_rng) ── */
const uni=(a,b)=>a+Math.random()*(b-a);
function norm(mu,sd){                       // Box–Muller
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

/* ══════════════════════════════════════════════════════════════
   2.  Pour  —  one filling of the cell; all errors drawn once
        (direct transcription of the Python class)
   ══════════════════════════════════════════════════════════════ */
class Pour{
  constructor(grams, volume=150.0){
    this.grams = grams;
    const mass = grams + norm(0,SIG_MASS);
    const vol  = volume + norm(0,SIG_VOLUME);
    this.C0    = Math.max(mass,0.1)/Math.max(vol,1.0);            // g/mL
    this.D     = Math.max((D_A+D_B*this.C0)*(1+norm(0,SIG_D_REL)), 1e-6);
    this.dndC  = DNDC_A + DNDC_B*this.C0;                          // mL/g
    this.dh    = norm(0,SIG_H);                                    // cm
    this.t_off = norm(0,SIG_STOP);
    this._k=[], this._p=[], this._a=[];
    for(let i=0;i<6;i++){
      this._k.push(uni(0.3,1.8));
      this._p.push(uni(0,2*Math.PI));
      this._a.push(norm(0,SIG_ROUGH));
    }
  }
  tEff(tDiff){ return Math.max(tDiff, 1.0); }
  rough(xi){
    let s=0;
    for(let i=0;i<6;i++) s += this._a[i]*Math.sin(this._k[i]*xi + this._p[i]);
    return s;
  }
}

/* ══════════════════════════════════════════════════════════════
   3.  STATE  —  every position is a rail reading in cm
        laserX  : the cylindrical lens       cellX : the front face of the cell
        screenX : the paper face of the screen
        laserY  : beam height above the rail top, screenY : centre of the screen
   ══════════════════════════════════════════════════════════════ */
const S={
  laserX:2.0, laserY:LASER_Y0, cellX:CELL_X0, screenX:SCREEN_X0, screenY:SCREEN_Y0,
  sw:false, focus:0.35, theta:45.0,
  pour:null, filled:false, conc:23, wlevel:0.0, dripping:false, dropCredit:0, drops:0,
  tFirst:false, tDiff:0.0,
  watch:{run:false,t:0}, paper:false, pencil:[]
};
const ST={ on:{laser:false,cell:false,screen:false,paper:false,batt:false,watch:false,s23:false,s28:false,s33:false,pipette:false},
  pos:{batt:{x:150,y:560},watch:{x:900,y:565}} };
const beamOn=()=>ST.on.laser&&ST.on.batt&&S.sw;
const onScreen=()=>beamOn()&&ST.on.screen&&S.screenX>S.laserX+3;
const cellInPath=()=>ST.on.cell&&S.cellX>S.laserX+0.5&&S.cellX+CELL_D<S.screenX;

/* ── geometry (the Python @property block, with the laser free on the rail) ── */
const Z0  = ()=> S.cellX - S.laserX;
const Zd  = ()=> S.screenX - S.cellX - CELL_D;
const mag = ()=> (Z0() + CELL_D + Zd())/Math.max(Z0(),1e-3);
const hInt= ()=> CELL_FOOT + FILL_LINE - S.laserY + (S.pour ? S.pour.dh : 0);
const xiMid=()=> S.screenY - S.laserY;

/* ══════════════════════════════════════════════════════════════
   4.  THE PHYSICS  —  trace_xy()
        xi     = Y (Z0 + d + Z)/Z0
        delta  = Z d (dn/dY)
        dn/dY  = (dn/dC) C0 /(2 sqrt(pi D t)) exp(-(h-Y)^2/(4 D t))
   ══════════════════════════════════════════════════════════════ */
function traceXY(){
  const half = SCREEN_SIZE/2;
  const cot  = 1/Math.tan(S.theta*Math.PI/180);
  const m    = mag(), h = hInt(), Z = Zd(), c = xiMid();
  const live = S.tFirst && S.pour && cellInPath();
  let t=0,s=0,pre=0;
  if(live){
    t = S.pour.tEff(S.tDiff);
    s = 2*Math.sqrt(S.pour.D*t);
    pre = S.pour.C0/(s*Math.sqrt(Math.PI));
  }
  const xs=[], ys=[];
  for(let i=0;i<N_POINTS;i++){
    const xi = c - half + (2*half)*i/(N_POINTS-1);
    const x  = half + (xi - c)*cot;
    if(x < -1 || x > SCREEN_SIZE+1) continue;
    let y = half + (xi - c);
    if(live){
      const Y = xi/m;
      const dCdY = pre*Math.exp(-Math.pow((h-Y)/s,2));
      y = y - Z*CELL_D*S.pour.dndC*dCdY + S.pour.rough(xi);
    }
    xs.push(x); ys.push(y);
  }
  return [xs,ys];

/* ── hand-drawn pencil deviation ── */
function handWander(arc){
  const span = Math.max(arc[arc.length-1]-arc[0],1e-6);
  const base = norm(0,HAND_OFFSET);
  const out = arc.map(()=>base);
  for(let k=0;k<4;k++){
    const period = uni(0.25,1.0)*span, amp = norm(0,HAND_WANDER), ph = uni(0,2*Math.PI);
    for(let i=0;i<arc.length;i++) out[i] += amp*Math.sin(2*Math.PI*arc[i]/period + ph);
  }
  return out;
}


/* ══════════════════════════════════════════════════════════════

/* carriers: the base is 5.2 cm long and sits a fixed distance from the index mark */

/* ── the scene ── */
function drawBackdrop(){

function drawRail(){

}
function drawBase(k,label){

function rod(x,y0,y1){ const g=ctx.createLinearGradient(x-2,0,x+2,0); g.addColorStop(0,"#9aa0a6"); g.addColorStop(.5,"#eef1f4"); g.addColorStop(1,"#8a9096");

function drawLaser(){

function drawBattery(){ const b=ST.pos.batt, [w,h]=TSZ.batt;

const WATCH_BTN=()=>{ const q=ST.pos.watch; return {ss:[q.x+26,q.y-56],rs:[q.x-26,q.y-56]}; };

function drawHand(){

/* the loupe over the rail scale (vector redraw, so the millimetre ticks stay sharp) */
function drawLoupe(){

const trayCv=$("tray"), trayCtx=trayCv.getContext("2d"), benchCtx=ctx;

function lpos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/SC,(e.clientY-r.top)/SC]; }

  if(k==="laser"){ const x=S.laserX, y=Yh(S.laserY); return p[0]>X(x-5.8)&&p[0]<X(x+0.6)&&p[1]>y-22&&p[1]<RY-12; }
  if(k==="cell"){ const x=S.cellX; return p[0]>X(x-1)&&p[0]<X(x+CELL_D+1)&&p[1]>Yh(CELL_FOOT+CELL_H)-6&&p[1]<RY-12; }
  if(k==="screen"){ const x=S.screenX; return p[0]>X(x-0.8)&&p[0]<X(x+1.6)&&p[1]>Yh(S.screenY+SCREEN_SIZE/2)-4&&p[1]<RY-12; }
  return false; }
function hitCellGlass(p){ if(!ST.on.cell) return false; const x=S.cellX;
  return p[0]>X(x-1.5)&&p[0]<X(x+CELL_D+1.5)&&p[1]>Yh(CELL_FOOT+CELL_H)-60&&p[1]<Yh(CELL_FOOT); }
function hitTable(k,p){ if(!ST.on[k]) return false; const q=ST.pos[k], [w,h]=TSZ[k]; return Math.abs(p[0]-q.x)<=w/2&&Math.abs(p[1]-q.y)<=h/2; }
const near=(p,q,r)=>Math.hypot(p[0]-q[0],p[1]-q[1])<r;

function returnItem(k){
  if(k==="screen"&&ST.on.paper){ ST.on.paper=false; }
  if(k==="cell"){ S.filled=false; S.pour=null; S.wlevel=0; S.tFirst=false; S.tDiff=0; S.drops=0; }
  ST.on[k]=false; say("back",itemName(k));
}
function emptyCell(){ S.filled=false; S.pour=null; S.wlevel=0; S.tFirst=false; S.tDiff=0; S.drops=0; say("emptied"); }
function watchPress(which){
  if(!ST.on.watch){ say("needWatch"); return; }
  if(which==="ss"){ S.watch.run=!S.watch.run; say(S.watch.run?"wsStart":"wsStop"); }
  else if(!S.watch.run){ S.watch.t=0; say("wsReset"); }
}
function putDown(p){
  const k=hand.k;
  if(k==="laser"||k==="cell"||k==="screen"){
    if(p[1]>TABLE_Y||p[1]<40){ say("noFit"); return; }
    const x=Math.round((cmX(p[0])-BASE_OFF[k])*10)/10;
    if(!railFits(k,x)){ say("noFit"); return; }
    setRef(k,x); ST.on[k]=true; hand=null; say("placed",itemName(k)); return; }
  if(k==="batt"||k==="watch"){
    if(!tableFits(k,p[0],p[1])){ say("noFitT"); return; }
    ST.pos[k]={x:p[0],y:p[1]}; ST.on[k]=true; hand=null; say("placed",itemName(k)); return; }
  if(k==="paper"){
    if(!ST.on.screen){ say("needScreen"); return; }
    if(!hitBody("screen",p)){ say("noFit"); return; }
    ST.on.paper=true; hand=null; say("paperOn"); return; }
  if(k[0]==="s"){
    if(!ST.on.cell){ say("needCell"); return; }
    if(!hitCellGlass(p)){ say("noFit"); return; }
    if(S.filled){ say("notEmpty"); return; }
    const g=+k.slice(1); S.conc=g; S.pour=new Pour(g); S.filled=true; S.wlevel=0; S.drops=0; S.tFirst=false; S.tDiff=0;
    hand=null; say("poured",g); return; }
}
function benchDown(p,right){
  if(hand){
    if(right){ hand=null; return; }
    if(hand.k==="pipette"){
      if(hitCellGlass(p)){ if(!S.filled){ say("needFill"); return; } S.dripping=true; return; }
      say("needCell"); return; }
    putDown(p); return;
  }
  if(right){
    if(ST.on.batt&&hitTable("batt",p)){ returnItem("batt"); return; }
    if(ST.on.watch&&hitTable("watch",p)){ returnItem("watch"); return; }
    for(const k of ["screen","cell","laser"]) if(ST.on[k]&&(hitBase(k,p)||hitBody(k,p))){
      if(k==="screen"&&ST.on.paper&&hitBody(k,p)){ ST.on.paper=false; say("paperOff"); return; }
      if(k==="cell"&&S.filled){ emptyCell(); return; }
      returnItem(k); return; }
    return;
  }
  if(ST.on.batt){ const b=ST.pos.batt, sx=b.x+TSZ.batt[0]/2-16; if(Math.abs(p[0]-sx)<11&&Math.abs(p[1]-b.y)<17){ S.sw=!S.sw; say("sw",S.sw?d().lab.on:d().lab.off); return; } }
  if(ST.on.watch){ const B=WATCH_BTN(); if(near(p,B.ss,12)){ watchPress("ss"); return; } if(near(p,B.rs,12)){ watchPress("rs"); return; } }
  for(const k of ["screen","cell","laser"]) if(ST.on[k]){
    if(hitBase(k,p)){ drag={k,mode:"x",dx:refX(k)-cmX(p[0])}; say("moveRail",itemName(k)); return; }
    if(hitBody(k,p)){ if(k==="cell") drag={k,mode:"x",dx:refX(k)-cmX(p[0])};
      else drag={k,mode:"y",dy:(k==="laser"?S.laserY:S.screenY)-cmH(p[1])};
      say(k==="cell"?"moveRail":"moveH",itemName(k)); return; } }
  for(const k of ["batt","watch"]) if(hitTable(k,p)){ drag={k,mode:"t",ox:ST.pos[k].x-p[0],oy:ST.pos[k].y-p[1]}; return; }
}
function benchMove(p){
  if(!drag) return; const k=drag.k;
  if(drag.mode==="x"){ const x=Math.round((cmX(p[0])+drag.dx)*10)/10; if(railFits(k,x)) setRef(k,x); }
  else if(drag.mode==="y"){ const v=cmH(p[1])+drag.dy;
    if(k==="laser") S.laserY=clamp(v,...LASER_Y_RANGE); else S.screenY=clamp(v,...SCREEN_Y_RANGE); }
  else { const x=p[0]+drag.ox, y=p[1]+drag.oy; if(tableFits(k,x,y)) ST.pos[k]={x,y}; }
}
let trayDrag=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerenter",()=>{ overBench=true; });
cv.addEventListener("pointerleave",()=>{ overBench=false; });
cv.addEventListener("pointermove",e=>{ mouse=lpos(e); benchMove(mouse); });
cv.addEventListener("pointerdown",e=>{ const p=lpos(e); mouse=p; if(e.button!==2) cv.setPointerCapture(e.pointerId); benchDown(p,e.button===2); drawTray(); });
const endDrag=()=>{ drag=null; S.dripping=false; };
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
window.addEventListener("pointerup",e=>{ endDrag(); if(trayDrag&&hand&&e.target===cv){ const p=lpos(e); mouse=p; putDown(p); drawTray(); } trayDrag=false; });
trayCv.addEventListener("contextmenu",e=>{ e.preventDefault(); if(hand){ hand=null; drawTray(); } });
trayCv.addEventListener("pointerdown",e=>{
  if(e.button!==0) return; const r=trayCv.getBoundingClientRect(), y=e.clientY-r.top; trayDrag=true;
  for(const [k,y0,y1] of trayCells){ if(y<y0||y>y1) continue;
    const same=hand&&hand.k===k; hand=null;
    if(!same&&trayAvail(k)){ hand={k}; say("picked",itemName(k)); } drawTray(); return; } });

/* ══════════════════════════════════════════════════════════════
   8.  CLOSE-UP: THE SCREEN, FACE ON
   ══════════════════════════════════════════════════════════════ */
const closeCv=$("closeCv"), cctx=closeCv.getContext("2d");
let CW=600, ps=20;
function paperScene(c){
  /* draws the 30 × 30 cm screen in cm units (y up) */
  c.fillStyle=ST.on.paper?"#fdfefe":"#f1f0ea"; c.fillRect(0,0,SCREEN_SIZE,SCREEN_SIZE);
  if(ST.on.paper){
    c.strokeStyle="#cfe0ef"; c.lineWidth=0.012; c.beginPath();
    for(let k=0;k<=SCREEN_SIZE+1e-6;k+=0.1){ c.moveTo(k,0); c.lineTo(k,SCREEN_SIZE); c.moveTo(0,k); c.lineTo(SCREEN_SIZE,k); }
    c.stroke();
    c.strokeStyle="#cadbe9"; c.lineWidth=0.022; c.beginPath();
    for(let k=0;k<=SCREEN_SIZE+1e-6;k+=0.5){ c.moveTo(k,0); c.lineTo(k,SCREEN_SIZE); c.moveTo(0,k); c.lineTo(SCREEN_SIZE,k); }
    c.stroke();
    c.strokeStyle="#7fa8c9"; c.lineWidth=0.035; c.beginPath();
    for(let k=0;k<=SCREEN_SIZE+1e-6;k+=1){ c.moveTo(k,0); c.lineTo(k,SCREEN_SIZE); c.moveTo(0,k); c.lineTo(SCREEN_SIZE,k); }
    c.stroke();
    c.lineJoin="round"; c.lineCap="round";
    for(const t of S.pencil){ c.strokeStyle=t.col; c.lineWidth=t.lw*0.045; c.beginPath();
      for(let i=0;i<t.x.length;i++){ i?c.lineTo(t.x[i],t.y[i]):c.moveTo(t.x[i],t.y[i]); } c.stroke(); }
  }
  if(onScreen()){
    const [xs,ys]=traceXY(); if(xs.length){
      c.strokeStyle="#d81010"; c.lineWidth=(0.9+7.0*Math.pow(S.focus,1.6))*0.05; c.globalAlpha=0.95-0.45*S.focus;
      c.lineJoin="round"; c.lineCap="round"; c.beginPath();
      for(let i=0;i<xs.length;i++){ i?c.lineTo(xs[i],ys[i]):c.moveTo(xs[i],ys[i]); } c.stroke(); c.globalAlpha=1; }
  }
}
let cMouse=null;
function drawClose(){
  const dpr=Math.min(window.devicePixelRatio||1,2), c=cctx, M=14;
  c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#15181d"; c.fillRect(0,0,CW,CW);
  if(!ST.on.screen){ c.fillStyle="#69717a"; c.font="14px "+FONT; c.textAlign="center"; c.textBaseline="middle"; c.fillText(d().lab.noScreen,CW/2,CW/2); return; }
  c.fillStyle="#0c0c0c"; c.fillRect(M-10,M-10,CW-2*M+20,CW-2*M+20);
  c.save(); c.translate(M,CW-M); c.scale(ps,-ps); c.beginPath(); c.rect(0,0,SCREEN_SIZE,SCREEN_SIZE); c.clip(); paperScene(c); c.restore();
  if(!ST.on.paper){ c.fillStyle="rgba(20,24,29,.78)"; c.fillRect(M,M+6,CW-2*M,26); c.fillStyle="#f2c14e"; c.font="12px "+FONT; c.textAlign="center"; c.textBaseline="middle"; c.fillText(d().lab.noPaper,CW/2,M+19); }
  if(cMouse){
    const [mx,my]=cMouse, R=82, Z=4, ux=(mx-M)/ps, uy=(CW-M-my)/ps;
    if(ux>=0&&ux<=SCREEN_SIZE&&uy>=0&&uy<=SCREEN_SIZE){
      c.save(); c.beginPath(); c.arc(mx,my,R,0,7); c.clip(); c.fillStyle="#fff"; c.fillRect(mx-R,my-R,2*R,2*R);
      c.translate(mx,my); c.scale(ps*Z,-ps*Z); c.translate(-ux,-uy); paperScene(c); c.restore();
      c.strokeStyle="#333"; c.lineWidth=3; c.beginPath(); c.arc(mx,my,R,0,7); c.stroke();
    }
  }
}
closeCv.addEventListener("pointermove",e=>{ const r=closeCv.getBoundingClientRect(); cMouse=[e.clientX-r.left,e.clientY-r.top]; });
closeCv.addEventListener("pointerleave",()=>{ cMouse=null; });

/* ══════════════════════════════════════════════════════════════
   9.  PANEL, LAYOUT AND MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
function layout(){
  const w=cv.clientWidth||1000, dpr=Math.min(window.devicePixelRatio||1,2);
  SC=w/LW; cv.width=Math.round(w*dpr); cv.height=Math.round(LH*SC*dpr); cv.style.height=(LH*SC)+"px";
  benchCtx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
  const tdpr=window.devicePixelRatio||1, tr=trayCv.parentElement.getBoundingClientRect();
  TRW=Math.max(150,Math.floor(tr.width-16)); TRH=TRAY_LIST.length*TROW+50;
  trayCv.style.height=TRH+"px"; trayCv.width=Math.round(TRW*tdpr); trayCv.height=Math.round(TRH*tdpr);
  CW=Math.min(closeCv.parentElement.clientWidth-20,720); ps=(CW-28)/SCREEN_SIZE;
  closeCv.style.width=CW+"px"; closeCv.style.height=CW+"px"; closeCv.width=Math.round(CW*dpr); closeCv.height=Math.round(CW*dpr);
  drawTray();
}
function renderSpeeds(){ const box=$("speeds"); box.innerHTML="";
  for(const s of [1,10,30,60,300]){ const b=document.createElement("button"); b.textContent=s+"×"; b.className=s===speed?"on":"";
    b.onclick=()=>{ speed=s; renderSpeeds(); }; box.appendChild(b); } }
function renderStatus(){
  const L=[], t=d();
  if(!ST.on.laser||!ST.on.cell||!ST.on.screen) L.push([t.st.none,false]);
  else if(!ST.on.batt) L.push([t.st.noBatt,false]);
  else if(!S.sw) L.push([t.st.off,false]);
  if(S.filled&&S.drops>0) L.push([t.st.drops(S.drops),false]);
  if(S.filled&&S.wlevel>=CELL_H-FILL_LINE-0.2) L.push([t.st.full,true]);
  if(msg.key&&performance.now()-msg.t<9000){ const f=t.m[msg.key]; if(f!==undefined) L.push(["• "+(typeof f==="function"?f(...msg.args):f),false]); }
  const box=$("status"); box.innerHTML="";
  for(const [s,w] of L){ const el=document.createElement("div"); el.textContent=s; if(w) el.className="w"; box.appendChild(el); }
}
$("focus").oninput=e=>{ S.focus=parseFloat(e.target.value); };
$("theta").oninput=e=>{ S.theta=parseFloat(e.target.value); };
$("btnJump").onclick=()=>{ if(!S.tFirst){ say("noDiff"); return; } const add=Math.max(0,1800-S.tDiff); S.tDiff+=add; if(S.watch.run) S.watch.t+=add; say("jumped"); };
$("btnSS").onclick=()=>watchPress("ss");
$("btnRst").onclick=()=>watchPress("rs");
$("btnTrace").onclick=()=>{
  if(!ST.on.paper){ say("noPaperT"); return; }
  if(!onScreen()){ say("noLine"); return; }
  const [xs,ys]=traceXY(); if(!xs.length){ say("noLine"); return; }
  const arc=[0]; for(let i=1;i<xs.length;i++) arc.push(arc[i-1]+Math.hypot(xs[i]-xs[i-1],ys[i]-ys[i-1]));
  const wx=handWander(arc), wy=handWander(arc), g=Math.round(uni(74,100));
  S.pencil.push({x:xs.map((v,i)=>v+wx[i]), y:ys.map((v,i)=>v+wy[i]), lw:uni(0.75,1.05), col:`rgb(${g},${g+4},${g+8})`});
  say("traced");
};
$("btnFresh").onclick=()=>{ S.pencil.length=0; say("fresh"); };
$("btnPng").onclick=()=>{
  const N=1500, off=document.createElement("canvas"); off.width=N; off.height=N; const c=off.getContext("2d");
  const sv=ST.on.screen, pv=ST.on.paper, lv=S.sw; ST.on.paper=true; S.sw=false;
  c.translate(0,N); c.scale(N/SCREEN_SIZE,-N/SCREEN_SIZE); paperScene(c); ST.on.paper=pv; S.sw=lv; ST.on.screen=sv;
  const a=document.createElement("a"); a.download="mm_paper.png"; a.href=off.toDataURL("image/png"); a.click();
};
function applyLang(){
  const t=d(); document.documentElement.lang=lang;
  $("t-title").textContent=t.title; $("t-sub").textContent=t.sub; $("t-tray").textContent=t.trayTitle;
  $("t-cap").textContent=t.cap; $("t-closecap").textContent=t.closeCap;
  $("t-h-time").textContent=t.hTime; $("btnJump").textContent=t.jump; $("t-timehint").textContent=t.timeHint;
  $("t-h-laser").textContent=t.hLaser; $("t-focus").textContent=t.focus; $("t-theta").textContent=t.theta;
  $("t-h-watch").textContent=t.hWatch; $("btnSS").textContent=t.ss; $("btnRst").textContent=t.rst;
  $("t-h-paper").textContent=t.hPaper; $("btnTrace").textContent=t.trace; $("btnFresh").textContent=t.fresh; $("btnPng").textContent=t.png;
  $("t-hint").textContent=t.hint;
  $("btn-ko").className=lang==="ko"?"on":""; $("btn-en").className=lang==="en"?"on":"";
  document.title=lang==="ko"?"IPhO 2017 E1 — 소금 용액의 광학 · HaslaLab":"IPhO 2017 E1 — Optics of a Salt Solution · HaslaLab";
  renderSpeeds(); layout();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };
let tPrev=performance.now()/1000, frameN=0;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0,now-tPrev)); tPrev=now;
  /* the pipette: the diffusion starts with the first drop */
  if(S.dripping&&S.filled&&hand&&hand.k==="pipette"){
    S.dropCredit+=dt*WDROP_RATE; const landed=Math.floor(S.dropCredit);
    if(landed>0){ S.dropCredit-=landed;
      if(S.wlevel<CELL_H-FILL_LINE-0.2){ if(!S.tFirst){ S.tFirst=true; S.tDiff=0; }
        S.drops+=landed; S.wlevel=Math.min(S.wlevel+landed*WDROP_RISE,CELL_H-FILL_LINE-0.2); } }
  } else S.dropCredit=0;
  if(S.tFirst) S.tDiff+=dt*speed;
  if(S.watch.run) S.watch.t+=dt*speed;
  $("clock").textContent=fmtWatch(S.watch.t);
  ctx.clearRect(0,0,LW,LH); drawBench(); drawClose();
  if(++frameN%6===0){ renderStatus(); drawTray(); }
  requestAnimationFrame(tick);
}
window.addEventListener("resize",layout);
applyLang(); requestAnimationFrame(tick);
</script>
