<body>
<script>
/* NBPhO 2012 problem 10 "Black box" on the 3-D bench.  Four leads A–D and one piece of wire.  Inside, as
   in the official solution: C–[battery, resistor, red LED]–D, D–[capacitor]–A, A–[green LED (the other
   way round), resistor]–B, the red and green LEDs showing through two holes.  Everything is the circuit
   solver (B3.Circuit): joining C and D lights the red lamp for good; joining A and C charges the
   capacitor through it and the light dies in about ten seconds (RC ≈ 5 s); joining D and B lets the
   charged capacitor out through the green one; joining A and D discharges the capacitor at once, with
   a spark if it was charged. */
var PROGRAM = {
  title: { ko: 'NBPhO 2012 실험 10 — 블랙박스', en: 'NBPhO 2012 Problem 10 — Black box' },
  subtitle: { ko: '블랙박스 속 전기 회로를 알아내세요. 도선과 저항 둘 외에 부품이 넷 더 들어 있습니다. 장비: 단자 넷이 나온 블랙박스, 도선 한 가닥.',
              en: 'Determine the electric circuit inside the black box. Apart from the wires and two resistors, the circuit includes four components. Equipment: the black box with four output leads and a piece of wire.' },
  notes: { ko: [
    '장비는 문제지 그대로 블랙박스와 도선 한 가닥뿐입니다 — 측정기가 없습니다. 상자 구멍으로 보이는 빨강 · 초록 램프와 불꽃이 단서입니다.',
    '회로는 공식 해답의 것(또는 전지와 다이오드 극성을 모두 뒤집은 것)입니다. 상자 속은 회로 해석기로 풀어, 축전기는 RC ≈ 5 초로 충전 · 방전합니다.',
    '공식 해답은 도선으로 여섯 가지 단자 쌍을 이어 보며 무슨 일이 생기는지로 회로를 좁혀 갑니다.'], en: [
    'As on the sheet, the equipment is the black box and one piece of wire — no meters. The red and green lamps seen through the box\'s holes, and sparks, are the clues.',
    'The circuit is the official solution\'s (or the same with the battery and both diodes reversed). The box is solved by the circuit solver, so the capacitor charges and discharges with RC ≈ 5 s.',
    'The official solution narrows it down by joining each of the six pairs of leads with the wire and watching what happens.'] }
};

var LAB = { leads: null, c: null, spark: 0 };
PROGRAM.lab = {
  intro: { ko: '책상 위: 단자 넷(A, B, C, D)이 나온 블랙박스 — 윗면의 작은 구멍 둘로 안의 램프가 보입니다 — 와 도선 한 가닥.',
           en: 'On the desk: the black box with four leads (A, B, C, D) — two small holes in its top show lamps inside — and one piece of wire.' },
  howto: { ko: ['도선: 단자를 클릭하면 한쪽 끝을 꽂고, 다른 단자를 클릭하면 반대쪽 끝을 꽂습니다. 꽂힌 끝을 클릭하면 뽑아 다시 들고, 책상을 클릭하면 내려놓습니다',
                '상자를 클릭하면 위에서 가까이 봅니다 — 구멍 속 램프가 켜졌는지',
                '도선은 한 가닥뿐입니다'],
           en: ['The wire: click a lead to plug one end in, click another to plug the other end. Click a plugged end to pull it out; click the desk to put it down',
                'Click the box to look down at it closely — are the lamps in the holes lit?',
                'There is only one wire'] },
  notePlaceholder: { ko: '예) C–D: 빨강 계속 켜짐 / A–C: 빨강 켜졌다 10초쯤에 꺼짐 / …', en: 'e.g. C–D: red stays on / A–C: red lights, fades in ~10 s / …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var flip = S.uni('flip', 0, 1) < 0.5;                                     /* the official circuit, or all of it reversed */
    var E = 4.5 * (1 + S.sys('E', 0.02)), R1 = 1000 * (1 + S.sys('R1', 0.05)), R2 = 1000 * (1 + S.sys('R2', 0.05)), Cap = 4700e-6 * (1 + S.sys('C', 0.1));
    var RED = { Is: 3e-3 / Math.exp(1.85 / (2 * 0.02585)), n: 2.0, Gl: 1e-10, Rs: 10 }, GRN = { Is: 3e-3 / Math.exp(2.1 / (2 * 0.02585)), n: 2.0, Gl: 1e-10, Rs: 10 };
    var leads = LAB.leads = new B3.Leads({ max: 1 }), c = LAB.c = new B3.Circuit();
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang,
      home: { yaw: -0.25, pitch: 0.85, k: 16, tx: 0, ty: 0, tz: 2 },
      views: { box: { yaw: 0, pitch: 1.2, k: 34, tx: 0, ty: 4, tz: 1, title: { ko: '블랙박스 (위에서)', en: 'The black box (from above)' },
                      hint: { ko: '단자를 클릭해 도선 꽂기 · 구멍 속 램프 보기 · Esc: 돌아가기', en: 'Click leads to plug the wire · watch the lamps in the holes · Esc: back' } } },
      frame: function (b) {
        B3.desk(-30, 30, -18, 20);
        var T = B3.blackBox(b, leads, 'box', [0, 2], [{ name: 'A', col: '#d8d8d8', label: 'A' }, { name: 'B', col: '#d8d8d8', label: 'B' }, { name: 'C', col: '#d8d8d8', label: 'C' }, { name: 'D', col: '#d8d8d8', label: 'D' }], { label: 'NBPhO 2012 · 10', w: 20, d: 10, h: 5 });
        /* the circuit: C–E–R1–red→D, D–C–A, A–green←–R2–B; flip turns battery and diodes round */
        c.reset();
        if (!flip) { c.V('box.n1', T.C, E, 0.5); c.R('box.n1', 'box.n2', R1); var dR = c.D('box.n2', T.D, RED); }
        else { c.V(T.C, 'box.n1', E, 0.5); c.R('box.n1', 'box.n2', R1); var dR = c.D(T.D, 'box.n2', RED); }
        var cap = c.C(T.D, T.A, Cap, 'cap');
        var dG = flip ? c.D(T.A, 'box.n3', GRN) : c.D('box.n3', T.A, GRN); c.R('box.n3', T.B, R2);
        var before = c.charge('cap');
        leads.wire(c);
        var n = Math.max(1, Math.ceil(b.dt / 0.02)), h = b.dt / n;
        for (var i = 0; i < n; i++) c.solve(h > 0 ? h : 1e-4);
        var after = c.charge('cap');
        if (Math.abs(before) > 0.8 && Math.abs(after) < 0.3 * Math.abs(before) && leads.joined(T.A, T.D)) { LAB.spark = 0.25; b.say('탁! 불꽃이 튀었습니다.', 'Snap! A spark.'); }
        if (LAB.spark > 0) { LAB.spark -= b.real; B3.sphere3([-6, 5.6, -3.2], 0.5 + Math.random() * 0.4, 'rgba(200,220,255,.9)'); }
        /* the two lamps under their holes */
        [[dR, '#ff2a1a', [4, 7]], [dG, '#22ff55', [-4, 7]]].forEach(function (q) { var I = Math.abs(c.cur(q[0])), on = I > 3e-5, col = q[1], p = [q[2][0], 5, -1];
          B3.cyl3('y', 4.95, 5.02, p[0], p[2], 0.7, '#050505', { seg: 16 });
          if (on) { var a = Math.min(1, I / 2.5e-3); B3.sphere3([p[0], 5.0, p[2]], 0.45, col);
            B3.sphere3([p[0], 5.3, p[2]], 0.9 + a * 0.8, 'rgba(' + parseInt(col.slice(1, 3), 16) + ',' + parseInt(col.slice(3, 5), 16) + ',' + parseInt(col.slice(5, 7), 16) + ',' + (0.15 + 0.35 * a).toFixed(2) + ')'); } });
        /* the piece of wire, lying on the desk until it is used */
        if (!leads.list.length && !leads.held) B3.cable([-4, 0.3, 14], [8, 0.3, 13], '#c0392b', 0.2, 2.4);
        leads.draw(b);
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
<script src="handlab.js"></script>
<script src="bench3d.js"></script>
<script src="instruments3d.js"></script>
