  .win{margin:0 auto;background:#f0f0f0;border:1px solid #8f8f8f;box-shadow:0 8px 28px -12px rgba(0,0,0,.45);
       display:flex;flex-direction:column;font:12px "Segoe UI",Tahoma,"Malgun Gothic",sans-serif;color:#000;
       user-select:none;-webkit-user-select:none}
  .cap{height:30px;flex:0 0 30px;background:#fff;display:flex;align-items:center;font-size:12px}
  .cap svg{margin:0 8px 0 9px}
  .cap .tt{flex:1}
  .cap .wb{width:46px;height:30px;display:flex;align-items:center;justify-content:center}
  .cap .wb:hover{background:#e5e5e5}
  .cap .wb.x:hover{background:#e81123}
  .cap .wb.x:hover svg path{stroke:#fff}
  .client{flex:1;display:flex;flex-direction:column;min-height:0}
  .nb{flex:1;display:flex;flex-direction:column;min-height:0}
  .nbtabs{display:flex;padding:2px 2px 0;position:relative;z-index:1;height:23px}
  .nbtabs div{padding:2px 6px 3px;border:1px solid #d9d9d9;border-bottom:0;margin-right:-1px;margin-top:2px;
       background:#f0f0f0;cursor:default;white-space:nowrap;height:19px;line-height:14px}
  .nbtabs div:hover{background:#d8eaf9;border-color:#3c7fb1}
  .nbtabs div.on{background:#fff;margin-top:0;height:22px;padding:3px 8px 3px;margin-left:-2px;margin-right:-3px;
       border-color:#d9d9d9;position:relative;z-index:2}
  .pane{flex:1;border:1px solid #d9d9d9;margin-top:-1px;display:flex;min-height:0;background:#f0f0f0}
  .lf{border:1px solid #dcdcdc;position:relative;padding:15px;margin:10px}
  .lf>.lfl{position:absolute;left:6px;top:-9px;background:#f0f0f0;padding:0 2px;line-height:16px;white-space:pre}
  .ctrl{display:grid;grid-template-columns:auto auto;align-content:start;column-gap:0;row-gap:0}
  .ctrl .lab{padding:5px 0;align-self:center;white-space:nowrap}
  .ent{width:88px;height:21px;border:1px solid #7a7a7a;background:#fff;font:12px "Segoe UI",Tahoma,sans-serif;
       padding:0 2px;outline:0;margin:5px;border-radius:0;color:#000}
  .ent:hover{border-color:#171717}
  .ent:focus{border-color:#0078d7}
  .tb{height:23px;border:1px solid #adadad;background:#e1e1e1;font:12px "Segoe UI",Tahoma,sans-serif;color:#000;
      padding:0 8px;cursor:default;position:relative;outline:0;border-radius:0}
  .tb:hover{background:#e5f1fb;border-color:#0078d7}
  .tb:active{background:#cce4f7;border-color:#005499}
  .tb.focus::after{content:"";position:absolute;inset:2px;border:1px dotted #000}
  .calc{grid-column:1/3;margin:20px 0}
  .plotf{flex:1;display:flex;flex-direction:column;margin:10px;min-width:0;min-height:0}
  .cvwrap{flex:1;position:relative;min-height:0;background:#fff}
  .cvwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .navbar{flex:0 0 auto;display:flex;align-items:center;border:2px solid #f0f0f0;height:40px;padding:0}
  .navbar .nbt{width:30px;height:30px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;
      background:#f0f0f0;cursor:default}
  .navbar .nbt img{width:24px;height:24px;display:block}
  .navbar .nbt:hover{border:1px solid #a0a0a0;box-shadow:inset 1px 1px #fff,inset -1px -1px #fff}
  .navbar .nbt.on{background:#dadada;border:1px solid #6f6f6f;box-shadow:inset 1px 1px #a0a0a0}
  .navbar .nbt.dis img{opacity:.35}
  .navbar .nbt.dis:hover{border-color:transparent;box-shadow:none}
  .navbar .sep{width:2px;height:24px;background:#a9a9a9;margin:0 4px;border-left:1px solid #8a8a8a}
  .navbar .msg{margin-left:auto;font-size:13.3px;white-space:pre;text-align:right;padding-right:4px;line-height:17px}
  .bottom{margin:10px;padding:10px 10px 10px 10px;display:flex;align-items:center}
  .bottom .lab{white-space:nowrap}
  .bottom .ent{width:74px}
  .dsub{display:flex;align-items:center;grid-column:1/3;margin:5px 0}
  .dsub .tb{width:32px;padding:0;margin:0 2px}
  .dsub .ent{width:64px;margin:0 2px;text-align:center}
  .dinfo{grid-column:1/3;font:bold 12px Arial,sans-serif;margin:10px 0;white-space:nowrap}

  /* message box and the subplot tool: Windows 10 dialogs */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
  .dlg{background:#fff;border:1px solid #8f8f8f;box-shadow:0 10px 32px -8px rgba(0,0,0,.5);min-width:300px;max-width:520px;
       font:12px "Segoe UI",Tahoma,"Malgun Gothic",sans-serif;user-select:none}
  .dlg .dcap{height:30px;display:flex;align-items:center;padding-left:10px}
  .dlg .dcap span{flex:1}
  .dlg .dbody{display:flex;gap:12px;align-items:flex-start;padding:16px 26px 24px 18px}
  .dlg .dbody p{margin:6px 0 0;white-space:pre-wrap;line-height:1.45}
  .dlg .dfoot{background:#f0f0f0;padding:11px 11px;display:flex;justify-content:flex-end}
  .dlg .dfoot .tb{width:88px;height:26px}
  .stool{position:fixed;z-index:40;background:#f0f0f0;border:1px solid #8f8f8f;box-shadow:0 10px 32px -8px rgba(0,0,0,.5);
         font:12px "Segoe UI",Tahoma,sans-serif;user-select:none}
  .stool .dcap{height:30px;display:flex;align-items:center;padding-left:8px;background:#fff;cursor:move}
  .stool .dcap span{flex:1;margin-left:6px}
  .stool canvas{display:block;background:#fff}
</style>

/* ── a small matplotlib 3.7 for one Axes: MaxNLocator('auto'), AutoMinorLocator,
      ScalarFormatter (offset, order of magnitude, sig. figures), format_data_short ── */
const MPL=(()=>{
  const STEPS=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20];         /* MaxNLocator._extended_steps */
  const log10=Math.log10, floor=Math.floor;
  /* Python's float divmod, which floor() of a quotient does not always reproduce */
  function pyDivmod(v,w){
    let mod=v%w, div=(v-mod)/w;
    if(mod){ if((w<0)!==(mod<0)){ mod+=w; div-=1; } } else mod=0*Math.sign(w);
    let fd;
    if(div){ fd=Math.floor(div); if(div-fd>0.5) fd+=1; } else fd=0*Math.sign(v/w);
    return [fd,mod];
  }
  const pyFloorDiv=(a,b)=>pyDivmod(a,b)[0];
  const pyMod=(a,b)=>pyDivmod(a,b)[1];
  function scaleRange(vmin,vmax,n){
    const dv=Math.abs(vmax-vmin), meanv=(vmax+vmin)/2;
    let offset=0;
    if(!(Math.abs(meanv)/dv<100)) offset=Math.sign(meanv)*Math.pow(10,floor(log10(Math.abs(meanv))));
    const scale=Math.pow(10,floor(log10(dv/n)));
    return [scale,offset];
  }
  function edge(step,offset){
    const closeto=(ms,e)=>{
      let tol;
      if(offset>0){const digits=log10(offset/step); tol=Math.max(1e-10,Math.pow(10,digits-12)); tol=Math.min(0.4999,tol);}
      else tol=1e-10;
      return Math.abs(ms-e)<tol;};
    return {
      le:x=>{const d=pyFloorDiv(x,step),m=pyMod(x,step); return closeto(m/step,1)?d+1:d;},
      ge:x=>{const d=pyFloorDiv(x,step),m=pyMod(x,step); return closeto(m/step,0)?d:d+1;}};
  }
  function nonsingular(a,b){
    if(!isFinite(a)||!isFinite(b)) return [-0.001,0.001];
    let flip=false; if(b<a){[a,b]=[b,a];flip=true;}
    const maxabs=Math.max(Math.abs(a),Math.abs(b));
    if(maxabs<(1e6/Number.MIN_VALUE)*Number.EPSILON*0 + 1e-300){ a=-0.001; b=0.001; }
    else if(b-a<=maxabs*1e-13){ if(b===0&&a===0){a=-0.001;b=0.001;} else {a-=1e-13*Math.abs(a); b+=1e-13*Math.abs(b);} }
    return flip?[b,a]:[a,b];
  }
  function majorTicks(vmin,vmax,nbins){
    [vmin,vmax]=nonsingular(vmin,vmax);
    const [scale,offset]=scaleRange(vmin,vmax,nbins);
    const _vmin=vmin-offset,_vmax=vmax-offset;
    const steps=STEPS.map(s=>s*scale);
    const raw=(_vmax-_vmin)/nbins;
    let istep=steps.findIndex(s=>s>=raw); if(istep<0) istep=steps.length-1;
    let ticks=[];
    for(let k=istep;k<steps.length;k++){
      const step=steps[k];
      const best=pyFloorDiv(_vmin,step)*step;
      const e=edge(step,offset);
      const low=e.le(_vmin-best), high=e.ge(_vmax-best);
      ticks=[]; for(let i=low;i<=high;i++) ticks.push(i*step+best);
      const n=ticks.filter(t=>t<=_vmax&&t>=_vmin).length;
      if(n>=2) break;
    }
    return ticks.map(t=>t+offset);
  }
  function minorTicks(maj,vmin,vmax){
    if(maj.length<2) return [];
    const ms=maj[1]-maj[0];
    const ne=Math.pow(10,pyMod(log10(ms),1));
    const ndivs=[1,2.5,5,10].some(v=>Math.abs(ne-v)<=1e-8+1e-5*v)?5:4;
    const st=ms/ndivs; if(vmin>vmax)[vmin,vmax]=[vmax,vmin];
    const t0=maj[0];
    const tmin=(pyFloorDiv(vmin-t0,st)+1)*st, tmax=(pyFloorDiv(vmax-t0,st)+1)*st;
    const out=[]; const n=Math.ceil((tmax-tmin)/st);
    for(let i=0;i<n;i++) out.push(tmin+i*st+t0);
    /* Axis drops minor ticks that sit on major ones */
    const tol=(maj[1]-maj[0])*1e-5;
    return out.filter(m=>!maj.some(M=>Math.abs(M-m)<tol));
  }
  const fixMinus=s=>s.replace(/-/g,"−");
  function fmtF(v,d){ let s=v.toFixed(d); if(/^-0\.?0*$/.test(s)) s=s.slice(1); return s; }
  function pctG(v,prec,alt){ /* printf %#.Ng (alt keeps trailing zeros) */
    if(v===0) return alt?(prec>1?"0."+"0".repeat(prec-1):"0."):"0";
    const P=prec===0?1:prec;
    const X=floor(log10(Math.abs(v)));
    let e=X; let r=Math.abs(v).toExponential(P-1); e=parseInt(r.split("e")[1]);
    let s;
    if(P>e && e>=-4){ s=v.toFixed(P-1-e); if(alt&&s.indexOf(".")<0) s+="."; if(!alt) s=s.replace(/\.?0+$/,""); }
    else { s=v.toExponential(P-1); let [m,ex]=s.split("e"); if(!alt) m=m.replace(/\.?0+$/,""); else if(m.indexOf(".")<0) m+=".";
      const en=parseInt(ex); s=m+"e"+(en<0?"-":"+")+String(Math.abs(en)).padStart(2,"0"); }
    return s;
  }
  function formatData(value){
    const e=floor(log10(Math.abs(value)));
    const s=Math.round(value/Math.pow(10,e)*1e10)/1e10;
    const sig=(s%1===0)?String(s):pctG(s,10,false);
    return e===0?sig:sig+"e"+e;

        const dxp=Math.abs((this.xlim[1]-this.xlim[0])/(g.x1-g.x0)), dyp=Math.abs((this.ylim[1]-this.ylim[0])/(g.y1-g.y0));
        this.setMessage("x="+MPL.short(xv,dxp)+" y="+MPL.short(yv,dyp));
        ov.style.cursor=this.mode==="zoom rect"?"crosshair":(this.mode==="pan/zoom"?"move":"");
      } else { if(!drag) this.setMessage(""); ov.style.cursor=""; }
    });
    const end=e=>{
      if(!drag) return; const d=drag; drag=null; this.rubber();
      if(this.mode==="zoom rect"&&d.qx!==undefined){
        const g=this.g, x0=Math.min(d.px,d.qx), x1=Math.max(d.px,d.qx), y0=Math.min(d.py,d.qy), y1=Math.max(d.py,d.qy);
        if(x1-x0<5||y1-y0<5){ return; }
        const toX=p=>d.v.x[0]+(p-g.x0)/(g.x1-g.x0)*(d.v.x[1]-d.v.x[0]);
        const toY=p=>d.v.y[0]+(g.y1-p)/(g.y1-g.y0)*(d.v.y[1]-d.v.y[0]);
        let nx=[toX(x0),toX(x1)], ny=[toY(y1),toY(y0)];
        if(d.b===3){ const [a,b]=d.v.x, [c2,e2]=d.v.y;
          const ax=(b-a)/(nx[1]-nx[0]), ay=(e2-c2)/(ny[1]-ny[0]);
          nx=[a-ax*(nx[0]-a), b+ax*(b-nx[1])]; ny=[c2-ay*(ny[0]-c2), e2+ay*(e2-ny[1])]; }
        this.xlim=nx; this.ylim=ny; this.draw(); this.push();
      } else if(this.mode==="pan/zoom"){ this.push(); }
    };
    ov.addEventListener("pointerup",end); ov.addEventListener("pointercancel",end);
    ov.addEventListener("pointerleave",()=>{ if(!drag){ this.setMessage(this.mode?"":""); } });
  }
  rubber(x0,y0,x1,y1){
    const c=this.ov.getContext("2d"), dpr=this.ov.width/(this.g?this.g.W:1);
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,this.ov.width,this.ov.height);
    if(x0===undefined) return; c.setTransform(dpr,0,0,dpr,0,0);
    const r=[Math.round(Math.min(x0,x1))+0.5,Math.round(Math.min(y0,y1))+0.5,Math.round(Math.abs(x1-x0)),Math.round(Math.abs(y1-y0))];
    c.lineWidth=1; c.strokeStyle="#000"; c.setLineDash([]); c.strokeRect(...r);
    c.strokeStyle="#fff"; c.setLineDash([3,3]); c.strokeRect(...r); c.setLineDash([]);
  }
  save(){ const g=this.geom(); const cv=document.createElement("canvas"); this.draw(cv);
    const a=document.createElement("a"); a.download="Figure_1.png"; a.href=cv.toDataURL("image/png"); a.click(); this.draw(); }
  /* configure_subplots: matplotlib's SubplotTool in its own window */
  subplotTool(){
    if(FigureTk.tool) FigureTk.tool.remove();
    const w=document.createElement("div"); w.className="stool"; FigureTk.tool=w;
    w.innerHTML='<div class="dcap"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M13.6 1.2c-3.9.6-7.2 3.4-8.6 7.3L3.3 13l.9.4 1.4-3.2c2.6-.4 5.2-1.9 6.6-4.4-1.1.3-2.2.3-3.3.1 1.5-.6 2.9-1.6 3.8-3 .5-.6.8-1.2.9-1.7z" fill="#4a7fbd"/></svg><span>Subplot configuration tool</span><span class="wbx" style="width:46px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="#000"/></svg></span></div><canvas></canvas>';
    const cv=w.querySelector("canvas"), W=600, H=300; cv.style.width=W+"px"; cv.style.height=H+"px";
    const dpr=Math.min(window.devicePixelRatio||1,3); cv.width=W*dpr; cv.height=H*dpr;
    const keys=["left","bottom","right","top","wspace","hspace"], init=Object.assign({},this.sub);
    const fs=BASE_FS*PT;
    const L={x0:0.2*W,x1:0.8*W}; const rowY=i=>H*(0.1+0.1*i)+fs*0.2;
    const bt=[{t:"Tight layout",x0:0.325,x1:0.475},{t:"Reset",x0:0.525,x1:0.675}];
    const lim=k=>k==="left"?[0,this.sub.right-0.001]:k==="right"?[this.sub.left+0.001,1]:k==="bottom"?[0,this.sub.top-0.001]:k==="top"?[this.sub.bottom+0.001,1]:[0,1];
    const draw=()=>{ const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.fillStyle="#fff"; c.fillRect(0,0,W,H);
      c.font=fs+"px "+FONT; c.textBaseline="middle";
      keys.forEach((k,i)=>{ const y=H-rowY(5-i)-H*0.02; const v=this.sub[k];
        c.fillStyle="#d3d3d3"; c.fillRect(L.x0,y-2.5,L.x1-L.x0,5);
        const px=L.x0+v*(L.x1-L.x0);
        c.fillStyle="#1f77b4"; c.fillRect(L.x0,y-2.5,px-L.x0,5);
        c.beginPath(); c.arc(px,y,6,0,2*Math.PI); c.fillStyle="#fff"; c.fill(); c.strokeStyle="#808080"; c.lineWidth=1; c.stroke();
        c.fillStyle="#000"; c.textAlign="right"; c.fillText(k,L.x0-10,y); c.textAlign="left"; c.fillText(v.toFixed(3),L.x1+10,y); });
      bt.forEach(b=>{ const x=b.x0*W, y=H*0.85, bw=(b.x1-b.x0)*W, bh=H*0.08; c.fillStyle=b.hot?"#f2f2f2":"#d9d9d9";
        c.fillRect(x,y,bw,bh); c.fillStyle="#000"; c.textAlign="center"; c.fillText(b.t,x+bw/2,y+bh/2); }); };
    let dragK=null;
    const at=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
    cv.onpointerdown=e=>{ const [x,y]=at(e);
      for(const b of bt){ if(x>=b.x0*W&&x<=b.x1*W&&y>=H*0.85&&y<=H*0.93){
        if(b.t==="Reset") Object.assign(this.sub,init); else Object.assign(this.sub,{left:0.09,bottom:0.1,right:0.98,top:0.92});
        draw(); this.draw(); return; } }
      keys.forEach((k,i)=>{ const yy=H-rowY(5-i)-H*0.02; if(Math.abs(y-yy)<10&&x>=L.x0-8&&x<=L.x1+8) dragK=k; });
      if(dragK){ cv.setPointerCapture(e.pointerId); cv.onpointermove(e); } };
    cv.onpointermove=e=>{ if(!dragK) return; const [x]=at(e); const [a,b]=lim(dragK);
      this.sub[dragK]=Math.min(b,Math.max(a,(x-L.x0)/(L.x1-L.x0))); draw(); this.draw(); };
    cv.onpointerup=()=>{dragK=null;};
    w.querySelector(".wbx").onclick=()=>{w.remove();FigureTk.tool=null;};
    const cap=w.querySelector(".dcap"); let mv=null;
    cap.onpointerdown=e=>{ if(e.target.closest(".wbx")) return; mv=[e.clientX-w.offsetLeft,e.clientY-w.offsetTop]; cap.setPointerCapture(e.pointerId); };
    cap.onpointermove=e=>{ if(mv){ w.style.left=(e.clientX-mv[0])+"px"; w.style.top=(e.clientY-mv[1])+"px"; } };
    cap.onpointerup=()=>{mv=null;};
    document.body.appendChild(w);
    w.style.left=Math.max(8,(innerWidth-W)/2)+"px"; w.style.top=Math.max(8,(innerHeight-H)/2-40)+"px";
    draw();
  }
}

/* ─────────────────────────── ttk helpers ─────────────────────────── */
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined)e.textContent=txt; return e; }
function entry(v,cls){ const e=el("input","ent"+(cls?" "+cls:"")); e.value=v; e.spellcheck=false; return e; }
function button(t,fn,cls){ const b=el("button","tb"+(cls?" "+cls:""),t);
  b.onmousedown=e=>e.preventDefault(); b.onclick=fn; return b; }
function labelFrame(title){ const f=el("div","lf ctrl"); f.appendChild(el("span","lfl",title)); return f; }
const setEnt=(e,s)=>{ e.value=s; };

/* ─────────────────────────────── FBGApp ─────────────────────────────── */
const app={};
const tabs=[]; let active=0;
function addTab(label,setup){
  const t=el("div","",label); const p=el("div",""); p.style.cssText="display:none;flex:1;min-width:0;min-height:0";
  $("tabs").appendChild(t); $("pane").appendChild(p);
  const i=tabs.length; tabs.push({t,p});
  t.onmousedown=e=>{ e.preventDefault(); select(i); };
  setup(p);
}
function select(i){
  if(i===active&&tabs[i].p.style.display==="flex") return;
  const ae=document.activeElement; if(ae&&tabs[active].p.contains(ae)) ae.blur();   /* ttk moves the focus off the old pane */
  active=i; tabs.forEach((q,k)=>{ q.t.className=k===i?"on":""; q.p.style.display=k===i?"flex":"none"; });
  on_tab_change();
}
function on_tab_change(){ reset_limits_panel(); [plot_part_a,plot_part_c,plot_part_d,plot_part_e1,plot_part_e2,plot_part_f][active](); }
function reset_limits_panel(){ setEnt($("wlmin"),LAMBDA_MIN.toFixed(1)); setEnt($("wlmax"),LAMBDA_MAX.toFixed(1)); }
function get_wl_limits(){
  try{ const a=pyFloat($("wlmin").value), b=pyFloat($("wlmax").value);
    if(a<b&&a>=1540&&b<=1560) return [a,b]; throw new ValueError(); }
  catch(e){ if(!(e instanceof ValueError)) throw e;
    reset_limits_panel(); warn("bounds"); }
  return [1540.0,1560.0];
}
function apply_global_limits(){
  try{ const a=pyFloat($("wlmin").value), b=pyFloat($("wlmax").value);
    if(a>=b){ error("less"); return; }
    if(a<=0||b<=0){ error("positive"); return; } }
  catch(e){ if(e instanceof ValueError){ error("limnum"); return; } throw e; }
  [plot_part_a,plot_part_c,plot_part_d,plot_part_e1,plot_part_e2,plot_part_f][active]();
}
function panel(p,title,rows){
  const f=labelFrame(title); const ents=[];
  rows.forEach(([lab,val])=>{ f.appendChild(el("span","lab",lab)); const e=entry(val); f.appendChild(e); ents.push(e); });
  p.appendChild(f); return [f,ents];
}
function plotArea(p,key){ const pf=el("div","plotf"); p.appendChild(pf); app["fig_"+key]=new FigureTk(pf,key); }
function calcButton(f,fn){ const b=button("Calculate and plot",fn,"calc"); f.appendChild(b); }

function wlArray(){ const [a,b]=get_wl_limits(); return [linspace(a,b,N),a,b]; }

/* Part A */
function plot_part_a(){
  let dY,v,L;
  try{ dY=pyFloat(app.entry_a_dy.value); v=pyFloat(app.entry_a_v.value); L=pyFloat(app.entry_a_l.value);
    if(v<=0){ warn("v"); return; }
    if(L<0||L>1000){ warn("L"); return; } }
  catch(e){ if(e instanceof ValueError){ error("num"); return; } throw e; }
  const L_nm=L*1000000.0, Lambda=v/FREQ*1000.0;
  const kappa=8.699999999999998e-08*Math.exp(-((dY-Y_OPT)**2)/8);
  const [wl,a,b]=wlArray();
  const y=spectrumDb(wl,Lambda,w=>kappa*(1550/w),L_nm,random.rand(N));
  app.fig_a.plot(wl,y,[a,b]);
}
/* Part C */
function plot_part_c(){
  let temp;
  try{ temp=pyFloat(app.entry_c_t.value); if(temp<25.0||temp>100){ error("T"); return; } }
  catch(e){ if(e instanceof ValueError){ error("num"); return; } throw e; }
  const v=0.536, L=50.0, dY=0.0, L_nm=L*1000000.0;
  const Lambda=v/FREQ*1000.0*(1+(temp-25)*A_temp_exp);
  const kappa=8.699999999999998e-08*Math.exp(-((dY-Y_OPT)**2)/8);
  const [wl,a,b]=wlArray();
  app.fig_c.plot(wl,spectrumDb(wl,Lambda,w=>kappa*(1550/w),L_nm,random.rand(N)),[a,b]);
}
/* Part D */
function run_cooling_simulation(){
  const c_Ts=linspace(50,150,100), c_HFs=c_Ts.map(t=>HF_BASE+HF_DELTA*Math.exp(-((t-T_solid)**2)/50));
  const alpha=0.01; let curT=150.0; const hist=[];
  while(curT>50){ const curHF=interp(curT,c_Ts,c_HFs); curT=curT-alpha*(curT-25)/curHF; hist.push(curT); }
  const step=Math.trunc(hist.length/40);
  app.T_history_cut=hist.filter((_,i)=>i%step===0); app.max_t=app.T_history_cut.length;
}
function increment_time(){
  let val;
  try{ val=pyInt(pyFloat(app.entry_d_time.value)); if(val===app.max_t-1) return; }
  catch(e){ if(e instanceof ValueError) val=0; else return; }
  val=Math.min(app.max_t,val+1); setEnt(app.entry_d_time,String(val)); plot_part_d();
}
function decrement_time(){
  let val;
  try{ val=pyInt(pyFloat(app.entry_d_time.value)); if(val===0) return; }
  catch(e){ if(e instanceof ValueError) val=0; else return; }
  val=Math.max(0,val-1); setEnt(app.entry_d_time,String(val)); plot_part_d();
}
function update_info(val){
  try{ val=pyInt(pyFloat(val)); }catch(e){ if(e instanceof ValueError) val=0; else return; }
  app.lbl_d_info.textContent="Selected: "+val.toFixed(1)+"/"+(app.max_t-1).toFixed(1)+" min";
}
let processed_d=false;
function plot_part_d_call(){ if(processed_d) return; processed_d=true; plot_part_d(); processed_d=false; }
function plot_part_d(){
  let target_t;
  try{ target_t=pyInt(pyFloat(app.entry_d_time.value));
    if(target_t>app.max_t-1){ target_t=app.max_t-1; warn("frame",app.max_t-1); }
    else if(target_t<0){ target_t=0; warn("frame",0); } }
  catch(e){ if(e instanceof ValueError) target_t=0; else return; }
  setEnt(app.entry_d_time,String(target_t));
  const T_selected=app.T_history_cut[target_t];
  update_info(target_t);
  const v=0.536, L=50.0, dY=0.0, L_nm=L*1000000.0;
  const Lambda=v/FREQ*1000.0*(1+(T_selected-25)*A_temp_exp);
  const kappa=8.699999999999998e-08*Math.exp(-((dY-Y_OPT)**2)/8);
  const [wl,a,b]=wlArray();
  random.seed(0);
  const y=spectrumDb(wl,Lambda,w=>kappa*(1550/w)*(1-(T_selected-25)/5000),L_nm,random.rand(N));
  app.fig_d.plot(wl,y,[a,b],"t = "+target_t.toFixed(2)+" min");
}
/* Part E.I and E.II */
function force(key,F){
  const v=0.536, L=50.0, dY=0.0, L_nm=L*1000000.0;
  const Lambda=v/FREQ*1000.0*(1+F*2.7e-05);
  const kappa=8.699999999999998e-08*Math.exp(-((dY-Y_OPT)**2)/8);
  const [wl,a,b]=wlArray();
  app["fig_"+key].plot(wl,spectrumDb(wl,Lambda,w=>kappa*(1550/w),L_nm,random.rand(N)),[a,b]);
}
function plot_part_e1(){
  let F;
  try{ F=pyFloat(app.entry_e1_f.value); if(F>20||F<0){ warn("F"); return; } }
  catch(e){ if(e instanceof ValueError){ error("num"); return; } throw e; }
  force("e1",F);
}
function plot_part_e2(){
  let x;
  try{ x=pyFloat(app.entry_e2_x.value); if(x>10||x<0){ warn("x"); return; } }
  catch(e){ if(e instanceof ValueError){ error("num"); return; } throw e; }
  const F = x<7 ? 2.5*x : 0.5*x**2-4.5*x+24.5;
  force("e2",F);
}
/* Part F */
function plot_part_f(){
  let theta;
  try{ theta=pyFloat(app.entry_f_theta.value); }
  catch(e){ if(e instanceof ValueError){ error("num"); return; } throw e; }
  const v=0.536, L=50.0, L_nm=L*1000000.0, dn=1e-05, Lambda=v/FREQ*1000.0;
  const kappa1=8.699999999999998e-08, kappa2=6.089999999999998e-08;
  const [wl,a,b]=wlArray();
  const th=(theta-THETA_OPT)/180*Math.PI, c2=Math.cos(th)**2, s2=Math.sin(th)**2;
  const r1=random.rand(N), r2=random.rand(N), Tv=new Float64Array(N);
  for(let i=0;i<N;i++){
    const k1=kappa1*(1550/wl[i]), k2=kappa2*(1550/wl[i]);
    const d1=n_c*2*Math.PI/wl[i]-Math.PI/Lambda, d2=(1-dn)*n_c*2*Math.PI/wl[i]-Math.PI/Lambda;
    const t1=tCoef(k1,d1,L_nm), t2=tCoef(k2,d2,L_nm), a1=r1[i]*0.2+0.9, a2=r2[i]*0.2+0.9;
    Tv[i]=((t1[0]*a1)**2+(t1[1]*a1)**2)*c2+((t2[0]*a2)**2+(t2[1]*a2)**2)*s2+1e-06; }
  app.fig_f.plot(wl,dB(Tv),[a,b]);
}

addTab("Part A",p=>{ const [f,e]=panel(p," Parameters ",[["dY (μm):","0.0"],["v (mm/s):","0.50"],["L (mm):","50.0"]]);

addTab("Part E.I",p=>{ const [f,e]=panel(p," Force ",[["F (mN):","0"]]); app.entry_e1_f=e[0]; calcButton(f,plot_part_e1); plotArea(p,"e1"); });
addTab("Part E.II",p=>{ const [f,e]=panel(p," Displacement ",[["x (mm):","0"]]); app.entry_e2_x=e[0]; calcButton(f,plot_part_e2); plotArea(p,"e2"); });
addTab("Part F",p=>{ const [f,e]=panel(p,"Polarization",[["θ (°):","0"]]); app.entry_f_theta=e[0]; calcButton(f,plot_part_f); plotArea(p,"f"); });
$("apply").onmousedown=e=>e.preventDefault(); $("apply").onclick=apply_global_limits;
["wlmin","wlmax"].forEach(id=>$(id).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); apply_global_limits(); } }));

/* every tab is plotted once while the window is built, then Part A is shown */
active=0; tabs[0].t.className="on"; tabs[0].p.style.display="flex";
requestAnimationFrame(()=>{ [1,2,3,4,5].forEach(k=>{ tabs[k].p.style.display="flex"; });
  plot_part_c(); plot_part_d(); plot_part_e1(); plot_part_e2(); plot_part_f();

<script>
"use strict";
/* ══ Experiment mode: the FBG bench ══════════════════════════════════════════════════════════
   The same spectra as the program (spectrumDb, the same κ(dY), the same thermal, strain and
   birefringence formulas, the same LDPE cooling curve), but behind hardware: a writing stage under
   the femtosecond laser driven from a controller, a fibre switch, an optical spectrum analyser read
   with its marker, a water bath with a reference thermometer, the LDPE cell with a clock, a spring
   dynamometer, a micrometer on the spring, a rotating polariser.  The session's own errors: the
   piezo's zero, the stage's speed and length calibration, the bath thermometer's offset, the
   dynamometer's zero, the micrometer's zero, the polariser scale's zero. */
const FB={ dY:0, v:0.5, L:50, writing:null, A:null, inp:0, cen:1550, span:20, ref:5, divI:2, mkr:1550, trace:null, sweep:null,
  Tset:25, Tbath:25, cool:null, Fscrew:0, x:0, th:0, msg:"", sw:null };
const INPUTS=["A","C","D","E.I","E.II","F"], DBDIV=[1,2,5,10];
const kappaOf=dY=>8.699999999999998e-08*Math.exp(-((dY-Y_OPT)**2)/8);
function fbSpectrum(a,b){
  const wl=linspace(a,b,N), k0=kappaOf(0.0), v=0.536, L_nm=50e6;
  switch(INPUTS[FB.inp]){

        g.strokeStyle="#c9a6ff"; g.lineWidth=1.4; g.beginPath(); g.moveTo(0,70); g.lineTo(240,70); g.stroke();
        const go=HL.button(ui,"cool",20,124,200,38,{label:FB.cool?L("다시 녹이기 (RESET)","re-melt (RESET)"):L("냉각 시작 (START)","start cooling (START)"),col:FB.cool?"#555b62":"#3b7a57",size:12});
        if(go.click) FB.cool=FB.cool?null:{t:0};
        const tt=FB.cool?FB.cool.t:0, mm=Math.floor(tt/60), ss=tt-mm*60;
        HL.text(g,L("경과 시간 (시작부터)","elapsed since start"),20,184,"#c8ced6",10,"left","600");
        HL.lcd(g,20,194,200,46,(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss.toFixed(1),{col:"#7fd3ff",bg:"#0c141b",frame:"#22323f",glow:"rgba(120,200,255,.3)"});
      });
      B3.tex3(lcv,0,0,lcv.width,lcv.height,[46.5,8.01,16.5],[23,0,0],[0,0,25],{id:"p:ldpe"});

      /* ---- E.I: the spring dynamometer and its pulling screw ---- */
      B3.box3(76,122,0,2,18,40,"#3b4047",{id:"m:dyn"});
      const dcv=b.panel("dyn",460,220,ui=>{ const g=ui.g; HL.rr(g,0,0,460,220,6,"#3b4047");
        HL.text(g,L("용수철 동력계 0–20 mN","spring dynamometer 0–20 mN"),12,14,"#dfe5ea",11,"left","700");
        const F=fbForce(), shown=F+FB.Fz, x0=40, x1=400, y0=90, P=v=>x0+(v/20)*(x1-x0);
        HL.rr(g,x0-20,y0-30,x1-x0+40,56,6,"#d9d4c2","#666",1);
        for(let i=0;i<=40;i++){ const x=P(i/2); g.strokeStyle="#222"; g.lineWidth=i%2?0.6:1; g.beginPath(); g.moveTo(x,y0-30); g.lineTo(x,y0-30+(i%10===0?18:i%2===0?12:7)); g.stroke();
          if(i%4===0) HL.text(g,String(i/2),x,y0-2,"#222",9,"center","700"); }
        HL.text(g,"mN",x1+6,y0-2,"#222",9,"left","700");
        const px=P(Math.max(-0.5,Math.min(20.5,shown))); g.fillStyle="#c0392b"; g.beginPath(); g.moveTo(px,y0-30); g.lineTo(px-5,y0-42); g.lineTo(px+5,y0-42); g.fill();
        g.strokeStyle="#c0392b"; g.lineWidth=1; g.beginPath(); g.moveTo(px,y0-30); g.lineTo(px,y0+10); g.stroke();
        g.strokeStyle="#e8d9a8"; g.lineWidth=1.4; g.beginPath(); g.moveTo(0,170); g.lineTo(300,170); g.stroke();
        g.strokeStyle="#c9ced3"; g.lineWidth=2; g.beginPath(); for(let i=0;i<=12;i++) g.lineTo(220+i*6,170+(i%2?-9:9)); g.stroke();
        FB.Fscrew=HL.knob(ui,"fscrew",370,170,28,FB.Fscrew,{min:0,max:20,sens:20/700,wheelStep:0.1,label:L("당김 나사","pull screw")});
      });
      B3.tex3(dcv,0,0,dcv.width,dcv.height,[76.5,2.01,18.5],[45,0,0],[0,0,21],{id:"p:dyn"});

      /* ---- E.II: the unknown spring and the micrometer ---- */
      B3.box3(128,174,0,2,18,40,"#3b4047",{id:"m:mic"});
      B3.cyl3("x",174,182,3.2,33,1.4,"#c9ced3",{seg:16}); B3.cyl3("x",182,190,3.2,33,2.0,"#9aa1a8",{seg:18}); B3.cyl3("x",190,192,3.2,33,1.4,"#6d747b",{seg:14});
      const mcv=b.panel("mic",460,220,ui=>{ const g=ui.g; HL.rr(g,0,0,460,220,6,"#3b4047");
        HL.text(g,L("강성을 모르는 용수철 + 마이크로미터 0–10 mm","unknown spring + micrometer 0–10 mm"),12,14,"#dfe5ea",11,"left","700");
        g.strokeStyle="#e8d9a8"; g.lineWidth=1.4; g.beginPath(); g.moveTo(0,150); g.lineTo(30,150); g.stroke();
        g.strokeStyle="#c9ced3"; g.lineWidth=2; g.beginPath(); for(let i=0;i<=10;i++) g.lineTo(30+i*7,150+(i%2?-10:10)); g.stroke();
        g.strokeStyle="#e8d9a8"; g.beginPath(); g.moveTo(100,150); g.lineTo(140,150); g.stroke();
        g.save(); g.translate(140,108); g.scale(1.5,1.5);
        FB.x=micrometer(ui,"mic",0,0,FB.x,FB.xz);
        g.restore();
        HL.text(g,L("슬리브 0.5 mm · 딤블 50칸 (0.01 mm)","sleeve 0.5 mm · thimble 50 divisions (0.01 mm)"),12,206,"#9aa3ab",10,"left");
      });
      B3.tex3(mcv,0,0,mcv.width,mcv.height,[128.5,2.01,18.5],[45,0,0],[0,0,21],{id:"p:mic"});

      /* ---- F: the polarisation rotator ---- */
      B3.box3(184,212,0,5,17,41,"#2b2f35",{id:"m:pol"});
      B3.cyl3("y",5,7,198,29,11.5,"#3a4048",{seg:40,id:"m:pol"});
      const pcv=b.panel("pol",260,260,ui=>{ const g=ui.g, cx=130, cy=130, R=104, shown=FB.th;
        HL.circle(g,cx,cy,R+12,"#3a4048","#111",1.5); HL.circle(g,cx,cy,R,"#d9dde1");
        for(let d=0;d<360;d++){ const a=(d-shown-90)*Math.PI/180, Lk=d%10===0?13:d%5===0?9:5; g.strokeStyle="#222"; g.lineWidth=d%10===0?0.9:0.45;
          g.beginPath(); g.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); g.lineTo(cx+Math.cos(a)*(R-Lk),cy+Math.sin(a)*(R-Lk)); g.stroke();
          if(d%30===0) HL.text(g,String(d),cx+Math.cos(a)*(R-24),cy+Math.sin(a)*(R-24),"#222",10,"center","700"); }
        g.fillStyle="#c0392b"; g.beginPath(); g.moveTo(cx,cy-R+2); g.lineTo(cx-6,cy-R-10); g.lineTo(cx+6,cy-R-10); g.fill();
        HL.circle(g,cx,cy,24,"#2b2f35");
        const e=ui.hit("rot",{cx,cy,r:R+12},{wheel:true,cursor:"ns-resize"});
        if(e.down) FB.th+=-e.rawdy*0.3; if(e.wheel) FB.th+=e.wheel*(e.shift?0.1:1); FB.th=((FB.th%360)+360)%360;
      });
      B3.tex3(pcv,0,0,pcv.width,pcv.height,[198-11.5,7.02,29-11.5],[23,0,0],[0,0,23],{id:"p:pol"});

      /* the patch cords: each station to the switch, the switch to the analyser */
      const yel="#e8c43a";
      B3.cableDesk([90,10.4,-32],[96,3,-17],yel,1.6);
      B3.cableDesk([22,1,16],[98,1,-8],yel,1.6); B3.cableDesk([58,1,16],[102,1,-6],yel,1.6);
      B3.cableDesk([99,1,18],[108,1,-6],yel,1.6); B3.cableDesk([151,1,18],[114,1,-6],yel,1.6); B3.cableDesk([198,1,17],[118,1,-8],yel,1.6);
      B3.cableDesk([120,3,-13],[202,5.7,-3.8],yel,1.6);
      B3.stopwatch(b,"sw",[126,6],FB.sw);
    }});
}
let fbBench=null;
function fbMode(m){ $("labwrap").hidden=m!=="lab"; document.querySelector(".winwrap").hidden=m==="lab"; $("t-note").hidden=m==="lab";
  $("m-app").className=m==="app"?"on":""; $("m-lab").className=m==="lab"?"on":"";
  try{ localStorage.setItem("hl-mode:"+location.pathname,m); }catch(e){}
  if(m==="lab"){ if(!fbBench){ const S=HL.session(location.pathname);
      FB.dYz=S.sys("piezo0",0.06); FB.vG=S.sys("stageV",0.0015); FB.LG=S.sys("stageL",0.1); FB.Tz=S.sys("bathT",0.15); FB.Fz=S.sys("dyn0",0.15);
      FB.xz=S.sys("mic0",0.008); FB.thz=S.sys("pol0",0.6); FB.sw=new B3.Stopwatch(0.03+S.uni("lat",0,0.04));

const LT={ko:{app:"FBG Writer (원본 프로그램)",lab:"실험 모드",
  intro:"실제 장비로 하는 FBG 실험입니다. 책상 뒤 왼쪽은 펨토초 레이저 아래로 광섬유를 이송해 격자를 쓰는 장치와 그 컨트롤러(dY는 압전 스테이지, v와 L은 이송 축), 오른쪽은 광스펙트럼분석기(Yokogawa AQ6370 계열)입니다. 앞줄에는 시료 장치가 놓여 있습니다 — C 수조(Julabo 순환기와 기준 온도계), D LDPE 셀과 시계, E.I 용수철 동력계, E.II 용수철과 마이크로미터, F 편광 회전기. 모든 시료는 광섬유로 1×6 스위치에 이어져 있고, 스위치가 가리키는 것이 분석기에 들어갑니다. 분석기는 SWEEP으로 한 번 쓸고, 마커를 손으로 옮겨 그 자리의 파장과 투과율을 읽습니다. 딥의 바닥을 찾는 것은 사람의 몫입니다.",
  how:["장비를 클릭하면 가까이 보기 (Esc: 돌아가기) · 빈 곳 끌기: 돌려 보기 · 휠: 확대","격자 쓰기: 컨트롤러의 <b>dY</b>·<b>v</b>·<b>L</b> 손잡이 → <b>WRITE</b> (배속 ×10·×60으로 기다리기)","광섬유 스위치 손잡이로 분석기 입력(A, C, D, E.I, E.II, F) 고르기","분석기: <b>CENTER</b>·<b>SPAN</b>·<b>REF</b>·<b>dB/div</b> → <b>SWEEP</b> → <b>MARKER</b>로 딥 바닥 맞추기","수조는 설정 온도로 천천히 갑니다 — 기준 온도계가 멈출 때 재기 · 스페이스바: 스톱워치"],
  noteH:"실험 노트", noteN:"값은 장비에서 직접 읽어 여기에 적습니다. 이 브라우저에 저장됩니다."},
 en:{app:"FBG Writer (original program)",lab:"Experiment mode",
  intro:"The FBG experiment on hardware. At the back left, the station that draws the fibre under the femtosecond laser, with its controller (dY on a piezo stage, v and L on the linear axis); at the back right, the optical spectrum analyser (after a Yokogawa AQ6370). In front, the sample apparatus: C a water bath (Julabo circulator and reference thermometer), D the LDPE cell and its clock, E.I a spring dynamometer, E.II a spring and a micrometer, F a polarisation rotator. Every sample is patched to a 1×6 fibre switch, and whichever the switch points to goes into the analyser. SWEEP takes one trace; move the marker by hand and read the wavelength and transmission where it sits. Finding the bottom of the dip is up to you.",
