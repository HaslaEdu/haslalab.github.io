  subtitle: { ko: '장비: 레이저(λ = 680 nm), 집게가 있는 삼각대, 받침 위 볼록 렌즈, 마분지 화면, 모눈종이, 안내 자 둘, 측정용 자, 광학 소자 세 개가 붙은 판(1 프레넬 거울 — 고리가 새겨진 정사각 은박, 2 반짝이는 반사 띠, 3 구멍을 덮은 주황색 플라스틱 굴절 소자). 측정할 때만 레이저를 켜세요.',
              en: 'Equipment: a laser (λ = 680 nm), a tripod with a clamp, a convex lens on a stand, a cardboard screen, graph paper, two guide rulers, a measuring ruler, a plate with three optical elements (1 a Fresnel mirror — a square of foil with rings, 2 a shiny reflecting strip, 3 an orange plastic refracting element over a hole). Switch the laser on only while measuring.' },
  notes: { ko: [
    '과제: 1 (작은 각) 렌즈의 두 면에서 반사된 점의 이동 Δx 대 렌즈 이동 x, 곡률 반지름 R₁, R₂; 렌즈 뒤 L 의 화면에서 굴절된 점의 Δx(x), 초점 거리 F, 굴절률 n 과 오차 (1/F = (n − 1)(1/R₁ + 1/R₂)). 2 (큰 각) 프레넬 거울 r_k = r₀k^γ: 반사점의 이동에서 sin(반사각) 대 거울 이동, γ. 3 반짝이는 띠의 구조와 매개변수. 4 주황색 소자의 구조와 굴절률.',
    '공식 해답: L = 22 cm 에서 기울기 K₁ = 6.51, K₂ = 6.4 → R₁ = 6.76 ± 0.14 cm, R₂ = 6.9 ± 0.2 cm; L = 15 cm 에서 K₃ = 2.03 → F ≈ 7.4 cm, n ≈ 1.5. 프레넬 거울: r = 0.7 cm 에서 Δx = 11.0 cm (sin φ = 0.497) … sin φ 가 r 에 비례 → γ = 0.5. 띠: 가운데와 정사각형 꼭짓점 넷의 다섯 점, 45° → 2차원 격자 d ≈ 0.96 µm. 주황 소자: 정육각형 여섯 점, L = 6.5 cm 에서 a = 4.5 cm → sin α = 0.57, 삼각 피라미드, n = 1.51.',
    '문제지는 러시아어판만 있습니다. 화면의 점 위치는 화면을 클릭해 모눈종이에서 읽습니다. 값은 방문할 때마다 조금 다릅니다.'], en: [
    'Tasks: 1 (small angles) the shift Δx of the spot reflected from each lens surface against the lens shift x, the radii R₁, R₂; on a screen L behind the lens the refracted spot\'s Δx(x), the focal length F, the index n with its error (1/F = (n − 1)(1/R₁ + 1/R₂)). 2 (large angles) the Fresnel mirror r_k = r₀k^γ: from the reflected spot, sin(reflection angle) against the mirror shift, γ. 3 the structure and parameters of the shiny strip. 4 the structure and index of the orange element.',
    'Official solution: at L = 22 cm the slopes K₁ = 6.51, K₂ = 6.4 → R₁ = 6.76 ± 0.14 cm, R₂ = 6.9 ± 0.2 cm; at L = 15 cm K₃ = 2.03 → F ≈ 7.4 cm, n ≈ 1.5. Fresnel mirror: Δx = 11.0 cm at r = 0.7 cm (sin φ = 0.497) … sin φ proportional to r → γ = 0.5. Strip: five spots, the centre and the corners of a square, at 45° → a 2-D grating, d ≈ 0.96 µm. Orange element: six spots on a regular hexagon, a = 4.5 cm at L = 6.5 cm → sin α = 0.57, triangular pyramids, n = 1.51.',
    'The paper exists in Russian only. Read spot positions on the graph paper by clicking a screen. The values differ a little from visit to visit.'] }
};

var LAB = { on: false, x: 22, flip: false, plate: false, Lf: 22, Lb: 15, back: false };
PROGRAM.lab = {
  intro: { ko: '책상 위: 삼각대에 물린 레이저와 그 앞의 마분지 화면(모눈종이, 가운데 구멍), 안내 자 둘 사이의 렌즈(아래 측정 자), 렌즈 뒤에 세우는 화면, 광학 소자 판.',
           en: 'On the desk: the laser in the tripod clamp with the cardboard screen on it (graph paper, a hole in the middle), the lens between the two guide rulers (the measuring ruler under it), a screen to stand behind the lens and the plate of optical elements.' },
  howto: { ko: ['레이저 클릭: 켜기/끄기 · 렌즈를 좌우로 끌기 또는 렌즈 위에서 휠: 안내 자를 따라 옮기기 (휠 1 mm, Shift 0.1 mm)',
                '렌즈 받침 클릭: 렌즈를 돌려 다른 면을 레이저 쪽으로 · 소자 판 클릭: 렌즈에 붙이기/떼기 · 뒤 화면 클릭: 세우기/치우기',
                '레이저 삼각대 위에서 휠: 렌즈까지 거리 L · 뒤 화면 위에서 휠: 렌즈 뒤 거리 · 화면 클릭: 가까이 보기 · 측정 자 클릭: 가까이'],
           en: ['Click the laser: on/off · drag the lens left/right or wheel over it: slide it along the guides (wheel 1 mm, Shift 0.1 mm)',
                'Click the lens stand: turn the lens to face the other surface to the laser · click the element plate: stick it on the lens / take it off · click the back screen: stand it up / remove it',
                'Wheel over the laser tripod: the distance L to the lens · wheel over the back screen: its distance behind the lens · click a screen: close up · click the measuring ruler: close up'] },
  notePlaceholder: { ko: '예) 면 1, L = 22 cm: x = 23.5 cm Δx = 9.5 cm, 23.2 cm 7.3 cm …', en: 'e.g. side 1, L = 22 cm: x = 23.5 cm Δx = 9.5 cm, 23.2 cm 7.3 cm …' },
  mount: function (host, ctx) {
    var S = ctx.S;
    var R1 = 6.76 * (1 + S.sys('R1', 0.02)), R2 = 6.9 * (1 + S.sys('R2', 0.02)), F = 7.4 * (1 + S.sys('F', 0.03));
    var X0 = 22.2 + S.uni('x0', -0.3, 0.3), CF = 0.71 * (1 + S.sys('cf', 0.04)), LAM = 680e-7, DS = 0.96e-4 * (1 + S.sys('ds', 0.02)), SA = 0.57 * (1 + S.sys('sa', 0.02));
    var XC = { fres: X0, strip: X0 + 2.5, hole: X0 + 5 };              /* element centres when the plate is on */
    function mkScreen() { var c = document.createElement('canvas'); c.width = c.height = 480; return c; }
    var scrF = mkScreen(), scrB = mkScreen(), mm = B3.scaleTex(30, { horiz: true, width: 2, from: 0, bg: '#f2efe6' });
    function drawScreen(cv, spots, hole) { var g = cv.getContext('2d'), k = 480 / 24; g.fillStyle = '#fbfbf5'; g.fillRect(0, 0, 480, 480);
      for (var i = 0; i <= 240; i++) { var p = i * 2; g.strokeStyle = i % 10 === 0 ? '#c86a3a' : i % 5 === 0 ? '#e5a98a' : '#f2d2c2'; g.lineWidth = i % 10 === 0 ? 1.4 : 0.6;
        g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 480); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(480, p); g.stroke(); }
      if (hole) { g.fillStyle = '#222'; g.beginPath(); g.arc(240, 240, 6, 0, 7); g.fill(); }
      spots.forEach(function (s) { var px = 240 + s[0] * k, py = 240 - s[1] * k; if (px < -20 || px > 500 || py < -20 || py > 500) return;
        var gr = g.createRadialGradient(px, py, 0, px, py, s[2] * k); gr.addColorStop(0, 'rgba(255,40,30,' + (s[3] || 0.95) + ')'); gr.addColorStop(1, 'rgba(255,40,30,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(px, py, s[2] * k, 0, 7); g.fill(); }); }
    var bench = B3.bench(host, {
      aspect: 0.6, lang: ctx.lang, wheelIds: ['lens', 'tri', 'bscr'], moveY: 6,
      home: { yaw: -0.75, pitch: 0.55, k: 10, tx: -2, ty: 6, tz: 4 },
      views: { scrF: { yaw: Math.PI, pitch: 0.02, k: 22, tx: 0, ty: 13, tz: 0, title: { ko: '레이저 앞의 화면 (렌즈 쪽에서)', en: 'The screen on the laser (seen from the lens)' } },
               scrB: { yaw: 0, pitch: 0.02, k: 22, tx: 0, ty: 13, tz: 0, title: { ko: '렌즈 뒤의 화면', en: 'The screen behind the lens' } },
               rul: { yaw: 0, pitch: 1.2, k: 30, tx: 0, ty: 1, tz: 2, title: { ko: '렌즈 위치와 측정 자', en: 'The lens position and the ruler' } } },
      frame: function (b) {
        if (b.clicked('c:laser')) LAB.on = !LAB.on;
        if (b.clicked('c:stand')) LAB.flip = !LAB.flip;
        if (b.clicked('c:plate')) LAB.plate = !LAB.plate;
        if (b.clicked('c:bscr')) LAB.back = !LAB.back;
        if (b.clicked('c:rul')) b.go('rul');
        if (b.clicked('c:scrF')) { b.views.scrF.tz = LAB.Lf; b.go('scrF'); }
        if (b.clicked('c:scrBv')) { b.views.scrB.tz = -LAB.Lb; b.go('scrB'); }
        var wl = b.wheel('lens'); if (wl) LAB.x = Math.max(14, Math.min(30, Math.round((LAB.x + wl * 0.1) * 100) / 100));
        if (b.dragging('lens')) LAB.x = Math.max(14, Math.min(30, LAB.x + b.moved('lens')[0]));
        var wt = b.wheel('tri'); if (wt) LAB.Lf = Math.max(6, Math.min(30, Math.round(LAB.Lf + wt)));
        var wbs = b.wheel('bscr'); if (wbs) LAB.Lb = Math.max(4, Math.min(25, Math.round(LAB.Lb + wbs)));
        B3.desk(-30, 30, -30, 34);
        /* guides and measuring ruler along x; the beam runs along z at x = 0 */
        var lensWX = LAB.x - 22;                                       /* ruler reading 22 cm sits on the beam */
        B3.box3(-12, 12, 0, 1, -3.6, -2.6, '#c8a26a', { top: '#d8b27a' }); B3.box3(-12, 12, 0, 1, 2.6, 3.6, '#c8a26a', { top: '#d8b27a' });
        B3.tex3(mm, 0, 0, mm.width, mm.height, [-23, 0.03, 3.8], [32, 0, 0], [0, 0, 2], { id: 'c:rul' });
        B3.box3(-23, 9, 0, 0.02, 3.8, 5.8, '#f2efe6', { id: 'c:rul', noObst: true, noTop: true });
        /* the lens on its stand (a disc in the x–y plane), marker line down to the ruler */
        var lx = lensWX, ly = 13;
        B3.box3(lx - 2.4, lx + 2.4, 0, 1.4, -2.4, 2.4, '#3a3f46', { top: '#474c55', id: 'c:stand' });
        B3.box3(lx - 0.3, lx + 0.3, 1.4, ly - 2.3, -0.3, 0.3, '#3a3f46', { id: 'm:lens' });
        B3.cyl3('z', -0.35, 0.35, lx, ly, 2.4, 'rgba(200,225,240,.45)', { seg: 30, cap: 'rgba(210,235,250,.5)', id: 'm:lens' });
        B3.text3([lx - 0.4, ly + 2.6, 0.4], [1, 0, 0], [0, 1, 0], LAB.flip ? '2' : '1', 0.8, '#ffd479', { weight: '800' });
        B3.line3([lx, 0.05, 2.4], [lx, 0.05, 4.6], '#c0392b', 2);
        if (LAB.plate) { B3.box3(lx - 1, lx + 6, ly - 1, ly + 1, 0.36, 0.46, '#d8d8d8');
          B3.box3(lx - 0.8, lx + 0.8, ly - 0.8, ly + 0.8, 0.46, 0.5, '#c0c4c8'); B3.box3(lx + 1.8, lx + 3.2, ly - 0.3, ly + 0.3, 0.46, 0.5, '#e8e0ff'); B3.cyl3('z', 0.46, 0.52, lx + 5, ly, 0.6, 'rgba(255,140,30,.85)', { seg: 16 }); }
        else B3.box3(14, 21, 0, 0.1, 18, 20, '#d8d8d8', { id: 'c:plate' });
        if (LAB.plate) B3.box3(lx - 1, lx + 6, ly - 1, ly + 1, 0.36, 0.46, '#d8d8d8', { id: 'c:plate' });
        /* the laser in its clamp with the screen on it, L in front of the lens */
        var zf = LAB.Lf;
        B3.box3(-6, 6, 0, 1.2, zf + 3, zf + 9, '#3b4048', { top: '#474c55', id: 'm:tri' }); B3.cyl3('y', 1.2, ly + 4, 0, zf + 7, 0.6, '#c3c8cd', { seg: 12, cap: '#dde1e4', id: 'm:tri' });
        B3.cyl3('z', zf + 0.6, zf + 7, 0, ly, 0.8, '#2b2f35', { seg: 16, cap: LAB.on ? '#c0392b' : '#3a3f46', id: 'c:laser' });
        B3.box3(-12, 12, ly - 12, ly + 12, zf + 0.55, zf + 0.8, '#b89a6a', { id: 'c:scrF' }); B3.box3(-1, 1, 1.2, ly - 12, zf + 1, zf + 3, '#5b6168');
        B3.tex3(scrF, 0, 0, 480, 480, [12, ly + 12, zf + 0.5], [-24, 0, 0], [0, -24, 0], { id: 'c:scrF' });
        if (LAB.back) { B3.box3(-12, 12, 0, 1, -LAB.Lb - 1.5, -LAB.Lb - 0.5, '#5d4630', { id: 'm:bscr' }); B3.box3(-12, 12, ly - 12, ly + 12, -LAB.Lb - 0.8, -LAB.Lb - 0.55, '#b89a6a', { id: 'c:scrBv' }); B3.box3(-1, 1, 1, ly - 12, -LAB.Lb - 1.2, -LAB.Lb - 0.8, '#5b6168');
          B3.tex3(scrB, 0, 0, 480, 480, [-12, ly + 12, -LAB.Lb - 0.5], [24, 0, 0], [0, -24, 0], { id: 'c:scrBv' }); }
        else B3.box3(16, 26, 0, 0.6, -24, -22, '#5d4630', { id: 'c:bscr' });
        if (LAB.back) B3.box3(-12, 12, 0, 0.2, -LAB.Lb - 1.6, -LAB.Lb - 1.4, '#5d4630', { id: 'c:bscr' });
        /* optics: what the beam (at world x = 0, i.e. lens-relative r = −lensWX) meets */
        var sF = [], sB = [], r = -lensWX, rays = [];
        if (LAB.on) {
          var el = null; if (LAB.plate) { if (Math.abs(r) <= 0.8) el = 'fres'; else if (Math.abs(r - 2.5) <= 0.7) el = 'strip'; else if (Math.abs(r - 5) <= 0.6) el = 'hole'; else if (r > -1 && r < 6) el = 'plate'; }
          if ((!LAB.plate || el === null) && Math.abs(r) < 2.4) { var R = LAB.flip ? R2 : R1, a = 2 * Math.atan(-r / R);
            sF.push([zf * Math.tan(a), 0, 0.5, 0.9]); var R_ = LAB.flip ? R1 : R2; sF.push([zf * Math.tan(-2 * r / (R_ * 1.5)), 0.15, 0.7, 0.35]);
            if (LAB.back) sB.push([LAB.Lb * Math.tan(Math.atan(-r / F)) * -1 * -1, 0, 0.35, 0.95]);
            rays.push([[0, ly, zf], [0, ly, 0], [zf * Math.tan(a), ly, zf]]); if (LAB.back) rays.push([[0, ly, 0], [-LAB.Lb * r / F * -1, ly, -LAB.Lb]]); }
          else if (el === 'fres') { var sp = Math.max(-0.99, Math.min(0.99, CF * r)), ph = Math.asin(sp); sF.push([-zf * Math.tan(ph) * Math.sign(1), 0, 0.8, 0.7]); sF.push([0, 0, 0.4, 0.25]); }
          else if (el === 'strip') { var t = Math.tan(Math.asin(LAM / DS)); sF.push([0, 0, 0.35, 0.9]); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (q) { sF.push([q[0] * zf * t, q[1] * zf * t, 0.35, 0.7]); }); }
          else if (el === 'hole') { if (LAB.back) { var ta = Math.tan(Math.asin(SA)); for (var k = 0; k < 6; k++) { var an = k * Math.PI / 3; sB.push([Math.cos(an) * LAB.Lb * ta, Math.sin(an) * LAB.Lb * ta, 0.35, 0.85]); } } }
          else if (el === 'plate') { sF.push([0, 0, 0.6, 0.15]); }
          else if (Math.abs(r) >= 2.4 && LAB.back) sB.push([0, 0, 0.3, 0.95]);
          B3.line3([0, ly, zf + 0.6], [0, ly, LAB.back ? -LAB.Lb - 0.5 : -25], 'rgba(255,40,40,.35)', 1.2);
          rays.forEach(function (ry) { for (var i = 0; i + 1 < ry.length; i++) B3.line3(ry[i], ry[i + 1], 'rgba(255,40,40,.5)', 1.2); }); }
        /* the front screen is seen from the lens: mirror x on it */
        drawScreen(scrF, sF.map(function (s) { return [-s[0], s[1], s[2], s[3]]; }), true); drawScreen(scrB, sB, false);
        LAB.state = { x: LAB.x, r: r, Lf: LAB.Lf, Lb: LAB.Lb, F: F, spotsF: sF.map(function (s) { return [Math.round(s[0] * 10) / 10, Math.round(s[1] * 10) / 10]; }), spotsB: sB.map(function (s) { return [Math.round(s[0] * 10) / 10, Math.round(s[1] * 10) / 10]; }) };
      }
    });
    ctx.onLang(function () { bench.renderText(); });
  }
};
</script>
