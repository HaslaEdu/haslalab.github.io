<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>문제은행 · HaslaLab</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="./favicon-light.svg">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css"><link rel="stylesheet" href="./styles.css?v=20261103-archive">
  <script src="./vendor/katex/katex.min.js" defer></script><script src="./vendor/katex/contrib/auto-render.min.js" defer></script>
  <script src="./app.js?v=20261103-archive" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#library" data-i18n="skipContent">본문으로</a>
  <header class="site-header"><a class="brand" href="https://haslalab.org/"><img src="./brand-logo.png" width="30" height="30" alt="">HaslaLab <span data-i18n="title">문제은행</span></a><div class="tools"><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select><button id="theme" aria-label="테마 전환">◐</button><span id="account"></span><a id="accountLogin" href="https://haslalab.org/#/login" target="_top" data-i18n="login">로그인</a><button id="logout" hidden>로그아웃</button></div></header>
  <main>
    <div id="bootstrapStatus" class="bootstrap-status" hidden><p id="bootstrapMessage" role="status" aria-live="polite"></p><button id="retryBootstrap" data-i18n="retryLoad">다시 불러오기</button></div>
    <section id="loginPanel" class="login-panel" hidden>
      <h1 data-i18n="title">문제은행</h1><p data-i18n="adminOnly">관리자 계정으로 로그인하세요.</p>
      <form id="loginForm"><label><span data-i18n="username">아이디</span><input name="username" autocomplete="username" required maxlength="100"></label><label><span data-i18n="password">비밀번호</span><input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button class="primary" data-i18n="login">로그인</button></form>
      <a id="siteLogin" href="../../#/login" target="_top" data-i18n="siteLogin" hidden>하슬라랩에서 로그인</a>
      <p id="loginMessage" role="status"></p>
    </section>
    <section id="library" tabindex="-1">
      <div id="catalogView">
        <div class="page-head"><h1 data-i18n="title">문제은행</h1><p id="counts" class="muted"></p></div>
        <div class="catalog-layout">
          <aside class="browse-rail" aria-label="Archive navigation">
            <h2 class="rail-heading" data-i18n="browseArchive">자료별 탐색</h2>
            <nav id="kindNav" class="kind-nav" aria-label="Source type">
              <button data-kind="" aria-current="page" class="selected" data-i18n="allProblems">전체 문제</button>
              <button data-kind="contest" data-i18n="contests">대회</button>
              <button data-kind="book" data-i18n="books">교재</button>
              <button data-kind="course" data-i18n="courses">강좌</button>
            </nav>
            <details id="sourceBrowser" class="source-browser" open>
              <summary data-i18n="sourceDirectory">자료 목록</summary>
              <label class="source-find"><span class="sr-only" data-i18n="findSource">자료 이름 찾기</span><input id="sourceQuery" type="search" maxlength="120" placeholder="자료 이름 찾기"></label>
              <div id="sourceList" class="source-list"></div>
            </details>
          </aside>
          <section class="catalog-main">
            <div class="browse-heading"><div><h2 id="browseHeading" data-i18n="allProblems">전체 문제</h2><p id="browseMeta" class="muted"></p></div><button id="clearFilters" class="text-button" data-i18n="resetFilters">초기화</button></div>
            <form id="searchForm" class="search-form">
              <div class="search-line"><label class="grow"><span class="sr-only" data-i18n="query">검색어</span><input id="query" type="search" maxlength="600" placeholder="문제의 문장, 수식, 문항 번호"></label><button class="primary" data-i18n="search">검색</button></div>
              <div class="filter-line">
                <label><span data-i18n="collection">문제 모음</span><select id="collection"><option value="" data-i18n="allCollections">물리·천문 전체</option><option value="physics" data-i18n="physics">물리학</option><option value="astronomy" data-i18n="astronomy">천문학</option></select></label>
                <label><span data-i18n="subject">분야</span><select id="subject"></select></label>
                <label class="source-select"><span data-i18n="source">자료</span><select id="source"></select></label>
                <label><span data-i18n="stars">난이도</span><select id="stars"><option value="" data-i18n="allStars">난이도 전체</option><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select></label>
              </div>
              <div id="contestFilters" class="filter-line contest-filters" hidden>
                <label><span data-i18n="competition">대회</span><select id="competition"></select></label>
                <label><span data-i18n="year">연도</span><select id="year"></select></label>
                <label><span data-i18n="problemType">구분</span><select id="type"><option value="" data-i18n="allTypes">이론·실험 전체</option><option value="theory" data-i18n="theory">이론</option><option value="experiment" data-i18n="experiment">실험</option></select></label>
              </div>
            </form>
            <nav id="yearNav" class="year-nav" aria-label="Year navigation" hidden></nav>
            <div class="recognition-tools"><div class="mode-tabs" role="tablist" aria-label="Search mode"><button id="textMode" class="selected" role="tab" aria-selected="true" data-i18n="textSearch">텍스트 검색</button><button id="photoMode" role="tab" aria-selected="false" data-i18n="photoSearch">사진으로 찾기</button></div><span id="photoAccess" class="muted" data-i18n="photoAdmin">사진 인식은 관리자 계정에서 사용할 수 있습니다.</span></div>
            <form id="photoForm" hidden class="photo-form"><label><span data-i18n="photoLabel">문제 사진</span><input id="photo" type="file" accept="image/png,image/jpeg,image/webp" required></label><button class="primary" data-i18n="readPhoto">사진 인식·검색</button><span id="ocrPolicy" class="muted" data-i18n="ocrPolicy">관리자 전용 · Upstage OCR 호출</span></form>
            <div id="recognizedPanel" hidden><label for="recognized" data-i18n="recognized">인식된 문장·수식</label><textarea id="recognized" rows="5" maxlength="12000"></textarea><button id="retryText" data-i18n="searchCorrected">수정한 텍스트로 다시 검색</button><span class="muted" data-i18n="noExtraOcr">이 버튼은 OCR을 다시 호출하지 않습니다.</span></div>
            <p id="message" role="status" aria-live="polite"></p>
            <p id="resultLimit" class="muted"></p>
            <section class="results" aria-labelledby="resultsTitle"><div class="section-head"><h2 id="resultsTitle" data-i18n="problemList">문제 목록</h2><span id="resultCount" class="muted"></span></div><div id="results"></div><div class="pager"><button id="previous" data-i18n="previous">이전</button><button id="next" data-i18n="next">다음</button></div></section>
          </section>
        </div>
      </div>
      <section id="readerView" class="reader-view" hidden>
        <nav class="reader-nav" aria-label="Problem navigation"><button id="backToList" class="back-link" data-i18n="backToList">← 문제 목록</button><span id="readerBreadcrumb" class="muted"></span></nav>
        <article id="detail" class="detail" tabindex="-1"><p class="muted" data-i18n="selectQuestion">문제를 선택하면 본문을 확인할 수 있습니다.</p></article>
      </section>
    </section>
  </main><footer><a href="https://haslalab.org/">HaslaLab</a><span data-i18n="footer">문제·번역·풀이의 검토 상태는 각 항목에 표시됩니다.</span></footer>
</body></html>
