<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://*.haslalab.workers.dev http://localhost:* http://127.0.0.1:*">
<title>AI 검토 · HaslaLab</title>
<link rel="icon" href="logo/brand/haslalab-light.svg" type="image/svg+xml">
<style>
:root{--ink:#16212E;--paper:#FBFCFD;--line:#B4CADC;--muted:#5C6B7A;--ok:#1F7A4D;--bad:#C0392B;--rail:#2E3945;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--paper:#11161c;--line:#2b3642;--muted:#9aa7b4;--ok:#4cc38a;--bad:#ff7b72;--rail:#3a4756}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
button,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:transparent;color:inherit;cursor:pointer}
button.primary{background:var(--rail);color:#fff;border-color:var(--rail)}
button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
.case{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.case h2{font-size:14px;margin:0 0 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.correct{color:var(--ok);border-color:var(--ok)}.wrong,.blocked{color:var(--bad);border-color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.cols div{min-width:0}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0 0;max-height:320px;overflow:auto;background:rgba(127,127,127,.08);padding:8px;border-radius:6px;font-size:13px;font-family:inherit}
textarea{width:100%;min-height:90px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:transparent;color:inherit;margin-top:8px}
.err{color:var(--bad)}
</style>
<script defer src="ai-review.js"></script>
</head>
<body>
<main>
  <h1>하슬라 AI 검토</h1>
  <p class="muted">매일 밤 AI가 스스로 문제를 받고 답한 결과입니다. 맞는 답은 승인, 틀린 답은 고쳐서 승인하거나 거절하세요. 회원이 학습 사용을 허용한 대화도 "회원 대화"로 여기 쌓입니다(👎 받은 것부터 보세요). 승인한 답은 같은 질문이 오면 바로 재사용되고, 학습 데이터(LoRA)로 내보낼 수 있습니다. 관리자만 쓸 수 있습니다.</p>
  <p id="msg" class="err" hidden></p>
  <div class="bar">
    <label>상태 <select id="status"><option value="graded">검토 대기</option><option value="approved">승인됨</option><option value="rejected">거절됨</option><option value="failed">실패</option><option value="all">전체</option></select></label>
    <label>종류 <select id="kind"><option value="">전체</option><option value="eval">밤 시험</option><option value="member">회원 대화</option></select></label>
    <label>판정 <select id="verdict"><option value="">전체</option><option value="wrong">틀림</option><option value="correct">맞음</option><option value="blocked">차단됨</option><option value="ungraded">채점 안 됨</option><option value="bad">👎 회원 별로</option><option value="good">👍 회원 좋아요</option></select></label>
    <button id="reload" type="button">새로고침</button>
    <button id="runBank" type="button">문제풀이 1건 지금 실행</button>
    <button id="runSite" type="button">문제위치 1건 지금 실행</button>
    <select id="exportStyle" aria-label="내보낼 말투"><option value="">모든 말투</option><option value="default">기본 말투만</option><option value="community">커뮤 말투만</option></select>
    <button id="export" type="button" class="primary">학습 데이터 내보내기 (JSONL)</button>
  </div>
  <p id="config" class="muted"></p>
  <h2 style="font-size:15px;margin:16px 0 4px">속도 · 비용</h2>
  <p id="usageNote" class="muted"></p>
  <table><thead><tr><th>경로</th><th>질문 수</th><th>비율</th><th>평균 시간</th><th>평균 입력 토큰</th><th>평균 출력 토큰</th></tr></thead><tbody id="usage"></tbody></table>
  <h2 style="font-size:15px;margin:16px 0 4px">밤 시험 결과</h2>
  <table><thead><tr><th>날짜</th><th>종류</th><th>건수</th><th>평균 점수</th><th>맞음</th><th>실패</th><th>승인</th></tr></thead><tbody id="days"></tbody></table>
  <div id="list"></div>
  <div class="bar"><button id="more" type="button" hidden>더 보기</button></div>
</main>
</body>
</html>
