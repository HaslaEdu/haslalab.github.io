<p class="x" style="--b:123.0">얇은 금속으로 된 정육각형의 꼭짓점 <span class="nw">$A$,</span> <span class="nw">$B$,</span> <span class="nw">$C$,</span> <span class="nw">$D$를</span> 통해 전류가 흐른다. 꼭짓점 <span class="nw">$A$와</span> <span class="nw">$B$로는</span> 각각 세기가 <span class="nw">$2I$와</span> <span class="nw">$5I$인</span> 전류가 흘러 들어가고, 꼭짓점 <span class="nw">$D$에서는</span> 세기가 <span class="nw">$13I$인</span> 전류가 흘러 나온다. 축 <span class="nw">$OY$는</span> 연직 위쪽을 향하고, 축 <span class="nw">$OX$는</span> 왼쪽을 향한다.</p>
