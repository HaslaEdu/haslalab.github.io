<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ISPhO papers in Korean, in the competition's own layout (as the experiments on the site): rendered by
     tools/ko/render.cjs with --tpl tools/ko/ispho_template.html --bare, then tools/ko/ispho_stamp.py puts the header
     on every page («이론», the ISPhO logo, «Q1-2», «한국어(번역본)»).  Body: h1 title, h2 parts, .task rows. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="KATEX/katex.min.css">
<style>
  @page{size:A4;margin:53mm 20mm 18mm}
  body{font:9.7pt/1.55 "Noto Sans KR",sans-serif;color:#111;margin:0}
  h1{font:700 15.9pt/1.3 "Noto Sans KR",sans-serif;color:#0000b3;margin:0 0 4mm}
  h2{font:700 11.5pt/1.35 "Noto Sans KR",sans-serif;color:#0000b3;margin:6mm 0 2.5mm;break-after:avoid}
  h3{font:700 10pt/1.35 "Noto Sans KR",sans-serif;margin:4mm 0 1.5mm;break-after:avoid}
  p{margin:0 0 2.6mm;text-align:justify;word-break:keep-all}
  ul,ol{margin:0 0 2.6mm;padding-left:6mm} li{margin:0 0 1mm}
  figure{margin:3mm auto;text-align:center;break-inside:avoid} figure img{max-width:100%;max-height:80mm} figcaption{font-size:8.8pt;margin-top:1.5mm}
  .katex{font-size:1.06em} .katex-display{margin:2.4mm 0}
  .task{display:grid;grid-template-columns:16mm 1fr 18mm;align-items:center;border:1px solid #888;margin:4mm 0;padding:2.6mm 0;break-inside:avoid}
  .task>b{text-align:center;font-weight:700}.task>div{padding:0 2mm}.task>i{font-style:normal;text-align:right;padding-right:3mm;white-space:nowrap}
  table{border-collapse:collapse;margin:2.5mm auto;font-size:9pt} td,th{border:1px solid #888;padding:1mm 2.4mm;text-align:center}
  .warn{border:1.5px solid #c33;background:#fdf1f0;padding:2.5mm 3.5mm;margin:3mm 0;break-inside:avoid}
  .note{font-size:8.8pt;color:#444}
</style>
</head>
<body>
<!-- BODY -->
</body>
</html>
