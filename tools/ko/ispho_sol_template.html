<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- Korean solutions of ISPhO theory problems, in the look of the earlier years' Korean solutions (2024/2025):
     running header «ISPhO … June, 2026» over a thin rule, the title «Solution» (Korean «풀이») in navy as the official
     ISPhO 2025 solutions have it, serif body, bold task codes «A1», boxed final answers, page number «n/N» bottom right.  The header and the page number are CSS page-margin
     boxes, so render with --bare (the renderer's own footer would replace them):
         node tools/ko/render.cjs S1.html out.pdf "" --tpl tools/ko/ispho_sol_template.html --bare
     The right-hand header text («June, 2026») is in the @page rule below; a body for another year sets its own date
     first thing, e.g. <style>@page{@top-right{content:"December, 2023"}}</style> (the later rule wins).
     Body: h1.title («Solution» / «풀이»), then per task <div class="task"><p><b>A1</b>. … solution …</p> … <div class="ans">$$…$$</div></div>
     — as 2024/2025: the code, then the solution (the question is not restated, no part headings); a task that is only
     its answer starts with <p class="code"><b>A1</b>.</p>.  Math: $…$, $$…$$ or \[…\]. -->
<link rel="stylesheet" href="KATEX/katex.min.css">
<style>
  /* whole TrueType files (Google's sliced web fonts end up as Type 3 fonts in Chromium's PDF, and the page-margin
     boxes — the running header — only get a font the document has loaded: see the hidden «ISPhO» in the body) */
  @font-face{font-family:"PT Serif";font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/ptserif/v19/EJRVQgYoZZY2vCFuvDFR.ttf) format("truetype")}
  @font-face{font-family:"PT Serif";font-style:normal;font-weight:700;src:url(https://fonts.gstatic.com/s/ptserif/v19/EJRSQgYoZZY2vCFuvAnt65qV.ttf) format("truetype")}
  @font-face{font-family:"PT Serif";font-style:italic;font-weight:400;src:url(https://fonts.gstatic.com/s/ptserif/v19/EJRTQgYoZZY2vCFuvAFTzro.ttf) format("truetype")}
  @font-face{font-family:"PT Serif";font-style:italic;font-weight:700;src:url(https://fonts.gstatic.com/s/ptserif/v19/EJRQQgYoZZY2vCFuvAFT9gaQVy4.ttf) format("truetype")}
  @font-face{font-family:"Noto Serif KR";font-weight:400;src:url(https://fonts.gstatic.com/s/notoserifkr/v32/3JnoSDn90Gmq2mr3blnHaTZXbOtLJDvui3JOncjmeM52.ttf) format("truetype")}
  @font-face{font-family:"Noto Serif KR";font-weight:700;src:url(https://fonts.gstatic.com/s/notoserifkr/v32/3JnoSDn90Gmq2mr3blnHaTZXbOtLJDvui3JOncgBf852.ttf) format("truetype")}
  /* as the official ISPhO 2025 solutions: «ISPhO» and the date in PT Serif italic over a thin black rule, 10 mm side
     margins, «Solution» in navy bold, underlined, the page «n/N» at the bottom right, 12 pt body */
  :root{--navy:#00007f}
  @page{size:A4;margin:14mm 10mm 15mm;
    @top-left{content:"ISPhO";font:italic 12pt "PT Serif",serif;color:#000;vertical-align:bottom;
      padding-bottom:1.2mm;border-bottom:.45pt solid #000;margin-bottom:3mm}
    @top-center{content:"";vertical-align:bottom;padding-bottom:1.2mm;border-bottom:.45pt solid #000;margin-bottom:3mm}
    @top-right{content:"June, 2026";font:italic 12pt "PT Serif",serif;color:#000;vertical-align:bottom;
      padding-bottom:1.2mm;border-bottom:.45pt solid #000;margin-bottom:3mm}
    @bottom-right{content:counter(page) "/" counter(pages);font:12pt "PT Serif",serif;color:#000;vertical-align:middle}}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font:12pt/1.38 "PT Serif","Noto Serif KR",serif;color:#000;margin:0;background:#fff}
  .fontload{position:absolute;left:-9999px;top:0;font:italic 12pt "PT Serif",serif}
  h1.title{font:700 20.7pt/1.2 "PT Serif","Noto Serif KR",serif;color:var(--navy);text-align:center;margin:0 0 6mm;
    text-decoration:underline;text-decoration-thickness:.8pt;text-underline-offset:2.5pt}
  h2{font:700 12pt/1.35 "PT Serif","Noto Serif KR",serif;margin:5mm 0 2mm;break-after:avoid}
  p{margin:0 0 2mm;text-align:justify;word-break:keep-all;orphans:2;widows:2}
  .task{margin:0 0 5mm}
  .task>p>b:first-child{font-weight:700}
  .task>p.code{margin:0;break-after:avoid}
  .katex{font-size:1.1em}
  .katex-display{margin:2.2mm 0;overflow:visible}
  .task>p{break-after:avoid;break-inside:avoid}  /* a lead-in line stays with the equation it introduces */
  .ans{display:table;margin:2.4mm auto 3mm;padding:.4mm 4mm;border:.6pt solid #000;break-inside:avoid}
  .ans .katex-display{margin:1.6mm 0}
  .ans:has(+ .note){break-after:avoid}
  figure{margin:3mm auto;text-align:center;break-inside:avoid} figure img{max-width:100%}
  figcaption{font-size:10.5pt;margin-top:1mm}
  table{border-collapse:collapse;margin:2.5mm auto;font-size:11pt;break-inside:avoid}
  td,th{border:.6pt solid #000;padding:.8mm 2.6mm;text-align:center}
  th{font-weight:700}
  .note{font-size:10.5pt;color:#333;border-left:1.5pt solid #bbb;padding-left:2.5mm;margin:1.5mm 0 2.5mm;break-inside:avoid}
  p .katex{white-space:nowrap}
</style>
</head>
<body>
<span class="fontload">ISPhO</span>
<!-- BODY -->
</body>
</html>
