<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- HaslaLab's Korean translations of solutions: one document per file, rendered to A4 PDF by tools/ko/render.cjs.
     Write the body in Korean, mathematics in TeX between $…$ (inline) or $$…$$ (display); figures are <img> of crops
     of the original, put next to this file. The header line names the competition and year (data-head). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="KATEX/katex.min.css">
<style>
  @page{size:A4;margin:18mm 17mm 20mm}
  body{font:10.6pt/1.62 "Noto Serif KR",serif;color:#111;margin:0}
  h1{font:700 15pt/1.3 "Noto Sans KR",sans-serif;margin:0 0 4mm;color:#1d3b6a}
  h2{font:700 12pt/1.35 "Noto Sans KR",sans-serif;margin:6mm 0 2mm;color:#1d3b6a}
  h3{font:700 10.8pt/1.35 "Noto Sans KR",sans-serif;margin:4mm 0 1.5mm}
  p{margin:0 0 2.4mm;text-align:justify;word-break:keep-all}
  .head{font:500 8.5pt "Noto Sans KR",sans-serif;color:#556;border-bottom:1.2px solid #1d3b6a;padding-bottom:1.5mm;margin-bottom:5mm;display:flex;justify-content:space-between}
  figure{margin:3mm auto;text-align:center;break-inside:avoid} figure img{max-width:100%;max-height:85mm} figcaption{font-size:9pt;color:#444}
  .katex-display{margin:2.2mm 0;overflow:hidden}
  .ans{border:1px solid #1d3b6a;border-radius:3px;padding:1.5mm 3mm;margin:2mm 0;break-inside:avoid}
  .pt{float:right;font:700 9pt "Noto Sans KR",sans-serif;color:#1d3b6a}
  table{border-collapse:collapse;margin:2mm auto;font-size:9.6pt} td,th{border:1px solid #777;padding:1mm 2.2mm}
  .note{font-size:9pt;color:#555}
</style>
</head>
<body>
<div class="head"><span id="h1"></span><span>HaslaLab 한국어 번역 · 해설</span></div>
<!-- BODY -->
</body>
</html>
