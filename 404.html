<script>
/* The problem sheets used to live at /pdf/<name>; they are now in GitHub Releases,
   served by the PDF Worker.  Links to the old address (bookmarks, search results,
   and the Windows builds already handed out) are sent on to the new one. */
(function(){
  var m = /^\/pdf\/([A-Za-z]+_[A-Za-z0-9._-]+\.pdf)$/.exec(location.pathname);
  if (m) location.replace("https://haslalab-pdf.mgsnew88.workers.dev/pdf/" + m[1]);
})();
</script>
