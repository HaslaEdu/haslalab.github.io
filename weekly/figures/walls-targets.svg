<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="320" viewBox="0 0 1050 320" role="img" aria-labelledby="title desc">
  <title id="title">연속 벽과 자유 표적의 충돌</title>
  <desc id="desc">왼쪽은 접선 방향으로 입사해 고정 반원 벽 안쪽을 따라 움직이는 퍽, 가운데는 반원 위의 작은 자유 표적 배열, 오른쪽은 접촉 법선과 입사속도가 이루는 예각 세타이다. 실제 축척과 무관하다.</desc>
