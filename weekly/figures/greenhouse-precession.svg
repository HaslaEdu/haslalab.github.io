<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" fill="currentColor" font-family="Georgia,'Times New Roman',serif" role="img" aria-labelledby="title desc"><title id="title">원판과 세차 원뿔</title><desc id="desc">왼쪽은 태양 방향과 원판 법선 사이 각 z, 오른쪽은 공통 축 N 주위에 반각 epsilon_p로 놓인 고정 태양 방향 S와 세차하는 법선 Z이다. 태양 방향은 공간에서 고정된다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M65 240H390" stroke-width="5"/><path d="M225 240V55" stroke-dasharray="5 5"/><path d="M270 60 225 240" marker-end="url(#arrow)"/><path d="M320 60 275 240M370 60 325 240" marker-end="url(#arrow)"/><path d="M225 120Q240 120 250 128"/><path d="M660 263 562 90M660 263 762 93" marker-end="url(#arrow)"/><path d="M660 263V45" stroke-dasharray="5 5"/><ellipse cx="660" cy="88" rx="103" ry="29" stroke-dasharray="5 5"/><path d="M660 190Q683 184 698 194"/><path d="M637 64Q681 54 710 70" marker-end="url(#arrow)"/></g><g font-size="23"><text x="210" y="43">Z</text><text x="246" y="116">z</text><text x="330" y="42">S</text><text x="143" y="280">black disk</text><text x="548" y="76">Z</text><text x="770" y="86">S</text><text x="651" y="32">N</text><text x="674" y="181">εₚ</text><text x="674" y="49">φ</text></g></svg>
