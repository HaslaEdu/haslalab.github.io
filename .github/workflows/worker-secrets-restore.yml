# One-off repair: the community Worker lost 28 secrets on 2026-11-06 when a deploy inherited them from an undeployed
# API-uploaded version that had only a few. This makes a new version identical to the deployed one, with every
# secret it lacks inherited (inside Cloudflare, values never leave it) from version 442, which still has all 32,
# deploys it, checks the Worker (run again: 2), and goes back to the previous version if anything is wrong.
name: Worker secrets restore

on:
  workflow_dispatch:
  push:
    branches: [claude/peaceful-johnson-0a32em]
    paths: [".github/workflows/worker-secrets-restore.yml"]

permissions:
  contents: read

concurrency:
  group: worker-secrets-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIPT: haslalab-community
          SOURCE_VERSION: aefe0010-fd19-4033-8909-58eca86502ae
        shell: python3 {0}
        run: |
          import json, os, sys, time, urllib.request, urllib.error
          H = {"Authorization": "Bearer " + os.environ["CF"], "Content-Type": "application/json"}
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, method=method, headers=H,
                                           data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.load(r)["result"]
              except urllib.error.HTTPError as e:
                  sys.exit(f"{method} {path.split('?')[0]} -> {e.code}: {e.read().decode()[:1500]}")
          SECRET = ("secret_text", "secret_key")
          acct = call("GET", "/accounts")[0]["id"]
          s, src = os.environ["SCRIPT"], os.environ["SOURCE_VERSION"]
          worker = call("GET", f"/accounts/{acct}/workers/workers/{s}")
          wid = worker["id"]
          deployed = call("GET", f"/accounts/{acct}/workers/scripts/{s}/deployments")["deployments"][0]["versions"]
          assert len(deployed) == 1 and deployed[0]["percentage"] == 100, deployed
          cur_id = deployed[0]["version_id"]
          cur = call("GET", f"/accounts/{acct}/workers/workers/{wid}/versions/{cur_id}?include=modules")
          old = call("GET", f"/accounts/{acct}/workers/workers/{wid}/versions/{src}")
          have = {b["name"] for b in cur["bindings"] if b["type"] in SECRET}
          want = {b["name"] for b in old["bindings"] if b["type"] in SECRET}
          missing = sorted(want - have)
          print("deployed version", cur_id, "has", len(have), "secrets; restoring", len(missing), "from", src)
          print("restoring:", ", ".join(missing))
          bindings = []
          for b in cur["bindings"]:
              bindings.append({"type": "inherit", "name": b["name"], "version_id": cur_id} if b["type"] in SECRET else b)
          bindings += [{"type": "inherit", "name": n, "version_id": src} for n in missing]
          body = {k: cur[k] for k in ("compatibility_date", "compatibility_flags", "main_module", "modules", "limits",
                                      "placement", "usage_model", "migrations", "assets") if cur.get(k) is not None}
          body["bindings"] = bindings
          body["annotations"] = {"workers/message": "Restore 28 secrets lost on 2026-11-06 (inherited from version 442)"}
          new = call("POST", f"/accounts/{acct}/workers/workers/{wid}/versions", body)
          check = call("GET", f"/accounts/{acct}/workers/workers/{wid}/versions/{new['id']}")
          got = {b["name"] for b in check["bindings"] if b["type"] in SECRET}
          other = lambda v: sorted((b["name"], b["type"]) for b in v["bindings"] if b["type"] not in SECRET)
          if got != want | have or other(check) != other(cur):
              sys.exit(f"new version {new['id']} is not as planned; not deploying. missing: {sorted((want | have) - got)}")
          print("new version", new["id"], "has", len(got), "secrets and the same", len(other(cur)), "other bindings")
          def deploy(vid, msg):
              call("POST", f"/accounts/{acct}/workers/scripts/{s}/deployments",
                   {"strategy": "percentage", "versions": [{"version_id": vid, "percentage": 100}],
                    "annotations": {"workers/message": msg}})
          deploy(new["id"], "Restore lost secrets")
          ok = False
          for i in range(12):
              time.sleep(10)
              try:
                  with urllib.request.urlopen(urllib.request.Request("https://haslalab-community.haslalab.workers.dev/api/health",
                                              headers={"User-Agent": "HaslaLab restore check (GitHub Actions)"}), timeout=30) as r:
                      h = json.load(r)
                  print("health:", h.get("ok"), "oauth:", h.get("oauth"))
                  if h.get("ok") and h.get("oauth"):
                      ok = True; break
              except Exception as e:
                  print("health check:", e)
          if not ok:
              deploy(cur_id, "Back to the previous version: restore check failed")
              sys.exit("the restored version did not answer as expected; went back to " + cur_id)
          print("restored and live:", new["id"])
