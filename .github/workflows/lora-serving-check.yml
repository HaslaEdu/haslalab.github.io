# Which LoRA layouts CoreWeave's serverless inference serves on Qwen3.6-35B-A3B (HaslaEdu/hasla-ai plan, step 1):
# three adapters that change nothing (attention only / all dense layers / dense + routed experts) are uploaded to
# W&B and called once each. No GPU; a few cents of inference. Run by hand only.
name: LoRA serving check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests wandb safetensors numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python tools/ai/coreweave_lora_check.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
