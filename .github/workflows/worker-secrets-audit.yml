# Read-only: lists the community Worker's recent versions and deployments with the NAMES and types of their bindings
# (Cloudflare never returns secret values), to see which version last had a given secret.
name: Worker secrets audit

on:
  workflow_dispatch:
  push:
    branches: [claude/peaceful-johnson-0a32em]
    paths: [".github/workflows/worker-secrets-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIPT: haslalab-community
        shell: python3 {0}
        run: |
          import json, os, urllib.request
          H = {"Authorization": "Bearer " + os.environ["CF"]}
          def get(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, headers=H)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          acct = get("/accounts")["result"][0]["id"]
          s = os.environ["SCRIPT"]
          base = f"/accounts/{acct}/workers/scripts/{s}"
          dep = get(base + "/deployments")["result"]["deployments"]
          print("== deployments (newest first)")
          for d in dep[:8]:
              print(d.get("created_on"), d.get("source"), [(v["version_id"], v["percentage"]) for v in d["versions"]])
          vers = get(base + "/versions?per_page=40")["result"]["items"]
          print("== versions (newest first): id, number, created, source, secret names")
          for v in vers[:40]:
              full = get(f"{base}/versions/{v['id']}")["result"]
              b = full.get("resources", {}).get("bindings", [])
              secrets = sorted(x["name"] for x in b if x.get("type") in ("secret_text", "secret_key"))
              m = v.get("metadata", {})
              print(v["id"], v.get("number"), m.get("created_on"), m.get("source"), "|", len(secrets), "secrets:", ",".join(secrets))
