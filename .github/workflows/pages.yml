# Publishes the site to GitHub Pages without tools/ (6.7 GB of PDF authoring inputs and evidence that no page loads),
# community/ (the Worker's source; only community/weekly/, whose rubrics the Worker reads back from the site, stays) and tests/;
# src/ stays: the problem cards link to the Python originals; the PDFs in pdfx/ are served by the PDF Worker from
# releases (tools/pdfx_release.py, pdfx-release.yml), so they are left out too (the zip/xlsx/json files there stay),
# so the published site stays well under GitHub Pages' 1 GB size limit and its deploys stop timing out.
# Takes effect once Settings → Pages → Build and deployment → Source is "GitHub Actions"; while the source is still
# "Deploy from a branch", this workflow sees that and does nothing.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half way: a Pages deployment cut off while queued can leave the next one waiting until it
# times out. Runs pushed meanwhile wait, and only the newest of them goes ahead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is the site published by this workflow?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          [ "$t" = workflow ] || echo "::notice::Pages still deploys from a branch ($t); switch Settings → Pages → Source to GitHub Actions to use this workflow."
      - uses: actions/checkout@v4
        if: steps.source.outputs.build_type == 'workflow'
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/
            !/node_modules/
            !/community/
            /community/weekly/
            !/tests/
            !/pdfx/*.pdf
            !/pdfx/*/*.pdf
      - name: Site without tools/
        if: steps.source.outputs.build_type == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --prune-empty-dirs --exclude .git --exclude .github --exclude tools/ --exclude node_modules/ --include /community/ --include '/community/weekly/***' --exclude '/community/*' --exclude /tests/ --exclude '/pdfx/**.pdf' ./ "$RUNNER_TEMP/site/"
          du -sh "$RUNNER_TEMP/site"; find "$RUNNER_TEMP/site" -type f | wc -l
      # One artifact name per attempt: a re-run keeps the earlier attempts' artifacts.
      - id: upload
        uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.build_type == 'workflow'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      # The deployment itself, with the same two Pages API calls actions/deploy-pages makes, but without its 10-minute
      # ceiling and without cancelling: on 2026-11-09 every deployment stalled after finished_file_sync for longer than
      # 10 minutes, and deploy-pages cancelled each one at its limit, so none could finish. This waits up to 45 minutes
      # and leaves an unfinished deployment to Pages.
      - id: deploy
        if: steps.source.outputs.build_type == 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          resp=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$ARTIFACT_ID" -f pages_build_version="$GITHUB_SHA" -f oidc_token="$oidc")
          id=$(jq -r .id <<<"$resp"); url=$(jq -r '.page_url // empty' <<<"$resp")
          [ -n "$url" ] && echo "page_url=$url" >> "$GITHUB_OUTPUT"
          echo "Pages deployment $id"
          last=""
          for i in $(seq 1 270); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status || echo "unknown")
            [ "$st" != "$last" ] && echo "$(date -u +%T) $st" && last="$st"
            case "$st" in
              succeed) echo "published"; exit 0;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost) echo "::error::Pages deployment ended as $st"; exit 1;;
            esac
            sleep 10
          done
          echo "::error::the Pages deployment is still '$st' after 45 minutes; it was not cancelled and may still finish"; exit 1
