# Publishes the site to GitHub Pages without tools/ (6.7 GB of PDF authoring inputs and evidence that no page loads),
# community/ (the Worker's source; only community/weekly/, whose rubrics the Worker reads back from the site, stays) and tests/;
# src/ stays: the problem cards link to the Python originals; the PDFs in pdfx/ are served by the PDF Worker from
# releases (tools/pdfx_release.py, pdfx-release.yml), so they are left out too (the zip/xlsx/json files there stay),
# so the published site stays well under GitHub Pages' 1 GB size limit and its deploys stop timing out.
# Takes effect once Settings → Pages → Build and deployment → Source is "GitHub Actions"; while the source is still
# "Deploy from a branch", this workflow sees that and does nothing.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half way: a Pages deployment cut off while queued can leave the next one waiting until it
# times out. Runs pushed meanwhile wait, and only the newest of them goes ahead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is the site published by this workflow?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          [ "$t" = workflow ] || echo "::notice::Pages still deploys from a branch ($t); switch Settings → Pages → Source to GitHub Actions to use this workflow."
      - uses: actions/checkout@v4
        if: steps.source.outputs.build_type == 'workflow'
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/
            !/node_modules/
            !/community/
            /community/weekly/
            !/tests/
            !/pdfx/*.pdf
            !/pdfx/*/*.pdf
      - name: Site without tools/
        if: steps.source.outputs.build_type == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude tools/ --exclude node_modules/ --include /community/ --include '/community/weekly/***' --exclude '/community/*' --exclude /tests/ --exclude '/pdfx/**.pdf' ./ "$RUNNER_TEMP/site/"
          du -sh "$RUNNER_TEMP/site"
      # One artifact name per attempt: a re-run keeps the earlier attempts' artifacts, and deploy-pages refuses to
      # pick between several artifacts with the same name ("Multiple artifacts named github-pages").
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.build_type == 'workflow'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      - id: deploy
        if: steps.source.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000            # the most deploy-pages allows; a stuck deploy is re-run by publish-retry.yml
