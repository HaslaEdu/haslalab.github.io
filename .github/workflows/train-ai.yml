name: Free synthetic W&B publication smoke
run-name: Synthetic publication smoke (CPU only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai/publication_smoke.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet wandb==0.31.0
      - run: python -B tools/ai/publication_smoke.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
          WANDB_CONSOLE: 'off'
          WANDB_DISABLE_CODE: 'true'
