name: Read three private W&B summaries
run-name: Read private summaries for 41964609630
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-summaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai/read_summaries.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pynacl
      - run: python -B tools/ai/read_summaries.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
          HASLA_EVAL_EXPORT_PUBLIC_KEY: y/S2LRIlE72emofc3CfmS5Ah+pnqlfaKQAunRP6EVHg=
