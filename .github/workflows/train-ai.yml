name: Read-only QwQ evaluation observation
run-name: Read-only QwQ evaluation target=${{ inputs.target_run_id }}
on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "Fixed existing paid evaluation run; never creates a GPU"
        type: string
        default: "41953551011"
permissions:
  contents: read
jobs:
  observe-qwq-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet requests
      - name: Read exact evaluation GPU and private scalar progress
        run: python -B tools/ai/private_qwq_gpu_observe.py --target-run-id "$TARGET_RUN_ID"
        env:
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
