name: Sealed read-only QwQ bootstrap diagnosis
run-name: Sealed read-only QwQ bootstrap target=41953551011
on:
  workflow_dispatch:
    inputs:
      public_key:
        type: string
        required: true
permissions:
  contents: read
jobs:
  read-private-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet requests pynacl
      - run: python -B tools/ai/private_qwq_gpu_debug_export.py tools/ai
        env:
          HASLA_DEBUG_EXPORT_PUBLIC_KEY: ${{ inputs.public_key }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
