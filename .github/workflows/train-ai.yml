name: Hasla private corpus pilot
run-name: Private textbook pilot (preflight=${{ inputs.preflight_only }})
on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Verify credentials/privacy/budget without starting a GPU"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hasla-private-book-training
  cancel-in-progress: false
jobs:
  private-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb
      - name: Validate and run one private pilot
        timeout-minutes: 65
        run: python tools/ai/private_corpus_run.py
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HASLA_CORPUS_MANIFEST: ${{ secrets.HASLA_CORPUS_MANIFEST }}
          HASLA_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          HASLA_DATA_00: ${{ secrets.HASLA_DATA_00 }}
          HASLA_DATA_01: ${{ secrets.HASLA_DATA_01 }}
          HASLA_DATA_02: ${{ secrets.HASLA_DATA_02 }}
          HASLA_DATA_03: ${{ secrets.HASLA_DATA_03 }}
          HASLA_DATA_04: ${{ secrets.HASLA_DATA_04 }}
          HASLA_DATA_05: ${{ secrets.HASLA_DATA_05 }}
          HASLA_DATA_06: ${{ secrets.HASLA_DATA_06 }}
          HASLA_DATA_07: ${{ secrets.HASLA_DATA_07 }}
          HASLA_DATA_08: ${{ secrets.HASLA_DATA_08 }}
          HASLA_DATA_09: ${{ secrets.HASLA_DATA_09 }}
          HASLA_DATA_10: ${{ secrets.HASLA_DATA_10 }}
          HASLA_DATA_11: ${{ secrets.HASLA_DATA_11 }}
          HASLA_DATA_12: ${{ secrets.HASLA_DATA_12 }}
          HASLA_DATA_13: ${{ secrets.HASLA_DATA_13 }}
          HASLA_DATA_14: ${{ secrets.HASLA_DATA_14 }}
          HASLA_DATA_15: ${{ secrets.HASLA_DATA_15 }}
          HASLA_VALIDATION_00: ${{ secrets.HASLA_VALIDATION_00 }}
          HASLA_VALIDATION_01: ${{ secrets.HASLA_VALIDATION_01 }}
          HASLA_VALIDATION_02: ${{ secrets.HASLA_VALIDATION_02 }}
          HASLA_VALIDATION_03: ${{ secrets.HASLA_VALIDATION_03 }}
          HASLA_VALIDATION_04: ${{ secrets.HASLA_VALIDATION_04 }}
          HASLA_VALIDATION_05: ${{ secrets.HASLA_VALIDATION_05 }}
          HASLA_VALIDATION_06: ${{ secrets.HASLA_VALIDATION_06 }}
          HASLA_VALIDATION_07: ${{ secrets.HASLA_VALIDATION_07 }}
          HASLA_VALIDATION_08: ${{ secrets.HASLA_VALIDATION_08 }}
          HASLA_VALIDATION_09: ${{ secrets.HASLA_VALIDATION_09 }}
          HASLA_VALIDATION_10: ${{ secrets.HASLA_VALIDATION_10 }}
          HASLA_VALIDATION_11: ${{ secrets.HASLA_VALIDATION_11 }}
          HASLA_VALIDATION_12: ${{ secrets.HASLA_VALIDATION_12 }}
          HASLA_VALIDATION_13: ${{ secrets.HASLA_VALIDATION_13 }}
          HASLA_VALIDATION_14: ${{ secrets.HASLA_VALIDATION_14 }}
          HASLA_VALIDATION_15: ${{ secrets.HASLA_VALIDATION_15 }}
      - name: Confirm no pilot GPU remains
        if: ${{ always() }}
        timeout-minutes: 5
        run: python tools/ai/private_corpus_run.py --cleanup
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
