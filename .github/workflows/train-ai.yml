name: Bounded Gemma functional mask repair
run-name: Hasla Gemma functional pilot (training-role=both, launch=${{ inputs.launch_id }}, preflight=${{ inputs.preflight_only }})
on:
  workflow_dispatch:
    inputs:
      launch_id:
        type: string
        required: true
      preflight_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  private-pilot:
    concurrency:
      group: hasla-private-book-training
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests wandb
      - name: Check frozen manifest and run one Gemma pilot
        timeout-minutes: 65
        run: |
          python -c "import os,hashlib; assert hashlib.sha256(os.environ['HASLA_DUAL_MANIFEST'].encode()).hexdigest()==os.environ['HASLA_EXPECTED_MANIFEST_SHA256']"
          python -B tools/ai/private_dedicated_run.py
        env:
          HASLA_EXPECTED_MANIFEST_SHA256: 86ee32ae2334c377d59aba7189531cc043f6aa3e9c63ce0e804b6fdb74c3c352
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HASLA_DUAL_MANIFEST: ${{ secrets.HASLA_DUAL_MANIFEST }}
          HASLA_CHAT_DATA_00: ${{ secrets.HASLA_CHAT_DATA_00 }}
          HASLA_CHAT_VALIDATION_00: ${{ secrets.HASLA_CHAT_VALIDATION_00 }}
          HASLA_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          HASLA_TRAINING_ROLE: both
      - name: Confirm this pilot GPU is removed
        if: ${{ always() }}
        timeout-minutes: 5
        run: python -B tools/ai/private_dedicated_run.py --cleanup
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HASLA_DUAL_MANIFEST: ${{ secrets.HASLA_DUAL_MANIFEST }}
          HASLA_TRAINING_ROLE: both
