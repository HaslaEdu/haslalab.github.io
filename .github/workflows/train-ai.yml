name: Read private RunPod funding and offers
run-name: RunPod read-only funding (${{ inputs.launch_id }})
on:
  workflow_dispatch:
    inputs:
      launch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  read-runpod-account:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai/read_runpod_account.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pynacl
      - run: python -B tools/ai/read_runpod_account.py
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HASLA_RUNPOD_READONLY_LAUNCH_ID: ${{ inputs.launch_id }}
          HASLA_EVAL_EXPORT_PUBLIC_KEY: y/S2LRIlE72emofc3CfmS5Ah+pnqlfaKQAunRP6EVHg=
