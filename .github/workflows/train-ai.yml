name: Discover private final QwQ result
run-name: Discover actual final artifact for 41964609630
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet wandb==0.31.0 pynacl
      - run: python -B tools/ai/discover_final.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
          WANDB_MODE: online
          WANDB_CONSOLE: 'off'
          HASLA_QWQ_FINAL_DISCOVERY_PROOF_GZ_B64: ${{ secrets.HASLA_QWQ_FINAL_DISCOVERY_PROOF_GZ_B64 }}
          HASLA_EVAL_EXPORT_PUBLIC_KEY: y/S2LRIlE72emofc3CfmS5Ah+pnqlfaKQAunRP6EVHg=
