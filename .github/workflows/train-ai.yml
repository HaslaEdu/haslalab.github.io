name: Hasla Gemma and QwQ private pilot
run-name: Hasla dual-model pilot (training-role=${{ inputs.training_role || 'both' }}, launch=${{ inputs.launch_id }}, preflight=${{ inputs.preflight_only }}, collection=${{ inputs.collection_only }}, status=${{ inputs.status_run_id }}, verify=${{ inputs.verify_run_id }}, stage=${{ inputs.stage_only }}, ocr=${{ inputs.ocr_probe_only }}, ocr-stage=${{ inputs.ocr_stage_only }}, bundle=${{ inputs.ocr_stage_bundle_id }}, gpu-ocr=${{ inputs.ocr_gpu_probe_only }}, source-inspect=${{ inputs.ocr_source_inspect_only }}, contest-fetch=${{ inputs.contest_fetch_only }}, private-ocr=${{ inputs.ocr_batch_only }}, contest-delta=${{ inputs.contest_delta_inspect_only }}, contest-prepare=${{ inputs.contest_delta_prepare_only }}, ocr-reconcile=${{ inputs.ocr_reconcile_run_id }}, cpu-compare=${{ inputs.compare_qwq_cpu || false }})
on:
  workflow_dispatch:
    inputs:
      launch_id:
        description: "Non-secret correlation ID for a frozen private launch"
        type: string
        default: ""
      training_role:
        description: "Dedicated training role; both preserves the legacy global queue"
        type: choice
        options:
          - both
          - chat
          - solver
        default: both
      preflight_only:
        description: "Verify the two private corpora and accounts without creating a GPU"
        type: boolean
        default: true
      compare_qwq_cpu:
        description: "CPU-only fixed QwQ base-versus-adapter comparison; no RunPod or training"
        type: boolean
        default: false
      collection_only:
        description: "Collect the next private community pattern batch on CPU only"
        type: boolean
        default: false
      status_run_id:
        description: "Read-only GPU status for an existing pilot run ID; never creates a GPU"
        type: string
        default: ""
      verify_run_id:
        description: "CPU-only verification of existing private adapter weights; never creates a GPU"
        type: string
        default: ""
      verify_roles:
        description: "Comma-separated roles to verify: chat, solver, or chat,solver"
        type: string
        default: "chat,solver"
      verify_continuation_inventory:
        description: "Explicit solver-only digest inventory for a later private LoRA continuation"
        type: boolean
        default: false
      stage_only:
        description: "Stage encrypted private corpus on CPU only; never creates a GPU"
        type: boolean
        default: false
      ocr_probe_only:
        description: "CPU-only OCR dependency and timing probe using one fixed public sample"
        type: boolean
        default: false
      ocr_stage_only:
        description: "CPU-only encrypted private original PDF staging; never creates a GPU"
        type: boolean
        default: false
      ocr_stage_bundle_id:
        description: "Exact 32-character bundle identity for private OCR source staging"
        type: string
        default: ""
      ocr_gpu_probe_only:
        description: "Bounded one-public-page GPU OCR calibration; preflight_only controls GPU creation"
        type: boolean
        default: false
      ocr_source_inspect_only:
        description: "CPU-only private OCR source manifest inspection; downloads no original PDFs"
        type: boolean
        default: false
      contest_fetch_only:
        description: "CPU-only acquisition from the frozen private contest archive plan"
        type: boolean
        default: false
      ocr_batch_only:
        description: "Bounded private 12-page OCR calibration; preflight_only controls GPU creation"
        type: boolean
        default: false
      contest_delta_inspect_only:
        description: "CPU-only private contest inventory inspection; native/PDF downloads zero"
        type: boolean
        default: false
      contest_delta_prepare_only:
        description: "CPU-only token-checked private native delta preparation and staging"
        type: boolean
        default: false
      ocr_reconcile_run_id:
        description: "GET-only exact private OCR attempt inventory observations; never releases a reservation"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  private-pilot:
    if: ${{ !inputs.compare_qwq_cpu && !inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: ${{ inputs.training_role == 'chat' && 'hasla-private-book-training-chat' || inputs.training_role == 'solver' && 'hasla-private-book-training-solver' || 'hasla-private-book-training' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb
      - name: Train selected Hasla model roles independently
        timeout-minutes: 260
        run: python tools/ai/private_dedicated_run.py
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HASLA_DUAL_MANIFEST: ${{ secrets.HASLA_DUAL_MANIFEST }}
          HASLA_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          HASLA_TRAINING_ROLE: ${{ inputs.training_role || 'both' }}
          HASLA_CHAT_DATA_00: ${{ secrets.HASLA_CHAT_DATA_00 }}
          HASLA_CHAT_DATA_01: ${{ secrets.HASLA_CHAT_DATA_01 }}
          HASLA_CHAT_DATA_02: ${{ secrets.HASLA_CHAT_DATA_02 }}
          HASLA_CHAT_DATA_03: ${{ secrets.HASLA_CHAT_DATA_03 }}
          HASLA_CHAT_DATA_04: ${{ secrets.HASLA_CHAT_DATA_04 }}
          HASLA_CHAT_DATA_05: ${{ secrets.HASLA_CHAT_DATA_05 }}
          HASLA_CHAT_DATA_06: ${{ secrets.HASLA_CHAT_DATA_06 }}
          HASLA_CHAT_DATA_07: ${{ secrets.HASLA_CHAT_DATA_07 }}
          HASLA_CHAT_DATA_08: ${{ secrets.HASLA_CHAT_DATA_08 }}
          HASLA_CHAT_DATA_09: ${{ secrets.HASLA_CHAT_DATA_09 }}
          HASLA_CHAT_DATA_10: ${{ secrets.HASLA_CHAT_DATA_10 }}
          HASLA_CHAT_DATA_11: ${{ secrets.HASLA_CHAT_DATA_11 }}
          HASLA_CHAT_VALIDATION_00: ${{ secrets.HASLA_CHAT_VALIDATION_00 }}
          HASLA_CHAT_VALIDATION_01: ${{ secrets.HASLA_CHAT_VALIDATION_01 }}
          HASLA_CHAT_VALIDATION_02: ${{ secrets.HASLA_CHAT_VALIDATION_02 }}
          HASLA_CHAT_VALIDATION_03: ${{ secrets.HASLA_CHAT_VALIDATION_03 }}
          HASLA_SOLVER_DATA_00: ${{ secrets.HASLA_SOLVER_DATA_00 }}
          HASLA_SOLVER_DATA_01: ${{ secrets.HASLA_SOLVER_DATA_01 }}
          HASLA_SOLVER_DATA_02: ${{ secrets.HASLA_SOLVER_DATA_02 }}
          HASLA_SOLVER_DATA_03: ${{ secrets.HASLA_SOLVER_DATA_03 }}
          HASLA_SOLVER_DATA_04: ${{ secrets.HASLA_SOLVER_DATA_04 }}
          HASLA_SOLVER_DATA_05: ${{ secrets.HASLA_SOLVER_DATA_05 }}
          HASLA_SOLVER_DATA_06: ${{ secrets.HASLA_SOLVER_DATA_06 }}
          HASLA_SOLVER_DATA_07: ${{ secrets.HASLA_SOLVER_DATA_07 }}
          HASLA_SOLVER_DATA_08: ${{ secrets.HASLA_SOLVER_DATA_08 }}
          HASLA_SOLVER_DATA_09: ${{ secrets.HASLA_SOLVER_DATA_09 }}
          HASLA_SOLVER_DATA_10: ${{ secrets.HASLA_SOLVER_DATA_10 }}
          HASLA_SOLVER_DATA_11: ${{ secrets.HASLA_SOLVER_DATA_11 }}
          HASLA_SOLVER_VALIDATION_00: ${{ secrets.HASLA_SOLVER_VALIDATION_00 }}
          HASLA_SOLVER_VALIDATION_01: ${{ secrets.HASLA_SOLVER_VALIDATION_01 }}
          HASLA_SOLVER_VALIDATION_02: ${{ secrets.HASLA_SOLVER_VALIDATION_02 }}
          HASLA_SOLVER_VALIDATION_03: ${{ secrets.HASLA_SOLVER_VALIDATION_03 }}
      - name: Confirm no pilot GPU remains
        if: ${{ always() }}
        timeout-minutes: 5
        run: python tools/ai/private_dedicated_run.py --cleanup
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HASLA_DUAL_MANIFEST: ${{ secrets.HASLA_DUAL_MANIFEST }}
          HASLA_TRAINING_ROLE: ${{ inputs.training_role || 'both' }}
  collect-patterns:
    if: ${{ !inputs.compare_qwq_cpu && inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-pattern-collection
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet wandb
      - name: Collect and preserve the next private pattern batch
        run: python tools/ai/private_pattern_collect.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_PATTERN_EXCLUDED_URLS: ${{ secrets.HASLA_PATTERN_EXCLUDED_URLS }}
          HASLA_PATTERN_CURSORS: ${{ secrets.HASLA_PATTERN_CURSORS }}
          HASLA_PATTERN_OBSERVED_LISTING_URLS: ${{ secrets.HASLA_PATTERN_OBSERVED_LISTING_URLS }}
  inspect-gpu:
    if: ${{ !inputs.compare_qwq_cpu && inputs.status_run_id != '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: Read exact pilot GPU status
        run: python tools/ai/private_pod_status.py --run-id "$HASLA_STATUS_RUN_ID" --system-logs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HASLA_STATUS_RUN_ID: ${{ inputs.status_run_id }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
  verify-adapters:
    if: ${{ !inputs.compare_qwq_cpu && inputs.verify_run_id != '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet wandb requests
      - name: Verify stored private adapter weights on CPU
        timeout-minutes: 25
        run: |
          if [ "$HASLA_VERIFY_CONTINUATION_INVENTORY" = "true" ]; then
            python tools/ai/private_verify_adapter.py --run-id "$HASLA_VERIFY_RUN_ID" --roles "$HASLA_VERIFY_ROLES" --continuation-inventory
          else
            python tools/ai/private_verify_adapter.py --run-id "$HASLA_VERIFY_RUN_ID" --roles "$HASLA_VERIFY_ROLES"
          fi
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
          HASLA_VERIFY_ROLES: ${{ inputs.verify_roles }}
          HASLA_VERIFY_CONTINUATION_INVENTORY: ${{ inputs.verify_continuation_inventory }}
  stage-corpus:
    if: ${{ !inputs.compare_qwq_cpu && inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-corpus-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb pynacl
      - name: Stage authenticated encrypted private corpus on CPU
        timeout-minutes: 30
        run: python tools/ai/private_stage_corpus.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_STAGE_INPUT: ${{ secrets.HASLA_STAGE_INPUT }}
  public-ocr-probe:
    if: ${{ !inputs.compare_qwq_cpu && inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU OCR dependencies
        timeout-minutes: 12
        run: |
          python -m pip install --quiet --no-cache-dir paddlepaddle==3.2.1 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --quiet --no-cache-dir 'paddleocr[doc-parser]==3.6.0' 'paddlex==3.6.0'
      - name: Measure one public sample with full OCR pipeline
        timeout-minutes: 27
        run: python tools/ai/private_ocr_probe.py --run --output "$RUNNER_TEMP/ocr-probe-summary.json"
  stage-ocr-sources:
    if: ${{ !inputs.compare_qwq_cpu && inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-ocr-source-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb pynacl
      - name: Stage authenticated encrypted original PDFs in private storage
        timeout-minutes: 40
        run: python tools/ai/private_stage_ocr_sources.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_OCR_STAGE_INPUT: ${{ secrets.HASLA_OCR_STAGE_INPUT }}
          HASLA_OCR_STAGE_BUNDLE_ID: ${{ inputs.ocr_stage_bundle_id }}
  public-gpu-ocr-probe:
    if: ${{ !inputs.compare_qwq_cpu && inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-public-gpu-ocr-probe
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb
      - name: Preflight or run bounded public GPU OCR calibration
        timeout-minutes: 35
        run: |
          if [ "$HASLA_OCR_GPU_PREFLIGHT" = "true" ]; then
            python tools/ai/private_ocr_gpu_run.py --preflight
          else
            python tools/ai/private_ocr_gpu_run.py
          fi
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_OCR_GPU_MANIFEST: ${{ secrets.HASLA_OCR_GPU_MANIFEST }}
          HASLA_OCR_GPU_PREFLIGHT: ${{ inputs.preflight_only }}
      - name: Confirm exact public OCR probe GPU deletion
        if: ${{ always() }}
        timeout-minutes: 5
        run: python tools/ai/private_ocr_gpu_run.py --cleanup
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
  inspect-ocr-sources:
    if: ${{ !inputs.compare_qwq_cpu && inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb
      - name: Inspect exact private original source manifest on CPU
        timeout-minutes: 5
        run: python tools/ai/private_inspect_ocr_source.py --inspect-source
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_OCR_SOURCE_ARTIFACT: ${{ secrets.HASLA_OCR_SOURCE_ARTIFACT }}
  fetch-contest-sources:
    if: ${{ !inputs.compare_qwq_cpu && inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-contest-source-fetch
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb PyMuPDF==1.28.2
      - name: Preflight or acquire frozen contest source plan on CPU
        timeout-minutes: 72
        run: |
          if [ "$HASLA_CONTEST_PREFLIGHT" = "true" ]; then
            python tools/ai/private_fetch_contest_sources.py --preflight --out "$RUNNER_TEMP/contest-fetch-$GITHUB_RUN_ID"
          else
            python tools/ai/private_fetch_contest_sources.py --out "$RUNNER_TEMP/contest-fetch-$GITHUB_RUN_ID"
          fi
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_CONTEST_PREFLIGHT: ${{ inputs.preflight_only }}
          HASLA_CONTEST_FETCH_MANIFEST: ${{ secrets.HASLA_CONTEST_FETCH_MANIFEST }}
          HASLA_CONTEST_FETCH_PLAN_00: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_00 }}
          HASLA_CONTEST_FETCH_PLAN_01: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_01 }}
          HASLA_CONTEST_FETCH_PLAN_02: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_02 }}
          HASLA_CONTEST_FETCH_PLAN_03: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_03 }}
          HASLA_CONTEST_FETCH_PLAN_04: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_04 }}
          HASLA_CONTEST_FETCH_PLAN_05: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_05 }}
          HASLA_CONTEST_FETCH_PLAN_06: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_06 }}
          HASLA_CONTEST_FETCH_PLAN_07: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_07 }}
          HASLA_CONTEST_FETCH_PLAN_08: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_08 }}
          HASLA_CONTEST_FETCH_PLAN_09: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_09 }}
          HASLA_CONTEST_FETCH_PLAN_10: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_10 }}
          HASLA_CONTEST_FETCH_PLAN_11: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_11 }}
          HASLA_CONTEST_FETCH_PLAN_12: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_12 }}
          HASLA_CONTEST_FETCH_PLAN_13: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_13 }}
          HASLA_CONTEST_FETCH_PLAN_14: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_14 }}
          HASLA_CONTEST_FETCH_PLAN_15: ${{ secrets.HASLA_CONTEST_FETCH_PLAN_15 }}
  private-gpu-ocr-calibration:
    if: ${{ !inputs.compare_qwq_cpu && inputs.ocr_batch_only && !inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-ocr-calibration
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb
      - name: Preflight or calibrate twelve private source pages on a bounded GPU
        timeout-minutes: 65
        run: |
          if [ "$HASLA_OCR_BATCH_PREFLIGHT" = "true" ]; then
            python tools/ai/private_ocr_batch_run.py --preflight
          else
            python tools/ai/private_ocr_batch_run.py
          fi
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HASLA_OCR_BATCH_MANIFEST: ${{ secrets.HASLA_OCR_BATCH_MANIFEST }}
          HASLA_OCR_BATCH_PREFLIGHT: ${{ inputs.preflight_only }}
      - name: Confirm exact private OCR calibration GPU deletion
        if: ${{ always() }}
        timeout-minutes: 5
        run: python tools/ai/private_ocr_batch_run.py --cleanup
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
  inspect-contest-delta:
    if: ${{ !inputs.compare_qwq_cpu && inputs.contest_delta_inspect_only && !inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb pynacl
      - name: Inspect immutable private contest receipts without PDF or native downloads
        timeout-minutes: 5
        run: |
          mkdir -p "$WANDB_DIR"
          export WANDB_ENTITY="${HASLA_CONTEST_DELTA_SOURCE%%/*}"
          python tools/ai/private_contest_delta.py --input-artifact "$HASLA_CONTEST_DELTA_SOURCE" --inspect
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: hasla-ai-private-training
          WANDB_DIR: ${{ runner.temp }}/private-contest-delta-inspection
          HASLA_CONTEST_DELTA_SOURCE: ${{ secrets.HASLA_CONTEST_DELTA_SOURCE }}
          HASLA_CONTEST_INVENTORY_EXPORT_PUBLIC_KEY: ${{ secrets.HASLA_CONTEST_INVENTORY_EXPORT_PUBLIC_KEY }}
          HASLA_CONTEST_INVENTORY_EXPORT_SHA256: ${{ secrets.HASLA_CONTEST_INVENTORY_EXPORT_SHA256 }}
  prepare-contest-delta:
    if: ${{ !inputs.compare_qwq_cpu && inputs.contest_delta_prepare_only && !inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-native-delta-preparation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests wandb tokenizers==0.23.3
      - name: Prepare and stage exact-token private native delta without a GPU
        timeout-minutes: 65
        run: python tools/ai/private_contest_delta_run.py
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.HASLA_CONTEST_DELTA_ENTITY }}
          WANDB_PROJECT: hasla-ai-private-training
          WANDB_DIR: ${{ runner.temp }}/private-native-delta
          HASLA_CONTEST_DELTA_MANIFEST: ${{ secrets.HASLA_CONTEST_DELTA_MANIFEST }}
  reconcile-private-ocr:
    if: ${{ !inputs.compare_qwq_cpu && inputs.ocr_reconcile_run_id != '' && !inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: Observe exact OCR attempt inventory twice using GET only
        timeout-minutes: 2
        run: python tools/ai/private_ocr_reconcile.py --run-id "$HASLA_OCR_RECONCILE_RUN_ID" --scope private-batch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HASLA_OCR_RECONCILE_RUN_ID: ${{ inputs.ocr_reconcile_run_id }}
  compare-qwq-cpu:
    if: ${{ inputs.compare_qwq_cpu && !inputs.collection_only && inputs.status_run_id == '' && inputs.verify_run_id == '' && !inputs.stage_only && !inputs.ocr_probe_only && !inputs.ocr_stage_only && !inputs.ocr_gpu_probe_only && !inputs.ocr_source_inspect_only && !inputs.contest_fetch_only && !inputs.ocr_batch_only && !inputs.contest_delta_inspect_only && !inputs.contest_delta_prepare_only && inputs.ocr_reconcile_run_id == '' }}
    concurrency:
      group: hasla-private-qwq-cpu-comparison
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify physical CPU memory and disk before dependency or model downloads
        run: |
          python tools/ai/private_qwq_cpu_prepare.py --preflight-only --output-dir "$RUNNER_TEMP/qwq-cpu-comparison"
          echo "HASLA_CPU_COMPARE_DEADLINE=$(( $(date +%s) + 10200 ))" >> "$GITHUB_ENV"
      - name: Install CPU-only conversion dependencies
        run: |
          python -m pip install --quiet --no-cache-dir torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir requests wandb safetensors jinja2 'numpy~=2.2.6' 'sentencepiece>=0.1.98,<0.3.0' transformers==4.57.6 'protobuf>=4.21.0,<5.0.0'
          python -c 'import torch; assert torch.version.cuda is None and not torch.cuda.is_available()'
      - name: Prepare exact public base and private adapter, then compare on CPU only
        timeout-minutes: 170
        run: |
          python tools/ai/private_qwq_cpu_prepare.py --output-dir "$RUNNER_TEMP/qwq-cpu-comparison"
          cpu_eval_remaining=$(( HASLA_CPU_COMPARE_DEADLINE - $(date +%s) - 300 ))
          if [ "$cpu_eval_remaining" -gt 9000 ]; then cpu_eval_remaining=9000; fi
          if [ "$cpu_eval_remaining" -lt 60 ]; then echo '{"status":"failed","failure_code":"cpu_setup_exhausted_wall_cap"}'; exit 1; fi
          python tools/ai/private_qwq_cpu_eval.py --prepared-dir "$RUNNER_TEMP/qwq-cpu-comparison" --output-dir "$RUNNER_TEMP/qwq-cpu-report" --max-wall-seconds "$cpu_eval_remaining"
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
          WANDB_DIR: ${{ runner.temp }}/qwq-cpu-private-wandb
          HASLA_CPU_COMPARE_LAUNCH_ID: ${{ inputs.launch_id }}
          CUDA_VISIBLE_DEVICES: ""
      - name: Store final-only private comparison evidence
        if: ${{ always() }}
        timeout-minutes: 5
        run: python tools/ai/private_qwq_cpu_prepare.py --upload-report "$RUNNER_TEMP/qwq-cpu-report"
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: mimgyuson-haslaedu
          WANDB_DIR: ${{ runner.temp }}/qwq-cpu-private-wandb
          HASLA_CPU_COMPARE_LAUNCH_ID: ${{ inputs.launch_id }}
