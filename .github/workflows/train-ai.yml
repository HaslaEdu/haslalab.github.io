name: QwQ dependency details (CPU only)
run-name: QwQ dependency details (${{ inputs.launch_id }})
on:
  workflow_dispatch:
    inputs:
      launch_id:
        description: Public 32-hex correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: hasla-qwq-free-cpu-dependency-details
  cancel-in-progress: false
jobs:
  probe-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ai/private_qwq_dependency_details.py
          persist-credentials: false
      - name: Free only preinstalled tools on this ephemeral runner
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -B1 /
      - name: Inspect the fixed image without GPU or credentials
        run: python3 -B tools/ai/private_qwq_dependency_details.py
        env:
          HASLA_DEPENDENCY_PROBE_LAUNCH_ID: ${{ inputs.launch_id }}
