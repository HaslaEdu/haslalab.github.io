# Deploys the community Worker (community/) and the PDF Worker (pdf-worker/) to Cloudflare whenever main changes them, instead of pasting
# src/index.js into the dashboard.  Needs one repository secret: CLOUDFLARE_API_TOKEN (a token made from
# Cloudflare's "Edit Cloudflare Workers" template).  Variables and secrets set in the dashboard stay
# (keep_vars in wrangler.toml). OMR initializes its additive table through the existing D1 binding.
name: Deploy community Worker

on:
  push:
    branches: [main]
    paths: ["community/src/**", "tools/model-test-catalogue.cjs", "tools/build-site-catalogue.cjs", "community/test-*.mjs", "community/provision-jobs.mjs", "community/provision-replication.mjs", "community/weekly/**", "community/migrations/**", "community/wrangler.toml", "community/wrangler.edge.toml", "community/package*.json", "monthly-problems.mjs", "wrangler.toml", "pdf-worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: community/package-lock.json
      - run: npm ci
      - run: node --check src/index.js
      - run: node ../tools/build-site-catalogue.cjs --check
      - run: node --test test-model-test-pricing.mjs test-model-test-provider.mjs test-model-test-route.mjs test-model-test-reference.mjs ../tests/test-model-test-ui.cjs ../tests/test-model-test-exam-ui.cjs ../tests/test-model-test-catalogue.cjs
      - run: node weekly/build-seed.mjs --check
      - run: node --test test-weekly-content.mjs test-greenhouse-content.mjs test-astronomy-revision.mjs test-monthly-period.mjs test-monthly-answers.mjs test-monthly-capture.mjs test-monthly-policy.mjs test-monthly-photos.mjs test-monthly-presentation.mjs test-monthly-rewards.mjs ../tests/test-weekly-rendering.cjs ../tests/test-monthly-*.cjs
      - run: node --test test-omr.mjs
      - run: node --test test-ocr-parity.mjs ../tests/test-scan-quality.mjs ../tests/test-contest-review.cjs
      - run: node --test test-latency-jobs.mjs test-contest.mjs test-public-profile.mjs
      - run: node --test test-lab-standings.mjs ../tests/test-result-comparison.cjs ../tests/test-*-results.cjs
      - run: node --test test-community-latency.mjs test-account-latency.mjs
      - run: node --test test-notice-pins.mjs test-public-data.mjs test-global-public-read.mjs ../tests/test-site-mailbox.cjs ../tests/test-admin-notice-ui.cjs ../tests/test-ranking-ui.cjs
      - run: node --check src/edge-gateway.js && node --test test-edge-gateway.mjs
      - run: node --test test-token-pricing.mjs test-review-mode.mjs ../tests/test-grading-prices-ui.cjs ../tests/test-lab-pair-catalogue.cjs ../tests/test-study-navigation.cjs ../tests/test-paper-languages.cjs ../tests/test-contest-grading-ui.cjs ../tests/test-lab-review-records.cjs ../tests/test-external-paper-viewer.cjs ../tests/test-eotvos-archive.cjs ../tests/test-physics-archive.cjs
      - run: node --test test-provision-jobs.mjs test-replication-provision.mjs
      # Existing token only; permission denial reports unverified and leaves the DB setting unchanged.
      - name: Verify D1 read replication
        id: replication
        run: node provision-replication.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node provision-jobs.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Reviewed weekly content is bundled above and publishes atomically through
      # the existing D1 binding on the first weekly/problem request. This avoids
      # requiring D1 management privileges from the deployment credential.
      # Public cache/preflight stay at the visitor's edge. Misses use the existing regional Worker.
      - run: npx wrangler deploy --config wrangler.edge.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # the PDF Worker (problem sheets and solutions from the releases), with the same wrangler
      - run: node --check ../pdf-worker/src/index.js && npx wrangler deploy --config ../pdf-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
