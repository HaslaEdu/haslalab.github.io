name: Problem library contracts

on:
  push:
    branches: [main]
    paths: ["problem-bank/**", "community/src/problem-bank*.js", "community/test-problem-bank*.mjs", "tools/problem-bank/**", "index.html", "tests/test-problem-library-learning.cjs", ".github/workflows/problem-library.yml"]
  pull_request:
    paths: ["problem-bank/**", "community/src/problem-bank*.js", "community/test-problem-bank*.mjs", "tools/problem-bank/**", "index.html", "tests/test-problem-library-learning.cjs", ".github/workflows/problem-library.yml"]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test community/test-problem-bank.mjs community/test-problem-bank-model.mjs problem-bank/test-worker.mjs tools/problem-bank/test-search-index.mjs tests/test-problem-library-learning.cjs tests/test-learn-coming-soon.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf pillow
      - run: python tools/problem-bank/test_question_figures.py
