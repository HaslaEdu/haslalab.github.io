# haslalab-ai-egress: the community Worker runs next to its database in Hong Kong (community/wrangler.toml), and
# Gemini, Anthropic and OpenAI refuse requests from there (FAILED_PRECONDITION / 403). Their requests leave through
# this Worker, placed in Seoul. No URL of its own: only the community Worker's service binding AI_EGRESS reaches it.
name = "haslalab-ai-egress"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[placement]
region = "aws:ap-northeast-2"
